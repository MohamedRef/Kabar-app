schema: kabar.lesson/v1
id: j2.u01.l03
language: jv
title: Omahe, bukune
can_do:
  ar_eg: تستعمل -e / -ne.
  ar: أن تستعمل اللاحقة -e / -ne.
  en: Use -e / -ne.
slides:
  - title: -e / -ne = -nya
    body:
      ar_eg: |
        إنت عارف -nya من الإندونيسي: rumahnya = بيته / البيت. الجاوي عنده **-e** و**-ne** بنفس الشغل:
        - الكلمة آخرها ساكن ⇐ -e: omah (بيت) → omahe، jeneng (اسم) → jenenge، warung → warunge.
        - آخرها حرف متحرك ⇐ -ne: buku → bukune، rega (سعر) → regane، klambi → klambine.
        بتتنطق e مقفولة زي «بيت»: «omahe». القاموس بيحط عليها علامة، وإحنا بنكتبها من غيرها: omahe، bukune.
      ar: |
        تعرف -nya الإندونيسية (rumahnya = بيته / البيت)، ونظيرها الجاوي **-e** و**-ne**:
        - بعد الساكن ⇐ -e: omah (بيت) → omahe، jeneng (اسم) → jenenge، warung → warunge.
        - بعد الصائت ⇐ -ne: buku → bukune، rega (سعر) → regane، klambi → klambine.
        وتُنطق e مغلقة، وتضع المعاجم عليها علامة، ونكتبها بدونها: omahe، bukune.
      en: |
        You know Indonesian -nya: rumahnya = his house / the house. Javanese **-e** / **-ne** does the same jobs:
        - Ends in a consonant ⇒ -e: omah (house) → omahe, jeneng (name) → jenenge, warung → warunge.
        - Ends in a vowel ⇒ -ne: buku → bukune, rega (price) → regane, klambi → klambine.
        It's a closed e: "omahe". Dictionaries add an accent; Kabar writes it plain: omahe, bukune.
    grammar: jv.possessive.e-ne
    examples:
      - text: Jenenge sapa?
        ar_eg: اسمه / اسمها إيه؟
        ar: ما اسمه / ما اسمها؟
        en: What's his / her name?
  - title: Bukune, regane
    body:
      ar_eg: |
        -e / -ne ليها تلات شغلانات، زي -nya بالظبط:
        1. «بتاعه / بتاعها»: Bukune ilang = كتابه ضاع.
        2. «الـ» للتعريف: Regane pira? = السعر بكام؟ Omahe adoh = البيت بعيد.
        3. «بتاع فلان»: omahe Pak Budi = بيت باك بودي (هنشوفها في الشريحة الجاية).
      ar: |
        للاحقة -e / -ne ثلاث وظائف كـ -nya:
        1. الملكية للغائب: Bukune ilang = ضاع كتابه.
        2. التعريف: Regane pira? = كم الثمن؟ Omahe adoh = البيت بعيد.
        3. الإضافة إلى اسم: omahe Pak Budi = بيت باك بودي (في الشريحة التالية).
      en: |
        -e / -ne has three jobs, just like -nya:
        1. his / her / its: Bukune ilang = His book is lost.
        2. "the": Regane pira? = How much is it (the price)? Omahe adoh = The house is far.
        3. "X's": omahe Pak Budi = Pak Budi's house (next slide).
    grammar: jv.possessive.e-ne
    examples:
      - text: Regane pira, Bu?
        ar_eg: بكام يا طنط؟
        ar: بكم ثمنه يا سيدتي؟
        en: How much is it, ma'am?
  - title: Warunge Pak Budi
    body:
      ar_eg: |
        «بيت باك بودي» = **omahe Pak Budi**: الحاجة الأول، وبعدين صاحبها. بالظبط زي الإضافة في العربي «بيت باك بودي»، وزي العامية الإندونيسية rumahnya Pak Budi.
        و-e هنا زي الضمير «ـه» في «بيته».
        - warunge Pak Budi = محل باك بودي
        - bukune Sari = كتاب ساري
        غلط تقول «Pak Budi omahe»: الترتيب بالعكس.
      ar: |
        «بيت باك بودي» = **omahe Pak Budi**: المملوك أولًا ثم المالك، كالإضافة العربية، وكالعامية الإندونيسية rumahnya Pak Budi.
        و-e هنا كضمير الغائب في «بيته».
        - warunge Pak Budi = مطعم باك بودي
        - bukune Sari = كتاب ساري
        ولا يقال «Pak Budi omahe».
      en: |
        "Pak Budi's house" = **omahe Pak Budi**: thing first, owner second — exactly like Arabic iḍāfa «بيت باك بودي», and casual Indonesian rumahnya Pak Budi.
        -e here is like the «ـه» in «بيته».
        - warunge Pak Budi = Pak Budi's warung
        - bukune Sari = Sari's book
        Never "Pak Budi omahe": the order is the other way round.
    grammar: jv.possessive.e-ne
    examples:
      - text: Warunge Pak Budi neng Madiun.
        ar_eg: محل باك بودي في ماديون.
        ar: مطعم باك بودي في ماديون.
        en: Pak Budi's warung is in Madiun.
      - text: Bukune Sari ilang.
        ar_eg: كتاب ساري ضاع.
        ar: ضاع كتاب ساري.
        en: Sari's book is lost.
  - title: -ku, -mu, -e · Duweke sapa?
    body:
      ar_eg: |
        للمتكلم والمخاطب، زي الإندونيسي:
        - omahku = بيتي · omahmu = بيتك · omahe = بيته / بيتها / البيت.
        - jenengku = اسمي · jenengmu = اسمك · jenenge = اسمه.
        وفي الكراما (J3) -e / -ne بتبقى -ipun / -nipun.
        عايز تسأل «بتاع مين؟» ⇐ **duweke sapa?** (Punya siapa?)
        - Iki duweke sapa? = ده بتاع مين؟
        - Duweke Dimas. = بتاع ديماس.
        duweke جاية من duwe (عنده / يملك) + -ke.
      ar: |
        وللمتكلم والمخاطب كما في الإندونيسية:
        - omahku = بيتي · omahmu = بيتك · omahe = بيته / بيتها / البيت.
        - jenengku = اسمي · jenengmu = اسمك · jenenge = اسمه.
        وفي الكراما (J3) تصير -e / -ne ‏-ipun / -nipun.
        وللسؤال «لمن هذا؟» ⇐ **duweke sapa?** (Punya siapa?)
        - Iki duweke sapa? = لمن هذا؟
        - Duweke Dimas. = لديماس.
        وduweke من duwe (يملك).
      en: |
        For "my" and "your", as in Indonesian:
        - omahku = my house · omahmu = your house · omahe = his / her house, the house.
        - jenengku = my name · jenengmu = your name · jenenge = his / her name.
        In krama (J3) -e / -ne becomes -ipun / -nipun.
        To ask "whose?" ⇒ **duweke sapa?** (Punya siapa?)
        - Iki duweke sapa? = Whose is this?
        - Duweke Dimas. = It's Dimas's.
        duweke comes from duwe (have, own).
    grammar: jv.possessive.e-ne
    examples:
      - text: Omahmu neng ngendi?
        ar_eg: بيتك فين؟
        ar: أين بيتك؟
        en: Where's your house?
      - text: Jenengku Mohamed.
        ar_eg: اسمي محمد.
        ar: اسمي محمد.
        en: My name is Mohamed.
      - text: Iki duweke sapa? — Duweke Dimas.
        ar_eg: ده بتاع مين؟ — بتاع ديماس.
        ar: لمن هذا؟ — لديماس.
        en: Whose is this? — It's Dimas's.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: omahe
        ar_eg: بيته / البيت (rumahnya)
        ar: بيته (rumahnya)
        en: his / the house (rumahnya)
      - text: duweke sapa?
        ar_eg: بتاع مين؟ (punya siapa?)
        ar: لمن هذا؟ (punya siapa?)
        en: whose is it? (punya siapa?)
      - text: ilang
        ar_eg: ضاع (hilang)
        ar: ضاع (hilang)
        en: lost (hilang)
      - text: adoh
        ar_eg: بعيد (jauh)
        ar: بعيد (jauh)
        en: far (jauh)
      - text: saiki
        ar_eg: دلوقتي (sekarang)
        ar: الآن (sekarang)
        en: now (sekarang)
      - text: buku
        ar_eg: كتاب
        ar: كتاب
        en: book
    words: [omahe, duweke, ilang, adoh, saiki, buku]
  - id: e02
    type: multiple_choice
    question: buku + -e / -ne
    question_meaning:
      ar_eg: أنهي شكل صح؟
      ar: أيّ صيغة صحيحة؟
      en: Which form is right?
    options: [bukunya, bukue, bukune]
    answer: 2
    explain:
      ar_eg: buku آخرها حرف متحرك (u)، فبتاخد -ne. وbukunya إندونيسي.
      ar: تنتهي buku بصائت فتأخذ -ne، أما bukunya فإندونيسية.
      en: buku ends in a vowel, so it takes -ne. bukunya is Indonesian.
    words: [bukune, buku]
  - id: e03
    type: listen
    text: Bukune Sari ilang.
    options: [Bukune Sari ilang., Omahe Sari adoh., Bukuku ilang.]
    answer: 0
    words: [bukune, ilang]
  - id: e04
    type: fill_blank
    sentence: ___ sapa?
    meaning:
      ar_eg: اسمه إيه؟
      ar: ما اسمه؟
      en: What's his name?
    answers: [Jenenge, jenenge]
    explain:
      ar_eg: jeneng آخرها ساكن (g)، فبتاخد -e.
      ar: تنتهي jeneng بساكن فتأخذ -e.
      en: jeneng ends in a consonant, so it takes -e.
    words: [jenenge]
  - id: e05
    type: build_sentence
    source:
      ar_eg: ده بتاع مين؟
      ar: لمن هذا؟
      en: Whose is this?
    answer: Iki duweke sapa?
    alternatives: ['Duweke sapa iki?']
    distractors: [kae, omahe]
    words: [duweke, sapa]
    explain:
      ar_eg: duweke sapa = بتاع مين. kae = ده اللي هناك، وomahe = بيته، ومش في المعنى.
      ar: duweke sapa = لمن هذا؛ أما kae فذاك، وomahe بيته، وليسا في المعنى.
      en: duweke sapa = whose. kae (that over there) and omahe (his house) aren't in the meaning.
  - id: e06
    type: speaking
    text: Saiki bukuku ilang! Iki duweke sapa?
    meaning:
      ar_eg: دلوقتي كتابي ضاع! ده بتاع مين؟
      ar: الآن ضاع كتابي! لمن هذا؟
      en: Now my book's gone! Whose is this?
    words: [saiki, buku, ilang, duweke]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «دلوقتي»؟
      ar: أيّ كلمة تعني «الآن»؟
      en: Which word means "now"?
    options: [saiki, adoh, ilang]
    answer: 0
    explain:
      ar_eg: saiki = sekarang. adoh = بعيد، ilang = ضاع.
      ar: saiki = sekarang، وadoh = بعيد، وilang = ضاع.
      en: saiki = sekarang; adoh = far, ilang = lost.
    words: [saiki, adoh, ilang]
dialogue:
  title: Bukune sapa?
  lines:
    - speaker: Bayu
      text: Mas Mohamed, iki bukune sapa?
      ar_eg: يا أستاذ محمد، الكتاب ده بتاع مين؟
      ar: يا أخي محمد، لمن هذا الكتاب؟
      en: Mohamed, whose book is this?
    - speaker: Mohamed
      text: Dudu bukuku, Dhik. Duweke sapa, ya?
      ar_eg: مش كتابي يا صغير. يا ترى بتاع مين؟
      ar: ليس كتابي يا صغيري. لمن يا ترى؟
      en: It's not my book, Dhik. Whose could it be?
    - speaker: Agus
      text: Lho, kuwi bukune Sari!
      ar_eg: ده كتاب ساري!
      ar: ذاك كتاب ساري!
      en: That's Sari's book!
    - speaker: Mohamed
      text: Bukune Sari? Buku apa?
      ar_eg: كتاب ساري؟ كتاب إيه؟
      ar: كتاب ساري؟ أيّ كتاب؟
      en: Sari's book? What book?
    - speaker: Agus
      text: Buku basa Arab to. Saiki Sari sinau neng Kairo.
      ar_eg: كتاب عربي. ساري بتدرس في القاهرة دلوقتي.
      ar: كتاب لغة عربية. ساري تدرس الآن في القاهرة.
      en: An Arabic book. Sari studies in Cairo now.
new_words:
  - word: -e / -ne
    pos: particle
    ar_eg: بتاعه / بتاعها / الـ (= -nya)
    ar: ـه / ـها / أل التعريف (= -nya)
    en: his / her / its, the (= -nya)
  - word: duweke
    pos: phrase
    ar_eg: 'بتاع (punya): duweke sapa? = بتاع مين؟'
    ar: 'ملك (punya): duweke sapa? = لمن؟'
    en: 'belonging to (punya): duweke sapa? = whose?'
  - word: ilang
    pos: verb
    ar_eg: ضاع (hilang)
    ar: ضاع (hilang)
    en: be lost (hilang)
  - word: buku
    pos: noun
    ar_eg: كتاب (زي الإندونيسي)
    ar: كتاب (كالإندونيسية)
    en: book (as in Indonesian)
review:
  status: draft
  verified: false
