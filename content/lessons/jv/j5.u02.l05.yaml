schema: kabar.lesson/v1
id: j5.u02.l05
language: jv
title: Pameran ing Lawang Sewu
can_do:
  ar_eg: تقرا خبر عن معرض وتعرف مين عمل إيه وإمتى.
  ar: أن تقرأ خبرًا عن معرض وتعرف من فعل ماذا ومتى.
  en: Read a news item about an exhibition and find who did what, and when.
slides:
  - title: Warta pameran
    body:
      ar_eg: |
        خبر قصير من جرنان سيمارانج، كله مبني للمجهول زي الأخبار الإندونيسي. اسأل كل جملة: إيه اللي حصل؟ ومين عمله (dening)؟
        كلمات جديدة: pameran = معرض (pameran)، dianakake = اتعمل / اتنظّم (diadakan، من ana + -ake)، dibukak = اتفتح (dibuka). وWalikota = عمدة المدينة (wali kota)، وdijupuk من jupuk = اتاخدت (diambil).
      ar: |
        خبر قصير من صحيفة سيمارانج، كله بالمبني للمجهول كالأخبار الإندونيسية. اسأل عن كل جملة: ماذا حدث؟ ومن فعله (dening)؟
        كلمات جديدة: pameran = معرض (pameran)، وdianakake = أُقيم (diadakan، من ana + -ake)، وdibukak = افتُتح (dibuka). وWalikota = عمدة المدينة (wali kota)، وdijupuk من jupuk = التُقطت (diambil).
      en: |
        A short item from a Semarang paper, all in the passive like Indonesian news. Ask of each sentence: what happened, and who did it (dening)?
        New words: pameran = exhibition (pameran), dianakake = was held (diadakan, from ana + -ake), dibukak = was opened (dibuka). Walikota = mayor (wali kota), and dijupuk, from jupuk, = was taken (diambil).
    grammar: jv.passive.written
    examples:
      - text: Pameran foto sepur lawas dianakake ing Lawang Sewu.
        ar_eg: اتعمل معرض صور للقطرات القديمة في لاوانج سيوو.
        ar: أُقيم معرض صور للقطارات القديمة في لاوانغ سيوو.
        en: An exhibition of photos of old trains is being held at Lawang Sewu.
      - text: Pameran kasebut dibukak dening Walikota Semarang wingi esuk.
        ar_eg: المعرض ده افتتحه عمدة سيمارانج امبارح الصبح.
        ar: افتتح عمدة سيمارانج المعرض المذكور صباح أمس.
        en: The exhibition was opened by the Mayor of Semarang yesterday morning.
      - text: Foto-foto kasebut dijupuk ing jaman Walanda.
        ar_eg: الصور دي اتصوّرت أيام الهولنديين.
        ar: التُقطت هذه الصور في العهد الهولندي.
        en: The photos were taken in the Dutch era.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: المعرض عن إيه؟
      ar: عمَّ هذا المعرض؟
      en: What is the exhibition about?
    options: [buku lawas, foto sepur lawas, panganan Semarang]
    answer: 1
    words: [pameran]
  - id: e02
    type: listen
    text: Pameran kasebut dibukak dening Walikota Semarang wingi esuk.
    question:
      ar_eg: مين اللي افتتح المعرض؟
      ar: من افتتح المعرض؟
      en: Who opened the exhibition?
    options: [warga, perusahaan sepur, Walikota Semarang]
    answer: 2
    meaning:
      ar_eg: المعرض ده افتتحه عمدة سيمارانج امبارح الصبح.
      ar: افتتح عمدة سيمارانج المعرض المذكور صباح أمس.
      en: The exhibition was opened by the Mayor of Semarang yesterday morning.
    explain:
      ar_eg: اللي بعد dening هو اللي عمل الفعل.
      ar: من يأتي بعد dening هو الفاعل.
      en: Whoever comes after dening did the action.
    words: [dibukak, dening]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الصور اتصوّرت إمتى؟
      ar: متى التُقطت الصور؟
      en: When were the photos taken?
    options: [ing jaman Walanda, wingi esuk, saiki]
    answer: 0
    explain:
      ar_eg: wingi esuk ده وقت افتتاح المعرض، مش وقت الصور.
      ar: wingi esuk وقت افتتاح المعرض، لا وقت التقاط الصور.
      en: wingi esuk is when the exhibition opened, not when the photos were taken.
    words: [dijupuk]
  - id: e04
    type: match_pairs
    pairs:
      - text: pameran
        ar_eg: معرض
        ar: معرض
        en: exhibition
      - text: dianakake
        ar_eg: اتعمل / اتنظّم
        ar: أُقيم
        en: was held
      - text: dibukak
        ar_eg: اتفتح
        ar: افتُتح
        en: was opened
      - text: dijupuk
        ar_eg: اتاخد
        ar: أُخذ / التُقط
        en: was taken
      - text: kasebut
        ar_eg: المذكور / ده
        ar: المذكور
        en: the said, that
    words: [pameran, dianakake, dibukak, kasebut]
  - id: e05
    type: fill_blank
    sentence: Pameran foto sepur lawas ___ ing Lawang Sewu.
    meaning:
      ar_eg: اتعمل معرض صور للقطرات القديمة في لاوانج سيوو.
      ar: أُقيم معرض صور للقطارات القديمة في لاوانغ سيوو.
      en: An exhibition of photos of old trains is being held at Lawang Sewu.
    options: [dijupuk, dianakake, didandani]
    answers: [dianakake]
    explain:
      ar_eg: المعرض «بيتعمل» = dianakake. الصور هي اللي dijupuk.
      ar: المعرض «يُقام» = dianakake، أما الصور فهي التي dijupuk.
      en: An exhibition is held = dianakake; it's the photos that were dijupuk.
    words: [dianakake, pameran]
  - id: e06
    type: dictation
    text: Pameran foto sepur lawas dianakake ing Lawang Sewu.
    meaning:
      ar_eg: اتعمل معرض صور للقطرات القديمة في لاوانج سيوو.
      ar: أُقيم معرض صور للقطارات القديمة في لاوانغ سيوو.
      en: An exhibition of photos of old trains is being held at Lawang Sewu.
    words: [pameran, dianakake]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (بأسلوب الأخبار) المعرض ده افتتحه عمدة سيمارانج.
      ar: (بأسلوب الأخبار) افتتح عمدة سيمارانج المعرض المذكور.
      en: (news style) The exhibition was opened by the Mayor of Semarang.
    answer: Pameran kasebut dibukak dening Walikota Semarang.
    distractors: [dianakake, saka]
    words: [pameran, dibukak, dening, kasebut]
  - id: e08
    type: translate
    direction: from_target
    source_text: Foto-foto kasebut dijupuk ing jaman Walanda.
    answers_meaning:
      ar_eg:
        - الصور دي اتصوّرت أيام الهولنديين.
        - الصور دي اتاخدت أيام الهولنديين.
        - الصور دي اتصوّرت في عهد الهولنديين.
        - الصور المذكورة اتصوّرت أيام هولندا.
        - الصور دي اتصورت في العصر الهولندي.
      ar:
        - التُقطت هذه الصور في العهد الهولندي.
        - التُقطت الصور المذكورة في العهد الهولندي.
        - التُقطت هذه الصور في زمن الهولنديين.
        - أُخذت هذه الصور في العهد الهولندي.
      en:
        - The photos were taken in the Dutch era.
        - These photos were taken in the Dutch era.
        - The said photos were taken in the Dutch era.
        - The photos were taken in the Dutch colonial era.
        - The photos were taken during the Dutch era.
        - Those photos were taken in Dutch times.
    words: [dijupuk, kasebut]
dialogue:
  title: Ayo menyang pameran
  lines:
    - speaker: Pak Harjo
      text: Mas, wis maca warta? Ana pameran foto ing Lawang Sewu.
      ar_eg: يا محمد، قريت الخبر؟ فيه معرض صور في لاوانج سيوو.
      ar: يا محمد، هل قرأت الخبر؟ هناك معرض صور في لاوانغ سيوو.
      en: Mohamed, have you read the news? There's a photo exhibition at Lawang Sewu.
    - speaker: Mohamed
      text: Sampun, Pak. Fotonipun saking jaman Walanda, nggih?
      ar_eg: قريته يا عمّو. الصور من أيام الهولنديين، صح؟
      ar: قرأته يا سيدي. الصور من العهد الهولندي، أليس كذلك؟
      en: I have, sir. The photos are from the Dutch era, aren't they?
    - speaker: Pak Harjo
      text: Iya. Foto-foto iku dijupuk ing jaman Walanda.
      ar_eg: آه. الصور دي اتصوّرت أيام الهولنديين.
      ar: نعم. التُقطت تلك الصور في العهد الهولندي.
      en: Yes. Those photos were taken in the Dutch era.
    - speaker: Mohamed
      text: Kula badhe ningali, Pak.
      ar_eg: أنا عايز أتفرّج عليها يا عمّو.
      ar: أريد أن أراها يا سيدي.
      en: I'd like to see them, sir.
    - speaker: Pak Harjo
      text: Ayo, saiki wae. Pamerane dibukak nganti sore.
      ar_eg: يلا، دلوقتي حالًا. المعرض مفتوح لحد العصر.
      ar: هيا، الآن. المعرض مفتوح حتى المساء.
      en: Come on, right now. The exhibition is open until the afternoon.
new_words:
  - word: pameran
    pos: noun
    ar_eg: معرض
    ar: معرض
    en: exhibition = pameran
  - word: dianakake
    pos: verb
    ar_eg: اتعمل / اتنظّم (من ana + -ake)
    ar: أُقيم (من ana + -ake)
    en: was held (from ana + -ake) = diadakan
  - word: dibukak
    pos: verb
    ar_eg: اتفتح (من bukak = يفتح)
    ar: افتُتح (من bukak = فتح)
    en: was opened (from bukak, open) = dibuka
