schema: kabar.lesson/v1
id: j5.u02.l05
language: jv
title: Kobong ing pasar
can_do:
  ar_eg: 'تفهم خبر قصير عن حريقة في سوق: إيه اللي حصل، مين اتجرح، والشهود قالوا إيه.'
  ar: 'أن تفهم خبرًا قصيرًا عن حريق في سوق: ما الذي حدث، ومن أصيب، وماذا قال الشهود.'
  en: 'Follow a short news item about a market fire: what happened, who was hurt and what witnesses said.'
slides:
  - title: Pawarta
    body:
      ar_eg: |
        pawarta = خبر (في الجرايد والراديو)، kedadeyan = حادثة، اللي حصل. kacilakan = حادثة (عربيات، طريق).
        mbledhos = انفجر، kobong = اتحرق، ولّع. tatu = جرح، أو اتجرح.
        ngungsi = يهرب لمكان أمان، ينزح. seksi = شاهد، اللي شاف الحادثة.
      ar: |
        pawarta = خبر (في الصحف والإذاعة)، kedadeyan = حادثة، واقعة. kacilakan = حادث (سير).
        mbledhos = انفجر، kobong = احترق. tatu = جرح، أو أصيب بجرح.
        ngungsi = نزح إلى مكان آمن. seksi = شاهد عيان.
      en: |
        pawarta = news (papers, radio); kedadeyan = incident, event. kacilakan = (traffic) accident.
        mbledhos = explode, kobong = burn, catch fire. tatu = wound, wounded.
        ngungsi = evacuate, take refuge. seksi = witness.
    examples:
      - text: Miturut pawarta, ana kedadeyan ing sawijining pasar.
        ar_eg: حسب الخبر، فيه حادثة حصلت في سوق.
        ar: بحسب الخبر، وقعت حادثة في أحد الأسواق.
        en: According to the news, there was an incident at a market.
      - text: Tabung gas mbledhos, banjur kios-kios kobong.
        ar_eg: أنبوبة غاز انفجرت، وبعدين الأكشاك ولّعت.
        ar: انفجرت أسطوانة غاز، ثم احترقت الأكشاك.
        en: A gas cylinder exploded, then the stalls caught fire.
      - text: Wong loro tatu, pedagang liyane padha ngungsi.
        ar_eg: اتنين اتجرحوا، وباقي التجار هربوا لمكان أمان.
        ar: أصيب شخصان، ونزح بقية التجار إلى مكان آمن.
        en: Two people were hurt; the other traders took refuge.
