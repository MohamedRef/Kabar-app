  - id: e03
    type: listen
    text: Tabung gas mbledhos, kiose kobong.
    question:
      ar_eg: إيه اللي حصل؟
      ar: ماذا حدث؟
      en: What happened?
    options: [أنبوبة غاز انفجرت والكشك ولّع, الكشك اتقفل بدري, التاجر باع الغاز كله]
    answer: 0
    meaning:
      ar_eg: أنبوبة غاز انفجرت والكشك ولّع.
      ar: انفجرت أسطوانة غاز فاحترق الكشك.
      en: A gas cylinder exploded and the stall caught fire.
    words: [mbledhos, kobong]
  - id: e04
    type: fill_blank
    sentence: 'Ana ___ ing dalan: montor tabrakan karo truk.'
    meaning:
      ar_eg: 'فيه ___ في الطريق: موتوسيكل خبط في تريلا.'
      ar: 'وقع ___ في الطريق: اصطدمت دراجة نارية بشاحنة.'
      en: 'There was an ___ on the road: a motorbike hit a truck.'
    options: [kacilakan, seksi, pawarta]
    answers: [kacilakan]
    words: [kacilakan, seksi, pawarta]
    explain:
      ar_eg: kacilakan = حادثة. seksi = شاهد وpawarta = خبر.
      ar: kacilakan تعني حادث. أما seksi فشاهد وpawarta خبر.
      en: kacilakan is an accident. seksi is a witness and pawarta is news.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي شاف الحادثة بعينه اسمه …
      ar: من رأى الحادثة بعينه يسمّى …
      en: Someone who saw the incident with their own eyes is a …
    options: [tatu, seksi, pawarta]
    answer: 1
    explain:
      ar_eg: seksi = شاهد. tatu = جرح، وpawarta = خبر.
      ar: seksi = شاهد عيان؛ tatu = جرح، وpawarta = خبر.
      en: seksi = witness; tatu = wound, pawarta = news.
    words: [tatu, seksi, pawarta]
  - id: e06
    type: fill_blank
    sentence: Warga ___ menyang balai desa amarga banjir.
    meaning:
      ar_eg: الأهالي ___ لدار القرية عشان الفيضان.
      ar: ___ السكان إلى دار القرية بسبب الفيضان.
      en: Residents ___ to the village hall because of the flood.
    options: [ngungsi, mbledhos, kobong]
    answers: [ngungsi]
    words: [ngungsi, mbledhos, kobong]
    explain:
      ar_eg: ngungsi = هرب لمكان أمان. mbledhos = انفجر وkobong = ولّع.
      ar: ngungsi تعني نزح إلى مكان آمن. أما mbledhos فانفجر وkobong احترق.
      en: ngungsi means to evacuate. mbledhos is "exploded" and kobong is "burned".
  - id: e07
    type: multiple_choice
    question: Sikile ___, banjur digawa menyang rumah sakit.
    options: [ngungsi, tatu, kedadeyan]
    answer: 1
    explain:
      ar_eg: 'اللي رجله اتجرحت بيروح المستشفى: tatu = اتجرح.'
      ar: 'من جُرحت ساقه يُنقل إلى المستشفى: tatu = مجروح.'
      en: 'Someone whose leg is hurt goes to hospital: tatu = wounded.'
    words: [ngungsi, tatu, kedadeyan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الخبر ده عن حادثة في السوق.
      ar: هذا الخبر عن حادثة في السوق.
      en: This news is about an incident at the market.
    answer: Pawarta iki nyritakake kedadeyan ing pasar.
    distractors: [seksi, tatu]
    words: [pawarta, kedadeyan]
    explain:
      ar_eg: nyritakake = بيحكي عن، وkedadeyan = حادثة. seksi = شاهد وtatu = جرح، ومش في المعنى.
      ar: nyritakake يحكي عن وkedadeyan حادثة. أما seksi (شاهد) وtatu (جرح) فليستا في المعنى.
      en: nyritakake is "tells about" and kedadeyan is "incident". seksi (witness) and tatu (wound) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Seksi ndeleng kacilakan iku.
    answers_meaning:
      ar_eg: [الشاهد شاف الحادثة دي, الشاهد شاف الحادثة]
      ar: [رأى الشاهد ذلك الحادث, شاهد الشاهد الحادث]
      en: [The witness saw the accident, A witness saw that accident]
    words: [seksi, kacilakan]
  - id: e10
    type: speaking
    text: Omahe kobong, nanging ora ana sing tatu.
    meaning:
      ar_eg: البيت ولّع، بس محدش اتجرح.
      ar: احترق البيت، لكن لم يُصب أحد.
      en: The house burned, but nobody was hurt.
    words: [kobong, tatu]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, wis krungu pawarta esuk iki durung?
      ar_eg: يا محمد، سمعت خبر النهارده الصبح؟
      ar: يا محمد، هل سمعت خبر هذا الصباح؟
      en: Mohamed, have you heard this morning's news?
    - speaker: Mohamed
      text: Durung. Ana kedadeyan apa ta?
      ar_eg: لأ لسه. حصل إيه؟
      ar: لا بعد. ماذا حدث؟
      en: Not yet. What happened?
    - speaker: Mbak Ayu
      text: Ana tabung gas mbledhos ing pasar, kios telu kobong.
      ar_eg: أنبوبة غاز انفجرت في السوق، وتلات أكشاك ولّعت.
      ar: انفجرت أسطوانة غاز في السوق واحترقت ثلاثة أكشاك.
      en: A gas cylinder exploded at the market and three stalls burned.
    - speaker: Mohamed
      text: Waduh! Ana sing tatu ora?
      ar_eg: يا ساتر! فيه حد اتجرح؟
      ar: يا إلهي! هل أصيب أحد؟
      en: Oh no! Was anyone hurt?
    - speaker: Mbak Ayu
      text: Wong loro tatu sithik. Pedagang sing ora tatu padha ngungsi dhisik.
      ar_eg: اتنين اتجرحوا جرح بسيط. وباقي التجار هربوا لمكان أمان الأول.
      ar: أصيب شخصان إصابة طفيفة، ونزح بقية التجار أولًا.
      en: Two people have minor injuries. The other traders got out first.
    - speaker: Mohamed
      text: Untung ana seksi sing enggal nelpon pemadam, ya.
      ar_eg: الحمد لله كان فيه شاهد كلّم المطافي على طول.
      ar: من حسن الحظ أن شاهدًا اتصل بالإطفاء فورًا.
      en: Luckily a witness called the fire brigade right away.
