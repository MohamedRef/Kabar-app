  - id: e03
    type: listen
    text: Miturut paribasan iki, wong kudu guyub.
    question:
      ar_eg: المثل بيقول إيه؟
      ar: ماذا يقول المثل؟
      en: What does the proverb say?
    options: [الناس لازم يكونوا متماسكين, الناس لازم يشتغلوا بسرعة, الناس لازم يسافروا]
    answer: 0
    meaning:
      ar_eg: بحسب المثل ده، الناس لازم يبقوا متماسكين.
      ar: بحسب هذا المثل، على الناس أن يتآلفوا.
      en: According to this proverb, people should stick together.
    words: [paribasan, guyub]
  - id: e04
    type: fill_blank
    sentence: Batik lan gamelan iku ___ Jawa.
    meaning:
      ar_eg: الباتيك والجاميلان ___ جاوية.
      ar: الباتيك والغاميلان ___ جاوية.
      en: Batik and gamelan are Javanese ___.
    options: [kabudayan, srawung, wewarah]
    answers: [kabudayan]
    words: [kabudayan, srawung, wewarah]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «يختلط بالناس ويتعاشر معاهم»؟
      ar: أي كلمة تعني «يخالط الناس»؟
      en: Which word means 'to mix and socialise with people'?
    options: [adiluhung, srawung, tradhisi]
    answer: 1
    explain:
      ar_eg: srawung = يختلط بالناس.
      ar: srawung = يخالط الناس.
      en: srawung = socialise.
    words: [adiluhung, srawung, tradhisi]
  - id: e06
    type: fill_blank
    sentence: Saben taun ana ___ Sekaten ing Yogya.
    meaning:
      ar_eg: كل سنة فيه ___ سيكاتن في يوجيا.
      ar: كل عام يُقام ___ سيكاتن في يوغيا.
      en: Every year there's the Sekaten ___ in Yogya.
    options: [tradhisi, guyub, unen-unen]
    answers: [tradhisi]
    words: [tradhisi, guyub, unen-unen]
  - id: e07
    type: multiple_choice
    question: '''Ajining dhiri saka lathi'' iku ___.'
    options: [srawung, kabudayan, unen-unen]
    answer: 2
    explain:
      ar_eg: «قيمة الإنسان من لسانه» قول مأثور.
      ar: «قيمة المرء في لسانه» قول مأثور.
      en: '''Your worth comes from your tongue'' is a saying.'
    words: [srawung, kabudayan, unen-unen]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المثل ده فيه عبرة حلوة.
      ar: في هذا المثل عبرة طيبة.
      en: This proverb has a good lesson.
    answer: Paribasan iki ana wewarahe sing apik.
    distractors: [guyub, tradhisi]
    words: [paribasan, wewarah]
  - id: e09
    type: translate
    direction: from_target
    source_text: Wayang iku kabudayan adiluhung.
    answers_meaning:
      ar_eg: [الوايانج ثقافة راقية, الوايانج فن عالي القيمة]
      ar: [الوايانغ ثقافة رفيعة, الوايانغ ثقافة سامية]
      en: [Wayang is a refined culture, Wayang is a sublime part of culture]
    words: [kabudayan, adiluhung]
  - id: e10
    type: speaking
    text: Aku seneng srawung karo wong-wong sing guyub.
    meaning:
      ar_eg: بحب أختلط بالناس المتماسكين.
      ar: أحبّ مخالطة الناس المتآلفين.
      en: I love mixing with close-knit people.
    words: [srawung, guyub]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, kowe ngerti paribasan 'alon-alon waton kelakon'?
      ar_eg: يا محمد، تعرف المثل «بالراحة بس المهم تخلص»؟
      ar: يا محمد، أتعرف المثل «ببطء ما دام يتمّ»؟
      en: Mohamed, do you know the proverb 'alon-alon waton kelakon'?
    - speaker: Mohamed
      text: Durung. Apa wewarahe?
      ar_eg: لأ. إيه العبرة بتاعته؟
      ar: لا. ما عبرته؟
      en: No. What's the lesson?
    - speaker: Mas Dimas
      text: Ora usah kesusu, sing penting rampung.
      ar_eg: ماتستعجلش، المهم تخلص.
      ar: لا داعي للعجلة، المهم أن ينتهي الأمر.
      en: No need to rush; what matters is finishing.
    - speaker: Mohamed
      text: Lho, ing Mesir uga ana unen-unen kaya ngono!
      ar_eg: في مصر كمان فيه قول زي ده!
      ar: في مصر أيضًا قول مثل هذا!
      en: Egypt has a saying like that too!
    - speaker: Mas Dimas
      text: Wong Jawa seneng srawung lan guyub. Iku tradhisi.
      ar_eg: الجاوايين بيحبوا يختلطوا ويبقوا متماسكين. دي عادة عندنا.
      ar: يحب الجاويون المخالطة والتآلف. هذا تقليد.
      en: Javanese people love socialising and sticking together. It's tradition.
    - speaker: Mohamed
      text: Kabudayan sing adiluhung.
      ar_eg: ثقافة راقية.
      ar: ثقافة رفيعة.
      en: A refined culture.
