schema: kabar.lesson/v1
id: j6.u03.l05
language: jv
title: Paribasan lan unen-unen
can_do:
  ar_eg: تشرح مثل جاوي ومعناه، وتتكلم عن الثقافة والتقاليد والناس المتماسكة.
  ar: أن تشرح مثلًا جاويًا ومغزاه، وتتحدث عن الثقافة والتقاليد والمجتمع المتماسك.
  en: Explain a Javanese proverb and its lesson, and talk about culture, tradition and close-knit communities.
slides:
  - title: Alon-alon waton kelakon
    body:
      ar_eg: |
        paribasan = مثل، unen-unen = قول مأثور، wewarah = العبرة أو الدرس.
        «Alon-alon waton kelakon» = بالراحة بس المهم تخلص، زي «في التأني السلامة».
        kabudayan = ثقافة، tradhisi = تقليد، adiluhung = راقي وعالي القيمة.
        guyub = متماسكين ومتحابين، srawung = يختلط بالناس ويتعاشر معاهم.
      ar: |
        paribasan = مَثَل، unen-unen = قول مأثور، wewarah = العبرة.
        «Alon-alon waton kelakon» = ببطء ما دام الأمر يتمّ، كقولنا «في التأني السلامة».
        kabudayan = ثقافة، tradhisi = تقليد، adiluhung = رفيع القيمة.
        guyub = متماسك متآلف، srawung = يخالط الناس.
      en: |
        paribasan = proverb, unen-unen = saying, wewarah = moral lesson.
        "Alon-alon waton kelakon" = slowly, as long as it gets done: "haste makes waste".
        kabudayan = culture, tradhisi = tradition, adiluhung = refined, of high value.
        guyub = close-knit, harmonious; srawung = socialise, mix with people.
    examples:
      - text: '''Alon-alon waton kelakon'' iku paribasan Jawa.'
        ar_eg: «بالراحة بس المهم تخلص» مثل جاوي.
        ar: «ببطء ما دام يتمّ» مثل جاوي.
        en: '''Alon-alon waton kelakon'' is a Javanese proverb.'
      - text: Wong desa guyub lan seneng srawung.
        ar_eg: أهل القرية متماسكين وبيحبوا يختلطوا بالناس.
        ar: أهل القرية متآلفون يحبّون مخالطة الناس.
        en: Village people are close-knit and love to socialise.
      - text: Wayang iku kabudayan adiluhung.
        ar_eg: الوايانج ثقافة راقية.
        ar: الوايانغ ثقافة رفيعة.
        en: Wayang is a refined culture.
