schema: kabar.lesson/v1
id: j1.u03.l02
language: jv
title: arp, ng, sik, gk
can_do:
  ar_eg: ترجّع كلام الشات لكتابته الأصلية.
  ar: أن تردّ إملاء الدردشة إلى صورته القياسية.
  en: Normalise chat spelling.
slides:
  - title: Kaya Franco
    body:
      ar_eg: |
        الشات الجاوي شبه «الفرانكو» عندنا: الناس بتكتب زي ما بتنطق، وبتختصر كل حاجة.
        الحيلة الأولى: **الحروف المتحركة بتقع**.
        - arp = arep (هـ / ناوي)
        - ws = wis (خلاص)
        - gk / ga = ora (لأ؛ وفي الكلام ra)
        وده نفس اللي بيحصل في الإندونيسي: blm = belum، jg = juga، udh = udah / sudah.
      ar: |
        تشبه جاوية الدردشة «الفرانكو آراب»: كتابة بحسب النطق مع اختصار شديد.
        القاعدة الأولى: **حذف الصوائت**:
        - arp = arep (سوف / ينوي)
        - ws = wis (قد / انتهى)
        - gk / ga = ora (لا؛ وفي الكلام ra)
        وهو ما يحدث في الإندونيسية أيضًا: blm = belum، jg = juga، udh = udah / sudah.
      en: |
        Chat Javanese is a lot like Franco-Arabic: people type what they hear and shorten everything.
        Trick one: **vowels drop**.
        - arp = arep (going to)
        - ws = wis (already)
        - gk / ga = ora (no / not; spoken ra)
        Indonesian chats do the same: blm = belum, jg = juga, udh = udah / sudah.
    grammar: jv.chat.normalize
    examples:
      - text: arp turu
        ar_eg: arep turu = هنام (شات)
        ar: arep turu = سأنام (دردشة)
        en: arep turu = going to sleep (chat)
  - title: opo → apa
    body:
      ar_eg: |
        الحيلة التانية: الـ a في آخر الكلمة بتتنطق o، فبتتكتب o في الشات. رجّعها a:
        - opo = apa، sopo = sapa، piro = pira، moco = maca، boso Jowo = basa Jawa
        - ojo = aja (ماتعملش)
        بس خلي بالك: فيه كلمات أصلها o فعلًا، زي loro (اتنين) وkono (هناك). ماتقلبش كل o لـ a!
      ar: |
        القاعدة الثانية: a الأخيرة تُنطق o فتُكتب o في الدردشة، فرُدّها a:
        - opo = apa، sopo = sapa، piro = pira، moco = maca، boso Jowo = basa Jawa
        - ojo = aja (لا الناهية)
        وانتبه إلى كلمات أصلها o مثل loro (اثنان) وkono (هناك)، فلا تقلب كل o.
      en: |
        Trick two: final a is said o, so chats type o. Turn it back into a:
        - opo = apa, sopo = sapa, piro = pira, moco = maca, boso Jowo = basa Jawa
        - ojo = aja (don't)
        Careful: some words really have o, like loro (two) and kono (there). Don't flip every o!
    grammar: jv.chat.normalize
    examples:
      - text: piro? → pira?
        ar_eg: بكام؟
        ar: بكم؟
        en: how much?
  - title: ng, ra, sik, rapopo
    body:
      ar_eg: |
        الحيلة التالتة: **اختصار كلمة كاملة**:
        - ng = neng / neng (لـ / في) — السياق بيحدد.
        - ra = ora (لأ / مش)
        - sik (أو sik) = dhisik (الأول / استنى). «Sik!» = استنى!
        - rapopo = ora apa-apa (مفيش مشكلة / عادي)
        خلي بالك: yg في الإندونيسي = yang، لكن ng في الشات الجاوي = neng / neng.
      ar: |
        القاعدة الثالثة: **اختصار كلمة كاملة**:
        - ng = neng / neng (إلى / في)، والسياق يحدد.
        - ra = ora (لا)
        - sik (أو sik) = dhisik (أولًا / انتظر)، و«Sik!» = انتظر!
        - rapopo = ora apa-apa (لا بأس)
        وانتبه: yg في الإندونيسية = yang، أما ng في الدردشة الجاوية فـ neng / neng.
      en: |
        Trick three: **whole-word shortcuts**:
        - ng = neng / neng (to / at) — context decides.
        - ra = ora (no / not)
        - sik (or sik) = dhisik (first / hold on). "Sik!" = Hold on!
        - rapopo = ora apa-apa (no problem / it's fine)
        Careful: Indonesian yg = yang, but Javanese chat ng = neng / neng.
    grammar: jv.chat.normalize
    examples:
      - text: ng prabowo? → Neng Prabowo?
        ar_eg: لبرابوو؟ / عند برابوو؟
        ar: إلى برابوو؟
        en: To Prabowo?
      - text: rapopo → ora apa-apa
        ar_eg: عادي، مفيش مشكلة
        ar: لا بأس
        en: it's fine, no problem
  - title: arp dicul piro
    body:
      ar_eg: |
        الحيلة الرابعة: dh وth بيتكتبوا d وt: dewe = dhewe، deweke = dheweke.
        والخامسة: الكلمة الطويلة بتتقص: dicul = diculke (يتساب / يتباع).
        جرّب على رسالة حقيقية:
        «arp dicul piro» → arep diculke pira? → «ناوي تبيعه بكام؟»
        وكمان «aku gk ngerti opo2» → aku ora ngerti apa-apa → «مش فاهم أي حاجة». (ngerti = mengerti، و2 = تكرار الكلمة زي الإندونيسي)
      ar: |
        الرابعة: dh وth تُكتبان d وt: dewe = dhewe، deweke = dheweke.
        والخامسة: بتر الكلمة الطويلة: dicul = diculke (يُطلق / يُباع).
        وطبّق ذلك على رسالة حقيقية:
        «arp dicul piro» → arep diculke pira? → «بكم ستبيعه؟»
        و«aku gk ngerti opo2» → aku ora ngerti apa-apa → «لا أفهم شيئًا» (ngerti = mengerti، و2 لتكرار الكلمة كالإندونيسية).
      en: |
        Trick four: dh and th are typed d and t: dewe = dhewe, deweke = dheweke.
        Trick five: long words get clipped: dicul = diculke (let go / sold off).
        Try it on a real message:
        "arp dicul piro" → arep diculke pira? → "How much will you sell it for?"
        And "aku gk ngerti opo2" → aku ora ngerti apa-apa → "I don't understand anything." (ngerti = mengerti; 2 doubles the word, as in Indonesian)
    grammar: jv.chat.normalize
    examples:
      - text: arp dicul piro
        ar_eg: ناوي تبيعه بكام؟ (شات)
        ar: بكم ستبيعه؟ (دردشة)
        en: How much will you sell it for? (chat)
      - text: Sik tak lapor pusat
        ar_eg: استنى، هبلّغ الإدارة. (هنفهم tak في J1.4)
        ar: انتظر، سأبلغ المركز. (نشرح tak في J1.4)
        en: Hold on, I'll report to HQ. (tak comes in J1.4)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ng
        ar_eg: neng (لـ / في)
        ar: neng (إلى / في)
        en: neng (to / at)
      - text: gk
        ar_eg: ora / ra (لأ / مش)
        ar: ora / ra (لا)
        en: ora / ra (not)
      - text: sik
        ar_eg: dhisik (الأول / استنى)
        ar: dhisik (أولًا / انتظر)
        en: dhisik (first / wait)
      - text: rapopo
        ar_eg: ora apa-apa (عادي)
        ar: ora apa-apa (لا بأس)
        en: ora apa-apa (no problem)
      - text: dicul
        ar_eg: diculke (يتباع)
        ar: diculke (يُباع)
        en: diculke (sold off)
      - text: arp
        ar_eg: arep (هـ / ناوي)
        ar: arep (سوف)
        en: arep (going to)
    words: [neng, ra, sik, ora apa-apa, diculke, arep]
  - id: e02
    type: multiple_choice
    question: sik, arp dicul ng pasar
    question_meaning:
      ar_eg: صاحبك كتب كده في الشات. الكتابة الكاملة إيه؟
      ar: كتب صديقك هذا في المحادثة. ما الصيغة الكاملة؟
      en: Your friend wrote this in chat. What's the full form?
    options: ['Sik, arep diculke neng pasar.', 'Sik, wis diculke neng pasar.', 'Ora, arep diculke neng omah.']
    answer: 0
    explain:
      ar_eg: arp = arep، dicul = diculke، ng = neng. يعني «استنى، ناوي أبيعه في السوق».
      ar: arp = arep، وdicul = diculke، وng = neng، أي «انتظر، سأبيعه في السوق».
      en: arp = arep, dicul = diculke, ng = neng, so "Hang on, I'm going to sell it at the market."
    words: [sik, arep, diculke, neng, ra]
  - id: e03
    type: listen
    text: Ora apa-apa.
    options: [Ora apa-apa., Aku ora ngerti., 'Arep neng ngendi?']
    answer: 0
    words: [ora apa-apa, ora, ngerti, neng]
  - id: e04
    type: fill_blank
    sentence: arp dicul piro → ___ diculke pira?
    meaning:
      ar_eg: ناوي تبيعه بكام؟
      ar: بكم ستبيعه؟
      en: How much will you sell it for?
    answers: [arep]
    explain:
      ar_eg: 'arp = arep: الحروف المتحركة وقعت.'
      ar: arp = arep بعد حذف الصوائت.
      en: arp = arep with the vowels dropped.
    words: [arep]
  - id: e05
    type: speaking
    text: Sik, aku wis ngerti. Ora apa-apa.
    meaning:
      ar_eg: استنى، أنا فهمت خلاص. عادي، مفيش مشكلة.
      ar: لحظة، فهمتُ الآن. لا بأس.
      en: Hang on, I get it now. No problem.
    words: [sik, wis, ngerti, ora apa-apa]
  - id: e06
    type: listen
    text: Ngapura, Mas.
    options: ['Ngapura, Mas.', 'Ora apa-apa, Mas.', 'Sik, Mas.']
    answer: 0
    meaning:
      ar_eg: معلش يا ماس.
      ar: عذرًا يا ماس.
      en: Sorry, Mas.
    words: [ngapura, ora apa-apa, sik]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: خبطت في حد في الزحمة. تقول إيه؟
      ar: اصطدمت بشخص في الزحام. ماذا تقول؟
      en: You bump into someone in the crowd. What do you say?
    options: [Ngapura, Ora apa-apa, Sik]
    answer: 0
    explain:
      ar_eg: 'ngapura = معلش. والرد: ora apa-apa.'
      ar: 'ngapura = آسف. والرد: ora apa-apa.'
      en: 'ngapura = sorry. The reply: ora apa-apa.'
    words: [ngapura, ora apa-apa]
  - id: e08
    type: speaking
    text: Ngapura, aku ra ngerti.
    meaning:
      ar_eg: معلش، أنا مش فاهم.
      ar: عذرًا، لا أفهم.
      en: Sorry, I don't understand.
    words: [ngapura, ra, ngerti]
dialogue:
  title: Grup WA
  lines:
    - speaker: Mas Heru
      text: cah, ws mangan?
      ar_eg: يا جدعان، كلتوا؟
      ar: يا جماعة، هل أكلتم؟
      en: Guys, eaten yet?
    - speaker: Mbak Rara
      text: ws. aku lagi moco buku
      ar_eg: أيوه كلت. أنا بقرا كتاب.
      ar: نعم أكلت. أنا أقرأ كتابًا.
      en: Yes. I'm reading a book.
    - speaker: Mohamed
      text: durung! aku arp mangan sate. ayo mas!
      ar_eg: لسه! أنا هاكل ساتيه. يلا يا هيرو!
      ar: ليس بعد! سآكل الساتيه. هيا يا هيرو!
      en: Not yet! I'm going to have satay. Come on, Heru!
    - speaker: Mas Heru
      text: ayo! sik, aku arp ng Alkid
      ar_eg: يلا! استنى، أنا رايح ألكيد.
      ar: هيا! انتظر، أنا ذاهب إلى ألكيد.
      en: Let's go! Hold on, I'm heading to Alkid.
    - speaker: Mbak Rara
      text: ati2 ya cah
      ar_eg: خلوا بالكم من نفسكم يا جدعان.
      ar: انتبهوا لأنفسكم يا جماعة.
      en: Take care, guys.
new_words:
  - word: ra
    pos: adverb
    ar_eg: لأ / مش (= ora في الكلام؛ شات gk، ga)
    ar: لا (= ora في الكلام؛ دردشة gk، ga)
    en: no, not (= ora in speech; chat gk, ga)
  - word: sik
    pos: adverb
    ar_eg: الأول / استنى (= dulu؛ وكمان sik، dhisik)
    ar: أولًا / انتظر (= dulu؛ وأيضًا sik، dhisik)
    en: first, hold on (= dulu; also sik, dhisik)
  - word: ora apa-apa
    pos: phrase
    ar_eg: عادي، مفيش مشكلة (= tidak apa-apa؛ شات rapopo)
    ar: لا بأس (= tidak apa-apa؛ دردشة rapopo)
    en: it's fine, no problem (= tidak apa-apa; chat rapopo)
  - word: ngerti
    pos: verb
    ar_eg: يفهم (= mengerti)
    ar: يفهم (= mengerti)
    en: to understand (= mengerti)
  - word: diculke
    pos: verb
    ar_eg: يتساب / يتباع (شات dicul)
    ar: يُطلق / يُباع (دردشة dicul)
    en: let go, sold off (chat dicul)
  - word: ngapura
    pos: noun
    ar_eg: سماح؛ «Ngapura» = معلش، آسف
    ar: عفو؛ «Ngapura» = آسف
    en: forgiveness; "Ngapura" = sorry
review:
  status: draft
