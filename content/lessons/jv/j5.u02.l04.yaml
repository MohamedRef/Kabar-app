schema: kabar.lesson/v1
id: j5.u02.l04
language: jv
title: Pejabat lan warga
can_do:
  ar_eg: تقرا خبر محلي عن المسؤولين والمجلس والانتخابات وقرار الناس.
  ar: أن تقرأ خبرًا محليًا عن المسؤولين والمجلس والانتخابات وقرار السكان.
  en: Read local news about officials, the council, elections and what residents decided.
slides:
  - title: Warta daerah
    body:
      ar_eg: |
        pejabat = مسؤول حكومي، bupati = رئيس المركز (الكابوباتين)، dewan = مجلس (زي مجلس النواب المحلي).
        nyoblos = ينتخب (حرفيًا «يخرم» ورقة الانتخاب بمسمار).
        sepakat = متفقين، ngakoni = يعترف، prihatin = زعلان وقلقان على حاجة، bubar = اتفض (الاجتماع خلص والناس مشيت).
      ar: |
        pejabat = مسؤول حكومي، bupati = حاكم المقاطعة (الكابوباتين)، dewan = مجلس (كالمجلس المحلي).
        nyoblos = يقترع (حرفيًا «يثقب» ورقة الاقتراع بمسمار).
        sepakat = متفقون، ngakoni = يعترف، prihatin = مهموم قلق على أمر، bubar = انفضّ (انتهى الاجتماع وتفرّق الناس).
      en: |
        pejabat = official, bupati = regent (head of a kabupaten), dewan = council.
        nyoblos = vote (literally "punch" the ballot with a nail).
        sepakat = agree, ngakoni = admit, prihatin = concerned, saddened, bubar = break up, be over (a meeting ends and people leave).
    examples:
      - text: Bupati Kendal teka ing pasar anyar.
        ar_eg: رئيس مركز كندال جه السوق الجديد.
        ar: جاء حاكم كندال إلى السوق الجديدة.
        en: The Regent of Kendal came to the new market.
      - text: Warga nyoblos ing TPS saben limang taun.
        ar_eg: الأهالي بينتخبوا في اللجنة كل خمس سنين.
        ar: يقترع السكان في مركز الاقتراع كل خمس سنوات.
        en: Residents vote at the polling station every five years.
      - text: Dewan lan warga wis sepakat.
        ar_eg: المجلس والأهالي اتفقوا.
        ar: اتفق المجلس والسكان.
        en: The council and the residents have agreed.
