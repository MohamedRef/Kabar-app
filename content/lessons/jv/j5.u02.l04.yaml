  - id: e03
    type: listen
    text: Bupati prihatin marang warga sing kena banjir.
    question:
      ar_eg: رئيس المركز حاسس بإيه؟
      ar: بماذا يشعر حاكم المقاطعة؟
      en: How does the regent feel?
    options: [زعلان على الناس اللي غرقوا, فرحان بالمطر, مسافر بكرة]
    answer: 0
    meaning:
      ar_eg: رئيس المركز زعلان على الأهالي اللي الفيضان جالهم.
      ar: حاكم المقاطعة مهموم بالسكان الذين أصابهم الفيضان.
      en: The regent is concerned for the residents hit by the flood.
    words: [bupati, prihatin]
  - id: e04
    type: fill_blank
    sentence: Sesuk aku arep ___ ing TPS.
    meaning:
      ar_eg: بكرة هروح ___ في اللجنة.
      ar: غدًا سأ___ في مركز الاقتراع.
      en: Tomorrow I'll ___ at the polling station.
    options: [nyoblos, bubar, prihatin]
    answers: [nyoblos]
    words: [nyoblos, bubar, prihatin]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: رئيس الكابوباتين اسمه إيه؟
      ar: ما لقب رئيس الكابوباتين؟
      en: What is the head of a kabupaten called?
    options: [dewan, bupati, nyoblos]
    answer: 1
    explain:
      ar_eg: bupati = رئيس الكابوباتين. dewan = المجلس.
      ar: bupati = رئيس الكابوباتين، وdewan = المجلس.
      en: bupati heads a kabupaten; dewan is the council.
    words: [dewan, bupati, nyoblos]
  - id: e06
    type: fill_blank
    sentence: Rapat wis ___, kabeh wong mulih.
    meaning:
      ar_eg: الاجتماع ___، والكل روّح.
      ar: ___ الاجتماع وعاد الجميع إلى بيوتهم.
      en: The meeting is ___; everyone went home.
    options: [bubar, sepakat, ngakoni]
    answers: [bubar]
    words: [bubar, sepakat, ngakoni]
  - id: e07
    type: multiple_choice
    question: Pejabat iku ___ yen dheweke salah.
    options: [ngakoni, nyoblos, bubar]
    answer: 0
    explain:
      ar_eg: 'ngakoni = يعترف: اعترف إنه غلطان.'
      ar: 'ngakoni = يعترف: اعترف بخطئه.'
      en: 'ngakoni = admit: he admitted he was wrong.'
    words: [ngakoni, nyoblos, bubar, pejabat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المجلس والأهالي اتفقوا.
      ar: اتفق المجلس والسكان.
      en: The council and the residents agreed.
    answer: Dewan lan warga wis sepakat.
    distractors: [bubar, bupati]
    words: [dewan, sepakat]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pejabat iku ngakoni salahe.
    answers_meaning:
      ar_eg: [المسؤول ده اعترف بغلطته, المسؤول اعترف إنه غلط]
      ar: [اعترف ذلك المسؤول بخطئه, اعترف المسؤول بخطئه]
      en: [That official admitted his mistake, The official admitted he was wrong]
    words: [pejabat, ngakoni]
  - id: e10
    type: speaking
    text: Kabeh warga prihatin, nanging durung sepakat.
    meaning:
      ar_eg: كل الأهالي قلقانين، بس لسه ما اتفقوش.
      ar: السكان جميعًا قلقون، لكنهم لم يتفقوا بعد.
      en: All the residents are concerned, but they haven't agreed yet.
    words: [prihatin, sepakat]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mbak, 'nyoblos' iku apa?
      ar_eg: يا ميباك، يعني إيه nyoblos؟
      ar: ما معنى nyoblos يا أختي؟
      en: Mbak, what does 'nyoblos' mean?
    - speaker: Mbak Ayu
      text: Ing TPS. Warga nyoblos bupati anyar.
      ar_eg: يعني ننتخب في اللجنة. الأهالي بينتخبوا رئيس المركز.
      ar: أي الاختيار في مركز الاقتراع. يقترع السكان لانتخاب حاكم المقاطعة.
      en: Choosing at the polling station. Residents vote to elect the regent.
    - speaker: Mohamed
      text: Ing warta iki, pejabat endi sing ngakoni salah?
      ar_eg: في الخبر ده، أنهي مسؤول اللي اعترف بالغلط؟
      ar: في هذا الخبر، أي مسؤول اعترف بالخطأ؟
      en: In this news item, which official admitted a mistake?
    - speaker: Mbak Ayu
      text: Wong saka dewan. Dheweke ngakoni dalan anyar durung rampung.
      ar_eg: واحد من المجلس. اعترف إن الطريق الجديد لسه ما خلصش.
      ar: أحد أعضاء المجلس. اعترف بأن الطريق الجديد لم يكتمل بعد.
      en: Someone from the council. He admitted the new road isn't finished.
    - speaker: Mohamed
      text: Warga prihatin, ta?
      ar_eg: الأهالي قلقانين، صح؟
      ar: السكان قلقون، أليس كذلك؟
      en: The residents are worried, then?
    - speaker: Mbak Ayu
      text: Iya. Nanging rapate wis bubar, lan kabeh wis sepakat.
      ar_eg: أيوه. بس الاجتماع خلص، والكل اتفق.
      ar: نعم. لكن الاجتماع انفضّ واتفق الجميع.
      en: Yes. But the meeting is over, and everyone has agreed.
