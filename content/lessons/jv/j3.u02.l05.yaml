schema: kabar.lesson/v1
id: j3.u02.l05
language: jv
title: Telpon saking Kairo
can_do:
  ar_eg: تقول دلوقتي وبعدين ومن شوية بالكراما، وتتكلم عن مكالمة من البيت والشبكة الوحشة.
  ar: أن تقول الآن ولاحقًا وقبل قليل بالكراما، وتتحدث عن مكالمة من البيت وضعف الإشارة.
  en: Say now, later and earlier in krama, and talk about a call from home and a bad signal.
slides:
  - title: Samenika, mangke, wau
    body:
      ar_eg: |
        كلمات الوقت بتلبس كراما كمان:
        - saiki ← samenika = دلوقتي (وكمان sapunika)
        - mengko ← mangke = بعدين
        - mau ← wau = من شوية
        telpon = مكالمة، ويتصل. nomor = رقم. sinyal = شبكة الموبايل.
        kuciwa = زعلان من خيبة أمل. ngandani = يقول لحد، يبلّغه (من kandha).
      ar: |
        كلمات الزمن لها كراما أيضًا:
        - saiki ← samenika = الآن (وأيضًا sapunika)
        - mengko ← mangke = لاحقًا
        - mau ← wau = قبل قليل
        telpon = مكالمة، ويتصل. nomor = رقم. sinyal = إشارة الهاتف.
        kuciwa = خائب الأمل. ngandani = يُخبر شخصًا (من kandha).
      en: |
        Time words put on krama too:
        - saiki → samenika = now (also sapunika)
        - mengko → mangke = later
        - mau → wau = earlier, just now
        telpon = a call, to call. nomor = number. sinyal = phone signal.
        kuciwa = disappointed. ngandani = tell someone, let them know (from kandha).
    examples:
      - text: Wau Ibu kula telpon saking Kairo.
        ar_eg: ماما اتصلت من القاهرة من شوية.
        ar: اتصلت أمي من القاهرة قبل قليل.
        en: My mum called from Cairo earlier.
      - text: Samenika sinyalipun dereng sae.
        ar_eg: دلوقتي الشبكة لسه مش كويسة.
        ar: الإشارة الآن ليست جيدة بعد.
        en: The signal isn't good yet right now.
      - text: Mangke kula telpon panjenengan.
        ar_eg: هكلّم حضرتك بعدين.
        ar: سأتصل بك لاحقًا.
        en: I'll call you later.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: samenika
        ar_eg: دلوقتي (كراما)
        ar: الآن (كراما)
        en: now (krama)
      - text: mangke
        ar_eg: بعدين (كراما)
        ar: لاحقًا (كراما)
        en: later (krama)
      - text: wau
        ar_eg: من شوية (كراما)
        ar: قبل قليل (كراما)
        en: earlier (krama)
      - text: telpon
        ar_eg: مكالمة، يتصل
        ar: مكالمة، يتصل
        en: call
    words: [samenika, mangke, wau, telpon]
  - id: e02
    type: match_pairs
    pairs:
      - text: nomor
        ar_eg: رقم
        ar: رقم
        en: number
      - text: sinyal
        ar_eg: شبكة
        ar: إشارة
        en: signal
      - text: kuciwa
        ar_eg: زعلان، خاب أمله
        ar: خائب الأمل
        en: disappointed
      - text: ngandani
        ar_eg: يقول لحد
        ar: يُخبر
        en: tell, let know
    words: [nomor, sinyal, kuciwa, ngandani]
  - id: e03
    type: listen
    text: Mangke kula telpon panjenengan.
    question:
      ar_eg: هيتصل إمتى؟
      ar: متى سيتصل؟
      en: When will he call?
    options: [هتصل دلوقتي, هتصل بعدين, اتصلت من شوية]
    answer: 1
    meaning:
      ar_eg: هكلّم حضرتك بعدين.
      ar: سأتصل بك لاحقًا.
      en: I'll call you later.
    words: [mangke, telpon]
  - id: e04
    type: fill_blank
    sentence: ___ sinyalipun dereng sae.
    meaning:
      ar_eg: ___ الشبكة لسه مش كويسة.
      ar: ___ الإشارة ليست جيدة بعد.
      en: ___ the signal isn't good yet.
    options: [Samenika, Nomor, Kuciwa]
    answers: [Samenika]
    words: [samenika, nomor, kuciwa, sinyal]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «دلوقتي» بالكراما إيه؟
      ar: ما «الآن» بالكراما؟
      en: Which is "now" in krama?
    options: [wau, mangke, samenika]
    answer: 2
    explain:
      ar_eg: saiki ← samenika = دلوقتي. wau = من شوية، mangke = بعدين.
      ar: saiki ← samenika = الآن. wau = قبل قليل، mangke = لاحقًا.
      en: saiki → samenika = now. wau = earlier, mangke = later.
    words: [wau, mangke, samenika]
  - id: e06
    type: fill_blank
    sentence: Aku wis ___ Mas Dimas.
    meaning:
      ar_eg: أنا خلاص ___ ديماس.
      ar: لقد ___ ديماس.
      en: I've already ___ Dimas.
    options: [ngandani, kuciwa, sinyal]
    answers: [ngandani]
    words: [ngandani, kuciwa, sinyal]
  - id: e07
    type: build_sentence
    source:
      ar_eg: ماما زعلانة، لسه ما اتصلتش.
      ar: أمي خائبة الأمل، لم أتصل بعد.
      en: Mum is disappointed; I haven't called yet.
    answer: Ibu kuciwa, kula dereng telpon.
    distractors: [samenika, nomor]
    words: [kuciwa, telpon]
  - id: e08
    type: translate
    direction: from_target
    source_text: Menika nomor HP kula.
    answers_meaning:
      ar_eg: [ده رقم موبايلي, دي نمرة موبايلي]
      ar: [هذا رقم هاتفي, هذا رقم جوالي]
      en: [This is my mobile number, 'Here''s my phone number']
    words: [nomor]
  - id: e09
    type: speaking
    text: Wau Ibu telpon, ngandani kabar saking Kairo.
    meaning:
      ar_eg: ماما اتصلت من شوية تقولّي أخبار القاهرة.
      ar: اتصلت أمي قبل قليل تخبرني بأخبار القاهرة.
      en: Mum called earlier with news from Cairo.
    words: [wau, telpon, ngandani]
  - id: e10
    type: multiple_choice
    question: HP-ku ora ana ___.
    options: [nomor, mangke, sinyal]
    answer: 2
    explain:
      ar_eg: sinyal = شبكة الموبايل.
      ar: sinyal = إشارة الهاتف.
      en: sinyal = phone signal.
    words: [sinyal, nomor, mangke]
dialogue:
  lines:
    - speaker: Mbah Putri
      text: "Nak, kok ketok kuciwa?"
      ar_eg: "يا ابني، مالك شكلك زعلان؟"
      ar: "يا بنيّ، لماذا تبدو خائب الأمل؟"
      en: "Why do you look so disappointed, dear?"
    - speaker: Mohamed
      text: Wau Ibu kula telpon saking Kairo, nanging sinyalipun mboten wonten.
      ar_eg: ماما اتصلت من القاهرة من شوية، بس مفيش شبكة.
      ar: اتصلت أمي من القاهرة قبل قليل، لكن لا توجد إشارة.
      en: My mum called from Cairo earlier, but there was no signal.
    - speaker: Mbah Putri
      text: "Samenika telpon saking mriki mawon. Sinyale sae."
      ar_eg: "كلّمها دلوقتي من هنا. الشبكة كويسة."
      ar: "اتصل الآن من هنا. الإشارة جيدة."
      en: "Call now from here. The signal's good."
    - speaker: Mohamed
      text: Inggih, Mbah. Mangke kula ngandani Ibu kabar kula.
      ar_eg: حاضر يا تيتة. بعدين هقول لماما أخباري.
      ar: حسنًا يا جدة. سأخبر أمي بأخباري لاحقًا.
      en: OK, Mbah. Later I'll tell Mum my news.
    - speaker: Mbah Putri
      text: Salam kangge Ibu saking Mbah.
      ar_eg: سلّملي على ماما.
      ar: بلّغ أمك سلامي.
      en: Give your mum my regards.
    - speaker: Mohamed
      text: Matur nuwun, Mbah.
      ar_eg: متشكر يا تيتة.
      ar: شكرًا يا جدة.
      en: Thank you, Mbah.
new_words:
  - word: samenika
    pos: adverb
    ar_eg: دلوقتي (saiki ← samenika)، كراما
    ar: الآن (saiki ← samenika)، كراما
    en: now (ngoko saiki, Indonesian sekarang), krama
  - word: mangke
    pos: adverb
    ar_eg: بعدين (mengko ← mangke)، كراما
    ar: لاحقًا (mengko ← mangke)، كراما
    en: later (ngoko mengko, Indonesian nanti), krama
  - word: wau
    pos: adverb
    ar_eg: من شوية (mau ← wau)، كراما
    ar: قبل قليل (mau ← wau)، كراما
    en: earlier, just now (ngoko mau, Indonesian tadi), krama
  - word: telpon
    pos: verb
    ar_eg: مكالمة، يتصل
    ar: مكالمة، يتصل
    en: a call, to phone (= telepon)
  - word: nomor
    pos: noun
    ar_eg: رقم
    ar: رقم
    en: number (= nomor)
  - word: sinyal
    pos: noun
    ar_eg: شبكة الموبايل
    ar: إشارة الهاتف
    en: phone signal (= sinyal)
  - word: kuciwa
    pos: adjective
    ar_eg: زعلان، خاب أمله
    ar: خائب الأمل
    en: disappointed (= kecewa)
  - word: ngandani
    pos: verb
    ar_eg: يقول لحد، يبلّغ (من kandha)
    ar: يُخبر (من kandha)
    en: tell, let someone know (from kandha) = memberi tahu
