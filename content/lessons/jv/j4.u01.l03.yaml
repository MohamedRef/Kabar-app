schema: kabar.lesson/v1
id: j4.u01.l03
language: jv
title: Rawuh lan kondur
can_do:
  ar_eg: ترحّب بضيف محترم، تقعّده، وتودّعه.
  ar: أن ترحّب بضيف موقَّر وتُجلسه وتودّعه.
  en: Welcome, seat and see off a respected guest.
slides:
  - title: Teka → dhateng → rawuh
    body:
      ar_eg: |
        «Sugeng rawuh» (أهلًا وسهلًا) عرفتها في J3. rawuh هو فعل «ييجي / يوصل» بالـ krama inggil:
        - ييجي: teka (نغوكو) → dhateng (كراما) → rawuh (krama inggil). بالإندونيسي: datang.
        - يرجع البيت: mulih → wangsul → kondur. بالإندونيسي: pulang.
        يعني الضيف الكبير rawuh وkondur، وإنت dhateng وwangsul. وdhateng اللي عرفتها بمعنى «لـ / إلى» هي كمان فعل «ييجي» بالكراما.
      ar: |
        عرفتَ «Sugeng rawuh» في J3، وrawuh فعل «يأتي / يصل» بالـ krama inggil:
        - يأتي: teka (نغوكو) → dhateng (كراما) → rawuh (krama inggil)، وبالإندونيسية datang.
        - يعود إلى البيت: mulih → wangsul → kondur، وبالإندونيسية pulang.
        فالضيف الكبير rawuh وkondur، وأنت dhateng وwangsul. وdhateng التي عرفتها بمعنى «إلى» هي أيضًا فعل «يأتي» بالكراما.
      en: |
        You met "Sugeng rawuh" (welcome) in J3. rawuh is the krama inggil verb "come / arrive":
        - come: teka (ngoko) → dhateng (krama) → rawuh (krama inggil). Indonesian: datang.
        - go home: mulih → wangsul → kondur. Indonesian: pulang.
        So the elder guest rawuh and kondur; you dhateng and wangsul. The dhateng you know as "to" is also the krama verb "come".
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Bapak sampun kondur?
        ar_eg: بابا رجع البيت؟
        ar: هل عاد الوالد إلى البيت؟
        en: Has Father come home?
      - text: Kula badhe wangsul rumiyin.
        ar_eg: أنا هروّح بقى.
        ar: سأعود إلى البيت الآن.
        en: I'll be going home now.
  - title: Mangga lenggah, sugeng tindak
    body:
      ar_eg: |
        الضيف وصل؟ «Sugeng rawuh. Mangga lenggah.» = أهلًا وسهلًا، اتفضل اقعد.
        يقعد: lungguh → linggih → lenggah (krama inggil). بالإندونيسي: duduk.
        الضيف ماشي؟ «Sugeng tindak» = توصل بالسلامة (حرفيًا: «رواح سعيد»، وsugeng هي krama inggil لـ selamat). ودي زي «Selamat jalan» بالإندونيسي.
      ar: |
        وصل الضيف؟ «Sugeng rawuh. Mangga lenggah.» = أهلًا وسهلًا، تفضّل بالجلوس.
        يجلس: lungguh → linggih → lenggah (krama inggil)، وبالإندونيسية duduk.
        وإذا انصرف: «Sugeng tindak» = في أمان الله، كـ«Selamat jalan» الإندونيسية.
      en: |
        Guest arriving? "Sugeng rawuh. Mangga lenggah." = Welcome, please have a seat.
        sit: lungguh → linggih → lenggah (krama inggil). Indonesian: duduk.
        Guest leaving? "Sugeng tindak" = safe journey (lit. a blessed going), like Indonesian "Selamat jalan".
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Sugeng rawuh, Bu. Mangga lenggah.
        ar_eg: أهلًا وسهلًا يا هانم. اتفضلي اقعدي.
        ar: أهلًا وسهلًا يا سيدتي. تفضّلي بالجلوس.
        en: Welcome, ma'am. Please have a seat.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rawuh
        ar_eg: ييجي / يوصل (krama inggil)
        ar: يأتي / يصل (krama inggil)
        en: come, arrive (krama inggil)
      - text: kondur
        ar_eg: يرجع البيت (krama inggil)
        ar: يعود إلى البيت (krama inggil)
        en: go home (krama inggil)
      - text: wangsul
        ar_eg: يرجع البيت (كراما، عن نفسك)
        ar: يعود إلى البيت (كراما، عن النفس)
        en: go home (krama, about yourself)
      - text: lenggah
        ar_eg: يقعد (krama inggil)
        ar: يجلس (krama inggil)
        en: sit (krama inggil)
    words: [rawuh, kondur, wangsul, lenggah]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: صاحب Pak Harsono الكبير وصل البيت. تقول له إيه الأول؟
      ar: وصل صديق Pak Harsono الكبير إلى البيت. ماذا تقول له أولًا؟
      en: Pak Harsono's older friend arrives at the house. What do you say first?
    options: ['Sugeng tindak, Pak.', 'Sugeng rawuh, Pak. Mangga lenggah.', 'Kula badhe wangsul, Pak.']
    answer: 1
    explain:
      ar_eg: "لما حد يوصل: Sugeng rawuh + Mangga lenggah. Sugeng tindak للي ماشي."
      ar: "عند الوصول: Sugeng rawuh وMangga lenggah، وSugeng tindak لمن ينصرف."
      en: On arrival, Sugeng rawuh + Mangga lenggah. Sugeng tindak is for someone leaving.
    words: [rawuh, lenggah]
  - id: e03
    type: listen
    text: Bapak sampun kondur?
    options: ['Bapak sampun kondur?', 'Bapak sampun rawuh?', 'Bapak sampun tindak?']
    answer: 0
    meaning:
      ar_eg: بابا رجع البيت؟
      ar: هل عاد الوالد إلى البيت؟
      en: Has Father come home?
    words: [kondur]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الضيف الكبير قام عشان يمشي. تقول له إيه؟
      ar: قام الضيف الكبير لينصرف. ماذا تقول له؟
      en: The older guest gets up to leave. What do you say?
    options: ['Sugeng rawuh, Pak.', 'Mangga lenggah, Pak.', 'Sugeng tindak, Pak.']
    answer: 2
    words: [sugeng tindak]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها غلطة؟
      ar: أي جملة فيها خطأ؟
      en: Which sentence has a mistake?
    options: ['Bapak sampun kondur.', 'Kula badhe kondur rumiyin.', 'Kula badhe wangsul rumiyin.']
    answer: 1
    explain:
      ar_eg: kondur تكريم للتاني. عن نفسك wangsul. «kula kondur» زي «kula dhahar».
      ar: kondur للآخر، وعن نفسك wangsul، و«kula kondur» كـ«kula dhahar».
      en: kondur honours others; about yourself it's wangsul. "Kula kondur" is like "kula dhahar".
    words: [kondur, wangsul]
  - id: e06
    type: fill_blank
    sentence: Pak Harsono sampun ___? — Dereng, Mas.
    meaning:
      ar_eg: الأستاذ هارسونو رجع البيت؟ — لسه يا ابني.
      ar: هل عاد الأستاذ هارسونو؟ — ليس بعد يا بني.
      en: Has Pak Harsono come home? — Not yet.
    options: [wangsul, kondur, mulih]
    answers: [kondur]
    words: [kondur]
  - id: e07
    type: fill_blank
    sentence: Inggih, Pak. Sugeng ___.
    meaning:
      ar_eg: ماشي يا أستاذ. توصل بالسلامة.
      ar: حسنًا يا سيدي. في أمان الله.
      en: All right, sir. Safe journey.
    options: [rawuh, tindak, kondur]
    answers: [tindak]
    explain:
      ar_eg: "للي ماشي: Sugeng tindak. Sugeng rawuh للي جاي."
      ar: لمن ينصرف Sugeng tindak، ولمن يصل Sugeng rawuh.
      en: For someone leaving, Sugeng tindak; Sugeng rawuh is for someone arriving.
    words: [sugeng tindak]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أهلًا وسهلًا يا هانم. اتفضلي اقعدي.
      ar: أهلًا وسهلًا يا سيدتي. تفضّلي بالجلوس.
      en: Welcome, ma'am. Please have a seat.
    answer: Sugeng rawuh, Bu. Mangga lenggah.
    distractors: [linggih, tindak]
    words: [rawuh, lenggah]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Bu Harsono) أنا هروّح بقى يا هانم.
      ar: (إلى Bu Harsono) سأعود إلى البيت الآن يا سيدتي.
      en: (to Bu Harsono) I'll be going home now, ma'am.
    answers: ['Kula badhe wangsul rumiyin, Bu.', 'Kula wangsul rumiyin, Bu.', 'Kula badhe wangsul, Bu.', 'Bu, kula badhe wangsul rumiyin.', 'Bu, kula wangsul rumiyin.']
    explain:
      ar_eg: عن نفسك wangsul (مش kondur). rumiyin هنا بمعنى «بقى / الأول»، وبتخلّي الاستئذان ألطف.
      ar: عن نفسك wangsul لا kondur، وrumiyin هنا تلطّف الاستئذان.
      en: About yourself, wangsul (not kondur). rumiyin ("first") makes the leave-taking softer.
    words: [wangsul]
  - id: e10
    type: speaking
    text: Matur nuwun sampun rawuh, Pak. Sugeng tindak.
    meaning:
      ar_eg: شكرًا إنك شرّفتنا يا أستاذ. توصل بالسلامة.
      ar: شكرًا على تشريفك يا سيدي. في أمان الله.
      en: Thank you for coming, sir. Safe journey.
    words: [rawuh, sugeng tindak]
dialogue:
  title: Tamu saking Bantul
  lines:
    - speaker: Pak Marto
      text: Nyuwun sewu, Mas. Pak Harsono wonten?
      ar_eg: لا مؤاخذة يا ابني. الأستاذ هارسونو موجود؟
      ar: عفوًا يا بني. هل الأستاذ هارسونو موجود؟
      en: Excuse me. Is Pak Harsono in?
    - speaker: Mohamed
      text: Sugeng rawuh, Pak. Mangga lenggah. Pak Harsono dereng kondur.
      ar_eg: أهلًا وسهلًا يا أستاذ. اتفضل اقعد. الأستاذ هارسونو لسه مارجعش.
      ar: أهلًا وسهلًا يا سيدي. تفضّل بالجلوس. لم يعد الأستاذ هارسونو بعد.
      en: Welcome, sir. Please have a seat. Pak Harsono isn't back yet.
    - speaker: Pak Marto
      text: Kondur jam pinten, Mas?
      ar_eg: هيرجع الساعة كام يا ابني؟
      ar: متى يعود يا بني؟
      en: What time will he be back?
    - speaker: Mohamed
      text: Jam gangsal, Pak.
      ar_eg: الساعة خمسة يا أستاذ.
      ar: في الخامسة يا سيدي.
      en: At five, sir.
    - speaker: Pak Marto
      text: Wah, taksih dangu. Kula wangsul rumiyin, Mas.
      ar_eg: ياه، لسه بدري. أنا هروّح بقى يا ابني.
      ar: آه، ما زال الوقت طويلًا. سأعود إلى بيتي الآن يا بني.
      en: Oh, that's a while yet. I'll head home for now.
    - speaker: Mohamed
      text: Inggih, Pak. Sugeng tindak.
      ar_eg: ماشي يا أستاذ. توصل بالسلامة.
      ar: حسنًا يا سيدي. في أمان الله.
      en: All right, sir. Safe journey.
new_words:
  - word: rawuh
    pos: verb
    ar_eg: ييجي / يوصل (krama inggil؛ ngoko teka، krama dhateng)
    ar: يأتي / يصل (krama inggil؛ ngoko teka، وkrama dhateng)
    en: come, arrive (krama inggil; ngoko teka, krama dhateng) = datang
  - word: kondur
    pos: verb
    ar_eg: يرجع البيت (krama inggil، للكبير؛ ngoko mulih)
    ar: يعود إلى البيت (krama inggil للكبير؛ ngoko mulih)
    en: go home, return (krama inggil, for the elder; ngoko mulih) = pulang
  - word: wangsul
    pos: verb
    ar_eg: يرجع البيت (كراما، عن نفسك)
    ar: يعود إلى البيت (كراما، عن النفس)
    en: go home, return (krama, about yourself) = pulang
  - word: lenggah
    pos: verb
    ar_eg: يقعد (krama inggil؛ ngoko lungguh، krama linggih)
    ar: يجلس (krama inggil؛ ngoko lungguh، وkrama linggih)
    en: sit (krama inggil; ngoko lungguh, krama linggih) = duduk
  - word: sugeng tindak
    pos: phrase
    ar_eg: توصل بالسلامة (للي ماشي)
    ar: في أمان الله (لمن ينصرف)
    en: safe journey, goodbye (to someone leaving) = selamat jalan
