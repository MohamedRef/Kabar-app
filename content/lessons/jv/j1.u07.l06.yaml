schema: kabar.lesson/v1
id: j1.u07.l06
language: jv
title: Ora usah, Mas
can_do:
  ar_eg: تفاصل وتسأل عن آخر سعر، تقول الحاجة تقيلة ولا خفيفة ولا واسعة عليك، وترفض بأدب.
  ar: أن تساوم وتسأل عن آخر سعر، وتقول إنّ الشيء ثقيل أو خفيف أو واسع عليك، وترفض بلطف.
  en: Haggle and ask for the last price, say something is heavy, light or too big, and say no politely.
slides:
  - title: Nawa neng pasar
    body:
      ar_eg: |
        nawa = يفاصل، يعرض سعر: Aku nawa dhisik = أفاصل الأول.
        rega pungkasan = آخر سعر. giliran = الدور: Giliranmu = دورك.
        abot = تقيل، entheng = خفيف. elek = وحش.
        kegedhen = واسع أو كبير زيادة عليك: Klambine kegedhen.
        ora usah = مش لازم، بلاش: Ora usah, Mas, matur nuwun.
      ar: |
        nawa = يساوم، يعرض سعرًا: Aku nawa dhisik = أساوم أوّلًا.
        rega pungkasan = آخر سعر. giliran = الدور: Giliranmu = دورك.
        abot = ثقيل، entheng = خفيف. elek = قبيح، رديء.
        kegedhen = أكبر من اللازم عليك: Klambine kegedhen.
        ora usah = لا داعي: Ora usah, Mas, matur nuwun.
      en: |
        nawa = haggle, make an offer: Aku nawa dhisik = Let me haggle first.
        rega pungkasan = last price. giliran = turn: Giliranmu = Your turn.
        abot = heavy, entheng = light. elek = ugly, bad.
        kegedhen = too big for you: Klambine kegedhen.
        ora usah = no need, never mind: Ora usah, Mas, matur nuwun.
    examples:
      - text: Rega pungkasan pira, Bu?
        ar_eg: آخر سعر كام يا حاجة؟
        ar: كم آخر سعر يا خالة؟
        en: What's your last price, Bu?
      - text: Klambine kegedhen, Mbak.
        ar_eg: القميص واسع عليّ يا أبلة.
        ar: القميص أكبر من مقاسي يا أختي.
        en: The shirt is too big, Mbak.
      - text: Ora usah, Mas, matur nuwun.
        ar_eg: مش لازم يا ماس، شكرًا.
        ar: لا داعي يا أخي، شكرًا.
        en: No need, Mas, thanks.
