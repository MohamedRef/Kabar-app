dialogue:
  lines:
    - speaker: Mas Yudha
      text: Mas, giliranmu. Aku wis tuku tas.
      ar_eg: يا ماس، دورك. أنا اشتريت شنطة.
      ar: يا أخي، دورك. اشتريت حقيبة.
      en: Mas, your turn. I've bought a bag.
    - speaker: Mohamed
      text: Bu, klambi iki pira? Kegedhen sithik.
      ar_eg: يا حاجة، القميص ده بكام؟ واسع شوية.
      ar: يا خالة، بكم هذا القميص؟ إنّه أكبر قليلًا.
      en: Bu, how much is this shirt? It's a bit big.
    - speaker: Penjual
      text: Satus ewu, Mas. Iki sing cilik.
      ar_eg: مية ألف يا ماس. ودي المقاس الصغير.
      ar: مئة ألف يا أخي. وهذا المقاس الصغير.
      en: A hundred thousand, Mas. Here's the small one.
    - speaker: Mohamed
      text: Larang, Bu. Rega pungkasan pira?
      ar_eg: غالي يا حاجة. آخر سعر كام؟
      ar: غالٍ يا خالة. كم آخر سعر؟
      en: That's pricey, Bu. What's your last price?
    - speaker: Penjual
      text: Ya wis, kurang sepuluh ewu.
      ar_eg: خلاص، هنزّلك عشرة آلاف.
      ar: حسنًا، أخفّض عشرة آلاف.
      en: Fine, ten thousand off.
    - speaker: Mohamed
      text: Oke, tak jupuk. Tas ora usah, Bu.
      ar_eg: ماشي، هاخده. مش محتاج شنطة يا حاجة.
      ar: حسنًا، سآخذه. لا أحتاج كيسًا يا سيدتي.
      en: OK, I'll take it. No bag needed, Bu.
