schema: kabar.lesson/v1
id: j3.u04.l01
language: jv
title: Sinten lan pundi
can_do:
  ar_eg: تسأل «مين؟» و«فين؟» بأدب بالكراما.
  ar: أن تسأل «مَن؟» و«أين؟» بأدب بالكراما.
  en: Ask who and where.
slides:
  - title: Nyuwun sewu = Permisi
    body:
      ar_eg: |
        أهلًا بيك في Pura Mangkunegaran، القصر الملكي التاني في سولو! هنا الأدب في السؤال جزء من القواعد بجد.
        قبل أي سؤال لحد أكبر منك ابدأ بـ **Nyuwun sewu** = «لا مؤاخذة / بعد إذن حضرتك» (زي Permisi في الإندونيسي). حرفيًا: «بطلب ألف [سماح]».
        ومع الكلام: وطّي راسك شوية، ولو هتشاور على حاجة شاور بصباع الإبهام مش السبابة.
      ar: |
        مرحبًا بك في Pura Mangkunegaran، القصر الملكي الثاني في سولو! وأدب السؤال هنا جزء من القواعد حقًّا.
        قبل أي سؤال لمن هو أكبر منك ابدأ بـ **Nyuwun sewu** = «عفوًا / بعد إذنكم» (كـ Permisi في الإندونيسية)، وحرفيًا: «أطلب ألفًا [من العفو]».
        ومع الكلام: اخفض رأسك قليلًا، وأشِر بالإبهام لا بالسبابة.
      en: |
        Welcome to Pura Mangkunegaran, Solo's second royal palace! Here, politeness in a question really is part of the grammar.
        Before asking anyone older, open with **Nyuwun sewu** = "Excuse me" (Indonesian Permisi). Literally: "I ask a thousand [pardons]".
        While you speak, bow your head slightly, and if you point, use your thumb, not your index finger.
    grammar: jv.krama.questions
    examples:
      - text: Nyuwun sewu, Pak.
        ar_eg: لا مؤاخذة يا حاج.
        ar: عفوًا يا سيدي.
        en: Excuse me, sir.
      - text: Nyuwun sewu, Bu, kula badhe taken.
        ar_eg: لا مؤاخذة يا حاجة، عايز أسأل سؤال.
        ar: عفوًا يا سيدتي، أريد أن أسأل.
        en: Excuse me, ma'am, I'd like to ask something.
  - title: sapa → sinten
    body:
      ar_eg: |
        في J1 اتعلمت sapa (= siapa). في الكراما بتبقى **sinten**.
        - Menika sinten? = مين ده؟ (Siapa ini?) — مثلًا وإنت بتشاور على صورة.
        - Asmanipun sinten? = اسم حضرتك إيه؟ (asma = اسم الشخص المحترم، زي ما اتعلمنا في J3.2.)
        خد بالك: زي الإندونيسي بالظبط، الاسم بيتسأل عنه بـ «مين» مش «إيه»: Siapa namanya? → Asmanipun sinten? مش menapa.
      ar: |
        تعلمت في J1 كلمة sapa (= siapa)، وهي في الكراما **sinten**.
        - Menika sinten? = من هذا؟ (Siapa ini?)، كأن تشير إلى صورة.
        - Asmanipun sinten? = ما اسمكم الكريم؟ (asma = اسم المعظَّم، كما في J3.2.)
        وانتبه: كما في الإندونيسية يُسأل عن الاسم بـ «مَن» لا «ما»: Siapa namanya? → Asmanipun sinten?
      en: |
        J1 gave you sapa (= siapa). In krama it's **sinten**.
        - Menika sinten? = Who is this? (Siapa ini?) — e.g. pointing at a photo.
        - Asmanipun sinten? = What is your name? (asma = a respected person's name, from J3.2.)
        Careful: just like Indonesian, you ask a name with "who", not "what": Siapa namanya? → Asmanipun sinten?, not menapa.
    grammar: jv.krama.questions
    examples:
      - text: Nyuwun sewu, asmanipun sinten?
        ar_eg: لا مؤاخذة، اسم حضرتك إيه؟
        ar: عفوًا، ما اسمكم الكريم؟
        en: Excuse me, what is your name?
      - text: Menika sinten?
        ar_eg: مين ده؟
        ar: من هذا؟
        en: Who is this?
  - title: ngendi → pundi
    body:
      ar_eg: |
        ngendi (= mana) في الكراما **pundi**. وزي ما الإندونيسي عنده di / ke / dari، الكراما عندها:
        - ing pundi = فين (di mana)
        - dhateng pundi = على فين (ke mana)
        - saking pundi = منين (dari mana)
        بعد فعل حركة زي tindak (يروح، كراما إنغيل)، dhateng ممكن تتشال: Panjenengan badhe tindak pundi? = حضرتك رايح فين؟ زي النغوكو «Arep lunga ngendi?».
      ar: |
        ngendi (= mana) في الكراما **pundi**، وكما في الإندونيسية di / ke / dari:
        - ing pundi = أين (di mana)
        - dhateng pundi = إلى أين (ke mana)
        - saking pundi = من أين (dari mana)
        وبعد فعل حركة مثل tindak (يذهب، من الكراما إنغيل) قد تُحذف dhateng: Panjenengan badhe tindak pundi? = إلى أين تتوجهون؟ كما في النغوكو «Arep lunga ngendi?».
      en: |
        ngendi (= mana) is **pundi** in krama. Like Indonesian di / ke / dari:
        - ing pundi = where (di mana)
        - dhateng pundi = where to (ke mana)
        - saking pundi = where from (dari mana)
        After a motion verb like tindak (go, krama inggil), dhateng is often dropped: Panjenengan badhe tindak pundi? = Where are you going? — just like ngoko "Arep lunga ngendi?".
    grammar: jv.krama.questions
    examples:
      - text: Nyuwun sewu, Pak, Pura Mangkunegaran ing pundi?
        ar_eg: لا مؤاخذة يا حاج، بورا مانجكونيجاران فين؟
        ar: عفوًا يا سيدي، أين بورا مانجكونيغاران؟
        en: Excuse me, sir, where is Pura Mangkunegaran?
      - text: Panjenengan saking pundi?
        ar_eg: حضرتك منين؟
        ar: من أين حضرتك؟
        en: Where are you from?
      - text: Panjenengan badhe tindak pundi?
        ar_eg: حضرتك رايح فين؟
        ar: إلى أين تتوجهون؟
        en: Where are you going?
  - title: apa → menapa (napa)
    body:
      ar_eg: |
        apa في الكراما **menapa**، وفي الكلام والشات napa.
        - Menika menapa? = ده إيه؟ (Ini apa?)
        الجدول لحد دلوقتي (نغوكو → كراما = إندونيسي):
        - sapa → sinten = siapa
        - ngendi → pundi = mana
        - apa → menapa = apa
        والرد المؤدب: Inggih (أيوه)، Mboten (لأ)، وفي الآخر Matur nuwun.
        وماتخلطش: لو بدأت Nyuwun sewu وpanjenengan، كمّل كراما — ngendi في نص جملة كراما بتبان زي «إزيك يا معالي الوزير».
      ar: |
        apa في الكراما **menapa**، وفي الكلام والدردشة napa.
        - Menika menapa? = ما هذا؟ (Ini apa?)
        الجدول حتى الآن (نغوكو → كراما = إندونيسي):
        - sapa → sinten = siapa
        - ngendi → pundi = mana
        - apa → menapa = apa
        والجواب المهذب: Inggih (نعم)، Mboten (لا)، ثم Matur nuwun.
        ولا تخلط المستويات: إذا بدأت بـ Nyuwun sewu وpanjenengan فأتمّ الجملة بالكراما.
      en: |
        apa is **menapa** in krama; spoken and in chats, napa.
        - Menika menapa? = What is this? (Ini apa?)
        Your table so far (ngoko → krama = Indonesian):
        - sapa → sinten = siapa
        - ngendi → pundi = mana
        - apa → menapa = apa
        Polite answers: Inggih (yes), Mboten (no), and finish with Matur nuwun.
        Don't mix: once you've said Nyuwun sewu and panjenengan, keep the whole question krama.
    grammar: jv.krama.questions
    examples:
      - text: Menika menapa? — Menika pendhapa.
        ar_eg: ده إيه؟ — دي pendhapa (القاعة المفتوحة).
        ar: ما هذا؟ — هذه pendhapa (القاعة المفتوحة).
        en: What is this? — It's a pendhapa (open pavilion).
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sinten
        ar_eg: مين (siapa)
        ar: مَن (siapa)
        en: who (siapa)
      - text: pundi
        ar_eg: فين (mana)
        ar: أين (mana)
        en: where (mana)
      - text: menapa
        ar_eg: إيه (apa)
        ar: ما / ماذا (apa)
        en: what (apa)
      - text: nyuwun sewu
        ar_eg: لا مؤاخذة (permisi)
        ar: عفوًا (permisi)
        en: excuse me (permisi)
      - text: taken
        ar_eg: يسأل (takon) = bertanya
        ar: يسأل (takon) = bertanya
        en: to ask (takon) = bertanya
      - text: pendhapa
        ar_eg: قاعة مفتوحة بعواميد
        ar: قاعة مفتوحة ذات أعمدة
        en: open pillared hall
    words: [sinten, pundi, menapa, nyuwun sewu, taken, pendhapa]
  - id: e02
    type: listen
    text: Panjenengan saking pundi?
    options: ['Panjenengan sinten?', 'Menapa menika?', 'Panjenengan saking pundi?']
    answer: 2
    words: [saking, pundi]
  - id: e03
    type: multiple_choice
    question: Panjenengan saking pundi?
    question_meaning:
      ar_eg: أنهي رد مناسب للسؤال ده؟
      ar: أي جواب يناسب هذا السؤال؟
      en: Which answer fits this question?
    options: [Menika pendhapa., Kula saking Kairo., 'Sinten nami panjenengan?']
    answer: 1
    explain:
      ar_eg: saking pundi = منين (dari mana)، فالرد Kula saking Kairo = أنا من القاهرة.
      ar: saking pundi = من أين، فالجواب Kula saking Kairo = أنا من القاهرة.
      en: saking pundi = where from (dari mana), so the answer is Kula saking Kairo = I'm from Cairo.
    words: [saking, pundi, pendhapa, sinten]
  - id: e04
    type: fill_blank
    sentence: Nyuwun sewu, Bu, Pasar Klewer ing ___?
    meaning:
      ar_eg: لا مؤاخذة يا حاجة، سوق كليوير فين؟
      ar: عفوًا يا سيدتي، أين سوق كليوير؟
      en: Excuse me, ma'am, where is Pasar Klewer?
    options: [menapa, sinten, ngendi, pundi]
    answers: [pundi]
    explain:
      ar_eg: 'ngendi نغوكو، وبعد Nyuwun sewu وBu لازم الكراما: ing pundi = di mana.'
      ar: 'ngendi من النغوكو، وبعد Nyuwun sewu يلزم الكراما: ing pundi = di mana.'
      en: ngendi is ngoko; after Nyuwun sewu and Bu, keep it krama — ing pundi = di mana.
    words: [pundi]
  - id: e05
    type: build_sentence
    source:
      ar_eg: لا مؤاخذة يا حاجة، عايز أسأل. (بالكراما)
      ar: عفوًا يا سيدتي، أريد أن أسأل. (بالكراما)
      en: Excuse me, ma'am, I'd like to ask. (krama)
    answer: Nyuwun sewu, Bu, kula badhe taken.
    distractors: [takon, aku]
    explain:
      ar_eg: taken = takon (يسأل) بالكراما، وkula بدل aku.
      ar: taken = takon (يسأل) بالكراما، وkula بدل aku.
      en: taken is krama for takon (ask), and kula replaces aku.
    words: [nyuwun sewu, kula, badhe, taken]
  - id: e06
    type: speaking
    text: Nyuwun sewu, Pak, kula badhe taken. Pura Mangkunegaran ing pundi?
    meaning:
      ar_eg: لا مؤاخذة يا حاج، عايز أسأل. بورا مانجكونيجاران فين؟
      ar: عفوًا يا سيدي، أريد أن أسأل. أين بورا مانجكونيغاران؟
      en: Excuse me, sir, may I ask? Where is Pura Mangkunegaran?
    words: [nyuwun sewu, taken, pundi]
  - id: e07
    type: multiple_choice
    question: Menapa menika? — Menika pendhapa.
    question_meaning:
      ar_eg: الحوار ده معناه إيه بالإندونيسي؟
      ar: ما معنى هذا الحوار بالإندونيسية؟
      en: What does this exchange mean in Indonesian?
    options: ['Apa ini? — Ini pendapa.', 'Siapa ini? — Ini pendapa.', 'Di mana pendapa? — Di sini.']
    answer: 0
    explain:
      ar_eg: menapa = apa (إيه)، menika = ini (ده). sinten = siapa.
      ar: menapa = apa، menika = ini، وsinten = siapa.
      en: menapa = apa, menika = ini; sinten would be siapa.
    words: [menapa, menika, pendhapa]
dialogue:
  title: Wonten Pura Mangkunegaran
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Pak. Pendhapa ing pundi?
      ar_eg: لا مؤاخذة يا حاج. الـ pendhapa فين؟
      ar: عفوًا يا سيدي. أين الـ pendhapa؟
      en: Excuse me, sir. Where is the pendhapa?
    - speaker: Pak Wiryo
      text: Menika, Mas. Sampeyan saking pundi?
      ar_eg: أهي يا ابني. إنت منين؟
      ar: ها هي يا بني. من أين أنت؟
      en: Here it is. Where are you from?
    - speaker: Mohamed
      text: Kula saking Kairo, Pak. Nyuwun sewu, asmanipun sinten?
      ar_eg: أنا من القاهرة يا حاج. لا مؤاخذة، اسم حضرتك إيه؟
      ar: أنا من القاهرة يا سيدي. عفوًا، ما اسمكم الكريم؟
      en: I'm from Cairo, sir. Excuse me, what is your name?
    - speaker: Pak Wiryo
      text: Nami kula Wiryo, Mas.
      ar_eg: اسمي ويريو يا ابني.
      ar: اسمي ويريو يا بني.
      en: My name is Wiryo.
    - speaker: Mohamed
      text: Matur nuwun, Pak Wiryo.
      ar_eg: شكرًا يا عم ويريو.
      ar: شكرًا يا سيد ويريو.
      en: Thank you, Pak Wiryo.
new_words:
  - word: sinten
    pos: question word
    ar_eg: مين (sapa ← siapa)، كراما
    ar: مَن (sapa ← siapa)، كراما
    en: who (ngoko sapa, Indonesian siapa), krama
  - word: pundi
    pos: question word
    ar_eg: فين (ngendi ← mana)، كراما
    ar: أين (ngendi ← mana)، كراما
    en: where (ngoko ngendi, Indonesian mana), krama
  - word: menapa
    pos: question word
    ar_eg: إيه (apa)، كراما؛ في الكلام napa
    ar: ما / ماذا (apa)، كراما؛ وفي الكلام napa
    en: what (ngoko apa), krama; spoken napa
  - word: taken
    pos: verb
    ar_eg: يسأل (takon ← bertanya)، كراما
    ar: يسأل (takon ← bertanya)، كراما
    en: to ask (ngoko takon, Indonesian bertanya), krama
  - word: pendhapa
    pos: noun
    ar_eg: قاعة مفتوحة بعواميد قدام البيت الجاوي أو القصر
    ar: قاعة مفتوحة ذات أعمدة أمام البيت الجاوي أو القصر
    en: open pillared pavilion in front of a Javanese house or palace
