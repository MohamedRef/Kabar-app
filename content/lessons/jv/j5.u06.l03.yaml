schema: kabar.lesson/v1
id: j5.u06.l03
language: jv
title: Macapat
can_do:
  ar_eg: تعرف قصيدة macapat وقواعدها.
  ar: أن تتعرّف على قصيدة macapat وقواعدها.
  en: Recognise a macapat verse and its rules.
slides:
  - title: Sewelas tembang macapat
    body:
      ar_eg: |
        macapat = الشعر الجاوي الكلاسيكي اللي بيتغنّى. فيه 11 بحر (زي بحور الشعر العربي!): Mijil، Sinom، Kinanthi، Asmaradana، Dhandhanggula، Pocung، وغيرهم.
        كل بحر ليه تلات قواعد:
        - guru gatra = عدد السطور
        - guru wilangan = عدد المقاطع في كل سطر
        - guru lagu = الحرف المتحرك اللي بيخلص بيه السطر (زي القافية)
        Pocung أقصرهم: 4 سطور، 12u، 6a، 8i، 12a. يعني السطر الأول 12 مقطع وبيخلص بـ u.
      ar: |
        macapat = الشعر الجاوي الكلاسيكي المغنّى، وله أحد عشر بحرًا (كبحور الشعر العربي!): Mijil وSinom وKinanthi وAsmaradana وDhandhanggula وPocung وغيرها.
        ولكل بحر ثلاث قواعد:
        - guru gatra = عدد الأسطر
        - guru wilangan = عدد المقاطع في كل سطر
        - guru lagu = الصائت الذي يُختم به السطر (كالقافية)
        وPocung أقصرها: أربعة أسطر، 12u و6a و8i و12a، أي أن السطر الأول اثنا عشر مقطعًا يُختم بـ u.
      en: |
        macapat = classical Javanese sung verse. It has 11 metres (like the metres of Arabic poetry!): Mijil, Sinom, Kinanthi, Asmaradana, Dhandhanggula, Pocung and more.
        Each metre has three rules:
        - guru gatra = number of lines
        - guru wilangan = syllables in each line
        - guru lagu = the vowel each line ends on (like a rhyme)
        Pocung is the shortest: 4 lines, 12u, 6a, 8i, 12a. So line one has 12 syllables and ends in u.
    grammar: jv.reading.written-style
    examples:
      - text: Tembang macapat ana sewelas.
        ar_eg: بحور الـ macapat حداشر.
        ar: بحور الـ macapat أحد عشر.
        en: There are eleven macapat metres.
      - text: Pocung iku tembang macapat kang cekak.
        ar_eg: Pocung بحر macapat قصير.
        ar: Pocung بحر قصير من بحور الـ macapat.
        en: Pocung is a short macapat metre.
  - title: Ngelmu iku kalakone kanthi laku
    body:
      ar_eg: |
        ده أول سطر في بيت Pocung مشهور من «Serat Wulangreh»، كتاب نصايح كتبه ملك سوراكارتا باكوبوونو الرابع.
        شوف أسلوب الكتابة: iku بتعرّف (زي adalah)، وkanthi = بـ / عن طريق (dengan). ngelmu = علم، من العربي «علم»! وlaku = العمل والسلوك.
        يعني: «العلم بيتنال بالعمل».
      ar: |
        هذا أول سطر من مقطع Pocung شهير في «Serat Wulangreh»، كتاب الحِكم الذي كتبه ملك سوراكارتا باكوبوونو الرابع.
        ولاحظ أسلوب الكتابة: iku للتعريف (كـ adalah)، وkanthi = بـ / عن طريق (dengan). وngelmu = علم من العربية «علم»! وlaku = العمل والسلوك.
        والمعنى: «العلم يُنال بالعمل».
      en: |
        This is the first line of a famous Pocung stanza from "Serat Wulangreh", a book of advice by Pakubuwana IV, king of Surakarta.
        See the written style: iku defines (like adalah), and kanthi = by means of (dengan). ngelmu = knowledge, from Arabic «علم»! And laku = practice, conduct.
        So: "Knowledge is attained through practice."
    grammar: jv.reading.written-style
    examples:
      - text: Ngelmu iku kalakone kanthi laku.
        ar_eg: العلم بيتنال بالعمل.
        ar: العلم يُنال بالعمل.
        en: Knowledge is attained through practice.
      - text: Lekase lawan kas.
        ar_eg: وبدايته بالعزيمة.
        ar: ويبدأ بالعزيمة.
        en: It begins with resolve.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: macapat
        ar_eg: الشعر الجاوي الكلاسيكي اللي بيتغنّى
        ar: الشعر الجاوي الكلاسيكي المغنّى
        en: classical Javanese sung verse
      - text: ngelmu
        ar_eg: علم (من «علم»)
        ar: علم (من «علم»)
        en: knowledge (from «علم»)
      - text: laku
        ar_eg: العمل / السلوك
        ar: العمل / السلوك
        en: practice, conduct
      - text: kanthi
        ar_eg: بـ / عن طريق (dengan)
        ar: بـ / عن طريق (dengan)
        en: by means of (dengan)
      - text: guru lagu
        ar_eg: الحرف المتحرك اللي بيخلص بيه السطر
        ar: الصائت الذي يُختم به السطر
        en: the vowel a line ends on
