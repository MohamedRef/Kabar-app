dialogue:
  title: Tembang Pocung
  lines:
    - speaker: Pak Ahmad
      text: Mas, iki tembang Pocung saka Serat Wulangreh.
      ar_eg: يا ابني، ده بيت Pocung من «Serat Wulangreh».
      ar: يا بني، هذا مقطع Pocung من «Serat Wulangreh».
      en: Young man, this is a Pocung stanza from Serat Wulangreh.
    - speaker: Mohamed
      text: Ngelmu iku kalakone kanthi laku. Ngelmu menika ilmu, saking basa Arab, nggih?
      ar_eg: Ngelmu iku kalakone kanthi laku. ngelmu يعني «علم»، من العربي، صح؟
      ar: Ngelmu iku kalakone kanthi laku. ngelmu هي «علم» من العربية، أليس كذلك؟
      en: Ngelmu iku kalakone kanthi laku. Ngelmu is ilmu, from Arabic, isn't it?
    - speaker: Pak Ahmad
      text: Bener. Ngelmu ora cukup diwaca, kudu dilakoni.
      ar_eg: صح. العلم مش كفاية تقراه، لازم تعمل بيه.
      ar: صحيح. لا يكفي أن يُقرأ العلم، بل يجب أن يُعمل به.
      en: Right. Knowledge isn't enough to read; you have to live it.
    - speaker: Mohamed
      text: Kados paribasan Arab, Pak. Ilmu tanpa amal kados wit tanpa woh.
      ar_eg: زي المثل العربي يا عمّو، «العلم بلا عمل كالشجر بلا ثمر».
      ar: "كالمثل العربي يا سيدي: «العلم بلا عمل كالشجر بلا ثمر»."
      en: Like the Arabic saying, sir. Knowledge without deeds is like a tree without fruit.
