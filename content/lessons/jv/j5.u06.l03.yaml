  - id: e02
    type: multiple_choice
    question: ngelmu
    question_meaning:
      ar_eg: الكلمة دي جاية من أنهي كلمة عربي؟
      ar: من أي كلمة عربية جاءت هذه الكلمة؟
      en: Which Arabic word does it come from?
    options: ['ilmu (علم)', 'alam (عالم)', 'amal (عمل)']
    answer: 0
    words: [ngelmu]
  - id: e03
    type: multiple_choice
    question: Ngelmu iku kalakone kanthi laku.
    question_meaning:
      ar_eg: السطر ده فيه كام مقطع (guru wilangan)؟
      ar: كم مقطعًا في هذا السطر (guru wilangan)؟
      en: How many syllables does this line have (guru wilangan)?
    options: ['8', '10', '12']
    answer: 2
    explain:
      ar_eg: ngel-mu-i-ku-ka-la-ko-ne-kan-thi-la-ku = 12، زي ما Pocung عايز.
      ar: ngel-mu-i-ku-ka-la-ko-ne-kan-thi-la-ku = 12، كما يقتضي Pocung.
      en: ngel-mu-i-ku-ka-la-ko-ne-kan-thi-la-ku = 12, just as Pocung requires.
  - id: e04
    type: multiple_choice
    question: Ngelmu iku kalakone kanthi laku.
    question_meaning:
      ar_eg: السطر ده بيخلص بأنهي حرف متحرك (guru lagu)؟
      ar: بأي صائت يُختم هذا السطر (guru lagu)؟
      en: Which vowel does this line end on (guru lagu)?
    options: [a, i, u]
    answer: 2
    explain:
      ar_eg: laku بتخلص بـ u. يعني 12u، أول سطر في Pocung.
      ar: laku تنتهي بـ u، أي 12u، أول سطر في Pocung.
      en: "laku ends in u: 12u, the first line of Pocung."
