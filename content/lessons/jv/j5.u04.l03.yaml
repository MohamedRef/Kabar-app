schema: kabar.lesson/v1
id: j5.u04.l03
language: jv
title: Komentar TikTok
can_do:
  ar_eg: تفكّ سلسلة تعليقات.
  ar: أن تفكّ سلسلة تعليقات.
  en: Decode a comment thread.
slides:
  - title: Komentar ing video sepur
    body:
      ar_eg: |
        فيديو على تيك توك عن قطر أمباراوا القديم، وتحته التعليقات دي. اعمل زي ما اتعلمت: لاقي الهيكل الجاوي، علّم الباقي، ورجّع إملا الشات.
        كلمات جديدة: min = اختصار admin (صاحب الصفحة)، mampir = يعدّي / يزور زيارة قصيرة، udh = sudah، tau = قبل كده (pernah)، healing = فسحة تريّح الأعصاب (سلانج إندونيسي من الإنجليزي).
      ar: |
        فيديو على تيك توك عن قطار أمباراوا القديم، وتحته هذه التعليقات. افعل ما تعلمت: جد الهيكل الجاوي، وصنّف البقية، وردّ إملاء الدردشة.
        كلمات جديدة: min = اختصار admin (صاحب الصفحة)، وmampir = يمرّ بزيارة قصيرة، وudh = sudah، وtau = سبق أن (pernah)، وhealing = نزهة للترويح عن النفس (عامية إندونيسية من الإنجليزية).
      en: |
        A TikTok video about Ambarawa's old train, with these comments under it. Do what you've learned: find the Javanese frame, tag the rest, restore chat spelling.
        New words: min = short for admin (the page owner), mampir = drop by, udh = sudah, tau = ever, have been (pernah), healing = a getaway to unwind (Indonesian slang from English).
    grammar: jv.codemix
    examples:
      - text: Wah, sepure apik bgt! Iki neng ngendi, min?
        ar_eg: الله، القطر حلو أوي! ده فين يا أدمن؟
        ar: رائع، القطار جميل جدًا! أين هذا يا مشرف الصفحة؟
        en: Wow, the train is really nice! Where is this, admin?
      - text: Neng Ambarawa, kak. Mampir wae!
        ar_eg: في أمباراوا. عدّي علينا!
        ar: في أمباراوا. مُرّ بنا!
        en: In Ambarawa. Drop by!
      - text: Aku udh tau mrana, healing tenan.
        ar_eg: أنا رحت هناك قبل كده، فسحة تريّح بجد.
        ar: سبق أن ذهبت إلى هناك، نزهة مريحة حقًا.
        en: I've been there before, a real getaway.
exercises:
  - id: e01
    type: multiple_choice
    question: Wah, sepure apik bgt! Iki neng ngendi, min?
    question_meaning:
      ar_eg: صاحب التعليق بيسأل عن إيه؟
      ar: عمَّ يسأل صاحب التعليق؟
      en: What is the commenter asking?
    options: ['Di mana ini?', 'Berapa harganya?', 'Kapan ke sana?']
    answer: 0
    explain:
      ar_eg: neng ngendi = di mana. وmin = الأدمن.
      ar: neng ngendi = di mana، وmin = مشرف الصفحة.
      en: neng ngendi = di mana; min = the admin.
    words: [min]
  - id: e02
    type: listen
    text: Neng Ambarawa, kak. Mampir wae!
    question:
      ar_eg: الأدمن بيعزم على إيه؟
      ar: إلامَ يدعو مشرف الصفحة؟
      en: What does the admin invite people to do?
    options: [mulih, mampir, turu]
    answer: 1
    meaning:
      ar_eg: في أمباراوا. عدّي علينا!
      ar: في أمباراوا. مُرّ بنا!
      en: In Ambarawa. Drop by!
    words: [mampir]
  - id: e03
    type: fill_blank
    sentence: Aku ___ tau mrana.
    meaning:
      ar_eg: أنا رحت هناك قبل كده.
      ar: سبق أن ذهبت إلى هناك.
      en: I've been there before.
    options: [bgt, min, udh]
    answers: [udh]
    words: [udh, tau]
  - id: e04
    type: fill_blank
    sentence: Iki neng ngendi, ___?
    meaning:
      ar_eg: ده فين يا أدمن؟
      ar: أين هذا يا مشرف الصفحة؟
      en: Where is this, admin?
    answers: [min, admin]
    words: [min]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا رحت هناك قبل كده، فسحة تريّح بجد.
      ar: سبق أن ذهبت إلى هناك، نزهة مريحة حقًا.
      en: I've been there before, a real getaway.
    answer: Aku udh tau mrana, healing tenan.
    distractors: [mampir, min]
    words: [udh, tau, healing]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (تعليق) عدّي على أمباراوا!
      ar: (تعليق) مُرّ بأمباراوا!
      en: (a comment) Drop by Ambarawa!
    answers:
      - Mampir neng Ambarawa!
      - Mampir nang Ambarawa!
      - Mampir menyang Ambarawa!
      - Mampir neng Ambarawa, ya!
      - Mampir wae neng Ambarawa!
      - Mampir ing Ambarawa!
    words: [mampir]
  - id: e07
    type: translate
    direction: from_target
    source_text: Aku udh tau mrana, healing tenan.
    answers_meaning:
      ar_eg:
        - أنا رحت هناك قبل كده، فسحة تريّح بجد.
        - رحت هناك قبل كده، فسحة حلوة بجد.
        - أنا رحت هناك قبل كده، بجد بتريّح الأعصاب.
