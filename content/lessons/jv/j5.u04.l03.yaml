schema: kabar.lesson/v1
id: j5.u04.l03
language: jv
title: Ngunggah video
can_do:
  ar_eg: تتكلم عن رفع فيديو، وخلصان الباقة، والأخبار الكدب اللي بتنتشر.
  ar: أن تتحدث عن رفع مقطع فيديو ونفاد الباقة والأخبار الكاذبة المنتشرة.
  en: Talk about uploading a video, running out of data and fake news going round.
slides:
  - title: Ing medsos
    body:
      ar_eg: |
        ngunggah = يرفع (بوست أو فيديو)، ngetik = يكتب على الكيبورد، kuota = باقة النت.
        palsu = مزيّف أو كدب: warta palsu = خبر كدب. nyebarake = ينشر.
        tontonan = حاجة تتفرج عليها، nggumun = يتبهر ويستغرب، nyilih = يستلف.
      ar: |
        ngunggah = يرفع (منشورًا أو مقطعًا)، ngetik = يكتب على لوحة المفاتيح، kuota = باقة الإنترنت.
        palsu = مزيّف: warta palsu = خبر كاذب. nyebarake = ينشر.
        tontonan = عرض يُشاهَد، nggumun = يندهش، nyilih = يستعير.
      en: |
        ngunggah = upload, ngetik = type, kuota = data allowance.
        palsu = fake: warta palsu = fake news. nyebarake = spread.
        tontonan = show, something to watch, nggumun = be amazed, nyilih = borrow.
    examples:
      - text: Mbak Ayu ngunggah video ing Instagram.
        ar_eg: ميباك أيو رفعت فيديو على إنستجرام.
        ar: رفعت مباك أيو مقطعًا على إنستغرام.
        en: Mbak Ayu uploaded a video to Instagram.
      - text: Aja nyebarake warta palsu!
        ar_eg: ماتنشرش أخبار كدب!
        ar: لا تنشر الأخبار الكاذبة!
        en: Don't spread fake news!
      - text: Kuotaku entek, aku nyilih HP-mu ya.
        ar_eg: الباقة بتاعتي خلصت، هستلف موبايلك.
        ar: نفدت باقتي، سأستعير هاتفك.
        en: My data's run out; can I borrow your phone?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ngunggah
        ar_eg: يرفع
        ar: يرفع (ملفًا)
        en: upload
      - text: ngetik
        ar_eg: يكتب (كيبورد)
        ar: يكتب بلوحة المفاتيح
        en: type
      - text: kuota
        ar_eg: باقة النت
        ar: باقة الإنترنت
        en: data allowance
      - text: palsu
        ar_eg: مزيّف
        ar: مزيّف
        en: fake
    words: [ngunggah, ngetik, kuota, palsu]
  - id: e02
    type: match_pairs
    pairs:
      - text: nyebarake
        ar_eg: ينشر
        ar: ينشر
        en: spread
      - text: tontonan
        ar_eg: فرجة
        ar: عرض
        en: show
      - text: nggumun
        ar_eg: يتبهر
        ar: يندهش
        en: be amazed
      - text: nyilih
        ar_eg: يستلف
        ar: يستعير
        en: borrow
    words: [nyebarake, tontonan, nggumun, nyilih]
  - id: e03
    type: listen
    text: Kuotaku entek, ora bisa ngunggah video.
    question:
      ar_eg: المشكلة إيه؟
      ar: ما المشكلة؟
      en: What's the problem?
    options: [الباقة خلصت ومش قادر يرفع فيديو, الموبايل اتكسر, الفيديو طويل]
    answer: 0
    meaning:
      ar_eg: الباقة خلصت، مش قادر أرفع الفيديو.
      ar: نفدت الباقة، لا أستطيع رفع المقطع.
      en: My data's gone; I can't upload the video.
    words: [kuota, ngunggah]
  - id: e04
    type: fill_blank
    sentence: Warta iki ___, aja dipercaya.
    meaning:
      ar_eg: الخبر ده ___، ماتصدقوش.
      ar: هذا الخبر ___، لا تصدّقه.
      en: This news is ___; don't believe it.
    options: [palsu, tontonan, kuota]
    answers: [palsu]
    words: [palsu, tontonan, kuota]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تستعمل موبايل صاحبك شوية. تقول إيه؟
      ar: تريد استعمال هاتف صديقك قليلًا. ماذا تقول؟
      en: 'You want to use your friend''s phone for a bit. You say:'
    options: ['Aku nyilih HP-mu, ya?', 'Aku ngunggah HP-mu, ya?', 'Aku nyebarake HP-mu, ya?']
    answer: 0
    explain:
      ar_eg: nyilih = يستلف. ngunggah = يرفع، nyebarake = ينشر.
      ar: nyilih = يستعير؛ ngunggah = يرفع، nyebarake = ينشر.
      en: nyilih = borrow; ngunggah = upload, nyebarake = spread.
    words: [nyilih, ngunggah, nyebarake]
  - id: e06
    type: fill_blank
    sentence: Wong-wong ___ weruh tontonan iku.
    meaning:
      ar_eg: الناس ___ لما شافوا العرض ده.
      ar: ___ الناس حين رأوا ذلك العرض.
      en: People were ___ to see that show.
    options: [nggumun, ngetik, nyilih]
    answers: [nggumun]
    words: [nggumun, ngetik, nyilih]
  - id: e07
    type: multiple_choice
    question: Mbak Ayu ___ pesen dawa ing grup.
    options: [kuota, nyilih, ngetik]
    answer: 2
    explain:
      ar_eg: ngetik = بتكتب على الموبايل.
      ar: ngetik = تكتب على الهاتف.
      en: ngetik = she's typing.
    words: [kuota, nyilih, ngetik]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ماتنشرش أخبار كدب.
      ar: لا تنشر أخبارًا كاذبة.
      en: Don't spread fake news.
    answer: Aja nyebarake warta palsu.
    distractors: [ngunggah, kuota]
    words: [nyebarake, palsu]
  - id: e09
    type: translate
    direction: from_target
    source_text: Aku nggumun, tontonan iki apik banget.
    answers_meaning:
      ar_eg: [أنا مبهور، العرض ده حلو أوي, أنا منبهر، الفرجة دي جميلة جدًا]
      ar: [أنا مندهش، هذا العرض رائع جدًا, اندهشت، هذا العرض جميل جدًا]
      en: ['I''m amazed, this show is really good', 'Wow, this show is great']
    words: [nggumun, tontonan]
  - id: e10
    type: speaking
    text: Aku ngetik caption, banjur ngunggah fotone.
    meaning:
      ar_eg: كتبت الكابشن، وبعدين رفعت الصورة.
      ar: كتبت التعليق ثم رفعت الصورة.
      en: I typed the caption, then uploaded the photo.
    words: [ngetik, ngunggah]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mbak, aku nyilih HP-mu sedhela, ya? Kuotaku entek.
      ar_eg: ميباك، هستلف موبايلك شوية؟ الباقة بتاعتي خلصت.
      ar: أختي، أأستعير هاتفك قليلًا؟ نفدت باقتي.
      en: Mbak, can I borrow your phone a sec? My data's run out.
    - speaker: Mbak Ayu
      text: Iki. Arep ngapa?
      ar_eg: اتفضل. هتعمل إيه؟
      ar: تفضّل. ماذا ستفعل؟
      en: Here. What for?
    - speaker: Mohamed
      text: Arep ngunggah video saka Lawang Sewu.
      ar_eg: عايز أرفع فيديو من لاوانج سيوو.
      ar: أريد رفع مقطع من لاوانغ سيوو.
      en: I want to upload a video from Lawang Sewu.
    - speaker: Mbak Ayu
      text: Wah! Mengko akeh sing nggumun.
      ar_eg: الله! هيتبهروا ناس كتير.
      ar: رائع! سيندهش كثيرون.
      en: Wow! Lots of people will be amazed.
    - speaker: Mohamed
      text: 'Eh, ana pesen ing grup: ''Sesuk Semarang banjir gedhe!'''
      ar_eg: 'إيه ده، فيه رسالة في الجروب: «بكرة سيمارانج هتغرق!»'
      ar: 'انظري، رسالة في المجموعة: «غدًا فيضان كبير في سيمارانغ!»'
      en: 'Hey, there''s a message in the group: ''Big flood in Semarang tomorrow!'''
    - speaker: Mbak Ayu
      text: Kuwi warta palsu. Aja disebarake!
      ar_eg: ده خبر كدب. ماتنشروش!
      ar: هذا خبر كاذب. لا تنشره!
      en: That's fake news. Don't spread it!
