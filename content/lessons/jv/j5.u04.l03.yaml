dialogue:
  title: Maca komentar
  lines:
    - speaker: Mohamed
      text: Mas, "min" iku apa?
      ar_eg: يا بايو، يعني إيه «min»؟
      ar: يا بايو، ما «min»؟
      en: Bayu, what's "min"?
    - speaker: Mas Bayu
      text: Min iku admin, sing nggawe postingan.
      ar_eg: min يعني الأدمن، اللي عامل البوست.
      ar: min هو مشرف الصفحة، صاحب المنشور.
      en: Min is the admin, the one who made the post.
    - speaker: Mohamed
      text: Lan "healing"? Iku basa Inggris, ta?
      ar_eg: وhealing؟ دي إنجليزي، مش كده؟
      ar: وhealing؟ إنها إنجليزية، أليس كذلك؟
      en: And "healing"? That's English, right?
    - speaker: Mas Bayu
      text: Iya. Healing iku dolan, lelungan, ben ati seneng.
      ar_eg: آه. healing يعني تخرج وتسافر عشان تفرّح قلبك.
      ar: نعم. healing أن تتنزّه وتسافر ليفرح قلبك.
      en: Yes. Healing means going out, travelling, to cheer yourself up.
    - speaker: Mohamed
      text: Wah, aku butuh healing neng Ambarawa!
      ar_eg: يا سلام، أنا محتاج فسحة في أمباراوا!
      ar: رائع، أحتاج نزهة في أمباراوا!
      en: Wow, I need some healing in Ambarawa!
new_words:
  - word: min
    pos: noun
    ar_eg: الأدمن (اختصار admin)
    ar: مشرف الصفحة (اختصار admin)
    en: admin (short form), the page owner
  - word: mampir
    pos: verb
    ar_eg: يعدّي على / يزور زيارة قصيرة
    ar: يمرّ بزيارة قصيرة
    en: drop by = mampir
  - word: udh
    pos: adverb
    ar_eg: خلاص (اختصار sudah)
    ar: قد (اختصار sudah)
    en: already (short for sudah)
  - word: tau
    pos: adverb
    ar_eg: قبل كده / سبق إن (pernah)
    ar: سبق أن (pernah)
    en: ever, have been = pernah
  - word: healing
    pos: noun
    ar_eg: فسحة تريّح الأعصاب (سلانج)
    ar: نزهة للترويح عن النفس (عامية)
    en: a getaway to unwind (slang)
review:
