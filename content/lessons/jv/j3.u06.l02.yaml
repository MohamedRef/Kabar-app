    question_meaning:
      ar_eg: tukokaké (نغوكو) بالكراما = ؟
      ar: tukokaké (نغوكو) بالكراما = ؟
      en: tukokaké (ngoko) in krama = ?
    options: ["tumbasaken", "tumbasaké", "tukokaken"]
    answer: 0
    explain:
      ar_eg: "الاتنين بيتغيروا: tuku → tumbas، و-aké → -aken."
      ar: "يتغير الاثنان: tuku → tumbas، و-aké → -aken."
      en: "Both parts change: tuku → tumbas, -aké → -aken."
    words: [tumbasaken]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: -aken في الكراما شبه أنهي لاحقة إندونيسي؟
      ar: تشبه -aken في الكراما أي لاحقة إندونيسية؟
      en: Krama -aken looks like which Indonesian suffix?
    options: ["-an", "-nya", "-kan"]
    answer: 2
    explain:
      ar_eg: tumbasaken = belikan، nerangaken = menerangkan.
      ar: tumbasaken = belikan، وnerangaken = menerangkan.
      en: tumbasaken = belikan, nerangaken = menerangkan.
    words: [tumbasaken, nerangaken]
