schema: kabar.lesson/v1
id: j3.u06.l02
language: jv
title: -aken
can_do:
  ar_eg: تستخدم لاحقة الكراما -aken.
  ar: أن تستعمل لاحقة الكراما -aken.
  en: Use krama -aken.
slides:
  - title: -ake → -aken
    body:
      ar_eg: |
        في J1 اتعلمت -ake (زي -kan في الإندونيسي): tukokake = belikan (اشتري لحد). في الكراما بتبقى **-aken**، والفعل نفسه كراما:
        - tukokake → **tumbasaken** = belikan (يشتري لحد)
        - gawekake → **damelaken** = buatkan (يعمل لحد)
        ولاحظ الشبه: -aken تكاد تكون -kan الإندونيسية بالظبط!
      ar: |
        تعلمت في J1 اللاحقة -ake (كـ -kan في الإندونيسية): tukokake = belikan (يشتري لغيره)، وهي في الكراما **-aken** مع تحويل الفعل نفسه إلى الكراما:
        - tukokake → **tumbasaken** = belikan (يشتري لغيره)
        - gawekake → **damelaken** = buatkan (يصنع لغيره)
        ولاحظ الشبه: -aken تكاد تطابق -kan الإندونيسية!
      en: |
        J1 gave you -ake (like Indonesian -kan): tukokake = belikan (buy for someone). In krama it's **-aken**, and the verb itself goes krama:
        - tukokake → **tumbasaken** = belikan (buy for someone)
        - gawekake → **damelaken** = buatkan (make for someone)
        Notice: -aken looks almost exactly like Indonesian -kan!
    grammar: jv.krama.affixes
    examples:
      - text: Kula tumbasaken batik kangge ibu kula.
        ar_eg: بشتري باتيك لماما.
        ar: أشتري باتيكًا لأمي.
        en: I'm buying batik for my mother.
      - text: Kula damelaken teh, nggih, Pak?
        ar_eg: أعمل لحضرتك شاي يا حاج؟
        ar: هل أُعِدّ لك شايًا يا سيدي؟
        en: Shall I make you some tea, sir?
  - title: nerangaken, ngginakaken
    body:
      ar_eg: |
        كلمات -aken كتير بتسمعها في الكراما الرسمية (والإندونيسي جنبها):
        - **nerangaken** = menerangkan (يشرح)
        - **ngginakaken** = menggunakan (يستخدم)
        مثال من Laweyan: «طريقة» carane بالنغوكو، وبالكراما **caranipun** (زي ما اتعلمنا في الدرس اللي فات). يبقى:
        Pak Harjo nerangaken caranipun damel batik. = الحاج هارجو بيشرح طريقة عمل الباتيك.
      ar: |
        كثير من أفعال -aken تُسمع في الكراما الرسمية (ومقابلها الإندونيسي):
        - **nerangaken** = menerangkan (يشرح)
        - **ngginakaken** = menggunakan (يستعمل)
        مثال من Laweyan: Pak Harjo nerangaken caranipun damel batik. = يشرح السيد هارجو طريقة صنع الباتيك، وcaranipun هي كراما carane.
      en: |
        Many -aken verbs show up in formal krama (Indonesian alongside):
        - **nerangaken** = menerangkan (explain)
        - **ngginakaken** = menggunakan (use)
        An example from Laweyan — "the way" is carane in ngoko and **caranipun** in krama (last lesson):
        Pak Harjo nerangaken caranipun damel batik. = Pak Harjo explains how batik is made.
    grammar: jv.krama.affixes
    examples:
      - text: Pak Harjo nerangaken caranipun damel batik.
        ar_eg: الحاج هارجو بيشرح طريقة عمل الباتيك.
        ar: يشرح السيد هارجو طريقة صنع الباتيك.
        en: Pak Harjo explains how batik is made.
      - text: Batik tulis dipundamel ngginakaken canthing.
        ar_eg: الباتيك المرسوم بيتعمل باستخدام الـ canthing (قلم الشمع).
        ar: يُصنع الباتيك المرسوم باستعمال الـ canthing (قلم الشمع).
        en: Hand-drawn batik is made using a canthing (wax pen).
  - title: Kula + -aken
    body:
      ar_eg: |
        فاكر إن tak- مالهاش كراما؟ نفس الحكاية هنا:
        - Tak tukokake batik. → **Kula tumbasaken batik.** = هشتريلك / هشتري باتيك (لحد).
        - ولو عايز تطلب من حد كبير بأدب: **Saged tumbasaken…?** = ممكن تشتري لي…؟
        والجملة كلها كراما: kula، kangge (kanggo)، ibu kula.
      ar: |
        كما أن tak- لا نظير لها في الكراما، يقال هنا أيضًا:
        - Tak tukokake batik. → **Kula tumbasaken batik.** = سأشتري باتيكًا (لغيري).
        - ومع الكبير يُطلب بأدب: **Saged tumbasaken…?** = هل يمكنكم أن تشتروا لي…؟
        وتبقى الجملة كلها كراما: kula، kangge (kanggo)، ibu kula.
      en: |
        tak- has no krama form, remember? Same here:
        - Tak tukokake batik. → **Kula tumbasaken batik.** = I'll buy batik (for someone).
        - Asking an elder: **Saged tumbasaken…?** = Could you buy … for me?
        Keep the whole sentence krama: kula, kangge (kanggo), ibu kula.
    grammar: jv.krama.affixes
    examples:
      - text: Mas, saged tumbasaken teh?
        ar_eg: يا أستاذ، ممكن تشتريلي شاي؟
        ar: يا أخي، هل يمكنك أن تشتري لي شايًا؟
        en: Could you buy me some tea, Mas?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tumbasaken
        ar_eg: يشتري لحد (belikan)
        ar: يشتري لغيره (belikan)
        en: buy for someone (belikan)
      - text: damelaken
        ar_eg: يعمل لحد (buatkan)
        ar: يصنع لغيره (buatkan)
        en: make for someone (buatkan)
      - text: nerangaken
        ar_eg: يشرح (menerangkan)
        ar: يشرح (menerangkan)
        en: explain (menerangkan)
      - text: ngginakaken
        ar_eg: يستخدم (menggunakan)
        ar: يستعمل (menggunakan)
        en: use (menggunakan)
      - text: caranipun
        ar_eg: الطريقة (carane) = caranya
        ar: الطريقة (carane) = caranya
        en: the way, how (carane) = caranya
      - text: canthing
        ar_eg: قلم الشمع النحاس بتاع الباتيك
        ar: قلم الشمع النحاسي للباتيك
        en: small copper wax pen for batik
    words: [tumbasaken, damelaken, nerangaken, ngginakaken, caranipun, canthing]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: tukokake (نغوكو) بالكراما = ؟
      ar: tukokake (نغوكو) بالكراما = ؟
      en: tukokake (ngoko) in krama = ?
    options: [tumbasaken, tumbasake, tukokaken]
    answer: 0
    explain:
      ar_eg: 'الاتنين بيتغيروا: tuku → tumbas، و-ake → -aken.'
      ar: 'يتغير الاثنان: tuku → tumbas، و-ake → -aken.'
      en: 'Both parts change: tuku → tumbas, -ake → -aken.'
    words: [tumbasaken]
  - id: e03
    type: listen
    text: Kula tumbasaken batik kangge ibu kula.
    options: [Kula tumbas batik kangge ibu kula., Kula tumbasaken batik kangge ibu kula., Kula damelaken batik kangge ibu kula.]
    answer: 1
    words: [tumbasaken, kangge]
  - id: e04
    type: fill_blank
    sentence: Pak Harjo ___ caranipun damel batik.
    meaning:
      ar_eg: الحاج هارجو بيشرح طريقة عمل الباتيك.
      ar: يشرح السيد هارجو طريقة صنع الباتيك.
      en: Pak Harjo explains how batik is made.
    options: [nerangake, menerangkan, nerangaken]
    answers: [nerangaken]
    explain:
      ar_eg: 'nerangake نغوكو، وmenerangkan إندونيسي. الكراما: nerangaken.'
      ar: nerangake نغوكو، وmenerangkan إندونيسية، والكراما nerangaken.
      en: nerangake is ngoko, menerangkan is Indonesian; krama is nerangaken.
    words: [nerangaken]
  - id: e05
    type: fill_blank
    sentence: Kula ___ teh, nggih, Pak?
    meaning:
      ar_eg: أعمل لحضرتك شاي يا حاج؟
      ar: هل أُعِدّ لك شايًا يا سيدي؟
      en: Shall I make you some tea, sir?
    options: [tumbasaken, gawekake, damelaken]
    answers: [damelaken]
    explain:
      ar_eg: «أعمل لحضرتك» = damelaken (damel + -aken). gawekake نغوكو، وtumbasaken = أشتري لحضرتك.
      ar: «أُعِدّ لك» = damelaken، وgawekake نغوكو، وtumbasaken = أشتري لك.
      en: '"make for you" = damelaken; gawekake is ngoko; tumbasaken = buy for you.'
    words: [damelaken]
  - id: e06
    type: build_sentence
    source:
      ar_eg: (بالكراما) الباتيك المرسوم بيتعمل باستخدام الـ canthing.
      ar: (بالكراما) يُصنع الباتيك المرسوم باستعمال الـ canthing.
      en: (in krama) Hand-drawn batik is made using a canthing.
    answer: Batik tulis dipundamel ngginakaken canthing.
    distractors: [digawe, nganggo]
    words: [damel, ngginakaken, canthing]
  - id: e07
    type: dictation
    text: Pak Harjo nerangaken caranipun.
    meaning:
      ar_eg: الحاج هارجو بيشرح الطريقة.
      ar: السيد هارجو يشرح الطريقة.
      en: Pak Harjo explains how it's done.
    words: [nerangaken, caranipun]
  - id: e08
    type: speaking
    text: Kula ngginakaken canthing kangge damel batik.
    meaning:
      ar_eg: أنا بستخدم الـ canthing عشان أعمل باتيك.
      ar: أستخدم الـ canthing لصنع الباتيك.
      en: I use a canthing to make batik.
    words: [ngginakaken, canthing, kangge, damel]
dialogue:
  title: Teh wonten Laweyan
  lines:
    - speaker: Pak Harjo
      text: Mas Mohamed, kula damelaken teh, nggih?
      ar_eg: يا محمد، أعملك شاي؟
      ar: يا محمد، هل أُعِدّ لك شايًا؟
      en: Mohamed, shall I make you some tea?
    - speaker: Mohamed
      text: Inggih, matur nuwun, Pak.
      ar_eg: أيوه، شكرًا يا حاج.
      ar: نعم، شكرًا يا سيدي.
      en: Yes, thank you, sir.
    - speaker: Pak Harjo
      text: Batik tulis menika dipundamel ngginakaken canthing.
      ar_eg: الباتيك المرسوم ده بيتعمل بالـ canthing.
      ar: يُصنع هذا الباتيك المرسوم باستعمال الـ canthing.
      en: This hand-drawn batik is made using a canthing.
    - speaker: Mohamed
      text: Sae sanget! Kula tumbasaken setunggal kangge ibu kula.
      ar_eg: حلو أوي! هشتري واحد لماما.
      ar: جميل جدًا! سأشتري واحدًا لأمي.
      en: Beautiful! I'll buy one for my mother.
    - speaker: Pak Harjo
      text: Mangga, Mas. Matur nuwun.
      ar_eg: اتفضل يا ابني. شكرًا.
      ar: تفضّل يا بني. شكرًا.
      en: Please, go ahead. Thank you.
new_words:
