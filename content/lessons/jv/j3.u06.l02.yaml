    ar: "لاحقة الكراما مقابل -aké (= -kan): tumbasaken = belikan"
    en: krama suffix for -aké (= Indonesian -kan)
  - word: tumbasaken
    pos: verb
    ar_eg: يشتري لحد (tukokaké ← belikan)، كراما
    ar: يشتري لغيره (tukokaké ← belikan)، كراما
    en: to buy for someone (ngoko tukokaké, Indonesian belikan), krama
  - word: damelaken
    pos: verb
    ar_eg: يعمل لحد (gawèkaké ← buatkan)، كراما
    ar: يصنع لغيره (gawèkaké ← buatkan)، كراما
    en: to make for someone (ngoko gawèkaké, Indonesian buatkan), krama
  - word: nerangaken
    pos: verb
    ar_eg: يشرح (menerangkan)، كراما
    ar: يشرح (menerangkan)، كراما
    en: to explain (menerangkan), krama
  - word: ngginakaken
    pos: verb
    ar_eg: يستخدم (menggunakan)، كراما رسمية
    ar: يستعمل (menggunakan)، كراما رسمية
    en: to use (menggunakan), formal krama
  - word: caranipun
    pos: noun
    ar_eg: الطريقة (carané ← caranya)، كراما
    ar: الطريقة (carané ← caranya)، كراما
    en: the way (ngoko carané, Indonesian caranya), krama
  - word: canthing
    pos: noun
    ar_eg: قلم نحاس صغير بيترسم بيه الشمع على الباتيك
    ar: قلم نحاسي صغير يُرسم به الشمع على الباتيك
    en: small copper pen for drawing wax on batik
  - word: teh
