schema: kabar.lesson/v1
id: j3.u06.l02
language: jv
title: -aken
can_do:
  ar_eg: تستخدم لاحقة الكراما -aken.
  ar: أن تستعمل لاحقة الكراما -aken.
  en: Use krama -aken.
slides:
  - title: -aké → -aken
    body:
      ar_eg: |
        في J1 اتعلمت -aké (زي -kan في الإندونيسي): tukokaké = belikan (اشتري لحد). في الكراما بتبقى **-aken**، والفعل نفسه كراما:
        - tukokaké → **tumbasaken** = belikan (يشتري لحد)
        - gawèkaké → **damelaken** = buatkan (يعمل لحد)
        ولاحظ الشبه: -aken تكاد تكون -kan الإندونيسية بالظبط!
      ar: |
        تعلمت في J1 اللاحقة -aké (كـ -kan في الإندونيسية): tukokaké = belikan (يشتري لغيره)، وهي في الكراما **-aken** مع تحويل الفعل نفسه إلى الكراما:
        - tukokaké → **tumbasaken** = belikan (يشتري لغيره)
        - gawèkaké → **damelaken** = buatkan (يصنع لغيره)
        ولاحظ الشبه: -aken تكاد تطابق -kan الإندونيسية!
      en: |
        J1 gave you -aké (like Indonesian -kan): tukokaké = belikan (buy for someone). In krama it's **-aken**, and the verb itself goes krama:
        - tukokaké → **tumbasaken** = belikan (buy for someone)
        - gawèkaké → **damelaken** = buatkan (make for someone)
        Notice: -aken looks almost exactly like Indonesian -kan!
    grammar: jv.krama.affixes
    examples:
      - text: Kula tumbasaken batik kangge ibu kula.
        ar_eg: بشتري باتيك لماما.
        ar: أشتري باتيكًا لأمي.
        en: I'm buying batik for my mother.
      - text: Kula damelaken teh, nggih, Pak?
        ar_eg: أعمل لحضرتك شاي يا حاج؟
        ar: هل أُعِدّ لك شايًا يا سيدي؟
        en: Shall I make you some tea, sir?
  - title: nerangaken, ngginakaken
    body:
      ar_eg: |
        كلمات -aken كتير بتسمعها في الكراما الرسمية (والإندونيسي جنبها):
        - **nerangaken** = menerangkan (يشرح)
        - **ngginakaken** = menggunakan (يستخدم)
        مثال من Laweyan: «طريقة» carané بالنغوكو، وبالكراما **caranipun** (زي ما اتعلمنا في الدرس اللي فات). يبقى:
        Pak Harjo nerangaken caranipun damel batik. = الحاج هارجو بيشرح طريقة عمل الباتيك.
      ar: |
        كثير من أفعال -aken تُسمع في الكراما الرسمية (ومقابلها الإندونيسي):
        - **nerangaken** = menerangkan (يشرح)
        - **ngginakaken** = menggunakan (يستعمل)
        مثال من Laweyan: Pak Harjo nerangaken caranipun damel batik. = يشرح السيد هارجو طريقة صنع الباتيك، وcaranipun هي كراما carané.
      en: |
        Many -aken verbs show up in formal krama (Indonesian alongside):
        - **nerangaken** = menerangkan (explain)
        - **ngginakaken** = menggunakan (use)
        An example from Laweyan — "the way" is carané in ngoko and **caranipun** in krama (last lesson):
        Pak Harjo nerangaken caranipun damel batik. = Pak Harjo explains how batik is made.
    grammar: jv.krama.affixes
    examples:
      - text: Pak Harjo nerangaken caranipun damel batik.
        ar_eg: الحاج هارجو بيشرح طريقة عمل الباتيك.
        ar: يشرح السيد هارجو طريقة صنع الباتيك.
        en: Pak Harjo explains how batik is made.
      - text: Batik tulis dipundamel ngginakaken canthing.
        ar_eg: الباتيك المرسوم بيتعمل باستخدام الـ canthing (قلم الشمع).
        ar: يُصنع الباتيك المرسوم باستعمال الـ canthing (قلم الشمع).
        en: Hand-drawn batik is made using a canthing (wax pen).
  - title: Kula + -aken
    body:
      ar_eg: |
        فاكر إن tak- مالهاش كراما؟ نفس الحكاية هنا:
        - Tak tukokaké batik. → **Kula tumbasaken batik.** = هشتريلك / هشتري باتيك (لحد).
        - ولو عايز تطلب من حد كبير بأدب: **Saged tumbasaken…?** = ممكن تشتري لي…؟
        والجملة كلها كراما: kula، kangge (kanggo)، ibu kula.
      ar: |
        كما أن tak- لا نظير لها في الكراما، يقال هنا أيضًا:
        - Tak tukokaké batik. → **Kula tumbasaken batik.** = سأشتري باتيكًا (لغيري).
        - ومع الكبير يُطلب بأدب: **Saged tumbasaken…?** = هل يمكنكم أن تشتروا لي…؟
        وتبقى الجملة كلها كراما: kula، kangge (kanggo)، ibu kula.
      en: |
        tak- has no krama form, remember? Same here:
        - Tak tukokaké batik. → **Kula tumbasaken batik.** = I'll buy batik (for someone).
        - Asking an elder: **Saged tumbasaken…?** = Could you buy … for me?
        Keep the whole sentence krama: kula, kangge (kanggo), ibu kula.
    grammar: jv.krama.affixes
    examples:
      - text: Mas Dimas, saged tumbasaken teh?
        ar_eg: يا ديماس، ممكن تشتريلي شاي؟
        ar: يا ديماس، هل يمكنك أن تشتري لي شايًا؟
        en: Dimas, could you buy me some tea?
