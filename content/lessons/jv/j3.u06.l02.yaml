        en: buy for someone (belikan)
      - text: damelaken
        ar_eg: يعمل لحد (buatkan)
        ar: يصنع لغيره (buatkan)
        en: make for someone (buatkan)
      - text: nerangaken
        ar_eg: يشرح (menerangkan)
        ar: يشرح (menerangkan)
        en: explain (menerangkan)
      - text: ngginakaken
        ar_eg: يستخدم (menggunakan)
        ar: يستعمل (menggunakan)
        en: use (menggunakan)
