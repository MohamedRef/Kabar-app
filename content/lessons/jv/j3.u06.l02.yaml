    pos: particle
    ar_eg: 'لاحقة الكراما لـ -ake (= -kan): tumbasaken = belikan'
    ar: 'لاحقة الكراما مقابل -ake (= -kan): tumbasaken = belikan'
    en: krama suffix for -ake (= Indonesian -kan)
  - word: tumbasaken
    pos: verb
    ar_eg: يشتري لحد (tukokake ← belikan)، كراما
    ar: يشتري لغيره (tukokake ← belikan)، كراما
    en: to buy for someone (ngoko tukokake, Indonesian belikan), krama
  - word: damelaken
    pos: verb
    ar_eg: يعمل لحد (gawekake ← buatkan)، كراما
    ar: يصنع لغيره (gawekake ← buatkan)، كراما
    en: to make for someone (ngoko gawekake, Indonesian buatkan), krama
  - word: nerangaken
    pos: verb
    ar_eg: يشرح (menerangkan)، كراما
    ar: يشرح (menerangkan)، كراما
    en: to explain (menerangkan), krama
  - word: ngginakaken
    pos: verb
    ar_eg: يستخدم (menggunakan)، كراما رسمية
    ar: يستعمل (menggunakan)، كراما رسمية
    en: to use (menggunakan), formal krama
  - word: caranipun
    pos: noun
    ar_eg: الطريقة (carane ← caranya)، كراما
    ar: الطريقة (carane ← caranya)، كراما
    en: the way (ngoko carane, Indonesian caranya), krama
  - word: canthing
    pos: noun
    ar_eg: قلم نحاس صغير بيترسم بيه الشمع على الباتيك
    ar: قلم نحاسي صغير يُرسم به الشمع على الباتيك
    en: small copper pen for drawing wax on batik
