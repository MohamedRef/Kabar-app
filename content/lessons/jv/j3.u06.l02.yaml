dialogue:
  title: Teh wonten Laweyan
  lines:
    - speaker: Pak Harjo
      text: Mas Mohamed, kula damelaken teh, nggih?
      ar_eg: يا محمد، أعملك شاي؟
      ar: يا محمد، هل أُعِدّ لك شايًا؟
      en: Mohamed, shall I make you some tea?
    - speaker: Mohamed
      text: Inggih, matur nuwun, Pak.
      ar_eg: أيوه، شكرًا يا حاج.
      ar: نعم، شكرًا يا سيدي.
      en: Yes, thank you, sir.
    - speaker: Pak Harjo
      text: Batik tulis menika dipundamel ngginakaken canthing.
      ar_eg: الباتيك المرسوم ده بيتعمل بالـ canthing.
      ar: يُصنع هذا الباتيك المرسوم باستعمال الـ canthing.
      en: This hand-drawn batik is made using a canthing.
    - speaker: Mohamed
      text: Saé sanget! Kula tumbasaken setunggal kangge ibu kula.
      ar_eg: حلو أوي! هشتري واحد لماما.
      ar: جميل جدًا! سأشتري واحدًا لأمي.
      en: Beautiful! I'll buy one for my mother.
    - speaker: Pak Harjo
      text: Mangga, Mas. Matur nuwun.
      ar_eg: اتفضل يا ابني. شكرًا.
      ar: تفضّل يا بني. شكرًا.
      en: Please, go ahead. Thank you.
