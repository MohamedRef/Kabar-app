schema: kabar.lesson/v1
id: j6.u03.l08
language: jv
title: Layang saka Dimas
can_do:
  ar_eg: تقرا عزومة قصيرة بالخط الجاوي وترد عليها.
  ar: أن تقرأ دعوة قصيرة بالخط الجاوي وتردّ عليها.
  en: Read a short invitation in aksara Jawa and reply.
slides:
  - title: Layang cekak
    body:
      ar_eg: |
        ديماس ساب لمحمد ورقة على الترابيزة. أول كلمة اسم محمد: Med، وبعده ꧈ (زي الفصلة)، فالـ d عليها pangkon.
        فاكر الكلمات دي؟ bengi = بالليل، melu = ييجي معانا / يشارك، nunggu = يستنى، gapura = بوابة.
      ar: |
        ترك ديماس لمحمد ورقة على الطاولة. أول كلمة اسم محمد: Med، ثم ꧈ (كالفاصلة)، فعلى الـ d علامة pangkon.
        أتذكر هذه الكلمات؟ bengi = ليلًا، melu = يرافق / يشارك، nunggu = ينتظر، gapura = بوّابة.
      en: |
        Dimas left Mohamed a note on the table. The first word is Mohamed's name, Med, then ꧈ (like a comma), so the d takes pangkon.
        Remember these? bengi = night, melu = come along, join in, nunggu = wait, gapura = gate.
    grammar: jv.aksara.panyigeg
    examples:
      - text: ꦩꦺꦢ꧀꧈ꦧꦼꦔꦶꦲꦶꦏꦶꦲꦤꦮꦪꦁ꧉ (Med, bengi iki ana wayang.)
        ar_eg: يا محمد، الليلة فيه عرض wayang.
        ar: يا محمد، الليلة عرض wayang.
        en: Med, there's a wayang show tonight.
      - text: ꦏꦺꦴꦮꦺꦩꦼꦭꦸ (Kowe melu?)
        ar_eg: تيجي معانا؟
        ar: أتأتي معنا؟
        en: Are you coming?
      - text: ꦲꦏꦸꦤꦸꦁꦒꦸꦲꦶꦁꦒꦥꦸꦫ꧉ꦢꦶꦩꦱ꧀ (Aku nunggu ing gapura. Dimas)
        ar_eg: أنا هستناك عند البوابة. ديماس
        ar: سأنتظرك عند البوّابة. ديماس
        en: I'll wait at the gate. Dimas
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: فيه إيه الليلة؟
      ar: ماذا هناك الليلة؟
      en: What's on tonight?
    options: [pasar, ngaji, wayang]
    answer: 2
    words: [cecak]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: ديماس هيستنى فين؟
      ar: أين سينتظر ديماس؟
      en: Where will Dimas wait?
    options: [ing gapura, ing omah, ing pasar]
    answer: 0
    explain:
      ar_eg: ꦲꦶꦁꦒꦥꦸꦫ = ing gapura (عند البوابة).
      ar: ꦲꦶꦁꦒꦥꦸꦫ = ing gapura (عند البوّابة).
      en: ꦲꦶꦁꦒꦥꦸꦫ = ing gapura (at the gate).
    words: [cecak]
  - id: e03
    type: listen
    text: Kowe melu?
    question:
      ar_eg: ديماس قرا سطر من الورقة. أنهي سطر؟
      ar: قرأ ديماس سطرًا من الورقة. أيّه؟
      en: Dimas read a line of his note aloud. Which one?
    options: ["ꦲꦏꦸꦩꦼꦭꦸ꧉", "ꦏꦺꦴꦮꦺꦩꦼꦭꦸ", "ꦏꦺꦴꦮꦺꦠꦸꦫꦸ"]
    answer: 1
    meaning:
      ar_eg: تيجي معانا؟
      ar: أتأتي معنا؟
      en: Are you coming?
  - id: e04
    type: match_pairs
    pairs:
      - text: ꦧꦼꦔꦶ
        ar_eg: bengi — بالليل
        ar: bengi — الليل
        en: bengi — night
      - text: ꦤꦸꦁꦒꦸ
        ar_eg: nunggu — يستنى
        ar: nunggu — ينتظر
        en: nunggu — wait
      - text: ꦒꦥꦸꦫ
        ar_eg: gapura — بوابة
        ar: gapura — بوّابة
        en: gapura — gate
      - text: ꦩꦼꦭꦸ
        ar_eg: melu — ييجي معاك / يشارك
        ar: melu — يرافق / يشارك
        en: melu — come along, join in
    words: [cecak]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "ليه الـ d في ꦩꦺꦢ꧀꧈ عليها pangkon؟"
      ar: "لماذا على الـ d في ꦩꦺꦢ꧀꧈ علامة pangkon؟"
      en: "Why does the d in ꦩꦺꦢ꧀꧈ take pangkon?"
    options: ["Ana ꧈ ing mburine.", "Iku jeneng.", "Ana wayang."]
    answer: 0
    explain:
      ar_eg: بعدها ꧈ على طول، يعني الكلام بيقف، وpangkon بتيجي قبل الوقفة.
      ar: يليها ꧈ مباشرة، أي يتوقف الكلام، وpangkon تأتي قبل الوقفة.
      en: ꧈ follows straight after, so speech pauses, and pangkon goes before a pause.
    words: [pangkon, pada lingsa]
  - id: e06
    type: fill_blank
    sentence: ꦧꦼꦔꦶꦲꦶꦏꦶ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: الليلة)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: الليلة)"
      en: Type the reading in Latin letters. (It means "tonight".)
    answers: [bengi iki, bengiiki]
  - id: e07
    type: build_sentence
    source:
      ar_eg: "اكتب الرد: «Aku melu.» (جاي معاك) مقطع مقطع."
      ar: "اكتب الرد: «Aku melu.» (سآتي معك) مقطعًا مقطعًا."
      en: "Write your reply — «Aku melu.» (I'm coming) — syllable by syllable."
    answer: ꦲ ꦏꦸ ꦩꦼ ꦭꦸ
    distractors: ["ꦩꦺ"]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦲꦏꦸꦤꦸꦁꦒꦸꦲꦶꦁꦒꦥꦸꦫ꧉"
      ar: "اكتب بالحروف اللاتينية: ꦲꦏꦸꦤꦸꦁꦒꦸꦲꦶꦁꦒꦥꦸꦫ꧉"
      en: "Write in Latin letters: ꦲꦏꦸꦤꦸꦁꦒꦸꦲꦶꦁꦒꦥꦸꦫ꧉"
    answers: ["Aku nunggu ing gapura.", aku nunggu ing gapura]
    words: [cecak]
  - id: e09
    type: speaking
    text: Iya, aku melu! Tunggu aku ing gapura.
    meaning:
      ar_eg: أيوه، أنا جاي! استناني عند البوابة.
      ar: نعم، سآتي! انتظرني عند البوّابة.
      en: Yes, I'm coming! Wait for me at the gate.
dialogue:
  title: Ing gapura
  lines:
    - speaker: Mohamed
      text: Mas! Aku wis maca layangmu.
      ar_eg: يا ديماس! قريت ورقتك.
      ar: يا ديماس! قرأتُ ورقتك.
      en: Mas! I read your note.
    - speaker: Dimas
      text: Apik. Kowe isa maca kabeh?
      ar_eg: حلو. قريتها كلها؟
      ar: جميل. هل قرأتها كلها؟
      en: Good. Could you read all of it?
    - speaker: Mohamed
      text: Isa. Bengi iki ana wayang, lan kowe nunggu ing gapura.
      ar_eg: أيوه. الليلة فيه wayang، وإنت مستنيني عند البوابة.
      ar: نعم. الليلة عرض wayang، وأنت تنتظرني عند البوّابة.
      en: Yes. There's wayang tonight, and you're waiting at the gate.
    - speaker: Dimas
      text: Bener! Ayo, wayange meh diwiwiti.
      ar_eg: مظبوط! يلا، العرض قرّب يبدأ.
      ar: صحيح! هيا، العرض على وشك أن يبدأ.
      en: Right! Come on, the wayang is about to start.
review:
  status: draft
  verified: false
