schema: kabar.lesson/v1
id: j4.u05.l05
language: jv
title: Uleman penganten
can_do:
  ar_eg: 'تفهم دعوة فرح جاوي: كتب الكتاب والحفلة والنسايب، وتعرف تجيب إيه وانت رايح.'
  ar: 'أن تفهم دعوة عرس جاوي: عقد القران والحفل والأصهار، وتعرف ماذا تحمل حين تذهب.'
  en: 'Understand a Javanese wedding invitation: the ijab, the reception and the in-laws, and know what to bring.'
slides:
  - title: Ijab lan pahargyan
    body:
      ar_eg: |
        - uleman = دعوة (كارت الفرح). penganten = العريس والعروسة.
        - ijab = كتب الكتاب (ijab kabul، من العربي «إيجاب وقبول»).
        - pahargyan = حفلة الاستقبال (كراما).
        - kondangan = تروح فرح كضيف (نغوكو). sumbangan = النقطة، الفلوس اللي بتدّيها للعرسان في ظرف.
        - mantu = يجوّز ابنه أو بنته، وكمان = جوز البنت أو مرات الابن: «Bu Warsih badhe mantu.»
        - besan = النسايب: أبو وأم العريس بالنسبة لأبو وأم العروسة.
      ar: |
        - uleman = دعوة (بطاقة العرس). penganten = العروسان.
        - ijab = عقد القران (ijab kabul، من العربية «إيجاب وقبول»).
        - pahargyan = حفل الاستقبال (كراما).
        - kondangan = حضور عرس ضيفًا (نغوكو). sumbangan = النقوط: المال المقدَّم للعروسين في ظرف.
        - mantu = يزوّج ابنه أو ابنته، وتعني أيضًا الصهر أو الكنّة: «Bu Warsih badhe mantu.»
        - besan = الأصهار: والدا العريس بالنسبة إلى والدي العروس.
      en: |
        - uleman = invitation (the wedding card). penganten = bride and groom, the couple.
        - ijab = the marriage contract (ijab kabul, from Arabic «إيجاب وقبول»).
        - pahargyan = reception, celebration (krama).
        - kondangan = go to a wedding as a guest (ngoko). sumbangan = the cash gift for the couple, in an envelope.
        - mantu = marry off one's child; also son- or daughter-in-law: "Bu Warsih badhe mantu."
        - besan = co-parents-in-law: the groom's parents to the bride's parents.
    examples:
      - text: Bu Warsih badhe mantu.
        ar_eg: بو وارسيه هتجوّز بنتها.
        ar: ستزوّج بو وارسيه ابنتها.
        en: Bu Warsih is marrying off her daughter.
      - text: Ijab wonten masjid, pahargyan wonten pendhapa.
        ar_eg: كتب الكتاب في الجامع، والحفلة في البندوبو.
        ar: عقد القران في المسجد، والحفل في البندوبو.
        en: The ijab is at the mosque, the reception in the pendhapa.
      - text: Sesuk aku kondangan nggawa sumbangan.
        ar_eg: بكرة رايح فرح وواخد النقطة.
        ar: غدًا أحضر عرسًا ومعي النقوط.
        en: Tomorrow I'm going to a wedding with a cash gift.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: penganten
        ar_eg: العريس والعروسة
        ar: العروسان
        en: bride and groom
      - text: mantu
        ar_eg: يجوّز عياله؛ جوز البنت
        ar: يزوّج ولده؛ صهر
        en: marry off a child; in-law
      - text: besan
        ar_eg: النسايب
        ar: الأصهار
        en: co-parents-in-law
      - text: uleman
        ar_eg: دعوة
        ar: دعوة
        en: invitation
    words: [penganten, mantu, besan, uleman]
  - id: e02
    type: match_pairs
    pairs:
      - text: kondangan
        ar_eg: يروح فرح ضيف
        ar: يحضر عرسًا ضيفًا
        en: attend a wedding
      - text: sumbangan
        ar_eg: النقطة
        ar: النقوط
        en: cash gift
      - text: pahargyan
        ar_eg: حفلة الاستقبال
        ar: حفل الاستقبال
        en: reception
      - text: ijab
        ar_eg: كتب الكتاب
        ar: عقد القران
        en: marriage contract
    words: [kondangan, sumbangan, pahargyan, ijab]
  - id: e03
    type: listen
    text: Ijabipun wonten masjid.
    question:
      ar_eg: كتب الكتاب فين؟
      ar: أين عقد القران؟
      en: Where is the ijab?
    options: [كتب الكتاب في الجامع, الفرح في الجنينة, الدعوة على الترابيزة]
    answer: 0
    meaning:
      ar_eg: كتب الكتاب في الجامع.
      ar: عقد القران في المسجد.
      en: The ijab is at the mosque.
    words: [ijab]
  - id: e04
    type: fill_blank
    sentence: Bu Warsih badhe ___ putrinipun.
    meaning:
      ar_eg: بو وارسيه هـ ___ بنتها.
      ar: ستـ ___ بو وارسيه ابنتها.
      en: Bu Warsih is going to ___ her daughter.
    options: [mantu, besan, uleman]
    answers: [mantu]
    words: [mantu, besan, uleman]
  - id: e05
    type: multiple_choice
    question: Wong tuwane penganten loro iku ___.
    question_meaning:
      ar_eg: أهل العريس وأهل العروسة بالنسبة لبعض ___.
      ar: والدا العريس ووالدا العروس هم ___.
      en: The two sets of parents of the couple are ___.
    options: [sumbangan, besan, pahargyan]
    answer: 1
    explain:
      ar_eg: besan = النسايب.
      ar: besan = الأصهار.
      en: besan = co-parents-in-law.
    words: [besan, sumbangan, pahargyan, penganten]
  - id: e06
    type: fill_blank
    sentence: Aku nampa ___ saka Mbak Ratri.
    meaning:
      ar_eg: استلمت ___ من مباك راتري.
      ar: استلمتُ ___ من مباك راتري.
      en: I received an ___ from Mbak Ratri.
    options: [uleman, ijab, mantu]
    answers: [uleman]
    words: [uleman, ijab, mantu]
  - id: e07
    type: build_sentence
    source:
      ar_eg: بكرة رايح فرح وواخد النقطة.
      ar: غدًا أحضر عرسًا ومعي النقوط.
      en: Tomorrow I'm going to a wedding with a cash gift.
    answer: Sesuk aku kondangan nggawa sumbangan.
    distractors: [besan, ijab]
    words: [kondangan, sumbangan, besan, ijab]
  - id: e08
    type: translate
    direction: from_target
    source_text: Pahargyanipun wonten pendhapa.
    answers_meaning:
      ar_eg: [الحفلة في البندوبو, حفلة الفرح في البندوبو]
      ar: [الحفل في البندوبو, حفل الاستقبال في البندوبو]
      en: [The reception is in the pendhapa, The wedding party is in the pendhapa]
    words: [pahargyan]
  - id: e09
    type: speaking
    text: Pengantenipun ayu lan bagus.
    meaning:
      ar_eg: 'العرسان حلوين: العروسة جميلة والعريس وسيم.'
      ar: 'العروسان جميلان: العروس حسناء والعريس وسيم.'
      en: 'The couple look lovely: a beautiful bride and a handsome groom.'
    words: [penganten]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: في الفرح بتحط فلوس في ظرف للعرسان. اسمها إيه؟
      ar: في العرس تضع مالًا في ظرف للعروسين. ماذا يسمّى؟
      en: At a wedding you put money in an envelope for the couple. What's it called?
    options: [uleman, kondangan, sumbangan]
    answer: 2
    explain:
      ar_eg: sumbangan = النقطة. uleman = الدعوة، وkondangan = إنك تروح الفرح.
      ar: sumbangan = النقوط، أما uleman فالدعوة وkondangan حضور العرس.
      en: sumbangan = the cash gift. uleman = invitation, kondangan = going to the wedding.
    words: [sumbangan, uleman, kondangan]
dialogue:
  lines:
    - speaker: Bu Harsono
      text: Mas Mohamed, menika uleman saking Bu Warsih. Putrinipun badhe dados penganten.
      ar_eg: يا ماس محمد، دي دعوة من بو وارسيه. بنتها هتبقى عروسة.
      ar: يا ماس محمد، هذه دعوة من بو وارسيه، فابنتها ستُزفّ.
      en: Mohamed, here's an invitation from Bu Warsih. Her daughter is getting married.
    - speaker: Mohamed
      text: Wah, Bu Warsih badhe mantu! Ijabipun kapan, Bu?
      ar_eg: الله، بو وارسيه هتجوّز بنتها! كتب الكتاب إمتى يا هانم؟
      ar: رائع، ستزوّج بو وارسيه ابنتها! متى عقد القران يا سيدتي؟
      en: Oh, Bu Warsih is marrying off her daughter! When is the ijab, ma'am?
    - speaker: Bu Harsono
      text: Dinten Setu, wonten masjid. Lajeng pahargyan wonten pendhapa.
      ar_eg: يوم السبت في الجامع. وبعدين الحفلة في البندوبو.
      ar: يوم السبت في المسجد، ثم الحفل في البندوبو.
      en: Saturday, at the mosque. Then the reception in the pendhapa.
    - speaker: Mas Dimas
      text: Mohamed, ayo kondangan karo aku!
      ar_eg: يا محمد، تعالى نروح الفرح سوا!
      ar: يا محمد، تعالَ نحضر العرس معًا!
      en: Mohamed, come to the wedding with me!
    - speaker: Mohamed
      text: Ayo! Aku nggawa sumbangan apa, Mas?
      ar_eg: يلا! أجيب نقطة إيه يا ماس؟
      ar: هيّا! ماذا أحمل هديّةً يا ماس؟
      en: Let's go! What should I bring as a gift, Mas?
    - speaker: Mas Dimas
      text: Dhuwit ing amplop wae.
      ar_eg: فلوس في ظرف وبس.
      ar: مال في ظرف فقط.
      en: Just money in an envelope.
