schema: kabar.lesson/v1
id: j4.u05.l05
language: jv
title: Grup WA kulawarga
can_do:
  ar_eg: تقرا شات عيلة وتعرف مين بيتكلم نغوكو ألوس ومين نغوكو لوغو.
  ar: أن تقرأ محادثة عائلية وتميّز من يتكلم النغوكو ألوس ومن يتكلم النغوكو لوغو.
  en: Read a family chat and tell who writes ngoko alus and who writes ngoko lugu.
slides:
  - title: Dimas lan Mbak Ratri
    body:
      ar_eg: |
        ده شات Dimas وأخته الكبيرة Mbak Ratri على جروب العيلة.
        Dimas بيكتب لأخته نغوكو ألوس: الإطار نغوكو (wis، saka)، بس أفعالها krama inggil (kondur، ngasta). وهي بترد عليه نغوكو لوغو عادي، لأنه الأصغر.
      ar: |
        هذه محادثة Dimas وأخته الكبرى Mbak Ratri في مجموعة العائلة.
        يكتب Dimas لأخته بالنغوكو ألوس: الإطار نغوكو (wis، saka) وأفعالها krama inggil (kondur، ngasta). وتردّ عليه بالنغوكو لوغو لأنه الأصغر.
      en: |
        This is Dimas chatting with his older sister, Mbak Ratri, in the family group.
        Dimas writes to her in ngoko alus: a ngoko frame (wis, saka) but krama inggil for her actions (kondur, ngasta). She answers in plain ngoko lugu, because he's younger.
    grammar: jv.speechlevel.mixed
    examples:
      - text: Mbak, panjenengan wis kondur saka kantor?
        ar_eg: (Dimas) يا أبلة، رجعتي من الشغل؟
        ar: (Dimas) يا أختي، هل عدتِ من المكتب؟
        en: (Dimas) Sis, are you home from the office yet?
      - text: Durung, Dim. Aku isih ing kantor. Udan ora?
        ar_eg: (Mbak Ratri) لسه يا Dim. أنا لسه في الشغل. بتمطر؟
        ar: (Mbak Ratri) ليس بعد يا Dim. ما زلت في المكتب. هل تمطر؟
        en: (Mbak Ratri) Not yet, Dim. I'm still at the office. Is it raining?
      - text: Udan, Mbak. Mbak ngasta payung?
        ar_eg: (Dimas) أيوه بتمطر يا أبلة. معاكي شمسية؟
        ar: (Dimas) نعم تمطر يا أختي. هل معكِ مظلّة؟
        en: (Dimas) Yes, it's raining, sis. Have you got an umbrella?
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: Mbak Ratri فين؟
      ar: أين Mbak Ratri؟
      en: Where is Mbak Ratri?
    options: [ing omah, ing kantor, ing Kotabaru]
    answer: 1
    explain:
      ar_eg: «Aku isih ing kantor» = أنا لسه في الشغل.
      ar: «Aku isih ing kantor» = ما زلت في المكتب.
      en: '"Aku isih ing kantor" = I''m still at the office.'
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين الأكبر؟
      ar: من الأكبر سنًّا؟
      en: Who is older?
    options: [Mbak Ratri, Dimas]
    answer: 0
    explain:
      ar_eg: Dimas بيكرّمها (panjenengan، kondur، ngasta) وهي بتكلّمه نغوكو لوغو، يبقى هي الأكبر.
      ar: يكرّمها Dimas (panjenengan، kondur، ngasta) وهي تخاطبه بالنغوكو لوغو، فهي الكبرى.
      en: Dimas honours her (panjenengan, kondur, ngasta) and she answers in ngoko lugu, so she's older.
    words: [ngoko alus]
  - id: e03
    type: listen
    text: Udan, Mbak. Mbak ngasta payung?
    question:
      ar_eg: الجو عامل إيه؟
      ar: كيف الطقس؟
      en: What's the weather like?
    options: ['Ora udan.', 'Udan.']
    answer: 1
    meaning:
      ar_eg: أيوه بتمطر يا أبلة. معاكي شمسية؟
      ar: نعم تمطر يا أختي. هل معكِ مظلّة؟
      en: Yes, it's raining, sis. Have you got an umbrella?
    words: [ngasta]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: Mbak Ratri بتكتب لأخوها بأنهي مستوى؟
      ar: بأي مستوى تكتب Mbak Ratri لأخيها؟
      en: Which level does Mbak Ratri write to her brother in?
    options: [krama alus, ngoko alus, ngoko lugu]
    answer: 2
    explain:
      ar_eg: كله نغوكو ومافيش ولا كلمة krama inggil (aku، durung، isih) - نغوكو لوغو.
      ar: كلها نغوكو بلا krama inggil (aku، durung، isih)، فهي نغوكو لوغو.
      en: It's all ngoko with no krama inggil (aku, durung, isih), so ngoko lugu.
    words: [ngoko lugu]
  - id: e05
    type: match_pairs
    pairs:
      - text: kondur
        ar_eg: يرجع البيت (للي بتكرّمه)
        ar: يعود إلى البيت (للمكرَّم)
        en: go home (for someone you honour)
      - text: mulih
        ar_eg: يرجع البيت (نغوكو عادي)
        ar: يعود إلى البيت (نغوكو عادي)
        en: go home (plain ngoko)
      - text: ngasta
        ar_eg: يجيب / يشيل (للي بتكرّمه)
        ar: يحمل / يُحضر (للمكرَّم)
        en: bring, carry (for someone you honour)
      - text: nggawa
        ar_eg: يجيب / يشيل (نغوكو عادي)
        ar: يحمل / يُحضر (نغوكو عادي)
        en: bring, carry (plain ngoko)
    words: [kondur, ngasta, nggawa]
  - id: e06
    type: fill_blank
    sentence: Ora, Dim. Aku ora ___ payung.
    meaning:
      ar_eg: (Mbak Ratri) لأ يا Dim. ماعيش شمسية.
      ar: (Mbak Ratri) لا يا Dim. لم أُحضر مظلّة.
      en: (Mbak Ratri) No, Dim. I didn't bring an umbrella.
    options: [ngasta, nggawa]
    answers: [nggawa]
    explain:
      ar_eg: هي بتتكلم عن نفسها، يبقى nggawa. ngasta للي بتكرّمه.
      ar: تتحدث عن نفسها فتقول nggawa، أما ngasta فللمكرَّم.
      en: She's talking about herself, so nggawa. ngasta is for someone you honour.
    words: [nggawa, ngasta]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (Dimas لأخته) يا أبلة، رجعتي من الشغل؟
      ar: (Dimas لأخته) يا أختي، هل عدتِ من المكتب؟
      en: (Dimas to his sister) Sis, are you home from the office yet?
    answer: Mbak, panjenengan wis kondur saka kantor?
    alternatives: ['Panjenengan wis kondur saka kantor, Mbak?']
    distractors: [mulih, sampun]
    explain:
      ar_eg: 'نغوكو ألوس: wis وsaka نغوكو، وkondur لأختك الكبيرة.'
      ar: 'نغوكو ألوس: wis وsaka نغوكو، وkondur للأخت الكبرى.'
      en: 'Ngoko alus: wis and saka stay ngoko; kondur is for your older sister.'
    words: [kondur, ngoko alus]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (Mbak Ratri لأخوها) أنا لسه في الشغل.
      ar: (Mbak Ratri لأخيها) ما زلت في المكتب.
      en: (Mbak Ratri to her brother) I'm still at the office.
    answers:
      - Aku isih ing kantor.
      - Aku isih neng kantor.
      - Aku isih nang kantor.
      - Aku isih ana ing kantor.
      - Aku isih ing kantor, Dim.
    explain:
      ar_eg: 'عن نفسها لأخ أصغر: نغوكو لوغو - aku، isih.'
      ar: 'عن نفسها لأخ أصغر: نغوكو لوغو - aku، isih.'
      en: 'About herself, to a younger brother: ngoko lugu, aku, isih.'
    words: [ngoko lugu]
dialogue:
  title: Ing omahe Dimas
  lines:
    - speaker: Mohamed
      text: Mas, Mbak Ratri wis kondur?
      ar_eg: يا Dimas، Mbak Ratri رجعت؟
      ar: يا Dimas، هل عادت Mbak Ratri؟
      en: Dimas, is Mbak Ratri home yet?
    - speaker: Mas Dimas
      text: Durung. Mbak Ratri isih ing kantor.
      ar_eg: لسه. Mbak Ratri لسه في الشغل.
      ar: ليس بعد. ما زالت Mbak Ratri في المكتب.
      en: Not yet. Mbak Ratri is still at the office.
    - speaker: Mohamed
      text: Udan, lho. Mbak Ratri ngasta payung?
      ar_eg: دي بتمطر على فكرة. معاها شمسية؟
      ar: إنها تمطر! هل معها مظلّة؟
      en: It's raining, you know. Has Mbak Ratri got an umbrella?
    - speaker: Mas Dimas
      text: Ora. Aku arep menyang kantor nggawa payung.
      ar_eg: لأ. أنا رايح الشغل وواخد شمسية.
      ar: لا. سأذهب إلى المكتب ومعي مظلّة.
      en: No. I'm going to the office with an umbrella.
    - speaker: Mohamed
      text: Aku melu, Mas!
      ar_eg: أنا جاي معاك!
      ar: سآتي معك!
      en: I'm coming with you!
review:
