schema: kabar.lesson/v1
id: j4.u05.l05
language: jv
title: Ulangan J4.5
can_do:
  ar_eg: تختار بين ngoko alus وkrama alus.
  ar: أن تختار بين ngoko alus وkrama alus.
  en: Pick ngoko alus vs krama alus.
slides:
  - title: Papat undha-usuk
    body:
      ar_eg: |
        «رايح فين؟» بأربع درجات:
        ngoko lugu (صاحبك): Kowe arep lunga menyang ngendi?
        ngoko alus (قريب وأكبر: أختك الكبيرة، صاحب أكبر): Panjenengan / Mas arep tindak menyang ngendi?
        krama lugu (بياع، غريب في سنّك): Sampeyan badhe kesah dhateng pundi?
        krama alus (الكبار، المدرسين): Panjenengan badhe tindak dhateng pundi?
        السؤال اللي تسأله لنفسك: هو قريب مني؟ وهو أكبر مني؟
      ar: |
        «إلى أين تذهب؟» بأربع درجات:
        ngoko lugu (الصديق): Kowe arep lunga menyang ngendi?
        ngoko alus (القريب الأكبر): Panjenengan / Mas arep tindak menyang ngendi?
        krama lugu (البائع، النظير الغريب): Sampeyan badhe kesah dhateng pundi?
        krama alus (الكبار، المعلمون): Panjenengan badhe tindak dhateng pundi?
        واسأل نفسك: هل هو قريب مني؟ وهل هو أكبر مني؟
      en: |
        "Where are you going?" at four steps:
        ngoko lugu (a friend): Kowe arep lunga menyang ngendi?
        ngoko alus (close and senior: older sister, older friend): Panjenengan / Mas arep tindak menyang ngendi?
        krama lugu (a seller, a stranger your age): Sampeyan badhe kesah dhateng pundi?
        krama alus (elders, teachers): Panjenengan badhe tindak dhateng pundi?
        Ask yourself two things: are they close to me? Are they older than me?
    grammar: jv.speechlevel.mixed
    examples:
      - text: Mbak wis dhahar? — Pak, panjenengan sampun dhahar?
        ar_eg: أكلتي يا أبلة؟ (ngoko alus) — حضرتك أكلت يا أستاذ؟ (krama alus)
        ar: هل أكلتِ يا أختي؟ (ngoko alus) — هل تفضّلت بالأكل يا سيدي؟ (krama alus)
        en: Have you eaten, sis? (ngoko alus) — Have you eaten, sir? (krama alus)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ngoko lugu
        ar_eg: "لصاحبك: Kowe arep lunga menyang ngendi?"
        ar: "للصديق: Kowe arep lunga menyang ngendi?"
        en: "to a friend: Kowe arep lunga menyang ngendi?"
      - text: ngoko alus
        ar_eg: "لقريب أكبر: Mas arep tindak menyang ngendi?"
        ar: "للقريب الأكبر: Mas arep tindak menyang ngendi?"
        en: "to someone close and older: Mas arep tindak menyang ngendi?"
      - text: krama lugu
        ar_eg: "لبياع أو غريب: Sampeyan badhe kesah dhateng pundi?"
        ar: "للبائع أو الغريب: Sampeyan badhe kesah dhateng pundi?"
        en: "to a seller or stranger: Sampeyan badhe kesah dhateng pundi?"
      - text: krama alus
        ar_eg: "لكبير: Panjenengan badhe tindak dhateng pundi?"
        ar: "للكبير: Panjenengan badhe tindak dhateng pundi?"
        en: "to an elder: Panjenengan badhe tindak dhateng pundi?"
    words: [ngoko lugu, ngoko alus, krama lugu, krama alus]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بتكلّم Mbak Ratri، أخت دِيماس الكبيرة وصاحبتك. أنهي مستوى؟
      ar: تكلّم Mbak Ratri، أخت ديماس الكبرى وصديقتك. أي مستوى؟
      en: You're talking to Mbak Ratri, Dimas's older sister and your friend. Which level?
    options: [ngoko lugu, ngoko alus, krama alus]
    answer: 1
    explain:
      ar_eg: "قريبة وأكبر: ngoko alus."
      ar: "قريبة وأكبر: ngoko alus."
      en: "Close and senior: ngoko alus."
    words: [ngoko alus]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: بتكلّم Pak Bambang، الدكتور الكبير في الجامعة. أنهي مستوى؟
      ar: تكلّم Pak Bambang، الأستاذ الكبير في الجامعة. أي مستوى؟
      en: You're talking to Pak Bambang, the senior lecturer. Which level?
    options: [ngoko alus, krama lugu, krama alus]
    answer: 2
    explain:
      ar_eg: "كبير ومش قريب: krama alus."
      ar: "كبير وغير قريب: krama alus."
      en: "Senior and not close: krama alus."
    words: [krama alus]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: بتشتري من بياع في سنّك في السوق. أنهي مستوى؟
      ar: تشتري من بائع في سنّك في السوق. أي مستوى؟
      en: You're buying from a seller your age at the market. Which level?
    options: [krama lugu, ngoko alus, krama alus]
    answer: 0
    explain:
      ar_eg: "مش قريب ومش أكبر: krama lugu، مؤدبة من غير تبجيل."
      ar: "غير قريب ولا أكبر: krama lugu، مهذبة بلا تبجيل."
      en: "Neither close nor senior: krama lugu, polite without honorifics."
    words: [krama lugu]
  - id: e05
    type: listen
    text: Panjenengan badhe tindak dhateng pundi?
    options: ['Panjenengan arep tindak menyang ngendi?', 'Panjenengan badhe tindak dhateng pundi?', 'Sampeyan badhe kesah dhateng pundi?']
    answer: 1
    meaning:
      ar_eg: سيادتك رايح فين؟ (krama alus)
      ar: إلى أين تتوجّهون؟ (krama alus)
      en: Where are you going, sir? (krama alus)
    words: [krama alus]
  - id: e06
    type: fill_blank
    sentence: Mbak wis ___? Aku wis tangi.
    meaning:
      ar_eg: صحيتي يا أبلة؟ أنا صحيت.
      ar: هل استيقظتِ يا أختي؟ أنا استيقظت.
      en: Are you up, sis? I'm up.
    options: [wungu, tangi, sare]
    answers: [wungu]
    words: [wungu]
  - id: e07
    type: fill_blank
    sentence: Kula ___ wangsul saking kampus, Pak.
    meaning:
      ar_eg: أنا لسه راجع من الجامعة يا أستاذ.
      ar: عدتُ لتوّي من الجامعة يا سيدي.
      en: I've just got back from campus, sir.
    options: [nembe, badhe, dereng]
    answers: [nembe]
    words: [nembe]
  - id: e08
    type: build_sentence
    source:
      ar_eg: (ngoko alus) يا أبلة، واخدة شمسية؟
      ar: (ngoko alus) يا أختي، هل تحملين مظلة؟
      en: (ngoko alus) Sis, are you taking an umbrella?
    answer: Mbak, panjenengan ngasta payung?
    distractors: [nggawa, kowe]
    words: [ngasta]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (krama alus، لـ Pak Bambang) حضرتك رايح فين يا أستاذ؟
      ar: (krama alus، إلى Pak Bambang) إلى أين تتوجّه يا سيدي؟
      en: (krama alus, to Pak Bambang) Where are you going, sir?
    answers: ['Panjenengan badhe tindak dhateng pundi, Pak?', 'Pak, panjenengan badhe tindak dhateng pundi?', 'Panjenengan badhe tindak pundi, Pak?', 'Bapak badhe tindak dhateng pundi?', 'Bapak badhe tindak pundi?', 'Badhe tindak pundi, Pak?', 'Badhe tindak dhateng pundi, Pak?']
    words: [krama alus, tindak]
  - id: e10
    type: dictation
    text: Aku wis mangan. Mbak wis dhahar durung?
    meaning:
      ar_eg: أنا أكلت. وإنتي أكلتي ولا لسه؟
      ar: أكلتُ. وأنتِ هل أكلتِ؟
      en: I've eaten. Have you eaten yet, sis?
    words: [ngoko alus]
  - id: e11
    type: speaking
    text: Mas, sampeyan arep kondur jam pira?
    meaning:
      ar_eg: هتروّح الساعة كام يا أبو الشباب؟ (ngoko alus)
      ar: متى ستعود إلى البيت يا أخي؟ (ngoko alus)
      en: What time are you going home, bro? (ngoko alus)
    words: [ngoko alus, kondur]
dialogue:
  title: Ing ngarep Masjid Syuhada
  lines:
    - speaker: Mohamed
      text: Mbak Ratri, panjenengan arep tindak menyang ngendi?
      ar_eg: يا أبلة راتري، حضرتك رايحة فين؟
      ar: يا راتري، إلى أين تذهبين؟
      en: Ratri, where are you going?
    - speaker: Mbak Ratri
      text: Menyang Masjid Syuhada, Mohamed. Kowe?
      ar_eg: على مسجد الشهدا يا محمد. وإنت؟
      ar: إلى مسجد الشهداء يا محمد. وأنت؟
      en: To the Syuhada Mosque, Mohamed. You?
    - speaker: Mohamed
      text: Aku uga, Mbak. Lho, iku Pak Bambang.
      ar_eg: وأنا كمان. الله، ده الدكتور بامبانج.
      ar: وأنا أيضًا. انظري، هذا الأستاذ بامبانغ.
      en: Me too. Oh, there's Pak Bambang.
    - speaker: Mohamed
      text: Sugeng siang, Pak. Panjenengan badhe tindak dhateng masjid ugi?
      ar_eg: مساء الخير يا أستاذ. حضرتك رايح المسجد كمان؟
      ar: طاب يومك يا سيدي. هل تتوجّه إلى المسجد أيضًا؟
      en: Good afternoon, sir. Are you going to the mosque too?
    - speaker: Pak Bambang
      text: Inggih, Mas. Mangga.
      ar_eg: أيوه يا ابني. يلا بينا.
      ar: نعم يا بني. تفضّل.
      en: Yes. After you.
    - speaker: Mbak Ratri
      text: Kramamu apik tenan, Mohamed!
      ar_eg: الكراما بتاعتك حلوة بجد يا محمد!
      ar: كراماك جميلة حقًا يا محمد!
      en: Your krama is really good, Mohamed!
souvenir:
  id: j4.u05.souvenir
  title: Kotabaru
  note:
    ar_eg: |
      كوتابارو حي اتبنى أيام الهولنديين بشوارع واسعة وفيلات وجناين، وفي نصه مسجد الشهدا (Masjid Syuhada)، اتبنى أوائل الخمسينات تخليدًا لشهداء الاستقلال — وsyuhada هي «شهداء» العربي بالظبط. في البيوت هنا هتسمع ngoko alus كل يوم: الأخ الصغير بيقول لأخته الكبيرة «Mbak wis dhahar?»، إطار بيتي ودافي وجواه احترام.
    ar: |
      كوتابارو حيّ بُني في العهد الهولندي بشوارع واسعة وفيلات وحدائق، وفي وسطه مسجد الشهداء (Masjid Syuhada) الذي بُني أوائل الخمسينيات تخليدًا لشهداء الاستقلال، وsyuhada هي «شهداء» العربية بعينها. وفي بيوته تسمع ngoko alus كل يوم: يقول الأخ الأصغر لأخته الكبرى «Mbak wis dhahar?»، إطار بيتيّ دافئ في داخله احترام.
    en: |
      Kotabaru is a Dutch-era quarter of wide streets, villas and gardens, and at its heart stands the Syuhada Mosque, built in the early 1950s to honour those who died for independence. Syuhada is Arabic «شهداء», martyrs. In the homes here you'll hear ngoko alus every day: a younger brother asking his older sister "Mbak wis dhahar?", a warm, familiar frame with respect inside.
