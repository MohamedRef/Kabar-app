schema: kabar.lesson/v1
id: j2.u01.l01
language: jv
title: Bapak, ibu, mbakyu
can_do:
  ar_eg: تسمّي أبوك وأمك وإخواتك.
  ar: أن تسمّي والديك وإخوتك.
  en: Name your parents and siblings.
slides:
  - title: Bapak, ibu, simbok
    body:
      ar_eg: |
        أهلًا بيك في ماديون! القطر جه من جوكجا ناحية الشرق. نفس جاوي ماتارامان، بس بطريقة أهل ماديون: سريع وعلى الماشي (ra، sik، wis، lho، to). وفي الشرح هتلاقي دايمًا الشكل الكامل جنب اللي الناس بتقوله (ra = ora، sik = dhisik).
        وهنا هنتعرّف على عيلة Pak Budi، صاحب محل أكل (warung) في ماديون، وبنته Sari بتدرس في القاهرة!
        أول كلمات العيلة:
        - **bapak** = بابا · **ibu** = ماما. و**simbok** (mbok) = ماما في الريف والكلام القديم.
        - **anak** = ابن / بنت · **kulawarga** = عيلة (keluarga).
        كلها نغوكو. في الكراما (J3) فيه كلمات تانية، زي ما الجاوي بيعمل دايمًا.
      ar: |
        مرحبًا بك في ماديون! جاء القطار من يوغياكارتا شرقًا. والجاوية هي ماتارامان نفسها، لكن على طريقة أهل ماديون: سريعة عفوية (ra وsik وwis وlho وto). وفي الشرح تجد الصيغة الكاملة دائمًا بجانب المنطوقة (ra = ora، sik = dhisik).
        وهنا نتعرف على عائلة Pak Budi صاحب مطعم صغير (warung) في ماديون، وابنته Sari التي تدرس في القاهرة!
        أولى ألفاظ العائلة:
        - **bapak** = الأب · **ibu** = الأم، و**simbok** (mbok) = الأم في الريف والاستعمال القديم.
        - **anak** = الولد / البنت · **kulawarga** = العائلة (keluarga).
        وكلها نغوكو، وللكراما (J3) ألفاظ أخرى كعادة الجاوية.
      en: |
        Welcome to Madiun! The train came east from Jogja. Same Mataraman Javanese, the Madiun way: quick and casual (ra, sik, wis, lho, to). The slides always show the full form next to the spoken one (ra = ora, sik = dhisik).
        Meet the family of Pak Budi, who runs a warung (food stall) in Madiun — his daughter Sari studies in Cairo!
        First family words:
        - **bapak** = father · **ibu** = mother. **simbok** (mbok) = mother in villages and older speech.
        - **anak** = child · **kulawarga** = family (keluarga).
        All ngoko. Krama (J3) has other words, as Javanese always does.
    grammar: jv.kinship.terms
    examples:
      - text: Sari kuwi anake Pak Budi.
        ar_eg: ساري بنت باك بودي.
        ar: ساري ابنة باك بودي.
        en: Sari is Pak Budi's daughter.
      - text: Bapak lan ibuku neng Kairo.
        ar_eg: بابا وماما في القاهرة.
        ar: أبي وأمي في القاهرة.
        en: My father and mother are in Cairo.
  - title: Mas, mbakyu, adhi
    body:
      ar_eg: |
        الجاوي بيفرّق الإخوات بالسن، مش بس ولد وبنت:
        - **mas** = أخويا الكبير.
        - **mbakyu** (وباختصار mbak) = أختي الكبيرة.
        - **adhi** (adhik) = أخويا أو أختي الصغيرين، وبنناديه **dhik**.
        - **sedulur** = أخ / قريب بشكل عام.
        وإنت عارف إن mas وmbak كمان ألقاب نداء، حتى للغُرب.
      ar: |
        تفرّق الجاوية الإخوة بالسن لا بالجنس وحده:
        - **mas** = الأخ الأكبر.
        - **mbakyu** (واختصارًا mbak) = الأخت الكبرى.
        - **adhi** (adhik) = الأخ أو الأخت الأصغر، ويُنادى **dhik**.
        - **sedulur** = الأخ / القريب عمومًا.
        وتعرف أن mas وmbak ألقاب نداء أيضًا حتى للغرباء.
      en: |
        Javanese sorts siblings by age, not only by gender:
        - **mas** = older brother.
        - **mbakyu** (short: mbak) = older sister.
        - **adhi** (adhik) = younger brother or sister, called **dhik**.
        - **sedulur** = sibling / relative in general.
        You know mas and mbak are also address terms, even for strangers.
    grammar: jv.kinship.terms
    examples:
      - text: Masku nyambut gawe neng Suroboyo.
        ar_eg: أخويا الكبير بيشتغل في سورابايا.
        ar: أخي الأكبر يعمل في سورابايا.
        en: My older brother works in Surabaya.
      - text: Aku duwe adhi loro.
        ar_eg: عندي اتنين إخوات أصغر مني.
        ar: لي أخوان أصغر مني.
        en: I have two younger siblings.
  - title: piye dhe?
    body:
      ar_eg: |
        الكلمات دي نفسها ألقاب نداء: mas، mbak، dhik، mbah، و**dhe** (اختصار pakdhe / budhe).
        فلما تشوف في الشات «piye dhe» يبقى حد بيكلم حد بيعتبره زي «عمو / طنط»: «إيه رأيك يا عمو؟» أو «أخبارك إيه يا طنط؟»
        والإندونيسي أخد منهم: mas، mbak، pakde، bude.
      ar: |
        هذه الألفاظ نفسها ألقاب نداء: mas وmbak وdhik وmbah و**dhe** (اختصار pakdhe / budhe).
        فإن رأيت في الدردشة «piye dhe» فالمتكلم يخاطب من يعدّه كالعم أو الخالة: «ما رأيك يا عم؟» أو «كيف حالك يا خالة؟»
        وقد أخذت الإندونيسية منها mas وmbak وpakde وbude.
      en: |
        These words double as address terms: mas, mbak, dhik, mbah, and **dhe** (short for pakdhe / budhe).
        So "piye dhe" in a chat is someone talking to an uncle or auntie figure: "What do you think, uncle?" or "How are you, auntie?"
        Indonesian borrowed several: mas, mbak, pakde, bude.
    grammar: jv.kinship.terms
    examples:
      - text: piye dhe
        ar_eg: إيه رأيك يا عمو؟ / أخبارك إيه يا طنط؟ (شات)
        ar: ما رأيك يا عم؟ / كيف حالك يا خالة؟ (دردشة)
        en: What do you think, uncle? / How are you, auntie? (chat)
      - text: Dhik, ayo mangan!
        ar_eg: يلا ناكل يا صغير!
        ar: هيا نأكل يا صغيري!
        en: Come and eat, little one!
exercises:
  - id: e01
    type: multiple_choice
    question: Aku duwe adhi loro.
    question_meaning:
      ar_eg: يعني إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [Saya punya dua kakak., Saya punya dua anak., Saya punya dua adik.]
    answer: 2
    explain:
      ar_eg: adhi = adik (أصغر). duwe = punya.
      ar: adhi = adik (الأصغر)، وduwe = punya.
      en: adhi = adik (younger); duwe = punya.
    words: [adhi, duwe]
  - id: e02
    type: fill_blank
    sentence: Agus kuwi ___ Sari.
    meaning:
      ar_eg: أجوس أخو ساري الكبير.
      ar: أغوس أخو ساري الأكبر.
      en: Agus is Sari's older brother.
    options: [mase, anake, adhine]
    answers: [mase]
    words: [mas]
  - id: e03
    type: build_sentence
    source:
      ar_eg: أخويا الكبير بيشتغل في سورابايا.
      ar: أخي الأكبر يعمل في سورابايا.
      en: My older brother works in Surabaya.
    answer: Masku nyambut gawe neng Suroboyo.
    distractors: [adhiku, saka]
    words: [mas, nyambut gawe]
  - id: e04
    type: multiple_choice
    question: Bapakku nyambut gawe, ibuku duwe warung.
    question_meaning:
      ar_eg: يعني إيه بالإندونيسي؟
      ar: ما معناها بالإندونيسية؟
      en: What does it mean in Indonesian?
    options: ['Ayah saya bekerja, ibu saya punya warung.', 'Ayah saya punya warung, ibu saya bekerja.', 'Anak saya bekerja, ibu saya punya warung.']
    answer: 0
    explain:
      ar_eg: nyambut gawe = bekerja (يشتغل)، duwe = punya (عنده).
      ar: nyambut gawe = bekerja، وduwe = punya.
      en: nyambut gawe = bekerja (work), duwe = punya (have).
    words: [bapak, ibu, nyambut gawe, duwe, anak]
  - id: e05
    type: speaking
    text: Kulawargaku gedhe. Aku duwe mbakyu siji lan adhi loro.
    meaning:
      ar_eg: عيلتي كبيرة. عندي أخت كبيرة واحدة واتنين إخوات أصغر مني.
      ar: عائلتي كبيرة. لي أخت كبرى واحدة وأخوان أصغر مني.
      en: My family is big. I have one older sister and two younger siblings.
    words: [kulawarga, duwe, mbakyu, adhi]
  - id: e06
    type: match_pairs
    pairs:
      - text: bapak
        ar_eg: بابا
        ar: الأب
        en: father
      - text: ibu
        ar_eg: ماما
        ar: الأم
        en: mother
      - text: anak
        ar_eg: ابن / بنت
        ar: الولد / البنت
        en: child
      - text: mbakyu
        ar_eg: أختي الكبيرة
        ar: الأخت الكبرى
        en: older sister
      - text: adhi
        ar_eg: أخويا / أختي الصغيرين
        ar: الأخ / الأخت الأصغر
        en: younger sibling
      - text: kulawarga
        ar_eg: عيلة
        ar: عائلة
        en: family
    words: [bapak, ibu, anak, mbakyu, adhi, kulawarga]
  - id: e07
    type: listen
    text: Bapak lan ibuku neng Kairo.
    options: [Bapak lan ibuku neng Kairo., Bapak lan adhiku neng Kairo., Mbakyu lan ibuku neng Kairo.]
    answer: 0
    words: [bapak, ibu]
  - id: e08
    type: listen
    text: Iki kulawargaku, bapak, ibu lan mbakyuku.
    options: ['Iki kulawargaku, bapak, ibu lan mbakyuku.', 'Iki kulawargaku, bapak, ibu lan adhiku.', 'Iki omahku, bapak, ibu lan mbakyuku.']
    answer: 0
    meaning:
      ar_eg: دي عيلتي، بابا وماما وأختي الكبيرة.
      ar: هذه عائلتي، أبي وأمي وأختي الكبرى.
      en: This is my family, my dad, mum and older sister.
    words: [kulawarga, bapak, ibu, mbakyu, adhi]
  - id: e09
    type: fill_blank
    sentence: Mbakyuku ___ neng Suroboyo.
    meaning:
      ar_eg: أختي الكبيرة بتشتغل في سورابايا.
      ar: أختي الكبرى تعمل في سورابايا.
      en: My older sister works in Surabaya.
    options: [nyambut gawe, duwe, anak]
    answers: [nyambut gawe]
    words: [mbakyu, nyambut gawe]
dialogue:
  lines:
    - speaker: Sari
      text: Mohamed, kowe duwe adhi ra?
      ar_eg: محمد، عندك إخوات أصغر منك؟
      ar: محمد، هل لديك إخوة أصغر منك؟
      en: Mohamed, do you have younger siblings?
    - speaker: Mohamed
      text: Duwe lho. Aku duwe adhi loro.
      ar_eg: آه. عندي اتنين أصغر مني.
      ar: نعم. لدي اثنان أصغر مني.
      en: Yes. I have two younger siblings.
    - speaker: Sari
      text: Bapak karo ibumu neng Kairo, to?
      ar_eg: بابا وماما في القاهرة؟
      ar: هل أبوك وأمك في القاهرة؟
      en: Are your father and mother in Cairo?
    - speaker: Mohamed
      text: Iya. Kulawargaku neng Kairo.
      ar_eg: آه. عيلتي في القاهرة.
      ar: نعم. عائلتي في القاهرة.
      en: Yes. My family is in Cairo.
