dialogue:
  title: Neng warungé Pak Budi
  lines:
    - speaker: Pak Budi
      text: Mohamed, iki bojoku, Bu Rahayu.
      ar_eg: يا محمد، دي مراتي، Bu Rahayu.
      ar: يا محمد، هذه زوجتي، Bu Rahayu.
      en: Mohamed, this is my wife, Bu Rahayu.
    - speaker: Bu Rahayu
      text: Kowé kancané Sari neng Kairo, to?
      ar_eg: إنت صاحب ساري في القاهرة، مش كده؟
      ar: أنت صديق ساري في القاهرة، أليس كذلك؟
      en: You're Sari's friend in Cairo, aren't you?
    - speaker: Mohamed
      text: Iya, Bu. Aku kancané Sari.
      ar_eg: أيوه يا طنط. أنا صاحب ساري.
      ar: نعم يا سيدتي. أنا صديق ساري.
      en: Yes, ma'am. I'm Sari's friend.
    - speaker: Pak Budi
      text: Iki Agus, masé Sari. Lan iki Bayu, adhiné.
      ar_eg: ده أجوس، أخو ساري الكبير. وده بايو، أخوها الصغير.
      ar: هذا أغوس، أخو ساري الأكبر. وهذا بايو، أخوها الأصغر.
      en: This is Agus, Sari's older brother. And this is Bayu, her younger brother.
    - speaker: Agus
      text: Mbah putri lagi masak. Ayo mangan, Mohamed!
      ar_eg: تيتة بتطبخ. يلا ناكل يا محمد!
      ar: الجدة تطبخ. هيا نأكل يا محمد!
      en: Grandma is cooking. Come and eat, Mohamed!
