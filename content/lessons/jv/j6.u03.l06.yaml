schema: kabar.lesson/v1
id: j6.u03.l06
language: jv
title: Lindhu 2006
can_do:
  ar_eg: 'تسمع حكاية زلزال ٢٠٠٦ في كوتاجيدي: البيوت اللي وقعت، والقرميد، والمتطوعين، وإزاي رجعت.'
  ar: 'أن تسمع قصة زلزال ٢٠٠٦ في كوتاغيدي: البيوت المنهارة والقرميد والمتطوعين والتعافي.'
  en: 'Hear about the 2006 Kotagede earthquake: collapsed houses, roof tiles, volunteers and recovery.'
slides:
  - title: 27 Mei 2006
    body:
      ar_eg: |
        في ٢٧ مايو ٢٠٠٦ حصل lindhu (زلزال) كبير في يوجياكارتا. بيوت كتير ambruk (وقعت).
        البيت: joglo = بيت جاوي تقليدي سقفه عالي، gendheng = قرميد، bata = طوب، cagak = عمود.
        relawan = متطوعين، pulih = رجع زي الأول (اتعافى).
      ar: |
        في ٢٧ مايو ٢٠٠٦ وقع lindhu (زلزال) كبير في يوغياكارتا، وambruk (انهارت) بيوت كثيرة.
        البيت: joglo = بيت جاوي تقليدي عالي السقف، gendheng = قرميد، bata = طوب، cagak = عمود.
        relawan = متطوعون، pulih = تعافى وعاد كما كان.
      en: |
        On 27 May 2006 a big lindhu (earthquake) hit Yogyakarta, and many houses ambruk (collapsed).
        The house: joglo = traditional high-roofed Javanese house, gendheng = roof tile, bata = brick, cagak = pillar.
        relawan = volunteers, pulih = recover, be restored.
    examples:
      - text: Taun 2006 ana lindhu gedhe ing Yogya.
        ar_eg: سنة ٢٠٠٦ حصل زلزال كبير في يوجيا.
        ar: عام ٢٠٠٦ وقع زلزال كبير في يوغيا.
        en: In 2006 there was a big earthquake in Yogya.
      - text: Akeh omah joglo ambruk, gendhenge tiba.
        ar_eg: بيوت جوجلو كتير وقعت، والقرميد اتهد.
        ar: انهارت بيوت جوغلو كثيرة وسقط قرميدها.
        en: Many joglo houses collapsed; their roof tiles fell.
      - text: Relawan teka nulungi, saiki kampung wis pulih.
        ar_eg: المتطوعين جم يساعدوا، ودلوقتي الحتة رجعت زي الأول.
        ar: جاء المتطوعون للمساعدة، والآن تعافى الحيّ.
        en: Volunteers came to help; now the neighbourhood has recovered.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: lindhu
        ar_eg: زلزال
        ar: زلزال
        en: earthquake
      - text: ambruk
        ar_eg: وقع، اتهد
        ar: انهار
        en: collapse
      - text: gendheng
        ar_eg: قرميد
        ar: قرميد
        en: roof tile
      - text: bata
        ar_eg: طوب
        ar: طوب
        en: brick
    words: [lindhu, ambruk, gendheng, bata]
  - id: e02
    type: match_pairs
    pairs:
      - text: cagak
        ar_eg: عمود
        ar: عمود
        en: pillar, post
      - text: joglo
        ar_eg: بيت جوجلو
        ar: بيت جوغلو
        en: joglo house
      - text: pulih
        ar_eg: رجع زي الأول
        ar: تعافى
        en: recover
      - text: relawan
        ar_eg: متطوع
        ar: متطوّع
        en: volunteer
    words: [cagak, joglo, pulih, relawan]
  - id: e03
    type: listen
    text: Omahe ambruk nalika lindhu.
    question:
      ar_eg: البيت جراله إيه؟
      ar: ماذا حدث للبيت؟
      en: What happened to the house?
    options: [البيت وقع وقت الزلزال, البيت اتبنى جديد, السقف بيخر]
    answer: 0
    meaning:
      ar_eg: البيت وقع وقت الزلزال.
      ar: انهار البيت أثناء الزلزال.
      en: The house collapsed during the earthquake.
    words: [ambruk, lindhu]
  - id: e04
    type: fill_blank
    sentence: Tembok iki saka ___ abang.
    meaning:
      ar_eg: الحيطة دي من ___ أحمر.
      ar: هذا الجدار من ___ أحمر.
      en: This wall is made of red ___.
    options: [bata, cagak, relawan]
    answers: [bata]
    words: [bata, cagak, relawan]
    explain:
      ar_eg: bata = طوب. cagak = عمود وrelawan = متطوع.
      ar: bata تعني الطوب. أما cagak فعمود وrelawan متطوّع.
      en: bata is brick. cagak is a pillar and relawan is a volunteer.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: البيت الجاوي التقليدي اللي سقفه عالي وفي نصه ٤ عواميد كبار اسمه …
      ar: البيت الجاوي التقليدي العالي السقف ذو الأعمدة الأربعة في وسطه يسمّى …
      en: The traditional Javanese house with a tall roof on four central pillars is a …
    options: [gendheng, joglo, bata]
    answer: 1
    explain:
      ar_eg: joglo = بيت جاوي تقليدي.
      ar: joglo = بيت جاوي تقليدي.
      en: joglo = traditional Javanese house.
    words: [gendheng, joglo, bata]
  - id: e06
    type: fill_blank
    sentence: Omah joglo duwe papat ___ gedhe ing tengah.
    meaning:
      ar_eg: بيت الجوجلو فيه أربع ___ كبار في النص.
      ar: في وسط بيت الجوغلو أربعة ___ كبيرة.
      en: A joglo house has four big ___ in the middle.
    options: [cagak, lindhu, pulih]
    answers: [cagak]
    words: [cagak, lindhu, pulih]
    explain:
      ar_eg: cagak = عمود، والجوجلو ليه أربعة في النص. lindhu = زلزال وpulih = اتعافى.
      ar: cagak عمود، وللجوغلو أربعة في الوسط. أما lindhu فزلزال وpulih تعافى.
      en: cagak is a pillar; a joglo has four in the middle. lindhu is an earthquake and pulih is "recovered".
  - id: e07
    type: multiple_choice
    question: Sawise lindhu, ___ saka ngendi-endi teka nulungi.
    options: [gendheng, ambruk, relawan]
    answer: 2
    explain:
      ar_eg: relawan = متطوعين جم يساعدوا.
      ar: relawan = متطوعون جاؤوا للمساعدة.
      en: relawan = volunteers came to help.
    words: [gendheng, ambruk, relawan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: القرميد وقع وقت الزلزال.
      ar: سقط القرميد أثناء الزلزال.
      en: The roof tiles fell during the earthquake.
    answer: Gendhenge tiba nalika lindhu.
    distractors: [bata, joglo]
    words: [gendheng, lindhu]
    explain:
      ar_eg: gendhenge = القرميد بتاعه، وlindhu = زلزال. bata = طوب وjoglo = نوع بيت، ومش في المعنى.
      ar: gendhenge قرميده وlindhu زلزال. أما bata (طوب) وjoglo (نوع بيت) فليستا في المعنى.
      en: gendhenge is its roof tiles and lindhu is an earthquake. bata (brick) and joglo (house type) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Saiki Kutha Gedhe wis pulih maneh.
    answers_meaning:
      ar_eg: [دلوقتي كوتاجيدي رجعت زي الأول, كوتاجيدي اتعافت خلاص]
      ar: [تعافت كوتاغيدي الآن من جديد, عادت كوتاغيدي الآن كما كانت]
      en: [Kotagede has recovered now, Now Kotagede is back to normal again]
    words: [pulih]
  - id: e10
    type: speaking
    text: Joglo lawas iku ambruk, nanging wis dibangun maneh.
    meaning:
      ar_eg: الجوجلو القديم ده وقع، بس اتبنى تاني.
      ar: انهار ذلك الجوغلو القديم، لكنه أُعيد بناؤه.
      en: That old joglo collapsed, but it's been rebuilt.
    words: [joglo, ambruk]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, kula mireng wonten lindhu ageng ing taun 2006.
      ar_eg: يا عم، سمعت إن كان فيه زلزال كبير سنة ٢٠٠٦.
      ar: يا سيدي، سمعت أنه وقع زلزال كبير عام ٢٠٠٦.
      en: Sir, I heard there was a big earthquake in 2006.
    - speaker: Pak Slamet
      text: Leres, Mas. Kathah griya ambruk, kalebet joglo-joglo lawas.
      ar_eg: صح. بيوت كتير وقعت، ومنها بيوت جوجلو قديمة.
      ar: صحيح. انهارت بيوت كثيرة، منها بيوت جوغلو قديمة.
      en: Yes. Many houses collapsed, old joglos among them.
    - speaker: Mohamed
      text: Bengkel panjenengan ugi?
      ar_eg: وورشة حضرتك كمان؟
      ar: وورشتك أيضًا؟
      en: Your workshop too?
    - speaker: Pak Slamet
      text: Inggih. Gendhengipun dhawah sedaya, namung cagakipun ingkang taksih ngadeg.
      ar_eg: أيوه. القرميد كله وقع، والعواميد بس هي اللي فضلت واقفة.
      ar: نعم. سقط القرميد كله، ولم تبقَ إلا الأعمدة واقفة.
      en: Yes. All the roof tiles fell; only the pillars stayed standing.
    - speaker: Mohamed
      text: Lajeng sinten ingkang mbiyantu?
      ar_eg: ومين اللي ساعد؟
      ar: ومن ساعد؟
      en: Who helped?
    - speaker: Pak Slamet
      text: Relawan saking pundi-pundi. Sapunika sampun pulih.
      ar_eg: متطوعين من كل حتة. ودلوقتي رجعت زي الأول.
      ar: متطوعون من كل مكان. والآن تعافت.
      en: Volunteers from everywhere. Now it's recovered.
