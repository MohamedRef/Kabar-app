  - id: e03
    type: listen
    text: Angsal nawar, Bu?
    question:
      ar_eg: بيسأل عن إيه؟
      ar: عمّ يسأل؟
      en: What is he asking?
    options: [ينفع أفاصل؟, فيه خصم؟, ينفع بالكارت؟]
    answer: 0
    meaning:
      ar_eg: ينفع أفاصل يا طنط؟
      ar: هل يمكنني المساومة يا سيدتي؟
      en: Can I bargain, ma'am?
    words: [nawar]
  - id: e04
    type: fill_blank
    sentence: Kripik tempe setunggal ___, pinten?
    meaning:
      ar_eg: ___ شيبسي تمبيه واحدة بكام؟
      ar: كم سعر ___ واحدة من رقائق التمبيه؟
      en: How much is one ___ of tempe crisps?
    options: [kotak, lombok, nawar]
    answers: [kotak]
    words: [kotak, lombok, nawar, kripik]
    explain:
      ar_eg: "kotak = علبة: علبة شيبسي واحدة. lombok = شطة، وnawar = يفاصل."
      ar: "kotak تعني علبة: علبة واحدة من الرقائق. أما lombok ففلفل حار، وnawar يساوم."
      en: "kotak is \"box\": one box of crisps. lombok is \"chilli\", and nawar is \"haggle\"."
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إيه اللي بيخلّي الأكل حرّاق؟
      ar: ما الذي يجعل الطعام حارًّا؟
      en: What makes food spicy?
    options: [bakpia, kertas, lombok]
    answer: 2
    explain:
      ar_eg: lombok = شطة، فلفل حار.
      ar: lombok = فلفل حار.
      en: lombok = chilli.
    words: [bakpia, kertas, lombok]
  - id: e06
    type: fill_blank
    sentence: Dinten menika wonten ___ sedasa persen.
    meaning:
      ar_eg: النهارده فيه ___ عشرة في المية.
      ar: اليوم يوجد ___ عشرة في المئة.
      en: Today there's a ten per cent ___.
    options: [diskon, kartu, dompet]
    answers: [diskon]
    words: [diskon, kartu, dompet]
    explain:
      ar_eg: diskon = خصم، عشرة في المية. kartu = كارت، وdompet = محفظة.
      ar: diskon تعني تخفيض بعشرة في المئة. أما kartu فبطاقة، وdompet محفظة.
      en: diskon is "discount", ten per cent. kartu is "card", and dompet is "wallet".
  - id: e07
    type: build_sentence
    source:
      ar_eg: ينفع أدفع بالكارت؟
      ar: هل يمكنني الدفع بالبطاقة؟
      en: Can I pay by card?
    answer: Mbayar ngangge kartu angsal?
    distractors: [kotak, kertas]
    words: [kartu]
    explain:
      ar_eg: ngangge kartu = بالكارت، وangsal = ينفع. kotak = علبة، وkertas = ورق.
      ar: ngangge kartu تعني بالبطاقة، وangsal يجوز. أما kotak فعلبة، وkertas ورق.
      en: ngangge kartu is "by card", angsal "may". kotak is "box", and kertas is "paper".
  - id: e08
    type: translate
    direction: from_target
    source_text: Bakpia lan kripik ing kotak kertas.
    answers_meaning:
      ar_eg: [البقبيا والشيبسي في علبة ورق, البقبيا والشيبسي جوه علبة كرتون]
      ar: [البقبيا والرقائق في علبة ورقية]
      en: [The bakpia and crisps are in a paper box, Bakpia and crisps in a cardboard box]
    words: [bakpia, kripik, kotak, kertas]
  - id: e09
    type: speaking
    text: Bu, angsal nawar? Wonten diskon?
    meaning:
      ar_eg: يا طنط، ينفع أفاصل؟ فيه خصم؟
      ar: يا سيدتي، هل أساوم؟ هل هناك خصم؟
      en: Ma'am, can I bargain? Is there a discount?
    words: [nawar, diskon]
  - id: e10
    type: multiple_choice
    question: Kripik menika pedhes, wonten ___.
    options: [dompet, lombok, diskon]
    answer: 1
    explain:
      ar_eg: lombok = شطة، عشان كده حرّاق.
      ar: lombok = فلفل حار، ولذلك هي حارّة.
      en: lombok = chilli, so they're spicy.
    words: [lombok, dompet, kripik]
dialogue:
  lines:
    - speaker: Mohamed
      text: Bu, kripik tempe setunggal kotak pinten?
      ar_eg: يا طنط، علبة شيبسي التمبيه بكام؟
      ar: يا سيدتي، كم سعر علبة رقائق التمبيه؟
      en: Ma'am, how much is a box of tempe crisps?
    - speaker: Bakul
      text: "Kalih dasa, Mas."
      ar_eg: "عشرين (ألف) يا أستاذ."
      ar: "عشرون (ألفًا)."
      en: "Twenty (thousand)."
    - speaker: Mohamed
      text: Wah, awis. Angsal nawar, Bu?
      ar_eg: ياه، غالية. ينفع أفاصل يا طنط؟
      ar: إنها غالية. هل يمكنني المساومة يا سيدتي؟
      en: Ooh, pricey. Can I bargain, ma'am?
    - speaker: Bakul
      text: "Nek tumbas tiga, wonten diskon."
      ar_eg: "لو خدت تلاتة، فيه خصم."
      ar: "إن اشتريت ثلاثًا فهناك خصم."
      en: "Buy three and there's a discount."
    - speaker: Mohamed
      text: Inggih, tiga, kaliyan bakpia setunggal kotak. Mbayar ngangge kartu angsal?
      ar_eg: ماشي، تلاتة وعلبة بقبيا. ينفع بالكارت؟
      ar: حسنًا، ثلاث وعلبة بقبيا. هل يمكن الدفع بالبطاقة؟
      en: OK, three, and a box of bakpia. Can I pay by card?
    - speaker: Bakul
      text: "Angsal, Mas. Tak bungkus kertas, nggih."
      ar_eg: "ينفع يا أستاذ. هلفّهملك في ورق."
      ar: "نعم. سألفّها لك بالورق."
      en: "Sure. I'll wrap them in paper for you."
