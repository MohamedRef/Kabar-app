schema: kabar.lesson/v1
id: j3.u05.l06
language: jv
title: Oleh-oleh saking Jogja
can_do:
  ar_eg: 'تشتري هدايا أكل من يوجيا: تفاصل، وتسأل عن الخصم، وتدفع بالكارت.'
  ar: 'أن تشتري هدايا طعام من يوجيا: تساوم، وتسأل عن الخصم، وتدفع بالبطاقة.'
  en: 'Buy food souvenirs in Jogja: bargain, ask about a discount and pay by card.'
slides:
  - title: Angsal nawar?
    body:
      ar_eg: |
        هدايا أكل من السوق: kripik = شيبسي (kripik tempe مشهور)، bakpia = فطيرة صغيرة محشية فول (هدية مشهورة)، lombok = شطة، فلفل حار.
        kotak = علبة، kertas = ورق، dompet = محفظة.
        nawar = يفاصل (من tawar): «Angsal nawar, Bu?» = ينفع أفاصل؟
        diskon = خصم. kartu = كارت: «Mbayar ngangge kartu angsal?» = ينفع أدفع بالكارت؟
      ar: |
        هدايا طعام من السوق: kripik = رقائق مقرمشة (kripik tempe مشهورة)، bakpia = فطيرة صغيرة محشوة بالفول (هدية مشهورة)، lombok = فلفل حار.
        kotak = علبة، kertas = ورق، dompet = محفظة.
        nawar = يساوم (من tawar): «Angsal nawar, Bu?» = هل يمكنني المساومة؟
        diskon = خصم. kartu = بطاقة: «Mbayar ngangge kartu angsal?» = هل يمكنني الدفع بالبطاقة؟
      en: |
        Food souvenirs from the market: kripik = crisps (kripik tempe is famous), bakpia = small bean-filled pastries (a classic souvenir), lombok = chilli.
        kotak = box, kertas = paper, dompet = wallet.
        nawar = bargain (from tawar): "Angsal nawar, Bu?" = can I bargain?
        diskon = discount. kartu = card: "Mbayar ngangge kartu angsal?" = can I pay by card?
    examples:
      - text: Kripik tempe setunggal kotak, pinten?
        ar_eg: علبة شيبسي تمبيه بكام؟
        ar: كم سعر علبة رقائق التمبيه؟
        en: How much is a box of tempe crisps?
      - text: Angsal nawar, Bu? Wonten diskon?
        ar_eg: ينفع أفاصل يا طنط؟ فيه خصم؟
        ar: هل يمكنني المساومة يا سيدتي؟ هل هناك خصم؟
        en: Can I bargain, ma'am? Is there a discount?
      - text: Mbayar ngangge kartu angsal?
        ar_eg: ينفع أدفع بالكارت؟
        ar: هل يمكنني الدفع بالبطاقة؟
        en: Can I pay by card?
