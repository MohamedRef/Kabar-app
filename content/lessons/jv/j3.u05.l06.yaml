      ar_eg: lombok = شطة، عشان كده حرّاق.
      ar: lombok = فلفل حار، ولذلك هي حارّة.
      en: lombok = chilli, so they're spicy.
    words: [lombok, kartu, kripik]
dialogue:
  lines:
    - speaker: Mohamed
      text: Bu, kripik tempe setunggal kotak pinten?
      ar_eg: يا طنط، علبة شيبسي التمبيه بكام؟
      ar: يا سيدتي، كم سعر علبة رقائق التمبيه؟
      en: Ma'am, how much is a box of tempe crisps?
    - speaker: Bakul
      text: Kalih dasa ewu, Mas.
      ar_eg: عشرين ألف يا أستاذ.
      ar: عشرون ألفًا.
      en: Twenty thousand.
    - speaker: Mohamed
      text: Wah, awis. Angsal nawar, Bu?
      ar_eg: ياه، غالية. ينفع أفاصل يا طنط؟
      ar: إنها غالية. هل يمكنني المساومة يا سيدتي؟
      en: Ooh, pricey. Can I bargain, ma'am?
    - speaker: Bakul
      text: Menawi tumbas tiga, wonten diskon.
      ar_eg: لو اشتريت تلاتة، فيه خصم.
      ar: إن اشتريت ثلاثًا فهناك خصم.
      en: If you buy three, there's a discount.
    - speaker: Mohamed
      text: Inggih, tiga, kaliyan kacang setunggal. Mbayar ngangge kartu angsal?
      ar_eg: ماشي، تلاتة وعلبة سوداني. ينفع بالكارت؟
      ar: حسنًا، ثلاث وعلبة فول سوداني. هل يمكن الدفع بالبطاقة؟
      en: OK, three, and one peanuts. Can I pay by card?
    - speaker: Bakul
      text: Angsal, Mas. Kula bungkus ngangge kertas.
      ar_eg: ينفع يا أستاذ. هلفّهم في ورق.
      ar: نعم. سألفّها بالورق.
      en: Sure. I'll wrap them in paper.
