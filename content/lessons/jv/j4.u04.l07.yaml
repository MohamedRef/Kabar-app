schema: kabar.lesson/v1
id: j4.u04.l07
language: jv
title: Sowan Bu Ningsih
can_do:
  ar_eg: تقرا حكاية زيارة كاملة بالكراما وتحكيها لصاحبك بالنغوكو.
  ar: أن تقرأ قصة زيارة كاملة بالكراما وترويها لصديقك بالنغوكو.
  en: Read the story of a whole visit in krama and retell it to a friend in ngoko.
slides:
  - title: Buku harian Mohamed
    body:
      ar_eg: |
        محمد كتب في مذكراته بالكراما عن زيارته لـ Bu Ningsih، من الباب لحد ما مشي.
        خد بالك: هو بيـ sowan وبيـ matur (تواضع)، وBu Ningsih بتـ ngendika (تبجيل)، وجوه الكلام العبارات الثابتة اللي عرفتها.
      ar: |
        كتب محمد في يومياته بالكراما عن زيارته لـ Bu Ningsih، من الباب حتى الانصراف.
        لاحظ: هو يـ sowan ويـ matur (تواضع)، وBu Ningsih تـ ngendika (تبجيل)، وفي الكلام العبارات الثابتة التي تعرفها.
      en: |
        Mohamed wrote in his diary, in krama, about his visit to Bu Ningsih, from the door to the goodbye.
        Notice: he sowan and matur (humble), Bu Ningsih ngendika (honorific), and the set phrases you know sit inside.
    grammar: jv.etiquette.phrases
    examples:
      - text: Sonten kula sowan dhateng dalemipun Bu Ningsih. Kula matur, «Kula nuwun!»
        ar_eg: العصر زرت Bu Ningsih في بيتها. قلت «Kula nuwun!»
        ar: في المساء زرتُ Bu Ningsih في بيتها، وقلت «Kula nuwun!»
        en: In the afternoon I called on Bu Ningsih at her home. I said, "Kula nuwun!"
      - text: Bu Ningsih ngendika, «Mangga pinarak, Mas.» Lajeng Bu Ningsih damel teh.
        ar_eg: Bu Ningsih قالت «اتفضل ادخل يا محمد.» وبعدين عملت شاي.
        ar: قالت Bu Ningsih «تفضّل بالدخول يا محمد.» ثم أعدّت الشاي.
        en: Bu Ningsih said, "Please come in." Then she made tea.
      - text: Kula nyuwun pamit jam pitu. Bu Ningsih ngendika, «Ngatos-atos.»
        ar_eg: استأذنت الساعة سبعة. Bu Ningsih قالت «خلّي بالك.»
        ar: استأذنتُ في الانصراف في السابعة، فقالت Bu Ningsih «انتبه.»
        en: I took my leave at seven. Bu Ningsih said, "Take care."
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: Bu Ningsih عملت إيه؟
      ar: ماذا أعدّت Bu Ningsih؟
      en: What did Bu Ningsih make?
    options: [kopi, teh, bakpia]
    answer: 1
    explain:
      ar_eg: «Lajeng Bu Ningsih damel teh» = وبعدين عملت شاي.
      ar: «Lajeng Bu Ningsih damel teh» = ثم أعدّت الشاي.
      en: '"Lajeng Bu Ningsih damel teh" = then she made tea.'
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: محمد مشي الساعة كام؟
      ar: في أي ساعة انصرف محمد؟
      en: What time did Mohamed leave?
    options: [jam gangsal, jam enem, jam pitu]
    answer: 2
    explain:
      ar_eg: «Kula nyuwun pamit jam pitu» = استأذنت الساعة سبعة.
      ar: «Kula nyuwun pamit jam pitu» = استأذنتُ في السابعة.
      en: '"Kula nyuwun pamit jam pitu" = I took my leave at seven.'
    words: [nyuwun pamit]
  - id: e03
    type: listen
    text: Bu Ningsih ngendika, «Mangga pinarak, Mas.» Lajeng Bu Ningsih damel teh.
    question:
      ar_eg: Bu Ningsih قالت إيه لما محمد وصل؟
      ar: ماذا قالت Bu Ningsih حين وصل محمد؟
      en: What did Bu Ningsih say when Mohamed arrived?
    options: ['Mangga pinarak, Mas.', 'Ngatos-atos, Mas.', 'Sugeng tindak, Mas.']
    answer: 0
    meaning:
      ar_eg: Bu Ningsih قالت «اتفضل ادخل يا محمد.» وبعدين عملت شاي.
      ar: قالت Bu Ningsih «تفضّل بالدخول يا محمد.» ثم أعدّت الشاي.
      en: Bu Ningsih said, "Please come in." Then she made tea.
    words: [pinarak]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: Bu Ningsih قامت تعمل شاي. محمد كان المفروض يقول إيه؟
      ar: قامت Bu Ningsih لتعدّ الشاي. ماذا كان على محمد أن يقول؟
      en: Bu Ningsih got up to make tea. What should Mohamed have said?
    options: ['Sampun cekap, Bu.', 'Sampun repot-repot, Bu.', 'Nyuwun pangapunten, Bu.']
    answer: 1
    explain:
      ar_eg: قبل ما تتعب نفسها - Sampun repot-repot. Sampun cekap بعد ما تشبع.
      ar: قبل أن تتكلّف - Sampun repot-repot، أما Sampun cekap فبعد الشبع.
      en: Before she goes to trouble, Sampun repot-repot. Sampun cekap is for when you've had enough.
    words: [sampun repot-repot]
  - id: e05
    type: match_pairs
    pairs:
      - text: sowan
        ar_eg: يزور حد كبير (تواضع)
        ar: يزور كبيرًا (تواضع)
        en: call on an elder (humble)
      - text: pinarak
        ar_eg: اتفضل ادخل (للضيف)
        ar: تفضّل بالدخول (للضيف)
        en: come in, stop by (to a guest)
      - text: nyuwun pamit
        ar_eg: يستأذن يمشي
        ar: يستأذن في الانصراف
        en: take your leave
      - text: ngatos-atos
        ar_eg: خلّي بالك
        ar: انتبه
        en: take care
      - text: ngendika
        ar_eg: يقول (للكبير)
        ar: يقول (للكبير)
        en: say (of an elder)
    words: [sowan, pinarak, nyuwun pamit, ngatos-atos, ngendika]
  - id: e06
    type: fill_blank
    sentence: Sonten kula ___ dhateng dalemipun Bu Ningsih.
    meaning:
      ar_eg: العصر زرت Bu Ningsih في بيتها.
      ar: في المساء زرتُ Bu Ningsih في بيتها.
      en: In the afternoon I called on Bu Ningsih at her home.
    options: [rawuh, sowan, kondur]
    answers: [sowan]
    explain:
      ar_eg: إنت اللي بتزور حد كبير، يبقى sowan. rawuh وkondur للكبير.
      ar: أنت تزور كبيرة فتقول sowan، وrawuh وkondur للكبير.
      en: You're visiting an elder, so sowan. rawuh and kondur are for the elder.
    words: [sowan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: استأذنت ومشيت الساعة سبعة.
      ar: استأذنتُ في الانصراف في الساعة السابعة.
      en: I took my leave at seven o'clock.
    answers:
      - Kula nyuwun pamit jam pitu.
      - Jam pitu kula nyuwun pamit.
    words: [nyuwun pamit]
  - id: e08
    type: dictation
    text: Lajeng Bu Ningsih damel teh.
    meaning:
      ar_eg: وبعدين Bu Ningsih عملت شاي.
      ar: ثم أعدّت Bu Ningsih الشاي.
      en: Then Bu Ningsih made tea.
dialogue:
  title: Crita kanggo Mas Dimas
  lines:
    - speaker: Mas Dimas
      text: Piye, wingi sowan Bu Ningsih?
      ar_eg: إيه الأخبار، زيارة امبارح لـ Bu Ningsih كانت عاملة إزاي؟
      ar: كيف كانت زيارتك لـ Bu Ningsih أمس؟
      en: So, how was your visit to Bu Ningsih yesterday?
    - speaker: Mohamed
      text: Apik, Mas. Bu Ningsih nggawe teh.
      ar_eg: حلوة يا Dimas. Bu Ningsih عملت شاي.
      ar: جميلة يا Dimas. أعدّت Bu Ningsih الشاي.
      en: Good. Bu Ningsih made tea.
    - speaker: Mas Dimas
      text: Kowe ngomong «Sampun repot-repot»?
      ar_eg: قلت «Sampun repot-repot»؟
      ar: هل قلت «Sampun repot-repot»؟
      en: Did you say "Sampun repot-repot"?
    - speaker: Mohamed
      text: Iya! Lan aku nyuwun pamit jam pitu.
      ar_eg: أيوه! واستأذنت ومشيت الساعة سبعة.
      ar: نعم! واستأذنتُ في الانصراف في السابعة.
      en: Yes! And I took my leave at seven.
    - speaker: Mas Dimas
      text: Apik tenan, Mohamed!
      ar_eg: جامد أوي يا محمد!
      ar: رائع حقًا يا محمد!
      en: Really good, Mohamed!
