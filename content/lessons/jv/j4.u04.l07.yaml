schema: kabar.lesson/v1
id: j4.u04.l07
language: jv
title: Unggah-Ungguh Simulator
can_do:
  ar_eg: تعدّي خمس مواقف على مقياس الاحترام.
  ar: أن تجتاز خمسة مواقف على مقياس الاحترام.
  en: Pass five situations on the Respect Meter.
slides:
  - title: Lima kahanan
    body:
      ar_eg: |
        زيارة كاملة عند Bu Ningsih في خمس مواقف:
        ١. على الباب: Kula nuwun! ← Mangga, mangga pinarak.
        ٢. «Pripun kabaripun?» ← Pangestunipun, sae.
        ٣. جايبة أكل: Sampun repot-repot. وبعد الأكل: Sampun cekap, matur nuwun.
        ٤. معدّي قدام الكبار: توطّي، الإيد اليمين لتحت: Nuwun sewu, ndherek langkung.
        ٥. ماشي: Kula nyuwun pamit rumiyin ← Sugeng tindak / Ngatos-atos.
        وفي آخر الدرس جرّب مشهد الجار الكبير في Unggah-Ungguh Simulator.
      ar: |
        زيارة كاملة عند Bu Ningsih في خمسة مواقف:
        ١. عند الباب: Kula nuwun! ← Mangga, mangga pinarak.
        ٢. «Pripun kabaripun?» ← Pangestunipun, sae.
        ٣. إذا قدّمت طعامًا: Sampun repot-repot، وبعد الأكل: Sampun cekap, matur nuwun.
        ٤. عند المرور أمام الكبار: انحناء واليد اليمنى إلى أسفل: Nuwun sewu, ndherek langkung.
        ٥. عند الانصراف: Kula nyuwun pamit rumiyin ← Sugeng tindak / Ngatos-atos.
        وفي آخر الدرس جرّب مشهد الجار الكبير في Unggah-Ungguh Simulator.
      en: |
        A full visit to Bu Ningsih in five situations:
        1. At the door: Kula nuwun! → Mangga, mangga pinarak.
        2. "Pripun kabaripun?" → Pangestunipun, sae.
        3. Food arrives: Sampun repot-repot. After eating: Sampun cekap, matur nuwun.
        4. Passing seated elders: stoop, right hand lowered: Nuwun sewu, ndherek langkung.
        5. Leaving: Kula nyuwun pamit rumiyin → Sugeng tindak / Ngatos-atos.
        At the end, try the older neighbour scene in the Unggah-Ungguh Simulator.
    grammar: jv.etiquette.phrases
    examples:
      - text: Kula nuwun! — Mangga, mangga pinarak.
        ar_eg: يا أهل الدار! — اتفضل، اتفضل ادخل.
        ar: يا أهل الدار! — تفضّل، تفضّل بالدخول.
        en: Hello, anyone home? — Come in, please come in.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: (الموقف ١) وصلت باب Bu Ningsih. تقول إيه؟
      ar: (الموقف ١) وصلت إلى باب Bu Ningsih. ماذا تقول؟
      en: (Situation 1) You reach Bu Ningsih's door. What do you say?
    options: ['Kula nuwun!', 'Mangga!', 'Nuwun sewu, ndherek langkung.']
    answer: 0
    words: [kula nuwun]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: (الموقف ٢) سألتك «Pripun kabaripun?». أنهي رد فيه احترام أكتر؟
      ar: (الموقف ٢) سألتك «Pripun kabaripun?». أي جواب أكثر احترامًا؟
      en: (Situation 2) She asks "Pripun kabaripun?". Which reply shows the most respect?
    options: ['Apik wae, Bu.', 'Sae, Bu.', 'Pangestunipun, sae, Bu.']
    answer: 2
    explain:
      ar_eg: Sae مؤدبة، بس Pangestunipun بتضيف «بدعواتك» فبتكرّمها. Apik wae نغوكو.
      ar: Sae مهذبة، لكن Pangestunipun تضيف «بدعائك» فتكرّمها، وApik wae نغوكو.
      en: Sae is polite, but Pangestunipun adds "thanks to your blessing", which honours her. Apik wae is ngoko.
    words: [pangestunipun]
  - id: e03
    type: listen
    text: Mangga, mangga pinarak, Mas.
    options: ['Mangga, mangga pinarak, Mas.', 'Mangga, mangga lenggah, Mas.', 'Kula nuwun, Mas.']
    answer: 0
    meaning:
      ar_eg: اتفضل، اتفضل ادخل يا ابني.
      ar: تفضّل، تفضّل بالدخول يا بني.
      en: Come in, please come in.
    words: [pinarak]
  - id: e04
    type: fill_blank
    sentence: Sampun ___, Bu.
    meaning:
      ar_eg: (الموقف ٣) ماتتعبيش نفسك يا هانم.
      ar: (الموقف ٣) لا تتكلّفي يا سيدتي.
      en: (Situation 3) Please don't go to any trouble, ma'am.
    answers: [repot-repot]
    words: [sampun repot-repot]
  - id: e05
    type: fill_blank
    sentence: Nuwun sewu, ___ langkung.
    meaning:
      ar_eg: (الموقف ٤) لا مؤاخذة، بعد إذنكم أعدّي.
      ar: (الموقف ٤) عفوًا، بعد إذنكم أمرّ.
      en: (Situation 4) Excuse me, may I pass?
    answers: [ndherek]
    words: [ndherek langkung]
  - id: e06
    type: build_sentence
    source:
      ar_eg: (الموقف ٥) أستأذن أنا يا هانم.
      ar: (الموقف ٥) أستأذنكِ في الانصراف يا سيدتي.
      en: (Situation 5) Please excuse me, I'll be going, ma'am.
    answer: Kula nyuwun pamit rumiyin, Bu.
    distractors: [kondur, matur]
    words: [nyuwun pamit]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بعد الأكل) كفاية كده، متشكر أوي يا هانم.
      ar: (بعد الأكل) يكفي، شكرًا جزيلًا يا سيدتي.
      en: (after eating) That's plenty, thank you very much, ma'am.
    answers: ['Sampun cekap, matur nuwun sanget, Bu.', 'Sampun cekap, Bu, matur nuwun sanget.', 'Sampun cekap, Bu. Matur nuwun sanget.', 'Sampun cekap, matur nuwun, Bu.', 'Sampun cekap, Bu. Matur nuwun.']
    words: [cekap]
  - id: e08
    type: dictation
    text: Nyuwun pangapunten, kula mboten ngertos.
    meaning:
      ar_eg: أنا آسف جدًا، أنا مش فاهم.
      ar: أرجو المعذرة، لا أفهم.
      en: I'm so sorry, I don't understand.
    words: [nyuwun pangapunten]
  - id: e09
    type: speaking
    text: Kula nyuwun pamit rumiyin. Matur nuwun sanget, Bu.
    meaning:
      ar_eg: أستأذن أنا. متشكر أوي يا هانم.
      ar: أستأذنكِ في الانصراف. شكرًا جزيلًا يا سيدتي.
      en: Please excuse me, I'll be going. Thank you very much, ma'am.
    words: [nyuwun pamit]
dialogue:
  title: Sowan Bu Ningsih
  lines:
    - speaker: Mohamed
      text: Kula nuwun!
      ar_eg: يا أهل الدار!
      ar: يا أهل الدار!
      en: Hello, anyone home?
    - speaker: Bu Ningsih
      text: Mangga, Mas. Mangga pinarak.
      ar_eg: اتفضل يا ابني. اتفضل ادخل.
      ar: تفضّل يا بني. تفضّل بالدخول.
      en: Come in. Please come in.
    - speaker: Bu Ningsih
      text: Kula damelaken teh rumiyin.
      ar_eg: هعملك شاي الأول.
      ar: سأعدّ لك الشاي أولًا.
      en: Let me make you some tea first.
    - speaker: Mohamed
      text: Sampun repot-repot, Bu.
      ar_eg: ماتتعبيش نفسك يا هانم.
      ar: لا تتكلّفي يا سيدتي.
      en: Please don't go to any trouble, ma'am.
    - speaker: Mohamed
      text: Kula nyuwun pamit rumiyin, Bu. Matur nuwun sanget.
      ar_eg: أستأذن أنا يا هانم. متشكر أوي.
      ar: أستأذنكِ يا سيدتي. شكرًا جزيلًا.
      en: Please excuse me, ma'am. Thank you very much.
    - speaker: Bu Ningsih
      text: Inggih, Mas. Ngatos-atos.
      ar_eg: ماشي يا ابني. خلّي بالك من نفسك.
      ar: حسنًا يا بني. انتبه لنفسك.
      en: All right. Take care.
game: uu.elder
