  - id: e03
    type: listen
    text: Bu Ningsih grapyak sanget.
    question:
      ar_eg: بو نينجسيه عاملة إزاي؟
      ar: كيف هي بو نينغسيه؟
      en: What is Bu Ningsih like?
    options: [ودودة أوي, زعلانة, تعبانة]
    answer: 0
    meaning:
      ar_eg: بو نينجسيه ودودة أوي.
      ar: بو نينغسيه ودودة جدًّا.
      en: Bu Ningsih is very friendly.
    words: [grapyak]
  - id: e04
    type: fill_blank
    sentence: Mas Dimas ___ banget, esuk-esuk wis tangi.
    meaning:
      ar_eg: ماس ديماس ___ أوي، صاحي من الصبح بدري.
      ar: ماس ديماس ___ جدًّا، يستيقظ مبكّرًا.
      en: Mas Dimas is very ___; he's up early.
    options: [sregep, cetha, grapyak]
    answers: [sregep]
    words: [sregep, cetha, grapyak]
    explain:
      ar_eg: "صاحي من بدري يبقى شغّال: sregep. cetha يعني واضح، وgrapyak ودود."
      ar: "يستيقظ مبكّرًا فهو مجتهد: sregep، أما cetha فمعناه واضح، وgrapyak ودود."
      en: "Up early means hard-working: sregep. cetha means \"clear\", grapyak \"friendly\"."
  - id: e05
    type: multiple_choice
    question: Bocah enom sing ngladeni dhayoh, jenenge ___.
    question_meaning:
      ar_eg: الشباب اللي بيخدموا الضيوف اسمهم ___.
      ar: الشباب الذين يخدمون الضيوف اسمهم ___.
      en: The young people who serve the guests are called ___.
    options: [sinoman, rewang, cetha]
    answer: 0
    explain:
      ar_eg: sinoman = الشباب اللي بيخدموا الضيوف. rewang = اللي بيساعد في المطبخ والشغل.
      ar: sinoman = الشباب الذين يخدمون الضيوف، أمّا rewang فالمساعد في المطبخ والعمل.
      en: sinoman = the young people serving guests. rewang = helping with the cooking and work.
    words: [sinoman, rewang, cetha]
  - id: e06
    type: fill_blank
    sentence: Aku arep ___ neng omahe Bu Ningsih.
    meaning:
      ar_eg: أنا رايح ___ في بيت بو نينجسيه.
      ar: سأذهب لـ ___ في بيت بو نينغسيه.
      en: I'm going to ___ at Bu Ningsih's house.
    options: [rewang, nggatekake, sregep]
    answers: [rewang]
    words: [rewang, nggatekake, sregep]
    explain:
      ar_eg: تساعد في مناسبة عند الجيران = rewang. nggatekake ياخد باله، وsregep صفة.
      ar: المساعدة في مناسبة عند الجيران = rewang، أما nggatekake فالانتباه، وsregep صفة.
      en: Helping at a neighbour's event is rewang. nggatekake is paying attention, sregep an adjective.
  - id: e07
    type: build_sentence
    source:
      ar_eg: أنا واخد بالي من كلام بو نينجسيه.
      ar: أنا منتبه لكلام بو نينغسيه.
      en: I'm paying attention to what Bu Ningsih says.
    answer: Aku nggatekake omongane Bu Ningsih.
    distractors: [cetha, sregep]
    words: [nggatekake]
    explain:
      ar_eg: nggatekake = ياخد باله من. cetha واضح، وsregep شغّال، ودول صفات.
      ar: nggatekake = ينتبه إلى، أما cetha فواضح، وsregep مجتهد، وهما صفتان.
      en: nggatekake = pay attention to. cetha "clear" and sregep "hard-working" are adjectives.
  - id: e08
    type: translate
    direction: from_target
    source_text: Omongane Pak Marto cetha banget.
    answers_meaning:
      ar_eg: [كلام پاك مارتو واضح أوي, پاك مارتو كلامه واضح جدًا]
      ar: [كلام باك مارتو واضح جدًّا, يتكلّم باك مارتو بوضوح شديد]
      en: [Pak Marto speaks very clearly, What Pak Marto says is very clear]
    words: [cetha]
  - id: e09
    type: speaking
    text: Kula rewang wonten griyanipun Bu Ningsih.
    meaning:
      ar_eg: أنا بساعد في بيت بو نينجسيه.
      ar: أساعد في بيت بو نينغسيه.
      en: I'm helping out at Bu Ningsih's house.
    words: [rewang]
  - id: e10
    type: multiple_choice
    question: Nuwun sewu, Mas, omonganmu kurang ___.
    question_meaning:
      ar_eg: لا مؤاخذة يا ماس، كلامك مش ___ أوي.
      ar: عذرًا يا ماس، كلامك ليس ___ تمامًا.
      en: Sorry, Mas, what you said isn't quite ___.
    options: [cetha, sregep, grapyak]
    answer: 0
    explain:
      ar_eg: cetha = واضح. sregep مجتهد وgrapyak ودود، ودول للناس.
      ar: cetha = واضح، أمّا sregep (مجتهد) وgrapyak (ودود) فصفات للناس.
      en: cetha = clear. sregep and grapyak describe people.
    words: [cetha, sregep, grapyak, nggatekake]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, sesuk rewang neng omahe Bu Ningsih, ya. Arep ana syukuran.
      ar_eg: يا محمد، بكرة تعالى نساعد في بيت بو نينجسيه. عندها عزومة.
      ar: يا محمد، تعال غدًا نساعد في بيت بو نينغسيه، عندها احتفال.
      en: Mohamed, come and help at Bu Ningsih's tomorrow. She's having a thanksgiving party.
    - speaker: Mohamed
      text: Iya, Mas. Aku ngapa wae?
      ar_eg: ماشي يا ماس. أعمل إيه؟
      ar: حسنًا يا ماس. ماذا أفعل؟
      en: Sure, Mas. What do I do?
    - speaker: Mas Dimas
      text: Kowe dadi sinoman, ngladeni dhayoh. Gatekna Pak Marto wae.
      ar_eg: هتبقى مع الشباب اللي بيخدموا الضيوف. خد بالك من پاك مارتو وبس.
      ar: ستكون مع الشباب الذين يخدمون الضيوف. انتبه إلى باك مارتو فقط.
      en: You'll be with the sinoman, serving the guests. Just watch Pak Marto.
    - speaker: Bu Ningsih
      text: Wah, Mas Mohamed sregep sanget. Matur nuwun sampun rewang.
      ar_eg: يا سلام، ماس محمد شغّال أوي. متشكّرة إنك جيت تساعد.
      ar: ما شاء الله، ماس محمد مجتهد جدًّا. شكرًا لمساعدتك.
      en: My, Mas Mohamed is so hard-working. Thank you for helping.
    - speaker: Mohamed
      text: Sami-sami, Bu. Ibu grapyak sanget dhateng kula.
      ar_eg: العفو يا ماما. حضرتك ودودة أوي معايا.
      ar: عفوًا يا سيدتي. أنتِ ودودة جدًّا معي.
      en: You're welcome, Bu. You've been so kind to me.
    - speaker: Pak Marto
      text: Mas, unjukanipun dhateng pendhapa, nggih. Sampun cetha?
      ar_eg: يا ماس، ودّي المشروبات للبندوبو. واضح؟
      ar: يا ماس، خذ المشروبات إلى البندوبو. واضح؟
      en: Mas, take the drinks to the pendhapa. Clear?
