schema: kabar.lesson/v1
id: j4.u04.l07
language: jv
title: Rewang ing griyanipun Bu Ningsih
can_do:
  ar_eg: تساعد الجيران في مناسبة، وتوصف الناس إنهم ودودين أو شغّالين، وتقول إن الكلام واضح.
  ar: أن تساعد الجيران في مناسبة، وتصف الناس بالودّ أو الاجتهاد، وتقول إن الكلام واضح.
  en: Help the neighbours at a family event, describe people as friendly or hard-working, and say whether something is clear.
slides:
  - title: Rewang, sinoman, grapyak
    body:
      ar_eg: |
        في يوجيا لما حد عنده مناسبة، الجيران كلهم بييجوا يساعدوا ومن غير فلوس:
        - rewang = يساعد في مناسبة عند الجيران (يطبخ، يرصّ الكراسي...). وبرضه: اللي بيساعد.
        - sinoman = الشباب اللي بيقدّموا الأكل والشرب للضيوف في المناسبة.
        - grapyak = ودود، بشوش مع الناس.
        - sregep = شغّال ومجتهد، عكس الكسلان.
        - nggatekake = ياخد باله من، يركّز في.
        - cetha = واضح. «Wis cetha?» = واضح كده؟
      ar: |
        في يوغيا حين تكون عند أحد مناسبة يأتي الجيران كلّهم للمساعدة بلا أجر:
        - rewang = يساعد في مناسبة عند الجيران (يطبخ، يرتّب الكراسي...). وتعني أيضًا: المساعِد.
        - sinoman = الشباب الذين يقدّمون الطعام والشراب للضيوف في المناسبة.
        - grapyak = ودود، بشوش مع الناس.
        - sregep = مجتهد نشيط، عكس الكسول.
        - nggatekake = ينتبه إلى، يركّز على.
        - cetha = واضح. «Wis cetha?» = هل هذا واضح؟
      en: |
        In Jogja, when a family holds an event, the neighbours all come and help for free:
        - rewang = help out at a neighbour's event (cooking, setting out chairs...). Also: the helper.
        - sinoman = the young people who serve guests food and drinks at the event.
        - grapyak = friendly, warm with people.
        - sregep = hard-working, diligent; the opposite of lazy.
        - nggatekake = pay attention to, notice.
        - cetha = clear. "Wis cetha?" = Is that clear?
    examples:
      - text: Aku arep rewang neng omahe Bu Ningsih.
        ar_eg: أنا رايح أساعد في بيت بو نينجسيه.
        ar: سأذهب للمساعدة في بيت بو نينغسيه.
        en: I'm going to help out at Bu Ningsih's house.
      - text: Bu Ningsih grapyak sanget.
        ar_eg: بو نينجسيه ودودة أوي.
        ar: بو نينغسيه ودودة جدًّا.
        en: Bu Ningsih is very friendly.
      - text: Omongane Pak Marto cetha banget.
        ar_eg: كلام پاك مارتو واضح أوي.
        ar: كلام باك مارتو واضح جدًّا.
        en: Pak Marto speaks very clearly.
