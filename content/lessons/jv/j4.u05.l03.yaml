schema: kabar.lesson/v1
id: j4.u05.l03
language: jv
title: Wis wungu, Mbak?
can_do:
  ar_eg: تستخدم أفعال تبجيل أكتر جوه ngoko alus.
  ar: أن تستعمل مزيدًا من أفعال التبجيل داخل ngoko alus.
  en: Use more honorific verbs inside ngoko alus.
slides:
  - title: Tangi → wungu
    body:
      ar_eg: |
        الصبح في بيت دِيماس. يصحى من النوم: tangi (نغوكو، عرفتها في J2) → wungu (krama inggil). مفيش كراما عادية: عن نفسك tangi.
        في ngoko alus بتسأل أختك الكبيرة: «Mbak wis wungu?» = صحيتي يا أبلة؟
        وعن نفسك: «Aku wis tangi.»
        - في الشارع: ra = ora (لأ / مش)، neng = menyang / ing (لـ، في).
      ar: |
        الصباح في بيت ديماس. يستيقظ: tangi (نغوكو، من J2) → wungu (krama inggil)، ولا كراما عادية له، فتقول عن نفسك tangi.
        وفي ngoko alus تسأل أختك الكبرى: «Mbak wis wungu?» = هل استيقظتِ؟
        وعن نفسك: «Aku wis tangi.»
        - في كلام الشارع: ra = ora (لا / ليس)، neng = menyang / ing (إلى، في).
      en: |
        Morning at Dimas's house. Wake up: tangi (ngoko, from J2) → wungu (krama inggil). There's no separate krama: about yourself, tangi.
        In ngoko alus you ask your older sister: "Mbak wis wungu?" = Are you up, sis?
        About yourself: "Aku wis tangi."
        - On the street: ra = ora (no, not), neng = menyang / ing (to, at).
    grammar: jv.speechlevel.mixed
    examples:
      - text: Mbak wis wungu?
        ar_eg: صحيتي يا أبلة؟ (ngoko alus)
        ar: هل استيقظتِ يا أختي؟ (ngoko alus)
        en: Are you up, sis? (ngoko alus)
      - text: Aku wis tangi.
        ar_eg: أنا صحيت.
        ar: استيقظتُ.
        en: I'm up.
  - title: Ngagem lan ngasta
    body:
      ar_eg: |
        فعلين كمان بتحطهم للشخص المحترم:
        - يلبس / يستخدم: nganggo (نغوكو، عرفتها) → ngangge (كراما) → ngagem (krama inggil). «Mbak arep ngagem batik?»
        - يجيب / يشيل معاه: nggawa (نغوكو) → mbekta (كراما) → ngasta (krama inggil). «Mbak ngasta payung?»
        ngasta من asta (الإيد) اللي عرفتها. وعن نفسك: «Aku nggawa payung.»
      ar: |
        فعلان آخران للمعظَّم:
        - يلبس / يستعمل: nganggo (نغوكو) → ngangge (كراما) → ngagem (krama inggil): «Mbak arep ngagem batik?»
        - يحمل / يُحضر: nggawa (نغوكو) → mbekta (كراما) → ngasta (krama inggil): «Mbak ngasta payung?»
        وngasta من asta (اليد). وعن نفسك: «Aku nggawa payung.»
      en: |
        Two more verbs to give the person you honour:
        - wear / use: nganggo (ngoko, you know it) → ngangge (krama) → ngagem (krama inggil). "Mbak arep ngagem batik?"
        - bring / carry: nggawa (ngoko) → mbekta (krama) → ngasta (krama inggil). "Mbak ngasta payung?"
        ngasta comes from asta (hand). About yourself: "Aku nggawa payung."
    grammar: jv.speechlevel.mixed
    examples:
      - text: Mbak arep ngagem batik?
        ar_eg: هتلبسي باتيك يا أبلة؟
        ar: هل ستلبسين الباتيك يا أختي؟
        en: Are you wearing batik, sis?
      - text: Mbak ngasta payung?
        ar_eg: واخدة معاكي شمسية يا أبلة؟
        ar: هل تحملين مظلة يا أختي؟
        en: Are you taking an umbrella, sis?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wungu
        ar_eg: يصحى (krama inggil)
        ar: يستيقظ (krama inggil)
        en: wake up (krama inggil)
      - text: ngagem
        ar_eg: يلبس / يستخدم (krama inggil)
        ar: يلبس / يستعمل (krama inggil)
        en: wear, use (krama inggil)
      - text: ngasta
        ar_eg: يجيب / يشيل معاه (krama inggil)
        ar: يحمل / يُحضر (krama inggil)
        en: bring, carry (krama inggil)
      - text: nggawa
        ar_eg: يجيب / يشيل معاه (نغوكو، عن نفسك)
        ar: يحمل / يُحضر (نغوكو، عن النفس)
        en: bring, carry (ngoko, about yourself)
    words: [wungu, ngagem, ngasta, nggawa]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الصبح. تسأل Mbak Ratri صحيت ولا لأ (ngoko alus).
      ar: في الصباح تسأل Mbak Ratri هل استيقظت (ngoko alus).
      en: Morning. You ask Mbak Ratri whether she's up (ngoko alus).
    options: ['Mbak wis tangi?', 'Mbak wis wungu?', 'Mbak sampun tangi?']
    answer: 1
    explain:
      ar_eg: إطار نغوكو (wis) + krama inggil لفعلها (wungu).
      ar: إطار نغوكو (wis) مع krama inggil لفعلها (wungu).
      en: Ngoko frame (wis) + krama inggil for her action (wungu).
    words: [wungu]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: Mbak Ratri سألتك «Kowe wis tangi?». ترد إزاي؟
      ar: سألتك Mbak Ratri «Kowe wis tangi?». بمَ تجيب؟
      en: Mbak Ratri asks "Kowe wis tangi?". What do you answer?
    options: ['Wis, Mbak. Aku wis tangi.', 'Wis, Mbak. Aku wis wungu.', 'Sampun, Mbak. Kula sampun wungu.']
    answer: 0
    explain:
      ar_eg: عن نفسك tangi، حتى في ngoko alus. wungu ليها هي.
      ar: عن نفسك tangi ولو في ngoko alus، وwungu لها.
      en: About yourself, tangi, even in ngoko alus. wungu is for her.
    words: [wungu]
  - id: e04
    type: listen
    text: Mbak arep ngagem batik?
    options: ['Mbak arep nganggo batik?', 'Mbak arep tumbas batik?', 'Mbak arep ngagem batik?']
    answer: 2
    meaning:
      ar_eg: هتلبسي باتيك يا أبلة؟
      ar: هل ستلبسين الباتيك يا أختي؟
      en: Are you wearing batik, sis?
    words: [ngagem]
  - id: e05
    type: fill_blank
    sentence: Mbak, panjenengan ___ payung?
    meaning:
      ar_eg: يا أبلة، واخدة معاكي شمسية؟ (ngoko alus)
      ar: يا أختي، هل تحملين مظلة؟ (ngoko alus)
      en: Sis, are you taking an umbrella? (ngoko alus)
    options: [nggawa, ngasta, mbekta]
    answers: [ngasta]
    explain:
      ar_eg: الشيلة شيلتها هي، يبقى ngasta (krama inggil). nggawa نغوكو، وmbekta كراما عادية.
      ar: الحمل حملها فيكون ngasta، وnggawa نغوكو، وmbekta كراما عادية.
      en: It's her carrying, so ngasta (krama inggil). nggawa is ngoko; mbekta is plain krama.
    words: [ngasta]
  - id: e06
    type: fill_blank
    sentence: Aku ___ payung, Mbak.
    meaning:
      ar_eg: أنا واخد شمسية يا أبلة.
      ar: أنا أحمل مظلة يا أختي.
      en: I've got an umbrella, sis.
    options: [ngasta, nggawa, ngagem]
    answers: [nggawa]
    explain:
      ar_eg: "عن نفسك في ngoko alus: الفعل العادي nggawa."
      ar: "عن نفسك في ngoko alus: الفعل العادي nggawa."
      en: "About yourself in ngoko alus: the plain verb nggawa."
    words: [nggawa]
  - id: e07
    type: build_sentence
    source:
      ar_eg: هتلبسي باتيك النهارده يا أبلة؟
      ar: هل ستلبسين الباتيك اليوم يا أختي؟
      en: Are you wearing batik today, sis?
    answer: Mbak arep ngagem batik dina iki?
    distractors: [nganggo, kowe]
    words: [ngagem]
    explain:
      ar_eg: "ngoko alus مع الأخت الكبيرة: ngagem (krama inggil) جوّه جملة نغوكو. nganggo نغوكو من غير تكريم، وkowe مش لحد أكبر منك."
      ar: "النغوكو ألوس مع الأخت الكبرى: ngagem (krama inggil) داخل جملة نغوكو، أما nganggo فنغوكو بلا تكريم، وkowe لا يقال للأكبر."
      en: "ngoko alus with an older sister: ngagem (krama inggil) inside a ngoko sentence. nganggo carries no honour, and kowe isn't for someone older."
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (ngoko alus، لأختك الكبيرة) أنا واخد شمسية يا أبلة.
      ar: (ngoko alus، للأخت الكبرى) أنا أحمل مظلة يا أختي.
      en: (ngoko alus, to your older sister) I'm bringing an umbrella, sis.
    answers: ['Aku nggawa payung, Mbak.', 'Mbak, aku nggawa payung.', 'Aku arep nggawa payung, Mbak.', 'Mbak, aku arep nggawa payung.']
    words: [nggawa]
  - id: e09
    type: speaking
    text: Mbak, wis wungu? Arep ngasta payung?
    meaning:
      ar_eg: يا أبلة، صحيتي؟ هتاخدي شمسية معاكي؟
      ar: يا أختي، هل استيقظتِ؟ أستحملين مظلة؟
      en: Sis, are you up? Will you take an umbrella?
    words: [wungu, ngasta]
dialogue:
  title: Esuk ing Kotabaru
  lines:
    - speaker: Mas Dimas
      text: Mbak, wis wungu?
      ar_eg: يا أبلة، صحيتي؟
      ar: يا أختي، هل استيقظتِ؟
      en: Sis, are you up?
    - speaker: Mbak Ratri
      text: Wis, Dim. Kowe wis tangi saka mau?
      ar_eg: صحيت يا دِيم. وإنت صاحي من بدري؟
      ar: استيقظتُ يا ديم. وأنت مستيقظ منذ مدة؟
      en: Yes, Dim. Have you been up long?
    - speaker: Mas Dimas
      text: Iya. Mbak arep ngagem batik?
      ar_eg: آه. هتلبسي باتيك يا أبلة؟
      ar: نعم. هل ستلبسين الباتيك يا أختي؟
      en: Yes. Are you wearing batik, sis?
    - speaker: Mbak Ratri
      text: Iya, aku arep neng kantor. Udan ra?
      ar_eg: آه، رايحة الشغل. بتمطر ولا لأ؟
      ar: نعم، سأذهب إلى العمل. هل تمطر؟
      en: Yes, I'm going to the office. Is it raining?
    - speaker: Mas Dimas
      text: Udan, Mbak. Ngasta payung, ya!
      ar_eg: بتمطر يا أبلة. خدي شمسية معاكي!
      ar: إنها تمطر يا أختي. خذي مظلة!
      en: It is, sis. Take an umbrella!
new_words:
  - word: wungu
    pos: verb
    ar_eg: يصحى من النوم (krama inggil؛ عن نفسك tangi)
    ar: يستيقظ (krama inggil؛ وعن النفس tangi)
    en: wake up (krama inggil; about yourself tangi) = bangun
  - word: ngagem
    pos: verb
    ar_eg: يلبس / يستخدم (krama inggil؛ ngoko nganggo، krama ngangge)
    ar: يلبس / يستعمل (krama inggil؛ ngoko nganggo، وkrama ngangge)
    en: wear, use (krama inggil; ngoko nganggo, krama ngangge) = memakai
  - word: ngasta
    pos: verb
    ar_eg: يجيب / يشيل معاه (krama inggil؛ krama mbekta)
    ar: يحمل / يُحضر (krama inggil؛ وkrama mbekta)
    en: bring, carry (krama inggil; krama mbekta) = membawa
  - word: nggawa
    pos: verb
    ar_eg: يجيب / يشيل معاه (نغوكو)
    ar: يحمل / يُحضر (نغوكو)
    en: bring, carry (ngoko) = membawa
