    answers: ["Kancaku mlaku menyang pasar.", kancakumlakumenyangpasar]
    explain:
      ar_eg: kan-ca-ku (pasangan ca) m(pasangan la)-ku me-nyang pa-sar = صاحبي ماشي للسوق.
      ar: kan-ca-ku (pasangan ca) m(pasangan la)-ku me-nyang pa-sar = صديقي يمشي إلى السوق.
      en: kan-ca-ku (pasangan ca) m(pasangan la)-ku me-nyang pa-sar = My friend is walking to the market.
    words: [pasangan]
