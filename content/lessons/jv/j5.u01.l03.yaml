dialogue:
  title: Kutha Sewu Menara
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, Kairo iku kutha gedhe, ta?
      ar_eg: يا محمد، القاهرة مدينة كبيرة، مش كده؟
      ar: يا محمد، القاهرة مدينة كبيرة، أليس كذلك؟
      en: Mohamed, Cairo's a big city, isn't it?
    - speaker: Mohamed
      text: Iya. Kairo kalebu kutha gedhe ing donya.
      ar_eg: آه. القاهرة من المدن الكبيرة في العالم.
      ar: نعم. القاهرة من المدن الكبيرة في العالم.
      en: Yes. Cairo is among the big cities of the world.
    - speaker: Mbak Ayu
      text: Wah, kowe ngomong kaya Wikipedia! Kairo misuwur minangka apa?
      ar_eg: يا سلام، إنت بتتكلم زي ويكيبيديا! والقاهرة مشهورة بإيه؟
      ar: رائع، تتكلم كويكيبيديا! وبمَ تشتهر القاهرة؟
      en: Wow, you talk like Wikipedia! What is Cairo famous as?
    - speaker: Mohamed
      text: Minangka Kutha Sewu Menara. Sewu, kaya Lawang Sewu!
      ar_eg: بإنها «مدينة الألف مئذنة». ألف، زي «لاوانج سيوو» (الألف باب)!
      ar: بوصفها «مدينة الألف مئذنة». ألف، مثل «لاوانغ سيوو» (الألف باب)!
      en: As the City of a Thousand Minarets. A thousand, like Lawang Sewu (a thousand doors)!
