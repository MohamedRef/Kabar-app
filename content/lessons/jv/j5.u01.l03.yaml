schema: kabar.lesson/v1
id: j5.u01.l03
language: jv
title: Minangka lan kalebu
can_do:
  ar_eg: تقرا «بصفته» و«من ضمن» و«واحد من» في مقالة.
  ar: أن تقرأ «بوصفه» و«من ضمن» و«أحد» في مقالة.
  en: Read 'as', 'among' and 'one of' in an article.
slides:
  - title: Minangka = sebagai
    body:
      ar_eg: |
        minangka = sebagai = «بصفته / كـ». المقالة بتستخدمها عشان تقول الحاجة مشهورة بإيه أو بتشتغل إيه.
        في الكلام هتسمع حاجات أبسط، بس في الكتابة minangka في كل حتة.
      ar: |
        minangka = sebagai = «بوصفه / كـ». تستعملها المقالة لتقول بِمَ يُعرف الشيء أو ما دوره.
        وفي الكلام عبارات أبسط، أما الكتابة فمليئة بـ minangka.
      en: |
        minangka = sebagai = "as". Articles use it to say what something is known as, or what role it plays.
        Speech uses simpler words, but writing is full of minangka.
    grammar: jv.reading.written-style
    examples:
      - text: Semarang misuwur minangka Kutha Lumpia.
        ar_eg: سيمارانج مشهورة بإنها «مدينة اللومبيا».
        ar: تشتهر سيمارانج بوصفها «مدينة اللومبيا».
        en: Semarang is famous as the City of Lumpia.
      - text: Kairo misuwur minangka Kutha Sewu Menara.
        ar_eg: القاهرة مشهورة بإنها «مدينة الألف مئذنة».
        ar: تشتهر القاهرة بوصفها «مدينة الألف مئذنة».
        en: Cairo is famous as the City of a Thousand Minarets.
  - title: Kalebu lan sawijining
    body:
      ar_eg: |
        kalebu = termasuk = «من ضمن / يُعتبر من».
        sawijining = salah satu / sebuah = «واحد من / إحدى».
        وكلمة حلوة ليك: donya = العالم، من العربي «دنيا» بالظبط. وmenara من «منارة».
      ar: |
        kalebu = termasuk = «من ضمن / يُعدّ من».
        sawijining = salah satu / sebuah = «أحد / إحدى».
        وكلمة مألوفة لك: donya = العالم، من العربية «دنيا»، وmenara من «منارة».
      en: |
        kalebu = termasuk = "is among, counts as".
        sawijining = salah satu / sebuah = "one of, a".
        And a familiar word: donya = world, from Arabic «دنيا». menara comes from «منارة» too.
    grammar: jv.reading.written-style
    examples:
      - text: Basa Jawa kalebu basa kang akeh penuture ing donya.
        ar_eg: الجاوي من اللغات اللي ليها متكلمين كتير في العالم.
        ar: الجاوية من اللغات الكثيرة المتكلمين في العالم.
        en: Javanese is among the languages with many speakers in the world.
      - text: Semarang iku sawijining kutha gedhe ing Indonesia.
        ar_eg: سيمارانج واحدة من المدن الكبيرة في إندونيسيا.
        ar: سيمارانج إحدى المدن الكبيرة في إندونيسيا.
        en: Semarang is one of the big cities in Indonesia.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: minangka
        ar_eg: بصفته / كـ (= sebagai)
        ar: بوصفه (= sebagai)
        en: as (= sebagai)
      - text: kalebu
        ar_eg: من ضمن (= termasuk)
        ar: من ضمن (= termasuk)
        en: among, counts as (= termasuk)
      - text: sawijining
        ar_eg: واحد من (= salah satu)
        ar: أحد (= salah satu)
        en: one of, a (= salah satu)
      - text: penutur
        ar_eg: متكلم (اللي بيتكلم اللغة)
        ar: متحدّث باللغة
        en: speaker (of a language)
      - text: donya
        ar_eg: الدنيا / العالم
        ar: الدنيا / العالم
        en: the world
    words: [minangka, kalebu, sawijining, penutur, donya]
  - id: e02
    type: multiple_choice
    question: Semarang misuwur minangka Kutha Lumpia.
    question_meaning:
      ar_eg: minangka هنا تساوي أنهي كلمة إندونيسي؟
      ar: minangka هنا تساوي أي كلمة إندونيسية؟
      en: Which Indonesian word is minangka here?
    options: [karena, sebagai, menjadi]
    answer: 1
    words: [minangka]
  - id: e03
    type: multiple_choice
    question: Semarang iku sawijining kutha gedhe ing Indonesia.
    question_meaning:
      ar_eg: sawijining تساوي إيه بالإندونيسي؟
      ar: ما مقابل sawijining بالإندونيسية؟
      en: What is sawijining in Indonesian?
    options: [salah satu, semua, sendiri]
    answer: 0
    words: [sawijining]
  - id: e04
    type: listen
    text: Basa Jawa kalebu basa kang akeh penuture ing donya.
    options:
      - Basa Jawa kalebu basa kang lawas ing donya.
      - Basa Jawa iku basa kang misuwur ing Semarang.
      - Basa Jawa kalebu basa kang akeh penuture ing donya.
    answer: 2
    meaning:
      ar_eg: الجاوي من اللغات اللي ليها متكلمين كتير في العالم.
      ar: الجاوية من اللغات الكثيرة المتكلمين في العالم.
      en: Javanese is among the languages with many speakers in the world.
    words: [kalebu, penutur, donya]
  - id: e05
    type: fill_blank
    sentence: Semarang iku ___ kutha gedhe ing Indonesia.
    meaning:
      ar_eg: سيمارانج واحدة من المدن الكبيرة في إندونيسيا.
      ar: سيمارانج إحدى المدن الكبيرة في إندونيسيا.
      en: Semarang is one of the big cities in Indonesia.
    options: [minangka, sawijining, kalebu]
    answers: [sawijining]
    words: [sawijining]
  - id: e06
    type: fill_blank
    sentence: Basa Jawa ___ basa kang akeh penuture.
    meaning:
      ar_eg: الجاوي من اللغات اللي ليها متكلمين كتير.
      ar: الجاوية من اللغات الكثيرة المتكلمين.
      en: Javanese is among the languages with many speakers.
    options: [saka, ing, kalebu]
    answers: [kalebu]
    explain:
      ar_eg: penuture = penutur + -e = متكلمينها.
      ar: penuture = penutur + -e = متكلموها.
      en: penuture = penutur + -e = its speakers.
    words: [kalebu, penutur]
  - id: e07
    type: build_sentence
    source:
      ar_eg: القاهرة من المدن الكبيرة في العالم.
      ar: القاهرة من المدن الكبيرة في العالم.
      en: Cairo is among the big cities of the world.
    answer: Kairo kalebu kutha gedhe ing donya.
