schema: kabar.lesson/v1
id: j2.u03.l04
language: jv
title: Ulangan J2.3
can_do:
  ar_eg: تتعامل مع الأسعار والباقي.
  ar: أن تتعامل مع الأسعار والباقي.
  en: Handle prices and change.
slides:
  - title: Ringkesan J2.3
    body:
      ar_eg: |
        - 11–19: sewelas، rolas، telulas، patbelas، limalas، nembelas، pitulas، wolulas، sangalas.
        - 21–29 بـ -likur: selikur … patlikur، و25 = selawé، nemlikur … sangalikur.
        - 50 = seket، 60 = sewidak. والباقي: telung puluh، patang puluh، pitung puluh …
        - قبل atus / ewu / kilo شكل الوصل: rong atus، limang atus، telung ewu، telung kilo. وsatus، sewu، sejuta.
        - yuta / juta = مليون. setengah = نص. susuk = الباقي. Kabèh dadi … = الكل …
        - الفصال: Oleh kurang? · … wae, ya? · Ora oleh, wis pas. · Ya wis, oleh.
      ar: |
        - 11–19: sewelas، rolas، telulas، patbelas، limalas، nembelas، pitulas، wolulas، sangalas.
        - 21–29 بـ -likur: selikur … patlikur، و25 = selawé، ثم nemlikur … sangalikur.
        - 50 = seket، و60 = sewidak، والباقي قياسي: telung puluh، patang puluh، pitung puluh …
        - قبل atus / ewu / kilo صيغة الوصل: rong atus، limang atus، telung ewu، telung kilo، ثم satus، sewu، sejuta.
        - yuta / juta = مليون، setengah = نصف، susuk = الباقي، Kabèh dadi … = المجموع …
        - المساومة: Oleh kurang? · … wae, ya? · Ora oleh, wis pas. · Ya wis, oleh.
      en: |
        - 11–19: sewelas, rolas, telulas, patbelas, limalas, nembelas, pitulas, wolulas, sangalas.
        - 21–29 with -likur: selikur … patlikur, 25 = selawé, nemlikur … sangalikur.
        - 50 = seket, 60 = sewidak. The rest: telung puluh, patang puluh, pitung puluh …
        - Before atus / ewu / kilo use linking forms: rong atus, limang atus, telung ewu, telung kilo. And satus, sewu, sejuta.
        - yuta / juta = million. setengah = half. susuk = change. Kabèh dadi … = That comes to …
        - Haggling: Oleh kurang? · … wae, ya? · Ora oleh, wis pas. · Ya wis, oleh.
    grammar: jv.number.full
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rolas
        ar_eg: ١٢
        ar: ١٢
        en: "12"
      - text: nembelas
        ar_eg: ١٦
        ar: ١٦
        en: "16"
      - text: patlikur
        ar_eg: ٢٤
        ar: ٢٤
        en: "24"
      - text: sewidak
        ar_eg: ٦٠
        ar: ٦٠
        en: "60"
      - text: sangang puluh
        ar_eg: ٩٠
        ar: ٩٠
        en: "90"
    words: [rolas, nembelas, patlikur, sewidak, sangang puluh]
  - id: e02
    type: multiple_choice
    question: "13 = ?"
    question_meaning:
      ar_eg: إزاي تقول ١٣؟
      ar: كيف تقول ١٣؟
      en: How do you say 13?
    options: ["telulikur", "telung puluh", "telulas"]
    answer: 2
    words: [telulas]
  - id: e03
    type: multiple_choice
    question: "500.000 = ?"
    question_meaning:
      ar_eg: إزاي تقول ٥٠٠ ألف؟
      ar: كيف تقول ٥٠٠ ألف؟
      en: How do you say 500,000?
    options: ["limalas ewu", "limang atus ewu", "lima atus ewu"]
    answer: 1
    explain:
      ar_eg: قبل atus الشكل limang. وlimalas ewu = 15.000 بس.
      ar: قبل atus تأتي limang، وlimalas ewu = 15.000.
      en: Before atus the form is limang; limalas ewu is only 15,000.
    words: [limang, atus, ewu]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الحساب ٧٥ ألف، وإنت دفعت ١٠٠ ألف. الباقي كام؟
      ar: الحساب ٧٥ ألفًا ودفعتَ ١٠٠ ألف. كم الباقي؟
      en: The bill is 75,000 and you paid 100,000. What's the change?
    options: ["selawé ewu", "limalas ewu", "seket ewu"]
    answer: 0
    words: [susuk, selawé]
  - id: e05
    type: listen
    text: Susuké selawé ewu.
    options: ["Susuké selawé ewu.", "Susuké sewidak ewu.", "Susuké seket ewu."]
    answer: 0
    words: [susuk, selawé]
  - id: e06
    type: fill_blank
    sentence: Bawang putih ___ kilo limalas ewu.
    meaning:
      ar_eg: نص كيلو التوم بخمستاشر ألف.
      ar: نصف كيلو الثوم بخمسة عشر ألفًا.
      en: Half a kilo of garlic is 15,000.
    options: ["rada", "setengah", "akèh"]
    answers: [setengah]
    words: [setengah, bawang putih, limalas]
  - id: e07
    type: fill_blank
    sentence: Regané ___ ewu.
    meaning:
      ar_eg: سعره ستين ألف.
      ar: ثمنه ستون ألفًا.
      en: It costs 60,000.
    answers:
