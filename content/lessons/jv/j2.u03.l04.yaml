schema: kabar.lesson/v1
id: j2.u03.l04
language: jv
title: Bayar, utang, langganan
can_do:
  ar_eg: تدفع وتسأل بكام الحبة، وتقول إن الحاجة خلصت، وتبقى زبون دايم في السوق.
  ar: أن تدفع وتسأل عن سعر القطعة، وتقول إنّ البضاعة نفدت، وتصبح زبونًا دائمًا في السوق.
  en: Pay, ask the price per piece, say something's sold out and become a regular at the market.
slides:
  - title: Langganan
    body:
      ar_eg: |
        bayar = يدفع: Tak bayar saiki = هدفع دلوقتي.
        utang = دين، يستلف: Aku isih utang = لسه عليّا فلوس.
        rugi = خسران. entek = خلص (نفد): Endhoge entek.
        didol = بيتباع (من adol). biji = حبة، حتة: telung biji = تلات حبات.
        langganan = زبون دايم. lengkap = كامل، فيه كل حاجة.
      ar: |
        bayar = يدفع: Tak bayar saiki = سأدفع الآن.
        utang = دَين، يستدين: Aku isih utang = ما زال عليّ دين.
        rugi = خاسر. entek = نفد: Endhoge entek.
        didol = يُباع (من adol). biji = حبّة، قطعة: telung biji = ثلاث قطع.
        langganan = زبون دائم. lengkap = كامل، فيه كلّ شيء.
      en: |
        bayar = pay: Tak bayar saiki = I'll pay now.
        utang = debt, owe: Aku isih utang = I still owe.
        rugi = make a loss. entek = run out, sold out: Endhoge entek.
        didol = be sold (from adol). biji = piece: telung biji = three pieces.
        langganan = regular customer. lengkap = complete, has everything.
    examples:
      - text: Endhoge wis entek, Mas.
        ar_eg: البيض خلص يا ماس.
        ar: نفد البيض يا أخي.
        en: The eggs are sold out, Mas.
      - text: Telung biji pira, Bu?
        ar_eg: التلات حبات بكام يا حاجة؟
        ar: بكم القطع الثلاث يا خالة؟
        en: How much for three, Bu?
      - text: Warunge Bu Siti lengkap, aku langganan.
        ar_eg: محل بو سيتي فيه كل حاجة، وأنا زبون دايم.
        ar: دكّان بو سيتي فيه كلّ شيء، وأنا زبون دائم.
        en: Bu Siti's stall has everything, I'm a regular.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bayar
        ar_eg: يدفع
        ar: يدفع
        en: pay
      - text: utang
        ar_eg: دين، يستلف
        ar: دَين
        en: owe, debt
      - text: rugi
        ar_eg: خسران
        ar: خاسر
        en: make a loss
      - text: entek
        ar_eg: خلص
        ar: نفد
        en: sold out, run out
    words: [bayar, utang, rugi, entek]
  - id: e02
    type: match_pairs
    pairs:
      - text: didol
        ar_eg: بيتباع
        ar: يُباع
        en: be sold
      - text: biji
        ar_eg: حبة، حتة
        ar: قطعة
        en: piece
      - text: langganan
        ar_eg: زبون دايم
        ar: زبون دائم
        en: regular customer
      - text: lengkap
        ar_eg: فيه كل حاجة
        ar: كامل
        en: complete
    words: [didol, biji, langganan, lengkap]
  - id: e03
    type: listen
    text: Endhoge wis entek, Mas.
    question:
      ar_eg: البيض ماله؟
      ar: ما خبر البيض؟
      en: What about the eggs?
    options: [البيض خلص يا ماس, البيض غالي يا ماس, البيض بيتباع هنا يا ماس]
    answer: 0
    meaning:
      ar_eg: البيض خلص يا ماس.
      ar: نفد البيض يا أخي.
      en: The eggs are sold out, Mas.
    words: [entek, didol]
  - id: e04
    type: fill_blank
    sentence: Pira kabeh? Tak ___ saiki.
    meaning:
      ar_eg: الكل بكام؟ هـ___ دلوقتي.
      ar: كم المجموع؟ سأ___ الآن.
      en: How much altogether? I'll ___ now.
    options: [bayar, entek, biji]
    answers: [bayar]
    words: [bayar, entek, biji]
  - id: e05
    type: multiple_choice
    question: Aku isih utang limang ewu.
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [لسه عليّا خمسة آلاف, معايا خمسة آلاف, الباقي خمسة آلاف]
    answer: 0
    explain:
      ar_eg: utang = دين. «الباقي» = susuk.
      ar: utang = دَين. أمّا «الباقي» فـsusuk.
      en: utang = owe. "Change" is susuk.
    words: [utang]
  - id: e06
    type: fill_blank
    sentence: Aku ___ warunge Bu Siti, saben minggu tuku ing kana.
    meaning:
      ar_eg: أنا ___ في محل بو سيتي، كل أسبوع بشتري من هناك.
      ar: أنا ___ في دكّان بو سيتي، أشتري منه كلّ أسبوع.
      en: I'm a ___ at Bu Siti's stall, I buy there every week.
    options: [langganan, lengkap, rugi]
    answers: [langganan]
    words: [langganan, lengkap, rugi]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «التلات حبات بكام؟» بالجاوي؟
      ar: كيف تقول «بكم القطع الثلاث؟» بالجاوية؟
      en: '"How much for three pieces?" in Javanese?'
    options: ['Telung biji pira?', 'Telung didol pira?', 'Telung rugi pira?']
    answer: 0
    explain:
      ar_eg: biji = حبة، وقبلها telung مش telu.
      ar: biji = قطعة، وقبلها telung لا telu.
      en: biji = piece, with telung before it, not telu.
    words: [biji, didol, rugi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: رخيص أوي، أنا كده خسران!
      ar: رخيص جدًّا، هكذا أخسر!
      en: Too cheap, I'd make a loss!
    answer: Murah banget, aku rugi!
    distractors: [utang, lengkap]
    words: [rugi, utang, lengkap]
  - id: e09
    type: translate
    direction: from_target
    source_text: Aku bayar saiki, ora utang.
    answers_meaning:
      ar_eg: [هدفع دلوقتي، مش هستلف, أنا بدفع دلوقتي، من غير دين]
      ar: [سأدفع الآن، لن أستدين, أدفع الآن بلا دَين]
      en: ['I''ll pay now, no credit', 'I''m paying now, I won''t owe']
    words: [bayar, utang]
  - id: e10
    type: speaking
    text: Warunge Bu Siti lengkap, aku langganan.
    meaning:
      ar_eg: محل بو سيتي فيه كل حاجة، وأنا زبون دايم.
      ar: دكّان بو سيتي فيه كلّ شيء، وأنا زبون دائم.
      en: Bu Siti's stall has everything, I'm a regular.
    words: [lengkap, langganan]
dialogue:
  lines:
    - speaker: Bu Siti
      text: Mas Mohamed! Langgananku teka. Golek apa?
      ar_eg: ماس محمد! الزبون الدايم بتاعي وصل. بتدوّر على إيه؟
      ar: ماس محمد! زبوني الدائم جاء. عمّ تبحث؟
      en: Mas Mohamed! My regular's here. What are you after?
    - speaker: Mohamed
      text: Endhog sekilo, Bu. Lan tempe telung biji.
      ar_eg: كيلو بيض يا حاجة. وتلات حبات تمبيه.
      ar: كيلو بيض يا خالة، وثلاث قطع تمبيه.
      en: A kilo of eggs, Bu. And three pieces of tempe.
    - speaker: Bu Siti
      text: Sepurane, endhoge wis entek. Laris tenan esuk iki.
      ar_eg: معلش، البيض خلص. اتباع كله الصبح ده.
      ar: عذرًا، نفد البيض. بِيع كلّه هذا الصباح.
      en: Sorry, the eggs are sold out. They went fast this morning.
    - speaker: Mohamed
      text: Ya wis, tempe wae. Wingi aku isih utang, ta?
      ar_eg: خلاص، تمبيه بس. امبارح كان عليّا فلوس، صح؟
      ar: حسنًا، التمبيه فقط. كان عليّ دَين من الأمس، أليس كذلك؟
      en: OK, just the tempe. I still owed you from yesterday, right?
    - speaker: Bu Siti
      text: Iya, rong ewu. Ora apa-apa, aku ora rugi kok, hehe.
      ar_eg: أيوه، ألفين. عادي، مش هخسر يعني، هههه.
      ar: نعم، ألفان. لا بأس، لن أخسر، هههه.
      en: Yes, two thousand. No worries, I won't go broke, hehe.
    - speaker: Mohamed
      text: Tak bayar kabeh saiki, Bu.
      ar_eg: هدفع كله دلوقتي يا حاجة.
      ar: سأدفع كلّ شيء الآن يا خالة.
      en: I'll pay it all now, Bu.
