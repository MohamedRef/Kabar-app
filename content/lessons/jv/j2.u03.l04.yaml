dialogue:
  title: Mulih saka pasar
  lines:
    - speaker: Sari
      text: Mohamed, bawangé sekilo pira?
      ar_eg: محمد، البصل الكيلو بكام؟
      ar: يا محمد، بكم كيلو البصل؟
      en: Mohamed, how much was a kilo of onions?
    - speaker: Mohamed
      text: Selawé ewu. Aku tuku telung kilo.
      ar_eg: خمسة وعشرين ألف. اشتريت تلاتة كيلو.
      ar: خمسة وعشرون ألفًا. اشتريتُ ثلاثة كيلو.
      en: Twenty-five thousand. I bought three kilos.
    - speaker: Sari
      text: Selawé? Murah tenan!
      ar_eg: خمسة وعشرين؟ رخيص بجد!
      ar: خمسة وعشرون؟ رخيص حقًا!
      en: Twenty-five? That's really cheap!
    - speaker: Mohamed
      text: Iya! Kabèh pitung puluh lima ewu, susuké selawé ewu.
      ar_eg: أيوه! الكل خمسة وسبعين ألف، والباقي خمسة وعشرين ألف.
      ar: نعم! المجموع خمسة وسبعون ألفًا، والباقي خمسة وعشرون ألفًا.
      en: Yes! Seventy-five thousand altogether, twenty-five thousand change.
    - speaker: Sari
      text: Apik tenan, Mohamed!
      ar_eg: برافو عليك يا محمد!
      ar: أحسنت يا محمد!
      en: Well done, Mohamed!
souvenir:
  id: j2.u03.souvenir
  title: Bawang merah Nganjuk
  note:
    ar_eg: "نغانجوك اسمها «مدينة البصل»: حقول البصل الأحمر الصغير (bawang abang) بتمتد على مدّ الشوف، والشوالات بتتكوم في السوق. وفي السوق هتسمع seket وselawé كل شوية، والأرقام الخاصة دي هي سر الفصال الحلو. دلوقتي تقدر تسأل عن السعر وتفاصل وتعدّ الباقي بالجاوي، وده إنجاز بجد!"
    ar: "تُلقَّب نغانجوك بـ«مدينة البصل»: تمتد حقول البصل الأحمر الصغير (bawang abang) على مد البصر، وتتكدّس أكياسه في السوق. وستسمع هناك seket وselawé باستمرار، فهذه الأعداد الخاصة مفتاح المساومة اللطيفة. صرتَ تسأل عن السعر وتساوم وتعدّ الباقي بالجاوية، وهذا إنجاز حقيقي!"
    en: Nganjuk is known as the onion town — fields of shallots (bawang abang) stretch to the horizon and sacks pile up at the market. You'll hear seket and selawé there all day; those special numbers are the key to friendly haggling. You can now ask prices, bargain and count your change in Javanese — a real achievement!
