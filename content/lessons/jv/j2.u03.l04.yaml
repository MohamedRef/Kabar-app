    explain:
      ar_eg: "60 ليها كلمة خاصة: sewidak."
      ar: "للستين لفظ خاص: sewidak."
      en: "60 has its own word: sewidak."
    words: [sewidak]
  - id: e08
    type: build_sentence
    source:
      ar_eg: البصل الأحمر الكيلو بتلاتين ألف.
      ar: الكيلو من البصل الأحمر بثلاثين ألفًا.
      en: Shallots are 30,000 a kilo.
    answer: Bawang abang sekilo telung puluh ewu.
