    answers_meaning:
      ar_eg: ["الكل مية وخمسين ألف.", "الحساب كله ١٥٠ ألف", "كله على بعضه مية وخمسين ألف"]
      ar: ["المجموع مئة وخمسون ألفًا.", "المجموع ١٥٠ ألفًا"]
