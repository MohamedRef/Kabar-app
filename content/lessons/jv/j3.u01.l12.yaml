schema: kabar.lesson/v1
id: j3.u01.l12
language: jv
title: Pesen ing HP
can_do:
  ar_eg: تقرا تلات رسايل قصيرة وتعرف كل واحدة مكتوبة بأنهي مستوى وليه.
  ar: أن تقرأ ثلاث رسائل قصيرة وتعرف مستوى كل منها وسببه.
  en: Read three short messages and tell which level each one uses, and why.
slides:
  - title: Telung pesen
    body:
      ar_eg: |
        محمد لسه واصل محطة Lempuyangan، ولقى على موبايله تلات رسايل. اقراهم وخد بالك مين بيكلم مين:
        صاحب ← ngoko، بياعة لزبون ← krama، جدة صاحبك ← krama inggil.
      ar: |
        وصل محمد لتوّه إلى محطة Lempuyangan فوجد في هاتفه ثلاث رسائل. اقرأها وانتبه لمن يخاطب من:
        الصديق ← ngoko، والبائعة للزبون ← krama، وجدة الصديق ← krama inggil.
      en: |
        Mohamed has just arrived at Lempuyangan station and finds three messages on his phone. Read them and notice who is writing to whom:
        a friend → ngoko, a seller to a customer → krama, a friend's grandmother → krama inggil.
    examples:
      - text: "Mas Dimas: Mohamed, kowe wis mangan? Aku neng Lempuyangan."
        ar_eg: "Mas Dimas: يا محمد، كلت؟ أنا في Lempuyangan."
        ar: "Mas Dimas: يا محمد، هل أكلت؟ أنا في Lempuyangan."
        en: "Mas Dimas: Mohamed, have you eaten? I'm at Lempuyangan."
      - text: "Bu Siti: Sugeng enjing, Mas. Sampeyan sampun nedha? Mangga, soto!"
        ar_eg: "Bu Siti: صباح الخير يا أستاذ. حضرتك كلت؟ اتفضل، شوربة سوتو!"
        ar: "Bu Siti: صباح الخير يا أخي. هل أكلتَ؟ تفضّل، حساء سوتو!"
        en: "Bu Siti: Good morning. Have you eaten? Please, have some soto!"
      - text: "Mohamed → Mbah Putri: Sugeng sonten, Mbah. Panjenengan sampun dhahar?"
        ar_eg: "محمد لجدة Dimas: مساء الخير يا تيتة. حضرتك أكلتي؟"
        ar: "محمد إلى جدة Dimas: مساء الخير يا جدتي. هل تفضلتِ بالأكل؟"
        en: "Mohamed to Dimas's grandmother: Good afternoon, Grandma. Have you eaten?"
    grammar: jv.speechlevel.overview
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: (من الرسايل) مين كتب بالـ ngoko؟
      ar: (من الرسائل) من كتب بالـ ngoko؟
      en: (from the messages) Who wrote in ngoko?
    options: [Mas Dimas, Bu Siti, Mohamed]
    answer: 0
    explain:
      ar_eg: 'kowe، wis، mangan كلها ngoko: Dimas صاحب محمد.'
      ar: 'kowe وwis وmangan كلها ngoko، فـ Dimas صديق محمد.'
      en: kowe, wis, mangan are all ngoko — Dimas is Mohamed's friend.
    words: [kowe, wis, mangan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: (من رسالة Dimas) Dimas فين دلوقتي؟
      ar: (من رسالة Dimas) أين Dimas الآن؟
      en: (from Dimas's message) Where is Dimas now?
    options: [neng omah, neng warung kopi, neng Lempuyangan]
    answer: 2
    words: [neng]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: Bu Siti بياعة بتكتب لزبون. رسالتها بأنهي مستوى؟
      ar: Bu Siti بائعة تكتب لزبون. بأيّ مستوى رسالتها؟
      en: Bu Siti is a seller writing to a customer. Which level is her message?
    options: [ngoko, krama, krama inggil]
    answer: 1
    explain:
      ar_eg: 'sampeyan، sampun، nedha = krama: أدب مع زبون، من غير ما توصل لـ krama inggil.'
      ar: 'sampeyan وsampun وnedha من الـ krama: أدب مع الزبون دون krama inggil.'
      en: sampeyan, sampun, nedha are krama — polite to a customer, without going up to krama inggil.
    words: [krama, sampeyan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: في رسالة محمد لجدة Dimas، أنهي كلمة بترفع مقامها هي؟
      ar: في رسالة محمد إلى جدة Dimas، أيّ كلمة ترفع مقامها؟
      en: In Mohamed's message to Dimas's grandmother, which word honours her?
    options: [nedha, dhahar, mangan]
    answer: 1
    explain:
      ar_eg: dhahar كلمة krama inggil للتاني المحترم بس. nedha كراما عادية، وmangan نغوكو.
      ar: dhahar من krama inggil وتُقال للمعظَّم وحده؛ nedha كراما عادية وmangan نغوكو.
      en: dhahar is krama inggil, only for the honoured person. nedha is plain krama, mangan is ngoko.
    words: [dhahar, krama inggil]
  - id: e05
    type: listen
    text: Sugeng sonten, Mbah. Panjenengan sampun dhahar?
    options: ['Sugeng enjing, Mbah. Panjenengan sampun dhahar?', 'Sugeng sonten, Mbak. Sampeyan sampun nedha?', 'Sugeng sonten, Mbah. Panjenengan sampun dhahar?']
    answer: 2
    meaning:
      ar_eg: مساء الخير يا تيتة. حضرتك أكلتي؟
      ar: مساء الخير يا جدتي. هل تفضلتِ بالأكل؟
      en: Good afternoon, Grandma. Have you eaten?
    words: [sugeng sonten, panjenengan, dhahar]
  - id: e06
    type: match_pairs
    pairs:
      - text: Aku neng Lempuyangan.
        ar_eg: أنا في Lempuyangan.
        ar: أنا في Lempuyangan.
        en: I'm at Lempuyangan.
      - text: Mangga, soto!
        ar_eg: اتفضل سوتو!
        ar: تفضّل حساء سوتو!
        en: Please, have some soto!
      - text: Sugeng sonten
        ar_eg: مساء الخير (العصر)
        ar: مساء الخير (العصر)
        en: Good afternoon
      - text: Sampeyan sampun nedha?
        ar_eg: حضرتك كلت؟ (krama)
        ar: هل أكلتَ؟ (krama)
        en: Have you eaten? (krama)
    words: [neng, mangga, sugeng sonten, nedha]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: 'رد على Bu Siti: أيوه يا مدام، أنا كلت. شكرًا.'
      ar: 'ردّ على Bu Siti: نعم يا سيدتي، قد أكلتُ. شكرًا.'
      en: "Reply to Bu Siti: Yes, ma'am, I've eaten. Thank you."
    answers: ["Inggih, Bu, kula sampun nedha. Matur nuwun.", "Inggih, kula sampun nedha, Bu. Matur nuwun.", "Inggih, Bu. Kula sampun nedha. Matur nuwun.", "Inggih, Bu, kulo sampun nedha. Matur nuwun.", "Inggih, kulo sampun nedha, Bu. Matur nuwun.", "Inggih, kula sampun nedha. Matur nuwun, Bu.", "Inggih, kulo sampun nedha. Matur nuwun, Bu.", "Inggih, Bu, kula sampun nedha. Matur nuwun, Bu."]
    explain:
      ar_eg: إنت بتتكلم عن نفسك، يبقى kula وnedha (مش dhahar).
      ar: تتكلم عن نفسك فتقول kula وnedha لا dhahar.
      en: You're talking about yourself, so kula and nedha (never dhahar).
    words: [inggih, kula, sampun, nedha]
  - id: e08
    type: build_sentence
    source:
      ar_eg: 'رد على Dimas: أنا لسه ماكلتش يا Mas.'
      ar: 'ردّ على Dimas: لم آكل بعد يا Mas.'
      en: "Reply to Dimas: I haven't eaten yet, Mas."
    answer: Aku durung mangan, Mas.
    distractors: [dereng, nedha]
    explain:
      ar_eg: لصاحبك ngoko على طول، يبقى durung وmangan.
      ar: مع الصديق ngoko، فتقول durung وmangan.
      en: To a friend, ngoko all the way — durung and mangan.
    words: [aku, durung, mangan]
dialogue:
  title: Ing Lempuyangan
  lines:
    - speaker: Mohamed
      text: Mas, iki pesen saka Bu Siti.
      ar_eg: يا Mas، دي رسالة من Bu Siti.
      ar: يا Mas، هذه رسالة من Bu Siti.
      en: Mas, this is a message from Bu Siti.
    - speaker: Mas Dimas
      text: "Krama, to? «Sampun nedha?»"
      ar_eg: "كراما، مش كده؟ «Sampun nedha?»"
      ar: "كراما، أليس كذلك؟ «Sampun nedha?»"
      en: "Krama, right? «Sampun nedha?»"
    - speaker: Mohamed
      text: "Iya. Aku arep bales nganggo krama."
      ar_eg: "أيوه. هرد عليها بالكراما."
      ar: "نعم. سأردّ بالكراما."
      en: "Yes. I'm going to reply in krama."
    - speaker: Mas Dimas
      text: "Apik! «Nggih, sampun, Bu.»"
      ar_eg: "حلو! «Nggih, sampun, Bu.» (أيوه، كلت يا حاجة)"
      ar: "جيد! «Nggih, sampun, Bu.» (نعم، أكلتُ يا سيدتي)"
      en: "Good! «Nggih, sampun, Bu.» (Yes, I have, ma'am.)"
    - speaker: Mohamed
      text: Suwun, Mas!
      ar_eg: متشكر يا Mas!
      ar: شكرًا يا Mas!
      en: Thanks, Mas!
review:
  status: draft
  verified: false
