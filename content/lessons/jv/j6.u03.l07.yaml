  - id: e03
    type: listen
    text: 'Wonten lelayu saking masjid: Pak Karto sampun sedha.'
    question:
      ar_eg: الجامع أعلن عن إيه؟
      ar: بماذا أعلن المسجد؟
      en: What did the mosque announce?
    options: ['فيه نعي من الجامع: عم كارتو اتوفّى', فيه فرح في الجامع, عم كارتو راجع من السفر]
    answer: 0
    meaning:
      ar_eg: 'فيه نعي من الجامع: عم كارتو اتوفّى.'
      ar: 'ثمة نعي من المسجد: توفي السيد كارتو.'
      en: 'A death notice from the mosque: Pak Karto has passed away.'
    words: [lelayu, sedha]
  - id: e04
    type: fill_blank
    sentence: Aku arep ___ menyang omahe Pak Karto.
    meaning:
      ar_eg: أنا رايح ___ في بيت عم كارتو.
      ar: سأذهب ___ إلى بيت السيد كارتو.
      en: I'm going to ___ at Pak Karto's house.
    options: [nglayat, surup, maesan]
    answers: [nglayat]
    words: [nglayat, surup, maesan]
    explain:
      ar_eg: nglayat = يروح العزا. surup = المغرب وmaesan = شاهد القبر.
      ar: nglayat تعني يذهب للعزاء. أما surup فالغروب وmaesan شاهد القبر.
      en: nglayat is paying respects at a death. surup is sunset and maesan is a headstone.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحجر اللي عند راس القبر اسمه …
      ar: الحجر الذي عند رأس القبر يسمّى …
      en: The stone at the head of a grave is the …
    options: [maesan, kijing, lelayu]
    answer: 0
    explain:
      ar_eg: maesan = شاهد القبر. kijing = الغطا المبني، وlelayu = النعي.
      ar: maesan = شاهد القبر؛ kijing = الغطاء المبني، وlelayu = النعي.
      en: maesan = headstone; kijing = the built cover, lelayu = death notice.
    words: [maesan, kijing, lelayu]
  - id: e06
    type: fill_blank
    sentence: Jenazah dikubur ing ___ desa.
    meaning:
      ar_eg: الجثمان اندفن في ___ القرية.
      ar: دُفن الجثمان في ___ القرية.
      en: The body was buried in the village ___.
    options: [pasarean, pangestu, sedha]
    answers: [pasarean]
    words: [pasarean, pangestu, sedha]
    explain:
      ar_eg: pasarean = المدافن. pangestu = بركة / دعوة وsedha = اتوفّى.
      ar: pasarean تعني المقبرة. أما pangestu فالبركة وsedha توفّي.
      en: pasarean is a cemetery. pangestu is a blessing and sedha is "passed away".
  - id: e07
    type: multiple_choice
    question: Wayah ___, srengenge mudhun.
    options: [surup, kijing, nglayat]
    answer: 0
    explain:
      ar_eg: 'الشمس بتنزل وقت المغرب: surup.'
      ar: 'تنزل الشمس وقت الغروب: surup.'
      en: 'The sun goes down at sunset: surup.'
    words: [surup, kijing, nglayat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: يا جدو، ادعيلي.
      ar: يا جدي، أسألك البركة.
      en: Grandpa, I ask your blessing.
    answer: Nyuwun pangestu, Mbah.
    distractors: [kijing, surup]
    words: [pangestu]
    explain:
      ar_eg: nyuwun pangestu = بطلب دعاك / بركتك. kijing = غطا القبر وsurup = المغرب، ومش في المعنى.
      ar: nyuwun pangestu تعني أطلب بركتك. أما kijing (غطاء القبر) وsurup (الغروب) فليستا في المعنى.
      en: nyuwun pangestu is "I ask your blessing". kijing (grave cover) and surup (sunset) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Kijing lan maesane saka watu.
    answers_meaning:
      ar_eg: [غطا القبر والشاهد معمولين من حجر, القبر وشاهده من الحجر]
      ar: [غطاء القبر وشاهده مصنوعان من الحجر, صُنع غطاء القبر والشاهد من الحجر]
      en: [The grave cover and headstone are made of stone, The kijing and maesan are stone]
    words: [kijing, maesan]
  - id: e10
    type: speaking
    text: Kula nglayat dhateng pasarean.
    meaning:
      ar_eg: أنا رايح العزا في المدافن.
      ar: أذهب للعزاء في المقبرة.
      en: I'm going to the cemetery to pay my respects.
    words: [nglayat, pasarean]
dialogue:
  lines:
    - speaker: Pak Harjo
      text: Mas Mohamed, wonten lelayu. Mbah Karto sampun sedha dinten menika.
      ar_eg: يا محمد، فيه نعي. جدو كارتو اتوفّى النهارده.
      ar: يا محمد، هناك نعي. توفّي الجد كارتو اليوم.
      en: Mas Mohamed, there's a death notice. Mbah Karto passed away today.
    - speaker: Mohamed
      text: Innalillahi. Kula ugi badhe nglayat, Pak.
      ar_eg: إنا لله. أنا كمان عايز أروح العزا يا عم.
      ar: إنا لله. وأنا أيضًا أريد أن أعزّي يا سيدي.
      en: Innalillahi. I'd like to pay my respects too, sir.
    - speaker: Pak Harjo
      text: Mangga. Layonipun dipunsarekaken ing pasarean saderengipun surup.
      ar_eg: اتفضل. هيدفنوه في المدافن قبل المغرب.
      ar: تفضّل. سيُدفن في المقبرة قبل الغروب.
      en: Please do. He'll be buried at the cemetery before sunset.
    - speaker: Mohamed
      text: Kijing kaliyan maesanipun sampun wonten?
      ar_eg: غطا القبر والشاهد موجودين؟
      ar: هل غطاء القبر وشاهده موجودان؟
      en: Are the grave cover and headstone there yet?
    - speaker: Pak Harjo
      text: Dereng, menika mangke. Sapunika kita donga kemawon.
      ar_eg: لسه، دول بعدين. دلوقتي ندعيله بس.
      ar: ليس بعد، ذلك لاحقًا. الآن لندعُ له فقط.
      en: Not yet, that comes later. For now we just pray for him.
    - speaker: Mohamed
      text: Inggih, Pak. Mugi kulawarganipun sabar.
      ar_eg: حاضر يا عم. ربنا يصبّر أهله.
      ar: نعم يا سيدي. نسأل الله أن يصبّر أهله.
      en: Yes, sir. May his family be patient.
