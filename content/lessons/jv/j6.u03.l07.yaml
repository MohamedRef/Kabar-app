schema: kabar.lesson/v1
id: j6.u03.l07
language: jv
title: Lelayu
can_do:
  ar_eg: 'تسمع نعي في الجامع وتروح العزا بالكراما: مين اتوفّى، الدفن فين وإمتى، وتقول إيه.'
  ar: 'أن تفهم نعيًا في المسجد وتقدّم العزاء بالكراما: من توفي، وأين ومتى الدفن، وماذا تقول.'
  en: 'Understand a death notice from the mosque and pay a condolence call in krama: who died, where and when the burial is, what to say.'
slides:
  - title: Wonten lelayu
    body:
      ar_eg: |
        lelayu = نعي، خبر وفاة (بيتعلن من ميكروفون الجامع). sedha = اتوفّى (كراما، باحترام).
        nglayat = يروح العزا. pasarean = المدافن (كلمة محترمة).
        kijing = غطا القبر المبني، maesan = الشاهد اللي عند الراس. surup = المغرب، وقت غروب الشمس.
        pangestu = بركة ودعا الكبار.
      ar: |
        lelayu = نعي (يُعلَن من مكبّر المسجد). sedha = توفي (بالكراما، احترامًا).
        nglayat = يقدّم العزاء. pasarean = المقابر (لفظ مهذّب).
        kijing = غطاء القبر المبني، maesan = شاهد القبر عند الرأس. surup = الغروب.
        pangestu = بركة الكبار ودعاؤهم.
      en: |
        lelayu = death notice (announced from the mosque speaker). sedha = pass away (krama, respectful).
        nglayat = pay a condolence visit. pasarean = burial ground (polite word).
        kijing = the built cover of a grave, maesan = headstone. surup = sunset.
        pangestu = an elder's blessing.
    examples:
      - text: 'Wonten lelayu: Mbah Karto sampun sedha.'
        ar_eg: 'فيه نعي: جدو كارتو اتوفّى.'
        ar: 'ثمة نعي: لقد توفي الجد كارتو.'
        en: 'There''s a death notice: Mbah Karto has passed away.'
      - text: Kula badhe nglayat dhateng dalemipun.
        ar_eg: أنا رايح العزا في بيته.
        ar: سأذهب لتقديم العزاء في بيته.
        en: I'm going to pay my condolences at his house.
      - text: Layonipun dipunsarekaken ing pasarean saderengipun surup.
        ar_eg: هيدفنوه في المدافن قبل المغرب.
        ar: سيُدفن في المقبرة قبل الغروب.
        en: He will be buried at the cemetery before sunset.
