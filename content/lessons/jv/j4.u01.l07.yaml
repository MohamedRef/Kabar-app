  - id: e08
    type: translate
    direction: from_target
    source_text: Aku eling, aku wis mbalekake bukune.
    answers_meaning:
      ar_eg: [أنا فاكر، رجّعت الكتاب خلاص, افتكرت، أنا رجّعت الكتاب]
      ar: [أتذكّر، لقد أعدتُ الكتاب, تذكّرت، أعدتُ الكتاب]
      en: ['I remember, I''ve already given the book back', 'I remember, I returned the book']
    words: [eling, mbalekake]
  - id: e09
    type: speaking
    text: Kula enget, Bu. Seratipun sampun kula wangsulaken.
    meaning:
      ar_eg: أنا فاكر يا هانم. الجواب رجّعته خلاص.
      ar: أتذكّر يا سيدتي. لقد أعدتُ الرسالة.
      en: I remember, ma'am. I've already returned the letter.
    words: [enget, serat, wangsulaken]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تستلف قلم من الأستاذ. تقول إيه؟
      ar: تريد أن تستعير قلمًا من الأستاذ. ماذا تقول؟
      en: You want to borrow a pen from the gentleman. What do you say?
    options: ['Kula nyuwun ngampil pulpen, Pak.', 'Kula ngampil pulpen, Pak.', 'Kula mbalekake pulpen, Pak.']
    answer: 0
    explain:
      ar_eg: 'عن نفسك: nyuwun ngampil. ngampil لوحدها للكبير، وmbalekake = يرجّع.'
      ar: 'عن نفسك: nyuwun ngampil، أما ngampil وحدها فللكبير، وmbalekake = يعيد.'
      en: 'For yourself: nyuwun ngampil. Bare ngampil is the elder''s, and mbalekake = give back.'
    words: [ngampil, mbalekake]
dialogue:
  lines:
    - speaker: Bu Harsono
      text: Mas, Bapak kesupen ngasta serat menika.
      ar_eg: يا ماس، الأستاذ نسي ياخد الجواب ده.
      ar: يا ماس، نسي الوالد أن يأخذ هذه الرسالة.
      en: Mas, Father forgot to take this letter.
    - speaker: Mohamed
      text: Inggih, Bu. Bapak wonten pundi?
      ar_eg: حاضر يا هانم. الأستاذ فين؟
      ar: حاضر يا سيدتي. أين الوالد؟
      en: Of course, ma'am. Where is he?
    - speaker: Bu Harsono
      text: Inggih, matur nuwun. Bapak wonten masjid.
      ar_eg: أيوه، شكرًا. الأستاذ في الجامع.
      ar: نعم، شكرًا. الوالد في المسجد.
      en: Yes, thank you. He's at the mosque.
    - speaker: Mohamed
      text: Bu, kula nyuwun ngampil payung. Mangke kula wangsulaken.
      ar_eg: يا هانم، ممكن أستلف شمسية؟ هرجّعها بعدين.
      ar: يا سيدتي، هل لي أن أستعير مظلّة؟ سأعيدها لاحقًا.
      en: Ma'am, may I borrow an umbrella? I'll bring it back later.
    - speaker: Bu Harsono
      text: Mangga. Sampun supe, nggih!
      ar_eg: اتفضل. ما تنساش بقى!
      ar: تفضّل. لا تنسَ!
      en: Here you go. Don't forget!
    - speaker: Mohamed
      text: Inggih, Bu. Kula enget.
      ar_eg: حاضر يا هانم. أنا فاكر.
      ar: حاضر يا سيدتي. سأتذكّر.
      en: Yes, ma'am. I'll remember.
