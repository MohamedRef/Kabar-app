schema: kabar.lesson/v1
id: j4.u01.l07
language: jv
title: Supe ngasta serat
can_do:
  ar_eg: تقول إنك نسيت أو فاكر، وتستلف حاجة من حد كبير وترجّعها.
  ar: أن تقول إنك نسيت أو تذكّرت، وتستعير شيئًا من كبير وتعيده.
  en: Say you forgot or remember, and borrow something from an elder and give it back.
slides:
  - title: Supe, kesupen, ngampil
    body:
      ar_eg: |
        - ينسى: lali (J2) ← supe (كراما) ← kesupen (krama inggil): «Bapak kesupen ngasta serat.» وعن نفسك: «Kula supe.»
        - يفتكر: eling (نغوكو) ← enget (كراما): «Kula enget.»
        - يستلف: nyilih (نغوكو) ← ngampil (krama inggil). وإنت بتستلف من الكبير: «Kula nyuwun ngampil...» (أطلب أستلف).
        - يرجّع حاجة: mbalekake (نغوكو) ← wangsulaken (كراما): «Benjang kula wangsulaken.»
        - serat = جواب، رسالة (كراما لـ layang).
      ar: |
        - ينسى: lali (J2) ← supe (كراما) ← kesupen (krama inggil): «Bapak kesupen ngasta serat.» وعن نفسك: «Kula supe.»
        - يتذكّر: eling (نغوكو) ← enget (كراما): «Kula enget.»
        - يستعير: nyilih (نغوكو) ← ngampil (krama inggil). وحين تستعير من الكبير: «Kula nyuwun ngampil...» (أستأذن في استعارة...).
        - يعيد الشيء: mbalekake (نغوكو) ← wangsulaken (كراما): «Benjang kula wangsulaken.»
        - serat = رسالة (كراما لـ layang).
      en: |
        - forget: lali (J2) → supe (krama) → kesupen (krama inggil): "Bapak kesupen ngasta serat." About yourself: "Kula supe."
        - remember: eling (ngoko) → enget (krama): "Kula enget."
        - borrow: nyilih (ngoko) → ngampil (krama inggil). Borrowing from an elder: "Kula nyuwun ngampil..." (may I borrow...).
        - give back: mbalekake (ngoko) → wangsulaken (krama): "Benjang kula wangsulaken."
        - serat = letter (krama for layang).
    examples:
      - text: Nyuwun pangapunten, Pak, kula supe.
        ar_eg: متأسف يا أستاذ، نسيت.
        ar: أعتذر يا سيدي، لقد نسيت.
        en: I'm sorry, sir, I forgot.
      - text: Bapak kesupen ngasta serat.
        ar_eg: الأستاذ نسي ياخد الجواب.
        ar: نسي الوالد أن يأخذ الرسالة.
        en: Father forgot to take the letter.
      - text: Kula nyuwun ngampil bukunipun, Pak. Benjang kula wangsulaken.
        ar_eg: ممكن أستلف كتاب حضرتك يا أستاذ؟ هرجّعهولك بكرة.
        ar: هل لي أن أستعير كتابك يا سيدي؟ سأعيده غدًا.
        en: May I borrow your book, sir? I'll give it back tomorrow.
