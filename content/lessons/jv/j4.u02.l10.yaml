schema: kabar.lesson/v1
id: j4.u02.l10
language: jv
title: Tumbas ageman batik
can_do:
  ar_eg: تفهم وتقول اشتريت إيه ولمين، بـ kagem للكبار وkangge لنفسك.
  ar: أن تفهم وتقول ماذا اشتريت ولمن، بـ kagem للكبار وkangge لنفسك.
  en: Follow and say what you bought for whom, with kagem for elders and kangge for yourself.
slides:
  - title: Kagem Bapak, kangge kula
    body:
      ar_eg: |
        محمد رجع من Malioboro ومعاه هدايا، وبيحكي لـ Bu Harsono اشترى إيه. اسمع الأول.
        خد بالك: الهدية لكبير = kagem، وهدومه ageman. وحاجتك إنت = kangge kula.
      ar: |
        عاد محمد من Malioboro بهدايا، ويحكي لـ Bu Harsono ما اشتراه. استمع أولًا.
        لاحظ: الهدية للكبير = kagem، وملابسه ageman، أما ما يخصّك فـ kangge kula.
      en: |
        Mohamed is back from Malioboro with presents and tells Bu Harsono what he bought. Listen first.
        Notice: a present for an elder is kagem, and his clothes are ageman. Something for yourself is kangge kula.
    grammar: jv.krama-inggil.nouns
    examples:
      - text: Kula tumbas ageman batik kagem Pak Harsono.
        ar_eg: اشتريت قميص باتيك علشان Pak Harsono.
        ar: اشتريتُ قميص باتيك لـ Pak Harsono.
        en: I bought a batik shirt for Pak Harsono.
      - text: Bakpia menika kagem Ibu, lan jeruk menika kagem Simbah.
        ar_eg: البكبيا دي علشان حضرتك، والبرتقان ده علشان تيتة.
        ar: هذه البكبيا لكِ يا سيدتي، وهذا البرتقال للجدة.
        en: This bakpia is for you, ma'am, and these oranges are for Grandma.
      - text: Kangge kula, kula tumbas buku basa Jawi.
        ar_eg: وليّا أنا، اشتريت كتاب جاوي.
        ar: ولنفسي اشتريتُ كتابًا في الجاوية.
        en: For myself, I bought a Javanese book.
exercises:
  - id: e01
    type: listen
    text: Kula tumbas ageman batik kagem Pak Harsono.
    question:
      ar_eg: قميص الباتيك لمين؟
      ar: لمن قميص الباتيك؟
      en: Who is the batik shirt for?
    options: [Simbah, Pak Harsono, Mohamed]
    answer: 1
    meaning:
      ar_eg: اشتريت قميص باتيك علشان Pak Harsono.
      ar: اشتريتُ قميص باتيك لـ Pak Harsono.
      en: I bought a batik shirt for Pak Harsono.
    words: [ageman, kagem]
  - id: e02
    type: listen
    text: Bakpia menika kagem Ibu, lan jeruk menika kagem Simbah.
    question:
      ar_eg: محمد اشترى إيه لتيتة؟
      ar: ماذا اشترى محمد للجدة؟
      en: What did Mohamed buy for Grandma?
    options: [jeruk, bakpia, ageman batik]
    answer: 0
    meaning:
      ar_eg: البكبيا دي علشان حضرتك، والبرتقان ده علشان تيتة.
      ar: هذه البكبيا لكِ يا سيدتي، وهذا البرتقال للجدة.
      en: This bakpia is for you, ma'am, and these oranges are for Grandma.
    words: [kagem]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: محمد اشترى إيه لنفسه؟
      ar: ماذا اشترى محمد لنفسه؟
      en: What did Mohamed buy for himself?
    options: [ageman batik, bakpia, buku basa Jawi]
    answer: 2
    explain:
      ar_eg: «Kangge kula, kula tumbas buku basa Jawi» = ليّا أنا اشتريت كتاب جاوي.
      ar: «Kangge kula, kula tumbas buku basa Jawi» = لنفسي اشتريتُ كتابًا في الجاوية.
      en: '"Kangge kula, kula tumbas buku basa Jawi" = for myself, I bought a Javanese book.'
    words: [kangge]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: محمد بيتكلم عن الكتاب بتاعه. أنهي جملة صح؟
      ar: يتحدث محمد عن كتابه. أيّ جملة صحيحة؟
      en: Mohamed is talking about his own book. Which sentence is right?
    options: ['Buku menika kagem kula.', 'Buku menika kangge kula.', 'Buku menika kagem panjenengan.']
    answer: 1
    explain:
      ar_eg: لنفسك kangge، مش kagem. kagem تكريم للتاني بس.
      ar: لنفسك تقول kangge لا kagem، فـ kagem تكريم للآخر فقط.
      en: For yourself it's kangge, not kagem. kagem only honours someone else.
    words: [kangge, kagem]
  - id: e05
    type: match_pairs
    pairs:
      - text: ageman
        ar_eg: هدوم (للكبير)
        ar: ملابس (للكبير)
        en: clothes (an elder's)
      - text: klambi
        ar_eg: هدوم (عادي)
        ar: ملابس (عادي)
        en: clothes (plain)
      - text: kagem
        ar_eg: علشان (للكبير)
        ar: لـ (للكبير)
        en: for (an elder)
      - text: kangge
        ar_eg: علشان (عادي، لنفسك)
        ar: لـ (عادي، لنفسك)
        en: for (plain, for yourself)
      - text: dhaharan
        ar_eg: أكل (للكبير)
        ar: طعام (للكبير)
        en: food (an elder's)
    words: [ageman, kagem, kangge, dhaharan]
  - id: e06
    type: fill_blank
    sentence: Bakpia menika ___ Ibu.
    meaning:
      ar_eg: البكبيا دي علشان حضرتك يا هانم.
      ar: هذه البكبيا لكِ يا سيدتي.
      en: This bakpia is for you, ma'am.
    answers: [kagem]
    explain:
      ar_eg: الهدية لـ Bu Harsono، يعني لحد كبير، يبقى kagem.
      ar: الهدية لـ Bu Harsono، وهي كبيرة، فتقول kagem.
      en: The present is for Bu Harsono, an elder, so kagem.
    words: [kagem]
  - id: e07
    type: build_sentence
    source:
      ar_eg: اشتريت قميص باتيك علشان Pak Harsono.
      ar: اشتريتُ قميص باتيك لـ Pak Harsono.
      en: I bought a batik shirt for Pak Harsono.
    answer: Kula tumbas ageman batik kagem Pak Harsono.
    distractors: [kangge, klambi]
    words: [ageman, kagem]
    explain:
      ar_eg: "الهدية للكبير: ageman وkagem. kangge مش تكريم، وklambi هدوم نغوكو."
      ar: "الهدية للكبير: ageman وkagem، أما kangge فلا تكريم فيها، وklambi ملابس بالنغوكو."
      en: "A gift for an elder: ageman and kagem. kangge carries no honour, klambi is ngoko for clothes."
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Pak Slamet) اشتريت بكبيا علشان المدام يا أستاذ.
      ar: (إلى Pak Slamet) اشتريتُ بكبيا لزوجتك يا سيدي.
      en: (to Pak Slamet) I bought bakpia for your wife, sir.
    answers:
      - Kula tumbas bakpia kagem garwanipun, Pak.
      - Pak, kula tumbas bakpia kagem garwanipun.
      - Kula tumbas bakpia kagem garwanipun Bapak.
    explain:
      ar_eg: إنت اللي اشتريت (tumbas)، والهدية لمرات حد كبير - kagem garwanipun.
      ar: أنت المشتري (tumbas)، والهدية لزوجة كبير - kagem garwanipun.
      en: You did the buying (tumbas); the present is for an elder's wife, kagem garwanipun.
    words: [kagem, garwa]
  - id: e09
    type: speaking
    text: Kangge kula, kula tumbas buku basa Jawi.
    meaning:
      ar_eg: وليّا أنا، اشتريت كتاب جاوي.
      ar: ولنفسي اشتريتُ كتابًا في الجاوية.
      en: For myself, I bought a Javanese book.
    words: [kangge]
dialogue:
  title: Wangsul saking Malioboro
  lines:
    - speaker: Bu Harsono
      text: Mas Mohamed saking pundi?
      ar_eg: كنت فين يا محمد؟
      ar: من أين أتيت يا محمد؟
      en: Where have you been, Mohamed?
    - speaker: Mohamed
      text: Saking Malioboro, Bu. Menika bakpia kagem Ibu.
      ar_eg: من Malioboro يا هانم. دي بكبيا علشان حضرتك.
      ar: من Malioboro يا سيدتي. هذه بكبيا لكِ.
      en: From Malioboro, ma'am. Here's some bakpia for you.
    - speaker: Bu Harsono
      text: Wah, matur nuwun sanget, Mas!
      ar_eg: الله، شكرًا جدًا يا محمد!
      ar: شكرًا جزيلًا يا محمد!
      en: Oh, thank you so much!
    - speaker: Mohamed
      text: Menika ageman batik kagem Pak Harsono.
      ar_eg: وده قميص باتيك علشان Pak Harsono.
      ar: وهذا قميص باتيك لـ Pak Harsono.
      en: And this is a batik shirt for Pak Harsono.
    - speaker: Bu Harsono
      text: Sae sanget, Mas. Matur nuwun.
      ar_eg: حلو أوي يا محمد. شكرًا.
      ar: جميل جدًا يا محمد. شكرًا.
      en: It's lovely. Thank you.
