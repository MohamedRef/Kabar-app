schema: kabar.lesson/v1
id: j5.u05.l10
language: jv
title: Critane Bu Retno
can_do:
  ar_eg: تسمع حكاية قصيرة عن الطفولة وتتابع «لما» و«بعد» من غير ما تشوف النص.
  ar: أن تستمع إلى حكاية قصيرة عن الطفولة وتتابع «حين» و«بعد» دون رؤية النص.
  en: Follow a short childhood story by ear, with its "when" and "after".
exercises:
  - id: e01
    type: listen
    text: Nalika isih cilik, aku manggon ing cedhak Menara Kudus.
    question:
      ar_eg: بو ريتنو بتحكيلك عن طفولتها. كانت ساكنة فين وهي صغيرة؟
      ar: تحكي لك بو ريتنو عن طفولتها. أين كانت تسكن وهي صغيرة؟
      en: Bu Retno is telling you about her childhood. Where did she live as a child?
    options: [ing Madiun, ing cedhak Menara Kudus, ing Demak]
    answer: 1
    meaning:
      ar_eg: لما كنت صغيرة، كنت ساكنة جنب منارة قدس.
      ar: حين كنت صغيرة، كنت أسكن قرب منارة قدس.
      en: When I was little, I lived near the Menara Kudus.
    words: [nalika, menara]
  - id: e02
    type: listen
    text: Saben sore, aku dolanan ing ngarep menara karo kanca-kanca.
    question:
      ar_eg: كانت بتلعب إمتى؟
      ar: متى كانت تلعب؟
      en: When did she play?
    options: [saben esuk, saben bengi, saben sore]
    answer: 2
    meaning:
      ar_eg: كل يوم العصر، كنت بلعب قدّام المنارة مع صحابي.
      ar: كل مساء كنت ألعب أمام المنارة مع أصدقائي.
      en: Every afternoon I played in front of the minaret with my friends.
    words: [menara]
  - id: e03
    type: listen
    text: Sawise maghrib, simbah crita babagan Sunan Kudus.
    question:
      ar_eg: جدّتها كانت بتحكي عن إيه؟
      ar: عمَّ كانت جدتها تحكي؟
      en: What did her grandmother tell stories about?
    options: [babagan Sunan Kudus, babagan kancil, babagan sepur]
    answer: 0
    meaning:
      ar_eg: بعد المغرب، جدّتي كانت بتحكي عن سونان قدس.
      ar: بعد المغرب كانت جدتي تحكي عن سونان قدس.
      en: After maghrib, Grandma told stories about Sunan Kudus.
    explain:
      ar_eg: maghrib = المغرب، من العربي. babagan = عن (tentang).
      ar: maghrib = المغرب، من العربية، وbabagan = عن (tentang).
      en: maghrib = the sunset prayer, from Arabic; babagan = about (tentang).
    words: [sawise, maghrib, babagan]
  - id: e04
    type: match_pairs
    pairs:
      - text: nalika
        ar_eg: لما (في الماضي)
        ar: حين (في الماضي)
        en: when (past)
      - text: sawise
        ar_eg: بعد
        ar: بعد
        en: after
      - text: maghrib
        ar_eg: المغرب
        ar: المغرب
        en: sunset prayer
      - text: babagan
        ar_eg: عن
        ar: عن / حول
        en: about
      - text: saben
        ar_eg: كل
        ar: كل
        en: every
    words: [nalika, sawise, maghrib, babagan]
