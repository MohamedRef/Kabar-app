    meaning:
      ar_eg: لما كنت صغير، كنت ساكن في القاهرة.
      ar: حين كنت صغيرًا، كنت أسكن في القاهرة.
      en: When I was little, I lived in Cairo.
    words: [nalika]
dialogue:
  title: Babagan Sunan Kudus
  lines:
    - speaker: Mohamed
      text: Bu, Sunan Kudus menika sinten?
      ar_eg: يا مدام، سونان قدس ده مين؟
      ar: يا سيدتي، من سونان قدس؟
      en: Ma'am, who was Sunan Kudus?
    - speaker: Bu Retno
      text: Sunan Kudus iku sawijining Wali Sanga. Dheweke sing mbangun masjid ing cedhak menara.
      ar_eg: سونان قدس واحد من الأولياء التسعة. هو اللي بنى الجامع اللي جنب المنارة.
      ar: سونان قدس أحد الأولياء التسعة، وهو من بنى المسجد المجاور للمنارة.
      en: Sunan Kudus was one of the Wali Sanga. He's the one who built the mosque by the minaret.
    - speaker: Mohamed
      text: Lan nami Kudus saking Al-Quds, nggih?
      ar_eg: واسم قدس جاي من «القدس»، صح؟
      ar: واسم قدس مأخوذ من «القدس»، أليس كذلك؟
      en: And the name Kudus comes from Al-Quds, right?
    - speaker: Bu Retno
      text: Bener lho, Mas. Simbahku crita kaya ngono saben sawise maghrib.
      ar_eg: صح يا محمد. جدّتي كانت بتحكي كده كل يوم بعد المغرب.
      ar: صحيح يا محمد. كانت جدتي تحكي ذلك كل يوم بعد المغرب.
      en: Right. My grandmother told it like that every evening after maghrib.
