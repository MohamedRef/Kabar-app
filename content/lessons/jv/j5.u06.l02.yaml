schema: kabar.lesson/v1
id: j5.u06.l02
language: jv
title: Campursari
can_do:
  ar_eg: تمشي ورا حكاية أغنية حب حديثة.
  ar: أن تتتبّع حكاية أغنية حب حديثة.
  en: Follow the story in a modern love song.
slides:
  - title: Tembung tresna
    body:
      ar_eg: |
        campursari = مزيكا بتخلط الجاميلان مع آلات حديثة (campur = يخلط، فاكرها؟). أغانيه أغلبها حب وفراق، وقلب مكسور.
        كلمات الحب: tresna = حب (بتتنطق «تريسنو»، زي pira و piro!)، kangen = وحشتني / مشتاق (kangen)، ati = قلب، janji = وعد. وسلانج مشهور: ambyar = اتكسر حتت، يعني قلبه اتكسر.
      ar: |
        campursari = موسيقى تمزج الغاميلان بالآلات الحديثة (campur = يمزج، أتذكرها؟)، وأكثر أغانيها عن الحب والفراق والقلب المكسور.
        ومفردات الحب: tresna = حب (تُنطق «تريسنو» كما في pira وpiro)، وkangen = اشتياق، وati = قلب، وjanji = وعد. وكلمة عامية شهيرة: ambyar = تحطّم شظايا، أي انكسر القلب.
      en: |
        campursari = music that mixes gamelan with modern instruments (campur = mix, remember?). Its songs are mostly about love, parting and broken hearts.
        Love words: tresna = love (said "tresno", like pira and piro!), kangen = to miss someone, ati = heart, janji = promise. And a famous slang word: ambyar = shattered to pieces, i.e. heartbroken.
    grammar: jv.narrative.connectors
    examples:
      - text: Aku tresna marang kowe.
        ar_eg: أنا بحبك.
        ar: أحبك.
        en: I love you.
      - text: Aku kangen kowe.
        ar_eg: وحشتني.
        ar: اشتقت إليك.
        en: I miss you.
  - title: Crita ing tembang
    body:
      ar_eg: |
        أغنية الـ campursari غالبًا بتحكي حكاية، وبنفس كلمات الـ cerkak: biyen، nalika، sawise، pungkasane. الأبيات دي إحنا كاتبينها على طريقة الأغاني دي:
      ar: |
        كثيرًا ما تحكي أغنية الـ campursari حكاية بأدوات الـ cerkak نفسها: biyen، وnalika، وsawise، وpungkasane. وهذه أبيات كتبناها على طريقتها:
      en: |
        A campursari song often tells a story, with the same words as a cerkak: biyen, nalika, sawise, pungkasane. These lines were written for Kabar in that style:
    grammar: jv.narrative.connectors
    examples:
      - text: Nalika kowe lunga, atiku lara.
        ar_eg: لما مشيت، قلبي وجعني.
        ar: حين رحلتَ تألّم قلبي.
        en: When you left, my heart ached.
      - text: Pungkasane, atiku ambyar.
        ar_eg: وفي الآخر، قلبي اتكسر حتت.
        ar: وفي النهاية تحطّم قلبي.
        en: In the end, my heart was shattered.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tresna
        ar_eg: حب
        ar: حب
        en: love
      - text: kangen
        ar_eg: مشتاق / وحشني
        ar: مشتاق
        en: to miss someone
      - text: ati
        ar_eg: قلب
        ar: قلب
        en: heart
      - text: ambyar
        ar_eg: اتكسر حتت (سلانج)
        ar: تحطّم (عامية)
        en: shattered, heartbroken (slang)
      - text: janji
        ar_eg: وعد
        ar: وعد
        en: promise
    words: [tresna, kangen, ati, ambyar, janji]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: كلمة «حب» بتتنطق «tresno». إزاي بتتكتب في الإملا الرسمي؟
      ar: تُنطق كلمة «حب» «tresno». كيف تُكتب في الإملاء القياسي؟
      en: The word for "love" sounds like "tresno". How is it spelled in standard spelling?
    options: [tresno, tresna]
    answer: 1
    explain:
      ar_eg: نفس قاعدة pira / piro، الـ a الأخيرة بتتنطق o.
      ar: "القاعدة نفسها في pira / piro: a الأخيرة تُنطق o."
      en: "Same rule as pira / piro: the final a sounds like o."
    words: [tresna]
  - id: e03
    type: multiple_choice
    question: Nalika kowe lunga, atiku lara.
    question_meaning:
      ar_eg: قلبه وجعه إمتى؟
      ar: متى تألّم قلبه؟
      en: When did his heart ache?
    options: ['Ketika kamu pergi.', 'Sebelum kamu datang.', 'Besok pagi.']
    answer: 0
    words: [ati]
  - id: e04
    type: listen
    text: Pungkasane, atiku ambyar.
    options: ['Pungkasane, atiku seneng.', 'Saiki, atiku ambyar.', 'Pungkasane, atiku ambyar.']
    answer: 2
    meaning:
      ar_eg: وفي الآخر، قلبي اتكسر حتت.
      ar: وفي النهاية تحطّم قلبي.
      en: In the end, my heart was shattered.
    words: [ambyar, ati]
  - id: e05
    type: fill_blank
    sentence: Aku ___ kowe.
    meaning:
      ar_eg: وحشتني.
      ar: اشتقت إليك.
      en: I miss you.
    options: [ambyar, kangen, janji]
