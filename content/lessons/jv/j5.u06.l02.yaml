dialogue:
  title: Campursari ing warung
  lines:
    - speaker: Mas Rizal
      text: Rungokna, iki campursari. Critane wong sing ditinggal lunga.
      ar_eg: اسمع، ده campursari. حكايته عن حد حبيبه سابه ومشي.
      ar: استمع، هذا campursari، وحكايته عن شخص هجره من يحب.
      en: Listen, this is campursari. It's about someone who was left behind.
    - speaker: Mohamed
      text: Nalika kekasihe lunga, atine ambyar?
      ar_eg: لما حبيبه مشي، قلبه اتكسر؟
      ar: حين رحل حبيبه، هل تحطّم قلبه؟
      en: When his love left, his heart was shattered?
    - speaker: Mas Rizal
      text: Bener! Akeh tembang campursari critane kaya ngono, kok.
      ar_eg: صح! أغاني campursari كتير حكايتها كده.
      ar: صحيح! كثير من أغاني campursari حكايتها هكذا.
      en: Right! Lots of campursari songs tell a story like that.
    - speaker: Mohamed
      text: Sedhih, nanging apik banget.
      ar_eg: حزينة، بس حلوة أوي.
      ar: حزينة، لكنها جميلة جدًا.
      en: Sad, but really beautiful.
