    source_text: Biyen kowe janji ora bakal lunga, nanging pungkasane kowe lunga.
    answers_meaning:
      ar_eg:
        - زمان إنت وعدت إنك مش هتمشي، بس في الآخر مشيت.
        - زمان وعدت إنك مش هتمشي، بس في الآخر مشيت.
        - إنت وعدت زمان إنك مش هتسيبني، بس في الآخر مشيت.
