dialogue:
  title: Bukuné sapa?
  lines:
    - speaker: Bayu
      text: Mas Mohamed, iki bukuné sapa?
      ar_eg: يا أستاذ محمد، الكتاب ده بتاع مين؟
      ar: يا أخي محمد، لمن هذا الكتاب؟
      en: Mohamed, whose book is this?
    - speaker: Mohamed
      text: Dudu bukuku, Dhik. Duwéké sapa, ya?
      ar_eg: مش كتابي يا صغير. يا ترى بتاع مين؟
      ar: ليس كتابي يا صغيري. لمن يا ترى؟
      en: It's not my book, Dhik. Whose could it be?
    - speaker: Agus
      text: Kuwi bukuné Sari!
      ar_eg: ده كتاب ساري!
      ar: ذاك كتاب ساري!
      en: That's Sari's book!
    - speaker: Mohamed
      text: Bukuné Sari? Buku apa?
      ar_eg: كتاب ساري؟ كتاب إيه؟
      ar: كتاب ساري؟ أيّ كتاب؟
      en: Sari's book? What book?
    - speaker: Agus
      text: Buku basa Arab. Saiki Sari sinau neng Kairo.
      ar_eg: كتاب عربي. ساري بتدرس في القاهرة دلوقتي.
      ar: كتاب لغة عربية. ساري تدرس الآن في القاهرة.
      en: An Arabic book. Sari studies in Cairo now.
new_words:
  - word: -é / -né
    pos: particle
    ar_eg: بتاعه / بتاعها / الـ (= -nya)
    ar: ـه / ـها / أل التعريف (= -nya)
    en: his / her / its, the (= -nya)
  - word: duwéké
    pos: phrase
    ar_eg: "بتاع (punya): duwéké sapa? = بتاع مين؟"
    ar: "ملك (punya): duwéké sapa? = لمن؟"
    en: "belonging to (punya): duwéké sapa? = whose?"
  - word: ilang
    pos: verb
    ar_eg: ضاع (hilang)
    ar: ضاع (hilang)
    en: be lost (hilang)
  - word: adoh
    pos: adjective
    ar_eg: بعيد (jauh)
    ar: بعيد (jauh)
    en: far (jauh)
  - word: saiki
    pos: adverb
    ar_eg: دلوقتي (sekarang)
    ar: الآن (sekarang)
    en: now (sekarang)
  - word: buku
    pos: noun
    ar_eg: كتاب (زي الإندونيسي)
    ar: كتاب (كالإندونيسية)
    en: book (as in Indonesian)
