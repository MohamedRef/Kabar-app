schema: kabar.lesson/v1
id: j2.u01.l02
language: jv
title: Omahé, bukuné
can_do:
  ar_eg: تستعمل -é / -né.
  ar: أن تستعمل اللاحقة -é / -né.
  en: Use -é / -né.
slides:
  - title: -é / -né = -nya
    body:
      ar_eg: |
        إنت عارف -nya من الإندونيسي: rumahnya = بيته / البيت. الجاوي عنده **-é** و**-né** بنفس الشغل:
        - الكلمة آخرها ساكن ⇐ -é: omah (بيت) → omahé، jeneng (اسم) → jenengé، warung → warungé.
        - آخرها حرف متحرك ⇐ -né: buku → bukuné، rega (سعر) → regané، klambi → klambiné.
        بتتنطق é: «omahé». القاموس بيكتبها بالعلامة، والشات من غيرها: omahe، bukune.
      ar: |
        تعرف -nya الإندونيسية (rumahnya = بيته / البيت)، ونظيرها الجاوي **-é** و**-né**:
        - بعد الساكن ⇐ -é: omah (بيت) → omahé، jeneng (اسم) → jenengé، warung → warungé.
        - بعد الصائت ⇐ -né: buku → bukuné، rega (سعر) → regané، klambi → klambiné.
        وتُنطق é، ويكتبها القاموس بالعلامة، وتُكتب في الدردشة بدونها: omahe، bukune.
      en: |
        You know Indonesian -nya: rumahnya = his house / the house. Javanese **-é** / **-né** does the same jobs:
        - Ends in a consonant ⇒ -é: omah (house) → omahé, jeneng (name) → jenengé, warung → warungé.
        - Ends in a vowel ⇒ -né: buku → bukuné, rega (price) → regané, klambi → klambiné.
        It's said é: "omahé". Dictionaries mark the accent; chats don't: omahe, bukune.
    grammar: jv.possessive.e-ne
    examples:
      - text: Jenengé sapa?
        ar_eg: اسمه / اسمها إيه؟
        ar: ما اسمه / ما اسمها؟
        en: What's his / her name?
      - text: Bukuné ilang.
        ar_eg: كتابه ضاع.
        ar: ضاع كتابه.
        en: His book is lost.
  - title: Bukuné, regané
    body:
      ar_eg: |
        -é / -né ليها تلات شغلانات، زي -nya بالظبط:
        1. «بتاعه / بتاعها»: Bukuné ilang = كتابه ضاع.
        2. «الـ» للتعريف: Regané pira? = السعر بكام؟ Omahé adoh = البيت بعيد.
        3. «بتاع فلان»: omahé Pak Budi = بيت باك بودي (هنشوفها في الشريحة الجاية).
      ar: |
        للاحقة -é / -né ثلاث وظائف كـ -nya:
        1. الملكية للغائب: Bukuné ilang = ضاع كتابه.
        2. التعريف: Regané pira? = كم الثمن؟ Omahé adoh = البيت بعيد.
        3. الإضافة إلى اسم: omahé Pak Budi = بيت باك بودي (في الشريحة التالية).
      en: |
        -é / -né has three jobs, just like -nya:
        1. his / her / its: Bukuné ilang = His book is lost.
        2. "the": Regané pira? = How much is it (the price)? Omahé adoh = The house is far.
        3. "X's": omahé Pak Budi = Pak Budi's house (next slide).
    grammar: jv.possessive.e-ne
    examples:
      - text: Regané pira, Bu?
        ar_eg: بكام يا طنط؟
        ar: بكم ثمنه يا سيدتي؟
        en: How much is it, ma'am?
      - text: Omahé adoh.
        ar_eg: البيت بعيد.
        ar: البيت بعيد.
        en: The house is far.
  - title: Warungé Pak Budi
    body:
      ar_eg: |
        «بيت باك بودي» = **omahé Pak Budi**: الحاجة الأول، وبعدين صاحبها. بالظبط زي الإضافة في العربي «بيت باك بودي»، وزي العامية الإندونيسية rumahnya Pak Budi.
        و-é هنا زي الضمير «ـه» في «بيته».
        - warungé Pak Budi = محل باك بودي
        - bukuné Sari = كتاب ساري
        غلط تقول «Pak Budi omahé»: الترتيب بالعكس.
      ar: |
        «بيت باك بودي» = **omahé Pak Budi**: المملوك أولًا ثم المالك، كالإضافة العربية، وكالعامية الإندونيسية rumahnya Pak Budi.
        و-é هنا كضمير الغائب في «بيته».
        - warungé Pak Budi = مطعم باك بودي
        - bukuné Sari = كتاب ساري
        ولا يقال «Pak Budi omahé».
      en: |
        "Pak Budi's house" = **omahé Pak Budi**: thing first, owner second — exactly like Arabic iḍāfa «بيت باك بودي», and casual Indonesian rumahnya Pak Budi.
        -é here is like the «ـه» in «بيته».
        - warungé Pak Budi = Pak Budi's warung
        - bukuné Sari = Sari's book
        Never "Pak Budi omahé": the order is the other way round.
    grammar: jv.possessive.e-ne
    examples:
      - text: Warungé Pak Budi neng Madiun.
        ar_eg: محل باك بودي في ماديون.
        ar: مطعم باك بودي في ماديون.
        en: Pak Budi's warung is in Madiun.
      - text: Bukuné Sari ilang.
        ar_eg: كتاب ساري ضاع.
        ar: ضاع كتاب ساري.
        en: Sari's book is lost.
  - title: -ku, -mu, -é
    body:
      ar_eg: |
        للمتكلم والمخاطب، زي الإندونيسي:
        - omahku = بيتي · omahmu = بيتك · omahé = بيته / بيتها / البيت.
        - jenengku = اسمي · jenengmu = اسمك · jenengé = اسمه.
        وفي الكراما (J3) -é / -né بتبقى -ipun / -nipun.
      ar: |
        وللمتكلم والمخاطب كما في الإندونيسية:
        - omahku = بيتي · omahmu = بيتك · omahé = بيته / بيتها / البيت.
        - jenengku = اسمي · jenengmu = اسمك · jenengé = اسمه.
        وفي الكراما (J3) تصير -é / -né ‏-ipun / -nipun.
      en: |
        For "my" and "your", as in Indonesian:
        - omahku = my house · omahmu = your house · omahé = his / her house, the house.
        - jenengku = my name · jenengmu = your name · jenengé = his / her name.
        In krama (J3) -é / -né becomes -ipun / -nipun.
    grammar: jv.possessive.e-ne
    examples:
      - text: Omahmu neng ngendi?
        ar_eg: بيتك فين؟
        ar: أين بيتك؟
        en: Where's your house?
      - text: Jenengku Mohamed.
        ar_eg: اسمي محمد.
        ar: اسمي محمد.
        en: My name is Mohamed.
  - title: Duwéké sapa?
    body:
      ar_eg: |
        عايز تسأل «بتاع مين؟» ⇐ **duwéké sapa?** (Punya siapa?)
        - Iki duwéké sapa? = ده بتاع مين؟
        - Duwéké Dimas. = بتاع ديماس.
        duwéké جاية من duwé (عنده / يملك) + -ké.
      ar: |
        وللسؤال «لمن هذا؟» ⇐ **duwéké sapa?** (Punya siapa?)
        - Iki duwéké sapa? = لمن هذا؟
        - Duwéké Dimas. = لديماس.
        وduwéké من duwé (يملك).
      en: |
        To ask "whose?" ⇒ **duwéké sapa?** (Punya siapa?)
        - Iki duwéké sapa? = Whose is this?
        - Duwéké Dimas. = It's Dimas's.
        duwéké comes from duwé (have, own).
    grammar: jv.possessive.e-ne
    examples:
      - text: Iki duwéké sapa? — Duwéké Dimas.
        ar_eg: ده بتاع مين؟ — بتاع ديماس.
        ar: لمن هذا؟ — لديماس.
        en: Whose is this? — It's Dimas's.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: omahé
        ar_eg: بيته / البيت (rumahnya)
        ar: بيته / البيت (rumahnya)
        en: his house, the house (rumahnya)
      - text: omahku
        ar_eg: بيتي (rumahku)
        ar: بيتي (rumahku)
        en: my house (rumahku)
      - text: omahmu
        ar_eg: بيتك (rumahmu)
        ar: بيتك (rumahmu)
        en: your house (rumahmu)
      - text: duwéké sapa?
        ar_eg: بتاع مين؟ (punya siapa?)
        ar: لمن؟ (punya siapa?)
        en: whose? (punya siapa?)
      - text: ilang
        ar_eg: ضاع (hilang)
        ar: ضاع (hilang)
        en: lost (hilang)
    words: [omahé, omahku, omahmu, duwéké, ilang]
  - id: e02
    type: multiple_choice
    question: buku + -é / -né
    question_meaning:
      ar_eg: أنهي شكل صح؟
      ar: أيّ صيغة صحيحة؟
      en: Which form is right?
    options: ["bukunya", "bukué", "bukuné"]
    answer: 2
    explain:
      ar_eg: buku آخرها حرف متحرك (u)، فبتاخد -né. وbukunya إندونيسي.
      ar: تنتهي buku بصائت فتأخذ -né، أما bukunya فإندونيسية.
      en: buku ends in a vowel, so it takes -né. bukunya is Indonesian.
    words: [bukuné]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «محل باك بودي»؟
      ar: كيف تقول «مطعم باك بودي»؟
      en: How do you say "Pak Budi's warung"?
    options: ["warungku Pak Budi", "Pak Budi warungé", "warungé Pak Budi"]
    answer: 2
    explain:
      ar_eg: الحاجة الأول وبعدين صاحبها، زي «محل باك بودي».
      ar: المملوك أولًا ثم المالك كالإضافة العربية.
      en: Thing first, owner second, like Arabic iḍāfa.
    words: [warungé]
  - id: e04
    type: multiple_choice
    question: Regané pira?
    question_meaning:
      ar_eg: regané هنا تساوي أنهي كلمة إندونيسي؟
      ar: بأيّ كلمة إندونيسية تقابل regané هنا؟
      en: Which Indonesian word matches regané here?
    options: ["harganya", "hargaku", "hargamu"]
    answer: 0
    explain:
      ar_eg: "هنا -né بتعرّف: «السعر» (harganya)، مش «بتاعه»."
      ar: "تفيد -né هنا التعريف: «الثمن» (harganya)."
      en: "Here -né just means \"the\": the price (harganya)."
    words: [regané]
  - id: e05
    type: listen
    text: Bukuné Sari ilang.
    options: ["Bukuné Sari ilang.", "Omahé Sari adoh.", "Bukuku ilang."]
    answer: 0
    words: [bukuné, ilang]
