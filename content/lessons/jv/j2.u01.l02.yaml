      ar: [عمي وعمتي يسكنان في ماديون, خالي وخالتي يسكنان في ماديون, عمي وزوجته يسكنان في ماديون]
      en: [My uncle and aunt live in Madiun, Uncle and auntie live in Madiun, My uncle and aunt live in Madiun.]
    explain:
