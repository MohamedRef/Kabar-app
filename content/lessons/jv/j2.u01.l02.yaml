schema: kabar.lesson/v1
id: j2.u01.l02
language: jv
title: Pakdhe, bulik, simbah
can_do:
  ar_eg: تسمّي الأعمام والخالات والجدود وجوزك أو مراتك.
  ar: أن تسمّي الأعمام والخالات والأجداد والزوج.
  en: Name uncles, aunts, grandparents and your spouse.
slides:
  - title: Pakdhe, budhe, paklik, bulik
    body:
      ar_eg: |
        العربي بيفرّق بالجهة: عم (من ناحية الأب) وخال (من ناحية الأم). الجاوي بيفرّق بالسن:
        - **pakdhe** = أخو بابا أو ماما **الأكبر** منهم (من bapak gedhe = «الأب الكبير»)، و**budhe** = أختهم الكبيرة.
        - **paklik** = أخوهم **الأصغر** (bapak cilik = «الأب الصغير»)، و**bulik** = أختهم الصغيرة.
        يعني «عمي» و«خالي» ممكن الاتنين يبقوا pakdhe، المهم: أكبر ولا أصغر من أبوك أو أمك؟
      ar: |
        تفرّق العربية بالجهة (العم والخال)، والجاوية بالسن:
        - **pakdhe** = أخو الأب أو الأم **الأكبر** منه (من bapak gedhe «الأب الكبير»)، و**budhe** = أخته الكبرى.
        - **paklik** = الأخ **الأصغر** (bapak cilik «الأب الصغير»)، و**bulik** = الأخت الصغرى.
        فالعم والخال كلاهما pakdhe إن كانا أكبر من الوالد.
      en: |
        Arabic splits uncles by side: عم (father's side) and خال (mother's side). Javanese splits them by age:
        - **pakdhe** = your parent's **older** brother (from bapak gedhe, "big father"); **budhe** = their older sister.
        - **paklik** = their **younger** brother (bapak cilik, "little father"); **bulik** = their younger sister.
        So an uncle on either side is pakdhe if he's older than your parent.
    grammar: jv.kinship.terms
    examples:
      - text: Pakdhe karo budhe manggon neng Madiun.
        ar_eg: عمي وطنط ساكنين في ماديون.
        ar: عمي وعمتي يسكنان في ماديون.
        en: My uncle and aunt live in Madiun.
      - text: Paklikku manggon neng Ponorogo.
        ar_eg: عمي الصغير ساكن في بونوروجو.
        ar: عمي الأصغر يسكن في بونوروغو.
        en: My younger uncle lives in Ponorogo.
  - title: Simbah, mbah kakung, mbah putri
    body:
      ar_eg: |
        - **simbah** / **mbah** = جدو أو تيتة.
        - **mbah kakung** = جدو · **mbah putri** = تيتة.
        - **putu** = حفيد · **ponakan** = ابن أخ / أخت.
        - **bojo** = جوز / مرات (زوج / زوجة).
        وmbah كمان لقب نداء لأي حد كبير أوي في السن.
      ar: |
        - **simbah** / **mbah** = الجد أو الجدة.
        - **mbah kakung** = الجد · **mbah putri** = الجدة.
        - **putu** = الحفيد · **ponakan** = ابن الأخ أو الأخت.
        - **bojo** = الزوج أو الزوجة.
        وmbah لقب نداء أيضًا لكل مسنّ.
      en: |
        - **simbah** / **mbah** = grandparent.
        - **mbah kakung** = grandfather · **mbah putri** = grandmother.
        - **putu** = grandchild · **ponakan** = niece / nephew.
        - **bojo** = husband / wife.
        mbah is also how you address any very old person.
    grammar: jv.kinship.terms
    examples:
      - text: Mbah putri lagi masak.
        ar_eg: تيتة بتطبخ.
        ar: الجدة تطبخ.
        en: Grandma is cooking.
      - text: Iki bojoku.
        ar_eg: دي مراتي. / ده جوزي.
        ar: هذه زوجتي. / هذا زوجي.
        en: This is my wife. / This is my husband.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أخو بابا وهو أكبر من بابا. تقوله إيه؟
      ar: أخو أبيك وهو أكبر من أبيك. بمَ تناديه؟
      en: Your father's brother, older than your father. What do you call him?
    options: [pakdhe, mbah, paklik]
    answer: 0
    explain:
      ar_eg: pakdhe = الأكبر من أبوك أو أمك. paklik = الأصغر.
      ar: pakdhe لمن هو أكبر من الوالد، وpaklik للأصغر.
      en: pakdhe is older than your parent; paklik is younger.
    words: [pakdhe, paklik]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أخت ماما الصغيرة (أصغر من ماما). تقولها إيه؟
      ar: أخت أمك الصغرى (أصغر من أمك). بمَ تناديها؟
      en: Your mother's younger sister. What do you call her?
    options: [mbakyu, bulik, budhe]
    answer: 1
    explain:
      ar_eg: أصغر من ماما ⇐ bulik. لو أكبر ⇐ budhe. وmbakyu أختك إنت.
      ar: الأصغر من الأم ⇐ bulik، والأكبر ⇐ budhe، وmbakyu أختك أنت.
      en: Younger than your mother ⇒ bulik; older ⇒ budhe. mbakyu is your own older sister.
    words: [bulik, budhe]
  - id: e03
    type: listen
    text: Mbah putri lagi masak.
    options: [Mbah kakung lagi masak., Mbakyu lagi masak., Mbah putri lagi masak.]
    answer: 2
    words: [mbah putri, masak]
  - id: e04
    type: fill_blank
    sentence: Pakdhe karo ___ manggon neng Madiun.
    meaning:
      ar_eg: عمي وطنط (مراته / أخته الكبيرة) ساكنين في ماديون.
      ar: عمي وعمتي (الأكبر من الوالد) يسكنان في ماديون.
      en: My uncle and aunt (older than my parent) live in Madiun.
