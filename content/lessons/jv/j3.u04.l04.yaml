schema: kabar.lesson/v1
id: j3.u04.l04
language: jv
title: Budhal dhateng bandara
can_do:
  ar_eg: 'تركب تاكسي للمطار بالكراما: اطلع، انزل هنا، أنا مستعجل، والطيارة بتقوم إمتى.'
  ar: 'أن تركب سيارة أجرة إلى المطار بالكراما: اصعد، سأنزل هنا، أنا مستعجل، ومتى تقلع الطائرة.'
  en: 'Take a taxi to the airport in krama: get in, I''ll get off here, I''m in a hurry, and when the plane leaves.'
slides:
  - title: Minggah lan mandhap
    body:
      ar_eg: |
        في المواصلات:
        - munggah ← minggah = يطلع (العربية أو السلم): «Mangga minggah» = اتفضل اركب
        - mudhun ← mandhap = ينزل: «Kula mandhap ing mriki» = هنزل هنا
        budhal = يطلع على سفر، يبدأ المشوار. mangkat = يتحرك، يمشي (الأتوبيس أو الطيارة).
        bandara = مطار، parkir = يركن، باركينج. koper = شنطة سفر، karcis = تذكرة. kesusu = مستعجل. penumpang = راكب.
      ar: |
        في المواصلات:
        - munggah ← minggah = يصعد (السيارة أو الدرج): «Mangga minggah» = تفضّل اركب
        - mudhun ← mandhap = ينزل: «Kula mandhap ing mriki» = سأنزل هنا
        budhal = ينطلق في رحلة. mangkat = يغادر، ينطلق (الحافلة أو الطائرة).
        bandara = مطار، parkir = يركن، موقف. koper = حقيبة سفر، karcis = تذكرة. kesusu = مستعجل. penumpang = راكب.
      en: |
        Getting around:
        - munggah → minggah = go up, get in: "Mangga minggah" = please get in
        - mudhun → mandhap = go down, get off: "Kula mandhap ing mriki" = I'll get off here
        budhal = set off on a trip. mangkat = leave, depart (a bus or a plane).
        bandara = airport, parkir = park, parking. koper = suitcase, karcis = ticket. kesusu = in a hurry. penumpang = passenger.
    examples:
      - text: Mangga minggah, Mas.
        ar_eg: اتفضل اركب يا أستاذ.
        ar: تفضّل اركب.
        en: Please get in.
      - text: Pesawat kula mangkat jam sanga enjing.
        ar_eg: طيارتي بتقوم الساعة تسعة الصبح.
        ar: تقلع طائرتي الساعة التاسعة صباحًا.
        en: My plane leaves at nine in the morning.
      - text: Kula mandhap ing bandara.
        ar_eg: هنزل عند المطار.
        ar: سأنزل عند المطار.
        en: I'm getting off at the airport.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: budhal
        ar_eg: يطلع على سفر
        ar: ينطلق في رحلة
        en: set off
      - text: penumpang
        ar_eg: راكب
        ar: راكب
        en: passenger
      - text: bandara
        ar_eg: مطار
        ar: مطار
        en: airport
      - text: parkir
        ar_eg: يركن
        ar: يركن
        en: park
    words: [budhal, penumpang, bandara, parkir]
  - id: e02
    type: match_pairs
    pairs:
      - text: koper
        ar_eg: شنطة سفر
        ar: حقيبة سفر
        en: suitcase
      - text: mandhap
        ar_eg: ينزل (كراما)
        ar: ينزل (كراما)
        en: get off (krama)
      - text: minggah
        ar_eg: يطلع، يركب (كراما)
        ar: يصعد، يركب (كراما)
        en: get on, go up (krama)
      - text: karcis
        ar_eg: تذكرة
        ar: تذكرة
        en: ticket
    words: [koper, mandhap, minggah, karcis]
  - id: e03
    type: listen
    text: Kula mandhap ing bandara, Pak.
    question:
      ar_eg: هينزل فين؟
      ar: أين سينزل؟
      en: Where is he getting off?
    options: [هنزل عند المحطة, هنزل عند المطار, هركب من المطار]
    answer: 1
    meaning:
      ar_eg: هنزل عند المطار يا أسطى.
      ar: سأنزل عند المطار يا سيدي.
      en: I'm getting off at the airport, sir.
    words: [mandhap, bandara]
  - id: e04
    type: fill_blank
    sentence: Wis jam pitu! Ayo ___!
    meaning:
      ar_eg: الساعة بقت سبعة! يلا ___!
      ar: صارت الساعة السابعة! هيّا ___!
      en: It's seven already! Let's ___!
    options: [budhal, penumpang, mandhap]
    answers: [budhal]
    words: [budhal, penumpang, mandhap]
    explain:
      ar_eg: budhal = نطلع، نبدأ الرحلة. penumpang = راكب، وmandhap = ينزل.
      ar: budhal تعني ننطلق في الرحلة. أما penumpang فراكب، وmandhap ينزل.
      en: budhal is "set off". penumpang is "passenger", and mandhap is "get off".
  - id: e05
    type: multiple_choice
    question: Munggah (ngoko) → ___ (krama)
    options: [mandhap, minggah, mudhun]
    answer: 1
    explain:
      ar_eg: munggah ← minggah = يطلع، يركب. mudhun ← mandhap = ينزل.
      ar: munggah ← minggah = يصعد. mudhun ← mandhap = ينزل.
      en: munggah → minggah = go up, get in. mudhun → mandhap = get off.
    words: [minggah, mandhap, mudhun]
  - id: e06
    type: fill_blank
    sentence: Sopiripun ___ mobil ing bandara.
    meaning:
      ar_eg: السواق ___ العربية في المطار.
      ar: السائق ___ السيارة في المطار.
      en: The driver ___ the car at the airport.
    options: [parkir, koper, minggah]
    answers: [parkir]
    words: [parkir, koper, minggah, bandara]
    explain:
      ar_eg: parkir = ركن العربية. koper = شنطة سفر، وminggah = يطلع.
      ar: parkir تعني أوقف السيارة. أما koper فحقيبة سفر، وminggah يصعد.
      en: parkir is "parked" the car. koper is "suitcase", and minggah is "get in, go up".
  - id: e07
    type: build_sentence
    source:
      ar_eg: التذكرة معانا. يلا نطلع!
      ar: التذكرة معنا. هيا ننطلق!
      en: We've got the ticket. Let's set off!
    answer: Karcisipun sampun wonten. Mangga budhal!
    distractors: [mandhap, kesusu]
    words: [karcis, budhal]
    explain:
      ar_eg: karcis = تذكرة، وbudhal = نطلع. mandhap = ينزل، وkesusu = مستعجل.
      ar: karcis تعني التذكرة، وbudhal ننطلق. أما mandhap فينزل، وkesusu مستعجل.
      en: karcis is "ticket", budhal "set off". mandhap is "get off", and kesusu is "in a hurry".
  - id: e08
    type: translate
    direction: from_target
    source_text: Karcis kula ing koper. Pesawat kula mangkat jam sedasa.
    answers_meaning:
      ar_eg: [تذكرتي في الشنطة. طيارتي هتقوم الساعة عشرة, التذكرة في شنطة السفر، والطيارة الساعة عشرة]
      ar: [تذكرتي في الحقيبة. تقلع طائرتي الساعة العاشرة]
      en: [My ticket is in my suitcase. My plane leaves at ten, 'The ticket''s in my suitcase; my flight leaves at ten']
    words: [karcis, koper, mangkat]
  - id: e09
    type: speaking
    text: Penumpang mandhap ing bandara.
    meaning:
      ar_eg: الركاب بينزلوا في المطار.
      ar: ينزل الركاب في المطار.
      en: The passengers get off at the airport.
    words: [penumpang, mandhap, bandara]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: بتقول إيه لو متأخر وبتجري؟
      ar: ماذا تقول إن كنت متأخرًا ومسرعًا؟
      en: What do you say when you're late and rushing?
    options: [Kula parkir., Kula kesusu., Kula minggah.]
    answer: 1
    explain:
      ar_eg: kesusu = مستعجل.
      ar: kesusu = مستعجل.
      en: kesusu = in a hurry.
    words: [kesusu, parkir, minggah]
dialogue:
  lines:
    - speaker: Sopir
      text: "Mangga, Mas. Teng pundi?"
      ar_eg: "اتفضل يا أستاذ. على فين؟"
      ar: "تفضّل. إلى أين؟"
      en: "Hop in. Where to?"
    - speaker: Mohamed
      text: Dhateng bandara, Pak. Kula kesusu sanget.
      ar_eg: على المطار يا أسطى. أنا مستعجل أوي.
      ar: إلى المطار يا سيدي. أنا مستعجل جدًا.
      en: To the airport, sir. I'm in a big hurry.
    - speaker: Sopir
      text: "Mangkat jam pinten, Mas?"
      ar_eg: "الطيارة بتقوم الساعة كام يا أستاذ؟"
      ar: "متى تقلع الطائرة يا أخي؟"
      en: "What time do you fly, mate?"
    - speaker: Mohamed
      text: "Mangke enjing, Pak. Kula kesusu sanget."
      ar_eg: "الصبح دلوقتي يا أسطى. أنا مستعجل أوي."
      ar: "هذا الصباح يا سيدي. أنا مستعجل جدًا."
      en: "This morning, sir. I'm in a real hurry."
    - speaker: Sopir
      text: "Mboten napa-napa. Margine taksih sepi."
      ar_eg: "ولا يهمك. الطريق لسه فاضي."
      ar: "لا بأس. الطريق ما زال خاليًا."
      en: "No problem. The road's still empty."
    - speaker: Mohamed
      text: Kula mandhap ing ngriku, Pak. Pinten?
      ar_eg: هنزل هناك يا أسطى. كام؟
      ar: سأنزل هناك يا سيدي. كم الأجرة؟
      en: I'll get off there, sir. How much?
