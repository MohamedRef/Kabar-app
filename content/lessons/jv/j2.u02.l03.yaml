dialogue:
  title: Pecel Bu Darmi, Caruban
  lines:
    - speaker: Bu Darmi
      text: Pesen apa, Mas?
      ar_eg: تطلب إيه يا أستاذ؟
      ar: ماذا تطلب يا أخي؟
      en: What would you like, Mas?
    - speaker: Mohamed
      text: Sega pecel loro, Bu. Siji nganggo endhog.
      ar_eg: اتنين رز بيتشل يا طنط. واحد فيهم بالبيض.
      ar: طبقان من أرز البيتشل يا سيدتي، أحدهما بالبيض.
      en: Two pecel rice, ma'am. One with egg.
    - speaker: Bu Darmi
      text: Pedhes apa ora?
      ar_eg: حرّاق ولا لأ؟
      ar: حارّ أم لا؟
      en: Spicy or not?
    - speaker: Mohamed
      text: Aku sing pedhes. Sari ora pedhes, sambelé sithik wae.
      ar_eg: بتاعي حرّاق. وبتاع ساري مش حرّاق، صوص شوية بس.
      ar: طبقي حارّ، وطبق ساري غير حارّ، بقليل من الصلصة فقط.
      en: Mine spicy. Sari's not spicy, just a little sauce.
    - speaker: Bu Darmi
      text: Mangan kéné apa dibungkus?
      ar_eg: هتاكلوا هنا ولا تيك أواي؟
      ar: تأكلان هنا أم سفري؟
      en: Eating here or take away?
    - speaker: Sari
      text: Mangan kéné, Bu. Karo teh anget loro.
      ar_eg: هناكل هنا يا طنط. ومعاهم اتنين شاي دافي.
      ar: سنأكل هنا يا سيدتي، ومعه شايان دافئان.
      en: Eating here, ma'am. And two warm teas.
    - speaker: Mohamed
      text: Wah, enak tenan! Kabèh pira, Bu?
      ar_eg: واو، حلو بجد! الحساب كام يا طنط؟
      ar: رائع، لذيذ حقًا! كم الحساب يا سيدتي؟
      en: Wow, really tasty! How much altogether, ma'am?
    - speaker: Bu Darmi
      text: Kabèh telung puluh ewu, Mas.
      ar_eg: الكل تلاتين ألف يا أستاذ.
      ar: المجموع ثلاثون ألفًا يا أخي.
      en: Thirty thousand altogether, Mas.
    - speaker: Mohamed
      text: Iki, Bu. Matur nuwun!
      ar_eg: اتفضلي يا طنط. شكرًا!
      ar: تفضلي يا سيدتي. شكرًا!
      en: Here you are, ma'am. Thank you!
