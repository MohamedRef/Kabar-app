schema: kabar.lesson/v1
id: j2.u02.l03
language: jv
title: Sega lan teh anget
can_do:
  ar_eg: تطلب رز وبيض ومشروبات في الوارونج.
  ar: أن تطلب الأرز والبيض والمشروبات في الوارونغ.
  en: Order rice, eggs and drinks at a warung.
slides:
  - title: Sega, tempe, teh anget
    body:
      ar_eg: |
        في عربية البيتشل هتسمع:
        - sega = nasi (رز) — بتتنطق «سِيجو»، وفي الشات sego (زي pira / piro)
        - tempe وrempeyek (peyek): تيمبيه وبسكوت فول سوداني مقرمش
        - endhog = telur (بيض)
        - teh anget = teh hangat (شاي دافي)، es teh = شاي بتلج
        - banyu putih = air putih (مية)
        وعشان تسأل عن الطعم: Rasane piye? = طعمه عامل إزاي؟ أو بسؤال أقصر: Pedhes ora? = حرّاق ولا لأ؟
      ar: |
        عند بائع البيتشل ستسمع:
        - sega = nasi (أرز) — يُنطق «سِغو»، ويُكتب في الدردشة sego (مثل pira / piro)
        - tempe وrempeyek (peyek): التمبيه ورقائق الفول السوداني المقرمشة
        - endhog = telur (بيض)
        - teh anget = teh hangat (شاي دافئ)، وes teh = شاي مثلّج
        - banyu putih = air putih (ماء)
        وللسؤال عن الطعم: Rasane piye? = ما طعمه؟ أو باختصار: Pedhes ora? = أهو حارّ أم لا؟
      en: |
        At a pecel stall you'll hear:
        - sega = nasi (rice) — said "sego", chat sego (like pira / piro)
        - tempe and rempeyek (peyek): tempeh and crispy peanut crackers
        - endhog = telur (egg)
        - teh anget = teh hangat (warm tea), es teh = iced tea
        - banyu putih = air putih (drinking water)
        To ask about taste: Rasane piye? = How does it taste? Or short: Pedhes ora? = Is it spicy?
    examples:
      - text: Rasane piye?
        ar_eg: طعمه عامل إزاي؟
        ar: ما طعمه؟
        en: How does it taste?
      - text: Iki pedhes ora?
        ar_eg: ده حرّاق؟
        ar: أهذا حارّ؟
        en: Is this spicy?
      - text: Teh anget siji, Bu.
        ar_eg: واحد شاي دافي يا طنط.
        ar: شاي دافئ واحد يا سيدتي.
        en: One warm tea, ma'am.
exercises:
  - id: e01
    type: listen
    text: Enak tenan!
    options: [Ora enak., 'Enak ora?', Enak tenan!]
    answer: 2
    words: [enak, tenan]
  - id: e02
    type: build_sentence
    source:
      ar_eg: رز البيتشل حلو بجد.
      ar: أرز البيتشل لذيذ حقًا.
      en: The pecel rice is really tasty.
    answer: Sega pecele enak tenan.
    distractors: [legi, rada]
    words: [sega, enak, tenan]
    explain:
      ar_eg: sega pecele = رز البيتشيل، وenak tenan = حلو أوي. legi = مسكّر، وrada = شوية، ومش في المعنى.
      ar: sega pecele = أرز البيتشيل، وenak tenan = لذيذ حقًا؛ أما legi فحلو المذاق، وrada قليلًا، وليسا في المعنى.
      en: sega pecele = the pecel rice, enak tenan = really tasty. legi and rada aren't in the meaning.
  - id: e03
    type: translate
    direction: from_target
    source_text: Iki pedhes ora?
    answers_meaning:
      ar_eg: [ده حرّاق؟, ده حراق ولا لأ؟, هو ده حراق؟]
      ar: [هل هذا حارّ؟, أهذا حار أم لا؟]
      en: ['Is this spicy?', 'Is this spicy or not?']
    explain:
      ar_eg: X ora? = X ولا لأ؟ طريقة سهلة تعمل بيها سؤال.
      ar: X ora? = أهو X أم لا؟ طريقة سهلة للسؤال.
      en: X ora? = X or not? An easy way to ask a yes/no question.
    words: [pedhes, ora]
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: مية بس.
      ar: ماءً فقط.
      en: Just plain water.
    answers: [Banyu putih wae., Banyu putih wae]
    words: [banyu putih, wae]
  - id: e05
    type: match_pairs
    pairs:
      - text: sega
        ar_eg: رز
        ar: الأرز
        en: cooked rice
      - text: endhog
        ar_eg: بيض
        ar: البيض
        en: egg
      - text: teh anget
        ar_eg: شاي دافي
        ar: شاي دافئ
        en: warm tea
      - text: banyu putih
        ar_eg: مية
        ar: ماء الشرب
        en: drinking water
      - text: rasa
        ar_eg: طعم
        ar: الطعم
        en: taste
    words: [sega, endhog, teh anget, banyu putih, rasa]
  - id: e06
    type: fill_blank
    sentence: Teh ___ siji, Bu.
    meaning:
      ar_eg: واحد شاي دافي يا مدام.
      ar: شاي دافئ واحد يا سيدتي.
      en: One warm tea, ma'am.
    options: [anget, endhog, sega]
    answers: [anget]
    words: [teh anget]
    explain:
      ar_eg: teh anget = شاي دافي. endhog = بيض، وsega = رز، ومش صفة للشاي.
      ar: teh anget = شاي دافئ؛ أما endhog فبيض، وsega أرز، وليسا صفة للشاي.
      en: teh anget = warm tea. endhog (egg) and sega (rice) don't describe tea.
  - id: e07
    type: listen
    text: Sega, endhog lan teh anget, Bu.
    options: ['Sega, endhog lan teh anget, Bu.', 'Sega, endhog lan banyu putih, Bu.', 'Sega lan teh anget, Bu.']
    answer: 0
    meaning:
      ar_eg: رز وبيض وشاي دافي يا طنط.
      ar: أرز وبيض وشاي دافئ يا خالة.
      en: Rice, an egg and warm tea, please.
    words: [sega, endhog, teh anget, banyu putih]
  - id: e08
    type: multiple_choice
    question: Rasane piye?
    question_meaning:
      ar_eg: البيّاعة سألتك كده عن الأكل. يعني إيه بالإندونيسي؟
      ar: سألتك البائعة هذا عن الطعام. ما معناه بالإندونيسية؟
      en: The seller asks you this about the food. What is it in Indonesian?
    options: ['Rasanya bagaimana?', 'Harganya berapa?', 'Namanya siapa?']
    answer: 0
    explain:
      ar_eg: rasa + -ne = rasane (طعمه)، وpiye = bagaimana.
      ar: rasa + -ne = rasane (طعمه)، وpiye = bagaimana.
      en: rasa + -ne = rasane (its taste); piye = bagaimana.
    words: [rasa, piye]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «طعم»؟
      ar: أيّ كلمة تعني «طعم»؟
      en: Which word means "taste"?
    options: [rasa, sega, endhog]
    answer: 0
    explain:
      ar_eg: rasa = طعم، sega = رز، endhog = بيض.
      ar: rasa = طعم، وsega = أرز، وendhog = بيض.
      en: rasa = taste, sega = rice, endhog = egg.
    words: [rasa, sega, endhog]
dialogue:
  title: Neng warung pecel
  lines:
    - speaker: Bu Darmi
      text: Piye, Mas? Segane enak ra?
      ar_eg: إيه يا ماس؟ الرز حلو؟
      ar: ما رأيك يا ماس؟ هل الأرز لذيذ؟
      en: So, Mas? Is the rice good?
    - speaker: Mohamed
      text: Enak tenan, Bu! Rada pedhes.
      ar_eg: حلو أوي يا حاجة! حراق شوية.
      ar: لذيذ جدًا يا سيدتي! حارّ قليلًا.
      en: Really tasty, ma'am! A bit spicy.
    - speaker: Bu Darmi
      text: Ngombe apa, Mas? Teh anget?
      ar_eg: تشرب إيه؟ شاي دافي؟
      ar: ماذا تشرب؟ شايًا دافئًا؟
      en: What will you drink? Warm tea?
    - speaker: Mohamed
      text: Es teh legi wae, Bu.
      ar_eg: شاي بتلج مسكّر بس يا طنط.
      ar: شايًا مثلّجًا حلوًا فقط يا سيدتي.
      en: Just a sweet iced tea, ma'am.
    - speaker: Sari
      text: Aku banyu putih wae, Bu.
      ar_eg: وأنا مية بس يا طنط.
      ar: وأنا ماءً فقط يا سيدتي.
      en: Just water for me, ma'am.
