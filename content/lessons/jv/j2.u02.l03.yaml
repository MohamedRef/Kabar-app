id: j2.u02.l03
language: jv
title: Tuku pecel
can_do:
  ar_eg: تطلب أكل من عربية بيتشل.
  ar: أن تطلب طعامًا من كشك البيتشل.
  en: Order at a pecel stall.
slides:
  - title: Pesen sega pecel
    body:
      ar_eg: |
        جمل الطلب عند عربية البيتشل:
        - Sega pecel siji, Bu. = واحد رز بيتشل يا طنط. (الاسم + العدد، زي الإندونيسي)
        - nganggo endhog = بالبيض (nganggo = pakai)
        - Sambelé sithik wae. = صوص شوية بس. (sithik = sedikit)
        - Pedhes apa ora? = حرّاق ولا لأ؟ (apa هنا = «ولا»)
        - Mangan kéné apa dibungkus? = تاكل هنا ولا تيك أواي؟
        - Kabèh pira? = الحساب كام؟
        وفي ماديون البيتشل بيتقدم على ورقة شجر متطبقة اسمها pincuk.
      ar: |
        عبارات الطلب عند كشك البيتشل:
        - Sega pecel siji, Bu. = طبق أرز بيتشل واحد يا سيدتي (الاسم ثم العدد كالإندونيسية).
        - nganggo endhog = بالبيض (nganggo = pakai)
        - Sambelé sithik wae. = قليلًا من الصلصة فقط (sithik = sedikit).
        - Pedhes apa ora? = حارًّا أم لا؟ (apa هنا بمعنى «أم»)
        - Mangan kéné apa dibungkus? = تأكل هنا أم سفري؟
        - Kabèh pira? = كم الحساب كله؟
        وفي ماديون يُقدَّم البيتشل على ورقة شجر مطوية تسمى pincuk.
      en: |
        Ordering at a pecel stall:
        - Sega pecel siji, Bu. = One pecel rice, ma'am. (noun + number, as in Indonesian)
        - nganggo endhog = with egg (nganggo = pakai)
        - Sambelé sithik wae. = Just a little sauce. (sithik = sedikit)
        - Pedhes apa ora? = Spicy or not? (apa here = "or")
        - Mangan kéné apa dibungkus? = Eat here or take away?
        - Kabèh pira? = How much altogether?
        In Madiun, pecel is served on a folded leaf called a pincuk.
    examples:
      - text: Sega pecel siji, nganggo endhog.
        ar_eg: واحد رز بيتشل بالبيض.
        ar: طبق أرز بيتشل واحد بالبيض.
        en: One pecel rice with egg.
      - text: Mangan kéné apa dibungkus?
        ar_eg: تاكل هنا ولا تيك أواي؟
        ar: تأكل هنا أم سفري؟
        en: Eat here or take away?
exercises:
  - id: e01
    type: multiple_choice
    question: Mangan kéné apa dibungkus?
    question_meaning:
      ar_eg: عايز الأكل تيك أواي. ترد على البياعة تقول إيه؟
      ar: تريد الطعام سفريًا. بماذا تجيب البائعة؟
      en: You want it to take away. How do you answer the seller?
    options: ["Pedhes, Bu.", "Mangan kéné, Bu.", "Dibungkus, Bu."]
    answer: 2
    explain:
      ar_eg: dibungkus = متلفوف (تيك أواي)، زي الإندونيسي.
      ar: dibungkus = مغلَّف (سفري) كالإندونيسية.
      en: dibungkus = wrapped (to take away), as in Indonesian.
    words: [dibungkus, kéné]
  - id: e02
    type: multiple_choice
    question: Pedhes apa ora?
    question_meaning:
      ar_eg: مش عايز الأكل حرّاق خالص. ترد بإيه؟
      ar: لا تريد الطعام حارًّا أبدًا. بماذا تجيب؟
      en: You don't want it spicy at all. What's your answer?
    options: ["Ora pedhes, Bu.", "Pedhes banget, Bu.", "Rada pedhes, Bu."]
    answer: 0
    words: [pedhes, ora]
