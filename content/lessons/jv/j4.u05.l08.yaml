    question: Bengine, penganten putri ana ing kamar. Iku ___.
    question_meaning:
      ar_eg: بالليل العروسة بتقعد في أوضتها. دي ___.
      ar: في الليل تبقى العروس في غرفتها. هذه ___.
      en: That night the bride stays in her room. That's the ___.
    options: [midodareni, siraman, kembar mayang]
    answer: 0
    explain:
      ar_eg: midodareni = ليلة الفرح. siraman بالنهار، وkembar mayang زينة.
      ar: midodareni = ليلة العرس، أمّا siraman فنهارًا، وkembar mayang زينة.
      en: midodareni = the wedding eve. siraman is by day, kembar mayang a decoration.
    words: [midodareni, siraman, kembar mayang]
  - id: e06
    type: fill_blank
    sentence: Aku nggawa ___ neng amplop.
    meaning:
      ar_eg: أنا جايب ___ في ظرف.
      ar: أحمل ___ في ظرف.
      en: I'm bringing the ___ in an envelope.
    options: [buwuh, dhaup, jagong]
    answers: [buwuh]
    words: [buwuh, dhaup, jagong]
    explain:
      ar_eg: الفلوس اللي في الظرف = buwuh. dhaup يعني يتجوّز، وjagong تحضر الفرح.
      ar: المال في الظرف = buwuh، أما dhaup فمعناه يتزوّج، وjagong حضور العرس.
      en: The money in the envelope is buwuh. dhaup means "marry", jagong "attend the wedding".
