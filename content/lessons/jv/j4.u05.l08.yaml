language: jv
title: Jagong manten
can_do:
  ar_eg: تروح فرح في يوجيا كضيف، وتعرف تجيب نقطة إيه، وتسمّي طقوس الفرح الجاوي.
  ar: أن تحضر عرسًا في يوغيا ضيفًا، وتعرف ما تقدّمه من نقوط، وتسمّي طقوس العرس الجاوي.
  en: Go to a Jogja wedding as a guest, know what gift to bring, and name the steps of a Javanese wedding.
slides:
  - title: Jagong, buwuh, siraman
    body:
      ar_eg: |
        في يوجيا الناس بتقول jagong مش kondangan:
        - jagong (manten) = يحضر فرح كضيف. «Sesuk aku jagong manten.»
        - buwuh = النقطة، الفلوس اللي بتحطّها في ظرف للعرسان (زي sumbangan).
        - siraman = يوم قبل الفرح: العيلة بتصبّ مَيّة بالورد على العريس والعروسة.
        - midodareni = ليلة الفرح: العروسة بتقعد في أوضتها والعيلة بتتلمّ.
        - paes = مكياج العروسة على الجبهة. paes ageng = مكياج عروسة يوجيا الملكي.
        - kembar mayang = زينتين توأم من سعف النخل الصغير بتتحطّ جنب العرسان.
        - dhaup = يتجوّز (krama inggil لـ rabi): «Mas Rudi arep dhaup.»
      ar: |
        في يوغيا يقول الناس jagong لا kondangan:
        - jagong (manten) = يحضر عرسًا ضيفًا. «Sesuk aku jagong manten.»
        - buwuh = النقوط، المال الذي تضعه في ظرف للعروسين (مثل sumbangan).
        - siraman = قبل العرس بيوم تصبّ الأسرة ماء الورد على العروسين.
        - midodareni = ليلة العرس: تبقى العروس في غرفتها وتجتمع الأسرة.
        - paes = زينة العروس على الجبهة. paes ageng = زينة عروس يوغيا الملكية.
        - kembar mayang = زينتان توأمان من سعف جوز الهند الصغير توضعان بجانب العروسين.
        - dhaup = يتزوّج (krama inggil لـ rabi): «Mas Rudi arep dhaup.»
      en: |
        In Jogja people say jagong, not kondangan:
        - jagong (manten) = go to a wedding as a guest. "Sesuk aku jagong manten."
        - buwuh = the gift money you put in an envelope for the couple (like sumbangan).
        - siraman = the day before: the family pours flower water over the bride and groom.
        - midodareni = the wedding eve: the bride stays in her room while the family gathers.
        - paes = the bride's forehead make-up. paes ageng = Jogja's royal bridal style.
        - kembar mayang = a twin pair of young-palm-leaf decorations set beside the couple.
        - dhaup = get married (krama inggil for rabi): «Mas Rudi arep dhaup.»
    examples:
      - text: Sesuk aku jagong manten.
        ar_eg: بكرة رايح فرح.
        ar: غدًا أحضر عرسًا.
        en: I'm going to a wedding tomorrow.
      - text: Kula badhe jagong manten, nggawa buwuh.
        ar_eg: أنا رايح الفرح وجايب النقطة.
        ar: سأحضر العرس ومعي النقوط.
        en: I'm going to the wedding and bringing a gift.
      - text: Paes penganten Jogja apik banget.
        ar_eg: مكياج عروسة يوجيا حلو أوي.
        ar: زينة عروس يوغيا جميلة جدًّا.
        en: The Jogja bridal make-up is beautiful.
