schema: kabar.lesson/v1
id: j4.u05.l08
language: jv
title: Mas, sampeyan wis dhahar?
can_do:
  ar_eg: تتكلم مع صاحب أكبر منك.
  ar: أن تتحدث مع صديق أكبر منك.
  en: Talk to an older friend.
slides:
  - title: Kanca sing luwih sepuh
    body:
      ar_eg: |
        Mas Rudi زميلك في كورس الجاوي، أكبر منك بعشر سنين وصاحبك. ده بالظبط مكان ngoko alus:
        - الإطار نغوكو: wis، arep، durung، jam pira.
        - ليه هو: sampeyan أو Mas، وأفعاله krama inggil: dhahar، tindak، kondur، ngagem.
        - ليك إنت: aku، mangan، mulih، melu.
        وهو هيرد عليك ngoko lugu عادي، عشان إنت الأصغر.
      ar: |
        Mas Rudi زميلك في دورة الجاوية، يكبرك بعشر سنين وهو صديقك؛ وهذا موضع ngoko alus:
        - الإطار نغوكو: wis، arep، durung، jam pira.
        - وله: sampeyan أو Mas، وأفعاله krama inggil: dhahar، tindak، kondur، ngagem.
        - ولك: aku، mangan، mulih، melu.
        وسيجيبك بالـ ngoko lugu لأنك الأصغر.
      en: |
        Mas Rudi is a classmate on your Javanese course, ten years older and a friend. That's exactly where ngoko alus belongs:
        - ngoko frame: wis, arep, durung, jam pira.
        - for him: sampeyan or Mas, and krama inggil for his actions: dhahar, tindak, kondur, ngagem.
        - for you: aku, mangan, mulih, melu.
        He'll answer in plain ngoko lugu, since you're the younger one.
    grammar: jv.speechlevel.mixed
    examples:
      - text: Mas, sampeyan wis dhahar?
        ar_eg: أكلت يا أبو الشباب؟ (ngoko alus)
        ar: هل أكلتَ يا أخي؟ (ngoko alus)
        en: Have you eaten, bro? (ngoko alus)
      - text: Aku wis mangan, Mas.
        ar_eg: أنا أكلت يا أبو الشباب.
        ar: أكلتُ يا أخي.
        en: I've eaten.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: وقت الغدا. تسأل Mas Rudi أكل ولا لأ (ngoko alus).
      ar: وقت الغداء. تسأل Mas Rudi هل أكل (ngoko alus).
      en: Lunchtime. You ask Mas Rudi whether he's eaten (ngoko alus).
    options: ['Mas, kowe wis mangan?', 'Mas, sampeyan wis dhahar?', 'Mas, sampeyan sampun nedha?']
    answer: 1
    explain:
      ar_eg: الأولى ngoko lugu (ناقصها احترام)، والتالتة krama lugu (رسمية زيادة على صاحب). الوسطانية ngoko alus.
      ar: الأولى ngoko lugu، والثالثة krama lugu وهي رسمية على صديق، والوسطى ngoko alus.
      en: The first is ngoko lugu (too casual), the third krama lugu (too formal for a friend). The middle one is ngoko alus.
    words: [dhahar, ngoko alus]
  - id: e02
    type: listen
    text: Sampeyan arep kondur jam pira, Mas?
    options: ['Kowe arep mulih jam pira?', 'Sampeyan badhe wangsul jam pinten?', 'Sampeyan arep kondur jam pira, Mas?']
    answer: 2
    meaning:
      ar_eg: هتروّح الساعة كام يا أبو الشباب؟
      ar: متى ستعود إلى البيت يا أخي؟
      en: What time are you going home, bro?
    words: [kondur]
  - id: e03
    type: fill_blank
    sentence: Mas, sampeyan wis ___?
    meaning:
      ar_eg: أكلت يا أبو الشباب؟ (ngoko alus)
      ar: هل أكلتَ يا أخي؟ (ngoko alus)
      en: Have you eaten, bro? (ngoko alus)
    answers: [dhahar]
    words: [dhahar]
  - id: e04
    type: fill_blank
    sentence: Aku wis ___, Mas.
    meaning:
      ar_eg: أنا أكلت يا أبو الشباب.
      ar: أكلتُ يا أخي.
      en: I've eaten, bro.
    options: [dhahar, mangan, nedha]
    answers: [mangan]
    explain:
      ar_eg: "عن نفسك في ngoko alus: mangan العادية."
      ar: "عن نفسك في ngoko alus: mangan."
      en: "About yourself in ngoko alus: plain mangan."
    words: [mangan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: هتروّح الساعة كام يا أبو الشباب؟ (ngoko alus)
      ar: متى ستعود إلى البيت يا أخي؟ (ngoko alus)
      en: What time are you going home, bro? (ngoko alus)
    answer: Mas, sampeyan arep kondur jam pira?
    distractors: [mulih, kula]
    words: [kondur]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (ngoko alus، لـ Mas Rudi) هتلبس باتيك النهارده يا أبو الشباب؟
      ar: (ngoko alus، إلى Mas Rudi) هل ستلبس الباتيك اليوم يا أخي؟
      en: (ngoko alus, to Mas Rudi) Are you wearing batik today, bro?
    answers: ['Mas, sampeyan arep ngagem batik dina iki?', 'Sampeyan arep ngagem batik dina iki, Mas?', 'Mas arep ngagem batik dina iki?', 'Mas, sampeyan ngagem batik dina iki?', 'Sampeyan ngagem batik dina iki, Mas?', 'Mas ngagem batik dina iki?']
    explain:
      ar_eg: إطار نغوكو (arep، dina iki) + ngagem (krama inggil) لفعله هو.
      ar: إطار نغوكو (arep، dina iki) مع ngagem لفعله.
      en: Ngoko frame (arep, dina iki) + ngagem (krama inggil) for his action.
    words: [ngagem]
  - id: e07
    type: dictation
    text: Aku wis mangan. Mas wis dhahar durung?
    meaning:
      ar_eg: أنا أكلت. وإنت أكلت ولا لسه؟
      ar: أكلتُ. وأنت هل أكلت؟
      en: I've eaten. Have you eaten yet, bro?
    words: [ngoko alus, dhahar]
  - id: e08
    type: speaking
    text: Mas, sampeyan wis dhahar? Aku wis mangan.
    meaning:
      ar_eg: أكلت يا أبو الشباب؟ أنا أكلت.
      ar: هل أكلتَ يا أخي؟ أنا أكلت.
      en: Have you eaten, bro? I have.
    words: [dhahar, ngoko alus]
dialogue:
  title: Ing kantin
  lines:
    - speaker: Mohamed
      text: Mas Rudi, sampeyan wis dhahar?
      ar_eg: يا رودي، أكلت؟
      ar: يا رودي، هل أكلت؟
      en: Rudi, have you eaten?
    - speaker: Mas Rudi
      text: Durung, Mohamed. Kowe?
      ar_eg: لسه يا محمد. وإنت؟
      ar: ليس بعد يا محمد. وأنت؟
      en: Not yet, Mohamed. You?
    - speaker: Mohamed
      text: Aku wis mangan, Mas. Sampeyan arep kondur jam pira?
      ar_eg: أنا أكلت. هتروّح الساعة كام؟
      ar: أكلتُ. متى ستعود إلى البيت؟
      en: I've eaten. What time are you heading home?
    - speaker: Mas Rudi
      text: Jam lima. Kowe arep melu?
      ar_eg: الساعة خمسة. عايز تيجي معايا؟
      ar: في الخامسة. هل تريد أن تأتي معي؟
      en: At five. Want to come along?
    - speaker: Mohamed
      text: Iya, Mas. Aku melu.
      ar_eg: آه، جاي معاك.
      ar: نعم، سآتي معك.
      en: Yes, I'll come.
    - speaker: Mas Rudi
      text: Ya wis, mengko jam lima.
      ar_eg: خلاص، الساعة خمسة.
      ar: اتفقنا، في الخامسة.
      en: OK then, at five.
review:
