dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, Setu iki jagong manten anake Bu Warsih, ya.
      ar_eg: يا محمد، السبت ده فرح بنت بو وارسيه، ماشي؟
      ar: يا محمد، هذا السبت عرس ابنة بو وارسيه، اتّفقنا؟
      en: Mohamed, this Saturday we're going to Bu Warsih's daughter's wedding, OK?
    - speaker: Mohamed
      text: Iya, Mas. Aku nggawa buwuh pira?
      ar_eg: ماشي يا ماس. أجيب نقطة قدّ إيه؟
      ar: حسنًا يا ماس. كم أحمل من النقوط؟
      en: Sure, Mas. How much should I bring as a gift?
    - speaker: Mas Dimas
      text: Sakikhlase wae.
      ar_eg: اللي تقدر عليه.
      ar: ما تجود به نفسك.
      en: Whatever you're happy to give.
    - speaker: Mohamed
      text: Wingi aku weruh siraman. Bengi iki midodareni, to?
      ar_eg: امبارح شفت السيرامان. والليلة الميدوداريني، صح؟
      ar: رأيت أمس السيرامان، والليلة الميدوداريني، أليس كذلك؟
      en: I saw the siraman yesterday. Tonight's the midodareni, right?
    - speaker: Mas Dimas
      text: Iya. Sesuk penganten nganggo paes ageng, apik tenan.
      ar_eg: أيوه. وبكرة العروسة هتعمل الباس أجينج، هتبقى حلوة أوي.
      ar: نعم. وغدًا تتزيّن العروس بالباس أغينغ، وستكون جميلة جدًّا.
      en: Yes. Tomorrow the bride wears paes ageng; it's beautiful.
    - speaker: Bu Harsono
      text: Lan kembar mayang sampun wonten ing pendhapa, Mas. Sae sanget.
      ar_eg: والكمبار ماياَنج اتحطّت في البندوبو يا ماس. حلوة أوي.
      ar: وقد وُضعت الكمبار مايانغ في البندوبو يا ماس، وهي جميلة جدًّا.
      en: And the kembar mayang are already in the pendhapa, Mas. They're lovely.
