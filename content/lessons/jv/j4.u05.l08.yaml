    meaning:
      ar_eg: 'فيه ___: بيصبّوا مَيّة ورد على العرسان.'
      ar: 'يكون ___: يُصبّ ماء الورد على العروسين.'
      en: 'There''s the ___: the couple are bathed in flower water.'
    options: [siraman, midodareni, paes]
    answers: [siraman]
    words: [siraman, midodareni, paes]
    explain:
      ar_eg: صبّ مَيّة الورد على العرسان = siraman. midodareni الليلة اللي قبلها، وpaes مكياج العروسة.
      ar: صبّ ماء الورد على العروسين = siraman، أما midodareni فالليلة السابقة، وpaes زينة العروس.
      en: The flower-water bath is the siraman. midodareni is the night before, paes the bridal make-up.
  - id: e05
