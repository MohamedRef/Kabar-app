schema: kabar.lesson/v1
id: j4.u02.l01
language: jv
title: Asma lan yuswa
can_do:
  ar_eg: تسأل حد كبير عن اسمه وسنّه وعياله بأسماء التبجيل.
  ar: أن تسأل الكبير عن اسمه وعمره وأولاده بأسماء التبجيل.
  en: Ask an elder's name, age and children honorifically.
slides:
  - title: Jeneng → nami → asma
    body:
      ar_eg: |
        في الوحدة اللي فاتت الأفعال اترفعت. دلوقتي الأسماء: حاجات الشخص الكبير ليها أسماء مرفوعة.
        - الاسم: jeneng (نغوكو) → nami (كراما، عرفتها في J3) → asma (krama inggil). بالإندونيسي: nama.
        - السن: umur → yuswa (krama inggil). بالإندونيسي: umur / usia.
        وبتلزق فيهم -ipun / -nipun (زي -nya): asmanipun = اسم حضرتك، yuswanipun = سن حضرتك.
        بس اسمك وسنّك إنت بالكلام العادي: «Nami kula Mohamed»، «Umur kula …». «Asma kula» زي «اسمي الكريم» بالظبط.
      ar: |
        رُفعت الأفعال في الوحدة الماضية، والآن الأسماء: لأشياء الكبير أسماء رفيعة.
        - الاسم: jeneng (نغوكو) → nami (كراما، من J3) → asma (krama inggil)، وبالإندونيسية nama.
        - العمر: umur → yuswa (krama inggil)، وبالإندونيسية umur / usia.
        ويلحقها -ipun / -nipun (كـ -nya): asmanipun = اسمكم، yuswanipun = عمركم.
        أما اسمك وعمرك فبالألفاظ العادية: «Nami kula Mohamed»، «Umur kula …»؛ و«Asma kula» كقولك «اسمي الكريم».
      en: |
        Last unit raised verbs; now nouns. A respected person's things have raised names.
        - name: jeneng (ngoko) → nami (krama, from J3) → asma (krama inggil). Indonesian: nama.
        - age: umur → yuswa (krama inggil). Indonesian: umur / usia.
        They take -ipun / -nipun (like -nya): asmanipun = your name, yuswanipun = your age.
        Your own name and age keep the plain words: "Nami kula Mohamed", "Umur kula …". "Asma kula" sounds like «اسمي الكريم».
    grammar: jv.krama-inggil.nouns
    examples:
      - text: Nyuwun sewu, asmanipun sinten?
        ar_eg: لا مؤاخذة، اسم حضرتك إيه؟
        ar: عفوًا، ما اسمكم الكريم؟
        en: Excuse me, what is your name?
      - text: Yuswanipun Simbah pinten?
        ar_eg: تيتة عندها كام سنة؟
        ar: كم عمر الجدة؟
        en: How old is Grandma?
  - title: Duwe → gadhah → kagungan
    body:
      ar_eg: |
        «يملك / عنده» كمان فعل بتلات درجات: duwe → gadhah (كراما، عن نفسك) → kagungan (krama inggil). بالإندونيسي: punya.
        وعيال الكبير مش anak، دول putra (ولاد) أو putri (بنات).
        «Bapak kagungan putra pinten?» = حضرتك عندك كام ولد؟ والرد عن نفسه: «Kula gadhah anak tiga» (عندي تلات عيال).
      ar: |
        «يملك» فعل بثلاث درجات: duwe → gadhah (كراما، عن النفس) → kagungan (krama inggil)، وبالإندونيسية punya.
        وأولاد الكبير لا يقال لهم anak بل putra (ويقال للبنت putri).
        «Bapak kagungan putra pinten?» = كم ولدًا لديكم؟ وجوابه عن نفسه: «Kula gadhah anak tiga».
      en: |
        "Have" also comes in three levels: duwe → gadhah (krama, about yourself) → kagungan (krama inggil). Indonesian: punya.
        An elder's children aren't anak but putra (a daughter is putri).
        "Bapak kagungan putra pinten?" = How many children do you have, sir? About himself he answers: "Kula gadhah anak tiga" (I have three children).
    grammar: jv.krama-inggil.nouns
    examples:
      - text: Bapak kagungan putra pinten?
        ar_eg: حضرتك عندك كام ولد؟
        ar: كم ولدًا لديكم؟
        en: How many children do you have, sir?
      - text: Kula gadhah adhi kalih.
        ar_eg: عندي اتنين إخوات صغيرين.
        ar: لديّ أخوان أصغر مني.
        en: I have two younger siblings.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: asma
        ar_eg: اسم (الكبير)
        ar: اسم (الكبير)
        en: name (of the elder)
      - text: yuswa
        ar_eg: سن (الكبير)
        ar: عمر (الكبير)
        en: age (of the elder)
      - text: putra
        ar_eg: ولد / عيال (الكبير)
        ar: ولد (الكبير)
        en: child (of the elder)
      - text: kagungan
        ar_eg: عنده (krama inggil)
        ar: يملك (krama inggil)
        en: have (krama inggil)
      - text: gadhah
        ar_eg: عندي (كراما، عن نفسك)
        ar: يملك (كراما، عن النفس)
        en: have (krama, about yourself)
    words: [asma, yuswa, putra, kagungan, gadhah]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسأل راجل كبير عن اسمه بأدب. تقول إيه؟
      ar: تريد أن تسأل رجلًا كبيرًا عن اسمه بأدب. ماذا تقول؟
      en: You want to ask an old man his name politely. What do you say?
    options: ['Nami kula sinten?', 'Jenengmu sapa?', 'Nyuwun sewu, asmanipun sinten?']
    answer: 2
    words: [asma]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الراجل الكبير سألك عن اسمك. ترد إزاي؟
      ar: سألك الرجل الكبير عن اسمك. بمَ تجيب؟
      en: The old man asks your name. What do you answer?
    options: ['Asma kula Mohamed.', 'Nami kula Mohamed.', 'Asmanipun Mohamed.']
    answer: 1
    explain:
      ar_eg: asma تكريم لاسم التاني. اسمك إنت nami.
      ar: asma لاسم المعظَّم، واسمك nami.
      en: asma honours someone else's name; yours is nami.
    words: [asma]
  - id: e04
    type: listen
    text: Yuswanipun Simbah pinten?
    options: ['Yuswanipun Simbah pinten?', 'Reginipun pinten?', 'Putranipun Simbah pinten?']
    answer: 0
    meaning:
      ar_eg: تيتة عندها كام سنة؟
      ar: كم عمر الجدة؟
      en: How old is Grandma?
    words: [yuswa]
  - id: e05
    type: fill_blank
    sentence: Bapak ___ putra pinten?
    meaning:
      ar_eg: حضرتك عندك كام ولد؟
      ar: كم ولدًا لديكم؟
      en: How many children do you have, sir?
    options: [gadhah, kagungan, duwe]
    answers: [kagungan]
    explain:
      ar_eg: الملكية ملكيته هو، يبقى kagungan. gadhah عن نفسك، وduwe نغوكو.
      ar: الملك ملكه فيكون kagungan، وgadhah للنفس، وduwe نغوكو.
      en: It's his having, so kagungan. gadhah is for yourself; duwe is ngoko.
    words: [kagungan]
  - id: e06
    type: fill_blank
    sentence: Kula ___ adhi kalih, Pak.
    meaning:
      ar_eg: عندي اتنين إخوات صغيرين يا أستاذ.
      ar: لديّ أخوان أصغر مني يا سيدي.
      en: I have two younger siblings, sir.
    options: [kagungan, gadhah, putra]
    answers: [gadhah]
    words: [gadhah]
  - id: e07
    type: build_sentence
    source:
      ar_eg: حضرتك عندك كام ولد؟
      ar: كم ولدًا لديكم؟
      en: How many children do you have, sir?
    answer: Bapak kagungan putra pinten?
    distractors: [anak, gadhah]
    words: [kagungan, putra]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لراجل كبير) حضرتك عندك كام سنة يا حاج؟
      ar: (لرجل كبير) كم عمرك يا سيدي؟
      en: (to an old man) How old are you, sir?
    answers: ['Yuswanipun pinten, Pak?', 'Nyuwun sewu, yuswanipun pinten, Pak?', 'Pak, yuswanipun pinten?', 'Yuswa panjenengan pinten, Pak?', 'Yuswanipun Bapak pinten?']
    explain:
      ar_eg: yuswa + -nipun (عشان yuswa بتخلص بحرف متحرك) + pinten.
      ar: yuswa + -nipun (لأنها تنتهي بحرف علة) + pinten.
      en: yuswa + -nipun (it ends in a vowel) + pinten.
    words: [yuswa]
  - id: e09
    type: speaking
    text: Kula gadhah adhi kalih. Bapak kagungan putra pinten?
    meaning:
      ar_eg: عندي اتنين إخوات صغيرين. وحضرتك عندك كام ولد؟
      ar: لديّ أخوان أصغر مني. وكم ولدًا لديكم؟
      en: I have two younger siblings. How many children do you have, sir?
    words: [gadhah, kagungan, putra]
dialogue:
  title: Andong ing Malioboro
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Pak, asmanipun sinten?
      ar_eg: لا مؤاخذة يا حاج، اسم حضرتك إيه؟
      ar: عفوًا يا سيدي، ما اسمكم الكريم؟
      en: Excuse me, sir, what is your name?
    - speaker: Pak Slamet
      text: Nami kula Slamet, Mas. Sampeyan saking pundi?
      ar_eg: اسمي سلامت يا ابني. إنت منين؟
      ar: اسمي سلامت يا بني. من أين أنت؟
      en: My name is Slamet. Where are you from?
    - speaker: Mohamed
      text: Kula saking Mesir, Pak. Yuswanipun pinten, Pak?
      ar_eg: أنا من مصر يا حاج. حضرتك عندك كام سنة؟
      ar: أنا من مصر يا سيدي. كم عمركم؟
      en: I'm from Egypt, sir. How old are you?
    - speaker: Pak Slamet
      text: Umur kula seket gangsal, Mas.
      ar_eg: عندي خمسة وخمسين سنة يا ابني.
      ar: عمري خمسة وخمسون عامًا يا بني.
      en: I'm fifty-five.
    - speaker: Mohamed
      text: Bapak kagungan putra pinten?
      ar_eg: وحضرتك عندك كام ولد؟
      ar: وكم ولدًا لديكم؟
      en: How many children do you have, sir?
    - speaker: Pak Slamet
      text: Kula gadhah anak tiga, Mas.
      ar_eg: عندي تلات عيال يا ابني.
      ar: لديّ ثلاثة أولاد يا بني.
      en: I have three children.
new_words:
  - word: asma
    pos: noun
    ar_eg: اسم (krama inggil، للكبير بس؛ ngoko jeneng، krama nami)
    ar: اسم (krama inggil للكبير؛ ngoko jeneng، وkrama nami)
    en: name (krama inggil, for the elder only; ngoko jeneng, krama nami) = nama
  - word: yuswa
    pos: noun
    ar_eg: سن (krama inggil؛ عن نفسك umur)
    ar: عمر (krama inggil؛ وعن النفس umur)
    en: age (krama inggil; about yourself umur) = umur, usia
  - word: putra
    pos: noun
    ar_eg: ولد / ابن (krama inggil؛ البنت putri، وعيالك إنت anak)
    ar: ولد (krama inggil؛ والبنت putri، وأولادك anak)
    en: child, son (krama inggil; daughter putri; your own children anak) = anak
  - word: kagungan
    pos: verb
    ar_eg: عنده / يملك (krama inggil، للكبير؛ ngoko duwe)
    ar: يملك (krama inggil للكبير؛ ngoko duwe)
    en: have, own (krama inggil, for the elder; ngoko duwe) = punya
  - word: gadhah
    pos: verb
    ar_eg: عندي / يملك (كراما، عن نفسك)
    ar: يملك (كراما، عن النفس)
    en: have, own (krama, about yourself) = punya
