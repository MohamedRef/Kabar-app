schema: kabar.lesson/v1
id: j4.u01.l04
language: jv
title: Ngendika lan pirsa
can_do:
  ar_eg: تقول الكبير قال إيه، سأل عن إيه، أو شاف إيه.
  ar: أن تنقل ما قاله الكبير أو سأل عنه أو رآه.
  en: Say what an elder said, asked or saw.
slides:
  - title: Kandha → sanjang → ngendika
    body:
      ar_eg: |
        أفعال الكلام كمان ليها درجات:
        - يقول: kandha (نغوكو) → sanjang (كراما) → ngendika (krama inggil). بالإندونيسي: bilang / berkata.
        - يسأل: takon → taken (عرفتها في J3) → ndangu (krama inggil). بالإندونيسي: bertanya.
        «Bapak ngendika …» = بابا قال … · «Simbah ndangu …» = تيتة سألت …
        وإنت؟ sanjang تنفع لما تكلم صاحبك أو حد قدّك بأدب: «Kula sampun sanjang dhateng Mas Dimas». لكن لما تكلّم حد كبير فيه فعل تواضع مخصوص (matur)، هتاخده في J4.3.
      ar: |
        لأفعال الكلام درجات أيضًا:
        - يقول: kandha (نغوكو) → sanjang (كراما) → ngendika (krama inggil)، وبالإندونيسية bilang / berkata.
        - يسأل: takon → taken (من J3) → ndangu (krama inggil)، وبالإندونيسية bertanya.
        «Bapak ngendika …» = قال الوالد … و«Simbah ndangu …» = سألت الجدة …
        أما أنت فتصلح sanjang حين تكلّم صديقًا أو نظيرًا بأدب: «Kula sampun sanjang dhateng Mas Dimas»، وللكلام مع الكبير فعل تواضع خاص (matur) في J4.3.
      en: |
        Speech verbs have levels too:
        - say: kandha (ngoko) → sanjang (krama) → ngendika (krama inggil). Indonesian: bilang / berkata.
        - ask: takon → taken (from J3) → ndangu (krama inggil). Indonesian: bertanya.
        "Bapak ngendika …" = Father said … · "Simbah ndangu …" = Grandma asked …
        And you? sanjang works when you tell a friend or an equal politely: "Kula sampun sanjang dhateng Mas Dimas". Telling an elder has its own humble verb (matur), coming in J4.3.
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Bapak ngendika, Simbah saweg sare.
        ar_eg: بابا قال إن تيتة نايمة.
        ar: قال الوالد إن الجدة نائمة.
        en: Father said Grandma is asleep.
      - text: Simbah ndangu, Mas Mohamed sampun nedha?
        ar_eg: "تيتة بتسأل: محمد أكل؟"
        ar: "سألت الجدة: هل أكل محمد؟"
        en: Grandma asked whether Mohamed has eaten.
  - title: Ndeleng → ningali → mirsani
    body:
      ar_eg: |
        يشوف: ndeleng (نغوكو) → ningali (كراما، عن نفسك) → mirsani (krama inggil). بالإندونيسي: melihat.
        mirsani كمان معناها «يتفرّج»: «Simbah saweg mirsani TV» = تيتة بتتفرج على التلفزيون.
        وعن نفسك: «Kula sampun ningali Tugu» = أنا شفت التوغو.
      ar: |
        يرى: ndeleng (نغوكو) → ningali (كراما، عن النفس) → mirsani (krama inggil)، وبالإندونيسية melihat.
        وتأتي mirsani بمعنى «يشاهد»: «Simbah saweg mirsani TV».
        وعن نفسك: «Kula sampun ningali Tugu» = رأيتُ التوغو.
      en: |
        see: ndeleng (ngoko) → ningali (krama, about yourself) → mirsani (krama inggil). Indonesian: melihat.
        mirsani also means watch: "Simbah saweg mirsani TV" = Grandma is watching TV.
        About yourself: "Kula sampun ningali Tugu" = I've seen the Tugu.
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Simbah saweg mirsani TV.
        ar_eg: تيتة بتتفرج على التلفزيون.
        ar: الجدة تشاهد التلفاز.
        en: Grandma is watching TV.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sanjang
        ar_eg: يقول (كراما)
        ar: يقول (كراما)
        en: say (krama)
      - text: ngendika
        ar_eg: يقول (krama inggil، للكبير)
        ar: يقول (krama inggil، للكبير)
        en: say (krama inggil, for the elder)
      - text: ndangu
        ar_eg: يسأل (krama inggil، للكبير)
        ar: يسأل (krama inggil، للكبير)
        en: ask (krama inggil, for the elder)
      - text: ningali
        ar_eg: يشوف (كراما، عن نفسك)
        ar: يرى (كراما، عن النفس)
        en: see (krama, about yourself)
      - text: mirsani
        ar_eg: يشوف / يتفرج (krama inggil، للكبير)
        ar: يرى / يشاهد (krama inggil، للكبير)
        en: see, watch (krama inggil, for the elder)
    words: [sanjang, ngendika, ndangu, ningali, mirsani]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: جدة صاحبك سألتك سؤال. أنهي فعل لـ«سألت» بتاعتها؟
      ar: سألتك جدة صديقك سؤالًا. أي فعل يناسب سؤالها؟
      en: Your friend's grandmother asked you something. Which verb fits her asking?
    options: [taken, ndangu, takon]
    answer: 1
    explain:
      ar_eg: السؤال سؤالها هي، يبقى krama inggil (ndangu). taken كراما عادية، وtakon نغوكو.
      ar: السؤال سؤالها فيكون ndangu، وtaken كراما عادية، وtakon نغوكو.
      en: "It's her asking, so krama inggil: ndangu. taken is plain krama; takon is ngoko."
    words: [ndangu]
  - id: e03
    type: listen
    text: Simbah saweg mirsani TV.
    options: ['Simbah saweg sare.', 'Simbah saweg ningali TV.', 'Simbah saweg mirsani TV.']
    answer: 2
    meaning:
      ar_eg: تيتة بتتفرج على التلفزيون.
      ar: الجدة تشاهد التلفاز.
      en: Grandma is watching TV.
    words: [mirsani]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: واحد كبير سألك لو شفت الكراتون. إنت شفته. ترد إزاي؟
      ar: سألك رجل كبير هل رأيتَ الكراتون، وقد رأيته. بمَ تجيب؟
      en: An older man asks whether you've seen the Kraton. You have. What do you answer?
    options: ['Sampun, Pak. Kula sampun ningali.', 'Sampun, Pak. Kula sampun mirsani.', 'Uwis, Pak. Aku wis ndeleng.']
    answer: 0
    explain:
      ar_eg: عن نفسك ningali. mirsani تكريم للتاني، وuwis / aku / ndeleng نغوكو.
      ar: عن نفسك ningali، وmirsani للآخر، وuwis / aku / ndeleng نغوكو.
      en: About yourself, ningali. mirsani honours others; uwis / aku / ndeleng is ngoko.
    words: [ningali, mirsani]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: Pak Harsono قال حاجة وإنت مسمعتش. تسأل Bu Harsono «الأستاذ قال إيه؟» إزاي؟
      ar: قال Pak Harsono شيئًا لم تسمعه. كيف تسأل Bu Harsono «ماذا قال الأستاذ؟»
      en: Pak Harsono said something you didn't catch. How do you ask Bu Harsono "What did he say?"
    options: ['Bapak sanjang menapa, Bu?', 'Bapak ngendika menapa, Bu?', 'Bapak kandha apa, Bu?']
    answer: 1
    explain:
      ar_eg: الكلام كلام Pak Harsono، يبقى ngendika. sanjang كراما عادية، وkandha apa نغوكو.
      ar: القول قول Pak Harsono فيكون ngendika، وsanjang كراما عادية، وkandha apa نغوكو.
      en: It's Pak Harsono's speaking, so ngendika. sanjang is plain krama; kandha apa is ngoko.
    words: [ngendika]
  - id: e06
    type: fill_blank
    sentence: Simbah ___, Mas Mohamed sampun nedha?
    meaning:
      ar_eg: "تيتة بتسأل: محمد أكل؟"
      ar: "سألت الجدة: هل أكل محمد؟"
      en: Grandma asked whether Mohamed has eaten.
    options: [taken, ndangu, sanjang]
    answers: [ndangu]
    words: [ndangu]
  - id: e07
    type: fill_blank
    sentence: Nyuwun sewu, Bu, kula dereng ___ dhateng Mas Dimas.
    meaning:
      ar_eg: لا مؤاخذة يا هانم، أنا لسه ماقلتش لدِيماس.
      ar: عفوًا يا سيدتي، لم أخبر ديماس بعد.
      en: Sorry, ma'am, I haven't told Dimas yet.
    options: [ngendika, sanjang, ndangu]
    answers: [sanjang]
    explain:
      ar_eg: إنت اللي بتقول، ولصاحبك، يبقى sanjang. ngendika للكبير بس.
      ar: القائل أنت، والمخاطَب صديقك، فتكون sanjang، وngendika للكبير.
      en: You're the one telling, and it's your friend, so sanjang. ngendika is for the elder.
    words: [sanjang]
  - id: e08
    type: build_sentence
    source:
      ar_eg: بابا قال إن تيتة نايمة.
      ar: قال الوالد إن الجدة نائمة.
      en: Father said Grandma is asleep.
    answer: Bapak ngendika Simbah saweg sare.
    distractors: [sanjang, tilem]
    words: [ngendika]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Bu Harsono) أنا شفت التوغو خلاص يا هانم.
      ar: (إلى Bu Harsono) لقد رأيتُ التوغو يا سيدتي.
      en: (to Bu Harsono) I've already seen the Tugu, ma'am.
    answers: ['Kula sampun ningali Tugu, Bu.', 'Bu, kula sampun ningali Tugu.', 'Kula sampun ningali Tugu.']
    explain:
      ar_eg: kula + sampun + ningali (عن نفسك، مش mirsani).
      ar: kula + sampun + ningali (عن النفس، لا mirsani).
      en: kula + sampun + ningali (about yourself, not mirsani).
    words: [ningali]
  - id: e10
    type: speaking
    text: Kula sampun sanjang dhateng Mas Dimas.
    meaning:
      ar_eg: أنا قلت لدِيماس خلاص.
      ar: لقد أخبرتُ ديماس.
      en: I've already told Dimas.
    words: [sanjang]
dialogue:
  title: Wangsul saking Tugu
  lines:
    - speaker: Bu Harsono
      text: Mas Mohamed sampun ningali Tugu?
      ar_eg: يا محمد شفت التوغو؟
      ar: يا محمد، هل رأيتَ التوغو؟
      en: Mohamed, have you seen the Tugu?
    - speaker: Mohamed
      text: Sampun, Bu. Sae sanget!
      ar_eg: أيوه يا هانم. حلو جدًا!
      ar: نعم يا سيدتي. جميل جدًا!
      en: Yes, ma'am. It's lovely!
    - speaker: Bu Harsono
      text: Mbah Putri ndangu, Mas Mohamed sampun nedha?
      ar_eg: "تيتة بتسأل: محمد أكل؟"
      ar: "تسأل الجدة: هل أكل محمد؟"
      en: Grandma is asking whether you've eaten.
    - speaker: Mohamed
      text: Sampun, Bu. Simbah sampun dhahar?
      ar_eg: أكلت يا هانم. وتيتة أكلت؟
      ar: أكلتُ يا سيدتي. وهل أكلت الجدة؟
      en: Yes, I have, ma'am. Has Grandma eaten?
    - speaker: Bu Harsono
      text: Sampun, Mas. Simbah saweg mirsani TV.
      ar_eg: أكلت يا ابني. تيتة بتتفرج على التلفزيون.
      ar: أكلت يا بني. الجدة تشاهد التلفاز.
      en: Yes. Grandma is watching TV.
new_words:
  - word: sanjang
    pos: verb
    ar_eg: يقول (كراما؛ ngoko kandha)
    ar: يقول (كراما؛ ngoko kandha)
    en: say, tell (krama; ngoko kandha) = bilang
  - word: ngendika
    pos: verb
    ar_eg: يقول (krama inggil، للكبير)
    ar: يقول (krama inggil، للكبير)
    en: say (krama inggil, for the elder) = berkata
  - word: ndangu
    pos: verb
    ar_eg: يسأل (krama inggil؛ ngoko takon، krama taken)
    ar: يسأل (krama inggil؛ ngoko takon، وkrama taken)
    en: ask (krama inggil; ngoko takon, krama taken) = bertanya
  - word: ningali
    pos: verb
    ar_eg: يشوف (كراما، عن نفسك؛ ngoko ndeleng)
    ar: يرى (كراما، عن النفس؛ ngoko ndeleng)
    en: see (krama, about yourself; ngoko ndeleng) = melihat
  - word: mirsani
    pos: verb
    ar_eg: يشوف / يتفرج (krama inggil، للكبير)
    ar: يرى / يشاهد (krama inggil، للكبير)
    en: see, watch (krama inggil, for the elder) = melihat, menonton
