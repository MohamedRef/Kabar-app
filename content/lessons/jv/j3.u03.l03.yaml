schema: kabar.lesson/v1
id: j3.u03.l03
language: jv
title: Menawi lan namung
can_do:
  ar_eg: 'تستعمل كلمات الربط بالكراما: لو، بس، الكل، تاني، لازم، وتقول إنك ندمان.'
  ar: 'أن تستعمل أدوات الربط بالكراما: إن، فقط، الجميع، مرة أخرى، يجب، وتقول إنك نادم.'
  en: 'Use krama link words: if, only, all, again, must, and say you regret something.'
slides:
  - title: Tembung alit, tegesipun ageng
    body:
      ar_eg: |
        الكلمات الصغيرة دي بتظهر في كل جملة كراما:
        - yen ← menawi = لو
        - mung ← namung = بس، بس كده
        - iki ← punika = ده (رسمي، وmenika أو niki في الكلام اليومي)
        - padha ← sami = زي بعض، والاتنين / الكل بيعملوا نفس الحاجة
        - kabeh ← sedaya = كل، الكل
        - maneh ← malih = تاني، كمان مرة
        - kudu ← kedah = لازم
        وgetun = ندمان (نفس الكلمة في المستويين).
      ar: |
        هذه الكلمات الصغيرة تظهر في كل جملة كراما:
        - yen ← menawi = إن، لو
        - mung ← namung = فقط
        - iki ← punika = هذا (رسمي، وmenika أو niki في الكلام اليومي)
        - padha ← sami = متماثل، ويفعلون الشيء نفسه جميعًا
        - kabeh ← sedaya = كل، الجميع
        - maneh ← malih = مرة أخرى
        - kudu ← kedah = يجب
        وgetun = نادم (الكلمة نفسها في المستويين).
      en: |
        These small words turn up in every krama sentence:
        - yen → menawi = if
        - mung → namung = only
        - iki → punika = this (formal; menika or niki in everyday speech)
        - padha → sami = the same; all doing the same thing
        - kabeh → sedaya = all, everyone
        - maneh → malih = again
        - kudu → kedah = must
        And getun = regret (the same word at both levels).
    examples:
      - text: Menawi sayah, mangga linggih.
        ar_eg: لو تعبان، اتفضل اقعد.
        ar: إن كنت متعبًا فتفضّل اجلس.
        en: If you're tired, please sit down.
      - text: Kula namung saged ngoko.
        ar_eg: أنا بعرف ngoko بس.
        ar: لا أستطيع إلا الـ ngoko.
        en: I can only manage ngoko.
      - text: Sedaya tiyang sami bungah.
        ar_eg: الناس كلها مبسوطة.
        ar: الجميع سعداء.
        en: Everyone is happy.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: menawi
        ar_eg: لو (كراما)
        ar: إن، لو (كراما)
        en: if (krama)
      - text: namung
        ar_eg: بس (كراما)
        ar: فقط (كراما)
        en: only (krama)
      - text: punika
        ar_eg: ده (كراما رسمي)
        ar: هذا (كراما رسمي)
        en: this (formal krama)
      - text: sami
        ar_eg: زي بعض (كراما)
        ar: متماثل (كراما)
        en: the same (krama)
    words: [menawi, namung, punika, sami]
  - id: e02
    type: match_pairs
    pairs:
      - text: sedaya
        ar_eg: الكل (كراما)
        ar: الجميع (كراما)
        en: all (krama)
      - text: malih
        ar_eg: تاني (كراما)
        ar: مرة أخرى (كراما)
        en: again (krama)
      - text: kedah
        ar_eg: لازم (كراما)
        ar: يجب (كراما)
        en: must (krama)
      - text: getun
        ar_eg: ندمان
        ar: نادم
        en: regret
    words: [sedaya, malih, kedah, getun]
  - id: e03
    type: listen
    text: Kula kedah sinau malih.
    question:
      ar_eg: بيقول إيه؟
      ar: ماذا يقول؟
      en: What does he say?
    options: [ذاكرت كتير, لازم أذاكر تاني, مش لازم أذاكر]
    answer: 1
    meaning:
      ar_eg: لازم أذاكر تاني.
      ar: يجب أن أدرس مرة أخرى.
      en: I must study again.
    words: [kedah, malih]
  - id: e04
    type: fill_blank
    sentence: ___ panjenengan sayah, mangga linggih.
    meaning:
      ar_eg: ___ حضرتك تعبان، اتفضل اقعد.
      ar: ___ كنت متعبًا فتفضّل اجلس.
      en: ___ you're tired, please sit down.
    options: [Menawi, Namung, Malih]
    answers: [Menawi]
    words: [menawi, namung, malih]
  - id: e05
    type: multiple_choice
    question: Kula ___ saged ngoko, dereng saged krama.
    options: [sedaya, namung, getun]
    answer: 1
    explain:
      ar_eg: namung = بس (mung بالكراما).
      ar: namung = فقط (mung بالكراما).
      en: namung = only (krama for mung).
    words: [sedaya, namung, getun]
  - id: e06
    type: fill_blank
    sentence: ___ tiyang sami bungah.
    meaning:
      ar_eg: ___ الناس مبسوطين.
      ar: ___ الناس سعداء.
      en: ___ the people are happy.
    options: [Sedaya, Kedah, Punika]
    answers: [Sedaya]
    words: [sedaya, kedah, punika, sami]
  - id: e07
    type: build_sentence
    source:
      ar_eg: لازم حضرتك تيجي تاني.
      ar: يجب أن تأتي مرة أخرى.
      en: You must come again.
    answer: Panjenengan kedah dhateng malih.
    distractors: [namung, getun]
    words: [kedah, malih]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kula getun, wingi mboten tumbas batik.
    answers_meaning:
      ar_eg: [أنا ندمان إني ما اشتريتش باتيك امبارح, ندمان، امبارح ما اشتريتش باتيك]
      ar: [أنا نادم لأنني لم أشترِ الباتيك أمس]
      en: [I regret not buying batik yesterday, 'I''m sorry I didn''t buy batik yesterday']
    words: [getun]
  - id: e09
    type: speaking
    text: Punika griya kula. Mangga mlebet.
    meaning:
      ar_eg: ده بيتي. اتفضل ادخل.
      ar: هذا بيتي. تفضّل ادخل.
      en: This is my home. Please come in.
    words: [punika]
  - id: e10
    type: multiple_choice
    question: Mas Dimas lan Mohamed ___ remen batik.
    options: [sami, malih, menawi]
    answer: 0
    explain:
      ar_eg: sami = الاتنين بيعملوا نفس الحاجة (padha بالكراما).
      ar: sami = كلاهما يفعل الشيء نفسه (padha بالكراما).
      en: sami = both do the same (krama for padha).
    words: [sami, malih, menawi]
dialogue:
  lines:
    - speaker: Pak Harjo
      text: Mohamed, panjenengan sampun sinau?
      ar_eg: يا محمد، ذاكرت؟
      ar: يا محمد، هل درست؟
      en: Mohamed, have you studied?
    - speaker: Mohamed
      text: Sampun, Pak, nanging namung sekedhik.
      ar_eg: أيوه يا أستاذ، بس شوية صغيرين.
      ar: نعم يا أستاذ، لكن قليلًا فقط.
      en: Yes, sir, but only a little.
    - speaker: Pak Harjo
      text: "Menawi namung sekedhik, nggih kedah sinau malih, to."
      ar_eg: "لو شوية بس، يبقى لازم تذاكر تاني، مش كده."
      ar: "إن كان قليلًا فقط فعليك أن تدرس مرة أخرى."
      en: "If it's only a little, you'll need to study again, won't you."
    - speaker: Mohamed
      text: Inggih, Pak. Kula getun, wingi kula dolan kemawon.
      ar_eg: حاضر يا أستاذ. أنا ندمان، امبارح فضلت أتفسّح وبس.
      ar: حسنًا يا أستاذ. أنا نادم، فقد قضيت الأمس في التنزّه فقط.
      en: 'Yes, sir. I regret it: yesterday I just went out.'
    - speaker: Pak Harjo
      text: "Mboten napa-napa. Sedaya murid nggih sami."
      ar_eg: "ولا يهمك. كل الطلبة كده."
      ar: "لا بأس. كل الطلاب هكذا."
      en: "Never mind. All students are the same."
    - speaker: Mohamed
      text: Matur nuwun, Pak. Punika PR kula.
      ar_eg: متشكر يا أستاذ. ده الواجب بتاعي.
      ar: شكرًا يا أستاذ. هذا واجبي.
      en: Thank you, sir. Here's my homework.
new_words:
  - word: menawi
    pos: conjunction
    ar_eg: لو (yen ← menawi)، كراما
    ar: إن، لو (yen ← menawi)، كراما
    en: if (ngoko yen, Indonesian kalau), krama
  - word: namung
    pos: adverb
    ar_eg: بس (mung ← namung)، كراما
    ar: فقط (mung ← namung)، كراما
    en: only (ngoko mung, Indonesian hanya), krama
  - word: punika
    pos: pronoun
    ar_eg: ده (iki ← punika)، كراما رسمي
    ar: هذا (iki ← punika)، كراما رسمي
    en: this (ngoko iki), formal krama; everyday menika, niki
  - word: sami
    pos: adjective
    ar_eg: زي بعض؛ الكل بيعمل نفس الحاجة (padha ← sami)، كراما
    ar: متماثل؛ يفعلون الشيء نفسه (padha ← sami)، كراما
    en: the same; all alike (ngoko padha, Indonesian sama), krama
  - word: sedaya
    pos: pronoun
    ar_eg: كل، الكل (kabeh ← sedaya)، كراما
    ar: كل، الجميع (kabeh ← sedaya)، كراما
    en: all, everyone (ngoko kabeh, Indonesian semua), krama
  - word: malih
    pos: adverb
    ar_eg: تاني، كمان مرة (maneh ← malih)، كراما
    ar: مرة أخرى (maneh ← malih)، كراما
    en: again (ngoko maneh, Indonesian lagi), krama
  - word: kedah
    pos: verb
    ar_eg: لازم (kudu ← kedah)، كراما
    ar: يجب (kudu ← kedah)، كراما
    en: must, have to (ngoko kudu, Indonesian harus), krama
  - word: getun
    pos: adjective
    ar_eg: ندمان
    ar: نادم
    en: regretful, sorry about something (= menyesal)
review:
  status: draft
  verified: false
