schema: kabar.lesson/v1
id: j3.u03.l03
language: jv
title: Sampéyan sampun nedha?
can_do:
  ar_eg: تسأل وترد بأدب.
  ar: أن تسأل وتجيب بأدب.
  en: Ask and answer politely.
slides:
  - title: Ganti tembungé
    body:
      ar_eg: |
        النهارده الضهر في كاومان، جنب الجامع الكبير. هتسأل وترد بالكراما. السر: بدّل كل كلمة صغيرة:
        - aku ← kula، kowé ← sampéyan
        - wis ← sampun، durung ← dèrèng، arep ← badhé، isih ← taksih
        - ora ← mboten، ana ← wonten، iya ← inggih
        - nang ← dhateng، saka ← saking، karo ← kaliyan
        Kowé wis mangan? ← Sampéyan sampun nedha?
      ar: |
        اليوم ظهرًا في كاومان قرب المسجد الكبير، ستسأل وتجيب بالكراما. والسر أن تبدّل كل لفظ صغير:
        - aku ← kula، وkowé ← sampéyan
        - wis ← sampun، وdurung ← dèrèng، وarep ← badhé، وisih ← taksih
        - ora ← mboten، وana ← wonten، وiya ← inggih
        - nang ← dhateng، وsaka ← saking، وkaro ← kaliyan
        Kowé wis mangan? ← Sampéyan sampun nedha?
      en: |
        Today at noon in Kauman, by the Grand Mosque, you'll ask and answer in krama. The secret: swap every small word:
        - aku → kula, kowé → sampéyan
        - wis → sampun, durung → dèrèng, arep → badhé, isih → taksih
        - ora → mboten, ana → wonten, iya → inggih
        - nang → dhateng, saka → saking, karo → kaliyan
        Kowé wis mangan? → Sampéyan sampun nedha?
    grammar: jv.krama.function-words
exercises:
  - id: e01
    type: multiple_choice
    question: Kowé wis mangan?
    question_meaning:
      ar_eg: حوّلها لكراما (لـ Pak Harjo البياع).
      ar: حوّلها إلى الكراما (للبائع Pak Harjo).
      en: Turn it into krama (for Pak Harjo, the seller).
    options: ['Sampéyan wis nedha?', 'Sampéyan sampun nedha?', 'Kowé sampun mangan?']
    answer: 1
    explain:
      ar_eg: 'لازم كل الكلمات تتبدل: kowé ← sampéyan، wis ← sampun، mangan ← nedha.'
      ar: 'تُبدّل الألفاظ كلها: kowé ← sampéyan، وwis ← sampun، وmangan ← nedha.'
      en: Every word swaps — kowé → sampéyan, wis → sampun, mangan → nedha.
    words: [sampéyan, sampun, nedha]
  - id: e02
    type: listen
    text: Sampun, Mas. Sampéyan?
    options: ['Dèrèng, Mas. Sampéyan?', 'Sampun, Mas. Sampéyan?', 'Wis, Mas. Kowé?']
    answer: 1
    words: [sampun, sampéyan]
  - id: e03
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: حضرتك كلت يا عم؟ (لـ Pak Harjo)
      ar: هل أكلتَ يا سيدي؟ (لـ Pak Harjo)
      en: Have you eaten, sir? (to Pak Harjo)
    answers: ['Sampéyan sampun nedha, Pak?', 'Sampeyan sampun nedha, Pak?', 'Sampéyan sampun nedha, Pak', 'Sampeyan sampun nedha, Pak', 'Pak, sampéyan sampun nedha?', 'Pak, sampeyan sampun nedha?', 'Pak, sampéyan sampun nedha', 'Pak, sampeyan sampun nedha', 'Sampéyan sampun nedha?', 'Sampeyan sampun nedha?', Sampéyan sampun nedha, Sampeyan sampun nedha, 'Panjenengan sampun dhahar, Pak?', 'Panjenengan sampun dhahar, Pak', 'Pak, panjenengan sampun dhahar?', 'Pak, panjenengan sampun dhahar']
    explain:
      ar_eg: 'للبياع: Sampéyan sampun nedha. ولو قلت panjenengan + dhahar لراجل كبير، ده أدب زيادة ومقبول.'
      ar: للبائع Sampéyan sampun nedha، وpanjenengan مع dhahar للرجل المسنّ أدب زائد مقبول.
      en: For a seller, Sampéyan sampun nedha; panjenengan + dhahar for an older man is extra polite and fine.
    words: [sampéyan, sampun, nedha]
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لسه يا عم. (ماكلتش لسه)
      ar: ليس بعد يا سيدي. (لم آكل بعد)
      en: Not yet, sir. (you haven't eaten)
    answers: ['Dèrèng, Pak.', 'Dereng, Pak.', 'Dèrèng, Pak', 'Dereng, Pak', 'Dèrèng, Pak. Kula dèrèng nedha.', 'Dereng, Pak. Kula dereng nedha.', 'Dèrèng, Pak. Kulo dèrèng nedha.', 'Dèrèng, Pak. Kula dèrèng nedha', 'Dereng, Pak. Kulo dereng nedha.', 'Dereng, Pak. Kula dereng nedha', 'Dèrèng, Pak. Kulo dèrèng nedha', 'Dereng, Pak. Kulo dereng nedha', 'Kula dèrèng nedha, Pak.', 'Kula dereng nedha, Pak.', 'Kulo dèrèng nedha, Pak.', 'Kula dèrèng nedha, Pak', 'Kulo dereng nedha, Pak.', 'Kula dereng nedha, Pak', 'Kulo dèrèng nedha, Pak', 'Kulo dereng nedha, Pak']
    words: [dèrèng]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا رايح الجامع مع دِيماس.
      ar: سأذهب إلى المسجد مع ديماس.
      en: I'm going to the mosque with Dimas.
    answer: Kula badhé dhateng masjid kaliyan Mas Dimas.
    distractors: [arep, karo]
    words: [badhé, dhateng, kaliyan]
  - id: e06
    type: fill_blank
    sentence: Inggih, kula ___ sinau krama.
    meaning:
      ar_eg: أيوه، أنا لسه بتعلم كراما.
      ar: نعم، ما زلتُ أتعلم الكراما.
      en: Yes, I'm still learning krama.
    answers: [taksih]
    explain:
      ar_eg: «لسه بـ» = isih ← taksih.
      ar: «ما زال» = isih ← taksih.
      en: '"Still" = isih → taksih.'
    words: [taksih]
  - id: e07
    type: fill_blank
    sentence: Nyuwun sewu, Pak, kula ___ ngertos.
    meaning:
      ar_eg: لا مؤاخذة يا عم، أنا مش فاهم.
      ar: عفوًا يا سيدي، لا أفهم.
      en: Excuse me, sir, I don't understand.
    answers: [mboten]
    words: [mboten]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: فيه شاي يا عم؟ (بالكراما — «شاي» = tèh)
      ar: هل يوجد شاي يا سيدي؟ (بالكراما — «شاي» = tèh)
      en: Is there tea, sir? (krama — "tea" = tèh)
    answers: ['Wonten tèh, Pak?', 'Wonten teh, Pak?', 'Wonten tèh, Pak', 'Wonten teh, Pak', 'Pak, wonten tèh?', 'Pak, wonten teh?', 'Pak, wonten tèh', 'Pak, wonten teh', 'Nyuwun sewu, wonten tèh, Pak?', 'Nyuwun sewu, wonten teh, Pak?', 'Nyuwun sewu, wonten tèh, Pak', 'Nyuwun sewu, wonten teh, Pak', 'Nyuwun sewu, Pak, wonten tèh?', 'Nyuwun sewu, Pak, wonten teh?', 'Nyuwun sewu, Pak, wonten tèh', 'Nyuwun sewu, Pak, wonten teh']
    words: [wonten]
  - id: e09
    type: dictation
    text: Sampéyan sampun nedha?
    meaning:
      ar_eg: حضرتك كلت؟
      ar: هل أكلتَ؟
      en: Have you eaten?
    words: [sampéyan, sampun, nedha]
  - id: e10
    type: speaking
    text: Dèrèng, Pak. Kula badhé nedha kaliyan Mas Dimas.
    meaning:
      ar_eg: لسه يا عم. أنا هاكل مع دِيماس.
      ar: ليس بعد يا سيدي. سآكل مع ديماس.
      en: Not yet, sir. I'm going to eat with Dimas.
    words: [dèrèng, badhé, nedha, kaliyan]
dialogue:
  title: Awan ing Kauman
  lines:
    - speaker: Pak Harjo
      text: Mas Mohamed! Sampéyan sampun nedha?
      ar_eg: يا أستاذ محمد! حضرتك كلت؟
      ar: يا محمد! هل أكلتَ؟
      en: Mohamed! Have you eaten?
    - speaker: Mohamed
      text: Dèrèng, Pak. Sampéyan?
      ar_eg: لسه يا عم. وحضرتك؟
      ar: ليس بعد يا سيدي. وأنت؟
      en: Not yet, sir. And you?
    - speaker: Pak Harjo
      text: Sampun, Mas. Sampéyan badhé nedha?
      ar_eg: كلت يا أستاذ. وحضرتك هتاكل دلوقتي؟
      ar: نعم أكلت. وهل ستأكل الآن؟
      en: I have. Are you going to eat?
    - speaker: Mohamed
      text: Inggih, Pak. Kula badhé nedha kaliyan Mas Dimas.
      ar_eg: أيوه يا عم. أنا هاكل مع دِيماس.
      ar: نعم يا سيدي. سآكل مع ديماس.
      en: Yes, sir. I'm going to eat with Dimas.
    - speaker: Pak Harjo
      text: Oh, inggih. Mangga, Mas.
      ar_eg: آه، ماشي. اتفضل يا أستاذ.
      ar: آه، حسنًا. تفضّل يا أخي.
      en: Oh, I see. Go ahead, then.
    - speaker: Mohamed
      text: Matur nuwun, Pak.
      ar_eg: شكرًا يا عم.
      ar: شكرًا يا سيدي.
      en: Thank you, sir.
