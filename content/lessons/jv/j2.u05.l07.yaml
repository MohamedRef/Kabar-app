schema: kabar.lesson/v1
id: j2.u05.l07
language: jv
title: Keturon!
can_do:
  ar_eg: تحكي إنك نمت من غير ما تاخد بالك وصحيت متأخر ونسيت، وتطلب حد يفكّرك، وتفتح وتقفل وتولّع.
  ar: أن تحكي أنك غفوت واستيقظت متأخرًا ونسيت، وتطلب من أحد أن يذكّرك، وتفتح وتغلق وتُشعل.
  en: Say you dozed off, overslept and forgot, ask someone to remind you, and open, close and light things.
slides:
  - title: Kawanen!
    body:
      ar_eg: |
        - **keturon** = نام من غير ما ياخد باله (ketiduran) · **kawanen** = صحي متأخر (kesiangan)
        - **kelalen** = نسي من غير قصد (kelupaan)، وlali = ينسى · **ngelingi** = يفكّر حد (mengingatkan)
        - **mbukak** = يفتح (membuka) · **nutup** = يقفل (menutup)
        - **nyumet** = يولّع، بوتاجاز أو ناموسية (menyalakan) · **mutung** = يزعل ويقمص ويسيب الحاجة (ngambek)
      ar: |
        - **keturon** = غفا دون قصد (ketiduran) · **kawanen** = استيقظ متأخرًا (kesiangan)
        - **kelalen** = نسي دون قصد (kelupaan)، وlali = ينسى · **ngelingi** = يذكّر غيره (mengingatkan)
        - **mbukak** = يفتح (membuka) · **nutup** = يغلق (menutup)
        - **nyumet** = يُشعل الموقد أو طارد البعوض (menyalakan) · **mutung** = يغضب ويترك الأمر (ngambek)
      en: |
        - **keturon** = doze off without meaning to (ketiduran) · **kawanen** = oversleep, wake late (kesiangan)
        - **kelalen** = forget by accident (kelupaan); lali = to forget · **ngelingi** = remind (mengingatkan)
        - **mbukak** = open (membuka) · **nutup** = close (menutup)
        - **nyumet** = light (a stove, a mosquito coil) (menyalakan) · **mutung** = sulk and give up (ngambek)
    examples:
      - text: Aku kawanen, wis jam wolu!
        ar_eg: صحيت متأخر، الساعة تمانية!
        ar: استيقظت متأخرًا، إنها الثامنة!
        en: I overslept, it's eight already!
      - text: Aku kelalen nutup toko.
        ar_eg: نسيت أقفل المحل.
        ar: نسيت إغلاق المتجر.
        en: I forgot to close the shop.
