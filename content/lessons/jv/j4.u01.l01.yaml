    en: drink (krama inggil, for the honoured person; ngoko ngombe, krama nginum) = minum
  - word: nginum
    pos: verb
    ar_eg: يشرب (كراما، تنفع عن نفسك)
    ar: يشرب (كراما، تصلح للحديث عن النفس)
    en: drink (krama, fine about yourself) = minum
  - word: kersa
    pos: verb
    ar_eg: يحب / يرضى (krama inggil؛ ngoko gelem)
    ar: يريد / يرضى (krama inggil؛ ngoko gelem)
    en: want, be willing (krama inggil; ngoko gelem) = mau
  - word: purun
    pos: verb
    ar_eg: يحب / يرضى (كراما، عن نفسك)
    ar: يريد / يرضى (كراما، عن النفس)
    en: want, be willing (krama, about yourself) = mau
  - word: mangga diunjuk
    pos: phrase
    ar_eg: اتفضل اشرب (للضيف أو الكبير؛ في الشات monggo diunjuk)
    ar: تفضّل بالشرب (للضيف أو الكبير)
    en: please have a drink (to a guest or elder; chat monggo diunjuk) = silakan diminum
