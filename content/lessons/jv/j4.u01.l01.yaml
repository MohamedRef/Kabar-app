schema: kabar.lesson/v1
id: j4.u01.l01
language: jv
title: Dhahar lan ngunjuk
can_do:
  ar_eg: تعزم على حد كبير بالأكل والشرب بأفعال التبجيل.
  ar: أن تعرض الطعام والشراب على الكبير بأفعال التبجيل.
  en: Offer an elder food and drink with honorific verbs.
slides:
  - title: Ngombe → nginum → ngunjuk
    body:
      ar_eg: |
        في J3 عرفت dhahar (ياكل، للشخص المحترم). الشرب والرغبة ليهم نفس التلات درجات:
        - يشرب: ngombe (نغوكو) → nginum (كراما) → ngunjuk (krama inggil). بالإندونيسي: minum.
        - يحب / يرضى: gelem → purun → kersa. بالإندونيسي: mau.
        يعني «حضرتك تحب تشرب شاي؟» = «Panjenengan kersa ngunjuk teh?». الفعل نفسه بيتغيّر عشان يكرّم اللي هيشرب، مش بس الضمير زي «حضرتك» عندنا.
        والمضيف بيقول وهو بيحط الكوباية: «Mangga diunjuk» = اتفضل اشرب.
      ar: |
        عرفتَ في J3 الفعل dhahar (يأكل، للمعظَّم). وللشرب والرغبة الدرجات الثلاث نفسها:
        - يشرب: ngombe (نغوكو) → nginum (كراما) → ngunjuk (krama inggil)، وبالإندونيسية minum.
        - يريد / يرضى: gelem → purun → kersa، وبالإندونيسية mau.
        فـ«هل تودّون شرب الشاي؟» = «Panjenengan kersa ngunjuk teh?»؛ يتبدّل الفعل نفسه تكريمًا للشارب، لا الضمير وحده.
        ويقول المضيف وهو يقدّم الكوب: «Mangga diunjuk» = تفضّل بالشرب.
      en: |
        In J3 you met dhahar (eat, for the honoured person). Drinking and wanting have the same three levels:
        - drink: ngombe (ngoko) → nginum (krama) → ngunjuk (krama inggil). Indonesian: minum.
        - want / be willing: gelem → purun → kersa. Indonesian: mau.
        So "Would you like some tea?" is "Panjenengan kersa ngunjuk teh?". The verb itself changes to honour the drinker, not only the pronoun as with «حضرتك».
        As a host sets the glass down, they say "Mangga diunjuk" = please, have a drink.
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Panjenengan kersa ngunjuk teh, Pak?
        ar_eg: حضرتك تحب تشرب شاي يا أستاذ؟
        ar: هل تودّ شرب الشاي يا سيدي؟
        en: Would you like some tea, sir?
      - text: Mangga diunjuk, Mbah.
        ar_eg: اتفضلي اشربي يا تيتة.
        ar: تفضّلي بالشرب يا جدتي.
        en: Please have a drink, Grandma.
  - title: Kula nginum, Bapak ngunjuk
    body:
      ar_eg: |
        القاعدة الدهبية زي ما هي: krama inggil هدية للتاني، مش ليك.
        - عن نفسك: nginum وpurun (كراما عادية).
        - عن الكبير: ngunjuk وkersa.
        لو حد كبير سألك «Kersa ngunjuk?» وإنت عايز، رد: «Inggih, purun.» مش «kula kersa» — دي كأنك بتقول «أنا سيادتي أتفضّل وأقبل».
      ar: |
        القاعدة الذهبية باقية: krama inggil تكريم للآخر لا لك.
        - عن نفسك: nginum وpurun (كراما عادية).
        - عن الكبير: ngunjuk وkersa.
        فإذا سألك كبير «Kersa ngunjuk?» وأردت، فأجب: «Inggih, purun.» لا «kula kersa».
      en: |
        Same golden rule: krama inggil is a gift for the other person, not for you.
        - About yourself: nginum and purun (plain krama).
        - About the elder: ngunjuk and kersa.
        If an elder asks "Kersa ngunjuk?" and you'd like some, answer "Inggih, purun." Not "kula kersa", which sounds like "I graciously deign to accept".
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Inggih, purun, Pak. Matur nuwun.
        ar_eg: أيوه، ياريت يا أستاذ. شكرًا.
        ar: نعم، بكل سرور يا سيدي. شكرًا.
        en: Yes, please, sir. Thank you.
      - text: Kula sampun nginum, Bu.
        ar_eg: أنا شربت خلاص يا هانم.
        ar: لقد شربتُ يا سيدتي.
        en: I've already had a drink, ma'am.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ngunjuk
        ar_eg: يشرب (krama inggil، للكبير)
        ar: يشرب (krama inggil، للكبير)
        en: drink (krama inggil, for the elder)
      - text: nginum
        ar_eg: يشرب (كراما، عن نفسك)
        ar: يشرب (كراما، عن نفسك)
        en: drink (krama, about yourself)
      - text: kersa
        ar_eg: يحب / يرضى (krama inggil، للكبير)
        ar: يريد (krama inggil، للكبير)
        en: want (krama inggil, for the elder)
      - text: purun
        ar_eg: يحب / يرضى (كراما، عن نفسك)
        ar: يريد (كراما، عن نفسك)
        en: want, be willing (krama, about yourself)
    words: [ngunjuk, nginum, kersa, purun]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: حطيت كوباية شاي قدام جدة صاحبك. تقول إيه؟
      ar: وضعتَ كوب شاي أمام جدة صديقك. ماذا تقول؟
      en: You set a glass of tea in front of your friend's grandmother. What do you say?
    options: ['Ayo ngombe, Mbah.', 'Mangga nginum, Mbah.', 'Mangga diunjuk, Mbah.']
    answer: 2
    explain:
      ar_eg: الشرب بتاعها هي، يبقى krama inggil (ngunjuk). «Mangga diunjuk» هي العبارة الثابتة. ngombe نغوكو، وnginum تنفع لنفسك بس.
      ar: "الشرب شربها هي، فيكون بالـ krama inggil: «Mangga diunjuk». وngombe نغوكو، وnginum للنفس."
      en: "It's her drinking, so krama inggil: \"Mangga diunjuk\" is the set phrase. ngombe is ngoko; nginum is for yourself."
    words: [mangga diunjuk, ngunjuk]
  - id: e03
    type: listen
    text: Panjenengan kersa ngunjuk teh, Pak?
    options: ['Panjenengan purun nginum teh, Pak?', 'Panjenengan kersa ngunjuk teh, Pak?', 'Kowe gelem ngombe teh?']
    answer: 1
    meaning:
      ar_eg: حضرتك تحب تشرب شاي يا أستاذ؟
      ar: هل تودّ شرب الشاي يا سيدي؟
      en: Would you like some tea, sir?
    words: [kersa, ngunjuk]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: Pak Harsono سألك لو شربت حاجة. إنت شربت. ترد بإيه؟
      ar: سألك Pak Harsono هل شربتَ شيئًا، وقد شربت. بمَ تجيب؟
      en: Pak Harsono asks whether you've had a drink. You have. What do you answer?
    options: ['Sampun, Pak. Kula sampun nginum.', 'Sampun, Pak. Kula sampun ngunjuk.', 'Uwis, Pak. Aku wis ngombe.']
    answer: 0
    explain:
      ar_eg: عن نفسك nginum (كراما عادية). ngunjuk تكريم للتاني، وuwis / aku / ngombe نغوكو مع حد كبير.
      ar: عن نفسك nginum، وngunjuk للآخر، وuwis / aku / ngombe نغوكو لا تليق بالكبير.
      en: About yourself it's nginum (plain krama). ngunjuk honours others; uwis / aku / ngombe is ngoko, too casual for an elder.
    words: [nginum, ngunjuk]
  - id: e05
    type: fill_blank
    sentence: Mas Mohamed kersa ngunjuk kopi? — Inggih, ___, Bu. Matur nuwun.
    meaning:
      ar_eg: يا محمد تحب تشرب قهوة؟ — أيوه ياريت يا هانم. شكرًا.
      ar: يا محمد، أتودّ شرب القهوة؟ — نعم، بكل سرور يا سيدتي. شكرًا.
      en: Mohamed, would you like some coffee? — Yes, please, ma'am. Thank you.
    options: [kersa, purun, gelem]
    answers: [purun]
    explain:
      ar_eg: هي بتكرّمك بـ kersa، وإنت بتتواضع وترد بـ purun. gelem نغوكو.
      ar: هي تكرمك بـ kersa، وأنت تتواضع فتجيب بـ purun. وgelem نغوكو.
      en: She honours you with kersa; you answer humbly with purun. gelem is ngoko.
    words: [purun, kersa]
  - id: e06
    type: fill_blank
    sentence: Mangga ___, Mbah.
    meaning:
      ar_eg: اتفضلي اشربي يا تيتة.
      ar: تفضّلي بالشرب يا جدتي.
      en: Please have a drink, Grandma.
    options: [ngombe, nginum, diunjuk]
    answers: [diunjuk]
    words: [mangga diunjuk]
  - id: e07
    type: build_sentence
    source:
      ar_eg: حضرتك تحبي تشربي شاي يا تيتة؟
      ar: هل تودّين شرب الشاي يا جدتي؟
      en: Would you like some tea, Grandma?
    answer: Panjenengan kersa ngunjuk teh, Mbah?
    distractors: [purun, nginum]
    words: [kersa, ngunjuk]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Pak Harsono) اتفضل اشرب يا أستاذ.
      ar: (إلى Pak Harsono) تفضّل بالشرب يا سيدي.
      en: (to Pak Harsono) Please have a drink, sir.
    answers: ['Mangga diunjuk, Pak.', 'Monggo diunjuk, Pak.', 'Mangga, Pak, diunjuk.', 'Monggo, Pak, diunjuk.', 'Mangga diunjuk, Pak Harsono.']
    explain:
      ar_eg: mangga (وبتتكتب في الشات monggo) + diunjuk = اتفضل اشرب.
      ar: mangga (وتُكتب في الدردشة monggo) + diunjuk = تفضّل بالشرب.
      en: mangga (chat spelling monggo) + diunjuk = please have a drink.
    words: [mangga diunjuk]
  - id: e09
    type: speaking
    text: Inggih, purun, Bu. Kula nginum teh kemawon.
    meaning:
      ar_eg: أيوه ياريت يا هانم. هشرب شاي بس.
      ar: نعم، بكل سرور يا سيدتي. سأشرب الشاي فقط.
      en: Yes, please, ma'am. I'll just have tea.
    words: [purun, nginum]
dialogue:
  title: Ing dalemipun Pak Harsono
  lines:
    - speaker: Bu Harsono
      text: Mas Mohamed kersa ngunjuk menapa? Teh menapa kopi?
      ar_eg: يا محمد تحب تشرب إيه؟ شاي ولا قهوة؟
      ar: يا محمد، ماذا تودّ أن تشرب؟ شايًا أم قهوة؟
      en: Mohamed, what would you like to drink? Tea or coffee?
    - speaker: Mohamed
      text: Teh kemawon, Bu. Matur nuwun.
      ar_eg: شاي بس يا هانم. شكرًا.
      ar: شايًا فقط يا سيدتي. شكرًا.
      en: Just tea, ma'am. Thank you.
    - speaker: Mohamed
      text: Bapak kersa ngunjuk teh ugi?
      ar_eg: وحضرتك يا أستاذ تحب تشرب شاي كمان؟
      ar: وهل تودّ أنت أيضًا شرب الشاي يا سيدي؟
      en: Would you like some tea too, sir?
    - speaker: Pak Harsono
      text: Inggih. Mangga, Mas, diunjuk.
      ar_eg: أيوه. اتفضل اشرب يا ابني.
      ar: نعم. تفضّل بالشرب يا بني.
      en: Yes. Please, have a drink.
    - speaker: Mohamed
      text: Mangga, Pak, diunjuk rumiyin.
      ar_eg: لا، اتفضل حضرتك الأول يا أستاذ.
      ar: بل تفضّل أنت أولًا يا سيدي.
      en: Please, sir, you drink first.
