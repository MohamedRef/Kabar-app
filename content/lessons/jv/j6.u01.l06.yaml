  - id: e03
    type: listen
    text: Pak Slamet ngukir ali-ali nganggo tatah cilik.
    question:
      ar_eg: بيعمل إيه؟
      ar: ماذا يفعل؟
      en: What is he doing?
    options: [بينقش خاتم بأزميل صغير, بيشتري خاتم دهب, بيكسر الخاتم بالشاكوش]
    answer: 0
    meaning:
      ar_eg: عم سلامت بينقش خاتم بأزميل صغير.
      ar: ينقش السيد سلامت خاتمًا بإزميل صغير.
      en: Pak Slamet engraves a ring with a small chisel.
    words: [ngukir, ali-ali, tatah]
  - id: e04
    type: fill_blank
    sentence: Perak iki digosok nganti ___.
    meaning:
      ar_eg: الفضة دي اتلمّعت لحد ما بقت ___.
      ar: صُقلت هذه الفضة حتى صارت ___.
      en: This silver was polished until it was ___.
    options: [kinclong, tliti, palu]
    answers: [kinclong]
    words: [kinclong, tliti, palu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بيعمل حاجات بإيده زي الفضيات اسمه …
      ar: من يصنع أشياء بيده كالمشغولات الفضية يسمّى …
      en: Someone who makes things by hand, like silverware, is a …
    options: [ukiran, pengrajin, tatah]
    answer: 1
    explain:
      ar_eg: pengrajin = صنايعي. ukiran = النقشة، tatah = الأزميل.
      ar: pengrajin = حِرفي؛ ukiran = النقش، tatah = الإزميل.
      en: pengrajin = craftsman; ukiran = carving, tatah = chisel.
    words: [ukiran, pengrajin, tatah]
  - id: e06
    type: fill_blank
    sentence: Pak Slamet nuthuk perak nganggo ___.
    meaning:
      ar_eg: عم سلامت بيخبط الفضة بـ___.
      ar: يطرق السيد سلامت الفضة بـ___.
      en: Pak Slamet beats the silver with a ___.
    options: [palu, kinclong, ali-ali]
    answers: [palu]
    words: [palu, kinclong, ali-ali]
  - id: e07
    type: multiple_choice
    question: Ukirane alus banget. Pengrajine ___.
    options: [kinclong, ngukir, tliti]
    answer: 2
    explain:
      ar_eg: 'النقش الناعم محتاج صنايعي دقيق: tliti.'
      ar: 'النقش الدقيق يحتاج حِرفيًا متأنيًا: tliti.'
      en: 'Fine carving needs a meticulous craftsman: tliti.'
    words: [kinclong, ngukir, tliti]
  - id: e08
    type: build_sentence
    source:
      ar_eg: النقشة دي حلوة أوي.
      ar: هذا النقش جميل جدًا.
      en: This carving is really beautiful.
    answer: Ukiran iki apik banget.
    distractors: [palu, tatah]
    words: [ukiran]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pengrajin perak ing Kutha Gedhe kudu tliti.
    answers_meaning:
      ar_eg: [صنايعية الفضة في كوتاجيدي لازم يكونوا دقيقين, صنايعي الفضة في كوتاجيدي لازم يبقى دقيق]
      ar: [يجب أن يكون حِرفيّو الفضة في كوتاغيدي دقيقين, على حِرفي الفضة في كوتاغيدي أن يكون دقيقًا]
      en: [Silversmiths in Kotagede have to be meticulous, A silver craftsman in Kotagede must be careful]
    words: [pengrajin, tliti]
  - id: e10
    type: speaking
    text: Aku pengin ali-ali sing kinclong.
    meaning:
      ar_eg: أنا نفسي في خاتم بيلمع.
      ar: أريد خاتمًا لامعًا.
      en: I'd like a shiny ring.
    words: [ali-ali, kinclong]
dialogue:
  lines:
    - speaker: Pak Slamet
      text: Mangga pinarak, Mas Mohamed. Menika bengkel kula.
      ar_eg: اتفضل اقعد يا محمد. دي ورشتي.
      ar: تفضّل بالجلوس يا محمد. هذه ورشتي.
      en: Please, come in and sit, Mas Mohamed. This is my workshop.
    - speaker: Mohamed
      text: Matur nuwun, Pak. Menapa menika tatah?
      ar_eg: شكرًا يا عم. ده أزميل؟
      ar: شكرًا يا سيدي. أهذا إزميل؟
      en: Thank you, sir. Is this a chisel?
    - speaker: Pak Slamet
      text: Inggih. Tatah kaliyan palu kangge ngukir perak.
      ar_eg: أيوه. الأزميل والشاكوش عشان ننقش الفضة.
      ar: نعم. الإزميل والمطرقة لنقش الفضة.
      en: Yes. The chisel and hammer are for engraving silver.
    - speaker: Mohamed
      text: Ukiranipun alus sanget. Pengrajin kedah tliti, nggih?
      ar_eg: النقش ناعم جدًا. الصنايعي لازم يكون دقيق، صح؟
      ar: النقش ناعم جدًا. يجب أن يكون الحِرفي دقيقًا، أليس كذلك؟
      en: The carving is so fine. A craftsman must be meticulous, right?
    - speaker: Pak Slamet
      text: Leres. Pungkasanipun, perakipun dipungosok ngantos kinclong.
      ar_eg: صح. وفي الآخر، الفضة بتتلمّع لحد ما تبرق.
      ar: صحيح. وفي النهاية تُصقل الفضة حتى تلمع.
      en: Right. At the end, the silver is polished until it gleams.
    - speaker: Mohamed
      text: Kula kok kepengin tumbas ali-ali setunggal.
      ar_eg: أنا عايز أشتري خاتم واحد.
      ar: أريد أن أشتري خاتمًا واحدًا.
      en: I'd like to buy a ring.
