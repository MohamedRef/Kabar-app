schema: kabar.lesson/v1
id: j6.u01.l06
language: jv
title: Ana apa?
can_do:
  ar_eg: تقرا أسئلة قصيرة مكتوبة بالخط الجاوي وتعرف بتسأل عن إيه.
  ar: أن تقرأ أسئلة قصيرة بالخط الجاوي وتفهم عمّ تسأل.
  en: Read short questions in aksara Jawa and know what they ask.
slides:
  - title: Kertu pitakon
    body:
      ar_eg: |
        ديماس كتب لك أسئلة على كروت صغيرة. مفيش مسافات ولا علامة استفهام، فإنت اللي بتقسّم الكلام: ꦲꦤ ana + ꦲꦥ apa = Ana apa?
        وافتكر: الكلمة اللي بتبدأ بحرف متحرك بتتكتب بـ ꦲ، فلما تشوف ꦲ في النص غالبًا كلمة جديدة بدأت.
      ar: |
        كتب لك ديماس أسئلة على بطاقات صغيرة، بلا مسافات ولا علامة استفهام، فأنت من يقسّم الكلام: ꦲꦤ ana + ꦲꦥ apa = Ana apa?
        وتذكّر: الكلمة المبدوءة بصائت تُكتب بـ ꦲ، فإذا رأيت ꦲ وسط النص فالغالب أن كلمة جديدة بدأت.
      en: |
        Dimas has written questions for you on little cards. No spaces and no question mark, so you split the words yourself: ꦲꦤ ana + ꦲꦥ apa = Ana apa?
        Remember: a word starting with a vowel is written with ꦲ, so a ꦲ in the middle often means a new word has started.
    grammar: jv.aksara.nglegena
    examples:
      - text: ꦲꦤꦲꦥ (Ana apa?)
        ar_eg: فيه إيه؟ / إيه الحكاية؟
        ar: ماذا هناك؟ / ما الأمر؟
        en: What's up? / What's the matter?
      - text: ꦱꦥꦩꦕ (Sapa maca?)
        ar_eg: مين بيقرا؟
        ar: من يقرأ؟
        en: Who's reading?
      - text: ꦩꦕꦲꦥ (Maca apa?)
        ar_eg: بتقرا إيه؟
        ar: ماذا تقرأ؟
        en: What are you reading?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ꦲꦥ
        ar_eg: apa — إيه؟
        ar: apa — ماذا؟
        en: apa — what?
      - text: ꦱꦥ
        ar_eg: sapa — مين؟
        ar: sapa — من؟
        en: sapa — who?
      - text: ꦔꦥ
        ar_eg: ngapa — ليه؟
        ar: ngapa — لماذا؟
        en: ngapa — why?
      - text: ꦏꦪ
        ar_eg: kaya — زي
        ar: kaya — مثل
        en: kaya — like
    words: [ꦲ, ꦱ, ꦔ, ꦏ, ꦪ]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: "اقرا الكارت: ꦲꦤꦲꦥ"
      ar: "اقرأ البطاقة: ꦲꦤꦲꦥ"
      en: "Read the card: ꦲꦤꦲꦥ"
    options: [apa ana, ana apa, ana sapa]
    answer: 1
    explain:
      ar_eg: "ꦲꦤ = ana، وبعدها ꦲ تانية بتبدأ كلمة جديدة: ꦲꦥ = apa."
      ar: "ꦲꦤ = ana، ثم ꦲ ثانية تبدأ كلمة جديدة: ꦲꦥ = apa."
      en: "ꦲꦤ = ana, then a second ꦲ starts a new word: ꦲꦥ = apa."
    words: [ꦲ]
  - id: e03
    type: listen
    text: Sapa maca?
    question:
      ar_eg: ديماس قرا كارت بصوت عالي. أنهي كارت؟
      ar: قرأ ديماس بطاقة بصوت عالٍ. أيّها؟
      en: Dimas read a card aloud. Which card?
    options: ["ꦩꦕꦲꦥ", "ꦲꦤꦲꦥ", "ꦱꦥꦩꦕ"]
    answer: 2
    meaning:
      ar_eg: مين بيقرا؟
      ar: من يقرأ؟
      en: Who's reading?
    words: [ꦱ, ꦩ, ꦕ]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: "محمد ردّ على كارت وقال: «Maca buku». كان بيرد على أنهي كارت؟"
      ar: "ردّ محمد على بطاقة فقال: «Maca buku». على أي بطاقة ردّ؟"
      en: "Mohamed answered a card: «Maca buku» (Reading a book). Which card was it?"
    options: ["ꦩꦕꦲꦥ", "ꦱꦥꦩꦕ", "ꦔꦥ"]
    answer: 0
    explain:
      ar_eg: "Maca apa? = بتقرا إيه؟ والرد: كتاب."
      ar: "Maca apa? = ماذا تقرأ؟ والجواب: كتابًا."
      en: "Maca apa? = What are you reading? Answer: a book."
    words: [ꦩ, ꦕ]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "حد ردّ: «Ora ana apa-apa» (مفيش حاجة). كان بيرد على أنهي كارت؟"
      ar: "أجاب أحدهم: «Ora ana apa-apa» (لا شيء). على أي بطاقة؟"
      en: "Someone answered «Ora ana apa-apa» (Nothing's up). Which card?"
    options: ["ꦱꦥꦩꦕ", "ꦲꦤꦲꦥ", "ꦩꦕꦲꦥ"]
    answer: 1
    words: [ꦲ, ꦤ, ꦥ]
  - id: e06
    type: fill_blank
    sentence: ꦔꦥ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: ليه؟)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: لماذا؟)"
      en: Type the reading in Latin letters. (It means "why?".)
    answers: [ngapa, ngopo]
    explain:
      ar_eg: ꦔ nga + ꦥ pa = ngapa. وبتتنطق ngopo، وفي الشات كتير بيكتبوها كده.
      ar: ꦔ nga + ꦥ pa = ngapa، وتُنطق ngopo وكثيرًا ما تُكتب هكذا في الدردشة.
      en: ꦔ nga + ꦥ pa = ngapa. It's said ngopo, and chats often write it that way.
    words: [ꦔ, ꦥ]
  - id: e07
    type: fill_blank
    sentence: ___ maca? — Dimas.
    meaning:
      ar_eg: مين بيقرا؟ — ديماس.
      ar: من يقرأ؟ — ديماس.
      en: Who's reading? — Dimas.
    options: [Apa, Sapa, Ngapa]
    answers: [Sapa]
    words: [ꦱ]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب الكارت ده بالحروف اللاتينية: ꦏꦪꦲꦥ"
      ar: "اكتب هذه البطاقة بالحروف اللاتينية: ꦏꦪꦲꦥ"
      en: "Write this card in Latin letters: ꦏꦪꦲꦥ"
    answers: ["Kaya apa?", kaya apa, kayaapa, koyo opo]
    explain:
      ar_eg: ꦏꦪ kaya + ꦲꦥ apa = Kaya apa? يعني «عامل إزاي؟ / شكله إيه؟».
      ar: ꦏꦪ kaya + ꦲꦥ apa = Kaya apa? أي «كيف هو؟».
      en: ꦏꦪ kaya + ꦲꦥ apa = Kaya apa? "What's it like? / How?"
    words: [ꦏ, ꦪ]
  - id: e09
    type: build_sentence
    source:
      ar_eg: "اكتب الكارت «Sapa maca?» حرف حرف."
      ar: "اكتب البطاقة «Sapa maca?» حرفًا حرفًا."
      en: "Write the card «Sapa maca?» letter by letter."
    answer: ꦱ ꦥ ꦩ ꦕ
    distractors: ["ꦗ"]
    words: [ꦱ, ꦥ, ꦩ, ꦕ]
dialogue:
  title: Dolanan kertu
  lines:
    - speaker: Dimas
      text: Med, aku nulis pitakon nganggo aksara Jawa. Wacanen!
      ar_eg: يا محمد، كتبت أسئلة بالخط الجاوي. اقراها!
      ar: يا محمد، كتبت أسئلة بالخط الجاوي. اقرأها!
      en: Med, I've written questions in aksara Jawa. Read them!
    - speaker: Mohamed
      text: Sapa maca? Lha, aku sing maca!
      ar_eg: مين بيقرا؟ ما أنا اللي بقرا!
      ar: من يقرأ؟ أنا الذي أقرأ!
      en: Who's reading? Well, I am!
    - speaker: Dimas
      text: Ha ha, bener. Lha iki?
      ar_eg: ها ها، صح. وده؟
      ar: ها ها، صحيح. وهذه؟
      en: Ha ha, right. And this one?
    - speaker: Mohamed
      text: Maca apa? Aku maca tulisanmu, Mas.
      ar_eg: بتقرا إيه؟ بقرا كتابتك يا ديماس.
      ar: ماذا تقرأ؟ أقرأ كتابتك يا ديماس.
      en: What are you reading? I'm reading your writing, Mas.
    - speaker: Dimas
      text: Pinter!
      ar_eg: شاطر!
      ar: أحسنت!
      en: Clever!
review:
  status: draft
  verified: false
