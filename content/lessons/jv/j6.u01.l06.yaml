schema: kabar.lesson/v1
id: j6.u01.l06
language: jv
title: Ing bengkel perak
can_do:
  ar_eg: تزور ورشة فضة في كوتاجيدي وتتكلم كراما عن النقش والأدوات والصنايعي.
  ar: أن تزور ورشة فضة في كوتاغيدي وتتحدث بالكراما عن النقش والأدوات والحرفي.
  en: Visit a Kotagede silver workshop and talk, in krama, about engraving, tools and the craftsman.
slides:
  - title: Bengkele Pak Slamet
    body:
      ar_eg: |
        ngukir = ينقش أو يحفر، ukiran = النقشة نفسها. الأدوات: tatah = أزميل، palu = شاكوش.
        pengrajin = صنايعي (حِرَفي)، tliti = دقيق وبياخد باله من كل حاجة.
        kinclong = بيلمع، ali-ali = خاتم.
      ar: |
        ngukir = ينقش، ukiran = النقش نفسه. الأدوات: tatah = إزميل، palu = مطرقة.
        pengrajin = حِرفي، tliti = دقيق متأنٍّ.
        kinclong = لامع برّاق، ali-ali = خاتم.
      en: |
        ngukir = engrave, carve; ukiran = the carving. Tools: tatah = chisel, palu = hammer.
        pengrajin = craftsman, tliti = meticulous, careful.
        kinclong = shiny, gleaming; ali-ali = ring.
    examples:
      - text: Pak Slamet ngukir jeneng nganggo aksara Jawa.
        ar_eg: عم سلامت بينقش أسامي بالحروف الجاوية.
        ar: ينقش السيد سلامت الأسماء بالحروف الجاوية.
        en: Pak Slamet engraves names in Javanese script.
      - text: Pengrajin perak kudu tliti.
        ar_eg: صنايعي الفضة لازم يكون دقيق.
        ar: يجب أن يكون حِرفي الفضة دقيقًا.
        en: A silversmith has to be meticulous.
      - text: Ali-ali iki kinclong banget.
        ar_eg: الخاتم ده بيلمع أوي.
        ar: هذا الخاتم لامع جدًا.
        en: This ring really gleams.
