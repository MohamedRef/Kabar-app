dialogue:
  title: Janjian ing Alun-alun
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, sesuk dolan menyang Alun-alun, ya?
      ar_eg: يا محمد، بكرة نخرج الميدان؟
      ar: يا محمد، هل نخرج غدًا إلى الميدان؟
      en: Mohamed, shall we go out to the Alun-alun tomorrow?
    - speaker: Mohamed
      text: Ayo! Jam pira?
      ar_eg: يلا! الساعة كام؟
      ar: هيا! في أي ساعة؟
      en: Let's! What time?
    - speaker: Mbak Ayu
      text: Jam papat sore. Aja lali, ya!
      ar_eg: الساعة أربعة العصر. ماتنساش!
      ar: الساعة الرابعة عصرًا. لا تنسَ!
      en: Four in the afternoon. Don't forget!
    - speaker: Mohamed
      text: Ora lali, kok. Aku mesthi teka.
      ar_eg: مش هنسى. أكيد هاجي.
      ar: لن أنسى. سآتي بالتأكيد.
      en: I won't forget. I'll definitely come.
    - speaker: Mbak Ayu
      text: Mengko awake dhewe mangan sega lan kenthang goreng.
      ar_eg: وبعدين ناكل رز وبطاطس محمّرة.
      ar: ثم نأكل أرزًا وبطاطا مقلية.
      en: Then we'll eat rice and fried potatoes.
souvenir:
  id: j5.u03.souvenir
  title: Alun-alun Madiun
  note:
    ar_eg: |
      الـ Alun-alun هو الميدان الكبير في قلب ماديون، ومن الناحية الغربية بتاعته الجامع الكبير Baitul Hakim اللي الهولنديين كانوا بيسموه De Missigit te Madioen. وبالليل بيتملي عربيات أكل وعيلات بتتمشى. ولو بصّيت على لافتات الأكل هتلاقي «sego» و«piro» مكتوبين زي ما بيتنطقوا، بالظبط زي الشات. ودلوقتي إنت عارف ترجّعهم للإملا الرسمي، ولعبة Minimal Pairs مستنياك تتدرّب على dh وth.
    ar: |
      الـ Alun-alun هو الميدان الكبير في قلب ماديون، وعلى جانبه الغربي المسجد الجامع Baitul Hakim الذي سمّاه الهولنديون De Missigit te Madioen. ويمتلئ ليلًا بعربات الطعام والعائلات المتنزّهة. وعلى لافتات الطعام سترى «sego» و«piro» مكتوبتين كما تُنطقان، تمامًا كالدردشة. وأنت الآن تعرف كيف تردّهما إلى الإملاء القياسي، ولعبة Minimal Pairs تنتظرك لتتدرّب على dh وth.
    en: |
      The Alun-alun is the big square at the heart of Madiun, with the great Baitul Hakim mosque on its west side (the Dutch called it De Missigit te Madioen). At night it fills with food carts and strolling families. On the food signs you'll see "sego" and "piro" spelled the way they sound, just like in chats. Now you know how to bring them back to standard spelling, and the Minimal Pairs game is waiting to train your dh and th.
