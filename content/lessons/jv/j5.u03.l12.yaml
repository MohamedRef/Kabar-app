      en:
        - Writing monggo isn't wrong in a chat, but the standard is mangga.
        - The spelling monggo isn't wrong in a chat, but the standard is mangga.
        - Monggo isn't wrong in a chat, but the standard spelling is mangga.
        - Monggo isn't wrong in chats, but the standard is mangga.
