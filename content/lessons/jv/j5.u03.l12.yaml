schema: kabar.lesson/v1
id: j5.u03.l12
language: jv
title: Ulangan J5.3
can_do:
  ar_eg: ترجّع شات للإملا الرسمي.
  ar: أن تردّ دردشة إلى الإملاء القياسي.
  en: Normalise a chat into standard spelling.
slides:
  - title: Saka chat menyang tulisan baku
    body:
      ar_eg: |
        تلات خطوات عشان ترجّع أي شات لإملاه الرسمي:
        1. الـ o اللي آخر الكلمة غالبًا a: piro → pira، sego → sega، ojo → aja. (بس loro = اتنين، kono = هناك: دول o أصلية.)
        2. رجّع الـ h اللي وقعت: dewe → dhewe.
        3. wes → wis، nggih → inggih، monggo → mangga، وsego ne → segane.
      ar: |
        ثلاث خطوات لردّ أي دردشة إلى الإملاء القياسي:
        1. o في آخر الكلمة غالبًا a: piro ← pira، وsego ← sega، وojo ← aja (إلا o الأصلية: loro = اثنان، kono = هناك).
        2. أعِد h الساقطة: dewe ← dhewe.
        3. wes ← wis، وnggih ← inggih، وmonggo ← mangga، وsego ne ← segane.
      en: |
        Three steps to bring any chat back to standard spelling:
        1. A final o is usually an a: piro → pira, sego → sega, ojo → aja. (But loro = two and kono = there have a real o.)
        2. Restore a dropped h: dewe → dhewe.
        3. wes → wis, nggih → inggih, monggo → mangga, and sego ne → segane.
    grammar: jv.orthography
    examples:
      - text: Pira regane? Segane wis mateng.
        ar_eg: "بكام؟ الرز استوى. (في الشات: piro regane? sego ne wes mateng)"
        ar: "بكم؟ الأرز قد نضج. (في الدردشة: piro regane? sego ne wes mateng)"
        en: "How much? The rice is cooked. (in a chat: piro regane? sego ne wes mateng)"
      - text: Aja lali, aku dhewe sing teka.
        ar_eg: "ماتنساش، أنا بنفسي اللي جاي. (في الشات: ojo lali, aku dewe sing teko)"
        ar: "لا تنسَ، أنا بنفسي من سيأتي. (في الدردشة: ojo lali, aku dewe sing teko)"
        en: "Don't forget, I'm the one coming myself. (in a chat: ojo lali, aku dewe sing teko)"
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: opo
        ar_eg: apa (إيه)
        ar: apa (ماذا)
        en: apa (what)
      - text: sego
        ar_eg: sega (رز)
        ar: sega (أرز)
        en: sega (rice)
      - text: ojo
        ar_eg: aja (ماتعملش)
        ar: aja (لا تفعل)
        en: aja (don't)
      - text: lungo
        ar_eg: lunga (يمشي / يروح)
        ar: lunga (يذهب)
        en: lunga (to go)
      - text: monggo
        ar_eg: mangga (اتفضل)
        ar: mangga (تفضّل)
        en: mangga (please, go ahead)
      - text: wes
        ar_eg: wis (خلاص / خلّص)
        ar: wis (قد / انتهى)
        en: wis (already)
    words: [apa, sega, aja, baku]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة الـ o فيها أصلية وبتتكتب o في الإملا الرسمي؟
      ar: أي كلمة فيها o أصلية تُكتب o في الإملاء القياسي؟
      en: Which word has a real o, written o in standard spelling?
    options: [piro, loro, sego]
    answer: 1
    explain:
      ar_eg: loro = اتنين، والـ o فيها أصلية. piro وsego إملا شات لـ pira وsega.
      ar: loro = اثنان، وo فيها أصلية، أما piro وsego فإملاء دردشة لـ pira وsega.
      en: loro = two, with a real o; piro and sego are chat spellings of pira and sega.
    words: [lara]
