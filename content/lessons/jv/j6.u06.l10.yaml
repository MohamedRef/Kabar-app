schema: kabar.lesson/v1
id: j6.u06.l10
language: jv
title: Layang saka Ali
can_do:
  ar_eg: تقرا رسالة قصيرة من صاحب مكتوبة بالبيجون.
  ar: أن تقرأ رسالة قصيرة من صديق مكتوبة بالبيجون.
  en: Read a short note from a friend written in Pegon.
slides:
  - title: Layang Pegon
    body:
      ar_eg: |
        Ali، طالب في البيسانترين، بعت لمحمد ورقة بالبيجون والنغوكو.
        بص: محمد وعلي وكتاب أسامي وكلمات عربي، فبتتكتب بالعربي زي ما هي. والباقي جاوي بحروف عربي: ايكي = iki، انا = ana، مريني = mrene (تعالى هنا).
      ar: |
        أرسل علي، طالب البيسانترين، إلى محمد ورقة بالبيجون وبالنغوكو.
        لاحظ: محمد وعلي وكتاب أسماء وألفاظ عربية، فتُكتب بالعربية كما هي، والباقي جاوي بحروف عربية: ايكي = iki، انا = ana، مريني = mrene (تعالَ هنا).
      en: |
        Ali, a pesantren student, sent Mohamed a note in Pegon, in ngoko.
        Notice: محمد, علي and كتاب are Arabic names and words, so they keep their Arabic spelling. The rest is Javanese in Arabic letters: ايكي = iki, انا = ana, مريني = mrene (come here).
    grammar: jv.pegon.basics
    examples:
      - text: ماس محمد، سوري ايكي انا ڠاجي كتاب. (Mas Mohamed, sore iki ana ngaji kitab.)
        ar_eg: يا محمد، النهارده العصر فيه درس كتب.
        ar: يا محمد، عصر اليوم درس كتب.
        en: Mohamed, there's kitab study this afternoon.
      - text: ايو مريني، ڮاوا كتابمو. (Ayo mrene, gawa kitabmu.)
        ar_eg: تعالى هنا، وهات كتابك.
        ar: تعالَ إلى هنا، وأحضر كتابك.
        en: Come over, and bring your kitab.
      - text: علي (Ali)
        ar_eg: علي
        ar: علي
        en: Ali
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: فيه إيه النهارده؟
      ar: ماذا هناك اليوم؟
      en: What's on today?
    options: [ngaji kitab, kerja bakti, wayang]
    answer: 0
    words: [ڠ, kitab]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إمتى؟
      ar: متى؟
      en: When?
    options: [esuk iki, sore iki, sesuk]
    answer: 1
    explain:
      ar_eg: سوري ايكي = sore iki (النهارده العصر).
      ar: سوري ايكي = sore iki (عصر اليوم).
      en: سوري ايكي = sore iki (this afternoon).
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: علي عايز محمد يجيب إيه؟
      ar: ماذا يريد علي أن يُحضر محمد؟
      en: What should Mohamed bring?
    options: [gula, kitab, sega]
    answer: 1
    explain:
      ar_eg: ڮاوا كتابمو = gawa kitabmu (هات كتابك). ‑mu = بتاعك.
      ar: ڮاوا كتابمو = gawa kitabmu (أحضر كتابك)، و‑mu = لك.
      en: ڮاوا كتابمو = gawa kitabmu (bring your kitab). ‑mu = your.
    words: [kitab, ڮ]
  - id: e04
    type: listen
    text: Ayo mrene, gawa kitabmu.
    question:
      ar_eg: علي قال سطر من الورقة. أنهي سطر؟
      ar: قال علي سطرًا من الورقة. أيّه؟
      en: Ali read one line of the note aloud. Which one?
    options: [ايو مريني، ڮاوا كتابمو, سوري ايكي انا ڠاجي كتاب, ماس محمد]
    answer: 0
    meaning:
      ar_eg: تعالى هنا، وهات كتابك.
      ar: تعالَ إلى هنا، وأحضر كتابك.
      en: Come over, and bring your kitab.
  - id: e05
    type: match_pairs
    pairs:
      - text: انا
        ar_eg: ana — فيه
        ar: ana — يوجد
        en: ana — there is
      - text: ايكي
        ar_eg: iki — ده / النهارده (مع sore)
        ar: iki — هذا
        en: iki — this
      - text: مريني
        ar_eg: mrene — لهنا
        ar: mrene — إلى هنا
        en: mrene — (to) here
      - text: ڮاوا
        ar_eg: gawa — يجيب / يشيل
        ar: gawa — يُحضر / يحمل
        en: gawa — bring
    words: [ڮ, pegon]
  - id: e06
    type: fill_blank
    sentence: مريني = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: لهنا)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: إلى هنا)"
      en: Type the reading in Latin letters. (It means "(to) here".)
    answers: [mrene]
    explain:
      ar_eg: "م ر، وبعدين ي = é، ن، ي = é: mrene."
      ar: "م ر، ثم ي = é، ن، ي = é: mrene."
      en: "م ر, then ي = é, ن, ي = é: mrene."
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: سوري ايكي انا ڠاجي كتاب"
      ar: "اكتب بالحروف اللاتينية: سوري ايكي انا ڠاجي كتاب"
      en: "Write in Latin letters: سوري ايكي انا ڠاجي كتاب"
    answers: [sore iki ana ngaji kitab, "Sore iki ana ngaji kitab."]
    words: [ڠ, kitab]
  - id: e08
    type: build_sentence
    source:
      ar_eg: "اكتب الرد بالبيجون: aku mrene ngaji (جاي الدرس)"
      ar: "اكتب الردّ بالبيجون: aku mrene ngaji (قادم إلى الدرس)"
      en: "Write a reply in Pegon: aku mrene ngaji (I'm coming over to study)"
    answer: اكو مريني ڠاجي
    distractors: [اورا]
    words: [pegon]
  - id: e09
    type: speaking
    text: Iya, aku mrene. Matur nuwun, Ali!
    meaning:
      ar_eg: حاضر، أنا جاي. شكرًا يا علي!
      ar: حسنًا، أنا قادم. شكرًا يا علي!
      en: Sure, I'm coming. Thanks, Ali!
dialogue:
  title: Ali lan Mohamed
  lines:
    - speaker: Ali
      text: Mas, wis maca layangku?
      ar_eg: يا محمد، قريت ورقتي؟
      ar: يا محمد، أقرأت ورقتي؟
      en: Mas, did you read my note?
    - speaker: Mohamed
      text: Wis! Tulisan Pegon gampang kok kanggo aku.
      ar_eg: قريتها! البيجون سهل عليّ.
      ar: نعم! البيجون سهل عليّ.
      en: Yes! Pegon is easy for me.
    - speaker: Ali
      text: Jenengmu ditulis Arab, ya. محمد!
      ar_eg: "واسمك مكتوب بالعربي: محمد!"
      ar: "واسمك مكتوب بالعربية: محمد!"
      en: Your name is in Arabic spelling, see — محمد!
    - speaker: Mohamed
      text: Iya, lan jenengmu uga, علي. Ayo ngaji!
      ar_eg: "أيوه، واسمك كمان: علي. يلا على الدرس!"
      ar: "نعم، واسمك أيضًا: علي. هيا إلى الدرس!"
      en: Yes, and yours too — علي. Let's go to class!
review:
  status: draft
  verified: false
