schema: kabar.lesson/v1
id: j6.u06.l10
language: jv
title: Utawi ... iku
can_do:
  ar_eg: تتابع المعنى المعلّق (makna gandul) لجملتين اسميتين عربيتين.
  ar: أن تتابع المعنى المعلّق (makna gandul) لجملتين اسميتين عربيتين.
  en: Follow the makna gandul of two Arabic nominal sentences.
slides:
  - title: Mubtada lan khabar
    body:
      ar_eg: |
        Gus Hanif كتب على السبورة جملتين اسميتين، وتحت كل كلمة المعنى بالجاوي.
        القاعدة اللي إنت عارفها: تحت المبتدأ بيكتبوا اوتاوي (utawi)، وقبل الخبر ايكو (iku).
        كلمتين جداد: cahya = نور، وnasehat = نصيحة (من العربي).
      ar: |
        كتب Gus Hanif على السبورة جملتين اسميتين، وتحت كل كلمة معناها بالجاوية.
        والقاعدة التي تعرفها: يُكتب تحت المبتدأ اوتاوي (utawi)، وقبل الخبر ايكو (iku).
        كلمتان جديدتان: cahya = نور، وnasehat = نصيحة (من العربية).
      en: |
        Gus Hanif wrote two Arabic nominal sentences on the board, with the Javanese meaning under each word.
        The rule you know: under the mubtada they write اوتاوي (utawi), and before the khabar ايكو (iku).
        Two new words: cahya = light, nasehat = advice (from Arabic نصيحة).
    grammar: jv.pegon.basics
    examples:
      - text: العلم نور — اوتاوي ilmu ايكو cahya
        ar_eg: "«العلم نور»: أمّا العلم فهو نور."
        ar: "«العلم نور»: أمّا العلم فهو نور."
        en: "«العلم نور»: as for knowledge, it is light."
      - text: الدين النصيحة — اوتاوي agama ايكو nasehat
        ar_eg: "«الدين النصيحة»: أمّا الدين فهو النصيحة."
        ar: "«الدين النصيحة»: أمّا الدين فهو النصيحة."
        en: "«الدين النصيحة»: as for religion, it is sincere advice."
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: في «العلم نور»، أنهي كلمة تحتها utawi؟
      ar: في «العلم نور»، تحت أي كلمة تُكتب utawi؟
      en: In «العلم نور», which word gets utawi under it?
    options: [نور, العلم]
    answer: 1
    explain:
      ar_eg: العلم هو المبتدأ، والمبتدأ بياخد utawi. نور الخبر، فقبله iku.
      ar: العلم هو المبتدأ فيأخذ utawi، ونور هو الخبر فيسبقه iku.
      en: العلم is the mubtada, so it takes utawi. نور is the khabar, so iku comes before it.
    words: [utawi, makna gandul]
  - id: e02
    type: listen
    text: Utawi ilmu iku cahya.
    question:
      ar_eg: ده المعنى المعلّق لأنهي جملة عربي؟
      ar: هذا المعنى المعلّق لأي جملة عربية؟
      en: This is the makna gandul of which Arabic sentence?
    options: [الدين النصيحة, الحمد لله, العلم نور]
    answer: 2
    meaning:
      ar_eg: أمّا العلم فهو نور.
      ar: أمّا العلم فهو نور.
      en: As for knowledge, it is light.
    words: [cahya, utawi]
  - id: e03
    type: match_pairs
    pairs:
      - text: العلم
        ar_eg: ilmu (بالجاوي)
        ar: ilmu (بالجاوية)
        en: ilmu (knowledge)
      - text: نور
        ar_eg: cahya (بالجاوي)
        ar: cahya (بالجاوية)
        en: cahya (light)
      - text: الدين
        ar_eg: agama (بالجاوي)
        ar: agama (بالجاوية)
        en: agama (religion)
      - text: النصيحة
        ar_eg: nasehat (بالجاوي)
        ar: nasehat (بالجاوية)
        en: nasehat (advice)
    words: [cahya, nasehat]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: "اقرا: ايكو"
      ar: "اقرأ: ايكو"
      en: "Read: ايكو"
    options: [iku, ika, aku]
    answer: 0
    explain:
      ar_eg: ا شايلة الـ i في الأول، وبعدين ي (i)، ك، و (u) = iku.
      ar: تحمل ا الصائت في البداية، ثم ي (i)، ك، و (u) = iku.
      en: ا carries the opening vowel, then ي (i), ك, و (u) = iku.
  - id: e05
    type: fill_blank
    sentence: Utawi agama ___ nasehat.
    meaning:
      ar_eg: أمّا الدين فهو النصيحة. (علامة الخبر ناقصة)
      ar: أمّا الدين فهو النصيحة. (علامة الخبر ناقصة)
      en: As for religion, it is sincere advice. (The khabar marker is missing.)
    options: [utawi, iku, ing]
    answers: [iku]
    words: [nasehat, makna gandul, agama]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: cahya معناها إيه؟
      ar: ما معنى cahya؟
      en: What does cahya mean?
    options: [نور, علم, نصيحة]
    answer: 0
    words: [cahya]
  - id: e07
    type: build_sentence
    source:
      ar_eg: "اكتب المعنى المعلّق لـ «العلم نور»."
      ar: "اكتب المعنى المعلّق لـ «العلم نور»."
      en: "Build the makna gandul of «العلم نور»."
    answer: Utawi ilmu iku cahya.
    distractors: [ing]
    words: [cahya, utawi]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب المعنى المعلّق بالحروف اللاتينية: «الدين النصيحة»"
      ar: "اكتب المعنى المعلّق بالحروف اللاتينية: «الدين النصيحة»"
      en: "Write the makna gandul in Latin letters: «الدين النصيحة»"
    answers: ["Utawi agama iku nasehat.", utawi agama iku nasehat]
    words: [nasehat, utawi, agama]
  - id: e09
    type: speaking
    text: Utawi ilmu iku cahya. Utawi agama iku nasehat.
    meaning:
      ar_eg: أمّا العلم فهو نور. أمّا الدين فهو النصيحة.
      ar: أمّا العلم فهو نور، وأمّا الدين فهو النصيحة.
      en: As for knowledge, it is light. As for religion, it is sincere advice.
    words: [cahya, nasehat, agama]
dialogue:
  title: Ing kelas Gus Hanif
  lines:
    - speaker: Gus Hanif
      text: Mas Mohamed, «al-ilmu nur», maknanipun menapa?
      ar_eg: يا محمد، «العلم نور» معناها إيه؟
      ar: يا محمد، ما معنى «العلم نور»؟
      en: Mohamed, what's the meaning of «al-ilmu nur»?
    - speaker: Mohamed
      text: Utawi ilmu, iku cahya.
      ar_eg: أمّا العلم فهو نور.
      ar: أمّا العلم فهو نور.
      en: As for knowledge, it is light.
    - speaker: Gus Hanif
      text: Leres! Utawi kangge mubtada, iku kangge khabar.
      ar_eg: صح! utawi للمبتدأ وiku للخبر.
      ar: صحيح! utawi للمبتدأ وiku للخبر.
      en: Right! Utawi for the mubtada, iku for the khabar.
    - speaker: Mohamed
      text: Nahwu ing Mesir, makna ing Jawa. Kula remen!
      ar_eg: النحو من مصر والمعنى بالجاوي. عاجبني قوي!
      ar: النحو من مصر والمعنى بالجاوية. يعجبني ذلك!
      en: The grammar from Egypt, the meaning in Javanese. I love it!
new_words:
  - word: cahya
    pos: noun
    ar_eg: نور
    ar: نور
    en: light = cahaya
  - word: nasehat
    pos: noun
    arabic: نصيحة
    ar_eg: نصيحة
    ar: نصيحة
    en: advice = nasihat
  - word: agama
    pos: noun
    ar_eg: دين
    ar: دين
    en: religion = agama
review:
