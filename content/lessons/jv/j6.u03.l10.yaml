schema: kabar.lesson/v1
id: j6.u03.l10
language: jv
title: Ulangan J6.3
can_do:
  ar_eg: تقرا وتبني جملة قصيرة.
  ar: أن تقرأ جملة قصيرة وتركّبها.
  en: Read and build a short sentence.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: cecak
        ar_eg: ng في آخر المقطع
        ar: ng في آخر المقطع
        en: closing ng
      - text: layar
        ar_eg: r في آخر المقطع
        ar: r في آخر المقطع
        en: closing r
      - text: wignyan
        ar_eg: h في آخر المقطع
        ar: h في آخر المقطع
        en: closing h
      - text: pangkon
        ar_eg: أي حرف ساكن تاني، قبل الوقف
        ar: سائر السواكن، عند الوقف
        en: any other consonant, before a pause
    words: [cecak, layar, wignyan, pangkon]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: "اقرا: ꦲꦺꦴꦩꦃ"
      ar: "اقرأ: ꦲꦺꦴꦩꦃ"
      en: "Read: ꦲꦺꦴꦩꦃ"
    options: [oma, omah, omang]
    answer: 1
    words: [wignyan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تكتب wayang صح؟
      ar: ما الكتابة الصحيحة لـ wayang؟
      en: Which is the right way to write wayang?
    options: ["ꦮꦪꦔ꧀", "ꦮꦪꦁ", "ꦮꦪꦂ"]
    answer: 1
    explain:
      ar_eg: ng الساكنة بتتكتب cecak، مش ꦔ + pangkon.
      ar: تُكتب ng الساكنة cecak، لا ꦔ مع pangkon.
      en: A closing ng is cecak, not ꦔ + pangkon.
    words: [cecak]
  - id: e04
    type: listen
    text: pasar
    question:
      ar_eg: سمعت أنهي كلمة؟
      ar: أي كلمة سمعت؟
      en: Which word did you hear?
    options: ["ꦥꦱꦂ", "ꦥꦱꦁ", "ꦥꦱꦃ"]
    answer: 0
    meaning:
      ar_eg: سوق
      ar: سوق
      en: market
    words: [layar]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: في ꦲꦏꦸꦩꦔꦤ꧀꧈ꦏꦺꦴꦮꦺꦠꦸꦫꦸ꧉ أنهي كلمة عليها pangkon؟
      ar: في ꦲꦏꦸꦩꦔꦤ꧀꧈ꦏꦺꦴꦮꦺꦠꦸꦫꦸ꧉ أي كلمة عليها pangkon؟
      en: In ꦲꦏꦸꦩꦔꦤ꧀꧈ꦏꦺꦴꦮꦺꦠꦸꦫꦸ꧉ which word carries pangkon?
    options: [aku, mangan, turu]
    answer: 1
    explain:
      ar_eg: pangkon لما الكلام يقف (قبل ꧈ أو ꧉ أو آخر السطر). في نص الجملة بنستخدم pasangan.
      ar: pangkon عند الوقف (قبل ꧈ أو ꧉ أو آخر السطر)، وفي الوصل تُستعمل pasangan.
      en: Pangkon goes where speech pauses (before ꧈, ꧉ or a line end). Mid-sentence, Javanese uses pasangan.
    words: [pangkon]
  - id: e06
    type: listen
    text: lungguh
    question:
      ar_eg: سمعت أنهي كلمة؟
      ar: أي كلمة سمعت؟
      en: Which word did you hear?
    options: ["ꦭꦸꦒꦸꦃ", "ꦭꦸꦁꦒꦸꦃ", "ꦭꦸꦁꦒꦸ"]
    answer: 1
    meaning:
      ar_eg: يقعد
      ar: يجلس
      en: sit
    words: [cecak, wignyan]
  - id: e07
    type: fill_blank
    sentence: ꦱꦼꦤꦼꦁ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: مبسوط)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: مسرور)"
      en: Type the reading in Latin letters. (It means "happy".)
    answers: [seneng]
    words: [cecak]
  - id: e08
    type: fill_blank
    sentence: ꦚꦼꦏꦂ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: يزور قبر بالورد)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: يزور القبر بالزهر)"
      en: Type the reading in Latin letters. (It means "visit a grave with flowers".)
    answers: [nyekar]
    words: [layar]
  - id: e09
    type: build_sentence
    source:
      ar_eg: ابني «bocah lungguh» (العيل قاعد) مقطع مقطع.
      ar: ركّب «bocah lungguh» (الطفل جالس) مقطعًا مقطعًا.
      en: Build "bocah lungguh" (the child sits), syllable by syllable.
    answer: ꦧꦺꦴ ꦕꦃ ꦭꦸꦁ ꦒꦸꦃ
    distractors: ["ꦕ"]
    words: [wignyan, cecak]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦲꦏꦸꦱꦼꦤꦼꦁꦮꦪꦁ꧉"
      ar: "اكتب بالحروف اللاتينية: ꦲꦏꦸꦱꦼꦤꦼꦁꦮꦪꦁ꧉"
      en: "Write in Latin letters: ꦲꦏꦸꦱꦼꦤꦼꦁꦮꦪꦁ꧉"
    answers: ["Aku seneng wayang.", akusenengwayang]
    words: [cecak]
  - id: e11
    type: speaking
    text: Aku mangan, kowe turu.
    meaning:
      ar_eg: أنا باكل، وإنت نايم.
      ar: أنا آكل، وأنت نائم.
      en: I'm eating, you're sleeping.
    words: [pangkon]
dialogue:
  title: Mulih saka makam
  lines:
    - speaker: Dimas
      text: Piye, Med? Seneng?
      ar_eg: إيه رأيك يا محمد؟ مبسوط؟
      ar: ما رأيك يا محمد؟ أأعجبك؟
      en: How was it, Med? Did you enjoy it?
    - speaker: Mohamed
      text: Seneng banget. Aku maca papan ing gapura.
      ar_eg: مبسوط قوي. قريت اللوحة اللي على البوابة.
      ar: كثيرًا. قرأتُ اللافتة على البوابة.
      en: Very much. I read the sign on the gate.
    - speaker: Dimas
      text: Tenan? Tulisane apa?
      ar_eg: بجد؟ كان مكتوب إيه؟
      ar: حقًا؟ ماذا كان مكتوبًا؟
      en: Really? What did it say?
    - speaker: Mohamed
      text: Makam. Nganggo pangkon ing mburi!
      ar_eg: «makam». وفي الآخر pangkon!
      ar: «makam»، وفي آخرها pangkon!
      en: Makam. With pangkon at the end!
souvenir:
  id: j6.u03.souvenir
  title: Makam Raja Mataram
  note:
    ar_eg: |
      في كوتاغيدي مقابر أول ملوك ماتارام، جنب المسجد الكبير. واللي عايز يدخل لازم يلبس لبس جاوي تقليدي، وبيأجّروه هناك عند الباب — قاعدة آداب لسه عايشة لحد النهارده. وعلى البوابات والحيطان هتلاقي كتابة جاوية، وإنت دلوقتي تقدر تقرا منها كلمات كاملة.
    ar: |
      في كوتاغيدي مقابر أوائل ملوك ماتارام قرب المسجد الكبير، ولا يدخلها الزائر إلا باللباس الجاوي التقليدي الذي يُستأجر عند الباب، وهي قاعدة آداب ما زالت حيّة. وعلى البوابات والجدران كتابة جاوية صرت تقرأ منها كلمات كاملة.
    en: |
      Kotagede holds the graves of the first Mataram kings, next to the Great Mosque. To go in, visitors must wear traditional Javanese dress, which you can rent at the entrance — a rule of etiquette that is still alive today. On the gates and walls there's aksara Jawa, and now you can read whole words of it.
