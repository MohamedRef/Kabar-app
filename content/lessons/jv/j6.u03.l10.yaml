schema: kabar.lesson/v1
id: j6.u03.l10
language: jv
title: Cathetanku
can_do:
  ar_eg: تسمع يوميات قصيرة وتتابعها مكتوبة بالخط الجاوي.
  ar: أن تسمع يوميات قصيرة وتتابعها بالخط الجاوي.
  en: Follow a short diary entry by ear and in aksara Jawa.
slides:
  - title: Cathetan dina iki
    body:
      ar_eg: |
        محمد كتب يومياته النهارده بالخط الجاوي، وديماس بيقراها بصوت عالي. اسمع الأول، وبعدين دوّر على الجمل.
        بص على pangkon: بتيجي بس قبل ꧉ (makam꧉، wit꧉). أما ng وr وh فليهم cecak وlayar وwignyan في أي حتة.
      ar: |
        كتب محمد يومياته اليوم بالخط الجاوي، ويقرؤها ديماس بصوت عالٍ. استمع أولًا ثم ابحث عن الجمل.
        لاحظ pangkon: لا تأتي إلا قبل ꧉ (makam꧉، wit꧉)، أما ng وr وh فلها cecak وlayar وwignyan في أي موضع.
      en: |
        Mohamed wrote today's diary entry in aksara Jawa, and Dimas reads it aloud. Listen first, then find the sentences.
        Watch pangkon: it only comes before ꧉ (makam꧉, wit꧉). ng, r and h have cecak, layar and wignyan anywhere.
    grammar: jv.aksara.panyigeg
    examples:
      - text: ꦢꦶꦤꦲꦶꦏꦶꦲꦏꦸꦩꦼꦚꦁꦩꦏꦩ꧀꧉ (Dina iki aku menyang makam.)
        ar_eg: النهارده رحت المقابر.
        ar: ذهبتُ اليوم إلى المقابر.
        en: Today I went to the graves.
      - text: ꦲꦏꦺꦃꦮꦺꦴꦁꦚꦼꦏꦂ꧉ (Akeh wong nyekar.)
        ar_eg: ناس كتير كانوا بيزوروا القبور.
        ar: كان كثير من الناس يزورون القبور.
        en: Lots of people were visiting the graves.
      - text: ꦲꦏꦸꦭꦸꦁꦒꦸꦃꦲꦶꦁꦔꦶꦱꦺꦴꦂꦮꦶꦠ꧀꧉ (Aku lungguh ing ngisor wit.)
        ar_eg: أنا قعدت تحت شجرة.
        ar: جلستُ تحت شجرة.
        en: I sat under a tree.
exercises:
  - id: e01
    type: listen
    text: Dina iki aku menyang makam.
    question:
      ar_eg: محمد راح فين النهارده؟
      ar: إلى أين ذهب محمد اليوم؟
      en: Where did Mohamed go today?
    options: ["ꦥꦱꦂ", "ꦩꦏꦩ꧀", "ꦲꦺꦴꦩꦃ"]
    answer: 1
    meaning:
      ar_eg: النهارده رحت المقابر.
      ar: ذهبتُ اليوم إلى المقابر.
      en: Today I went to the graves.
    words: [pangkon]
  - id: e02
    type: listen
    text: Akeh wong nyekar.
    question:
      ar_eg: الناس كانوا بيعملوا إيه؟
      ar: ماذا كان الناس يفعلون؟
      en: What were the people doing?
    options: ["ꦩꦔꦤ꧀", "ꦠꦸꦫꦸ", "ꦚꦼꦏꦂ"]
    answer: 2
    meaning:
      ar_eg: ناس كتير كانوا بيزوروا القبور.
      ar: كان كثير من الناس يزورون القبور.
      en: Lots of people were visiting the graves.
    words: [layar, wignyan]
  - id: e03
    type: listen
    text: Aku lungguh ing ngisor wit.
    question:
      ar_eg: محمد قعد فين؟
      ar: أين جلس محمد؟
      en: Where did Mohamed sit?
    options: ["ꦲꦶꦁꦔꦶꦱꦺꦴꦂꦮꦶꦠ꧀", "ꦲꦶꦁꦥꦱꦂ", "ꦲꦶꦁꦲꦺꦴꦩꦃ"]
    answer: 0
    meaning:
      ar_eg: أنا قعدت تحت شجرة.
      ar: جلستُ تحت شجرة.
      en: I sat under a tree.
    words: [cecak, layar]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: "في ꦢꦶꦤꦲꦶꦏꦶꦲꦏꦸꦩꦼꦚꦁꦩꦏꦩ꧀꧉، أنهي كلمة عليها pangkon؟"
      ar: "في ꦢꦶꦤꦲꦶꦏꦶꦲꦏꦸꦩꦼꦚꦁꦩꦏꦩ꧀꧉، أي كلمة عليها pangkon؟"
      en: "In ꦢꦶꦤꦲꦶꦏꦶꦲꦏꦸꦩꦼꦚꦁꦩꦏꦩ꧀꧉, which word carries pangkon?"
    options: [menyang, makam, dina]
    answer: 1
    explain:
      ar_eg: makam بتخلص بـ m قبل ꧉، فعليها pangkon. menyang بتخلص بـ ng فعليها cecak.
      ar: تنتهي makam بـ m قبل ꧉ فعليها pangkon، أما menyang فتنتهي بـ ng فعليها cecak.
      en: makam ends in m before ꧉, so it takes pangkon. menyang ends in ng, so it takes cecak.
    words: [pangkon, cecak]
  - id: e05
    type: match_pairs
    pairs:
      - text: ꦔꦶꦱꦺꦴꦂ
        ar_eg: ngisor — تحت
        ar: ngisor — تحت
        en: ngisor — under, below
      - text: ꦮꦶꦠ꧀
        ar_eg: wit — شجرة
        ar: wit — شجرة
        en: wit — tree
      - text: ꦲꦏꦺꦃ
        ar_eg: akeh — كتير
        ar: akeh — كثير
        en: akeh — many, a lot
      - text: ꦭꦸꦁꦒꦸꦃ
        ar_eg: lungguh — يقعد
        ar: lungguh — يجلس
        en: lungguh — sit
    words: [layar, wignyan, pangkon]
  - id: e06
    type: dictation
    text: Akeh wong nyekar.
    meaning:
      ar_eg: ناس كتير كانوا بيزوروا القبور.
      ar: كان كثير من الناس يزورون القبور.
      en: Lots of people were visiting the graves.
  - id: e07
    type: build_sentence
    source:
      ar_eg: "اكتب «Akeh wong nyekar» مقطع مقطع."
      ar: "اكتب «Akeh wong nyekar» مقطعًا مقطعًا."
      en: Build "Akeh wong nyekar", syllable by syllable.
    answer: ꦲ ꦏꦺꦃ ꦮꦺꦴꦁ ꦚꦼ ꦏꦂ
    distractors: ["ꦏꦺ"]
    words: [wignyan, cecak, layar]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦲꦏꦸꦭꦸꦁꦒꦸꦃꦲꦶꦁꦔꦶꦱꦺꦴꦂꦮꦶꦠ꧀꧉"
      ar: "اكتب بالحروف اللاتينية: ꦲꦏꦸꦭꦸꦁꦒꦸꦃꦲꦶꦁꦔꦶꦱꦺꦴꦂꦮꦶꦠ꧀꧉"
      en: "Write in Latin letters: ꦲꦏꦸꦭꦸꦁꦒꦸꦃꦲꦶꦁꦔꦶꦱꦺꦴꦂꦮꦶꦠ꧀꧉"
    answers: ["Aku lungguh ing ngisor wit.", aku lungguh ing ngisor wit]
    explain:
      ar_eg: wit في آخر الجملة قبل ꧉، فالـ t عليها pangkon.
      ar: wit في آخر الجملة قبل ꧉، فعلى الـ t علامة pangkon.
      en: wit ends the sentence before ꧉, so its t takes pangkon.
    words: [pangkon, layar]
  - id: e09
    type: speaking
    text: Dina iki aku menyang makam. Akeh wong nyekar.
    meaning:
      ar_eg: النهارده رحت المقابر. ناس كتير كانوا بيزوروا القبور.
      ar: ذهبتُ اليوم إلى المقابر. كان كثير من الناس يزورون القبور.
      en: Today I went to the graves. Lots of people were visiting them.
dialogue:
  title: Maca cathetan
  lines:
    - speaker: Dimas
      text: Med, cathetanmu apik. Aku maca kabeh.
      ar_eg: يا محمد، يومياتك حلوة. قريتها كلها.
      ar: يا محمد، يومياتك جميلة. قرأتها كلها.
      en: Med, your diary entry is good. I read all of it.
    - speaker: Mohamed
      text: Tenan? Ana sing salah?
      ar_eg: بجد؟ فيه حاجة غلط؟
      ar: حقًّا؟ هل فيها خطأ؟
      en: Really? Is anything wrong?
    - speaker: Dimas
      text: Ora, kok. Pangkone ana ing mburi, bener kabeh.
      ar_eg: لأ. الـ pangkon في الآخر، كله صح.
      ar: لا. الـ pangkon في الآخر، وكلّه صحيح.
      en: No. The pangkon is at the end; it's all correct.
    - speaker: Mohamed
      text: Alhamdulillah! Sesuk aku nulis maneh.
      ar_eg: الحمد لله! بكرة هكتب تاني.
      ar: الحمد لله! سأكتب غدًا مرة أخرى.
      en: Alhamdulillah! I'll write again tomorrow.
review:
  status: draft
