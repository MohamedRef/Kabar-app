schema: kabar.lesson/v1
id: j2.u06.l03
language: jv
title: Lan, nanging, terus
can_do:
  ar_eg: تربط الجمل ببعض (و، بس، وبعدين، عشان، لو).
  ar: أن تربط الجمل (و، لكن، ثم، لأن، إذا).
  en: Link sentences.
slides:
  - title: Lan, karo, utawa
    body:
      ar_eg: |
        كل كلمة ربط جاوي ليها توأم إندونيسي، وبتقعد في نفس المكان:
        - lan = dan (و) · karo = dan / dengan (و / مع)، وهي الأكتر في الكلام: aku karo Dimas = أنا وديماس.
        - utawa = atau (أو). وفي السؤال السريع الناس بتقول apa: Kopi apa teh? = قهوة ولا شاي؟ (زي «ولا» المصري)
      ar: |
        لكل أداة ربط جاوية نظير إندونيسي في الموضع نفسه:
        - lan = dan (و) · karo = dan / dengan (و / مع)، وهي الأشيع في الكلام: aku karo Dimas = أنا وديماس.
        - utawa = atau (أو)، وفي السؤال اليومي يقال apa: Kopi apa teh? = قهوة أم شاي؟
      en: |
        Every Javanese linking word has an Indonesian twin and sits in the same place:
        - lan = dan (and) · karo = dan / dengan (and / with) — the everyday choice: aku karo Dimas = Dimas and I.
        - utawa = atau (or). In quick questions people say apa: Kopi apa teh? = Coffee or tea? (like Egyptian «ولا»)
    grammar: jv.conjunction.basic
    examples:
      - text: Aku karo Dimas dolan neng Ngawi.
        ar_eg: أنا وديماس خرجنا نتفسح في نغاوي.
        ar: خرجتُ أنا وديماس للنزهة في نغاوي.
        en: Dimas and I went out to Ngawi.
      - text: Kopi apa teh?
        ar_eg: قهوة ولا شاي؟
        ar: قهوة أم شاي؟
        en: Coffee or tea?
  - title: Nanging, ning
    body:
      ar_eg: |
        - nanging = tetapi (بس / لكن). في الكلام العادي ning أو tapi.
        خلي بالك: ning هنا = tapi. مش Ning (لقب البنت في سورابايا) — السياق بيوضح.
      ar: |
        - nanging = tetapi (لكن)، وفي الكلام ning أو tapi.
        وتنبه: ning هنا = tapi، وتختلف عن Ning لقب الفتاة في سورابايا، والسياق يوضح.
      en: |
        - nanging = tetapi (but). Casual: ning or tapi.
        Note: ning here = tapi — not Ning, the Surabaya title for a young woman; context tells.
    grammar: jv.conjunction.basic
    examples:
      - text: Panganané enak, nanging rada larang.
        ar_eg: الأكل حلو، بس غالي شوية.
        ar: الطعام لذيذ لكنه غالٍ قليلًا.
        en: The food is good, but a bit pricey.
  - title: Terus, merga, mula
    body:
      ar_eg: |
        - terus = lalu (وبعدين). banjur نفس المعنى، أكتر في الحكي والكتابة.
        - merga / amarga = karena (عشان / لأن). وsoalé = soalnya في الكلام.
        - mula = makanya (عشان كده). dadi = jadi (يبقى / فـ).
        karena إندونيسي — في جملة جاوي قول merga.
      ar: |
        - terus = lalu (ثم)، وbanjur بالمعنى نفسه في السرد والكتابة.
        - merga / amarga = karena (لأن)، وsoalé = soalnya في الكلام.
        - mula = makanya (لذلك)، وdadi = jadi (إذن).
        وkarena إندونيسية؛ فقل في الجملة الجاوية merga.
      en: |
        - terus = lalu (then). banjur means the same, more for storytelling and writing.
        - merga / amarga = karena (because). Casual: soalé (soalnya).
        - mula = makanya (that's why). dadi = jadi (so).
        karena is Indonesian — in a Javanese sentence say merga.
    grammar: jv.conjunction.basic
    examples:
      - text: Aku mangan sik, terus adus.
        ar_eg: هاكل الأول، وبعدين أستحمى.
        ar: سآكل أولًا ثم أغتسل.
        en: I'll eat first, then have a bath.
      - text: Aku ora teka merga udan.
        ar_eg: ماجيتش عشان كانت بتمطر.
        ar: لم آتِ لأنها كانت تمطر.
        en: I didn't come because it was raining.
  - title: Yen, nek
    body:
      ar_eg: |
        - yen = kalau (لو). nek أكتر في الكلام اليومي.
        Nek udan, aku neng omah wae. = لو مطرت، هقعد في البيت وخلاص. (udan = hujan)
      ar: |
        - yen = kalau (إذا)، وnek أشيع في الكلام اليومي.
        Nek udan, aku neng omah wae. = إذا أمطرت فسأبقى في البيت. (udan = hujan)
      en: |
        - yen = kalau (if). nek is more common in everyday speech.
        Nek udan, aku neng omah wae. = If it rains, I'll just stay home. (udan = hujan)
    grammar: jv.conjunction.basic
    examples:
      - text: Nek udan, aku neng omah wae.
        ar_eg: لو مطرت، هقعد في البيت وخلاص.
        ar: إذا أمطرت فسأبقى في البيت.
        en: If it rains, I'll just stay home.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: 'بتسأل صاحبك بسرعة: «قهوة ولا شاي؟» أنهي أطبع؟'
      ar: 'تسأل صديقك سريعًا: «قهوة أم شاي؟» أيّها الأطبع؟'
      en: 'You ask a friend casually: "Coffee or tea?" Which is most natural?'
    options: ['Kopi merga teh?', 'Kopi apa teh?', 'Kopi nanging teh?']
    answer: 1
    explain:
      ar_eg: في السؤال اليومي «أو» = apa، زي «ولا» عندنا. utawa صح بس أرسمي.
      ar: في السؤال اليومي «أو» = apa، وutawa صحيحة لكنها أرسمي.
      en: In everyday questions "or" is apa, like Egyptian «ولا»; utawa is correct but more formal.
    words: [apa, utawa]
  - id: e02
    type: listen
    text: Nek udan, aku neng omah wae.
    options: ['Nek udan, aku neng pasar wae.', 'Nek udan, aku neng omah wae.', 'Merga udan, aku neng omah wae.']
    answer: 1
    words: [nek, udan]
  - id: e03
    type: fill_blank
    sentence: Aku mangan sik, ___ adus.
    meaning:
      ar_eg: هاكل الأول، وبعدين أستحمى.
      ar: سآكل أولًا ثم أغتسل.
      en: I'll eat first, then have a bath.
    answers: [terus, banjur]
    words: [terus, banjur]
  - id: e04
    type: build_sentence
    source:
      ar_eg: أنا وديماس خرجنا نتفسح في نغاوي.
      ar: خرجتُ أنا وديماس للنزهة في نغاوي.
      en: Dimas and I went out to Ngawi.
    answer: Aku karo Dimas dolan neng Ngawi.
    distractors: [nanging, merga]
    words: [karo, dolan]
  - id: e05
    type: translate
    direction: from_target
    source_text: Aku kesel, mula aku turu.
    answers_meaning:
      ar_eg: [أنا تعبان، عشان كده هنام., أنا تعبان عشان كده بنام, تعبت، فهنام]
      ar: [أنا متعب، لذلك أنام., أنا متعب ولذلك سأنام]
      en: ['I''m tired, so I''m going to sleep.', 'I''m tired, that''s why I''m sleeping', 'I''m tired, so I''ll sleep']
    words: [mula, kesel]
  - id: e06
    type: speaking
    text: Kopi apa teh?
    meaning:
      ar_eg: قهوة ولا شاي؟
      ar: قهوة أم شاي؟
      en: Coffee or tea?
    words: [apa]
dialogue:
  title: Neng pinggir Bengawan Solo
  lines:
    - speaker: Dimas
      text: Mohamed, ngombé kopi apa teh?
      ar_eg: محمد، تشرب قهوة ولا شاي؟
      ar: يا محمد، أتشرب قهوة أم شايًا؟
      en: Mohamed, coffee or tea?
    - speaker: Mohamed
      text: Teh wae. Mau aku wis ngombé kopi.
      ar_eg: شاي بس. أنا شربت قهوة من شوية.
      ar: شايًا فقط، فقد شربت قهوة قبل قليل.
      en: Just tea. I already had coffee earlier.
    - speaker: Dimas
      text: Oké. Terus ayo mlaku-mlaku neng pinggir kali.
      ar_eg: أوكيه. وبعدين يلا نتمشى على شط النهر.
      ar: حسنًا. ثم هيا نتنزّه على ضفة النهر.
      en: OK. Then let's take a stroll along the river.
    - speaker: Mohamed
      text: Ayo! Nanging nek udan, mulih wae, ya.
      ar_eg: يلا! بس لو مطرت، نروّح وخلاص، ماشي؟
      ar: هيا! لكن إذا أمطرت نعود إلى البيت، اتفقنا؟
      en: Sure! But if it rains, we just head home, OK?
    - speaker: Dimas
      text: Iya. Nek udan, mulih.
      ar_eg: ماشي. لو مطرت، نروّح.
      ar: حسنًا. إذا أمطرت نعود.
      en: Deal. If it rains, home we go.
new_words:
  - word: utawa
    pos: conjunction
    ar_eg: أو
    ar: أو
    en: or (atau)
  - word: nanging / ning
    pos: conjunction
    ar_eg: بس / لكن
    ar: لكن
    en: but (tetapi / tapi)
  - word: banjur
    pos: conjunction
    ar_eg: وبعدين (في الحكي)
    ar: ثم (في السرد)
    en: then (lalu), in storytelling
  - word: merga / amarga
    pos: conjunction
    ar_eg: عشان / لأن
    ar: لأن
    en: because (karena)
  - word: mula
    pos: conjunction
    ar_eg: عشان كده
    ar: لذلك
    en: that's why (makanya)
  - word: yen / nek
    pos: conjunction
    ar_eg: لو
    ar: إذا
    en: if (kalau)
  - word: udan
    pos: noun
    ar_eg: مطر / بتمطر
    ar: مطر
    en: rain (hujan)
  - word: panganan
    pos: noun
    ar_eg: أكل
    ar: طعام
    en: food (makanan)
