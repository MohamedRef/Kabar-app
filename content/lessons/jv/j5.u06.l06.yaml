schema: kabar.lesson/v1
id: j5.u06.l06
language: jv
title: Lelagon tresna
can_do:
  ar_eg: 'تفهم كلمات أغنية كامبورساري حزينة: الحب، والدموع، والوعد اللي اتكسر.'
  ar: 'أن تفهم كلمات أغنية كامبورساري حزينة: الحب والدموع والوعد المكسور.'
  en: 'Follow a sad campursari song: love, tears and a broken promise.'
slides:
  - title: Lelagon campursari
    body:
      ar_eg: |
        lelagon = أغنية (أغاني)، nembang = يغني (غُنا جاوي). pesindhen = المغنية اللي بتغني مع الجاميلان.
        gandrung = متيّم، واقع في الحب. wuyung = ولهان، تعبان من الحب. eluh = دموع.
        lamis = كلامه حلو بس مش من قلبه. cidra = يخلف الوعد، يخون.
      ar: |
        lelagon = أغنية، nembang = يغني (غناءً جاويًا). pesindhen = المغنّية التي ترافق الجاميلان.
        gandrung = متيّم. wuyung = مضنى بالحب. eluh = دموع.
        lamis = معسول الكلام بلا صدق. cidra = يخلف الوعد، يخون.
      en: |
        lelagon = song, nembang = sing (Javanese style). pesindhen = the female singer with a gamelan.
        gandrung = smitten, madly in love. wuyung = lovesick. eluh = tears.
        lamis = sweet-talking but insincere. cidra = break a promise, betray.
    examples:
      - text: Pesindhen iku nembang lelagon campursari.
        ar_eg: المغنية دي بتغني أغنية كامبورساري.
        ar: تغني تلك المغنية أغنية كامبورساري.
        en: The singer is singing a campursari song.
      - text: Lelagone babagan wong sing gandrung lan wuyung.
        ar_eg: الأغنية عن واحد متيّم وتعبان من الحب.
        ar: الأغنية عن شخص متيّم مضنى بالحب.
        en: The song is about someone smitten and lovesick.
      - text: Omongane lamis, banjur cidra janji.
        ar_eg: كلامه كان حلو وفاضي، وبعدين خلف وعده.
        ar: كان كلامه معسولًا كاذبًا، ثم أخلف وعده.
        en: His words were sweet but hollow, then he broke his promise.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: lelagon
        ar_eg: أغنية
        ar: أغنية
        en: song
      - text: nembang
        ar_eg: يغني
        ar: يغني
        en: sing
      - text: pesindhen
        ar_eg: مغنية جاميلان
        ar: مغنية الجاميلان
        en: gamelan singer
      - text: gandrung
        ar_eg: متيّم
        ar: متيّم
        en: smitten
    words: [lelagon, nembang, pesindhen, gandrung]
  - id: e02
    type: match_pairs
    pairs:
      - text: eluh
        ar_eg: دموع
        ar: دموع
        en: tears
      - text: wuyung
        ar_eg: ولهان
        ar: مضنى بالحب
        en: lovesick
      - text: lamis
        ar_eg: كلامه حلو وفاضي
        ar: معسول الكلام بلا صدق
        en: insincere
      - text: cidra
        ar_eg: يخلف الوعد
        ar: يخلف الوعد
        en: break a promise
    words: [eluh, wuyung, lamis, cidra]
  - id: e03
    type: listen
    text: Pesindhen nembang nganti eluhe tiba.
    question:
      ar_eg: حصل إيه للمغنية؟
      ar: ماذا حدث للمغنية؟
      en: What happened to the singer?
    options: [المغنية غنّت لحد ما دموعها نزلت, المغنية سابت المسرح, المغنية ضحكت]
    answer: 0
    meaning:
      ar_eg: المغنية غنّت لحد ما دموعها نزلت.
      ar: غنّت المغنية حتى سالت دموعها.
      en: The singer sang until her tears fell.
    words: [pesindhen, nembang, eluh]
  - id: e04
    type: fill_blank
    sentence: Dheweke ___ janji, ora teka.
    meaning:
      ar_eg: هو ___ بوعده وماجاش.
      ar: ___ وعده ولم يأتِ.
      en: He ___ his promise and didn't come.
    options: [cidra, nembang, gandrung]
    answers: [cidra]
    words: [cidra, nembang, gandrung]
    explain:
      ar_eg: cidra janji = خلف الوعد. nembang = يغنّي وgandrung = واقع في الحب.
      ar: cidra janji تعني أخلف الوعد. أما nembang فيغنّي وgandrung مُتيَّم.
      en: cidra janji is "broke a promise". nembang is "sing" and gandrung is "smitten".
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي كلامه حلو بس مش من قلبه بيتقال عليه …
      ar: من كان كلامه معسولًا بلا صدق يوصف بأنه …
      en: Someone whose words are sweet but not heartfelt is …
    options: [lamis, wuyung, eluh]
    answer: 0
    explain:
      ar_eg: lamis = كلامه حلو وفاضي. wuyung = ولهان، وeluh = دموع.
      ar: lamis = معسول الكلام بلا صدق؛ wuyung = مضنى بالحب، وeluh = دموع.
      en: lamis = insincere; wuyung = lovesick, eluh = tears.
    words: [lamis, wuyung, eluh]
  - id: e06
    type: fill_blank
    sentence: Dheweke ___ marang kancane, saben dina kelingan.
    meaning:
      ar_eg: هو ___ في صاحبته، كل يوم بيفتكرها.
      ar: هو ___ بصديقته، يتذكرها كل يوم.
      en: He is ___ with his friend and thinks of her every day.
    options: [gandrung, lamis, pesindhen]
    answers: [gandrung]
    words: [gandrung, lamis, pesindhen]
    explain:
      ar_eg: gandrung = واقع في الحب لحد ما بيفتكره كل يوم. lamis = كلامه حلو من غير قلب وpesindhen = مغنية.
      ar: gandrung تعني مُتيَّم. أما lamis فمعسول الكلام بلا صدق وpesindhen مغنّية.
      en: gandrung means smitten. lamis is sweet-talking without meaning it, and pesindhen is a singer.
  - id: e07
    type: multiple_choice
    question: 'Ora bisa turu, ora gelem mangan: dheweke lagi ___.'
    options: [cidra, wuyung, lelagon]
    answer: 1
    explain:
      ar_eg: 'مش بينام ومش بياكل من كتر الحب: wuyung = ولهان.'
      ar: 'لا ينام ولا يأكل من شدة الحب: wuyung = مضنى بالحب.'
      en: 'Not sleeping, not eating from love: wuyung = lovesick.'
    words: [cidra, wuyung, lelagon]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الأغنية دي حلوة أوي.
      ar: هذه الأغنية جميلة جدًا.
      en: This song is really beautiful.
    answer: Lelagon iki apik banget.
    distractors: [eluh, lamis]
    words: [lelagon]
    explain:
      ar_eg: lelagon = أغنية. eluh = دموع وlamis = كلام حلو كدّاب، ومش في المعنى.
      ar: lelagon تعني أغنية. أما eluh (دموع) وlamis (معسول كاذب) فليستا في المعنى.
      en: lelagon is a song. eluh (tears) and lamis (insincere) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Eluhe tiba amarga dheweke wuyung.
    answers_meaning:
      ar_eg: [دموعها نزلت عشان هي ولهانة, عيّطت عشان تعبانة من الحب]
      ar: [سالت دموعها لأنها مضناة بالحب, انهمرت دموعها من شدة الوجد]
      en: [Her tears fell because she was lovesick, She cried because she was lovesick]
    words: [eluh, wuyung]
  - id: e10
    type: speaking
    text: Aku seneng krungu pesindhen nembang.
    meaning:
      ar_eg: أنا بحب أسمع المغنية وهي بتغني.
      ar: أحب أن أسمع المغنية تغني.
      en: I love hearing the singer sing.
    words: [pesindhen, nembang]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mbak, lelagon iki kok sedhih banget ta?
      ar_eg: يا مبك، الأغنية دي حزينة أوي كده ليه؟
      ar: يا مبك، لماذا هذه الأغنية حزينة جدًا؟
      en: Mbak, why is this song so sad?
    - speaker: Mbak Ayu
      text: Iku 'Cidro', lelagone Didi Kempot. Critane wong sing dicidrani.
      ar_eg: دي «تشيدرو»، أغنية ديدي كيمبوت. عن واحد اتخان.
      ar: هذه «تشيدرو»، أغنية ديدي كيمبوت، عن شخص خُذل.
      en: That's 'Cidro', a Didi Kempot song. It's about someone who was let down.
    - speaker: Mohamed
      text: Pesindhene nembang nganti eluhe tiba, lho.
      ar_eg: المغنية غنّت لحد ما دموعها نزلت.
      ar: غنّت المغنية حتى سالت دموعها.
      en: The singer sang until her tears fell.
    - speaker: Mbak Ayu
      text: Ya ngono kuwi campursari. Sing gandrung dadi wuyung.
      ar_eg: هو كده الكامبورساري. اللي يحب يتعب من الحب.
      ar: 'هكذا الكامبورساري: المتيّم يصير مضنى.'
      en: That's campursari for you. The smitten end up lovesick.
    - speaker: Mohamed
      text: Untung aku ora tau ketemu wong lamis.
      ar_eg: الحمد لله عمري ما قابلت حد كلامه حلو وفاضي.
      ar: لحسن حظي لم ألتقِ قط بشخص معسول الكلام كاذب.
      en: Lucky I've never met a sweet-talking liar.
    - speaker: Mbak Ayu
      text: Hehe, aja kakehan sambat. Ayo njoged wae!
      ar_eg: هههه، كفاية شكوى. يلا نرقص وخلاص!
      ar: ههه، كفاك شكوى. هيا نرقص!
      en: Heh, enough moaning. Let's just dance!
