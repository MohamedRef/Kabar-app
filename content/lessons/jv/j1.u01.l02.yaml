schema: kabar.lesson/v1
id: j1.u01.l02
language: jv
title: Piye kabare?
can_do:
  ar_eg: تسأل عن حال حد وتشكره وتقول خلي بالك من نفسك.
  ar: أن تسأل عن حال أحدهم وتشكره وتقول اعتنِ بنفسك.
  en: Ask how someone is, thank them and say take care.
slides:
  - title: Piye kabare?
    body:
      ar_eg: |
        piye = bagaimana (إزاي)، وkabare = kabarnya. يعني «Piye kabare?» = «Apa kabar?» = إزيك؟ أخبارك إيه؟
        وkabar هي نفسها «خبر» العربية — عدّت من العربي للإندونيسي وللجاوي كمان.
        الـ -e في آخر kabare زي -nya في الإندونيسي.
        والرد بالـ ngoko: «Apik» (كويس = baik)، أو «Alhamdulillah, apik».
        وفي سورابايا (لهجة Arek) هتسمع كمان: «Yok opo kabare, rek?» = أخباركم إيه يا جدعان؟
      ar: |
        piye = bagaimana (كيف)، وkabare = kabarnya، فـ«Piye kabare?» = «Apa kabar?» = كيف حالك؟
        وkabar هي «خبر» العربية، انتقلت إلى الإندونيسية والجاوية معًا.
        واللاحقة -e في kabare تقابل -nya الإندونيسية.
        والجواب بالـ ngoko: «Apik» (بخير = baik)، أو «Alhamdulillah, apik».
        وفي سورابايا (لهجة Arek) يقال أيضًا: «Yok opo kabare, rek?» = كيف حالكم يا جماعة؟
      en: |
        piye = bagaimana (how), kabare = kabarnya. So "Piye kabare?" = "Apa kabar?" = How are you?
        kabar is Arabic «خبر» (news) — it travelled into Indonesian and Javanese alike.
        The -e on kabare works like Indonesian -nya.
        The ngoko answer: "Apik" (good = baik), or "Alhamdulillah, apik".
        In Surabaya (Arek dialect) you'll also hear "Yok opo kabare, rek?" = How's it going, guys?
    examples:
      - text: Piye kabare? — Apik.
        ar_eg: إزيك؟ — كويس.
        ar: كيف حالك؟ — بخير.
        en: How are you? — Good.
      - text: Yok opo kabare, rek?
        ar_eg: أخباركم إيه يا جدعان؟ (Arek، سورابايا)
        ar: كيف حالكم يا جماعة؟ (Arek، سورابايا)
        en: How's it going, guys? (Arek, Surabaya)
  - title: Matur nuwun, suwun, padha-padha
    body:
      ar_eg: |
        «شكرًا» ليها شكلين:
        - Matur nuwun = Terima kasih، المؤدبة (krama). قولها لأي حد أكبر منك أو مش عارفه.
        - Suwun = المختصرة، للصحاب (زي «ميرسي»). «Suwun, rek!» = شكرًا يا جماعة!
        والرد «العفو»: Padha-padha (ngoko) = Sama-sama، وبالـ krama: Sami-sami. في الشات بتتكتب podo-podo.
        وفي الوداع: «Ati-ati, ya!» = خلي بالك من نفسك / توصل بالسلامة (Hati-hati, ya!).
      ar: |
        للشكر صيغتان:
        - Matur nuwun = Terima kasih، وهي المهذبة (krama)، تقال للأكبر سنًّا وللغريب.
        - Suwun = المختصرة للأصدقاء: «Suwun, rek!» = شكرًا يا جماعة!
        والجواب «عفوًا»: Padha-padha (ngoko) = Sama-sama، وبالـ krama: Sami-sami، وتُكتب في الدردشة podo-podo.
        وعند الوداع: «Ati-ati, ya!» = انتبه لنفسك / في أمان الله (Hati-hati, ya!).
      en: |
        "Thank you" has two shapes:
        - Matur nuwun = Terima kasih, the polite one (krama). Use it with anyone older or anyone you don't know.
        - Suwun = the short one for friends (like "thanks"). "Suwun, rek!" = Thanks, guys!
        "You're welcome": Padha-padha (ngoko) = Sama-sama; krama: Sami-sami. Chats type it podo-podo.
        Saying goodbye: "Ati-ati, ya!" = Take care / safe trip (Hati-hati, ya!).
    examples:
      - text: Matur nuwun, Bu. — Sami-sami.
        ar_eg: شكرًا يا مدام. — العفو. (krama)
        ar: شكرًا يا سيدتي. — عفوًا. (krama)
        en: Thank you, ma'am. — You're welcome. (krama)
      - text: Suwun! — Padha-padha.
        ar_eg: ميرسي! — العفو. (ngoko)
        ar: شكرًا! — عفوًا. (ngoko)
        en: Thanks! — You're welcome. (ngoko)
      - text: Ati-ati, ya!
        ar_eg: خلي بالك من نفسك!
        ar: انتبه لنفسك!
        en: Take care!
exercises:
  - id: e01
    type: listen
    text: Piye kabare?
    options: ['Piye kabare?', 'Apik, matur nuwun.', 'Ati-ati, ya!']
    answer: 0
    words: [piye, kabare]
  - id: e02
    type: multiple_choice
    question: Piye kabare?
    question_meaning:
      ar_eg: صاحبك سألك «Piye kabare?». أنهي رد مناسب؟
      ar: سألك صديقك «Piye kabare?». أيّ جواب يناسب؟
      en: A friend asks "Piye kabare?". Which answer fits?
    options: ['Apik, suwun.', Sugeng dalu., Padha-padha.]
    answer: 0
    explain:
      ar_eg: «Piye kabare?» = إزيك؟ والرد «Apik» = كويس. padha-padha رد على الشكر.
      ar: «Piye kabare?» = كيف حالك؟ وجوابها «Apik» = بخير، أما padha-padha فجواب الشكر.
      en: '"Piye kabare?" = How are you? → "Apik" = good. padha-padha answers a thank-you.'
    words: [apik, suwun]
  - id: e03
    type: multiple_choice
    question: Matur nuwun, Mas!
    question_meaning:
      ar_eg: حد قالك «Matur nuwun, Mas!». ترد تقول إيه؟
      ar: قال لك أحدهم «Matur nuwun, Mas!». بمَ تردّ؟
      en: Someone says "Matur nuwun, Mas!" to you. What do you answer?
    options: [Sami-sami., Sugeng enjing., 'Piye kabare?']
    answer: 0
    explain:
      ar_eg: matur nuwun = شكرًا، والرد sami-sami (أو padha-padha مع الصحاب) = sama-sama.
      ar: matur nuwun = شكرًا، وجوابها sami-sami (أو padha-padha بين الأصدقاء) = sama-sama.
      en: matur nuwun = thank you; the answer is sami-sami (padha-padha with friends) = sama-sama.
    words: [matur nuwun, sami-sami]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إنت بتشكر جدة صاحبك. أنهي «شكرًا» أحسن؟
      ar: تشكر جدّة صديقك. أيّ صيغة للشكر أنسب؟
      en: You're thanking your friend's grandmother. Which "thank you" is best?
    options: ['Padha-padha, Bu.', 'Suwun, rek!', 'Matur nuwun, Bu.']
    answer: 2
    explain:
      ar_eg: مع حد كبير قول matur nuwun المؤدبة. suwun للصحاب، وrek للشلة.
      ar: مع الكبير تقال matur nuwun المهذبة، أما suwun فللأصدقاء، وrek للجماعة من الأقران.
      en: With an elder use polite matur nuwun. suwun is for friends, and rek is for your mates.
    words: [matur nuwun, suwun]
  - id: e05
    type: build_sentence
    source:
      ar_eg: كويس، شكرًا. (بأدب)
      ar: بخير، شكرًا. (بأدب)
      en: Good, thank you. (politely)
    answer: Apik, matur nuwun.
    distractors: [dalu, piye]
    words: [apik, matur nuwun]
