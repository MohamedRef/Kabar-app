dialogue:
  title: Pasar Turi, esuk
  lines:
    - speaker: Mohamed
      text: Sugeng enjing, Bu!
      ar_eg: صباح الخير يا مدام!
      ar: صباح الخير يا سيدتي!
      en: Good morning, ma'am!
    - speaker: Bu Yani
      text: Sugeng enjing, Mas Mohamed.
      ar_eg: صباح النور يا أستاذ محمد.
      ar: صباح النور يا أستاذ محمد.
      en: Good morning, Mohamed.
    - speaker: Cak Heru
      text: Mohamed! Piye kabare?
      ar_eg: محمد! إزيك؟
      ar: محمد! كيف حالك؟
      en: Mohamed! How are you?
    - speaker: Mohamed
      text: Alhamdulillah, apik. Suwun, Cak!
      ar_eg: الحمد لله، كويس. ميرسي يا كابتن!
      ar: الحمد لله، بخير. شكرًا يا أخي!
      en: Alhamdulillah, good. Thanks, Cak!
    - speaker: Cak Heru
      text: Padha-padha. Ati-ati, ya!
      ar_eg: العفو. خلي بالك من نفسك!
      ar: عفوًا. انتبه لنفسك!
      en: You're welcome. Take care!
