dialogue:
  title: Maca screenshot
  lines:
    - speaker: Mas Yudha
      text: Mohamed, wis maca grup?
      ar_eg: يا محمد، قريت الجروب؟
      ar: يا محمد، هل قرأت المجموعة؟
      en: Mohamed, have you read the group?
    - speaker: Mohamed
      text: Wis. "Gpp" iku apa, Mas?
      ar_eg: آه. يعني إيه «gpp» يا يودا؟
      ar: نعم. ما «gpp» يا يودا؟
      en: Yes. What's "gpp", Yudha?
    - speaker: Mas Yudha
      text: Gak papa, padha karo ora apa-apa.
      ar_eg: gak papa، يعني زي ora apa-apa، مفيش مشكلة.
      ar: gak papa، مثل ora apa-apa، أي لا بأس.
      en: Gak papa, same as ora apa-apa, no problem.
    - speaker: Mohamed
      text: Lan "iso" iku "isa", ta?
      ar_eg: وiso هي isa، صح؟
      ar: وiso هي isa، أليس كذلك؟
      en: And "iso" is "isa", right?
    - speaker: Mas Yudha
      text: Bener! Kowe wis dadi Screenshot Decoder.
      ar_eg: صح! إنت بقيت «فكّاك سكرين شوتات».
      ar: صحيح! صرت «مفكّك لقطات الشاشة».
      en: Right! You've become a Screenshot Decoder.
new_words:
  - word: blm
    pos: adverb
    ar_eg: لسه / لم بعد (اختصار belum)
    ar: لم بعد (اختصار belum)
    en: not yet (short for belum)
  - word: gpp
    pos: phrase
    ar_eg: مفيش مشكلة (اختصار gak papa)
    ar: لا بأس (اختصار gak papa)
    en: no problem (short for gak papa)
  - word: kuliah
    pos: noun
    ar_eg: محاضرة / دراسة في الجامعة
    ar: محاضرة / دراسة جامعية
    en: lectures, university classes = kuliah
