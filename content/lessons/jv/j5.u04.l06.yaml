      ar_eg: "رجّع الشات ده لجاوي رسمي: «Aku blm iso, ana kuliah.»"
      ar: "ردّ هذه الدردشة إلى جاوية قياسية: «Aku blm iso, ana kuliah.»"
      en: "Turn this chat into standard Javanese: «Aku blm iso, ana kuliah.»"
    answer: Aku durung isa, ana kuliah.
    distractors: [blm, iso]
    words: [blm, iso]
