schema: kabar.lesson/v1
id: j5.u04.l06
language: jv
title: Screenshot Decoder
can_do:
  ar_eg: تقرا سكرين شوت من جروب شات بمساعدة الـ Reader.
  ar: أن تقرأ لقطة شاشة من محادثة جماعية بمساعدة القارئ (Reader).
  en: Read a group-chat screenshot with the Reader.
slides:
  - title: Grup "Dolan Ambarawa"
    body:
      ar_eg: |
        سكرين شوت من جروب صحاب بيخططوا لفسحة. لو فتحته في الـ Reader بتاع Kabar، هيلوّن كل كلمة حسب لغتها. بس جرّب الأول لوحدك:
        blm = belum (لسه)، iso = isa (يقدر) بإملا الشات، gpp = gak papa (مفيش مشكلة)، kuliah = محاضرة / جامعة.
      ar: |
        لقطة شاشة من مجموعة أصدقاء يخططون لنزهة. لو فتحتها في القارئ (Reader) في Kabar للوّن كل كلمة بحسب لغتها، لكن جرّب وحدك أولًا:
        blm = belum (لم بعد)، وiso = isa (يستطيع) بإملاء الدردشة، وgpp = gak papa (لا بأس)، وkuliah = محاضرة / دراسة جامعية.
      en: |
        A screenshot from a friends' group planning an outing. Open it in Kabar's Reader and every word gets coloured by language. But try it yourself first:
        blm = belum (not yet), iso = isa (can) in chat spelling, gpp = gak papa (no problem), kuliah = lectures, university.
    grammar: jv.codemix
    examples:
      - text: Guys, sesuk jadi dolan neng Ambarawa ora?
        ar_eg: يا جماعة، الفسحة بتاعة بكرة في أمباراوا لسه قايمة؟
        ar: يا جماعة، هل ما زالت نزهة الغد إلى أمباراوا قائمة؟
        en: Guys, is tomorrow's trip to Ambarawa still on?
      - text: Aku blm iso, ana kuliah. Sorry yo.
        ar_eg: أنا لسه مش هقدر، عندي محاضرة. سوري.
        ar: لا أستطيع بعد، عندي محاضرة. آسف.
        en: I can't yet, I have class. Sorry.
      - text: Gpp, mengko fotone tak kirim neng grup.
        ar_eg: مفيش مشكلة، هبعت الصور على الجروب بعدين.
        ar: لا بأس، سأرسل الصور إلى المجموعة لاحقًا.
        en: No problem, I'll send the photos to the group later.
exercises:
  - id: e01
    type: multiple_choice
    question: Aku blm iso, ana kuliah. Sorry yo.
    question_meaning:
      ar_eg: الشخص ده هييجي؟
      ar: هل سيأتي هذا الشخص؟
      en: Is this person coming?
    options: ['Bisa datang.', 'Belum bisa datang.', 'Sudah datang.']
    answer: 1
    explain:
      ar_eg: blm = belum، وiso = isa (يقدر). يعني «لسه مش قادر».
      ar: blm = belum وiso = isa، أي «لا يستطيع بعد».
      en: "blm = belum and iso = isa (can): \"can't yet\"."
    words: [blm, iso]
  - id: e02
    type: multiple_choice
    question: gpp
    question_meaning:
      ar_eg: gpp معناها إيه؟
      ar: ما معنى gpp؟
      en: What does gpp mean?
    options: [ora apa-apa, ora pakai, piye]
    answer: 0
    words: [gpp]
  - id: e03
    type: listen
    text: Mengko fotone tak kirim neng grup.
    options: ['Mengko fotone dishare neng grup.', 'Sesuk fotone tak kirim neng grup.', 'Mengko fotone tak kirim neng grup.']
    answer: 2
    meaning:
      ar_eg: هبعت الصور على الجروب بعدين.
      ar: سأرسل الصور إلى المجموعة لاحقًا.
      en: I'll send the photos to the group later.
    words: [grup]
  - id: e04
    type: fill_blank
