  - id: e03
    type: listen
    text: Dina Minggu aku mertamu menyang omahe Pak Slamet.
    question:
      ar_eg: هيعمل إيه يوم الحد؟
      ar: ماذا سيفعل يوم الأحد؟
      en: What will he do on Sunday?
    options: [يوم الحد هزور بيت عم سلامت, يوم الحد هنضّف البيت, يوم الحد هقعد في البيت]
    answer: 0
    meaning:
      ar_eg: يوم الحد هزور بيت عم سلامت.
      ar: يوم الأحد سأزور بيت السيد سلامت.
      en: On Sunday I'll pay a visit to Pak Slamet's house.
    words: [mertamu]
  - id: e04
    type: fill_blank
    sentence: Payone bocor, aku ___ yen udan.
    meaning:
      ar_eg: السقف بيخرّ، أنا ___ لما تمطر.
      ar: السقف يسرّب، وأنا ___ حين تمطر.
      en: The roof leaks; I get ___ when it rains.
    options: [sumelang, ayem, mertamu]
    answers: [sumelang]
    words: [sumelang, ayem, mertamu]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الحتة المسقوفة قدام البيت اللي الناس بتقعد فيها اسمها …
      ar: الجزء المسقوف أمام البيت حيث يجلس الناس يسمّى …
      en: The roofed part in front of the house where people sit is the …
    options: [pager, emper, cendhela]
    answer: 1
    explain:
      ar_eg: emper = البرندة. pager = السور، وcendhela = الشباك.
      ar: emper = الشرفة؛ pager = السور، وcendhela = النافذة.
      en: emper = veranda; pager = fence, cendhela = window.
    words: [pager, emper, cendhela]
  - id: e06
    type: fill_blank
    sentence: Tukang lagi ___ payon sing bocor.
    meaning:
      ar_eg: الصنايعي بي___ السقف اللي بيخرّ.
      ar: العامل ___ السقف الذي يسرّب.
      en: The builder is ___ the leaking roof.
    options: [ndandani, sumelang, pager]
    answers: [ndandani]
    words: [ndandani, sumelang, pager]
  - id: e07
    type: multiple_choice
    question: Sawise payone didandani, atiku ___.
    options: [sumelang, ayem, pager]
    answer: 1
    explain:
      ar_eg: لما السقف اتصلّح القلق راح، فبقيت ayem = مرتاح.
      ar: بعد إصلاح السقف زال القلق، فصرت ayem = مطمئنًا.
      en: 'Once the roof is fixed the worry is gone, so: ayem = at ease.'
    words: [sumelang, ayem, pager]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الشباك ده كبير أوي.
      ar: هذه النافذة كبيرة جدًا.
      en: This window is really big.
    answer: Cendhela iki gedhe banget.
    distractors: [pager, payon]
    words: [cendhela]
  - id: e09
    type: translate
    direction: from_target
    source_text: Payon lan empere omah iki isih apik.
    answers_meaning:
      ar_eg: [سقف البيت ده وبرندته لسه كويسين, سقف وبرندة البيت ده لسه سليمين]
      ar: [سقف هذا البيت وشرفته ما زالا جيدين, ما زال سقف هذا البيت وشرفته سليمين]
      en: ['This house''s roof and veranda are still good', The roof and veranda of this house are still fine]
    words: [payon, emper]
  - id: e10
    type: speaking
    text: Bapak ndandani payon, aku ayem.
    meaning:
      ar_eg: بابا بيصلّح السقف، وأنا مرتاح.
      ar: يصلح أبي السقف، فأطمئن.
      en: Dad is fixing the roof, so I feel at ease.
    words: [ndandani, payon, ayem]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, empere omah iki jembar tenan, lho.
      ar_eg: يا ماس، برندة البيت ده واسعة أوي.
      ar: يا ماس، شرفة هذا البيت واسعة جدًا.
      en: Mas, this house's veranda is really wide.
    - speaker: Mas Dimas
      text: Iku omah Kalang. Payone isih asli, pagere tembok dhuwur.
      ar_eg: ده بيت كالانج. السقف لسه أصلي، والسور حيطة عالية.
      ar: هذا بيت كالانغ. سقفه ما زال أصليًا، وسوره جدار عالٍ.
      en: It's a Kalang house. The roof is still original, the wall is high.
    - speaker: Mohamed
      text: Cendhelane kok cilik-cilik ta?
      ar_eg: أمال الشبابيك صغيرة ليه؟
      ar: لماذا النوافذ صغيرة؟
      en: Why are the windows so small?
    - speaker: Mas Dimas
      text: Omahe dadi adhem. Ayo mertamu sik, sing duwe omah apikan kok.
      ar_eg: عشان الجو يبقى بارد. يلا نزورهم الأول، أصحاب البيت ناس طيبين.
      ar: ليبقى البيت باردًا. هيا نزورهم أولًا، أصحاب البيت طيبون.
      en: To keep it cool. Let's call in first; the owners are nice.
    - speaker: Mohamed
      text: Aku sumelang, aku durung isa krama alus.
      ar_eg: أنا قلقان، لسه مش بعرف كراما ألوس.
      ar: أنا قلق، لا أجيد الكراما الراقية بعد.
      en: I'm worried; I can't do high krama yet.
    - speaker: Mas Dimas
      text: Ayem wae. Ngomong alon-alon, mesthi dimangerteni.
      ar_eg: ريّح بالك. اتكلم بالراحة، وأكيد هيفهموك.
      ar: اطمئن. تكلّم ببطء وسيفهمونك حتمًا.
      en: Relax. Speak slowly and they'll understand you.
