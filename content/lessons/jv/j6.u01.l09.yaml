schema: kabar.lesson/v1
id: j6.u01.l09
language: jv
title: Omah Kalang
can_do:
  ar_eg: 'تزور بيت قديم في كوتاجيدي وتوصفه: البرندة، والسقف، والسور، والشبابيك، وإحساسك وانت ضيف.'
  ar: 'أن تزور بيتًا قديمًا في كوتاغيدي وتصفه: الشرفة والسقف والسور والنوافذ وشعورك ضيفًا.'
  en: 'Visit an old Kotagede house and describe it: the veranda, roof, wall and windows, and how it feels to be a guest.'
slides:
  - title: Omah lawas
    body:
      ar_eg: |
        emper = البرندة، الحتة المسقوفة قدام البيت. payon = السقف. pager = السور. cendhela = شباك.
        mertamu = يزور حد كضيف. ndandani = يصلّح.
        sumelang = قلقان، خايف من حاجة. ayem = مرتاح البال، هادي.
      ar: |
        emper = الشرفة المسقوفة أمام البيت. payon = السقف. pager = السور. cendhela = نافذة.
        mertamu = يزور ضيفًا. ndandani = يصلح.
        sumelang = قلق. ayem = مطمئن البال، هادئ.
      en: |
        emper = veranda, the roofed front porch. payon = roof. pager = fence, wall. cendhela = window.
        mertamu = pay a visit, call on someone. ndandani = repair, fix.
        sumelang = worried, anxious. ayem = at ease, calm.
    examples:
      - text: Omah Kalang ing Kutha Gedhe payone saka gendheng.
        ar_eg: بيوت كالانج في كوتاجيدي سقفها قرميد.
        ar: سقوف بيوت كالانغ في كوتاغيدي من القرميد.
        en: The Kalang houses in Kotagede have tiled roofs.
      - text: Pak Slamet lungguh ing emper, ayem banget.
        ar_eg: عم سلامت قاعد في البرندة، رايق خالص.
        ar: يجلس السيد سلامت في الشرفة مطمئنًا تمامًا.
        en: Pak Slamet sits on the veranda, completely at ease.
      - text: Pagere tembok, cendhelane cilik-cilik.
        ar_eg: السور حيطة، والشبابيك صغيرة.
        ar: السور جدار، والنوافذ صغيرة.
        en: The fence is a wall, and the windows are small.
