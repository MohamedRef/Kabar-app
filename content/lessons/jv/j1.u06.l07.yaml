dialogue:
  title: ng prabowo?
  lines:
    - speaker: Mas Heru
      text: ng prabowo?
      ar_eg: لبرابوو؟ (شات)
      ar: إلى برابوو؟ (دردشة)
      en: To Prabowo? (chat)
    - speaker: Mohamed
      text: Dudu, Mas. Aku arep neng kebun binatang.
      ar_eg: لأ يا معلم. أنا رايح جنينة الحيوانات.
      ar: لا يا أخي. سأذهب إلى حديقة الحيوان.
      en: No, Mas. I'm going to the zoo.
    - speaker: Mas Heru
      text: Saka stasiun lurus wae, terus nengen.
      ar_eg: من المحطة على طول، وبعدين يمين.
      ar: من المحطة امشِ مباشرة ثم يمينًا.
      en: From the station go straight, then right.
    - speaker: Mohamed
      text: Neng jejere terminal Giwangan, ta?
      ar_eg: جنب موقف جيوانجان، مش كده؟
      ar: بجانب موقف جيوانجان، أليس كذلك؟
      en: Next to Giwangan terminal, right?
    - speaker: Mas Heru
      text: Iya, cah! Ati-ati, ya!
      ar_eg: أيوه يا صاحبي! خلي بالك من نفسك!
      ar: نعم يا صاح! انتبه لنفسك!
      en: Yes, mate! Take care!
souvenir:
  id: j1.u06.souvenir
  title: Trans Jogja
  note:
    ar_eg: |
      Trans Jogja هو أتوبيس المدينة: أتوبيسات خضرا وبيضا بتقف عند محطات عالية (halte) بتطلعلها بسلم، وتدفع بالكارت، والخطوط ليها أرقام زي 1A و2B. منها تروح من Prawirotaman لـ Malioboro، أو لمحطة Giwangan الكبيرة، أو لجنينة حيوانات Gembira Loka.
      ومن هنا اتعلمت إن «ng» في الشات معناها neng، والسياق هو اللي بيقولك لـ ولا في. وبقيت تقدر تسأل: «Halte Malioboro neng ngendi, ya?»
    ar: |
      Trans Jogja حافلة المدينة: حافلات تقف عند محطات مرتفعة (halte) يُصعد إليها بدرج، ويُدفع فيها بالبطاقة، ولخطوطها أرقام مثل 1A و2B. ومنها تنتقل من Prawirotaman إلى Malioboro، أو إلى محطة Giwangan الكبرى، أو إلى حديقة حيوان Gembira Loka.
      وتعلّمتَ هنا أن «ng» في الدردشة تعني neng، والسياق يبيّن أهي «إلى» أم «في». وصرت تسأل: «Halte Malioboro neng ngendi, ya?»
    en: |
      Trans Jogja is the city bus: buses that stop at raised shelters (halte) you climb up to, pay by card, with numbered routes like 1A and 2B. It takes you from Prawirotaman to Malioboro, to the big Giwangan terminal, or to Gembira Loka zoo.
      Here you learned that "ng" in a chat means neng, and context tells you whether it's "to" or "at". Now you can ask: "Halte Malioboro neng ngendi, ya?"
