    words: [lurus, ngiwa, jejere]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا هنا، جنب الجامع!
      ar: أنا هنا، بجانب المسجد!
      en: I'm here, next to the mosque!
    answers: ["Aku neng kene, neng jejere masjid!", "Aku neng kene, neng jejere masjid", "Aku neng kene neng jejere masjid!", Aku neng kene neng jejere masjid, "Aku neng kene, neng jejere masjid!", "Aku neng kene, neng jejere masjid", "Aku neng kene neng jejere masjid!", Aku neng kene neng jejere masjid, "Aku neng kene, jejere masjid!", "Aku neng kene, jejere masjid", "Aku neng kene jejere masjid!", Aku neng kene jejere masjid, "Aku neng kene, jejere masjid!", "Aku neng kene, jejere masjid", "Aku neng kene jejere masjid!", Aku neng kene jejere masjid]
