schema: kabar.lesson/v1
id: j5.u03.l08
language: jv
title: Rungokna Mbak Ayu
can_do:
  ar_eg: تسمع رسالة صوتية وتكتبها بالإملا الصح، بالـ dh والـ th والـ a.
  ar: أن تستمع إلى رسالة صوتية وتكتبها بالإملاء القياسي، بـ dh وth وa.
  en: Follow a voice message and write it in standard spelling, with dh, th and a.
exercises:
  - id: e01
    type: listen
    text: Mohamed, aku wis ana ing Simpang Lima, ing ngarep masjid.
    question:
      ar_eg: آيو خفّت وبعتتلك فويس. هي فين دلوقتي؟
      ar: شُفيت آيو وأرسلت إليك رسالة صوتية. أين هي الآن؟
      en: Ayu is better and has sent you a voice note. Where is she now?
    options: [ing Simpang Lima, ing Stasiun Tawang, ing omah]
    answer: 0
    meaning:
      ar_eg: يا محمد، أنا وصلت سيمبانج ليما، قدّام الجامع.
      ar: يا محمد، أنا الآن في سيمبانغ ليما، أمام المسجد.
      en: Mohamed, I'm at Simpang Lima now, in front of the mosque.
    words: [ngarep]
  - id: e02
    type: listen
    text: Ing kene ana puthu lan kenthang goreng.
    options:
      - Ing kene ana putu lan kentang goreng.
      - Ing kene ana puthu lan kentang goreng.
      - Ing kene ana puthu lan kenthang goreng.
    answer: 2
    meaning:
      ar_eg: هنا فيه بوتو وبطاطس محمّرة.
      ar: هنا بوتو وبطاطس مقلية.
      en: There's puthu and fried potatoes here.
    explain:
      ar_eg: 'الاتنين بـ th: puthu وkenthang. اللسان بيترجع لورا.'
      ar: 'كلتاهما بـ th: puthu وkenthang، واللسان يرتد إلى الخلف.'
      en: 'Both have th: puthu and kenthang, with the tongue curled back.'
    words: [puthu, kenthang]
  - id: e03
    type: listen
    text: Aja suwe ya, hawane adhem banget.
    question:
      ar_eg: آيو بتطلب منك إيه؟
      ar: ماذا تطلب منك آيو؟
      en: What does Ayu ask you?
    options: [Aja lali, Aja suwe, Aja teka]
    answer: 1
    meaning:
      ar_eg: ما تتأخرش، الجو برد أوي.
      ar: لا تتأخر، الجو بارد جدًا.
      en: Don't be long, the weather's really cold.
    explain:
      ar_eg: suwe = وقت طويل (lama). aja suwe = ما تتأخرش.
      ar: suwe = مدة طويلة (lama)، وaja suwe = لا تتأخر.
      en: suwe = a long time (lama); aja suwe = don't be long.
    words: [adhem, hawa, suwe]
  - id: e04
    type: match_pairs
    pairs:
      - text: suwe
        ar_eg: وقت طويل
        ar: مدة طويلة
        en: long (time)
      - text: adhem
        ar_eg: برد
        ar: بارد
        en: cold
      - text: kenthang
        ar_eg: بطاطس
        ar: بطاطس
        en: potato
      - text: puthu
        ar_eg: كيكة رز صغيرة بالسكر الأحمر
        ar: كعكة أرز صغيرة بسكر النخيل
        en: small steamed rice cake
      - text: ngarep
        ar_eg: قدّام
        ar: أمام
        en: in front
    words: [adhem, kenthang, puthu, suwe]
  - id: e05
    type: multiple_choice
    question: Aja suwe ya, hawane adhem banget.
    question_meaning:
      ar_eg: في الشات، آيو غالبًا هتكتب aja إزاي؟
      ar: في الدردشة، كيف ستكتب آيو aja على الأرجح؟
      en: In a chat, how would Ayu most likely type aja?
    options: [oja, ojo, aje]
    answer: 1
    explain:
      ar_eg: الاتنين a في آخر الكلمة بيتنطقوا o، فالشات بيكتب ojo. الإملا الصح aja.
      ar: حرفا a في آخر الكلمة يُنطقان o، فتكتبها الدردشة ojo، والقياسي aja.
      en: Both a's at the end are said o, so chats type ojo; the standard is aja.
    words: [suwe]
  - id: e06
    type: fill_blank
    sentence: Ing kene ana puthu lan ___ goreng.
    meaning:
      ar_eg: هنا فيه بوتو وبطاطس محمّرة.
      ar: هنا بوتو وبطاطس مقلية.
      en: There's puthu and fried potatoes here.
    options: [kentang, kenthang]
    answers: [kenthang]
    words: [kenthang]
  - id: e07
    type: dictation
    text: Aja suwe ya, hawane adhem banget.
    meaning:
      ar_eg: ما تتأخرش، الجو برد أوي.
      ar: لا تتأخر، الجو بارد جدًا.
      en: Don't be long, the weather's really cold.
    explain:
      ar_eg: 'اكتب الإملا الصح: aja (مش ojo) وadhem بـ dh.'
      ar: 'اكتب بالإملاء القياسي: aja (لا ojo) وadhem بـ dh.'
      en: 'Write the standard spelling: aja (not ojo) and adhem with dh.'
    words: [adhem, suwe]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بالإملا الصح) أنا دلوقتي في سيمبانج ليما.
      ar: (بالإملاء القياسي) أنا الآن في سيمبانغ ليما.
      en: (standard spelling) I'm at Simpang Lima now.
    answers:
      - Aku wis ana ing Simpang Lima.
      - Aku saiki ana ing Simpang Lima.
      - Aku wis ing Simpang Lima.
      - Aku wis neng Simpang Lima.
      - Aku saiki neng Simpang Lima.
      - Aku saiki ing Simpang Lima.
  - id: e09
    type: speaking
    text: Aku teka saiki, Mbak!
    meaning:
      ar_eg: أنا جاي دلوقتي يا آيو!
      ar: أنا قادم الآن يا آيو!
      en: I'm coming now, Ayu!
dialogue:
  title: Ing Simpang Lima
  lines:
    - speaker: Mohamed
      text: Mbak! Aku wis krungu. Kowe wis mari?
      ar_eg: يا آيو! سمعت الفويس. خفّيتي خلاص؟
      ar: يا آيو! سمعتُ. هل شُفيتِ؟
      en: Ayu! I heard you. Are you better?
    - speaker: Mbak Ayu
      text: Wis. Ayo tuku puthu, isih anget.
      ar_eg: آه خلاص. يلا نشتري بوتو، لسه سخن.
      ar: نعم. هيا نشتري البوتو، ما زال دافئًا.
      en: Yes. Let's buy puthu, it's still warm.
    - speaker: Mohamed
      text: Puthu karo th, kenthang karo th. Aku wis ngerti!
      ar_eg: puthu بـ th، وkenthang بـ th. أنا فهمت خلاص!
      ar: puthu بـ th وkenthang بـ th. لقد فهمتُ!
      en: Puthu with th, kenthang with th. I've got it now!
    - speaker: Mbak Ayu
      text: Pinter! Saiki ngomong "adhem".
      ar_eg: شاطر! قول دلوقتي «adhem».
      ar: أحسنت! قل الآن «adhem».
      en: Clever! Now say "adhem".
    - speaker: Mohamed
      text: Adhem, karo dh. Hawane adhem, nanging puthune anget!
      ar_eg: adhem بـ dh. الجو برد، بس البوتو سخن!
      ar: adhem بـ dh. الجو بارد، لكن البوتو دافئ!
      en: Adhem, with dh. The weather's cold, but the puthu's warm!
new_words:
  - word: suwe
    pos: adjective
    ar_eg: وقت طويل، يتأخّر
    ar: طويل (زمنًا)
    en: long (time) = lama
review:
  status: draft
  verified: false
