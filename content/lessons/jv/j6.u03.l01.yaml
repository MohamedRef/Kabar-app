    ar: علامة ng في آخر المقطع، فوق الحرف
    en: the closing ng mark, above the letter
  - word: layar
    pos: noun
    ar_eg: علامة r في آخر المقطع، فوق الحرف
    ar: علامة r في آخر المقطع، فوق الحرف
    en: the closing r mark, above the letter
