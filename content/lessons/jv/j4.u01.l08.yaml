schema: kabar.lesson/v1
id: j4.u01.l08
language: jv
title: Ulangan J4.1
can_do:
  ar_eg: تكرّم التاني من غير ما تكرّم نفسك.
  ar: أن توقّر غيرك دون أن توقّر نفسك.
  en: Honour without self-honouring.
slides:
  - title: Kangge panjenengan, kangge kula
    body:
      ar_eg: |
        الوحدة كلها في جدول واحد. الكبير ← إنت:
        dhahar ← nedha · ngunjuk ← nginum · kersa ← purun · tindak ← kesah · sare ← tilem · kondur ← wangsul · rawuh ← dhateng · lenggah ← linggih · ngendika ← sanjang · mirsani ← ningali.
        وsiram للكبير، وإنت adus.
        حتى الكبير لما يتكلم عن نفسه بيقول kesah وnedha. krama inggil دايمًا للتاني.
      ar: |
        الوحدة كلها في جدول واحد، الكبير ← أنت:
        dhahar ← nedha · ngunjuk ← nginum · kersa ← purun · tindak ← kesah · sare ← tilem · kondur ← wangsul · rawuh ← dhateng · lenggah ← linggih · ngendika ← sanjang · mirsani ← ningali.
        وsiram للكبير وadus لك.
        وحتى الكبير يقول عن نفسه kesah وnedha؛ فـ krama inggil للآخر دائمًا.
      en: |
        The whole unit in one table, elder ← you:
        dhahar ← nedha · ngunjuk ← nginum · kersa ← purun · tindak ← kesah · sare ← tilem · kondur ← wangsul · rawuh ← dhateng · lenggah ← linggih · ngendika ← sanjang · mirsani ← ningali.
        siram for the elder, adus for you.
        Even the elder says kesah and nedha about himself: krama inggil is always for the other person.
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Kula sampun nedha. Panjenengan sampun dhahar, Pak?
        ar_eg: أنا أكلت. وحضرتك أكلت يا أستاذ؟
        ar: لقد أكلتُ. وهل تفضّلتَ بالأكل يا سيدي؟
        en: I've eaten. Have you eaten, sir?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dhahar
        ar_eg: nedha بتاعة الكبير (ياكل)
        ar: nedha للكبير (يأكل)
        en: the elder's nedha (eat)
      - text: kondur
        ar_eg: wangsul بتاعة الكبير (يرجع البيت)
        ar: wangsul للكبير (يعود)
        en: the elder's wangsul (go home)
      - text: sare
        ar_eg: tilem بتاعة الكبير (ينام)
        ar: tilem للكبير (ينام)
        en: the elder's tilem (sleep)
      - text: mirsani
        ar_eg: ningali بتاعة الكبير (يشوف)
        ar: ningali للكبير (يرى)
        en: the elder's ningali (see)
    words: [dhahar, kondur, sare, mirsani]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة صح عن نفسك؟
      ar: أي جملة صحيحة عن نفسك؟
      en: Which sentence about yourself is right?
    options: ['Kula badhe tindak dhateng peken.', 'Kula badhe kesah dhateng peken.', 'Kula badhe lunga dhateng peken.']
    answer: 1
    explain:
      ar_eg: عن نفسك kesah. tindak للكبير، وlunga نغوكو وسط جملة كراما.
      ar: عن نفسك kesah، وtindak للكبير، وlunga نغوكو في جملة كراما.
      en: About yourself, kesah. tindak is for the elder; lunga is ngoko in a krama sentence.
    words: [kesah, tindak]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها غلطة؟
      ar: أي جملة فيها خطأ؟
      en: Which sentence has a mistake?
    options: ['Bapak saweg siram.', 'Simbah saweg sare.', 'Kula saweg sare.']
    answer: 2
    explain:
      ar_eg: sare لنوم الكبير. عن نفسك «Kula saweg tilem».
      ar: sare لنوم الكبير، وعن نفسك «Kula saweg tilem».
      en: sare is the elder's sleep. About yourself, "Kula saweg tilem".
    words: [sare, tilem, saweg]
  - id: e04
    type: listen
    text: Bapak ngendika, Simbah sampun dhahar.
    options: ['Bapak ngendika, Simbah sampun dhahar.', 'Bapak sanjang, Simbah sampun nedha.', 'Bapak ngendika, Simbah saweg sare.']
    answer: 0
    meaning:
      ar_eg: بابا قال إن تيتة أكلت.
      ar: قال الوالد إن الجدة قد أكلت.
      en: Father said Grandma has eaten.
    words: [ngendika, dhahar]
  - id: e05
    type: listen
    text: Panjenengan kersa ngunjuk kopi, Pak?
    options: ['Panjenengan purun nginum kopi, Pak?', 'Panjenengan kersa ngunjuk kopi, Pak?', 'Panjenengan kersa dhahar, Pak?']
    answer: 1
    meaning:
      ar_eg: حضرتك تحب تشرب قهوة يا أستاذ؟
      ar: هل تودّ شرب القهوة يا سيدي؟
      en: Would you like some coffee, sir?
    words: [kersa, ngunjuk]
  - id: e06
    type: fill_blank
    sentence: Kula sampun ___, Bu. Matur nuwun.
    meaning:
      ar_eg: أنا أكلت يا هانم. شكرًا.
      ar: لقد أكلتُ يا سيدتي. شكرًا.
      en: I've eaten, ma'am. Thank you.
    options: [dhahar, nedha, mangan]
    answers: [nedha]
    words: [nedha]
  - id: e07
    type: fill_blank
    sentence: Simbah ___, Mas Dimas sampun wangsul?
    meaning:
      ar_eg: "تيتة بتسأل: دِيماس رجع؟"
      ar: "سألت الجدة: هل عاد ديماس؟"
      en: Grandma is asking whether Dimas is back.
    options: [taken, ndangu, sanjang]
    answers: [ndangu]
    explain:
      ar_eg: السؤال سؤال تيتة، يبقى ndangu. ودِيماس أصغر منها، فهي بتقول عنه wangsul عادي.
      ar: السؤال سؤال الجدة فيكون ndangu، وديماس أصغر منها فتقول عنه wangsul.
      en: It's Grandma asking, so ndangu. Dimas is younger than her, so she says plain wangsul about him.
    words: [ndangu, wangsul]
  - id: e08
    type: build_sentence
    source:
      ar_eg: بابا بيتفرج على التلفزيون.
      ar: الوالد يشاهد التلفاز.
      en: Father is watching TV.
    answer: Bapak saweg mirsani TV.
    distractors: [ningali, lagi]
    words: [saweg, mirsani]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لتيتة) حضرتك رايحة فين يا تيتة؟
      ar: (إلى الجدة) إلى أين تذهبين يا جدتي؟
      en: (to Grandma) Where are you going, Grandma?
    answers: ['Panjenengan badhe tindak dhateng pundi, Mbah?', 'Panjenengan badhe tindak pundi, Mbah?', 'Mbah, panjenengan badhe tindak dhateng pundi?', 'Mbah, panjenengan badhe tindak pundi?', 'Simbah badhe tindak pundi?', 'Simbah badhe tindak dhateng pundi?', 'Badhe tindak pundi, Mbah?', 'Badhe tindak dhateng pundi, Mbah?']
    explain:
      ar_eg: badhe (رايح) + tindak (krama inggil لـ lunga) + (dhateng) pundi. وممكن تقول Simbah بدل panjenengan.
      ar: badhe + tindak (krama inggil لـ lunga) + (dhateng) pundi، ويجوز Simbah مكان panjenengan.
      en: badhe + tindak (krama inggil for lunga) + (dhateng) pundi. Simbah can replace panjenengan.
    words: [tindak]
  - id: e10
    type: dictation
    text: Sugeng rawuh, Pak. Mangga lenggah.
    meaning:
      ar_eg: أهلًا وسهلًا يا أستاذ. اتفضل اقعد.
      ar: أهلًا وسهلًا يا سيدي. تفضّل بالجلوس.
      en: Welcome, sir. Please have a seat.
    words: [rawuh, lenggah]
  - id: e11
    type: speaking
    text: Kula badhe wangsul rumiyin. Sugeng tindak, Pak.
    meaning:
      ar_eg: أنا هروّح بقى. توصل بالسلامة يا أستاذ.
      ar: سأعود إلى البيت الآن. في أمان الله يا سيدي.
      en: I'll head home now. Safe journey, sir.
    words: [wangsul, sugeng tindak]
dialogue:
  title: Dalu-dalu dhateng Tugu
  lines:
    - speaker: Mohamed
      text: Pak, panjenengan badhe tindak pundi?
      ar_eg: يا أستاذ، حضرتك رايح فين؟
      ar: يا سيدي، إلى أين تذهب؟
      en: Sir, where are you going?
    - speaker: Pak Harsono
      text: Kula badhe kesah dhateng Tugu, Mas.
      ar_eg: أنا رايح التوغو يا ابني.
      ar: أنا ذاهب إلى التوغو يا بني.
      en: I'm going to the Tugu.
    - speaker: Mohamed
      text: Kula ugi, Pak. Simbah kersa tindak ugi?
      ar_eg: وأنا كمان يا أستاذ. وتيتة تحب تيجي هي كمان؟
      ar: وأنا أيضًا يا سيدي. هل تودّ الجدة أن تذهب أيضًا؟
      en: Me too, sir. Would Grandma like to come too?
    - speaker: Pak Harsono
      text: Mboten, Mas. Simbah saweg sare.
      ar_eg: لا يا ابني. تيتة نايمة.
      ar: لا يا بني. الجدة نائمة.
      en: No. Grandma's asleep.
    - speaker: Mohamed
      text: Inggih. Mangga, Pak, panjenengan rumiyin.
      ar_eg: ماشي. اتفضل يا أستاذ، حضرتك الأول.
      ar: حسنًا. تفضّل يا سيدي، أنت أولًا.
      en: All right. After you, sir.
    - speaker: Pak Harsono
      text: Matur nuwun, Mas.
      ar_eg: شكرًا يا ابني.
      ar: شكرًا يا بني.
      en: Thank you.
souvenir:
  id: j4.u01.souvenir
  title: Tugu Pal Putih
  note:
    ar_eg: |
      التوغو هو العمود الأبيض في نص تقاطع يوجياكارتا، وبيتقال إنه واقف على خط وهمي واحد بيربط جبل ميرابي بقصر السلطان وبالبحر الجنوبي. والخط ده («المحور الكوني» ليوجيا) دخل قايمة التراث العالمي لليونسكو سنة ٢٠٢٣. وإنت واقف قدامه افتكر درس الوحدة: «Bapak tindak» آه، «kula tindak» لأ — التكريم دايمًا للتاني.
    ar: |
      التوغو عمود أبيض في وسط تقاطع يوغياكارتا، ويقال إنه يقع على خط متخيَّل واحد يصل جبل ميرابي بقصر السلطان وبالبحر الجنوبي. وقد أُدرج هذا المحور («المحور الكوني» ليوغياكارتا) في قائمة التراث العالمي لليونسكو سنة ٢٠٢٣. وأنت أمامه تذكّر درس الوحدة: «Bapak tindak» نعم، و«kula tindak» لا؛ فالتوقير للآخر دائمًا.
    en: |
      The Tugu is the white pillar in the middle of Yogyakarta's crossroads, said to stand on one imaginary line linking Mount Merapi, the Sultan's palace and the southern sea. That line, Yogyakarta's "Cosmological Axis", became a UNESCO World Heritage Site in 2023. Standing in front of it, remember the unit's lesson: "Bapak tindak", yes; "kula tindak", no. Honour always goes to the other person.
