schema: kabar.lesson/v1
id: j4.u01.l08
language: jv
title: Pangandikanipun Simbah
can_do:
  ar_eg: تسأل حد كبير اتولد فين، وتكتب نصايحه، وتطمّنه ما يشيلش هم.
  ar: أن تسأل كبيرًا عن مكان مولده، وتكتب نصائحه، وتطمئنه ألّا يحمل همًّا.
  en: Ask an elder where they were born, write down their words, and tell them not to worry.
slides:
  - title: Lair → miyos, ati → penggalih
    body:
      ar_eg: |
        - اتولد: lair ← miyos (krama inggil): «Simbah miyos ing Kotagede.» وعن نفسك: «Kula lair ing Kairo.»
        - pangandika = كلام الكبير ووصيته (اسم من ngendika): «pangandikanipun Simbah».
        - nggalih = يفكّر (krama inggil)، وpenggalih = بال الكبير وقلبه. «Sampun dados penggalih, Mbah» = ما تشيليش هم يا تيتة.
        - nyerat = يكتب، maos = يقرا (كراما)، وtembung = كلمة.
      ar: |
        - وُلد: lair ← miyos (krama inggil): «Simbah miyos ing Kotagede.» وعن نفسك: «Kula lair ing Kairo.»
        - pangandika = كلام الكبير ووصيّته (اسم من ngendika): «pangandikanipun Simbah».
        - nggalih = يفكّر (krama inggil)، وpenggalih = بال الكبير وقلبه. «Sampun dados penggalih, Mbah» = لا تحملي همًّا يا جدّتي.
        - nyerat = يكتب، maos = يقرأ (كراما)، وtembung = كلمة.
      en: |
        - be born: lair → miyos (krama inggil): "Simbah miyos ing Kotagede." About yourself: "Kula lair ing Kairo."
        - pangandika = an elder's words, advice (noun from ngendika): "pangandikanipun Simbah".
        - nggalih = think (krama inggil), and penggalih = an elder's mind, heart. "Sampun dados penggalih, Mbah" = don't worry about it, Grandma.
        - nyerat = write, maos = read (krama), and tembung = word.
    examples:
      - text: Simbah miyos ing Kotagede.
        ar_eg: تيتة اتولدت في كوتاجيدي.
        ar: وُلدت الجدّة في كوتاغيدي.
        en: Grandma was born in Kotagede.
      - text: Kula nyerat pangandikanipun Simbah.
        ar_eg: أنا بكتب كلام تيتة.
        ar: أكتب كلام الجدّة.
        en: I'm writing down Grandma's words.
      - text: Sampun dados penggalih, Mbah.
        ar_eg: ما تشيليش هم يا تيتة.
        ar: لا تحملي همًّا يا جدّتي.
        en: Don't worry about it, Grandma.
