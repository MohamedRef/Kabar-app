      ar: تكلّمت الجدّة. ___ الجدّة جميل جدًّا.
      en: Grandma spoke. Grandma's ___ were very good.
    options: [Pangandikanipun, Penggalihipun, Lairipun]
    answer: 0
    explain:
      ar_eg: pangandika = كلام الكبير.
      ar: pangandika = كلام الكبير.
      en: pangandika = an elder's words.
