dialogue:
  lines:
    - speaker: Mohamed
      text: Mbah, Simbah miyos ing pundi?
      ar_eg: يا تيتة، حضرتك اتولدتي فين؟
      ar: يا جدّتي، أين وُلدتِ؟
      en: Grandma, where were you born?
    - speaker: Mbah Putri
      text: Kula lair ing Kotagede, Nak. Sampun dangu sanget.
      ar_eg: أنا اتولدت في كوتاجيدي يا ابني. من زمان أوي.
      ar: وُلدتُ في كوتاغيدي يا بنيّ، منذ زمن بعيد.
      en: I was born in Kotagede, dear. A very long time ago.
    - speaker: Mohamed
      text: Kula lair ing Kairo, Mbah.
      ar_eg: وأنا اتولدت في القاهرة يا تيتة.
      ar: وأنا وُلدتُ في القاهرة يا جدّتي.
      en: I was born in Cairo, Grandma.
    - speaker: Mbah Putri
      text: Kairo tebih sanget! Basa Jawi angel, nggih?
      ar_eg: القاهرة بعيدة أوي! الجاوي صعب، صح؟
      ar: القاهرة بعيدة جدًّا! الجاوية صعبة، أليس كذلك؟
      en: Cairo is so far! Javanese is hard, isn't it?
    - speaker: Mohamed
      text: Inggih, Mbah. Pangandikanipun Simbah kula serat ing buku.
      ar_eg: أيوه يا تيتة. بكتب كلام حضرتك في الكشكول.
      ar: نعم يا جدّتي. أكتب كلامكِ في الدفتر.
      en: Yes, Grandma. I write your words down in my notebook.
    - speaker: Mbah Putri
      text: Sae, Nak. Alon-alon mawon.
      ar_eg: شاطر يا ابني. واحدة واحدة.
      ar: أحسنت يا بنيّ. على مهلك.
      en: Good, dear. Take it slowly.
