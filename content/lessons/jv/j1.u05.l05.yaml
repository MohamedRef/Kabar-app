schema: kabar.lesson/v1
id: j1.u05.l05
language: jv
title: Wani nglangi?
can_do:
  ar_eg: 'تتكلم على البحر: تعوم ولا لأ، رجلك وسخة، حد بيعيط أو ساكت، وتقول «بالراحة».'
  ar: 'أن تتحدث على الشاطئ: هل تسبح، وقدمك متسخة، وأحد يبكي أو صامت، وتقول «على مهلك».'
  en: 'Talk at the beach: whether you dare to swim, sandy feet, someone crying or quiet, and "take it easy".'
slides:
  - title: Neng Parangtritis
    body:
      ar_eg: |
        موج باراندتريتيس عالي وخطير، والعوم هناك ممنوع. أهل يوجيا هيقولولك: Aja nglangi!
        - **nglangi** = يعوم (berenang) · **wani** = يجرؤ / جريء (berani): Kowe wani? = تجرؤ؟
        - **sikil** = رجل (kaki) · **reged** = وسخ (kotor): Sikilku reged pasir.
        - **nangis** = يعيط (menangis) · **meneng** = ساكت (diam) · **eseman** = ابتسامة (senyum)
        - **alon** = بالراحة / بطيء (pelan): Alon-alon wae! = براحة!
      ar: |
        موج باراندتريتيس عالٍ وخطِر، والسباحة هناك ممنوعة، وسيقول لك أهل يوجيا: Aja nglangi!
        - **nglangi** = يسبح (berenang) · **wani** = يجرؤ / شجاع (berani): Kowe wani? = أتجرؤ؟
        - **sikil** = قدم، رِجل (kaki) · **reged** = متسخ (kotor): Sikilku reged pasir.
        - **nangis** = يبكي (menangis) · **meneng** = صامت (diam) · **eseman** = ابتسامة (senyum)
        - **alon** = على مهل / بطيء (pelan): Alon-alon wae! = على مهلك!
      en: |
        Parangtritis has big, dangerous waves, and swimming there is banned. Jogja people will tell you: Aja nglangi!
        - **nglangi** = swim (berenang) · **wani** = dare, brave (berani): Kowe wani? = Do you dare?
        - **sikil** = foot, leg (kaki) · **reged** = dirty (kotor): Sikilku reged pasir.
        - **nangis** = cry (menangis) · **meneng** = quiet, silent (diam) · **eseman** = smile (senyum)
        - **alon** = slow, gently (pelan): Alon-alon wae! = Take it easy!
    examples:
      - text: Ombake gedhe. Aja nglangi!
        ar_eg: الموج عالي. ماتعومش!
        ar: الموج عالٍ. لا تسبح!
        en: The waves are big. Don't swim!
      - text: Sikilku reged, akeh pasir.
        ar_eg: رجلي وسخة، رملة كتير.
        ar: قدمي متسخة، فيها رمل كثير.
        en: My feet are dirty, lots of sand.
      - text: Alon-alon wae, Mas.
        ar_eg: براحة يا ماس.
        ar: على مهلك يا أخي.
        en: Take it easy, Mas.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nglangi
        ar_eg: يعوم
        ar: يسبح
        en: swim
      - text: wani
        ar_eg: جريء / يجرؤ
        ar: شجاع / يجرؤ
        en: dare, brave
      - text: sikil
        ar_eg: رجل
        ar: قدم
        en: foot, leg
      - text: reged
        ar_eg: وسخ
        ar: متسخ
        en: dirty
    words: [nglangi, wani, sikil, reged]
  - id: e02
    type: match_pairs
    pairs:
      - text: nangis
        ar_eg: يعيط
        ar: يبكي
        en: cry
      - text: meneng
        ar_eg: ساكت
        ar: صامت
        en: quiet
      - text: eseman
        ar_eg: ابتسامة
        ar: ابتسامة
        en: smile
      - text: alon
        ar_eg: بالراحة
        ar: على مهل
        en: slow, gently
    words: [nangis, meneng, eseman, alon]
  - id: e03
    type: listen
    text: Ombake gedhe. Aja nglangi!
    question:
      ar_eg: بيقوله إيه؟
      ar: ماذا يقول له؟
      en: What's he telling him?
    options: [الموج عالي، ماتعومش!, الموج هادي، عوم!, البحر نضيف]
    answer: 0
    meaning:
      ar_eg: الموج عالي. ماتعومش!
      ar: الموج عالٍ. لا تسبح!
      en: The waves are big. Don't swim!
    words: [nglangi]
  - id: e04
    type: fill_blank
    sentence: Sikilku ___, akeh pasir.
    meaning:
      ar_eg: رجلي ___، فيها رملة كتير.
      ar: قدمي ___، فيها رمل كثير.
      en: My feet are ___, lots of sand.
    options: [reged, alon, wani]
    answers: [reged]
    words: [reged, alon, wani, sikil]
  - id: e05
    type: fill_blank
    sentence: Bocah kuwi ___ wae.
    meaning:
      ar_eg: العيل ده بـ ___ على طول.
      ar: ذلك الطفل ___ باستمرار.
      en: That kid keeps ___.
    options: [nangis, nglangi, meneng]
    answers: [nangis]
    words: [nangis, nglangi, meneng]
  - id: e06
    type: multiple_choice
    question: Alon-alon wae, Mas.
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [براحة يا ماس, بسرعة يا ماس, اسكت يا ماس]
    answer: 0
    explain:
      ar_eg: alon = pelan (بالراحة). «ساكت» تبقى meneng.
      ar: alon = pelan (على مهل)، أما «صامت» فـ meneng.
      en: alon = pelan (slowly). "Quiet" is meneng.
    words: [alon, meneng]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «تجرؤ تعوم؟» بالجاوي؟
      ar: كيف تقول «أتجرؤ على السباحة؟» بالجاوية؟
      en: '"Do you dare to swim?" in Javanese?'
    options: ['Kowe wani nglangi?', 'Kowe isa nangis?', 'Kowe meneng wae?']
    answer: 0
    explain:
      ar_eg: wani = berani، وnglangi = berenang.
      ar: wani = berani، وnglangi = berenang.
      en: wani = berani, nglangi = berenang.
    words: [wani, nglangi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ابتسامتك حلوة، ماتعيطش.
      ar: ابتسامتك جميلة، لا تبكِ.
      en: Your smile is lovely, don't cry.
    answer: Esemanmu apik, aja nangis.
    distractors: [reged, alon]
    words: [eseman, nangis]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kok meneng wae? Endi esemanmu?
    answers_meaning:
      ar_eg: [ساكت ليه؟ فين ابتسامتك؟, مالك ساكت كده؟ فين ضحكتك؟]
      ar: [لماذا أنت صامت؟ أين ابتسامتك؟]
      en: ['Why so quiet? Where''s your smile?', 'How come you''re so quiet? Where''s that smile?']
    words: [meneng, eseman]
  - id: e10
    type: speaking
    text: Sikilku reged. Alon-alon wae, ya.
    meaning:
      ar_eg: رجلي وسخة. براحة بقى.
      ar: قدمي متسخة. على مهلك إذن.
      en: My feet are dirty. Take it easy, OK.
    words: [sikil, reged, alon]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, ayo nglangi!
      ar_eg: يا ماس، يلا نعوم!
      ar: يا أخي، هيّا نسبح!
      en: Mas, let's swim!
    - speaker: Mas Heru
      text: Aja! Ombak neng Parangtritis gedhe banget. Aku ra wani.
      ar_eg: لأ! الموج في باراندتريتيس عالي أوي. أنا مش جريء.
      ar: لا! موج باراندتريتيس عالٍ جدًا. لا أجرؤ.
      en: Don't! The waves at Parangtritis are huge. I don't dare.
    - speaker: Mohamed
      text: Oh, ngapura. Dadi mung dolanan pasir wae?
      ar_eg: آه، معلش. يعني نلعب في الرملة وبس؟
      ar: آه، آسف. إذن نلعب بالرمل فقط؟
      en: Oh, sorry. So we just play in the sand?
    - speaker: Mas Heru
      text: Iya. Alon-alon wae, sikilmu reged kabeh, hehe.
      ar_eg: آه. براحة، رجلك كلها وسخة، هههه.
      ar: نعم. على مهلك، قدماك متسختان تمامًا، هه.
      en: Yep. Easy now, your feet are all dirty, hehe.
    - speaker: Mohamed
      text: Lho, bocah kuwi nangis. Layangane mabur!
      ar_eg: إيه ده، العيل ده بيعيط. طيارته طارت!
      ar: انظر، ذلك الطفل يبكي. طارت طائرته الورقية!
      en: Hey, that kid's crying. His kite flew off!
