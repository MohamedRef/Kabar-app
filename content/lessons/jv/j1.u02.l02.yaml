schema: kabar.lesson/v1
id: j1.u02.l02
language: jv
title: Jenengku…
can_do:
  ar_eg: تعرّف بنفسك بالـ ngoko.
  ar: أن تعرّف بنفسك في مستوى النغوكو.
  en: Introduce yourself in ngoko.
slides:
  - title: Jenengku Mohamed
    body:
      ar_eg: |
        خبر حلو: لو بتعرف تبني جملة إندونيسي، بتعرف تبني جملة جاوي. نفس الترتيب، الكلمات بس اللي بتتغير:
        - Jenengku Mohamed = Nama saya Mohamed = اسمي محمد. (jeneng = nama، و-ku = بتاعي)
        - Aku saka Kairo = Saya dari Kairo = أنا من القاهرة. (saka = dari)
        فاكر saya؟ في الجاوي النغوكو بنقول aku.
      ar: |
        من يحسن بناء الجملة الإندونيسية يحسن بناء الجاوية؛ الترتيب واحد والمفردات تتغير:
        - Jenengku Mohamed = Nama saya Mohamed = اسمي محمد (jeneng = nama، و-ku للمتكلم).
        - Aku saka Kairo = Saya dari Kairo = أنا من القاهرة (saka = dari).
        وتذكّر أن النغوكو يقول aku لا saya.
      en: |
        Good news: if you can build an Indonesian sentence, you can build a Javanese one. Same order, new words:
        - Jenengku Mohamed = Nama saya Mohamed = My name is Mohamed. (jeneng = nama, -ku = my)
        - Aku saka Kairo = Saya dari Kairo = I'm from Cairo. (saka = dari)
        Remember: ngoko says aku, not saya.
    grammar: jv.sentence.basic
    examples:
      - text: Jenengku Mohamed.
        ar_eg: اسمي محمد.
        ar: اسمي محمد.
        en: My name is Mohamed.
      - text: Aku saka Kairo.
        ar_eg: أنا من القاهرة.
        ar: أنا من القاهرة.
        en: I'm from Cairo.
  - title: Aku wong Mesir
    body:
      ar_eg: |
        wong = orang. وزي الإندونيسي، الجنسية = wong + البلد:
        - Aku wong Mesir = Saya orang Mesir = أنا مصري.
        - wong Jawa (جاوي)، wong Indonesia (إندونيسي)، wong Suroboyo (من سورابايا).
        ومفيش «يكون» بين aku وwong Mesir — بالظبط زي «أنا مصري» في العربي. ماتحطش iku في النص!
      ar: |
        wong = orang، والجنسية كالإندونيسية = wong + اسم البلد:
        - Aku wong Mesir = Saya orang Mesir = أنا مصري.
        - wong Jawa (جاوي)، wong Indonesia (إندونيسي)، wong Suroboyo (من سورابايا).
        ولا فعل كون بين aku وwong Mesir، تمامًا كالجملة الاسمية «أنا مصري»؛ فلا تُقحم iku بينهما.
      en: |
        wong = orang. Nationality works as in Indonesian: wong + country.
        - Aku wong Mesir = Saya orang Mesir = I'm Egyptian.
        - wong Jawa (Javanese person), wong Indonesia, wong Suroboyo (a Surabaya local).
        No "to be" between aku and wong Mesir — just like Arabic «أنا مصري». Don't put iku in the middle!
    grammar: jv.sentence.basic
    examples:
      - text: Aku wong Mesir, saka Kairo.
        ar_eg: أنا مصري، من القاهرة.
        ar: أنا مصري، من القاهرة.
        en: I'm Egyptian, from Cairo.
      - text: Bayu wong Suroboyo.
        ar_eg: بايو من سورابايا.
        ar: بايو من أهل سورابايا.
        en: Bayu is from Surabaya.
  - title: Aku sinau basa Jawa
    body:
      ar_eg: |
        فاعل + فعل + مفعول، زي الإندونيسي:
        - Aku sinau basa Jawa = Saya belajar bahasa Jawa = بتعلم جاوي. (sinau = belajar، basa = bahasa)
        والشغلانة من غير «يكون» كمان: Aku guru (أنا مدرس)، Aku mahasiswa (أنا طالب جامعة).
        كتير من أسماء الشغلانات زي الإندونيسي (guru، mahasiswa، dokter، sopir)، وفيه كلمة جاوي حلوة: bakul = بيّاع (pedagang).
      ar: |
        فاعل + فعل + مفعول كالإندونيسية:
        - Aku sinau basa Jawa = Saya belajar bahasa Jawa = أتعلّم الجاوية (sinau = belajar، basa = bahasa).
        والمهنة بلا فعل كون أيضًا: Aku guru (أنا معلم)، Aku mahasiswa (أنا طالب جامعي).
        وكثير من أسماء المهن كالإندونيسية (guru، mahasiswa، dokter، sopir)، ومن الجاوية الخالصة bakul = بائع (pedagang).
      en: |
        Subject + verb + object, as in Indonesian:
        - Aku sinau basa Jawa = Saya belajar bahasa Jawa = I'm learning Javanese. (sinau = belajar, basa = bahasa)
        Jobs need no "to be" either: Aku guru (I'm a teacher), Aku mahasiswa (I'm a university student).
        Many job words are the same as Indonesian (guru, mahasiswa, dokter, sopir), plus a nice Javanese one: bakul = seller (pedagang).
    grammar: jv.sentence.basic
    examples:
      - text: Aku sinau basa Jawa.
        ar_eg: أنا بتعلم جاوي.
        ar: أنا أتعلّم الجاوية.
        en: I'm learning Javanese.
      - text: Aku guru basa Arab.
        ar_eg: أنا مدرس عربي.
        ar: أنا معلم لغة عربية.
        en: I'm an Arabic teacher.
  - title: Omah gedhe
    body:
      ar_eg: |
        الصفة بعد الاسم، زي العربي «بيت كبير» والإندونيسي rumah besar:
        - omah gedhe = rumah besar = بيت كبير. (gedhe = besar)
        - Omahe gedhe = Rumahnya besar = البيت كبير.
        «gedhe omah» غلط.
      ar: |
        الصفة تتبع الموصوف، كالعربية «بيت كبير» والإندونيسية rumah besar:
        - omah gedhe = rumah besar (gedhe = besar)
        - Omahe gedhe = Rumahnya besar = البيت كبير.
        و«gedhe omah» خطأ.
      en: |
        The adjective follows the noun, as in Arabic «بيت كبير» and Indonesian rumah besar:
        - omah gedhe = rumah besar = a big house. (gedhe = besar)
        - Omahe gedhe = Rumahnya besar = The house is big.
        "gedhe omah" is wrong.
    grammar: jv.sentence.basic
    examples:
      - text: Omahe gedhe.
        ar_eg: البيت كبير.
        ar: البيت كبير.
        en: The house is big.
  - title: Iya, ora
    body:
      ar_eg: |
        سؤال أيوه ولا لأ؟ علّي صوتك في آخر الجملة بس:
        - Kowé wong Mesir? — Iya. (أيوه)
        - Kowé wong Suroboyo? — Ora. (لأ)
        iya = ya، وفي الكلام العادي بين الصحاب كمان ho'oh. وora = tidak (لأ / مش).
      ar: |
        السؤال بنعم أو لا بنغمة صاعدة في آخر الجملة:
        - Kowé wong Mesir? — Iya. (نعم)
        - Kowé wong Suroboyo? — Ora. (لا)
        iya = ya، ويقال بين الأصدقاء ho'oh أيضًا، وora = tidak.
      en: |
        Yes / no question? Just raise your voice at the end:
        - Kowé wong Mesir? — Iya. (yes)
        - Kowé wong Suroboyo? — Ora. (no)
        iya = ya (casually also ho'oh); ora = tidak.
    grammar: jv.sentence.basic
    examples:
      - text: Kowé mahasiswa? — Ora, aku guru.
        ar_eg: إنت طالب؟ — لأ، أنا مدرس.
        ar: هل أنت طالب؟ — لا، أنا معلم.
        en: Are you a student? — No, I'm a teacher.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jeneng
        ar_eg: اسم (nama)
        ar: اسم (nama)
        en: name (nama)
      - text: wong
        ar_eg: شخص (orang)
        ar: شخص (orang)
        en: person (orang)
      - text: sinau
        ar_eg: يتعلم / يذاكر (belajar)
        ar: يتعلّم (belajar)
        en: study, learn (belajar)
      - text: basa
        ar_eg: لغة (bahasa)
        ar: لغة (bahasa)
        en: language (bahasa)
      - text: gedhe
        ar_eg: كبير (besar)
        ar: كبير (besar)
        en: big (besar)
      - text: bakul
        ar_eg: بيّاع (pedagang)
        ar: بائع (pedagang)
        en: seller (pedagang)
    words: [jeneng, wong, sinau, basa, gedhe, bakul]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «أنا مصري»؟
      ar: أيّ جملة تعني «أنا مصري»؟
      en: Which sentence means "I'm Egyptian"?
    options: ["Aku wong Mesir.", "Wong Mesir aku saka.", "Aku iku wong Mesir."]
    answer: 0
    explain:
      ar_eg: مفيش «يكون» في الجاوي، وiku معناها «ده» مش «يكون».
      ar: لا فعل كون في الجاوية، وiku اسم إشارة لا فعل كون.
      en: There's no "to be"; iku means "that", not "is".
    words: [wong]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي ترتيب صح لـ «بيت كبير»؟
      ar: أيّ ترتيب صحيح لـ«بيت كبير»؟
      en: Which is the right order for "a big house"?
    options: ["omah gedhe", "gedhe omah"]
    answer: 0
    explain:
      ar_eg: الصفة بعد الاسم، زي rumah besar و«بيت كبير».
      ar: الصفة بعد الموصوف كـ rumah besar و«بيت كبير».
      en: Adjective after noun, like rumah besar.
    words: [omah, gedhe]
  - id: e04
    type: multiple_choice
    question: Kowé wong Suroboyo?
    question_meaning:
      ar_eg: إنت مش من سورابايا، إنت من القاهرة. ترد إزاي؟
      ar: لست من سورابايا بل من القاهرة. بمَ تجيب؟
      en: You're not from Surabaya — you're from Cairo. How do you answer?
    options: ["Iya, aku saka Kairo.", "Ora, aku saka Kairo.", "Iya, aku wong Suroboyo."]
    answer: 1
    explain:
      ar_eg: ora = لأ (tidak)، وsaka Kairo = من القاهرة.
      ar: ora = لا (tidak)، وsaka Kairo = من القاهرة.
      en: ora = no (tidak); saka Kairo = from Cairo.
    words: [ora, saka]
  - id: e05
    type: listen
    text: Aku sinau basa Jawa.
    options: ["Aku guru basa Jawa.", "Aku sinau basa Jawa.", "Aku wong Jawa."]
    answer: 1
    words: [sinau, basa]
  - id: e06
    type: fill_blank
    sentence: Aku ___ Mesir.
    meaning:
      ar_eg: أنا مصري.
      ar: أنا مصري.
      en: I'm Egyptian.
    options: ["saka", "wong", "basa"]
    answers: [wong]
    explain:
      ar_eg: الجنسية = wong + البلد. «Aku saka Mesir» صح كمان بس معناها «أنا من مصر».
      ar: الجنسية = wong + البلد، أما «Aku saka Mesir» فمعناها «أنا من مصر».
      en: Nationality = wong + country. "Aku saka Mesir" is also correct but means "I'm from Egypt".
    words: [wong]
  - id: e07
    type: fill_blank
    sentence: ___ Mohamed.
    meaning:
      ar_eg: اسمي محمد.
      ar: اسمي محمد.
      en: My name is Mohamed.
    options: ["Omahku", "Jenengku", "Jenengmu"]
    answers: [Jenengku]
    words: [jeneng]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا مصري، من القاهرة.
      ar: أنا مصري، من القاهرة.
      en: I'm Egyptian, from Cairo.
    answer: Aku wong Mesir, saka Kairo.
    distractors: [saya, iku]
    words: [wong, saka]
  - id: e09
    type: build_sentence
    source:
      ar_eg: أنا بتعلم جاوي.
      ar: أنا أتعلّم الجاوية.
      en: I'm learning Javanese.
    answer: Aku sinau basa Jawa.
    distractors: [belajar, bahasa]
    explain:
      ar_eg: belajar وbahasa إندونيسي. بالجاوي sinau وbasa.
      ar: belajar وbahasa إندونيسيتان، وبالجاوية sinau وbasa.
      en: belajar and bahasa are Indonesian; Javanese says sinau and basa.
    words: [sinau, basa]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اسمي محمد. أنا من القاهرة.
      ar: اسمي محمد. أنا من القاهرة.
      en: My name is Mohamed. I'm from Cairo.
    answers:
      - Jenengku Mohamed. Aku saka Kairo.
      - Jenengku Mohamed, aku saka Kairo.
      - Jenengku Mohamed. Aku saka Kairo
      - Jenengku Mohamed aku saka Kairo
      - Jenengku Mohamed. Aku soko Kairo.
      - Jenengku Mohamed. Aku seko Kairo.
      - Jenengku Muhammad. Aku saka Kairo.
    explain:
      ar_eg: jeneng + -ku = اسمي، saka = من (بتتنطق وتتكتب في الشات soko).
      ar: jeneng + -ku = اسمي، وsaka = من (وتُنطق وتُكتب في الدردشة soko).
      en: jeneng + -ku = my name; saka = from (said and typed soko).
    words: [jeneng, saka]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا مدرس.
      ar: أنا معلم.
      en: I'm a teacher.
    answers: ["Aku guru.", "Aku guru"]
    words: [guru]
  - id: e12
    type: translate
    direction: from_target
    source_text: Pak Hasan bakul, wong Suroboyo.
    answers_meaning:
      ar_eg: ["الحاج حسن بيّاع، من سورابايا.", "الحاج حسن بياع من سورابايا", "عم حسن بياع، من سورابايا", "الأستاذ حسن بياع من سورابايا"]
      ar: ["السيد حسن بائع من سورابايا.", "حسن بائع من سورابايا", "السيد حسن بائع، من أهل سورابايا"]
      en: ["Pak Hasan is a seller from Surabaya.", "Pak Hasan is a seller, from Surabaya", "Mr Hasan is a vendor from Surabaya", "Pak Hasan is a trader from Surabaya"]
    words: [bakul, wong]
  - id: e13
    type: dictation
    text: Omahe gedhe.
    meaning:
      ar_eg: البيت كبير.
      ar: البيت كبير.
      en: The house is big.
    words: [omah, gedhe]
  - id: e14
    type: speaking
    text: Jenengku Mohamed. Aku wong Mesir.
    meaning:
      ar_eg: اسمي محمد. أنا مصري.
      ar: اسمي محمد. أنا مصري.
      en: My name is Mohamed. I'm Egyptian.
    words: [jeneng, wong]
dialogue:
  title: Kenalan
  lines:
    - speaker: Mas Bayu
      text: Jenengku Bayu. Aku mahasiswa.
      ar_eg: اسمي بايو. أنا طالب.
      ar: اسمي بايو. أنا طالب جامعي.
      en: My name is Bayu. I'm a student.
    - speaker: Mohamed
      text: Jenengku Mohamed. Aku wong Mesir.
      ar_eg: اسمي محمد. أنا مصري.
      ar: اسمي محمد. أنا مصري.
      en: My name is Mohamed. I'm Egyptian.
    - speaker: Mas Bayu
      text: Kowé mahasiswa?
      ar_eg: إنت طالب؟
      ar: هل أنت طالب؟
      en: Are you a student?
    - speaker: Mohamed
      text: Ora, aku guru basa Arab. Aku sinau basa Jawa.
      ar_eg: لأ، أنا مدرس عربي. وبتعلم جاوي.
      ar: لا، أنا معلم لغة عربية، وأتعلّم الجاوية.
      en: No, I'm an Arabic teacher. I'm learning Javanese.
    - speaker: Mas Bayu
      text: Apik! Kowé saka Kairo?
      ar_eg: حلو! إنت من القاهرة؟
      ar: جميل! هل أنت من القاهرة؟
      en: Great! Are you from Cairo?
    - speaker: Mohamed
      text: Iya, saka Kairo.
      ar_eg: أيوه، من القاهرة.
      ar: نعم، من القاهرة.
      en: Yes, from Cairo.
