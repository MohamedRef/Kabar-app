schema: kabar.lesson/v1
id: j1.u02.l02
language: jv
title: Pira? Ngapa?
can_do:
  ar_eg: تسأل بكام وليه وبتعمل إيه، وتفهم الأسئلة السريعة بتاعة الشارع في يوجيا.
  ar: أن تسأل كم ولماذا وماذا يفعل أحدهم، وتفهم أسئلة الشارع السريعة في يوجيا.
  en: Ask how much, why and what someone is doing, and catch quick Jogja street questions.
slides:
  - title: Piye, pira, ngapa
    body:
      ar_eg: |
        - piye = bagaimana (إزاي). عارفها من Piye kabare?
        - pira = berapa (كام / بكام). Regane pira? = بكام؟ (rega = harga، و-ne = -nya)
        - ngapa = kenapa / ngapain (ليه / بتعمل إيه). Kowe ngapa? = مالك؟ / بتعمل إيه؟
        خلي بالك: pira للأرقام والأسعار بس. الاسم بنسأل عنه بـ sapa.
      ar: |
        - piye = bagaimana (كيف)، وتعرفها من Piye kabare?
        - pira = berapa (كم / بكم): Regane pira? = بكم ثمنه؟ (rega = harga، و-ne = -nya)
        - ngapa = kenapa / ngapain (لماذا / ماذا تفعل): Kowe ngapa? = ما بك؟ / ماذا تفعل؟
        وانتبه: pira للعدد والثمن فقط، أما الاسم فيُسأل عنه بـ sapa.
      en: |
        - piye = bagaimana (how). You know it from Piye kabare?
        - pira = berapa (how much / how many). Regane pira? = How much is it? (rega = harga, -ne = -nya)
        - ngapa = kenapa / ngapain (why / what are you doing). Kowe ngapa? = What's up? / What are you doing?
        Careful: pira is only for numbers and prices. A name takes sapa.
    grammar: jv.question.words
    examples:
      - text: Regane pira?
        ar_eg: بكام؟
        ar: بكم ثمنه؟
        en: How much is it?
      - text: Kowe ngapa?
        ar_eg: مالك؟ / بتعمل إيه؟
        ar: ما بك؟ / ماذا تفعل؟
        en: What's up with you? / What are you doing?
  - title: Ki apa? Omahmu endi?
    body:
      ar_eg: |
        في شوارع يوجيا الأسئلة بتتقال قصيرة وسريعة:
        - endi = ngendi (فين) في الكلام السريع: Omahmu endi? = ساكن فين؟ وكمان «أنهي»: sing endi? = أنهي واحد؟
        - ki = iki (ده / دي): Ki apa? = إيه ده؟ (في الشات: Ki opo?)
        - ngapa بتتنطق وبتتكتب ngopo: Ngopo kowe? = مالك؟ / بتعمل إيه؟
        الشكل الكامل (ngendi، iki) صح دايمًا، والقصير هتسمعه طول الوقت.
      ar: |
        تُقال الأسئلة في شوارع يوجيا قصيرة سريعة:
        - endi = ngendi (أين) في الكلام السريع: Omahmu endi? = أين تسكن؟ وتعني أيضًا «أيّ»: sing endi? = أيّها؟
        - ki = iki (هذا / هذه): Ki apa? = ما هذا؟ (وفي الدردشة Ki opo?)
        - ngapa تُنطق وتُكتب ngopo: Ngopo kowe? = ما بك؟ / ماذا تفعل؟
        فالصيغة الكاملة (ngendi، iki) صحيحة دائمًا، والمختصرة ستسمعها طوال الوقت.
      en: |
        On Jogja's streets questions come short and fast:
        - endi = ngendi (where) in quick speech: Omahmu endi? = Where do you live? It also means "which": sing endi? = which one?
        - ki = iki (this): Ki apa? = What's this? (chat: Ki opo?)
        - ngapa is said and typed ngopo: Ngopo kowe? = What's up? / What are you doing?
        The full forms (ngendi, iki) are always right; you'll hear the short ones all the time.
    grammar: jv.question.words
    examples:
      - text: Ki apa, Mas?
        ar_eg: إيه ده يا ماس؟
        ar: ما هذا يا أخي؟
        en: What's this, Mas?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: apa
        ar_eg: إيه
        ar: ماذا
        en: what
      - text: sapa
        ar_eg: مين
        ar: مَن
        en: who
      - text: ngendi
        ar_eg: فين
        ar: أين
        en: where
      - text: kapan
        ar_eg: إمتى
        ar: متى
        en: when
      - text: pira
        ar_eg: كام / بكام
        ar: كم / بكم
        en: how much / how many
      - text: ngapa
        ar_eg: ليه
        ar: لماذا
        en: why
    words: [apa, sapa, ngendi, kapan, pira, ngapa]
  - id: e02
    type: match_pairs
    pairs:
      - text: ngapa
        ar_eg: kenapa (ليه)
        ar: kenapa (لماذا)
        en: kenapa (why)
      - text: endi
        ar_eg: di mana (فين، = ngendi)
        ar: di mana (أين، = ngendi)
        en: di mana (where, = ngendi)
      - text: ki
        ar_eg: ini (ده، = iki)
        ar: ini (هذا، = iki)
        en: ini (this, = iki)
      - text: piye
        ar_eg: bagaimana (إزاي)
        ar: bagaimana (كيف)
        en: bagaimana (how)
      - text: rega
        ar_eg: harga (سعر)
        ar: harga (سعر)
        en: harga (price)
      - text: pira
        ar_eg: berapa (كام)
        ar: berapa (كم)
        en: berapa (how much)
    words: [ngapa, endi, ki, piye, rega, pira]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: في الشات حد كتب «piro?». يقصد إيه؟
      ar: كتب أحدهم في الدردشة «piro?». ماذا يقصد؟
      en: Someone types "piro?" in a chat. What do they mean?
    options: [pira, piye, apa]
    answer: 0
    explain:
      ar_eg: الـ a الأخيرة بتتنطق وتتكتب في الشات o، فـ piro = pira = بكام / كام.
      ar: تُنطق a الأخيرة وتُكتب في الدردشة o، فـ piro = pira.
      en: Final a is said and typed o, so piro = pira (how much).
    words: [pira]
  - id: e04
    type: fill_blank
    sentence: Regane ___?
    meaning:
      ar_eg: بكام؟
      ar: بكم ثمنه؟
      en: How much is it?
    options: [pira, kapan, sapa]
    answers: [pira]
    words: [rega, pira]
  - id: e05
    type: listen
    text: Omahmu endi, cah?
    options: ['Omahmu endi, cah?', 'Ngapa kowe, cah?', 'Piye kabare, cah?']
    answer: 0
    meaning:
      ar_eg: ساكن فين يا جدع؟
      ar: أين تسكن يا صاحبي؟
      en: Where do you live, mate?
    words: [endi, ngapa, piye, kabare]
  - id: e06
    type: translate
    direction: from_target
    source_text: Ngapa kowe?
    answers_meaning:
      ar_eg: [مالك؟, بتعمل إيه؟, إنت مالك؟, إنت بتعمل إيه؟, مالك, بتعمل إيه]
      ar: [ما بك؟, ماذا تفعل؟, ما بالك؟]
      en: ['What''s up with you?', 'What are you doing?', 'What''s wrong?', 'What''s up?', 'What are you up to?']
    explain:
      ar_eg: ngapa = ليه / بتعمل إيه، وفي الشات ngopo. Ngapa kowe? = مالك؟
      ar: ngapa = لماذا / ماذا تفعل، وفي الدردشة ngopo. Ngapa kowe? = ما بك؟
      en: ngapa = why / what doing, typed ngopo in chats. Ngapa kowe? = What's up?
    words: [ngapa, kowe]
  - id: e07
    type: dictation
    text: Ki apa, Mas?
    meaning:
      ar_eg: إيه ده يا ماس؟
      ar: ما هذا يا أخي؟
      en: What's this, Mas?
    words: [ki, apa]
  - id: e08
    type: multiple_choice
    question: Omahmu endi?
    question_meaning:
      ar_eg: حد في Malioboro سألك كده. يقصد إيه؟
      ar: سألك أحدهم هذا في Malioboro. ماذا يقصد؟
      en: Someone on Malioboro asks you this. What do they mean?
    options: ['ساكن فين؟', 'بيتك بكام؟', 'مين في البيت؟']
    answer: 0
    explain:
      ar_eg: endi = ngendi = فين، في الكلام السريع. Omahmu endi? = بيتك فين؟ يعني ساكن فين.
      ar: endi = ngendi = أين في الكلام السريع، فـ Omahmu endi? = أين بيتك؟ أي أين تسكن.
      en: endi = ngendi = where, in quick speech. Omahmu endi? = Where's your house, i.e. where do you live?
    words: [endi, omah]
  - id: e09
    type: listen
    text: Regane pira, Mas?
    options: ['Regane pira, Mas?', 'Jenenge sapa, Mas?', 'Ki apa, Mas?']
    answer: 0
    meaning:
      ar_eg: بكام يا معلم؟
      ar: بكم السعر يا أخي؟
      en: How much is it, Mas?
    words: [rega, pira, ki]
dialogue:
  lines:
    - speaker: Mas Heru
      text: Mohamed, ngapa kowe?
      ar_eg: محمد، بتعمل إيه؟
      ar: محمد، ماذا تفعل؟
      en: Mohamed, what are you doing?
    - speaker: Mohamed
      text: Aku mangan, Mas. Piye kabare?
      ar_eg: باكل يا ماس. إزيك؟
      ar: آكل يا ماس. كيف حالك؟
      en: I'm eating, Mas. How are you?
    - speaker: Mas Heru
      text: Apik! Ki apa? Regane pira?
      ar_eg: كويس! إيه دا؟ بكام؟
      ar: بخير! ما هذا؟ كم سعره؟
      en: Good! What's that? How much was it?
    - speaker: Mohamed
      text: Sate. Murah, Mas!
      ar_eg: ساتيه. رخيص يا ماس!
      ar: ساتيه. رخيص يا ماس!
      en: Satay. It's cheap, Mas!
new_words:
  - word: pira
    pos: question word
    ar_eg: كام / بكام (= berapa؛ في الشات piro)
    ar: كم / بكم (= berapa؛ وفي الدردشة piro)
    en: how much, how many (= berapa; chat piro)
  - word: ngapa
    pos: question word
    ar_eg: ليه / بتعمل إيه (= kenapa / ngapain)
    ar: لماذا / ماذا تفعل (= kenapa / ngapain)
    en: why, what are you doing (= kenapa / ngapain)
  - word: endi
    pos: question word
    ar_eg: فين، أنهي (= ngendi في الكلام السريع)
    ar: أين، أيّ (= ngendi في الكلام السريع)
    en: where, which (= ngendi in quick speech)
  - word: ki
    pos: pronoun
    ar_eg: ده، دي (= iki، كلام الشارع)
    ar: هذا، هذه (= iki، عامية)
    en: this (= iki, street speech)
  - word: rega
    pos: noun
    ar_eg: سعر (= harga)
    ar: ثمن، سعر (= harga)
    en: price (= harga)
