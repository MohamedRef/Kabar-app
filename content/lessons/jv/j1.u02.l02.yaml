schema: kabar.lesson/v1
id: j1.u02.l02
language: jv
title: Pira? Ngapa?
can_do:
  ar_eg: تسأل بكام وليه وبتعمل إيه، وكمان على طريقة سورابايا.
  ar: أن تسأل كم ولماذا وماذا يفعل أحدهم، وعلى طريقة سورابايا أيضًا.
  en: Ask how much, why and what someone is doing, also the Surabaya way.
slides:
  - title: Piye, pira, ngapa
    body:
      ar_eg: |
        - piye = bagaimana (إزاي). عارفها من Piye kabare?
        - pira = berapa (كام / بكام). Regane pira? = بكام؟ (rega = harga، و-ne = -nya)
        - ngapa = kenapa / ngapain (ليه / بتعمل إيه). Kowe ngapa? = مالك؟ / بتعمل إيه؟
        خلي بالك: pira للأرقام والأسعار بس. الاسم بنسأل عنه بـ sapa.
      ar: |
        - piye = bagaimana (كيف)، وتعرفها من Piye kabare?
        - pira = berapa (كم / بكم): Regane pira? = بكم ثمنه؟ (rega = harga، و-ne = -nya)
        - ngapa = kenapa / ngapain (لماذا / ماذا تفعل): Kowe ngapa? = ما بك؟ / ماذا تفعل؟
        وانتبه: pira للعدد والثمن فقط، أما الاسم فيُسأل عنه بـ sapa.
      en: |
        - piye = bagaimana (how). You know it from Piye kabare?
        - pira = berapa (how much / how many). Regane pira? = How much is it? (rega = harga, -ne = -nya)
        - ngapa = kenapa / ngapain (why / what are you doing). Kowe ngapa? = What's up? / What are you doing?
        Careful: pira is only for numbers and prices. A name takes sapa.
    grammar: jv.question.words
    examples:
      - text: Regane pira?
        ar_eg: بكام؟
        ar: بكم ثمنه؟
        en: How much is it?
      - text: Kowe ngapa?
        ar_eg: مالك؟ / بتعمل إيه؟
        ar: ما بك؟ / ماذا تفعل؟
        en: What's up with you? / What are you doing?
  - title: Yok opo, lapo (Arek)
    body:
      ar_eg: |
        في سورابايا (لهجة **Arek**) هتسمع:
        - yok opo (أو yaopo) = piye (إزاي): Yok opo kabare? = إزيك؟
        - lapo = ngapa (ليه / بتعمل إيه): Lapo koen? = مالك؟ / بتعمل إيه؟
        - ndi = endi (فين).
        افهمهم، بس مع ناس متعرفهمش استخدم الأدوات العادية.
      ar: |
        في سورابايا (لهجة **Arek**) ستسمع:
        - yok opo (أو yaopo) = piye (كيف): Yok opo kabare?
        - lapo = ngapa (لماذا / ماذا تفعل): Lapo koen? = ما بك؟
        - ndi = endi (أين).
        افهمها، واستعمل الأدوات القياسية مع من لا تعرفهم.
      en: |
        In Surabaya (**Arek**) you'll hear:
        - yok opo (or yaopo) = piye (how): Yok opo kabare?
        - lapo = ngapa (why / what doing): Lapo koen? = What's up with you?
        - ndi = endi (where).
        Understand them; with strangers, stick to the standard words.
    grammar: jv.question.words
    examples:
      - text: Lapo koen?
        ar_eg: مالك؟ / بتعمل إيه؟ (Arek)
        ar: ما بك؟ / ماذا تفعل؟ (Arek)
        en: What's up with you? (Arek)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: apa
        ar_eg: إيه
        ar: ماذا
        en: what
      - text: sapa
        ar_eg: مين
        ar: مَن
        en: who
      - text: ngendi
        ar_eg: فين
        ar: أين
        en: where
      - text: kapan
        ar_eg: إمتى
        ar: متى
        en: when
      - text: pira
        ar_eg: كام / بكام
        ar: كم / بكم
        en: how much / how many
      - text: ngapa
        ar_eg: ليه
        ar: لماذا
        en: why
    words: [apa, sapa, ngendi, kapan, pira, ngapa]
  - id: e02
    type: match_pairs
    pairs:
      - text: sapa
        ar_eg: siapa (مين)
        ar: siapa (مَن)
        en: siapa
      - text: ngendi
        ar_eg: mana (فين)
        ar: mana (أين)
        en: mana
      - text: piye
        ar_eg: bagaimana (إزاي)
        ar: bagaimana (كيف)
        en: bagaimana
      - text: pira
        ar_eg: berapa (كام)
        ar: berapa (كم)
        en: berapa
    explain:
      ar_eg: وصّل كل كلمة جاوي بتوأمها الإندونيسي.
      ar: صِل كل كلمة جاوية بنظيرها الإندونيسي.
      en: Match each Javanese word with its Indonesian twin.
    words: [sapa, ngendi, piye, pira]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: في الشات حد كتب «piro?». يقصد إيه؟
      ar: كتب أحدهم في الدردشة «piro?». ماذا يقصد؟
      en: Someone types "piro?" in a chat. What do they mean?
    options: [pira, piye, apa]
    answer: 0
    explain:
      ar_eg: الـ a الأخيرة بتتنطق وتتكتب في الشات o، فـ piro = pira = بكام / كام.
      ar: تُنطق a الأخيرة وتُكتب في الدردشة o، فـ piro = pira.
      en: Final a is said and typed o, so piro = pira (how much).
    words: [pira]
  - id: e04
    type: fill_blank
    sentence: Regane ___?
    meaning:
      ar_eg: بكام؟
      ar: بكم ثمنه؟
      en: How much is it?
    options: [pira, kapan, sapa]
    answers: [pira]
    words: [rega, pira]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: بكام؟
      ar: بكم؟
      en: How much is it?
    answers: ["Regane pira?", Regane pira, "Regane piro?", Regane piro]
    words: [rega, pira]
  - id: e06
    type: translate
    direction: from_target
    source_text: Lapo koen?
    answers_meaning:
      ar_eg: [مالك؟, بتعمل إيه؟, إنت مالك؟, إنت بتعمل إيه؟, مالك, بتعمل إيه]
      ar: [ما بك؟, ماذا تفعل؟, ما بالك؟]
      en: ['What''s up with you?', 'What are you doing?', 'What''s wrong?', 'What''s up?', 'What are you up to?']
    explain:
      ar_eg: lapo = ngapa، وkoen = kowe — الاتنين Arek بتوع سورابايا.
      ar: lapo = ngapa، وkoen = kowe، وكلاهما من لهجة Arek.
      en: lapo = ngapa and koen = kowe — both Surabaya Arek.
    words: [lapo, koen]
  - id: e07
    type: dictation
    text: Kowe ngapa?
    meaning:
      ar_eg: مالك؟ / بتعمل إيه؟
      ar: ما بك؟ / ماذا تفعل؟
      en: What's up? / What are you doing?
    words: [ngapa]
dialogue:
  lines:
    - speaker: Cak Heru
      text: Mohamed, lapo koen?
      ar_eg: محمد، بتعمل إيه؟
      ar: محمد، ماذا تفعل؟
      en: Mohamed, what are you doing?
    - speaker: Mohamed
      text: Aku mangan, Cak. Yok opo kabare?
      ar_eg: باكل يا كاك. إزيك؟
      ar: آكل يا كاك. كيف حالك؟
      en: I'm eating, Cak. How are you?
    - speaker: Cak Heru
      text: Apik! Iku apa? Regane pira?
      ar_eg: كويس! إيه دا؟ بكام؟
      ar: بخير! ما هذا؟ كم سعره؟
      en: Good! What's that? How much was it?
    - speaker: Mohamed
      text: Sate. Murah, Cak!
      ar_eg: ساتيه. رخيص يا كاك!
      ar: ساتيه. رخيص يا كاك!
      en: Satay. It's cheap, Cak!
new_words:
  - word: pira
    pos: question word
    ar_eg: كام / بكام (= berapa؛ في الشات piro)
    ar: كم / بكم (= berapa؛ وفي الدردشة piro)
    en: how much, how many (= berapa; chat piro)
  - word: ngapa
    pos: question word
    ar_eg: ليه / بتعمل إيه (= kenapa / ngapain)
    ar: لماذا / ماذا تفعل (= kenapa / ngapain)
    en: why, what are you doing (= kenapa / ngapain)
  - word: yok opo
    pos: question word
    ar_eg: إزاي (Arek = piye)
    ar: كيف (Arek = piye)
    en: how (Arek = piye)
  - word: lapo
    pos: question word
    ar_eg: ليه / بتعمل إيه (Arek = ngapa)
    ar: لماذا / ماذا تفعل (Arek = ngapa)
    en: why, what doing (Arek = ngapa)
  - word: rega
    pos: noun
    ar_eg: سعر (= harga)
    ar: ثمن، سعر (= harga)
    en: price (= harga)
review:
  status: draft
  verified: false
