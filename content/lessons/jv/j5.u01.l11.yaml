schema: kabar.lesson/v1
id: j5.u01.l11
language: jv
title: Brem Madiun
can_do:
  ar_eg: تقرا مقالة قصيرة عن أكلة مشهورة وتعرف معمولة من إيه وفيها إيه.
  ar: أن تقرأ مقالة قصيرة عن طعام مشهور وتعرف مادته ومحتواه.
  en: Read a short article about a famous food and find what it's made of and what's inside.
slides:
  - title: Artikel panganan
    body:
      ar_eg: |
        ماديون مش بس بلد البيتشيل. أشهر هدية بيرجع بيها الناس منها هي الـbrem، ودي مقالة صغيرة عنه. نفس الهيكل: iku وkang وsawijining.
        فاكر oleh-oleh من J3؟ هدية السفر. كلمات جديدة: ketan = رز لزج، tape = أكلة مخمّرة، وtape ketan = رز لزج متخمّر. isi = محتوى أو حشو، وisine = محتواه.
      ar: |
        ماديون ليست بلد البيتشيل فقط؛ فأشهر هدية يعود بها الزوار منها هي الـbrem، وهذه مقالة صغيرة عنه. الهيكل نفسه: iku وkang وsawijining.
        تذكر oleh-oleh من J3: هدية السفر. كلمات جديدة: ketan = أرز دبق، وtape = طعام مخمَّر، وtape ketan = أرز دبق مخمَّر. وisi = محتوى أو حشوة، وisine = محتواه.
      en: |
        Madiun isn't only pecel country: the gift everyone takes home from it is brem, and here is a small article about it. Same skeleton: iku, kang, sawijining.
        Remember oleh-oleh from J3, a gift brought back from a trip. New words: ketan = sticky rice, tape = fermented food, so tape ketan = fermented sticky rice. isi = contents, filling; isine = its contents.
    grammar: jv.reading.written-style
    examples:
      - text: Brem iku panganan kang misuwur saka Madiun.
        ar_eg: البريم أكلة مشهورة من ماديون.
        ar: البريم طعام مشهور من ماديون.
        en: Brem is a famous food from Madiun.
      - text: Brem iku sawijining oleh-oleh kang bahane tape ketan.
        ar_eg: البريم هدية سفر معمولة من رز لزج متخمّر.
        ar: البريم هدية سفر مادتها الأرز الدبق المخمَّر.
        en: Brem is a souvenir snack made from fermented sticky rice.
      - text: Kothak iki isine brem sepuluh.
        ar_eg: العلبة دي فيها عشر حتت بريم.
        ar: في هذه العلبة عشر قطع من البريم.
        en: This box holds ten pieces of brem.
