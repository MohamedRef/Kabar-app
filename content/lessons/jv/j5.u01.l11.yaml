dialogue:
  title: Ing toko oleh-oleh
  lines:
    - speaker: Mohamed
      text: Mbak, brem iki bahane apa?
      ar_eg: يا آيو، البريم ده معمول من إيه؟
      ar: يا آيو، مِمَّ يُصنع هذا البريم؟
      en: Ayu, what's this brem made of?
    - speaker: Mbak Ayu
      text: Tape ketan, kaya ing artikel.
      ar_eg: رز لزج متخمّر، زي ما في المقالة.
      ar: أرز دبق مخمَّر، كما في المقالة.
      en: Fermented sticky rice, like in the article.
    - speaker: Mohamed
      text: Lho, kok krasa adem ing cangkem?
      ar_eg: الله! إزاي حاسس بيه ساقع في بُقّي؟
      ar: عجبًا! لماذا أشعر به باردًا في فمي؟
      en: Huh, why does it feel cool in my mouth?
    - speaker: Mbak Ayu
      text: Brem pancen ngono. Legi lan kecut, ta?
      ar_eg: البريم كده فعلًا. مسكّر وحامض، صح؟
      ar: هكذا البريم فعلًا. حلو وحامض، أليس كذلك؟
      en: That's brem for you. Sweet and sour, right?
    - speaker: Mohamed
      text: Enak! Aku tuku sekothak kanggo oleh-oleh.
      ar_eg: حلو! هشتري علبة هدية للناس.
      ar: لذيذ! سأشتري علبة هديةً للأهل.
      en: Tasty! I'll buy a box to take home as a gift.
