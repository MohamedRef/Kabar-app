dialogue:
  lines:
    - speaker: Bu Rahayu
      text: Mas, arep nang ngendi? Mendhung lho.
      ar_eg: يا ماس، رايح فين؟ الدنيا مغيّمة على فكرة.
      ar: إلى أين يا أخي؟ السماء غائمة.
      en: Where are you off to, Mas? It's cloudy, you know.
    - speaker: Mohamed
      text: Nang alun-alun, Bu. Srengengene isih ana kok.
      ar_eg: على الميدان يا طنط. الشمس لسه طالعة.
      ar: إلى الساحة يا سيّدتي. الشمس ما زالت ظاهرة.
      en: To the town square, Bu. The sun's still out.
    - speaker: Bu Rahayu
      text: Angine banter. Sore iki mesthi udan. Iki payunge.
      ar_eg: الهوا جامد. العصر ده أكيد هتمطر. خد الشمسية.
      ar: الريح قويّة. ستمطر حتمًا هذا المساء. هاك المظلّة.
      en: The wind's strong. It'll rain this afternoon for sure. Here's an umbrella.
    - speaker: Mohamed
      text: Matur nuwun, Bu. Wingi aku teles kabeh!
      ar_eg: شكرًا يا طنط. امبارح اتبلّيت خالص!
      ar: شكرًا يا سيّدتي. تبلّلت تمامًا أمس!
      en: Thanks, Bu. Yesterday I got soaked!
    - speaker: Bu Rahayu
      text: Ojo mulih peteng, ya. Dalane kadang banjir.
      ar_eg: ما ترجعش بالليل في الضلمة. الشارع ساعات بيغرق.
      ar: لا تعد في الظلام. الطريق يغرق أحيانًا.
      en: Don't come back after dark. The road sometimes floods.
