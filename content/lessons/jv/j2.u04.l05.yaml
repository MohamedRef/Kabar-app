schema: kabar.lesson/v1
id: j2.u04.l05
language: jv
title: Mendhung lan payung
can_do:
  ar_eg: 'تتكلم عن الجو: مغيّمة وهوا وفيضان، تاخد الشمسية، وتروّح قبل الضلمة.'
  ar: 'أن تتحدّث عن الطقس: غائم ورياح وفيضان، وتأخذ المظلّة، وتعود قبل الظلام.'
  en: 'Talk about the weather: cloudy, windy, flooded, take an umbrella and get home before dark.'
slides:
  - title: Hawane piye?
    body:
      ar_eg: |
        mendhung = مغيّمة (قبل المطر)، angin = هوا، ريح، srengenge = شمس.
        banjir = فيضان، الشوارع تغرق. teles = مبلول: Klambiku teles.
        payung = شمسية، مظلة: Payungmu ngendi?
        peteng = ضلمة: Wis peteng, ayo mulih.
        gunung = جبل: Gunung Lawu قريب من ماديون.
      ar: |
        mendhung = غائم (قبل المطر)، angin = ريح، srengenge = شمس.
        banjir = فيضان. teles = مبلّل: Klambiku teles.
        payung = مظلّة: Payungmu ngendi?
        peteng = مظلم: Wis peteng, ayo mulih.
        gunung = جبل: جبل Lawu قريب من ماديون.
      en: |
        mendhung = cloudy, overcast, angin = wind, srengenge = sun.
        banjir = flood. teles = wet: Klambiku teles.
        payung = umbrella: Payungmu ngendi?
        peteng = dark: Wis peteng, ayo mulih.
        gunung = mountain: Mount Lawu is near Madiun.
    examples:
      - text: Mendhung. Payungmu ngendi?
        ar_eg: الدنيا مغيّمة. فين الشمسية بتاعتك؟
        ar: السماء غائمة. أين مظلّتك؟
        en: It's cloudy. Where's your umbrella?
      - text: Klambiku teles kabeh.
        ar_eg: هدومي مبلولة خالص.
        ar: ثيابي مبلّلة كلّها.
        en: My clothes are soaked.
      - text: Wis peteng, ayo mulih.
        ar_eg: الدنيا ضلمت، يلا نروّح.
        ar: حلّ الظلام، هيّا نعود.
        en: It's dark now, let's go home.
