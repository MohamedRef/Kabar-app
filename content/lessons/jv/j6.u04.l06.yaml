schema: kabar.lesson/v1
id: j6.u04.l06
language: jv
title: Mulang aksara
can_do:
  ar_eg: 'تتكلم عن مدرسة بتعلّم الحروف الجاوية: السبورة والطباشير، وشعر التلاميذ على المسرح.'
  ar: 'أن تتحدث عن مدرسة تعلّم الحروف الجاوية: السبورة والطباشير وشعر التلاميذ على المسرح.'
  en: 'Talk about a school teaching Javanese script: blackboard and chalk, and pupils reciting poems on stage.'
slides:
  - title: Ing sekolah
    body:
      ar_eg: |
        mulang = يدرّس، pindhah = ينقل (من بيت أو مدرسة لغيرها).
        kapur = طباشير، papan tulis = سبورة.
        geguritan = شعر جاوي حديث (حر)، sliramu = «إنت» في الشعر، كلمة رقيقة وأدبية.
        pagelaran = عرض أو حفلة كبيرة، pentas = يطلع على المسرح ويعرض.
      ar: |
        mulang = يدرّس، pindhah = ينتقل (من بيت أو مدرسة إلى أخرى).
        kapur = طباشير، papan tulis = سبورة.
        geguritan = شعر جاوي حديث حرّ، sliramu = «أنت» في الشعر، لفظ أدبي رقيق.
        pagelaran = عرض أو حفل كبير، pentas = يعتلي المسرح ويؤدي.
      en: |
        mulang = teach, pindhah = move (house or school).
        kapur = chalk, papan tulis = blackboard.
        geguritan = modern free-verse Javanese poem, sliramu = "you" in poetry, a tender literary word.
        pagelaran = performance, show; pentas = perform on stage.
    examples:
      - text: Bu Guru mulang aksara Jawa nganggo kapur lan papan tulis.
        ar_eg: المدرسة بتعلّم الحروف الجاوية بالطباشير والسبورة.
        ar: تعلّم المعلمة الحروف الجاوية بالطباشير والسبورة.
        en: The teacher teaches Javanese script with chalk and a blackboard.
      - text: Murid-murid maca geguritan ing pagelaran sekolah.
        ar_eg: التلاميذ بيقروا شعر في حفلة المدرسة.
        ar: يلقي التلاميذ الشعر في حفل المدرسة.
        en: The pupils recite poems at the school show.
      - text: '''Sliramu'' iku tembung kanggo ''kowe'' ing geguritan.'
        ar_eg: sliramu كلمة معناها «إنت» في الشعر.
        ar: sliramu كلمة بمعنى «أنت» في الشعر.
        en: '''Sliramu'' is the word for ''you'' in poetry.'
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mulang
        ar_eg: يدرّس
        ar: يدرّس
        en: teach
      - text: pindhah
        ar_eg: ينقل
        ar: ينتقل
        en: move (house)
      - text: kapur
        ar_eg: طباشير
        ar: طباشير
        en: chalk
      - text: papan tulis
        ar_eg: سبورة
        ar: سبورة
        en: blackboard
    words: [mulang, pindhah, kapur, papan tulis]
  - id: e02
    type: match_pairs
    pairs:
      - text: geguritan
        ar_eg: شعر حديث
        ar: شعر حديث
        en: modern poem
      - text: pagelaran
        ar_eg: عرض، حفلة
        ar: عرض
        en: performance
      - text: sliramu
        ar_eg: إنت (في الشعر)
        ar: أنت (في الشعر)
        en: you (poetic)
      - text: pentas
        ar_eg: يعرض على المسرح
        ar: يؤدّي على المسرح
        en: perform on stage
    words: [geguritan, pagelaran, sliramu, pentas]
  - id: e03
    type: listen
    text: Bu Guru nulis aksara ing papan tulis nganggo kapur.
    question:
      ar_eg: المدرسة بتعمل إيه؟
      ar: ماذا تفعل المعلمة؟
      en: What is the teacher doing?
    options: [المدرسة بتكتب على السبورة بالطباشير, المدرسة بتقرا شعر, التلاميذ بيلعبوا]
    answer: 0
    meaning:
      ar_eg: المدرسة بتكتب الحروف على السبورة بالطباشير.
      ar: تكتب المعلمة الحروف على السبورة بالطباشير.
      en: The teacher writes letters on the blackboard with chalk.
    words: [papan tulis, kapur]
  - id: e04
    type: fill_blank
    sentence: Pak Slamet wis suwe ___ aksara Jawa marang bocah-bocah.
    meaning:
      ar_eg: عم سلامت بقاله كتير ___ الحروف الجاوية للعيال.
      ar: منذ زمن و___ السيد سلامت الأطفال الحروف الجاوية.
      en: Pak Slamet has long ___ Javanese script to children.
    options: [mulang, pindhah, pentas]
    answers: [mulang]
    words: [mulang, pindhah, pentas]
    explain:
      ar_eg: mulang = يعلّم. pindhah = نقل وpentas = عرض على المسرح.
      ar: mulang تعني يعلّم. أما pindhah فانتقل وpentas عرض مسرحي.
      en: mulang means teach. pindhah is "move house" and pentas is "perform".
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الشعر الجاوي الحديث الحر اسمه …
      ar: الشعر الجاوي الحديث الحرّ يسمّى …
      en: A modern free-verse Javanese poem is a …
    options: [kapur, geguritan, pindhah]
    answer: 1
    explain:
      ar_eg: geguritan = شعر حديث. macapat هو الشعر القديم.
      ar: geguritan = شعر حديث، أما macapat فشعر قديم.
      en: geguritan = modern poem; macapat is the classical kind.
    words: [kapur, geguritan, pindhah]
  - id: e06
    type: fill_blank
    sentence: Kulawargane ___ saka Solo menyang Yogya.
    meaning:
      ar_eg: عيلته ___ من سولو ليوجيا.
      ar: ___ عائلته من سولو إلى يوغيا.
      en: His family ___ from Solo to Yogya.
    options: [pindhah, mulang, sliramu]
    answers: [pindhah]
    words: [pindhah, mulang, sliramu]
    explain:
      ar_eg: pindhah saka … menyang = نقل من … لـ. mulang = يعلّم وsliramu = حضرتك.
      ar: pindhah saka … menyang تعني انتقل من … إلى. أما mulang فيعلّم وsliramu أنت.
      en: pindhah saka … menyang is "moved from … to". mulang is "teach" and sliramu is "you".
  - id: e07
    type: multiple_choice
    question: Ing geguritan, tembung '___' tegese 'kowe'.
    options: [pagelaran, papan tulis, sliramu]
    answer: 2
    explain:
      ar_eg: sliramu = «إنت» في الشعر.
      ar: sliramu = «أنت» في الشعر.
      en: sliramu = 'you' in poetry.
    words: [pagelaran, papan tulis, sliramu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: التلاميذ هيعرضوا على المسرح الليلة.
      ar: يؤدّي التلاميذ على المسرح الليلة.
      en: The pupils perform on stage tonight.
    answer: Murid-murid pentas bengi iki.
    distractors: [kapur, mulang]
    words: [pentas]
    explain:
      ar_eg: pentas = يعرضوا على المسرح. kapur = طباشير وmulang = يعلّم، ومش في المعنى.
      ar: pentas تعني يؤدّون عرضًا. أما kapur (طباشير) وmulang (يعلّم) فليستا في المعنى.
      en: pentas is "perform on stage". kapur (chalk) and mulang (teach) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Pagelaran wayang iki ing alun-alun.
    answers_meaning:
      ar_eg: [عرض الوايانج ده في الميدان, حفلة الوايانج في الميدان]
      ar: [عرض الوايانغ هذا في الساحة, يُقام عرض الوايانغ في الساحة]
      en: [This wayang performance is in the town square, The wayang show is on the square]
    words: [pagelaran]
  - id: e10
    type: speaking
    text: Aku maca geguritan ing pentas.
    meaning:
      ar_eg: أنا بقرا شعر على المسرح.
      ar: ألقي الشعر على المسرح.
      en: I recite a poem on stage.
    words: [geguritan, pentas]
dialogue:
  lines:
    - speaker: Pak Slamet
      text: Mas, anak kula mulang aksara Jawa wonten SD.
      ar_eg: يا محمد، بنتي بتدرّس الحروف الجاوية في ابتدائي.
      ar: ابنتي تدرّس الحروف الجاوية في مدرسة ابتدائية.
      en: My daughter teaches Javanese script at a primary school.
    - speaker: Mohamed
      text: Sae sanget! Menapa taksih mawi kapur lan papan tulis?
      ar_eg: حلو أوي! لسه بالطباشير والسبورة؟
      ar: رائع! أما زالت بالطباشير والسبورة؟
      en: Wonderful! Still with chalk and a blackboard?
    - speaker: Pak Slamet
      text: Inggih. Malem Minggu wonten pagelaran ing sekolahipun.
      ar_eg: أيوه. ليلة الحد فيه حفلة في مدرستها.
      ar: نعم. مساء السبت حفل في مدرستها.
      en: Yes. On Saturday night there's a show at her school.
    - speaker: Mohamed
      text: Lare-lare badhe pentas menapa?
      ar_eg: العيال هيعرضوا إيه؟
      ar: ماذا سيقدّم الأطفال؟
      en: What will the children perform?
    - speaker: Pak Slamet
      text: Maos geguritan. Wonten tembung 'sliramu' ingkang endah sanget.
      ar_eg: هيقروا شعر. فيه كلمة sliramu حلوة أوي.
      ar: سيلقون الشعر، وفيه كلمة sliramu جميلة جدًا.
      en: Reciting poems. There's a lovely 'sliramu' in one.
    - speaker: Mohamed
      text: Kula badhe dhateng!
      ar_eg: هاجي!
      ar: سآتي!
      en: I'll come!
