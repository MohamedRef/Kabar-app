schema: kabar.lesson/v1
id: j5.u01.l10
language: jv
title: Kairo ing Wikipedia
can_do:
  ar_eg: تسمع مقالة ويكيبيديا جاوية عن القاهرة وتفهمها من غير ما تشوفها.
  ar: أن تستمع إلى مقالة ويكيبيديا جاوية عن القاهرة وتفهمها دون أن تراها.
  en: Follow a Javanese Wikipedia article about Cairo by ear.
exercises:
  - id: e01
    type: listen
    text: Kairo iku ibukutha Mesir lan kutha kang paling gedhe ing Mesir.
    question:
      ar_eg: دي مقالة عن مدينتك! المقالة بتقول إن القاهرة إيه؟
      ar: هذه مقالة عن مدينتك! ماذا تقول المقالة عن القاهرة؟
      en: This article is about your city! What does it say Cairo is?
    options: [ibukutha Mesir, pulo ing Mesir, provinsi ing Mesir]
    answer: 0
    meaning:
      ar_eg: القاهرة هي عاصمة مصر وأكبر مدينة في مصر.
      ar: القاهرة عاصمة مصر وأكبر مدنها.
      en: Cairo is the capital of Egypt and the biggest city in Egypt.
    explain:
      ar_eg: kang paling gedhe = اللي هي الأكبر (yang paling besar).
      ar: kang paling gedhe = الأكبر (yang paling besar).
      en: kang paling gedhe = the biggest (yang paling besar).
    words: [ibukutha]
  - id: e02
    type: listen
    text: Kutha iki ana ing pinggir kali Nil.
    question:
      ar_eg: القاهرة فين؟
      ar: أين تقع القاهرة؟
      en: Where is Cairo?
    options: [ing pinggir segara, ing pinggir kali Nil, ing pesisir kidul]
    answer: 1
    meaning:
      ar_eg: المدينة دي على ضفة نهر النيل.
      ar: تقع هذه المدينة على ضفة نهر النيل.
      en: This city lies on the bank of the Nile.
    explain:
      ar_eg: kali = نهر، زي kali في الإندونيسي (sungai). pinggir = جنب / ضفة.
      ar: kali = نهر، كـ kali في الإندونيسية (sungai)، وpinggir = حافة / ضفة.
      en: kali = river, as in Indonesian kali (sungai); pinggir = edge, bank.
    words: [kali]
  - id: e03
    type: listen
    text: Ing Kairo ana masjid kang lawas banget, yaiku Masjid Al-Azhar.
    question:
      ar_eg: المقالة ذكرت أنهي مكان؟
      ar: أي مكان تذكره المقالة؟
      en: Which place does the article name?
    options: [Benteng Pendem, Menara Kudus, Masjid Al-Azhar]
    answer: 2
    meaning:
      ar_eg: في القاهرة جامع قديم جدًا، هو الجامع الأزهر.
      ar: في القاهرة مسجد قديم جدًا، هو الجامع الأزهر.
      en: In Cairo there is a very old mosque, namely Al-Azhar Mosque.
    words: [yaiku, lawas]
  - id: e04
    type: match_pairs
    pairs:
      - text: kali
        ar_eg: نهر
        ar: نهر
        en: river
      - text: segara
        ar_eg: بحر
        ar: بحر
        en: sea
      - text: pulo
        ar_eg: جزيرة
        ar: جزيرة
        en: island
      - text: ibukutha
        ar_eg: عاصمة
        ar: عاصمة
        en: capital city
      - text: paling gedhe
        ar_eg: الأكبر
        ar: الأكبر
        en: the biggest
    words: [kali, segara, pulo, ibukutha]
  - id: e05
    type: fill_blank
    sentence: Ing Kairo ana masjid kang lawas banget, ___ Masjid Al-Azhar.
    meaning:
      ar_eg: في القاهرة جامع قديم جدًا، هو الجامع الأزهر.
      ar: في القاهرة مسجد قديم جدًا، هو الجامع الأزهر.
      en: In Cairo there is a very old mosque, namely Al-Azhar Mosque.
    options: [minangka, yaiku, kalebu]
    answers: [yaiku]
    explain:
      ar_eg: yaiku بتسمّي الحاجة اللي اتكلمنا عنها بشكل عام («جامع قديم» ← الأزهر).
      ar: yaiku تسمّي ما ذُكر بشكل عام («مسجد قديم» ← الأزهر).
      en: yaiku names the thing just mentioned in general terms ("an old mosque" → Al-Azhar).
    words: [yaiku]
  - id: e06
    type: dictation
    text: Kutha iki ana ing pinggir kali Nil.
    meaning:
      ar_eg: المدينة دي على ضفة نهر النيل.
      ar: تقع هذه المدينة على ضفة نهر النيل.
      en: This city lies on the bank of the Nile.
    words: [kali]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأسلوب المقالة) القاهرة هي عاصمة مصر، وهي على ضفة نهر النيل.
      ar: (بأسلوب المقالة) القاهرة عاصمة مصر، وتقع على ضفة نهر النيل.
      en: (article style) Cairo is the capital of Egypt and lies on the bank of the Nile.
    answers:
      - Kairo iku ibukutha Mesir lan ana ing pinggir kali Nil.
      - Kairo iku ibukutha Mesir, ana ing pinggir kali Nil.
      - Kairo iku ibukutha Mesir lan kutha iki ana ing pinggir kali Nil.
      - Kairo iku ibukutha Mesir. Kutha iki ana ing pinggir kali Nil.
      - Kairo ibukutha Mesir lan ana ing pinggir kali Nil.
      - Kairo iku ibukutha Mesir lan ana ing pinggire kali Nil.
    words: [kali, ibukutha]
  - id: e08
    type: speaking
    text: Aku saka Kairo, ibukutha Mesir, ing pinggir kali Nil.
    meaning:
      ar_eg: أنا من القاهرة، عاصمة مصر، على ضفة النيل.
      ar: أنا من القاهرة، عاصمة مصر، على ضفة النيل.
      en: I'm from Cairo, the capital of Egypt, on the bank of the Nile.
    words: [kali, ibukutha]
dialogue:
  title: Artikel Kairo
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, aku maca artikel Kairo ing Wikipedia basa Jawa.
      ar_eg: يا محمد، أنا قريت مقالة القاهرة في ويكيبيديا الجاوية.
      ar: يا محمد، قرأت مقالة القاهرة في ويكيبيديا الجاوية.
      en: Mohamed, I read the Cairo article on Javanese Wikipedia.
    - speaker: Mohamed
      text: Tenan? Artikele ngomong apa?
      ar_eg: بجد؟ المقالة بتقول إيه؟
      ar: حقًا؟ ماذا تقول المقالة؟
      en: Really? What does the article say?
    - speaker: Mbak Ayu
      text: Kairo iku kutha kang paling gedhe ing Mesir, ing pinggir kali Nil.
      ar_eg: القاهرة أكبر مدينة في مصر، على النيل.
      ar: القاهرة أكبر مدينة في مصر، على ضفة النيل.
      en: Cairo is the biggest city in Egypt, on the Nile.
    - speaker: Mohamed
      text: Bener, lho. Omahku ora adoh saka kali Nil.
      ar_eg: صح. بيتي مش بعيد عن النيل.
      ar: صحيح. بيتي ليس بعيدًا عن النيل.
      en: Right. My home isn't far from the Nile.
    - speaker: Mbak Ayu
      text: Wah, aku uga arep dolan menyang Kairo!
      ar_eg: الله، أنا كمان عايزة أزور القاهرة!
      ar: رائع، أنا أيضًا أريد زيارة القاهرة!
      en: Wow, I want to visit Cairo too!
new_words:
  - word: kali
    pos: noun
    ar_eg: نهر (≠ إندونيسي kali = مرة (dua kali = مرتين))
    ar: نهر (≠ الإندونيسية kali = مرة (dua kali = مرتين))
    en: river = sungai, kali (≠ Indonesian kali "time(s), as in dua kali")
    false_friend: kali
review:
  status: draft
  verified: false
