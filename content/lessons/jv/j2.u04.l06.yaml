schema: kabar.lesson/v1
id: j2.u04.l06
language: jv
title: Udan deres
can_do:
  ar_eg: 'تتكلم عن مواسم جاوة: موسم المطر والجفاف، والرعد والبرق والرذاذ، والقمر والنجوم.'
  ar: 'أن تتحدث عن مواسم جاوة: موسم المطر والجفاف، والرعد والبرق والرذاذ، والقمر والنجوم.'
  en: 'Talk about Java''s seasons: rainy and dry, thunder, lightning and drizzle, the moon and stars.'
slides:
  - title: Rendheng lan ketiga
    body:
      ar_eg: |
        جاوة فيها موسمين بس: **rendheng** = موسم المطر (تقريبًا من نوفمبر لأبريل)، و**ketiga** = موسم الجفاف.
        - **gludhug** = رعد · **bledheg** = صاعقة / برق بيضرب · **grimis** = رذاذ، مطر خفيف (gerimis)
        - **lerep** = المطر وقف / هدي (reda)
        - **rembulan** = قمر (bulan) · **lintang** = نجمة (bintang)
      ar: |
        في جاوة موسمان فقط: **rendheng** = موسم المطر (من نوفمبر إلى أبريل تقريبًا)، و**ketiga** = موسم الجفاف.
        - **gludhug** = رعد · **bledheg** = صاعقة · **grimis** = رذاذ، مطر خفيف (gerimis)
        - **lerep** = توقّف المطر / هدأ (reda)
        - **rembulan** = القمر (bulan) · **lintang** = نجمة (bintang)
      en: |
        Java has just two seasons: **rendheng** = the rainy season (roughly November to April) and **ketiga** = the dry season.
        - **gludhug** = thunder · **bledheg** = lightning strike · **grimis** = drizzle (gerimis)
        - **lerep** = (rain) stops, eases off (reda)
        - **rembulan** = moon (bulan) · **lintang** = star (bintang)
    examples:
      - text: Krungu gludhug? Mengko udan deres.
        ar_eg: سامع الرعد؟ هتمطر جامد.
        ar: أتسمع الرعد؟ ستمطر بغزارة.
        en: Hear the thunder? It'll pour later.
      - text: Udane wis lerep, ayo mulih.
        ar_eg: المطر وقف، يلا نروّح.
        ar: توقّف المطر، هيّا نعود.
        en: The rain's stopped, let's head home.
      - text: Bengi iki akeh lintang.
        ar_eg: الليلة فيه نجوم كتير.
        ar: الليلة نجوم كثيرة.
        en: Lots of stars tonight.
