    question: Aja neng sawah, akeh bledheg.
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [ماتروحش الغيط، فيه صواعق كتير, روح الغيط، الجو حلو, الغيط مليان مية]
    answer: 0
    explain:
      ar_eg: bledheg = صاعقة. في الغيط المفتوح الصواعق خطر.
      ar: bledheg = صاعقة، وهي خطرة في الحقول المكشوفة.
      en: bledheg = lightning; it's dangerous in open fields.
    words: [bledheg]
  - id: e08
