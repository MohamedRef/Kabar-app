    source:
      ar_eg: ده رذاذ بس، يلا نتفرج!
      ar: إنه رذاذ فقط، هيّا نشاهد!
      en: It's only drizzling, let's go and watch!
    answer: Mung grimis, ayo nonton!
    distractors: [gludhug, lerep]
    words: [grimis, lerep]
  - id: e09
    type: translate
    direction: from_target
    source_text: Bengi iki ora mendhung, akeh lintang.
    answers_meaning:
      ar_eg: [الليلة مفيش غيم، فيه نجوم كتير, الليلة صافية والنجوم كتير]
      ar: [الليلة غير غائمة، والنجوم كثيرة]
      en: ['It isn''t cloudy tonight; there are lots of stars', 'Clear night, lots of stars']
    words: [lintang]
  - id: e10
    type: speaking
    text: Yen rendheng akeh gludhug, yen ketiga ora.
    meaning:
      ar_eg: في موسم المطر الرعد كتير، وفي الجفاف لأ.
      ar: في موسم المطر رعد كثير، وفي الجفاف لا.
      en: In the rainy season there's lots of thunder; in the dry season, none.
    words: [rendheng, ketiga, gludhug]
dialogue:
  lines:
    - speaker: Sari
      text: Mohamed, krungu gludhug? Saiki wis mlebu rendheng.
      ar_eg: يا محمد، سامع الرعد؟ دخلنا موسم المطر خلاص.
      ar: يا محمد، أتسمع الرعد؟ دخلنا موسم المطر.
      en: Mohamed, hear the thunder? The rainy season's started.
    - speaker: Mohamed
      text: Neng Kairo jarang udan, hehe.
      ar_eg: في القاهرة نادرًا لما بتمطر، هههه.
      ar: في القاهرة نادرًا ما تمطر، هه.
      en: In Cairo it rarely rains, hehe.
    - speaker: Sari
      text: Neng kene ana rendheng karo ketiga. Saiki saben sore udan deres.
      ar_eg: هنا فيه موسم مطر وموسم جفاف. ودلوقتي كل عصر بتمطر جامد.
      ar: هنا موسم مطر وموسم جفاف. والآن تمطر بغزارة كل مساء.
      en: Here we have a rainy season and a dry one. Now it pours every afternoon.
    - speaker: Mohamed
      text: Lho, saiki mung grimis. Ayo nonton reog!
      ar_eg: إيه ده، دلوقتي رذاذ بس. يلا نتفرج على الريوج!
      ar: انظري، إنه رذاذ فقط الآن. هيّا نشاهد الريوغ!
      en: Hey, it's only drizzling now. Let's go and watch reog!
    - speaker: Sari
      text: Enteni lerep sik. Mengko bengi akeh lintang.
      ar_eg: استنى لما المطر يقف. بالليل هيبقى فيه نجوم كتير.
      ar: انتظر حتى يتوقّف المطر. الليلة ستكثر النجوم.
      en: Wait for it to stop first. Tonight there'll be lots of stars.
