    question_meaning:
      ar_eg: «قمر» بالجاوي؟
      ar: كيف تقول «القمر» بالجاوية؟
      en: '"Moon" in Javanese?'
    options: [rembulan, lintang, bledheg]
    answer: 0
    explain:
      ar_eg: rembulan = قمر. lintang = نجمة، وbledheg = صاعقة.
      ar: rembulan = القمر، أما lintang فنجمة وbledheg صاعقة.
      en: rembulan = moon. lintang = star, bledheg = lightning.
    words: [rembulan, lintang, bledheg]
  - id: e07
