      ar_eg: «الشاي الدافي منعش» بالجاوي؟
      ar: كيف تقول «الشاي الدافئ منعش» بالجاوية؟
      en: '"Warm tea is refreshing" in Javanese?'
    options: [Teh anget seger., Teh amis seger., Teh bosok seger.]
    answer: 0
    explain:
      ar_eg: anget = دافي، seger = منعش. amis = زفر، bosok = بايظ.
      ar: anget = دافئ، seger = منعش. أمّا amis فزفر، وbosok ففاسد.
      en: anget = warm, seger = refreshing. amis = fishy, bosok = rotten.
    words: [anget, seger, amis, bosok]
