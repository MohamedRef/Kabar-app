schema: kabar.lesson/v1
id: j2.u02.l05
language: jv
title: Wareg, seger, bosok
can_do:
  ar_eg: تقول إنك شبعت، وتختار مشروب منعش أو دافي، وتعرف لما الأكل يكون بايظ.
  ar: أن تقول إنك شبعت، وتختار مشروبًا منعشًا أو دافئًا، وتعرف متى يكون الطعام فاسدًا.
  en: Say you're full, pick a fresh or warm drink, and tell when food has gone off.
slides:
  - title: Wis wareg
    body:
      ar_eg: |
        wareg = شبعان: Aku wis wareg, matur nuwun.
        ombenan = مشروب: Ombenane apa? = تشرب إيه؟
        seger = منعش، فريش، anget = دافي: teh anget.
        sedheng = متوسط: pedhese sedheng = حرارته متوسطة.
        bosok = عفن، بايظ، mambu = ريحته وحشة، amis = زفر (ريحة سمك).
      ar: |
        wareg = شبعان: Aku wis wareg, matur nuwun.
        ombenan = مشروب: Ombenane apa? = ماذا تشرب؟
        seger = منعش، طازج، anget = دافئ: teh anget.
        sedheng = متوسّط: pedhese sedheng = حرارته متوسّطة.
        bosok = متعفّن، فاسد، mambu = كريه الرائحة، amis = زَفِر (رائحة سمك).
      en: |
        wareg = full (after eating): Aku wis wareg, matur nuwun.
        ombenan = drink: Ombenane apa? = What will you drink?
        seger = fresh, refreshing, anget = warm: teh anget.
        sedheng = medium: pedhese sedheng = medium spicy.
        bosok = rotten, mambu = smells bad, amis = fishy.
    examples:
      - text: Aku wis wareg, matur nuwun.
        ar_eg: شبعت، شكرًا.
        ar: شبعت، شكرًا.
        en: I'm full, thanks.
      - text: Iwake mambu, wis bosok.
        ar_eg: السمك ريحته وحشة، باظ خلاص.
        ar: رائحة السمك كريهة، لقد فسد.
        en: The fish smells, it's gone off.
      - text: Es tehe seger tenan.
        ar_eg: الشاي المتلّج منعش أوي.
        ar: الشاي المثلّج منعش جدًّا.
        en: The iced tea is really refreshing.
