    type: build_sentence
    source:
      ar_eg: عايز مشروب منعش.
      ar: أريد مشروبًا منعشًا.
      en: I'd like a refreshing drink.
    answer: Aku njaluk ombenan sing seger.
    distractors: [anget, wareg]
    words: [ombenan, seger, anget, wareg]
  - id: e09
    type: translate
    direction: from_target
    source_text: Iwak iki amis lan mambu.
    answers_meaning:
      ar_eg: [السمك ده زفر وريحته وحشة, السمك ده ريحته زفارة ووحشة]
      ar: [هذا السمك زَفِر ورائحته كريهة, رائحة هذا السمك زفرة وكريهة]
      en: [This fish smells fishy and bad, This fish is fishy and smells off]
    words: [amis, mambu]
  - id: e10
    type: speaking
    text: Sega anget, pedhes sedheng, ombenane teh.
    meaning:
      ar_eg: رز دافي، حرارة متوسطة، والمشروب شاي.
      ar: أرز دافئ، وحرارة متوسّطة، والمشروب شاي.
      en: Warm rice, medium spicy, and tea to drink.
    words: [anget, sedheng, ombenan]
dialogue:
  lines:
    - speaker: Bu Darmi
      text: Mas, tambah sega? Isih anget.
      ar_eg: يا ماس، تزوّد رز؟ لسه دافي.
      ar: يا أخي، أتريد مزيدًا من الأرز؟ ما زال دافئًا.
      en: More rice, Mas? It's still warm.
    - speaker: Mohamed
      text: Matur nuwun, Bu, aku wis wareg.
      ar_eg: شكرًا يا طنط، أنا شبعت.
      ar: شكرًا يا سيّدتي، لقد شبعت.
      en: Thank you, Bu, I'm full.
    - speaker: Bu Darmi
      text: Ombenane apa? Es teh seger utawa teh anget?
      ar_eg: تشرب إيه؟ شاي متلّج منعش ولا شاي دافي؟
      ar: ماذا تشرب؟ شايًا مثلّجًا منعشًا أم شايًا دافئًا؟
      en: What to drink? Refreshing iced tea or warm tea?
    - speaker: Mohamed
      text: Es teh, Bu. Lho, iwak iki kok amis?
      ar_eg: شاي متلّج يا طنط. إيه ده، السمك ده ليه ريحته زفرة؟
      ar: شاي مثلّج يا سيّدتي. ما هذا، لماذا رائحة هذا السمك زفرة؟
      en: Iced tea, Bu. Oh, why does this fish smell fishy?
    - speaker: Bu Darmi
      text: Sepurane, Mas! Iku iwak wingi, wis mambu. Tak buang.
      ar_eg: معلش يا ماس! ده سمك امبارح، ريحته باظت. هرميه.
      ar: عذرًا يا أخي! هذا سمك الأمس، فسدت رائحته. سأرميه.
      en: Sorry, Mas! That's yesterday's fish, it's gone off. I'll throw it out.
