    options: [تشرب إيه, تاكل إيه, عايز كام]
    answer: 0
    explain:
      ar_eg: ombenan = مشروب (من ngombe = يشرب).
      ar: ombenan = مشروب (من ngombe = يشرب).
      en: ombenan = drink (from ngombe = to drink).
