schema: kabar.lesson/v1
id: j1.u05.l07
language: jv
title: Rada adoh
can_do:
  ar_eg: تقول إن المكان بعيد شوية، وإن حاجة هي الأحسن.
  ar: أن تقول إن المكان بعيد قليلًا، وإن شيئًا هو الأفضل.
  en: Say a place is a bit far, and that something is the best.
slides:
  - title: Menyang Parangtritis
    body:
      ar_eg: |
        - **adoh** = بعيد (jauh)، وعكسها cedhak = قريب.
        - **rada** = شوية (agak): rada adoh = بعيد شوية.
        - **paling** = الأكتر (paling): paling apik = الأحسن.
      ar: |
        - **adoh** = بعيد (jauh)، وعكسها cedhak = قريب.
        - **rada** = قليلًا (agak): rada adoh = بعيد قليلًا.
        - **paling** = الأكثر (paling): paling apik = الأفضل.
      en: |
        - **adoh** = far (jauh); its opposite is cedhak = near.
        - **rada** = rather, a bit (agak): rada adoh = a bit far.
        - **paling** = most (paling): paling apik = the best.
    examples:
      - text: Parangtritis adoh saka Jogja.
        ar_eg: باراجتريتيس بعيدة عن يوجيا.
        ar: باراجتريتيس بعيدة عن يوجياكرتا.
        en: Parangtritis is far from Jogja.
      - text: Ombake rada gedhe.
        ar_eg: الموج كبير شوية.
        ar: الموج كبير قليلًا.
        en: The waves are rather big.
      - text: Pantai iki paling apik!
        ar_eg: الشط ده أحلى شط!
        ar: هذا الشاطئ هو الأجمل!
        en: This beach is the best!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: adoh
        ar_eg: بعيد
        ar: بعيد
        en: far
      - text: rada
        ar_eg: شوية
        ar: قليلًا
        en: rather, a bit
      - text: paling
        ar_eg: الأكتر
        ar: الأكثر
        en: most
      - text: cedhak
        ar_eg: قريب
        ar: قريب
        en: near
      - text: tenan
        ar_eg: بجد / أوي
        ar: حقًا / جدًا
        en: really
      - text: sithik
        ar_eg: شوية
        ar: قليلًا
        en: a little
    words: [adoh, rada, paling, cedhak, tenan, sithik]
  - id: e02
    type: listen
    text: Parangtritis adoh saka Jogja.
    question:
      ar_eg: بيقول إيه عن باراجتريتيس؟
      ar: ماذا يقول عن باراجتريتيس؟
      en: What does he say about Parangtritis?
    options: [باراجتريتيس بعيدة عن يوجيا, باراجتريتيس قريبة من يوجيا, باراجتريتيس جوه يوجيا]
    answer: 0
    meaning:
      ar_eg: باراجتريتيس بعيدة عن يوجيا.
      ar: باراجتريتيس بعيدة عن يوجياكرتا.
      en: Parangtritis is far from Jogja.
    words: [adoh]
  - id: e03
    type: fill_blank
    sentence: Ombake ___ gedhe, ati-ati!
    meaning:
      ar_eg: الموج كبير ___، خلي بالك!
      ar: الموج كبير ___، انتبه!
      en: The waves are ___ big, careful!
    options: [rada, adoh, paling]
    answers: [rada]
    words: [rada, adoh, paling]
    explain:
      ar_eg: rada gedhe = كبير شوية، وده سبب «خلي بالك». adoh = بعيد، وpaling = أكتر حاجة.
      ar: rada gedhe = كبير قليلًا، ولذلك «انتبه»؛ أما adoh فبعيد، وpaling الأكثر.
      en: rada gedhe = rather big, hence "careful". adoh = far, paling = most.
  - id: e04
    type: fill_blank
    sentence: Pantai iki ___ apik!
    meaning:
      ar_eg: الشط ده ___ حلو!
      ar: هذا الشاطئ ___ جميل!
      en: This beach is the ___!
    options: [paling, rada, adoh]
    answers: [paling]
    words: [paling, rada, adoh]
    explain:
      ar_eg: paling apik = الأحلى / الأحسن. rada = شوية، وadoh = بعيد.
      ar: paling apik = الأجمل؛ أما rada فقليلًا، وadoh بعيد.
      en: paling apik = the best. rada = a bit, adoh = far.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة عكس cedhak (قريب)؟
      ar: أيّ كلمة عكس cedhak (قريب)؟
      en: Which word is the opposite of cedhak (near)?
    options: [adoh, rada, paling]
    answer: 0
    explain:
      ar_eg: adoh = بعيد. rada = شوية، وpaling = الأكتر.
      ar: adoh = بعيد، أما rada فقليلًا وpaling الأكثر.
      en: adoh = far. rada = a bit, paling = most.
    words: [adoh, rada, paling]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الشط ده أحلى حاجة!
      ar: هذا الشاطئ هو الأجمل!
      en: This beach is the best!
    answer: Pantai iki paling apik.
    distractors: [adoh, rada]
    words: [paling]
    explain:
      ar_eg: paling apik = الأحسن، وpantai iki = الشاطئ ده. adoh = بعيد، وrada = شوية، ومش في المعنى.
      ar: paling apik = الأفضل، وpantai iki = هذا الشاطئ؛ أما adoh فبعيد، وrada قليلًا، وليسا في المعنى.
      en: paling apik = the best, pantai iki = this beach. adoh (far) and rada (a bit) aren't in the meaning.
  - id: e07
    type: speaking
    text: Omahku rada adoh, Mas.
    meaning:
      ar_eg: بيتي بعيد شوية يا ماس.
      ar: بيتي بعيد قليلًا يا أخي.
      en: My place is a bit far, Mas.
    words: [rada, adoh]
  - id: e08
    type: listen
    text: Adoh tenan, Mas!
    options: ['Adoh tenan, Mas!', 'Rada adoh, Mas!', 'Cedhak tenan, Mas!']
    answer: 0
    meaning:
      ar_eg: بعيد أوي يا ماس!
      ar: بعيد حقًا يا ماس!
      en: It's really far, Mas!
    words: [tenan, adoh, rada, cedhak]
  - id: e09
    type: fill_blank
    sentence: Sega ___ wae, Mbak.
    meaning:
      ar_eg: رز شوية بس يا مبا.
      ar: قليل من الأرز فقط يا آنسة.
      en: Just a little rice, Mbak.
    options: [sithik, tenan, adoh]
    answers: [sithik]
    words: [sithik, tenan]
    explain:
      ar_eg: "sithik = شوية: sega sithik wae = رز شوية بس. tenan = بجد، وadoh = بعيد."
      ar: "sithik = قليل: sega sithik wae = قليل من الأرز فقط؛ أما tenan فحقًا، وadoh بعيد."
      en: sithik = a little. tenan = really, adoh = far.
  - id: e10
    type: speaking
    text: Sithik wae, Mas. Enak tenan!
    meaning:
      ar_eg: شوية بس يا ماس. حلو أوي!
      ar: قليلًا فقط يا ماس. لذيذ جدًا!
      en: Just a little, Mas. It's really good!
    words: [sithik, tenan]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, Parangtritis adoh saka Jogja?
      ar_eg: يا ماس، باراجتريتيس بعيدة عن يوجيا؟
      ar: يا أخي، هل باراجتريتيس بعيدة عن يوجياكرتا؟
      en: Mas, is Parangtritis far from Jogja?
    - speaker: Mas Yudha
      text: Rada adoh, numpak motor.
      ar_eg: بعيدة شوية، بنروح بالموتوسيكل.
      ar: بعيدة قليلًا، نذهب بالدراجة النارية.
      en: A bit far; we go by motorbike.
    - speaker: Mohamed
      text: Ombake gedhe tenan!
      ar_eg: الموج كبير جدًا!
      ar: الموج كبير جدًا!
      en: The waves are huge!
    - speaker: Mas Yudha
      text: Iya, ombake paling gedhe neng Jogja. Ati-ati!
      ar_eg: آه، أكبر موج في يوجيا. خلي بالك!
      ar: نعم، أكبر موج في يوجياكرتا. انتبه!
      en: Yep, the biggest waves in Jogja. Careful!
