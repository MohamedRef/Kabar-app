  - word: rada
    pos: adverb
    ar_eg: شوية (agak)
    ar: قليلًا (agak)
    en: rather, a bit (agak)
  - word: paling
    pos: adverb
    ar_eg: 'الأكتر (paling): paling apik = الأحسن'
    ar: 'الأكثر (paling): paling apik = الأفضل'
    en: 'most (paling): paling apik = the best'
  - word: tenan
    pos: adverb
    ar_eg: 'بجد / أوي (sungguh): apik tenan = حلو أوي'
    ar: 'حقًا / جدًا (sungguh): apik tenan = جميل حقًا'
    en: 'really (sungguh): apik tenan = really nice'
  - word: sithik
    pos: adverb
    ar_eg: شوية (sedikit)
    ar: قليلًا (sedikit)
    en: a little (sedikit)
