schema: kabar.lesson/v1
id: j3.u05.l05
language: jv
title: Sate ing peken
can_do:
  ar_eg: 'تطلب أكلة في السوق بالكراما: رز وساتيه وتمبيه، وتقول مين بيبيع، والطبق خلص.'
  ar: 'أن تطلب وجبة في السوق بالكراما: أرز وساتيه وتمبيه، وتقول من يبيع، وأن الطبق فرغ.'
  en: 'Order a meal at the market in krama: rice, satay and tempe, say who sells what, and that your plate is empty.'
slides:
  - title: Sekul, sate, tempe
    body:
      ar_eg: |
        في السوق:
        - sega ← sekul = رز مطبوخ
        - dodol (أو adol) ← sade = يبيع
        sate = ساتيه (أسياخ لحمة أو فراخ). tempe = تمبيه، أكلة جاوة الشهيرة من فول الصويا.
        kecap = صوص الصويا الحلو، بيتحط على الساتيه.
        piring = طبق. kosong = فاضي: «Piringipun sampun kosong!» = الطبق خلص!
      ar: |
        في السوق:
        - sega ← sekul = أرز مطبوخ
        - dodol (أو adol) ← sade = يبيع
        sate = ساتيه (أسياخ لحم أو دجاج). tempe = التمبيه، طعام جاوة الشهير من فول الصويا.
        kecap = صلصة الصويا الحلوة، تُصبّ على الساتيه.
        piring = طبق. kosong = فارغ: «Piringipun sampun kosong!» = فرغ الطبق!
      en: |
        At the market:
        - sega → sekul = cooked rice
        - dodol (or adol) → sade = sell
        sate = satay (meat or chicken skewers). tempe = tempe, Java's famous soybean cake.
        kecap = sweet soy sauce, poured over satay.
        piring = plate. kosong = empty: "Piringipun sampun kosong!" = my plate's empty!
    examples:
      - text: Sekul kaliyan sate, setunggal piring.
        ar_eg: رز وساتيه، طبق واحد.
        ar: أرز مع ساتيه، طبق واحد.
        en: Rice with satay, one plate.
      - text: Bu Siti sade tempe wonten peken.
        ar_eg: طنط سيتي بتبيع تمبيه في السوق.
        ar: تبيع السيدة سيتي التمبيه في السوق.
        en: Bu Siti sells tempe at the market.
      - text: Piringipun sampun kosong. Enak sanget!
        ar_eg: الطبق خلص. حلو أوي!
        ar: فرغ الطبق. لذيذ جدًا!
        en: The plate's empty. Delicious!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sekul
        ar_eg: رز مطبوخ (كراما)
        ar: أرز مطبوخ (كراما)
        en: cooked rice (krama)
      - text: tempe
        ar_eg: تمبيه
        ar: تمبيه
        en: tempe
      - text: sate
        ar_eg: ساتيه
        ar: ساتيه
        en: satay
      - text: kecap
        ar_eg: صوص صويا حلو
        ar: صلصة صويا حلوة
        en: sweet soy sauce
    words: [sekul, tempe, sate, kecap]
  - id: e02
    type: match_pairs
    pairs:
      - text: piring
        ar_eg: طبق
        ar: طبق
        en: plate
      - text: dodol
        ar_eg: يبيع (ngoko)
        ar: يبيع (ngoko)
        en: sell (ngoko)
      - text: sade
        ar_eg: يبيع (كراما)
        ar: يبيع (كراما)
        en: sell (krama)
      - text: kosong
        ar_eg: فاضي
        ar: فارغ
        en: empty
    words: [piring, dodol, sade, kosong]
  - id: e03
    type: listen
    text: Sekul kaliyan sate, setunggal piring.
    question:
      ar_eg: طالب إيه؟
      ar: ماذا يطلب؟
      en: What is he ordering?
    options: [طبقين تمبيه, رز بس, طبق رز وساتيه]
    answer: 2
    meaning:
      ar_eg: رز وساتيه، طبق واحد.
      ar: أرز مع ساتيه، طبق واحد.
      en: Rice with satay, one plate.
    words: [sekul, sate, piring]
  - id: e04
    type: fill_blank
    sentence: Bu Siti ___ tempe wonten peken.
    meaning:
      ar_eg: طنط سيتي ___ تمبيه في السوق.
      ar: السيدة سيتي ___ التمبيه في السوق.
      en: Bu Siti ___ tempe at the market.
    options: [sade, kosong, kecap]
    answers: [sade]
    words: [sade, kosong, kecap, tempe]
  - id: e05
    type: multiple_choice
    question: Sega (ngoko) → ___ (krama)
    options: [sekul, sate, piring]
    answer: 0
    explain:
      ar_eg: sega ← sekul = رز مطبوخ.
      ar: sega ← sekul = أرز مطبوخ.
      en: sega → sekul = cooked rice.
    words: [sekul, sate, piring]
  - id: e06
    type: fill_blank
    sentence: Piringipun sampun ___. Enak sanget!
    meaning:
      ar_eg: الطبق ___. حلو أوي!
      ar: الطبق ___. لذيذ جدًا!
      en: The plate is ___. Delicious!
    options: [kosong, dodol, tempe]
    answers: [kosong]
    words: [kosong, dodol, tempe, piring]
  - id: e07
    type: build_sentence
    source:
      ar_eg: ساتيه بصوص الصويا يا طنط.
      ar: ساتيه مع صلصة الصويا يا سيدتي.
      en: Satay with soy sauce, ma'am.
    answer: Sate kaliyan kecap, Bu.
    distractors: [kosong, sade]
    words: [sate, kecap]
  - id: e08
    type: translate
    direction: from_target
    source_text: Pak, panjenengan sade sate?
    answers_meaning:
      ar_eg: [يا عم، حضرتك بتبيع ساتيه؟, بتبيع ساتيه يا عم؟]
      ar: [هل تبيع الساتيه يا سيدي؟]
      en: ['Do you sell satay, sir?', 'Sir, do you sell satay?']
    words: [sade, sate]
  - id: e09
    type: speaking
    text: Aku dodol tempe ing pasar.
    meaning:
      ar_eg: أنا ببيع تمبيه في السوق.
      ar: أبيع التمبيه في السوق.
      en: I sell tempe at the market.
    words: [dodol, tempe]
  - id: e10
    type: multiple_choice
    question: Aku dodol sate. → Kula ___ sate.
    options: [kecap, sade, kosong]
    answer: 1
    explain:
      ar_eg: dodol (adol) ← sade = يبيع.
      ar: dodol (adol) ← sade = يبيع.
      en: dodol (adol) → sade = sell.
    words: [dodol, sade, kecap, kosong]
dialogue:
  lines:
    - speaker: Penjual
      text: Mangga, Mas! Sate, tempe, sekul!
      ar_eg: اتفضل يا أستاذ! ساتيه، تمبيه، رز!
      ar: تفضّل! ساتيه، تمبيه، أرز!
      en: Come on in! Satay, tempe, rice!
    - speaker: Mohamed
      text: Bu, sekul kaliyan sate setunggal piring.
      ar_eg: يا طنط، طبق رز وساتيه.
      ar: يا سيدتي، طبق أرز مع ساتيه.
      en: Ma'am, one plate of rice with satay.
    - speaker: Penjual
      text: Tempenipun ugi? Gurih sanget, lho.
      ar_eg: والتمبيه كمان؟ مسبّك أوي على فكرة.
      ar: والتمبيه أيضًا؟ إنه شهيّ جدًا.
      en: Tempe too? It's really savoury.
    - speaker: Mohamed
      text: Inggih, kalih.
      ar_eg: ماشي، اتنين.
      ar: نعم، اثنتان.
      en: Yes, two.
    - speaker: Penjual
      text: Piringipun sampun kosong! Enak, Mas?
      ar_eg: الطبق خلص! عجبك؟
      ar: فرغ الطبق! هل أعجبك؟
      en: Your plate's empty! Was it good?
    - speaker: Mohamed
      text: Enak sanget, Bu. Benjing kula tumbas malih.
      ar_eg: حلو أوي يا طنط. بكرة هشتري تاني.
      ar: لذيذ جدًا يا سيدتي. سأشتري مرة أخرى غدًا.
      en: Delicious, ma'am. I'll buy again tomorrow.
