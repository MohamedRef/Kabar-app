schema: kabar.lesson/v1
id: j2.u02.l01
language: jv
title: Nulis, maca, ngombe
can_do:
  ar_eg: تستخدم الأفعال اللي بتبدأ بالبادئة الأنفية N- (nulis، maca، ngombe).
  ar: أن تستخدم الأفعال المبدوءة بالسابقة الأنفية N- (nulis، maca، ngombe).
  en: Use N- verbs (nulis, maca, ngombe).
slides:
  - title: N- = meN- من غير «me»
    body:
      ar_eg: |
        فاكر في الإندونيسي menulis وmembaca وminum؟ الجاوي بيعمل نفس الحكاية بس من غير «me»: بيفضل الصوت الأنفي لوحده.
        - tulis → nulis = menulis (يكتب)
        - waca → maca = membaca (يقرا)
        - ombe → ngombe = minum (يشرب)
        من الجزء ده ورايح بنتكلم جاوي «ماتارامان» (ماديون، سولو، جوكجا)، فهنقول neng بدل nang (نفس المعنى: ke / di)، وkowe بدل koen.
        الإملا: القواميس بتحط علامة على الـ e في ngombe وnggawe، وإحنا بنكتبها من غيرها زي الشات.
      ar: |
        تذكر menulis وmembaca في الإندونيسية؟ تفعل الجاوية الشيء نفسه بلا «me»، فيبقى الصوت الأنفي وحده:
        - tulis → nulis = menulis (يكتب)
        - waca → maca = membaca (يقرأ)
        - ombe → ngombe = minum (يشرب)
        ومن هذه الوحدة نعتمد جاوية «ماتارامان» (ماديون وسولو ويوغياكارتا)، فنقول neng بدل nang (بالمعنى نفسه: ke / di)، وkowe بدل koen.
        وتضع المعاجم علامة على الـ e في ngombe وnggawe، ونكتبها بدونها كالدردشة.
      en: |
        Remember Indonesian menulis and membaca? Javanese does the same without the "me": only the nasal sound is left.
        - tulis → nulis = menulis (write)
        - waca → maca = membaca (read)
        - ombe → ngombe = minum (drink)
        From this unit on we speak Mataraman Javanese (Madiun, Solo, Yogya): neng instead of nang (same meaning: ke / di), kowe instead of koen.
        Spelling: dictionaries put an accent on the e in ngombe and nggawe; Kabar writes them plain, like chat.
    grammar: jv.prefix.nasal
    examples:
      - text: Sari lagi nulis layang.
        ar_eg: ساري بتكتب جواب.
        ar: ساري تكتب رسالة.
        en: Sari is writing a letter.
      - text: Bapak ngombe kopi neng warung.
        ar_eg: بابا بيشرب قهوة في المحل.
        ar: أبي يشرب القهوة في المقهى.
        en: Dad is drinking coffee at the warung.
  - title: Sapu → nyapu, gawe → nggawe
    body:
      ar_eg: |
        أول حرف في الأصل هو اللي بيحدد الصوت الأنفي:
        - p وw → m: pangan → mangan (ياكل)، pikir → mikir (يفكر)، waca → maca
        - t → n: tulis → nulis
        - s وc → ny: sapu → nyapu (يكنس)
        - k → ng: kirim → ngirim (يبعت)
        - حرف متحرك → ng: ombe → ngombe
        - b وj وg مابيقعوش، الأنفي بيتحط قدامهم: bukak → mbukak (يفتح)، jupuk → njupuk (ياخد)، gawe → nggawe (يعمل)
        وmikir أصلها pikir، من العربي «فكر».
      ar: |
        الحرف الأول من الجذر يحدد الصوت الأنفي:
        - p وw → m: pangan → mangan (يأكل)، pikir → mikir (يفكر)، waca → maca
        - t → n: tulis → nulis
        - s وc → ny: sapu → nyapu (يكنس)
        - k → ng: kirim → ngirim (يرسل)
        - الصائت → ng: ombe → ngombe
        - b وj وg لا تسقط بل يسبقها الأنفي: bukak → mbukak (يفتح)، jupuk → njupuk (يأخذ)، gawe → nggawe (يصنع)
        وmikir من pikir، وأصلها العربي «فكر».
      en: |
        The first sound of the base decides the nasal:
        - p, w → m: pangan → mangan (eat), pikir → mikir (think), waca → maca
        - t → n: tulis → nulis
        - s, c → ny: sapu → nyapu (sweep)
        - k → ng: kirim → ngirim (send)
        - vowel → ng: ombe → ngombe
        - b, j, g stay and get a nasal in front: bukak → mbukak (open), jupuk → njupuk (take), gawe → nggawe (make)
        mikir comes from pikir ← Arabic «فكر».
    grammar: jv.prefix.nasal
    examples:
      - text: Ibu nggawe sambel pecel.
        ar_eg: ماما بتعمل صوص البيتشل.
        ar: أمي تصنع صلصة البيتشل.
        en: Mum is making pecel sauce.
      - text: Aku lagi mikir.
        ar_eg: أنا بفكر.
        ar: أنا أفكر.
        en: I'm thinking.
      - text: Simbok lagi nyapu.
        ar_eg: أمي بتكنس.
        ar: أمي تكنس.
        en: Mum is sweeping.
  - title: Tuku, turu, lunga — tanpa N-
    body:
      ar_eg: |
        أفعال يومية كتير مابتاخدش N- خالص: tuku (يشتري)، turu (ينام)، lunga (يمشي / يروح)، teka (ييجي)، adus (يستحمى). يعني «Aku tuku roti» مش «nuku».
        والمهم: مع di- وtak- (اللي اتعلمتهم في J1) الفعل بيرجع لأصله: maca → diwaca / tak waca، nulis → ditulis. زي الإندونيسي membaca → dibaca.
        وده بيساعدك في القراية: لو شفت ny- جرّب s أو c، وn- جرّب t، وm- جرّب p أو w، وng- جرّب k أو حرف متحرك.
      ar: |
        كثير من الأفعال اليومية لا تأخذ N-: tuku (يشتري)، turu (ينام)، lunga (يذهب)، teka (يأتي)، adus (يغتسل)، فيقال «Aku tuku roti» لا «nuku».
        ومع di- وtak- (من J1) يعود الجذر: maca → diwaca / tak waca، nulis → ditulis، كما في الإندونيسية membaca → dibaca.
        وللقراءة: ny- → جرّب s أو c، وn- → t، وm- → p أو w، وng- → k أو صائت.
      en: |
        Many everyday verbs never take N-: tuku (buy), turu (sleep), lunga (go), teka (come), adus (bathe). So "Aku tuku roti", not "nuku".
        Key point: with di- and tak- (from J1) the base comes back: maca → diwaca / tak waca, nulis → ditulis — like Indonesian membaca → dibaca.
        Reading trick: ny- → try s or c; n- → t; m- → p or w; ng- → k or a vowel.
    grammar: jv.prefix.nasal
    examples:
      - text: Bukune wis diwaca.
        ar_eg: الكتاب اتقرا خلاص.
        ar: قُرئ الكتاب.
        en: The book has been read.
      - text: Layange wis tak tulis.
        ar_eg: الجواب أنا كتبته خلاص.
        ar: الرسالة كتبتُها.
        en: I've written the letter.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nulis
        ar_eg: يكتب
        ar: يكتب
        en: write
      - text: maca
        ar_eg: يقرا
        ar: يقرأ
        en: read
      - text: ngombe
        ar_eg: يشرب
        ar: يشرب
        en: drink
      - text: nyapu
        ar_eg: يكنس
        ar: يكنس
        en: sweep
      - text: nggawe
        ar_eg: يعمل / يصنع
        ar: يصنع
        en: make
    words: [nulis, maca, ngombe, nyapu, nggawe]
  - id: e02
    type: multiple_choice
    question: N- + tulis → ?
    question_meaning:
      ar_eg: حط N- على tulis (يكتب). تبقى إيه؟
      ar: أضف N- إلى tulis (يكتب). ما الناتج؟
      en: Put N- on tulis (write). What do you get?
    options: [nulis, ngtulis, nyulis]
    answer: 0
    explain:
      ar_eg: t بتتحول n، زي الإندونيسي menulis.
      ar: تتحول t إلى n كما في menulis.
      en: t becomes n, as in Indonesian menulis.
    words: [nulis]
  - id: e03
    type: listen
    text: Bapak ngombe kopi.
    options: [Bapak ngombe kopi., Bapak tuku kopi., Bapak nggawe kopi.]
    answer: 0
    words: [ngombe, kopi]
  - id: e04
    type: fill_blank
    sentence: Bukune wis di___.
    meaning:
      ar_eg: الكتاب اتقرا خلاص.
      ar: قُرئ الكتاب.
      en: The book has been read.
    options: [nulis, waca, maca]
    answers: [waca]
    explain:
      ar_eg: di- بتاخد الأصل waca، مش maca. زي dibaca مش dimembaca.
      ar: تدخل di- على الجذر waca لا على maca.
      en: di- takes the base waca, not maca — like dibaca, not dimembaca.
    words: [waca, maca]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا بكتب جواب.
      ar: أنا أكتب رسالة.
      en: I'm writing a letter.
    answer: Aku lagi nulis layang.
    distractors: [tulis, kowe]
    words: [nulis, layang]
  - id: e06
    type: dictation
    text: Aku seneng maca buku.
    meaning:
      ar_eg: أنا بحب القراية.
      ar: أحب قراءة الكتب.
      en: I like reading books.
    words: [seneng, maca]
  - id: e07
    type: speaking
    text: Ibu nggawe sambel pecel.
    meaning:
      ar_eg: ماما بتعمل صوص البيتشل.
      ar: أمي تصنع صلصة البيتشل.
      en: Mum is making pecel sauce.
    words: [nggawe, sambel]
dialogue:
  title: Layang saka Caruban
  lines:
    - speaker: Sari
      text: Mohamed, kowe lagi ngapa?
      ar_eg: محمد، بتعمل إيه؟
      ar: ماذا تفعل يا محمد؟
      en: Mohamed, what are you doing?
    - speaker: Mohamed
      text: Aku lagi nulis layang.
      ar_eg: بكتب جواب.
      ar: أكتب رسالة.
      en: I'm writing a letter.
    - speaker: Sari
      text: Layang? Kok ora ngirim WA wae?
      ar_eg: جواب؟ ليه ماتبعتش واتساب وخلاص؟
      ar: رسالة؟ لماذا لا ترسل واتساب فحسب؟
      en: A letter? How come you don't just send a WhatsApp?
    - speaker: Mohamed
      text: Ibuku seneng maca layang.
      ar_eg: أمي بتحب تقرا الجوابات.
      ar: أمي تحب قراءة الرسائل.
      en: My mum likes reading letters.
    - speaker: Sari
      text: Apik! Ayo ngombe kopi sik.
      ar_eg: حلو! يلا نشرب قهوة الأول.
      ar: جميل! هيا نشرب القهوة أولًا.
      en: Nice! Let's have a coffee first.
