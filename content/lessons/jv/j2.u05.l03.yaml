schema: kabar.lesson/v1
id: j2.u05.l03
language: jv
title: Nyirami, nekani
can_do:
  ar_eg: تستخدم الأفعال اللي آخرها -i / -ni.
  ar: أن تستخدم الأفعال المنتهية بـ -i / -ni.
  en: Use -i verbs.
slides:
  - title: -i = -i
    body:
      ar_eg: |
        إنت عارف -i في الإندونيسي (menyirami، mendatangi). الجاوي -i قريبة منها: بتوجّه الفعل «على» مكان أو شخص.
        - siram → nyirami = menyirami (يسقي): nyirami kembang = يسقي الورد
        - teka (ييجي) → nekani = mendatangi (يروح لـ / يحضر): nekani mantenan = يحضر فرح
        الشكل: بعد حرف ساكن -i (siram → nyirami)، وبعد حرف متحرك -ni (teka → nekani). وغالبًا معاها N- زي ما اتعلمنا.
      ar: |
        تعرف -i الإندونيسية (menyirami، mendatangi)، والجاوية قريبة منها: توجّه الفعل إلى مكان أو شخص.
        - siram → nyirami = menyirami (يسقي): nyirami kembang = يسقي الزهور
        - teka (يأتي) → nekani = mendatangi (يحضر إلى): nekani mantenan = يحضر عرسًا
        والصيغة: -i بعد الساكن (siram → nyirami)، و-ni بعد الصائت (teka → nekani)، وتقترن غالبًا بـ N-.
      en: |
        You know Indonesian -i (menyirami, mendatangi). Javanese -i is close: it aims the action at a place or person.
        - siram → nyirami = menyirami (water): nyirami kembang = water the flowers
        - teka (come) → nekani = mendatangi (attend, come to): nekani mantenan = attend a wedding
        Shape: -i after a consonant (siram → nyirami), -ni after a vowel (teka → nekani). Usually with N-, as you learned.
    grammar: jv.suffix.i
    examples:
      - text: Ibu nyirami kembang saben esuk.
        ar_eg: ماما بتسقي الورد كل يوم الصبح.
        ar: تسقي أمي الزهور كل صباح.
        en: Mum waters the flowers every morning.
      - text: Sésuk aku nekani mantenané Dimas.
        ar_eg: بكرة رايح فرح ديماس.
        ar: غدًا أحضر عرس ديماس.
        en: Tomorrow I'm going to Dimas's wedding.
  - title: Ngancani, ngenteni
    body:
      ar_eg: |
        - kanca (صاحب) → ngancani = menemani (يونّس / يرافق). ومع tak: Tak kancani = هاجي معاك (kutemani).
        - ngenteni = menunggu (يستنى حد): Aku ngenteni kowé = أنا مستنيك. وفي الأمر بتفضل -i: Enteni aku!
        وزي ما اتعلمنا: مع di- وtak- الأصل بيرجع: tak kancani، ditekani.
        وفي الأعمال اليومية: resik (نضيف) → ngresiki = membersihkan (ينضّف): ngresiki omah = ينضّف البيت.
      ar: |
        - kanca (صديق) → ngancani = menemani (يرافق)، ومع tak: Tak kancani = سأرافقك (kutemani).
        - ngenteni = menunggu (ينتظر أحدًا): Aku ngenteni kowé = أنتظرك، ويبقى الأمر بـ -i: Enteni aku!
        ومع di- وtak- يعود الجذر: tak kancani، ditekani.
        ومن أعمال البيت: resik (نظيف) → ngresiki = membersihkan (ينظّف): ngresiki omah = ينظّف البيت.
      en: |
        - kanca (friend) → ngancani = menemani (keep someone company). With tak: Tak kancani = I'll come with you (kutemani).
        - ngenteni = menunggu (wait for someone): Aku ngenteni kowé = I'm waiting for you. The command keeps -i: Enteni aku!
        As before, di- and tak- take the base: tak kancani, ditekani.
        For chores: resik (clean) → ngresiki = membersihkan: ngresiki omah = clean the house.
    grammar: jv.suffix.i
    examples:
      - text: Ayo, tak kancani.
        ar_eg: يلا، هاجي معاك.
        ar: هيا، سأرافقك.
        en: Come on, I'll keep you company.
      - text: Aku ngenteni kowé neng stasiun.
        ar_eg: أنا مستنيك في المحطة.
        ar: أنتظرك في المحطة.
        en: I'm waiting for you at the station.
  - title: Mateni lampu
    body:
      ar_eg: |
        خلي بالك: مش كل -i جاوي = -i إندونيسي.
        - mateni lampu = mematikan lampu (يطفي النور) — بـ -i في الجاوي، وبـ -kan في الإندونيسي!
        - وعكسه nguripaké lampu = menghidupkan (يولّع) بـ -aké.
        احفظ كل فعل بنهايته. ومع di-: Lampuné dipateni = النور اتطفى. وفي الأمر: Pateni lampuné, ya. = اطفي النور.
      ar: |
        تنبّه: ليست كل -i جاوية = -i إندونيسية.
        - mateni lampu = mematikan lampu (يطفئ المصباح) بـ -i في الجاوية و-kan في الإندونيسية!
        - وضده nguripaké lampu = menghidupkan (يشعل) بـ -aké.
        فاحفظ كل فعل بلاحقته. ومع di-: Lampuné dipateni = أُطفئ المصباح، وفي الأمر: Pateni lampuné, ya.
      en: |
        Careful: Javanese -i doesn't always equal Indonesian -i.
        - mateni lampu = mematikan lampu (turn off the light) — -i in Javanese, -kan in Indonesian!
        - Its opposite nguripaké lampu = menghidupkan (turn on) uses -aké.
        Learn each verb with its ending. With di-: Lampuné dipateni = the light is turned off. As a command: Pateni lampuné, ya. = Turn off the light, OK?
    grammar: jv.suffix.i
    examples:
      - text: Pateni lampuné, ya.
        ar_eg: اطفي النور، ماشي؟
        ar: أطفئ المصباح من فضلك.
        en: Turn off the light, OK?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nyirami
        ar_eg: يسقي
        ar: يسقي
        en: to water
      - text: nekani
        ar_eg: يحضر / يروح لـ
        ar: يحضر إلى
        en: to attend, come to
      - text: ngancani
        ar_eg: يونّس / يرافق
        ar: يرافق
        en: to keep company
      - text: ngenteni
        ar_eg: يستنى
        ar: ينتظر
        en: to wait for
      - text: mateni
        ar_eg: يطفي
        ar: يطفئ
        en: to turn off
    words: [nyirami, nekani, ngancani, ngenteni, mateni]
  - id: e02
    type: multiple_choice
    question: N- + teka + -i → ?
    question_meaning:
      ar_eg: teka (ييجي) بـ N- و-i. تبقى إيه؟
      ar: teka (يأتي) مع N- و-i. ما الناتج؟
      en: teka (come) with N- and -i. What do you get?
    options: [nekai, nekani, ngekani]
    answer: 1
    explain:
      ar_eg: teka آخرها حرف متحرك، فبتاخد -ni. وt → n.
      ar: تنتهي teka بصائت فتأخذ -ni، وتصير t نونًا.
      en: teka ends in a vowel, so it takes -ni; t becomes n.
    words: [nekani]
  - id: e03
    type: listen
    text: Ibu nyirami kembang saben esuk.
    options: [Ibu nyirami kembang saben esuk., Ibu ngresiki omah saben esuk., Ibu nyirami kembang saben soré.]
    answer: 0
    words: [nyirami, kembang, saben]
  - id: e04
    type: fill_blank
    sentence: Aku ___ kowé neng stasiun.
    meaning:
      ar_eg: أنا مستنيك في المحطة.
      ar: أنتظرك في المحطة.
      en: I'm waiting for you at the station.
    options: [enteni, ngenteni, nekani]
    answers: [ngenteni]
    explain:
      ar_eg: enteni للأمر بس (استناني!). في الجملة العادية ngenteni.
      ar: enteni للأمر فقط، وفي الجملة الخبرية ngenteni.
      en: enteni is the command form; in a statement use ngenteni.
    words: [ngenteni]
  - id: e05
    type: build_sentence
    source:
      ar_eg: ماما بتسقي الورد كل يوم الصبح.
      ar: تسقي أمي الزهور كل صباح.
      en: Mum waters the flowers every morning.
    answer: Ibu nyirami kembang saben esuk.
    distractors: [siram, bengi]
    words: [nyirami, kembang, saben]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اطفي النور، ماشي؟
      ar: أطفئ المصباح من فضلك.
      en: Turn off the light, OK?
    answers: ['Pateni lampuné, ya.', 'Pateni lampuné, ya', 'Pateni lampune, ya.', 'Pateni lampune, ya', Pateni lampuné ya., Pateni lampuné ya, Pateni lampune ya., Pateni lampune ya, 'Lampuné dipateni, ya.', 'Lampuné dipateni, ya', 'Lampune dipateni, ya.', 'Lampune dipateni, ya', 'Tulung pateni lampuné, ya.', 'Tulung pateni lampuné, ya', 'Tulung pateni lampune, ya.', 'Tulung pateni lampune, ya']
    words: [mateni, lampu]
  - id: e07
    type: speaking
    text: Ayo, tak kancani.
    meaning:
      ar_eg: يلا، هاجي معاك.
      ar: هيا، سأرافقك.
      en: Come on, I'll keep you company.
    words: [kancani]
dialogue:
  title: Kembang lan mantenan
  lines:
    - speaker: Sari
      text: Mohamed, aku arep nyirami kembang.
      ar_eg: محمد، أنا هسقي الورد.
      ar: يا محمد، سأسقي الزهور.
      en: Mohamed, I'm going to water the flowers.
    - speaker: Mohamed
      text: Tak rewangi, ya.
      ar_eg: هساعدك.
      ar: سأساعدك.
      en: I'll help you.
    - speaker: Sari
      text: Matur nuwun! Mengko soré aku nekani mantenané kancaku.
      ar_eg: شكرًا! العصر هروح فرح صاحبتي.
      ar: شكرًا! سأحضر عصرًا عرس صديقتي.
      en: Thanks! This afternoon I'm going to my friend's wedding.
    - speaker: Mohamed
      text: Neng ngendi?
      ar_eg: فين؟
      ar: أين؟
      en: Where?
    - speaker: Sari
      text: Neng Sarangan. Aku ora ngerti dalané.
      ar_eg: في سارانجان. أنا مش عارفة الطريق.
      ar: في سارانغان، ولا أعرف الطريق.
      en: In Sarangan. I don't know the way.
    - speaker: Mohamed
      text: Ayo, tak kancani!
      ar_eg: يلا، هاجي معاكي!
      ar: هيا، سأرافقك!
      en: Come on, I'll go with you!
