schema: kabar.lesson/v1
id: j4.u06.l02
language: jv
title: Ratu lan abdi
can_do:
  ar_eg: تلاحظ krama andhap على لسان الخدّامين.
  ar: أن تلحظ krama andhap في كلام الخدم.
  en: Notice andhap from servants.
slides:
  - title: Ratu lan abdi
    body:
      ar_eg: |
        في الوايانغ وفي قصر السلطان فيه ratu (ملك أو ملكة) وabdi (خدّام). الخدّام بينادي الملك Gusti (يا مولاي).
        - الملك للخدّام: ngoko عادي، وبيدّي أوامر (dhawuh).
        - الخدّام للملك: كراما، وفعله هو krama andhap (matur، sowan، nyuwun، ngaturaken)، وفعل الملك krama inggil (ngendika، tindak، dhahar).
        يعني الخدّام بينزّل نفسه وبيرفع الملك في نفس الجملة.
      ar: |
        في الوايانغ وفي بلاط السلطان ratu (ملك أو ملكة) وabdi (خادم)، والخادم ينادي الملك Gusti (يا مولاي).
        - الملك للخادم: ngoko، ويُصدر الأوامر (dhawuh).
        - الخادم للملك: كراما، يجعل فعله krama andhap (matur، sowan، nyuwun، ngaturaken)، وفعل الملك krama inggil (ngendika، tindak، dhahar).
        فيخفض نفسه ويرفع الملك في الجملة نفسها.
      en: |
        In wayang and at the Sultan's court there's the ratu (king or queen) and the abdi (servant). The servant calls the king Gusti (my lord).
        - king to servant: plain ngoko, giving orders (dhawuh).
        - servant to king: krama, with krama andhap for his own actions (matur, sowan, nyuwun, ngaturaken) and krama inggil for the king's (ngendika, tindak, dhahar).
        The servant lowers himself and raises the king in one sentence.
    grammar: jv.krama-andhap
    examples:
      - text: Gusti, kula badhe matur.
        ar_eg: يا مولاي، عايز أعرض على سيادتك حاجة.
        ar: يا مولاي، أودّ أن أعرض عليكم أمرًا.
        en: My lord, I wish to tell you something.
      - text: Gusti badhe tindak dhateng pundi?
        ar_eg: مولاي رايح على فين؟
        ar: إلى أين يتوجّه مولاي؟
        en: Where is my lord going?
  - title: Sendika dhawuh
    body:
      ar_eg: |
        لما الملك يدّي أمر، الخدّام بيرد بجملة واحدة ثابتة: «Sendika dhawuh, Gusti» = أمرك يا مولاي / سمعًا وطاعة.
        dhawuh عرفتها: أمر أو كلام الكبير. وهتسمعها لحد النهارده بهزار بين الصحاب لما حد يطلب حاجة: «Sendika dhawuh!»
      ar: |
        إذا أمر الملك أجاب الخادم بعبارة ثابتة: «Sendika dhawuh, Gusti» = أمرك يا مولاي / سمعًا وطاعة.
        وdhawuh عرفتها: أمر الكبير أو كلامه. وما زالت تُقال اليوم مزاحًا بين الأصدقاء: «Sendika dhawuh!»
      en: |
        When the king gives an order, the servant answers with one fixed phrase: "Sendika dhawuh, Gusti" = At your command, my lord.
        You know dhawuh: an elder's order or word. People still say it today, jokingly, when a friend asks for something: "Sendika dhawuh!"
    grammar: jv.krama-andhap
    examples:
      - text: Sendika dhawuh, Gusti.
        ar_eg: أمرك يا مولاي.
        ar: سمعًا وطاعة يا مولاي.
        en: At your command, my lord.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ratu
        ar_eg: ملك / ملكة
        ar: ملك / ملكة
        en: king, queen, ruler
      - text: abdi
        ar_eg: خدّام
        ar: خادم
        en: servant
      - text: gusti
        ar_eg: مولاي / سيدي (للملك)
        ar: مولاي (للملك)
        en: lord, my lord
      - text: sendika dhawuh
        ar_eg: أمرك / سمعًا وطاعة
        ar: سمعًا وطاعة
        en: at your command
    words: [ratu, abdi, gusti, sendika dhawuh]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الملك ادّى أمر. الخدّام يرد يقول إيه؟
      ar: أصدر الملك أمرًا. بمَ يجيب الخادم؟
      en: The king gives an order. What does the servant say?
    options: ['Iya, Ratu.', 'Sendika dhawuh, Gusti.', 'Ya wis, Gusti.']
    answer: 1
    explain:
      ar_eg: "الرد الثابت على أمر الملك: Sendika dhawuh، Gusti."
      ar: "الجواب الثابت لأمر الملك: Sendika dhawuh، Gusti."
      en: "The fixed reply to a royal order: Sendika dhawuh, Gusti."
    words: [sendika dhawuh, gusti]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الخدّام عايز يقول للملك حاجة. أنهي فعل؟
      ar: يريد الخادم أن يقول للملك شيئًا. أي فعل؟
      en: The servant wants to tell the king something. Which verb?
    options: [ngendika, sanjang, matur]
    answer: 2
    explain:
      ar_eg: "الخدّام بينزّل نفسه: matur (krama andhap). ngendika للملك لما هو يتكلم، وsanjang للي زيك."
      ar: الخادم يتواضع فيقول matur، وngendika لكلام الملك، وsanjang للأقران.
      en: The servant lowers himself, so matur (krama andhap). ngendika is for the king speaking; sanjang is for equals.
    words: [abdi]
  - id: e04
    type: listen
    text: Gusti, kula badhe matur.
    options: ['Gusti, kula badhe matur.', 'Gusti, kula badhe sowan.', 'Gusti, kula badhe ngendika.']
    answer: 0
    meaning:
      ar_eg: يا مولاي، عايز أعرض على سيادتك حاجة.
      ar: يا مولاي، أودّ أن أعرض عليكم أمرًا.
      en: My lord, I wish to tell you something.
    words: [gusti]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "الملك بيقول للخدّام: «Kowe menyanga pasar saiki!» أنهي مستوى؟"
      ar: "يقول الملك للخادم: «Kowe menyanga pasar saiki!» أي مستوى؟"
      en: "The king tells the servant: «Kowe menyanga pasar saiki!» Which level?"
    options: [krama alus, ngoko, krama lugu]
    answer: 1
    explain:
      ar_eg: الملك للخدّام بيتكلم ngoko عادي.
      ar: الملك يكلّم الخادم بالـ ngoko.
      en: The king speaks plain ngoko to his servant.
    words: [ratu, abdi]
  - id: e06
    type: fill_blank
    sentence: Sendika ___, Gusti.
    meaning:
      ar_eg: أمرك يا مولاي.
      ar: سمعًا وطاعة يا مولاي.
      en: At your command, my lord.
    options: [matur, dhawuh, ngendika]
    answers: [dhawuh]
    words: [sendika dhawuh]
  - id: e07
    type: fill_blank
    sentence: Kula badhe ___ Gusti Ratu.
    meaning:
      ar_eg: هروح أتشرّف بزيارة جلالة الملكة.
      ar: سأتشرّف بزيارة جلالة الملكة.
      en: I'm going to call on Her Majesty.
    options: [rawuh, tindak, sowan]
    answers: [sowan]
    explain:
      ar_eg: إنت اللي رايح للملكة، يبقى sowan (krama andhap). rawuh وtindak ليها هي.
      ar: أنت الذاهب إليها فتقول sowan، وrawuh وtindak لها هي.
      en: You are going to her, so sowan (krama andhap). rawuh and tindak are for her.
    words: [ratu, gusti]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الخدّام بيعرض على الملك.
      ar: الخادم يعرض على الملك.
      en: The servant reports to the king.
    answer: Abdi matur dhateng ratu.
    distractors: [ngendika, kowe]
    words: [abdi, ratu]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (الخدّام للملك) أمرك يا مولاي.
      ar: (الخادم للملك) سمعًا وطاعة يا مولاي.
      en: (servant to king) At your command, my lord.
    answers: ['Sendika dhawuh, Gusti.', 'Gusti, sendika dhawuh.']
    words: [sendika dhawuh, gusti]
  - id: e10
    type: speaking
    text: Nyuwun pangapunten, Gusti. Kula badhe matur.
    meaning:
      ar_eg: العفو يا مولاي. عايز أعرض على سيادتك حاجة.
      ar: العفو يا مولاي. أودّ أن أعرض عليكم أمرًا.
      en: Forgive me, my lord. I wish to tell you something.
    words: [gusti]
dialogue:
  title: Rama lan Hanoman
  lines:
    - speaker: Rama
      text: Hanoman, kowe menyanga Alengka. Sinta ana ing kana.
      ar_eg: يا هانومان، روح ألينغكا. سينتا هناك.
      ar: يا هانومان، اذهب إلى ألينغكا. سينتا هناك.
      en: Hanoman, go to Alengka. Sinta is there.
    - speaker: Hanoman
      text: Sendika dhawuh, Gusti.
      ar_eg: أمرك يا مولاي.
      ar: سمعًا وطاعة يا مولاي.
      en: At your command, my lord.
    - speaker: Hanoman
      text: Gusti, kula nyuwun pamit rumiyin.
      ar_eg: يا مولاي، أستأذن أنا.
      ar: يا مولاي، أستأذنكم في الانصراف.
      en: My lord, I ask leave to go.
    - speaker: Rama
      text: Iya. Ati-ati, Hanoman.
      ar_eg: ماشي. خلّي بالك يا هانومان.
      ar: حسنًا. انتبه لنفسك يا هانومان.
      en: Go. Take care, Hanoman.
    - speaker: Hanoman
      text: Inggih, Gusti. Matur nuwun.
      ar_eg: حاضر يا مولاي. شكرًا.
      ar: نعم يا مولاي. شكرًا.
      en: Yes, my lord. Thank you.
new_words:
  - word: ratu
    pos: noun
    ar_eg: ملك / ملكة (الحاكم)
    ar: ملك / ملكة (الحاكم)
    en: king, queen, ruler = raja, ratu
  - word: abdi
    pos: noun
    ar_eg: خدّام
    ar: خادم
    en: servant = abdi, pelayan
  - word: gusti
    pos: noun
    ar_eg: مولاي / سيدي (للملك والنبلاء)
    ar: مولاي (للملك والنبلاء)
    en: lord, my lord (for royalty and nobles) = gusti, tuan
  - word: sendika dhawuh
    pos: phrase
    ar_eg: أمرك / سمعًا وطاعة
    ar: سمعًا وطاعة
    en: at your command = siap, laksanakan
