dialogue:
  lines:
    - speaker: Mohamed
      text: Pak Sastro, panjenengan saben dinten seba dhateng Kraton?
      ar_eg: يا پاك ساسترو، حضرتك بتحضر في القصر كل يوم؟
      ar: يا باك ساسترو، هل تحضر في القصر كل يوم؟
      en: Pak Sastro, do you attend at the Kraton every day?
    - speaker: Pak Sastro
      text: Inggih, Nak. Kula abdi dalem.
      ar_eg: أيوه يا ابني. أنا من خدم القصر.
      ar: نعم يا بنيّ، أنا من خدم القصر.
      en: Yes, son. I'm an abdi dalem.
    - speaker: Mohamed
      text: Prajurit ingkang wonten regol menika sinten?
      ar_eg: والجنود اللي عند البوابة دول مين؟
      ar: ومَن هؤلاء الجنود عند البوابة؟
      en: And who are the soldiers at the gate?
    - speaker: Pak Sastro
      text: Menika prajurit kraton, Nak.
      ar_eg: دول حرس القصر يا ابني.
      ar: هؤلاء حرس القصر يا بنيّ.
      en: Those are the palace guards, son.
    - speaker: Mohamed
      text: Benjang kula pinanggih panjenengan wonten bangsal, nggih?
      ar_eg: بكرة أقابل حضرتك في القاعة، ماشي؟
      ar: ألقاك غدًا في القاعة، أليس كذلك؟
      en: Shall I meet you in the pavilion tomorrow?
    - speaker: Pak Sastro
      text: Mangga, Nak. Ngagem surjan, nggih!
      ar_eg: ماشي يا ابني. والبس سورجان!
      ar: حسنًا يا بنيّ. والبس السورجان!
      en: Of course, son. Wear a surjan!
