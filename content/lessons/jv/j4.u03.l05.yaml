schema: kabar.lesson/v1
id: j4.u03.l05
language: jv
title: Seba ing Kraton
can_do:
  ar_eg: 'تزور قصر يوجيا: تعرف البوابة والقاعات والحرس، وتقول إنك قابلت حد هناك.'
  ar: 'أن تزور قصر يوغيا: تعرف البوابة والقاعات والحرس، وتقول إنك قابلت أحدًا هناك.'
  en: 'Visit the Yogya palace: name its gates, halls and guards, and say you met someone there.'
slides:
  - title: Kraton, regol, bangsal
    body:
      ar_eg: |
        - kraton = قصر السلطان في يوجيا. sultan = السلطان، وprajurit = جنود حرس القصر بلبسهم الملوّن.
        - regol = البوابة، bangsal = القاعة المفتوحة جوه القصر (سقف على أعمدة).
        - seba = يحضر عند السلطان ويقعد في خدمته، زي ما abdi dalem بيعملوا كل يوم.
        - pinanggih = يقابل (كراما): «Kula pinanggih Pak Sastro wonten regol.»
        - surjan = قميص يوجيا التقليدي للرجالة، مقلّم، بيلبسه abdi dalem مع blangkon.
      ar: |
        - kraton = قصر السلطان في يوغيا. sultan = السلطان، وprajurit = جنود حرس القصر بزيّهم الملوّن.
        - regol = البوابة، bangsal = القاعة المفتوحة داخل القصر (سقف على أعمدة).
        - seba = يحضر مجلس السلطان ويكون في خدمته، كما يفعل abdi dalem كل يوم.
        - pinanggih = يلتقي (كراما): «Kula pinanggih Pak Sastro wonten regol.»
        - surjan = قميص يوغيا التقليدي للرجال، مقلّم، يلبسه abdi dalem مع blangkon.
      en: |
        - kraton = the Sultan's palace in Yogya. sultan = the Sultan, and prajurit = the palace guards in their bright uniforms.
        - regol = gate, bangsal = open pavilion hall inside the palace (a roof on pillars).
        - seba = attend on the Sultan, present yourself at court, as the abdi dalem do every day.
        - pinanggih = meet (krama): "Kula pinanggih Pak Sastro wonten regol."
        - surjan = Yogya's traditional striped men's shirt, worn by abdi dalem with a blangkon.
    examples:
      - text: Abdi dalem seba dhateng Kraton.
        ar_eg: الخدم بيحضروا عند السلطان في القصر.
        ar: يحضر خدم القصر مجلس السلطان.
        en: The palace retainers attend at the Kraton.
      - text: Prajurit kraton ngadeg ing regol.
        ar_eg: حرس القصر واقفين عند البوابة.
        ar: يقف حرس القصر عند البوابة.
        en: The palace guards stand at the gate.
      - text: Kula pinanggih Pak Sastro wonten bangsal.
        ar_eg: قابلت پاك ساسترو في القاعة.
        ar: التقيتُ باك ساسترو في القاعة.
        en: I met Pak Sastro in the pavilion.
