schema: kabar.lesson/v1
id: j3.u06.l01
language: jv
title: Dipun-, -ipun
can_do:
  ar_eg: تقرا المبني للمجهول والملكية في الكراما.
  ar: أن تقرأ صيغ المبني للمجهول والملكية في الكراما.
  en: Read krama passives and possessives.
slides:
  - title: -e / -ne → -ipun / -nipun
    body:
      ar_eg: |
        أهلًا بيك في Laweyan، حي تجار الباتيك القدام في سولو. في الكراما مش الكلمات بس اللي بتتغير — اللواحق كمان.
        -e / -ne (= -nya في الإندونيسي) بتبقى في الكراما:
        - **-ipun** بعد حرف ساكن: batik → batikipun، kabar → kabaripun
        - **-nipun** بعد حرف متحرك: regi → reginipun، griya → griyanipun
        إنت قابلتهم قبل كده من غير ما تاخد بالك: Reginipun pinten? Pripun kabaripun? Asmanipun sinten? أهو ده السر!
      ar: |
        مرحبًا بك في Laweyan، حي تجار الباتيك القديم في سولو. وفي الكراما لا تتغير المفردات وحدها، بل اللواحق أيضًا.
        تصير -e / -ne (= -nya في الإندونيسية) في الكراما:
        - **-ipun** بعد الساكن: batik → batikipun، kabar → kabaripun
        - **-nipun** بعد الصائت: regi → reginipun، griya → griyanipun
        وقد قابلتها من قبل: Reginipun pinten? Pripun kabaripun? Asmanipun sinten? وهذا سرّها.
      en: |
        Welcome to Laweyan, Solo's old batik merchants' quarter. In krama it's not only words that change — the endings do too.
        -e / -ne (= Indonesian -nya) becomes:
        - **-ipun** after a consonant: batik → batikipun, kabar → kabaripun
        - **-nipun** after a vowel: regi → reginipun, griya → griyanipun
        You've already met them without noticing: Reginipun pinten? Pripun kabaripun? Asmanipun sinten? Now you know the secret!
    grammar: jv.krama.affixes
    examples:
      - text: Griyanipun ageng sanget.
        ar_eg: البيت كبير أوي. (omahe gedhe banget)
        ar: البيت كبير جدًا. (omahe gedhe banget)
        en: The house is very big. (omahe gedhe banget)
      - text: Batikipun sae.
        ar_eg: الباتيك حلو. (batike apik)
        ar: الباتيك جميل. (batike apik)
        en: The batik is nice. (batike apik)
  - title: di- → dipun-
    body:
      ar_eg: |
        المبني للمجهول di- (زي di- الإندونيسي) في الكراما بيبقى **dipun-**، والفعل نفسه كمان بيبقى كراما:
        - diwaca (اتقرا، dibaca) → **dipunwaos** (waos = waca بالكراما)
        - digawe (اتعمل، dibuat) → **dipundamel** (damel = gawe بالكراما)
        في الكلام اليومي ناس كتير بتقول di- حتى في الكراما: didamel. dipun- أرسمى، للكتابة والخطب.
        زي «اتعمل» العامية و«صُنِع» الفصحى: نفس المعنى، بس الصيغة أرسمى.
      ar: |
        تصير أداة المبني للمجهول di- (كـ di- الإندونيسية) في الكراما **dipun-**، ويتحول الفعل نفسه إلى الكراما:
        - diwaca (قُرئ، dibaca) → **dipunwaos** (waos = waca بالكراما)
        - digawe (صُنع، dibuat) → **dipundamel** (damel = gawe بالكراما)
        وفي الكلام اليومي يبقي كثيرون di- حتى في الكراما: didamel، وdipun- أرسم وأكثر في الكتابة والخطب.
        وهي كالفرق بين «اتعمل» العامية و«صُنِع» الفصيحة.
      en: |
        The passive di- (same as Indonesian di-) becomes **dipun-** in krama, and the verb itself goes krama too:
        - diwaca (was read, dibaca) → **dipunwaos** (waos = krama waca)
        - digawe (was made, dibuat) → **dipundamel** (damel = krama gawe)
        In everyday speech many people keep di- even in krama: didamel. dipun- is more formal — writing and speeches.
        Like Egyptian «اتعمل» vs Fusha «صُنِع»: same meaning, more formal shape.
    grammar: jv.krama.affixes
    examples:
      - text: Batikipun dipundamel wonten Laweyan.
        ar_eg: الباتيك ده اتعمل في لاوييان.
        ar: صُنع هذا الباتيك في لاوييان.
        en: The batik was made in Laweyan.
      - text: Bukunipun sampun dipunwaos.
        ar_eg: الكتاب اتقرا خلاص.
        ar: قد قُرئ الكتاب.
        en: The book has already been read.
  - title: tak- → kula + kriya
    body:
      ar_eg: |
        فاكر «Sek tak lapor pusat» من J1؟ tak- (أنا هعمل) مالهاش نسخة كراما. بدالها: **kula + الفعل**.
        - Bukune wis tak waca. → Bukunipun sampun kula waos. = الكتاب قريته خلاص.
        - kok- (إنت عملت) → **sampeyan / panjenengan + الفعل**.
        و-i غالبًا بتفضل زي ما هي.
      ar: |
        أتذكر «Sek tak lapor pusat» من J1؟ لا نظير لـ tak- (سأفعل أنا) في الكراما، بل يقال **kula + الفعل**:
        - Bukune wis tak waca. → Bukunipun sampun kula waos. = قرأتُ الكتاب.
        - وتصير kok- (فعلتَ أنت) **sampeyan / panjenengan + الفعل**.
        وتبقى -i في الغالب كما هي.
      en: |
        Remember "Sek tak lapor pusat" from J1? tak- (I do / I'll do) has no krama form. Use **kula + verb** instead:
        - Bukune wis tak waca. → Bukunipun sampun kula waos. = I've already read the book.
        - kok- (you did) → **sampeyan / panjenengan + verb**.
        -i usually stays -i.
    grammar: jv.krama.affixes
    examples:
      - text: Bukunipun sampun kula waos.
        ar_eg: الكتاب قريته خلاص.
        ar: قرأتُ الكتاب.
        en: I've already read the book.
  - title: Ngoko → krama
    body:
      ar_eg: |
        جملة نغوكو كاملة بتتحول كراما كلمة كلمة، واللواحق معاها:
        - Batike digawe nang Laweyan. → **Batikipun dipundamel wonten Laweyan.**
        batike → batikipun، digawe → dipundamel، nang → wonten.
        ودي -nya الإندونيسية في الحالتين: Batiknya dibuat di Laweyan.
      ar: |
        تتحول جملة النغوكو إلى الكراما كلمة كلمة، ومعها اللواحق:
        - Batike digawe nang Laweyan. → **Batikipun dipundamel wonten Laweyan.**
        batike → batikipun، وdigawe → dipundamel، وnang → wonten.
        وبالإندونيسية: Batiknya dibuat di Laweyan.
      en: |
        A ngoko sentence turns krama word by word, endings included:
        - Batike digawe nang Laweyan. → **Batikipun dipundamel wonten Laweyan.**
        batike → batikipun, digawe → dipundamel, nang → wonten.
        In Indonesian: Batiknya dibuat di Laweyan.
    grammar: jv.krama.affixes
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: batikipun
        ar_eg: الباتيك (batike / batiknya)
        ar: الباتيك (batike / batiknya)
        en: the batik (batike / batiknya)
      - text: griyanipun
        ar_eg: البيت (omahe / rumahnya)
        ar: البيت (omahe / rumahnya)
        en: the house (omahe / rumahnya)
      - text: dipunwaos
        ar_eg: اتقرا (diwaca / dibaca)
        ar: قُرئ (diwaca / dibaca)
        en: was read (diwaca / dibaca)
      - text: dipundamel
        ar_eg: اتعمل (digawe / dibuat)
        ar: صُنع (digawe / dibuat)
        en: was made (digawe / dibuat)
    words: [batik, griya, waos, damel]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: regi (سعر) + -ne بالكراما = ؟
      ar: regi (سعر) + -ne بالكراما = ؟
      en: regi (price) + krama "-ne" = ?
    options: [regine, regiipun, reginipun]
    answer: 2
    explain:
      ar_eg: 'regi بتخلص بحرف متحرك (i)، يبقى -nipun: reginipun.'
      ar: 'تنتهي regi بصائت، فتأخذ -nipun: reginipun.'
      en: 'regi ends in a vowel, so it takes -nipun: reginipun.'
    words: [regi]
  - id: e03
    type: listen
    text: Batikipun dipundamel wonten Laweyan.
    options: [Batikipun dipundamel wonten Laweyan., Batike digawe nang Laweyan., Bukunipun dipunwaos wonten Laweyan.]
    answer: 0
    words: [batik, damel]
  - id: e04
    type: fill_blank
    sentence: Bukunipun sampun ___.
    meaning:
      ar_eg: الكتاب اتقرا خلاص.
      ar: قد قُرئ الكتاب.
      en: The book has already been read.
    options: [dipunwaca, diwaca, dipunwaos]
    answers: [dipunwaos]
    explain:
      ar_eg: 'في الكراما الفعل نفسه بيتغير (waca → waos) وdi- → dipun-: dipunwaos. «dipunwaca» خلطة.'
      ar: 'في الكراما يتغير الفعل (waca → waos) وتصير di- dipun-: dipunwaos، أما «dipunwaca» فخليط.'
      en: 'In krama the verb changes too (waca → waos) and di- → dipun-: dipunwaos. "dipunwaca" is a mix.'
    words: [waos]
  - id: e05
    type: build_sentence
    source:
      ar_eg: الباتيك اتعمل في لاوييان.
      ar: صُنع الباتيك في لاوييان.
      en: The batik was made in Laweyan.
    answer: Batikipun dipundamel wonten Laweyan.
    distractors: [digawe, batike, nang]
    words: [batik, damel]
  - id: e06
    type: speaking
    text: Griyanipun Pak Harjo ageng sanget.
    meaning:
      ar_eg: بيت الحاج هارجو كبير أوي.
      ar: بيت السيد هارجو كبير جدًا.
      en: Pak Harjo's house is very big.
    words: [griya, ageng]
dialogue:
  title: Wonten Laweyan
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Pak Harjo. Batikipun sae sanget!
      ar_eg: لا مؤاخذة يا حاج هارجو. الباتيك حلو أوي!
      ar: عفوًا يا سيد هارجو. الباتيك جميل جدًا!
      en: Excuse me, Pak Harjo. The batik is beautiful!
    - speaker: Pak Harjo
      text: Matur nuwun, Mas. Batik menika dipundamel wonten griya kula.
      ar_eg: شكرًا يا ابني. الباتيك ده اتعمل في بيتي.
      ar: شكرًا يا بني. صُنع هذا الباتيك في بيتي.
      en: Thank you. This batik was made in my house.
    - speaker: Mohamed
      text: Griyanipun ageng sanget, Pak.
      ar_eg: البيت كبير أوي يا حاج.
      ar: البيت كبير جدًا يا سيدي.
      en: The house is very big, sir.
    - speaker: Pak Harjo
      text: Inggih, Mas. Menika griya saudagar batik.
      ar_eg: أيوه يا ابني. ده بيت تاجر باتيك.
      ar: نعم يا بني. هذا بيت تاجر باتيك.
      en: Yes. This is a batik merchant's house.
    - speaker: Mohamed
      text: Saudagar menika tiyang dagang, nggih, Pak?
      ar_eg: saudagar يعني تاجر، صح يا حاج؟
      ar: saudagar يعني تاجرًا، أليس كذلك يا سيدي؟
      en: A saudagar is a trader, right, sir?
    - speaker: Pak Harjo
      text: Inggih, leres, Mas!
      ar_eg: أيوه، صح يا ابني!
      ar: نعم، صحيح يا بني!
      en: Yes, that's right!
new_words:
  - word: -ipun / -nipun
    pos: particle
    ar_eg: 'لاحقة الكراما لـ -e / -ne (= -nya): -ipun بعد ساكن، -nipun بعد متحرك'
    ar: 'لاحقة الكراما مقابل -e / -ne (= -nya): -ipun بعد الساكن و-nipun بعد الصائت'
    en: krama suffix for -e / -ne (= -nya); -ipun after a consonant, -nipun after a vowel
  - word: dipun-
    pos: particle
    ar_eg: بادئة المبني للمجهول في الكراما (di-)
    ar: سابقة المبني للمجهول في الكراما (di-)
    en: krama passive prefix (di-)
  - word: damel
    pos: verb
    ar_eg: يعمل / يصنع (gawe ← buat)، كراما
    ar: يصنع (gawe ← buat)، كراما
    en: to make (ngoko gawe, Indonesian buat), krama
  - word: waos
    pos: verb
    ar_eg: يقرا (waca ← baca)، كراما
    ar: يقرأ (waca ← baca)، كراما
    en: to read (ngoko waca, Indonesian baca), krama
  - word: ageng
    pos: adjective
    ar_eg: كبير (gedhe ← besar)، كراما
    ar: كبير (gedhe ← besar)، كراما
    en: big (ngoko gedhe, Indonesian besar), krama
  - word: saudagar
    pos: noun
    ar_eg: تاجر كبير
    ar: تاجر ثري
    en: (wealthy) merchant
  - word: tiyang
    pos: noun
    ar_eg: شخص / ناس (wong ← orang)، كراما
    ar: شخص / ناس (wong ← orang)، كراما
    en: person, people (ngoko wong, Indonesian orang), krama
  - word: leres
    pos: adjective
    ar_eg: صح (bener ← benar)، كراما
    ar: صحيح (bener ← benar)، كراما
    en: right, correct (ngoko bener, Indonesian benar), krama
