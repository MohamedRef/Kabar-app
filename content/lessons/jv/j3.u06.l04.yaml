schema: kabar.lesson/v1
id: j3.u06.l04
language: jv
title: Ulangan J3.6
can_do:
  ar_eg: تحوّل فقرة نغوكو لكراما.
  ar: أن تحوّل فقرة من النغوكو إلى الكراما.
  en: Convert a ngoko paragraph to krama.
slides:
  - title: Saking ngoko dhateng krama
    body:
      ar_eg: |
        عشان تحوّل فقرة نغوكو لكراما، امشي على ٣ خطوات:
        ١. الكلمات: aku → kula، saka → saking، arep → badhé، tuku → tumbas، omah → griya، rega → regi، larang → awis، gawé → damel، suwé → dangu، merga → amargi.
        ٢. اللواحق: -é / -né → -ipun / -nipun، di- → dipun-، -aké → -aken، tak- → kula + الفعل.
        ٣. راجع: مافيش ولا كلمة نغوكو فاضلة؟
        Aku arep tuku batik. → Kula badhé tumbas batik.
        Batiké digawé nang Laweyan. → Batikipun dipundamel wonten Laweyan.
      ar: |
        لتحويل فقرة من النغوكو إلى الكراما اتبع ثلاث خطوات:
        ١. المفردات: aku → kula، saka → saking، arep → badhé، tuku → tumbas، omah → griya، rega → regi، larang → awis، gawé → damel، suwé → dangu، merga → amargi.
        ٢. اللواحق: -é / -né → -ipun / -nipun، وdi- → dipun-، و-aké → -aken، وtak- → kula + الفعل.
        ٣. المراجعة: ألم تبقَ كلمة من النغوكو؟
        Aku arep tuku batik. → Kula badhé tumbas batik.
        Batiké digawé nang Laweyan. → Batikipun dipundamel wonten Laweyan.
      en: |
        To turn a ngoko paragraph into krama, go in three steps:
        1. Words: aku → kula, saka → saking, arep → badhé, tuku → tumbas, omah → griya, rega → regi, larang → awis, gawé → damel, suwé → dangu, merga → amargi.
        2. Affixes: -é / -né → -ipun / -nipun, di- → dipun-, -aké → -aken, tak- → kula + verb.
        3. Check: is any ngoko word left?
        Aku arep tuku batik. → Kula badhé tumbas batik.
        Batiké digawé nang Laweyan. → Batikipun dipundamel wonten Laweyan.
    grammar: jv.krama.affixes
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dipundamel
        ar_eg: اتعمل (digawé)
        ar: صُنع (digawé)
        en: was made (digawé)
      - text: dipunwaos
        ar_eg: اتقرا (diwaca)
        ar: قُرئ (diwaca)
        en: was read (diwaca)
      - text: tumbasaken
        ar_eg: يشتري لحد (tukokaké)
        ar: يشتري لغيره (tukokaké)
        en: buy for someone (tukokaké)
      - text: reginipun
        ar_eg: السعر (regané)
        ar: السعر (regané)
        en: the price (regané)
    words: [damel, waos, tumbasaken, regi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: kabar + -é بالكراما = ؟
      ar: kabar + -é بالكراما = ؟
      en: kabar + krama "-é" = ?
    options: [kabarnipun, kabaré, kabaripun]
    answer: 2
    explain:
      ar_eg: 'kabar بتخلص بساكن (r)، يبقى -ipun: kabaripun — زي Pripun kabaripun؟ وkabar أصلها العربي «خبر».'
      ar: 'تنتهي kabar بساكن فتأخذ -ipun: kabaripun، كما في Pripun kabaripun؟ وkabar من العربية «خبر».'
      en: 'kabar ends in a consonant, so -ipun: kabaripun — as in Pripun kabaripun? (kabar is Arabic «خبر».)'
    words: [kabar]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي تحويل صح لـ «Bukuné wis tak waca»؟
      ar: أي تحويل صحيح لـ «Bukuné wis tak waca»؟
      en: Which is the right krama version of "Bukuné wis tak waca"?
    options: [Bukunipun sampun kula waos., Bukuné sampun kula waca., Bukunipun sampun tak waos.]
    answer: 0
    explain:
      ar_eg: tak- مالهاش كراما → kula + waos، وbukuné → bukunipun، وwis → sampun.
      ar: لا نظير لـ tak- في الكراما، فيقال kula waos، وbukuné → bukunipun، وwis → sampun.
      en: tak- has no krama form → kula waos; bukuné → bukunipun; wis → sampun.
    words: [waos, sampun]
  - id: e04
    type: listen
    text: Reginipun awis, amargi damelipun dangu.
    options: ['Reginipun awis, amargi damelipun dangu.', 'Reginipun mirah, amargi damelipun dangu.', 'Regané larang, merga gawéné suwé.']
    answer: 0
    words: [regi, awis, amargi, dangu]
  - id: e05
    type: fill_blank
    sentence: Batikipun ___ wonten Laweyan.
    meaning:
      ar_eg: الباتيك اتعمل في لاوييان.
      ar: صُنع الباتيك في لاوييان.
      en: The batik was made in Laweyan.
    options: [digawé, dipungawé, dipundamel]
    answers: [dipundamel]
    explain:
      ar_eg: 'gawé → damel، وdi- → dipun-: dipundamel. «dipungawé» خلطة كراما على نغوكو.'
      ar: 'gawé → damel، وdi- → dipun-: dipundamel، و«dipungawé» خليط.'
      en: 'gawé → damel and di- → dipun-: dipundamel. "dipungawé" mixes levels.'
    words: [damel]
  - id: e06
    type: fill_blank
    sentence: Kula ___ batik kangge ibu kula.
    meaning:
      ar_eg: بشتري باتيك لماما.
      ar: أشتري باتيكًا لأمي.
      en: I'm buying batik for my mother.
    options: [tumbasaken, tumbasaké, tukokaké]
    answers: [tumbasaken]
    words: [tumbasaken]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (حوّل للكراما) Aku arep tuku batik.
      ar: (حوّل إلى الكراما) Aku arep tuku batik.
      en: (turn into krama) Aku arep tuku batik.
    answer: Kula badhé tumbas batik.
    distractors: [aku, arep, tuku]
    words: [kula, badhé, tumbas]
  - id: e08
    type: build_sentence
    source:
      ar_eg: (حوّل للكراما) Omahé Pak Harjo gedhé banget.
      ar: (حوّل إلى الكراما) Omahé Pak Harjo gedhé banget.
      en: (turn into krama) Omahé Pak Harjo gedhé banget.
    answer: Griyanipun Pak Harjo ageng sanget.
    distractors: [omahé, gedhé, banget]
    words: [griya, ageng, sanget]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (حوّل للكراما) Aku saka Kairo.
      ar: (حوّل إلى الكراما) Aku saka Kairo.
      en: (turn into krama) Aku saka Kairo.
    answers: [Kula saking Kairo., Kula saking Kairo]
    words: [kula, saking]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (حوّل للكراما) Batiké digawé nang omahé Pak Harjo.
      ar: (حوّل إلى الكراما) Batiké digawé nang omahé Pak Harjo.
      en: (turn into krama) Batiké digawé nang omahé Pak Harjo.
    answers: [Batikipun dipundamel wonten griyanipun Pak Harjo., Batikipun dipundamel wonten griyanipun Pak Harjo, Batikipun didamel wonten griyanipun Pak Harjo., Batikipun didamel wonten griyanipun Pak Harjo, Batikipun dipundamel wonten griya Pak Harjo., Batikipun dipundamel wonten griya Pak Harjo]
    explain:
      ar_eg: batiké → batikipun، digawé → dipundamel (أو didamel في الكلام)، nang → wonten، omahé → griyanipun.
      ar: batiké → batikipun، وdigawé → dipundamel (أو didamel في الكلام)، وnang → wonten، وomahé → griyanipun.
      en: batiké → batikipun, digawé → dipundamel (spoken didamel), nang → wonten, omahé → griyanipun.
    words: [batik, damel, wonten, griya]
  - id: e11
    type: dictation
    text: Batikipun dipundamel wonten Laweyan.
    meaning:
      ar_eg: الباتيك اتعمل في لاوييان.
      ar: صُنع الباتيك في لاوييان.
      en: The batik was made in Laweyan.
    words: [batik, damel]
  - id: e12
    type: speaking
    text: Kula saking Kairo. Kula badhé tumbas batik wonten Laweyan. Reginipun awis, amargi damelipun dangu.
    meaning:
      ar_eg: أنا من القاهرة. عايز أشتري باتيك في لاوييان. سعره غالي، عشان عمله بياخد وقت طويل.
      ar: أنا من القاهرة. أريد أن أشتري باتيكًا في لاوييان. ثمنه غالٍ لأن صنعه يستغرق وقتًا طويلًا.
      en: I'm from Cairo. I want to buy batik in Laweyan. It's expensive, because it takes a long time to make.
    words: [saking, tumbas, regi, awis, amargi, dangu]
dialogue:
  title: Pamit saking Laweyan
  lines:
    - speaker: Mohamed
      text: Pak Harjo, batikipun sampun kula tumbas.
      ar_eg: يا حاج هارجو، اشتريت الباتيك خلاص.
      ar: يا سيد هارجو، اشتريتُ الباتيك.
      en: Pak Harjo, I've bought the batik.
    - speaker: Pak Harjo
      text: Saé, Mas. Batik menika kangge sinten?
      ar_eg: حلو يا ابني. الباتيك ده لمين؟
      ar: حسنٌ يا بني. لمن هذا الباتيك؟
      en: Good. Who is this batik for?
    - speaker: Mohamed
      text: Kangge ibu kula wonten Kairo.
      ar_eg: لماما في القاهرة.
      ar: لأمي في القاهرة.
      en: For my mother in Cairo.
    - speaker: Pak Harjo
      text: Saé sanget. Batikipun dipundamel wonten Laweyan, kangge ibu saking Mesir!
      ar_eg: حلو أوي. باتيك معمول في لاوييان، لأم من مصر!
      ar: جميل جدًا. باتيك صُنع في لاوييان لأمٍّ من مصر!
      en: Lovely. Batik made in Laweyan, for a mother from Egypt!
    - speaker: Mohamed
      text: Inggih, Pak. Matur nuwun sanget.
      ar_eg: أيوه يا حاج. شكرًا جزيلًا.
      ar: نعم يا سيدي. شكرًا جزيلًا.
      en: Yes, sir. Thank you very much.
    - speaker: Pak Harjo
      text: Sami-sami, Mas Mohamed.
      ar_eg: العفو يا محمد.
      ar: عفوًا يا محمد.
      en: You're welcome, Mohamed.
souvenir:
  id: j3.u06.souvenir
  title: Rumah saudagar Laweyan
  note:
    ar_eg: |
      Laweyan حي تجار الباتيك القدام في سولو: بيوت كبيرة ورا أسوار عالية وحواري ضيقة. سنة ١٩٠٥ تجار الباتيك المسلمين هنا أسسوا Sarekat Dagang Islam، من أوائل حركات التجار المسلمين في إندونيسيا. وكلمة Islam نفسها من العربي «إسلام» — يعني حتى في قلب حي الباتيك، العربي مستخبي في الأسامي.
    ar: |
      Laweyan حي تجار الباتيك القديم في سولو: بيوت واسعة خلف أسوار عالية وأزقة ضيقة. وفي سنة ١٩٠٥ أسس تجار الباتيك المسلمون هنا Sarekat Dagang Islam، وهي من أوائل حركات التجار المسلمين في إندونيسيا. وكلمة Islam نفسها من العربية «إسلام»، فالعربية حاضرة حتى في قلب حي الباتيك.
    en: |
      Laweyan is Solo's old batik merchants' quarter: big houses behind high walls and narrow lanes. In 1905 the Muslim batik traders here founded Sarekat Dagang Islam, one of Indonesia's first Muslim traders' movements. Even its name carries Arabic: Islam is «إسلام» — Arabic hiding in the heart of batik country.
