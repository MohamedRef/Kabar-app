schema: kabar.lesson/v1
id: j3.u06.l04
language: jv
title: Sinau ngantos sonten
can_do:
  ar_eg: تقول إنك ذاكرت لحد العصر ودماغك لفّت، وتاخد استراحة، وتسمع صوت الجاملان.
  ar: أن تقول إنك درست حتى العصر وأصابك الدوار، وتأخذ استراحة، وتسمع صوت الغاملان.
  en: Say you studied until the afternoon and your head is spinning, take a break, and listen to the gamelan.
slides:
  - title: Ngaso sekedhap
    body:
      ar_eg: |
        كراما للوقت والسمع:
        - nganti ← ngantos = لحد
        - wektu ← wekdal = وقت
        - sedhela ← sekedhap = لحظة
        - krungu ← mireng = يسمع، swara ← swanten = صوت
        mumet = دماغه لفّت، دايخ (من كتر المذاكرة مثلًا). ngaso = يرتاح، ياخد بريك.
        lumrah = عادي، طبيعي: «Lumrah!» = دي حاجة عادية!
      ar: |
        كراما للوقت والسمع:
        - nganti ← ngantos = حتى
        - wektu ← wekdal = وقت
        - sedhela ← sekedhap = لحظة
        - krungu ← mireng = يسمع، swara ← swanten = صوت
        mumet = يدور رأسه، مصاب بالدوار (من كثرة الدراسة مثلًا). ngaso = يستريح.
        lumrah = عاديّ، طبيعي: «Lumrah!» = هذا أمر طبيعي!
      en: |
        Krama for time and hearing:
        - nganti → ngantos = until
        - wektu → wekdal = time
        - sedhela → sekedhap = a moment
        - krungu → mireng = hear, swara → swanten = voice, sound
        mumet = head spinning, dizzy (from too much study, say). ngaso = rest, take a break.
        lumrah = normal, usual: "Lumrah!" = that's normal!
    examples:
      - text: Kula sinau ngantos sonten, lajeng mumet.
        ar_eg: ذاكرت لحد العصر، ودماغي لفّت.
        ar: درست حتى العصر، ثم دار رأسي.
        en: I studied until the afternoon, and my head is spinning.
      - text: Mangga ngaso sekedhap, Mas.
        ar_eg: ارتاح شوية يا أستاذ.
        ar: استرح قليلًا.
        en: Take a little break.
      - text: Kula mireng swanten gamelan.
        ar_eg: سامع صوت جاملان.
        ar: أسمع صوت الغاملان.
        en: I can hear the sound of gamelan.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mumet
        ar_eg: دايخ، دماغه لفّت
        ar: مصاب بالدوار
        en: dizzy, head spinning
      - text: ngaso
        ar_eg: يرتاح
        ar: يستريح
        en: rest
      - text: sekedhap
        ar_eg: لحظة (كراما)
        ar: لحظة (كراما)
        en: a moment (krama)
      - text: ngantos
        ar_eg: لحد (كراما)
        ar: حتى (كراما)
        en: until (krama)
    words: [mumet, ngaso, sekedhap, ngantos]
  - id: e02
    type: match_pairs
    pairs:
      - text: mireng
        ar_eg: يسمع (كراما)
        ar: يسمع (كراما)
        en: hear (krama)
      - text: swanten
        ar_eg: صوت (كراما)
        ar: صوت (كراما)
        en: voice, sound (krama)
      - text: lumrah
        ar_eg: عادي، طبيعي
        ar: عاديّ، طبيعي
        en: normal, usual
      - text: wekdal
        ar_eg: وقت (كراما)
        ar: وقت (كراما)
        en: time (krama)
    words: [mireng, swanten, lumrah, wekdal]
  - id: e03
    type: listen
    text: Mangga ngaso sekedhap, Mas.
    question:
      ar_eg: بيقولّه إيه؟
      ar: ماذا يقول له؟
      en: What does he tell him?
    options: [كمّل شغلك, ارتاح شوية, يلا نمشي]
    answer: 1
    meaning:
      ar_eg: ارتاح شوية يا أستاذ.
      ar: استرح قليلًا.
      en: Take a little break.
    words: [ngaso, sekedhap]
  - id: e04
    type: fill_blank
    sentence: Kula sinau ___ sonten.
    meaning:
      ar_eg: ذاكرت ___ العصر.
      ar: درست ___ العصر.
      en: I studied ___ the afternoon.
    options: [ngantos, swanten, lumrah]
    answers: [ngantos]
    words: [ngantos, swanten, lumrah]
  - id: e05
    type: multiple_choice
    question: Krungu (ngoko) → ___ (krama)
    options: [mumet, wekdal, mireng]
    answer: 2
    explain:
      ar_eg: krungu ← mireng = يسمع.
      ar: krungu ← mireng = يسمع.
      en: krungu → mireng = hear.
    words: [mireng, mumet, wekdal]
  - id: e06
    type: fill_blank
    sentence: Kula sinau dangu sanget, dados ___.
    meaning:
      ar_eg: ذاكرت كتير أوي، فدماغي ___.
      ar: درست طويلًا جدًا، فأصبحت ___.
      en: I studied for so long that I'm ___.
    options: [mumet, sekedhap, mireng]
    answers: [mumet]
    words: [mumet, sekedhap, mireng]
  - id: e07
    type: build_sentence
    source:
      ar_eg: مفيش وقت، أنا مستعجل.
      ar: لا وقت لديّ، أنا مستعجل.
      en: There's no time; I'm in a hurry.
    answer: Mboten wonten wekdal, kula kesusu.
    distractors: [swanten, ngaso]
    words: [wekdal]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kula mireng swanten gamelan saking griya Pak Harjo.
    answers_meaning:
      ar_eg: [سامع صوت جاملان من بيت الأستاذ هارجو, بسمع صوت الجاملان جاي من بيت عم هارجو]
      ar: [أسمع صوت الغاملان من بيت السيد هارجو]
      en: ['I can hear gamelan from Pak Harjo''s house', 'I hear the sound of gamelan coming from Pak Harjo''s house']
    words: [mireng, swanten]
  - id: e09
    type: speaking
    text: Mumet? Lumrah, Mas! Ngaso rumiyin.
    meaning:
      ar_eg: دماغك لفّت؟ عادي يا أستاذ! ارتاح الأول.
      ar: يدور رأسك؟ هذا طبيعي! استرح أولًا.
      en: Head spinning? That's normal! Rest first.
    words: [mumet, lumrah, ngaso]
  - id: e10
    type: multiple_choice
    question: Swara (ngoko) → ___ (krama)
    options: [swanten, ngantos, lumrah]
    answer: 0
    explain:
      ar_eg: swara ← swanten = صوت.
      ar: swara ← swanten = صوت.
      en: swara → swanten = voice, sound.
    words: [swanten, ngantos, lumrah]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, kula mumet. Kula sinau ngantos sonten.
      ar_eg: يا أستاذ، دماغي لفّت. ذاكرت لحد العصر.
      ar: يا أستاذ، رأسي يدور. درست حتى العصر.
      en: Sir, my head is spinning. I studied until the afternoon.
    - speaker: Pak Harjo
      text: "Lumrah, Mas. Ngaso sekedhap mawon."
      ar_eg: "عادي يا أستاذ. ريّح شوية."
      ar: "هذا طبيعي. استرح قليلًا."
      en: "That's normal. Take a little break."
    - speaker: Mohamed
      text: Wekdalipun taksih wonten, Pak?
      ar_eg: لسه فيه وقت يا أستاذ؟
      ar: هل ما زال هناك وقت يا أستاذ؟
      en: Is there still time, sir?
    - speaker: Pak Harjo
      text: "Wonten. Mireng swanten niku?"
      ar_eg: "فيه. سامع الصوت ده؟"
      ar: "نعم. أتسمع هذا الصوت؟"
      en: "There is. Hear that sound?"
    - speaker: Mohamed
      text: Inggih, swanten gamelan! Endah sanget.
      ar_eg: أيوه، صوت جاملان! حلو أوي.
      ar: نعم، صوت الغاملان! جميل جدًا.
      en: Yes, gamelan! It's beautiful.
    - speaker: Pak Harjo
      text: "Mangga, mireng gamelan riyin."
      ar_eg: "تعالى نسمع الجاميلان الأول."
      ar: "تعالَ نستمع إلى الجاميلان أولًا."
      en: "Come on, let's listen to the gamelan first."
new_words:
  - word: mumet
    pos: adjective
    ar_eg: دايخ، دماغه لفّت
    ar: مصاب بالدوار
    en: dizzy, head spinning (= pusing)
  - word: ngaso
    pos: verb
    ar_eg: يرتاح، ياخد بريك
    ar: يستريح
    en: rest, take a break (= istirahat)
  - word: sekedhap
    pos: adverb
    ar_eg: لحظة (sedhela ← sekedhap)، كراما
    ar: لحظة (sedhela ← sekedhap)، كراما
    en: a moment (ngoko sedhela, Indonesian sebentar), krama
  - word: ngantos
    pos: preposition
    ar_eg: لحد (nganti ← ngantos)، كراما
    ar: حتى (nganti ← ngantos)، كراما
    en: until (ngoko nganti, Indonesian sampai), krama
  - word: mireng
    pos: verb
    ar_eg: يسمع (krungu ← mireng)، كراما
    ar: يسمع (krungu ← mireng)، كراما
    en: hear (ngoko krungu, Indonesian mendengar), krama
  - word: swanten
    pos: noun
    ar_eg: صوت (swara ← swanten)، كراما
    ar: صوت (swara ← swanten)، كراما
    en: voice, sound (ngoko swara, Indonesian suara), krama
  - word: lumrah
    pos: adjective
    ar_eg: عادي، طبيعي
    ar: عاديّ، طبيعي
    en: normal, usual (= lumrah, biasa)
  - word: wekdal
    pos: noun
    ar_eg: وقت (wektu ← wekdal)، كراما
    ar: وقت (wektu ← wekdal)، كراما
    en: time (ngoko wektu, Indonesian waktu), krama
