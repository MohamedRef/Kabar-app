schema: kabar.lesson/v1
id: j1.u06.l03
language: jv
title: Takon dalan
can_do:
  ar_eg: تسأل عن الطريق وتفهم الوصف.
  ar: أن تسأل عن الطريق وتتّبع الإرشادات.
  en: Ask and follow directions.
slides:
  - title: Takon dalan
    body:
      ar_eg: |
        **takon dalan** = تسأل عن الطريق (takon = يسأل، dalan = طريق = jalan).
        اللي محتاجه كله:
        - السؤال: «… nang ngendi, ya?» = … فين؟ (ya بتليّن السؤال).
        - الرد: lurus (على طول)، ngiwa (شمال)، nengen (يمين)، terus (وبعدين).
        - المكان: nang ngarep (قدام)، nang mburi (ورا)، nang jejeré (جنب).
        - والإشارة: sing kaé, nang kana = اللي هناك بعيد.
        ومع حد مش عارفه: ابدأ بـ Mas / Mbak، واختم بـ «Matur nuwun».
      ar: |
        **takon dalan** = السؤال عن الطريق (takon = يسأل، dalan = طريق = jalan).
        وكل ما تحتاجه:
        - السؤال: «… nang ngendi, ya?» = أين …؟ (وya تليّن السؤال).
        - الجواب: lurus (مباشرة)، ngiwa (يسارًا)، nengen (يمينًا)، terus (ثم).
        - الموضع: nang ngarep (أمام)، nang mburi (خلف)، nang jejeré (بجانب).
        - والإشارة: sing kaé, nang kana = ذلك الذي هناك.
        ومع الغريب ابدأ بـ Mas / Mbak واختم بـ «Matur nuwun».
      en: |
        **takon dalan** = asking the way (takon = ask, dalan = road = jalan).
        All you need:
        - The question: "… nang ngendi, ya?" = Where's …? (ya softens it).
        - The answer: lurus (straight), ngiwa (left), nengen (right), terus (then).
        - The spot: nang ngarep (in front), nang mburi (behind), nang jejeré (next to).
        - Pointing: sing kaé, nang kana = that one over there.
        With a stranger: open with Mas / Mbak and close with "Matur nuwun".
    grammar: jv.preposition.place
    examples:
      - text: Mbak, stasiun nang ngendi, ya?
        ar_eg: لو سمحتي يا آنسة، المحطة فين؟
        ar: يا آنسة، أين المحطة من فضلك؟
        en: Excuse me, where's the station?
