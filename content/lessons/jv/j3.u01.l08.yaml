    meaning:
      ar_eg: لو سمحت، قطر الـKRL فين؟
      ar: عفوًا، أين قطار KRL؟
      en: Excuse me, where's the KRL train?
    words: [wonten, pundi]
  - id: e10
    type: multiple_choice
    question: banget (ngoko) → ___ (krama)
    options: [sae, sanget, menapa]
    answer: 1
    explain:
      ar_eg: 'banget بالنغوكو، sanget بالكراما: أوي. sae = كويس.'
      ar: 'banget بالنغوكو وsanget بالكراما: جدًا. sae = جيد.'
      en: 'banget is ngoko, sanget is krama: very. sae = good.'
    words: [sanget, sae, menapa]
dialogue:
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Pak. Kamar mandi wonten pundi?
      ar_eg: لو سمحت يا أستاذ. الحمّام فين؟
      ar: عفوًا يا سيدي. أين الحمّام؟
      en: Excuse me, sir. Where's the toilet?
    - speaker: Petugas
      text: Wonten mrika, Mas, celak mushola.
      ar_eg: هناك يا أستاذ، جنب المصلّى.
      ar: هناك يا أخي، قرب المصلّى.
      en: Over there, mate, by the prayer room.
    - speaker: Mohamed
      text: Matur nuwun. Menapa punika KRL?
      ar_eg: متشكر. هو ده قطر الـKRL؟
      ar: شكرًا. هل هذا قطار KRL؟
      en: Thanks. Is this the KRL?
    - speaker: Petugas
      text: Mboten, Mas, punika sepur Bandara. KRL wonten ngriki.
      ar_eg: لأ يا أستاذ، ده قطر المطار. الـKRL هنا.
      ar: لا يا أخي، هذا قطار المطار. قطار KRL هنا.
      en: No, mate, this is the airport train. The KRL is here.
    - speaker: Mohamed
      text: Oh, nggih. Stasiunipun sae sanget!
      ar_eg: آه، ماشي. المحطة حلوة أوي!
      ar: آه، حسنًا. المحطة جميلة جدًا!
      en: Oh, right. The station's really nice!
new_words:
  - word: wonten
    pos: verb
    ar_eg: فيه، موجود (كراما من ana)
    ar: يوجد (كراما من ana)
    en: there is, be (at), krama (ngoko ana, Indonesian ada)
  - word: mboten
    pos: particle
    ar_eg: لأ، مش (كراما من ora)
    ar: لا، ليس (كراما من ora)
    en: no, not, krama (ngoko ora, Indonesian tidak)
  - word: menapa
    pos: question word
    ar_eg: إيه؟ وعلامة سؤال (كراما من apa؛ في الشارع napa)
    ar: ماذا؟ وأداة استفهام (كراما من apa؛ في الشارع napa)
    en: what?; question marker, krama (ngoko apa, street napa, Indonesian apa)
  - word: pundi
    pos: question word
    ar_eg: فين، أنهي (كراما من endi)
    ar: أين، أيّ (كراما من endi)
    en: where, which, krama (ngoko endi, Indonesian mana)
  - word: punika
    pos: pronoun
    ar_eg: ده (كراما رسمي من iki؛ في الكلام menika/niki)
    ar: هذا (كراما رسمية من iki؛ وفي الكلام menika/niki)
    en: this, formal krama (ngoko iki, speech menika/niki, Indonesian ini)
  - word: sae
    pos: adjective
    ar_eg: كويس، حلو (كراما من apik)
    ar: جيد، جميل (كراما من apik)
    en: good, nice, krama (ngoko apik, Indonesian bagus)
  - word: sanget
    pos: adverb
    ar_eg: أوي (كراما من banget)
    ar: جدًا (كراما من banget)
    en: very, krama (ngoko banget, Indonesian sangat)
