schema: kabar.lesson/v1
id: j3.u01.l08
language: jv
title: Wonten menapa?
can_do:
  ar_eg: 'تسأل في محطة ليمبوياجان بالكراما: فيه ولا مفيش، إيه، فين، ده، كويس وأوي.'
  ar: 'أن تسأل في محطة ليمبوياغان بالكراما: يوجد أو لا يوجد، ماذا، أين، هذا، جيد وجدًا.'
  en: 'Ask your way round Lempuyangan station in krama: there is or isn''t, what, where, this, good and very.'
slides:
  - title: Tembung krama saben dinten
    body:
      ar_eg: |
        أهم كلمات كراما هتسمعها من أول يوم في جوجا (النغوكو بين قوسين):
        wonten (ana) = فيه، موجود: «Wonten toya?» = فيه ميّه؟ / «wonten pundi?» = فين؟
        mboten (ora) = لأ، مش. menapa (apa) = إيه؟ وكمان علامة سؤال. في الشارع: napa.
        pundi (endi) = فين، أنهي. punika (iki) = ده (رسمي؛ في الكلام menika أو niki).
        sae (apik) = كويس، حلو. sanget (banget) = أوي.
      ar: |
        أهم ألفاظ الكراما التي ستسمعها من أول يوم في جوكجاكرتا (النغوكو بين قوسين):
        wonten (ana) = يوجد، موجود: «Wonten toya?» = هل يوجد ماء؟ / «wonten pundi?» = أين؟
        mboten (ora) = لا، ليس. menapa (apa) = ماذا؟ وأداة استفهام أيضًا. وفي الشارع: napa.
        pundi (endi) = أين، أيّ. punika (iki) = هذا (رسمية؛ وفي الكلام menika أو niki).
        sae (apik) = جيد، جميل. sanget (banget) = جدًا.
      en: |
        The krama words you'll hear from day one in Jogja (ngoko in brackets):
        wonten (ana) = there is, be (at): "Wonten toya?" = is there water? / "wonten pundi?" = where?
        mboten (ora) = no, not. menapa (apa) = what? and a question marker. On the street: napa.
        pundi (endi) = where, which. punika (iki) = this (formal; in speech menika or niki).
        sae (apik) = good, nice. sanget (banget) = very.
    examples:
      - text: Nyuwun sewu, kamar mandi wonten pundi?
        ar_eg: لو سمحت، الحمّام فين؟
        ar: عفوًا، أين الحمّام؟
        en: Excuse me, where's the toilet?
      - text: Menapa punika KRL?
        ar_eg: هو ده قطر الـKRL؟
        ar: هل هذا قطار KRL؟
        en: Is this the KRL train?
      - text: Mboten, Mas. Sepuripun sae sanget.
        ar_eg: لأ يا أستاذ. القطر ده كويس أوي.
        ar: لا يا أخي. القطار جيد جدًا.
        en: No, mate. The train's very good.
