      - text: mboten
        ar_eg: لأ، مش (كراما)
        ar: لا، ليس (كراما)
        en: no, not (krama)
      - text: menapa
        ar_eg: إيه؟ (كراما)
        ar: ماذا؟ (كراما)
        en: what? (krama)
      - text: pundi
        ar_eg: فين، أنهي (كراما)
        ar: أين، أيّ (كراما)
        en: where, which (krama)
    words: [wonten, mboten, menapa, pundi]
