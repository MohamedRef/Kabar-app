    type: match_pairs
    pairs:
      - text: ibukutha
        ar_eg: عاصمة
        ar: عاصمة
        en: capital city
      - text: provinsi
        ar_eg: محافظة / إقليم
        ar: إقليم / ولاية
        en: province
      - text: pesisir
        ar_eg: ساحل
        ar: ساحل
        en: coast
      - text: lor
        ar_eg: شمال
        ar: شمال
        en: north
      - text: kidul
        ar_eg: جنوب
        ar: جنوب
        en: south
    words: [ibukutha, provinsi, pesisir, lor, kidul]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: في «Madiun iku kutha ing Provinsi Jawa Timur»، iku بتعمل شغل أنهي كلمة إندونيسي؟
      ar: في «Madiun iku kutha ing Provinsi Jawa Timur» تقوم iku مقام أي كلمة إندونيسية؟
      en: In "Madiun iku kutha ing Provinsi Jawa Timur", iku does the job of which Indonesian word?
    options: [itu, adalah, ini]
    answer: 1
    explain:
      ar_eg: في الكتابة iku بين الاسم وتعريفه = adalah، مش «ده / دي».
      ar: iku في الكتابة بين الاسم وتعريفه بمعنى adalah، لا «ذلك».
      en: In writing, iku between a noun and its definition works like adalah, not "that".
    words: [provinsi]
  - id: e03
    type: multiple_choice
    question: Madiun duwe kecamatan telu, yaiku Manguharjo, Taman lan Kartoharjo.
    question_meaning:
      ar_eg: yaiku معناها إيه هنا؟
      ar: ما معنى yaiku هنا؟
      en: What does yaiku mean here?
    options: [yang, karena, yaitu]
    answer: 2
    explain:
      ar_eg: yaiku = yaitu، بتفصّل «التلات أحياء» وتقول هما مين.
      ar: yaiku = yaitu، تفصّل «النواحي الثلاث» وتسمّيها.
      en: yaiku = yaitu; it spells out which three districts.
    words: [yaiku]
  - id: e04
    type: listen
    text: Jawa Timur duwe pesisir loro, yaiku pesisir lor lan pesisir kidul.
    options:
      - Jawa Timur duwe pesisir loro, yaiku pesisir lor lan pesisir kidul.
      - Jawa Timur duwe pesisir siji, yaiku pesisir lor.
      - Jawa Timur duwe kutha loro, yaiku Madiun lan Ngawi.
    answer: 0
    meaning:
      ar_eg: جاوة الشرقية ليها ساحلين، الساحل الشمالي والساحل الجنوبي.
      ar: لجاوة الشرقية ساحلان، هما الساحل الشمالي والساحل الجنوبي.
      en: East Java has two coasts, namely the north coast and the south coast.
    words: [pesisir, lor, kidul, yaiku]
  - id: e05
    type: fill_blank
    sentence: Kutha Yogyakarta uga ___ provinsi.
    meaning:
      ar_eg: مدينة يوجياكارتا كمان عاصمة محافظة.
      ar: مدينة يوغياكارتا أيضًا عاصمة إقليم.
      en: Yogyakarta city is also a provincial capital.
    options: [pesisir, ibukutha, kidul]
    answers: [ibukutha]
    words: [ibukutha, provinsi]
  - id: e06
    type: fill_blank
    sentence: Pacitan ana ing pesisir ___.
    meaning:
      ar_eg: باتشيتان على الساحل الجنوبي.
      ar: تقع باتشيتان على الساحل الجنوبي.
      en: Pacitan lies on the south coast.
    options: [lor, kidul, yaiku]
    answers: [kidul]
    explain:
      ar_eg: باتشيتان على المحيط الهندي في الجنوب. ماديون نفسها جوه البر، مالهاش ساحل.
      ar: تقع باتشيتان على المحيط الهندي جنوبًا، أما ماديون فمدينة داخلية بلا ساحل.
      en: Pacitan faces the Indian Ocean in the south; Madiun itself is inland, with no coast.
    words: [pesisir, kidul, lor]
  - id: e07
    type: build_sentence
