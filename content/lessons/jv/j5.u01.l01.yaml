dialogue:
  title: Ing Stasiun Tawang
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, iki Wikipedia basa Jawa. Wacanen!
      ar_eg: يا محمد، دي ويكيبيديا الجاوية. اقرا!
      ar: يا محمد، هذه ويكيبيديا الجاوية. اقرأ!
      en: Mohamed, this is Javanese Wikipedia. Read it!
    - speaker: Mohamed
      text: Semarang iku ibukutha Provinsi Jawa Tengah. Lho, iki ngoko, ya?
      ar_eg: سيمارانج هي عاصمة محافظة جاوة الوسطى. الله، ده نغوكو؟
      ar: سيمارانج هي عاصمة إقليم جاوة الوسطى. عجبًا، هذه نغوكو؟
      en: Semarang is the capital of Central Java Province. Oh, this is ngoko?
    - speaker: Mbak Ayu
      text: Iya, ngoko, nanging basa tulis. Iku ing kene padha karo "adalah".
      ar_eg: آه، نغوكو، بس لغة كتابة. iku هنا زي «adalah».
      ar: نعم، نغوكو، لكنها لغة الكتابة. وiku هنا مثل «adalah».
      en: Yes, ngoko, but written language. Iku here is the same as "adalah".
    - speaker: Mohamed
      text: Semarang duwe stasiun gedhe loro, yaiku Tawang lan Poncol. Yaiku padha karo "yaitu"?
      ar_eg: سيمارانج فيها محطتين كبار، هما تاوانج وبونتشول. yaiku زي «yaitu»؟
      ar: في سيمارانج محطتان كبيرتان، هما تاوانغ وبونتشول. هل yaiku مثل «yaitu»؟
      en: Semarang has two big stations, namely Tawang and Poncol. Is yaiku the same as "yaitu"?
    - speaker: Mbak Ayu
      text: Bener! Lan saiki awake dhewe ana ing Tawang.
      ar_eg: صح! وإحنا دلوقتي في تاوانج.
      ar: صحيح! ونحن الآن في تاوانغ.
      en: Right! And right now we're at Tawang.
