schema: kabar.lesson/v1
id: j5.u01.l01
language: jv
title: Iku lan yaiku
can_do:
  ar_eg: تقرا التعريف اللي بتبدأ بيه أي مقالة في الموسوعة.
  ar: أن تقرأ التعريف الذي تبدأ به مقالة الموسوعة.
  en: Read the definition that opens an encyclopedia article.
slides:
  - title: Ngoko nganggo jas
    body:
      ar_eg: |
        أهلًا بيك في سيمارانج! من النهارده هنقرا جاوي حقيقي، وأول حاجة ويكيبيديا الجاوية.
        المفاجأة: المقالات مكتوبة نغوكو مش كراما، بس نغوكو «لابس بدلة»، زي الفرق بين كلامنا والفصحى في الجرايد.
        أول كلمة تدوّر عليها: iku. في الكلام معناها «ده / دي»، لكن في الكتابة بعد الاسم بتعرّفه، زي adalah بالظبط: «Semarang iku ibukutha …» = سيمارانج هي عاصمة …
      ar: |
        مرحبًا بك في سيمارانج! من اليوم نقرأ جاوية حقيقية، وأولها ويكيبيديا الجاوية.
        والمفاجأة أن المقالات مكتوبة بالنغوكو لا بالكراما، لكنها نغوكو رسمية، كالفرق بين العامية والفصحى في الصحف.
        وأول كلمة تبحث عنها iku: في الكلام بمعنى «ذلك»، وفي الكتابة تأتي بعد الاسم لتعرّفه كـ adalah: «Semarang iku ibukutha …» = سيمارانج هي عاصمة …
      en: |
        Welcome to Semarang! From today you read real Javanese, starting with Javanese Wikipedia.
        The surprise: articles are written in ngoko, not krama, but ngoko "in a suit", like the gap between Egyptian speech and newspaper Arabic.
        The first word to look for is iku. In speech it means "that"; in writing, after a noun, it defines it, just like adalah: "Semarang iku ibukutha …" = Semarang is the capital of …
    grammar: jv.reading.written-style
    examples:
      - text: Semarang iku ibukutha Provinsi Jawa Tengah.
        ar_eg: سيمارانج هي عاصمة محافظة جاوة الوسطى.
        ar: سيمارانج هي عاصمة إقليم جاوة الوسطى.
        en: Semarang is the capital of Central Java Province.
      - text: Kudus iku kutha ing Jawa Tengah.
        ar_eg: كودوس مدينة في جاوة الوسطى.
        ar: كودوس مدينة في جاوة الوسطى.
        en: Kudus is a city in Central Java.
  - title: Yaiku = yaitu
    body:
      ar_eg: |
        yaiku = yaitu = «ألا وهو / يعني». بتيجي بعد كلام عام عشان تفصّله أو تعدّه.
        وخد بالك من الاتجاهات اللي هتقابلها في كل مقالة جغرافيا: lor = شمال (utara)، kidul = جنوب (selatan). وpesisir = ساحل، زي الإندونيسي.
      ar: |
        yaiku = yaitu = «أي / ألا وهو»، تأتي بعد كلام عام لتفصّله أو تعدّده.
        وانتبه للجهات في مقالات الجغرافيا: lor = شمال (utara)، وkidul = جنوب (selatan). وpesisir = ساحل، كالإندونيسية.
      en: |
        yaiku = yaitu = "namely". It follows a general statement to spell it out or list it.
        And note the directions every geography article uses: lor = north (utara), kidul = south (selatan). pesisir = coast, as in Indonesian.
    grammar: jv.reading.written-style
    examples:
      - text: Semarang duwe stasiun gedhe loro, yaiku Tawang lan Poncol.
        ar_eg: سيمارانج فيها محطتين كبار، هما تاوانج وبونتشول.
        ar: في سيمارانج محطتان كبيرتان، هما تاوانغ وبونتشول.
        en: Semarang has two big stations, namely Tawang and Poncol.
      - text: Jawa Tengah duwe pesisir loro, yaiku pesisir lor lan pesisir kidul.
        ar_eg: جاوة الوسطى ليها ساحلين، الساحل الشمالي والساحل الجنوبي.
        ar: لجاوة الوسطى ساحلان، هما الساحل الشمالي والساحل الجنوبي.
        en: Central Java has two coasts, namely the north coast and the south coast.
