schema: kabar.lesson/v1
id: j5.u01.l01
language: jv
title: Iku lan yaiku
can_do:
  ar_eg: تقرا التعريف اللي بتبدأ بيه أي مقالة في الموسوعة.
  ar: أن تقرأ التعريف الذي تبدأ به مقالة الموسوعة.
  en: Read the definition that opens an encyclopedia article.
slides:
  - title: Ngoko nganggo jas
    body:
      ar_eg: |
        أهلًا بيك تاني في ماديون، «مدينة المقاتلين» (Kutha Pendekar)! من النهارده هنقرا جاوي حقيقي، وأول حاجة ويكيبيديا الجاوية.
        المفاجأة: المقالات مكتوبة نغوكو مش كراما، بس نغوكو «لابس بدلة»، زي الفرق بين كلامنا والفصحى في الجرايد.
        أول كلمة تدوّر عليها: iku. في الكلام معناها «ده / دي»، لكن في الكتابة بعد الاسم بتعرّفه، زي adalah بالظبط: «Madiun iku kutha …» = ماديون هي مدينة …
      ar: |
        مرحبًا بك مجددًا في ماديون، «مدينة المقاتلين» (Kutha Pendekar)! من اليوم نقرأ جاوية حقيقية، وأولها ويكيبيديا الجاوية.
        والمفاجأة أن المقالات مكتوبة بالنغوكو لا بالكراما، لكنها نغوكو رسمية، كالفرق بين العامية والفصحى في الصحف.
        وأول كلمة تبحث عنها iku: في الكلام بمعنى «ذلك»، وفي الكتابة تأتي بعد الاسم لتعرّفه كـ adalah: «Madiun iku kutha …» = ماديون هي مدينة …
      en: |
        Welcome back to Madiun, the Kutha Pendekar! From today you read real Javanese, starting with Javanese Wikipedia.
        The surprise: articles are written in ngoko, not krama, but ngoko "in a suit", like the gap between Egyptian speech and newspaper Arabic.
        The first word to look for is iku. In speech it means "that"; in writing, after a noun, it defines it, just like adalah: "Madiun iku kutha …" = Madiun is a city …
    grammar: jv.reading.written-style
    examples:
      - text: Madiun iku kutha ing Provinsi Jawa Timur.
        ar_eg: ماديون مدينة في محافظة جاوة الشرقية.
        ar: ماديون مدينة في إقليم جاوة الشرقية.
        en: Madiun is a city in East Java Province.
      - text: Kudus iku kutha ing Jawa Tengah.
        ar_eg: كودوس مدينة في جاوة الوسطى.
        ar: كودوس مدينة في جاوة الوسطى.
        en: Kudus is a city in Central Java.
  - title: Yaiku = yaitu
    body:
      ar_eg: |
        yaiku = yaitu = «ألا وهو / يعني». بتيجي بعد كلام عام عشان تفصّله أو تعدّه.
        وخد بالك من الاتجاهات اللي هتقابلها في كل مقالة جغرافيا: lor = شمال (utara)، kidul = جنوب (selatan). وpesisir = ساحل، زي الإندونيسي.
      ar: |
        yaiku = yaitu = «أي / ألا وهو»، تأتي بعد كلام عام لتفصّله أو تعدّده.
        وانتبه للجهات في مقالات الجغرافيا: lor = شمال (utara)، وkidul = جنوب (selatan). وpesisir = ساحل، كالإندونيسية.
      en: |
        yaiku = yaitu = "namely". It follows a general statement to spell it out or list it.
        And note the directions every geography article uses: lor = north (utara), kidul = south (selatan). pesisir = coast, as in Indonesian.
    grammar: jv.reading.written-style
    examples:
      - text: Madiun duwe kecamatan telu, yaiku Manguharjo, Taman lan Kartoharjo.
        ar_eg: ماديون فيها تلات أحياء إدارية، هما مانجوهارجو وتامان وكارتوهارجو.
        ar: في ماديون ثلاث نواحٍ، هي مانغوهارجو وتامان وكارتوهارجو.
        en: Madiun has three districts, namely Manguharjo, Taman and Kartoharjo.
      - text: Jawa Timur duwe pesisir loro, yaiku pesisir lor lan pesisir kidul.
        ar_eg: جاوة الشرقية ليها ساحلين، الساحل الشمالي والساحل الجنوبي.
        ar: لجاوة الشرقية ساحلان، هما الساحل الشمالي والساحل الجنوبي.
        en: East Java has two coasts, namely the north coast and the south coast.
exercises:
