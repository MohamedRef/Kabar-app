    meaning:
      ar_eg: سيمارانج على الساحل الشمالي.
      ar: تقع سيمارانج على الساحل الشمالي.
      en: Semarang lies on the north coast.
    options: [lor, kidul, yaiku]
    answers: [lor]
    explain:
      ar_eg: سيمارانج على بحر جاوة في الشمال. الجنوب بتاع جاوة الوسطى على المحيط الهندي.
      ar: تقع سيمارانج على بحر جاوة في الشمال، أما جنوب جاوة الوسطى فعلى المحيط الهندي.
      en: Semarang is on the Java Sea, in the north; Central Java's south coast faces the Indian Ocean.
    words: [pesisir, lor]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الساحل الجنوبي لجاوة الوسطى بعيد عن سيمارانج.
      ar: الساحل الجنوبي لجاوة الوسطى بعيد عن سيمارانج.
      en: Central Java's south coast is far from Semarang.
    answer: Pesisir kidul Jawa Tengah adoh saka Semarang.
