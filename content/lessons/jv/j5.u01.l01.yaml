dialogue:
  title: Ing Stasiun Madiun
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, iki Wikipedia basa Jawa. Wacanen!
      ar_eg: يا محمد، دي ويكيبيديا الجاوية. اقرا!
      ar: يا محمد، هذه ويكيبيديا الجاوية. اقرأ!
      en: Mohamed, this is Javanese Wikipedia. Read it!
    - speaker: Mohamed
      text: Madiun iku kutha ing Provinsi Jawa Timur. Lho, iki ngoko, ya?
      ar_eg: ماديون مدينة في محافظة جاوة الشرقية. الله، ده نغوكو؟
      ar: ماديون مدينة في إقليم جاوة الشرقية. عجبًا، هذه نغوكو؟
      en: Madiun is a city in East Java Province. Oh, this is ngoko?
    - speaker: Mbak Ayu
      text: Iya, ngoko, nanging basa tulis. Iku ing kene padha karo "adalah".
      ar_eg: آه، نغوكو، بس لغة كتابة. iku هنا زي «adalah».
      ar: نعم، نغوكو، لكنها لغة الكتابة. وiku هنا مثل «adalah».
      en: Yes, ngoko, but written language. Iku here is the same as "adalah".
    - speaker: Mohamed
      text: Madiun duwe kecamatan telu, yaiku Manguharjo, Taman lan Kartoharjo. Yaiku padha karo "yaitu"?
      ar_eg: ماديون فيها تلات أحياء، هما مانجوهارجو وتامان وكارتوهارجو. yaiku زي «yaitu»؟
      ar: في ماديون ثلاث نواحٍ، هي مانغوهارجو وتامان وكارتوهارجو. هل yaiku مثل «yaitu»؟
      en: Madiun has three districts, namely Manguharjo, Taman and Kartoharjo. Is yaiku the same as "yaitu"?
    - speaker: Mbak Ayu
      text: Bener! Lan saiki awake dhewe ana ing Kartoharjo lho, cedhak stasiun.
      ar_eg: صح! وإحنا دلوقتي في كارتوهارجو، جنب المحطة.
      ar: صحيح! ونحن الآن في كارتوهارجو، قرب المحطة.
      en: Right! And right now we're in Kartoharjo, near the station.
