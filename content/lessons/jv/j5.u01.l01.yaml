        ar_eg: عاصمة
        ar: عاصمة
        en: capital city
      - text: provinsi
        ar_eg: محافظة / إقليم
        ar: إقليم / ولاية
        en: province
      - text: pesisir
        ar_eg: ساحل
        ar: ساحل
        en: coast
      - text: lor
        ar_eg: شمال
        ar: شمال
        en: north
      - text: kidul
        ar_eg: جنوب
        ar: جنوب
        en: south
    words: [ibukutha, provinsi, pesisir, lor, kidul]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: في «Semarang iku ibukutha Provinsi Jawa Tengah»، iku بتعمل شغل أنهي كلمة إندونيسي؟
      ar: في «Semarang iku ibukutha Provinsi Jawa Tengah» تقوم iku مقام أي كلمة إندونيسية؟
      en: In "Semarang iku ibukutha Provinsi Jawa Tengah", iku does the job of which Indonesian word?
    options: [itu, adalah, ini]
    answer: 1
    explain:
      ar_eg: في الكتابة iku بين الاسم وتعريفه = adalah، مش «ده / دي».
      ar: iku في الكتابة بين الاسم وتعريفه بمعنى adalah، لا «ذلك».
      en: In writing, iku between a noun and its definition works like adalah, not "that".
    words: [ibukutha, provinsi]
  - id: e03
    type: multiple_choice
    question: Semarang duwe stasiun gedhe loro, yaiku Tawang lan Poncol.
    question_meaning:
      ar_eg: yaiku معناها إيه هنا؟
      ar: ما معنى yaiku هنا؟
      en: What does yaiku mean here?
    options: [yang, karena, yaitu]
    answer: 2
    explain:
      ar_eg: yaiku = yaitu، بتفصّل «المحطتين» وتقول هما مين.
      ar: yaiku = yaitu، تفصّل «المحطتين» وتسمّيهما.
      en: yaiku = yaitu; it spells out which two stations.
    words: [yaiku]
  - id: e04
    type: listen
    text: Jawa Tengah duwe pesisir loro, yaiku pesisir lor lan pesisir kidul.
    options:
      - Jawa Tengah duwe pesisir loro, yaiku pesisir lor lan pesisir kidul.
      - Jawa Tengah duwe pesisir siji, yaiku pesisir lor.
      - Jawa Tengah duwe kutha loro, yaiku Semarang lan Kudus.
    answer: 0
    meaning:
      ar_eg: جاوة الوسطى ليها ساحلين، الساحل الشمالي والساحل الجنوبي.
      ar: لجاوة الوسطى ساحلان، هما الساحل الشمالي والساحل الجنوبي.
      en: Central Java has two coasts, namely the north coast and the south coast.
    words: [pesisir, lor, kidul, yaiku]
  - id: e05
    type: fill_blank
    sentence: Semarang iku ___ Provinsi Jawa Tengah.
    meaning:
      ar_eg: سيمارانج هي عاصمة محافظة جاوة الوسطى.
      ar: سيمارانج هي عاصمة إقليم جاوة الوسطى.
      en: Semarang is the capital of Central Java Province.
