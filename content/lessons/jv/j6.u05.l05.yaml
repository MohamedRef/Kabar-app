schema: kabar.lesson/v1
id: j6.u05.l05
language: jv
title: Taun Jawa
can_do:
  ar_eg: 'تفهم إزاي الجاوايين بيحسبوا الوقت: الويندو والووكو وتقويم الفلاحين، وتفك سنة مكتوبة بالسنغكالان.'
  ar: 'أن تفهم حساب الوقت عند الجاويين: الويندو والووكو وتقويم الفلاحين، وتفكّ سنة مكتوبة بالسنغكالان.'
  en: 'Understand how Javanese people count time: windu, wuku and the farmers'' calendar, and decode a year written as a sengkalan.'
slides:
  - title: Sengkalan
    body:
      ar_eg: |
        windu = دورة ٨ سنين: satus taun (١٠٠ سنة) أكتر من rolas windu (٩٦ سنة).
        wuku = واحد من ٣٠ أسبوع في دورة الووكو، وأولهم Sinta. neptu = الرقم بتاع كل يوم وكل pasaran: Legi = ٥، Kliwon = ٨.
        pranata mangsa = تقويم الفلاحين بمواسمه، petungan = الحساب الجاوي للأيام والسنين.
        sengkalan = سنة متشفرة في كلمات، كل كلمة ليها رقم وبنقراها من الآخر: «Sirna ilang kertaning bumi» = ٠ ٠ ٤ ١ ← سنة ١٤٠٠ ساكا. بتلاقيها على prasasti (نقش) أو tetenger (نُصب تذكاري).
      ar: |
        windu = دورة من ٨ سنوات: satus taun (١٠٠ سنة) أكثر من rolas windu (٩٦ سنة).
        wuku = أحد ٣٠ أسبوعًا في دورة الووكو، أولها Sinta. neptu = القيمة العددية لكل يوم وكل pasaran: Legi = ٥، Kliwon = ٨.
        pranata mangsa = تقويم الفلاحين بمواسمه، petungan = الحساب الجاوي للأيام والسنين.
        sengkalan = سنة مرمّزة في كلمات، لكل كلمة رقم وتُقرأ من الآخر: «Sirna ilang kertaning bumi» = ٠ ٠ ٤ ١ ← سنة ١٤٠٠ ساكا. تجدها على prasasti (نقش) أو tetenger (نُصب تذكاري).
      en: |
        windu = an 8-year cycle: satus taun (100 years) is more than rolas windu (96 years).
        wuku = one of the 30 weeks of the wuku cycle; the first is Sinta. neptu = the number each day and pasaran is worth: Legi = 5, Kliwon = 8.
        pranata mangsa = the farmers' seasonal calendar; petungan = Javanese reckoning of days and years.
        sengkalan = a year encoded in words, each worth a digit, read backwards: "Sirna ilang kertaning bumi" = 0 0 4 1 → Saka year 1400. You'll find them on a prasasti (inscription) or a tetenger (memorial marker).
    examples:
      - text: Umure masjid iki luwih saka satus taun.
        ar_eg: عمر الجامع ده أكتر من ١٠٠ سنة.
        ar: عمر هذا المسجد أكثر من مئة عام.
        en: This mosque is more than a hundred years old.
      - text: Wuku Sinta iku wuku sing kapisan.
        ar_eg: ووكو سينتا هو أول ووكو.
        ar: ووكو سينتا هو الأول.
        en: Wuku Sinta is the first wuku.
      - text: Ana sengkalan ing prasasti iki.
        ar_eg: فيه سنغكالان على النقش ده.
        ar: على هذا النقش سنغكالان.
        en: There's a sengkalan on this inscription.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: windu
        ar_eg: دورة ٨ سنين
        ar: دورة ثماني سنوات
        en: 8-year cycle
      - text: wuku
        ar_eg: أسبوع الووكو
        ar: أسبوع الووكو
        en: wuku week
      - text: sengkalan
        ar_eg: سنة متشفرة في كلمات
        ar: سنة مرمّزة في كلمات
        en: chronogram
      - text: neptu
        ar_eg: قيمة اليوم العددية
        ar: قيمة اليوم العددية
        en: day value
    words: [windu, wuku, sengkalan, neptu]
  - id: e02
    type: match_pairs
    pairs:
      - text: tetenger
        ar_eg: نُصب تذكاري
        ar: نُصب تذكاري
        en: memorial marker
      - text: petungan
        ar_eg: حساب
        ar: حساب
        en: reckoning
      - text: prasasti
        ar_eg: نقش
        ar: نقش
        en: inscription
      - text: pranata mangsa
        ar_eg: تقويم الفلاحين
        ar: تقويم الفلاحين
        en: farmers' calendar
    words: [tetenger, petungan, prasasti, pranata mangsa]
  - id: e03
    type: listen
    text: Umure masjid iki satus taun, luwih saka rolas windu.
    question:
      ar_eg: عمر الجامع كام؟
      ar: كم عمر المسجد؟
      en: How old is the mosque?
    options: [عمره ١٠٠ سنة, عمره ١٢ سنة, عمره ٨ سنين]
    answer: 0
    meaning:
      ar_eg: عمر الجامع ده ١٠٠ سنة، أكتر من ١٢ ويندو.
      ar: عمر هذا المسجد مئة عام، أكثر من ١٢ ويندو.
      en: This mosque is a hundred years old, more than twelve windu.
    words: [windu]
  - id: e04
    type: fill_blank
    sentence: Pasaran Legi ___ lima, Kliwon wolu.
    meaning:
      ar_eg: ليجي الـ___ بتاعه خمسة، وكليوون تمانية.
      ar: ___ ليغي خمسة، وكليوون ثمانية.
      en: Legi's ___ is five, Kliwon's is eight.
    options: [neptune, tetengere, wukune]
    answers: [neptune]
    words: [neptu, tetenger, wuku]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: دورة الـ٣٠ أسبوع اللي أولها سينتا اسمها …
      ar: دورة الثلاثين أسبوعًا التي أولها سينتا تسمّى …
      en: The cycle of thirty weeks that starts with Sinta is the …
    options: [wuku, windu, prasasti]
    answer: 0
    explain:
      ar_eg: wuku = أسبوع من ٣٠؛ windu = ٨ سنين.
      ar: wuku = أسبوع من ثلاثين؛ windu = ثماني سنوات.
      en: wuku = one of thirty weeks; windu = eight years.
    words: [wuku, windu, prasasti]
  - id: e06
    type: fill_blank
    sentence: Petani nandur pari miturut ___.
    meaning:
      ar_eg: الفلاحين بيزرعوا الرز حسب ___.
      ar: يزرع الفلاحون الأرز وفق ___.
      en: Farmers plant rice according to the ___.
    options: [pranata mangsa, sengkalan, petungan]
    answers: [pranata mangsa]
    words: [pranata mangsa, sengkalan, petungan]
  - id: e07
    type: multiple_choice
    question: '''Sirna ilang kertaning bumi'' iku ___ taun 1400.'
    options: [petungan, sengkalan, tetenger]
    answer: 1
    explain:
      ar_eg: 'دي سنة متشفرة: ٠ ٠ ٤ ١، بنقراها من الآخر.'
      ar: 'هذه سنة مرمّزة: ٠ ٠ ٤ ١، تُقرأ من الآخر.'
      en: 'It''s an encoded year: 0 0 4 1, read backwards.'
    words: [petungan, sengkalan, tetenger]
  - id: e08
    type: build_sentence
    source:
      ar_eg: فيه سنغكالان على النقش ده.
      ar: على هذا النقش سنغكالان.
      en: There's a sengkalan on this inscription.
    answer: Ana sengkalan ing prasasti iki.
    distractors: [wuku, windu]
    words: [sengkalan, prasasti]
  - id: e09
    type: translate
    direction: from_target
    source_text: Simbah ngerti petungan lan pranata mangsa.
    answers_meaning:
      ar_eg: [جدي فاهم الحساب الجاوي وتقويم الفلاحين, الجد بيعرف الحساب وتقويم المواسم]
      ar: [جدّي يعرف الحساب الجاوي وتقويم الفلاحين, يعرف الجدّ الحساب وتقويم المواسم]
      en: ['Grandpa knows Javanese reckoning and the farmers'' calendar', Grandfather understands the reckoning and the seasonal calendar]
    words: [petungan, pranata mangsa]
  - id: e10
    type: speaking
    text: Neptu Kliwon iku wolu.
    meaning:
      ar_eg: قيمة يوم كليوون تمانية.
      ar: قيمة يوم كليوون ثمانية.
      en: Kliwon's day value is eight.
    words: [neptu]
dialogue:
  lines:
    - speaker: Mohamed
      text: Dimas, tulisan ing prasasti iki apa?
      ar_eg: يا ديماس، إيه الكتابة اللي على النقش ده؟
      ar: يا ديماس، ما هذه الكتابة على النقش؟
      en: Dimas, what's the writing on this inscription?
    - speaker: Mas Dimas
      text: Iku sengkalan. Saben tembung duwe angka.
      ar_eg: دي سنغكالان. كل كلمة ليها رقم.
      ar: هذه سنغكالان. لكل كلمة رقم.
      en: That's a sengkalan. Every word has a number.
    - speaker: Mohamed
      text: Kaya teka-teki! Taun pira?
      ar_eg: زي الفزورة! سنة كام؟
      ar: كأنها أحجية! أيّ سنة؟
      en: Like a riddle! What year?
    - speaker: Mas Dimas
      text: Wacanen saka mburi. Umure luwih saka satus taun.
      ar_eg: اقراها من الآخر. عمرها أكتر من ١٠٠ سنة.
      ar: اقرأها من الآخر. عمرها أكثر من مئة عام.
      en: Read it from the end. It's more than a hundred years old.
    - speaker: Mohamed
      text: Wong Jawa seneng petungan, ya?
      ar_eg: الجاوايين بيحبوا الحسابات، صح؟
      ar: الجاويون يحبّون الحساب، أليس كذلك؟
      en: Javanese people love reckoning, don't they?
    - speaker: Mas Dimas
      text: Iya. Ana windu, wuku, lan pranata mangsa kanggo petani.
      ar_eg: أيوه. فيه الويندو والووكو وتقويم الفلاحين.
      ar: نعم. هناك الويندو والووكو وتقويم الفلاحين.
      en: Yes. There's the windu, the wuku, and the farmers' calendar.
