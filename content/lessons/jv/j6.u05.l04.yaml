  - id: e03
    type: listen
    text: Patih iku pangkate ing sangisore raja.
    question:
      ar_eg: مين رتبته تحت الملك؟
      ar: من رتبته دون الملك؟
      en: Who ranks below the king?
    options: [رتبة الوزير تحت الملك, الوزير هو الملك, الكاتب أعلى من الوزير]
    answer: 0
    meaning:
      ar_eg: الوزير الأكبر رتبته تحت الملك.
      ar: رتبة الوزير الأكبر دون الملك.
      en: The chief minister ranks below the king.
    words: [patih, pangkat]
  - id: e04
    type: fill_blank
    sentence: Biyen, wong sing mrentah kabupaten diarani ___.
    meaning:
      ar_eg: زمان، اللي بيحكم المقاطعة كان اسمه ___.
      ar: قديمًا كان حاكم المقاطعة يسمّى ___.
      en: In the past, the ruler of a regency was called the ___.
    options: [adipati, carik, kawula]
    answers: [adipati]
    words: [adipati, carik, kawula]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الطبقة اللي فيها الموظفين والنبلاء في جاوة القديمة اسمها …
      ar: طبقة الموظفين والنبلاء في جاوة القديمة تسمّى …
      en: The class of officials and nobles in old Java is the …
    options: [kawula, priyayi, sinuwun]
    answer: 1
    explain:
      ar_eg: priyayi = طبقة النبلاء والموظفين.
      ar: priyayi = طبقة النبلاء والموظفين.
      en: priyayi = the noble and official class.
    words: [kawula, priyayi, sinuwun]
  - id: e06
    type: fill_blank
    sentence: Ing kantor desa, ___ sing nulis layang.
    meaning:
      ar_eg: في مكتب القرية، الـ___ هو اللي بيكتب الجوابات.
      ar: في مكتب القرية، ___ هو من يكتب الرسائل.
      en: At the village office, the ___ writes the letters.
    options: [carik, kanjeng, pangkat]
    answers: [carik]
    words: [carik, kanjeng, pangkat]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة بنقولها للملك بمعنى «جلالتك»؟
      ar: أي كلمة يخاطَب بها الملك بمعنى «جلالتك»؟
      en: Which word addresses the king as 'Your Majesty'?
    options: [patih, sinuwun, priyayi]
    answer: 1
    explain:
      ar_eg: sinuwun = جلالة الملك؛ patih = الوزير.
      ar: sinuwun = جلالة الملك؛ patih = الوزير.
      en: sinuwun = His Majesty; patih = the chief minister.
    words: [patih, sinuwun, priyayi]
  - id: e08
    type: build_sentence
    source:
      ar_eg: صاحب المقام الحاكم وصل.
      ar: وصل صاحب المقام الحاكم.
      en: The honourable regent has arrived.
    answer: Kanjeng adipati rawuh.
    distractors: [carik, pangkat]
    words: [kanjeng, adipati]
  - id: e09
    type: translate
    direction: from_target
    source_text: Patih lan carik ngadhep sinuwun.
    answers_meaning:
      ar_eg: [الوزير والكاتب قابلوا الملك, الوزير الأكبر والكاتب وقفوا قدام جلالة الملك]
      ar: [مثل الوزير والكاتب بين يدي الملك, الوزير الأكبر والكاتب في حضرة جلالة الملك]
      en: [The chief minister and the clerk appear before the king, The chief minister and the clerk come before His Majesty]
    words: [patih, carik]
  - id: e10
    type: speaking
    text: Kanjeng priyayi iku pangkate dhuwur.
    meaning:
      ar_eg: النبيل ده رتبته عالية.
      ar: هذا النبيل رتبته رفيعة.
      en: That noble gentleman has a high rank.
    words: [kanjeng, priyayi, pangkat]
dialogue:
  lines:
    - speaker: Pak Harjo
      text: Mas, aksara murda menika kangge nyerat asma tiyang ingkang pangkatipun inggil.
      ar_eg: يا أستاذ، حروف مُردا دي بنكتب بيها أسامي الناس اللي رتبتهم عالية.
      ar: حروف المُردا هذه تُكتب بها أسماء ذوي الرتب العالية.
      en: Murda letters are for writing the names of high-ranking people.
    - speaker: Mohamed
      text: Kados Kanjeng Sinuwun, Pak?
      ar_eg: زي جلالة الملك يا عم؟
      ar: مثل جلالة الملك يا سيدي؟
      en: Like His Majesty, sir?
    - speaker: Pak Harjo
      text: Leres. Ugi adipati lan patih ing jaman rumiyin.
      ar_eg: مظبوط. وكمان الحكام والوزرا أيام زمان.
      ar: صحيح. وكذلك الحكام والوزراء قديمًا.
      en: Right. And regents and chief ministers in the old days.
    - speaker: Mohamed
      text: Menawi carik desa?
      ar_eg: وكاتب القرية؟
      ar: وكاتب القرية؟
      en: And a village clerk?
    - speaker: Pak Harjo
      text: Carik menika priyayi alit. Asmanipun cekap aksara limrah.
      ar_eg: الكاتب ده من النبلاء الصغيرين. اسمه تكفيه الحروف العادية.
      ar: الكاتب من صغار النبلاء، تكفي اسمه الحروف العادية.
      en: A clerk is a minor priyayi. Ordinary letters are enough for his name.
    - speaker: Mohamed
      text: Lan kula namung kawula alit!
      ar_eg: وأنا مجرد واحد من عامة الشعب!
      ar: وأنا مجرّد واحد من العامة!
      en: And I'm just one of the common folk!
