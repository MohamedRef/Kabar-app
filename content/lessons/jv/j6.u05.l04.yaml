schema: kabar.lesson/v1
id: j6.u05.l04
language: jv
title: Kanjeng lan sinuwun
can_do:
  ar_eg: تعرف ألقاب الملوك والوزراء والطبقات في جاوة القديمة، اللي بتتكتب بحروف مُردا.
  ar: أن تعرف ألقاب الملوك والوزراء والطبقات في جاوة القديمة، وهي تُكتب بحروف المُردا.
  en: Know the titles of kings, ministers and social ranks in old Java, the names murda letters honour.
slides:
  - title: Pangkat ing kraton
    body:
      ar_eg: |
        sinuwun = «جلالة الملك»، بيتقال للملك. kanjeng = «صاحب المقام»، لقب قبل اسم النبلاء: Kanjeng Sinuwun.
        adipati = حاكم إقليم (زي المحافظ أيام زمان)، patih = الوزير الأكبر، carik = كاتب القرية.
        priyayi = طبقة الموظفين والنبلاء، زي «البهوات والباشوات» عندنا زمان. kawula = الرعية، الناس العاديين: kawula alit = عامة الشعب.
        pangkat = رتبة أو منصب. أسماء أصحاب الرتب العالية بتتكتب بحروف مُردا.
      ar: |
        sinuwun = «جلالة الملك»، يخاطَب به الملك. kanjeng = «صاحب المقام»، لقب يسبق أسماء النبلاء: Kanjeng Sinuwun.
        adipati = حاكم إقليم، patih = الوزير الأكبر، carik = كاتب القرية.
        priyayi = طبقة الموظفين والنبلاء، كالبكوات والباشوات قديمًا. kawula = الرعية: kawula alit = عامة الناس.
        pangkat = رتبة أو منصب. تُكتب أسماء ذوي الرتب العالية بحروف المُردا.
      en: |
        sinuwun = "His Majesty", used for the king. kanjeng = "the honourable", a title before a noble's name: Kanjeng Sinuwun.
        adipati = regent ruling a region, patih = chief minister (grand vizier), carik = village clerk.
        priyayi = the official and noble class. kawula = subjects, ordinary people: kawula alit = the common folk.
        pangkat = rank, position. Names of high-ranking people are written with murda letters.
    examples:
      - text: Kanjeng Sinuwun rawuh ing kraton.
        ar_eg: جلالة الملك وصل القصر.
        ar: وصل جلالة الملك إلى القصر.
        en: His Majesty has arrived at the palace.
      - text: Patih iku pangkate ing sangisore raja.
        ar_eg: الوزير الأكبر رتبته تحت الملك.
        ar: رتبة الوزير الأكبر دون الملك.
        en: The chief minister ranks below the king.
      - text: Carik desa nulis layang kanggo warga.
        ar_eg: كاتب القرية بيكتب جوابات للأهالي.
        ar: يكتب كاتب القرية الرسائل للأهالي.
        en: The village clerk writes letters for the residents.
