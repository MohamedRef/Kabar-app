dialogue:
  title: Ela-elo
  lines:
    - speaker: Mohamed
      text: Pak, "ela-elo" menika menapa?
      ar_eg: يا حاج، «ela-elo» يعني إيه؟
      ar: يا سيدي، ما «ela-elo»؟
      en: Sir, what does "ela-elo" mean?
    - speaker: Pak Ahmad
      text: Sirahe obah ngiwa nengen.
      ar_eg: الراس بتتهزّ يمين وشمال.
      ar: الرأس يتمايل يمينًا ويسارًا.
      en: The head sways left and right.
    - speaker: Pak Ahmad
      text: Miturut tafsiran, ela-elo saka "la ilaha illallah".
      ar_eg: وحسب تفسير ناس، ela-elo جاية من «لا إله إلا الله».
      ar: وبحسب أحد التفاسير، ela-elo من «لا إله إلا الله».
      en: One reading says ela-elo comes from "la ilaha illallah".
    - speaker: Mohamed
      text: Masya Allah. Lan "yen urip goleka dhuwit"?
      ar_eg: ما شاء الله. و«yen urip goleka dhuwit»؟
      ar: ما شاء الله. و«yen urip goleka dhuwit»؟
      en: Masha'Allah. And "yen urip goleka dhuwit"?
    - speaker: Pak Ahmad
      text: Tegese, yen isih urip, kudu nyambut gawe.
      ar_eg: معناها، طول ما إنت عايش، لازم تشتغل.
      ar: 'معناها: ما دمت حيًّا، فعليك أن تعمل.'
      en: It means while you're alive, you have to work.
