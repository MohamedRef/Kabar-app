id: j5.u06.l08
language: jv
title: Gundul-gundul pacul
can_do:
  ar_eg: تقرا أغنية أطفال جاوية قديمة وتفهم حكايتها والمعنى اللي ورا الصورة.
  ar: أن تقرأ أغنية أطفال جاوية قديمة وتفهم حكايتها والمعنى الكامن وراء صورتها.
  en: Read an old Javanese children's song and explain the story and the meaning behind it.
slides:
  - title: Tembang dolanan
    body:
      ar_eg: |
        «Gundul-gundul pacul» أغنية بيغنّيها أطفال جاوة وهم بيلعبوا، وفيه ناس بتنسبها لسونان كاليجاغا. الحكاية: ولد أقرع، شايل على راسه سَبَت رز، ماشي متمنظر ومش واخد باله، فالسبت وقع والرز اتفرش على الأرض كلها.
        والتفسير المشهور: الولد = قائد، والسبت = أمانة الناس. القائد اللي يتمنظر يضيّع الأمانة.
        كلمات جديدة: gembelengan = ماشي متمنظر من غير ما ياخد باله، nyunggi = يشيل على راسه، wakul = سبت الرز، ngglimpang = يقع / يتقلب، amanah = أمانة (من العربي). وgundul = أقرع، وsak latar = الحوش كله.
      ar: |
        «Gundul-gundul pacul» أغنية يغنّيها أطفال جاوة في لعبهم، وينسبها بعضهم إلى سونان كاليجاغا. حكايتها: صبي أقرع يحمل على رأسه سلة أرز، يمشي متبخترًا غافلًا، فتسقط السلة وينتثر الأرز في الفناء كله.
        والتفسير المشهور: الصبي = الحاكم، والسلة = أمانة الناس؛ فالحاكم المتبختر يضيّع الأمانة.
        كلمات جديدة: gembelengan = يتبختر غافلًا، وnyunggi = يحمل على رأسه، وwakul = سلة الأرز، وngglimpang = ينقلب ويسقط، وamanah = أمانة (من العربية). وgundul = أقرع، وsak latar = الفناء كله.
      en: |
        "Gundul-gundul pacul" is a song Javanese children sing at play; some credit it to Sunan Kalijaga. The story: a bald boy carries a rice basket on his head, swaggering and careless, so the basket tips over and the rice covers the whole yard.
        The popular reading: the boy is a leader, the basket is the people's trust. A swaggering leader spills it.
        New words: gembelengan = swaggering carelessly, nyunggi = carry on the head, wakul = rice basket, ngglimpang = tip over, amanah = trust (from Arabic). gundul = bald, and sak latar = all over the yard.
    grammar: jv.reading.written-style
    examples:
      - text: Gundul-gundul pacul-cul, gembelengan.
        ar_eg: يا أقرع يا أقرع، ماشي متمنظر.
        ar: أيها الأقرع، تمشي متبخترًا.
        en: Bald little head, swaggering along.
      - text: Nyunggi-nyunggi wakul-kul, gembelengan.
        ar_eg: شايل سبت الرز على راسه، ماشي متمنظر.
        ar: يحمل سلة الأرز على رأسه، متبخترًا.
        en: Carrying a rice basket on his head, swaggering along.
      - text: Wakul ngglimpang, segane dadi sak latar.
        ar_eg: السبت وقع، والرز اتفرش على الحوش كله.
        ar: انقلبت السلة، فانتثر الأرز في الفناء كله.
        en: The basket tips over, and the rice is all over the yard.
exercises:
  - id: e01
    type: listen
    text: Nyunggi-nyunggi wakul-kul, gembelengan.
    options:
      - Nyunggi-nyunggi pacul-cul, gembelengan.
      - Nyunggi-nyunggi wakul-kul, gembelengan.
      - Nyunggi-nyunggi wakul-kul, alon-alon.
    answer: 1
    meaning:
      ar_eg: شايل سبت الرز على راسه، ماشي متمنظر.
      ar: يحمل سلة الأرز على رأسه، متبخترًا.
      en: Carrying a rice basket on his head, swaggering along.
    words: [nyunggi, wakul, gembelengan]
  - id: e02
    type: listen
    text: Wakul ngglimpang, segane dadi sak latar.
    question:
      ar_eg: الرز حصله إيه؟
      ar: ماذا حدث للأرز؟
      en: What happened to the rice?
    options: [segane dipangan, segane mateng, segane dadi sak latar]
    answer: 2
    meaning:
      ar_eg: السبت وقع، والرز اتفرش على الحوش كله.
      ar: انقلبت السلة، فانتثر الأرز في الفناء كله.
      en: The basket tips over, and the rice is all over the yard.
    words: [ngglimpang, wakul, sak]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الولد ماشي إزاي في الأغنية؟
      ar: كيف يمشي الصبي في الأغنية؟
      en: How does the boy walk in the song?
    options: [hati-hati, sombong dan seenaknya, pelan-pelan]
    answer: 1
    explain:
      ar_eg: gembelengan = متمنظر ومش واخد باله، وده سبب إن السبت وقع.
      ar: gembelengan = متبختر غافل، وهذا سبب سقوط السلة.
      en: gembelengan = swaggering and careless, which is why the basket falls.
    words: [gembelengan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: في التفسير المشهور، السبت (wakul) يرمز لإيه؟
      ar: في التفسير المشهور، إلامَ ترمز السلة (wakul)؟
      en: In the popular reading, what does the basket (wakul) stand for?
    options: [amanah rakyat, omahe pemimpin, panganan bocah]
    answer: 0
    words: [wakul, amanah]
  - id: e05
    type: match_pairs
    pairs:
      - text: wakul
        ar_eg: سبت الرز
        ar: سلة الأرز
        en: rice basket
      - text: nyunggi
        ar_eg: يشيل على راسه
        ar: يحمل على رأسه
        en: carry on the head
      - text: ngglimpang
        ar_eg: يقع / يتقلب
        ar: ينقلب ويسقط
        en: tip over
      - text: gembelengan
        ar_eg: ماشي متمنظر
        ar: يتبختر غافلًا
        en: swaggering carelessly
      - text: amanah
        ar_eg: أمانة
        ar: أمانة
        en: trust
    words: [wakul, nyunggi, ngglimpang, gembelengan, amanah]
  - id: e06
    type: fill_blank
    sentence: Nyunggi-nyunggi ___-kul, gembelengan.
    meaning:
      ar_eg: شايل سبت الرز على راسه، ماشي متمنظر.
      ar: يحمل سلة الأرز على رأسه، متبخترًا.
      en: Carrying a rice basket on his head, swaggering along.
    options: [pacul, wakul, latar]
    answers: [wakul]
    explain:
      ar_eg: 'اللي على راسه هو wakul. والأغنية بتكرّر آخر مقطع: wakul-kul، pacul-cul.'
      ar: 'ما على رأسه هو wakul، والأغنية تكرر المقطع الأخير: wakul-kul، pacul-cul.'
      en: What's on his head is the wakul; the song echoes the last syllable, wakul-kul, pacul-cul.
    words: [wakul, nyunggi]
  - id: e07
    type: dictation
    text: Wakul ngglimpang, segane dadi sak latar.
    meaning:
      ar_eg: السبت وقع، والرز اتفرش على الحوش كله.
      ar: انقلبت السلة، فانتثر الأرز في الفناء كله.
      en: The basket tips over, and the rice is all over the yard.
    words: [wakul, ngglimpang, sak]
  - id: e08
    type: build_sentence
    source:
      ar_eg: (التفسير) السبت هو أمانة الناس.
      ar: (التفسير) السلة هي أمانة الناس.
      en: (the reading) The basket is the people's trust.
    answer: Wakul iku amanah rakyat.
    distractors: [pacul, sega]
    words: [wakul, amanah]
  - id: e09
    type: speaking
    text: Gundul-gundul pacul-cul, gembelengan.
    meaning:
      ar_eg: يا أقرع يا أقرع، ماشي متمنظر.
      ar: أيها الأقرع، تمشي متبخترًا.
      en: Bald little head, swaggering along.
    words: [gembelengan]
  - id: e10
    type: multiple_choice
    question: Segane dadi sak latar.
    question_meaning:
      ar_eg: «sak latar» معناها إيه هنا؟
      ar: ما معنى «sak latar» هنا؟
      en: What does «sak latar» mean here?
    options: ['مالي الحوش كله', 'في طبق واحد', 'شوية صغيرين']
    answer: 0
    explain:
      ar_eg: sak = se- (واحد / كامل الـ…). sak latar = الحوش كله، الرز اتفرش في كل حتة.
      ar: sak = se- (واحد، كلّ الـ…)؛ sak latar = الفناء كلّه.
      en: 'sak = se- (one, a whole …); sak latar = the whole yard: the rice is everywhere.'
    words: [sak]
dialogue:
  title: Tembang bocah-bocah Demak
  lines:
    - speaker: Pak Ahmad
      text: Mas, bocah-bocah ing Demak isih nembang Gundul-gundul pacul.
      ar_eg: يا محمد، العيال في ديماك لسه بيغنّوا «جوندول جوندول باتشول».
      ar: يا محمد، ما زال أطفال ديماك يغنّون «غوندول غوندول باتشول».
      en: Mohamed, the children in Demak still sing Gundul-gundul pacul.
    - speaker: Mohamed
      text: Tegesipun menapa, Pak?
      ar_eg: معناها إيه يا حاج؟
      ar: ما معناها يا سيدي؟
      en: What does it mean, sir?
    - speaker: Pak Ahmad
      text: Miturut tafsiran, wakul iku amanah rakyat.
      ar_eg: حسب التفسير، السبت ده أمانة الناس.
      ar: بحسب التفسير، السلة هي أمانة الناس.
      en: According to the usual reading, the basket is the people's trust.
    - speaker: Mohamed
      text: Amanah, saking basa Arab, nggih, Pak?
      ar_eg: أمانة، من العربي، صح يا حاج؟
      ar: أمانة، من العربية، أليس كذلك يا سيدي؟
      en: Amanah, from Arabic, right, sir?
    - speaker: Pak Ahmad
      text: Bener, lho. Yen pemimpin gembelengan, wakule ngglimpang.
      ar_eg: صح. لو القائد اتمنظر، السبت يقع.
      ar: صحيح. إن تبختر الحاكم، انقلبت السلة.
      en: Right. If a leader swaggers, the basket tips over.
