language: jv
title: Sluku-sluku bathok
can_do:
  ar_eg: تسمع أغنية أطفال قديمة وتفهم الحكمة اللي في آخرها.
  ar: أن تستمع إلى أغنية أطفال قديمة وتفهم الحكمة في آخرها.
  en: Follow an old children's song by ear and catch the advice at its end.
exercises:
  - id: e01
    type: listen
    text: Sluku-sluku bathok, bathoke ela-elo.
    options:
      - Sluku-sluku bathok, bathoke ela-elo.
      - Sluku-sluku bathok, bathoke ilang.
      - Sluku-sluku bocah, bocahe ela-elo.
    answer: 0
    meaning:
      ar_eg: سلوكو سلوكو يا قشرة جوز الهند، القشرة بتتهزّ يمين وشمال.
      ar: سلوكو سلوكو يا قشرة جوز الهند، والقشرة تتمايل يمينًا ويسارًا.
      en: Sluku-sluku, coconut shell, the shell sways left and right.
    explain:
      ar_eg: أغنية بيغنّيها الكبار للأطفال وهم بيلعبوا، وبينسبوها لسونان كاليجاغا. bathok = قشرة جوز الهند، وهنا كناية عن الراس. ela-elo = بيتهزّ يمين وشمال.
      ar: أغنية يغنّيها الكبار للأطفال في اللعب، ويُنسبونها إلى سونان كاليجاغا. bathok = قشرة جوز الهند، وهي هنا كناية عن الرأس، وela-elo = يتمايل يمينًا ويسارًا.
      en: Grown-ups sing this to children at play; it's credited to Sunan Kalijaga. bathok = coconut shell, here a picture of the head; ela-elo = swaying left and right.
    words: [bathok]
  - id: e02
    type: listen
    text: Wong mati ora obah, yen obah medeni bocah.
    question:
      ar_eg: لو الميت اتحرّك، يحصل إيه؟
      ar: إن تحرّك الميت، فماذا يحدث؟
      en: If the dead moved, what would happen?
    options: [bocah bungah, medeni bocah, bocah turu]
    answer: 1
    meaning:
      ar_eg: الميت ما بيتحرّكش، ولو اتحرّك يخضّ العيال.
      ar: الميت لا يتحرك، ولو تحرّك لأفزع الأطفال.
      en: The dead don't move; if they moved, they'd frighten the children.
    explain:
      ar_eg: obah = يتحرّك، medeni = يخوّف. وmati = ميت، زي الإندونيسي.
      ar: obah = يتحرك، وmedeni = يُفزع، وmati = ميت كالإندونيسية.
      en: obah = move, medeni = frightening; mati = dead, as in Indonesian.
    words: [obah, medeni]
  - id: e03
    type: listen
    text: Yen urip goleka dhuwit.
    question:
      ar_eg: الأغنية بتنصح الحي يعمل إيه؟
      ar: بمَ تنصح الأغنيةُ الحيَّ؟
      en: What does the song tell the living to do?
    options: [turu wae, dolanan wae, goleka dhuwit]
    answer: 2
    meaning:
      ar_eg: وطول ما إنت عايش، اسعى على رزقك.
      ar: وما دمت حيًّا، فاسعَ في طلب الرزق.
      en: While you're alive, go and earn a living.
    explain:
      ar_eg: 'urip = عايش (hidup). goleka = أمر من golek (يدوّر): «دوّر على».'
      ar: 'urip = حيّ (hidup)، وgoleka أمر من golek (يبحث): «ابحث عن».'
      en: urip = alive (hidup); goleka is the command form of golek (look for).
    words: [urip]
  - id: e04
    type: match_pairs
    pairs:
      - text: bathok
        ar_eg: قشرة جوز الهند
        ar: قشرة جوز الهند
        en: coconut shell
      - text: obah
        ar_eg: يتحرّك
        ar: يتحرك
        en: move
      - text: medeni
        ar_eg: يخوّف
        ar: مُفزع
        en: frightening
      - text: urip
        ar_eg: عايش
        ar: حيّ
        en: alive
      - text: goleka
        ar_eg: دوّر على (أمر)
        ar: ابحث عن (أمر)
        en: go and look for
    words: [bathok, obah, medeni, urip]
