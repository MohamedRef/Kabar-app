schema: kabar.lesson/v1
id: j5.u01.l06
language: jv
title: Artikel Semarang
can_do:
  ar_eg: تقرا مقالة عن سيمارانج.
  ar: أن تقرأ مقالة عن سيمارانج.
  en: Read an article about Semarang.
slides:
  - title: Artikel cekak
    body:
      ar_eg: |
        دي بداية مقالة قصيرة عن سيمارانج، زي اللي في ويكيبيديا الجاوية. اقراها ودوّر على الهيكل: iku (تعريف)، ana ing (فين)، kang (وصف)، yaiku (تفصيل).
        كلمتين جداد: pulo = جزيرة (pulau)، وsegara = بحر (laut)، وبتتنطق «سِغورو».
      ar: |
        هذه بداية مقالة قصيرة عن سيمارانج كما في ويكيبيديا الجاوية. اقرأها وابحث عن هيكلها: iku (التعريف)، وana ing (المكان)، وkang (الوصف)، وyaiku (التفصيل).
        وكلمتان جديدتان: pulo = جزيرة (pulau)، وsegara = بحر (laut) وتُنطق «سِغورو».
      en: |
        Here's the start of a short article about Semarang, the way Javanese Wikipedia writes it. Read it and find the skeleton: iku (definition), ana ing (where), kang (description), yaiku (details).
        Two new words: pulo = island (pulau), and segara = sea (laut), said "segoro".
    grammar: jv.reading.written-style
    examples:
      - text: Semarang iku ibukutha Provinsi Jawa Tengah.
        ar_eg: سيمارانج هي عاصمة محافظة جاوة الوسطى.
        ar: سيمارانج هي عاصمة إقليم جاوة الوسطى.
        en: Semarang is the capital of Central Java Province.
      - text: Kutha iki ana ing pesisir lor pulo Jawa, ing pinggir Segara Jawa.
        ar_eg: المدينة دي على الساحل الشمالي لجزيرة جاوة، على بحر جاوة.
        ar: تقع هذه المدينة على الساحل الشمالي لجزيرة جاوة، على بحر جاوة.
        en: The city lies on the north coast of the island of Java, on the Java Sea.
      - text: Ing Semarang ana papan-papan kang misuwur, yaiku Kutha Lama, Lawang Sewu lan Simpang Lima.
        ar_eg: في سيمارانج أماكن مشهورة، هي كوتا لاما ولاوانج سيوو وسيمبانج ليما.
        ar: في سيمارانج أماكن مشهورة، هي كوتا لاما ولاوانغ سيوو وسيمبانغ ليما.
        en: Semarang has famous places, namely Kota Lama, Lawang Sewu and Simpang Lima.
exercises:
  - id: e01
    type: listen
    text: Kutha iki ana ing pesisir lor pulo Jawa, ing pinggir Segara Jawa.
    question:
      ar_eg: سيمارانج فين؟
      ar: أين تقع سيمارانج؟
      en: Where is Semarang?
    options: [ing pesisir kidul, ing pesisir lor, ing tengah pulo Jawa]
    answer: 1
    meaning:
      ar_eg: المدينة دي على الساحل الشمالي لجزيرة جاوة، على بحر جاوة.
      ar: تقع هذه المدينة على الساحل الشمالي لجزيرة جاوة، على بحر جاوة.
      en: The city lies on the north coast of the island of Java, on the Java Sea.
    words: [pulo, segara]
  - id: e02
    type: multiple_choice
    question: Ing Semarang ana papan-papan kang misuwur, yaiku Kutha Lama, Lawang Sewu lan Simpang Lima.
    question_meaning:
      ar_eg: الجملة دي بتعدّ كام مكان مشهور؟
      ar: كم مكانًا مشهورًا تعدّ هذه الجملة؟
      en: How many famous places does this sentence list?
    options: [loro, papat, telu]
    answer: 2
    explain:
      ar_eg: بعد yaiku فيه تلاتة، Kutha Lama وLawang Sewu وSimpang Lima.
      ar: بعد yaiku ثلاثة، Kutha Lama وLawang Sewu وSimpang Lima.
      en: After yaiku come three, Kutha Lama, Lawang Sewu and Simpang Lima.
    words: [papan, misuwur, yaiku]
