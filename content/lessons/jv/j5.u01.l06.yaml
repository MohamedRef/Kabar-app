  - id: e03
    type: listen
    text: Gunung Wilis dumunung cedhak Madiun, esuk-esuk ketutup pedhut.
    question:
      ar_eg: الجبل عامل إزاي الصبح؟
      ar: كيف يكون الجبل صباحًا؟
      en: What is the mountain like in the morning?
    options: [الجبل جنب ماديون ومغطّي بالضباب الصبح, الجبل بعيد ومفيهوش ضباب, فيه مطر على الجبل بالليل]
    answer: 0
    meaning:
      ar_eg: جبل ويليس بيقع جنب ماديون، والصبح بيبقى مغطّي بالضباب.
      ar: يقع جبل ويليس قرب ماديون، ويغطيه الضباب صباحًا.
      en: Mount Wilis lies near Madiun and is covered in fog in the morning.
    words: [dumunung, pedhut]
  - id: e04
    type: fill_blank
    sentence: Kutha Madiun ___ ing sisih kulon Jawa Timur.
    meaning:
      ar_eg: مدينة ماديون ___ في الحتة الغربية من جاوة الشرقية.
      ar: مدينة ماديون ___ في غرب جاوة الشرقية.
      en: Madiun city ___ in the west of East Java.
    options: [dumunung, kondhang, pedhut]
    answers: [dumunung]
    words: [dumunung, kondhang, pedhut]
    explain:
      ar_eg: dumunung = واقع في (مكان). kondhang = مشهور وpedhut = ضباب.
      ar: dumunung تعني يقع في. أما kondhang فمشهور وpedhut ضباب.
      en: dumunung means "lies/is located". kondhang is famous and pedhut is fog.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «الناس اللي ساكنين في مكان»؟
      ar: أي كلمة تعني «الناس الذين يسكنون مكانًا»؟
      en: Which word means 'the people who live in a place'?
    options: [pedunung, tlatah, cacah]
    answer: 0
    explain:
      ar_eg: pedunung = السكان. tlatah هي الأرض نفسها، وcacah هو العدد.
      ar: pedunung = السكان؛ tlatah هي الأرض، وcacah هو العدد.
      en: pedunung = inhabitants; tlatah is the land itself and cacah is the number.
    words: [pedunung, tlatah, cacah]
  - id: e06
    type: fill_blank
    sentence: ___ pedunung Kutha Madiun kurang luwih 200.000.
    meaning:
      ar_eg: ___ سكان مدينة ماديون حوالي ٢٠٠ ألف.
      ar: ___ سكان مدينة ماديون نحو ٢٠٠ ألف.
      en: The ___ of Madiun city's inhabitants is about 200,000.
    options: [Cacahe, Tlatahe, Pedhute]
    answers: [Cacahe]
    words: [cacah, tlatah, pedhut]
    explain:
      ar_eg: cacahe = عدد بتاعه. tlatahe = منطقته وpedhute = ضبابه، ومش بيتعدّوا.
      ar: cacahe تعني عدده. أما tlatahe (منطقته) وpedhute (ضبابه) فلا تُعدّان.
      en: cacahe means "its number". tlatahe (its region) and pedhute (its fog) can't be counted.
  - id: e07
    type: multiple_choice
    question: Gunung Lawu ana ing sisih ___ Madiun.
    options: [kulon, pedhut, wewengkon]
    answer: 0
    explain:
      ar_eg: 'جبل لاوو غرب ماديون، على حدود جاوة الوسطى: kulon = غرب.'
      ar: 'يقع جبل لاوو غرب ماديون على حدود جاوة الوسطى: kulon = الغرب.'
      en: 'Mount Lawu lies west of Madiun, on the Central Java border: kulon = west.'
    words: [kulon, pedhut, wewengkon]
  - id: e08
    type: build_sentence
    source:
      ar_eg: سكان ماديون بيحبوا البيتشل.
      ar: يحب سكان ماديون البيتشل.
      en: Madiun's inhabitants love pecel.
    answer: Pedunung Madiun seneng pecel.
    distractors: [kulon, pedhut]
    words: [pedunung]
    explain:
      ar_eg: pedunung = سكان. kulon = غرب وpedhut = ضباب، ومش في المعنى.
      ar: pedunung تعني السكان. أما kulon (غرب) وpedhut (ضباب) فليستا في المعنى.
      en: pedunung means inhabitants. kulon (west) and pedhut (fog) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Tlatah Madiun kalebu wewengkon Mataraman.
    answers_meaning:
      ar_eg: [منطقة ماديون تبع نطاق ماتارامان, أرض ماديون من حتة ماتارامان]
      ar: [تدخل منطقة ماديون ضمن نطاق ماتارامان, إقليم ماديون جزء من منطقة ماتارامان]
      en: [The Madiun territory is part of the Mataraman area, The land of Madiun belongs to the Mataraman region]
    words: [tlatah, wewengkon]
  - id: e10
    type: speaking
    text: Wewengkon sisih kulon kondhang banget.
    meaning:
      ar_eg: الحتة الغربية مشهورة أوي.
      ar: المنطقة الغربية مشهورة جدًا.
      en: The western area is very famous.
    words: [wewengkon, kulon, kondhang]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mbak, Madiun iki dumunung ing ngendi ta?
      ar_eg: يا مبك، ماديون دي بتقع فين؟
      ar: يا مبك، أين تقع ماديون؟
      en: Mbak, where exactly is Madiun?
    - speaker: Mbak Ayu
      text: Ing sisih kulon Jawa Timur, cedhak tapel wates Jawa Tengah, lho.
      ar_eg: في الحتة الغربية من جاوة الشرقية، جنب حدود جاوة الوسطى.
      ar: في غرب جاوة الشرقية، قرب حدود جاوة الوسطى.
      en: In the west of East Java, near the Central Java border.
    - speaker: Mohamed
      text: Pedununge akeh, to?
      ar_eg: سكانها كتير، صح؟
      ar: سكانها كثيرون، أليس كذلك؟
      en: Lots of people live here, right?
    - speaker: Mbak Ayu
      text: Cacahe kurang luwih rong atus ewu. Ora akeh, nanging rame.
      ar_eg: عددهم حوالي ميتين ألف. مش كتير، بس الدنيا زحمة.
      ar: عددهم نحو مئتي ألف. ليسوا كثيرين، لكنها مدينة حيّة.
      en: About two hundred thousand. Not many, but it's lively.
    - speaker: Mohamed
      text: Lha kok kondhang banget?
      ar_eg: أمال مشهورة أوي كده ليه؟
      ar: فلماذا هي مشهورة جدًا إذن؟
      en: So why is it so famous?
    - speaker: Mbak Ayu
      text: Pecel lan brem, ya ta! Lan esuk-esuk Wilis ketutup pedhut, apik tenan.
      ar_eg: البيتشل والبريم طبعًا! والصبح جبل ويليس بيتغطّى بالضباب، حاجة حلوة أوي.
      ar: البيتشل والبريم طبعًا! وصباحًا يغطي الضباب جبل ويليس، منظر رائع.
      en: Pecel and brem, of course! And in the morning Wilis is wrapped in fog. Gorgeous.
