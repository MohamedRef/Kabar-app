schema: kabar.lesson/v1
id: j5.u01.l06
language: jv
title: Artikel Stasiun Tawang
can_do:
  ar_eg: تقرا مقالة قصيرة عن محطة تاوانج وتفهم هي فين ورايحة على فين.
  ar: أن تقرأ مقالة قصيرة عن محطة تاوانغ وتفهم موقعها ووجهات قطاراتها.
  en: Read a short article about Tawang Station and find where it is and where its trains go.
slides:
  - title: Stasiun Tawang
    body:
      ar_eg: |
        إنت دلوقتي واقف في محطة تاوانج نفسها، ودي مقالة قصيرة عنها بأسلوب ويكيبيديا الجاوية. مفيش كلمات جديدة، كله من الوحدة دي.
        دوّر على الهيكل: iku (تعريف)، ana ing (فين)، kang (وصف)، yaiku (تفصيل). وcedhak = قريب (dekat)، وkutha-kutha = مدن (التكرار = جمع).
      ar: |
        أنت الآن في محطة تاوانغ نفسها، وهذه مقالة قصيرة عنها بأسلوب ويكيبيديا الجاوية. لا كلمات جديدة، فكلها من هذه الوحدة.
        ابحث عن الهيكل: iku (التعريف)، وana ing (المكان)، وkang (الوصف)، وyaiku (التفصيل). وcedhak = قريب (dekat)، وkutha-kutha = مدن (التكرار للجمع).
      en: |
        You're standing in Tawang Station itself, and here is a short article about it in Javanese Wikipedia style. No new words: it's all from this unit.
        Find the skeleton: iku (definition), ana ing (where), kang (description), yaiku (details). cedhak = near (dekat), and kutha-kutha = cities (doubling makes a plural).
    grammar: jv.reading.written-style
    examples:
      - text: Stasiun Tawang iku stasiun sepur kang misuwur ing Semarang.
        ar_eg: محطة تاوانج هي محطة قطر مشهورة في سيمارانج.
        ar: محطة تاوانغ محطة قطارات مشهورة في سيمارانج.
        en: Tawang Station is a famous railway station in Semarang.
      - text: Stasiun iki ana ing cedhak Kutha Lama, ora adoh saka pesisir lor.
        ar_eg: المحطة دي قريبة من كوتا لاما، ومش بعيدة عن الساحل الشمالي.
        ar: تقع هذه المحطة قرب كوتا لاما، غير بعيدة عن الساحل الشمالي.
        en: This station is near Kota Lama, not far from the north coast.
      - text: Saka Tawang ana sepur menyang kutha-kutha gedhe, yaiku Jakarta lan Surabaya.
        ar_eg: من تاوانج فيه قطرات رايحة مدن كبيرة، هي جاكرتا وسورابايا.
        ar: من تاوانغ قطارات إلى مدن كبيرة، هي جاكرتا وسورابايا.
        en: From Tawang there are trains to big cities, namely Jakarta and Surabaya.
exercises:
  - id: e01
    type: listen
    text: Saka Tawang ana sepur menyang kutha-kutha gedhe, yaiku Jakarta lan Surabaya.
    question:
      ar_eg: القطرات اللي من تاوانج رايحة فين؟
      ar: إلى أين تذهب القطارات من تاوانغ؟
      en: Where do the trains from Tawang go?
    options: [Kudus lan Demak, Jakarta lan Surabaya, Solo lan Yogya]
    answer: 1
    meaning:
      ar_eg: من تاوانج فيه قطرات رايحة مدن كبيرة، هي جاكرتا وسورابايا.
      ar: من تاوانغ قطارات إلى مدن كبيرة، هي جاكرتا وسورابايا.
      en: From Tawang there are trains to big cities, namely Jakarta and Surabaya.
    words: [sepur, yaiku]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: حسب المقالة، محطة تاوانج قريبة من إيه؟
      ar: بحسب المقالة، قرب أي مكان تقع محطة تاوانغ؟
      en: According to the article, what is Tawang Station near?
    options: [Lawang Sewu, Simpang Lima, Kutha Lama]
    answer: 2
    explain:
      ar_eg: «ana ing cedhak Kutha Lama» = قريبة من كوتا لاما.
      ar: «ana ing cedhak Kutha Lama» = تقع قرب كوتا لاما.
      en: '"ana ing cedhak Kutha Lama" = it is near Kota Lama.'
    words: [cedhak]
  - id: e03
    type: multiple_choice
    question: Stasiun Tawang iku stasiun sepur kang misuwur ing Semarang.
    question_meaning:
      ar_eg: أنهي كلمة هنا بتقدّم التعريف، زي adalah؟
      ar: أي كلمة هنا تقدّم التعريف كما تفعل adalah؟
      en: Which word here introduces the definition, like adalah?
    options: [iku, kang, ing]
    answer: 0
    explain:
      ar_eg: iku بين الاسم وتعريفه = adalah. kang = yang، وing = di.
      ar: iku بين الاسم وتعريفه = adalah، وkang = yang، وing = di.
      en: iku between a noun and its definition = adalah; kang = yang, ing = di.
    words: [iku, kang]
  - id: e04
    type: match_pairs
    pairs:
      - text: cedhak
        ar_eg: قريب
        ar: قريب
        en: near
      - text: adoh
        ar_eg: بعيد
        ar: بعيد
        en: far
      - text: misuwur
        ar_eg: مشهور
        ar: مشهور
        en: famous
      - text: kutha-kutha
        ar_eg: مدن
        ar: مدن
        en: cities
      - text: sepur
        ar_eg: قطر
        ar: قطار
        en: train
    words: [cedhak, adoh, misuwur, sepur]
  - id: e05
    type: fill_blank
    sentence: Stasiun iki ana ing cedhak Kutha Lama, ora ___ saka pesisir lor.
    meaning:
      ar_eg: المحطة دي قريبة من كوتا لاما، ومش بعيدة عن الساحل الشمالي.
      ar: تقع هذه المحطة قرب كوتا لاما، غير بعيدة عن الساحل الشمالي.
      en: This station is near Kota Lama, not far from the north coast.
    options: [cedhak, adoh, lawas]
    answers: [adoh]
    words: [adoh, pesisir]
  - id: e06
    type: dictation
    text: Stasiun Tawang ana ing cedhak Kutha Lama.
    meaning:
      ar_eg: محطة تاوانج قريبة من كوتا لاما.
      ar: تقع محطة تاوانغ قرب كوتا لاما.
      en: Tawang Station is near Kota Lama.
    words: [cedhak]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (بأسلوب المقالة) تاوانج محطة مشهورة في سيمارانج.
      ar: (بأسلوب المقالة) تاوانغ محطة مشهورة في سيمارانج.
      en: (article style) Tawang is a famous station in Semarang.
    answer: Tawang iku stasiun kang misuwur ing Semarang.
    distractors: [adoh, lor]
    words: [misuwur, kang]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأسلوب المقالة) من سيمارانج فيه قطرات رايحة جاكرتا وسورابايا.
      ar: (بأسلوب المقالة) من سيمارانج قطارات إلى جاكرتا وسورابايا.
      en: (article style) From Semarang there are trains to Jakarta and Surabaya.
    answers:
      - Saka Semarang ana sepur menyang Jakarta lan Surabaya.
      - Saka Semarang ana sepur menyang Surabaya lan Jakarta.
      - Saka Semarang ana sepur menyang Jakarta karo Surabaya.
      - Saka Semarang ana sepur menyang kutha Jakarta lan Surabaya.
      - Saka Semarang ana sepur menyang Jakarta lan menyang Surabaya.
      - Ing Semarang ana sepur menyang Jakarta lan Surabaya.
    words: [sepur]
dialogue:
  title: Ing ngarep Stasiun Tawang
  lines:
    - speaker: Mohamed
      text: Mbak, artikel iki ngomong saka Tawang ana sepur menyang Surabaya.
      ar_eg: يا آيو، المقالة دي بتقول إن من تاوانج فيه قطر رايح سورابايا.
      ar: يا آيو، تقول هذه المقالة إن من تاوانغ قطارًا إلى سورابايا.
      en: Ayu, this article says there are trains from Tawang to Surabaya.
    - speaker: Mbak Ayu
      text: Bener. Saben dina ana sepur menyang Surabaya lan Jakarta.
      ar_eg: صح. كل يوم فيه قطرات رايحة سورابايا وجاكرتا.
      ar: صحيح. كل يوم هناك قطارات إلى سورابايا وجاكرتا.
      en: Right. Every day there are trains to Surabaya and Jakarta.
    - speaker: Mohamed
      text: Kutha Lama cedhak saka kene, ta?
      ar_eg: كوتا لاما قريبة من هنا، مش كده؟
      ar: كوتا لاما قريبة من هنا، أليس كذلك؟
      en: Kota Lama is near here, isn't it?
    - speaker: Mbak Ayu
      text: Cedhak banget. Mlaku wae, ora adoh.
      ar_eg: قريبة جدًا. نمشي عادي، مش بعيدة.
      ar: قريبة جدًا. نمشي إليها، ليست بعيدة.
      en: Very near. We can just walk, it's not far.
    - speaker: Mohamed
      text: Ayo! Aku seneng gedhong-gedhong lawas.
      ar_eg: يلا! أنا بحب المباني القديمة.
      ar: هيا! أحب المباني القديمة.
      en: Let's go! I love old buildings.
