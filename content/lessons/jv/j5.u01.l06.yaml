        ar: يقع
        en: be located
      - text: pedunung
        ar_eg: السكان
        ar: السكان
        en: inhabitants
    words: [tlatah, wewengkon, dumunung, pedunung]
  - id: e02
    type: match_pairs
    pairs:
      - text: cacah
        ar_eg: عدد
        ar: عدد
        en: number, count
      - text: kondhang
        ar_eg: مشهور
