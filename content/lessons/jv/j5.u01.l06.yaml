schema: kabar.lesson/v1
id: j5.u01.l06
language: jv
title: Tlatah Madiun
can_do:
  ar_eg: 'توصف ماديون زي ما مقالة ويكيبيديا بتوصفها: بتقع فين، سكانها كام، ومشهورة بإيه.'
  ar: 'أن تصف ماديون كما يصفها مقال ويكيبيديا: موقعها وعدد سكانها وبمَ تشتهر.'
  en: 'Describe Madiun the way a Wikipedia article does: where it lies, how many live there and what it is famous for.'
slides:
  - title: Kutha Madiun
    body:
      ar_eg: |
        مقالات الويكيبيديا الجاوي بتبدأ دايمًا بالمكان: tlatah = منطقة، أرض تبع حد، وwewengkon = نطاق، حتة إدارية.
        dumunung = بيقع (في مكان)، pedunung = السكان، cacah = عدد (cacahe pedunung = عدد السكان).
        kondhang = مشهور، kulon = الغرب، pedhut = ضباب، زي اللي بيغطي جبل ويليس الصبح.
      ar: |
        تبدأ مقالات ويكيبيديا الجاوية عادةً بالمكان: tlatah = إقليم، أرض، وwewengkon = نطاق، منطقة إدارية.
        dumunung = يقع، pedunung = السكان، cacah = عدد (cacahe pedunung = عدد السكان).
        kondhang = مشهور، kulon = الغرب، pedhut = ضباب، كالذي يغطي جبل ويليس صباحًا.
      en: |
        Javanese Wikipedia articles usually open with the place: tlatah = territory, land; wewengkon = area, district.
        dumunung = be located, pedunung = inhabitants, cacah = number, count (cacahe pedunung = the population).
        kondhang = famous, kulon = west, pedhut = fog, like the fog over Mount Wilis in the morning.
    examples:
      - text: Madiun dumunung ing sisih kulon Jawa Timur.
        ar_eg: ماديون بتقع في الحتة الغربية من جاوة الشرقية.
        ar: تقع ماديون في الجزء الغربي من جاوة الشرقية.
        en: Madiun lies in the western part of East Java.
      - text: Cacahe pedunung Kutha Madiun kurang luwih 200.000.
        ar_eg: عدد سكان مدينة ماديون حوالي ٢٠٠ ألف.
        ar: يبلغ عدد سكان مدينة ماديون نحو ٢٠٠ ألف.
        en: Madiun city has about 200,000 inhabitants.
      - text: Madiun kondhang amarga pecel lan brem.
        ar_eg: ماديون مشهورة بالبيتشل والبريم.
        ar: تشتهر ماديون بالبيتشل والبريم.
        en: Madiun is famous for pecel and brem.
exercises:
  - id: e01
    type: match_pairs
    pairs:
