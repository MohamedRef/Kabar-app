dialogue:
  title: Sawise maca artikel
  lines:
    - speaker: Mohamed
      text: Mbak, artikel iki ngomong ana papan misuwur telu ing Semarang.
      ar_eg: يا آيو، المقالة دي بتقول فيه تلات أماكن مشهورة في سيمارانج.
      ar: يا آيو، تقول هذه المقالة إن في سيمارانج ثلاثة أماكن مشهورة.
      en: Ayu, this article says there are three famous places in Semarang.
    - speaker: Mbak Ayu
      text: Iya, Kutha Lama, Lawang Sewu lan Simpang Lima.
      ar_eg: آه، كوتا لاما ولاوانج سيوو وسيمبانج ليما.
      ar: نعم، كوتا لاما ولاوانغ سيوو وسيمبانغ ليما.
      en: Yes, Kota Lama, Lawang Sewu and Simpang Lima.
    - speaker: Mohamed
      text: Segara Jawa adoh saka kene?
      ar_eg: بحر جاوة بعيد عن هنا؟
      ar: هل بحر جاوة بعيد من هنا؟
      en: Is the Java Sea far from here?
    - speaker: Mbak Ayu
      text: Ora adoh. Semarang iku kutha pesisir.
      ar_eg: مش بعيد. سيمارانج مدينة ساحلية.
      ar: ليس بعيدًا. سيمارانج مدينة ساحلية.
      en: Not far. Semarang is a coastal city.
    - speaker: Mohamed
      text: Ayo menyang Simpang Lima, banjur mangan lumpia!
      ar_eg: يلا نروح سيمبانج ليما، وبعدين ناكل لومبيا!
      ar: هيا إلى سيمبانغ ليما، ثم نأكل اللومبيا!
      en: Let's go to Simpang Lima, then eat lumpia!
