schema: kabar.lesson/v1
id: j6.u04.l09
language: jv
title: Layang kanggo Pak Slamet
can_do:
  ar_eg: تقرا جواب قصير بالكراما مكتوب بالخط الجاوي.
  ar: أن تقرأ رسالة قصيرة بالكراما مكتوبة بالخط الجاوي.
  en: Read a short krama letter in aksara Jawa.
slides:
  - title: Layang krama
    body:
      ar_eg: |
        محمد كتب جواب صغير لـ Pak Slamet، صاحب ورشة الفضة، بالكراما وبالخط الجاوي.
        بص على الـ pasangan: enjing (n قبل j بتتكتب nya: ꦚ꧀ꦗ)، sampun saged (n + sa جنب الحرف)، saged maos (d + ma)، nuwun sanget (n + sa).
      ar: |
        كتب محمد رسالة صغيرة إلى Pak Slamet صاحب ورشة الفضة، بالكراما وبالخط الجاوي.
        لاحظ الـ pasangan: enjing (تُكتب n قبل j نيا: ꦚ꧀ꦗ)، sampun saged (n + sa بجانب الحرف)، saged maos (d + ma)، nuwun sanget (n + sa).
      en: |
        Mohamed has written a little letter to Pak Slamet, the silversmith, in krama and in aksara Jawa.
        Spot the pasangan: enjing (n before j is written nya: ꦚ꧀ꦗ), sampun saged (n + sa, beside), saged maos (d + ma), nuwun sanget (n + sa).
    grammar: jv.aksara.pasangan
    examples:
      - text: ꦱꦸꦒꦼꦁꦲꦺꦚ꧀ꦗꦶꦁ꧈ꦥꦏ꧀꧉ (Sugeng enjing, Pak.)
        ar_eg: صباح الخير يا أستاذ.
        ar: صباح الخير يا سيدي.
        en: Good morning, sir.
      - text: ꦏꦸꦭꦱꦩ꧀ꦥꦸꦤ꧀ꦱꦒꦼꦢ꧀ꦩꦲꦺꦴꦱ꧀ꦭꦤ꧀ꦚꦼꦫꦠ꧀꧉ (Kula sampun saged maos lan nyerat.)
        ar_eg: أنا بقيت أعرف أقرا وأكتب.
        ar: صرتُ أستطيع القراءة والكتابة.
        en: I can read and write now.
      - text: ꦩꦠꦸꦂꦤꦸꦮꦸꦤ꧀ꦱꦔꦼꦠ꧀꧉ꦩꦺꦴꦲꦩꦺꦢ꧀ (Matur nuwun sanget. Mohamed)
        ar_eg: متشكر جدًا. محمد
        ar: شكرًا جزيلًا. محمد
        en: Thank you very much. Mohamed
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الجواب مكتوب بأنهي مستوى كلام؟
      ar: بأي مستوى كلام كُتبت الرسالة؟
      en: Which speech level is the letter written in?
    options: [ngoko, krama, krama inggil]
    answer: 1
    explain:
      ar_eg: kula وsampun وsaged وmaos وsanget كلها كراما، لأن Pak Slamet أكبر ومحترم.
      ar: kula وsampun وsaged وmaos وsanget كلها كراما، لأن Pak Slamet أكبر سنًّا ومحترم.
      en: kula, sampun, saged, maos and sanget are all krama, since Pak Slamet is an elder.
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: محمد كتب الجواب إمتى في اليوم؟
      ar: في أي وقت من اليوم كتب محمد الرسالة؟
      en: At what time of day was the letter written?
    options: [sore, bengi, esuk]
    answer: 2
    explain:
      ar_eg: Sugeng enjing = صباح الخير، وenjing هي كراما esuk.
      ar: Sugeng enjing = صباح الخير، وenjing كراما esuk.
      en: Sugeng enjing = good morning; enjing is the krama of esuk.
  - id: e03
    type: listen
    text: Kula sampun saged maos lan nyerat.
    question:
      ar_eg: محمد بيقول إنه بقى يعرف يعمل إيه؟
      ar: ماذا يقول محمد إنه صار يستطيع؟
      en: What does Mohamed say he can do now?
    options: [maos lan nyerat, nyerat kemawon, maos kemawon]
    answer: 0
    meaning:
      ar_eg: أنا بقيت أعرف أقرا وأكتب.
      ar: صرتُ أستطيع القراءة والكتابة.
      en: I can read and write now.
  - id: e04
    type: match_pairs
    pairs:
      - text: saged
        ar_eg: يقدر (كراما isa)
        ar: يستطيع (كراما isa)
        en: can (krama of isa)
      - text: maos
        ar_eg: يقرا (كراما maca)
        ar: يقرأ (كراما maca)
        en: read (krama of maca)
      - text: nyerat
        ar_eg: يكتب (كراما nulis)
        ar: يكتب (كراما nulis)
        en: write (krama of nulis)
      - text: sanget
        ar_eg: قوي / جدًا (كراما banget)
        ar: جدًّا (كراما banget)
        en: very (krama of banget)
    words: [pasangan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "في ꦲꦺꦚ꧀ꦗꦶꦁ، ليه الـ n بتتكتب ꦚ (nya)؟"
      ar: "في ꦲꦺꦚ꧀ꦗꦶꦁ، لماذا تُكتب الـ n نيا ꦚ؟"
      en: "In ꦲꦺꦚ꧀ꦗꦶꦁ, why is the n written ꦚ (nya)?"
    options: ["Ana j ing mburine.", "Iku krama.", "Ana ing wiwitan."]
    answer: 0
    explain:
      ar_eg: "الـ n اللي قبل c أو j بتتكتب nya، وتحتها pasangan ja: ꦚ꧀ꦗ. زي kanca: ꦏꦚ꧀ꦕ."
      ar: "تُكتب الـ n قبل c أو j نيا، وتحتها pasangan ja: ꦚ꧀ꦗ، كما في kanca: ꦏꦚ꧀ꦕ."
      en: "An n before c or j is written nya, with pasangan ja under it: ꦚ꧀ꦗ. Like kanca: ꦏꦚ꧀ꦕ."
    words: [pasangan]
  - id: e06
    type: fill_blank
    sentence: Matur nuwun ___.
    meaning:
      ar_eg: متشكر جدًا (بالكراما).
      ar: شكرًا جزيلًا (بالكراما).
      en: Thank you very much (krama).
    options: [banget, sanget, saged]
    answers: [sanget]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦱꦸꦒꦼꦁꦲꦺꦚ꧀ꦗꦶꦁ꧈ꦥꦏ꧀꧉"
      ar: "اكتب بالحروف اللاتينية: ꦱꦸꦒꦼꦁꦲꦺꦚ꧀ꦗꦶꦁ꧈ꦥꦏ꧀꧉"
      en: "Write in Latin letters: ꦱꦸꦒꦼꦁꦲꦺꦚ꧀ꦗꦶꦁ꧈ꦥꦏ꧀꧉"
    answers: ["Sugeng enjing, Pak.", sugeng enjing pak]
    words: [pasangan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: "اكتب «saged maos» مقطع مقطع. الـ pasangan بتتلزق في المقطع اللي قبلها."
      ar: "اكتب «saged maos» مقطعًا مقطعًا. تلتصق الـ pasangan بالمقطع الذي قبلها."
      en: Build "saged maos", syllable by syllable. The pasangan sticks to the syllable before it.
    answer: ꦱ ꦒꦼꦢ꧀ꦩ ꦲꦺꦴꦱ꧀
    distractors: ["ꦒꦼꦢ꧀"]
    words: [pasangan]
  - id: e09
    type: speaking
    text: Sugeng enjing, Pak. Kula sampun saged maos lan nyerat.
    meaning:
      ar_eg: صباح الخير يا أستاذ. أنا بقيت أعرف أقرا وأكتب.
      ar: صباح الخير يا سيدي. صرتُ أستطيع القراءة والكتابة.
      en: Good morning, sir. I can read and write now.
dialogue:
  title: Wangsulan Pak Slamet
  lines:
    - speaker: Pak Slamet
      text: Mas Mohamed, kula sampun nampi serat panjenengan.
      ar_eg: يا محمد، جوابك وصلني.
      ar: يا محمد، وصلتني رسالتك.
      en: Mohamed, I've received your letter.
    - speaker: Mohamed
      text: Menapa saged dipunwaos, Pak?
      ar_eg: عرفت تقراه يا أستاذ؟
      ar: هل أمكنك قراءتها يا سيدي؟
      en: Could you read it, sir?
    - speaker: Pak Slamet
      text: Saged sanget! Pasanganipun leres sedaya.
      ar_eg: طبعًا! الـ pasangan كلها صح.
      ar: بالتأكيد! الـ pasangan كلها صحيحة.
      en: Perfectly! Your pasangan are all correct.
    - speaker: Mohamed
      text: Alhamdulillah. Matur nuwun, Pak.
      ar_eg: الحمد لله. متشكر يا أستاذ.
      ar: الحمد لله. شكرًا يا سيدي.
      en: Alhamdulillah. Thank you, sir.
review:
  status: draft
