schema: kabar.lesson/v1
id: j4.u02.l03
language: jv
title: Asta lan mustaka
can_do:
  ar_eg: تتكلم عن جسم الكبير وصحته، وعن جسمك إنت.
  ar: أن تتحدث عن جسد الكبير وصحته، وعن جسدك.
  en: Talk about an elder's body and health, and about your own.
slides:
  - title: Tangan → asta, sirah → mustaka
    body:
      ar_eg: |
        حتى جسم الكبير ليه كلمات مرفوعة:
        - الإيد: tangan (زي الإندونيسي بالظبط) → asta (krama inggil).
        - الراس: sirah (نغوكو وكراما؛ بالإندونيسي kepala) → mustaka (krama inggil).
        «Astanipun Simbah sakit» = إيد تيتة بتوجعها.
        بس جسمك إنت بالكلمة العادية حتى وانت بتتكلم كراما: «Sirah kula sakit» = راسي بتوجعني. «Mustaka kula» كأنك بتقول «رأسي الشريف».
      ar: |
        لجسد الكبير ألفاظ رفيعة أيضًا:
        - اليد: tangan (كالإندونيسية تمامًا) → asta (krama inggil).
        - الرأس: sirah (نغوكو وكراما؛ وبالإندونيسية kepala) → mustaka (krama inggil).
        «Astanipun Simbah sakit» = يد الجدة تؤلمها.
        أما جسدك فبالألفاظ العادية ولو تكلمت بالكراما: «Sirah kula sakit» = رأسي يؤلمني، و«mustaka kula» كقولك «رأسي الشريف».
      en: |
        Even an elder's body has raised words:
        - hand: tangan (same as Indonesian) → asta (krama inggil).
        - head: sirah (ngoko and krama; Indonesian kepala) → mustaka (krama inggil).
        "Astanipun Simbah sakit" = Grandma's hand hurts.
        Your own body keeps the plain word, even in krama: "Sirah kula sakit" = my head hurts. "Mustaka kula" sounds like «رأسي الشريف».
    grammar: jv.krama-inggil.nouns
    examples:
      - text: Astanipun Simbah sakit.
        ar_eg: إيد تيتة بتوجعها.
        ar: يد الجدة تؤلمها.
        en: Grandma's hand hurts.
      - text: Sirah kula sakit.
        ar_eg: راسي بتوجعني.
        ar: رأسي يؤلمني.
        en: My head hurts.
  - title: Gerah lan ageman
    body:
      ar_eg: |
        - عيّان: lara (نغوكو) → sakit (كراما) → gerah (krama inggil). «Simbah saweg gerah» = تيتة تعبانة.
          خلي بالك: gerah بالإندونيسي معناها «الجو حر وخانق»! بالجاوي معناها «عيّان» للكبير.
        - هدومه: klambi (نغوكو) → ageman (krama inggil). «Agemanipun Bapak sae sanget» = لبس حضرتك حلو أوي، مجاملة لطيفة لقميص باتيك.
      ar: |
        - مريض: lara (نغوكو) → sakit (كراما) → gerah (krama inggil): «Simbah saweg gerah» = الجدة مريضة.
          وانتبه: gerah بالإندونيسية تعني «حارّ خانق»، وبالجاوية «مريض» للكبير.
        - ثيابه: klambi (نغوكو) → ageman (krama inggil): «Agemanipun Bapak sae sanget» = ثيابكم جميلة جدًا.
      en: |
        - ill: lara (ngoko) → sakit (krama) → gerah (krama inggil). "Simbah saweg gerah" = Grandma is unwell.
          Careful: Indonesian gerah means "hot and stuffy"! In Javanese it's "ill", for an elder.
        - their clothes: klambi (ngoko) → ageman (krama inggil). "Agemanipun Bapak sae sanget" = your clothes are lovely, sir: a kind compliment on a batik shirt.
    grammar: jv.krama-inggil.nouns
    examples:
      - text: Simbah saweg gerah.
        ar_eg: تيتة تعبانة.
        ar: الجدة مريضة.
        en: Grandma is unwell.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: asta
        ar_eg: إيد (الكبير)
        ar: يد (الكبير)
        en: hand (of the elder)
      - text: mustaka
        ar_eg: راس (الكبير)
        ar: رأس (الكبير)
        en: head (of the elder)
      - text: sirah
        ar_eg: راس (عادي، وراسك إنت)
        ar: رأس (عادي، ورأسك أنت)
        en: head (plain, and your own)
      - text: gerah
        ar_eg: عيّان (الكبير)
        ar: مريض (الكبير)
        en: ill (of the elder)
      - text: ageman
        ar_eg: هدوم (الكبير)
        ar: ثياب (الكبير)
        en: clothes (of the elder)
    words: [asta, mustaka, sirah, gerah, ageman]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: راسك بتوجعك. تقول لـ Bu Harsono إزاي؟
      ar: رأسك يؤلمك. كيف تقول ذلك لـ Bu Harsono؟
      en: Your head hurts. How do you tell Bu Harsono?
    options: ['Mustaka kula sakit, Bu.', 'Sirah kula sakit, Bu.', 'Mustakanipun sakit, Bu.']
    answer: 1
    explain:
      ar_eg: راسك إنت sirah. mustaka لراس الكبير بس.
      ar: رأسك sirah، وmustaka لرأس الكبير.
      en: Your own head is sirah; mustaka is only for the elder's head.
    words: [sirah, mustaka]
  - id: e03
    type: listen
    text: Simbah saweg gerah.
    options: ['Simbah saweg gerah.', 'Simbah saweg sare.', 'Simbah saweg siram.']
    answer: 0
    meaning:
      ar_eg: تيتة تعبانة.
      ar: الجدة مريضة.
      en: Grandma is unwell.
    words: [gerah]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إيد تيتة بتوجعها. أنهي جملة صح؟
      ar: يد الجدة تؤلمها. أي جملة صحيحة؟
      en: Grandma's hand hurts. Which sentence is right?
    options: ['Tangan kula sakit.', 'Asta kula sakit.', 'Astanipun Simbah sakit.']
    answer: 2
    explain:
      ar_eg: إيدها هي، يبقى asta + -nipun. «kula» يعني إيدي أنا.
      ar: يدها هي فتكون astanipun، و«kula» يعني يدي.
      en: It's her hand, so asta + -nipun. "kula" would make it my hand.
    words: [asta]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تجامل Pak Harsono على قميص الباتيك بتاعه. تقول إيه؟
      ar: تريد أن تمدح قميص الباتيك الذي يلبسه Pak Harsono. ماذا تقول؟
      en: You want to compliment Pak Harsono's batik shirt. What do you say?
    options: ['Agemanipun Bapak sae sanget.', 'Klambine Bapak apik banget.', 'Ageman kula sae sanget.']
    answer: 0
    explain:
      ar_eg: لبسه هو، يبقى ageman + -ipun. والجملة التانية نغوكو، والتالتة بتمدح لبسك إنت.
      ar: ثيابه هو فتكون agemanipun، والثانية نغوكو، والثالثة تمدح ثيابك.
      en: His clothes, so ageman + -ipun. The second is ngoko; the third praises your own clothes.
    words: [ageman]
  - id: e06
    type: fill_blank
    sentence: Bapak saweg ___, mboten saged tindak.
    meaning:
      ar_eg: الأستاذ تعبان، مش قادر يروح.
      ar: الأستاذ مريض، لا يستطيع الذهاب.
      en: Father is unwell; he can't go.
    options: [gerah, siram, ageman]
    answers: [gerah]
    words: [gerah]
  - id: e07
    type: fill_blank
    sentence: ___ Bapak sae sanget.
    meaning:
      ar_eg: لبس حضرتك حلو أوي.
      ar: ثيابكم جميلة جدًا.
      en: Your clothes are lovely, sir.
    options: [Agemanipun, Klambine, Ageman kula]
    answers: [Agemanipun]
    words: [ageman]
  - id: e08
    type: build_sentence
    source:
      ar_eg: راس تيتة بتوجعها.
      ar: رأس الجدة يؤلمها.
      en: Grandma's head hurts.
    answer: Mustakanipun Simbah sakit.
    distractors: [sirah, kula]
    words: [mustaka]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Bu Harsono) راسي بتوجعني يا هانم.
      ar: (إلى Bu Harsono) رأسي يؤلمني يا سيدتي.
      en: (to Bu Harsono) My head hurts, ma'am.
    answers: ['Sirah kula sakit, Bu.', 'Bu, sirah kula sakit.', 'Sirah kula sakit.']
    explain:
      ar_eg: راسك إنت sirah حتى في الكراما، وmustaka للكبير بس.
      ar: رأسك sirah ولو في الكراما، وmustaka للكبير.
      en: Your own head is sirah even in krama; mustaka is for the elder.
    words: [sirah]
  - id: e10
    type: speaking
    text: Simbah saweg gerah, astanipun sakit.
    meaning:
      ar_eg: تيتة تعبانة، إيدها بتوجعها.
      ar: الجدة مريضة، يدها تؤلمها.
      en: Grandma is unwell; her hand hurts.
    words: [gerah, asta]
dialogue:
  title: Simbah gerah
  lines:
    - speaker: Mohamed
      text: Bu, Simbah wonten pundi?
      ar_eg: يا هانم، تيتة فين؟
      ar: يا سيدتي، أين الجدة؟
      en: Ma'am, where's Grandma?
    - speaker: Bu Harsono
      text: Simbah saweg gerah, Mas. Mustakanipun sakit.
      ar_eg: تيتة تعبانة يا ابني. راسها بتوجعها.
      ar: الجدة مريضة يا بني. رأسها يؤلمها.
      en: Grandma is unwell. Her head hurts.
    - speaker: Mohamed
      text: Simbah sampun dhahar, Bu?
      ar_eg: تيتة أكلت يا هانم؟
      ar: هل أكلت الجدة يا سيدتي؟
      en: Has Grandma eaten, ma'am?
    - speaker: Bu Harsono
      text: Dereng, Mas. Simbah saweg sare.
      ar_eg: لسه يا ابني. تيتة نايمة.
      ar: ليس بعد يا بني. الجدة نائمة.
      en: Not yet. Grandma's asleep.
    - speaker: Mohamed
      text: Inggih, Bu. Kula badhe tumbas jeruk kagem Simbah.
      ar_eg: ماشي يا هانم. هشتري برتقان لتيتة.
      ar: حسنًا يا سيدتي. سأشتري برتقالًا للجدة.
      en: All right, ma'am. I'll buy some oranges for Grandma.
new_words:
  - word: asta
    pos: noun
    ar_eg: إيد (krama inggil؛ عادي tangan)
    ar: يد (krama inggil؛ والعادي tangan)
    en: hand (krama inggil; plain tangan) = tangan
  - word: mustaka
    pos: noun
    ar_eg: راس (krama inggil، للكبير بس)
    ar: رأس (krama inggil للكبير فقط)
    en: head (krama inggil, for the elder only) = kepala
  - word: sirah
    pos: noun
    ar_eg: راس (نغوكو وكراما؛ راسك إنت)
    ar: رأس (نغوكو وكراما؛ ورأسك أنت)
    en: head (ngoko and krama; your own head) = kepala
  - word: gerah
    pos: adjective
    ar_eg: عيّان (krama inggil؛ ngoko lara، krama sakit). مش «حر» زي الإندونيسي!
    ar: مريض (krama inggil؛ ngoko lara، وkrama sakit)، لا «حارّ» كالإندونيسية
    en: ill (krama inggil; ngoko lara, krama sakit). Not "stuffy" as in Indonesian! = sakit
  - word: ageman
    pos: noun
    ar_eg: هدوم الكبير (krama inggil؛ ngoko klambi)
    ar: ثياب الكبير (krama inggil؛ ngoko klambi)
    en: clothes (krama inggil; ngoko klambi) = pakaian
