schema: kabar.lesson/v1
id: j2.u06.l05
language: jv
title: VN saka Sari
can_do:
  ar_eg: تفهم فويس نوت فيها عزومة على خروجة وترد عليها.
  ar: أن تفهم رسالة صوتية فيها دعوة إلى نزهة وتردّ عليها.
  en: Follow a voice note inviting you out.
slides:
  - title: VN saka Sari
    grammar: jv.reduplication
    body:
      ar_eg: |
        Sari بعتتلك فويس نوت (VN) بتعزمك على خروجة. اسمعها الأول، وبعدين اقرا. دوّر على:
        - اليوم (Senen … Setu، Minggu).
        - هيعملوا إيه، وبالترتيب: banjur = وبعدين (زي terus).
        - التحذير: aja lali = ما تنساش.
        وافتكر: dolan-dolan = نخرج نتفسح، mlaku-mlaku = نتمشى، وpuanas = حر أوووي (= panas banget).
      ar: |
        أرسلت لك Sari رسالة صوتية (VN) تدعوك فيها إلى نزهة. استمع أولًا ثم اقرأ، وابحث عن:
        - اليوم (Senen … Setu، Minggu).
        - ماذا سيفعلون وبأيّ ترتيب: banjur = ثم (مثل terus).
        - التحذير: aja lali = لا تنسَ.
        وتذكّر: dolan-dolan = نخرج للتنزّه، وmlaku-mlaku = نتمشّى، وpuanas = حارّ جدًّا (= panas banget).
      en: |
        Sari sent you a voice note (VN) inviting you out. Listen first, then read. Catch:
        - the day (Senen … Setu, Minggu).
        - what you'll do, in order: banjur = then (like terus).
        - the warning: aja lali = don't forget.
        Remember: dolan-dolan = go out for fun, mlaku-mlaku = take a stroll, puanas = sooo hot (= panas banget).
    examples:
      - text: Mohamed, Setu ayo dolan-dolan neng Ngawi karo bocah-bocah!
        ar_eg: يا محمد، يوم السبت يلا نخرج نتفسح في نغاوي مع العيال!
        ar: يا محمد، يوم السبت هيّا نتنزّه في نغاوي مع الأولاد!
        en: Mohamed, on Saturday let's go out to Ngawi with the kids!
      - text: Awake dhewe mlaku-mlaku neng pinggir Bengawan Solo, banjur mangan pecel.
        ar_eg: هنتمشى على شط نهر سولو، وبعدين ناكل بيكل.
        ar: سنتمشّى على ضفة نهر سولو، ثم نأكل البيتشيل.
        en: We'll stroll along the Solo River, then eat pecel.
      - text: Nanging neng kana puanas. Aja lali ngombe, ya!
        ar_eg: بس هناك الدنيا حر أوووي. ما تنساش تشرب!
        ar: لكن الجوّ هناك حارّ جدًّا. لا تنسَ أن تشرب!
        en: But it's sooo hot there. Don't forget to drink, OK!
exercises:
  - id: e01
    type: listen
    text: Mohamed, Setu ayo dolan-dolan neng Ngawi karo bocah-bocah!
    question:
      ar_eg: الخروجة يوم إيه؟
      ar: في أيّ يوم النزهة؟
      en: What day is the trip?
    options: ["Jemuwah.", "Setu.", "Minggu."]
    answer: 1
    meaning:
      ar_eg: يا محمد، يوم السبت يلا نخرج نتفسح في نغاوي مع العيال!
      ar: يا محمد، يوم السبت هيّا نتنزّه في نغاوي مع الأولاد!
      en: Mohamed, on Saturday let's go out to Ngawi with the kids!
    words: [Setu, dolan / dolan-dolan, bocah]
  - id: e02
    type: listen
    text: Awake dhewe mlaku-mlaku neng pinggir Bengawan Solo, banjur mangan pecel.
    question:
      ar_eg: هيعملوا إيه، وبأنهي ترتيب؟
      ar: ماذا سيفعلون، وبأيّ ترتيب؟
      en: What will they do, and in what order?
    options: ["Mangan pecel, banjur mlaku-mlaku.", "Mlaku-mlaku, banjur mangan pecel.", "Dolanan neng taman, banjur mulih."]
    answer: 1
    meaning:
      ar_eg: هنتمشى على شط نهر سولو، وبعدين ناكل بيكل.
      ar: سنتمشّى على ضفة نهر سولو، ثم نأكل البيتشيل.
      en: We'll stroll along the Solo River, then eat pecel.
    explain:
      ar_eg: banjur = وبعدين. اللي قبل banjur بيحصل الأول.
      ar: banjur = ثم، فما قبلها يحدث أولًا.
      en: banjur = then. What comes before banjur happens first.
    words: [banjur, mlaku / mlaku-mlaku]
  - id: e03
    type: listen
    text: Nanging neng kana puanas. Aja lali ngombe, ya!
    question:
      ar_eg: Sari بتحذّرك من إيه؟
      ar: ممّ تحذّرك Sari؟
      en: What does Sari warn you about?
    options: ["Neng kana udan.", "Neng kana adoh.", "Neng kana puanas."]
    answer: 2
    meaning:
      ar_eg: بس هناك الدنيا حر أوووي. ما تنساش تشرب!
      ar: لكن الجوّ هناك حارّ جدًّا. لا تنسَ أن تشرب!
      en: But it's sooo hot there. Don't forget to drink, OK!
    words: [puanas / uenak, aja, lali]
  - id: e04
    type: multiple_choice
    question: puanas
    question_meaning:
      ar_eg: puanas معناها إيه بالجاوي العادي؟
      ar: ما معنى puanas بالجاوية المعيارية؟
      en: What's puanas in plain Javanese?
    options: ["panas banget", "rada panas", "kurang panas"]
    answer: 0
    explain:
      ar_eg: مط الصفة بـ u (puanas، uenak) = banget، بس في الكلام والشات بس.
      ar: مدّ الصفة بـu (puanas، uenak) = banget، لكن في الكلام والدردشة فقط.
      en: Stretching an adjective with u (puanas, uenak) = banget, in speech and chat only.
    words: [puanas / uenak, banget]
  - id: e05
    type: match_pairs
    pairs:
      - text: dolan-dolan
        ar_eg: نخرج نتفسح
        ar: يتنزّه
        en: go out for fun
      - text: mlaku-mlaku
        ar_eg: يتمشى
        ar: يتمشّى
        en: take a stroll
      - text: banjur
        ar_eg: وبعدين
        ar: ثم
        en: then
      - text: bocah-bocah
        ar_eg: العيال
        ar: الأولاد
        en: the kids
      - text: puanas
        ar_eg: حر أوووي
        ar: حارّ جدًّا
        en: sooo hot
    words: [dolan / dolan-dolan, mlaku / mlaku-mlaku, banjur, bocah, puanas / uenak]
  - id: e06
    type: dictation
    text: Awake dhewe mlaku-mlaku, banjur mangan pecel.
    meaning:
      ar_eg: هنتمشى، وبعدين ناكل بيكل.
      ar: سنتمشّى، ثم نأكل البيتشيل.
      en: We'll take a stroll, then eat pecel.
    words: [mlaku / mlaku-mlaku, banjur]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "رد على Sari: «يلا! بس السبت الصبح مش هقدر. العصر إيه رأيك؟»"
      ar: "ردّ على Sari: «هيّا! لكن صباح السبت لا أستطيع. ما رأيك في العصر؟»"
      en: "Reply to Sari: \"Let's go! But I can't on Saturday morning. How about the afternoon?\""
    answers:
      - Ayo! Nanging Setu esuk aku ora isa. Sore piye?
      - Ayo! Nanging Setu esuk aku ora isa. Sore piye
      - Ayo! Ning Setu esuk aku ora isa. Sore piye?
      - Ayo! Nanging Setu esuk aku ora iso. Sore piye?
      - Ayo! Nanging aku ora isa Setu esuk. Sore piye?
      - Ayo! Nanging Setu esuk aku ora isa, sore piye?
      - Ayo, nanging Setu esuk aku ora isa. Sore piye?
      - Ayo! Nanging Setu esuk ora isa. Sore piye?
      - Ayo! Nanging Setu esuk aku ora isa. Nek sore piye?
    explain:
      ar_eg: nanging (أو ning) = بس، ora isa = مش هقدر، Sore piye? = العصر إيه رأيك؟
      ar: nanging (أو ning) = لكن، وora isa = لا أستطيع، وSore piye? = ما رأيك في العصر؟
      en: nanging (or ning) = but, ora isa = can't, Sore piye? = how about the afternoon?
    words: [nanging / ning, Setu, isa, sore]
  - id: e08
    type: speaking
    text: Ayo, Sari! Aku seneng banget.
    meaning:
      ar_eg: يلا يا ساري! أنا مبسوط أوي.
      ar: هيّا يا ساري! أنا سعيد جدًّا.
      en: Let's go, Sari! I'm really happy.
    words: [seneng, banget]
dialogue:
  title: Mohamed mbales VN
  lines:
    - speaker: Mohamed
      text: Sari, ayo! Setu aku isa.
      ar_eg: يا ساري، يلا! السبت أقدر.
      ar: يا ساري، هيّا! يوم السبت أستطيع.
      en: Sari, let's go! Saturday works for me.
    - speaker: Sari
      text: Apik! Esuk apa sore?
      ar_eg: حلو! الصبح ولا العصر؟
      ar: جميل! صباحًا أم عصرًا؟
      en: Great! Morning or afternoon?
    - speaker: Mohamed
      text: Sore wae. Esuk aku sinau.
      ar_eg: العصر أحسن. الصبح بذاكر.
      ar: العصر إذن. في الصباح أدرس.
      en: Afternoon. In the morning I study.
    - speaker: Sari
      text: Ya wis, jam telu sore. Ketemu neng stasiun, ya.
      ar_eg: خلاص، الساعة تلاتة العصر. نتقابل في المحطة.
      ar: حسنًا، الثالثة عصرًا. نلتقي في المحطة.
      en: All right, three in the afternoon. Let's meet at the station.
    - speaker: Mohamed
      text: Sip! Bocah-bocah piye?
      ar_eg: تمام! والعيال؟
      ar: ممتاز! وماذا عن الأولاد؟
      en: Great! What about the kids?
    - speaker: Sari
      text: Bayu karo kanca-kancane. Aja lali ngombe, ya! Puanas lho!
      ar_eg: بايو وصحابه. ما تنساش تشرب! الدنيا حر أوووي على فكرة!
      ar: بايو وأصدقاؤه. لا تنسَ أن تشرب! الجوّ حارّ جدًّا!
      en: Bayu and his friends. Don't forget to drink! It's sooo hot, you know!
