schema: kabar.lesson/v1
id: j2.u06.l05
language: jv
title: Setuju, mboh
can_do:
  ar_eg: 'تقول رأيك: موافق ولا مش عارف، عايز إيه، ونفسك في إيه، وتقارن بين حاجتين.'
  ar: 'أن تعبّر عن رأيك: موافق أو لا تدري، وماذا تريد، وما تتمنّاه، وتقارن بين شيئين.'
  en: 'Give your view: agree or no idea, what you want and long for, and compare two things.'
slides:
  - title: Karepmu apa?
    body:
      ar_eg: |
        setuju = موافق، mboh = ماعرفش (عامّية: «الله أعلم»).
        karep = اللي الواحد عايزه: Karepmu apa? = إنت عايز إيه؟
        kepingin = نفسه في: Aku kepingin nang Ponorogo.
        tinimbang = من (في المقارنة): Sari luwih pinter tinimbang aku.
        nesu = زعلان ومتعصّب، ngguyu = يضحك. pinggir = طرف، جنب: pinggir dalan.
      ar: |
        setuju = موافق، mboh = لا أدري (عامّية).
        karep = الرغبة، ما يريده المرء: Karepmu apa? = ماذا تريد؟
        kepingin = يتمنّى: Aku kepingin nang Ponorogo.
        tinimbang = من (في المقارنة): Sari luwih pinter tinimbang aku.
        nesu = غاضب، ngguyu = يضحك. pinggir = حافّة، جانب: pinggir dalan.
      en: |
        setuju = agree, mboh = dunno (casual).
        karep = what you want: Karepmu apa? = What do you want?
        kepingin = long to, really want: Aku kepingin nang Ponorogo.
        tinimbang = than: Sari luwih pinter tinimbang aku.
        nesu = angry, ngguyu = laugh. pinggir = edge, side: pinggir dalan = roadside.
    examples:
      - text: Mboh, aku ora ngerti.
        ar_eg: ماعرفش والله، مش فاهم.
        ar: لا أدري، لا أفهم.
        en: Dunno, I don't get it.
      - text: Sari luwih pinter tinimbang aku.
        ar_eg: ساري أشطر مني.
        ar: ساري أذكى منّي.
        en: Sari is cleverer than me.
      - text: Aku kepingin dolan neng Ponorogo.
        ar_eg: نفسي أروح بونوروجو.
        ar: أتمنّى زيارة بونوروغو.
        en: I'd love to visit Ponorogo.
