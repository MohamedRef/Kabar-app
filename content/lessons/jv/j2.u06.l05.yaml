    text: Mboh, aku ora ngerti.
    question:
      ar_eg: بيقول إيه؟
      ar: ماذا يقول؟
      en: What is he saying?
    options: [ماعرفش والله, موافق, عايز أروح]
    answer: 0
    meaning:
      ar_eg: ماعرفش والله، مش فاهم.
      ar: لا أدري، لا أفهم.
      en: Dunno, I don't get it.
    words: [mboh, setuju]
  - id: e04
    type: fill_blank
    sentence: Sari luwih pinter ___ aku.
    meaning:
      ar_eg: ساري أشطر ___ ي.
      ar: ساري أذكى ___ ي.
      en: Sari is cleverer ___ me.
    options: [tinimbang, pinggir, karep]
    answers: [tinimbang]
    words: [tinimbang, pinggir, karep]
  - id: e05
    type: multiple_choice
    question: Ibu nesu merga aku lali.
    question_meaning:
      ar_eg: مامته مالها؟
      ar: ما بال أمّه؟
      en: What's up with his mum?
    options: [زعلانة عشان نسي, بتضحك عشان نسي, موافقة]
    answer: 0
    explain:
      ar_eg: nesu = زعلان ومتعصّب. ngguyu = يضحك، setuju = موافق.
      ar: nesu = غاضب. أمّا ngguyu فيضحك، وsetuju فموافق.
      en: nesu = angry. ngguyu = laugh, setuju = agree.
    words: [nesu, ngguyu, setuju]
  - id: e06
    type: fill_blank
    sentence: Aku ___ dolan neng Ponorogo, ndelok reog.
    meaning:
      ar_eg: ___ أروح بونوروجو وأتفرّج على الريوج.
      ar: ___ زيارة بونوروغو ومشاهدة الريوغ.
      en: I ___ to visit Ponorogo and see reog.
    options: [kepingin, nesu, mboh]
    answers: [kepingin]
    words: [kepingin, nesu, mboh]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «إنت عايز إيه؟» بالجاوي؟
      ar: كيف تقول «ماذا تريد؟» بالجاوية؟
      en: '"What do you want?" in Javanese?'
    options: ['Karepmu apa?', 'Pinggirmu apa?', 'Ngguyumu apa?']
    answer: 0
    explain:
      ar_eg: karep = اللي الواحد عايزه، وkarepmu = اللي إنت عايزه.
      ar: karep = الرغبة، وkarepmu = ما تريده.
      en: karep = what you want; karepmu = what you want.
    words: [karep, pinggir, ngguyu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: موافق معاك، يلا بينا.
      ar: أوافقك، هيّا بنا.
      en: I agree with you, let's go.
    answer: Aku setuju karo kowe, ayo budal.
    distractors: [mboh, tinimbang]
    words: [setuju, mboh, tinimbang]
  - id: e09
    type: translate
    direction: from_target
    source_text: Warunge ing pinggir dalan, cedhak alun-alun.
    answers_meaning:
      ar_eg: [المحل على جنب الطريق، قريب من الميدان, المحل على طرف الشارع جنب الميدان]
      ar: [المحلّ على جانب الطريق، قرب الساحة, الدكّان على حافّة الطريق قرب الساحة]
      en: ['The stall is by the roadside, near the square', The warung is at the side of the road near the town square]
    words: [pinggir]
  - id: e10
    type: speaking
    text: Bocah-bocah ngguyu, aku kepingin dolan.
    meaning:
      ar_eg: العيال بيضحكوا، ونفسي أخرج.
      ar: الأطفال يضحكون، وأتمنّى الخروج.
      en: The kids are laughing, I'd love to go out.
    words: [ngguyu, kepingin]
dialogue:
  lines:
    - speaker: Sari
      text: Sesuk ayo neng Ponorogo, ndelok reog! Setuju?
      ar_eg: بكرة يلا نروح بونوروجو نتفرّج على الريوج! موافق؟
      ar: هيّا غدًا إلى بونوروغو لمشاهدة الريوغ! موافق؟
      en: Let's go to Ponorogo tomorrow to see reog! Agreed?
    - speaker: Mohamed
      text: Setuju! Aku kepingin ndelok wiwit biyen.
      ar_eg: موافق! نفسي أشوفه من زمان.
      ar: موافق! أتمنّى رؤيته منذ زمن.
      en: Agreed! I've wanted to see it for ages.
    - speaker: Bayu
      text: Mbak, Bapak setuju ora? Mengko nesu lho.
      ar_eg: يا أبلة، بابا موافق ولا لأ؟ ليزعل.
      ar: يا أختي، هل يوافق أبي؟ قد يغضب.
      en: Sis, does Dad agree? He might get cross.
    - speaker: Sari
      text: Mboh. Karepku budal esuk, ora sore.
      ar_eg: ماعرفش. أنا عايزة نطلع الصبح، مش العصر.
      ar: لا أدري. أريد أن ننطلق صباحًا لا مساءً.
      en: Dunno. I want to leave in the morning, not the afternoon.
    - speaker: Bayu
      text: Bis esuk luwih sepi tinimbang bis sore. Hehe, aku melu!
      ar_eg: أتوبيس الصبح أفضى من أتوبيس العصر. هههه، أنا جاي!
      ar: حافلة الصباح أقلّ ازدحامًا من حافلة المساء. هههه، سآتي!
      en: The morning bus is emptier than the afternoon one. Hehe, I'm coming!
