      ar_eg: أنهي واحد هو lê الصح؟
      ar: أيّها lê الصحيحة؟
      en: Which is the correct lê?
    options: ["ꦭꦼ", "ꦊ", "ꦭꦺ"]
    answer: 1
    explain:
      ar_eg: lê ليها حرف مخصوص اسمه nga lelet، مش ꦭ + pepet. والتالتة دي le بـ taling.
      ar: لـ lê حرف خاص اسمه nga lelet لا ꦭ مع pepet، والثالثة le بـ taling.
      en: lê has its own letter, nga lelet — not ꦭ + pepet. The third one is le with taling.
    words: [nga lelet]
