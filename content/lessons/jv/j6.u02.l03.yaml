    options: [ko, ka, ku]
    answer: 0
    words: [taling tarung]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحدة هي loro (اتنين)؟
      ar: أيّها loro (اثنان)؟
      en: Which one is loro (two)?
    options: ["ꦭꦫ", "ꦭꦺꦴꦫꦺꦴ", "ꦭꦺꦴꦫ"]
    answer: 1
    explain:
      ar_eg: loro (اتنين) فيها o حقيقية، فبتتكتب بـ taling tarung. ꦭꦫ = lara (عيان)، حتى لو بتتنطق «لورو».
      ar: في loro (اثنان) o حقيقية فتُكتب بـ taling tarung، وꦭꦫ = lara (مريض) وإن نُطقت «لورو».
      en: loro (two) has a real o, so it takes taling tarung. ꦭꦫ is lara (sick), even though it's said "loro".
    words: [taling tarung]
  - id: e04
    type: listen
    text: rega
    question:
      ar_eg: سمعت rega (سعر). بتتكتب إزاي؟
      ar: سمعت rega (سعر). كيف تُكتب؟
      en: You heard rega (price). How is it written?
    options: ["ꦫꦒ", "ꦫꦺꦴꦒ", "ꦉꦒ"]
    answer: 2
    meaning:
      ar_eg: سعر
      ar: سعر
      en: price
    words: [pa cerek]
  - id: e05
