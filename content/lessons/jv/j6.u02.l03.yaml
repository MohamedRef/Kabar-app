dialogue:
  title: Rega pira?
  lines:
    - speaker: Mohamed
      text: Mas, iki diwaca rega?
      ar_eg: يا ديماس، دي بتتقري rega؟
      ar: يا ديماس، هل تُقرأ هذه rega؟
      en: Mas, is this read rega?
    - speaker: Dimas
      text: Iya, rega. Aksara re iku pa cerek.
      ar_eg: أيوه، rega. الحرف re ده اسمه pa cerek.
      ar: نعم، rega. وحرف re اسمه pa cerek.
      en: Yes, rega. The letter re is called pa cerek.
    - speaker: Mohamed
      text: Dudu ra karo pepet?
      ar_eg: مش ra وعليها pepet؟
      ar: أليست ra مع pepet؟
      en: Not ra with pepet?
    - speaker: Dimas
      text: Dudu, kok. Re lan le duwe aksara dhewe.
      ar_eg: لأ. re وle ليهم حروف لوحدهم.
      ar: لا. لـ re وle حرفان خاصان.
      en: No. Re and le have letters of their own.
