schema: kabar.lesson/v1
id: j6.u02.l03
language: jv
title: Taling tarung
can_do:
  ar_eg: تكتب o، والحرفين المخصوصين لـ rê وlê.
  ar: أن تكتب o، والحرفين الخاصين بـ rê وlê.
  en: Write o, and the letters for rê and lê.
slides:
  - title: Taling tarung
    body:
      ar_eg: |
        o محتاجة علامتين مع بعض: taling قبل الحرف + tarung بعده. الاتنين مع بعض اسمهم taling tarung: ꦏꦺꦴ = ko.
        tarung لوحدها مش o. لازم الاتنين.
        وخلي بالك من الفرق: ꦭꦺꦴꦫꦺꦴ loro (اتنين) بـ taling tarung، وꦭꦫ lara (عيان) من غير علامات، مع إنها بتتنطق «لورو» برضه!
      ar: |
        تحتاج o إلى علامتين معًا: taling قبل الحرف وtarung بعده، واسمهما معًا taling tarung: ꦏꦺꦴ = ko.
        وtarung وحدها ليست o.
        وانتبه: ꦭꦺꦴꦫꦺꦴ loro (اثنان) بـ taling tarung، وꦭꦫ lara (مريض) بلا علامات، مع أنها تُنطق «لورو» أيضًا.
      en: |
        o needs two marks together: taling before the letter + tarung after it. Together they're called taling tarung: ꦏꦺꦴ = ko.
        tarung alone isn't o; you need both.
        Mind the difference: ꦭꦺꦴꦫꦺꦴ loro (two) has taling tarung, while ꦭꦫ lara (sick) has no marks, even though it's also said "loro"!
    grammar: jv.aksara.sandhangan-swara
    examples:
      - text: ꦏꦺꦴꦮꦺ (kowe)
        ar_eg: إنت — ko بـ taling tarung، وwe بـ taling
        ar: أنت — ko بـ taling tarung، وwe بـ taling
        en: you — ko with taling tarung, we with taling
      - text: ꦭꦺꦴꦫꦺꦴ (loro)
        ar_eg: اتنين
        ar: اثنان
        en: two
  - title: Pa cerek lan nga lelet
    body:
      ar_eg: |
        حاجة صغيرة: rê وlê (بالـ pepet) ليهم حرفين مخصوصين، مش ꦫ أو ꦭ + pepet:
        - pa cêrêk ꦉ = rê: ꦉꦒ rêga (سعر).
        - nga lêlêt ꦊ = lê: ꦊꦩꦸ lêmu (تخين).
      ar: |
        ولـ rê وlê (بالـ pepet) حرفان خاصان، لا ꦫ أو ꦭ مع pepet:
        - pa cêrêk ꦉ = rê: ꦉꦒ rêga (سعر).
        - nga lêlêt ꦊ = lê: ꦊꦩꦸ lêmu (سمين).
      en: |
        One detail: rê and lê (with pepet) have their own letters, not ꦫ / ꦭ + pepet:
        - pa cêrêk ꦉ = rê: ꦉꦒ rêga (price).
        - nga lêlêt ꦊ = lê: ꦊꦩꦸ lêmu (fat, plump).
    grammar: jv.aksara.sandhangan-swara
    examples:
      - text: ꦉꦒ (rêga)
        ar_eg: سعر
        ar: سعر
        en: price
      - text: ꦊꦩꦸ (lêmu)
        ar_eg: تخين / مليان
        ar: سمين / ممتلئ
        en: fat, plump
