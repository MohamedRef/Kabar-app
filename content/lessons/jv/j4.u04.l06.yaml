      ar: الجدّة ليست غنيّة لكنها دائمًا ___.
      en: Grandma isn't rich, but she's always ___.
    options: [nrima, sungkan, watak]
    answer: 0
    explain:
      ar_eg: nrima = راضية باللي عندها.
      ar: nrima = راضية بما عندها.
      en: nrima = content with what she has.
    words: [nrima, sungkan, watak]
