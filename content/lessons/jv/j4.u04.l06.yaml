  - id: e08
    type: translate
    direction: from_target
    source_text: Simbah seneng wong sing tepa slira.
    answers_meaning:
      ar_eg: [تيتة بتحب الناس اللي بتراعي غيرها, تيتة بتحب اللي بيحس بالتانيين]
      ar: [تحبّ الجدّة الناس الذين يراعون غيرهم, تحبّ الجدّة من يضع نفسه مكان الآخرين]
      en: [Grandma likes considerate people, 'Grandma likes people who put themselves in others'' shoes']
    words: [tepa slira]
  - id: e09
    type: speaking
    text: Budinipun luhur, watakipun andhap asor.
    meaning:
      ar_eg: أخلاقه عالية، وطبعه متواضع.
      ar: خُلقه رفيع وطبعه متواضع.
      en: His conduct is noble and his character humble.
    words: [luhur, watak, andhap asor]
  - id: e10
    type: multiple_choice
    question: Basa krama kagem ___ dhateng tiyang sepuh.
    question_meaning:
      ar_eg: الكراما علشان ___ الكبار.
      ar: الكراما لـ ___ كبار السنّ.
      en: Krama is for showing ___ to elders.
    options: [sungkan, pakurmatan, tepa slira]
    answer: 1
    explain:
      ar_eg: pakurmatan = احترام وتكريم.
      ar: pakurmatan = احترام وتكريم.
      en: pakurmatan = respect, honour.
    words: [pakurmatan, sungkan, tepa slira]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, ngapa Pak Harsono ra nesu? Wong kuwi lancang, lho.
      ar_eg: يا ماس، ليه پاك هارسونو ما زعلش؟ الراجل ده اتجرّأ.
      ar: يا ماس، لماذا لم يغضب باك هارسونو؟ ذلك الرجل تجرّأ.
      en: Mas, why didn't Pak Harsono get angry? That man was out of line.
    - speaker: Mas Dimas
      text: Pak Harsono andhap asor. Dheweke luwih seneng ngalah.
      ar_eg: پاك هارسونو متواضع. بيحب يتنازل أكتر.
      ar: باك هارسونو متواضع، يفضّل أن يتنازل.
      en: Pak Harsono is humble. He'd rather give way.
    - speaker: Mohamed
      text: Ing Mesir uga padha. Watake luhur tenan.
      ar_eg: في مصر برضه كده. طبعه نبيل بجد.
      ar: وفي مصر كذلك. طبعه نبيل حقًّا.
      en: It's the same in Egypt. He really has a noble character.
    - speaker: Mas Dimas
      text: 'Iya. Simbah ngendika: urip iku kudu tepa slira.'
      ar_eg: 'آه. تيتة بتقول: الحياة لازم فيها مراعاة للتاني.'
      ar: 'نعم. تقول الجدّة: في الحياة لا بدّ من مراعاة الآخر.'
      en: 'Yes. Grandma says: in life you must put yourself in others'' shoes.'
    - speaker: Mohamed
      text: Aku isih sungkan matur karo Pak Harsono.
      ar_eg: أنا لسه متحرّج أكلّم پاك هارسونو.
      ar: ما زلتُ أتحرّج أن أكلّم باك هارسونو.
      en: I'm still shy about speaking to Pak Harsono.
    - speaker: Mas Dimas
      text: Ra papa. Pak Harsono ngerti kok.
      ar_eg: عادي. هو فاهم.
      ar: لا بأس، فهو يفهم.
      en: That's fine. He understands.
