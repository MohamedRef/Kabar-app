schema: kabar.lesson/v1
id: j4.u04.l06
language: jv
title: Andhap asor
can_do:
  ar_eg: 'تتكلم عن قيم جاوية: التواضع والتسامح والرضا ومراعاة التاني، وتوصف طبع حد.'
  ar: 'أن تتحدث عن قيم جاوية: التواضع والتسامح والرضا ومراعاة الآخر، وتصف طبع أحد.'
  en: 'Talk about Javanese values: humility, giving way, contentment and empathy, and describe someone''s character.'
slides:
  - title: Ngalah iku dudu kalah
    body:
      ar_eg: |
        - andhap asor = متواضع (حرفيًا: واطي وتحت)، من أكبر القيم الجاوية.
        - ngalah = يتنازل ويسيب الحق للتاني عشان ما يبقاش في خناق. حكمة: «Ngalah iku dudu kalah» = التنازل مش هزيمة.
        - nrima = يرضى باللي جاله (narima ing pandum = يرضى بنصيبه).
        - tepa slira = يحط نفسه مكان التاني ويراعي مشاعره.
        - sungkan = يتحرّج من باب الاحترام، مش عايز يتقل على الكبير.
        - watak = طبع، شخصية. luhur = عالي ونبيل (budi luhur = أخلاق عالية).
        - pakurmatan = احترام، تكريم (اسم).
        - في الشارع: ra = ora (لأ / مش)، kuwi = iku (ده / دي)، Ra papa = Ora apa-apa (مفيش مشكلة).
        - lho كلمة صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        - andhap asor = متواضع (حرفيًّا: منخفض دانٍ)، وهو من أعظم القيم الجاوية.
        - ngalah = يتنازل ويترك الحقّ للآخر تجنّبًا للخصام. والحكمة: «Ngalah iku dudu kalah» = التنازل ليس هزيمة.
        - nrima = يرضى بما قُسم له (narima ing pandum = يرضى بنصيبه).
        - tepa slira = يضع نفسه مكان الآخر ويراعي مشاعره.
        - sungkan = يتحرّج احترامًا، لا يريد أن يثقل على الكبير.
        - watak = طبع، شخصية. luhur = رفيع نبيل (budi luhur = خُلق رفيع).
        - pakurmatan = احترام، تكريم (اسم).
        - في كلام الشارع: ra = ora (لا / ليس)، kuwi = iku (ذلك)، Ra papa = Ora apa-apa (لا بأس).
        - lho أداة صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        - andhap asor = humble (literally: low and lowly), one of the great Javanese values.
        - ngalah = give way, let the other person win to avoid a quarrel. The saying: "Ngalah iku dudu kalah" = giving way isn't losing.
        - nrima = accept what you're given contentedly (narima ing pandum = accept your lot).
        - tepa slira = put yourself in another's place, be considerate.
        - sungkan = reluctant out of respect, not wanting to impose on an elder.
        - watak = character, temperament. luhur = noble, lofty (budi luhur = noble character).
        - pakurmatan = respect, honour (noun).
        - On the street: ra = ora (no, not), kuwi = iku (that), Ra papa = Ora apa-apa (no problem).
        - lho is a small particle that adds feeling; the sentence is correct without it.
    examples:
      - text: Pak Harsono andhap asor, watakipun luhur.
        ar_eg: پاك هارسونو متواضع، وطبعه نبيل.
        ar: باك هارسونو متواضع، طبعه نبيل.
        en: Pak Harsono is humble; his character is noble.
      - text: Mas Dimas ngalah, ora padu karo adhine.
        ar_eg: ماس ديماس اتنازل، وما اتخانقش مع أخوه.
        ar: تنازل ماس ديماس ولم يتشاجر مع أخيه.
        en: Mas Dimas gave way and didn't argue with his little brother.
      - text: Kula sungkan matur dhateng Bapak.
        ar_eg: أنا متحرّج أكلّم الأستاذ.
        ar: أتحرّج أن أكلّم الأستاذ.
        en: I'm too shy to speak to the gentleman.
