schema: kabar.lesson/v1
id: j1.u03.l08
language: jv
title: Status WA
can_do:
  ar_eg: تقرا حالات واتساب صحابك المكتوبة بالشات الجاوي وترد عليهم.
  ar: أن تقرأ حالات واتساب أصدقائك المكتوبة بأسلوب الدردشة الجاوية وتردّ عليها.
  en: Read friends' chat statuses and reply.
slides:
  - title: Status WA bengi
    grammar: jv.chat.normalize
    body:
      ar_eg: |
        بالليل في يوجيا، فتحت الواتساب ولقيت حالات تلات صحاب. اقراها بالتلات خطوات بتوعك:
        ١) رجّع الإملا: ws = wis، moco = maca، ng = neng، arp = arep، و2 بتكرر الكلمة: kanca2 = kanca-kanca.
        ٢) دوّر على كلمات الوقت: wis، durung، lagi، isih، arep.
        ٣) شوف الكلمات الصغيرة: جاوي ولا إندونيسي؟
        tekan = وصل (sampai)، اتعلمتها مع «Wis tekan?».
      ar: |
        ليلًا في يوجيا، فتحت واتساب فوجدت حالات ثلاثة أصدقاء. اقرأها بخطواتك الثلاث:
        ١) أعد الإملاء: ws = wis، وmoco = maca، وng = neng، وarp = arep، والرقم 2 يكرّر الكلمة: kanca2 = kanca-kanca.
        ٢) ابحث عن كلمات الزمن: wis وdurung وlagi وisih وarep.
        ٣) انظر إلى الكلمات الصغيرة: جاوية أم إندونيسية؟
        tekan = وصل (sampai)، وقد عرفتها في «Wis tekan?».
      en: |
        It's evening in Jogja. You open WhatsApp and find three friends' statuses. Read them with your three steps:
        1) Restore the spelling: ws = wis, moco = maca, ng = neng, arp = arep, and 2 doubles a word: kanca2 = kanca-kanca.
        2) Find the time words: wis, durung, lagi, isih, arep.
        3) Check the small words: Javanese or Indonesian?
        tekan = arrive (sampai), as in "Wis tekan?".
    examples:
      - text: ws tekan Alkid! lagi mangan sate karo kanca2
        ar_eg: (Mas Heru) وصلت ألكيد! باكل سَتيه مع الصحاب. = Wis tekan Alkid! Lagi mangan sate karo kanca-kanca.
        ar: (Mas Heru) وصلت إلى ألكيد! آكل الساتيه مع الأصدقاء. = Wis tekan Alkid! Lagi mangan sate karo kanca-kanca.
        en: (Mas Heru) Made it to Alkid! Having satay with friends. = Wis tekan Alkid! Lagi mangan sate karo kanca-kanca.
      - text: durung turu, isih moco buku
        ar_eg: (Mbak Rara) لسه ما نمتش، لسه بقرا كتاب. = Durung turu, isih maca buku.
        ar: (Mbak Rara) لم أنم بعد، ما زلت أقرأ كتابًا. = Durung turu, isih maca buku.
        en: (Mbak Rara) Not asleep yet, still reading a book. = Durung turu, isih maca buku.
      - text: aku mau ke Alkid. udah makan belum?
        ar_eg: (Dimas) أنا رايح ألكيد. كلتوا ولا لسه؟ (ده إندونيسي عامي!)
        ar: (Dimas) أنا ذاهب إلى ألكيد. هل أكلتم أم ليس بعد؟ (هذه إندونيسية عامّية!)
        en: (Dimas) I'm heading to Alkid. Eaten yet? (This one is casual Indonesian!)
exercises:
  - id: e01
    type: multiple_choice
    question: ws tekan Alkid! lagi mangan sate karo kanca2
    question_meaning:
      ar_eg: دي حالة Mas Heru. بيعمل إيه دلوقتي؟
      ar: هذه حالة Mas Heru. ماذا يفعل الآن؟
      en: This is Mas Heru's status. What is he doing now?
    options: ["Mangan sate.", "Maca buku.", "Turu."]
    answer: 0
    explain:
      ar_eg: lagi mangan sate = بياكل سَتيه دلوقتي. lagi = sedang.
      ar: lagi mangan sate = يأكل الساتيه الآن، وlagi = sedang.
      en: lagi mangan sate = he's eating satay right now. lagi = sedang.
    words: [lagi, mangan, tekan]
  - id: e02
    type: multiple_choice
    question: durung turu, isih moco buku
    question_meaning:
      ar_eg: دي حالة Mbak Rara. أنهي جملة صح؟
      ar: هذه حالة Mbak Rara. أيّ جملة صحيحة؟
      en: This is Mbak Rara's status. Which sentence is true?
    options: ["Rara wis turu.", "Rara arep mangan.", "Rara isih maca buku."]
    answer: 2
    explain:
      ar_eg: durung turu = لسه ما نامتش، وisih moco = لسه بتقرا (moco = maca).
      ar: durung turu = لم تنم بعد، وisih moco = ما زالت تقرأ (moco = maca).
      en: durung turu = not asleep yet, isih moco = still reading (moco = maca).
    words: [durung, isih, maca]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي واحد من الصحاب كتب حالته بالإندونيسي مش بالجاوي؟
      ar: أيّ الأصدقاء كتب حالته بالإندونيسية لا بالجاوية؟
      en: Which friend wrote their status in Indonesian, not Javanese?
    options: [Mas Heru, Dimas, Mbak Rara]
    answer: 1
    explain:
      ar_eg: mau ke وudah وbelum كلها إندونيسي. بالجاوي هتبقى arep neng وwis وdurung.
      ar: "mau ke وudah وbelum كلها إندونيسية، وبالجاوية: arep neng وwis وdurung."
      en: mau ke, udah and belum are Indonesian. In Javanese they'd be arep neng, wis and durung.
    words: [arep, wis, durung]
  - id: e04
    type: match_pairs
    pairs:
      - text: ws
        ar_eg: wis (خلاص / بالفعل)
        ar: wis (قد / بالفعل)
        en: wis (already)
      - text: moco
        ar_eg: maca (يقرا)
        ar: maca (يقرأ)
        en: maca (read)
      - text: arp
        ar_eg: arep (هـ… / ناوي)
        ar: arep (سوف)
        en: arep (going to)
      - text: ng
        ar_eg: neng (لـ / في)
        ar: neng (إلى / في)
        en: neng (to / at)
      - text: kanca2
        ar_eg: kanca-kanca (صحاب)
        ar: kanca-kanca (أصدقاء)
        en: kanca-kanca (friends)
    words: [wis, maca, arep, neng, kanca]
  - id: e05
    type: listen
    text: Durung turu, isih maca buku.
    options: ["Arep turu, wis maca buku.", "Durung turu, isih maca buku.", "Durung mangan, isih maca buku."]
    answer: 1
    meaning:
      ar_eg: لسه ما نمتش، لسه بقرا كتاب.
      ar: لم أنم بعد، ما زلت أقرأ كتابًا.
      en: Not asleep yet, still reading a book.
    words: [durung, turu, isih]
  - id: e06
    type: translate
    direction: from_target
    source_text: ws tekan Alkid! lagi mangan sate karo kanca2
    answers_meaning:
      ar_eg: ["وصلت ألكيد! باكل سَتيه مع الصحاب.", "وصلت ألكيد، باكل ساتيه مع صحابي", "وصلت ألكيد! بناكل سَتيه مع الصحاب"]
      ar: ["وصلت إلى ألكيد! آكل الساتيه مع الأصدقاء.", "وصلت إلى ألكيد، آكل الساتيه مع أصدقائي"]
      en: ["Made it to Alkid! Having satay with friends.", "Arrived at Alkid! Eating satay with friends.", "I've arrived at Alkid, I'm eating satay with my friends.", "Got to Alkid! Having satay with my friends."]
    explain:
      ar_eg: ws = wis، وkanca2 = kanca-kanca (صحاب). tekan = وصل.
      ar: ws = wis، وkanca2 = kanca-kanca (أصدقاء)، وtekan = وصل.
      en: ws = wis, kanca2 = kanca-kanca (friends). tekan = arrive.
    words: [wis, lagi, mangan, kanca, tekan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: "قول حالة Dimas بالجاوي: «أنا رايح ألكيد. كلتوا ولا لسه؟»"
      ar: "قل حالة Dimas بالجاوية: «أنا ذاهب إلى ألكيد. هل أكلتم أم ليس بعد؟»"
      en: "Say Dimas's status in Javanese: \"I'm heading to Alkid. Eaten yet?\""
    answer: Aku arep neng Alkid. Wis mangan durung?
    distractors: [mau, ke, udah]
    explain:
      ar_eg: mau ke ← arep neng، udah ← wis، belum ← durung، makan ← mangan.
      ar: mau ke ← arep neng، وudah ← wis، وbelum ← durung، وmakan ← mangan.
      en: mau ke → arep neng, udah → wis, belum → durung, makan → mangan.
    words: [arep, neng, wis, mangan, durung]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "رد على Mas Heru بالجاوي: «استنى، أنا رايح ألكيد!»"
      ar: "ردّ على Mas Heru بالجاوية: «انتظر، أنا ذاهب إلى ألكيد!»"
      en: "Reply to Mas Heru in Javanese: \"Hold on, I'm heading to Alkid!\""
    answers:
      - Sik, aku arep neng Alkid!
      - Sik, aku arep neng Alkid.
      - Sik, aku arep neng Alkid
      - Sik aku arep neng Alkid
      - Sik, aku arep neng Alkid!
      - Sik, aku arep neng Alkid.
      - Sik, arep neng Alkid!
      - Sik, aku arep neng Alkid!
      - sik, aku arp ng Alkid
      - Sik, aku arep neng Alkid!
    explain:
      ar_eg: sik = استنى، arep neng = رايح لـ. في الشات ينفع «sik, aku arp ng Alkid».
      ar: sik = انتظر، وarep neng = ذاهب إلى، وفي الدردشة يصحّ «sik, aku arp ng Alkid».
      en: sik = hold on, arep neng = heading to. In a chat, "sik, aku arp ng Alkid" works too.
    words: [sik, arep, neng]
  - id: e09
    type: speaking
    text: Mbak Rara durung turu, isih maca buku.
    meaning:
      ar_eg: Mbak Rara لسه ما نامتش، لسه بتقرا كتاب.
      ar: لم تنم Mbak Rara بعد، ما زالت تقرأ كتابًا.
      en: Mbak Rara isn't asleep yet; she's still reading a book.
    words: [durung, isih, maca]
  - id: e10
    type: multiple_choice
    question: Rara wis tekan omah.
    question_meaning:
      ar_eg: رارا فين دلوقتي؟
      ar: أين رارا الآن؟
      en: Where is Rara now?
    options: [Wis neng omah., Isih neng Alkid., Durung tekan.]
    answer: 0
    explain:
      ar_eg: tekan = وصل (sampai). wis tekan omah = وصلت البيت.
      ar: tekan = وصل (sampai)، وwis tekan omah = وصلت إلى البيت.
      en: tekan = arrive (sampai). wis tekan omah = she's got home.
    words: [tekan, wis, omah]
dialogue:
  title: Bengi neng Alkid
  lines:
    - speaker: Mohamed
      text: Mas Heru! Aku wis tekan.
      ar_eg: يا Mas Heru! أنا وصلت.
      ar: يا Mas Heru! لقد وصلت.
      en: Mas Heru! I'm here.
    - speaker: Mas Heru
      text: Ayo mangan sate, cah! Kowe wis mangan?
      ar_eg: يلا ناكل سَتيه يا جدع! إنت كلت؟
      ar: هيّا نأكل الساتيه يا صاحبي! هل أكلت؟
      en: Come and have satay, mate! Have you eaten?
    - speaker: Mohamed
      text: Durung, Mas. Mbak Rara durung turu, isih maca buku.
      ar_eg: لسه يا Mas. و Mbak Rara لسه ما نامتش، لسه بتقرا.
      ar: ليس بعد يا Mas. وMbak Rara لم تنم بعد، ما زالت تقرأ.
      en: Not yet, Mas. Mbak Rara isn't asleep yet; she's still reading.
    - speaker: Mas Heru
      text: Dimas piye?
      ar_eg: وDimas عامل إيه؟
      ar: وماذا عن Dimas؟
      en: What about Dimas?
    - speaker: Mohamed
      text: Dimas arep neng Alkid. Statuse basa Indonesia, Mas!
      ar_eg: Dimas جاي ألكيد. حالته بالإندونيسي يا Mas!
      ar: Dimas قادم إلى ألكيد. حالته بالإندونيسية يا Mas!
      en: Dimas is on his way to Alkid. His status is in Indonesian, Mas!
    - speaker: Mas Heru
      text: Ora apa-apa. Ayo mangan sik, cah!
      ar_eg: مش مشكلة. يلا ناكل الأول يا جدع!
      ar: لا بأس. هيّا نأكل أولًا يا صاحبي!
      en: No problem. Let's eat first, mate!
new_words:
  - word: tekan
    pos: verb
    ar_eg: يوصل (ws tekan = وصلت)
    ar: يصل (ws tekan = وصلتُ)
    en: to arrive, reach (= sampai)
review:
