schema: kabar.lesson/v1
id: j1.u05.l08
language: jv
title: Nongkrong neng Parangtritis
can_do:
  ar_eg: تتابع دردشة سريعة بكلام شارع يوجيا على الشط.
  ar: أن تتابع دردشة سريعة بكلام شارع يوجيا على الشاطئ.
  en: Follow a fast Jogja street chat on the beach.
slides:
  - title: Kowe ngerti ra?
    body:
      ar_eg: |
        قبل ما تقعد مع Mas Heru وMas Yudha على رملة باراندجتريتيس، افتكر الصيغ السريعة (الشارع ⇐ العادي):
        - ra ⇐ ora · ki ⇐ iki · sik ⇐ dhisik
        - to / ta = ولا إيه؟ · wae = بس · lho = على فكرة · je / og = والله / أصلًا ⚠️
        - mau = من شوية · mengko = بعدين · nganti = لحد · yen = لو
        الجاوي في الشارع بيتكلم بسرعة وبيبلع حروف، فاسمع الكلمة المهمة وسيب الباقي.
      ar: |
        قبل الجلوس مع Mas Heru وMas Yudha على رمل باراندجتريتيس، تذكّر الصيغ السريعة (الشارع ⇐ القياسي):
        - ra ⇐ ora · ki ⇐ iki · sik ⇐ dhisik
        - to / ta = أليس كذلك؟ · wae = فقط · lho = للتنبيه · je / og = للتوكيد ⚠️
        - mau = قبل قليل · mengko = لاحقًا · nganti = حتى · yen = إذا
        والجاوي في الشارع سريع يبتلع الحروف، فالتقط الكلمة المهمة ودع الباقي.
      en: |
        Before you sit down with Mas Heru and Mas Yudha on the sand at Parangtritis, recall the quick forms (street ⇒ standard):
        - ra ⇒ ora · ki ⇒ iki · sik ⇒ dhisik
        - to / ta = right? · wae = just · lho = you know · je / og = honestly / really ⚠️
        - mau = a moment ago · mengko = later · nganti = until · yen = if
        Street Javanese is fast and swallows sounds, so catch the key word and let the rest go.
    grammar: jv.particle.basic
    examples:
      - text: Kowe wis mangan to, cah?
        ar_eg: إنت كلت ولا إيه يا صاحبي؟
        ar: أكلتَ، أليس كذلك يا صاح؟
        en: You've eaten, right, mate?
      - text: Aku ra ngerti og.
        ar_eg: ماعرفش أصلًا.
        ar: لا أعرف حقًا.
        en: I really don't know.
      - text: Mengko nongkrong nganti bengi, ya.
        ar_eg: بعدين نقعد نرغي لحد بالليل، ماشي؟
        ar: لاحقًا نسهر حتى الليل، حسنًا؟
        en: Later we'll hang out till night, OK?
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: (من الحوار) هما جم الشط إزاي؟
      ar: (من الحوار) كيف جاؤوا إلى الشاطئ؟
      en: (From the dialogue) How did they get to the beach?
    options: [numpak motor, numpak sepur, mlaku]
    answer: 0
    explain:
      ar_eg: Mas Yudha قال «Numpak motor mau» = جينا بالموتوسيكل من شوية.
      ar: قال Mas Yudha «Numpak motor mau» أي جئنا بالدراجة قبل قليل.
      en: 'Mas Yudha says "Numpak motor mau": they came by motorbike earlier.'
    words: [motor, mau]
  - id: e02
    type: listen
    text: Ombake gedhe banget je!
    question:
      ar_eg: بيقول إيه عن البحر؟
      ar: ماذا يقول عن البحر؟
      en: What does he say about the sea?
    options: [الموج عالي أوي, الرملة سخنة, الدرة غالية]
    answer: 0
    meaning:
      ar_eg: الموج عالي أوي والله!
      ar: الموج عالٍ جدًا حقًا!
      en: The waves are really big!
    words: [ombak, banget, je]
  - id: e03
    type: fill_blank
    sentence: Aku ___ ngerti, Mas.
    meaning:
      ar_eg: أنا مش فاهم يا كابتن.
      ar: لا أفهم يا أخي.
      en: I don't get it, Mas.
    options: [ra, je, wae]
    answers: [ra]
    words: [ra, je, wae]
  - id: e04
    type: multiple_choice
    question: Yen ombake gedhe, ora usah adus.
    question_meaning:
      ar_eg: Mas Heru قالك كده. يقصد إيه؟
      ar: قالها Mas Heru. ماذا يقصد؟
      en: Mas Heru says this. What does he mean?
    options: [لو الموج عالي ماتستحماش, الموج عالي، يلا نستحمى, مفيش موج النهارده]
    answer: 0
    explain:
      ar_eg: yen = لو، وora usah = مالوش لزوم.
      ar: yen = إذا، وora usah = لا داعي.
      en: yen = if; ora usah = no need to.
    words: [yen, ombak]
  - id: e05
    type: build_sentence
    source:
      ar_eg: يلا نقعد نرغي على الرملة لحد بالليل.
      ar: هيا نسمر على الرمل حتى الليل.
      en: Let's hang out on the sand till night.
    answer: Ayo nongkrong neng pasir nganti bengi.
    distractors: [mau, motor]
    words: [nongkrong, pasir, nganti]
  - id: e06
    type: listen
    text: Mengko jagung bakar wae, ya.
    question:
      ar_eg: هياكلوا إيه وإمتى؟
      ar: ماذا سيأكلون ومتى؟
      en: What will they eat, and when?
    options: [درة مشوية بعدين, سمك مشوي دلوقتي, جوز هند من شوية]
    answer: 0
    meaning:
      ar_eg: بعدين درة مشوية وخلاص، ماشي؟
      ar: لاحقًا ذرة مشوية فقط، حسنًا؟
      en: Later just grilled corn, OK?
    words: [mengko, jagung bakar, wae]
  - id: e07
    type: fill_blank
    sentence: Layangane mabur ___ dhuwur.
    meaning:
      ar_eg: الطيارة الورق طارت عالي أوي.
      ar: طارت الطائرة الورقية عاليًا جدًا.
      en: The kite is flying really high.
    options: [banget, mung, mau]
    answers: [banget]
    words: [layangan, banget, mung]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ngapura, Mas, aku ra ngerti og.
    answers_meaning:
      ar_eg: [معلش يا كابتن، أنا مش فاهم أصلًا, آسف يا أستاذ، والله ما فاهم]
      ar: [عذرًا يا أخي، لا أفهم حقًا, آسف يا أخي، لم أفهم أصلًا]
      en: ['Sorry, Mas, I really don''t understand', 'Sorry, I honestly don''t get it']
    words: [ngapura, ra, og]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «كلت، مش كده؟»
      ar: أيّ جملة تعني «أكلتَ، أليس كذلك؟»
      en: Which sentence means "You've eaten, right?"
    options: ['Kowe wis mangan to?', 'Kowe arep mangan?', Kowe durung mangan.]
    answer: 0
    explain:
      ar_eg: to في الآخر = «مش كده؟» (= kan). وdurung = لسه.
      ar: to آخر الجملة = «أليس كذلك؟» (= kan)، وdurung = لم بعد.
      en: to at the end = "right?" (= kan); durung = not yet.
    words: [to, wis, durung]
  - id: e10
    type: speaking
    text: Sik, aku tuku degan mau. Mengko nongkrong, ya.
    meaning:
      ar_eg: استنى، أنا اشتريت جوز هند من شوية. بعدين نقعد نرغي، ماشي؟
      ar: انتظر، اشتريت جوز هند قبل قليل. لاحقًا نسمر، حسنًا؟
      en: Hold on, I bought a coconut just now. We'll hang out later, OK?
    words: [sik, degan, mau, mengko]
dialogue:
  title: Sore neng pasir
  lines:
    - speaker: Mas Heru
      text: Piye, cah? Wis tekan?
      ar_eg: إيه الأخبار يا جماعة؟ وصلتوا؟
      ar: ما الأخبار يا رفاق؟ هل وصلتم؟
      en: How's it going, guys? You here?
    - speaker: Mas Yudha
      text: Wis. Numpak motor mau, panas je!
      ar_eg: أيوه. جينا بالموتوسيكل من شوية، حر والله!
      ar: نعم. جئنا بالدراجة قبل قليل، والجو حارّ!
      en: Yep. Came by motorbike just now, so hot!
    - speaker: Mohamed
      text: Ombake gedhe banget, Mas!
      ar_eg: الموج عالي أوي يا كابتن!
      ar: الموج عالٍ جدًا يا أخي!
      en: The waves are huge!
    - speaker: Mas Heru
      text: Yen ombake gedhe, ora usah adus. Nongkrong wae neng pasir.
      ar_eg: لو الموج عالي ماتستحماش. اقعد ارغي على الرملة وبس.
      ar: إن كان الموج عاليًا فلا تسبح، بل اجلس على الرمل.
      en: If the waves are big, don't swim. Just hang out on the sand.
    - speaker: Mas Yudha
      text: Mengko jagung bakar wae, ya. Nganti bengi!
      ar_eg: بعدين درة مشوية، ماشي؟ لحد بالليل!
      ar: لاحقًا ذرة مشوية، حسنًا؟ حتى الليل!
      en: Grilled corn later, OK? Till night!
    - speaker: Mohamed
      text: Ayo! Aku ra mulih nganti bengi.
      ar_eg: يلا! أنا مش مروّح لحد بالليل.
      ar: هيا! لن أعود إلى البيت حتى الليل.
      en: Let's go! I'm not going home till night.
review:
  status: draft
  verified: false
