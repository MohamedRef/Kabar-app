schema: kabar.lesson/v1
id: j1.u05.l08
language: jv
title: Ulangan J1.5
can_do:
  ar_eg: تحكي عن يوم على الشط بكلام شارع يوجيا.
  ar: أن تتحدث عن يوم على الشاطئ بكلام شارع يوجيا.
  en: Talk through a beach day in Jogja street ngoko.
slides:
  - title: Dina neng pantai
    body:
      ar_eg: |
        مراجعة الوحدة:
        - النفي: ora (ra) قبل الفعل والصفة، dudu قبل الاسم، ora ana = مفيش، rapopo = ولا يهمك.
        - الوقت: mau = من شوية، mengko = بعدين، nganti = لحد، yen = لو / لما.
        - القدّ: mung = بس، banget = أوي، kakehan = زيادة. والاعتذار: ngapura / nyuwun sewu.
        - الجو والأكل: panas، sumuk، adem، banyu، iwak bakar، jagung bakar، degan.
        - بهارات يوجيا: to / ta، wae، lho، je / og ⚠️.
      ar: |
        مراجعة الوحدة:
        - النفي: ora (ra) قبل الفعل والصفة، وdudu قبل الاسم، وora ana = لا يوجد، وrapopo = لا بأس.
        - الوقت: mau = قبل قليل، mengko = لاحقًا، nganti = حتى، yen = إذا / عندما.
        - المقدار: mung = فقط، banget = جدًا، kakehan = أكثر من اللازم، والاعتذار: ngapura / nyuwun sewu.
        - الجو والطعام: panas، sumuk، adem، banyu، iwak bakar، jagung bakar، degan.
        - توابل يوجيا: to / ta، wae، lho، je / og ⚠️.
      en: |
        Unit review:
        - Negation: ora (ra) before verbs and adjectives, dudu before nouns, ora ana = there isn't, rapopo = no worries.
        - Time: mau = a moment ago, mengko = later, nganti = until, yen = if / when.
        - Amount: mung = only, banget = very, kakehan = too much. Apologising: ngapura / nyuwun sewu.
        - Weather and food: panas, sumuk, adem, banyu, iwak bakar, jagung bakar, degan.
        - Jogja spice: to / ta, wae, lho, je / og ⚠️.
    grammar: jv.negation.ora-dudu
    examples:
      - text: Iki dudu degan, iki banyu putih.
        ar_eg: ده مش جوز هند، دي ميه سادة.
        ar: هذا ليس جوز هند، بل ماء عادي.
        en: This isn't coconut, it's plain water.
      - text: Mau panas banget, neng warung adem.
        ar_eg: من شوية كان حر أوي، وفي الوارونج طراوة.
        ar: كان الجو حارًّا جدًا قبل قليل، وفي المطعم بارد.
        en: It was really hot earlier; the warung is cool.
      - text: Rapopo, mung kakehan gula sithik.
        ar_eg: ولا يهمك، بس السكر زايد شوية.
        ar: لا بأس، فقط في السكر زيادة قليلة.
        en: No worries, just a bit too much sugar.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dudu
        ar_eg: مش (قبل الاسم)
        ar: ليس (قبل الاسم)
        en: not (before nouns)
      - text: mau
        ar_eg: من شوية
        ar: قبل قليل
        en: a moment ago
      - text: mung
        ar_eg: بس
        ar: فقط
        en: only
      - text: sumuk
        ar_eg: حر وكتمة
        ar: حرّ رطب
        en: muggy
      - text: nglangi
        ar_eg: يعوم
        ar: يسبح
        en: swim
    words: [dudu, mau, mung, sumuk, nglangi]
  - id: e02
    type: match_pairs
    pairs:
      - text: mengko
        ar_eg: بعدين
        ar: لاحقًا
        en: later
      - text: kakehan
        ar_eg: زيادة عن اللزوم
        ar: أكثر من اللازم
        en: too much
      - text: banyu
        ar_eg: ميه
        ar: ماء
        en: water
      - text: ora ana
        ar_eg: مفيش
        ar: لا يوجد
        en: there isn't
    words: [mengko, kakehan, banyu, ora ana]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: حد سألك «ده بتاعك؟» والحاجة مش بتاعتك. ترد إزاي؟
      ar: سألك أحدهم «أهذا لك؟» وليس لك. كيف تجيب؟
      en: Someone asks if it's yours, and it isn't. What do you say?
    options: ['Dudu, dudu duwekku.', 'Ora, ora duwekku.', Durung duwekku.]
    answer: 0
    explain:
      ar_eg: duwekku اسم (بتاعي)، فبننفيه بـ dudu زي bukan.
      ar: duwekku اسم (ملكي) فيُنفى بـ dudu كـ bukan.
      en: duwekku is a noun (mine), so it takes dudu, like bukan.
    words: [dudu]
  - id: e04
    type: listen
    text: Yen ora udan, mengko neng pantai.
    question:
      ar_eg: الخطة إيه؟
      ar: ما الخطة؟
      en: What's the plan?
    options: [لو مافيش مطر، بعدين على الشط, المطر نازل، مش رايحين, رحنا الشط من شوية]
    answer: 0
    meaning:
      ar_eg: لو ما نزلتش مطر، بعدين نروح الشط.
      ar: إن لم تمطر نذهب لاحقًا إلى الشاطئ.
      en: If it doesn't rain, we'll go to the beach later.
    words: [yen, mengko, pantai]
  - id: e05
    type: fill_blank
    sentence: Ayo ___ neng pasir nganti bengi.
    meaning:
      ar_eg: يلا نقعد نرغي على الرملة لحد بالليل.
      ar: هيا نسمر على الرمل حتى الليل.
      en: Let's hang out on the sand till night.
    options: [nongkrong, nganti, mau]
    answers: [nongkrong]
    words: [nongkrong, pasir, nganti, mau]
  - id: e06
    type: fill_blank
    sentence: Wah, ___ banget! Ayo golek sing adem.
    meaning:
      ar_eg: ياه، حر وكتمة أوي! يلا ندور على حتة طراوة.
      ar: يا للحر الخانق! هيا نبحث عن مكان بارد.
      en: Phew, so muggy! Let's find somewhere cool.
    options: [sumuk, banyu, dudu]
    answers: [sumuk]
    words: [sumuk, banget, adem]
  - id: e07
    type: build_sentence
    source:
      ar_eg: معلش يا كابتن، أنا مش فاهم.
      ar: عذرًا يا أخي، لا أفهم.
      en: Sorry, Mas, I don't understand.
    answer: Ngapura, Mas, aku ra ngerti.
    distractors: [dudu, kakehan]
    words: [ngapura, ra]
  - id: e08
    type: multiple_choice
    question: Jagung bakare enak banget je!
    question_meaning:
      ar_eg: صاحبك قال كده. يقصد إيه؟
      ar: قالها صديقك. ماذا يقصد؟
      en: Your friend says this. What does he mean?
    options: [الدرة المشوية حلوة أوي والله!, الدرة غالية أوي!, مفيش درة مشوية.]
    answer: 0
    explain:
      ar_eg: banget = أوي، وje في الآخر = والله ⚠️.
      ar: banget = جدًا، وje آخر الجملة للتوكيد ⚠️.
      en: banget = very; je at the end = honestly ⚠️.
    words: [jagung bakar, banget, je]
  - id: e09
    type: translate
    direction: from_target
    source_text: Mau ombake gedhe, mengko mung layangan sing mabur.
    answers_meaning:
      ar_eg: [من شوية الموج كان عالي، وبعدين هيبقى بس الطيارات الورق اللي طايرة, الموج كان عالي من شوية، وبعدين مفيش غير الطيارات الورق]
      ar: [كان الموج عاليًا قبل قليل، ولاحقًا لن تطير إلا الطائرات الورقية, قبل قليل كان الموج عاليًا، ولاحقًا تطير الطائرات الورقية وحدها]
      en: [The waves were big earlier; later only the kites will be flying, 'Earlier the waves were high, later it''ll just be kites in the air']
    words: [mau, ombak, mung, layangan]
  - id: e10
    type: dictation
    text: Iwak bakar karo degan, ora kakehan gula.
    meaning:
      ar_eg: سمك مشوي وجوز هند، من غير سكر كتير.
      ar: سمك مشوي وجوز هند، دون سكر كثير.
      en: Grilled fish and a coconut, not too much sugar.
    words: [iwak, degan, kakehan]
  - id: e11
    type: listen
    text: Aku ra ngerti og, Mas.
    question:
      ar_eg: هو عارف ولا لأ؟
      ar: هل يعرف؟
      en: Does he know?
    options: [ماعرفش أصلًا, عارف كويس, هعرف بعدين]
    answer: 0
    meaning:
      ar_eg: ماعرفش أصلًا يا كابتن.
      ar: لا أعرف حقًا يا أخي.
      en: I really don't know, Mas.
    words: [ra, og]
  - id: e12
    type: speaking
    text: Mau numpak motor neng pantai, panas banget. Neng warung adem.
    meaning:
      ar_eg: من شوية رحنا الشط بالموتوسيكل، كان حر أوي. في الوارونج طراوة.
      ar: قبل قليل ذهبنا إلى الشاطئ بالدراجة، وكان حارًّا جدًا. وفي المطعم بارد.
      en: We rode to the beach earlier, it was really hot. The warung is cool.
    words: [mau, motor, pantai, panas, adem]
dialogue:
  title: Sore neng Parangtritis
  lines:
    - speaker: Mas Yudha
      text: Piye, Mohamed? Seneng neng Parangtritis?
      ar_eg: إيه يا محمد؟ مبسوط في باراندجتريتيس؟
      ar: ما رأيك يا محمد؟ أأنت سعيد في باراندجتريتيس؟
      en: So, Mohamed? Enjoying Parangtritis?
    - speaker: Mohamed
      text: Seneng banget! Mau panas, neng warung adem.
      ar_eg: مبسوط أوي! من شوية كان حر، وفي الوارونج طراوة.
      ar: سعيد جدًا! كان حارًّا قبل قليل، وفي المطعم بارد.
      en: Loving it! It was hot earlier; the warung is cool.
    - speaker: Mas Heru
      text: Yen ora kesel, nongkrong nganti bengi, ya.
      ar_eg: لو مش تعبان، نقعد لحد بالليل، ماشي؟
      ar: إن لم تكن متعبًا نسهر حتى الليل، حسنًا؟
      en: If you're not tired, we'll stay till night, OK?
    - speaker: Mohamed
      text: Iya. Ngapura, aku ra ngerti tembung «og».
      ar_eg: ماشي. معلش، أنا مش فاهم كلمة «og».
      ar: نعم. عذرًا، لم أفهم كلمة «og».
      en: Sure. Sorry, I don't get the word "og".
    - speaker: Mas Yudha
      text: Rapopo, kuwi mung basa Jogja, kaya «lho».
      ar_eg: ولا يهمك، دي بس كلمة يوجياوي، زي «lho».
      ar: لا بأس، إنها كلمة من كلام يوجيا فحسب، مثل «lho».
      en: No worries, it's just Jogja talk, like "lho".
souvenir:
  id: j1.u05.souvenir
  title: Pantai Parangtritis
  note:
    ar_eg: |
      باراندجتريتيس هو شط يوجيا على المحيط الهندي، حوالي ٢٧ كيلو جنوب المدينة: رملة سودا من بركان ميرابي، وموج عالي وقوي لدرجة إن الاستحمام هناك خطر، وحناطير (andong) بتمشي على الرملة، وطيارات ورق في الهوا، وقرب الغروب الناس كلها قاعدة تتفرج على الشمس.
      والحكاية الشعبية بتقول إن البحر ده بيت Nyai Roro Kidul، ملكة البحر الجنوبي، وفيه ناس بتتجنب تلبس أخضر على الشط. إنت دلوقتي تقدر تقول «Ombake gedhe banget je!» و«Nongkrong nganti bengi» زي ولاد يوجيا بالظبط.
    ar: |
      باراندجتريتيس شاطئ يوجيا على المحيط الهندي، على نحو ٢٧ كيلومترًا جنوب المدينة: رمل أسود من بركان ميرابي، وموج عالٍ قوي يجعل السباحة خطرة، وعربات خيل (andong) تسير على الرمل، وطائرات ورقية في السماء، وعند الغروب يجلس الناس يتأملون الشمس.
      وفي الحكاية الشعبية أن هذا البحر بيت Nyai Roro Kidul ملكة البحر الجنوبي، ويتجنب بعض الناس لبس الأخضر على الشاطئ. وصرت الآن تقول «Ombake gedhe banget je!» و«Nongkrong nganti bengi» كأهل يوجيا.
    en: |
      Parangtritis is Jogja's beach on the Indian Ocean, about 27 km south of the city: black sand from Merapi, waves so strong that swimming is dangerous, horse carts (andong) on the sand, kites in the sky, and everyone sitting out to watch the sunset.
      Folk belief says this sea is the home of Nyai Roro Kidul, Queen of the Southern Sea, and some people avoid wearing green on the beach. Now you can say "Ombake gedhe banget je!" and "Nongkrong nganti bengi" just like Jogja locals.
