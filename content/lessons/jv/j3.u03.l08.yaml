schema: kabar.lesson/v1
id: j3.u03.l08
language: jv
title: Tulisan ing toko
can_do:
  ar_eg: تقرا ورقة معلّقة على باب محل بالكراما وتسأل بأدب صاحب المحل موجود ولا لأ.
  ar: أن تقرأ ورقة معلّقة على باب متجر بالكراما وتسأل بأدب إن كان صاحبه موجودًا.
  en: Read a krama note on a shop door and ask politely whether the owner is in.
slides:
  - title: Ing lawang toko batik
    body:
      ar_eg: |
        في Kauman، محمد راح محل الباتيك بتاع Pak Harjo وقت الضهر، ولقى ورقة على الباب. اقراها:
        mboten = ora، wonten = ana، taksih = isih، dhateng = neng.
      ar: |
        ذهب محمد في Kauman إلى متجر الباتيك الخاص بـ Pak Harjo وقت الظهر، فوجد ورقة على الباب. اقرأها:
        mboten = ora، وwonten = ana، وtaksih = isih، وdhateng = neng.
      en: |
        In Kauman, Mohamed goes to Pak Harjo's batik shop at midday and finds a note on the door. Read it:
        mboten = ora, wonten = ana, taksih = isih, dhateng = neng.
    examples:
      - text: Nyuwun sewu, kula dhateng masjid.
        ar_eg: لا مؤاخذة، أنا رحت الجامع.
        ar: عفوًا، ذهبتُ إلى المسجد.
        en: Excuse me, I've gone to the mosque.
      - text: Bu Harjo wonten ing griya.
        ar_eg: Bu Harjo موجودة في البيت.
        ar: Bu Harjo في البيت.
        en: Bu Harjo is at home.
      - text: Batik taksih wonten. Matur nuwun! — Pak Harjo
        ar_eg: لسه فيه باتيك. شكرًا! — Pak Harjo
        ar: ما زال الباتيك متوفرًا. شكرًا! — Pak Harjo
        en: There's still batik. Thank you! — Pak Harjo
    grammar: jv.krama.function-words
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: (من الورقة) Pak Harjo فين؟
      ar: (من الورقة) أين Pak Harjo؟
      en: (from the note) Where is Pak Harjo?
    options: [ing griya, ing peken, ing masjid]
    answer: 2
    words: [dhateng, masjid]
    explain:
      ar_eg: Pak Harjo كاتب «kula dhateng masjid» = أنا رايح الجامع. يبقى في الجامع، مش في البيت ولا السوق.
      ar: كتب Pak Harjo «kula dhateng masjid» أي ذهبت إلى المسجد، فهو في المسجد لا في البيت ولا السوق.
      en: "Pak Harjo writes \"kula dhateng masjid\": he's gone to the mosque, not home or the market."
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: (من الورقة) مين موجود في البيت؟
      ar: (من الورقة) من الموجود في البيت؟
      en: (from the note) Who is at home?
    options: [Pak Harjo, Bu Harjo, Mas Dimas]
    answer: 1
    words: [wonten]
    explain:
      ar_eg: الورقة بتقول «Bu Harjo wonten ing griya» = Bu Harjo في البيت. Pak Harjo في الجامع.
      ar: تقول الورقة «Bu Harjo wonten ing griya» أي Bu Harjo في البيت. أما Pak Harjo ففي المسجد.
      en: "The note says \"Bu Harjo wonten ing griya\": Bu Harjo is at home. Pak Harjo is at the mosque."
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: (من الورقة) محمد لسه يقدر يشتري باتيك؟
      ar: (من الورقة) هل ما زال محمد يستطيع شراء الباتيك؟
      en: (from the note) Can Mohamed still buy batik?
    options: ['Mboten wonten.', 'Inggih, taksih wonten.']
    answer: 1
    explain:
      ar_eg: taksih wonten = isih ana = لسه موجود.
      ar: taksih wonten = isih ana = ما زال موجودًا.
      en: taksih wonten = isih ana = still there, still available.
    words: [taksih, wonten]
  - id: e04
    type: match_pairs
    pairs:
      - text: Nyuwun sewu
        ar_eg: لا مؤاخذة / بعد إذنك
        ar: عفوًا / بعد إذنك
        en: Excuse me
      - text: dhateng masjid
        ar_eg: (راح) على الجامع
        ar: إلى المسجد
        en: to the mosque
      - text: wonten ing griya
        ar_eg: موجود في البيت
        ar: موجود في البيت
        en: is at home
      - text: taksih wonten
        ar_eg: لسه موجود
        ar: ما زال موجودًا
        en: is still there
    words: [nyuwun sewu, dhateng, wonten, taksih]
  - id: e05
    type: listen
    text: Bu Harjo wonten ing griya.
    options: ['Pak Harjo wonten ing griya.', 'Bu Harjo wonten ing griya.', 'Bu Harjo mboten wonten.']
    answer: 1
    meaning:
      ar_eg: Bu Harjo موجودة في البيت.
      ar: Bu Harjo في البيت.
      en: Bu Harjo is at home.
    words: [wonten]
  - id: e06
    type: fill_blank
    sentence: Pak Harjo ___ wonten. Pak Harjo dhateng masjid.
    meaning:
      ar_eg: Pak Harjo مش موجود. Pak Harjo راح الجامع.
      ar: Pak Harjo ليس موجودًا. ذهب Pak Harjo إلى المسجد.
      en: Pak Harjo isn't in. Pak Harjo has gone to the mosque.
    options: [ora, dereng, mboten]
    answers: [mboten]
    explain:
      ar_eg: 'النفي في الكراما mboten. ora نغوكو، وdereng معناها «لسه».'
      ar: 'النفي في الكراما mboten؛ ora من الـ ngoko، وdereng تعني «ليس بعد».'
      en: Krama negation is mboten. ora is ngoko; dereng means "not yet".
    words: [mboten, wonten]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: 'اسأل Bu Harjo: لا مؤاخذة يا مدام، Pak Harjo موجود؟'
      ar: 'اسأل Bu Harjo: عفوًا يا سيدتي، هل Pak Harjo موجود؟'
      en: "Ask Bu Harjo: Excuse me, ma'am, is Pak Harjo in?"
    answers: ["Nyuwun sewu, Bu, Pak Harjo wonten?", "Nyuwun sewu, Bu, Pak Harjo wonten ing griya?", "Nyuwun sewu, Pak Harjo wonten, Bu?", "Nyuwun sewu, Bu, wonten Pak Harjo?", "Nyuwun sewu, Bu Harjo, Pak Harjo wonten?"]
    explain:
      ar_eg: 'wonten = «موجود». ابدأ بـ Nyuwun sewu زي «لا مؤاخذة».'
      ar: 'wonten = «موجود»، وابدأ بـ Nyuwun sewu أي «عفوًا».'
      en: wonten = "is in / is there". Open with Nyuwun sewu, "excuse me".
    words: [nyuwun sewu, wonten]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا كمان رايح الجامع.
      ar: سأذهب أنا أيضًا إلى المسجد.
      en: I'm going to the mosque too.
    answer: Kula ugi badhe dhateng masjid.
    distractors: [uga, neng]
    explain:
      ar_eg: 'كله krama: ugi (= uga)، badhe (= arep)، dhateng (= neng).'
      ar: 'كلها krama: ugi بدل uga، وbadhe بدل arep، وdhateng بدل neng.'
      en: 'All krama: ugi (= uga), badhe (= arep), dhateng (= neng).'
    words: [ugi, badhe, dhateng, masjid]
dialogue:
  title: Ing ngarep toko
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Bu. Pak Harjo wonten?
      ar_eg: لا مؤاخذة يا مدام. Pak Harjo موجود؟
      ar: عفوًا يا سيدتي. هل Pak Harjo موجود؟
      en: Excuse me, ma'am. Is Pak Harjo in?
    - speaker: Bu Harjo
      text: "Mboten wonten, Mas. Bapak teng masjid."
      ar_eg: "مش موجود يا أستاذ. الحاج راح الجامع."
      ar: "ليس هنا. ذهب إلى المسجد."
      en: "He's not in. He's gone to the mosque."
    - speaker: Mohamed
      text: Oh, inggih. Batik taksih wonten, Bu?
      ar_eg: آه، ماشي. لسه فيه باتيك يا مدام؟
      ar: آه، حسنًا. هل ما زال هناك باتيك يا سيدتي؟
      en: Oh, I see. Is there still batik, ma'am?
    - speaker: Bu Harjo
      text: "Taksih, Mas. Mangga, pinarak!"
      ar_eg: "لسه فيه يا أستاذ. اتفضل ادخل!"
      ar: "ما زال هناك. تفضّل بالدخول!"
      en: "There is. Come on in!"
    - speaker: Mohamed
      text: Matur nuwun, Bu.
      ar_eg: شكرًا يا مدام.
      ar: شكرًا يا سيدتي.
      en: Thank you, ma'am.
review:
