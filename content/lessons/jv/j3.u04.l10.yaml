schema: kabar.lesson/v1
id: j3.u04.l10
language: jv
title: Chat karo Pak Wiryo
can_do:
  ar_eg: تقرا شات قصير بالكراما مع راجل كبير وتطلع منه الميعاد والطريق.
  ar: أن تقرأ محادثة قصيرة بالكراما مع رجل كبير وتستخرج منها الموعد والطريق.
  en: Read a short krama chat with an older man and pick out the time and the way.
slides:
  - title: Chat ing HP
    body:
      ar_eg: |
        محمد عايز يقابل Pak Wiryo في الـ pendhapa، فبعت له رسالة. اقرا الشات:
        jam pinten = الساعة كام، saking pundi = منين، tebih = بعيد، saged mlampah = ينفع تمشي.
      ar: |
        يريد محمد أن يلقى Pak Wiryo في الـ pendhapa، فأرسل إليه رسالة. اقرأ المحادثة:
        jam pinten = في أيّ ساعة، وsaking pundi = من أين، وtebih = بعيد، وsaged mlampah = يمكن المشي.
      en: |
        Mohamed wants to meet Pak Wiryo at the pendhapa, so he sends him a message. Read the chat:
        jam pinten = what time, saking pundi = from where, tebih = far, saged mlampah = you can walk.
    examples:
      - text: "Mohamed: Sugeng enjing, Pak. Panjenengan wonten ing pendhapa jam pinten?"
        ar_eg: "محمد: صباح الخير يا حاج. حضرتك هتبقى في الـ pendhapa الساعة كام؟"
        ar: "محمد: صباح الخير يا سيدي. في أيّ ساعة تكون في الـ pendhapa؟"
        en: "Mohamed: Good morning, sir. What time will you be at the pendhapa?"
      - text: "Pak Wiryo: Jam sanga, Mas. Sampeyan saking pundi?"
        ar_eg: "Pak Wiryo: الساعة تسعة يا أستاذ. إنت جاي منين؟"
        ar: "Pak Wiryo: في التاسعة يا أخي. من أين ستأتي؟"
        en: "Pak Wiryo: Nine o'clock. Where are you coming from?"
      - text: "Mohamed: Saking Pasar Kranggan, Pak. Tebih? — Pak Wiryo: Mboten tebih, Mas. Saged mlampah kemawon."
        ar_eg: "محمد: من Pasar Kranggan يا حاج. بعيد؟ — Pak Wiryo: مش بعيد. تقدر تمشي عادي."
        ar: "محمد: من Pasar Kranggan يا سيدي. هل هو بعيد؟ — Pak Wiryo: ليس بعيدًا. يمكنك المشي فقط."
        en: "Mohamed: From Pasar Kranggan, sir. Is it far? — Pak Wiryo: Not far. You can just walk."
    grammar: jv.krama.questions
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: (من الشات) Pak Wiryo هيبقى في الـ pendhapa الساعة كام؟
      ar: (من المحادثة) في أيّ ساعة يكون Pak Wiryo في الـ pendhapa؟
      en: (from the chat) What time will Pak Wiryo be at the pendhapa?
    options: [jam pitu, jam sewelas, jam sanga]
    answer: 2
    words: [pinten, jam]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: (من الشات) محمد جاي منين؟
      ar: (من المحادثة) من أين سيأتي محمد؟
      en: (from the chat) Where is Mohamed coming from?
    options: [Pasar Kranggan, stasiun Lempuyangan, Kauman]
    answer: 0
    words: [saking, pundi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: (من الشات) محمد هيروح إزاي؟
      ar: (من المحادثة) كيف سيذهب محمد؟
      en: (from the chat) How will Mohamed get there?
    options: ['Tebih, mboten saged mlampah.', 'Mlampah kemawon.']
    answer: 1
    explain:
      ar_eg: Pak Wiryo قال «Mboten tebih … saged mlampah kemawon» = مش بعيد، تقدر تمشي.
      ar: قال Pak Wiryo «Mboten tebih … saged mlampah kemawon»، أي ليس بعيدًا ويمكن المشي.
      en: Pak Wiryo said "Mboten tebih … saged mlampah kemawon" — not far, you can walk.
    words: [tebih, mlampah]
  - id: e04
    type: match_pairs
    pairs:
      - text: jam pinten
        ar_eg: الساعة كام
        ar: في أيّ ساعة
        en: what time
      - text: saking pundi
        ar_eg: منين
        ar: من أين
        en: where from
      - text: tebih
        ar_eg: بعيد
        ar: بعيد
        en: far
      - text: saged mlampah
        ar_eg: ينفع تمشي
        ar: يمكن المشي
        en: can walk
    words: [pinten, pundi, tebih, saged, mlampah]
  - id: e05
    type: listen
    text: Mboten tebih, Mas. Saged mlampah kemawon.
    options: ['Tebih sanget, Mas. Mboten saged mlampah.', 'Mboten tebih, Mas. Saged mlampah kemawon.', 'Mboten tebih, Mas. Lurus kemawon.']
    answer: 1
    meaning:
      ar_eg: مش بعيد يا أستاذ. تقدر تمشي عادي.
      ar: ليس بعيدًا يا أخي. يمكنك المشي فقط.
      en: It's not far. You can just walk.
    words: [tebih, saged, mlampah, kemawon]
  - id: e06
    type: fill_blank
    sentence: Panjenengan wonten ing pendhapa jam ___?
    meaning:
      ar_eg: حضرتك هتبقى في الـ pendhapa الساعة كام؟
      ar: في أيّ ساعة تكون في الـ pendhapa؟
      en: What time will you be at the pendhapa?
    options: [pira, sinten, pinten]
    answers: [pinten]
    explain:
      ar_eg: 'كام = pinten بالكراما. pira نغوكو، وsinten = مين.'
      ar: 'كم = pinten بالكراما؛ pira من الـ ngoko، وsinten = من.'
      en: 'How many / what time = pinten in krama. pira is ngoko; sinten = who.'
    words: [pinten]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: 'رد على Pak Wiryo: شكرًا جدًا يا حاج. هاجي ماشي.'
      ar: 'ردّ على Pak Wiryo: شكرًا جزيلًا يا سيدي. سأمشي.'
      en: "Reply to Pak Wiryo: Thank you very much, sir. I'll walk."
    answers: ["Matur nuwun sanget, Pak. Kula badhe mlampah.", "Matur nuwun sanget, Pak. Kulo badhe mlampah.", "Matur nuwun sanget, Pak. Kula mlampah kemawon.", "Matur nuwun sanget, Pak. Kula badhe mlampah kemawon.", "Matur nuwun sanget, Pak. Kula mlampah.", "Matur nuwun sanget, Pak. Kula mlampah mawon.", "Matur nuwun sanget, Pak. Kula badhe mlampah mawon."]
    explain:
      ar_eg: 'mlampah = mlaku (يمشي) بالكراما، وbadhe = arep.'
      ar: 'mlampah = mlaku (يمشي) بالكراما، وbadhe = arep.'
      en: 'mlampah = mlaku (walk) in krama; badhe = arep.'
    words: [sanget, badhe, mlampah]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا جاي من Pasar Kranggan يا حاج.
      ar: أنا قادم من Pasar Kranggan يا سيدي.
      en: I'm coming from Pasar Kranggan, sir.
    answer: Kula saking Pasar Kranggan, Pak.
    distractors: [saka, ngendi]
    words: [kula, saking]
dialogue:
  title: Ing pendhapa, jam sanga
  lines:
    - speaker: Mohamed
      text: Sugeng enjing, Pak Wiryo!
      ar_eg: صباح الخير يا Pak Wiryo!
      ar: صباح الخير يا Pak Wiryo!
      en: Good morning, Pak Wiryo!
    - speaker: Pak Wiryo
      text: "Sugeng enjing, Mas Mohamed. Tebih, to?"
      ar_eg: "صباح الخير يا أستاذ محمد. المشوار كان بعيد، صح؟"
      ar: "صباح الخير يا محمد. كان الطريق بعيدًا، أليس كذلك؟"
      en: "Morning, Mohamed. Bit of a trek, was it?"
    - speaker: Mohamed
      text: Mboten, Pak. Kula mlampah kemawon saking Pasar Kranggan.
      ar_eg: لأ يا حاج. أنا جيت ماشي من Pasar Kranggan.
      ar: لا يا سيدي. جئتُ ماشيًا من Pasar Kranggan.
      en: No, sir. I just walked from Pasar Kranggan.
    - speaker: Pak Wiryo
      text: "Sae sanget! Mangga, Mas."
      ar_eg: "برافو! اتفضل يا أستاذ."
      ar: "أحسنت! تفضّل."
      en: "Good on you! Come on in."
    - speaker: Mohamed
      text: Matur nuwun, Pak.
      ar_eg: شكرًا يا حاج.
      ar: شكرًا يا سيدي.
      en: Thank you, sir.
review:
  status: draft
  verified: false
