    text: Mandheg neng prapatan, Pak.
    question:
      ar_eg: بيقول للسواق إيه؟
      ar: ماذا يقول للسائق؟
      en: What does he tell the driver?
    options: [اقف عند التقاطع يا عم, لف يمين عند التقاطع, الأتوبيس جاي]
    answer: 0
    meaning:
      ar_eg: اقف عند التقاطع يا عم.
      ar: توقّف عند التقاطع يا سيّدي.
      en: Stop at the crossroads, sir.
    words: [mandheg, prapatan]
  - id: e04
    type: fill_blank
    sentence: Prapatan ngarep, ___ sedhela, Pak!
    meaning:
      ar_eg: التقاطع اللي جاي، ___ لحظة يا عم!
      ar: عند التقاطع القادم، ___ لحظة يا سيّدي!
      en: At the next crossroads, ___ a moment, sir!
    options: [mandheg, lunga, tiket]
    answers: [mandheg]
    words: [mandheg, lunga, tiket, prapatan]
  - id: e05
    type: multiple_choice
    question: Bise teka pira menit?
    question_meaning:
      ar_eg: بيسأل عن إيه؟
      ar: عمّ يسأل؟
      en: What is he asking?
    options: [الأتوبيس جاي بعد كام دقيقة, التذكرة بكام, الأتوبيس واقف فين]
    answer: 0
    explain:
      ar_eg: menit = دقيقة، وpira = كام.
      ar: menit = دقيقة، وpira = كم.
      en: menit = minute, pira = how many.
    words: [bis, menit, tiket]
  - id: e06
    type: fill_blank
    sentence: Mas Heru wis ___, Mas. Dheweke mulih.
    meaning:
      ar_eg: ماس هيرو ___ خلاص يا ماس. روّح.
      ar: ماس هيرو قد ___ يا أخي. عاد إلى بيته.
      en: Mas Heru has ___, Mas. He went home.
    options: [lunga, mandheg, becak]
    answers: [lunga]
    words: [lunga, mandheg, becak]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «التذكرة بكام يا أبلة؟» بالجاوي؟
      ar: كيف تقول «بكم التذكرة يا أختي؟» بالجاوية؟
      en: '"How much is the ticket, Mbak?" in Javanese?'
    options: ['Tikete pira, Mbak?', 'Becake pira, Mbak?', 'Bise pira, Mbak?']
    answer: 0
    explain:
      ar_eg: tiket = تذكرة. becak = بيتشاك، bis = أتوبيس.
      ar: tiket = تذكرة. أمّا becak فريكشا، وbis فحافلة.
      en: tiket = ticket. becak = pedicab, bis = bus.
    words: [tiket, becak, bis]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عجلتي قدام البيت.
      ar: درّاجتي أمام البيت.
      en: My bike is in front of the house.
    answer: Pitku neng ngarep omah.
    distractors: [becak, menit]
    words: [pit, menit]
  - id: e09
    type: translate
    direction: from_target
    source_text: Becak apa pit, Mas? Pit wae, cedhak.
    answers_meaning:
      ar_eg: [بيتشاك ولا عجلة يا ماس؟ عجلة وخلاص، قريب, بيتشاك ولا عجلة؟ العجلة أحسن، المكان قريب]
      ar: [ريكشا أم درّاجة يا أخي؟ درّاجة، فالمكان قريب, ريكشا أم درّاجة؟ الدرّاجة تكفي، فهو قريب]
      en: ['Becak or bike, Mas? Just the bike, it''s close', 'Pedicab or bicycle? A bike will do, it''s near']
    words: [becak, pit]
  - id: e10
    type: speaking
    text: Ngapura, Pak, mandheg neng prapatan.
    meaning:
      ar_eg: لو سمحت يا عم، اقف عند التقاطع.
      ar: من فضلك يا سيّدي، توقّف عند التقاطع.
      en: Excuse me, sir, stop at the crossroads.
    words: [mandheg, prapatan]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, becak neng Malioboro pira?
      ar_eg: يا عم، البيتشاك لماليوبورو بكام؟
      ar: يا سيّدي، بكم الريكشا إلى ماليوبورو؟
      en: Sir, how much is a becak to Malioboro?
    - speaker: Sopir
      text: Ora larang, Mas. Sedhela wae tekan.
      ar_eg: مش غالي يا ماس. هنوصل في ثانية.
      ar: ليس غاليًا يا ماس. سنصل بسرعة.
      en: Not expensive, Mas. We'll be there in no time.
    - speaker: Mohamed
      text: Bis wae, Pak. Tikete murah.
      ar_eg: هركب الأتوبيس يا عمو. التذكرة رخيصة.
      ar: سأركب الحافلة يا عمّ. التذكرة رخيصة.
      en: I'll take the bus, sir. The ticket's cheap.
    - speaker: Sopir
      text: Bise kesuwen, Mas. Ayo numpak becak wae!
      ar_eg: الأتوبيس بياخد وقت طويل يا ماس. يلا اركب بيتشاك أحسن!
      ar: الحافلة تتأخر كثيرًا يا ماس. هيا اركب البيتشاك!
      en: The bus takes ages, Mas. Come on, take the becak!
    - speaker: Mohamed
      text: Oke, Pak. Mengko mandheg neng prapatan, ya.
      ar_eg: ماشي يا عمو. بعدين اقف عند التقاطع.
      ar: حسنًا يا عمّ. وبعد قليل توقّف عند التقاطع.
      en: OK, sir. Stop at the crossroads later, please.
