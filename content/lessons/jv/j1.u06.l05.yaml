schema: kabar.lesson/v1
id: j1.u06.l05
language: jv
title: Bis, becak, prapatan
can_do:
  ar_eg: 'تركب مواصلات يوجيا: أتوبيس Trans Jogja أو بيتشاك، تشتري تذكرة، وتقول للسواق يقف فين.'
  ar: 'أن تستعمل مواصلات يوجيا: حافلة Trans Jogja أو ريكشا، وتشتري تذكرة، وتطلب من السائق التوقّف.'
  en: 'Get around Jogja: Trans Jogja bus or becak, buy a ticket, and tell the driver where to stop.'
slides:
  - title: Neng dalan
    body:
      ar_eg: |
        bis = أتوبيس، becak = بيتشاك (عجلة بتلات عجلات وسوّاق بيبدّل)، pit = عجلة.
        tiket = تذكرة: Tikete pira? = التذكرة بكام؟
        prapatan = تقاطع (مفترق أربع طرق).
        mandheg = يقف: Mandheg neng prapatan, Pak! = اقف عند التقاطع يا عم!
        lunga = يمشي، يروح بعيد. menit = دقيقة.
      ar: |
        bis = حافلة، becak = ريكشا (دراجة بثلاث عجلات يقودها سائق)، pit = درّاجة.
        tiket = تذكرة: Tikete pira? = بكم التذكرة؟
        prapatan = تقاطع (مفترق أربع طرق).
        mandheg = يتوقّف: Mandheg neng prapatan, Pak! = توقّف عند التقاطع يا سيّدي!
        lunga = يذهب، يغادر. menit = دقيقة.
      en: |
        bis = bus, becak = pedicab (three-wheeler pedalled by a driver), pit = bicycle.
        tiket = ticket: Tikete pira? = How much is the ticket?
        prapatan = crossroads.
        mandheg = stop: Mandheg neng prapatan, Pak! = Stop at the crossroads, sir!
        lunga = go away, leave. menit = minute.
    examples:
      - text: Mandheg neng prapatan, Pak.
        ar_eg: اقف عند التقاطع يا عم.
        ar: توقّف عند التقاطع يا سيّدي.
        en: Stop at the crossroads, sir.
      - text: Tikete pira, Mbak?
        ar_eg: التذكرة بكام يا أبلة؟
        ar: بكم التذكرة يا أختي؟
        en: How much is the ticket, Mbak?
      - text: Bise teka pira menit?
        ar_eg: الأتوبيس جاي بعد كام دقيقة؟
        ar: بعد كم دقيقة تصل الحافلة؟
        en: How many minutes till the bus comes?
