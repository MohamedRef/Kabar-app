  - id: e08
    type: build_sentence
    source:
      ar_eg: عجلتي قدام البيت.
      ar: درّاجتي أمام البيت.
      en: My bike is in front of the house.
    answer: Pitku ndek ngarep omah.
    distractors: [becak, menit]
    words: [pit, menit]
  - id: e09
    type: translate
    direction: from_target
    source_text: Becak apa pit, Mas? Pit wae, cedhak.
    answers_meaning:
      ar_eg: [بيتشاك ولا عجلة يا ماس؟ عجلة وخلاص، قريب, بيتشاك ولا عجلة؟ العجلة أحسن، المكان قريب]
      ar: [ريكشا أم درّاجة يا أخي؟ درّاجة، فالمكان قريب, ريكشا أم درّاجة؟ الدرّاجة تكفي، فهو قريب]
      en: ['Becak or bike, Mas? Just the bike, it''s close', 'Pedicab or bicycle? A bike will do, it''s near']
    words: [becak, pit]
  - id: e10
    type: speaking
    text: Sepurane, Pak, mandheg ndek prapatan.
    meaning:
      ar_eg: لو سمحت يا عم، اقف عند التقاطع.
      ar: من فضلك يا سيّدي، توقّف عند التقاطع.
      en: Excuse me, sir, stop at the crossroads.
    words: [mandheg, prapatan]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, becak nang Tunjungan pira?
      ar_eg: يا عم، البيتشاك لتونجونجان بكام؟
      ar: يا سيّدي، بكم الريكشا إلى تونجونجان؟
      en: Sir, how much is a becak to Tunjungan?
    - speaker: Sopir
      text: Rong puluh ewu, Mas. Limang menit tekan.
      ar_eg: عشرين ألف يا ماس. خمس دقايق ونوصل.
      ar: عشرون ألفًا يا أخي. نصل في خمس دقائق.
      en: Twenty thousand, Mas. Five minutes and we're there.
    - speaker: Mohamed
      text: Larang, Pak. Bis wae, tikete murah.
      ar_eg: غالي يا عم. هركب أتوبيس، التذكرة رخيصة.
      ar: غالٍ يا سيّدي. سأركب الحافلة، فالتذكرة رخيصة.
      en: That's pricey, sir. I'll take the bus, the ticket's cheap.
    - speaker: Sopir
      text: Bise kesuwen, Mas. Limolas ewu wis, ayo!
      ar_eg: الأتوبيس بياخد وقت كتير يا ماس. خمستاشر ألف وخلاص، يلا!
      ar: الحافلة بطيئة جدًّا يا أخي. خمسة عشر ألفًا إذن، هيّا!
      en: The bus takes ages, Mas. Fifteen thousand then, come on!
    - speaker: Mohamed
      text: Oke, Pak. Engko mandheg ndek prapatan, ya.
      ar_eg: ماشي يا عم. بعدين اقف عند التقاطع.
      ar: حسنًا يا سيّدي. توقّف عند التقاطع لاحقًا.
      en: OK, sir. Stop at the crossroads, please.
