dialogue:
  title: Ngenteni Reog
  lines:
    - speaker: Mohamed
      text: Sari, saiki jam pira?
      ar_eg: ساري، الساعة كام دلوقتي؟
      ar: يا ساري، كم الساعة الآن؟
      en: Sari, what time is it now?
    - speaker: Sari
      text: Jam setengah wolu.
      ar_eg: سبعة ونص.
      ar: السابعة والنصف.
      en: Half past seven.
    - speaker: Mohamed
      text: Reogé jam pira?
      ar_eg: الريوج الساعة كام؟
      ar: في أي ساعة عرض الريوغ؟
      en: What time is the Reog?
    - speaker: Sari
      text: Jam wolu bengi. Mau awan kowé durung mangan, to?
      ar_eg: تمانية بالليل. إنت الضهر مكلتش، صح؟
      ar: في الثامنة ليلًا. لم تأكل ظهرًا، أليس كذلك؟
      en: Eight p.m. You didn't eat at midday, right?
    - speaker: Mohamed
      text: Durung. Ayo mangan sik!
      ar_eg: لسه. يلا ناكل الأول!
      ar: لم آكل بعد. هيا نأكل أولًا!
      en: Not yet. Let's eat first!
