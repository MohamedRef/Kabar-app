  - id: e02
    type: multiple_choice
    question: "7:30 = ?"
    question_meaning:
      ar_eg: إزاي تقول سبعة ونص؟
      ar: كيف تقول السابعة والنصف؟
      en: How do you say 7:30?
    options: ["setengah pitu", "jam wolu kurang seprapat", "setengah wolu"]
    answer: 2
    explain:
      ar_eg: "setengah بتتحسب للساعة الجاية: «نص تمانية» = سبعة ونص. وjam wolu kurang seprapat = تمانية إلا ربع (7:45)."
      ar: يُضاف setengah إلى الساعة التالية، أما jam wolu kurang seprapat فهي 7:45.
      en: setengah counts toward the next hour; jam wolu kurang seprapat is 7:45.
    words: [setengah, wolu]
  - id: e03
    type: multiple_choice
    question: "4:15 = ?"
    question_meaning:
      ar_eg: إزاي تقول أربعة وربع؟
      ar: كيف تقول الرابعة والربع؟
      en: How do you say 4:15?
    options: ["jam papat kurang seprapat", "jam papat luwih seprapat", "setengah papat"]
    answer: 1
    words: [luwih, seprapat]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «عايز آكل»؟
      ar: أي جملة تعني «أريد أن آكل»؟
      en: Which sentence means "I want to eat"?
    options: ["Aku wis mangan.", "Aku mau mangan.", "Aku arep mangan."]
    answer: 2
    explain:
      ar_eg: mau الجاوي = «من شوية»، فـ Aku mau mangan = «كلت من شوية». «عايز» = arep.
      ar: mau الجاوية = «قبل قليل»، والإرادة arep.
      en: Javanese mau = "a while ago", so Aku mau mangan = "I ate earlier". "Want" is arep.
    words: [mau, arep]
