schema: kabar.lesson/v1
id: j2.u04.l01
language: jv
title: Jam pira?
can_do:
  ar_eg: تقول الساعة كام بالجاوي.
  ar: أن تخبر بالوقت بالجاوية.
  en: Tell the time.
slides:
  - title: Saiki jam pira?
    body:
      ar_eg: |
        Saiki jam pira? = الساعة كام دلوقتي؟ (saiki = sekarang)
        والرد: jam + الرقم، زي الإندونيسي بالظبط: Jam telu. = الساعة تلاتة. Jam sewelas. = الساعة حداشر.
        خلي بالك إن jam هنا قبل الرقم: jam telu = الساعة تلاتة، بس telung jam = تلات ساعات (مدة).
      ar: |
        Saiki jam pira? = كم الساعة الآن؟ (saiki = sekarang)
        والجواب: jam + العدد كالإندونيسية تمامًا: Jam telu. = الساعة الثالثة. Jam sewelas. = الساعة الحادية عشرة.
        وتنبه إلى أن jam قبل العدد للوقت: jam telu = الساعة الثالثة، أما telung jam = ثلاث ساعات (مدة).
      en: |
        Saiki jam pira? = What time is it now? (saiki = sekarang)
        Answer with jam + number, exactly like Indonesian: Jam telu. = Three o'clock. Jam sewelas. = Eleven o'clock.
        Note jam comes first for clock time: jam telu = three o'clock, but telung jam = three hours (duration).
    grammar: jv.time.expressions
    examples:
      - text: Saiki jam pira? — Jam telu.
        ar_eg: الساعة كام دلوقتي؟ — تلاتة.
        ar: كم الساعة الآن؟ — الثالثة.
        en: What time is it now? — Three o'clock.
  - title: Setengah, luwih, kurang
    body:
      ar_eg: |
        - النص زي الإندونيسي: setengah + الساعة الجاية: setengah wolu = سبعة ونص («نص تمانية»).
        - وربع = luwih seprapat: jam papat luwih seprapat = أربعة وربع. (luwih = lebih / lewat)
        - إلا ربع = kurang seprapat: jam lima kurang seprapat = خمسة إلا ربع.
        - بالدقايق: jam pitu luwih sepuluh menit = سبعة وعشرة.
      ar: |
        - النصف كالإندونيسية: setengah + الساعة التالية: setengah wolu = السابعة والنصف.
        - والربع = luwih seprapat: jam papat luwih seprapat = الرابعة والربع (luwih = lebih / lewat).
        - إلا ربعًا = kurang seprapat: jam lima kurang seprapat = الخامسة إلا ربعًا.
        - وبالدقائق: jam pitu luwih sepuluh menit = السابعة وعشر دقائق.
      en: |
        - Half works like Indonesian: setengah + the NEXT hour: setengah wolu = 7:30 ("half eight").
        - Quarter past = luwih seprapat: jam papat luwih seprapat = 4:15. (luwih = lebih / lewat)
        - Quarter to = kurang seprapat: jam lima kurang seprapat = 4:45.
        - Minutes: jam pitu luwih sepuluh menit = 7:10.
    grammar: jv.time.expressions
    examples:
      - text: Jam setengah wolu.
        ar_eg: سبعة ونص.
        ar: السابعة والنصف.
        en: Half past seven.
      - text: Ketemu jam papat luwih seprapat, ya.
        ar_eg: نتقابل الساعة أربعة وربع، ماشي؟
        ar: نلتقي في الرابعة والربع، اتفقنا؟
        en: Let's meet at a quarter past four, OK?
  - title: Esuk, awan, sore, bengi
    body:
      ar_eg: |
        أوقات اليوم:
        - esuk = pagi (الصبح)
        - awan = siang (الضهر)
        - sore = sore (العصر)
        - bengi = malam (بالليل)
        بتتحط بعد الساعة: jam wolu bengi = تمانية بالليل، jam pitu esuk = سبعة الصبح.
      ar: |
        أوقات اليوم:
        - esuk = pagi (الصباح)
        - awan = siang (الظهيرة)
        - sore = sore (العصر)
        - bengi = malam (الليل)
        وتأتي بعد الساعة: jam wolu bengi = الثامنة ليلًا، jam pitu esuk = السابعة صباحًا.
      en: |
        Parts of the day:
        - esuk = pagi (morning)
        - awan = siang (midday)
        - sore = sore (afternoon)
        - bengi = malam (night)
        They follow the hour: jam wolu bengi = 8 p.m., jam pitu esuk = 7 a.m.
    grammar: jv.time.expressions
    examples:
      - text: Reoge jam wolu bengi.
        ar_eg: الريوج الساعة تمانية بالليل.
        ar: عرض الريوغ في الثامنة ليلًا.
        en: The Reog show is at 8 p.m.
  - title: Wingi, saiki, sesuk — lan «mau»!
    body:
      ar_eg: |
        - wingi = kemarin (امبارح) · saiki = sekarang (دلوقتي) · sesuk = besok (بكرة) · mengko = nanti (بعدين)
        - mau = tadi (من شوية)! مش «عايز» زي الإندونيسي. mau esuk = الصبح اللي فات.
        «Aku mau mangan» = «أنا كلت من شوية». لو عايز تقول «عايز آكل»: Aku arep mangan.
        الإملا: sesuk في الكتب، وفي الشات والكلام كتير sesok.
      ar: |
        - wingi = kemarin (أمس) · saiki = sekarang (الآن) · sesuk = besok (غدًا) · mengko = nanti (لاحقًا)
        - mau = tadi (قبل قليل)، لا «يريد» كما في الإندونيسية! mau esuk = صباح اليوم الذي مضى.
        فـ«Aku mau mangan» = «أكلتُ قبل قليل»، أما «أريد أن آكل» فـ Aku arep mangan.
        والإملاء: sesuk في الكتب، ويكثر في الدردشة والكلام sesok.
      en: |
        - wingi = kemarin (yesterday) · saiki = sekarang (now) · sesuk = besok (tomorrow) · mengko = nanti (later)
        - mau = tadi (earlier, just now)! Not "want" as in Indonesian. mau esuk = earlier this morning.
        "Aku mau mangan" = "I ate a while ago". For "I want to eat" say Aku arep mangan.
        Spelling: sesuk in books; chats and speech often have sesok.
    grammar: jv.time.expressions
    examples:
      - text: Mau esuk aku wis mangan.
        ar_eg: أنا كلت الصبح خلاص.
        ar: أكلتُ صباح اليوم.
        en: I already ate this morning.
      - text: Sesuk aku arep neng Ponorogo.
        ar_eg: بكرة رايح بونوروجو.
        ar: غدًا سأذهب إلى بونوروغو.
        en: Tomorrow I'm going to Ponorogo.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wingi
        ar_eg: امبارح
        ar: أمس
        en: yesterday
      - text: sesuk
        ar_eg: بكرة
        ar: غدًا
        en: tomorrow
      - text: mengko
        ar_eg: بعدين
        ar: لاحقًا
        en: later
      - text: mau
        ar_eg: من شوية
        ar: منذ قليل
        en: a while ago
      - text: sore
        ar_eg: العصر
        ar: العصر
        en: afternoon
      - text: seprapat
        ar_eg: ربع
        ar: ربع
        en: a quarter
    words: [wingi, sesuk, mengko, mau, sore, seprapat]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «عايز آكل»؟
      ar: أي جملة تعني «أريد أن آكل»؟
      en: Which sentence means "I want to eat"?
    options: [Aku wis mangan., Aku mau mangan., Aku arep mangan., Aku wingi mangan.]
    answer: 2
    explain:
      ar_eg: mau الجاوي = «من شوية»، فـ Aku mau mangan = «كلت من شوية». «عايز» = arep.
      ar: mau الجاوية = «قبل قليل»، والإرادة arep.
      en: Javanese mau = "a while ago", so Aku mau mangan = "I ate earlier". "Want" is arep.
    words: [mau, arep, wingi]
  - id: e03
    type: listen
    text: Saiki jam setengah wolu.
    options: [Saiki jam setengah pitu., Saiki jam setengah wolu., Saiki jam wolu luwih seprapat.]
    answer: 1
    words: [saiki, setengah, luwih, seprapat]
  - id: e04
    type: fill_blank
    sentence: Reoge sesuk jam papat luwih seprapat ___.
    meaning:
      ar_eg: الريوج بكرة الساعة أربعة وربع العصر.
      ar: عرض الريوغ غدًا الساعة الرابعة والربع عصرًا.
      en: The reog show is tomorrow at a quarter past four in the afternoon.
    options: [esuk, sore, bengi]
    answers: [sore]
    words: [sesuk, luwih, seprapat, sore]
    explain:
      ar_eg: الساعة أربعة وربع بعد الضهر = sore (العصر). esuk = الصبح، وbengi = بالليل.
      ar: الرابعة والربع بعد الظهر = sore (العصر)؛ أما esuk فالصباح، وbengi الليل.
      en: 4:15 in the afternoon is sore. esuk = morning, bengi = night.
  - id: e05
    type: build_sentence
    source:
      ar_eg: الساعة كام دلوقتي؟
      ar: كم الساعة الآن؟
      en: What time is it now?
    answer: Saiki jam pira?
    distractors: [sapa, wingi]
    words: [saiki, jam, pira]
    explain:
      ar_eg: jam pira = الساعة كام. sapa = مين، وwingi = امبارح، ومش في المعنى.
      ar: jam pira = كم الساعة؛ أما sapa فمن، وwingi أمس، وليسا في المعنى.
      en: jam pira = what time. sapa (who) and wingi (yesterday) aren't in the meaning.
  - id: e06
    type: speaking
    text: Mengko sore jam papat luwih seprapat.
    meaning:
      ar_eg: النهارده العصر الساعة أربعة وربع.
      ar: لاحقًا عصرًا الساعة الرابعة والربع.
      en: Later this afternoon at a quarter past four.
    words: [mengko, sore, luwih, seprapat]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «امبارح»؟
      ar: أيّ كلمة تعني «أمس»؟
      en: Which word means "yesterday"?
    options: [wingi, sesuk, mengko, mau]
    answer: 0
    explain:
      ar_eg: wingi = امبارح، sesuk = بكرة، mengko = بعدين، mau = من شوية.
      ar: wingi = أمس، وsesuk = غدًا، وmengko = لاحقًا، وmau = منذ قليل.
      en: wingi = yesterday, sesuk = tomorrow, mengko = later, mau = a while ago.
    words: [wingi, sesuk, mengko, mau]
dialogue:
  title: Ngenteni Reog
  lines:
    - speaker: Mohamed
      text: Sari, saiki jam pira?
      ar_eg: ساري، الساعة كام دلوقتي؟
      ar: يا ساري، كم الساعة الآن؟
      en: Sari, what time is it now?
    - speaker: Sari
      text: Jam setengah wolu.
      ar_eg: سبعة ونص.
      ar: السابعة والنصف.
      en: Half past seven.
    - speaker: Mohamed
      text: Reoge jam pira?
      ar_eg: الريوج الساعة كام؟
      ar: في أي ساعة عرض الريوغ؟
      en: What time is the Reog?
    - speaker: Sari
      text: Jam wolu bengi. Mau awan kowe durung mangan, to?
      ar_eg: تمانية بالليل. إنت الضهر مكلتش، صح؟
      ar: في الثامنة ليلًا. لم تأكل ظهرًا، أليس كذلك؟
      en: Eight p.m. You didn't eat at midday, right?
    - speaker: Mohamed
      text: Durung. Ayo mangan sik!
      ar_eg: لسه. يلا ناكل الأول!
      ar: لم آكل بعد. هيا نأكل أولًا!
      en: Not yet. Let's eat first!
new_words:
  - word: jam
    pos: noun
    ar_eg: ساعة
    ar: ساعة
    en: hour, o'clock (jam)
  - word: seprapat
    pos: number
    ar_eg: ربع
    ar: ربع
    en: a quarter (seperempat)
  - word: sore
    pos: noun
    ar_eg: العصر
    ar: العصر
    en: afternoon (sore)
