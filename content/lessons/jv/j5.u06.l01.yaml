dialogue:
  title: Ing Masjid Agung Demak
  lines:
    - speaker: Pak Ahmad
      text: Mas, sampeyan ngerti tembang Lir-ilir?
      ar_eg: يا ابني، إنت عارف أغنية Lir-ilir؟
      ar: يا بني، أتعرف أغنية Lir-ilir؟
      en: Young man, do you know the song Lir-ilir?
    - speaker: Mohamed
      text: Inggih, Pak. Lir-ilir, lir-ilir, tandure wus sumilir.
      ar_eg: أيوه يا عمّو. Lir-ilir, lir-ilir, tandure wus sumilir.
      ar: نعم يا سيدي. Lir-ilir, lir-ilir, tandure wus sumilir.
      en: Yes, sir. Lir-ilir, lir-ilir, tandure wus sumilir.
    - speaker: Pak Ahmad
      text: Wah, pinter lho! Miturut crita, tembang iki kaanggit dening Sunan Kalijaga.
      ar_eg: يا سلام، شاطر! بيقولوا إن الأغنية دي ألّفها سونان كاليجاغا.
      ar: أحسنت! تقول الرواية إن هذه الأغنية من تأليف سونان كاليجاغا.
      en: Well done! According to tradition, this song was composed by Sunan Kalijaga.
    - speaker: Mohamed
      text: Wus menika wis, nggih, Pak?
      ar_eg: wus يعني wis، صح يا عمّو؟
      ar: wus هي wis، أليس كذلك يا سيدي؟
      en: Wus is wis, isn't it, sir?
