        en: already (= wis, old form)
      - text: tandur
        ar_eg: الزرع الصغير
        ar: الزرع الصغير
        en: young plants, crops
      - text: cah angon
        ar_eg: الولد الراعي
        ar: الفتى الراعي
        en: shepherd boy
      - text: blimbing
        ar_eg: فاكهة النجمة (starfruit)
        ar: فاكهة النجمة (starfruit)
        en: starfruit
      - text: ijo
        ar_eg: أخضر
        ar: أخضر
        en: green
    words: [tembang, wus, tandur, cah angon, blimbing, ijo]
  - id: e02
    type: multiple_choice
    question: wus
    question_meaning:
      ar_eg: wus القديمة تساوي أنهي كلمة النهارده؟
      ar: wus القديمة تساوي أي كلمة اليوم؟
      en: Old wus equals which word today?
    options: [wis, iki, wong]
    answer: 0
    words: [wus]
    explain:
      ar_eg: wus كلمة قديمة بمعنى wis = خلاص / قد. iki = ده وwong = إنسان.
      ar: wus كلمة قديمة بمعنى wis أي قد. أما iki فهذا وwong إنسان.
      en: Old wus is today's wis, "already". iki is "this" and wong is "person".
  - id: e03
    type: multiple_choice
    question: Tembang Lir-ilir
    question_meaning:
      ar_eg: الأغنية دي بتتنسب لمين؟
      ar: إلى من تُنسب هذه الأغنية؟
      en: Who is this song attributed to?
    options: [Sunan Kudus, Sunan Kalijaga, Pak Harjo]
    answer: 1
    words: [tembang]
    explain:
      ar_eg: المشهور إن Lir-ilir من تأليف سونان كاليجاغا، واحد من الأولياء التسعة.
      ar: يُنسب Lir-ilir تقليديًا إلى سونان كاليجاغا، أحد الأولياء التسعة.
      en: Lir-ilir is traditionally attributed to Sunan Kalijaga, one of the nine saints.
  - id: e04
    type: listen
    text: Lir-ilir, lir-ilir, tandure wus sumilir.
    options: ['Lir-ilir, lir-ilir, tandure wus garing.', 'Lir-ilir, lir-ilir, tandure wis mateng.', 'Lir-ilir, lir-ilir, tandure wus sumilir.']
    answer: 2
    meaning:
      ar_eg: اصحى، اصحى، الزرع ابتدا يتمايل.
      ar: انهض، انهض، فقد أخذ الزرع يتمايل.
      en: Wake up, wake up, the young plants are already stirring.
    words: [wus, tandur]
  - id: e05
    type: fill_blank
    sentence: Lir-ilir, lir-ilir, tandure ___ sumilir.
    meaning:
      ar_eg: اصحى، اصحى، الزرع ابتدا يتمايل.
      ar: انهض، انهض، فقد أخذ الزرع يتمايل.
      en: Wake up, wake up, the young plants are already stirring.
    options: [kang, wus, nuli]
    answers: [wus]
    words: [wus, tandur]
    explain:
      ar_eg: wus sumilir = خلاص بيتهزّ. kang = اللي وnuli = بعدين، ومش من كلام الأغنية.
      ar: wus sumilir تعني صار يتمايل. أما kang (الذي) وnuli (ثم) فليستا من كلمات الأغنية.
      en: wus sumilir is "already stirring". kang ("which") and nuli ("then") aren't in the lyric.
  - id: e06
    type: fill_blank
    sentence: Cah angon, cah angon, penekna ___ kuwi.
    meaning:
      ar_eg: يا راعي، يا راعي، اطلع شجرة الـ blimbing دي.
      ar: أيها الراعي، أيها الراعي، تسلّق شجرة الـ blimbing تلك.
      en: Shepherd boy, shepherd boy, climb that starfruit tree.
    options: [menara, tembang, blimbing]
    answers: [blimbing]
    words: [blimbing, cah angon]
    explain:
      ar_eg: penekna blimbing = اطلع شجرة الـ blimbing. menara = منارة وtembang = أغنية، ومش بيتطلعوا في الأغنية.
      ar: penekna blimbing تعني تسلّق شجرة الـ blimbing. أما menara (منارة) وtembang (أغنية) فليستا في البيت.
      en: penekna blimbing is "climb the starfruit tree". menara (minaret) and tembang (song) aren't in the line.
  - id: e07
    type: build_sentence
    source:
      ar_eg: أخضر أخضر خالص، تقول عليه عريس جديد.
      ar: شديد الخضرة، تحسبه عروسًا جديدًا.
      en: So lush and green, you'd take it for a newlywed.
    answer: Tak ijo royo-royo, tak sengguh temanten anyar.
    distractors: [wus, kang]
    words: [ijo]
    explain:
      ar_eg: "البيت زي ما هو: tak ijo royo-royo … temanten anyar. wus وkang مش فيه."
      ar: "البيت كما هو: tak ijo royo-royo … temanten anyar، وليس فيه wus ولا kang."
      en: "The line as sung: tak ijo royo-royo … temanten anyar. wus and kang aren't in it."
