schema: kabar.lesson/v1
id: j5.u06.l01
language: jv
title: Lir-ilir
can_do:
  ar_eg: تقرا أول أغنية قديمة مشهورة.
  ar: أن تقرأ مطلع أغنية قديمة مشهورة.
  en: Read the opening of a classic song.
slides:
  - title: Tembang saka jaman Wali
    body:
      ar_eg: |
        أهلًا بيك في دماك، أول سلطنة إسلامية في جاوة. tembang = أغنية / شعر بيتغنّى. والأولياء التسعة (Wali Sanga) استخدموا الـ tembang عشان يعلّموا الإسلام.
        «Lir-ilir» بيتنسب لسونان كاليجاغا، ولسه بيتغنّى لحد النهارده. لغته قديمة شوية: wus = wis (خلاص)، tandur = الزرع الصغير، tandure = الزرع بتاعه.
        «tak ijo royo-royo» = أخضر أخضر خالص، و«tak sengguh temanten anyar» = تقول عليه عريس جديد.
      ar: |
        مرحبًا بك في دماك، أول سلطنة إسلامية في جاوة. tembang = قصيدة مغنّاة، وقد علّم بها الأولياء التسعة (Wali Sanga) الإسلام.
        وتُنسب «Lir-ilir» إلى سونان كاليجاغا، وما تزال تُغنّى إلى اليوم. ولغتها قديمة بعض الشيء: wus = wis (قد)، وtandur = الزرع الصغير، وtandure = زرعه.
        و«tak ijo royo-royo» = شديد الخضرة، و«tak sengguh temanten anyar» = تحسبه عروسًا جديدًا.
      en: |
        Welcome to Demak, Java's first Islamic sultanate. tembang = sung verse, a song. The nine saints (Wali Sanga) used tembang to teach Islam.
        "Lir-ilir" is attributed to Sunan Kalijaga and is still sung today. Its language is a little old: wus = wis (already), tandur = young plants, tandure = the plants.
        "tak ijo royo-royo" = so lush and green, and "tak sengguh temanten anyar" = you'd take them for newlyweds.
    grammar: jv.reading.written-style
    examples:
      - text: Lir-ilir, lir-ilir, tandure wus sumilir.
        ar_eg: اصحى، اصحى، الزرع ابتدا يتمايل.
        ar: انهض، انهض، فقد أخذ الزرع يتمايل.
        en: Wake up, wake up, the young plants are already stirring.
      - text: Tak ijo royo-royo, tak sengguh temanten anyar.
        ar_eg: أخضر أخضر خالص، تقول عليه عريس جديد.
        ar: شديد الخضرة، تحسبه عروسًا جديدًا.
        en: So lush and green, you'd take it for a newlywed.
  - title: Cah angon
    body:
      ar_eg: |
        cah angon = الولد الراعي. الأغنية بتقوله: اطلع شجرة الـ blimbing دي (فاكهة النجمة، starfruit).
        تفسير مشهور: الـ blimbing ليها خمس جوانب، زي الصلوات الخمسة، والراعي هو كل واحد فينا. ده تفسير متداول، مش حاجة مكتوبة في الأغنية نفسها.
      ar: |
        cah angon = الفتى الراعي، والأغنية تقول له: تسلّق شجرة الـ blimbing تلك (فاكهة النجمة، starfruit).
        وفي تفسير شائع: للـ blimbing خمسة أضلاع كالصلوات الخمس، والراعي هو كل واحد منا. وهو تفسير متداول، لا نصّ في الأغنية نفسها.
      en: |
        cah angon = shepherd boy. The song tells him: climb that blimbing tree (starfruit).
        A popular reading: the starfruit has five ridges, like the five daily prayers, and the shepherd is each of us. It's a common interpretation, not something the song spells out.
    grammar: jv.reading.written-style
    examples:
      - text: Cah angon, cah angon, penekna blimbing kuwi.
        ar_eg: يا راعي، يا راعي، اطلع شجرة الـ blimbing دي.
        ar: أيها الراعي، أيها الراعي، تسلّق شجرة الـ blimbing تلك.
        en: Shepherd boy, shepherd boy, climb that starfruit tree.
