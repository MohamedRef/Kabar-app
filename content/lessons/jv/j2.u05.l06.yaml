    text: Klasane tak pepe, jogane tak sapu.
    meaning:
      ar_eg: هنشر الحصيرة في الشمس، وهكنس الأرضية.
      ar: سأنشر الحصيرة وأكنس الأرضية.
      en: I'll put the mat out in the sun and sweep the floor.
    words: [klasa, mepe, jogan]
dialogue:
  lines:
    - speaker: Bu Rahayu
      text: Minggu esuk resik-resik omah, ya! Aja turon wae.
      ar_eg: الحد الصبح هننضف البيت! محدش يفضل ممدد.
      ar: صباح الأحد ننظّف البيت! لا تبقوا مستلقين.
      en: Sunday morning we clean the house! No lying around.
    - speaker: Sari
      text: Nggih, Bu. Aku nyapu jogan, Mohamed mepe klasa.
      ar_eg: حاضر يا ماما. أنا هكنس الأرضية، ومحمد ينشر الحصيرة.
      ar: حاضر يا أمي. أكنس الأرضية، ومحمد ينشر الحصيرة.
      en: Yes, Mum. I'll sweep the floor, Mohamed puts the mat out.
    - speaker: Mohamed
      text: Siap! Klambiku sisan tak pepe.
      ar_eg: ماشي! وهنشر هدومي كمان.
      ar: حسنًا! وسأنشر ثيابي أيضًا.
      en: On it! I'll hang my clothes out too.
    - speaker: Bu Rahayu
      text: Bayu, wis gosok untu durung? Wisuh sik, banjur sarapan.
      ar_eg: يا بايو، غسلت سنانك ولا لسه؟ اغسل إيدك وبعدين افطر.
      ar: يا بايو، هل نظّفت أسنانك؟ اغسل يديك ثم افطر.
      en: Bayu, have you brushed your teeth? Wash your hands, then breakfast.
    - speaker: Bayu
      text: Sik, Bu… aku isih ngantuk.
      ar_eg: استني يا ماما… لسه نعسان.
      ar: لحظة يا أمي… ما زلت نعسان.
      en: Wait, Mum… I'm still sleepy.
