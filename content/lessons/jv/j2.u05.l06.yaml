    options: [untu, suket, jogan]
    answer: 0
    explain:
      ar_eg: untu = gigi (سنان). suket = حشيش، وjogan = أرضية.
      ar: untu = gigi (أسنان)، أما suket فعشب وjogan أرضية.
      en: untu = gigi (teeth). suket = grass, jogan = floor.
