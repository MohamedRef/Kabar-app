schema: kabar.lesson/v1
id: j2.u05.l06
language: jv
title: Resik-resik omah
can_do:
  ar_eg: 'تشارك في تنضيف البيت يوم الحد: الأرضية والحصيرة، تنشر الهدوم وتكويها، وتغسل إيدك وسنانك.'
  ar: 'أن تشارك في تنظيف البيت يوم الأحد: الأرضية والحصيرة، ونشر الثياب وكيّها، وغسل اليدين والأسنان.'
  en: 'Join the Sunday house clean: floor and mat, hang out and iron the washing, wash hands and brush teeth.'
slides:
  - title: Minggu esuk
    body:
      ar_eg: |
        - **jogan** = الأرضية جوه البيت (lantai) · **klasa** = حصيرة (tikar) · **suket** = حشيش، عشب (rumput)
        - **mepe** = ينشر في الشمس (menjemur): mepe klambi · **nyetrika** = يكوي (menyetrika)
        - **wisuh** = يغسل إيديه أو رجليه (cuci tangan) · **untu** = سنان (gigi): gosok untu = يغسل سنانه
        - **turon** = يتمدد ويرتاح (rebahan): Aja turon wae! = ماتفضلش ممدد كده!
      ar: |
        - **jogan** = أرضية البيت (lantai) · **klasa** = حصيرة (tikar) · **suket** = عشب (rumput)
        - **mepe** = ينشر في الشمس (menjemur): mepe klambi · **nyetrika** = يكوي (menyetrika)
        - **wisuh** = يغسل يديه أو قدميه (cuci tangan) · **untu** = أسنان (gigi): gosok untu = ينظّف أسنانه
        - **turon** = يستلقي ويتكاسل (rebahan): Aja turon wae! = لا تبقَ مستلقيًا!
      en: |
        - **jogan** = floor inside the house (lantai) · **klasa** = mat (tikar) · **suket** = grass (rumput)
        - **mepe** = dry in the sun (menjemur): mepe klambi · **nyetrika** = iron (menyetrika)
        - **wisuh** = wash your hands or feet (cuci tangan) · **untu** = teeth (gigi): gosok untu = brush your teeth
        - **turon** = lie around (rebahan): Aja turon wae! = Don't just lie there!
    examples:
      - text: Wisuh sik, banjur mangan!
        ar_eg: اغسل إيدك الأول، وبعدين كُل!
        ar: اغسل يديك أولًا، ثم كُل!
        en: Wash your hands first, then eat!
      - text: Srengengene panas, ayo mepe klambi.
        ar_eg: الشمس سخنة، يلا ننشر الهدوم.
        ar: الشمس حارّة، هيّا ننشر الثياب.
        en: The sun's hot, let's hang the washing out.
      - text: Jogane reged, akeh suket.
        ar_eg: الأرضية وسخة، فيها حشيش كتير.
        ar: الأرضية متسخة، فيها عشب كثير.
        en: The floor's dirty, lots of grass on it.
