schema: kabar.lesson/v1
id: j3.u05.l02
language: jv
title: Sedasa, kalih dasa
can_do:
  ar_eg: تقول العشرات وخمسة وعشرين بالكراما.
  ar: أن تقول العشرات والخمسة والعشرين بالكراما.
  en: Say tens and twenty-five in krama.
slides:
  - title: Kalih dasa, selangkung, seket
    body:
      ar_eg: |
        العشرات بالكراما بـ dasa (= puluh):
        - 20 kalih dasa (rong puluh)، 30 tigang dasa (telung puluh)، 40 sekawan dasa (patang puluh)
        - 25 **selangkung** = نسخة كراما من selawé
        - 50 seket و60 sewidak زي ما هم.
        لاحظ: قبل dasa بتبقى tiga → **tigang**، زي telu → telung في النغوكو، وزي «تلاتة» ← «تلات» في «تلات تيام» بالمصري.
      ar: |
        العشرات في الكراما بـ dasa (= puluh):
        - 20 kalih dasa (rong puluh)، و30 tigang dasa (telung puluh)، و40 sekawan dasa (patang puluh)
        - 25 **selangkung** = صورة الكراما من selawé
        - و50 seket و60 sewidak كما هما.
        ولاحظ أن tiga تصير قبل dasa **tigang**، كما تصير telu في النغوكو telung.
      en: |
        Krama tens use dasa (= puluh):
        - 20 kalih dasa (rong puluh), 30 tigang dasa (telung puluh), 40 sekawan dasa (patang puluh)
        - 25 **selangkung** = krama for selawé
        - 50 seket and 60 sewidak stay as they are.
        Note: before dasa, tiga becomes **tigang** — like telu → telung in ngoko.
    grammar: jv.krama.numbers
    examples:
      - text: tigang dasa
        ar_eg: تلاتين (telung puluh)
        ar: ثلاثون (telung puluh)
        en: thirty (telung puluh)
      - text: selangkung
        ar_eg: خمسة وعشرين (selawé)
        ar: خمسة وعشرون (selawé)
        en: twenty-five (selawé)
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: setunggal
        ar_eg: ١ (siji / satu)
        ar: ١ (siji / satu)
        en: 1 (siji / satu)
      - text: kalih
        ar_eg: ٢ (loro / dua)
        ar: ٢ (loro / dua)
        en: 2 (loro / dua)
      - text: sekawan
        ar_eg: ٤ (papat / empat)
        ar: ٤ (papat / empat)
        en: 4 (papat / empat)
      - text: gangsal
        ar_eg: ٥ (lima)
        ar: ٥ (lima)
        en: 5 (lima)
      - text: sedasa
        ar_eg: ١٠ (sepuluh)
        ar: ١٠ (sepuluh)
        en: 10 (sepuluh)
    words: [setunggal, kalih, sekawan, gangsal, sedasa]
  - id: e02
    type: listen
    text: tigang dasa
    options: [sekawan dasa, tigang dasa, kalih dasa]
    answer: 1
    explain:
      ar_eg: tigang dasa = ٣٠. kalih dasa = ٢٠، sekawan dasa = ٤٠.
      ar: tigang dasa = ٣٠، وkalih dasa = ٢٠، وsekawan dasa = ٤٠.
      en: tigang dasa = 30; kalih dasa = 20, sekawan dasa = 40.
    words: [tiga, dasa]
  - id: e03
    type: fill_blank
    sentence: ___ dasa (٣٠)
    meaning:
      ar_eg: تلاتين
      ar: ثلاثون
      en: thirty
    options: [Tigang, Tiga, Telung]
    answers: [Tigang]
    explain:
      ar_eg: قبل dasa، tiga بتبقى tigang (زي telu → telung). telung puluh نغوكو.
      ar: تصير tiga قبل dasa tigang (كما telu → telung)، وtelung puluh نغوكو.
      en: Before dasa, tiga becomes tigang (like telu → telung). telung puluh is ngoko.
    words: [tiga, dasa]
  - id: e04
    type: fill_blank
    sentence: Badhé tumbas pinten, Mas? — ___ kemawon, Bu. (١)
    meaning:
      ar_eg: عايز كام يا أستاذ؟ — واحدة بس يا حاجة.
      ar: كم تريد؟ — واحدة فقط يا سيدتي.
      en: How many would you like? — Just one, ma'am.
    answers: [Setunggal, setunggal]
    explain:
      ar_eg: setunggal = siji (١) بالكراما، وkemawon = بس.
      ar: setunggal = siji (١) بالكراما، وkemawon = فقط.
      en: setunggal is krama siji (1); kemawon = just.
    words: [setunggal, kemawon]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بالكراما) خمسة وعشرين
      ar: (بالكراما) خمسة وعشرون
      en: (in krama) twenty-five
    answers: [selangkung, Selangkung]
    explain:
      ar_eg: selangkung = selawé بالكراما.
      ar: selangkung = selawé بالكراما.
      en: selangkung is krama for selawé.
    words: [selangkung]
  - id: e06
    type: speaking
    text: setunggal, kalih, tiga, sekawan, gangsal
    meaning:
      ar_eg: ١، ٢، ٣، ٤، ٥ (بالكراما)
      ar: ١، ٢، ٣، ٤، ٥ (بالكراما)
      en: 1, 2, 3, 4, 5 (krama)
    words: [setunggal, kalih, tiga, sekawan, gangsal]
dialogue:
  lines:
    - speaker: Mohamed
      text: Bu, setunggal pinten?
      ar_eg: يا مدام، الواحدة بكام؟
      ar: يا سيدتي، بكم الواحدة؟
      en: Ma'am, how much is one?
    - speaker: Bu Siti
      text: Selangkung ewu, Mas.
      ar_eg: بخمسة وعشرين ألف.
      ar: بخمسة وعشرين ألفًا.
      en: Twenty-five thousand, Mas.
    - speaker: Mohamed
      text: Kula tumbas sedasa, nggih.
      ar_eg: هاشتري عشرة.
      ar: سأشتري عشرة.
      en: I'll buy ten, then.
    - speaker: Bu Siti
      text: Sedasa? Inggih, matur nuwun, Mas!
      ar_eg: عشرة؟ ماشي، متشكرة!
      ar: عشرة؟ حسنًا، شكرًا!
      en: Ten? All right, thank you, Mas!
