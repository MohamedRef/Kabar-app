schema: kabar.lesson/v1
id: j1.u01.l08
language: jv
title: Isih luwe? Ayo mangan!
can_do:
  ar_eg: تقول «لسه جعان، يلا ناكل»، وتقول «عندي» و«صح» و«بس»، وإنك لسه مكسوف تتكلم.
  ar: أن تقول «ما زلت جائعًا، هيا نأكل»، وتقول «عندي» و«صحيح» و«لكن»، وأنك ما زلت تخجل من الكلام.
  en: Say "still hungry? let's eat", say "I have", "right" and "but", and that you're still shy to speak.
slides:
  - title: Isih neng angkringan
    body:
      ar_eg: |
        كلمات صغيرة هتسمعها في كل كلام من الأسبوع الجاي:
        - **mangan** = ياكل (makan): Ayo mangan! = يلا ناكل!
        - **isih** = لسه (masih): Aku isih luwe = لسه جعان.
        - **nanging** = بس / لكن (tetapi). في الشارع بتسمع كمان **ning** و**tapi**.
        - **duwe** = عنده (punya): Aku duwe kanca = عندي صاحب.
        - **bener** = صح (benar) · **ngomong** = يتكلم / يقول (bicara, bilang)
        - **kudu** = لازم (harus): Aku kudu mangan = لازم آكل.
      ar: |
        كلمات صغيرة ستسمعها في كل حديث من الأسبوع القادم:
        - **mangan** = يأكل (makan): Ayo mangan! = هيا نأكل!
        - **isih** = ما زال (masih): Aku isih luwe = ما زلت جائعًا.
        - **nanging** = لكن (tetapi)، وفي الشارع تسمع أيضًا **ning** و**tapi**.
        - **duwe** = يملك / عنده (punya): Aku duwe kanca = عندي صديق.
        - **bener** = صحيح (benar) · **ngomong** = يتكلم / يقول (bicara, bilang)
        - **kudu** = يجب (harus): Aku kudu mangan = يجب أن آكل.
      en: |
        Small words you'll hear in every conversation from next week on:
        - **mangan** = eat (makan): Ayo mangan! = Let's eat!
        - **isih** = still (masih): Aku isih luwe = I'm still hungry.
        - **nanging** = but (tetapi); on the street you also hear **ning** and **tapi**.
        - **duwe** = have, own (punya): Aku duwe kanca = I have a friend.
        - **bener** = right, true (benar) · **ngomong** = speak, say (bicara, bilang)
        - **kudu** = must, have to (harus): Aku kudu mangan = I have to eat.
    examples:
      - text: Aku isih luwe. Ayo mangan!
        ar_eg: لسه جعان. يلا ناكل!
        ar: ما زلت جائعًا. هيا نأكل!
        en: I'm still hungry. Let's eat!
      - text: Kowe duwe kanca? Duwe, Mas.
        ar_eg: عندك صحاب؟ عندي يا ماس.
        ar: هل لديك أصدقاء؟ نعم يا أخي.
        en: Do you have friends? I do, Mas.
      - text: Aku sehat, nanging ngantuk.
        ar_eg: أنا كويس، بس نعسان.
        ar: أنا بخير، لكنني نعسان.
        en: I'm fine, but sleepy.
