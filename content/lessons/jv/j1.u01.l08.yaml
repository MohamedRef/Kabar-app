  - id: e10
    type: speaking
    text: Aku luwe, kudu mangan saiki!
    meaning:
      ar_eg: أنا جعان، لازم آكل دلوقتي!
      ar: أنا جائع، يجب أن آكل الآن!
      en: I'm hungry, I have to eat now!
