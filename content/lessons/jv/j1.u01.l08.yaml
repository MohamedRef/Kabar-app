dialogue:
  lines:
    - speaker: Mas Heru
      text: Mohamed, kowe isih luwe?
      ar_eg: يا محمد، إنت لسه جعان؟
      ar: يا محمد، هل ما زلت جائعًا؟
      en: Mohamed, are you still hungry?
    - speaker: Mohamed
      text: Isih, Mas. Kudu mangan saiki!
      ar_eg: لسه يا ماس. لازم ناكل دلوقتي!
      ar: نعم يا أخي. يجب أن نأكل الآن!
      en: Still, Mas. We have to eat now!
    - speaker: Mas Heru
      text: Ayo! Mohamed, saiki kowe duwe kanca?
      ar_eg: يلا! يا محمد، بقى عندك صحاب دلوقتي؟
      ar: هيا! يا محمد، هل صار لديك أصدقاء الآن؟
      en: Let's go! Mohamed, do you have friends now?
    - speaker: Mohamed
      text: 'Duwe, Mas: kowe lan Mas Dimas!'
      ar_eg: 'عندي يا ماس: إنت وماس ديماس!'
      ar: 'نعم يا أخي: أنت وماس ديماس!'
      en: 'I do, Mas: you and Mas Dimas!'
    - speaker: Mas Heru
      text: Bener! Nanging kowe isih isin ngomong, hehe.
      ar_eg: صح! بس إنت لسه مكسوف تتكلم، هههه.
      ar: صحيح! لكنك ما زلت تخجل من الكلام، هه.
      en: True! But you're still shy to speak, hehe.
    - speaker: Mohamed
      text: Nggih, Mas. Sesuk aku ngomong maneh!
      ar_eg: حاضر يا ماس. بكرة هتكلم تاني!
      ar: حسنًا يا أخي. غدًا سأتكلم مرة أخرى!
      en: Yes, Mas. Tomorrow I'll talk again!
