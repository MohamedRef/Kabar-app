  - id: e03
    type: listen
    text: Andhukipun ing lemari, Nak.
    question:
      ar_eg: الفوطة فين؟
      ar: أين المنشفة؟
      en: Where is the towel?
    options: [الفوطة على الأرض, الفوطة في الدولاب, الفوطة على الكرسي]
    answer: 1
    meaning:
      ar_eg: الفوطة في الدولاب يا ابني.
      ar: المنشفة في الخزانة يا بنيّ.
      en: The towel's in the wardrobe, dear.
    words: [andhuk, lemari]
  - id: e04
    type: fill_blank
    sentence: Tas kula ___ oleh-oleh.
    meaning:
      ar_eg: شنطتي ___ هدايا.
      ar: حقيبتي ___ بالهدايا.
      en: My bag is ___ of souvenirs.
    options: [kebak, peteng, kepenak]
    answers: [kebak]
    words: [kebak, peteng, kepenak, oleh-oleh]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بتجيب إيه لأهلك من السفر؟
      ar: ماذا تحضر لأهلك من السفر؟
      en: What do you bring your family from a trip?
    options: [lantai, oleh-oleh, andhuk]
    answer: 1
    explain:
      ar_eg: oleh-oleh = هدايا السفر.
      ar: oleh-oleh = هدايا السفر.
      en: oleh-oleh = gifts from a trip.
    words: [lantai, oleh-oleh, andhuk]
  - id: e06
    type: fill_blank
    sentence: Sampun dalu, ___ sanget.
    meaning:
      ar_eg: الوقت اتأخر، الدنيا ___ أوي.
      ar: تأخّر الليل، والمكان ___ جدًا.
      en: It's late at night; it's very ___.
    options: [peteng, kebak, lantai]
    answers: [peteng]
    words: [peteng, kebak, lantai]
  - id: e07
    type: build_sentence
    source:
      ar_eg: شيل هداياك في الدولاب.
      ar: احفظ هداياك في الخزانة.
      en: Put your souvenirs away in the wardrobe.
    answer: Simpen oleh-olehmu ing lemari.
    distractors: [andhuk, lantai]
    words: [nyimpen, oleh-oleh, lemari]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kursi menika kepenak sanget.
    answers_meaning:
      ar_eg: [الكرسي ده مريح أوي, الكرسي ده مريح جدًا]
      ar: [هذا الكرسي مريح جدًا]
      en: [This chair is very comfortable, This chair is really comfortable]
    words: [kepenak]
  - id: e09
    type: speaking
    text: Kula nyimpen andhuk lan bantal ing lemari.
    meaning:
      ar_eg: أنا بشيل الفوطة والمخدة في الدولاب.
      ar: أضع المنشفة والوسادة في الخزانة.
      en: I'm putting the towel and pillow away in the wardrobe.
    words: [nyimpen, andhuk, bantal, lemari]
  - id: e10
    type: multiple_choice
    question: Kowe ___ dhuwit ing ngendi?
    options: [nyimpen, bantal, kebak]
    answer: 0
    explain:
      ar_eg: nyimpen = يشيل، يحفظ (الفلوس مثلًا).
      ar: nyimpen = يحفظ (المال مثلًا).
      en: nyimpen = keep (money, for example).
    words: [nyimpen, bantal, kebak]
dialogue:
  lines:
    - speaker: Mbah Putri
      text: "Nak, niki kamare. Rada peteng, nggih."
      ar_eg: "يا ابني، دي الأوضة. ضلمة شوية."
      ar: "يا بنيّ، هذه الغرفة. مظلمة قليلًا."
      en: "Here's the room, dear. A bit dark, mind."
    - speaker: Mohamed
      text: Mboten menapa-menapa, Mbah. Kepenak sanget.
      ar_eg: ولا يهمك يا تيتة. مريحة أوي.
      ar: لا بأس يا جدة. إنها مريحة جدًا.
      en: That's fine, Mbah. It's very comfortable.
    - speaker: Mbah Putri
      text: "Andhuke ten lemari, nggih."
      ar_eg: "الفوطة في الدولاب."
      ar: "المنشفة في الخزانة."
      en: "The towel's in the wardrobe, OK?"
    - speaker: Mohamed
      text: Matur nuwun. Kula nyimpen oleh-oleh ing lemari ugi.
      ar_eg: متشكر. وهشيل الهدايا في الدولاب كمان.
      ar: شكرًا. وسأضع الهدايا في الخزانة أيضًا.
      en: Thank you. I'll put the souvenirs in the wardrobe too.
    - speaker: Mbah Putri
      text: Oleh-oleh saking Mesir? Wah, kebak!
      ar_eg: هدايا من مصر؟ ياه، مليانة!
      ar: هدايا من مصر؟ يا لها من كثيرة!
      en: Souvenirs from Egypt? Wow, it's full!
    - speaker: Mohamed
      text: Inggih, Mbah. Menika kangge Mbah lan Mas Dimas.
      ar_eg: أيوه يا تيتة. دي لحضرتك ولديماس.
      ar: نعم يا جدة. هذه لكِ ولديماس.
      en: Yes, Mbah. These are for you and Dimas.
