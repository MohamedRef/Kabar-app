schema: kabar.lesson/v1
id: j3.u02.l04
language: jv
title: Ing kamar tamu
can_do:
  ar_eg: 'تتفرّج على أوضة الضيوف: الفوطة والدولاب، وتقول إنها مريحة، وتشيل هدايا السفر.'
  ar: 'أن تتعرّف إلى غرفة الضيوف: المنشفة والخزانة، وتقول إنها مريحة، وتحفظ هدايا السفر.'
  en: 'Settle into the guest room: towel and wardrobe, say it''s comfortable, and put away your souvenirs.'
slides:
  - title: Kepenak sanget
    body:
      ar_eg: |
        andhuk = فوطة، lemari = دولاب، lantai = أرضية.
        nyimpen (simpen) = يشيل، يحفظ الحاجة في مكانها.
        kepenak = مريح، لذيذ (بالكراما sekeca). bantal = مخدة.
        kebak = مليان. oleh-oleh = الهدايا اللي بتجيبها من السفر، وهي عادة مهمة جدًا في جاوة.
      ar: |
        andhuk = منشفة، lemari = خزانة، lantai = أرضية.
        nyimpen (simpen) = يحفظ الشيء في مكانه.
        kepenak = مريح (بالكراما sekeca). bantal = وسادة.
        kebak = ممتلئ. oleh-oleh = الهدايا التي تُحضَر من السفر، وهي عادة مهمة جدًا في جاوة.
      en: |
        andhuk = towel, lemari = wardrobe, lantai = floor.
        nyimpen (simpen) = keep, put away.
        kepenak = comfortable, pleasant (krama sekeca). bantal = pillow.
        kebak = full. oleh-oleh = gifts you bring back from a trip, a big custom in Java.
    examples:
      - text: Andhukipun ing lemari, Nak.
        ar_eg: الفوطة في الدولاب يا ابني.
        ar: المنشفة في الخزانة يا بنيّ.
        en: The towel's in the wardrobe, dear.
      - text: Lemari kula sampun kebak oleh-oleh!
        ar_eg: دولابي اتملى هدايا!
        ar: امتلأت خزانتي بالهدايا!
        en: My wardrobe's already full of souvenirs!
      - text: Rada peteng, nanging kepenak sanget.
        ar_eg: ضلمة شوية، بس مريحة أوي.
        ar: مظلمة قليلًا لكنها مريحة جدًا.
        en: A bit dark, but very comfortable.
