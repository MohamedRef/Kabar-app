    pos: number
    ar_eg: مليون
    ar: مليون
    en: million (juta)
  - word: sekilo
    pos: phrase
    ar_eg: كيلو واحد
    ar: كيلو واحد
    en: one kilo
  - word: setengah
    pos: number
    ar_eg: نص
    ar: نصف
    en: half (setengah)
  - word: bawang abang
    pos: noun
    ar_eg: بصل أحمر صغير
    ar: بصل أحمر صغير
    en: shallot (bawang merah)
  - word: bawang putih
    pos: noun
    ar_eg: توم
    ar: ثوم
    en: garlic
  - word: susuk
    pos: noun
    ar_eg: الباقي (فلوس)
    ar: باقي النقود
    en: change (kembalian)
  - word: dadi
    pos: verb
    ar_eg: يبقى / يطلع
    ar: يصير / يساوي
    en: to become, come to (jadi)
