schema: kabar.lesson/v1
id: j2.u03.l03
language: jv
title: Ewu lan yuta
can_do:
  ar_eg: تقول أسعار الروبية بالجاوي.
  ar: أن تقول أسعار الروبية بالجاوية.
  en: Say Rupiah prices in Javanese.
slides:
  - title: Satus, sewu, selawé ewu
    body:
      ar_eg: |
        فاكر أشكال الوصل من J1؟ قبل atus (مية) وewu (ألف) الرقم بيتغير شوية:
        - satus (100) · rong atus (200) · telung atus · patang atus · limang atus · nem atus · pitung atus · wolung atus · sangang atus
        - sewu (1.000) · rong ewu · telung ewu · limang ewu …
        وأرقام الدرس اللي فات بتدخل على ewu زي ما هي:
        - limalas ewu = 15.000 · selawé ewu = 25.000 · seket ewu = 50.000 · sewidak ewu = 60.000
        - pitung puluh lima ewu = 75.000
      ar: |
        تذكر صيغ الوصل من J1؟ قبل atus (مئة) وewu (ألف) يتغير العدد قليلًا:
        - satus (100) · rong atus (200) · telung atus · patang atus · limang atus · nem atus · pitung atus · wolung atus · sangang atus
        - sewu (1.000) · rong ewu · telung ewu · limang ewu …
        وتدخل أعداد الدرس السابق على ewu كما هي:
        - limalas ewu = 15.000 · selawé ewu = 25.000 · seket ewu = 50.000 · sewidak ewu = 60.000
        - pitung puluh lima ewu = 75.000
      en: |
        Remember the J1 linking forms? Before atus (hundred) and ewu (thousand) numbers change a little:
        - satus (100) · rong atus (200) · telung atus · patang atus · limang atus · nem atus · pitung atus · wolung atus · sangang atus
        - sewu (1,000) · rong ewu · telung ewu · limang ewu …
        Last lesson's numbers go before ewu unchanged:
        - limalas ewu = 15,000 · selawé ewu = 25,000 · seket ewu = 50,000 · sewidak ewu = 60,000
        - pitung puluh lima ewu = 75,000
    grammar: jv.number.full
    examples:
      - text: Regané selawé ewu.
        ar_eg: سعره خمسة وعشرين ألف.
        ar: ثمنه خمسة وعشرون ألفًا.
        en: It costs 25,000.
      - text: Seket ewu wae, ya?
        ar_eg: خمسين ألف بس، ماشي؟
        ar: خمسون ألفًا فقط، اتفقنا؟
        en: Just 50,000, OK?
  - title: Satus seket ewu, sejuta
    body:
      ar_eg: |
        الأسعار الكبيرة بتتبني زي الإندونيسي، حتة حتة:
        - satus seket ewu = 150.000 · rong atus ewu = 200.000 · limang atus ewu = 500.000
        - المليون: الكلمة الجاوية في الكتب yuta، والناس في الكلام اليومي بتقول juta أكتر: sejuta = 1.000.000، rong yuta / rong juta = 2.000.000.
        - الكسور الصغيرة: sewu limang atus = 1.500، rong ewu limang atus = 2.500.
      ar: |
        تُبنى الأسعار الكبيرة كالإندونيسية جزءًا جزءًا:
        - satus seket ewu = 150.000 · rong atus ewu = 200.000 · limang atus ewu = 500.000
        - المليون: لفظه الجاوي في الكتب yuta، ويقول الناس في الكلام اليومي juta غالبًا: sejuta = 1.000.000، وrong yuta / rong juta = 2.000.000.
        - والكسور الصغيرة: sewu limang atus = 1.500، rong ewu limang atus = 2.500.
      en: |
        Big prices are built piece by piece, as in Indonesian:
        - satus seket ewu = 150,000 · rong atus ewu = 200,000 · limang atus ewu = 500,000
        - Million: the Javanese dictionary word is yuta; everyday speech mostly says juta: sejuta = 1,000,000, rong yuta / rong juta = 2,000,000.
        - Small change: sewu limang atus = 1,500, rong ewu limang atus = 2,500.
    grammar: jv.number.full
    examples:
      - text: Kabèh dadi satus seket ewu.
        ar_eg: الكل مية وخمسين ألف.
        ar: المجموع مئة وخمسون ألفًا.
        en: That's 150,000 altogether.
      - text: HP-né regané rong juta.
        ar_eg: الموبايل سعره مليونين.
        ar: ثمن الهاتف مليونان.
        en: The phone costs two million.
  - title: Sekilo pira?
    body:
      ar_eg: |
        في سوق نغانجوك الحاجة بتتباع بالكيلو:
        - sekilo = كيلو واحد · setengah kilo = نص كيلو · rong kilo = 2 كيلو
        - Sekilo pira? = الكيلو بكام؟
        - bawang abang = bawang merah (بصل أحمر صغير)، bawang putih = توم
        - susuk = kembalian (الباقي)
        - dadi = jadi: Kabèh dadi … = الكل يبقى …
      ar: |
        في سوق نغانجوك تُباع السلع بالكيلو:
        - sekilo = كيلو واحد · setengah kilo = نصف كيلو · rong kilo = كيلوان
        - Sekilo pira? = بكم الكيلو؟
        - bawang abang = bawang merah (البصل الأحمر الصغير)، وbawang putih = الثوم
        - susuk = kembalian (الباقي من النقود)
        - dadi = jadi: Kabèh dadi … = المجموع …
      en: |
        At Nganjuk market things sell by the kilo:
        - sekilo = one kilo · setengah kilo = half a kilo · rong kilo = 2 kilos
        - Sekilo pira? = How much per kilo?
        - bawang abang = bawang merah (shallots), bawang putih = garlic
        - susuk = kembalian (change)
        - dadi = jadi: Kabèh dadi … = That comes to …
    grammar: jv.number.full
    examples:
      - text: Bawang abang sekilo telung puluh ewu.
        ar_eg: البصل الأحمر الكيلو بتلاتين ألف.
        ar: الكيلو من البصل الأحمر بثلاثين ألفًا.
        en: Shallots are 30,000 a kilo.
      - text: Iki susuké, Mas.
        ar_eg: ده الباقي يا أستاذ.
        ar: هذا الباقي يا أخي.
        en: Here's your change, Mas.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: selawé ewu
        ar_eg: ٢٥ ألف
        ar: ٢٥ ألفًا
        en: 25,000
      - text: seket ewu
        ar_eg: ٥٠ ألف
        ar: ٥٠ ألفًا
        en: 50,000
      - text: satus seket ewu
        ar_eg: ١٥٠ ألف
        ar: ١٥٠ ألفًا
        en: 150,000
      - text: rong atus ewu
        ar_eg: ٢٠٠ ألف
        ar: ٢٠٠ ألف
        en: 200,000
      - text: sejuta
        ar_eg: مليون
        ar: مليون
        en: 1,000,000
    words: [selawé, seket, satus, atus, sejuta]
  - id: e02
    type: multiple_choice
    question: 15.000 = ?
    question_meaning:
      ar_eg: إزاي تقول ١٥ ألف؟
      ar: كيف تقول ١٥ ألفًا؟
      en: How do you say 15,000?
    options: [limalas ewu, seket ewu, limang ewu]
    answer: 0
    words: [limalas, ewu]
  - id: e03
    type: listen
    text: Regané seket ewu.
    options: [Regané sewidak ewu., Regané selawé ewu., Regané seket ewu.]
    answer: 2
    words: [rega, seket, ewu]
  - id: e04
    type: fill_blank
    sentence: Bawang abang sekilo ___ ewu.
    meaning:
      ar_eg: البصل الأحمر الكيلو بتلاتين ألف.
      ar: الكيلو من البصل الأحمر بثلاثين ألفًا.
      en: Shallots are 30,000 a kilo.
    answers: [telung puluh]
    words: [telung puluh, sekilo, bawang abang]
  - id: e05
    type: build_sentence
    source:
      ar_eg: سعره مية وخمسين ألف.
      ar: ثمنه مئة وخمسون ألفًا.
      en: It costs 150,000.
    answer: Regané satus seket ewu.
    distractors: [selawé, rong]
    words: [rega, satus, seket, ewu]
  - id: e06
    type: dictation
    text: Seket ewu wae, ya?
    meaning:
      ar_eg: خمسين ألف بس، ماشي؟
      ar: خمسون ألفًا فقط، اتفقنا؟
      en: Just 50,000, OK?
    words: [seket, ewu, wae]
  - id: e07
    type: speaking
    text: Kabèh dadi satus seket ewu.
    meaning:
      ar_eg: الكل مية وخمسين ألف.
      ar: المجموع مئة وخمسون ألفًا.
      en: That's 150,000 altogether.
    words: [dadi, satus, seket, ewu]
dialogue:
  title: Tuku bawang neng Bu Siti
  lines:
    - speaker: Mohamed
      text: Bu, bawang abang sekilo pira?
      ar_eg: يا طنط، البصل الأحمر الكيلو بكام؟
      ar: يا سيدتي، بكم كيلو البصل الأحمر؟
      en: Ma'am, how much is a kilo of shallots?
    - speaker: Bu Siti
      text: Telung puluh ewu, Mas.
      ar_eg: تلاتين ألف يا أستاذ.
      ar: ثلاثون ألفًا يا أخي.
      en: Thirty thousand, Mas.
    - speaker: Mohamed
      text: Aku tuku rong kilo. Karo bawang putih setengah kilo.
      ar_eg: هاخد اتنين كيلو. ونص كيلو توم.
      ar: سآخذ كيلوين، ونصف كيلو من الثوم.
      en: I'll take two kilos. And half a kilo of garlic.
    - speaker: Bu Siti
      text: Bawang putihé limalas ewu. Kabèh dadi pitung puluh lima ewu.
      ar_eg: التوم بخمستاشر ألف. الكل خمسة وسبعين ألف.
      ar: الثوم بخمسة عشر ألفًا، والمجموع خمسة وسبعون ألفًا.
      en: The garlic is fifteen thousand. That's seventy-five thousand altogether.
    - speaker: Mohamed
      text: Iki satus ewu, Bu.
      ar_eg: اتفضلي مية ألف يا طنط.
      ar: تفضلي مئة ألف يا سيدتي.
      en: Here's a hundred thousand, ma'am.
    - speaker: Bu Siti
      text: Iki susuké selawé ewu. Matur nuwun, Mas!
      ar_eg: ده الباقي خمسة وعشرين ألف. شكرًا يا أستاذ!
      ar: هذا الباقي خمسة وعشرون ألفًا. شكرًا يا أخي!
      en: Here's your change, twenty-five thousand. Thank you, Mas!
new_words:
