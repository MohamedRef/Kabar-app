dialogue:
  title: Neng pasar Nganjuk
  lines:
    - speaker: Mohamed
      text: Bu, bawang abang sekilo pira?
      ar_eg: يا طنط، البصل الأحمر الكيلو بكام؟
      ar: يا سيدتي، بكم كيلو البصل الأحمر؟
      en: Ma'am, how much is a kilo of shallots?
    - speaker: Bu Siti
      text: Telung puluh ewu, Mas.
      ar_eg: تلاتين ألف يا أستاذ.
      ar: ثلاثون ألفًا يا أخي.
      en: Thirty thousand, Mas.
    - speaker: Mohamed
      text: Wah, larang. Oleh kurang, Bu?
      ar_eg: ياه، غالي. ينفع تنزلي شوية يا طنط؟
      ar: آه، غالٍ. هل يمكن أن تُنقصي يا سيدتي؟
      en: Oh, that's expensive. Can you go lower, ma'am?
    - speaker: Bu Siti
      text: Mas arep tuku pira kilo?
      ar_eg: عايز تشتري كام كيلو يا أستاذ؟
      ar: كم كيلو تريد أن تشتري يا أخي؟
      en: How many kilos do you want, Mas?
    - speaker: Mohamed
      text: Telung kilo. Selawé ewu wae, ya?
      ar_eg: تلاتة كيلو. خمسة وعشرين ألف بس، ماشي؟
      ar: ثلاثة كيلو. خمسة وعشرون ألفًا فقط، اتفقنا؟
      en: Three kilos. Just twenty-five thousand, OK?
    - speaker: Bu Siti
      text: Ora oleh, Mas. Wolulikur ewu wae.
      ar_eg: مينفعش يا أستاذ. تمانية وعشرين ألف وخلاص.
      ar: لا يمكن يا أخي. ثمانية وعشرون ألفًا فقط.
      en: Can't do that, Mas. Twenty-eight thousand.
    - speaker: Mohamed
      text: Selawé, Bu. Aku tuku telung kilo, lho.
      ar_eg: خمسة وعشرين يا طنط. ده أنا واخد تلاتة كيلو.
      ar: خمسة وعشرون يا سيدتي. سأشتري ثلاثة كيلو، تذكّري.
      en: Twenty-five, ma'am. I'm buying three kilos, you know.
    - speaker: Bu Siti
      text: Ya wis, selawé. Kabèh dadi pitung puluh lima ewu.
      ar_eg: خلاص، خمسة وعشرين. الكل خمسة وسبعين ألف.
      ar: حسنًا، خمسة وعشرون. المجموع خمسة وسبعون ألفًا.
      en: All right, twenty-five. That's seventy-five thousand altogether.
    - speaker: Mohamed
      text: Iki satus ewu, Bu.
      ar_eg: اتفضلي مية ألف يا طنط.
      ar: تفضلي مئة ألف يا سيدتي.
      en: Here's a hundred thousand, ma'am.
    - speaker: Bu Siti
      text: Susuké selawé ewu. Matur nuwun, Mas!
      ar_eg: الباقي خمسة وعشرين ألف. شكرًا يا أستاذ!
      ar: الباقي خمسة وعشرون ألفًا. شكرًا يا أخي!
      en: Your change is twenty-five thousand. Thank you, Mas!
