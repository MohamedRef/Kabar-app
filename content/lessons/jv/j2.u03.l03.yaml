id: j2.u03.l03
language: jv
title: Pasar! Jawa
can_do:
  ar_eg: تفاصل في السعر بالجاوي.
  ar: أن تساوم على السعر بالجاوية.
  en: Haggle in Javanese.
slides:
  - title: Oleh kurang, Bu?
    body:
      ar_eg: |
        جمل الفصال اللي هتحتاجها:
        - Larang! = غالي! · murah = رخيص
        - Oleh kurang, Bu? = ينفع تنزلي شوية يا طنط؟ (oleh = boleh، kurang = أقل)
        - Selawé ewu wae, ya? = خمسة وعشرين ألف بس، ماشي؟
        - Ora oleh. Wis pas. = مينفعش، ده آخر سعر. (wis pas = sudah pas)
        - Ya wis, oleh. = خلاص، ماشي. (ya wis = ya sudah)
        الفصال في السوق الجاوي لعبة لطيفة، مش خناقة: ابتسم، قول Bu أو Pak، وحط ya في الآخر. ومع البياعين الكبار الكراما هتبقى أحلى — هتتعلمها في J3.
      ar: |
        عبارات المساومة التي ستحتاجها:
        - Larang! = غالٍ! · murah = رخيص
        - Oleh kurang, Bu? = هل يمكن أن تُنقصي السعر يا سيدتي؟ (oleh = boleh، kurang = أقل)
        - Selawé ewu wae, ya? = خمسة وعشرون ألفًا فقط، اتفقنا؟
        - Ora oleh. Wis pas. = لا يمكن، هذا آخر سعر. (wis pas = sudah pas)
        - Ya wis, oleh. = حسنًا، موافقة. (ya wis = ya sudah)
        والمساومة في السوق الجاوي لعبة ودودة لا شجار: ابتسم، وقل Bu أو Pak، واختم بـ ya. ومع الباعة الكبار تكون الكراما أجمل، وستتعلمها في J3.
      en: |
        Haggling lines you'll need:
        - Larang! = Expensive! · murah = cheap
        - Oleh kurang, Bu? = Can you go lower, ma'am? (oleh = boleh, kurang = less)
        - Selawé ewu wae, ya? = Just 25,000, OK?
        - Ora oleh. Wis pas. = Can't. That's the final price. (wis pas = sudah pas)
        - Ya wis, oleh. = All right, deal. (ya wis = ya sudah)
        Haggling at a Javanese market is a friendly game, not a fight: smile, say Bu or Pak, end with ya. With older sellers krama is even nicer — that comes in J3.
    grammar: jv.number.full
    examples:
      - text: Wolulikur ewu wae, ya?
        ar_eg: تمانية وعشرين ألف بس، ماشي؟
        ar: ثمانية وعشرون ألفًا فقط، اتفقنا؟
        en: Just 28,000, OK?
      - text: Ya wis, selawé.
        ar_eg: خلاص، خمسة وعشرين.
        ar: حسنًا، خمسة وعشرون.
        en: All right, twenty-five.
