schema: kabar.lesson/v1
id: j2.u01.l09
language: jv
title: Ulangan J2.1
can_do:
  ar_eg: توصف عيلتك بالنغوكو.
  ar: أن تصف عائلتك بالنغوكو.
  en: Describe your family in ngoko.
slides:
  - title: Kulawarga
    body:
      ar_eg: |
        مراجعة كلمات العيلة:
        - bapak، ibu (simbok)، anak، bojo.
        - mas (أخ كبير)، mbakyu (أخت كبيرة)، adhi (أصغر).
        - pakdhe / budhe (أكبر من أبوك أو أمك)، paklik / bulik (أصغر).
        - mbah kakung، mbah putri، putu، ponakan.
        والسن هو اللي بيحدد، مش الجهة.
        - بعد ساكن -e: omahe، jenenge. بعد متحرك -ne: bukune، regane.
        - «بتاع فلان»: omahe Pak Budi (الحاجة الأول).
        - -ku / -mu: masku، adhimu. · duweke sapa? = بتاع مين؟
      ar: |
        مراجعة ألفاظ العائلة:
        - bapak وibu (simbok) وanak وbojo.
        - mas (الأخ الأكبر)، mbakyu (الأخت الكبرى)، adhi (الأصغر).
        - pakdhe / budhe (أكبر من الوالد)، paklik / bulik (أصغر).
        - mbah kakung وmbah putri وputu وponakan.
        والمعيار السن لا الجهة.
        - بعد الساكن -e: omahe، jenenge، وبعد الصائت -ne: bukune، regane.
        - الإضافة: omahe Pak Budi (المملوك أولًا).
        - -ku / -mu: masku، adhimu. · duweke sapa? = لمن؟
      en: |
        Family words recap:
        - bapak, ibu (simbok), anak, bojo.
        - mas (older brother), mbakyu (older sister), adhi (younger sibling).
        - pakdhe / budhe (older than your parent), paklik / bulik (younger).
        - mbah kakung, mbah putri, putu, ponakan.
        Age decides, not which side of the family.
        - After a consonant -e: omahe, jenenge. After a vowel -ne: bukune, regane.
        - "X's": omahe Pak Budi (thing first).
        - -ku / -mu: masku, adhimu. · duweke sapa? = whose?
    grammar: jv.kinship.terms
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pakdhe
        ar_eg: عم / خال أكبر من بابا أو ماما
        ar: العم / الخال الأكبر من الوالد
        en: parent's older brother
      - text: bulik
        ar_eg: عمة / خالة أصغر من بابا أو ماما
        ar: العمة / الخالة الأصغر من الوالد
        en: parent's younger sister
      - text: putu
        ar_eg: حفيد
        ar: الحفيد
        en: grandchild
      - text: mbah kakung
        ar_eg: جدو
        ar: الجد
        en: grandfather
      - text: ponakan
        ar_eg: ابن الأخ / الأخت
        ar: ابن الأخ / الأخت
        en: niece / nephew
      - text: momong
        ar_eg: يراعي عيل
        ar: يرعى طفلًا
        en: mind a child
    words: [pakdhe, bulik, putu, mbah kakung, ponakan, momong]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أخت بابا، وهي أكبر من بابا. تقولها إيه؟
      ar: أخت أبيك، وهي أكبر منه. بمَ تناديها؟
      en: Your father's sister, older than him. What do you call her?
    options: [mbakyu, budhe, bulik]
    answer: 1
    words: [budhe]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «اسم مراتي»؟ (jeneng + bojo)
      ar: كيف تقول «اسم زوجتي»؟ (jeneng + bojo)
      en: How do you say "my wife's name"? (jeneng + bojo)
    options: [jenenge bojoku, jenengku bojo, bojoku jenenge]
    answer: 0
    explain:
      ar_eg: الحاجة الأول (jenenge) وبعدين صاحبها (bojoku)، زي «اسم مراتي».
      ar: المملوك أولًا (jenenge) ثم المالك (bojoku) كالإضافة العربية.
      en: Thing first (jenenge), owner second (bojoku), like «اسم مراتي».
    words: [jenenge, bojo]
  - id: e04
    type: multiple_choice
    question: rega + -e / -ne
    question_meaning:
      ar_eg: أنهي شكل صح؟
      ar: أيّ صيغة صحيحة؟
      en: Which form is right?
    options: [regae, reganya, regane]
    answer: 2
    explain:
      ar_eg: rega آخرها a (متحرك) ⇐ -ne. وreganya إندونيسي.
      ar: تنتهي rega بصائت ⇐ -ne، أما reganya فإندونيسية.
      en: rega ends in a vowel ⇒ -ne. reganya is Indonesian.
    words: [regane]
  - id: e05
    type: listen
    text: Iki bojoku, lan iki anakku.
    options: ['Iki bojoku, lan iki anakku.', 'Iki bojoku, lan iki adhiku.', 'Iki budheku, lan iki anakku.']
    answer: 0
    words: [bojo, anak]
  - id: e06
    type: fill_blank
    sentence: Iki ___ sapa?
    meaning:
      ar_eg: ده بتاع مين؟
      ar: لمن هذا؟
      en: Whose is this?
    answers: [duweke]
    words: [duweke]
  - id: e07
    type: fill_blank
    sentence: Mbah kakung ___ neng kamar.
    meaning:
      ar_eg: جدو ___ في الأوضة.
      ar: الجدّ ___ في الغرفة.
      en: Grandpa is ___ in the room.
    options: [lungguh, rabi, lair]
    answers: [lungguh]
    words: [lungguh, kamar, mbah kakung]
  - id: e08
    type: build_sentence
    source:
      ar_eg: محل باك بودي جنب الجامع.
      ar: مطعم باك بودي بجانب المسجد.
      en: Pak Budi's warung is next to the mosque.
    answer: Warunge Pak Budi neng jejere masjid.
    distractors: [omahe, mburi]
    words: [warunge, jejere]
  - id: e09
    type: translate
    direction: from_target
    source_text: Pawone cedhak jeding.
    answers_meaning:
      ar_eg: [المطبخ جنب الحمّام, المطبخ قريب من الحمّام]
      ar: [المطبخ قريب من الحمّام, المطبخ بجوار الحمّام]
      en: [The kitchen is near the bathroom, The kitchen is next to the bathroom]
    words: [pawon, jeding, cedhak]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أخويا الكبير بيشتغل في القاهرة، وأختي الكبيرة ساكنة في الجيزة.
      ar: أخي الأكبر يعمل في القاهرة، وأختي الكبرى تسكن في الجيزة.
      en: My older brother works in Cairo, and my older sister lives in Giza.
    answers: ["Masku nyambut gawe neng Kairo, lan mbakyuku manggon neng Giza.", "Masku nyambut gawe neng Kairo, lan mbakyuku manggon neng Giza", "Masku nyambut gawe neng Kairo lan mbakyuku manggon neng Giza.", Masku nyambut gawe neng Kairo lan mbakyuku manggon neng Giza, "Masku nyambut gawe neng Kairo, mbakyuku manggon neng Giza.", "Masku nyambut gawe neng Kairo, mbakyuku manggon neng Giza", "Masku nyambut gawe neng Kairo mbakyuku manggon neng Giza.", Masku nyambut gawe neng Kairo mbakyuku manggon neng Giza, "Masku nyambut gawe neng Kairo, lan mbakku manggon neng Giza.", "Masku nyambut gawe neng Kairo, lan mbakku manggon neng Giza", "Masku nyambut gawe neng Kairo lan mbakku manggon neng Giza.", Masku nyambut gawe neng Kairo lan mbakku manggon neng Giza, "Masku nyambut gawe nang Kairo, lan mbakyuku manggon nang Giza.", "Masku nyambut gawe nang Kairo, lan mbakyuku manggon nang Giza", "Masku nyambut gawe nang Kairo lan mbakyuku manggon nang Giza.", Masku nyambut gawe nang Kairo lan mbakyuku manggon nang Giza, "Masku nyambut gawe neng Kairo, karo mbakyuku manggon neng Giza.", "Masku nyambut gawe neng Kairo, karo mbakyuku manggon neng Giza", "Masku nyambut gawe neng Kairo karo mbakyuku manggon neng Giza.", Masku nyambut gawe neng Kairo karo mbakyuku manggon neng Giza]
    words: [mas, mbakyu, nyambut gawe, manggon]
  - id: e11
    type: dictation
    text: Omahe Pak Budi adoh.
    meaning:
      ar_eg: بيت باك بودي بعيد.
      ar: بيت باك بودي بعيد.
      en: Pak Budi's house is far.
    words: [omahe, adoh]
  - id: e12
    type: speaking
    text: Aku duwe mas siji lan adhi loro.
    meaning:
      ar_eg: عندي أخ كبير واحد واتنين إخوات أصغر مني.
      ar: لي أخ أكبر واحد وأخوان أصغر مني.
      en: I have one older brother and two younger siblings.
    words: [mas, adhi]
dialogue:
  title: Kulawargamu piye?
  lines:
    - speaker: Bayu
      text: Mas Mohamed duwe adhi ra?
      ar_eg: يا أستاذ محمد، عندك إخوات أصغر منك؟
      ar: يا أخي محمد، ألك إخوة أصغر منك؟
      en: Mohamed, do you have younger siblings?
    - speaker: Mohamed
      text: Iya, Dhik. Aku duwe adhi loro lan mbakyu siji.
      ar_eg: أيوه يا صغير. عندي اتنين أصغر مني وأخت واحدة كبيرة.
      ar: نعم يا صغيري. لي أخوان أصغر مني وأخت كبرى واحدة.
      en: Yes, Dhik. I have two younger siblings and one older sister.
    - speaker: Bayu
      text: Kulawargane Mas Mohamed neng Kairo?
      ar_eg: عيلتك في القاهرة؟
      ar: هل عائلتك في القاهرة؟
      en: Is your family in Cairo?
    - speaker: Mohamed
      text: Iya. Bapak lan ibuku neng Kairo. Mbahku neng Aswan.
      ar_eg: أيوه. بابا وماما في القاهرة. وجدي في أسوان.
      ar: نعم. أبي وأمي في القاهرة، وجدي في أسوان.
      en: Yes. My father and mother are in Cairo. My grandparent is in Aswan.
    - speaker: Pak Budi
      text: Saiki kowe ya kulawarga neng kene lho, Mohamed!
      ar_eg: ودلوقتي إنت من العيلة هنا يا محمد!
      ar: والآن أنت من العائلة هنا يا محمد!
      en: Now you're family here, Mohamed!
souvenir:
  id: j2.u01.souvenir
  title: Warung Pak Budi
  note:
    ar_eg: |
      هنا في ماديون بتبدأ حكاية الـ Sinetron بتاعة Kabar: Pak Budi بيدير محل أكل صغير (warung) ريحته رز ساخن وشاي، وبنته Sari بتدرس في القاهرة. يعني جاوة ومصر اتقابلوا على ترابيزة واحدة.
      ودلوقتي إنت تعرف تسلّم على العيلة كلها: pakdhe، budhe، mbah putri، وتقول بيت مين وكتاب مين. أول حلقة مستنياك!
    ar: |
      هنا في ماديون تبدأ حكاية مسلسل Kabar: يدير Pak Budi مطعمًا صغيرًا (warung) تفوح منه رائحة الأرز الساخن والشاي، وابنته Sari تدرس في القاهرة، فتلتقي جاوة ومصر على مائدة واحدة.
      وصرتَ تعرف كيف تحيّي العائلة كلها: pakdhe وbudhe وmbah putri، وتقول بيت من وكتاب من. الحلقة الأولى في انتظارك!
    en: |
      Kabar's Sinetron starts here in Madiun: Pak Budi runs a little warung that smells of hot rice and tea, and his daughter Sari studies in Cairo — Java and Egypt at one table.
      Now you can greet the whole family — pakdhe, budhe, mbah putri — and say whose house and whose book. The first episode is waiting for you!
