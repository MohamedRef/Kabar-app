schema: kabar.lesson/v1
id: j2.u01.l09
language: jv
title: Kulawargaku
can_do:
  ar_eg: تقرا بوست قصير عن عيلة وتفهم مين قريب مين.
  ar: أن تقرأ منشورًا قصيرًا عن عائلة وتفهم صلات القرابة فيه.
  en: Read a short post about a family.
slides:
  - title: Statuse Sari
    grammar: jv.possessive.e-ne
    body:
      ar_eg: |
        Sari نزّلت صورة عيلتها على الواتساب وكتبت تحتها بوست صغير. اقراه واخد بالك من آخر الكلمات:
        - ‎-ku = بتاعي: bapakku = أبويا، masku = أخويا الكبير.
        - ‎-e / -ne = بتاعه / بتاع فلان: omahe Bapak = بيت بابا.
        - manggon = ساكن، duwe = عنده، saiki = دلوقتي.
      ar: |
        نشرت Sari صورة عائلتها على واتساب وكتبت تحتها منشورًا قصيرًا. اقرأه وانتبه لأواخر الكلمات:
        - ‎-ku = ـي: bapakku = أبي، وmasku = أخي الأكبر.
        - ‎-e / -ne = ـه / الخاص بفلان: omahe Bapak = بيت أبي.
        - manggon = يسكن، وduwe = يملك، وsaiki = الآن.
      en: |
        Sari posted a family photo on WhatsApp with a short caption. Read it and watch the word endings:
        - -ku = my: bapakku = my father, masku = my older brother.
        - -e / -ne = his / her / X's: omahe Bapak = Dad's house.
        - manggon = live, duwe = have, saiki = now.
    examples:
      - text: Jenengku Sari, aku saka Madiun. Saiki aku sinau neng Kairo.
        ar_eg: اسمي ساري، أنا من ماديون. دلوقتي بدرس في القاهرة.
        ar: اسمي ساري، وأنا من ماديون. أدرس الآن في القاهرة.
        en: My name is Sari, I'm from Madiun. Now I study in Cairo.
      - text: Bapak lan ibuku manggon neng Madiun. Bapakku duwe warung.
        ar_eg: بابا وماما ساكنين في ماديون. بابا عنده وارونج (مطعم صغير).
        ar: أبي وأمي يسكنان في ماديون. أبي يملك مطعمًا صغيرًا.
        en: My father and mother live in Madiun. My father has a warung.
      - text: Mas Agus, Bayu lan Mbah putri manggon neng omahe Bapak.
        ar_eg: أخويا الكبير أجوس وبايو وتيتة ساكنين في بيت بابا.
        ar: أخي الأكبر أغوس وبايو وجدّتي يسكنون في بيت أبي.
        en: My older brother Agus, Bayu and Grandma live in Dad's house.
exercises:
  - id: e01
    type: multiple_choice
    question: Saiki aku sinau neng Kairo.
    question_meaning:
      ar_eg: Sari بتدرس فين دلوقتي؟
      ar: أين تدرس Sari الآن؟
      en: Where does Sari study now?
    options: ["Neng Madiun.", "Neng Kairo.", "Neng Suroboyo."]
    answer: 1
    explain:
      ar_eg: هي من ماديون (saka Madiun)، لكن saiki (دلوقتي) بتدرس في القاهرة.
      ar: هي من ماديون (saka Madiun)، لكنها saiki (الآن) تدرس في القاهرة.
      en: She's from Madiun (saka Madiun), but saiki (now) she studies in Cairo.
    words: [saiki, sinau]
  - id: e02
    type: multiple_choice
    question: Bapakku duwe warung.
    question_meaning:
      ar_eg: أبو Sari عنده إيه؟
      ar: ماذا يملك والد Sari؟
      en: What does Sari's father have?
    options: ["Warung.", "Toko buku.", "Omah neng Kairo."]
    answer: 0
    explain:
      ar_eg: duwe = عنده (punya).
      ar: duwe = يملك (punya).
      en: duwe = have (punya).
    words: [duwe]
  - id: e03
    type: multiple_choice
    question: Mas Agus, Bayu lan Mbah putri manggon neng omahe Bapak.
    question_meaning:
      ar_eg: مين من دول ساكن في بيت أبو Sari؟
      ar: من يسكن في بيت والد Sari؟
      en: Who lives in Sari's father's house?
    options: ["Sari.", "Pakdhe lan budhe.", "Mbah putri."]
    answer: 2
    explain:
      ar_eg: omahe Bapak = بيت بابا، وMbah putri = تيتة ساكنة هناك. Sari نفسها في القاهرة.
      ar: omahe Bapak = بيت أبي، وMbah putri = الجدّة تسكن هناك، أما Sari ففي القاهرة.
      en: omahe Bapak = Dad's house, and Mbah putri lives there. Sari herself is in Cairo.
    words: [manggon, mbah putri]
  - id: e04
    type: listen
    text: Bapakku duwe warung.
    options: ["Masku duwe warung.", "Bapakku nyambut gawe neng warung.", "Bapakku duwe warung."]
    answer: 2
    meaning:
      ar_eg: بابا عنده وارونج.
      ar: أبي يملك مطعمًا صغيرًا.
      en: My father has a warung.
    words: [bapak, duwe]
  - id: e05
    type: match_pairs
    pairs:
      - text: masku
        ar_eg: أخويا الكبير
        ar: أخي الأكبر
        en: my older brother
      - text: adhiku
        ar_eg: أخويا / أختي الصغيرة
        ar: أخي / أختي الأصغر
        en: my younger sibling
      - text: omahe Bapak
        ar_eg: بيت بابا
        ar: بيت أبي
        en: Dad's house
      - text: mbah putri
        ar_eg: تيتة
        ar: الجدّة
        en: grandmother
      - text: manggon
        ar_eg: يسكن
        ar: يسكن
        en: live (somewhere)
    words: [mas, adhi, mbah putri, manggon]
  - id: e06
    type: fill_blank
    sentence: Sari kancaku. Bapak___ duwe warung.
    meaning:
      ar_eg: ساري صاحبتي. أبوها عنده وارونج.
      ar: ساري صديقتي. أبوها يملك مطعمًا صغيرًا.
      en: Sari is my friend. Her father has a warung.
    options: ["ku", "ne", "e"]
    answers: ["e"]
    explain:
      ar_eg: هنا «أبوها» مش «أبويا»، فنقول bapake. وbapak آخرها حرف ساكن، فبناخد ‎-e مش ‎-ne.
      ar: المقصود «أبوها» لا «أبي»، فنقول bapake. وbapak تنتهي بساكن، فتأخذ ‎-e لا ‎-ne.
      en: It's "her father", not "my father", so bapake. bapak ends in a consonant, so it takes -e, not -ne.
    words: [-e / -ne, bapak]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بوست زي Sari: «أبويا وأمي ساكنين في القاهرة.»"
      ar: "اكتب منشورًا مثل Sari: «أبي وأمي يسكنان في القاهرة.»"
      en: "Write a post like Sari's: \"My father and mother live in Cairo.\""
    answers:
      - Bapak lan ibuku manggon neng Kairo.
      - Bapak lan ibuku manggon neng Kairo
      - Bapakku lan ibuku manggon neng Kairo.
      - Bapakku lan ibuku manggon neng Kairo
      - Bapak karo ibuku manggon neng Kairo.
      - Bapakku karo ibuku manggon neng Kairo.
      - Bapak lan ibuku manggon ing Kairo.
    explain:
      ar_eg: "زي ما Sari كتبت: Bapak lan ibuku = أبويا وأمي، وmanggon neng = ساكنين في."
      ar: "كما كتبت Sari: Bapak lan ibuku = أبي وأمي، وmanggon neng = يسكنان في."
      en: "Just as Sari wrote: Bapak lan ibuku = my father and mother, manggon neng = live in."
    words: [bapak, ibu, manggon]
  - id: e08
    type: build_sentence
    source:
      ar_eg: تيتة ساكنة في بيت أخويا الكبير.
      ar: جدّتي تسكن في بيت أخي الأكبر.
      en: Grandma lives in my older brother's house.
    answer: Mbah putri manggon neng omahe masku.
    distractors: [omahku, bapak]
    explain:
      ar_eg: "omahe masku = بيت أخويا: الحاجة الأول، وبعدين صاحبها."
      ar: "omahe masku = بيت أخي: الشيء أولًا ثم صاحبه."
      en: "omahe masku = my older brother's house: the thing first, then the owner."
    words: [mbah putri, manggon, -e / -ne, mas]
  - id: e09
    type: speaking
    text: Kulawargaku manggon neng Kairo.
    meaning:
      ar_eg: عيلتي ساكنة في القاهرة.
      ar: عائلتي تسكن في القاهرة.
      en: My family lives in Cairo.
    words: [kulawarga, manggon]
dialogue:
  title: Statuse Sari
  lines:
    - speaker: Mohamed
      text: Sari, aku wis maca statusmu.
      ar_eg: يا ساري، قريت الستيتس بتاعك.
      ar: يا ساري، قرأت حالتك.
      en: Sari, I've read your status.
    - speaker: Sari
      text: Apik ra? Iki kulawargaku.
      ar_eg: حلو؟ دي عيلتي.
      ar: هل هو جميل؟ هذه عائلتي.
      en: Is it nice? This is my family.
    - speaker: Mohamed
      text: Apik! Mbah putri manggon neng omahe bapakmu, to?
      ar_eg: حلو! تيتة ساكنة في بيت أبوكي، صح؟
      ar: جميل! جدّتك تسكن في بيت أبيك، أليس كذلك؟
      en: Lovely! Your grandma lives in your father's house, right?
    - speaker: Sari
      text: Iya, karo Mas Agus lan Bayu.
      ar_eg: أيوه، مع أخويا أجوس وبايو.
      ar: نعم، مع أخي أغوس وبايو.
      en: Yes, with Mas Agus and Bayu.
    - speaker: Mohamed
      text: Kulawargamu gedhe! Kulawargaku neng Kairo.
      ar_eg: عيلتك كبيرة! عيلتي في القاهرة.
      ar: عائلتك كبيرة! عائلتي في القاهرة.
      en: Your family is big! My family is in Cairo.
review:
