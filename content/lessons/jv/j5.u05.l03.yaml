schema: kabar.lesson/v1
id: j5.u05.l03
language: jv
title: Dumadakan, pungkasane
can_do:
  ar_eg: تلاقي المفاجأة والنهاية في القصة.
  ar: أن تجد لحظة التحوّل والخاتمة في القصة.
  en: Find a story's twist and its ending.
slides:
  - title: Bareng … dumadakan …
    body:
      ar_eg: |
        كل قصة فيها لحظة بيتقلب فيها كل حاجة. الكلمة اللي بتعلن عنها: dumadakan = فجأة (tiba-tiba).
        وbareng في أول الجملة في الحكي معناها «أول ما» (begitu)، مش «مع بعض» بس: «Bareng tekan omah, …» = أول ما وصل البيت.
        tekan = يوصل (sampai).
      ar: |
        في كل قصة لحظة ينقلب فيها كل شيء، وكلمتها: dumadakan = فجأة (tiba-tiba).
        وbareng في صدر الجملة السردية بمعنى «ما إن» (begitu)، لا «معًا» فقط: «Bareng tekan omah, …» = ما إن وصل البيت.
        وtekan = يصل (sampai).
      en: |
        Every story has a moment when everything turns. Its word: dumadakan = suddenly (tiba-tiba).
        And bareng at the start of a clause in a story means "as soon as" (begitu), not just "together": "Bareng tekan omah, …" = as soon as he got home.
        tekan = arrive, reach (sampai).
    grammar: jv.narrative.connectors
    examples:
      - text: Bareng tekan omah, dumadakan udan deres.
        ar_eg: أول ما وصل البيت، فجأة الدنيا مطّرت جامد.
        ar: ما إن وصل إلى البيت حتى انهمر المطر فجأة.
        en: As soon as he got home, it suddenly poured with rain.
      - text: Dumadakan, ana swara saka mburi.
        ar_eg: فجأة، فيه صوت جه من ورا.
        ar: فجأة جاء صوت من الخلف.
        en: Suddenly, there was a sound from behind.
  - title: Pungkasane …
    body:
      ar_eg: |
        والنهاية: pungkasane = وفي الآخر (akhirnya)، وwiwit iku = ومن ساعتها (sejak itu).
        زي آخر الحدوتة عندنا: «وعاشوا في تبات ونبات».
      ar: |
        وللخاتمة: pungkasane = وفي النهاية (akhirnya)، وwiwit iku = ومنذ ذلك الحين (sejak itu).
        كخاتمة حكاياتنا: «وعاشوا في تبات ونبات».
      en: |
        And the ending: pungkasane = in the end (akhirnya), wiwit iku = from then on (sejak itu).
        Like the close of an Egyptian folk tale: «وعاشوا في تبات ونبات».
    grammar: jv.narrative.connectors
    examples:
      - text: Pungkasane, kabeh padha bungah.
        ar_eg: وفي الآخر، الكل فرح.
        ar: وفي النهاية فرح الجميع.
        en: In the end, everyone was happy.
      - text: Wiwit iku, Bima ora tau lali payung.
        ar_eg: ومن ساعتها، بيما عمره ما نسي الشمسية.
        ar: ومنذ ذلك الحين لم ينسَ بيما المظلة أبدًا.
        en: From then on, Bima never forgot his umbrella.
