  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأسلوب الحكاية) أول ما وصل البيت، نام.
      ar: (بأسلوب الحكاية) ما إن وصل إلى البيت حتى نام.
      en: (story style) As soon as he got home, he went to sleep.
    answers:
      - Bareng tekan omah, dheweke turu.
      - Bareng tekan omah, dheweke banjur turu.
      - Bareng tekan omah, dheweke langsung turu.
      - Bareng tekan omah, dheweke nuli turu.
      - Bareng tekan omah, dheweke terus turu.
    words: [bareng, tekan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Dumadakan udan deres, pungkasane Bima mulih.
    answers_meaning:
      ar_eg:
        - فجأة الدنيا مطّرت جامد، وفي الآخر بيما روّح.
        - فجأة المطر نزل جامد، وفي الآخر بيما روّح.
        - فجأة الدنيا مطّرت جامد، وفي الآخر بيما رجع البيت.
        - فجأة نزل مطر جامد، وفي الآخر بيما روّح.
      ar:
        - انهمر المطر فجأة، وفي النهاية عاد بيما إلى البيت.
        - فجأة انهمر المطر، وفي النهاية عاد بيما إلى بيته.
        - هطل المطر بغزارة فجأة، وأخيرًا عاد بيما إلى البيت.
      en:
        - Suddenly it poured with rain, and in the end Bima went home.
        - Suddenly it rained heavily, and in the end Bima went home.
        - Suddenly it poured, and finally Bima went home.
        - Suddenly there was heavy rain; in the end Bima went home.
        - Suddenly it rained hard, and finally Bima went home.
    words: [dumadakan, pungkasane]
  - id: e10
    type: speaking
    text: Wiwit iku, aku seneng maca cerkak.
    meaning:
      ar_eg: ومن ساعتها، بقيت بحب أقرا قصص قصيرة.
      ar: ومنذ ذلك الحين صرت أحب قراءة القصص القصيرة.
      en: From then on, I've loved reading short stories.
    words: [wiwit iku, cerkak]
dialogue:
  title: Pungkasane critane
  lines:
    - speaker: Mohamed
      text: Bu, pungkasane critane piye?
      ar_eg: يا أبلة، القصة خلصت إزاي؟
      ar: يا سيدتي، كيف انتهت القصة؟
      en: Ma'am, how does the story end?
    - speaker: Bu Nur
      text: Bareng tekan omah, dumadakan udan deres.
      ar_eg: أول ما وصل البيت، فجأة الدنيا مطّرت جامد.
      ar: ما إن وصل إلى البيت حتى انهمر المطر فجأة.
      en: As soon as he got home, it suddenly poured with rain.
    - speaker: Mohamed
      text: Banjur Bima piye, Bu?
      ar_eg: وبعدين بيما حصله إيه يا أبلة؟
      ar: ثم ماذا جرى لبيما يا سيدتي؟
      en: And then what about Bima, ma'am?
    - speaker: Bu Nur
      text: Bima teles kabeh. Wiwit iku, dheweke ora tau lali payung.
      ar_eg: بيما اتبلّ خالص. ومن ساعتها، عمره ما نسي الشمسية.
      ar: ابتلّ بيما كله، ومنذ ذلك الحين لم ينسَ المظلة أبدًا.
      en: Bima got soaked. From then on, he never forgot his umbrella.
