language: jv
title: Pecel Madiun
can_do:
  ar_eg: 'تاكل بيتشيل ماديون: تدوق، وتطلب كروبوك ومعلقة، وتعرف البريم، وتاكل من الـ pincuk.'
  ar: 'أن تأكل بيتشيل ماديون: تتذوّق، وتطلب الكروبوك والملعقة، وتعرف البريم، وتأكل من الـ pincuk.'
  en: 'Eat pecel in Madiun: taste it, ask for crackers and a spoon, know brem, and eat from a pincuk.'
slides:
  - title: Kutha pecel
    body:
      ar_eg: |
        ماديون مشهورة بالـ **pecel**: خضار مسلوقة عليها صلصة فول سوداني حراقة، وبتتاكل بالرز.
        - **ngulek** = يدق الشطة في الهون الحجر (mengulek): Bu Darmi ngulek sambel.
        - **krupuk** = كروبوك، رقايق مقرمشة (kerupuk) · **sendhok** = معلقة (sendok) · **lenga** = زيت (minyak).
        - **nyicipi** = يدوق (mencicipi) · **pincuk** = ورقة موز متطبقة بيتحط فيها البيتشيل.
        - **brem** = حلويات ماديون من الرز المخمّر، بتتاخد هدية من هناك.
      ar: |
        ماديون مشهورة بـ **pecel**: خضار مسلوقة بصلصة الفول السوداني الحارة، تؤكل مع الأرز.
        - **ngulek** = يهرس الفلفل في الهاون الحجري (mengulek): Bu Darmi ngulek sambel.
        - **krupuk** = رقائق مقرمشة (kerupuk) · **sendhok** = ملعقة (sendok) · **lenga** = زيت (minyak).
        - **nyicipi** = يتذوّق (mencicipi) · **pincuk** = ورقة موز مطوية يُقدَّم فيها البيتشيل.
        - **brem** = حلوى ماديون من الأرز المخمَّر، وتُحمل هديةً منها.
      en: |
        Madiun is famous for **pecel**: boiled vegetables under a hot peanut sauce, eaten with rice.
        - **ngulek** = grind chilli in a stone mortar (mengulek): Bu Darmi ngulek sambel.
        - **krupuk** = crackers (kerupuk) · **sendhok** = spoon (sendok) · **lenga** = oil (minyak).
        - **nyicipi** = taste, try (mencicipi) · **pincuk** = a folded banana-leaf plate that pecel is served on.
        - **brem** = Madiun's sweet made from fermented rice, the classic gift to bring home.
    examples:
      - text: Pecel Madiun neng pincuk, Mas. Nyicipi!
        ar_eg: بيتشيل ماديون على ورقة الموز يا ماس. دوق!
        ar: بيتشيل ماديون على ورقة الموز يا أخي. تذوّق!
        en: Madiun pecel on a banana leaf, Mas. Try it!
      - text: Pecel siji karo krupuk, Bu.
        ar_eg: واحد بيتشيل بالكروبوك يا حاجة.
        ar: بيتشيل واحد مع الكروبوك يا سيدتي.
        en: One pecel with crackers, ma'am.
      - text: Brem iki oleh-oleh saka Madiun.
        ar_eg: البريم ده هدية من ماديون.
        ar: هذا البريم هدية من ماديون.
        en: This brem is a gift from Madiun.
