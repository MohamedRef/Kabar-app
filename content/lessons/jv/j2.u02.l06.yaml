dialogue:
  lines:
    - speaker: Bu Darmi
      text: Mangga, Mas! Pecel Madiun, isih anget.
      ar_eg: اتفضل يا ماس! بيتشيل ماديون، لسه سخن.
      ar: تفضّل يا أخي! بيتشيل ماديون، ما زال دافئًا.
      en: Come in, Mas! Madiun pecel, still warm.
    - speaker: Mohamed
      text: Pecel siji, Bu. Karo krupuk, nggih.
      ar_eg: واحد بيتشيل يا حاجة. بالكروبوك لو سمحتي.
      ar: بيتشيل واحد يا سيدتي، مع الكروبوك من فضلك.
      en: One pecel, ma'am. With crackers, please.
    - speaker: Bu Darmi
      text: Sambele lagi tak ulek, lho. Nyicipi sik, Mas.
      ar_eg: الصلصة لسه داقّاها حالًا على فكرة. دوق الأول يا ماس.
      ar: هرستُ الصلصة للتوّ. تذوّق أولًا يا أخي.
      en: I've just ground the sauce, you know. Taste it first, Mas.
    - speaker: Mohamed
      text: Wah, pedhes, enak tenan! Sendhoke ndi, Bu?
      ar_eg: واو، حرّاقة وحلوة بجد! فين المعلقة يا حاجة؟
      ar: يا سلام، حارّة ولذيذة حقًا! أين الملعقة يا سيدتي؟
      en: Wow, spicy and really good! Where's the spoon, ma'am?
    - speaker: Bu Darmi
      text: Iki. Pincuke dicekel, ya. Mengko mulih nggawa brem.
      ar_eg: اتفضل. امسك ورقة الموز كويس. وإنت مروّح خد بريم.
      ar: تفضّل. أمسك ورقة الموز جيدًا. وخذ معك البريم حين تعود.
      en: Here. Hold the leaf plate steady. Take some brem home later.
