schema: kabar.lesson/v1
id: j2.u02.l06
language: jv
title: Tuku pecel
can_do:
  ar_eg: تطلب أكل من عربية بيتشل.
  ar: أن تطلب طعامًا من كشك البيتشل.
  en: Order at a pecel stall.
slides:
  - title: Pesen sega pecel
    body:
      ar_eg: |
        جمل الطلب عند عربية البيتشل:
        - Sega pecel siji, Bu. = واحد رز بيتشل يا طنط. (الاسم + العدد، زي الإندونيسي)
        - nganggo endhog = بالبيض (nganggo = pakai)
        - Sambele sithik wae. = صوص شوية بس. (sithik = sedikit)
        - Pedhes apa ora? = حرّاق ولا لأ؟ (apa هنا = «ولا»)
        - Mangan kene apa dibungkus? = تاكل هنا ولا تيك أواي؟
        - Kabeh pira? = الحساب كام؟
        وفي ماديون البيتشل بيتقدم على ورقة شجر متطبقة اسمها pincuk.
      ar: |
        عبارات الطلب عند كشك البيتشل:
        - Sega pecel siji, Bu. = طبق أرز بيتشل واحد يا سيدتي (الاسم ثم العدد كالإندونيسية).
        - nganggo endhog = بالبيض (nganggo = pakai)
        - Sambele sithik wae. = قليلًا من الصلصة فقط (sithik = sedikit).
        - Pedhes apa ora? = حارًّا أم لا؟ (apa هنا بمعنى «أم»)
        - Mangan kene apa dibungkus? = تأكل هنا أم سفري؟
        - Kabeh pira? = كم الحساب كله؟
        وفي ماديون يُقدَّم البيتشل على ورقة شجر مطوية تسمى pincuk.
      en: |
        Ordering at a pecel stall:
        - Sega pecel siji, Bu. = One pecel rice, ma'am. (noun + number, as in Indonesian)
        - nganggo endhog = with egg (nganggo = pakai)
        - Sambele sithik wae. = Just a little sauce. (sithik = sedikit)
        - Pedhes apa ora? = Spicy or not? (apa here = "or")
        - Mangan kene apa dibungkus? = Eat here or take away?
        - Kabeh pira? = How much altogether?
        In Madiun, pecel is served on a folded leaf called a pincuk.
    examples:
      - text: Sega pecel siji, nganggo endhog.
        ar_eg: واحد رز بيتشل بالبيض.
        ar: طبق أرز بيتشل واحد بالبيض.
        en: One pecel rice with egg.
      - text: Mangan kene apa dibungkus?
        ar_eg: تاكل هنا ولا تيك أواي؟
        ar: تأكل هنا أم سفري؟
        en: Eat here or take away?
exercises:
  - id: e01
    type: multiple_choice
    question: Mangan kene apa dibungkus?
    question_meaning:
      ar_eg: عايز الأكل تيك أواي. ترد على البياعة تقول إيه؟
      ar: تريد الطعام سفريًا. بماذا تجيب البائعة؟
      en: You want it to take away. How do you answer the seller?
    options: ['Pedhes, Bu.', 'Mangan kene, Bu.', 'Dibungkus, Bu.']
    answer: 2
    explain:
      ar_eg: dibungkus = متلفوف (تيك أواي)، زي الإندونيسي.
      ar: dibungkus = مغلَّف (سفري) كالإندونيسية.
      en: dibungkus = wrapped (to take away), as in Indonesian.
    words: [dibungkus, kene]
  - id: e02
    type: multiple_choice
    question: Pedhes apa ora?
    question_meaning:
      ar_eg: مش عايز الأكل حرّاق خالص. ترد بإيه؟
      ar: لا تريد الطعام حارًّا أبدًا. بماذا تجيب؟
      en: You don't want it spicy at all. What's your answer?
    options: ['Ora pedhes, Bu.', 'Pedhes banget, Bu.', 'Rada pedhes, Bu.']
    answer: 0
    words: [pedhes, ora]
  - id: e03
    type: fill_blank
    sentence: Sega pecel siji, ___ endhog.
    meaning:
      ar_eg: واحد رز بيتشل بالبيض.
      ar: طبق أرز بيتشل واحد بالبيض.
      en: One pecel rice with egg.
    options: [kabeh, nganggo, sithik]
    answers: [nganggo]
    explain:
      ar_eg: nganggo = pakai، يعني «بـ».
      ar: nganggo = pakai، أي «بـ».
      en: nganggo = pakai, "with".
    words: [nganggo, endhog]
  - id: e04
    type: build_sentence
    source:
      ar_eg: عايز اتنين رز بيتشل يا طنط.
      ar: أطلب طبقين من أرز البيتشل يا سيدتي.
      en: I'll order two pecel rice, ma'am.
    answer: Aku pesen sega pecel loro, Bu.
    distractors: [siji, pedhes]
    words: [pesen, sega, pecel, loro]
  - id: e05
    type: match_pairs
    pairs:
      - text: pesen
        ar_eg: يطلب (أكل)
        ar: يطلب (طعامًا)
        en: order (food)
      - text: nganggo
        ar_eg: بـ / بيستخدم
        ar: بـ / يستعمل
        en: with, using
      - text: sithik
        ar_eg: شوية
        ar: قليلًا
        en: a little
      - text: dibungkus
        ar_eg: تيك أواي
        ar: سفري
        en: to take away
      - text: kabeh
        ar_eg: كله
        ar: الكل
        en: all, in total
      - text: sambel
        ar_eg: صوص حرّاق
        ar: صلصة حارة
        en: chilli sauce
    words: [pesen, nganggo, sithik, dibungkus, kabeh, sambel]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: صوص شوية بس يا طنط.
      ar: قليل من الصلصة فقط يا سيدتي.
      en: Just a little sauce, ma'am.
    answers: ["Sambele sithik wae, Bu.", "Sambele sithik wae, Bu", "Sambele sithik wae.", Sambele sithik wae, "Sambel sithik wae, Bu.", "Sambel sithik wae, Bu", "Sambel sithik wae.", Sambel sithik wae, "Sambele sitik wae, Bu.", "Sambele sitik wae, Bu"]
    explain:
      ar_eg: sithik = sedikit، وwae = saja. في الشات بتتكتب sitik.
      ar: sithik = sedikit، وwae = saja، وتُكتب في الدردشة sitik.
      en: sithik = sedikit, wae = saja. Chats write sitik.
    words: [sithik, wae, sambel]
  - id: e07
    type: listen
    text: Aku pesen sega pecel, dibungkus.
    options: ['Aku pesen sega pecel, dibungkus.', 'Aku pesen sega pecel, mangan kene.', 'Aku pesen sega pecel, sambele sithik.']
    answer: 0
    meaning:
      ar_eg: أنا عايز رز بيتشل، تيك أواي.
      ar: أطلب أرز بيتشل، سفري.
      en: I'll order rice with pecel, to take away.
    words: [pesen, sega, pecel, dibungkus, sithik]
  - id: e08
    type: listen
    text: Kabeh telung puluh ewu.
    options: [Kabeh telung ewu., Kabeh sepuluh ewu., Kabeh telung puluh ewu.]
    answer: 2
    explain:
      ar_eg: telung puluh ewu = تلاتين ألف. telung ewu = تلات تلاف بس.
      ar: telung puluh ewu = ثلاثون ألفًا، وtelung ewu = ثلاثة آلاف.
      en: telung puluh ewu = 30,000; telung ewu = 3,000.
    words: [kabeh, telung puluh, ewu]
  - id: e09
    type: dictation
    text: Sega pecel loro, Bu.
    meaning:
      ar_eg: اتنين رز بيتشل يا طنط.
      ar: طبقان من أرز البيتشل يا سيدتي.
      en: Two pecel rice, ma'am.
    words: [sega, pecel, loro]
  - id: e10
    type: speaking
    text: Sega pecel siji, nganggo endhog. Kabeh pira, Bu?
    meaning:
      ar_eg: واحد رز بيتشل بالبيض. الحساب كله كام يا طنط؟
      ar: طبق أرز بيتشل واحد بالبيض. كم المجموع يا سيدتي؟
      en: One pecel rice with egg. How much is it all, ma'am?
    words: [sega, pecel, nganggo, endhog, kabeh]
dialogue:
  title: Pecel Bu Darmi, Caruban
  lines:
    - speaker: Bu Darmi
      text: Pesen apa, Mas?
      ar_eg: تطلب إيه يا أستاذ؟
      ar: ماذا تطلب يا أخي؟
      en: What would you like, Mas?
    - speaker: Mohamed
      text: Sega pecel loro, Bu. Siji nganggo endhog.
      ar_eg: اتنين رز بيتشل يا طنط. واحد فيهم بالبيض.
      ar: طبقان من أرز البيتشل يا سيدتي، أحدهما بالبيض.
      en: Two pecel rice, ma'am. One with egg.
    - speaker: Bu Darmi
      text: Pedhes apa ora?
      ar_eg: حرّاق ولا لأ؟
      ar: حارّ أم لا؟
      en: Spicy or not?
    - speaker: Mohamed
      text: Aku sing pedhes. Sari ora pedhes, sambele sithik wae.
      ar_eg: بتاعي حرّاق. وبتاع ساري مش حرّاق، صوص شوية بس.
      ar: طبقي حارّ، وطبق ساري غير حارّ، بقليل من الصلصة فقط.
      en: Mine spicy. Sari's not spicy, just a little sauce.
    - speaker: Mohamed
      text: Wah, enak tenan! Kabeh pira, Bu?
      ar_eg: واو، حلو بجد! الحساب كام يا طنط؟
      ar: رائع، لذيذ حقًا! كم الحساب يا سيدتي؟
      en: Wow, really tasty! How much altogether, ma'am?
    - speaker: Bu Darmi
      text: Kabeh telung puluh ewu, Mas.
      ar_eg: الكل تلاتين ألف يا أستاذ.
      ar: المجموع ثلاثون ألفًا يا أخي.
      en: Thirty thousand altogether, Mas.
new_words:
  - word: pesen
    pos: verb
    ar_eg: يطلب (أكل)
    ar: يطلب (طعامًا)
    en: to order (pesan)
  - word: nganggo
    pos: preposition
    ar_eg: بـ / بيستخدم
    ar: بـ / يستعمل
    en: with, using (pakai)
  - word: sithik
    pos: adverb
    ar_eg: شوية
    ar: قليل
    en: a little (sedikit)
  - word: dibungkus
    pos: verb
    ar_eg: متلفوف (تيك أواي)
    ar: مغلَّف (سفري)
    en: wrapped, to take away
  - word: kabeh
    pos: pronoun
    ar_eg: كله / الكل (= semua)
    ar: الكل / جميع (= semua)
    en: all, everything (= semua)
