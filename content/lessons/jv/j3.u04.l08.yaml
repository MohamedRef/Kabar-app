schema: kabar.lesson/v1
id: j3.u04.l08
language: jv
title: Kenalan karo Pak Wiryo
can_do:
  ar_eg: تسمع مرشد بيعرّف نفسه بالكراما وتفهم هو منين وبيحب إيه، وتعرّف نفسك ليه.
  ar: أن تسمع مرشدًا يعرّف بنفسه بالكراما وتفهم من أين هو وماذا يحب، ثم تعرّف بنفسك.
  en: Follow a guide's krama self-introduction by ear, then introduce yourself to him.
slides:
  - title: Rungokna Pak Wiryo
    body:
      ar_eg: |
        في الـ pendhapa، Pak Wiryo المرشد بيرحّب بمجموعة زوار. اسمعه من غير ما تقرا.
        هو بيتكلم عن نفسه بـ kula، وبيكلم الزوار بـ panjenengan، وفي الآخر بيعزمهم يسألوا: Mangga, taken kemawon!
      ar: |
        في الـ pendhapa يرحّب المرشد Pak Wiryo بمجموعة من الزوار. استمع إليه دون قراءة.
        يتكلم عن نفسه بـ kula، ويخاطب الزوار بـ panjenengan، ثم يدعوهم إلى السؤال: Mangga, taken kemawon!
      en: |
        In the pendhapa, Pak Wiryo the guide welcomes a group of visitors. Listen without reading.
        He talks about himself with kula, addresses the visitors with panjenengan, and invites questions: Mangga, taken kemawon!
    grammar: jv.krama.questions
exercises:
  - id: e01
    type: listen
    text: Sugeng enjing. Nami kula Wiryo. Kula saking Klaten.
    question:
      ar_eg: Pak Wiryo منين؟
      ar: من أين Pak Wiryo؟
      en: Where is Pak Wiryo from?
    options: [Solo, Klaten, Kairo]
    answer: 1
    meaning:
      ar_eg: صباح الخير. اسمي Wiryo. أنا من Klaten.
      ar: صباح الخير. اسمي Wiryo. أنا من Klaten.
      en: Good morning. My name is Wiryo. I'm from Klaten.
    words: [nami, saking]
  - id: e02
    type: listen
    text: Kula remen sanget basa Jawi lan pendhapa menika.
    question:
      ar_eg: Pak Wiryo بيحب إيه؟
      ar: ماذا يحب Pak Wiryo؟
      en: What does Pak Wiryo love?
    options: [basa Jawi, batik, teh]
    answer: 0
    meaning:
      ar_eg: أنا بحب أوي اللغة الجاوية والـ pendhapa ده.
      ar: أحب كثيرًا اللغة الجاوية وهذا الـ pendhapa.
      en: I really love the Javanese language and this pendhapa.
    words: [remen, sanget, basa Jawi]
  - id: e03
    type: listen
    text: Panjenengan saking pundi? Mangga, taken kemawon!
    question:
      ar_eg: Pak Wiryo بيعزم الزوار يعملوا إيه؟
      ar: إلامَ يدعو Pak Wiryo الزوار؟
      en: What does Pak Wiryo invite the visitors to do?
    options: [nedha, mlampah, taken]
    answer: 2
    meaning:
      ar_eg: حضراتكم منين؟ اتفضلوا اسألوا!
      ar: من أين حضراتكم؟ تفضّلوا بالسؤال!
      en: Where are you from? Please, feel free to ask!
    words: [pundi, taken]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: Pak Wiryo سأل «Panjenengan saking pundi?». محمد يرد بإيه؟
      ar: سأل Pak Wiryo «Panjenengan saking pundi?». بمَ يجيب محمد؟
      en: Pak Wiryo asks "Panjenengan saking pundi?". What does Mohamed answer?
    options: ['Nami kula Mohamed, Pak.', 'Kula remen basa Jawi, Pak.', 'Kula saking Kairo, Pak.']
    answer: 2
    explain:
      ar_eg: saking pundi = منين. الرد saking + مكان.
      ar: saking pundi = من أين، والجواب saking + المكان.
      en: saking pundi = where from; answer with saking + a place.
    words: [saking, pundi]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: 'زائر سأل محمد: «Kenging menapa sampeyan sinau basa Jawi?». أحسن رد؟'
      ar: 'سأل زائر محمدًا: «Kenging menapa sampeyan sinau basa Jawi?». ما أنسب جواب؟'
      en: 'A visitor asks Mohamed: "Kenging menapa sampeyan sinau basa Jawi?". The best answer?'
    options: ['Jam sanga.', 'Kula remen basa Jawi.', 'Kula saking Kairo.']
    answer: 1
    explain:
      ar_eg: kenging menapa = ليه، فالرد سبب.
      ar: kenging menapa = لماذا، فالجواب سبب.
      en: kenging menapa = why, so the answer is a reason.
    words: [kenging menapa, remen]
  - id: e06
    type: dictation
    text: Mangga, taken kemawon.
    meaning:
      ar_eg: اتفضل اسأل.
      ar: تفضّل بالسؤال.
      en: Please, feel free to ask.
    words: [mangga, taken, kemawon]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: 'عرّف نفسك لـ Pak Wiryo بالكراما: اسمي محمد. أنا من القاهرة. بحب الجاوي أوي.'
      ar: 'عرّف بنفسك لـ Pak Wiryo بالكراما: اسمي محمد. أنا من القاهرة. أحب الجاوية كثيرًا.'
      en: "Introduce yourself to Pak Wiryo in krama: My name is Mohamed. I'm from Cairo. I really love Javanese."
    answers: ["Nami kula Mohamed. Kula saking Kairo. Kula remen sanget basa Jawi.", "Nami kulo Mohamed. Kulo saking Kairo. Kulo remen sanget basa Jawi.", "Nami kula Mohamed. Kula saking Kairo. Kula remen basa Jawi sanget.", "Nami kula Mohamed, saking Kairo. Kula remen sanget basa Jawi.", "Nami kula Mohamed, saking Kairo. Kula remen basa Jawi sanget.", "Nami kula Mohamed. Kula saking Kairo. Kula remen sanget kaliyan basa Jawi."]
    explain:
      ar_eg: 'remen = seneng (يحب)، sanget = banget (أوي).'
      ar: 'remen = seneng (يحب)، وsanget = banget (جدًا).'
      en: 'remen = seneng (like), sanget = banget (very).'
    words: [nami, kula, saking, remen, sanget, basa Jawi]
  - id: e08
    type: speaking
    text: Pak Wiryo, panjenengan saking Klaten?
    meaning:
      ar_eg: يا Pak Wiryo، حضرتك من Klaten؟
      ar: يا Pak Wiryo، هل حضرتك من Klaten؟
      en: Pak Wiryo, are you from Klaten?
    words: [panjenengan, saking]
dialogue:
  title: Mohamed taken
  lines:
    - speaker: Mohamed
      text: Pak Wiryo, kula badhe taken.
      ar_eg: يا Pak Wiryo، عايز أسأل سؤال.
      ar: يا Pak Wiryo، أريد أن أسأل.
      en: Pak Wiryo, I'd like to ask something.
    - speaker: Pak Wiryo
      text: Mangga, Mas.
      ar_eg: اتفضل يا أستاذ.
      ar: تفضّل يا أخي.
      en: Go ahead.
    - speaker: Mohamed
      text: Kenging menapa panjenengan remen pendhapa?
      ar_eg: حضرتك بتحب الـ pendhapa ليه؟
      ar: لماذا تحب الـ pendhapa؟
      en: Why do you love the pendhapa?
    - speaker: Pak Wiryo
      text: Pendhapa menika sae sanget, Mas. Sampeyan remen?
      ar_eg: الـ pendhapa ده حلو أوي يا أستاذ. وإنت بتحبه؟
      ar: هذا الـ pendhapa جميل جدًا يا أخي. وهل تحبه أنت؟
      en: This pendhapa is very beautiful. Do you like it?
    - speaker: Mohamed
      text: Inggih, Pak. Remen sanget!
      ar_eg: أيوه يا حاج. بحبه أوي!
      ar: نعم يا سيدي. أحبه كثيرًا!
      en: Yes, sir. Very much!
review:
  status: draft
  verified: false
