schema: kabar.lesson/v1
id: j5.u05.l04
language: jv
title: Lakon lan adegan
can_do:
  ar_eg: 'تحكي عن قصة قريتها: البطل والمشهد والعدو والسر والنهاية.'
  ar: 'أن تتحدث عن قصة قرأتها: البطل والمشهد والعدو والسر والنهاية.'
  en: 'Talk about a story you read: the hero, a scene, the enemy, the secret and the ending.'
slides:
  - title: Ngrembug cerkak
    body:
      ar_eg: |
        lakon = البطل أو حكاية المسرحية (lakone = بطل القصة)، adegan = مشهد.
        kendel = شجاع، musuh = عدو، rahasia = سر، tentrem = هادي ومطمّن.
        nyangka = يتوقع أو يفتكر: ora nyangka = ماكنتش متوقع. sedina = يوم واحد أو طول اليوم: sedina iku = في اليوم ده.
      ar: |
        lakon = البطل أو حكاية المسرحية (lakone = بطل القصة)، adegan = مشهد.
        kendel = شجاع، musuh = عدو، rahasia = سرّ، tentrem = هادئ آمن.
        nyangka = يتوقّع أو يظن: ora nyangka = لم أتوقّع. sedina = يوم واحد أو طوال اليوم: sedina iku = في ذلك اليوم.
      en: |
        lakon = the hero, or the story of a play (lakone = the story's hero), adegan = scene.
        kendel = brave, musuh = enemy, rahasia = secret, tentrem = peaceful.
        nyangka = expect, suppose: ora nyangka = didn't see it coming. sedina = one day, all day: sedina iku = that day.
    examples:
      - text: Lakone cerkak iki bocah wadon sing kendel.
        ar_eg: بطلة القصة دي بنت شجاعة.
        ar: بطلة هذه القصة فتاة شجاعة.
        en: The hero of this story is a brave girl.
      - text: Ing adegan pungkasan, desa dadi tentrem maneh.
        ar_eg: في المشهد الأخير، القرية رجعت هادية.
        ar: في المشهد الأخير عادت القرية آمنة.
        en: In the last scene, the village is peaceful again.
      - text: Aku ora nyangka musuhe kancane dhewe!
        ar_eg: ماكنتش متوقع إن عدوه يطلع صاحبه!
        ar: لم أتوقّع أن يكون عدوّه صديقه نفسه!
        en: I didn't expect his enemy to be his own friend!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: lakon
        ar_eg: البطل
        ar: البطل
        en: hero, main character
      - text: adegan
        ar_eg: مشهد
        ar: مشهد
        en: scene
      - text: kendel
        ar_eg: شجاع
        ar: شجاع
        en: brave
      - text: nyangka
        ar_eg: يتوقع
        ar: يتوقّع
        en: expect
    words: [lakon, adegan, kendel, nyangka]
  - id: e02
    type: match_pairs
    pairs:
      - text: tentrem
        ar_eg: هادي ومطمّن
        ar: آمن هادئ
        en: peaceful
      - text: sedina
        ar_eg: يوم واحد
        ar: يوم واحد
        en: one day, all day
      - text: musuh
        ar_eg: عدو
        ar: عدو
        en: enemy
      - text: rahasia
        ar_eg: سر
        ar: سرّ
        en: secret
    words: [tentrem, sedina, musuh, rahasia]
  - id: e03
    type: listen
    text: Lakone kendel banget, ora wedi karo musuh.
    question:
      ar_eg: البطل عامل إزاي؟
      ar: كيف البطل؟
      en: What is the hero like?
    options: [البطل شجاع ومش خايف من العدو, البطل خايف ومستخبي, البطل نايم طول اليوم]
    answer: 0
    meaning:
      ar_eg: البطل شجاع جدًا، مش خايف من العدو.
      ar: البطل شجاع جدًا ولا يخاف العدو.
      en: The hero is very brave, not afraid of the enemy.
    words: [lakon, kendel, musuh]
  - id: e04
    type: fill_blank
    sentence: Iki ___ sing paling apik ing crita iku.
    meaning:
      ar_eg: ده أحلى ___ في القصة.
      ar: هذا أجمل ___ في تلك القصة.
      en: This is the best ___ in that story.
    options: [adegan, musuh, sedina]
    answers: [adegan]
    words: [adegan, musuh, sedina]
    explain:
      ar_eg: adegan = مشهد. musuh = عدو وsedina = يوم كامل.
      ar: adegan تعني مشهد. أما musuh فعدو وsedina يوم كامل.
      en: adegan is a scene. musuh is an enemy and sedina is a whole day.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الشخصية الأساسية في القصة اسمها …
      ar: الشخصية الرئيسية في القصة تسمّى …
      en: A story's main character is its …
    options: [rahasia, lakon, nyangka]
    answer: 1
    explain:
      ar_eg: lakon = البطل. rahasia = سر.
      ar: lakon = البطل، وrahasia = سرّ.
      en: lakon = the hero; rahasia = a secret.
    words: [rahasia, lakon, nyangka]
  - id: e06
    type: fill_blank
    sentence: Aku ora ___ crita iki pungkasane seneng.
    meaning:
      ar_eg: ماكنتش ___ إن القصة دي تخلص نهاية سعيدة.
      ar: لم أ___ أن تنتهي هذه القصة نهاية سعيدة.
      en: I didn't ___ this story to end happily.
    options: [nyangka, kendel, rahasia]
    answers: [nyangka]
    words: [nyangka, kendel, rahasia]
    explain:
      ar_eg: ora nyangka = متوقعتش. kendel = شجاع وrahasia = سر، ومش أفعال.
      ar: ora nyangka تعني لم أتوقّع. أما kendel فشجاع وrahasia سرّ، وليستا فعلين.
      en: ora nyangka is "didn't expect". kendel is brave and rahasia is a secret; neither is a verb.
  - id: e07
    type: multiple_choice
    question: Desa iku ora ana perang, ___ banget.
    options: [kendel, sedina, tentrem]
    answer: 2
    explain:
      ar_eg: 'مفيش حرب = القرية هادية ومطمّنة: tentrem.'
      ar: 'لا حرب = القرية آمنة: tentrem.'
      en: 'No war: the village is peaceful, tentrem.'
    words: [kendel, sedina, tentrem]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ده سرّنا، ماشي؟
      ar: هذا سرّنا، اتفقنا؟
      en: This is our secret, okay?
    answer: Iki rahasia kita, ya?
    distractors: [musuh, lakon]
    words: [rahasia]
    explain:
      ar_eg: rahasia = سر. musuh = عدو وlakon = بطل الحكاية، ومش في المعنى.
      ar: rahasia تعني سرّ. أما musuh (عدو) وlakon (البطل) فليستا في المعنى.
      en: rahasia is a secret. musuh (enemy) and lakon (main character) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Sedina iku, desa sing tentrem dumadakan rame.
    answers_meaning:
      ar_eg: [في اليوم ده، القرية الهادية فجأة بقت دوشة, اليوم ده القرية الهادية اتقلبت فجأة]
      ar: [في ذلك اليوم صارت القرية الهادئة فجأة صاخبة, ذات يوم ضجّت القرية الهادئة فجأة]
      en: ['That day, the peaceful village suddenly got noisy', One day the quiet village suddenly became busy]
    words: [sedina, tentrem]
  - id: e10
    type: speaking
    text: Ing adegan iki, lakone weruh musuhe.
    meaning:
      ar_eg: في المشهد ده، البطل بيشوف عدوه.
      ar: في هذا المشهد يرى البطل عدوّه.
      en: In this scene, the hero sees his enemy.
    words: [adegan, lakon, musuh]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: Wis rampung maca cerkak sing tak wenehi?
      ar_eg: خلصت القصة اللي اديتهالك؟
      ar: هل أنهيت قراءة القصة التي أعطيتك إياها؟
      en: Have you finished the story I gave you?
    - speaker: Mohamed
      text: Wis. Lakone bocah wadon sing kendel banget.
      ar_eg: أيوه. البطلة بنت شجاعة جدًا.
      ar: نعم. بطلتها فتاة شجاعة جدًا.
      en: Yes. The hero is a really brave girl.
    - speaker: Mbak Ayu
      text: Adegan endi sing paling kok senengi?
      ar_eg: أنهي مشهد عجبك أكتر؟
      ar: أي مشهد أعجبك أكثر؟
      en: Which scene did you like best?
    - speaker: Mohamed
      text: Nalika dheweke ngerti rahasia musuhe. Aku ora nyangka!
      ar_eg: لما عرفت سر عدوها. ماكنتش متوقع!
      ar: حين عرفت سرّ عدوّها. لم أتوقّع ذلك!
      en: When she finds out her enemy's secret. I didn't see it coming!
    - speaker: Mbak Ayu
      text: Lan pungkasane?
      ar_eg: والنهاية؟
      ar: والنهاية؟
      en: And the ending?
    - speaker: Mohamed
      text: Desane tentrem maneh. Crita sing apik!
      ar_eg: القرية رجعت في أمان. قصة حلوة!
      ar: عادت القرية آمنة. قصة جميلة!
      en: The village is at peace again. A great story!
