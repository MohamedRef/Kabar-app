schema: kabar.lesson/v1
id: j6.u04.l07
language: jv
title: Ukara
can_do:
  ar_eg: تقرا وتبني جمل كاملة.
  ar: أن تقرأ جملًا كاملة وتركّبها.
  en: Read and build full sentences.
slides:
  - title: Kowe wis mangan?
    body:
      ar_eg: |
        دلوقتي عندك كل الأدوات عشان تقرا جملة كاملة. خد سؤال «أكلت؟» في مستويين:
        ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀ = Kowe wis mangan? (نغوكو): الـ s بتاعة wis شايلة pasangan ma.
        ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ = Sampeyan sampun nedha? (كراما): فيها أربع pasangan!
        الخط الجاوي معندوش علامة استفهام؛ السؤال بيبان من الكلام.
      ar: |
        صارت لديك أدوات قراءة جملة كاملة. خذ سؤال «هل أكلت؟» في مستويين:
        ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀ = Kowe wis mangan? (نغوكو): s في wis تحمل pasangan ma.
        ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ = Sampeyan sampun nedha? (كراما): وفيها أربع pasangan.
        ولا علامة استفهام في الخط الجاوي؛ يُفهم السؤال من الكلام.
      en: |
        You now have every tool to read a full sentence. Take "Have you eaten?" at two levels:
        ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀ = Kowe wis mangan? (ngoko): the s of wis carries pasangan ma.
        ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ = Sampeyan sampun nedha? (krama): four pasangan in it!
        Aksara Jawa has no question mark; the words make the question.
    grammar: jv.aksara.pasangan
    examples:
      - text: ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀ (Kowe wis mangan?)
        ar_eg: أكلت؟ (نغوكو)
        ar: هل أكلت؟ (نغوكو)
        en: Have you eaten? (ngoko)
      - text: ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ (Sampeyan sampun nedha?)
        ar_eg: حضرتك أكلت؟ (كراما)
        ar: هل أكلتَ؟ (كراما)
        en: Have you eaten? (krama)
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ أنهي مستوى؟
      ar: ما مستوى ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ؟
      en: Which level is ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ?
    options: [krama, ngoko, krama inggil]
    answer: 0
    explain:
      ar_eg: Sampeyan sampun nedha? = كراما. النغوكو Kowe wis mangan?، والـ krama inggil Panjenengan sampun dhahar?
      ar: Sampeyan sampun nedha? كراما، والنغوكو Kowe wis mangan?، والـ krama inggil Panjenengan sampun dhahar?
      en: Sampeyan sampun nedha? is krama. Ngoko is Kowe wis mangan?, krama inggil Panjenengan sampun dhahar?
  - id: e02
    type: listen
    text: Kowe wis mangan?
    question:
      ar_eg: سمعت أنهي جملة؟
      ar: أي جملة سمعت؟
      en: Which sentence did you hear?
    options: ["ꦏꦺꦴꦮꦺꦢꦸꦫꦸꦁꦩꦔꦤ꧀", "ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦠꦸꦫꦸ", "ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀"]
    answer: 2
    meaning:
      ar_eg: أكلت؟
      ar: هل أكلت؟
      en: Have you eaten?
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: في ꦮꦶꦱ꧀ꦩꦔꦤ꧀، الـ m بتاعة mangan مكتوبة إزاي؟
      ar: في ꦮꦶꦱ꧀ꦩꦔꦤ꧀، كيف كُتبت m في mangan؟
      en: In ꦮꦶꦱ꧀ꦩꦔꦤ꧀, how is the m of mangan written?
    options: [cecak, pasangan ma, layar]
    answer: 1
    explain:
      ar_eg: s بتاعة wis ساكنة ووراها m على طول، فـ ma بتتكتب pasangan تحت ꦱ.
      ar: s في wis ساكنة يليها m، فتُكتب ma pasangan تحت ꦱ.
      en: The s of wis is vowel-less right before m, so ma is written as a pasangan under ꦱ.
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀"
      ar: "اكتب بالحروف اللاتينية: ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀"
      en: "Write in Latin letters: ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀"
    answers: ["Kowe wis mangan?", kowe wis mangan, kowewismangan]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ"
      ar: "اكتب بالحروف اللاتينية: ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ"
      en: "Write in Latin letters: ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ"
    answers: ["Sampeyan sampun nedha?", sampeyan sampun nedha, sampeyansampunnedha]
  - id: e06
    type: build_sentence
    source:
      ar_eg: ابني «Aku seneng wayang» (أنا بحب الوايانغ). كل قطعة كلمة.
      ar: ركّب «Aku seneng wayang» (أحب الوايانغ). كل قطعة كلمة.
      en: Build "Aku seneng wayang" (I like wayang). Each tile is a word.
    answer: ꦲꦏꦸ ꦱꦼꦤꦼꦁ ꦮꦪꦁ
    distractors: ["ꦱꦼꦤꦼ"]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦧꦥꦏ꧀ꦠꦶꦤ꧀ꦢꦏ꧀ꦩꦼꦚꦁꦥꦱꦂ꧉"
      ar: "اكتب بالحروف اللاتينية: ꦧꦥꦏ꧀ꦠꦶꦤ꧀ꦢꦏ꧀ꦩꦼꦚꦁꦥꦱꦂ꧉"
      en: "Write in Latin letters: ꦧꦥꦏ꧀ꦠꦶꦤ꧀ꦢꦏ꧀ꦩꦼꦚꦁꦥꦱꦂ꧉"
    answers: ["Bapak tindak menyang pasar.", bapaktindakmenyangpasar]
    explain:
      ar_eg: ba-pak (pasangan ta) tin-dak (pasangan ma) me-nyang pa-sar = بابا رايح السوق.
      ar: ba-pak (pasangan ta) tin-dak (pasangan ma) me-nyang pa-sar = الأب ذاهب إلى السوق.
      en: ba-pak (pasangan ta) tin-dak (pasangan ma) me-nyang pa-sar = Father is going to the market.
  - id: e08
    type: dictation
    text: Kowe wis mangan?
    meaning:
      ar_eg: أكلت؟
      ar: هل أكلت؟
      en: Have you eaten?
  - id: e09
    type: speaking
    text: Kowe wis mangan? Sampeyan sampun nedha? Panjenengan sampun dhahar?
    meaning:
      ar_eg: أكلت؟ — بالتلات مستويات.
      ar: هل أكلت؟ — بالمستويات الثلاثة.
      en: Have you eaten? — in all three levels.
dialogue:
  title: Layang aksara Jawa
  lines:
    - speaker: Dimas
      text: Med, kowe nulis apa?
      ar_eg: يا محمد، بتكتب إيه؟
      ar: يا محمد، ماذا تكتب؟
      en: Med, what are you writing?
    - speaker: Mohamed
      text: Layang kanggo Pak Slamet, nganggo aksara Jawa.
      ar_eg: جواب لعمّو سلامت، بالخط الجاوي.
      ar: رسالة إلى السيد سلامت، بالخط الجاوي.
      en: A letter for Pak Slamet, in aksara Jawa.
    - speaker: Dimas
      text: Wah! Aja lali nganggo krama, ya.
      ar_eg: الله! ماتنساش تكتب بالكراما.
      ar: رائع! لا تنسَ أن تكتب بالكراما.
      en: Wow! Don't forget to use krama.
    - speaker: Mohamed
      text: Iya. Matur nuwun, Pak. Wis tak tulis, lho!
      ar_eg: أيوه. «شكرًا يا عمّو». كتبتها خلاص!
      ar: نعم. «شكرًا يا سيدي». كتبتها!
      en: Sure. "Matur nuwun, Pak." I've written it!
