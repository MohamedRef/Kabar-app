schema: kabar.lesson/v1
id: j6.u04.l07
language: jv
title: Ronda bengi
can_do:
  ar_eg: 'تشارك في حراسة الحارة بالليل: الكشك، الناموس، النار، والحرامي، وعادات الجيران في التعاون.'
  ar: 'أن تشارك في حراسة الحي ليلًا: الكشك والبعوض والنار واللص، وعادات الجيران في التعاون.'
  en: 'Join the neighbourhood night watch: the guard post, mosquitoes, a fire, a thief, and how neighbours help each other.'
slides:
  - title: Ing cakruk
    body:
      ar_eg: |
        cakruk = كشك صغير في الحارة بيقعدوا فيه وقت الحراسة بالليل. lemut = ناموس. geni = نار.
        nyolong = يسرق. ngoyak = يجري ورا حد. bengok = يزعّق.
        sambatan = الجيران بيساعدوا بعض في شغل كبير (زي بنا بيت) من غير فلوس.
        kenduren = عزومة دعا، الجيران بيتجمعوا ويدعوا وياكلوا.
      ar: |
        cakruk = كشك صغير في الحي يجلس فيه الحرّاس ليلًا. lemut = بعوض. geni = نار.
        nyolong = يسرق. ngoyak = يطارد. bengok = يصرخ.
        sambatan = تعاون الجيران في عمل كبير (كبناء بيت) بلا أجر.
        kenduren = وليمة دعاء يجتمع فيها الجيران للدعاء والأكل.
      en: |
        cakruk = a small neighbourhood hut where the night watch sits. lemut = mosquito. geni = fire.
        nyolong = steal. ngoyak = chase. bengok = shout.
        sambatan = neighbours working together unpaid on a big job (like building a house).
        kenduren = a communal prayer meal where neighbours gather, pray and eat.
    examples:
      - text: Bengi iki aku ronda ing cakruk, lemute ora karuan.
        ar_eg: الليلة دي أنا في الحراسة في الكشك، والناموس مالوش حل.
        ar: الليلة أحرس في الكشك، والبعوض لا يُطاق.
        en: Tonight I'm on watch at the cakruk; the mosquitoes are unbelievable.
      - text: Ana maling nyolong pitik, warga padha ngoyak.
        ar_eg: حرامي سرق فرخة، والأهالي جريوا وراه.
        ar: سرق لصّ دجاجة فطارده السكان.
        en: A thief stole a chicken, and the residents chased him.
      - text: Minggu ngarep ana sambatan mbangun omahe Pak RT, banjur kenduren.
        ar_eg: الأسبوع الجاي الجيران هيساعدوا يبنوا بيت عم رئيس الحارة، وبعدين عزومة دعا.
        ar: الأسبوع القادم يتعاون الجيران على بناء بيت رئيس الحي، ثم تُقام وليمة دعاء.
        en: Next week the neighbours will build the RT head's house together, then hold a kenduren.
