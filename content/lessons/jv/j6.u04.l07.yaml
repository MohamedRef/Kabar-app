  - id: e03
    type: listen
    text: Wong-wong bengok 'Maling!', banjur padha ngoyak.
    question:
      ar_eg: الناس عملت إيه؟
      ar: ماذا فعل الناس؟
      en: What did people do?
    options: [الناس زعّقت «حرامي!» وجريوا وراه, الناس نامت, الناس اتعشّت مع بعض]
    answer: 0
    meaning:
      ar_eg: الناس زعّقت «حرامي!» وبعدين جريوا وراه.
      ar: صاح الناس «لص!» ثم طاردوه.
      en: People shouted 'Thief!' and then gave chase.
    words: [bengok, ngoyak]
  - id: e04
    type: fill_blank
    sentence: Ana maling ___ montor ing gang.
    meaning:
      ar_eg: فيه حرامي ___ موتوسيكل في الحارة.
      ar: ___ لصٌّ دراجة نارية في الزقاق.
      en: A thief ___ a motorbike in the lane.
    options: [nyolong, bengok, cakruk]
    answers: [nyolong]
    words: [nyolong, bengok, cakruk]
    explain:
      ar_eg: nyolong = سرق. bengok = زعّق وcakruk = كشك الحراسة.
      ar: nyolong تعني سرق. أما bengok فصرخ وcakruk كوخ الحراسة.
      en: nyolong means stole. bengok is "shout" and cakruk is the watch hut.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لما الجيران بيساعدوا بعض يبنوا بيت من غير فلوس، ده اسمه …
      ar: حين يتعاون الجيران على بناء بيت بلا أجر، يسمّى ذلك …
      en: When neighbours build a house together for free, it's called …
    options: [kenduren, sambatan, lemut]
    answer: 1
    explain:
      ar_eg: sambatan = تعاون الجيران. kenduren = عزومة دعا، وlemut = ناموس.
      ar: sambatan = تعاون الجيران؛ kenduren = وليمة دعاء، وlemut = بعوض.
      en: sambatan = neighbourly work party; kenduren = prayer meal, lemut = mosquito.
    words: [kenduren, sambatan, lemut]
  - id: e06
    type: fill_blank
    sentence: Ing cakruk ana ___, aku dicokot terus.
    meaning:
      ar_eg: في الكشك فيه ___، وأنا بتقرص على طول.
      ar: في الكشك ___، وأنا أُلدغ باستمرار.
      en: There are ___ at the hut; I keep getting bitten.
    options: [lemut, geni, sambatan]
    answers: [lemut]
    words: [lemut, geni, sambatan]
    explain:
      ar_eg: lemut = ناموس، وهو اللي بيقرص. geni = نار وsambatan = مساعدة جماعية.
      ar: lemut البعوض الذي يلدغ. أما geni فنار وsambatan عون جماعي.
      en: lemut are mosquitoes, what bites. geni is fire and sambatan is neighbours helping out.
  - id: e07
    type: multiple_choice
    question: Kanggo ngusir lemut, bapak-bapak gawe ___ cilik.
    options: [geni, kenduren, nyolong]
    answer: 0
    explain:
      ar_eg: 'الدخان بيطرد الناموس، فبيولّعوا نار صغيرة: geni.'
      ar: 'الدخان يطرد البعوض، فيوقدون نارًا صغيرة: geni.'
      en: 'Smoke drives mosquitoes off, so they light a small fire: geni.'
    words: [geni, kenduren, nyolong]
  - id: e08
    type: build_sentence
    source:
      ar_eg: بالليل فيه عزومة دعا.
      ar: الليلة وليمة دعاء.
      en: Tonight there's a kenduren.
    answer: Mengko bengi ana kenduren.
    distractors: [cakruk, geni]
    words: [kenduren]
    explain:
      ar_eg: kenduren = عزومة دعاء. cakruk = كشك حراسة وgeni = نار، ومش في المعنى.
      ar: kenduren وليمة دعاء. أما cakruk (كوخ حراسة) وgeni (نار) فليستا في المعنى.
      en: kenduren is a prayer meal. cakruk (watch hut) and geni (fire) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Bapak-bapak ronda ing cakruk nganti esuk.
    answers_meaning:
      ar_eg: [الرجالة بيحرسوا في الكشك لحد الصبح, الرجالة قاعدين في كشك الحراسة لحد الصبح]
      ar: [يحرس الرجال في الكشك حتى الصباح, يتناوب الرجال الحراسة في الكشك حتى الصباح]
      en: [The men keep watch at the hut until morning, The men are on night watch in the cakruk till morning]
    words: [cakruk]
  - id: e10
    type: speaking
    text: Aja nyolong, mengko dioyak warga.
    meaning:
      ar_eg: ماتسرقش، الأهالي هيجروا وراك.
      ar: لا تسرق، وإلا طاردك السكان.
      en: Don't steal, or the residents will chase you.
    words: [nyolong, ngoyak]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, bengi iki melu ronda ing cakruk, yuk.
      ar_eg: يا محمد، تعالى معانا الحراسة في الكشك الليلة.
      ar: يا محمد، تعال معنا للحراسة في الكشك الليلة.
      en: Mohamed, come on the night watch at the cakruk tonight.
    - speaker: Mohamed
      text: Ayo! Nanging lemute akeh ora?
      ar_eg: يلا! بس فيه ناموس كتير؟
      ar: هيا! لكن هل البعوض كثير؟
      en: Sure! But are there lots of mosquitoes?
    - speaker: Mas Dimas
      text: Akeh, lho. Mula gawe geni cilik ing ngarep cakruk.
      ar_eg: كتير. عشان كده بنولّع نار صغيرة قدام الكشك.
      ar: كثير. لذلك نوقد نارًا صغيرة أمام الكشك.
      en: Loads. That's why we light a small fire in front of the hut.
    - speaker: Mohamed
      text: Yen ana maling nyolong, piye?
      ar_eg: ولو جه حرامي يسرق؟
      ar: وإن جاء لص يسرق؟
      en: And if a thief comes to steal?
    - speaker: Mas Dimas
      text: Ya bengok 'Maling!', banjur warga padha ngoyak.
      ar_eg: نزعّق «حرامي!» والأهالي يجروا وراه.
      ar: نصرخ «لص!» ثم يطارده السكان.
      en: We shout 'Thief!' and everyone gives chase.
    - speaker: Mohamed
      text: Wah, rame tenan.
      ar_eg: يا سلام، دي حكاية.
      ar: يا لها من مغامرة.
      en: Wow, that's quite something.
