language: jv
title: Garebeg ing alun-alun
can_do:
  ar_eg: تتفرّج على الجاريبيج في ميدان القصر، وتفهم إزاي خدّام القصر بيقفوا ويمشوا قدّام السلطان.
  ar: أن تشاهد الغاريبيغ في ميدان القصر، وتفهم كيف يقف خدم القصر ويمشون أمام السلطان.
  en: Watch the Garebeg at the palace square, and follow how retainers stand and move before the Sultan.
slides:
  - title: Garebeg, pisowanan, lampah dodok
    body:
      ar_eg: |
        - garebeg = احتفال القصر في يوجيا، 3 مرات في السنة (المولد، العيد الصغير، العيد الكبير). القصر بيطلّع gunungan (جبل رز وخضار) والناس بتتلمّ عليه.
        - waringin = شجرة التين البنغالي (beringin بالإندونيسي). في ميدان القصر فيه اتنين waringin جوه سور.
        - ngabekten = في شهر شوّال، خدّام القصر والعيلة بيعملوا sungkem للسلطان ويطلبوا السماح.
        - pisowanan = المقابلة الرسمية قدّام السلطان.
        - ngapurancang = تقف وإيديك متشبّكة قدّامك، اليمين فوق الشمال. ده وقوف الأدب.
        - lampah dodok = تمشي وانت قاعد على ركبك، زي ما الخدّام بيمشوا قدّام السلطان.
        - samir = الوشاح الأحمر والأصفر اللي خدّام القصر بيلبسوه حوالين رقبتهم.
      ar: |
        - garebeg = احتفال القصر في يوغيا ثلاث مرّات في السنة (المولد وعيد الفطر وعيد الأضحى). يُخرج القصر gunungan (جبلًا من الأرزّ والخضار) فيتجمّع الناس حوله.
        - waringin = شجرة التين البنغالي (beringin بالإندونيسية). وفي ميدان القصر شجرتا waringin داخل سور.
        - ngabekten = في شوّال يؤدّي خدم القصر والأسرة الـ sungkem للسلطان ويطلبون الصفح.
        - pisowanan = المقابلة الرسمية بين يدي السلطان.
        - ngapurancang = أن تقف ويداك متشابكتان أمامك، اليمنى فوق اليسرى، وهي وقفة الأدب.
        - lampah dodok = أن تمشي جاثيًا على ركبتيك، كما يمشي الخدم أمام السلطان.
        - samir = الوشاح الأحمر والأصفر الذي يلبسه خدم القصر حول الرقبة.
      en: |
        - garebeg = the Yogya palace festival, three times a year (the Prophet's birthday, Eid al-Fitr, Eid al-Adha). The palace carries out gunungan (mountains of rice and vegetables) and the crowd gathers round.
        - waringin = banyan tree (Indonesian beringin). The palace square has two fenced waringin.
        - ngabekten = in Syawal, retainers and family do sungkem to the Sultan and ask forgiveness.
        - pisowanan = a formal audience before the Sultan.
        - ngapurancang = standing with your hands folded in front, right over left: the polite way to stand.
        - lampah dodok = moving forward on your knees, as retainers do before the Sultan.
        - samir = the red and yellow sash retainers wear round the neck.
    examples:
      - text: Wonten garebeg ing alun-alun.
        ar_eg: فيه جاريبيج في الميدان.
        ar: يُقام الغاريبيغ في الميدان.
        en: There's a Garebeg at the square.
      - text: Kula ngadeg ngapurancang ing pisowanan.
        ar_eg: أنا واقف وإيديا متشبّكة في المقابلة.
        ar: أقف مشبّك اليدين في المقابلة.
        en: I stand with my hands folded at the audience.
      - text: Abdi dalem lampah dodok ing ngajeng Sultan.
        ar_eg: خدّام القصر بيمشوا على ركبهم قدّام السلطان.
        ar: يمشي خدم القصر جاثين أمام السلطان.
        en: The retainers move on their knees before the Sultan.
