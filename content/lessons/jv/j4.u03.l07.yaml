dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, sesuk ana Garebeg Sawal, lho. Ayo neng alun-alun!
      ar_eg: يا محمد، بكرة فيه جاريبيج العيد. يلا على الميدان!
      ar: يا محمد، غدًا غاريبيغ العيد. هيّا إلى الميدان!
      en: Mohamed, there's the Syawal Garebeg tomorrow. Let's go to the square!
    - speaker: Mohamed
      text: Ayo! Gunungane digawa saka Kraton, to?
      ar_eg: يلا! والجونونجان بيطلّعوه من القصر، صح؟
      ar: هيّا! والغونونغان يُحمل من القصر، أليس كذلك؟
      en: Let's! The gunungan comes out of the palace, right?
    - speaker: Mas Dimas
      text: Iya. Wong-wong padha ngenteni neng ngisor waringin.
      ar_eg: أيوه. الناس كلها بتستنى تحت شجرة الوارينجين.
      ar: نعم. ينتظر الناس تحت شجرة الوارينغين.
      en: Yes. Everyone waits under the banyan trees.
    - speaker: Pak Sastro
      text: Sugeng enjing, Mas Mohamed. Sakmenika kula badhe ngabekten ing Kraton.
      ar_eg: صباح الخير يا ماس محمد. أنا رايح دلوقتي الـ ngabekten في القصر.
      ar: صباح الخير يا ماس محمد. أنا ذاهب الآن إلى الـ ngabekten في القصر.
      en: Good morning, Mas Mohamed. I'm off to the ngabekten at the palace now.
    - speaker: Mohamed
      text: Pak, menika samir, nggih?
      ar_eg: يا أستاذ، ده الساميْر، صح؟
      ar: يا سيدي، هذا هو الساميْر، أليس كذلك؟
      en: Sir, that's the samir, isn't it?
    - speaker: Pak Sastro
      text: Inggih. Ing pisowanan, kula ngapurancang lan lampah dodok ing ngajeng Ngarsa Dalem.
      ar_eg: أيوه. في المقابلة بقف وإيديا متشبّكة وبمشي على ركبي قدّام السلطان.
      ar: نعم. في المقابلة أقف مشبّك اليدين وأمشي جاثيًا أمام السلطان.
      en: Yes. At the audience I stand with my hands folded and move on my knees before the Sultan.
