schema: kabar.lesson/v1
id: j4.u03.l07
language: jv
title: Pesen kagem Pak Sastro
can_do:
  ar_eg: تقرا وتكتب رسالة شكر لحد كبير، بالتواضع ليك والتبجيل ليه.
  ar: أن تقرأ رسالة شكر لكبير وتكتبها، بالتواضع لنفسك والتبجيل له.
  en: Read and write a thank-you message to an elder, humble for you and honorific for him.
slides:
  - title: Matur nuwun sampun rawuh
    body:
      ar_eg: |
        بعد الـ syukuran، محمد بعت رسالة واتساب لـ Pak Sastro. اقراها.
        نفس الجملة فيها الاتجاهين: Pak Sastro بيـ rawuh، ومحمد بيـ ngaturaken وبيـ sowan. وبيت Pak Sastro dalem، والهدية kagem Bapak.
      ar: |
        بعد الـ syukuran أرسل محمد رسالة واتساب إلى Pak Sastro. اقرأها.
        في الجملة الواحدة الاتجاهان: Pak Sastro يـ rawuh، ومحمد يـ ngaturaken ويـ sowan، وبيت Pak Sastro dalem، والهدية kagem Bapak.
      en: |
        After the syukuran, Mohamed sent Pak Sastro a WhatsApp message. Read it.
        Both directions in one message: Pak Sastro rawuh, Mohamed ngaturaken and sowan. Pak Sastro's home is dalem, and the present is kagem Bapak.
    grammar: jv.krama-andhap
    examples:
      - text: Pak Sastro, matur nuwun sampun rawuh wonten syukuran kula.
        ar_eg: يا Pak Sastro، شكرًا إنك شرّفت الـ syukuran بتاعتي.
        ar: يا Pak Sastro، شكرًا لتشريفك حفل الـ syukuran.
        en: Pak Sastro, thank you for coming to my syukuran.
      - text: Kula ngaturaken papirus saking Kairo kagem Bapak.
        ar_eg: بقدّم لحضرتك ورق بردي من القاهرة.
        ar: أقدّم لك ورق بردي من القاهرة.
        en: I'd like to give you a papyrus from Cairo, sir.
      - text: Minggu enjing kula badhe sowan dhateng dalemipun Bapak.
        ar_eg: يوم الحد الصبح هزور حضرتك في البيت.
        ar: سأزورك في بيتك صباح الأحد.
        en: On Sunday morning I'll call on you at your home, sir.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: محمد بيشكر Pak Sastro على إيه؟
      ar: على أي شيء يشكر محمد Pak Sastro؟
      en: What is Mohamed thanking Pak Sastro for?
    options: [sampun maringi buku, sampun ndherek dhateng Kraton, sampun rawuh wonten syukuran]
    answer: 2
    explain:
      ar_eg: «matur nuwun sampun rawuh wonten syukuran kula» = شكرًا إنك جيت الـ syukuran.
      ar: «matur nuwun sampun rawuh wonten syukuran kula» = شكرًا لحضورك الـ syukuran.
      en: '"matur nuwun sampun rawuh wonten syukuran kula" = thank you for coming to my syukuran.'
    words: [rawuh]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: محمد هيزور Pak Sastro إمتى؟
      ar: متى سيزور محمد Pak Sastro؟
      en: When will Mohamed visit Pak Sastro?
    options: [Setu sonten, Minggu enjing, Minggu sonten]
    answer: 1
    explain:
      ar_eg: «Minggu enjing kula badhe sowan» = يوم الحد الصبح هزوره.
      ar: «Minggu enjing kula badhe sowan» = سأزوره صباح الأحد.
      en: '"Minggu enjing kula badhe sowan" = I''ll visit on Sunday morning.'
    words: [sowan]
  - id: e03
    type: listen
    text: Kula ngaturaken papirus saking Kairo kagem Bapak.
    question:
      ar_eg: محمد بيدّي Pak Sastro إيه؟
      ar: ماذا يقدّم محمد إلى Pak Sastro؟
      en: What is Mohamed giving Pak Sastro?
    options: [bakpia, batik, papirus]
    answer: 2
    meaning:
      ar_eg: بقدّم لحضرتك ورق بردي من القاهرة.
      ar: أقدّم لك ورق بردي من القاهرة.
      en: I'd like to give you a papyrus from Cairo, sir.
    words: [ngaturaken]
  - id: e04
    type: match_pairs
    pairs:
      - text: rawuh
        ar_eg: ييجي (للكبير)
        ar: يأتي (للكبير)
        en: come (of an elder)
      - text: ngaturaken
        ar_eg: يقدّم لحد كبير (تواضع)
        ar: يقدّم لكبير (تواضع)
        en: offer to an elder (humble)
      - text: sowan
        ar_eg: يزور حد كبير (تواضع)
        ar: يزور كبيرًا (تواضع)
        en: call on an elder (humble)
      - text: dalem
        ar_eg: بيت (الكبير)
        ar: بيت (الكبير)
        en: home (an elder's)
      - text: syukuran
        ar_eg: عزومة شكر
        ar: حفل شكر
        en: thanksgiving get-together
    words: [rawuh, ngaturaken, sowan, dalem, syukuran]
  - id: e05
    type: fill_blank
    sentence: Kula ___ papirus saking Kairo kagem Bapak.
    meaning:
      ar_eg: بقدّم لحضرتك ورق بردي من القاهرة.
      ar: أقدّم لك ورق بردي من القاهرة.
      en: I'd like to give you a papyrus from Cairo, sir.
    options: [maringi, ngaturaken, mundhut]
    answers: [ngaturaken]
    explain:
      ar_eg: إنت بتدّي حد كبير، يبقى ngaturaken. maringi لما الكبير هو اللي بيدّي، وmundhut لما الكبير بياخد أو يشتري.
      ar: أنت تعطي كبيرًا فتقول ngaturaken، وmaringi حين يعطي الكبير، وmundhut حين يأخذ أو يشتري.
      en: You're giving to an elder, so ngaturaken. maringi is when the elder gives; mundhut is when he takes or buys.
    words: [ngaturaken]
  - id: e06
    type: build_sentence
    source:
      ar_eg: يوم الحد الصبح هزور حضرتك في البيت.
      ar: سأزورك في بيتك صباح الأحد.
      en: On Sunday morning I'll call on you at your home, sir.
    answer: Minggu enjing kula badhe sowan dhateng dalemipun Bapak.
    distractors: [rawuh, griyanipun]
    explain:
      ar_eg: إنت اللي بتزور (sowan)، وبيت الكبير dalem.
      ar: أنت الزائر (sowan)، وبيت الكبير dalem.
      en: You're the visitor (sowan); the elder's house is dalem.
    words: [sowan, dalem]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: شكرًا إنك جيت الـ syukuran بتاعتي يا أستاذ.
      ar: شكرًا لحضورك حفل الـ syukuran يا سيدي.
      en: Thank you for coming to my syukuran, sir.
    answers:
      - Matur nuwun sampun rawuh wonten syukuran kula, Pak.
      - Pak, matur nuwun sampun rawuh wonten syukuran kula.
      - Matur nuwun sanget sampun rawuh wonten syukuran kula, Pak.
      - Matur nuwun Bapak sampun rawuh wonten syukuran kula.
    explain:
      ar_eg: الكبير هو اللي جه، يبقى rawuh.
      ar: الآتي هو الكبير فتقول rawuh.
      en: The elder is the one who came, so rawuh.
    words: [rawuh, syukuran]
  - id: e08
    type: speaking
    text: Kula ngaturaken papirus saking Kairo, Pak.
    meaning:
      ar_eg: بقدّم لحضرتك ورق بردي من القاهرة يا أستاذ.
      ar: أقدّم لك ورق بردي من القاهرة يا سيدي.
      en: I'd like to give you a papyrus from Cairo, sir.
    words: [ngaturaken]
dialogue:
  title: Pak Sastro telpon
  lines:
    - speaker: Pak Sastro
      text: Mas Mohamed, matur nuwun papirusipun.
      ar_eg: يا محمد، شكرًا على ورق البردي.
      ar: يا محمد، شكرًا على ورق البردي.
      en: Mohamed, thank you for the papyrus.
    - speaker: Mohamed
      text: Sami-sami, Pak. Minggu enjing kula badhe sowan.
      ar_eg: العفو يا أستاذ. يوم الحد الصبح هزورك.
      ar: عفوًا يا سيدي. سأزورك صباح الأحد.
      en: You're welcome, sir. I'll come and see you on Sunday morning.
    - speaker: Pak Sastro
      text: Inggih, Mas. Mangga. Jam pinten?
      ar_eg: ماشي يا ابني. اتفضل. الساعة كام؟
      ar: حسنًا يا بني، تفضّل. في أي ساعة؟
      en: All right, please do. What time?
    - speaker: Mohamed
      text: Jam sanga, Pak.
      ar_eg: الساعة تسعة يا أستاذ.
      ar: في التاسعة يا سيدي.
      en: Nine o'clock, sir.
    - speaker: Pak Sastro
      text: Inggih, Mas. Matur nuwun.
      ar_eg: ماشي يا ابني. شكرًا.
      ar: حسنًا يا بني. شكرًا.
      en: All right. Thank you.
review:
