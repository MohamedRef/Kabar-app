schema: kabar.lesson/v1
id: j5.u01.l04
language: jv
title: Tebing lan pegunungan
can_do:
  ar_eg: 'تقرا وصف المكان في مقالة جغرافيا: الجبال والجروف والحدود والشجر والحيوانات.'
  ar: 'أن تقرأ وصف المكان في مقالة جغرافية: الجبال والجروف والحدود والأشجار والحيوانات.'
  en: 'Read how a geography article describes a place: mountains, cliffs, borders, trees and wildlife.'
slides:
  - title: Artikel geografi
    body:
      ar_eg: |
        مقالات ويكيبيديا عن أي منطقة بتوصف الأرض: pegunungan = منطقة جبلية (من gunung)، tebing = جرف، kawasan = منطقة، wates = حدود.
        وبعدين اللي عايش فيها: wit-witan = شجر كتير (التكرار = جمع)، tumbuhan = نباتات، satwa = حيوانات برية، pari = نبات الرز في الغيط.
      ar: |
        تصف مقالات ويكيبيديا عن أي منطقة طبيعتها: pegunungan = منطقة جبلية (من gunung)، tebing = جُرف، kawasan = منطقة، wates = حدود.
        ثم ما يعيش فيها: wit-witan = أشجار (التكرار للجمع)، tumbuhan = نباتات، satwa = حيوانات برية، pari = نبات الأرز في الحقل.
      en: |
        A Wikipedia article about a region first describes the land: pegunungan = highlands (from gunung), tebing = cliff, kawasan = area, wates = border.
        Then what lives there: wit-witan = trees (doubling = many), tumbuhan = plants, satwa = wildlife, pari = the rice plant in the field.
    examples:
      - text: Dieng iku kawasan pegunungan sing adhem.
        ar_eg: ديينج منطقة جبلية باردة.
        ar: ديينغ منطقة جبلية باردة.
        en: Dieng is a cold highland area.
      - text: Kali iki dadi wates desa loro.
        ar_eg: النهر ده هو الحدود بين قريتين.
        ar: هذا النهر هو الحدّ بين قريتين.
        en: This river is the border between two villages.
      - text: Ing kawasan iki akeh wit-witan, tumbuhan lan satwa.
        ar_eg: المنطقة دي فيها شجر ونباتات وحيوانات كتير.
        ar: في هذه المنطقة أشجار ونباتات وحيوانات كثيرة.
        en: This area has many trees, plants and animals.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tebing
        ar_eg: جرف
        ar: جُرف
        en: cliff
      - text: wates
        ar_eg: حدود
        ar: حدود
        en: border
      - text: kawasan
        ar_eg: منطقة
        ar: منطقة
        en: area
      - text: pari
        ar_eg: نبات الرز
        ar: نبات الأرز
        en: rice plant
    words: [tebing, wates, kawasan, pari]
  - id: e02
    type: match_pairs
    pairs:
      - text: pegunungan
        ar_eg: منطقة جبلية
        ar: منطقة جبلية
        en: highlands
      - text: wit-witan
        ar_eg: شجر
        ar: أشجار
        en: trees
      - text: satwa
        ar_eg: حيوانات برية
        ar: حيوانات برية
        en: wildlife
      - text: tumbuhan
        ar_eg: نباتات
        ar: نباتات
        en: plants
    words: [pegunungan, wit-witan, satwa, tumbuhan]
  - id: e03
    type: listen
    text: Ing pinggir pantai ana tebing dhuwur.
    question:
      ar_eg: فيه إيه على الشط؟
      ar: ماذا يوجد على الشاطئ؟
      en: What is at the beach?
    options: [جرف عالي, غيط رز, شجر كتير]
    answer: 0
    meaning:
      ar_eg: على حرف الشط فيه جرف عالي.
      ar: على طرف الشاطئ جُرف عالٍ.
      en: At the edge of the beach there's a high cliff.
    words: [tebing]
  - id: e04
    type: fill_blank
    sentence: Kali iki dadi ___ desa loro.
    meaning:
      ar_eg: النهر ده هو ___ بين قريتين.
      ar: هذا النهر هو ___ بين قريتين.
      en: This river is the ___ between two villages.
    options: [wates, satwa, tebing]
    answers: [wates]
    words: [wates, satwa, tebing]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «كل أنواع النباتات»؟
      ar: أي كلمة تعني «كل أنواع النباتات»؟
      en: Which word means 'all kinds of plants'?
    options: [kawasan, tumbuhan, pari]
    answer: 1
    explain:
      ar_eg: 'tumbuhan = نباتات. pari نبات واحد بس: الرز.'
      ar: tumbuhan = نباتات، أما pari فنبات واحد هو الأرز.
      en: tumbuhan = plants in general; pari is one plant, rice.
    words: [kawasan, tumbuhan, pari]
  - id: e06
    type: fill_blank
    sentence: Dieng ana ing kawasan ___ sing adhem.
    meaning:
      ar_eg: ديينج في منطقة ___ باردة.
      ar: تقع ديينغ في منطقة ___ باردة.
      en: Dieng is in a cold ___ area.
    options: [pegunungan, tumbuhan, wates]
    answers: [pegunungan]
    words: [pegunungan, tumbuhan, wates, kawasan]
  - id: e07
    type: multiple_choice
    question: Macan, gajah lan manuk kalebu ___.
    options: [wit-witan, tebing, satwa]
    answer: 2
    explain:
      ar_eg: 'النمر والفيل والعصفور حيوانات: satwa.'
      ar: 'النمر والفيل والطائر حيوانات: satwa.'
      en: 'Tigers, elephants and birds are wildlife: satwa.'
    words: [wit-witan, tebing, satwa]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المنطقة دي فيها شجر كتير.
      ar: في هذه المنطقة أشجار كثيرة.
      en: This area has many trees.
    answer: Ing kawasan iki akeh wit-witan.
    distractors: [tebing, satwa]
    words: [kawasan, wit-witan]
  - id: e09
    type: translate
    direction: from_target
    source_text: Satwa lan tumbuhan ing kawasan iki dijaga.
    answers_meaning:
      ar_eg: [الحيوانات والنباتات في المنطقة دي محمية, بيحافظوا على الحيوانات والنباتات في المنطقة دي]
      ar: [الحيوانات والنباتات في هذه المنطقة محميّة, يُحافَظ على الحيوانات والنباتات في هذه المنطقة]
      en: [The animals and plants in this area are protected, Wildlife and plants in this area are protected]
    words: [satwa, tumbuhan, kawasan]
  - id: e10
    type: speaking
    text: Ing pegunungan akeh sawah pari.
    meaning:
      ar_eg: في المنطقة الجبلية فيه غيطان رز كتير.
      ar: في المنطقة الجبلية حقول أرز كثيرة.
      en: There are many rice fields in the highlands.
    words: [pegunungan, pari]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, iki artikel babagan Gunung Ungaran.
      ar_eg: يا محمد، دي مقالة عن جبل أونجاران.
      ar: يا محمد، هذه مقالة عن جبل أونغاران.
      en: Mohamed, here's an article about Mount Ungaran.
    - speaker: Mohamed
      text: Ana ing sisih ngendi saka Semarang?
      ar_eg: هو فين بالنسبة لسيمارانج؟
      ar: في أي جهة من سيمارانغ يقع؟
      en: Which side of Semarang is it on?
    - speaker: Mbak Ayu
      text: Ing sisih kidul. Kawasan pegunungan iku akeh wit-witan.
      ar_eg: في الجنوب. المنطقة الجبلية دي فيها شجر كتير.
      ar: في الجنوب. وفي تلك المنطقة الجبلية أشجار كثيرة.
      en: To the south. That highland area has lots of trees.
    - speaker: Mohamed
      text: Ana satwa apa wae?
      ar_eg: فيه حيوانات إيه؟
      ar: ما الحيوانات التي فيها؟
      en: What wildlife is there?
    - speaker: Mbak Ayu
      text: Akeh manuk. Nanging ati-ati, ana tebing.
      ar_eg: عصافير كتير. بس خلي بالك، فيه جروف.
      ar: طيور كثيرة. لكن احذر، فيها جروف.
      en: Lots of birds. But careful, there are cliffs.
    - speaker: Mohamed
      text: Apik tenan. Ayo mrana!
      ar_eg: حلو أوي. يلا نروح!
      ar: رائع حقًا. هيا نذهب إلى هناك!
      en: Great. Let's go there!
