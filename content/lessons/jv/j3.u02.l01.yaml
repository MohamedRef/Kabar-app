schema: kabar.lesson/v1
id: j3.u02.l01
language: jv
title: Kula
can_do:
  ar_eg: تقول «أنا» بالكراما.
  ar: أن تقول «أنا» بالكراما.
  en: Say I in krama.
slides:
  - title: Aku → kula
    body:
      ar_eg: |
        في J1 قلت aku. دلوقتي مع الكبار والناس الغريبة والبياعين قول kula. زي الإندونيسي بالظبط: aku للصحاب وsaya للمؤدب.
        - aku = aku (ngoko)
        - kula = saya (krama)
        في الشات هتلاقيها kulo، وده نفس النطق (الـ a في الآخر بتتنطق قريبة من o).
      ar: |
        قلتَ aku في J1، والآن مع الكبار والغرباء والباعة تقول kula، تمامًا كالإندونيسية: aku للأصدقاء وsaya للتأدب.
        - aku = aku (ngoko)
        - kula = saya (krama)
        وفي الدردشة تُكتب kulo، وهو النطق نفسه (الـ a الأخيرة تُنطق قريبة من o).
      en: |
        In J1 you said aku. With elders, strangers and sellers, say kula. Just like Indonesian: aku with friends, saya when polite.
        - aku = aku (ngoko)
        - kula = saya (krama)
        In chats it's written kulo — same sound (the final a is said close to o).
    grammar: jv.pronoun.krama
    examples:
      - text: Kula Mohamed.
        ar_eg: أنا محمد.
        ar: أنا محمد.
        en: I'm Mohamed.
      - text: Kula saking Mesir.
        ar_eg: أنا من مصر. (saking = saka بالكراما = dari)
        ar: أنا من مصر. (saking = saka بالكراما = dari)
        en: I'm from Egypt. (saking = krama saka = dari)
  - title: Nami kula…
    body:
      ar_eg: |
        «بتاعي» في الكراما مش -ku. بتحط kula بعد الاسم، زي الإندونيسي nama saya:
        - jenengku ← nami kula (nama saya) = اسمي
        - omahku ← griya kula (rumah saya) = بيتي
        وخد بالك: الاسم نفسه اتغيّر! jeneng بقت nami، وomah بقت griya. ده الجاوي: الكلمات نفسها بتلبس «بدلة» الكراما.
      ar: |
        الملكية في الكراما ليست بـ -ku، بل بوضع kula بعد الاسم كالإندونيسية nama saya:
        - jenengku ← nami kula (nama saya) = اسمي
        - omahku ← griya kula (rumah saya) = بيتي
        ولاحظ أن الاسم نفسه تغيّر: jeneng صارت nami، وomah صارت griya؛ فالألفاظ نفسها تلبس ثوب الكراما.
      en: |
        "My" in krama isn't -ku. Put kula after the noun, like Indonesian nama saya:
        - jenengku → nami kula (nama saya) = my name
        - omahku → griya kula (rumah saya) = my house
        Notice the noun changed too: jeneng became nami, omah became griya. That's Javanese — the words themselves put on their krama suit.
    grammar: jv.pronoun.krama
    examples:
      - text: Nami kula Mohamed.
        ar_eg: اسمي محمد.
        ar: اسمي محمد.
        en: My name is Mohamed.
      - text: Menika griya kula.
        ar_eg: ده بيتي. (menika = iki بالكراما)
        ar: هذا بيتي. (menika = iki بالكراما)
        en: This is my house. (menika = krama iki)
  - title: Dalem?
    body:
      ar_eg: |
        فيه «أنا» أكتر تواضعًا كمان: dalem. وأشهر استخدام ليها: لما حد كبير يناديك باسمك، ماتقولش «Apa?» (إيه؟). قول «Dalem?» — بالظبط زي «أفندم؟» عندنا.
      ar: |
        وهناك «أنا» أشد تواضعًا: dalem. وأشهر استعمالها: إذا ناداك كبير باسمك فلا تقل «Apa?» (ماذا؟) بل «Dalem?» — تمامًا مثل «أفندم؟».
      en: |
        There's an even humbler "I": dalem. Its best-known use: when an elder calls your name, don't say "Apa?" (what?). Say "Dalem?" — exactly like Egyptian «أفندم؟».
    grammar: jv.pronoun.krama
    examples:
      - text: — Mas Mohamed! — Dalem, Bu?
        ar_eg: — يا أستاذ محمد! — أفندم يا مدام؟
        ar: — يا محمد! — نعم يا سيدتي؟
        en: — Mohamed! — Yes, ma'am?
  - title: Kula + nedha, dudu dhahar
    body:
      ar_eg: |
        kula بتمشي مع كلمات الكراما العادية، مش krama inggil. إنت مش هتعظّم نفسك:
        - Kula sampun nedha. ✓ (مش Kula sampun dhahar)
        - Nami kula Mohamed. ✓ (مش Asma kula — asma كلمة تعظيم لاسم التاني)
      ar: |
        تأتي kula مع ألفاظ الكراما العادية لا مع krama inggil، فلا يعظّم المرء نفسه:
        - Kula sampun nedha. ✓ (لا Kula sampun dhahar)
        - Nami kula Mohamed. ✓ (لا Asma kula؛ فـ asma لتعظيم اسم الغير)
      en: |
        kula goes with plain krama words, never krama inggil — you don't honour yourself:
        - Kula sampun nedha. ✓ (not Kula sampun dhahar)
        - Nami kula Mohamed. ✓ (not Asma kula — asma honours someone else's name)
    grammar: jv.pronoun.krama
    examples:
      - text: Kula sampun nedha.
        ar_eg: أنا كلت.
        ar: قد أكلتُ.
        en: I've eaten.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: Bu Siti نادتك «Mas Mohamed!». ترد تقول إيه؟
      ar: نادتك Bu Siti «Mas Mohamed!». بمَ تجيب؟
      en: Bu Siti calls "Mas Mohamed!". What do you answer?
    options: ['Dalem, Bu?', 'Sugeng rawuh, Bu!', 'Apa?']
    answer: 0
    explain:
      ar_eg: «Dalem?» = «أفندم؟». «Sugeng rawuh» بتقولها لضيف لسه واصل، و«Apa?» لوحدها تبان ناشفة مع حد أكبر منك.
      ar: «Dalem?» = «أفندم؟». «Sugeng rawuh» ترحيب بضيف وصل، و«Apa?» وحدها جافة مع الأكبر.
      en: '"Dalem?" = «أفندم؟». "Sugeng rawuh" welcomes an arriving guest; a bare "Apa?" sounds blunt to an elder.'
    words: [dalem, sugeng rawuh]
  - id: e02
    type: listen
    text: Dalem, Bu? Menika griya kula.
    options: ['Dalem, Bu? Menika griya kula.', 'Dalem, Bu? Menika griya sampeyan.', 'Apa, Bu? Iki omahku.']
    answer: 0
    words: [dalem, menika, griya, kula]
  - id: e03
    type: match_pairs
    pairs:
      - text: nami
        ar_eg: اسم (krama) = nama
        ar: اسم (krama) = nama
        en: name (krama) = nama
      - text: griya
        ar_eg: بيت (krama) = rumah
        ar: بيت (krama) = rumah
        en: house (krama) = rumah
      - text: dalem
        ar_eg: أفندم؟ لما حد كبير يناديك
        ar: أفندم؟ حين يناديك الأكبر
        en: Yes? (answering an elder)
      - text: saking
        ar_eg: من (krama) = dari
        ar: من (krama) = dari
        en: from (krama) = dari
      - text: menika
        ar_eg: ده / دي (krama) = ini
        ar: هذا / هذه (krama) = ini
        en: this (krama) = ini
      - text: sugeng rawuh
        ar_eg: أهلًا بيك = selamat datang
        ar: أهلًا بك = selamat datang
        en: welcome = selamat datang
    words: [nami, griya, dalem, saking, menika, sugeng rawuh]
  - id: e04
    type: build_sentence
    source:
      ar_eg: اسمي محمد. أنا من مصر. (بالكراما)
      ar: اسمي محمد. أنا من مصر. (بالكراما)
      en: My name is Mohamed. I'm from Egypt. (krama)
    answer: Nami kula Mohamed. Kula saking Mesir.
    distractors: [jeneng, aku, saka]
    words: [nami, kula, saking]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ده بيتي. (بالكراما)
      ar: هذا بيتي. (بالكراما)
      en: This is my house. (krama)
    answers: [Menika griya kula., Menika griya kulo., Menika griya kula, Menika griya kulo, Niki griya kula., Niki griya kulo., Niki griya kula, Niki griya kulo]
    explain:
      ar_eg: iki ← menika (وفي الكلام niki)، omahku ← griya kula.
      ar: iki ← menika (وفي الكلام niki)، وomahku ← griya kula.
      en: iki → menika (spoken niki), omahku → griya kula.
    words: [menika, griya, kula]
  - id: e06
    type: speaking
    text: Sugeng rawuh, Bu. Nami kula Mohamed, saking Mesir.
    meaning:
      ar_eg: أهلًا بحضرتك يا مدام. اسمي محمد، من مصر.
      ar: أهلًا بكِ يا سيدتي. اسمي محمد، من مصر.
      en: Welcome, ma'am. My name is Mohamed, from Egypt.
    words: [sugeng rawuh, nami, kula, saking]
dialogue:
  title: Kenalan ing Pasar Kranggan
  lines:
    - speaker: Bu Siti
      text: Sugeng enjing, Mas.
      ar_eg: صباح الخير يا أستاذ.
      ar: صباح الخير يا أخي.
      en: Good morning, young man.
    - speaker: Mohamed
      text: Sugeng enjing, Bu. Nami kula Mohamed.
      ar_eg: صباح النور يا مدام. اسمي محمد.
      ar: صباح النور يا سيدتي. اسمي محمد.
      en: Good morning, ma'am. My name is Mohamed.
    - speaker: Bu Siti
      text: Mas Mohamed saking Jakarta?
      ar_eg: حضرتك من جاكرتا يا أستاذ محمد؟
      ar: هل أنت من جاكرتا يا محمد؟
      en: Are you from Jakarta, Mohamed?
    - speaker: Mohamed
      text: Kula saking Mesir, Bu. Saking Kairo.
      ar_eg: أنا من مصر يا مدام. من القاهرة.
      ar: أنا من مصر يا سيدتي، من القاهرة.
      en: I'm from Egypt, ma'am. From Cairo.
    - speaker: Bu Siti
      text: Wah, Mesir! Sugeng rawuh, Mas.
      ar_eg: الله، مصر! أهلًا بيك يا أستاذ.
      ar: ما شاء الله، مصر! أهلًا بك يا أخي.
      en: Oh, Egypt! Welcome, young man.
    - speaker: Mohamed
      text: Matur nuwun, Bu.
      ar_eg: شكرًا يا مدام.
      ar: شكرًا يا سيدتي.
      en: Thank you, ma'am.
new_words:
  - word: nami
    pos: noun
    ar_eg: اسم (krama لـ jeneng) = nama
    ar: اسم (krama لـ jeneng) = nama
    en: name (krama for jeneng) = nama
  - word: griya
    pos: noun
    ar_eg: بيت (krama لـ omah) = rumah
    ar: بيت (krama لـ omah) = rumah
    en: house (krama for omah) = rumah
  - word: dalem
    pos: pronoun
    ar_eg: أنا (متواضعة جدًا)، و«Dalem?» = أفندم؟ لما حد كبير يناديك
    ar: أنا (شديدة التواضع)، و«Dalem?» = أفندم؟ عند نداء الكبير
    en: I (very humble); "Dalem?" = yes? when an elder calls you
  - word: saking
    pos: preposition
    ar_eg: من (krama لـ saka) = dari
    ar: من (krama لـ saka) = dari
    en: from (krama for saka) = dari
  - word: menika
    pos: pronoun
    ar_eg: ده / دي (krama لـ iki، في الكلام niki) = ini
    ar: هذا / هذه (krama لـ iki، وفي الكلام niki) = ini
    en: this (krama for iki; spoken niki) = ini
  - word: sugeng rawuh
    pos: phrase
    ar_eg: أهلًا بيك / نوّرت (krama) = selamat datang
    ar: أهلًا وسهلًا (krama) = selamat datang
    en: welcome (krama) = selamat datang
