schema: kabar.lesson/v1
id: j3.u06.l09
language: jv
title: Sinau damel batik
can_do:
  ar_eg: تقرا إعلان ورشة باتيك بالكراما وتسجّل فيها بأدب.
  ar: أن تقرأ إعلان ورشة باتيك بالكراما وتسجّل فيها بأدب.
  en: Read a krama poster for a batik class and sign up politely.
slides:
  - title: Pengumuman ing Giriloyo
    body:
      ar_eg: |
        على حيطة في Giriloyo فيه إعلان صغير عن ورشة باتيك. اقراه:
        nerangaken = يشرح، caranipun = الطريقة، ngginakaken = باستعمال.
      ar: |
        على جدار في Giriloyo إعلان صغير عن ورشة باتيك. اقرأه:
        nerangaken = يشرح، وcaranipun = الطريقة، وngginakaken = باستعمال.
      en: |
        On a wall in Giriloyo there's a small poster for a batik class. Read it:
        nerangaken = explain, caranipun = the way (how to), ngginakaken = using.
    examples:
      - text: Sinau damel batik tulis wonten Giriloyo!
        ar_eg: اتعلّم تعمل باتيك مرسوم باليد في Giriloyo!
        ar: تعلّم صنع الباتيك المرسوم باليد في Giriloyo!
        en: Learn to make hand-drawn batik in Giriloyo!
      - text: Pak Harjo badhe nerangaken caranipun.
        ar_eg: Pak Harjo هيشرح الطريقة.
        ar: سيشرح Pak Harjo الطريقة.
        en: Pak Harjo will explain how it's done.
      - text: Reginipun satus ewu. Canthing lan malam saking Pak Harjo.
        ar_eg: السعر مية ألف. القلم (canthing) والشمع من عند Pak Harjo.
        ar: السعر مئة ألف. القلم (canthing) والشمع من Pak Harjo.
        en: The price is 100,000. Canthing and wax come from Pak Harjo.
    grammar: jv.krama.affixes
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: (من الإعلان) هتتعلم تعمل إيه؟
      ar: (من الإعلان) ماذا ستتعلم أن تصنع؟
      en: (from the poster) What will you learn to make?
    options: [batik cap, batik tulis, canthing]
    answer: 1
    words: [batik tulis, damel]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: (من الإعلان) مين اللي هيشرح؟
      ar: (من الإعلان) من الذي سيشرح؟
      en: (from the poster) Who will explain?
    options: [Pak Harjo, Bu Siti, Mas Dimas]
    answer: 0
    words: [nerangaken]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: (من الإعلان) الورشة بكام؟
      ar: (من الإعلان) بكم الورشة؟
      en: (from the poster) How much is the class?
    options: [seket ewu, kalih atus ewu, satus ewu]
    answer: 2
    words: [regi, ewu]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: (من الإعلان) لازم تجيب canthing معاك؟
      ar: (من الإعلان) هل يجب أن تُحضر canthing معك؟
      en: (from the poster) Do you need to bring your own canthing?
    options: ['Inggih.', 'Mboten, saking Pak Harjo.']
    answer: 1
    explain:
      ar_eg: الإعلان بيقول «Canthing lan malam saking Pak Harjo» = هو اللي بيوفرهم.
      ar: يقول الإعلان «Canthing lan malam saking Pak Harjo»، أي أنه يوفّرهما.
      en: The poster says "Canthing lan malam saking Pak Harjo" — he provides them.
    words: [canthing, malam]
  - id: e05
    type: listen
    text: Pak Harjo badhe nerangaken caranipun.
    options: ['Pak Harjo badhe nerangaken caranipun.', 'Pak Harjo badhe damelaken teh.', 'Pak Harjo sampun nerangaken caranipun.']
    answer: 0
    meaning:
      ar_eg: Pak Harjo هيشرح الطريقة.
      ar: سيشرح Pak Harjo الطريقة.
      en: Pak Harjo will explain how it's done.
    words: [nerangaken, caranipun]
  - id: e06
    type: match_pairs
    pairs:
      - text: canthing
        ar_eg: قلم نحاس صغير للشمع
        ar: قلم نحاسي صغير للشمع
        en: small copper wax pen
      - text: malam
        ar_eg: شمع الباتيك
        ar: شمع الباتيك
        en: batik wax
      - text: kain
        ar_eg: قماش
        ar: قماش
        en: cloth
      - text: nerangaken
        ar_eg: يشرح
        ar: يشرح
        en: to explain
    words: [canthing, malam, kain, nerangaken]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: 'سجّل في الورشة: لا مؤاخذة يا حاج، عايز أتعلم أعمل باتيك مرسوم باليد.'
      ar: 'سجّل في الورشة: عفوًا يا سيدي، أريد أن أتعلم صنع الباتيك المرسوم باليد.'
      en: "Sign up for the class: Excuse me, sir, I'd like to learn to make hand-drawn batik."
    answers: ["Nyuwun sewu, Pak, kula badhe sinau damel batik tulis.", "Nyuwun sewu, Pak, kulo badhe sinau damel batik tulis.", "Nyuwun sewu, Pak. Kula badhe sinau damel batik tulis.", "Nyuwun sewu, Pak Harjo, kula badhe sinau damel batik tulis."]
    explain:
      ar_eg: 'damel = gawe (يعمل) بالكراما، وbadhe = arep.'
      ar: 'damel = gawe (يصنع) بالكراما، وbadhe = arep.'
      en: 'damel = gawe (make) in krama; badhe = arep.'
    words: [nyuwun sewu, badhe, damel, batik tulis]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا هستعمل canthing.
      ar: سأستعمل الـ canthing.
      en: I'm going to use a canthing.
    answer: Kula badhe ngginakaken canthing.
    distractors: [nganggo, arep]
    explain:
      ar_eg: 'ngginakaken = nganggo (يستعمل) بالكراما الرسمية.'
      ar: 'ngginakaken = nganggo (يستعمل) بالكراما الرسمية.'
      en: 'ngginakaken = nganggo (use), formal krama.'
    words: [badhe, ngginakaken, canthing]
dialogue:
  title: Ndaftar sinau batik
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Pak Harjo. Kula badhe sinau damel batik.
      ar_eg: لا مؤاخذة يا Pak Harjo. عايز أتعلم أعمل باتيك.
      ar: عفوًا يا Pak Harjo. أريد أن أتعلم صنع الباتيك.
      en: Excuse me, Pak Harjo. I'd like to learn to make batik.
    - speaker: Pak Harjo
      text: "Mangga, Mas! Regine satus ewu."
      ar_eg: "اتفضل يا أستاذ! السعر مية ألف."
      ar: "تفضّل! السعر مئة ألف."
      en: "Sure! It's a hundred thousand."
    - speaker: Mohamed
      text: Kula ngginakaken canthing, Pak?
      ar_eg: هستعمل canthing يا حاج؟
      ar: هل سأستعمل الـ canthing يا سيدي؟
      en: Will I use a canthing, sir?
    - speaker: Pak Harjo
      text: "Nggih. Canthing kaliyan malam saking kula."
      ar_eg: "أيوه. الكانتينج والشمع عليّا."
      ar: "نعم. التشانتينج والشمع منّي."
      en: "Yes. The canthing and wax are on me."
    - speaker: Mohamed
      text: Matur nuwun sanget, Pak.
      ar_eg: شكرًا جدًا يا حاج.
      ar: شكرًا جزيلًا يا سيدي.
      en: Thank you very much, sir.
review:
