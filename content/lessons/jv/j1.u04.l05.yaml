schema: kabar.lesson/v1
id: j1.u04.l05
language: jv
title: Paket akeh dina iki
can_do:
  ar_eg: 'تتكلم عن الطرود: كتير ولا قليل، صغير ولا كبير، فوق ولا تحت ولا جوه، وإن الوقت فات.'
  ar: 'أن تتحدث عن الطرود: كثيرة أم قليلة، صغيرة أم كبيرة، فوق أم تحت أم في الداخل، وأن الوقت فات.'
  en: 'Talk about parcels: many or few, small or big, up, under or inside, and when it''s too late.'
slides:
  - title: Paket neng Jakal
    body:
      ar_eg: |
        - **dina** = يوم (hari): dina iki = النهارده. وفي الشات dino.
        - **akeh** = كتير (banyak) · **cilik** = صغير (kecil)، وgedhe = كبير.
        - **dhuwur** = فوق / عالي (atas / tinggi) · **ngisor** = تحت (bawah) · **jero** = جوه / عميق (dalam).
        - **kasep** = اتأخر، الوقت فات (terlambat): Wis kasep! · **kentekan** = خلص منه (kehabisan): Tokone kentekan barang.
      ar: |
        - **dina** = يوم (hari): dina iki = اليوم. وفي الدردشة dino.
        - **akeh** = كثير (banyak) · **cilik** = صغير (kecil)، وgedhe = كبير.
        - **dhuwur** = فوق / عالٍ (atas / tinggi) · **ngisor** = تحت (bawah) · **jero** = داخل / عميق (dalam).
        - **kasep** = فات الأوان (terlambat): Wis kasep! · **kentekan** = نفد منه (kehabisan): Tokone kentekan barang.
      en: |
        - **dina** = day (hari): dina iki = today. Chats write dino.
        - **akeh** = many, a lot (banyak) · **cilik** = small (kecil); gedhe = big.
        - **dhuwur** = up, high (atas / tinggi) · **ngisor** = under, below (bawah) · **jero** = inside, deep (dalam).
        - **kasep** = too late (terlambat): Wis kasep! · **kentekan** = run out of (kehabisan): Tokone kentekan barang.
    examples:
      - text: Dina iki pakete akeh.
        ar_eg: النهارده الطرود كتير.
        ar: الطرود كثيرة اليوم.
        en: There are lots of parcels today.
      - text: Sing cilik neng dhuwur, sing gedhe neng ngisor.
        ar_eg: الصغير فوق، والكبير تحت.
        ar: الصغير فوق، والكبير تحت.
        en: The small one's on top, the big one underneath.
      - text: Wah, wis kasep!
        ar_eg: يا خبر، الوقت فات!
        ar: يا للأسف، فات الأوان!
        en: Oh no, it's too late!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dina / dino
        ar_eg: يوم
        ar: يوم
        en: day
      - text: akeh
        ar_eg: كتير
        ar: كثير
        en: a lot
      - text: cilik
        ar_eg: صغير
        ar: صغير
        en: small
      - text: dhuwur
        ar_eg: فوق / عالي
        ar: فوق / عالٍ
        en: up, high
    words: [dina / dino, akeh, cilik, dhuwur]
  - id: e02
    type: match_pairs
    pairs:
      - text: jero
        ar_eg: جوه
        ar: داخل
        en: inside
      - text: ngisor
        ar_eg: تحت
        ar: تحت
        en: under
      - text: kasep
        ar_eg: الوقت فات
        ar: فات الأوان
        en: too late
      - text: kentekan
        ar_eg: خلص منه
        ar: نفد منه
        en: run out of
    words: [jero, ngisor, kasep, kentekan]
  - id: e03
    type: listen
    text: Dina iki pakete akeh.
    question:
      ar_eg: الطرود عاملة إيه النهارده؟
      ar: كيف حال الطرود اليوم؟
      en: What about the parcels today?
    options: [النهارده الطرود كتير, النهارده مفيش طرود, بكرة الطرود كتير]
    answer: 0
    meaning:
      ar_eg: النهارده الطرود كتير.
      ar: الطرود كثيرة اليوم.
      en: There are lots of parcels today.
    words: [dina / dino, akeh]
  - id: e04
    type: fill_blank
    sentence: Paket sing cilik neng ___ omah.
    meaning:
      ar_eg: الطرد الصغير ___ البيت.
      ar: الطرد الصغير ___ البيت.
      en: The small parcel is ___ the house.
    options: [jero, dhuwur, kasep]
    answers: [jero]
    words: [jero, dhuwur, kasep, cilik]
    explain:
      ar_eg: neng jero omah = جوّه البيت. dhuwur = فوق / عالي، وkasep = متأخر.
      ar: neng jero omah = داخل البيت؛ أما dhuwur فعالٍ، وkasep متأخر.
      en: neng jero omah = inside the house. dhuwur = high/on top, kasep = too late.
  - id: e05
    type: fill_blank
    sentence: Tokone ___ barang, Mas.
    meaning:
      ar_eg: المحل ___ البضاعة يا ماس.
      ar: المتجر ___ البضاعة يا أخي.
      en: The shop has ___ stock, Mas.
    options: [kentekan, akeh, ngisor]
    answers: [kentekan]
    words: [kentekan, akeh, ngisor]
    explain:
      ar_eg: kentekan barang = خلص منه البضاعة. akeh = كتير، وngisor = تحت.
      ar: kentekan barang = نفدت بضاعته؛ أما akeh فكثير، وngisor أسفل.
      en: kentekan = has run out of stock. akeh = a lot, ngisor = under.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: «تحت» بالجاوي؟
      ar: كيف تقول «تحت» بالجاوية؟
      en: '"Under" in Javanese?'
    options: [ngisor, dhuwur, jero]
    answer: 0
    explain:
      ar_eg: ngisor = bawah (تحت). dhuwur = فوق، وjero = جوه.
      ar: ngisor = bawah (تحت)، أما dhuwur ففوق، وjero داخل.
      en: ngisor = bawah (under). dhuwur = up, jero = inside.
    words: [ngisor, dhuwur, jero]
  - id: e07
    type: multiple_choice
    question: Wis kasep, paket wis bali neng pusat.
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [فات الأوان، الطرد رجع للمركز, لسه بدري، الطرد جاي, الطرد وصل البيت]
    answer: 0
    explain:
      ar_eg: kasep = terlambat (الوقت فات)، وbali = رجع.
      ar: kasep = terlambat (فات الأوان)، وbali = رجع.
      en: kasep = terlambat (too late); bali = went back.
    words: [kasep]
  - id: e08
    type: build_sentence
    source:
      ar_eg: النهارده فيه طرود صغيرة كتير.
      ar: اليوم توجد طرود صغيرة كثيرة.
      en: There are lots of small parcels today.
    answer: Dina iki akeh paket cilik.
    distractors: [dhuwur, kasep]
    words: [dina / dino, akeh, cilik]
    explain:
      ar_eg: dina iki = النهارده، akeh = كتير، وcilik = صغير. dhuwur = عالي، وkasep = متأخر، ومش في المعنى.
      ar: dina iki = اليوم، وakeh = كثير، وcilik = صغير؛ أما dhuwur فعالٍ، وkasep متأخر، وليسا في المعنى.
      en: dina iki = today, akeh = lots, cilik = small. dhuwur (high) and kasep (too late) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Barang sing gedhe neng ngisor, sing cilik neng dhuwur.
    answers_meaning:
      ar_eg: [الحاجة الكبيرة تحت، والصغيرة فوق, الكبير تحت والصغير فوق]
      ar: [الشيء الكبير في الأسفل، والصغير في الأعلى, الكبير تحت والصغير فوق]
      en: ['The big thing goes underneath, the small one on top', 'Big things below, small ones on top']
    words: [ngisor, cilik, dhuwur]
  - id: e10
    type: speaking
    text: Wah, wis kasep! Tokone kentekan.
    meaning:
      ar_eg: يا خبر، الوقت فات! المحل خلّص.
      ar: يا للأسف، فات الأوان! نفدت بضاعة المتجر.
      en: Oh no, too late! The shop's run out.
    words: [kasep, kentekan]
dialogue:
  lines:
    - speaker: Kurir
      text: Mas, dina iki paketmu akeh!
      ar_eg: يا ماس، طرودك كتير النهارده!
      ar: يا أخي، طرودك كثيرة اليوم!
      en: Mas, you've got lots of parcels today!
    - speaker: Mohamed
      text: Waduh! Sing cilik iki apa?
      ar_eg: يا نهار! الصغير ده إيه؟
      ar: يا إلهي! ما هذا الصغير؟
      en: Whoa! What's this small one?
    - speaker: Kurir
      text: Kurma, Mas. Sing gedhe neng ngisor, ati-ati lho.
      ar_eg: بلح يا ماس. الكبير تحت، خلي بالك.
      ar: تمر يا ماس. الكبير في الأسفل، انتبه.
      en: Dates, Mas. The big one's underneath, careful.
    - speaker: Mohamed
      text: Lho, sing dhuwur iki rusak!
      ar_eg: إيه ده، اللي فوق ده بايظ!
      ar: ماذا؟ الذي في الأعلى مكسور!
      en: Hey, this one on top is damaged!
    - speaker: Kurir
      text: Ngapura, Mas. Wis kasep, kotake kentekan.
      ar_eg: معلش يا ماس. الوقت فات، والكراتين خلصت.
      ar: آسف يا أخي. فات الأوان، ونفدت الصناديق.
      en: Sorry, Mas. Too late, we've run out of boxes.
