schema: kabar.lesson/v1
id: j1.u04.l05
language: jv
title: Sik tak lapor pusat
can_do:
  ar_eg: تفك رسالة الشات بتاعة الـ SPEC وترد عليها.
  ar: أن تفكّ رسالة الدردشة المرجعية وتردّ عليها.
  en: Decode and answer the SPEC test chat.
slides:
  - title: Sik · tak · lapor · pusat
    body:
      ar_eg: |
        الرسالة دي هتشوفها كتير لما تسأل محل على الواتساب. فكّها كلمة كلمة:
        - sik = استنى / الأول (dhisik)
        - tak = أنا هـ (مش tidak!)
        - lapor = أبلّغ
        - pusat = الإدارة / الفرع الرئيسي
        يعني: «Sik tak lapor pusat» = «استنى، هبلّغ الإدارة (وأرجعلك)».
        والرد المناسب: «Iya, tak tunggu» = ماشي، هستنى. أو «Oke, suwun».
        كلمات هتحتاجها في الشات ده (كلها اتعلمتها):
        - isih ana? = لسه فيه؟ (= masih ada?)
        - arep tuku kapan? = هتشتري إمتى؟
        - lho / kok / ya = البهارات: Isih ana lho! = لسه فيه على فكرة!
      ar: |
        ستصادف هذه الرسالة كثيرًا حين تسأل متجرًا عبر واتساب، فلنفكّها كلمةً كلمة:
        - sik = انتظر / أولًا (dhisik)
        - tak = سأ… (لا tidak)
        - lapor = أُبلغ
        - pusat = الإدارة / الفرع الرئيسي
        أي: «Sik tak lapor pusat» = «انتظر، سأبلغ الإدارة (ثم أعود إليك)».
        والجواب المناسب: «Iya, tak tunggu» = حسنًا، سأنتظر، أو «Oke, suwun».
        ألفاظ ستحتاجها في هذه الدردشة، وكلها مما تعلمت:
        - isih ana? = هل ما زال متوفرًا؟ (= masih ada?)
        - arep tuku kapan? = متى ستشتري؟
        - lho / kok / ya للتلوين: Isih ana lho! = ما زال متوفرًا!
      en: |
        You'll get this message a lot when you ask a shop something on WhatsApp. Decode it word by word:
        - sik = hold on / first (dhisik)
        - tak = I'll (not tidak!)
        - lapor = report
        - pusat = head office / main branch
        So "Sik tak lapor pusat" = "Hold on, I'll check with head office (and get back to you)."
        A good reply: "Iya, tak tunggu" = OK, I'll wait. Or "Oke, suwun".
        Words you'll need in this chat (you know them all):
        - isih ana? = still available? (= masih ada?)
        - arep tuku kapan? = when will you buy?
        - lho / kok / ya for flavour: Isih ana lho! = Still got some, you know!
    grammar: jv.proclitic.tak-kok-di
    examples:
      - text: Sik tak lapor pusat
        ar_eg: استنى، هبلّغ الإدارة.
        ar: انتظر، سأبلغ المركز.
        en: Hold on, I'll report to HQ.
      - text: Iya, tak tunggu.
        ar_eg: ماشي، هستنى.
        ar: حسنًا، سأنتظر.
        en: OK, I'll wait.
      - text: Kurma Ajwa isih ana?
        ar_eg: بلح العجوة لسه موجود؟
        ar: هل ما زال تمر العجوة متوفرًا؟
        en: Are the Ajwa dates still available?
exercises:
  - id: e01
    type: multiple_choice
    question: Sik tak lapor pusat
    question_meaning:
      ar_eg: البيّاع بعتلك الرسالة دي. يقصد إيه؟
      ar: أرسل لك البائع هذه الرسالة. ماذا يقصد؟
      en: The shop assistant sends you this. What does he mean?
    options: ['Sorry, I won''t report it.', Head office is closed., 'Hold on, I''ll check with head office.']
    answer: 2
    explain:
      ar_eg: sik = استنى، tak = أنا هـ، lapor = أبلّغ، pusat = الإدارة. tak هنا مش «لأ».
      ar: sik = انتظر، وtak = سأ…، وlapor = أُبلغ، وpusat = الإدارة، وtak هنا ليست نفيًا.
      en: sik = hold on, tak = I'll, lapor = report, pusat = head office. tak isn't "not" here.
    words: [sik, lapor, pusat]
  - id: e02
    type: multiple_choice
    question: Sik tak lapor pusat
    question_meaning:
      ar_eg: أنهي رد مناسب؟
      ar: أيّ ردّ مناسب؟
      en: Which reply fits?
    options: [Sugeng dalu., 'Iya, tak tunggu.', 'Kowe ngapa?']
    answer: 1
    explain:
      ar_eg: هو هيسأل ويرجعلك، فإنت تقول «ماشي، هستنى».
      ar: سيسأل ويعود إليك، فتقول «حسنًا، سأنتظر».
      en: He'll check and get back to you, so you say "OK, I'll wait".
    words: [tunggu]
  - id: e03
    type: listen
    text: Sik, tak lapor pusat.
    options: ['Sik, tak tuku pusat.', Wis tak lapor pusat., 'Sik, tak lapor pusat.']
    answer: 2
    words: [sik, lapor]
