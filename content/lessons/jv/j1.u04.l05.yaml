dialogue:
  title: Chat karo toko kurma
  lines:
    - speaker: Mohamed
      text: Sugeng siang, Mas. Kurma Ajwa isih ana?
      ar_eg: نهارك سعيد يا كابتن. بلح العجوة لسه موجود؟
      ar: طاب نهارك يا أخي. هل ما زال تمر العجوة متوفرًا؟
      en: Good afternoon. Are the Ajwa dates still available?
    - speaker: Mas Fikri
      text: Sik tak lapor pusat
      ar_eg: استنى، هبلّغ الإدارة.
      ar: انتظر، سأبلغ المركز.
      en: Hold on, I'll check with head office.
    - speaker: Mohamed
      text: Iya Mas, tak tunggu.
      ar_eg: ماشي يا كابتن، هستنى.
      ar: حسنًا يا أخي، سأنتظر.
      en: OK, I'll wait.
    - speaker: Mas Fikri
      text: Isih ana lho, Mas! Arep tuku kapan?
      ar_eg: لسه فيه على فكرة! هتشتري إمتى؟
      ar: ما زال متوفرًا! متى ستشتري؟
      en: Still got some! When are you coming to buy?
    - speaker: Mohamed
      text: Sore, Mas. Tak tuku.
      ar_eg: العصر يا كابتن. هاخده.
      ar: العصر يا أخي. سأشتريه.
      en: This afternoon. I'll take them.
    - speaker: Mas Fikri
      text: Oke, tak tunggu ya, Mas.
      ar_eg: تمام، هستناك يا كابتن.
      ar: حسنًا، سأنتظرك يا أخي.
      en: OK, I'll be waiting for you.
