schema: kabar.lesson/v1
id: j3.u06.l03
language: jv
title: Juragan batik
can_do:
  ar_eg: تتكلم مع صاحب ورشة باتيك عن الشغل والعمال والرزق، وتقول إنك خلاص هتشتري.
  ar: أن تتحدث مع صاحب ورشة باتيك عن العمل والعمّال والرزق، وتقول إنك ستشتري فعلًا.
  en: Talk with a batik workshop owner about work, workers and livelihood, and say you'll go ahead and buy.
slides:
  - title: Modal lan rejeki
    body:
      ar_eg: |
        كلام الشغل والتجارة:
        - nyambut gawe ← nyambut damel = يشتغل (gawe ← damel)
        juragan = صاحب الشغل، المعلّم. pegawe = موظف، عامل.
        modal = رأس مال. bathi = مكسب. untung = مكسب، وكمان «لحسن الحظ»: «Untung...»
        rejeki = رزق (الجاويين بيقولوا: الرزق بتاع ربنا).
        sida = خلاص هيعمل الحاجة فعلًا: «Sida tumbas, Mas?» = خلاص هتشتري؟
      ar: |
        مفردات العمل والتجارة:
        - nyambut gawe ← nyambut damel = يعمل (gawe ← damel)
        juragan = صاحب العمل، المعلّم. pegawe = موظف، عامل.
        modal = رأس مال. bathi = ربح. untung = ربح، وأيضًا «لحسن الحظ»: «Untung...»
        rejeki = رزق (يقول الجاويون: الرزق بيد الله).
        sida = يمضي فعلًا في الأمر: «Sida tumbas, Mas?» = هل ستشتري فعلًا؟
      en: |
        Words for work and trade:
        - nyambut gawe → nyambut damel = work (gawe → damel)
        juragan = owner, boss. pegawe = employee, worker.
        modal = capital. bathi = profit. untung = profit; also "luckily": "Untung..."
        rejeki = livelihood, God-given provision.
        sida = actually go ahead: "Sida tumbas, Mas?" = are you buying it, then?
    examples:
      - text: Pegawenipun kathah, sedaya nyambut damel wonten griya.
        ar_eg: عنده عمال كتير، كلهم بيشتغلوا في البيت.
        ar: لديه عمّال كثيرون، كلهم يعملون في البيت.
        en: He has many workers; they all work at the house.
      - text: Modal alit, bathi kathah.
        ar_eg: رأس مال صغير ومكسب كبير.
        ar: رأس مال صغير وربح كثير.
        en: Small capital, big profit.
      - text: Sida tumbas, Mas?
        ar_eg: خلاص هتشتري يا أستاذ؟
        ar: هل ستشتري فعلًا؟
        en: So are you buying it?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: juragan
        ar_eg: صاحب الشغل
        ar: صاحب العمل
        en: owner, boss
      - text: modal
        ar_eg: رأس مال
        ar: رأس مال
        en: capital
      - text: untung
        ar_eg: مكسب؛ لحسن الحظ
        ar: ربح؛ لحسن الحظ
        en: profit; luckily
      - text: bathi
        ar_eg: مكسب
        ar: ربح
        en: profit
    words: [juragan, modal, untung, bathi]
  - id: e02
    type: match_pairs
    pairs:
      - text: rejeki
        ar_eg: رزق
        ar: رزق
        en: livelihood
      - text: nyambut damel
        ar_eg: يشتغل (كراما)
        ar: يعمل (كراما)
        en: work (krama)
      - text: pegawe
        ar_eg: موظف، عامل
        ar: موظف، عامل
        en: employee
      - text: sida
        ar_eg: خلاص هيعمل فعلًا
        ar: يمضي في الأمر فعلًا
        en: actually go ahead
    words: [rejeki, nyambut damel, pegawe, sida]
  - id: e03
    type: listen
    text: Sida tumbas, Mas?
    question:
      ar_eg: البياع بيسأل إيه؟
      ar: ماذا يسأل البائع؟
      en: What is the seller asking?
    options: [عايز خصم؟, هتيجي بكرة؟, خلاص هتشتري؟]
    answer: 2
    meaning:
      ar_eg: خلاص هتشتري يا أستاذ؟
      ar: هل ستشتري فعلًا؟
      en: So are you buying it?
    words: [sida]
  - id: e04
    type: fill_blank
    sentence: Pegawe kula sedasa, sedaya ___ wonten griya menika.
    meaning:
      ar_eg: عندي عشر عمال، كلهم ___ في البيت ده.
      ar: لديّ عشرة عمّال، كلهم ___ في هذا البيت.
      en: I have ten workers; they all ___ in this house.
    options: [nyambut damel, modal, rejeki]
    answers: [nyambut damel]
    words: [nyambut damel, modal, rejeki, pegawe]
    explain:
      ar_eg: nyambut damel = يشتغلوا (كراما). modal = رأس مال، وrejeki = رزق، ومش أفعال.
      ar: nyambut damel تعني يعملون (كراما). أما modal فرأس مال، وrejeki رزق، وليستا فعلين.
      en: nyambut damel is "work" (krama). modal (capital) and rejeki (livelihood) aren't verbs.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: صاحب الشغل اسمه إيه؟
      ar: ماذا نسمّي صاحب العمل؟
      en: What do you call the owner of a business?
    options: [pegawe, juragan, bathi]
    answer: 1
    explain:
      ar_eg: juragan = صاحب الشغل. pegawe = موظف، عامل.
      ar: juragan = صاحب العمل. pegawe = موظف، عامل.
      en: juragan = owner. pegawe = employee.
    words: [pegawe, juragan, bathi]
  - id: e06
    type: fill_blank
    sentence: Modal alit, ___ kathah.
    meaning:
      ar_eg: رأس مال صغير، و___ كتير.
      ar: رأس مال صغير و___ كثير.
      en: Small capital, big ___.
    options: [bathi, sida, juragan]
    answers: [bathi]
    words: [bathi, modal, sida, juragan]
    explain:
      ar_eg: bathi = مكسب، عكس رأس المال الصغير. sida = فعلًا هيحصل، وjuragan = صاحب الشغل.
      ar: bathi تعني الربح، مقابل رأس المال الصغير. أما sida فيتمّ فعلًا، وjuragan صاحب العمل.
      en: bathi is "profit", set against small capital. sida is "go ahead with it", and juragan is "boss".
  - id: e07
    type: build_sentence
    source:
      ar_eg: الحمد لله، الرزق كويس السنة دي.
      ar: الحمد لله، الرزق طيّب هذا العام.
      en: Thank God, business is good this year.
    answer: Alhamdulillah, rejeki sae taun menika.
    distractors: [modal, untung]
    words: [rejeki]
    explain:
      ar_eg: rejeki = رزق، وsae = كويس. modal = رأس مال، وuntung = مكسب، ومش في الجملة.
      ar: rejeki تعني الرزق، وsae طيّب. أما modal فرأس مال، وuntung ربح، وليستا في الجملة.
      en: rejeki is "livelihood", sae "good". modal (capital) and untung (profit) aren't in the sentence.
  - id: e08
    type: translate
    direction: from_target
    source_text: Untung, kula sida tumbas batik wingi.
    answers_meaning:
      ar_eg: [لحسن الحظ اشتريت الباتيك امبارح, الحمد لله إني اشتريت الباتيك امبارح]
      ar: [لحسن الحظ اشتريت الباتيك أمس]
      en: ['Luckily, I did buy the batik yesterday', Luckily I went ahead and bought the batik yesterday]
    words: [untung, sida]
  - id: e09
    type: speaking
    text: Pak Harjo nyambut damel wonten Giriloyo.
    meaning:
      ar_eg: الأستاذ هارجو بيشتغل في جيريلويو.
      ar: يعمل السيد هارجو في جيريلويو.
      en: Pak Harjo works in Giriloyo.
    words: [nyambut damel]
  - id: e10
    type: multiple_choice
    question: Nyambut gawe (ngoko) → ___ (krama)
    options: [nyambut damel, juragan, untung]
    answer: 0
    explain:
      ar_eg: nyambut gawe ← nyambut damel = يشتغل (gawe ← damel).
      ar: nyambut gawe ← nyambut damel = يعمل (gawe ← damel).
      en: nyambut gawe → nyambut damel = work (gawe → damel).
    words: [nyambut damel, juragan, untung]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, panjenengan juragan batik?
      ar_eg: يا أستاذ، حضرتك صاحب ورشة الباتيك؟
      ar: يا أستاذ، هل أنت صاحب ورشة الباتيك؟
      en: Sir, are you the owner of the batik workshop?
    - speaker: Pak Harjo
      text: "Nggih. Pegawe kula sedasa, sedaya nyambut damel ten mriki."
      ar_eg: "أيوه. عندي عشر عمال، كلهم بيشتغلوا هنا."
      ar: "نعم. لديّ عشرة عمال، كلهم يعملون هنا."
      en: "Yes. I've got ten workers; they all work here."
    - speaker: Mohamed
      text: Modalipun kathah, Pak?
      ar_eg: رأس المال كان كبير يا أستاذ؟
      ar: هل كان رأس المال كبيرًا يا أستاذ؟
      en: Did it take a lot of capital, sir?
    - speaker: Pak Harjo
      text: "Riyin alit sanget. Alhamdulillah, rejekine sae."
      ar_eg: "زمان كان صغير أوي. الحمد لله، الرزق كويس."
      ar: "كان صغيرًا جدًا في البداية. الحمد لله، الرزق جيد."
      en: "Tiny at first. Thank God, business is good."
    - speaker: Mohamed
      text: Untung kula pinanggih panjenengan. Kula sida tumbas batik tulis setunggal.
      ar_eg: لحسن حظي إني قابلت حضرتك. خلاص هشتري باتيك بالإيد واحد.
      ar: من حسن حظي أنني التقيتك. سأشتري قطعة باتيك يدوية فعلًا.
      en: Lucky I met you. I'll go ahead and buy one hand-drawn batik.
    - speaker: Pak Harjo
      text: Matur nuwun, Mas. Mangga dipunpilih.
      ar_eg: متشكر يا أستاذ. اتفضل اختار.
      ar: شكرًا. تفضّل اختر.
      en: Thank you. Please choose.
