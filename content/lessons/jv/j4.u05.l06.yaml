dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, dina iki Ibu ambal warsa!
      ar_eg: يا محمد، النهارده عيد ميلاد ماما!
      ar: يا محمد، اليوم عيد ميلاد أمّي!
      en: Mohamed, it's Mum's birthday today!
    - speaker: Mohamed
      text: Waduh, aku lali je! Sepura, Mas.
      ar_eg: يا خبر، نسيت! سامحني يا ماس.
      ar: يا للهول، نسيت! سامحني يا ماس.
      en: Oh no, I forgot! Sorry, Mas.
    - speaker: Mas Dimas
      text: Ra papa. Ayo nggawa tumpeng.
      ar_eg: ولا يهمك. يلا نجيب تومبنج.
      ar: لا بأس. هيّا نحمل تومبنغ.
      en: No worries. Let's bring a tumpeng.
    - speaker: Mohamed
      text: Sugeng ambal warsa, Bu! Mugi tansah wilujeng.
      ar_eg: كل سنة وانتي طيبة يا هانم! ياريت تفضلي بخير دايمًا.
      ar: عيد ميلاد سعيد يا سيدتي! دمتِ بخير.
      en: Happy birthday, ma'am! May you always be well.
    - speaker: Bu Harsono
      text: Matur nuwun, Mas. Wah, tumpeng!
      ar_eg: شكرًا يا ماس. الله، تومبنج!
      ar: شكرًا يا ماس. رائع، تومبنغ!
      en: Thank you, Mas. Oh, a tumpeng!
    - speaker: Mohamed
      text: Menika ikhlas saking kula lan Mas Dimas, Bu.
      ar_eg: ده من قلبي أنا وماس ديماس يا هانم.
      ar: هذا من قلبي ومن ماس ديماس يا سيدتي.
      en: It's from the heart, from me and Mas Dimas, ma'am.
