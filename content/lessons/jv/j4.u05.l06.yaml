language: jv
title: Sugeng ambal warsa
can_do:
  ar_eg: تهنّي حد بعيد ميلاده بالكراما، وتعتذر لو نسيت، وتقدّم هدية من قلبك.
  ar: أن تهنّئ أحدًا بعيد ميلاده بالكراما، وتعتذر إن نسيت، وتقدّم هديّة من قلبك.
  en: Wish someone a happy birthday in krama, apologise if you forgot, and give a gift from the heart.
slides:
  - title: Muga-muga berkah
    body:
      ar_eg: |
        - sugeng ambal warsa = كل سنة وانت طيب (عيد ميلاد سعيد) بالكراما. warsa = سنة (كراما مهذّبة لـ taun).
        - muga-muga = ياريت، إن شاء الله (نغوكو)، وبالكراما mugi. berkah = بركة: «Muga-muga berkah!»
        - tumpeng = هرم رز أصفر في نص الطبق وحواليه أكلات، للاحتفالات والشكر.
        - sepura = آسف، سامحني (نغوكو): «Sepura, Mas, aku lali.» getun = ندمان.
        - ikhlas = من القلب، من غير ما تستنى حاجة (من العربي «إخلاص»).
        - في الشارع: Ra papa = Ora apa-apa (مفيش مشكلة).
        - je كلمة صغيرة بتدّي الجملة إحساس (من كلام يوجيا)، ومن غيرها الجملة صح برضه.
      ar: |
        - sugeng ambal warsa = عيد ميلاد سعيد، كل عام وأنت بخير، بالكراما. warsa = سنة (كراما مهذّبة لـ taun).
        - muga-muga = عسى، إن شاء الله (نغوكو)، وبالكراما mugi. berkah = بركة: «Muga-muga berkah!»
        - tumpeng = هرم من الأرز الأصفر وسط الطبق تحيط به الأطباق، للاحتفالات والشكر.
        - sepura = آسف، سامحني (نغوكو): «Sepura, Mas, aku lali.» getun = نادم.
        - ikhlas = من القلب بلا انتظار مقابل (من العربية «إخلاص»).
        - في كلام الشارع: Ra papa = Ora apa-apa (لا بأس).
        - je أداة صغيرة تلوّن الجملة (من كلام يوجيا)، والجملة صحيحة بدونها.
      en: |
        - sugeng ambal warsa = happy birthday, in krama. warsa = year (refined krama for taun).
        - muga-muga = may, hopefully (ngoko); in krama, mugi. berkah = blessing: "Muga-muga berkah!"
        - tumpeng = a cone of yellow rice in the middle of a platter ringed with dishes, for celebrations and thanksgiving.
        - sepura = sorry, forgive me (ngoko): "Sepura, Mas, aku lali." getun = regretful.
        - ikhlas = from the heart, expecting nothing back (from Arabic «إخلاص»).
        - On the street: Ra papa = Ora apa-apa (no problem).
        - je is a small particle that adds feeling (Jogja speech); the sentence is correct without it.
    examples:
      - text: Sugeng ambal warsa, Bu! Mugi tansah wilujeng.
        ar_eg: كل سنة وانتي طيبة يا هانم! ياريت تفضلي بخير دايمًا.
        ar: عيد ميلاد سعيد يا سيدتي! دمتِ بخير.
        en: Happy birthday, ma'am! May you always be well.
      - text: Sepura, Mas, aku lali. Aku getun banget.
        ar_eg: سامحني يا ماس، نسيت. أنا ندمان أوي.
        ar: سامحني يا ماس، نسيت، وأنا نادم جدًّا.
        en: Sorry, Mas, I forgot. I really regret it.
      - text: Tumpeng menika kagem Ibu.
        ar_eg: التومبنج ده لحضرتك يا هانم.
        ar: هذا التومبنغ لكِ يا سيدتي.
        en: This tumpeng is for you, ma'am.
