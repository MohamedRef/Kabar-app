    question_meaning:
      ar_eg: بتشرب kopi joss فين في يوجيا؟
      ar: أين تشرب kopi joss في يوجياكرتا؟
      en: Where do you drink kopi joss in Jogja?
    options: [angkringan, kanca, salam]
    answer: 0
    explain:
      ar_eg: في الـ angkringan، عربية الأكل اللي بالليل.
      ar: في angkringan، عربة الطعام الليلية.
      en: At an angkringan, the night food cart.
    words: [angkringan, kopi joss]
  - id: e08
    type: build_sentence
    source:
