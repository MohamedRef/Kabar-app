      ar: أيّ كلمة تعني «نعم» بأدب، للكبير أو للبائع؟
      en: Which word is a polite "yes" for elders or sellers?
    options: [nggih, angkringan, sesuk]
    answer: 0
    explain:
      ar_eg: nggih = أيوه بالكراما. angkringan = عربية الأكل، وsesuk = بكرة.
      ar: nggih = نعم بالكراما، أما angkringan فعربة الطعام وsesuk غدًا.
      en: nggih = a krama yes. angkringan = the food cart, sesuk = tomorrow.
