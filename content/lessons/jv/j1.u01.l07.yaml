    words: [sesuk, maneh]
  - id: e09
    type: translate
    direction: from_target
    source_text: Saiki aku isa ketemu.
    answers_meaning:
      ar_eg: [دلوقتي أقدر أقابلك, دلوقتي ينفع نتقابل]
      ar: [الآن أستطيع أن ألقاك, الآن يمكنني اللقاء]
      en: [I can meet now, 'Now I''m able to meet']
    words: [saiki, isa / iso]
  - id: e10
    type: speaking
    text: Nggih, Mas. Kopi joss iki apik.
    meaning:
      ar_eg: أيوه يا ماس. الكوبي جوس دي حلوة.
      ar: نعم يا أخي. هذه الـ kopi joss رائعة.
      en: Yes, Mas. This kopi joss is great.
    words: [nggih, kopi joss, iki]
dialogue:
  lines:
    - speaker: Mas Heru
      text: Sugeng dalu, Mas! Kopi?
      ar_eg: مسا الخير يا ماس! قهوة؟
      ar: مساء الخير يا ماس! قهوة؟
      en: Good evening, Mas! Coffee?
    - speaker: Mohamed
      text: Kopi joss, Mas. Angkringan iki rame banget.
      ar_eg: كوبي جوس يا ماس. الأنجكرينجان دي زحمة أوي.
      ar: كوبي جوس يا ماس. هذه الأنجكرينجان مزدحمة جدًا.
      en: Kopi joss, Mas. This angkringan is really busy.
    - speaker: Mas Heru
      text: Iya, bengi iki rame. Sesuk maneh, to?
      ar_eg: آه، الليلة زحمة. بكرة تاني، صح؟
      ar: نعم، الليلة مزدحمة. وغدًا مرة أخرى، صحيح؟
      en: Yeah, it's busy tonight. Again tomorrow, right?
    - speaker: Mohamed
      text: Nggih, Mas, sesuk aku isa. Matur nuwun!
      ar_eg: أيوه يا ماس، بكرة أقدر. شكرًا!
      ar: نعم يا أخي، أستطيع غدًا. شكرًا!
      en: Yes, Mas, tomorrow works. Thanks!
    - speaker: Mas Heru
      text: Sami-sami. Sesuk ketemu maneh, ati-ati!
      ar_eg: العفو. نتقابل تاني بكرة، خلي بالك من نفسك!
      ar: عفوًا. نلتقي غدًا، انتبه لنفسك!
      en: You're welcome. See you tomorrow, take care!
