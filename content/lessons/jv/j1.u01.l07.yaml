id: j1.u01.l07
language: jv
title: Sesuk ketemu maneh
can_do:
  ar_eg: تقول «نتقابل تاني بكرة»، وتطلب كوبي جوس في الأنجكرينجان، وترد بأدب بـ nggih.
  ar: أن تقول «نلتقي غدًا مرة أخرى»، وتطلب kopi joss في الأنجكرينجان، وتجيب بأدب بـ nggih.
  en: Say "see you again tomorrow", order kopi joss at an angkringan, and answer politely with nggih.
slides:
  - title: Neng angkringan
    body:
      ar_eg: |
        الـ **angkringan** = عربية أكل شعبي بتفتح بالليل، والناس بتقعد حواليها على الحصير. وأشهر مشروب هناك **kopi joss**: قهوة بيحطوا فيها فحمة مولعة (أنجكرينجان جنب محطة Tugu).
        - **iki** = ده / دي (ini): Kopi iki apik!
        - **saiki** = دلوقتي (sekarang) · **sesuk** = بكرة (besok) · **maneh** = تاني (lagi)
        - **isa** = يقدر (bisa)، وفي الشات iso: Sesuk isa? = بكرة ينفع؟
        - **nggih** = أيوه، بس بأدب (كراما). بتقولها للكبير وللبياع اللي بتحترمه، ومع صحابك iya.
      ar: |
        **angkringan** = عربة طعام شعبي تفتح ليلًا، ويجلس الناس حولها على الحصير. وأشهر مشروباتها **kopi joss**: قهوة تُلقى فيها جمرة فحم مشتعلة (في أنجكرينجان قرب محطة Tugu).
        - **iki** = هذا / هذه (ini): Kopi iki apik!
        - **saiki** = الآن (sekarang) · **sesuk** = غدًا (besok) · **maneh** = مرة أخرى (lagi)
        - **isa** = يستطيع (bisa)، وفي الدردشة iso: Sesuk isa? = هل يناسبك غدًا؟
        - **nggih** = نعم بأدب (كراما)، تقولها للكبير وللبائع الذي تحترمه، ومع أصدقائك iya.
      en: |
        An **angkringan** is a street-food cart that opens at night; people sit around it on mats. Its famous drink is **kopi joss**: coffee with a glowing piece of charcoal dropped in (the angkringan near Tugu station).
        - **iki** = this (ini): Kopi iki apik!
        - **saiki** = now (sekarang) · **sesuk** = tomorrow (besok) · **maneh** = again (lagi)
        - **isa** = can (bisa); chats write iso: Sesuk isa? = Does tomorrow work?
        - **nggih** = yes, politely (krama). Say it to elders and to sellers you respect; with friends it's iya.
    examples:
      - text: Sesuk ketemu maneh, Mas!
        ar_eg: نتقابل تاني بكرة يا ماس!
        ar: نلتقي غدًا مرة أخرى يا أخي!
        en: See you again tomorrow, Mas!
      - text: Saiki aku luwe.
        ar_eg: أنا جعان دلوقتي.
        ar: أنا جائع الآن.
        en: I'm hungry now.
      - text: Nggih, Bu. Matur nuwun.
        ar_eg: حاضر يا حاجة. شكرًا.
        ar: نعم يا سيدتي. شكرًا.
        en: Yes, ma'am. Thank you.
