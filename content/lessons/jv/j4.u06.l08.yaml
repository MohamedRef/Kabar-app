schema: kabar.lesson/v1
id: j4.u06.l08
language: jv
title: Wayang kulit ing pendhapa
can_do:
  ar_eg: تقرا إعلان عن حفلة وايانغ وتعزم عليها حد كبير.
  ar: أن تقرأ إعلانًا عن عرض وايانغ وتدعو إليه كبيرًا.
  en: Read a notice about a wayang show and invite an elder to it.
slides:
  - title: Wonten wayang kulit
    body:
      ar_eg: |
        على باب الـ pendhapa (القاعة المفتوحة بتاعة الحي) متعلّق إعلان بالكراما، بأدب مع كل اللي هيقراه.
        اقراه، وبعدين احكيه لـ Mas Dimas بالنغوكو، واعزم بيه Pak Harsono بالكراما ألوس.
      ar: |
        على باب الـ pendhapa (القاعة المفتوحة في الحي) إعلان بالكراما تأدّبًا مع كل من يقرؤه.
        اقرأه، ثم انقله إلى Mas Dimas بالنغوكو، وادعُ به Pak Harsono بالكراما ألوس.
      en: |
        On the door of the pendhapa (the neighbourhood's open hall) there's a notice in krama, polite to everyone who reads it.
        Read it, then pass it on to Mas Dimas in ngoko, and invite Pak Harsono in krama alus.
    grammar: jv.speechlevel.overview
    examples:
      - text: Setu dalu wonten wayang kulit ing pendhapa.
        ar_eg: يوم السبت بالليل فيه وايانغ كوليت في الـ pendhapa.
        ar: ليلة السبت عرض وايانغ كوليت في الـ pendhapa.
        en: On Saturday night there's wayang kulit at the pendhapa.
      - text: Dhalangipun saking Bantul, critanipun Ramayana.
        ar_eg: الدالانغ من Bantul، والحكاية رامايانا.
        ar: الدالانغ من Bantul، والقصة رامايانا.
        en: The dhalang is from Bantul, and the story is the Ramayana.
      - text: Gamelan lan sindhen ugi wonten. Mangga rawuh!
        ar_eg: وفيه كمان جاميلان ومغنّية. اتفضلوا شرّفونا!
        ar: وهناك أيضًا غاميلان ومغنّية. تفضّلوا بالحضور!
        en: There'll be gamelan and a singer too. Do come!
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الوايانغ إمتى؟
      ar: متى عرض الوايانغ؟
      en: When is the wayang show?
    options: [Setu sonten, Setu dalu, Minggu dalu]
    answer: 1
    explain:
      ar_eg: «Setu dalu» = يوم السبت بالليل.
      ar: «Setu dalu» = ليلة السبت.
      en: '"Setu dalu" = Saturday night.'
    words: [wayang kulit]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الدالانغ منين؟
      ar: من أين الدالانغ؟
      en: Where is the dhalang from?
    options: [Bantul, Prambanan, Solo]
    answer: 0
    explain:
      ar_eg: «Dhalangipun saking Bantul» = الدالانغ من Bantul.
      ar: «Dhalangipun saking Bantul» = الدالانغ من Bantul.
      en: '"Dhalangipun saking Bantul" = the dhalang is from Bantul.'
    words: [dhalang]
  - id: e03
    type: listen
    text: Dhalangipun saking Bantul, critanipun Ramayana.
    question:
      ar_eg: هيحكوا أنهي حكاية؟
      ar: أي قصة سيُروى؟
      en: Which story will be told?
    options: [Mahabharata, Ramayana]
    answer: 1
    meaning:
      ar_eg: الدالانغ من Bantul، والحكاية رامايانا.
      ar: الدالانغ من Bantul، والقصة رامايانا.
      en: The dhalang is from Bantul, and the story is the Ramayana.
    words: [dhalang, crita]
  - id: e04
    type: match_pairs
    pairs:
      - text: dhalang
        ar_eg: محرّك العرايس وراوي الحكاية
        ar: محرّك الدمى وراوي القصة
        en: puppet master, storyteller
      - text: sindhen
        ar_eg: مغنّية الجاميلان
        ar: مغنّية الغاميلان
        en: female gamelan singer
      - text: gamelan
        ar_eg: الفرقة الموسيقية الجاوية
        ar: الفرقة الموسيقية الجاوية
        en: Javanese orchestra
      - text: wayang kulit
        ar_eg: مسرح خيال الظل بالجلد
        ar: مسرح خيال الظل الجلدي
        en: leather shadow-puppet theatre
      - text: pendhapa
        ar_eg: قاعة مفتوحة بسقف
        ar: قاعة مفتوحة مسقوفة
        en: open pavilion hall
    words: [dhalang, sindhen, gamelan, wayang kulit]
  - id: e05
    type: fill_blank
    sentence: ___ saking Bantul, critanipun Ramayana.
    meaning:
      ar_eg: الدالانغ من Bantul، والحكاية رامايانا.
      ar: الدالانغ من Bantul، والقصة رامايانا.
      en: The dhalang is from Bantul, and the story is the Ramayana.
    options: [Sindhenipun, Dhalangipun, Gamelanipun]
    answers: [Dhalangipun]
    explain:
      ar_eg: اللي بيحكي الحكاية ويحرّك العرايس هو الـ dhalang.
      ar: راوي القصة ومحرّك الدمى هو الـ dhalang.
      en: The one who tells the story and moves the puppets is the dhalang.
    words: [dhalang]
  - id: e06
    type: build_sentence
    source:
      ar_eg: (لـ Mas Dimas، نغوكو) يوم السبت بالليل فيه وايانغ كوليت في الـ pendhapa.
      ar: (إلى Mas Dimas، بالنغوكو) ليلة السبت عرض وايانغ كوليت في الـ pendhapa.
      en: (to Mas Dimas, ngoko) On Saturday night there's wayang kulit at the pendhapa.
    answer: Setu bengi ana wayang kulit ing pendhapa.
    distractors: [wonten, dalu]
    explain:
      ar_eg: لصاحبك نغوكو - bengi بدل dalu، وana بدل wonten.
      ar: للصديق بالنغوكو - bengi مكان dalu، وana مكان wonten.
      en: To a friend, ngoko - bengi for dalu, ana for wonten.
    words: [wayang kulit]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Pak Harsono) يا أستاذ، حضرتك تحب تتفرج على الوايانغ يوم السبت بالليل؟
      ar: (إلى Pak Harsono) يا سيدي، هل تودّ مشاهدة الوايانغ ليلة السبت؟
      en: (to Pak Harsono) Sir, would you like to watch the wayang on Saturday night?
    answers:
      - Pak, panjenengan kersa mirsani wayang Setu dalu?
      - Panjenengan kersa mirsani wayang Setu dalu, Pak?
      - Pak, panjenengan kersa mirsani wayang kulit Setu dalu?
      - Setu dalu panjenengan kersa mirsani wayang, Pak?
      - Pak, Setu dalu panjenengan kersa mirsani wayang?
    explain:
      ar_eg: للكبير كراما ألوس - kersa (يحب) وmirsani (يتفرج)، الاتنين krama inggil.
      ar: للكبير كراما ألوس - kersa (يودّ) وmirsani (يشاهد)، وكلاهما krama inggil.
      en: To an elder, krama alus - kersa (would like) and mirsani (watch), both krama inggil.
    words: [kersa, mirsani]
  - id: e08
    type: speaking
    text: Gamelan lan sindhen ugi wonten. Mangga rawuh!
    meaning:
      ar_eg: وفيه كمان جاميلان ومغنّية. اتفضلوا شرّفونا!
      ar: وهناك أيضًا غاميلان ومغنّية. تفضّلوا بالحضور!
      en: There'll be gamelan and a singer too. Do come!
    words: [gamelan, sindhen]
dialogue:
  title: Ngaturi Pak Harsono
  lines:
    - speaker: Mohamed
      text: Pak, Setu dalu wonten wayang kulit ing pendhapa.
      ar_eg: يا أستاذ، يوم السبت بالليل فيه وايانغ كوليت في الـ pendhapa.
      ar: يا سيدي، ليلة السبت عرض وايانغ كوليت في الـ pendhapa.
      en: Sir, on Saturday night there's wayang kulit at the pendhapa.
    - speaker: Pak Harsono
      text: Wah, dhalangipun sinten, Mas?
      ar_eg: الله، مين الدالانغ يا ابني؟
      ar: رائع، من الدالانغ يا بني؟
      en: Oh, who's the dhalang?
    - speaker: Mohamed
      text: Saking Bantul, Pak. Panjenengan kersa mirsani?
      ar_eg: من Bantul يا أستاذ. حضرتك تحب تتفرج؟
      ar: من Bantul يا سيدي. هل تودّ المشاهدة؟
      en: From Bantul, sir. Would you like to watch?
    - speaker: Pak Harsono
      text: Inggih, kula purun. Mas Mohamed ugi?
      ar_eg: أيوه، ياريت. وإنت كمان يا محمد؟
      ar: نعم، بكل سرور. وأنت أيضًا يا محمد؟
      en: Yes, I'd like that. You too, Mohamed?
    - speaker: Mohamed
      text: Inggih, Pak. Kula ndherek.
      ar_eg: أيوه يا أستاذ. أنا جاي مع حضرتك.
      ar: نعم يا سيدي. سأرافقك.
      en: Yes, sir. I'll come with you.
review:
