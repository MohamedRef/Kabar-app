schema: kabar.lesson/v1
id: j2.u03.l07
language: jv
title: Pasar! Jawa
can_do:
  ar_eg: تفاصل في السعر بالجاوي.
  ar: أن تساوم على السعر بالجاوية.
  en: Haggle in Javanese.
slides:
  - title: Oleh kurang, Bu?
    body:
      ar_eg: |
        جمل الفصال اللي هتحتاجها:
        - Larang! = غالي! · murah = رخيص
        - Oleh kurang, Bu? = ينفع تنزلي شوية يا طنط؟ (oleh = boleh، kurang = أقل)
        - Selawe ewu wae, ya? = خمسة وعشرين ألف بس، ماشي؟
        - Ora oleh. Wis pas. = مينفعش، ده آخر سعر. (wis pas = sudah pas)
        - Ya wis, oleh. = خلاص، ماشي. (ya wis = ya sudah)
        الفصال في السوق الجاوي لعبة لطيفة، مش خناقة: ابتسم، قول Bu أو Pak، وحط ya في الآخر. ومع البياعين الكبار الكراما هتبقى أحلى — هتتعلمها في J3.
      ar: |
        عبارات المساومة التي ستحتاجها:
        - Larang! = غالٍ! · murah = رخيص
        - Oleh kurang, Bu? = هل يمكن أن تُنقصي السعر يا سيدتي؟ (oleh = boleh، kurang = أقل)
        - Selawe ewu wae, ya? = خمسة وعشرون ألفًا فقط، اتفقنا؟
        - Ora oleh. Wis pas. = لا يمكن، هذا آخر سعر. (wis pas = sudah pas)
        - Ya wis, oleh. = حسنًا، موافقة. (ya wis = ya sudah)
        والمساومة في السوق الجاوي لعبة ودودة لا شجار: ابتسم، وقل Bu أو Pak، واختم بـ ya. ومع الباعة الكبار تكون الكراما أجمل، وستتعلمها في J3.
      en: |
        Haggling lines you'll need:
        - Larang! = Expensive! · murah = cheap
        - Oleh kurang, Bu? = Can you go lower, ma'am? (oleh = boleh, kurang = less)
        - Selawe ewu wae, ya? = Just 25,000, OK?
        - Ora oleh. Wis pas. = Can't. That's the final price. (wis pas = sudah pas)
        - Ya wis, oleh. = All right, deal. (ya wis = ya sudah)
        Haggling at a Javanese market is a friendly game, not a fight: smile, say Bu or Pak, end with ya. With older sellers krama is even nicer — that comes in J3.
    grammar: jv.number.full
    examples:
      - text: Wolulikur ewu wae, ya?
        ar_eg: تمانية وعشرين ألف بس، ماشي؟
        ar: ثمانية وعشرون ألفًا فقط، اتفقنا؟
        en: Just 28,000, OK?
      - text: Ya wis, selawe.
        ar_eg: خلاص، خمسة وعشرين.
        ar: حسنًا، خمسة وعشرون.
        en: All right, twenty-five.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تسأل البياعة بأدب لو ممكن تنزّل السعر. تقول إيه؟
      ar: تريد أن تسأل البائعة بلطف إن كانت تُنقص السعر. ماذا تقول؟
      en: You want to ask the seller politely if she can go lower. What do you say?
    options: ['Oleh kurang, Bu?', 'Wis pas, Bu.', 'Ora oleh, Bu.']
    answer: 0
    words: [oleh, kurang]
    explain:
      ar_eg: oleh kurang = ممكن تنزّل؟ wis pas = كده مظبوط (موافق)، وora oleh = مينفعش.
      ar: oleh kurang = هل يمكن التخفيض؟ أما wis pas فمضبوط (موافقة)، وora oleh لا يجوز.
      en: oleh kurang = can you go lower? wis pas = that's right (agreeing), ora oleh = not allowed.
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: البياعة وافقت على السعر بتاعك. قالت إيه؟
      ar: وافقت البائعة على سعرك. ماذا قالت؟
      en: The seller accepts your price. What did she say?
    options: ['Wis pas, Mas.', 'Ya wis, oleh.', 'Ora oleh, Mas.']
    answer: 1
    words: [ya wis, oleh, wis pas]
    explain:
      ar_eg: ya wis, oleh = خلاص، ماشي (وافقت). wis pas = مظبوط، وora oleh = مينفعش (رفض).
      ar: ya wis, oleh = حسنًا، موافقة؛ أما wis pas فمضبوط، وora oleh رفض.
      en: ya wis, oleh = OK, deal. wis pas = exact, ora oleh = refused.
  - id: e03
    type: fill_blank
    sentence: Telung puluh ewu? ___ banget, Bu!
    meaning:
      ar_eg: تلاتين ألف؟ غالي أوي يا طنط!
      ar: ثلاثون ألفًا؟ غالٍ جدًا يا سيدتي!
      en: Thirty thousand? That's really expensive, ma'am!
    options: [Larang, Murah, Legi]
    answers: [Larang]
    words: [larang]
    explain:
      ar_eg: larang banget = غالي أوي، وده الرد على تلاتين ألف. murah = رخيص (العكس)، وlegi = مسكّر.
      ar: larang banget = غالٍ جدًا، ردًّا على ثلاثين ألفًا؛ أما murah فرخيص (العكس)، وlegi حلو المذاق.
      en: larang banget = really expensive. murah (cheap) is the opposite, legi = sweet.
  - id: e04
    type: fill_blank
    sentence: Regane ___ ewu.
    meaning:
      ar_eg: سعره تمانية وعشرين ألف.
      ar: ثمنه ثمانية وعشرون ألفًا.
      en: It costs 28,000.
    answers: [wolulikur]
    explain:
      ar_eg: 'من 21 لـ 29 بـ -likur: wolu + likur = wolulikur.'
      ar: 'الأعداد 21–29 بـ -likur: wolu + likur = wolulikur.'
      en: '21–29 use -likur: wolu + likur = wolulikur.'
    words: [wolulikur]
  - id: e05
    type: build_sentence
    source:
      ar_eg: خمسة وعشرين ألف بس، ماشي؟
      ar: خمسة وعشرون ألفًا فقط، اتفقنا؟
      en: Just 25,000, OK?
    answer: Selawe ewu wae, ya?
    distractors: [seket, ora]
    words: [selawe, ewu, wae]
    explain:
      ar_eg: selawe ewu = ٢٥ ألف، وwae = بس. seket = خمسين، وora = لأ، ومش في المعنى.
      ar: selawe ewu = خمسة وعشرون ألفًا، وwae = فقط؛ أما seket فخمسون، وora لا، وليسا في المعنى.
      en: selawe ewu = 25,000, wae = just. seket (50) and ora (no) aren't in the meaning.
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ينفع تنزلي شوية يا طنط؟
      ar: هل يمكن أن تُنقصي السعر يا سيدتي؟
      en: Can you go lower, ma'am?
    answers: ['Oleh kurang, Bu?', 'Oleh kurang, Bu', 'Oleh kurang?', Oleh kurang, 'Oleh kurang ora, Bu?', 'Oleh kurang ora, Bu']
    words: [oleh, kurang]
  - id: e07
    type: listen
    text: Wis pas, Mas. Ora oleh kurang.
    options: ['Wis pas, Mas. Ora oleh kurang.', 'Ya wis, Mas. Oleh kurang.', 'Wis pas, Mas. Oleh kurang.']
    answer: 0
    meaning:
      ar_eg: ده آخر سعر يا أستاذ. مينفعش أنزّل.
      ar: هذا آخر سعر يا أخي. لا يمكن التخفيض.
      en: That's the final price, Mas. I can't go lower.
    words: [wis pas, oleh, kurang, ya wis]
  - id: e08
    type: listen
    text: Wolulikur ewu wae.
    options: [Wolulikur ewu wae., Wolulas ewu wae., Wolung puluh ewu wae.]
    answer: 0
    explain:
      ar_eg: wolulas = 18، wolulikur = 28، wolung puluh = 80.
      ar: wolulas = 18، وwolulikur = 28، وwolung puluh = 80.
      en: wolulas = 18, wolulikur = 28, wolung puluh = 80.
    words: [wolulikur]
  - id: e09
    type: dictation
    text: Oleh kurang, Bu?
    meaning:
      ar_eg: ينفع تنزلي شوية يا طنط؟
      ar: هل يمكن أن تُنقصي السعر يا سيدتي؟
      en: Can you go lower, ma'am?
    words: [oleh, kurang]
  - id: e10
    type: speaking
    text: Wah, larang. Selawe ewu wae, ya?
    meaning:
      ar_eg: ياه، غالي. خمسة وعشرين ألف بس، ماشي؟
      ar: آه، غالٍ. خمسة وعشرون ألفًا فقط، اتفقنا؟
      en: Oh, that's expensive. Just 25,000, OK?
    words: [larang, selawe, wae]
dialogue:
  title: Neng pasar Nganjuk
  lines:
    - speaker: Mohamed
      text: Bu, bawang abang sekilo pira?
      ar_eg: يا طنط، البصل الأحمر الكيلو بكام؟
      ar: يا سيدتي، بكم كيلو البصل الأحمر؟
      en: Ma'am, how much is a kilo of shallots?
    - speaker: Bu Karti
      text: Telung puluh ewu, Mas.
      ar_eg: تلاتين ألف يا أستاذ.
      ar: ثلاثون ألفًا يا أخي.
      en: Thirty thousand, Mas.
    - speaker: Mohamed
      text: Wah, larang og. Oleh kurang, Bu?
      ar_eg: ياه، غالي. ينفع تنزلي شوية يا طنط؟
      ar: آه، غالٍ. هل يمكن أن تُنقصي يا سيدتي؟
      en: Oh, that's expensive. Can you go lower, ma'am?
    - speaker: Bu Karti
      text: Mas arep tuku pirang kilo?
      ar_eg: عايز تشتري كام كيلو يا أستاذ؟
      ar: كم كيلو تريد أن تشتري يا أخي؟
      en: How many kilos do you want, Mas?
    - speaker: Mohamed
      text: Telung kilo. Selawe ewu wae, ya?
      ar_eg: تلاتة كيلو. خمسة وعشرين ألف بس، ماشي؟
      ar: ثلاثة كيلو. خمسة وعشرون ألفًا فقط، اتفقنا؟
      en: Three kilos. Just twenty-five thousand, OK?
    - speaker: Bu Karti
      text: Ya wis, selawe. Kabeh dadi pitung puluh lima ewu.
      ar_eg: خلاص، خمسة وعشرين. الكل خمسة وسبعين ألف.
      ar: حسنًا، خمسة وعشرون. المجموع خمسة وسبعون ألفًا.
      en: All right, twenty-five. That's seventy-five thousand altogether.
new_words:
  - word: pas / wis pas
    pos: phrase
    ar_eg: آخر سعر
    ar: السعر النهائي
    en: that's the final price (sudah pas)
