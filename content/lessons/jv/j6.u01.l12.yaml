schema: kabar.lesson/v1
id: j6.u01.l12
language: jv
title: Ana kacamata
can_do:
  ar_eg: تقرا ورقة «لقينا حاجة» على فرشة في السوق.
  ar: أن تقرأ ورقة «عُثر على شيء» على بسطة في السوق.
  en: Read a "found item" note at a market stall.
slides:
  - title: Ana kacamata
    body:
      ar_eg: |
        على فرشة Bu Maya في Pasar Kotagedhe فيه ورقة صغيرة متعلقة، مكتوبة بالخط الجاوي. اقراها سطر سطر.
        كلمة جديدة: kacamata = نضارة. هي kaca (إزاز / مراية) + mata (عين)، زي الإندونيسي بالظبط.
      ar: |
        على بسطة Bu Maya في Pasar Kotagedhe ورقة صغيرة معلّقة بالخط الجاوي. اقرأها سطرًا سطرًا.
        كلمة جديدة: kacamata = نظّارة، وهي kaca (زجاج / مرآة) + mata (عين)، كما في الإندونيسية.
      en: |
        At Bu Maya's stall in Pasar Kotagedhe there's a small note hanging up, in aksara Jawa. Read it line by line.
        New word: kacamata = glasses. It's kaca (glass, mirror) + mata (eye), just like in Indonesian.
    grammar: jv.aksara.nglegena
    examples:
      - text: ꦲꦤꦏꦕꦩꦠ (Ana kacamata.)
        ar_eg: فيه نضارة (لقيناها).
        ar: هنا نظّارة (عثرنا عليها).
        en: There's a pair of glasses (found here).
      - text: ꦏꦕꦩꦠꦱꦥ (Kacamata sapa?)
        ar_eg: نضارة مين؟
        ar: نظّارة من؟
        en: Whose glasses?
      - text: ꦩꦪ (Maya)
        ar_eg: Maya (اللي كتبت الورقة)
        ar: Maya (كاتبة الورقة)
        en: Maya (who wrote the note)
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب الورقة، لقوا إيه؟
      ar: بحسب الورقة، على أي شيء عثروا؟
      en: According to the note, what was found?
    options: ["ꦏꦕ", "ꦏꦕꦩꦠ", "ꦩꦠ"]
    answer: 1
    explain:
      ar_eg: ꦏꦕꦩꦠ = kacamata (نضارة). ꦏꦕ لوحدها مراية، وꦩꦠ عين.
      ar: ꦏꦕꦩꦠ = kacamata (نظّارة)، وꦏꦕ وحدها مرآة، وꦩꦠ عين.
      en: ꦏꦕꦩꦠ = kacamata (glasses). ꦏꦕ alone is a mirror, ꦩꦠ an eye.
    words: [kacamata]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين كتب الورقة؟
      ar: من كتب الورقة؟
      en: Who wrote the note?
    options: [Jaka, Dana, Maya]
    answer: 2
    explain:
      ar_eg: آخر سطر ꦩꦪ = Maya، يعني Bu Maya صاحبة الفرشة.
      ar: السطر الأخير ꦩꦪ = Maya، أي Bu Maya صاحبة البسطة.
      en: The last line, ꦩꦪ = Maya — Bu Maya, who runs the stall.
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: السطر التاني بيسأل عن إيه؟
      ar: عمّ يسأل السطر الثاني؟
      en: What does the second line ask?
    options: ["Sapa sing duwe?", "Regane pira?", "Ana ing ngendi?"]
    answer: 0
    explain:
      ar_eg: Kacamata sapa? = نضارة مين؟ يعني «مين صاحبها؟».
      ar: Kacamata sapa? = نظّارة من؟ أي «من صاحبها؟».
      en: Kacamata sapa? = Whose glasses? That is, "Who owns them?"
    words: [kacamata]
  - id: e04
    type: listen
    text: Kacamata sapa?
    question:
      ar_eg: Bu Maya قرت سطر من الورقة. أنهي سطر؟
      ar: قرأت Bu Maya سطرًا من الورقة. أيّه؟
      en: Bu Maya read one line of the note aloud. Which line?
    options: ["ꦲꦤꦏꦕꦩꦠ", "ꦏꦕꦩꦠꦱꦥ", "ꦏꦕꦩꦠꦲꦤ"]
    answer: 1
    meaning:
      ar_eg: نضارة مين؟
      ar: نظّارة من؟
      en: Whose glasses?
    words: [kacamata]
  - id: e05
    type: match_pairs
    pairs:
      - text: ꦏꦕ
        ar_eg: kaca — إزاز / مراية
        ar: kaca — زجاج / مرآة
        en: kaca — glass, mirror
      - text: ꦩꦠ
        ar_eg: mata — عين
        ar: mata — عين
        en: mata — eye
      - text: ꦏꦕꦩꦠ
        ar_eg: kacamata — نضارة
        ar: kacamata — نظّارة
        en: kacamata — glasses
      - text: ꦱꦥ
        ar_eg: sapa — مين؟
        ar: sapa — من؟
        en: sapa — who?
    words: [kacamata]
  - id: e06
    type: fill_blank
    sentence: ꦏꦕꦩꦠ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: نضارة)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: نظّارة)"
      en: Type the reading in Latin letters. (It means "glasses".)
    answers: [kacamata, kaca mata]
    words: [kacamata]
  - id: e07
    type: build_sentence
    source:
      ar_eg: "اكتب أول سطر «Ana kacamata.» حرف حرف."
      ar: "اكتب السطر الأول «Ana kacamata.» حرفًا حرفًا."
      en: "Write the first line, «Ana kacamata.», letter by letter."
    answer: ꦲ ꦤ ꦏ ꦕ ꦩ ꦠ
    distractors: ["ꦗ"]
    words: [kacamata]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦏꦕꦩꦠꦱꦥ"
      ar: "اكتب بالحروف اللاتينية: ꦏꦕꦩꦠꦱꦥ"
      en: "Write in Latin letters: ꦏꦕꦩꦠꦱꦥ"
    answers: ["Kacamata sapa?", kacamata sapa, kacamatasapa]
    words: [kacamata]
  - id: e09
    type: speaking
    text: Kacamata sapa? Iki kacamataku!
    meaning:
      ar_eg: نضارة مين؟ دي نضارتي!
      ar: نظّارة من؟ هذه نظّارتي!
      en: Whose glasses? These are mine!
    words: [kacamata]
dialogue:
  title: Kacamataku ilang
  lines:
    - speaker: Mohamed
      text: Nuwun sewu, Bu. Kacamata kula ical wonten peken.
      ar_eg: لا مؤاخذة يا مدام. نضارتي ضاعت في السوق.
      ar: عذرًا يا سيدتي. ضاعت نظّارتي في السوق.
      en: Excuse me, ma'am. I lost my glasses at the market.
    - speaker: Bu Maya
      text: Wonten kacamata ing mriki, Mas. Menika?
      ar_eg: فيه نضارة هنا يا أستاذ. هي دي؟
      ar: هنا نظّارة يا سيدي. أهي هذه؟
      en: There's a pair of glasses here. Are these them?
    - speaker: Mohamed
      text: Inggih, menika kacamata kula! Kula maos seratan panjenengan.
      ar_eg: أيوه، دي نضارتي! أنا قريت الورقة اللي حضرتك كتبتيها.
      ar: نعم، هذه نظّارتي! قرأتُ ورقتكِ.
      en: Yes, these are my glasses! I read your note.
    - speaker: Bu Maya
      text: Wah, Mas saged maos aksara Jawa?
      ar_eg: يا سلام، إنت بتعرف تقرا الخط الجاوي؟
      ar: ما شاء الله، أتقرأ الخط الجاوي؟
      en: Oh, you can read aksara Jawa?
    - speaker: Mohamed
      text: Sekedhik, Bu. Matur nuwun sanget!
      ar_eg: شوية يا مدام. متشكر قوي!
      ar: قليلًا يا سيدتي. شكرًا جزيلًا!
      en: A little, ma'am. Thank you so much!
new_words:
  - word: kacamata
    pos: noun
    ar_eg: نضارة (kaca + mata)
    ar: نظّارة (kaca + mata)
    en: glasses, spectacles (kaca + mata) = kacamata
review:
  status: draft
  verified: false
