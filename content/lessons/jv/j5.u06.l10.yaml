schema: kabar.lesson/v1
id: j5.u06.l10
language: jv
title: Udan ing Demak
can_do:
  ar_eg: تقرا كلمات أغنية كامبورساري وتتابع حكايتها من «زمان» لـ «دلوقتي».
  ar: أن تقرأ كلمات أغنية كامبورساري وتتابع حكايتها من «قديمًا» إلى «الآن».
  en: Read campursari lyrics and follow the story from "back then" to "now".
slides:
  - title: Tembang campursari anyar
    body:
      ar_eg: |
        ماس رزال كاتب الكلمات دي على طريقة الكامبورساري (أغنية متألّفة لـ Kabar، مش أغنية حقيقية). أغاني الكامبورساري بتحكي حكاية، فتابع أدوات الحكي: biyen (زمان)، nalika (لما)، saiki (دلوقتي).
        مفيش كلمات جديدة: janji وkangen وati وambyar من درس الكامبورساري، وpamit = يستأذن ويودّع، وtanpa = من غير.
      ar: |
        كتب ماس رزال هذه الكلمات على طريقة الكامبورساري (أغنية مؤلفة لـ Kabar، لا أغنية حقيقية). أغاني الكامبورساري تحكي قصة، فتابع أدوات السرد: biyen (قديمًا)، وnalika (حين)، وsaiki (الآن).
        لا كلمات جديدة: janji وkangen وati وambyar من درس الكامبورساري، وpamit = يستأذن مودّعًا، وtanpa = بلا.
      en: |
        Mas Rizal wrote these lines in campursari style (a song made up for Kabar, not a real one). Campursari songs tell a story, so follow the connectors: biyen (back then), nalika (when), saiki (now).
        No new words: janji, kangen, ati and ambyar are from the Campursari lesson; pamit = say goodbye, take leave, and tanpa = without.
    grammar: jv.narrative.connectors
    examples:
      - text: Biyen kowe janji ora bakal lunga.
        ar_eg: زمان وعدتني إنك مش هتمشي.
        ar: قديمًا وعدتني ألّا ترحل.
        en: Back then you promised you'd never leave.
      - text: Nanging nalika udan ing Demak, kowe lunga tanpa pamit.
        ar_eg: بس لما كانت بتمطر في ديماك، مشيت من غير ما تودّعني.
        ar: لكن حين أمطرت في ديماك، رحلت دون وداع.
        en: But when it rained in Demak, you left without a goodbye.
      - text: Saiki aku mung bisa kangen, atiku ambyar.
        ar_eg: ودلوقتي مش باقي لي غير الوحشة، وقلبي اتكسر.
        ar: والآن لا أملك إلا الحنين، وقلبي محطّم.
        en: Now all I can do is miss you; my heart is shattered.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الحبيب وعد بإيه زمان؟
      ar: بمَ وعد الحبيب قديمًا؟
      en: What did the lover promise back then?
    options: [bakal teka sesuk, ora bakal lunga, bakal nulis layang]
    answer: 1
    words: [janji]
    explain:
      ar_eg: في الأغنية الحبيبة وعدت ora bakal lunga، يعني مش هتمشي.
      ar: في الأغنية وعدت الحبيبة ora bakal lunga، أي ألّا ترحل.
      en: "In the song the lover promised ora bakal lunga: never to leave."
  - id: e02
    type: listen
    text: Nanging nalika udan ing Demak, kowe lunga tanpa pamit.
    question:
      ar_eg: الحبيب مشي إمتى؟
      ar: متى رحل الحبيب؟
      en: When did the lover leave?
    options: [nalika udan, nalika esuk, sawise maghrib]
    answer: 0
    meaning:
      ar_eg: بس لما كانت بتمطر في ديماك، مشيت من غير ما تودّعني.
      ar: لكن حين أمطرت في ديماك، رحلت دون وداع.
      en: But when it rained in Demak, you left without a goodbye.
    words: [nalika, pamit]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: المغنّي حاسس بإيه دلوقتي؟
      ar: بمَ يشعر المغنّي الآن؟
      en: How does the singer feel now?
    options: [bungah, seneng banget, kangen lan ambyar]
    answer: 2
    explain:
      ar_eg: 'saiki = دلوقتي: «mung bisa kangen, atiku ambyar».'
      ar: 'saiki = الآن: «mung bisa kangen, atiku ambyar».'
      en: 'saiki = now: "mung bisa kangen, atiku ambyar".'
    words: [kangen, ambyar]
  - id: e04
    type: match_pairs
    pairs:
      - text: janji
        ar_eg: وعد
        ar: وعد
        en: promise
      - text: pamit
        ar_eg: يودّع / يستأذن يمشي
        ar: يودّع مستأذنًا
        en: say goodbye, take leave
      - text: tanpa
        ar_eg: من غير
        ar: بلا / دون
        en: without
      - text: kangen
        ar_eg: وحشني / يحنّ
        ar: يشتاق
        en: miss someone
      - text: ambyar
        ar_eg: متكسّر
        ar: محطّم
        en: shattered
    words: [janji, pamit, kangen, ambyar]
  - id: e05
    type: fill_blank
    sentence: Nanging ___ udan ing Demak, kowe lunga tanpa pamit.
    meaning:
      ar_eg: بس لما كانت بتمطر في ديماك، مشيت من غير ما تودّعني.
      ar: لكن حين أمطرت في ديماك، رحلت دون وداع.
      en: But when it rained in Demak, you left without a goodbye.
    options: [biyen, nalika, pungkasane]
    answers: [nalika]
    words: [nalika]
    explain:
      ar_eg: nalika = لما. biyen = زمان وpungkasane = في الآخر، ومش بييجوا قبل حدث «udan».
      ar: nalika تعني حين. أما biyen فقديمًا وpungkasane أخيرًا.
      en: nalika means "when". biyen is "long ago" and pungkasane is "in the end".
  - id: e06
    type: dictation
    text: Saiki aku mung bisa kangen, atiku ambyar.
    meaning:
      ar_eg: ودلوقتي مش باقي لي غير الوحشة، وقلبي اتكسر.
      ar: والآن لا أملك إلا الحنين، وقلبي محطّم.
      en: Now all I can do is miss you; my heart is shattered.
    words: [kangen, ambyar, ati]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (من الأغنية) مشيت من غير ما تودّعني.
      ar: (من الأغنية) رحلتَ دون وداع.
      en: (from the song) You left without a goodbye.
    answer: Kowe lunga tanpa pamit.
    distractors: [janji, kangen]
    words: [pamit]
    explain:
      ar_eg: tanpa pamit = من غير ما يودّع. janji = وعد وkangen = وحشه، ومش في المعنى.
      ar: tanpa pamit تعني دون وداع. أما janji (وعد) وkangen (اشتياق) فليستا في المعنى.
      en: tanpa pamit is "without a goodbye". janji (promise) and kangen (miss) aren't in the meaning.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (من الأغنية) زمان وعدتني إنك مش هتمشي.
      ar: (من الأغنية) قديمًا وعدتني ألّا ترحل.
      en: (from the song) Back then you promised you'd never leave.
    answers:
      - Biyen kowe janji ora bakal lunga.
      - Biyen kowe janji ora arep lunga.
      - Biyen kowe janji ora lunga.
      - Biyen kowe wis janji ora bakal lunga.
      - Kowe biyen janji ora bakal lunga.
    words: [janji, biyen]
dialogue:
  title: Tembang anyar
  lines:
    - speaker: Mas Rizal
      text: Mohamed, iki tembang campursari anyarku, "Udan ing Demak".
      ar_eg: يا محمد، دي أغنية الكامبورساري الجديدة بتاعتي، «مطر في ديماك».
      ar: يا محمد، هذه أغنيتي الجديدة على طريقة الكامبورساري، «مطر في ديماك».
      en: Mohamed, this is my new campursari song, "Rain in Demak".
    - speaker: Mohamed
      text: Critane piye, Mas?
      ar_eg: حكايتها إيه يا رزال؟
      ar: ما قصتها يا رزال؟
      en: What's the story, Rizal?
    - speaker: Mas Rizal
      text: Biyen kekasihe janji ora bakal lunga. Nanging dheweke lunga tanpa pamit.
      ar_eg: زمان حبيبته وعدت إنها مش هتمشي. بس مشيت من غير ما تودّع.
      ar: قديمًا وعدته حبيبته ألّا ترحل، لكنها رحلت دون وداع.
      en: Back then his sweetheart promised never to leave. But she left without a goodbye.
    - speaker: Mohamed
      text: Waduh, ambyar maneh!
      ar_eg: يا ساتر، قلب مكسور تاني!
      ar: يا للأسف، قلب محطّم مرة أخرى!
      en: Oh no, heartbroken again!
    - speaker: Mas Rizal
      text: Hehe, tembang campursari akeh sing ambyar.
      ar_eg: هههه، أغاني الكامبورساري كتير منها قلوب مكسورة.
      ar: هههه، كثير من أغاني الكامبورساري عن القلوب المحطمة.
      en: Haha, lots of campursari songs are heartbreak songs.
