    pos: letter
    ar_eg: الحرف ma (مَ)
    ar: الحرف ma (مَ)
    en: the letter ma
  - word: ꦒ
    pos: letter
    ar_eg: الحرف ga (الجيم المصري)
    ar: الحرف ga (g، كالجيم المصرية)
    en: the letter ga (hard g)
  - word: ꦧ
    pos: letter
    ar_eg: الحرف ba (بَ)
    ar: الحرف ba (بَ)
    en: the letter ba
  - word: ꦛ
    pos: letter
    ar_eg: الحرف tha (تَ التقيلة)
    ar: الحرف tha (التاء الثقيلة)
    en: the letter tha (heavy, retroflex t)
  - word: ꦔ
    pos: letter
    ar_eg: الحرف nga (نجَ من الأنف، زي ng في sing)
    ar: الحرف nga (نون أنفية كـ ng في sing)
    en: the letter nga (ng as in sing)
