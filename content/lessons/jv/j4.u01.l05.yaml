schema: kabar.lesson/v1
id: j4.u01.l05
language: jv
title: Simbah nimbali
can_do:
  ar_eg: ترد لما حد كبير ينادي عليك، وتسأله عايز إيه وتقول إنك هتستناه.
  ar: أن تستجيب حين يناديك كبير، وتسأله عمّا يودّ، وتقول إنك ستنتظره.
  en: Answer when an elder calls you, ask what they'd like, and say you'll wait.
slides:
  - title: Simbah nimbali, Simbah midhanget
    body:
      ar_eg: |
        لما الكبير بينادي أو بيسمع، الفعل نفسه بيتكرّم:
        - ngrungokake = يسمع/يستمع (نغوكو) ← midhanget (krama inggil): «Simbah saweg midhanget gendhing.»
        - nimbali = ينادي/يستدعي (krama inggil لـ nyeluk وngundang): «Simbah nimbali panjenengan.»
        - ngersakaken = عايز/يرغب في (krama inggil): «Simbah ngersakaken menapa?» = تيتة تحب إيه؟
        - ngrantos = يستنّى (كراما مهذّبة)، وتنفع عن نفسك: «Kula ngrantos wonten mriki.»
        وفي المطبخ: wedang = مشروب سخن (wedang jahe = جنزبيل سخن)، cangkir = فنجان.
      ar: |
        حين يتكلم الكبير أو يستمع، يتبدّل الفعل نفسه تكريمًا له:
        - ngrungokake = يستمع (نغوكو) ← midhanget (krama inggil): «Simbah saweg midhanget gendhing.»
        - nimbali = ينادي/يستدعي (krama inggil لـ nyeluk وngundang): «Simbah nimbali panjenengan.»
        - ngersakaken = يرغب في (krama inggil): «Simbah ngersakaken menapa?» = ماذا تودّين يا جدّتي؟
        - ngrantos = ينتظر (كراما مهذّبة)، ويصحّ عن نفسك: «Kula ngrantos wonten mriki.»
        وفي المطبخ: wedang = شراب ساخن (wedang jahe = شراب الزنجبيل)، cangkir = فنجان.
      en: |
        When an elder calls or listens, the verb itself is raised:
        - ngrungokake = listen (ngoko) → midhanget (krama inggil): "Simbah saweg midhanget gendhing."
        - nimbali = call for, summon (krama inggil for nyeluk and ngundang): "Simbah nimbali panjenengan."
        - ngersakaken = would like, want (krama inggil): "Simbah ngersakaken menapa?" = what would you like, Grandma?
        - ngrantos = wait (refined krama), fine about yourself too: "Kula ngrantos wonten mriki."
        In the kitchen: wedang = hot drink (wedang jahe = hot ginger drink), cangkir = cup.
    examples:
      - text: Simbah ngersakaken wedang jahe.
        ar_eg: تيتة عايزة جنزبيل سخن.
        ar: الجدّة تودّ شراب الزنجبيل الساخن.
        en: Grandma would like a hot ginger drink.
      - text: Bapak nimbali panjenengan, Mas.
        ar_eg: الأستاذ بينادي عليك يا ماس.
        ar: الوالد يناديك يا ماس.
        en: Father is calling for you, Mas.
      - text: Kula ngrantos wonten mriki, Bu.
        ar_eg: أنا هستنى هنا يا هانم.
        ar: سأنتظر هنا يا سيدتي.
        en: I'll wait here, ma'am.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: nimbali
        ar_eg: ينادي (للكبير)
        ar: ينادي ويستدعي (للكبير)
        en: call for (elder)
      - text: ngrantos
        ar_eg: يستنّى (كراما مهذبة)
        ar: ينتظر (كراما مهذّبة)
        en: wait (refined krama)
      - text: midhanget
        ar_eg: يسمع (للكبير)
        ar: يستمع (للكبير)
        en: listen (elder)
      - text: ngrungokake
        ar_eg: يسمع (نغوكو)
        ar: يستمع (نغوكو)
        en: listen (ngoko)
    words: [nimbali, ngrantos, midhanget, ngrungokake]
  - id: e02
    type: match_pairs
    pairs:
      - text: wedang
        ar_eg: مشروب سخن
        ar: شراب ساخن
        en: hot drink
      - text: jahe
        ar_eg: جنزبيل
        ar: زنجبيل
        en: ginger
      - text: cangkir
        ar_eg: فنجان
        ar: فنجان
        en: cup
      - text: ngersakaken
        ar_eg: عايز (للكبير)
        ar: يودّ (للكبير)
        en: would like (elder)
    words: [wedang, jahe, cangkir, ngersakaken]
  - id: e03
    type: listen
    text: Simbah nimbali panjenengan.
    question:
      ar_eg: تيتة بتعمل إيه؟
      ar: ماذا تفعل الجدّة؟
      en: What is Grandma doing?
    options: [تيتة بتنادي عليك, تيتة نايمة, تيتة بتسمع الراديو]
    answer: 0
    meaning:
      ar_eg: تيتة بتنادي عليك.
      ar: الجدّة تناديك.
      en: Grandma is calling for you.
    words: [nimbali]
  - id: e04
    type: fill_blank
    sentence: Simbah saweg ___ radio.
    meaning:
      ar_eg: تيتة ___ للراديو.
      ar: الجدّة ___ إلى المذياع.
      en: Grandma is ___ to the radio.
    options: [midhanget, ngrantos, nimbali]
    answers: [midhanget]
    words: [midhanget, ngrantos, nimbali]
    explain:
      ar_eg: تيتة بتسمع الراديو = midhanget. ngrantos يعني يستنى، وnimbali يعني ينادي على حد.
      ar: الجدّة تستمع إلى المذياع = midhanget، أما ngrantos فمعناه ينتظر، وnimbali ينادي أحدًا.
      en: Grandma listening to the radio is midhanget. ngrantos means "wait" and nimbali "call someone".
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: 'عايز تسأل الأستاذ بأدب: «حضرتك تحب إيه؟». تقول إيه؟'
      ar: 'تريد أن تسأل الأستاذ بأدب: «ماذا تودّ؟». ماذا تقول؟'
      en: You want to ask the gentleman politely, 'What would you like?' What do you say?
    options: ['Bapak ngrungokake menapa?', 'Bapak ngersakaken menapa?', 'Bapak ngrantos menapa?']
    answer: 1
    explain:
      ar_eg: ngersakaken = عايز، للكبير. ngrungokake = يسمع، وngrantos = يستنّى.
      ar: ngersakaken = يودّ، للكبير. ngrungokake = يستمع، وngrantos = ينتظر.
      en: ngersakaken = would like, for the elder. ngrungokake = listen, ngrantos = wait.
    words: [ngersakaken, ngrungokake, ngrantos]
  - id: e06
    type: fill_blank
    sentence: Simbah ngersakaken wedang ___.
    meaning:
      ar_eg: تيتة عايزة ___ سخن.
      ar: الجدّة تودّ شراب ___ ساخنًا.
      en: Grandma would like a hot ___ drink.
    options: [jahe, cangkir, ngrantos]
    answers: [jahe]
    words: [jahe, cangkir, ngrantos, wedang]
    explain:
      ar_eg: wedang jahe = مشروب جنزبيل سخن. cangkir فنجان مش طعم، وngrantos فعل يعني يستنى.
      ar: wedang jahe = شراب الزنجبيل الساخن، أما cangkir ففنجان لا نكهة، وngrantos فعل بمعنى ينتظر.
      en: wedang jahe is hot ginger drink. cangkir is a cup, not a flavour, and ngrantos is a verb, "wait".
  - id: e07
    type: build_sentence
    source:
      ar_eg: الفنجان ده لتيتة.
      ar: هذا الفنجان للجدّة.
      en: This cup is for Grandma.
    answer: Cangkir menika kagem Simbah.
    distractors: [jahe, nimbali]
    words: [cangkir]
    explain:
      ar_eg: الجملة عن الفنجان (cangkir) اللي لتيتة. jahe الجنزبيل نفسه، وnimbali فعل ينادي.
      ar: الجملة عن الفنجان (cangkir) الخاصّ بالجدّة، أما jahe فالزنجبيل نفسه، وnimbali فعل ينادي.
      en: The sentence is about Grandma's cup (cangkir). jahe is the ginger itself and nimbali the verb "call".
  - id: e08
    type: translate
    direction: from_target
    source_text: Aku arep ngrungokake radio karo Simbah.
    answers_meaning:
      ar_eg: [هسمع الراديو مع تيتة, أنا هسمع راديو مع تيتة]
      ar: [سأستمع إلى المذياع مع الجدّة, سأستمع إلى الراديو مع الجدّة]
      en: ['I''m going to listen to the radio with Grandma', 'I''ll listen to the radio with Grandma']
    words: [ngrungokake]
  - id: e09
    type: speaking
    text: Simbah ngersakaken wedang jahe?
    meaning:
      ar_eg: تيتة تحبي جنزبيل سخن؟
      ar: هل تودّين شراب الزنجبيل يا جدّتي؟
      en: Would you like a hot ginger drink, Grandma?
    words: [ngersakaken, wedang, jahe]
  - id: e10
    type: multiple_choice
    question: Mas Dimas ngrungokake radio. Simbah uga ___ radio.
    options: [nimbali, ngrungokake, midhanget]
    answer: 2
    explain:
      ar_eg: للكبير بنقول midhanget، مش ngrungokake.
      ar: للكبير نقول midhanget لا ngrungokake.
      en: For the elder it's midhanget, not ngrungokake.
    words: [midhanget, ngrungokake, nimbali, cangkir]
dialogue:
  lines:
    - speaker: Bu Harsono
      text: Mas Mohamed, Simbah nimbali panjenengan.
      ar_eg: يا ماس محمد، تيتة بتنادي عليك.
      ar: يا ماس محمد، الجدّة تناديك.
      en: Mohamed, Grandma is calling for you.
    - speaker: Mohamed
      text: Inggih, Bu. Simbah wonten pundi?
      ar_eg: حاضر يا هانم. تيتة فين؟
      ar: حاضر يا سيدتي. أين الجدّة؟
      en: Yes, ma'am. Where is Grandma?
    - speaker: Bu Harsono
      text: Wonten pendhapa, saweg midhanget gendhing.
      ar_eg: في البندوبو، بتسمع جندينج.
      ar: في البندوبو، تستمع إلى الغاميلان.
      en: In the pendhapa, listening to gamelan music.
    - speaker: Mohamed
      text: Mbah, Simbah ngersakaken menapa?
      ar_eg: يا تيتة، تحبي إيه؟
      ar: يا جدّتي، ماذا تودّين؟
      en: Grandma, what would you like?
    - speaker: Mbah Putri
      text: Wedang jahe, Nak. Setunggal cangkir kemawon.
      ar_eg: جنزبيل سخن يا ابني. فنجان واحد بس.
      ar: شراب الزنجبيل يا بنيّ. فنجانًا واحدًا فقط.
      en: A hot ginger drink, dear. Just one cup.
    - speaker: Mohamed
      text: Inggih, Mbah. Kula damelaken rumiyin.
      ar_eg: حاضر يا تيتة. هعملهولك دلوقتي.
      ar: حاضر يا جدّتي. سأعدّه لكِ أولًا.
      en: Yes, Grandma. I'll make it for you now.
