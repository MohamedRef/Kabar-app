schema: kabar.lesson/v1
id: j1.u03.l06
language: jv
title: Utawa, banjur, dadi
can_do:
  ar_eg: 'تربط كلامك في الشات: أو، وبعدين، يعني، وتقول «مش فاهم خالص» و«ماتتأخرش».'
  ar: 'أن تربط كلامك في الدردشة: أو، ثم، إذن، وتقول «لا أفهم إطلاقًا» و«لا تتأخر».'
  en: Link your chat messages with or, then and so, and say "I don't get it at all" and "don't…".
slides:
  - title: Utawa, banjur, dadi, kandha
    body:
      ar_eg: |
        - **utawa** = أو (atau): mangan utawa turu? = تاكل ولا تنام؟
        - **banjur** = وبعدين (lalu): Mangan dhisik, banjur turu.
        - **dadi** = يبقى / يعني (jadi): Dadi, sesuk isa? = يعني بكرة ينفع؟
        - **kandha** = يقول / يحكي (bilang): Kandha karo aku = قولّي. (jare اللي عرفناها = «بيقولوا»)
      ar: |
        - **utawa** = أو (atau): mangan utawa turu? = تأكل أم تنام؟
        - **banjur** = ثم (lalu): Mangan dhisik, banjur turu.
        - **dadi** = يصير / إذن (jadi): Dadi, sesuk isa? = إذن هل يناسبك غدًا؟
        - **kandha** = يقول / يخبر (bilang): Kandha karo aku = أخبرني. (وjare التي عرفناها = «يقولون»)
      en: |
        - **utawa** = or (atau): mangan utawa turu? = eat or sleep?
        - **banjur** = then (lalu): Mangan dhisik, banjur turu.
        - **dadi** = so; become (jadi): Dadi, sesuk isa? = So, does tomorrow work?
        - **kandha** = say, tell (bilang): Kandha karo aku = Tell me. (jare, which you know, = "they say")
    examples:
      - text: Mangan dhisik, banjur turu.
        ar_eg: كُل الأول وبعدين نام.
        ar: كُلْ أولًا ثم نَمْ.
        en: Eat first, then sleep.
  - title: Aja, blas, pokoke, wayah
    body:
      ar_eg: |
        - **aja** = ماتـ… (jangan)، بتتنطق «ojo» وكده بتتكتب في الشات: Aja turu! = ماتنامش!
        - **ra … blas** = مش … خالص (sama sekali): Aku ra ngerti blas = مش فاهم أي حاجة.
        - **pokoke** = المهم / من الآخر (pokoknya): Pokoke sesuk ketemu!
        - **wayah** = وقت: Wis wayahe mangan = جه وقت الأكل.
      ar: |
        - **aja** = لا الناهية (jangan)، وتُنطق «ojo» وهكذا تُكتب في الدردشة: Aja turu! = لا تنم!
        - **ra … blas** = لا … إطلاقًا (sama sekali): Aku ra ngerti blas = لا أفهم شيئًا إطلاقًا.
        - **pokoke** = المهم / خلاصة القول (pokoknya): Pokoke sesuk ketemu!
        - **wayah** = وقت: Wis wayahe mangan = حان وقت الأكل.
      en: |
        - **aja** = don't (jangan), said "ojo" and spelled that way in chats: Aja turu! = Don't sleep!
        - **ra … blas** = not … at all (sama sekali): Aku ra ngerti blas = I don't get it at all.
        - **pokoke** = the point is, anyway (pokoknya): Pokoke sesuk ketemu!
        - **wayah** = time: Wis wayahe mangan = It's time to eat.
    examples:
      - text: Aku ra ngerti blas.
        ar_eg: أنا مش فاهم خالص.
        ar: لا أفهم إطلاقًا.
        en: I don't get it at all.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: utawa
        ar_eg: أو
        ar: أو
        en: or
      - text: banjur
        ar_eg: وبعدين
        ar: ثم
        en: then
      - text: dadi
        ar_eg: يبقى / يعني
        ar: يصير / إذن
        en: so, become
      - text: kandha
        ar_eg: يقول
        ar: يقول
        en: say, tell
    words: [utawa, banjur, dadi, kandha]
  - id: e02
    type: match_pairs
    pairs:
      - text: aja / ojo
        ar_eg: ماتـ…
        ar: لا الناهية
        en: don't
      - text: blas
        ar_eg: خالص (مع النفي)
        ar: إطلاقًا (مع النفي)
        en: at all (with not)
      - text: pokoke
        ar_eg: المهم
        ar: خلاصة القول
        en: the point is
      - text: wayah
        ar_eg: وقت
        ar: وقت
        en: time
    words: [aja / ojo, blas, pokoke, wayah]
  - id: e03
    type: listen
    text: Aku ra ngerti blas.
    question:
      ar_eg: فاهم ولا لأ؟
      ar: هل فهم؟
      en: Does he understand?
    options: [مش فاهم خالص, فاهم شوية, فهمت خلاص]
    answer: 0
    meaning:
      ar_eg: أنا مش فاهم خالص.
      ar: لا أفهم إطلاقًا.
      en: I don't get it at all.
    words: [blas]
  - id: e04
    type: fill_blank
    sentence: Mangan ___ turu?
    meaning:
      ar_eg: تاكل ___ تنام؟
      ar: تأكل ___ تنام؟
      en: Eat ___ sleep?
    options: [utawa, banjur, kandha]
    answers: [utawa]
    words: [utawa, banjur, kandha]
    explain:
      ar_eg: utawa = ولا / أو، بين اختيارين. banjur = بعدين، وkandha = يقول.
      ar: utawa = أو، بين خيارين؛ أما banjur فثم، وkandha يقول.
      en: utawa = or, between two choices. banjur = then, kandha = say.
  - id: e05
    type: fill_blank
    sentence: Wis ___ turu, cah!
    meaning:
      ar_eg: جه ___ النوم يا جماعة!
      ar: حان ___ النوم يا رفاق!
      en: It's ___ for bed, guys!
    options: [wayahe, pokoke, utawa]
    answers: [wayahe]
    words: [wayah, pokoke, utawa]
    explain:
      ar_eg: "wayahe = جه وقت: wis wayahe turu = جه وقت النوم. pokoke = المهم / باختصار، وutawa = أو."
      ar: "wayahe = حان وقت: wis wayahe turu = حان وقت النوم؛ أما pokoke فالمهم، وutawa أو."
      en: "wayahe = it's time: wis wayahe turu = it's bedtime. pokoke = the point is, utawa = or."
  - id: e06
    type: multiple_choice
    question: Aja turu saiki!
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [ماتنامش دلوقتي!, نام دلوقتي!, هتنام إمتى؟]
    answer: 0
    explain:
      ar_eg: aja = jangan (ماتـ…)، وsaiki = دلوقتي.
      ar: aja = jangan (لا الناهية)، وsaiki = الآن.
      en: aja = jangan (don't), saiki = now.
    words: [aja / ojo, saiki]
  - id: e07
    type: multiple_choice
    question: Mangan dhisik, banjur turu.
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [كُل الأول، وبعدين نام, نام الأول، وبعدين كُل, كُل أو نام]
    answer: 0
    explain:
      ar_eg: banjur = lalu (وبعدين). «أو» تبقى utawa.
      ar: banjur = lalu (ثم)، أما «أو» فـ utawa.
      en: banjur = lalu (then). "Or" would be utawa.
    words: [banjur, utawa]
  - id: e08
    type: build_sentence
    source:
      ar_eg: يعني بكرة تقدر؟
      ar: إذن، هل تستطيع غدًا؟
      en: So, can you make it tomorrow?
    answer: Dadi, sesuk kowe isa?
    distractors: [banjur, aja]
    words: [dadi, aja / ojo]
    explain:
      ar_eg: dadi = يعني / يبقى، في أول الجملة. banjur = بعدين، وaja = متعملش، ومش في المعنى.
      ar: dadi = إذن، في أول الجملة؛ أما banjur فثم، وaja لا تفعل، وليسا في المعنى.
      en: dadi = so, at the start. banjur (then) and aja (don't) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Kandha karo aku, aku ra ngerti blas.
    answers_meaning:
      ar_eg: [قولّي، أنا مش فاهم حاجة خالص, احكيلي، أنا مش فاهم أي حاجة]
      ar: [أخبرني، فأنا لا أفهم شيئًا إطلاقًا, قل لي، لا أفهم أبدًا]
      en: ['Tell me, I don''t get it at all', 'Tell me, I don''t understand anything']
    words: [kandha, blas]
  - id: e10
    type: speaking
    text: Dadi, wis wayahe mangan. Pokoke ayo!
    meaning:
      ar_eg: يعني جه وقت الأكل. المهم يلا!
      ar: إذن حان وقت الأكل. المهم هيّا!
      en: So it's time to eat. Anyway, let's go!
    words: [dadi, wayah, pokoke]
dialogue:
  lines:
    - speaker: Mas Heru
      text: Mas Mohamed, sesuk nongkrong utawa sinau?
      ar_eg: يا ماس محمد، بكرة نخرج ولا تذاكر؟
      ar: يا محمد، غدًا نسهر أم تدرس؟
      en: 'Mohamed, tomorrow: hanging out or studying?'
    - speaker: Mohamed
      text: Sinau dhisik, banjur nongkrong.
      ar_eg: أذاكر الأول، وبعدين نخرج.
      ar: أدرس أولًا، ثم نخرج.
      en: Study first, then hang out.
    - speaker: Mas Heru
      text: Dadi saiki?
      ar_eg: يعني دلوقتي؟
      ar: إذن الآن؟
      en: So, now?
    - speaker: Mohamed
      text: Aku ra ngerti blas, Mas. Pokoke sore.
      ar_eg: مش عارف خالص يا ماس. المهم العصر.
      ar: لا أعرف إطلاقًا يا أخي. المهم في المساء.
      en: No idea at all, Mas. Anyway, in the afternoon.
    - speaker: Mas Heru
      text: Oke. Aja telat, ya!
      ar_eg: ماشي. ماتتأخرش!
      ar: حسنًا. لا تتأخر!
      en: OK. Don't be late!
new_words:
  - word: utawa
    pos: conjunction
    ar_eg: أو (atau)
    ar: أو (atau)
    en: or (atau)
  - word: banjur
    pos: conjunction
    ar_eg: وبعدين (lalu)
    ar: ثم (lalu)
    en: then (lalu)
  - word: dadi
    pos: verb
    ar_eg: يبقى / يعني (jadi)
    ar: يصير / إذن (jadi)
    en: to become; so (jadi)
  - word: kandha
    pos: verb
    ar_eg: يقول / يحكي (bilang)
    ar: يقول / يخبر (bilang)
    en: to say, tell (bilang)
  - word: aja / ojo
    pos: particle
    ar_eg: ماتـ… (jangan)؛ بتتنطق ojo (≠ إندونيسي aja = بس)
    ar: لا الناهية (jangan)؛ وتُنطق ojo (≠ الإندونيسية aja = فقط)
    en: don't (jangan); said ojo (≠ Indonesian aja "just")
    false_friend: aja
  - word: blas
    pos: adverb
    ar_eg: 'خالص (مع النفي: ra … blas)'
    ar: 'إطلاقًا (مع النفي: ra … blas)'
    en: 'at all (with not: ra … blas)'
  - word: pokoke
    pos: adverb
    ar_eg: المهم / من الآخر (pokoknya)
    ar: المهم / خلاصة القول (pokoknya)
    en: the point is, anyway (pokoknya)
  - word: wayah
    pos: noun
    ar_eg: وقت؛ wis wayahe = جه الوقت
    ar: وقت؛ wis wayahe = حان الوقت
    en: time; wis wayahe = it's time
review:
  status: draft
  verified: false
