schema: kabar.lesson/v1
id: j5.u04.l04
language: jv
title: Aja sombong
can_do:
  ar_eg: 'تقرا خناقة في الكومنتات: مين بيتنك، ومين غيران، وإزاي اتصالحوا.'
  ar: 'أن تقرأ شجارًا في التعليقات: من يتكبّر ومن يحسد وكيف تصالحوا.'
  en: 'Read a comment-thread fight: who''s showing off, who''s jealous and how they made up.'
slides:
  - title: Ing kolom komentar
    body:
      ar_eg: |
        sombong = متكبر أو بيتنك، iri = حاسد (عايز اللي عند غيره)، cemburu = غيران (على حبيبه).
        sambat = يشتكي ويتأفف، kapok = اتعلم الدرس ومش هيعملها تاني.
        njaluk ngapura = يطلب السماح، nyapa = يسلّم على حد، selo = فاضي.
      ar: |
        sombong = متكبّر، iri = حاسد (يتمنى ما عند غيره)، cemburu = غيور (على حبيبه).
        sambat = يشكو ويتذمّر، kapok = تعلّم الدرس فلن يكررها.
        njaluk ngapura = يطلب الصفح، nyapa = يحيّي أحدًا، selo = متفرّغ.
      en: |
        sombong = arrogant, showing off; iri = envious; cemburu = jealous (over a partner).
        sambat = complain, moan; kapok = learned one's lesson, never again.
        njaluk ngapura = ask forgiveness, nyapa = greet someone, selo = free, not busy.
    examples:
      - text: Aja sombong, kabeh wong bisa salah.
        ar_eg: ماتتكبرش، كل الناس بتغلط.
        ar: لا تتكبّر، فكل الناس يخطئون.
        en: Don't be arrogant; everyone makes mistakes.
      - text: Kowe kok sambat terus ing status?
        ar_eg: إنت ليه على طول بتشتكي في الستيتس؟
        ar: لماذا تشكو دائمًا في منشوراتك؟
        en: Why do you keep moaning in your status?
      - text: Aku kapok, ora arep nyebarake warta palsu maneh.
        ar_eg: اتعلمت الدرس، مش هنشر أخبار كدب تاني.
        ar: تعلّمت الدرس، لن أنشر أخبارًا كاذبة مرة أخرى.
        en: 'Lesson learned: I won''t spread fake news again.'
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sambat
        ar_eg: يشتكي
        ar: يشكو
        en: complain
      - text: sombong
        ar_eg: متكبر
        ar: متكبّر
        en: arrogant
      - text: iri
        ar_eg: حاسد
        ar: حاسد
        en: envious
      - text: kapok
        ar_eg: اتعلم الدرس
        ar: تعلّم الدرس
        en: never again
    words: [sambat, sombong, iri, kapok]
  - id: e02
    type: match_pairs
    pairs:
      - text: ngapura
        ar_eg: يسامح
        ar: يصفح
        en: forgive
      - text: nyapa
        ar_eg: يسلّم على
        ar: يحيّي
        en: greet
      - text: selo
        ar_eg: فاضي
        ar: متفرّغ
        en: free, not busy
      - text: cemburu
        ar_eg: غيران
        ar: غيور
        en: jealous
    words: [ngapura, nyapa, selo, cemburu]
  - id: e03
    type: listen
    text: Yen selo, nyapa simbah ing omah, ya.
    question:
      ar_eg: المطلوب إيه؟
      ar: ما المطلوب؟
      en: What's being asked?
    options: [لما يفضى يسلّم على جدته, يشتكي من الشغل, يرفع فيديو]
    answer: 0
    meaning:
      ar_eg: لما تفضى، سلّم على جدتك في البيت.
      ar: حين تتفرّغ، حيِّ جدتك في البيت.
      en: When you're free, go and say hello to Grandma at home.
    words: [selo, nyapa]
  - id: e04
    type: fill_blank
    sentence: Dheweke ___ amarga kancane duwe HP anyar.
    meaning:
      ar_eg: هو ___ عشان صاحبه عنده موبايل جديد.
      ar: هو ___ لأن صديقه لديه هاتف جديد.
      en: He's ___ because his friend has a new phone.
    options: [iri, sombong, nyapa]
    answers: [iri]
    words: [iri, sombong, nyapa]
    explain:
      ar_eg: iri = حسود / غيران من حاجة عند غيره. sombong = متكبر وnyapa = يسلّم.
      ar: iri تعني الحسد على ما عند غيره. أما sombong فمتكبّر وnyapa يحيّي.
      en: iri is envious of what someone has. sombong is arrogant and nyapa is "greet".
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: واحد على طول بيتفشخر بعربيته وفلوسه. هو …
      ar: شخص يتباهى دائمًا بسيارته وماله. هو …
      en: Someone always boasts about his car and money. He is …
    options: [kapok, sombong, selo]
    answer: 1
    explain:
      ar_eg: sombong = متكبر بيتنك.
      ar: sombong = متكبّر متباهٍ.
      en: sombong = arrogant, a show-off.
    words: [kapok, sombong, selo]
  - id: e06
    type: fill_blank
    sentence: Aku wis ___, ora arep telat maneh.
    meaning:
      ar_eg: أنا خلاص ___، مش هتأخر تاني.
      ar: لقد ___، لن أتأخر مرة أخرى.
      en: I've ___; I won't be late again.
    options: [kapok, cemburu, sambat]
    answers: [kapok]
    words: [kapok, cemburu, sambat]
    explain:
      ar_eg: kapok = اتعلمت الدرس ومش هعيدها. cemburu = غيرة (في الحب) وsambat = يشتكي.
      ar: kapok تعني تعلّمت الدرس ولن أكرّرها. أما cemburu فغيرة عاطفية وsambat يشتكي.
      en: kapok means "learned my lesson". cemburu is romantic jealousy and sambat is "complain".
  - id: e07
    type: multiple_choice
    question: Bojone ___ yen dheweke chatting karo wong wadon.
    options: [ngapura, nyapa, cemburu]
    answer: 2
    explain:
      ar_eg: cemburu = غيرة على الحبيب. iri = حسد على حاجة.
      ar: cemburu = غيرة على الحبيب، وiri = حسد على شيء.
      en: cemburu = jealous over a partner; iri = envious of things.
    words: [ngapura, nyapa, cemburu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا بطلب السماح، أنا غلطت.
      ar: أطلب الصفح، لقد أخطأت.
      en: I'm sorry, I was wrong.
    answer: Aku njaluk ngapura, aku salah.
    distractors: [sombong, sambat]
    words: [ngapura]
    explain:
      ar_eg: njaluk ngapura = بطلب السماح. sombong = متكبر وsambat = يشتكي، ومش في المعنى.
      ar: njaluk ngapura تعني أطلب المعذرة. أما sombong (متكبّر) وsambat (يشتكي) فليستا في المعنى.
      en: njaluk ngapura is "I'm sorry". sombong (arrogant) and sambat (complain) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Dheweke iri lan sambat terus ing medsos.
    answers_meaning:
      ar_eg: [هو حاسد وعلى طول بيشتكي على السوشيال ميديا, هو غيران من الناس وبيتأفف على طول في السوشيال]
      ar: [هو حاسد ويشكو دائمًا في وسائل التواصل, إنه يحسد غيره ويتذمّر باستمرار على وسائل التواصل]
      en: ['He''s envious and keeps complaining on social media', He is jealous and always moaning on social media]
    words: [iri, sambat]
  - id: e10
    type: speaking
    text: Aku selo saiki, ayo nyapa Mbak Ayu.
    meaning:
      ar_eg: أنا فاضي دلوقتي، يلا نسلّم على ميباك أيو.
      ar: أنا متفرّغ الآن، هيا نحيّي مباك أيو.
      en: I'm free now; let's go and say hi to Mbak Ayu.
    words: [selo, nyapa]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: 'Delengen komentar iki: ''Sombong tenan, mung pamer mobil anyar!'''
      ar_eg: 'بص الكومنت ده: «متكبر بجد، كل همه يتفشخر بالعربية الجديدة!»'
      ar: 'انظر إلى هذا التعليق: «متكبّر حقًا، لا يفعل إلا التباهي بسيارته الجديدة!»'
      en: 'Look at this comment: ''So arrogant, just showing off his new car!'''
    - speaker: Mohamed
      text: Wong sing nulis iku iri, ta?
      ar_eg: اللي كاتبه ده حاسد، صح؟
      ar: من كتبه حاسد، أليس كذلك؟
      en: The one who wrote it is envious, right?
    - speaker: Mbak Ayu
      text: Mbok menawa. Sing duwe akun banjur sambat dawa.
      ar_eg: يمكن. وصاحب الحساب قعد يشتكي كتير.
      ar: ربما. ثم أطال صاحب الحساب الشكوى.
      en: Maybe. Then the account owner moaned at length.
    - speaker: Mohamed
      text: Pungkasane piye?
      ar_eg: وفي الآخر حصل إيه؟
      ar: وكيف انتهى الأمر؟
      en: How did it end?
    - speaker: Mbak Ayu
      text: Wong loro iku njaluk ngapura. Saiki padha nyapa maneh.
      ar_eg: الاتنين طلبوا السماح. ودلوقتي بيسلموا على بعض تاني.
      ar: طلب الاثنان الصفح، والآن يحيّي أحدهما الآخر من جديد.
      en: Both of them said sorry. Now they say hi to each other again.
    - speaker: Mohamed
      text: Apik. Aku kapok padu ing medsos!
      ar_eg: حلو. أنا خلاص اتعلمت، مش هتخانق على السوشيال تاني!
      ar: جميل. تعلّمت الدرس، لن أتشاجر على وسائل التواصل!
      en: Good. I've learned my lesson about arguing online!
