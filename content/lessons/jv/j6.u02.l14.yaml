  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: "في ꦧꦸꦏꦸꦤꦺꦒꦼꦝꦺ، أنهي علامة على ꦤ في bukune؟"
      ar: "في ꦧꦸꦏꦸꦤꦺꦒꦼꦝꦺ، ما العلامة التي على ꦤ في bukune؟"
      en: "In ꦧꦸꦏꦸꦤꦺꦒꦼꦝꦺ, which mark is on ꦤ in bukune?"
    options: [pepet, taling, suku]
    answer: 1
    explain:
      ar_eg: ‑ne في bukune بتتنطق é، فبتتكتب taling قبل ꦤ.
      ar: ‑ne في bukune تُنطق é، فتُكتب taling قبل ꦤ.
      en: The ‑ne of bukune is said é, so it's taling before ꦤ.
    words: [taling]
  - id: e07
