      ar: "اكتب بالحروف اللاتينية: ꦮꦠꦶꦭꦸꦔꦔꦗꦶꦱꦺꦴꦫꦺ"
      en: "Write in Latin letters: ꦮꦠꦶꦭꦸꦔꦔꦗꦶꦱꦺꦴꦫꦺ"
    answers: ["Wati lunga ngaji sore.", siti lunga ngaji sore, sitilungangajisore]
    words: [wulu, suku, taling tarung]
dialogue:
  title: Crita Wati
  lines:
    - speaker: Dimas
      text: Piye, Med? Kowe ngerti critane?
      ar_eg: إيه رأيك يا محمد؟ فهمت الحكاية؟
      ar: ما رأيك يا محمد؟ أفهمت الحكاية؟
      en: Well, Med? Did you follow the story?
    - speaker: Mohamed
      text: Ngerti. Wati lunga ngaji, gawa buku gedhe.
      ar_eg: فهمت. واتي راحت الحلقة وواخدة كتاب كبير.
      ar: فهمت. ذهبت واتي إلى الحلقة تحمل كتابًا كبيرًا.
      en: Yes. Wati goes to Qur'an class with a big book.
    - speaker: Dimas
      text: Bener. Kowe isa maca tulisane uga?
      ar_eg: صح. وتقدر تقرا الكتابة كمان؟
      ar: صحيح. وهل تستطيع قراءة الكتابة أيضًا؟
      en: Right. Can you read the writing too?
    - speaker: Mohamed
      text: Isa! Si, ti, lu, nga... Wati lunga ngaji sore.
      ar_eg: أيوه! سي، تي، لو، نغا... Wati lunga ngaji sore.
      ar: نعم! سي، تي، لو، نغا... Wati lunga ngaji sore.
      en: I can! Si, ti, lu, nga... Wati lunga ngaji sore.
