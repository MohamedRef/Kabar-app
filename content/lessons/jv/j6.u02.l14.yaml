    answer: 1
    explain:
      ar_eg: ꦧꦸꦏꦸꦤꦺꦒꦼꦝꦺ = Bukune gedhe (كتابها كبير).
      ar: ꦧꦸꦏꦸꦤꦺꦒꦼꦝꦺ = Bukune gedhe (كتابها كبير).
      en: ꦧꦸꦏꦸꦤꦺꦒꦼꦝꦺ = Bukune gedhe (her book is big).
    words: [pepet, taling]
  - id: e04
    type: match_pairs
