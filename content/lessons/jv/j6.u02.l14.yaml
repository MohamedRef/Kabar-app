    type: listen
    text: Wati lunga ngaji sore.
    question:
      ar_eg: واتي راحت فين؟
      ar: إلى أين ذهبت واتي؟
      en: Where does Wati go?
    options: [ngaji, pasar, sekolah]
    answer: 0
    meaning:
      ar_eg: واتي راحت حلقة القرآن العصر.
      ar: ذهبت واتي إلى حلقة القرآن عصرًا.
      en: Wati goes to Qur'an class in the afternoon.
    words: [wulu]
  - id: e02
    type: listen
    text: Wati gawa buku.
    question:
      ar_eg: واتي واخدة معاها إيه؟
      ar: ماذا تحمل واتي؟
      en: What does Wati take with her?
    options: ["ꦱꦼꦒ", "ꦏꦺꦴꦥꦶ", "ꦧꦸꦏꦸ"]
    answer: 2
