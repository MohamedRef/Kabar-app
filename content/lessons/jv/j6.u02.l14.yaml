schema: kabar.lesson/v1
id: j6.u02.l14
language: jv
title: Wati lunga ngaji
can_do:
  ar_eg: تسمع قصة قصيرة وتتابعها مكتوبة بالخط الجاوي.
  ar: أن تسمع قصة قصيرة وتتابعها مكتوبة بالخط الجاوي.
  en: Follow a short story by ear and in aksara Jawa.
slides:
  - title: Crita cekak
    body:
      ar_eg: |
        ديماس هيقرا لك حكاية صغيرة من كتاب عيال، وإنت تسمع الأول وبعدين تدوّر على الجمل مكتوبة.
        كلمة مهمة: gawa = يشيل / يجيب معاه. وbukune = الكتاب بتاعها (‑ne زي ‑nya في الإندونيسي).
      ar: |
        سيقرأ لك ديماس حكاية صغيرة من كتاب أطفال؛ استمع أولًا ثم ابحث عن الجمل مكتوبة.
        كلمة مهمة: gawa = يحمل / يُحضر معه. وbukune = كتابها (‑ne مثل ‑nya في الإندونيسية).
      en: |
        Dimas reads you a little story from a children's book. Listen first, then find the sentences in writing.
        Key word: gawa = carry, bring along. And bukune = her book (‑ne is like Indonesian ‑nya).
    grammar: jv.aksara.sandhangan-swara
    examples:
      - text: ꦮꦠꦶꦭꦸꦔꦔꦗꦶꦱꦺꦴꦫꦺ (Wati lunga ngaji sore.)
        ar_eg: واتي راحت حلقة القرآن العصر.
        ar: ذهبت واتي إلى حلقة القرآن عصرًا.
        en: Wati goes to Qur'an class in the afternoon.
      - text: ꦮꦠꦶꦒꦮꦧꦸꦏꦸ (Wati gawa buku.)
        ar_eg: واتي واخدة معاها كتاب.
        ar: تحمل واتي كتابًا.
        en: Wati takes a book with her.
      - text: ꦧꦸꦏꦸꦤꦺꦒꦼꦝꦺ (Bukune gedhe.)
        ar_eg: الكتاب بتاعها كبير.
        ar: كتابها كبير.
        en: Her book is big.
