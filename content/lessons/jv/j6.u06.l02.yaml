schema: kabar.lesson/v1
id: j6.u06.l02
language: jv
title: Dha, tha, ga, nya
can_do:
  ar_eg: تقرا dh وth وg وny في البيجون.
  ar: أن تقرأ dh وth وg وny في البيجون.
  en: Read dh, th, g and ny in Pegon.
slides:
  - title: Dha lan tha
    body:
      ar_eg: |
        فاكر إن dh وth في الجاوي «تقال» زي د وط؟ البيجون بتأكد ده:
        - ڎ = dh: دال بتلات نقط، مش ذ!
        - ڟ = th: طا بتلات نقط، مش ث!
      ar: |
        أتذكر أن dh وth في الجاوية ثقيلتان كالدال والطاء؟ تؤكد البيجون ذلك:
        - ڎ = dh: دال بثلاث نقاط، لا ذال.
        - ڟ = th: طاء بثلاث نقاط، لا ثاء.
      en: |
        Remember that Javanese dh and th are "heavy", like د and ط? Pegon confirms it:
        - ڎ = dh: د with three dots, not ذ!
        - ڟ = th: ط with three dots, not ث!
    grammar: jv.pegon.basics
    examples:
      - text: ڎاڎا (dhadha)
        ar_eg: صدر
        ar: صدر
        en: chest
      - text: ڤاڟي (pathi)
        ar_eg: نشا
        ar: نشا
        en: starch
  - title: Ga lan nya
    body:
      ar_eg: |
        الحرفين دول ليهم شكلين، حسب المكان:
        - g: في جاوة غالبًا ڮ (كاف بتلات نقط تحت)، وفي كتابة الملايو ݢ (كاف بنقطة فوق).
        - ny: في جاوة غالبًا ۑ (يا بتلات نقط تحت)، وفي كتابة الملايو ڽ (نون بتلات نقط فوق).
        لو شفت أي شكل منهم، اقراه نفس القراية.
      ar: |
        ولهذين الحرفين صورتان بحسب البلد:
        - g: ڮ في جاوة غالبًا (كاف بثلاث نقاط تحتها)، وݢ في الكتابة الملايوية (كاف بنقطة فوقها).
        - ny: ۑ في جاوة غالبًا (ياء بثلاث نقاط تحتها)، وڽ في الملايوية (نون بثلاث نقاط فوقها).
        وأيّ الصورتين رأيت فقراءتهما واحدة.
      en: |
        These two letters have two shapes, depending on the region:
        - g: in Java usually ڮ (ك with three dots below); in Malay Jawi ݢ (ك with one dot above).
        - ny: in Java usually ۑ (ي with three dots below); in Malay Jawi ڽ (ن with three dots above).
        Whichever shape you see, read it the same way.
    grammar: jv.pegon.basics
    examples:
      - text: ڮولا (gula) · ݢولا
        ar_eg: سكر
        ar: سكر
        en: sugar
      - text: ۑاتا (nyata) · ڽاتا
        ar_eg: حقيقي
        ar: حقيقي
        en: real, true
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ڎ
        ar_eg: dha (دال بتلات نقط)
        ar: dha (دال بثلاث نقاط)
        en: dha (د with three dots)
      - text: ڟ
        ar_eg: tha (طا بتلات نقط)
        ar: tha (طاء بثلاث نقاط)
        en: tha (ط with three dots)
      - text: ڮ
        ar_eg: ga (كاف بتلات نقط تحت)
        ar: ga (كاف بثلاث نقاط تحتها)
        en: ga (ك with three dots below)
      - text: ۑ
        ar_eg: nya (يا بتلات نقط تحت)
        ar: nya (ياء بثلاث نقاط تحتها)
        en: nya (ي with three dots below)
    words: [ڎ, ڟ, ڮ, ۑ]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: "اقرا: ڎاڎا"
      ar: "اقرأ: ڎاڎا"
      en: "Read: ڎاڎا"
    options: [dada, dhadha, dhatha]
    answer: 1
    explain:
      ar_eg: ڎ = dh في الحرفين. لو كانت د عادية كانت هتبقى dada.
      ar: ڎ = dh في الموضعين، ولو كانت دالًا عادية لكانت dada.
      en: ڎ = dh both times. With a plain د it would be dada.
    words: [ڎ]
  - id: e03
    type: listen
    text: gula
    question:
      ar_eg: سمعت gula (سكر). بتتكتب إزاي بالبيجون؟
      ar: سمعت gula (سكر). كيف تُكتب بالبيجون؟
      en: You heard gula (sugar). How is it written in Pegon?
    options: ["كولا", "جولا", "ڮولا"]
    answer: 2
    meaning:
      ar_eg: سكر
      ar: سكر
      en: sugar
    words: [ڮ]
  - id: e04
    type: fill_blank
    sentence: ڤاڟي = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: نشا)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: نشا)"
      en: Type the reading in Latin letters. (It means "starch".)
    answers: [pathi]
    words: [ڟ]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "اقرا: ۑاتا"
      ar: "اقرأ: ۑاتا"
      en: "Read: ۑاتا"
    options: [nyata, yata, nata]
    answer: 0
    words: [ۑ]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي حرف هو dh في البيجون؟
      ar: أي حرف هو dh في البيجون؟
      en: Which letter is dh in Pegon?
    options: [ذ, ڎ, ڟ]
    answer: 1
    explain:
      ar_eg: ڎ مبنية على د مش ذ، عشان dh الجاوية «د تقيلة».
      ar: ڎ مبنية على الدال لا الذال، فـ dh الجاوية دال ثقيلة.
      en: ڎ is built on د, not ذ, because Javanese dh is a heavy d.
    words: [ڎ, ڟ]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ڮولا لان ڤاڟي"
      ar: "اكتب بالحروف اللاتينية: ڮولا لان ڤاڟي"
      en: "Write in Latin letters: ڮولا لان ڤاڟي"
    answers: [gula lan pathi]
    explain:
      ar_eg: ڮولا = gula (ڮ = g)، ولان = lan (و)، وڤاڟي = pathi (ڤ = p، ڟ = th). يعني «سكر ونشا».
      ar: ڮولا = gula، ولان = lan، وڤاڟي = pathi، أي «سكر ونشا».
      en: "ڮولا = gula (ڮ = g), لان = lan (and), ڤاڟي = pathi (ڤ = p, ڟ = th): \"sugar and starch\"."
    words: [ڮ, ڟ]
  - id: e08
    type: fill_blank
    sentence: ۑاتا = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: حقيقي)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: حقيقي)"
      en: Type the reading in Latin letters. (It means "real".)
    answers: [nyata]
    words: [ۑ]
  - id: e09
    type: speaking
    text: Dhadha, pathi, gula, nyata.
    meaning:
      ar_eg: صدر، نشا، سكر، حقيقي.
      ar: صدر، نشا، سكر، حقيقي.
      en: Chest, starch, sugar, real.
    words: [ڎ, ڟ, ڮ, ۑ]
dialogue:
  title: Gus Hanif
  lines:
    - speaker: Gus Hanif
      text: Sugeng rawuh ing pesantren, Mas Mohamed.
      ar_eg: أهلًا بيك في الـ pesantren يا محمد.
      ar: أهلًا بك في الـ pesantren يا محمد.
      en: Welcome to the pesantren, Mohamed.
    - speaker: Mohamed
      text: Matur nuwun, Gus. Menika buku napa?
      ar_eg: شكرًا يا شيخ. ده كتاب إيه؟
      ar: شكرًا يا شيخ. ما هذا الكتاب؟
      en: Thank you, Gus. What book is this?
    - speaker: Gus Hanif
      text: Buku basa Arab, tegesipun ngangge Pegon.
      ar_eg: كتاب عربي، ومعناه بالبيجون.
      ar: كتاب عربي، ومعناه بحروف البيجون.
      en: An Arabic book, with its meaning in Pegon.
    - speaker: Mohamed
      text: Kula saged maos sekedhik, Gus!
      ar_eg: أنا أعرف أقرا شوية يا شيخ!
      ar: أستطيع أن أقرأ قليلًا يا شيخ!
      en: I can read a little, Gus!
new_words:
  - word: ڎ
    pos: letter
    ar_eg: dha في البيجون (دال بتلات نقط)
    ar: dha في البيجون (دال بثلاث نقاط)
    en: dha in Pegon (د with three dots)
  - word: ڟ
    pos: letter
    ar_eg: tha في البيجون (طا بتلات نقط)
    ar: tha في البيجون (طاء بثلاث نقاط)
    en: tha in Pegon (ط with three dots)
  - word: ڮ
    pos: letter
    ar_eg: ga في البيجون (وكمان ݢ)
    ar: ga في البيجون (وأيضًا ݢ)
    en: ga in Pegon (also ݢ)
  - word: ۑ
    pos: letter
    ar_eg: nya في البيجون (وكمان ڽ)
    ar: nya في البيجون (وأيضًا ڽ)
    en: nya in Pegon (also ڽ)
