schema: kabar.lesson/v1
id: j3.u05.l03
language: jv
title: Regi pinten?
can_do:
  ar_eg: تسأل عن السعر بأدب بالكراما.
  ar: أن تسأل عن السعر بأدب بالكراما.
  en: Ask prices politely.
slides:
  - title: Reginipun pinten?
    body:
      ar_eg: |
        rega (سعر، harga) في الكراما **regi**. والسؤال المؤدب عن السعر:
        - Reginipun pinten, Bu? = بكام يا حاجة؟ (Harganya berapa, Bu?)
        - وفي الكلام اليومي أقصر: Niki pinten, Bu? = ده بكام؟
        وزي ما اتعلمنا: لو بدأت كراما كمّل كراما — ماتقولش «Reginipun pira».
      ar: |
        rega (السعر، harga) في الكراما **regi**، والسؤال المهذب عن السعر:
        - Reginipun pinten, Bu? = بكم ثمنه يا سيدتي؟ (Harganya berapa, Bu?)
        - وفي الكلام اليومي أقصر: Niki pinten, Bu? = بكم هذا؟
        وإذا بدأت بالكراما فأتمّ بها، فلا تقل «Reginipun pira».
      en: |
        rega (price, harga) is **regi** in krama. The polite price question:
        - Reginipun pinten, Bu? = How much is it, ma'am? (Harganya berapa, Bu?)
        - Shorter, everyday: Niki pinten, Bu? = How much is this?
        As always: once you start in krama, stay in krama — not "Reginipun pira".
    grammar: jv.krama.numbers
    examples:
      - text: Nyuwun sewu, Bu, reginipun pinten?
        ar_eg: لا مؤاخذة يا حاجة، بكام؟
        ar: عفوًا يا سيدتي، بكم ثمنه؟
        en: Excuse me, ma'am, how much is it?
      - text: Niki pinten, Bu?
        ar_eg: ده بكام يا حاجة؟
        ar: بكم هذا يا سيدتي؟
        en: How much is this, ma'am?
  - title: Ewu lan atus
    body:
      ar_eg: |
        الأسعار بالكراما (ewu = ribu، atus = ratus):
        - sedasa ewu = 10.000، kalih dasa ewu = 20.000، selangkung ewu = 25.000
        - seket ewu = 50.000، satus ewu = 100.000
        - kalih atus ewu = 200.000، tigang atus ewu = 300.000
        - gangsal ewu = 5.000، tigang ewu = 3.000، kalih ewu = 2.000
        خلي بالك: tiga قبل ewu / atus / dasa بتبقى **tigang**: tigang ewu، مش tiga ewu. زي «تلاتة» ← «تلات» في «تلات آلاف».
      ar: |
        الأسعار بالكراما (ewu = ribu، atus = ratus):
        - sedasa ewu = 10.000، kalih dasa ewu = 20.000، selangkung ewu = 25.000
        - seket ewu = 50.000، satus ewu = 100.000
        - kalih atus ewu = 200.000، tigang atus ewu = 300.000
        - gangsal ewu = 5.000، tigang ewu = 3.000، kalih ewu = 2.000
        وانتبه: تصير tiga قبل ewu وatus وdasa **tigang**: tigang ewu لا tiga ewu.
      en: |
        Prices in krama (ewu = ribu, atus = ratus):
        - sedasa ewu = 10,000, kalih dasa ewu = 20,000, selangkung ewu = 25,000
        - seket ewu = 50,000, satus ewu = 100,000
        - kalih atus ewu = 200,000, tigang atus ewu = 300,000
        - gangsal ewu = 5,000, tigang ewu = 3,000, kalih ewu = 2,000
        Careful: before ewu / atus / dasa, tiga becomes **tigang**: tigang ewu, not tiga ewu.
    grammar: jv.krama.numbers
    examples:
      - text: Reginipun pinten, Bu? — Kalih atus ewu.
        ar_eg: بكام يا حاجة؟ — ميتين ألف.
        ar: بكم ثمنه يا سيدتي؟ — مئتا ألف.
        en: How much is it, ma'am? — Two hundred thousand.
      - text: Tigang ewu, Mas.
        ar_eg: تلات آلاف يا أستاذ.
        ar: ثلاثة آلاف يا أستاذ.
        en: Three thousand.
  - title: Awis! Saged kirang?
    body:
      ar_eg: |
        الفصال المؤدب بالكراما (نغوكو → كراما = إندونيسي):
        - larang → **awis** = mahal (غالي)، murah → **mirah** = murah (رخيص)
        - kurang → **kirang** = kurang (أقل)، oleh → **angsal** = boleh (ينفع)
        - Saged kirang, Bu? = ممكن تنزّلي شوية يا حاجة؟
        - Selangkung ewu angsal? = خمسة وعشرين ألف ينفع؟
        - Wah, awis sanget! = ياه، غالي أوي!
        افتكر: الفصال في Klewer عادي وبابتسامة. والبياعة الكبيرة لما تسمع الكراما بتفرح — وساعات السعر بينزل.
      ar: |
        المساومة المهذبة بالكراما (نغوكو → كراما = إندونيسي):
        - larang → **awis** = mahal (غالٍ)، وmurah → **mirah** = murah (رخيص)
        - kurang → **kirang** = kurang (أقل)، وoleh → **angsal** = boleh (يجوز)
        - Saged kirang, Bu? = هل يمكن تخفيض السعر يا سيدتي؟
        - Selangkung ewu angsal? = هل يجوز بخمسة وعشرين ألفًا؟
        - Wah, awis sanget! = يا له من سعر غالٍ!
        والمساومة في Klewer أمر عادي يتم بابتسامة، والبائعة الكبيرة تفرح بالكراما، وقد ينخفض السعر.
      en: |
        Polite bargaining in krama (ngoko → krama = Indonesian):
        - larang → **awis** = mahal (expensive), murah → **mirah** = murah (cheap)
        - kurang → **kirang** = kurang (less), oleh → **angsal** = boleh (may, OK)
        - Saged kirang, Bu? = Could you lower it a little, ma'am?
        - Selangkung ewu angsal? = Is twenty-five thousand OK?
        - Wah, awis sanget! = Wow, that's very expensive!
        Bargaining at Klewer is normal and done with a smile. Older sellers love hearing krama — and sometimes the price drops.
    grammar: jv.krama.numbers
    examples:
      - text: Saged kirang, Bu?
        ar_eg: ممكن تنزّلي شوية يا حاجة؟
        ar: هل يمكن تخفيض السعر يا سيدتي؟
        en: Could you lower the price a little, ma'am?
      - text: Selangkung ewu angsal?
        ar_eg: خمسة وعشرين ألف ينفع؟
        ar: هل يجوز بخمسة وعشرين ألفًا؟
        en: Is twenty-five thousand OK?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: regi
        ar_eg: سعر (rega ← harga)
        ar: سعر (rega ← harga)
        en: price (rega, harga)
      - text: awis
        ar_eg: غالي (larang ← mahal)
        ar: غالٍ (larang ← mahal)
        en: expensive (larang, mahal)
      - text: mirah
        ar_eg: رخيص (murah)
        ar: رخيص (murah)
        en: cheap (murah)
      - text: kirang
        ar_eg: أقل (kurang)
        ar: أقل (kurang)
        en: less (kurang)
      - text: angsal
        ar_eg: ينفع / مسموح (oleh ← boleh)
        ar: يجوز (oleh ← boleh)
        en: may, OK (oleh, boleh)
    words: [regi, awis, mirah, kirang, angsal]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول ٣٠٠٠ بالكراما؟
      ar: كيف تقول ٣٠٠٠ بالكراما؟
      en: How do you say 3,000 in krama?
    options: [telung ewu, tiga ewu, tigang ewu]
    answer: 2
    explain:
      ar_eg: قبل ewu، tiga → tigang. telung ewu نغوكو.
      ar: قبل ewu تصير tiga tigang، وtelung ewu نغوكو.
      en: Before ewu, tiga → tigang. telung ewu is ngoko.
    words: [tiga, ewu]
  - id: e03
    type: listen
    text: Kalih atus ewu.
    options: [Kalih atus ewu., Kalih dasa ewu., Kalih ewu.]
    answer: 0
    explain:
      ar_eg: kalih atus ewu = ٢٠٠٠٠٠. kalih dasa ewu = ٢٠٠٠٠، kalih ewu = ٢٠٠٠.
      ar: kalih atus ewu = ٢٠٠٠٠٠، وkalih dasa ewu = ٢٠٠٠٠، وkalih ewu = ٢٠٠٠.
      en: kalih atus ewu = 200,000; kalih dasa ewu = 20,000; kalih ewu = 2,000.
    words: [kalih, atus, ewu]
  - id: e04
    type: fill_blank
    sentence: Reginipun ___, Bu?
    meaning:
      ar_eg: بكام يا حاجة؟
      ar: بكم ثمنه يا سيدتي؟
      en: How much is it, ma'am?
    options: [pira, pundi, pinten]
    answers: [pinten]
    explain:
      ar_eg: reginipun كراما، فكمّل بـ pinten مش pira.
      ar: reginipun كراما، فأتمّ بـ pinten لا pira.
      en: reginipun is krama, so continue with pinten, not pira.
    words: [regi, pinten]
  - id: e05
    type: build_sentence
    source:
      ar_eg: ممكن تنزّلي شوية يا حاجة؟ (بالكراما)
      ar: هل يمكن تخفيض السعر يا سيدتي؟ (بالكراما)
      en: (in krama) Could you lower the price a little, ma'am?
    answer: Saged kirang, Bu?
    distractors: [isa, kurang]
    words: [saged, kirang]
  - id: e06
    type: dictation
    text: Gangsal ewu.
    meaning:
      ar_eg: خمس آلاف.
      ar: خمسة آلاف.
      en: Five thousand.
    words: [gangsal, ewu]
  - id: e07
    type: speaking
    text: Nyuwun sewu, Bu, reginipun pinten? Saged kirang?
    meaning:
      ar_eg: لا مؤاخذة يا حاجة، بكام؟ ممكن تنزّلي شوية؟
      ar: عفوًا يا سيدتي، بكم ثمنه؟ هل يمكن التخفيض؟
      en: Excuse me, ma'am, how much is it? Could you lower it a little?
    words: [regi, pinten, saged, kirang]
dialogue:
  title: Pinten, Bu?
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Bu, batik menika reginipun pinten?
      ar_eg: لا مؤاخذة يا حاجة، الباتيك ده بكام؟
      ar: عفوًا يا سيدتي، بكم هذا الباتيك؟
      en: Excuse me, ma'am, how much is this batik?
    - speaker: Bu Siti
      text: Seket ewu, Mas.
      ar_eg: خمسين ألف يا أستاذ.
      ar: خمسون ألفًا يا أستاذ.
      en: Fifty thousand.
    - speaker: Mohamed
      text: Wah, awis, Bu. Saged kirang?
      ar_eg: ياه، غالي يا حاجة. ممكن تنزّلي؟
      ar: إنه غالٍ يا سيدتي. هل يمكن التخفيض؟
      en: Oh, that's expensive, ma'am. Could you lower it?
    - speaker: Bu Siti
      text: Sekawan dasa ewu, pripun?
      ar_eg: أربعين ألف، إيه رأيك؟
      ar: أربعون ألفًا، ما رأيك؟
      en: Forty thousand, how's that?
    - speaker: Mohamed
      text: Inggih, Bu. Matur nuwun.
      ar_eg: ماشي يا حاجة. شكرًا.
      ar: حسنًا يا سيدتي. شكرًا.
      en: OK, ma'am. Thank you.
new_words:
  - word: regi
    pos: noun
    ar_eg: سعر (rega ← harga)، كراما
    ar: سعر (rega ← harga)، كراما
    en: price (ngoko rega, Indonesian harga), krama
  - word: awis
    pos: adjective
    ar_eg: غالي (larang ← mahal)، كراما
    ar: غالٍ (larang ← mahal)، كراما
    en: expensive (ngoko larang, Indonesian mahal), krama
  - word: mirah
    pos: adjective
    ar_eg: رخيص (murah)، كراما
    ar: رخيص (murah)، كراما
    en: cheap (ngoko / Indonesian murah), krama
  - word: kirang
    pos: adjective
    ar_eg: أقل / ناقص (kurang)، كراما
    ar: أقل / ناقص (kurang)، كراما
    en: less, lacking (kurang), krama
  - word: angsal
    pos: verb
    ar_eg: ينفع / مسموح (oleh ← boleh)، كراما
    ar: يجوز / مسموح (oleh ← boleh)، كراما
    en: may, be allowed, OK (ngoko oleh, Indonesian boleh), krama
  - word: niki
    pos: pronoun
    ar_eg: ده (ini)، الشكل اليومي من menika
    ar: هذا (ini)، الصورة اليومية من menika
    en: this (ini), everyday form of menika
