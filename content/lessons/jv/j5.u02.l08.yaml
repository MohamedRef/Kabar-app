schema: kabar.lesson/v1
id: j5.u02.l08
language: jv
title: Sejarah Lawang Sewu
can_do:
  ar_eg: تقرا فقرة من مجلة عن تاريخ لاوانج سيوو وتفهم اسمه وأصله.
  ar: أن تقرأ فقرة من مجلة عن تاريخ لاوانغ سيوو وتفهم سبب اسمه وأصله.
  en: Read a magazine paragraph on Lawang Sewu's history and explain its name.
slides:
  - title: Saka kalawarti
    body:
      ar_eg: |
        فقرة من مجلة جاوية عن المبنى اللي إنت واقف قدّامه. هتقابل sinebut (= disebut، بالـ -in- الأدبية) وkasebut (= tersebut)، ومعاهم dibangun وdening.
        كلمات جديدة: lawang = باب (pintu)، وlawange = أبوابه. kantor = مكتب / مقرّ (kantor). وamarga = عشان (karena)، وmuseum زي الإندونيسي.
      ar: |
        فقرة من مجلة جاوية عن المبنى الذي تقف أمامه. ستقابل sinebut (= disebut، بالـ -in- الأدبية) وkasebut (= tersebut)، ومعهما dibangun وdening.
        كلمات جديدة: lawang = باب (pintu)، وlawange = أبوابه، وkantor = مكتب / مقرّ (kantor). وamarga = لأن (karena)، وmuseum كالإندونيسية.
      en: |
        A paragraph from a Javanese magazine about the building you're standing in front of. You'll meet sinebut (= disebut, with the literary -in-) and kasebut (= tersebut), along with dibangun and dening.
        New words: lawang = door (pintu), and lawange = its doors. kantor = office, headquarters (kantor). amarga = because (karena), and museum is as in Indonesian.
    grammar: jv.passive.written
    examples:
      - text: Gedhong iki sinebut Lawang Sewu, amarga lawange akeh banget.
        ar_eg: المبنى ده اسمه «لاوانج سيوو» (ألف باب)، عشان أبوابه كتير أوي.
        ar: يُسمّى هذا المبنى «لاوانغ سيوو» (ألف باب)، لأن أبوابه كثيرة جدًا.
        en: This building is called Lawang Sewu (a thousand doors) because it has so many doors.
      - text: Ing jaman Walanda, gedhong kasebut dadi kantor perusahaan sepur.
        ar_eg: أيام الهولنديين، المبنى ده كان مقرّ شركة سكة حديد.
        ar: في العهد الهولندي كان هذا المبنى مقرًّا لشركة سكك حديدية.
        en: In the Dutch era, the building was the office of a railway company.
      - text: Saiki Lawang Sewu dadi museum lan papan wisata kang misuwur.
        ar_eg: دلوقتي لاوانج سيوو بقى متحف ومكان سياحي مشهور.
        ar: صار لاوانغ سيوو اليوم متحفًا ومعلمًا سياحيًا مشهورًا.
        en: Today Lawang Sewu is a museum and a famous tourist spot.
exercises:
  - id: e01
    type: listen
    text: Gedhong iki sinebut Lawang Sewu, amarga lawange akeh banget.
    question:
      ar_eg: ليه اسمه لاوانج سيوو؟
      ar: لماذا سُمّي لاوانغ سيوو؟
      en: Why is it called Lawang Sewu?
    options:
      - amarga gedhonge gedhe banget
      - amarga lawange akeh banget
      - amarga ana sepur sewu
    answer: 1
    meaning:
      ar_eg: المبنى ده اسمه «لاوانج سيوو»، عشان أبوابه كتير أوي.
      ar: يُسمّى هذا المبنى «لاوانغ سيوو» لأن أبوابه كثيرة جدًا.
      en: This building is called Lawang Sewu because it has so many doors.
    words: [lawang, sinebut]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: المبنى كان إيه أيام الهولنديين؟
      ar: ماذا كان المبنى في العهد الهولندي؟
      en: What was the building in the Dutch era?
    options: [kantor perusahaan sepur, museum, stasiun sepur]
    answer: 0
    explain:
      ar_eg: «dadi kantor perusahaan sepur» = كان مقر شركة سكة حديد. المتحف ده دلوقتي (saiki).
      ar: «dadi kantor perusahaan sepur» = كان مقرّ شركة سكك حديدية، أما المتحف فاليوم (saiki).
      en: '"dadi kantor perusahaan sepur" = it was a railway company office; the museum is now (saiki).'
    words: [kantor]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: لاوانج سيوو دلوقتي إيه؟
      ar: ما لاوانغ سيوو اليوم؟
      en: What is Lawang Sewu today?
    options: [kantor perusahaan sepur, sekolah, museum lan papan wisata]
    answer: 2
    words: [misuwur, sekolah]
  - id: e04
    type: match_pairs
    pairs:
      - text: lawang
        ar_eg: باب
        ar: باب
        en: door
      - text: sinebut
        ar_eg: اسمه / بيتسمّى
        ar: يُسمّى
        en: is called
      - text: kasebut
        ar_eg: المذكور / ده
        ar: المذكور
        en: the said, that
      - text: kantor
        ar_eg: مكتب / مقرّ
        ar: مكتب / مقرّ
        en: office
      - text: amarga
        ar_eg: عشان
        ar: لأن
        en: because
    words: [lawang, sinebut, kasebut, kantor]
  - id: e05
    type: fill_blank
    sentence: Gedhong iki ___ Lawang Sewu.
    meaning:
      ar_eg: المبنى ده اسمه لاوانج سيوو.
      ar: يُسمّى هذا المبنى لاوانغ سيوو.
      en: This building is called Lawang Sewu.
    options: [tinulis, kapilih, sinebut]
    answers: [sinebut]
    explain:
      ar_eg: sinebut = disebut (sebut + -in-). tinulis = اتكتب، kapilih = اتنتخب.
      ar: sinebut = disebut (sebut + -in-)، وtinulis = كُتب، وkapilih = انتُخب.
      en: sinebut = disebut (sebut + -in-); tinulis = written, kapilih = elected.
