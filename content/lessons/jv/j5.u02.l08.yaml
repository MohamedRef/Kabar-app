dialogue:
  title: Lawange pira?
  lines:
    - speaker: Mohamed
      text: Pak, lawangipun leres sewu?
      ar_eg: يا عمّو، هو بجد عنده ألف باب؟
      ar: يا سيدي، هل أبوابه ألفٌ حقًا؟
      en: Sir, does it really have a thousand doors?
    - speaker: Pak Harjo
      text: Ora persis sewu, Mas. Nanging akeh banget, mula sinebut Lawang Sewu.
      ar_eg: مش ألف بالظبط يا محمد. بس كتير أوي، عشان كده اسمه لاوانج سيوو.
      ar: ليست ألفًا بالضبط يا محمد، لكنها كثيرة جدًا، لذلك يُسمّى لاوانغ سيوو.
      en: Not exactly a thousand, Mohamed. But very many, so it's called Lawang Sewu.
    - speaker: Mohamed
      text: Oh, kados "Kutha Sewu Menara", nggih, Pak?
      ar_eg: آه، زي «مدينة الألف مئذنة»، صح يا عمّو؟
      ar: آه، مثل «مدينة الألف مئذنة»، أليس كذلك يا سيدي؟
      en: Oh, like "the City of a Thousand Minarets", right, sir?
    - speaker: Pak Harjo
      text: Bener. Sewu ing kene padha karo akeh banget.
      ar_eg: صح. «ألف» هنا يعني كتير أوي.
      ar: صحيح. «ألف» هنا بمعنى كثير جدًا.
      en: Right. A thousand here just means very many.
    - speaker: Mohamed
      text: Saiki gedhong menika dados museum, nggih?
      ar_eg: والمبنى ده دلوقتي بقى متحف، صح؟
      ar: وصار هذا المبنى الآن متحفًا، أليس كذلك؟
      en: And now the building is a museum, isn't it?
    - speaker: Pak Harjo
      text: Iya, lan papan wisata kang misuwur.
      ar_eg: آه، ومكان سياحي مشهور كمان.
      ar: نعم، ومعلم سياحي مشهور.
      en: Yes, and a famous tourist spot.
