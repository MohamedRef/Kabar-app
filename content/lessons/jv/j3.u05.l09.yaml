schema: kabar.lesson/v1
id: j3.u05.l09
language: jv
title: Tumbas batik
can_do:
  ar_eg: تشتري باتيك بالكراما.
  ar: أن تشتري الباتيك بالكراما.
  en: Buy batik in krama.
slides:
  - title: Batik tulis utawa batik cap?
    body:
      ar_eg: |
        في Beringharjo هتلاقي نوعين:
        - **batik tulis** = باتيك مرسوم باليد بالشمع، شغل أيام وأسابيع، وغالي.
        - **batik cap** = باتيك مطبوع بختم نحاس، أسرع وأرخص.
        كلمات مفيدة: **ingkang** = sing (yang، اللي): ingkang menika = اللي ده. **arta** = duit (فلوس).
        وخطة الشرا كلها كراما: Nyuwun sewu → Reginipun pinten? → Awis… Saged kirang? → ... angsal? → Inggih، matur nuwun.
      ar: |
        ستجد في Beringharjo نوعين:
        - **batik tulis** = باتيك يُرسم باليد بالشمع، يستغرق أيامًا أو أسابيع، وهو غالٍ.
        - **batik cap** = باتيك يُطبع بختم نحاسي، أسرع وأرخص.
        وكلمات مفيدة: **ingkang** = sing (yang، الذي): ingkang menika = هذا الذي هنا، و**arta** = duit (المال).
        وخطة الشراء كلها كراما: Nyuwun sewu → Reginipun pinten? → Awis… Saged kirang? → ... angsal? → Inggih، matur nuwun.
      en: |
        At Beringharjo you'll find two kinds:
        - **batik tulis** = hand-drawn with wax — days or weeks of work, and pricey.
        - **batik cap** = stamped with a copper block — faster and cheaper.
        Useful words: **ingkang** = sing (yang, the one that): ingkang menika = this one. **arta** = duit (money).
        The whole purchase in krama: Nyuwun sewu → Reginipun pinten? → Awis… Saged kirang? → … angsal? → Inggih, matur nuwun.
    grammar: jv.krama.numbers
    examples:
      - text: Ingkang menika batik tulis menapa batik cap, Bu?
        ar_eg: اللي ده باتيك مرسوم ولا مطبوع يا حاجة؟
        ar: هل هذا باتيك مرسوم باليد أم مطبوع يا سيدتي؟
        en: Is this one hand-drawn or stamped batik, ma'am?
      - text: Menika artanipun, Bu.
        ar_eg: اتفضلي الفلوس يا حاجة.
        ar: تفضّلي المال يا سيدتي.
        en: Here's the money, ma'am.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: محمد عايز يعرف الباتيك ده مرسوم باليد ولا مطبوع. يسأل إزاي؟
      ar: يريد محمد أن يعرف هل هذا الباتيك مرسوم باليد أم مطبوع. كيف يسأل؟
      en: Mohamed wants to know whether this batik is hand-drawn or stamped. How does he ask?
    options: ['Ingkang menika reginipun pinten, Bu?', 'Ingkang menika batik tulis menapa batik cap, Bu?', 'Batik menika saking pundi, Bu?']
    answer: 1
    explain:
      ar_eg: tulis = مرسوم باليد، cap = مطبوع، وmenapa بين حاجتين معناها «ولا» (atau).
      ar: tulis = مرسوم باليد، وcap = مطبوع، وmenapa بين خيارين بمعنى «أم» (atau).
      en: tulis = hand-drawn, cap = stamped, and menapa between two choices means "or" (atau).
    words: [ingkang, batik tulis, batik cap]
  - id: e02
    type: listen
    text: Batik tulis menika tigang atus ewu, Mas.
    options: ['Batik cap menika tigang dasa ewu, Mas.', 'Batik tulis menika tigang atus ewu, Mas.', 'Batik tulis menika kalih atus ewu, Mas.']
    answer: 1
    words: [batik tulis, tiga, atus, ewu]
  - id: e03
    type: fill_blank
    sentence: ___ menika batik cap, Bu?
    meaning:
      ar_eg: اللي ده باتيك مطبوع يا حاجة؟
      ar: هل هذا (الذي هنا) باتيك مطبوع يا سيدتي؟
      en: Is this one batik cap, ma'am?
    options: [Sinten, Sing, Ingkang]
    answers: [Ingkang]
    explain:
      ar_eg: sing نغوكو، وفي جملة كراما بتبقى ingkang.
      ar: sing نغوكو، وهي في الكراما ingkang.
      en: sing is ngoko; in krama it's ingkang.
    words: [ingkang, batik cap]
  - id: e04
    type: fill_blank
    sentence: Wah, ___ sanget, Bu. Arta kula kirang.
    meaning:
      ar_eg: ياه، غالي أوي يا حاجة. فلوسي مش مكفّية.
      ar: يا له من غلاء يا سيدتي! مالي لا يكفي.
      en: Wow, very expensive, ma'am. My money isn't enough.
    answers: [awis]
    explain:
      ar_eg: awis = larang (غالي) بالكراما.
      ar: awis = larang (غالٍ) بالكراما.
      en: awis is krama larang (expensive).
    words: [awis, arta, kirang]
  - id: e05
    type: build_sentence
    source:
      ar_eg: عايز أشتري باتيك لماما.
      ar: أريد أن أشتري باتيكًا لأمي.
      en: I'd like to buy batik for my mother.
    answer: Kula badhe tumbas batik kangge ibu kula.
    distractors: [tuku, kanggo, aku]
    explain:
      ar_eg: kula (أنا) + badhe (arep) + tumbas (tuku) + kangge (kanggo) + ibu kula (ماما).
      ar: kula (أنا) + badhe (arep) + tumbas (tuku) + kangge (kanggo) + ibu kula (أمي).
      en: kula + badhe (arep) + tumbas (tuku) + kangge (kanggo) + ibu kula.
    words: [badhe, tumbas, kangge]
  - id: e06
    type: build_sentence
    source:
      ar_eg: ميتين ألف ينفع يا حاجة؟
      ar: هل يجوز بمئتي ألف يا سيدتي؟
      en: Is two hundred thousand OK, ma'am?
    answer: Kalih atus ewu angsal, Bu?
    distractors: [rong, oleh]
    words: [kalih, atus, ewu, angsal]
    explain:
      ar_eg: "بالكراما: kalih atus = ميتين، وangsal = ينفع. rong وoleh نفس الكلام بس نغوكو."
      ar: "بالكراما: kalih atus أي مئتان، وangsal يجوز. أما rong وoleh فبالمعنى نفسه نغوكو."
      en: "In krama: kalih atus is \"two hundred\", angsal \"OK\". rong and oleh are the ngoko forms."
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بالكراما) لا مؤاخذة يا حاجة، اللي ده بكام؟
      ar: (بالكراما) عفوًا يا سيدتي، بكم هذا؟
      en: (in krama) Excuse me, ma'am, how much is this one?
    answers: ['Nyuwun sewu, Bu, ingkang menika pinten?', 'Nyuwun sewu, Bu, ingkang menika pinten', 'Nyuwun sewu Bu ingkang menika pinten?', Nyuwun sewu Bu ingkang menika pinten, 'Nyuwun sewu, Bu, ingkang menika reginipun pinten?', 'Nyuwun sewu, Bu, ingkang menika reginipun pinten', 'Nyuwun sewu Bu ingkang menika reginipun pinten?', Nyuwun sewu Bu ingkang menika reginipun pinten, 'Nyuwun sewu, Bu, menika pinten?', 'Nyuwun sewu, Bu, menika pinten', 'Nyuwun sewu Bu menika pinten?', Nyuwun sewu Bu menika pinten, 'Nyuwun sewu, Bu, niki pinten?', 'Nyuwun sewu, Bu, niki pinten', 'Nyuwun sewu Bu niki pinten?', Nyuwun sewu Bu niki pinten, 'Nyuwun sewu, Bu, ingkang niki pinten?', 'Nyuwun sewu, Bu, ingkang niki pinten', 'Nyuwun sewu Bu ingkang niki pinten?', Nyuwun sewu Bu ingkang niki pinten, 'Nyuwun sewu, Bu, reginipun pinten?', 'Nyuwun sewu, Bu, reginipun pinten', 'Nyuwun sewu Bu reginipun pinten?', Nyuwun sewu Bu reginipun pinten]
    words: [nyuwun sewu, ingkang, pinten]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بالكراما) اتفضلي الفلوس يا حاجة.
      ar: (بالكراما) تفضّلي المال يا سيدتي.
      en: (in krama) Here's the money, ma'am.
    answers: ['Menika artanipun, Bu.', 'Menika artanipun, Bu', Menika artanipun Bu., Menika artanipun Bu, 'Niki artanipun, Bu.', 'Niki artanipun, Bu', Niki artanipun Bu., Niki artanipun Bu, 'Menika arta, Bu.', 'Menika arta, Bu', Menika arta Bu., Menika arta Bu, 'Mangga, menika artanipun, Bu.', 'Mangga, menika artanipun, Bu', Mangga menika artanipun Bu., Mangga menika artanipun Bu]
    explain:
      ar_eg: arta = duit (فلوس) بالكراما، وartanipun = الفلوس دي (هنفهم -nipun في J3.6).
      ar: arta = duit (المال) بالكراما، وartanipun = هذا المال (و-nipun في J3.6).
      en: arta is krama duit (money); artanipun = the money (-nipun comes in J3.6).
    words: [arta, menika]
  - id: e09
    type: speaking
    text: Wah, batik tulis menika awis sanget, Bu. Kalih atus ewu angsal?
    meaning:
      ar_eg: ياه، الباتيك المرسوم ده غالي أوي يا حاجة. ميتين ألف ينفع؟
      ar: هذا الباتيك المرسوم غالٍ جدًا يا سيدتي. هل يجوز بمئتي ألف؟
      en: Wow, this hand-drawn batik is very expensive, ma'am. Is two hundred thousand OK?
    words: [batik tulis, menika, awis, kalih, atus, angsal]
  - id: e10
    type: dictation
    text: Menika artanipun, Bu.
    meaning:
      ar_eg: اتفضلي الفلوس يا حاجة.
      ar: تفضّلي المال يا سيدتي.
      en: Here's the money, ma'am.
    words: [menika, arta]
dialogue:
  title: Tumbas batik wonten Beringharjo
  lines:
    - speaker: Bu Siti
      text: "Mangga, Mas. Niki batik tulis, niki batik cap."
      ar_eg: "اتفضل يا أستاذ. ده باتيك مرسوم بالإيد، وده باتيك مطبوع."
      ar: "تفضّل. هذا باتيك مرسوم باليد، وهذا باتيك مطبوع."
      en: "Come on in. This is hand-drawn batik, this is stamped."
    - speaker: Mohamed
      text: Ingkang menika reginipun pinten, Bu?
      ar_eg: اللي ده بكام يا حاجة؟
      ar: بكم هذا يا سيدتي؟
      en: How much is this one, ma'am?
    - speaker: Bu Siti
      text: "Sing tulis niki tigang atus, Mas."
      ar_eg: "المرسوم بالإيد ده بتلتمية (ألف) يا أستاذ."
      ar: "المرسوم باليد هذا بثلاثمئة (ألف)."
      en: "This hand-drawn one's three hundred (thousand)."
    - speaker: Mohamed
      text: "Wah, awis sanget, Bu. Kirang nggih?"
      ar_eg: "ياه، غالي أوي يا حاجة. نزّلي شوية؟"
      ar: "إنه غالٍ جدًا يا سيدتي. تخفّضين قليلًا؟"
      en: "Wow, that's a lot, ma'am. Bit less, yeah?"
    - speaker: Bu Siti
      text: "Mase saged krama, nggih! Nggih pun, angsal."
      ar_eg: "ده إنت بتعرف كراما! خلاص، ماشي."
      ar: "أنت تتكلم الكراما! حسنًا إذن، موافقة."
      en: "You speak krama! Alright then, deal."
    - speaker: Mohamed
      text: Matur nuwun sanget, Bu. Menika artanipun.
      ar_eg: شكرًا جزيلًا يا حاجة. اتفضلي الفلوس.
      ar: شكرًا جزيلًا يا سيدتي. تفضّلي المال.
      en: Thank you very much, ma'am. Here's the money.
