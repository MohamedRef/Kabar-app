    meaning:
      ar_eg: بابا واقف في الغيط، وماما في المطبخ.
      ar: أبي واقف في الحقل، وأمّي في المطبخ.
      en: Dad is standing in the rice field, Mum is in the kitchen.
    words: [ngadeg, sawah, pawon]
dialogue:
  lines:
    - speaker: Pak Budi
      text: Monggo, Mas. Iki omahe simbah ing desa.
      ar_eg: اتفضّل يا ماس. ده بيت جدّة العيال في القرية.
      ar: تفضّل يا أخي. هذا بيت الجدّة في القرية.
      en: Come in, Mas. This is grandma's house in the village.
    - speaker: Mohamed
      text: Apik tenan, Pak! Wit gedhe, sawahe ijo.
      ar_eg: حلو أوي يا عم! الشجر كبير والغيط أخضر.
      ar: جميل جدًّا يا عم! أشجار كبيرة وحقول خضراء.
      en: It's lovely, Pak! Big trees, green rice fields.
    - speaker: Pak Budi
      text: Lungguh kene sik. Kamarmu neng ngarep, jedinge neng mburi.
      ar_eg: اقعد هنا. أوضتك قدام، والحمّام ورا.
      ar: اجلس هنا. غرفتك في الأمام، والحمّام في الخلف.
      en: Sit here. Your room's at the front, the bathroom's at the back.
    - speaker: Mohamed
      text: Bu Rahayu neng ngendi, Pak?
      ar_eg: طنط راهايو فين يا عم؟
      ar: أين بو راهايو يا عم؟
      en: Where's Bu Rahayu, Pak?
    - speaker: Pak Budi
      text: Neng pawon karo simbah. Bengi iki kowe turu neng kasur anyar lho, hehe.
      ar_eg: في المطبخ مع الجدّة. الليلة هتنام على مرتبة جديدة، هههه.
      ar: في المطبخ مع الجدّة. الليلة تنام على فراش جديد، هههه.
      en: In the kitchen with grandma. Tonight you sleep on a new mattress, hehe.
