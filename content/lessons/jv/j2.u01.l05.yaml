schema: kabar.lesson/v1
id: j2.u01.l05
language: jv
title: Lungguh, ngadeg
can_do:
  ar_eg: 'تتفرّج على بيت في الريف: الأوضة والحمّام والمطبخ، وتقعد أو تقف، وتشوف الغيط والشجر.'
  ar: 'أن تتجوّل في بيت ريفي: الغرفة والحمّام والمطبخ، وتجلس أو تقف، وترى الحقل والشجر.'
  en: 'Find your way round a village house: room, bathroom, kitchen, sitting and standing, the rice field and the trees.'
slides:
  - title: Omahe simbah
    body:
      ar_eg: |
        lungguh = يقعد، ngadeg = يقف على رجله.
        kamar = أوضة، jeding = حمّام، pawon = مطبخ (المطبخ الجاوي القديم بالحطب).
        kasur = مرتبة، سرير: Aku turu neng kasur.
        sawah = غيط رز، wit = شجرة: wit gedhe = شجرة كبيرة.
      ar: |
        lungguh = يجلس، ngadeg = يقف.
        kamar = غرفة، jeding = حمّام، pawon = مطبخ (المطبخ الجاوي التقليدي بالحطب).
        kasur = فراش، سرير: Aku turu neng kasur.
        sawah = حقل أرز، wit = شجرة: wit gedhe = شجرة كبيرة.
      en: |
        lungguh = sit, ngadeg = stand.
        kamar = room, jeding = bathroom, pawon = kitchen (the old wood-fired Javanese kitchen).
        kasur = mattress, bed: Aku turu neng kasur.
        sawah = rice field, wit = tree: wit gedhe = a big tree.
    examples:
      - text: Jedinge neng mburi, cedhak pawon.
        ar_eg: الحمّام ورا، جنب المطبخ.
        ar: الحمّام في الخلف، قرب المطبخ.
        en: The bathroom is at the back, near the kitchen.
      - text: Omahe simbah cedhak sawah.
        ar_eg: بيت جدّتي جنب غيط الرز.
        ar: بيت جدّتي قرب حقل الأرز.
        en: Grandma's house is near the rice field.
      - text: Ana wit gedhe ing ngarep omah.
        ar_eg: فيه شجرة كبيرة قدام البيت.
        ar: هناك شجرة كبيرة أمام البيت.
        en: There's a big tree in front of the house.
