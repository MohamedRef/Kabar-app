schema: kabar.lesson/v1
id: j2.u05.l02
language: jv
title: Tukokna! Enteni!
can_do:
  ar_eg: تطلب من حد يشتري أو يجيب أو يستنى أو يساعد.
  ar: أن تطلب من أحدهم أن يشتري أو يحضر أو ينتظر أو يساعد.
  en: Ask someone to buy, fetch, wait or help.
slides:
  - title: Tukokna! Enteni!
    body:
      ar_eg: |
        - أفعال -ake / -ke (اللي اتعلمناها في J1: tukokke) بتاخد -na في الأمر: Tukokna! = اشتريهولي (belikan). Jupukna! = هاته (ambilkan). في سورابايا -no: Tukokno!
        - أفعال -i بتفضل زي ما هي: Enteni aku! = استناني! (tunggu aku) · Rewangi aku! = ساعدني! (bantu aku)
      ar: |
        - أفعال -ake / -ke (من J1: tukokke) تأخذ -na في الأمر: Tukokna! = اشترِه لي (belikan)، Jupukna! = ناولني إياه (ambilkan)، وفي سورابايا -no: Tukokno!
        - أفعال -i تبقى كما هي: Enteni aku! = انتظرني! (tunggu aku) · Rewangi aku! = ساعدني! (bantu aku)
      en: |
        - -ake / -ke verbs (from J1: tukokke) take -na as commands: Tukokna! = Buy it (for me)! (belikan). Jupukna! = Fetch it! (ambilkan). Surabaya: -no: Tukokno!
        - -i verbs stay as they are: Enteni aku! = Wait for me! (tunggu aku) · Rewangi aku! = Help me! (bantu aku)
    grammar: jv.imperative.ngoko
    examples:
      - text: Tulung tukokna gula, ya.
        ar_eg: والنبي هاتلي سكر.
        ar: من فضلك اشترِ لي سكرًا.
        en: Could you buy (me) some sugar?
      - text: Enteni aku neng stasiun.
        ar_eg: استناني في المحطة.
        ar: انتظرني في المحطة.
        en: Wait for me at the station.
  - title: Ya, to, tulung, sik
    body:
      ar_eg: |
        أهم حاجة في الأدب: الأمر الجاوي من غير تليين بيبان ناشف جدًا. ليّنه:
        - ya أو to في الآخر: Enteni aku, ya.
        - tulung (tolong) في الأول: Tulung jupukna, ya. = هاته والنبي.
        - sik (dulu): Mangana sik.
        - mbok (اقتراح لطيف، وسط جاوة): Mbok mangan sik. = ما تاكل الأول.
        زي «والنبي» و«لو سمحت» عندنا. ومع الكبار مش هتستخدم الأوامر دي خالص — الطلب بالكراما في J3.
      ar: |
        الأهم في الأدب: الأمر الجاوي المجرد يبدو جافًا جدًا، فلطّفه:
        - ya أو to آخرًا: Enteni aku, ya.
        - tulung (tolong) أولًا: Tulung jupukna, ya. = ناولني إياه من فضلك.
        - sik (dulu): Mangana sik.
        - mbok (اقتراح لطيف في وسط جاوة): Mbok mangan sik. = لِمَ لا تأكل أولًا؟
        كقولنا «من فضلك» و«لو سمحت». ولا تُخاطَب بها الكبار، فالطلب بالكراما في J3.
      en: |
        Most important — manners: a bare Javanese command sounds very harsh. Soften it:
        - ya or to at the end: Enteni aku, ya.
        - tulung (tolong) at the start: Tulung jupukna, ya. = Could you grab it for me?
        - sik (dulu): Mangana sik.
        - mbok (gentle push, Central Java): Mbok mangan sik. = Why don't you eat first?
        Like Egyptian «والنبي» or «لو سمحت». With elders you won't use these at all — polite krama requests come in J3.
    grammar: jv.imperative.ngoko
    examples:
      - text: Tulung jupukna, ya.
        ar_eg: هاته والنبي.
        ar: ناولني إياه من فضلك.
        en: Could you grab it for me?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Mangana!
        ar_eg: كُل!
        ar: كُل!
        en: Eat!
      - text: Panganen!
        ar_eg: كُله!
        ar: كُلْه!
        en: Eat it!
      - text: Tukokna!
        ar_eg: اشتريهولي!
        ar: اشترِه لي!
        en: Buy it for me!
      - text: Enteni aku!
        ar_eg: استناني!
        ar: انتظرني!
        en: Wait for me!
      - text: Aja lali!
        ar_eg: ماتنساش!
        ar: لا تنسَ!
        en: Don't forget!
      - text: Rewangi aku!
        ar_eg: ساعدني!
        ar: ساعدني!
        en: Help me!
    words: [mangana, panganen, tukokna, enteni, aja, rewangi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: عايز صاحبك يجيبلك حاجة. أنهي جملة ألطف؟
      ar: تريد من صديقك أن يناولك شيئًا. أي جملة ألطف؟
      en: You want your friend to grab something for you. Which is the friendliest?
    options: [Jupuk!, 'Tulung jupukna, ya.', Jupukna!]
    answer: 1
    explain:
      ar_eg: tulung في الأول وya في الآخر بيليّنوا الأمر.
      ar: تُليّن tulung في البداية وya في النهاية الأمرَ.
      en: tulung at the start and ya at the end soften the command.
    words: [tulung, jupukna]
  - id: e03
    type: listen
    text: Enteni aku neng stasiun.
    options: [Enteni aku neng stasiun., Enteni aku neng pasar., Tukokna aku neng stasiun.]
    answer: 0
    words: [enteni, stasiun]
  - id: e04
    type: fill_blank
    sentence: Tulung ___ gula, ya.
    meaning:
      ar_eg: والنبي هاتلي سكر.
      ar: من فضلك اشترِ لي سكرًا.
      en: Could you buy me some sugar?
    options: [mangana, enteni, tukokna]
    answers: [tukokna]
    words: [tukokna, tulung]
  - id: e05
    type: build_sentence
    source:
      ar_eg: والنبي هاتلي سكر.
      ar: من فضلك اشترِ لي سكرًا.
      en: Could you buy me some sugar?
    answer: Tulung tukokna gula, ya.
    distractors: [aja, mangana]
    words: [tulung, tukokna, gula]
  - id: e06
    type: listen
    text: Rewangi aku, ya!
    options: ['Rewangi aku, ya!', 'Enteni aku, ya!', 'Jupukna, ya!']
    answer: 0
    meaning:
      ar_eg: ساعدني، ماشي!
      ar: ساعدني، اتفقنا!
      en: Help me, OK?
    words: [rewangi, enteni, jupukna]
  - id: e07
    type: translate
    direction: from_target
    source_text: Rewangi aku, ya!
    answers_meaning:
      ar_eg: [ساعدني، ماشي!, ساعدني والنبي!, ساعدني]
      ar: [ساعدني من فضلك!, ساعدني]
      en: ['Help me, OK!', Please help me!, Help me]
    words: [rewangi]
  - id: e08
    type: dictation
    text: Enteni aku neng stasiun.
    meaning:
      ar_eg: استناني في المحطة.
      ar: انتظرني في المحطة.
      en: Wait for me at the station.
