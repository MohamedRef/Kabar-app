    meaning:
      ar_eg: هاته والنبي.
      ar: ناولني إياه من فضلك.
      en: Could you grab it for me?
    words: [tulung, jupukna]
dialogue:
  title: Esuk neng omah
  lines:
    - speaker: Bu Rahayu
      text: Sari, tangi! Wis jam pitu.
      ar_eg: ساري، اصحي! الساعة بقت سبعة.
      ar: يا ساري، استيقظي! صارت الساعة السابعة.
      en: Sari, wake up! It's already seven.
    - speaker: Sari
      text: Iya, Bu …
      ar_eg: حاضر يا ماما …
      ar: حاضر يا أمي …
      en: OK, Mum …
    - speaker: Bu Rahayu
      text: Adusa sik, ya. Mengko mangan.
      ar_eg: استحمي الأول، ماشي؟ وبعدين كُلي.
      ar: اغتسلي أولًا، ثم كُلي.
      en: Have a bath first, OK? Then eat.
    - speaker: Sari
      text: Bu, aku arep neng pasar.
      ar_eg: ماما، أنا رايحة السوق.
      ar: يا أمي، سأذهب إلى السوق.
      en: Mum, I'm going to the market.
    - speaker: Bu Rahayu
      text: Tulung tukokna gula, ya. Aja lali!
      ar_eg: والنبي هاتيلي سكر. ماتنسيش!
      ar: من فضلك اشتري لي سكرًا. لا تنسَي!
      en: Could you buy me some sugar? Don't forget!
    - speaker: Sari
      text: Iya, Bu. Ora lali!
      ar_eg: حاضر يا ماما. مش هنسى!
      ar: حاضر يا أمي. لن أنسى!
      en: OK, Mum. I won't forget!
