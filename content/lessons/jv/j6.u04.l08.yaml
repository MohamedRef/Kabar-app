schema: kabar.lesson/v1
id: j6.u04.l08
language: jv
title: Pengumuman kerja bakti
can_do:
  ar_eg: تقرا إعلان الحتة عن يوم تنظيف جماعي، مكتوب بالخط الجاوي.
  ar: أن تقرأ إعلان الحيّ عن يوم عمل تطوعي بالخط الجاوي.
  en: Read a neighbourhood notice about a community clean-up in aksara Jawa.
slides:
  - title: Papan RT
    body:
      ar_eg: |
        على لوحة الحتة في Jagalan فيه إعلان بالخط الجاوي. kerja bakti = يوم شغل جماعي، أهل الشارع بينضّفوا مع بعض.
        بص على الـ pasangan: sesuk Minggu (k + ma)، bakti (k + ta)، jam pitu (m + pa جنب الحرف)، lan pacul (n + pa).
        وفي kerja ꦂ layar، فمفيش pasangan بعدها.
      ar: |
        على لوح الحيّ في Jagalan إعلان بالخط الجاوي. kerja bakti = يوم عمل تطوعي، ينظّف فيه أهل الشارع معًا.
        لاحظ الـ pasangan: sesuk Minggu (k + ma)، bakti (k + ta)، jam pitu (m + pa بجانب الحرف)، lan pacul (n + pa).
        وفي kerja علامة layar، فلا pasangan بعدها.
      en: |
        On the neighbourhood board in Jagalan there's a notice in aksara Jawa. kerja bakti = a community work day, when neighbours clean up together.
        Spot the pasangan: sesuk Minggu (k + ma), bakti (k + ta), jam pitu (m + pa, beside), lan pacul (n + pa).
        kerja has layar, so no pasangan follows it.
    grammar: jv.aksara.pasangan
    examples:
      - text: ꦱꦼꦱꦸꦏ꧀ꦩꦶꦁꦒꦸꦲꦤꦏꦼꦂꦗꦧꦏ꧀ꦠꦶ꧉ (Sesuk Minggu ana kerja bakti.)
        ar_eg: بكرة الحد فيه يوم شغل جماعي.
        ar: غدًا الأحد يوم عمل تطوعي.
        en: Tomorrow, Sunday, there's a community clean-up.
      - text: ꦲꦶꦁꦒꦁꦫꦸꦏꦸꦤꦤ꧀꧈ꦗꦩ꧀ꦥꦶꦠꦸ꧉ (Ing gang Rukunan, jam pitu.)
        ar_eg: في حارة Rukunan، الساعة سبعة.
        ar: في زقاق Rukunan، الساعة السابعة.
        en: In Rukunan lane, at seven o'clock.
      - text: ꦒꦮꦱꦥꦸꦭꦤ꧀ꦥꦕꦸꦭ꧀꧉ (Gawa sapu lan pacul.)
        ar_eg: هاتوا مقشّة وفاس.
        ar: أحضروا مكنسة ومعولًا.
        en: Bring a broom and a hoe.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: يوم الشغل الجماعي إمتى؟
      ar: متى يوم العمل التطوعي؟
      en: When is the clean-up?
    options: [Setu, Minggu, Senin]
    answer: 1
    words: [kerja bakti]
  - id: e02
    type: listen
    text: Ing gang Rukunan, jam pitu.
    question:
      ar_eg: الساعة كام؟
      ar: في أي ساعة؟
      en: At what time?
    options: [jam lima, jam pitu, jam sanga]
    answer: 1
    meaning:
      ar_eg: في حارة Rukunan، الساعة سبعة.
      ar: في زقاق Rukunan، الساعة السابعة.
      en: In Rukunan lane, at seven o'clock.
    words: [pasangan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: لازم تجيب إيه معاك؟
      ar: ماذا يجب أن تُحضر؟
      en: What should you bring?
    options: [sapu lan pacul, buku lan pulpen, sega lan kopi]
    answer: 0
    words: [pacul]
  - id: e04
    type: match_pairs
    pairs:
      - text: kerja bakti
        ar_eg: يوم شغل جماعي (تنظيف الحتة)
        ar: يوم عمل تطوعي (تنظيف الحيّ)
        en: community work day
      - text: sapu
        ar_eg: مقشّة
        ar: مكنسة
        en: broom
      - text: pacul
        ar_eg: فاس (للأرض)
        ar: معول
        en: hoe
      - text: ꦒꦁ
        ar_eg: gang — حارة ضيقة
        ar: gang — زقاق ضيق
        en: gang — narrow lane
    words: [kerja bakti, pacul]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "في ꦏꦼꦂꦗꦧꦏ꧀ꦠꦶ، أنهي حرف بقى pasangan؟"
      ar: "في ꦏꦼꦂꦗꦧꦏ꧀ꦠꦶ، أي حرف صار pasangan؟"
      en: "In ꦏꦼꦂꦗꦧꦏ꧀ꦠꦶ, which letter is written as a pasangan?"
    options: [ja, ta, ba]
    answer: 1
    explain:
      ar_eg: الـ k في bak مالهاش حركة وبعدها t على طول، فـ ta بتتكتب pasangan. الـ r في ker عليها layar، فـ ja بتتكتب عادي.
      ar: الـ k في bak ساكنة وتليها t مباشرة، فتُكتب ta pasangan. أما r في ker فعليها layar، فتُكتب ja عادية.
      en: The k of bak is vowel-less right before t, so ta is a pasangan. The r of ker has layar, so ja is written normally.
    words: [pasangan, kerja bakti]
  - id: e06
    type: fill_blank
    sentence: Gawa sapu lan ___.
    meaning:
      ar_eg: هاتوا مقشّة وفاس.
      ar: أحضروا مكنسة ومعولًا.
      en: Bring a broom and a hoe.
    options: [pacul, gang, Minggu]
    answers: [pacul]
    words: [pacul]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦱꦼꦱꦸꦏ꧀ꦩꦶꦁꦒꦸꦲꦤꦏꦼꦂꦗꦧꦏ꧀ꦠꦶ꧉"
      ar: "اكتب بالحروف اللاتينية: ꦱꦼꦱꦸꦏ꧀ꦩꦶꦁꦒꦸꦲꦤꦏꦼꦂꦗꦧꦏ꧀ꦠꦶ꧉"
      en: "Write in Latin letters: ꦱꦼꦱꦸꦏ꧀ꦩꦶꦁꦒꦸꦲꦤꦏꦼꦂꦗꦧꦏ꧀ꦠꦶ꧉"
    answers: ["Sesuk Minggu ana kerja bakti.", sesuk minggu ana kerja bakti]
    words: [kerja bakti, pasangan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: "اكتب «sapu lan pacul» مقطع مقطع. الـ pasangan بتتلزق في المقطع اللي قبلها."
      ar: "اكتب «sapu lan pacul» مقطعًا مقطعًا. تلتصق الـ pasangan بالمقطع الذي قبلها."
      en: Build "sapu lan pacul", syllable by syllable. The pasangan sticks to the syllable before it.
    answer: ꦱ ꦥꦸ ꦭꦤ꧀ꦥ ꦕꦸꦭ꧀
    distractors: ["ꦭꦤ꧀"]
    words: [pacul, pasangan]
  - id: e09
    type: speaking
    text: Sesuk Minggu aku melu kerja bakti.
    meaning:
      ar_eg: بكرة الحد هشارك في يوم الشغل الجماعي.
      ar: غدًا الأحد سأشارك في العمل التطوعي.
      en: Tomorrow, Sunday, I'm joining the clean-up.
    words: [kerja bakti]
dialogue:
  title: Ing gang Rukunan
  lines:
    - speaker: Mas Bimo
      text: Med, wis maca pengumuman ing papan?
      ar_eg: يا محمد، قريت الإعلان اللي على اللوحة؟
      ar: يا محمد، أقرأت الإعلان على اللوح؟
      en: Med, have you read the notice on the board?
    - speaker: Mohamed
      text: Wis, Mas. Sesuk Minggu kerja bakti, jam pitu.
      ar_eg: قريته. بكرة الحد شغل جماعي، الساعة سبعة.
      ar: نعم. غدًا الأحد عمل تطوعي، الساعة السابعة.
      en: Yes, Mas. Clean-up tomorrow, Sunday, at seven.
    - speaker: Mas Bimo
      text: Kowe melu? Aku duwe pacul loro.
      ar_eg: هتيجي؟ أنا عندي فاسين.
      ar: هل ستشارك؟ لديّ معولان.
      en: Are you joining? I've got two hoes.
    - speaker: Mohamed
      text: Melu! Aku gawa sapu wae.
      ar_eg: جاي! أنا هجيب مقشّة.
      ar: سأشارك! سأُحضر مكنسة.
      en: I'm in! I'll bring a broom.
new_words:
  - word: pacul
    pos: noun
    ar_eg: فاس (للأرض)
    ar: معول
    en: hoe = cangkul
