schema: kabar.lesson/v1
id: j4.u03.l03
language: jv
title: Ngaturi lan ngaturaken
can_do:
  ar_eg: تعزم حد كبير، تقدّم له هدية، وتمشي معاه بتواضع.
  ar: أن تدعو الكبير وتقدّم له هدية وترافقه بتواضع.
  en: Invite, offer a gift and go along humbly.
slides:
  - title: Maringi ↔ ngaturaken
    body:
      ar_eg: |
        الإدّاء ليه اتجاهين:
        - الكبير بيدّيك: maringi (krama inggil). «Simbah maringi kula arta» = تيتة إدّتني فلوس.
        - إنت بتقدّم للكبير: ngaturaken (krama andhap)، زي «أقدّم لحضرتك». «Kula ngaturaken oleh-oleh menika» = اتفضل الهدية دي مني.
        وهتسمع كمان caos بنفس معنى ngaturaken، أرسمي شوية.
        بالإندونيسي الاتنين memberi، والجاوي بيفرّق مين بيدّي مين.
      ar: |
        للعطاء اتجاهان:
        - الكبير يعطيك: maringi (krama inggil): «Simbah maringi kula arta».
        - وأنت تقدّم للكبير: ngaturaken (krama andhap)، كقولنا «أقدّم لسيادتك»: «Kula ngaturaken oleh-oleh menika».
        وستسمع caos بمعنى ngaturaken وهي أكثر رسمية.
        وكلاهما بالإندونيسية memberi، أما الجاوية فتفرّق بين المعطي والمعطى.
      en: |
        Giving goes two ways:
        - The elder gives to you: maringi (krama inggil). "Simbah maringi kula arta" = Grandma gave me money.
        - You offer up to the elder: ngaturaken (krama andhap), like «أقدّم لحضرتك». "Kula ngaturaken oleh-oleh menika" = please accept this little gift from me.
        You'll also hear caos with the same meaning as ngaturaken, a little more formal.
        Indonesian has memberi for both; Javanese marks who gives to whom.
    grammar: jv.krama-andhap
    examples:
      - text: Kula ngaturaken oleh-oleh menika.
        ar_eg: اتفضل الهدية البسيطة دي مني.
        ar: تفضّلوا بقبول هذه الهدية مني.
        en: Please accept this little gift from me.
      - text: Simbah maringi kula arta.
        ar_eg: تيتة إدّتني فلوس.
        ar: أعطتني الجدة مالًا.
        en: Grandma gave me some money.
  - title: Ngaturi, ndherek
    body:
      ar_eg: |
        - ngaturi = أعزم بتواضع (وكمان أبلّغ بأدب). «Kula ngaturi Bapak rawuh» = يشرّفني إن حضرتك تيجي. شوف: ngaturi ليك، وrawuh ليه.
        - ndherek = أمشي مع / أنضم لحد كبير. «Kula ndherek, Pak» = أنا جاي مع حضرتك. بالنغوكو melu.
      ar: |
        - ngaturi = أدعو بتواضع (وأُبلغ بأدب): «Kula ngaturi Bapak rawuh» = يشرّفني حضوركم؛ ngaturi لك وrawuh له.
        - ndherek = أرافق الكبير: «Kula ndherek, Pak» = سآتي معكم، وبالنغوكو melu.
      en: |
        - ngaturi = invite humbly (also: inform politely). "Kula ngaturi Bapak rawuh" = I'd be honoured if you came, sir. Note: ngaturi is yours, rawuh is his.
        - ndherek = go along with someone you respect. "Kula ndherek, Pak" = I'll come with you, sir. In ngoko: melu.
    grammar: jv.krama-andhap
    examples:
      - text: Kula ngaturi Bapak rawuh.
        ar_eg: يشرّفني إن حضرتك تيجي.
        ar: يشرّفني حضوركم.
        en: I'd be honoured if you came, sir.
      - text: Inggih, Pak, kula ndherek.
        ar_eg: حاضر يا أستاذ، أنا جاي مع حضرتك.
        ar: نعم يا سيدي، سأرافقكم.
        en: Yes, sir, I'll come with you.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ngaturi
        ar_eg: أعزم بتواضع
        ar: أدعو بتواضع
        en: invite humbly
      - text: ngaturaken
        ar_eg: أقدّم لحد كبير
        ar: أقدّم للكبير
        en: offer, present to an elder
      - text: maringi
        ar_eg: الكبير يدّي
        ar: يعطي الكبير
        en: (the elder) gives
      - text: ndherek
        ar_eg: أمشي مع حد كبير
        ar: أرافق الكبير
        en: go along with (an elder)
    words: [ngaturi, ngaturaken, maringi, ndherek]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بتدّي Pak Harsono هدية من مصر. تقول إيه؟
      ar: تقدّم لـ Pak Harsono هدية من مصر. ماذا تقول؟
      en: You give Pak Harsono a present from Egypt. What do you say?
    options: ['Kula maringi oleh-oleh menika, Pak.', 'Kula ngaturaken oleh-oleh menika, Pak.', 'Aku menehi oleh-oleh iki.']
    answer: 1
    explain:
      ar_eg: "إنت بتدّي «لفوق»: ngaturaken. maringi للكبير لما هو اللي يدّي."
      ar: عطاؤك إلى الأعلى ngaturaken، وmaringi لعطاء الكبير.
      en: "You're giving upward: ngaturaken. maringi is the elder giving."
    words: [ngaturaken, maringi]
  - id: e03
    type: listen
    text: Simbah maringi kula jeruk.
    options: ['Simbah maringi kula jeruk.', 'Kula ngaturaken jeruk dhateng Simbah.', 'Simbah mundhut jeruk.']
    answer: 0
    meaning:
      ar_eg: تيتة إدّتني برتقان.
      ar: أعطتني الجدة برتقالًا.
      en: Grandma gave me some oranges.
    words: [maringi]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: Pak Harsono رايح الكراتون، وإنت عايز تروح معاه. تقول إيه؟
      ar: Pak Harsono ذاهب إلى الكراتون، وتريد مرافقته. ماذا تقول؟
      en: Pak Harsono is going to the Kraton and you'd like to go with him. What do you say?
    options: ['Kula tindak, Pak.', 'Kula rawuh, Pak.', 'Kula ndherek, Pak.']
    answer: 2
    explain:
      ar_eg: ndherek = أمشي مع حضرتك. tindak وrawuh krama inggil، مينفعوش لنفسك.
      ar: ndherek = أرافقكم، وtindak وrawuh من krama inggil فلا تصلحان لنفسك.
      en: ndherek = I'll go along with you. tindak and rawuh are krama inggil, not for yourself.
    words: [ndherek]
  - id: e05
    type: fill_blank
    sentence: Kula ___ Bapak rawuh dhateng griya kula.
    meaning:
      ar_eg: يشرّفني إن حضرتك تيجي بيتي.
      ar: يشرّفني أن تزوروا بيتي.
      en: I'd be honoured if you came to my house, sir.
    options: [ngaturi, ngaturaken, maringi]
    answers: [ngaturi]
    explain:
      ar_eg: العزومة ngaturi. ngaturaken لما تقدّم حاجة، وmaringi للكبير لما يدّي.
      ar: الدعوة ngaturi، وngaturaken لتقديم شيء، وmaringi لعطاء الكبير.
      en: Inviting is ngaturi; ngaturaken is offering a thing; maringi is the elder giving.
    words: [ngaturi]
  - id: e06
    type: fill_blank
    sentence: Pak Harsono ___ kula buku basa Jawi.
    meaning:
      ar_eg: Pak Harsono إدّاني كتاب جاوي.
      ar: أعطاني Pak Harsono كتابًا بالجاوية.
      en: Pak Harsono gave me a Javanese book.
    options: [ngaturaken, maringi, nyuwun]
    answers: [maringi]
    words: [maringi]
  - id: e07
    type: build_sentence
    source:
      ar_eg: يشرّفني إن حضرتك تيجي يا هانم.
      ar: يشرّفني حضورك يا سيدتي.
      en: I'd be honoured if you came, ma'am.
    answer: Kula ngaturi Ibu rawuh.
    distractors: [sowan, ngaturaken]
    words: [ngaturi]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Pak Harsono) اتفضل الهدية دي من مصر يا أستاذ.
      ar: (إلى Pak Harsono) تفضّل بقبول هذه الهدية من مصر يا سيدي.
      en: (to Pak Harsono) Please accept this gift from Egypt, sir.
    answers: ['Kula ngaturaken oleh-oleh saking Mesir, Pak.', 'Pak, kula ngaturaken oleh-oleh saking Mesir.', 'Kula ngaturaken oleh-oleh menika saking Mesir, Pak.', 'Kula ngaturaken oleh-oleh saking Mesir menika, Pak.', 'Menika oleh-oleh saking Mesir kagem Bapak.']
    explain:
      ar_eg: kula + ngaturaken + oleh-oleh + saking Mesir. وممكن كمان «Menika oleh-oleh saking Mesir kagem Bapak».
      ar: kula + ngaturaken + oleh-oleh + saking Mesir، ويصحّ أيضًا «Menika oleh-oleh saking Mesir kagem Bapak».
      en: kula + ngaturaken + oleh-oleh + saking Mesir. "Menika oleh-oleh saking Mesir kagem Bapak" works too.
    words: [ngaturaken]
  - id: e09
    type: speaking
    text: Inggih, Pak, kula ndherek.
    meaning:
      ar_eg: حاضر يا أستاذ، أنا جاي مع حضرتك.
      ar: نعم يا سيدي، سأرافقكم.
      en: Yes, sir, I'll come with you.
    words: [ndherek]
dialogue:
  title: Oleh-oleh saking Kairo
  lines:
    - speaker: Mohamed
      text: Pak, kula ngaturaken oleh-oleh saking Mesir.
      ar_eg: يا أستاذ، اتفضل هدية من مصر.
      ar: يا سيدي، تفضّل هذه الهدية من مصر.
      en: Sir, please accept this present from Egypt.
    - speaker: Pak Harsono
      text: Wah, menika menapa, Mas?
      ar_eg: الله، إيه ده يا ابني؟
      ar: ما هذا يا بني؟
      en: Oh, what's this?
    - speaker: Mohamed
      text: Papirus saking Kairo, Pak.
      ar_eg: ورق بردي من القاهرة يا أستاذ.
      ar: ورق بردي من القاهرة يا سيدي.
      en: Papyrus from Cairo, sir.
    - speaker: Pak Harsono
      text: Matur nuwun sanget, Mas. Sonten menika kula badhe kesah dhateng Kraton.
      ar_eg: متشكر أوي يا ابني. العصر ده أنا رايح الكراتون.
      ar: شكرًا جزيلًا يا بني. سأذهب إلى الكراتون عصر اليوم.
      en: Thank you so much. This afternoon I'm going to the Kraton.
    - speaker: Mohamed
      text: Kula ndherek, Pak!
      ar_eg: أنا جاي مع حضرتك يا أستاذ!
      ar: سأرافقكم يا سيدي!
      en: I'll come with you, sir!
new_words:
  - word: ngaturi
    pos: verb
    ar_eg: يعزم بتواضع / يبلّغ بأدب (krama andhap)
    ar: يدعو بتواضع / يُبلغ بأدب (krama andhap)
    en: invite humbly; inform politely (krama andhap) = mengundang, memberi tahu
  - word: ngaturaken
    pos: verb
    ar_eg: يقدّم لحد كبير (krama andhap؛ وزيها caos)
    ar: يقدّم للكبير (krama andhap؛ ومثلها caos)
    en: offer, present to an elder (krama andhap; also caos) = mempersembahkan
  - word: maringi
    pos: verb
    ar_eg: يدّي، لما الكبير هو اللي بيدّي (krama inggil؛ ngoko menehi)
    ar: يعطي، إذا كان المعطي هو الكبير (krama inggil؛ ngoko menehi)
    en: give, when the elder gives (krama inggil; ngoko menehi) = memberi
  - word: ndherek
    pos: verb
    ar_eg: يمشي مع / ينضم لحد كبير (krama andhap؛ ngoko melu)
    ar: يرافق الكبير (krama andhap؛ ngoko melu)
    en: go along with, join (an elder) (krama andhap; ngoko melu) = ikut
