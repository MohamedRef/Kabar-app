schema: kabar.lesson/v1
id: j4.u02.l08
language: jv
title: Ulangan J4.2
can_do:
  ar_eg: تستخدم أسماء التبجيل صح.
  ar: أن تستعمل أسماء التبجيل استعمالًا صحيحًا.
  en: Use honorific nouns correctly.
slides:
  - title: Asmanipun? — Nami kula…
    body:
      ar_eg: |
        القاعدة في جملة: حاجات الكبير مرفوعة، وحاجاتك عادية.
        asma ↔ nami · yuswa ↔ umur · dalem ↔ griya · putra ↔ anak · garwa ↔ semah · asta ↔ tangan · mustaka ↔ sirah · ageman ↔ klambi · dhaharan ↔ panganan · gerah ↔ sakit · kagem ↔ kangge · kagungan ↔ gadhah.
      ar: |
        القاعدة في جملة: أشياء الكبير مرفوعة، وأشياؤك عادية.
        asma ↔ nami · yuswa ↔ umur · dalem ↔ griya · putra ↔ anak · garwa ↔ semah · asta ↔ tangan · mustaka ↔ sirah · ageman ↔ klambi · dhaharan ↔ panganan · gerah ↔ sakit · kagem ↔ kangge · kagungan ↔ gadhah.
      en: |
        The rule in one line: the elder's things are raised; yours stay plain.
        asma ↔ nami · yuswa ↔ umur · dalem ↔ griya · putra ↔ anak · garwa ↔ semah · asta ↔ tangan · mustaka ↔ sirah · ageman ↔ klambi · dhaharan ↔ panganan · gerah ↔ sakit · kagem ↔ kangge · kagungan ↔ gadhah.
    grammar: jv.krama-inggil.nouns
    examples:
      - text: Asmanipun sinten, Pak? — Nami kula Slamet.
        ar_eg: اسم حضرتك إيه يا حاج؟ — اسمي سلامت.
        ar: ما اسمكم يا سيدي؟ — اسمي سلامت.
        en: What's your name, sir? — My name is Slamet.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: asma
        ar_eg: nami بتاعة الكبير (اسم)
        ar: nami للكبير (اسم)
        en: the elder's nami (name)
      - text: dalem
        ar_eg: griya بتاعة الكبير (بيت)
        ar: griya للكبير (بيت)
        en: the elder's griya (home)
      - text: putra
        ar_eg: anak بتاع الكبير (ولد)
        ar: anak للكبير (ولد)
        en: the elder's anak (child)
      - text: mustaka
        ar_eg: sirah بتاعة الكبير (راس)
        ar: sirah للكبير (رأس)
        en: the elder's sirah (head)
    words: [asma, dalem, putra, mustaka]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها غلطة؟
      ar: أي جملة فيها خطأ؟
      en: Which sentence has a mistake?
    options: ['Nami kula Mohamed.', 'Asma kula Mohamed.', 'Asmanipun Bapak sinten?']
    answer: 1
    explain:
      ar_eg: اسمك إنت nami. asma لاسم الكبير بس.
      ar: اسمك nami، وasma لاسم الكبير.
      en: Your own name is nami; asma is only for the elder's name.
    words: [asma]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: تسأل Pak Slamet عنده كام ولد. تقول إيه؟
      ar: تسأل Pak Slamet كم ولدًا لديه. ماذا تقول؟
      en: You ask Pak Slamet how many children he has. What do you say?
    options: ['Bapak gadhah anak pinten?', 'Anakmu pira, Pak?', 'Bapak kagungan putra pinten?']
    answer: 2
    explain:
      ar_eg: ملكيته وعياله هو، يبقى kagungan وputra.
      ar: ملكه وأولاده هو فيكون kagungan وputra.
      en: "His having and his children: kagungan and putra."
    words: [kagungan, putra]
  - id: e04
    type: listen
    text: Dalemipun Simbah caket kaliyan Malioboro.
    options: ['Dalemipun Simbah caket kaliyan Malioboro.', 'Griya kula caket kaliyan Malioboro.', 'Dalemipun Simbah tebih saking Malioboro.']
    answer: 0
    meaning:
      ar_eg: بيت تيتة قريب من ماليوبورو.
      ar: بيت الجدة قريب من ماليوبورو.
      en: Grandma's house is near Malioboro.
    words: [dalem, caket]
  - id: e05
    type: listen
    text: Garwanipun Pak Slamet saweg gerah.
    options: ['Garwanipun Pak Slamet saweg sare.', 'Garwanipun Pak Slamet saweg gerah.', 'Putranipun Pak Slamet saweg gerah.']
    answer: 1
    meaning:
      ar_eg: مرات Pak Slamet تعبانة.
      ar: زوجة Pak Slamet مريضة.
      en: Pak Slamet's wife is unwell.
    words: [garwa, gerah]
  - id: e06
    type: fill_blank
    sentence: Menika ___ kagem Bapak.
    meaning:
      ar_eg: ده أكل عشان حضرتك يا أستاذ.
      ar: هذا طعام لكم يا سيدي.
      en: This is food for you, sir.
    options: [dhaharan, panganan, sirah]
    answers: [dhaharan]
    words: [dhaharan, kagem]
  - id: e07
    type: fill_blank
    sentence: Kula ___ adhi setunggal.
    meaning:
      ar_eg: عندي أخ صغير واحد.
      ar: لديّ أخ أصغر واحد.
      en: I have one younger sibling.
    options: [kagungan, gadhah, garwa]
    answers: [gadhah]
    explain:
      ar_eg: عن نفسك gadhah. kagungan للكبير.
      ar: عن نفسك gadhah، وkagungan للكبير.
      en: About yourself, gadhah; kagungan is for the elder.
    words: [gadhah]
  - id: e08
    type: build_sentence
    source:
      ar_eg: قميص الباتيك ده عشان حضرتك يا أستاذ.
      ar: قميص الباتيك هذا لكم يا سيدي.
      en: This batik shirt is for you, sir.
    answer: Ageman batik menika kagem Bapak.
    distractors: [kangge, klambi]
    words: [ageman, kagem]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لست كبيرة) لا مؤاخذة، اسم حضرتك إيه يا حاجة؟
      ar: (لسيدة كبيرة) عفوًا، ما اسمكِ يا سيدتي؟
      en: (to an older lady) Excuse me, what's your name, ma'am?
    answers: ['Nyuwun sewu, asmanipun sinten, Bu?', 'Nyuwun sewu, Bu, asmanipun sinten?', 'Asmanipun sinten, Bu?', 'Bu, asmanipun sinten?', 'Nyuwun sewu, asmanipun sinten?', 'Asma panjenengan sinten, Bu?']
    words: [asma]
  - id: e10
    type: dictation
    text: Simbah taksih gerah astanipun.
    meaning:
      ar_eg: إيد تيتة لسه بتوجعها.
      ar: ما زالت يد الجدة تؤلمها.
      en: Grandma's hand still hurts.
    words: [asta]
  - id: e11
    type: speaking
    text: Umur kula selangkung. Yuswanipun Bapak pinten?
    meaning:
      ar_eg: أنا عندي خمسة وعشرين سنة. وحضرتك عندك كام سنة؟
      ar: عمري خمسة وعشرون عامًا. وكم عمركم يا سيدي؟
      en: I'm twenty-five. How old are you, sir?
    words: [yuswa]
dialogue:
  title: Malem ing Malioboro
  lines:
    - speaker: Pak Slamet
      text: Mas Mohamed! Pripun kabaripun?
      ar_eg: يا محمد! أخبارك إيه؟
      ar: يا محمد! كيف حالك؟
      en: Mohamed! How are you?
    - speaker: Mohamed
      text: Sae, Pak. Garwanipun pripun?
      ar_eg: كويس يا حاج. والمدام عاملة إيه؟
      ar: بخير يا سيدي. وكيف حال زوجتك؟
      en: Fine, sir. How is your wife?
    - speaker: Pak Slamet
      text: Sae, Mas. Mbah Putri pripun?
      ar_eg: كويسة يا ابني. وتيتة Mbah Putri عاملة إيه؟
      ar: بخير يا بني. وكيف حال الجدة Mbah Putri؟
      en: She's fine. How is Mbah Putri?
    - speaker: Mohamed
      text: Simbah sampun mboten gerah, Pak.
      ar_eg: تيتة خفّت خلاص يا حاج.
      ar: لم تعد الجدة مريضة يا سيدي.
      en: Grandma isn't ill any more, sir.
    - speaker: Pak Slamet
      text: Alhamdulillah. Menika bakpia kagem Simbah.
      ar_eg: الحمد لله. ودي bakpia عشان تيتة.
      ar: الحمد لله. وهذه bakpia للجدة.
      en: Thank God. Here's some bakpia for Grandma.
    - speaker: Mohamed
      text: Matur nuwun sanget, Pak.
      ar_eg: متشكر أوي يا حاج.
      ar: شكرًا جزيلًا يا سيدي.
      en: Thank you so much, sir.
souvenir:
  id: j4.u02.souvenir
  title: Dalan Malioboro
  note:
    ar_eg: |
      Malioboro أشهر شارع في يوجيا: ماشي على نفس الخط من التوغو لحد قصر السلطان، ومليان باتيك وعربيات andong بالخيل وbecak. وبالليل بتتفرش القعدات على الأرض (lesehan) وتاكل gudeg. ولو سألت حد كبير عن اسمه هنا، افتكر إن كلمة «اسم» نفسها بتترفع: «Asmanipun sinten?»
    ar: |
      Malioboro أشهر شوارع يوغيا، يمتد على الخط نفسه من التوغو إلى قصر السلطان، ويزدحم بالباتيك وعربات andong والـ becak. وفي الليل تُفرش الجلسات الأرضية (lesehan) ويؤكل الـ gudeg. وإذا سألت كبيرًا هنا عن اسمه فتذكّر أن كلمة «اسم» نفسها تُرفع: «Asmanipun sinten?»
    en: |
      Malioboro is Yogya's most famous street, running along the same line from the Tugu toward the Sultan's palace, full of batik, horse-drawn andong and becak. At night, mats come out for lesehan (sit-on-the-floor) dining and gudeg. If you ask an elder's name here, remember that the word "name" itself is raised: "Asmanipun sinten?"
