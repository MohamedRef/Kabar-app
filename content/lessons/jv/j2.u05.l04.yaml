  - id: e09
    type: translate
    direction: from_target
    source_text: Ayo ngobrol karo simbah ing ngarep omah.
    answers_meaning:
      ar_eg: [يلا ندردش مع جدّتي قدام البيت, تعالى نتكلم مع جدّو قدام البيت]
      ar: [هيّا نتسامر مع الجدّة أمام البيت, تعال نتحدّث مع الجدّ أمام البيت]
      en: ['Let''s chat with grandma in front of the house', Come and chat with grandpa outside the house]
    words: [ngobrol]
  - id: e10
    type: speaking
    text: Aku mbantu Bapak, terus ngobrol karo Bayu.
    meaning:
      ar_eg: بساعد بابا، وبعدين أدردش مع بايو.
      ar: أساعد أبي ثم أتسامر مع بايو.
      en: I help Dad, then chat with Bayu.
    words: [mbantu, ngobrol]
dialogue:
  lines:
    - speaker: Bu Rahayu
      text: Mas, wis adus? Kelase wiwit jam pira?
      ar_eg: يا ماس، استحميت؟ الحصة بتبدأ الساعة كام؟
      ar: يا أخي، هل استحممت؟ متى يبدأ الدرس؟
      en: Mas, have you showered? What time does class start?
    - speaker: Mohamed
      text: Wis, Bu. Wiwit jam wolu, aku mangkat saiki.
      ar_eg: أيوه يا طنط. بتبدأ تمانية، هتحرك دلوقتي.
      ar: نعم يا سيّدتي. يبدأ في الثامنة، سأنطلق الآن.
      en: Yes, Bu. It starts at eight, I'm setting off now.
    - speaker: Bu Rahayu
      text: Mengko sore mbantu aku ing warung, ya? Bayu tak kongkon tuku gula.
      ar_eg: العصر تيجي تساعدني في المحل؟ بايو هبعته يشتري سكر.
      ar: هلّا تساعدني في المحلّ بعد الظهر؟ سأرسل بايو ليشتري السكّر.
      en: Can you help me at the warung this afternoon? I'm sending Bayu for sugar.
    - speaker: Mohamed
      text: Iya, Bu. Nanging leren sedhela dhisik, hehe.
      ar_eg: حاضر يا طنط. بس أرتاح شوية الأول، هههه.
      ar: حسنًا يا سيّدتي. لكن أستريح قليلًا أوّلًا، هههه.
      en: Sure, Bu. But a little break first, hehe.
    - speaker: Bu Rahayu
      text: Hehe, iya. Sing penting ngobrol karo pembeli nganggo basa Jawa!
      ar_eg: هههه، ماشي. المهم تدردش مع الزباين بالجاوي!
      ar: هههه، حسنًا. المهمّ أن تتحدّث مع الزبائن بالجاوية!
      en: Hehe, fine. What matters is chatting with customers in Javanese!
