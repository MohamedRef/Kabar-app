      ar_eg: «ارتاح الأول يا ماس!» بالجاوي؟
      ar: كيف تقول «استرح أوّلًا يا أخي!» بالجاوية؟
      en: '"Take a break first, Mas!" in Javanese?'
    options: ['Leren dhisik, Mas!', 'Nabung dhisik, Mas!', 'Wiwit dhisik, Mas!']
    answer: 0
    explain:
      ar_eg: leren = يرتاح. nabung = يحوّش، wiwit = يبدأ.
      ar: leren = يستريح. أمّا nabung فيدّخر، وwiwit فيبدأ.
      en: leren = rest. nabung = save, wiwit = start.
