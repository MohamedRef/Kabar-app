dialogue:
  title: Saben dina neng omah
  lines:
    - speaker: Mohamed
      text: Sari, saben dina kowe ngapa wae neng omah?
      ar_eg: ساري، بتعملي إيه كل يوم في البيت؟
      ar: يا ساري، ماذا تفعلين كل يوم في البيت؟
      en: Sari, what do you do every day at home?
    - speaker: Sari
      text: Aku tangi jam setengah lima, salat Subuh.
      ar_eg: بصحى الساعة أربعة ونص، وبصلي الصبح.
      ar: أستيقظ في الرابعة والنصف وأصلي الفجر.
      en: I wake up at half past four and pray the dawn prayer.
    - speaker: Sari
      text: Jam pitu aku sarapan karo Ibu.
      ar_eg: الساعة سبعة بفطر مع ماما.
      ar: في السابعة أفطر مع أمي.
      en: At seven I have breakfast with Mum.
    - speaker: Mohamed
      text: Awan ngapa?
      ar_eg: والضهر بتعملي إيه؟
      ar: وماذا تفعلين ظهرًا؟
      en: And at midday?
    - speaker: Sari
      text: Awan aku masak. Sore aku nyirami kembang.
      ar_eg: الضهر بطبخ. العصر بسقي الورد.
      ar: ظهرًا أطبخ، وعصرًا أسقي الزهور.
      en: At midday I cook. In the afternoon I water the flowers.
    - speaker: Mohamed
      text: Wah, dinamu sibuk tenan!
      ar_eg: ياه، يومك مليان بجد!
      ar: يا لها من أيام مزدحمة!
      en: Wow, your days are really busy!
