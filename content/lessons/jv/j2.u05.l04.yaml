schema: kabar.lesson/v1
id: j2.u05.l04
language: jv
title: Dinane Sari
can_do:
  ar_eg: تحكي يوم كامل بالجاوي.
  ar: أن تروي يومًا كاملًا بالجاوية.
  en: Narrate a day.
slides:
  - title: Saben dina
    body:
      ar_eg: |
        عشان تحكي يومك: الساعة + الفعل، وsaben dina = كل يوم (setiap hari).
        - tangi = يصحى · salat Subuh = يصلي الصبح (صلاة، صبح) · adus = يستحمى
        - sarapan = يفطر · mangkat = يطلع / يتحرك (berangkat) · kuliah = يروح الجامعة (من «كلية»)
        - masak = يطبخ · nyapu، ngresiki omah، nyirami kembang = شغل البيت
        - mulih = يروّح · turu = ينام
        مثال: Jam setengah lima aku tangi. Jam pitu aku sarapan. Jam sepuluh bengi aku turu.
        الفعل مابيتغيرش مع الزمن، زي الإندونيسي: الساعة أو wis / lagi / arep بيوضحوا الوقت.
      ar: |
        لتروي يومك: الساعة + الفعل، وsaben dina = كل يوم (setiap hari).
        - tangi = يستيقظ · salat Subuh = يصلي الفجر (صلاة، صبح) · adus = يغتسل
        - sarapan = يفطر · mangkat = ينطلق (berangkat) · kuliah = يدرس في الجامعة (من «كلية»)
        - masak = يطبخ · nyapu وngresiki omah وnyirami kembang = أعمال البيت
        - mulih = يعود إلى البيت · turu = ينام
        مثال: Jam setengah lima aku tangi. Jam pitu aku sarapan. Jam sepuluh bengi aku turu.
        ولا يتغير الفعل مع الزمن كالإندونيسية، بل تحدده الساعة أو wis / lagi / arep.
      en: |
        To tell your day: time + verb; saben dina = every day (setiap hari).
        - tangi = wake up · salat Subuh = pray the dawn prayer (صلاة، صبح) · adus = have a bath
        - sarapan = have breakfast · mangkat = set off (berangkat) · kuliah = go to university (from Arabic «كلية»)
        - masak = cook · nyapu, ngresiki omah, nyirami kembang = chores
        - mulih = go home · turu = sleep
        Example: Jam setengah lima aku tangi. Jam pitu aku sarapan. Jam sepuluh bengi aku turu.
        The verb never changes for time, as in Indonesian: the clock or wis / lagi / arep show when.
    examples:
      - text: Saben dina aku tangi jam setengah lima.
        ar_eg: كل يوم بصحى الساعة أربعة ونص.
        ar: أستيقظ كل يوم في الرابعة والنصف.
        en: Every day I wake up at half past four.
      - text: Neng Kairo, Sari kuliah.
        ar_eg: في القاهرة، ساري بتدرس في الجامعة.
        ar: في القاهرة تدرس ساري في الجامعة.
        en: In Cairo, Sari goes to university.
exercises:
