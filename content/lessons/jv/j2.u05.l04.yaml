schema: kabar.lesson/v1
id: j2.u05.l04
language: jv
title: Mangkat lan leren
can_do:
  ar_eg: 'تحكي يومك: تستحمى وتتحرك، الحاجة بتبدأ إمتى، ترتاح، تساعد، وتحوّش فلوس.'
  ar: 'أن تحكي يومك: تستحمّ وتنطلق، ومتى يبدأ الشيء، وترتاح، وتساعد، وتدّخر.'
  en: 'Tell your day: shower and set off, when things start, rest, help out and save money.'
slides:
  - title: Dinaku
    body:
      ar_eg: |
        adus = يستحمى، mangkat = يتحرك ويطلع (على مكان): Aku adus, terus mangkat.
        wiwit = يبدأ، من ساعة: Kelase wiwit jam wolu.
        leren = يرتاح، ياخد بريك: Leren dhisik!
        ngongkon = يقول لحد يعمل حاجة: Ibu ngongkon aku tuku endhog.
        mbantu = يساعد، nabung = يحوّش فلوس، ngobrol = يدردش.
      ar: |
        adus = يستحمّ، mangkat = ينطلق (إلى مكان): Aku adus, terus mangkat.
        wiwit = يبدأ، منذ: Kelase wiwit jam wolu.
        leren = يستريح: Leren dhisik!
        ngongkon = يكلّف أحدًا بعمل: Ibu ngongkon aku tuku endhog.
        mbantu = يساعد، nabung = يدّخر المال، ngobrol = يتسامر.
      en: |
        adus = take a bath, shower; mangkat = set off (for somewhere): Aku adus, terus mangkat.
        wiwit = start, since: Kelase wiwit jam wolu.
        leren = rest, take a break: Leren dhisik!
        ngongkon = tell someone to do something: Ibu ngongkon aku tuku endhog.
        mbantu = help, nabung = save money, ngobrol = chat.
    examples:
      - text: Aku adus dhisik, terus mangkat.
        ar_eg: هستحمى الأول، وبعدين أتحرك.
        ar: أستحمّ أوّلًا ثم أنطلق.
        en: I'll shower first, then set off.
      - text: Ibu ngongkon aku tuku endhog.
        ar_eg: ماما قالتلي أشتري بيض.
        ar: طلبت منّي أمّي شراء البيض.
        en: Mum sent me to buy eggs.
      - text: Aku nabung saben wulan.
        ar_eg: بحوّش فلوس كل شهر.
        ar: أدّخر المال كلّ شهر.
        en: I save money every month.
