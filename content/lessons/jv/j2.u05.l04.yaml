    answer: 0
    explain:
      ar_eg: ngongkon = يقول لحد يعمل حاجة، وtuku = يشتري.
      ar: ngongkon = يكلّف أحدًا، وtuku = يشتري.
      en: ngongkon = tell someone to do something, tuku = buy.
