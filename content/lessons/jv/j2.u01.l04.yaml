schema: kabar.lesson/v1
id: j2.u01.l04
language: jv
title: Kulawargané Pak Budi
can_do:
  ar_eg: توصف عيلة.
  ar: أن تصف عائلة.
  en: Describe a family.
slides:
  - title: Iki sapa?
    body:
      ar_eg: |
        على حيطة محل Pak Budi فيه صورة كبيرة للعيلة. عشان توصفها محتاج:
        - Iki / Kuwi sapa? = مين ده؟ · Sing iki sapa? = واللي ده مين؟
        - كلمات العيلة: bapak، ibu، mas، mbakyu، adhi، pakdhe، budhe، mbah putri…
        - -é / -né عشان «بتاع فلان»: masé Sari = أخو ساري الكبير، omahé = بيته.
        - -ku للي بتاعك: bojoku = مراتي، anakku = ابني / بنتي.
      ar: |
        على جدار مطعم Pak Budi صورة كبيرة للعائلة، ولوصفها تحتاج:
        - Iki / Kuwi sapa? = من هذا؟ · Sing iki sapa? = ومن هذا؟
        - ألفاظ العائلة: bapak وibu وmas وmbakyu وadhi وpakdhe وbudhe وmbah putri…
        - -é / -né للإضافة: masé Sari = أخو ساري الأكبر، omahé = بيته.
        - -ku للمتكلم: bojoku = زوجتي، anakku = ولدي.
      en: |
        On the wall of Pak Budi's warung hangs a big family photo. To describe it you need:
        - Iki / Kuwi sapa? = Who's this? · Sing iki sapa? = And who's this one?
        - Family words: bapak, ibu, mas, mbakyu, adhi, pakdhe, budhe, mbah putri…
        - -é / -né for "X's": masé Sari = Sari's older brother, omahé = his house.
        - -ku for "my": bojoku = my wife, anakku = my child.
    grammar: jv.kinship.terms
    examples:
      - text: Kuwi Agus, masé Sari.
        ar_eg: ده أجوس، أخو ساري الكبير.
        ar: ذاك أغوس، أخو ساري الأكبر.
        en: That's Agus, Sari's older brother.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: (من الحوار) الـ budhe بتاعة ساري ساكنة فين؟
      ar: (من الحوار) أين تسكن budhe ساري؟
      en: (From the dialogue) Where does Sari's budhe live?
    options: [Neng Madiun, Neng Kairo, Neng Ponorogo]
    answer: 2
    words: [budhe, manggon]
  - id: e02
    type: multiple_choice
    question: Kuwi mbakyuku, budhené Sari.
    question_meaning:
      ar_eg: Pak Budi بيقول كده. الست دي إيه بالنسبة له؟
      ar: يقول Pak Budi هذا. ما صلة هذه السيدة به؟
      en: Pak Budi says this. Who is this woman to him?
    options: [Bojoné Pak Budi, Adhiné Pak Budi, Mbakyuné Pak Budi]
    answer: 2
    explain:
      ar_eg: mbakyuku = أختي الكبيرة. وعشان هي أكبر من أبو ساري، تبقى budhe لساري.
      ar: mbakyuku = أختي الكبرى، ولأنها أكبر من والد ساري فهي budhe لساري.
      en: mbakyuku = my older sister. Being older than Sari's father, she's Sari's budhe.
    words: [mbakyu, budhe]
  - id: e03
    type: listen
    text: Mbah putri manggon neng kene.
    options: [Mbah putri manggon neng kana., Mbah kakung manggon neng kene., Mbah putri manggon neng kene.]
    answer: 2
    words: [mbah putri, manggon, kene]
  - id: e04
    type: fill_blank
    sentence: Sing ___ sapa, Pak?
    meaning:
      ar_eg: واللي ده مين يا عمو؟ (بتشاور على حد في الصورة اللي في إيدك)
      ar: ومن هذا يا عم؟ (تشير إلى شخص في الصورة التي بيدك)
      en: And who's this one, sir? (pointing at the photo in your hand)
    answers: [iki]
    words: [sing, iki]
  - id: e05
    type: fill_blank
    sentence: Omah___ neng Ponorogo.
    meaning:
      ar_eg: بيتها في بونوروجو.
      ar: بيتها في بونوروغو.
      en: Her house is in Ponorogo.
    answers: [é, e]
    explain:
      ar_eg: omah آخرها ساكن (h) ⇐ omahé.
      ar: تنتهي omah بساكن ⇐ omahé.
      en: omah ends in a consonant ⇒ omahé.
    words: [omahé]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ده أجوس، أخو ساري الكبير.
      ar: هذا أغوس، أخو ساري الأكبر.
      en: This is Agus, Sari's older brother.
    answers: ['Iki Agus, masé Sari.', 'Iki Agus, masé Sari', Iki Agus masé Sari., Iki Agus masé Sari, 'Iki Agus, mase Sari.', 'Iki Agus, mase Sari', Iki Agus mase Sari., Iki Agus mase Sari, 'Kuwi Agus, masé Sari.', 'Kuwi Agus, masé Sari', Kuwi Agus masé Sari., Kuwi Agus masé Sari, 'Kuwi Agus, mase Sari.', 'Kuwi Agus, mase Sari', Kuwi Agus mase Sari., Kuwi Agus mase Sari]
    words: [mas]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (Pak Budi بيتكلم) دي مراتي، ودي أمي.
      ar: (يتكلم Pak Budi) هذه زوجتي، وهذه أمي.
      en: (Pak Budi speaking) This is my wife, and this is my mother.
    answers: ['Iki bojoku, lan iki ibuku.', 'Iki bojoku, lan iki ibuku', Iki bojoku lan iki ibuku., Iki bojoku lan iki ibuku, 'Iki bojoku, iki ibuku.', 'Iki bojoku, iki ibuku', Iki bojoku iki ibuku., Iki bojoku iki ibuku, 'Iki bojoku, lan iki simbokku.', 'Iki bojoku, lan iki simbokku', Iki bojoku lan iki simbokku., Iki bojoku lan iki simbokku, 'Kuwi bojoku, lan kuwi ibuku.', 'Kuwi bojoku, lan kuwi ibuku', Kuwi bojoku lan kuwi ibuku., Kuwi bojoku lan kuwi ibuku]
    words: [bojo, ibu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عمي وطنط ساكنين في بونوروجو.
      ar: عمي وعمتي يسكنان في بونوروغو.
      en: My uncle and aunt live in Ponorogo.
    answer: Pakdhe karo budhe manggon neng Ponorogo.
    alternatives: [Budhe karo pakdhe manggon neng Ponorogo.]
    distractors: [saka, adhi]
    words: [pakdhe, budhe, manggon]
  - id: e09
    type: dictation
    text: Pakdhe karo budhe manggon neng Ponorogo.
    meaning:
      ar_eg: عمي وطنط ساكنين في بونوروجو.
      ar: عمي وعمتي يسكنان في بونوروغو.
      en: My uncle and aunt live in Ponorogo.
    words: [pakdhe, budhe]
  - id: e10
    type: speaking
    text: Kulawargané Pak Budi gedhe!
    meaning:
      ar_eg: عيلة باك بودي كبيرة!
      ar: عائلة باك بودي كبيرة!
      en: Pak Budi's family is big!
    words: [kulawarga]
dialogue:
  title: Foto kulawarga
  lines:
    - speaker: Mohamed
      text: Pak, iki fotoné kulawargané Pak Budi?
      ar_eg: يا عمو، دي صورة عيلة حضرتك؟
      ar: يا عم، أهذه صورة عائلتك يا Pak Budi؟
      en: Pak, is this a photo of your family?
    - speaker: Pak Budi
      text: Iya. Iki aku, iki bojoku.
      ar_eg: أيوه. ده أنا، ودي مراتي.
      ar: نعم. هذا أنا، وهذه زوجتي.
      en: Yes. This is me, and this is my wife.
    - speaker: Mohamed
      text: Sing iki sapa, Pak?
      ar_eg: واللي ده مين يا عمو؟
      ar: ومن هذا يا عم؟
      en: And who's this one, Pak?
    - speaker: Pak Budi
      text: Kuwi Agus, masé Sari. Lan kuwi Bayu, adhiné.
      ar_eg: ده أجوس، أخو ساري الكبير. وده بايو، أخوها الصغير.
      ar: ذاك أغوس، أخو ساري الأكبر. وذاك بايو، أخوها الأصغر.
      en: That's Agus, Sari's older brother. And that's Bayu, her younger brother.
    - speaker: Mohamed
      text: Lan mbah putri?
      ar_eg: وتيتة؟
      ar: والجدة؟
      en: And grandma?
    - speaker: Pak Budi
      text: Mbah putri manggon neng kene, karo aku.
      ar_eg: تيتة ساكنة هنا معايا.
      ar: الجدة تسكن هنا معي.
      en: Grandma lives here, with me.
new_words:
