schema: kabar.lesson/v1
id: j2.u01.l04
language: jv
title: Ulangan J2.1
can_do:
  ar_eg: توصف عيلتك بالنغوكو.
  ar: أن تصف عائلتك بالنغوكو.
  en: Describe your family in ngoko.
slides:
  - title: Kulawarga
    body:
      ar_eg: |
        مراجعة كلمات العيلة:
        - bapak، ibu (simbok)، anak، bojo.
        - mas (أخ كبير)، mbakyu (أخت كبيرة)، adhi (أصغر).
        - pakdhe / budhe (أكبر من أبوك أو أمك)، paklik / bulik (أصغر).
        - mbah kakung، mbah putri، putu، ponakan.
        والسن هو اللي بيحدد، مش الجهة.
      ar: |
        مراجعة ألفاظ العائلة:
        - bapak وibu (simbok) وanak وbojo.
        - mas (الأخ الأكبر)، mbakyu (الأخت الكبرى)، adhi (الأصغر).
        - pakdhe / budhe (أكبر من الوالد)، paklik / bulik (أصغر).
        - mbah kakung وmbah putri وputu وponakan.
        والمعيار السن لا الجهة.
      en: |
        Family words recap:
        - bapak, ibu (simbok), anak, bojo.
        - mas (older brother), mbakyu (older sister), adhi (younger sibling).
        - pakdhe / budhe (older than your parent), paklik / bulik (younger).
        - mbah kakung, mbah putri, putu, ponakan.
        Age decides, not which side of the family.
    grammar: jv.kinship.terms
  - title: -é / -né, -ku, -mu
    body:
      ar_eg: |
        - بعد ساكن -é: omahé، jenengé. بعد متحرك -né: bukuné، regané.
        - «بتاع فلان»: omahé Pak Budi (الحاجة الأول).
        - -ku / -mu: masku، adhimu. · duwéké sapa? = بتاع مين؟
      ar: |
        - بعد الساكن -é: omahé، jenengé، وبعد الصائت -né: bukuné، regané.
        - الإضافة: omahé Pak Budi (المملوك أولًا).
        - -ku / -mu: masku، adhimu. · duwéké sapa? = لمن؟
      en: |
        - After a consonant -é: omahé, jenengé. After a vowel -né: bukuné, regané.
        - "X's": omahé Pak Budi (thing first).
        - -ku / -mu: masku, adhimu. · duwéké sapa? = whose?
    grammar: jv.possessive.e-ne
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pakdhe
        ar_eg: عم / خال أكبر من بابا أو ماما
        ar: العم / الخال الأكبر من الوالد
        en: parent's older brother
      - text: bulik
        ar_eg: عمة / خالة أصغر من بابا أو ماما
        ar: العمة / الخالة الأصغر من الوالد
        en: parent's younger sister
      - text: putu
        ar_eg: حفيد
        ar: الحفيد
        en: grandchild
      - text: mbah kakung
        ar_eg: جدو
        ar: الجد
        en: grandfather
      - text: ponakan
        ar_eg: ابن الأخ / الأخت
        ar: ابن الأخ / الأخت
        en: niece / nephew
    words: [pakdhe, bulik, putu, mbah kakung, ponakan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أخت بابا، وهي أكبر من بابا. تقولها إيه؟
      ar: أخت أبيك، وهي أكبر منه. بمَ تناديها؟
      en: Your father's sister, older than him. What do you call her?
    options: ["mbakyu", "budhe", "bulik"]
    answer: 1
    words: [budhe]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «اسم مراتي»؟ (jeneng + bojo)
      ar: كيف تقول «اسم زوجتي»؟ (jeneng + bojo)
      en: How do you say "my wife's name"? (jeneng + bojo)
    options: ["jenengé bojoku", "jenengku bojo", "bojoku jenengé"]
    answer: 0
    explain:
      ar_eg: الحاجة الأول (jenengé) وبعدين صاحبها (bojoku)، زي «اسم مراتي».
      ar: المملوك أولًا (jenengé) ثم المالك (bojoku) كالإضافة العربية.
      en: Thing first (jenengé), owner second (bojoku), like «اسم مراتي».
    words: [jenengé, bojo]
  - id: e04
    type: multiple_choice
    question: rega + -é / -né
    question_meaning:
      ar_eg: أنهي شكل صح؟
      ar: أيّ صيغة صحيحة؟
      en: Which form is right?
    options: ["regaé", "reganya", "regané"]
    answer: 2
    explain:
      ar_eg: rega آخرها a (متحرك) ⇐ -né. وreganya إندونيسي.
      ar: تنتهي rega بصائت ⇐ -né، أما reganya فإندونيسية.
      en: rega ends in a vowel ⇒ -né. reganya is Indonesian.
    words: [regané]
  - id: e05
    type: listen
    text: Iki bojoku, lan iki anakku.
    options: ["Iki bojoku, lan iki anakku.", "Iki bojoku, lan iki adhiku.", "Iki budheku, lan iki anakku."]
    answer: 0
    words: [bojo, anak]
  - id: e06
    type: fill_blank
    sentence: Iki ___ sapa?
    meaning:
      ar_eg: ده بتاع مين؟
      ar: لمن هذا؟
      en: Whose is this?
    answers: ["duwéké", "duweke"]
    words: [duwéké]
  - id: e07
    type: fill_blank
    sentence: Aku duwé ___ loro.
    meaning:
      ar_eg: عندي اتنين إخوات أصغر مني.
      ar: لي أخوان أصغر مني.
      en: I have two younger siblings.
    options: ["mas", "mbakyu", "adhi"]
    answers: ["adhi"]
    explain:
      ar_eg: أصغر منك ⇐ adhi. mas وmbakyu للأكبر.
      ar: الأصغر ⇐ adhi، أما mas وmbakyu فللأكبر.
      en: Younger ⇒ adhi; mas and mbakyu are older.
    words: [adhi]
  - id: e08
    type: fill_blank
    sentence: Mbah ___ lagi masak.
    meaning:
      ar_eg: تيتة بتطبخ.
      ar: الجدة تطبخ.
      en: Grandma is cooking.
    options: ["kakung", "putu", "putri"]
    answers: ["putri"]
    words: [mbah putri]
  - id: e09
    type: build_sentence
    source:
