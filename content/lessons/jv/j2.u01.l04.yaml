schema: kabar.lesson/v1
id: j2.u01.l04
language: jv
title: Mbarep lan ragil
can_do:
  ar_eg: 'تتكلم عن العيلة الكبيرة: الكبير وآخر العنقود، القرايب، الجيران، والبيبي الجديد.'
  ar: 'أن تتحدّث عن العائلة الممتدّة: البكر وآخر العنقود، والأقارب، والجيران، والمولود الجديد.'
  en: 'Talk about the wider family: eldest and youngest, relatives, neighbours and the new baby.'
slides:
  - title: Kulawarga gedhe
    body:
      ar_eg: |
        mbarep = الابن الكبير (البكري)، ragil = آخر العنقود: Sari anak mbarep, Bayu anak ragil.
        sedulur = قريب من العيلة (وكمان أخ أو أخت). ponakan = ابن أو بنت الأخ أو الأخت.
        tangga = جار (مش «سلّم» زي الإندونيسي!).
        rabi = يتجوز، متجوز: Mbakyuku wis rabi. bayi = بيبي، lair = يتولد.
      ar: |
        mbarep = الابن البكر، ragil = آخر العنقود: Sari anak mbarep, Bayu anak ragil.
        sedulur = قريب (وأيضًا أخ أو أخت). ponakan = ابن الأخ أو الأخت أو بنتهما.
        tangga = جار (لا «سُلّم» كما في الإندونيسية!).
        rabi = يتزوّج، متزوّج: Mbakyuku wis rabi. bayi = رضيع، lair = يولد.
      en: |
        mbarep = eldest child, ragil = youngest child: Sari anak mbarep, Bayu anak ragil.
        sedulur = relative (also brother or sister). ponakan = niece or nephew.
        tangga = neighbour (not "stairs" as in Indonesian!).
        rabi = marry, married: Mbakyuku wis rabi. bayi = baby, lair = be born.
    examples:
      - text: Sari anak mbarep, Bayu anak ragil.
        ar_eg: ساري الكبيرة، وبايو آخر العنقود.
        ar: ساري هي البكر، وبايو آخر العنقود.
        en: Sari is the eldest, Bayu the youngest.
      - text: Ponakanku isih bayi.
        ar_eg: ابن أختي لسه بيبي.
        ar: ابن أختي ما زال رضيعًا.
        en: My nephew is still a baby.
      - text: Mbakyuku wis rabi.
        ar_eg: أختي الكبيرة اتجوزت.
        ar: تزوّجت أختي الكبرى.
        en: My big sister is married.
