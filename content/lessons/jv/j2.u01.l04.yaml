  - id: e03
    type: listen
    text: Sari anak mbarep, Bayu anak ragil.
    question:
      ar_eg: مين الكبير؟
      ar: من الأكبر؟
      en: Who is the eldest?
    options: [ساري الكبيرة وبايو الصغير, بايو الكبير وساري الصغيرة, ساري وبايو توأم]
    answer: 0
    meaning:
      ar_eg: ساري الكبيرة، وبايو آخر العنقود.
      ar: ساري هي البكر، وبايو آخر العنقود.
      en: Sari is the eldest, Bayu the youngest.
    words: [mbarep, ragil]
  - id: e04
    type: fill_blank
    sentence: Mbakyuku wis ___, bojone wong Solo.
    meaning:
      ar_eg: أختي الكبيرة ___، وجوزها من سولو.
      ar: أختي الكبرى ___، وزوجها من سولو.
      en: My big sister is ___, her husband is from Solo.
    options: [rabi, lair, tangga]
    answers: [rabi]
    words: [rabi, lair, tangga]
  - id: e05
    type: multiple_choice
    question: Ponakanku isih bayi.
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [ابن أختي لسه بيبي, جاري لسه صغير, حفيدي لسه بيبي]
    answer: 0
    explain:
      ar_eg: ponakan = ابن الأخ أو الأخت، والحفيد = putu، والجار = tangga.
      ar: ponakan = ابن الأخ أو الأخت، أمّا الحفيد فـputu، والجار فـtangga.
      en: ponakan = niece or nephew; grandchild is putu, neighbour is tangga.
    words: [ponakan, bayi, tangga]
  - id: e06
    type: fill_blank
    sentence: Bayu ___ ing Madiun.
    meaning:
      ar_eg: بايو ___ في ماديون.
      ar: بايو ___ في ماديون.
      en: Bayu was ___ in Madiun.
    options: [lair, rabi, sedulur]
    answers: [lair]
    words: [lair, rabi, sedulur]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «جاري» بالجاوي؟
      ar: كيف تقول «جاري» بالجاوية؟
      en: '"My neighbour" in Javanese?'
    options: [tanggaku, sedulurku, ponakanku]
    answer: 0
    explain:
      ar_eg: tangga = جار. sedulur = قريب، ponakan = ابن الأخ.
      ar: tangga = جار. أمّا sedulur فقريب، وponakan فابن الأخ.
      en: tangga = neighbour. sedulur = relative, ponakan = nephew.
    words: [tangga, sedulur, ponakan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا الابن الكبير، وأخويا الصغير آخر العنقود.
      ar: أنا البكر، وأخي الأصغر آخر العنقود.
      en: I'm the eldest, my little brother is the youngest.
    answer: Aku anak mbarep, adhiku ragil.
    distractors: [bayi, tangga]
    words: [mbarep, ragil, bayi, tangga]
  - id: e09
    type: translate
    direction: from_target
    source_text: Sedulurku manggon ing Madiun.
    answers_meaning:
      ar_eg: [قرايبي ساكنين في ماديون, قريبي ساكن في ماديون]
      ar: [أقاربي يسكنون في ماديون, قريبي يسكن في ماديون]
      en: [My relatives live in Madiun, My relative lives in Madiun]
