  - id: e10
    type: speaking
    text: Ponakanku lair ing Kairo.
    meaning:
      ar_eg: ابن أختي اتولد في القاهرة.
      ar: وُلد ابن أختي في القاهرة.
      en: My nephew was born in Cairo.
    words: [ponakan, lair]
dialogue:
  lines:
    - speaker: Bu Rahayu
      text: Mas Mohamed, iki foto kulawargaku. Sari anak mbarep.
      ar_eg: يا ماس محمد، دي صورة عيلتي. ساري بنتي الكبيرة.
      ar: يا ماس محمد، هذه صورة عائلتي. ساري ابنتي البكر.
      en: Mas Mohamed, here's my family photo. Sari is the eldest.
    - speaker: Mohamed
      text: Bayu ragil, Bu?
      ar_eg: وبايو آخر العنقود يا طنط؟
      ar: وبايو آخر العنقود يا سيّدتي؟
      en: And Bayu's the youngest, Bu?
    - speaker: Bu Rahayu
      text: Iya. Lha iki ponakanku, isih bayi. Lair neng Solo.
      ar_eg: أيوه. ودي بنت أختي، لسه بيبي. اتولدت في سولو.
      ar: نعم. وهذه ابنة أختي، ما زالت رضيعة. وُلدت في سولو.
      en: Yes. And this is my niece, still a baby. Born in Solo.
    - speaker: Mohamed
      text: Mbakyune Ibu rabi karo wong Solo?
      ar_eg: أخت حضرتك الكبيرة متجوزة واحد من سولو؟
      ar: هل أختك الكبرى متزوّجة من رجل من سولو؟
      en: Your big sister married someone from Solo?
    - speaker: Bu Rahayu
      text: Iya. Sedulurku akeh neng Solo, tanggane ya sedulur, hehe.
      ar_eg: أيوه. قرايبي كتير في سولو، وجيرانهم كمان قرايب، هههه.
      ar: نعم. لي أقارب كثيرون في سولو، وحتى جيرانهم أقارب، هههه.
      en: Yes. I've lots of relatives in Solo, even the neighbours are family, hehe.
