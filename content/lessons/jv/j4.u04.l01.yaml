schema: kabar.lesson/v1
id: j4.u04.l01
language: jv
title: Kula nuwun, mangga
can_do:
  ar_eg: توصل باب حد، تدخل، وتسلّم على أصحاب البيت.
  ar: أن تصل إلى باب بيت، فتدخل وتحيّي أهله.
  en: Arrive at a door, come in and greet your hosts.
slides:
  - title: Kula nuwun! — Mangga!
    body:
      ar_eg: |
        في جاوة مش بتخبط على الباب ولا بترن الجرس. بتنادي: «Kula nuwun!» زي «يا أهل الدار!» أو «السلام عليكم» على الباب.
        وصاحب البيت يرد: «Mangga!» = اتفضل (وفي الشات monggo). وخد بالك: mangga بالجاوي مش المانجا! المانجا pelem.
        وبعدها: «Mangga pinarak» = اتفضل ادخل واقعد معانا. pinarak هي krama inggil لـ mampir (يعدّي على حد)، وبيقولها المضيف للضيف المحترم.
      ar: |
        لا يطرق الجاويون الباب ولا يقرعون الجرس، بل ينادون: «Kula nuwun!» كقولنا «يا أهل الدار!» أو «السلام عليكم» عند الباب.
        ويجيب صاحب البيت: «Mangga!» = تفضّل (وفي الدردشة monggo)، وليست المانجو؛ فالمانجو بالجاوية pelem.
        ثم: «Mangga pinarak» = تفضّل بالدخول والجلوس، وpinarak هي krama inggil لـ mampir، يقولها المضيف للضيف الموقَّر.
      en: |
        In Java you don't knock or ring. You call out: "Kula nuwun!", like «يا أهل الدار!» or saying «السلام عليكم» at the door.
        The host answers: "Mangga!" = come in / go ahead (chat spelling monggo). Careful: Javanese mangga is not the fruit! Mango is pelem.
        Then: "Mangga pinarak" = please come in and sit with us. pinarak is the krama inggil of mampir (stop by), what a host says to an honoured guest.
    grammar: jv.etiquette.phrases
    examples:
      - text: Kula nuwun! — Mangga!
        ar_eg: يا أهل الدار! — اتفضل!
        ar: يا أهل الدار! — تفضّل!
        en: Hello, anyone home? — Come in!
      - text: Mangga pinarak, Mas.
        ar_eg: اتفضل ادخل يا ابني.
        ar: تفضّل بالدخول يا بني.
        en: Please come in.
  - title: Pangestunipun, sae
    body:
      ar_eg: |
        لو حد كبير سألك «Pripun kabaripun?» (إزيك؟)، فيه رد جميل جدًا: «Pangestunipun, sae» = بدعواتك، كويس. زي «بدعواتك، الحمد لله» عندنا بالظبط.
        ولما حد يمشي: «Sugeng tindak» أو «Ngatos-atos» = خلّي بالك من نفسك. ngatos-atos هي كراما لـ ati-ati اللي عرفتها في J1.
      ar: |
        إذا سألك كبير «Pripun kabaripun?» فأجمل جواب: «Pangestunipun, sae» = بدعائكم، بخير، كقولنا «بدعواتك، الحمد لله».
        وعند الوداع: «Sugeng tindak» أو «Ngatos-atos» = انتبه لنفسك، وngatos-atos كراما لـ ati-ati (من J1).
      en: |
        If an elder asks "Pripun kabaripun?" (how are you?), there's a lovely reply: "Pangestunipun, sae" = thanks to your blessing, fine. Just like «بدعواتك، الحمد لله».
        When someone leaves: "Sugeng tindak" or "Ngatos-atos" = take care. ngatos-atos is the krama of ati-ati from J1.
    grammar: jv.etiquette.phrases
    examples:
      - text: Pripun kabaripun? — Pangestunipun, sae.
        ar_eg: إزي حضرتك؟ — بدعواتك، كويس.
        ar: كيف حالكم؟ — بخير بدعائكم.
        en: How are you? — Fine, thanks to your blessing.
      - text: Ngatos-atos, Mas.
        ar_eg: خلّي بالك من نفسك يا ابني.
        ar: انتبه لنفسك يا بني.
        en: Take care.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kula nuwun
        ar_eg: يا أهل الدار! (على الباب)
        ar: يا أهل الدار! (عند الباب)
        en: hello, anyone home? (at the door)
      - text: pinarak
        ar_eg: يدخل / يعدّي (للضيف المحترم)
        ar: يدخل / يمرّ (للضيف الموقَّر)
        en: come in, stop by (for an honoured guest)
      - text: pangestunipun
        ar_eg: بدعواتك
        ar: بدعائكم
        en: thanks to your blessing
      - text: ngatos-atos
        ar_eg: خلّي بالك من نفسك
        ar: انتبه لنفسك
        en: take care
    words: [kula nuwun, pinarak, pangestunipun, ngatos-atos]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: وصلت باب بيت Bu Ningsih. تنادي بإيه؟
      ar: وصلت إلى باب بيت Bu Ningsih. بمَ تنادي؟
      en: You arrive at Bu Ningsih's door. What do you call out?
    options: ['Mangga!', 'Kula nuwun!', 'Sugeng tindak!']
    answer: 1
    explain:
      ar_eg: الضيف يقول Kula nuwun، وصاحب البيت يرد Mangga.
      ar: يقول الضيف Kula nuwun، ويجيب صاحب البيت Mangga.
      en: The guest says Kula nuwun; the host answers Mangga.
    words: [kula nuwun]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: Bu Ningsih سألتك «Pripun kabaripun?». أنهي رد هو الألطف؟
      ar: سألتك Bu Ningsih «Pripun kabaripun?». أي جواب ألطف؟
      en: Bu Ningsih asks "Pripun kabaripun?". Which is the loveliest reply?
    options: ['Pangestunipun, sae, Bu.', 'Apik, Bu.', 'Sami-sami, Bu.']
    answer: 0
    explain:
      ar_eg: Pangestunipun, sae = بدعواتك، كويس. apik نغوكو، وsami-sami يعني «العفو».
      ar: Pangestunipun, sae = بخير بدعائكم، وapik نغوكو، وsami-sami = العفو.
      en: Pangestunipun, sae = fine, thanks to your blessing. apik is ngoko; sami-sami means "you're welcome".
    words: [pangestunipun]
  - id: e04
    type: listen
    text: Kula nuwun, Bu!
    options: ['Matur nuwun, Bu!', 'Nyuwun sewu, Bu!', 'Kula nuwun, Bu!']
    answer: 2
    meaning:
      ar_eg: يا أهل الدار! (يا حاجة!)
      ar: يا أهل الدار! (يا سيدتي!)
      en: Hello, anyone home? (ma'am!)
    words: [kula nuwun]
  - id: e05
    type: fill_blank
    sentence: Mangga ___, Bu.
    meaning:
      ar_eg: اتفضلي ادخلي يا هانم.
      ar: تفضّلي بالدخول يا سيدتي.
      en: Please come in, ma'am.
    options: [pinarak, mampir, sowan]
    answers: [pinarak]
    explain:
      ar_eg: للضيفة المحترمة pinarak (krama inggil). mampir نغوكو، وsowan زيارتك إنت بتواضع.
      ar: للضيفة الموقَّرة pinarak، وmampir نغوكو، وsowan لزيارتك أنت.
      en: For an honoured guest, pinarak (krama inggil). mampir is ngoko; sowan is your own humble visiting.
    words: [pinarak]
  - id: e06
    type: fill_blank
    sentence: Inggih, Mas. ___.
    meaning:
      ar_eg: (Bu Ningsih بتودّعك) ماشي يا ابني. خلّي بالك من نفسك.
      ar: (تودّعك Bu Ningsih) حسنًا يا بني. انتبه لنفسك.
      en: (Bu Ningsih sees you off) All right. Take care.
    options: [Ngatos-atos, Kula nuwun, Pangestunipun]
    answers: [Ngatos-atos]
    words: [ngatos-atos]
    explain:
      ar_eg: "صاحبة البيت بتودّعك: Ngatos-atos = خلّي بالك من نفسك. Kula nuwun لما توصل الباب، وPangestunipun رد على «إزيك»."
      ar: "صاحبة البيت تودّعك: Ngatos-atos = اعتنِ بنفسك، أما Kula nuwun فعند الوصول إلى الباب، وPangestunipun ردّ على «كيف حالك»."
      en: "The host sees you off: Ngatos-atos = take care. Kula nuwun is for arriving at the door, Pangestunipun answers \"how are you\"."
  - id: e07
    type: build_sentence
    source:
      ar_eg: اتفضلي ادخلي يا تيتة.
      ar: تفضّلي بالدخول يا جدتي.
      en: Please come in, Grandma.
    answer: Mangga pinarak, Mbah.
    distractors: [mampir, sowan]
    words: [pinarak]
    explain:
      ar_eg: تعزم حد يدخل يقعد = pinarak. mampir يعني تعدّي على حد، وsowan لما إنت اللي بتزور الكبير.
      ar: دعوة أحد للدخول والجلوس = pinarak، أما mampir فمعناه يعرّج على أحد، وsowan حين تزور أنت الكبير.
      en: Inviting someone in to sit is pinarak. mampir means "drop by", sowan is you calling on an elder.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (ردًا على «Pripun kabaripun?» من حد كبير) بدعواتك، كويس.
      ar: (جوابًا عن «Pripun kabaripun?» من كبير) بخير بدعائكم.
      en: (answering an elder's "Pripun kabaripun?") Fine, thanks to your blessing.
    answers: ['Pangestunipun, sae.', 'Pangestunipun, sae, Bu.', 'Pangestunipun, sae, Pak.', 'Pangestunipun, sae, Mbah.']
    words: [pangestunipun]
  - id: e09
    type: speaking
    text: Sugeng tindak, Bu. Ngatos-atos.
    meaning:
      ar_eg: توصلي بالسلامة يا هانم. خلّي بالك من نفسك.
      ar: في أمان الله يا سيدتي. انتبهي لنفسك.
      en: Safe journey, ma'am. Take care.
    words: [ngatos-atos, sugeng tindak]
dialogue:
  title: Wonten Kampung Taman
  lines:
    - speaker: Mohamed
      text: Kula nuwun!
      ar_eg: يا أهل الدار!
      ar: يا أهل الدار!
      en: Hello, anyone home?
    - speaker: Bu Ningsih
      text: Mangga! Oh, Mas Mohamed. Mangga pinarak.
      ar_eg: اتفضل! أهلًا يا محمد. اتفضل ادخل.
      ar: تفضّل! أهلًا يا محمد. تفضّل بالدخول.
      en: Come in! Oh, Mohamed. Please come in.
    - speaker: Mohamed
      text: Matur nuwun, Bu.
      ar_eg: شكرًا يا هانم.
      ar: شكرًا يا سيدتي.
      en: Thank you, ma'am.
    - speaker: Bu Ningsih
      text: Pripun kabaripun, Mas?
      ar_eg: إزيك يا ابني؟
      ar: كيف حالك يا بني؟
      en: How are you?
    - speaker: Mohamed
      text: Pangestunipun, sae, Bu.
      ar_eg: بدعواتك، كويس يا هانم.
      ar: بخير بدعائكِ يا سيدتي.
      en: Fine, thanks to your blessing, ma'am.
new_words:
  - word: kula nuwun
    pos: phrase
    ar_eg: يا أهل الدار! (بتقولها على الباب؛ الرد Mangga!)
    ar: يا أهل الدار! (تقال عند الباب، وجوابها Mangga!)
    en: hello, anyone home? (called at the door; reply Mangga!) = permisi
  - word: pinarak
    pos: verb
    ar_eg: يدخل / يعدّي ويقعد (krama inggil لـ mampir، للضيف)
    ar: يدخل / يمرّ ويجلس (krama inggil لـ mampir، للضيف)
    en: come in, stop by (krama inggil for mampir, said to a guest) = mampir, silakan masuk
  - word: pangestunipun
    pos: phrase
    ar_eg: بدعواتك (في «Pangestunipun, sae» = بدعواتك، كويس)
    ar: بدعائكم (في «Pangestunipun, sae» = بخير بدعائكم)
    en: thanks to your blessing (in "Pangestunipun, sae" = fine, thanks to your blessing) = berkat doa Anda
  - word: ngatos-atos
    pos: phrase
    ar_eg: خلّي بالك من نفسك (كراما لـ ati-ati)
    ar: انتبه لنفسك (كراما لـ ati-ati)
    en: take care (krama for ati-ati) = hati-hati
