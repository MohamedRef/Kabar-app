schema: kabar.lesson/v1
id: j3.u03.l01
language: jv
title: Sampun, dereng, badhe
can_do:
  ar_eg: تستخدم كلمات الزمن بالكراما (خلاص، لسه، هـ، لسه بـ).
  ar: أن تستعمل ألفاظ الزمن بالكراما.
  en: Use the krama aspect words.
slides:
  - title: Tembung-tembung cilik
    body:
      ar_eg: |
        أسهل باب للكراما: الكلمات الصغيرة اللي في كل جملة. في J1 اتعلمت wis، durung، arep، isih. كل واحدة ليها «توأم» كراما:
        - wis ← sampun (sudah)
        - durung ← dereng (belum)
        - arep ← badhe (akan / mau)
        - isih ← taksih (masih)
        زي لما بتقلب من المصري للفصحى: «هـ» ← «سوف»، «لسه» ← «لم بعد». نفس الجملة، كلمات أرقى.
      ar: |
        أيسر مدخل إلى الكراما الألفاظ الصغيرة المتكررة. تعلمتَ في J1 wis وdurung وarep وisih، ولكلٍّ منها نظير في الكراما:
        - wis ← sampun (sudah)
        - durung ← dereng (belum)
        - arep ← badhe (akan / mau)
        - isih ← taksih (masih)
        كالانتقال من العامية إلى الفصحى: «هـ» ← «سوف»، و«لسه» ← «لم بعد»: الجملة نفسها بألفاظ أرفع.
      en: |
        The easiest door into krama: the small words in every sentence. In J1 you learned wis, durung, arep, isih. Each has a krama twin:
        - wis → sampun (sudah)
        - durung → dereng (belum)
        - arep → badhe (akan / mau)
        - isih → taksih (masih)
        Like switching from Egyptian to Fusha: «هـ» → «سوف», «لسه» → «لم بعد». Same sentence, higher words.
    grammar: jv.krama.function-words
  - title: Sampun lan dereng
    body:
      ar_eg: |
        sampun = sudah، ودي كمان الرد «آه، خلاص». dereng = belum = «لسه».
        في الشات: sampun بتتكتب كتير mpun أو pun.
        السؤال والرد: Sampeyan sampun nedha? — Sampun. / Dereng.
        nate (tau) = سبق وعملت: «Sampun nate dhateng Jogja?» = رحت جوجا قبل كده؟ — «Dereng nate» = عمري ما رحت.
      ar: |
        sampun = sudah، وهي أيضًا جواب «نعم، قد فعلت». وdereng = belum = «ليس بعد».
        وفي الدردشة تُكتب sampun كثيرًا mpun أو pun.
        سؤال وجواب: Sampeyan sampun nedha? — Sampun. / Dereng.
        nate (tau) = سبق أن: «Sampun nate dhateng Jogja?» = هل سبق أن زرت جوكجاكرتا؟ — «Dereng nate» = لم يسبق لي.
      en: |
        sampun = sudah, and also the answer "yes, already". dereng = belum = "not yet".
        In chats sampun is often typed mpun or pun.
        Question and answer: Sampeyan sampun nedha? — Sampun. / Dereng.
        nate (tau) = ever: "Sampun nate dhateng Jogja?" = have you ever been to Jogja? — "Dereng nate" = never yet.
    grammar: jv.krama.function-words
    examples:
      - text: Sampeyan sampun nedha? — Dereng.
        ar_eg: حضرتك كلت؟ — لسه.
        ar: هل أكلتَ؟ — ليس بعد.
        en: Have you eaten? — Not yet.
      - text: Kula dereng nedha.
        ar_eg: أنا لسه ماكلتش.
        ar: لم آكل بعد.
        en: I haven't eaten yet.
  - title: Badhe lan dhateng
    body:
      ar_eg: |
        badhe = arep = akan / mau. معاها كلمتين مفيدين للحركة:
        - neng ← dhateng (ke) = «لـ / على». في الكلام بيتقال teng.
        - pasar ← peken (pasar) = السوق.
        Aku arep neng pasar ← Kula badhe dhateng peken. كل كلمة اتغيرت!
      ar: |
        badhe = arep = akan / mau، ومعها لفظان مفيدان للحركة:
        - neng ← dhateng (ke) = «إلى»، وفي الكلام teng.
        - pasar ← peken (pasar) = السوق.
        Aku arep neng pasar ← Kula badhe dhateng peken، وقد تغيرت كل كلمة.
      en: |
        badhe = arep = akan / mau. Two useful words for moving around come with it:
        - neng → dhateng (ke) = to; spoken teng.
        - pasar → peken (pasar) = market.
        Aku arep neng pasar → Kula badhe dhateng peken. Every word changed!
    grammar: jv.krama.function-words
    examples:
      - text: Kula badhe dhateng peken.
        ar_eg: أنا رايح السوق.
        ar: سأذهب إلى السوق.
        en: I'm going to the market.
      - text: Kula badhe dhateng Kauman.
        ar_eg: أنا رايح كاومان.
        ar: سأذهب إلى كاومان.
        en: I'm going to Kauman.
  - title: Taksih
    body:
      ar_eg: |
        taksih = isih = masih = «لسه» بمعنى «لسه بيعمل كذا». خد بالك من الفرق:
        - dereng = لسه ما حصلش (belum)
        - taksih = لسه مستمر (masih)
        Kula taksih sinau = أنا لسه بتعلم.
        في الشارع: dhateng (لـ) بتتقال teng أو ten: «Badhe teng peken?» = رايح السوق؟ ومع الناس اللي تعرفهم بنشيل sampeyan: «Sampun nedha, Mas?». وmenapa-menapa ← napa-napa، وingkang ← sing.
      ar: |
        taksih = isih = masih = «ما زال». وتنبّه للفرق:
        - dereng = لم يحدث بعد (belum)
        - taksih = ما زال مستمرًا (masih)
        Kula taksih sinau = ما زلتُ أتعلم.
        في الشارع: تُقال dhateng (إلى) teng أو ten: «Badhe teng peken?» = ذاهب إلى السوق؟ ومع المعارف يُحذف sampeyan: «Sampun nedha, Mas?». وmenapa-menapa ← napa-napa، وingkang ← sing.
      en: |
        taksih = isih = masih = still. Mind the difference:
        - dereng = hasn't happened yet (belum)
        - taksih = still going on (masih)
        Kula taksih sinau = I'm still learning.
        On the street: dhateng (to) is said teng or ten: «Badhe teng peken?» = off to the market? With people you know, sampeyan drops out: «Sampun nedha, Mas?». menapa-menapa → napa-napa, ingkang → sing.
    grammar: jv.krama.function-words
    examples:
      - text: Inggih, kula taksih sinau.
        ar_eg: أيوه، أنا لسه بتعلم.
        ar: نعم، ما زلتُ أتعلم.
        en: Yes, I'm still learning.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sampun
        ar_eg: خلاص (wis) = sudah
        ar: قد (wis) = sudah
        en: already (wis) = sudah
      - text: peken
        ar_eg: السوق (pasar)
        ar: السوق (pasar)
        en: market (pasar)
      - text: badhe
        ar_eg: هـ / عايز (arep) = akan
        ar: سوف (arep) = akan
        en: will, going to (arep) = akan
      - text: taksih
        ar_eg: لسه بـ (isih) = masih
        ar: ما زال (isih) = masih
        en: still (isih) = masih
      - text: dhateng
        ar_eg: لـ / على (neng) = ke
        ar: إلى (neng) = ke
        en: to (neng) = ke
      - text: nate
        ar_eg: سبق وعمل (tau) = pernah
        ar: سبق أن (tau) = pernah
        en: ever (tau) = pernah
    words: [sampun, peken, badhe, taksih, dhateng, nate]
  - id: e02
    type: multiple_choice
    question: arep
    question_meaning:
      ar_eg: إيه الكراما بتاعة arep؟
      ar: ما نظير arep في الكراما؟
      en: What's the krama for arep?
    options: [sampun, taksih, badhe]
    answer: 2
    words: [badhe]
  - id: e03
    type: listen
    text: Kula badhe dhateng peken.
    options: [Kula badhe dhateng peken., Kula sampun dhateng peken., Aku arep neng pasar.]
    answer: 0
    words: [badhe, dhateng, peken]
  - id: e04
    type: fill_blank
    sentence: Kula ___ sinau krama.
    meaning:
      ar_eg: أنا لسه بتعلم كراما.
      ar: ما زلتُ أتعلم الكراما.
      en: I'm still learning krama.
    options: [isih, dereng, taksih]
    answers: [taksih]
    explain:
      ar_eg: «لسه بتعلم» = masih = taksih. isih هي الـ ngoko.
      ar: «ما زلت أتعلم» = masih = taksih، وisih من الـ ngoko.
      en: '"Still learning" = masih = taksih; isih is the ngoko form.'
    words: [taksih]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا رايح كاومان. (بالكراما)
      ar: سأذهب إلى كاومان. (بالكراما)
      en: I'm going to Kauman. (krama)
    answer: Kula badhe dhateng Kauman.
    distractors: [arep, neng]
    words: [kula, badhe, dhateng]
  - id: e06
    type: listen
    text: Kula dereng nate dhateng Kauman.
    options: [Kula dereng nate dhateng Kauman., Kula sampun nate dhateng Kauman., Kula dereng dhateng Kauman.]
    answer: 0
    words: [nate, dereng, dhateng]
  - id: e07
    type: speaking
    text: Kula badhe dhateng peken.
    meaning:
      ar_eg: أنا رايح السوق.
      ar: سأذهب إلى السوق.
      en: I'm going to the market.
    words: [badhe, dhateng, peken]
  - id: e08
    type: multiple_choice
    question: pernah
    question_meaning:
      ar_eg: إيه الكلمة الجاوية (كراما) لـ pernah الإندونيسي؟
      ar: ما مقابل pernah الإندونيسية بالكراما الجاوية؟
      en: What's the krama for Indonesian pernah (ever)?
    options: [nate, sampun, peken]
    answer: 0
    explain:
      ar_eg: pernah = nate بالكراما (سبق وعمل). sampun = خلاص، وpeken = السوق.
      ar: pernah = nate بالكراما (سبق أن)، وsampun = قد، وpeken = السوق.
      en: pernah = nate in krama (ever); sampun = already, peken = market.
    words: [nate, sampun]
dialogue:
  title: Ing Kauman
  lines:
    - speaker: Mohamed
      text: "Sugeng enjing, Bu Siti. Badhe teng peken?"
      ar_eg: "صباح الخير يا طنط سيتي. رايحة السوق؟"
      ar: "صباح الخير يا سيدة سيتي. ذاهبة إلى السوق؟"
      en: "Morning, Bu Siti. Off to the market?"
    - speaker: Bu Siti
      text: "Nggih, Mas. Badhe teng Pasar Kranggan."
      ar_eg: "أيوه يا أستاذ. رايحة Pasar Kranggan."
      ar: "نعم. ذاهبة إلى Pasar Kranggan."
      en: "Yes. Off to Pasar Kranggan."
    - speaker: Bu Siti
      text: "Sampun nedha, Mas?"
      ar_eg: "كلت يا أستاذ؟"
      ar: "هل أكلتَ؟"
      en: "Eaten yet?"
    - speaker: Mohamed
      text: Dereng, Bu. Kula taksih sinau krama.
      ar_eg: لسه يا مدام. أنا لسه بتعلم كراما.
      ar: ليس بعد يا سيدتي. ما زلتُ أتعلم الكراما.
      en: Not yet, ma'am. I'm still studying krama.
    - speaker: Bu Siti
      text: "Wah, sae! Mangga, Mas."
      ar_eg: "الله، حلو! اتفضل يا أستاذ."
      ar: "رائع! تفضّل."
      en: "Oh, good! Off you go, then."
    - speaker: Mohamed
      text: Matur nuwun, Bu.
      ar_eg: شكرًا يا مدام.
      ar: شكرًا يا سيدتي.
      en: Thank you, ma'am.
new_words:
  - word: nate
    pos: adverb
    ar_eg: سبق وعمل (كراما من tau)
    ar: سبق أن (كراما من tau)
    en: ever, krama (ngoko tau, Indonesian pernah)
  - word: taksih
    pos: adverb
    ar_eg: لسه بـ / مازال (krama لـ isih) = masih
    ar: ما زال (krama لـ isih) = masih
    en: still (krama for isih) = masih
  - word: peken
    pos: noun
    ar_eg: السوق (krama لـ pasar)
    ar: السوق (krama لـ pasar)
    en: market (krama for pasar)
review:
  status: draft
  verified: false
