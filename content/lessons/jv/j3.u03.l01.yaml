dialogue:
  title: Ing Kauman
  lines:
    - speaker: Mohamed
      text: Sugeng enjing, Bu Siti. Sampéyan badhé dhateng peken?
      ar_eg: صباح الخير يا Bu Siti. حضرتك رايحة السوق؟
      ar: صباح الخير يا Bu Siti. هل أنتِ ذاهبة إلى السوق؟
      en: Good morning, Bu Siti. Are you going to the market?
    - speaker: Bu Siti
      text: Inggih, Mas. Kula badhé dhateng Pasar Gede.
      ar_eg: أيوه يا أستاذ. أنا رايحة Pasar Gede.
      ar: نعم يا أخي. سأذهب إلى Pasar Gede.
      en: Yes. I'm going to Pasar Gede.
    - speaker: Bu Siti
      text: Sampéyan sampun nedha?
      ar_eg: حضرتك كلت؟
      ar: هل أكلتَ؟
      en: Have you eaten?
    - speaker: Mohamed
      text: Dèrèng, Bu. Kula taksih sinau krama.
      ar_eg: لسه يا مدام. أنا لسه بتعلم كراما.
      ar: ليس بعد يا سيدتي. ما زلتُ أتعلم الكراما.
      en: Not yet, ma'am. I'm still studying krama.
    - speaker: Bu Siti
      text: Wah, saé! Mangga, Mas.
      ar_eg: الله، كويس! اتفضل يا أستاذ.
      ar: رائع! تفضّل يا أخي.
      en: Oh, good! Off you go, then.
    - speaker: Mohamed
      text: Matur nuwun, Bu.
      ar_eg: شكرًا يا مدام.
      ar: شكرًا يا سيدتي.
      en: Thank you, ma'am.
new_words:
  - word: badhé
    pos: adverb
    ar_eg: هـ / ناوي (krama لـ arep، chat badhe) = akan, mau
    ar: سوف (krama لـ arep) = akan, mau
    en: will, going to (krama for arep; chat badhe) = akan, mau
  - word: taksih
    pos: adverb
    ar_eg: لسه بـ / مازال (krama لـ isih) = masih
    ar: ما زال (krama لـ isih) = masih
    en: still (krama for isih) = masih
  - word: dhateng
    pos: preposition
    ar_eg: لـ / على (krama لـ nang، في الكلام teng) = ke
    ar: إلى (krama لـ nang، وفي الكلام teng) = ke
    en: to (krama for nang; spoken teng) = ke
  - word: peken
    pos: noun
    ar_eg: السوق (krama لـ pasar)
    ar: السوق (krama لـ pasar)
    en: market (krama for pasar)
  - word: saé
    pos: adjective
    ar_eg: كويس / حلو (krama لـ apik)
    ar: حسن / جيد (krama لـ apik)
    en: good, nice (krama for apik)
