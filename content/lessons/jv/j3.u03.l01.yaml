schema: kabar.lesson/v1
id: j3.u03.l01
language: jv
title: Sampun, dèrèng, badhé
can_do:
  ar_eg: تستخدم كلمات الزمن بالكراما (خلاص، لسه، هـ، لسه بـ).
  ar: أن تستعمل ألفاظ الزمن بالكراما.
  en: Use the krama aspect words.
slides:
  - title: Tembung-tembung cilik
    body:
      ar_eg: |
        أسهل باب للكراما: الكلمات الصغيرة اللي في كل جملة. في J1 اتعلمت wis، durung، arep، isih. كل واحدة ليها «توأم» كراما:
        - wis ← sampun (sudah)
        - durung ← dèrèng (belum)
        - arep ← badhé (akan / mau)
        - isih ← taksih (masih)
        زي لما بتقلب من المصري للفصحى: «هـ» ← «سوف»، «لسه» ← «لم بعد». نفس الجملة، كلمات أرقى.
      ar: |
        أيسر مدخل إلى الكراما الألفاظ الصغيرة المتكررة. تعلمتَ في J1 wis وdurung وarep وisih، ولكلٍّ منها نظير في الكراما:
        - wis ← sampun (sudah)
        - durung ← dèrèng (belum)
        - arep ← badhé (akan / mau)
        - isih ← taksih (masih)
        كالانتقال من العامية إلى الفصحى: «هـ» ← «سوف»، و«لسه» ← «لم بعد»: الجملة نفسها بألفاظ أرفع.
      en: |
        The easiest door into krama: the small words in every sentence. In J1 you learned wis, durung, arep, isih. Each has a krama twin:
        - wis → sampun (sudah)
        - durung → dèrèng (belum)
        - arep → badhé (akan / mau)
        - isih → taksih (masih)
        Like switching from Egyptian to Fusha: «هـ» → «سوف», «لسه» → «لم بعد». Same sentence, higher words.
    grammar: jv.krama.function-words
  - title: Sampun lan dèrèng
    body:
      ar_eg: |
        sampun = sudah، ودي كمان الرد «آه، خلاص». dèrèng = belum = «لسه».
        في الشات: sampun بتتكتب كتير mpun أو pun، وdèrèng بتتكتب dereng.
        السؤال والرد: Sampéyan sampun nedha? — Sampun. / Dèrèng.
      ar: |
        sampun = sudah، وهي أيضًا جواب «نعم، قد فعلت». وdèrèng = belum = «ليس بعد».
        وفي الدردشة تُكتب sampun كثيرًا mpun أو pun، وتُكتب dèrèng هكذا: dereng.
        سؤال وجواب: Sampéyan sampun nedha? — Sampun. / Dèrèng.
      en: |
        sampun = sudah, and also the answer "yes, already". dèrèng = belum = "not yet".
        In chats sampun is often typed mpun or pun, and dèrèng is typed dereng.
        Question and answer: Sampéyan sampun nedha? — Sampun. / Dèrèng.
    grammar: jv.krama.function-words
    examples:
      - text: Sampéyan sampun nedha? — Dèrèng.
        ar_eg: حضرتك كلت؟ — لسه.
        ar: هل أكلتَ؟ — ليس بعد.
        en: Have you eaten? — Not yet.
      - text: Kula dèrèng nedha.
        ar_eg: أنا لسه ماكلتش.
        ar: لم آكل بعد.
        en: I haven't eaten yet.
  - title: Badhé lan dhateng
    body:
      ar_eg: |
        badhé = arep = akan / mau. معاها كلمتين مفيدين للحركة:
        - nang ← dhateng (ke) = «لـ / على». في الكلام بيتقال teng.
        - pasar ← peken (pasar) = السوق.
        Aku arep nang pasar ← Kula badhé dhateng peken. كل كلمة اتغيرت!
      ar: |
        badhé = arep = akan / mau، ومعها لفظان مفيدان للحركة:
        - nang ← dhateng (ke) = «إلى»، وفي الكلام teng.
        - pasar ← peken (pasar) = السوق.
        Aku arep nang pasar ← Kula badhé dhateng peken، وقد تغيرت كل كلمة.
      en: |
        badhé = arep = akan / mau. Two useful words for moving around come with it:
        - nang → dhateng (ke) = to; spoken teng.
        - pasar → peken (pasar) = market.
        Aku arep nang pasar → Kula badhé dhateng peken. Every word changed!
    grammar: jv.krama.function-words
    examples:
      - text: Kula badhé dhateng peken.
        ar_eg: أنا رايح السوق.
        ar: سأذهب إلى السوق.
        en: I'm going to the market.
      - text: Kula badhé dhateng Kauman.
        ar_eg: أنا رايح كاومان.
        ar: سأذهب إلى كاومان.
        en: I'm going to Kauman.
  - title: Taksih
    body:
      ar_eg: |
        taksih = isih = masih = «لسه» بمعنى «لسه بيعمل كذا». خد بالك من الفرق:
        - dèrèng = لسه ما حصلش (belum)
        - taksih = لسه مستمر (masih)
        Kula taksih sinau = أنا لسه بتعلم.
      ar: |
        taksih = isih = masih = «ما زال». وتنبّه للفرق:
        - dèrèng = لم يحدث بعد (belum)
        - taksih = ما زال مستمرًا (masih)
        Kula taksih sinau = ما زلتُ أتعلم.
      en: |
        taksih = isih = masih = still. Mind the difference:
        - dèrèng = hasn't happened yet (belum)
        - taksih = still going on (masih)
        Kula taksih sinau = I'm still learning.
    grammar: jv.krama.function-words
    examples:
      - text: Inggih, kula taksih sinau.
        ar_eg: أيوه، أنا لسه بتعلم.
        ar: نعم، ما زلتُ أتعلم.
        en: Yes, I'm still learning.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sampun
        ar_eg: خلاص (wis) = sudah
        ar: قد (wis) = sudah
        en: already (wis) = sudah
      - text: dèrèng
        ar_eg: لسه ما (durung) = belum
        ar: لم بعد (durung) = belum
        en: not yet (durung) = belum
      - text: badhé
        ar_eg: هـ / عايز (arep) = akan
        ar: سوف (arep) = akan
        en: will, going to (arep) = akan
      - text: taksih
        ar_eg: لسه بـ (isih) = masih
        ar: ما زال (isih) = masih
        en: still (isih) = masih
      - text: dhateng
        ar_eg: لـ / على (nang) = ke
        ar: إلى (nang) = ke
        en: to (nang) = ke
    words: [sampun, dèrèng, badhé, taksih, dhateng]
  - id: e02
    type: multiple_choice
    question: arep
    question_meaning:
      ar_eg: إيه الكراما بتاعة arep؟
      ar: ما نظير arep في الكراما؟
      en: What's the krama for arep?
    options: ["sampun", "taksih", "badhé"]
    answer: 2
    words: [badhé]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: Bu Siti سألتك «Sampéyan sampun nedha?» وإنت لسه ماكلتش. ترد بإيه؟
      ar: سألتك Bu Siti «Sampéyan sampun nedha?» ولم تأكل بعد. بمَ تجيب؟
      en: Bu Siti asks "Sampéyan sampun nedha?" and you haven't eaten yet. Your answer?
    options: ["Taksih, Bu.", "Durung, Bu.", "Dèrèng, Bu."]
    answer: 2
    explain:
      ar_eg: "سؤال كراما ← رد كراما: dèrèng. taksih معناها «لسه مستمر» مش «لسه ما حصلش»."
      ar: السؤال بالكراما فالجواب dèrèng، أما taksih فمعناها «ما زال».
      en: A krama question gets a krama answer — dèrèng. Taksih means "still", not "not yet".
    words: [dèrèng]
  - id: e04
    type: listen
    text: Kula badhé dhateng peken.
    options: ["Kula badhé dhateng peken.", "Kula sampun dhateng peken.", "Aku arep nang pasar."]
    answer: 0
    words: [badhé, dhateng, peken]
  - id: e05
    type: fill_blank
    sentence: Kula ___ sinau krama.
    meaning:
      ar_eg: أنا لسه بتعلم كراما.
      ar: ما زلتُ أتعلم الكراما.
      en: I'm still learning krama.
    options: ["isih", "dèrèng", "taksih"]
    answers: [taksih]
    explain:
      ar_eg: «لسه بتعلم» = masih = taksih. isih هي الـ ngoko.
      ar: «ما زلت أتعلم» = masih = taksih، وisih من الـ ngoko.
      en: '"Still learning" = masih = taksih; isih is the ngoko form.'
    words: [taksih]
  - id: e06
    type: fill_blank
    sentence: Kula badhé ___ peken.
    meaning:
      ar_eg: أنا رايح السوق.
      ar: سأذهب إلى السوق.
      en: I'm going to the market.
    options: ["dhateng", "nang", "saking"]
    answers: [dhateng]
    explain:
      ar_eg: «لـ» بالكراما dhateng. saking = «من».
      ar: «إلى» بالكراما dhateng، وsaking = «من».
      en: '"To" in krama is dhateng; saking = from.'
