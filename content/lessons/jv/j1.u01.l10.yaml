schema: kabar.lesson/v1
id: j1.u01.l10
language: jv
title: Ulangan J1.1
can_do:
  ar_eg: تسلّم على تلات أشخاص مختلفين.
  ar: أن تحيّي ثلاثة أشخاص مختلفين.
  en: Greet three different people.
slides:
  - title: Sapa karo sapa?
    body:
      ar_eg: |
        مراجعة سريعة: مين بنكلمه إزاي؟
        - صاحبك: Piye kabare? / Kowe piye? — وفي الشارع: Piye, cah?
        - حد أكبر أو مش عارفه: Sugeng enjing / siang / sonten / dalu + Pak / Bu، وsampeyan بدل kowe، وmatur nuwun.
        - حد من العيلة الكبار: Pakdhe / Budhe (أو Dhe).
        - حد أصغر منك: Dhik. والشلة: cah في آخر الجملة. Ayo, cah!
      ar: |
        مراجعة سريعة: من نخاطب وكيف؟
        - الصديق: Piye kabare? / Kowe piye? — وفي الشارع: Piye, cah?
        - الأكبر سنًّا أو الغريب: Sugeng enjing / siang / sonten / dalu مع Pak / Bu، وsampeyan بدل kowe، وmatur nuwun.
        - كبار العائلة: Pakdhe / Budhe (أو Dhe).
        - الأصغر سنًّا: Dhik، والجماعة: cah في آخر الجملة: Ayo, cah!
      en: |
        Quick review: who gets what?
        - A friend: Piye kabare? / Kowe piye? — on the street: Piye, cah?
        - Someone older or a stranger: Sugeng enjing / siang / sonten / dalu + Pak / Bu, sampeyan instead of kowe, and matur nuwun.
        - Older relatives: Pakdhe / Budhe (or Dhe).
        - Someone younger: Dhik. Your mates: cah at the end. Ayo, cah!
    grammar: jv.address.terms
    examples:
      - text: Kowe piye?
        ar_eg: وإنت؟ (لصاحبك، ngoko)
        ar: وأنت؟ (لصديقك، ngoko)
        en: And you? (to a friend, ngoko)
      - text: Sampeyan piye, Bu?
        ar_eg: وحضرتك يا مدام؟
        ar: وأنتِ يا سيدتي؟
        en: And you, ma'am?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Sugeng enjing
        ar_eg: صباح الخير
        ar: صباح الخير
        en: Good morning
      - text: Sugeng dalu
        ar_eg: تصبح على خير / مساء الخير
        ar: تصبح على خير / مساء الخير
        en: Good night / good evening
      - text: Matur nuwun
        ar_eg: شكرًا
        ar: شكرًا
        en: Thank you
      - text: Padha-padha
        ar_eg: العفو
        ar: عفوًا
        en: You're welcome
      - text: Ati-ati
        ar_eg: خلي بالك
        ar: انتبه
        en: Take care
      - text: lumayan
        ar_eg: ماشي الحال
        ar: لا بأس
        en: not bad, so-so
    words: [sugeng enjing, sugeng dalu, matur nuwun, padha-padha, ati-ati, lumayan]
  - id: e02
    type: match_pairs
    pairs:
      - text: aku
        ar_eg: أنا
        ar: أنا
        en: I
      - text: sampeyan
        ar_eg: حضرتك
        ar: حضرتك
        en: you (polite)
      - text: dheweke
        ar_eg: هو / هي
        ar: هو / هي
        en: he / she
      - text: ketemu
        ar_eg: يقابل
        ar: يلتقي
        en: meet
      - text: mangan
        ar_eg: ياكل
        ar: يأكل
        en: eat
      - text: ngenteni
        ar_eg: يستنى
        ar: ينتظر
        en: wait for
    words: [aku, sampeyan, dheweke, ketemu, mangan, ngenteni]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الساعة ٤ العصر، وقابلت أم صاحبك. تقولها إيه؟
      ar: الساعة الرابعة عصرًا، وقابلت والدة صديقك. ماذا تقول لها؟
      en: It's 4 p.m. and you meet your friend's mother. What do you say?
    options: ['Sugeng sonten, Bu.', 'Ayo, cah!', 'Kowe piye?']
    answer: 0
    explain:
      ar_eg: ٤ العصر = sonten، وsugeng مؤدبة. cah وkowe للصحاب بس.
      ar: الرابعة عصرًا وقت sonten، وsugeng مهذبة، أما cah وkowe فللأقران.
      en: 4 p.m. is sonten and sugeng is polite; cah and kowe are for mates only.
    words: [sugeng sonten]
  - id: e04
    type: multiple_choice
    question: Aku pamit dhisik, Mas.
    question_meaning:
      ar_eg: هو بيعمل إيه؟
      ar: ماذا يفعل؟
      en: What is he doing?
    options: [بيسلّم, بيستأذن ويمشي, بيسأل عن الأخبار]
    answer: 1
    explain:
      ar_eg: pamit = يستأذن ويمشي، وdhisik = الأول.
      ar: pamit = يستأذن في الانصراف، وdhisik = أوّلًا.
      en: pamit = take your leave, dhisik = first.
    words: [pamit, dhisik]
  - id: e05
    type: listen
    text: Sugeng dalu, Pakdhe.
    options: ['Sugeng dalu, Budhe.', 'Sugeng enjing, Pakdhe.', 'Sugeng dalu, Pakdhe.']
    answer: 2
    words: [sugeng dalu, pakdhe]
  - id: e06
    type: listen
    text: Aku luwe lan ngantuk, Mas.
    question:
      ar_eg: هو حاسس بإيه؟
      ar: بماذا يشعر؟
      en: How does he feel?
    options: [جعان ونعسان, عطشان ومكسوف, بصحة كويسة]
    answer: 0
    meaning:
      ar_eg: أنا جعان ونعسان يا ماس.
      ar: أنا جائع ونعسان يا ماس.
      en: I'm hungry and sleepy, Mas.
    words: [luwe, ngantuk]
  - id: e07
    type: fill_blank
    sentence: Matur nuwun, Mas. — ___.
    meaning:
      ar_eg: شكرًا يا كابتن. — العفو.
      ar: شكرًا يا أخي. — عفوًا.
      en: Thank you, Mas. — You're welcome.
    options: [Ati-ati, Padha-padha, Sugeng enjing]
    answers: [Padha-padha]
    words: [padha-padha]
  - id: e08
    type: fill_blank
    sentence: Esuk sepi, bengi ___.
    meaning:
      ar_eg: الصبح هادي، وبالليل ___.
      ar: الصباح هادئ، والليل ___.
      en: Quiet in the morning, ___ at night.
    options: [rame, isin, kenal]
    answers: [rame]
    words: [rame, sepi, isin, kenal]
  - id: e09
    type: build_sentence
    source:
      ar_eg: أنا كويس، شكرًا. وإنت؟
      ar: أنا بخير، شكرًا. وأنت؟
      en: I'm fine, thanks. How about you?
    answer: Aku apik, suwun. Kowe piye?
    distractors: [saya, dalu]
    words: [aku, apik, suwun, kowe, piye]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إزيك يا آنسة؟
      ar: كيف حالكِ يا آنسة؟
      en: How are you, miss?
    answers: ["Piye kabare, Mbak?", "Piye kabare, Mbak", "Piye kabare Mbak?", Piye kabare mbak, "Mbak, piye kabare?", "Mbak piye kabare?", Mbak piye kabare, "Pie kabare, Mbak?"]
    words: [piye, kabare, mbak]
  - id: e11
    type: dictation
    text: Piye kabare, Dhe?
    meaning:
      ar_eg: إزيك يا عمو؟
      ar: كيف حالك يا عمّ؟
      en: How are you, uncle?
    words: [piye, kabare, dhe]
  - id: e12
    type: speaking
    text: Sugeng enjing, Bu! Sesuk ketemu maneh.
    meaning:
      ar_eg: صباح الخير يا مدام! نتقابل تاني بكرة.
      ar: صباح الخير يا سيدتي! نلتقي غدًا مرة أخرى.
      en: Good morning, ma'am! See you again tomorrow.
    words: [sugeng enjing, sesuk, maneh]
dialogue:
  title: Telung salam
  lines:
    - speaker: Mohamed
      text: Sugeng enjing, Budhe!
      ar_eg: صباح الخير يا طنط!
      ar: صباح الخير يا عمّة!
      en: Good morning, auntie!
    - speaker: Bu Yani
      text: Sugeng enjing, Mas Mohamed. Piye kabare?
      ar_eg: صباح النور يا محمد. إزيك؟
      ar: صباح النور يا محمد. كيف حالك؟
      en: Good morning, Mohamed. How are you?
    - speaker: Mohamed
      text: Apik, matur nuwun.
      ar_eg: كويس، شكرًا.
      ar: بخير، شكرًا.
      en: Fine, thank you.
    - speaker: Mohamed
      text: Mas Heru, Mbak Rara! Piye kabare, cah?
      ar_eg: يا هيرو، يا رارا! أخباركم إيه يا جدعان؟
      ar: يا هيرو، يا رارا! كيف حالكم يا جماعة؟
      en: Heru, Rara! How's it going, guys?
    - speaker: Mas Heru
      text: Apik! Kowe piye?
      ar_eg: كويسين! وإنت؟
      ar: بخير! وأنت؟
      en: Good! How about you?
    - speaker: Mohamed
      text: Alhamdulillah, apik. Ayo, cah!
      ar_eg: الحمد لله، كويس. يلا يا جدعان!
      ar: الحمد لله، بخير. هيا يا جماعة!
      en: Alhamdulillah, good. Come on, guys!
souvenir:
  id: j1.u01.souvenir
  title: Angkringan Malioboro
  note:
    ar_eg: 'يوجيا اسمها «Kota Pelajar»، مدينة الطلبة، عشان فيها جامعات كتير وطلبة من كل إندونيسيا. وشارع Malioboro هو قلبها: محلات وبيّاعين وموسيقى في الشارع، وبالليل الأنكرينجان (عربيات أكل صغيرة) بتطلع على الرصيف. اقعد على الحصيرة، اطلب شاي سخن، وقول لصاحب العربية «Suwun, Mas!».'
    ar: 'تُلقَّب يوجياكرتا بـ«Kota Pelajar» أي مدينة الطلاب، لكثرة جامعاتها وطلابها القادمين من أنحاء إندونيسيا. وشارع Malioboro قلبها النابض بالمحلات والباعة والموسيقى، وفي الليل تصطفّ عربات الأنكرينجان الصغيرة على الرصيف. اجلس على الحصير، واطلب شايًا ساخنًا، وقل لصاحب العربة «Suwun, Mas!».'
    en: 'Jogja is "Kota Pelajar", the City of Students, full of universities and students from all over Indonesia. Jalan Malioboro is its heart: shops, sellers and street music by day, and at night the angkringan carts set up on the pavement. Sit on the mat, order a hot tea, and say "Suwun, Mas!" to the man running the cart.'
