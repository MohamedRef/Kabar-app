id: j6.u05.l06
language: jv
title: Rapat panitia zakat
can_do:
  ar_eg: 'تشارك في اجتماع لجنة زكاة الفطر في الجامع: الثواب والذنب والشروط وأمين الصندوق.'
  ar: 'أن تشارك في اجتماع لجنة زكاة الفطر في المسجد: الثواب والإثم والشروط وأمين الصندوق.'
  en: 'Take part in a mosque zakat al-fitr committee meeting: reward, sin, requirements and the treasurer.'
slides:
  - title: Tembung saka Arab lan Sanskerta
    body:
      ar_eg: |
        كلمات جاية من العربي: paedah = فايدة، fitrah = فطرة (zakat fitrah = زكاة الفطر)، sarat = شرط.
        كلمات جاية من السنسكريتي: pahala = ثواب، dosa = ذنب، bendahara = أمين الصندوق.
        rembug = نقاش وتشاور (ngrembug = يتناقش في حاجة)، panitia = لجنة.
        لاحظ: «Wudhu iku sarat salat» = الوضوء شرط للصلاة.
      ar: |
        كلمات من العربية: paedah = فائدة، fitrah = فطرة (zakat fitrah = زكاة الفطر)، sarat = شرط.
        كلمات من السنسكريتية: pahala = ثواب، dosa = إثم، bendahara = أمين الصندوق.
        rembug = تشاور (ngrembug = يتشاور في أمر)، panitia = لجنة.
        لاحظ: «Wudhu iku sarat salat» = الوضوء شرط الصلاة.
      en: |
        From Arabic: paedah = benefit (فائدة), fitrah (فطرة; zakat fitrah = the Eid alms), sarat = requirement (شرط).
        From Sanskrit: pahala = reward, dosa = sin, bendahara = treasurer.
        rembug = discussion, deliberation (ngrembug = to discuss something), panitia = committee.
        Note: "Wudhu iku sarat salat" = ablution is a requirement of prayer.
    examples:
      - text: Panitia zakat rembugan ing masjid.
        ar_eg: لجنة الزكاة بتتشاور في الجامع.
        ar: تتشاور لجنة الزكاة في المسجد.
        en: The zakat committee is meeting at the mosque.
      - text: Bendahara nyathet zakat fitrah.
        ar_eg: أمين الصندوق بيسجل زكاة الفطر.
        ar: يسجّل أمين الصندوق زكاة الفطر.
        en: The treasurer records the zakat al-fitr.
      - text: Wudhu iku sarat salat.
        ar_eg: الوضوء شرط للصلاة.
        ar: الوضوء شرط الصلاة.
        en: Ablution is a requirement of prayer.
