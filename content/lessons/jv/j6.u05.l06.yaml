dialogue:
  lines:
    - speaker: Ketua panitia
      text: Sugeng rawuh ing rembug panitia zakat.
      ar_eg: أهلًا بيكم في اجتماع لجنة الزكاة.
      ar: مرحبًا بكم في اجتماع لجنة الزكاة.
      en: Welcome to the zakat committee meeting.
    - speaker: Mohamed
      text: Matur nuwun. Kula saged mbiyantu menapa?
      ar_eg: شكرًا. أقدر أساعد في إيه؟
      ar: شكرًا. بمَ أستطيع المساعدة؟
      en: Thank you. How can I help?
    - speaker: Ketua panitia
      text: Panjenengan saged dados bendahara? Kedah nyathet zakat fitrah.
      ar_eg: تقدر تبقى أمين الصندوق؟ لازم تسجل زكاة الفطر.
      ar: هل تكون أمين الصندوق؟ عليك تسجيل زكاة الفطر.
      en: Could you be the treasurer? You'd record the zakat al-fitr.
    - speaker: Mohamed
      text: Saged. Menapa saratipun?
      ar_eg: أقدر. إيه الشروط؟
      ar: نعم. ما الشروط؟
      en: I can. What are the requirements?
    - speaker: Ketua panitia
      text: Jujur lan tlaten. Pahalanipun ageng, Mas.
      ar_eg: الأمانة والصبر. والثواب كبير.
      ar: الأمانة والمثابرة. وثوابها عظيم.
      en: Honesty and diligence. The reward is great.
    - speaker: Mohamed
      text: Mugi-mugi wonten paedahipun kangge tiyang kathah.
      ar_eg: يا رب تبقى فيها فايدة للناس.
      ar: عسى أن ينتفع بها الناس.
      en: May it benefit many people.
