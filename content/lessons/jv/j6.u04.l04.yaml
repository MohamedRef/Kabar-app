    options: [الرجالة بيحرسوا لحد الصبح, الرجالة نايمين, الرجالة بيشربوا شاي]
    answer: 0
    meaning:
      ar_eg: الرجالة بيحرسوا في كشك الحراسة لحد الصبح.
      ar: يحرس الرجال في الكشك حتى الصباح.
