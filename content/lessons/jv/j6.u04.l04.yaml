schema: kabar.lesson/v1
id: j6.u04.l04
language: jv
title: Wengi ing angkringan
can_do:
  ar_eg: 'تقضي سهرة في الأنجكرينجان: الفحم والكانون والبراد، والقعدة على الأرض، والحراسة بالليل.'
  ar: 'أن تقضي سهرة في الأنغكرينغان: الفحم والموقد والإبريق والجلوس على الحصير وحراسة الليل.'
  en: 'Spend an evening at an angkringan: charcoal, clay stove and kettle, sitting on mats and the night watch.'
slides:
  - title: Kopi joss
    body:
      ar_eg: |
        في الأنجكرينجان المية بتسخن في ceret (براد) على anglo (كانون فخار) بـ areng (فحم).
        lesehan = قعدة على حصيرة على الأرض، nongkrong = يقعد يرغي مع صحابه.
        بالليل الرجالة بيعملوا ronda (حراسة) في gardu (كشك الحراسة). sarasehan = قعدة نقاش.
      ar: |
        في الأنغكرينغان يُسخَّن الماء في ceret (إبريق) على anglo (موقد فخاري) بـ areng (فحم).
        lesehan = الجلوس على حصير على الأرض، nongkrong = يقضي الوقت مع الأصحاب.
        ليلًا يقوم الرجال بـ ronda (الحراسة) في gardu (كشك الحراسة). sarasehan = جلسة نقاش.
      en: |
        At an angkringan, water heats in a ceret (kettle) on an anglo (clay stove) with areng (charcoal).
        lesehan = sitting on a mat on the ground, nongkrong = hang out.
        At night men do ronda (night watch) at the gardu (guard post). sarasehan = discussion gathering.
    examples:
      - text: Wedang ing ceret dipanasi ing anglo nganggo areng.
        ar_eg: المية في البراد بتسخن على الكانون بالفحم.
        ar: يُسخَّن الماء في الإبريق على الموقد بالفحم.
        en: The water in the kettle heats on the clay stove with charcoal.
      - text: Bengi-bengi wong-wong nongkrong lesehan ing angkringan.
        ar_eg: بالليل الناس بتقعد على الحصيرة في الأنجكرينجان.
        ar: ليلًا يجلس الناس على الحصير في الأنغكرينغان.
        en: At night people hang out on mats at the angkringan.
      - text: Bapak-bapak ronda ing gardu nganti esuk.
        ar_eg: الرجالة بيحرسوا في كشك الحراسة لحد الصبح.
        ar: يحرس الرجال في الكشك حتى الصباح.
        en: The men keep watch at the guard post until morning.
