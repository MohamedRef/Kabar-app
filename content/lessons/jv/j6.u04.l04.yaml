  - id: e04
    type: fill_blank
    sentence: Ceret iki dipanasi nganggo ___.
    meaning:
      ar_eg: البراد ده بيسخن بـ___.
      ar: يُسخَّن هذا الإبريق بـ___.
      en: This kettle is heated with ___.
    options: [areng, gardu, sarasehan]
    answers: [areng]
    words: [areng, gardu, sarasehan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: الكانون الفخار الصغير اللي بنحط فيه الفحم اسمه …
      ar: الموقد الفخاري الصغير الذي يوضع فيه الفحم يسمّى …
      en: A small clay stove for charcoal is an …
    options: [ceret, anglo, areng]
    answer: 1
    explain:
      ar_eg: anglo = كانون فخار. ceret = براد، areng = فحم.
      ar: anglo = موقد فخاري؛ ceret = إبريق، areng = فحم.
      en: anglo = clay stove; ceret = kettle, areng = charcoal.
    words: [ceret, anglo, areng]
  - id: e06
    type: fill_blank
    sentence: Ing angkringan iki wong-wong lungguh ___ ing klasa.
    meaning:
      ar_eg: في الأنجكرينجان دي الناس بتقعد ___ على الحصيرة.
      ar: في هذه الأنغكرينغان يجلس الناس ___ على الحصير.
      en: At this angkringan people sit ___ on mats.
    options: [lesehan, nongkrong, ceret]
    answers: [lesehan]
    words: [lesehan, nongkrong, ceret]
  - id: e07
    type: multiple_choice
    question: Bocah-bocah enom seneng ___ ing angkringan nganti bengi.
    options: [anglo, gardu, nongkrong]
    answer: 2
    explain:
      ar_eg: nongkrong = يقعدوا يرغوا.
      ar: nongkrong = يقضون الوقت معًا.
      en: nongkrong = hang out.
    words: [anglo, gardu, nongkrong]
  - id: e08
    type: build_sentence
    source:
      ar_eg: المية اللي في البراد لسه سخنة.
      ar: ما زال الماء في الإبريق ساخنًا.
      en: The drink in the kettle is still hot.
    answer: Wedange ing ceret isih panas.
    distractors: [areng, anglo]
    words: [ceret]
  - id: e09
    type: translate
    direction: from_target
    source_text: Bengi iki ana sarasehan babagan aksara Jawa.
    answers_meaning:
      ar_eg: [الليلة فيه قعدة نقاش عن الحروف الجاوية, فيه ندوة الليلة عن الكتابة الجاوية]
      ar: [الليلة جلسة نقاش عن الحروف الجاوية, تُعقد الليلة ندوة عن الأبجدية الجاوية]
      en: ['Tonight there''s a discussion about Javanese script', 'There''s a talk about aksara Jawa tonight']
    words: [sarasehan]
  - id: e10
    type: speaking
    text: Sawise ronda, aku nongkrong lesehan karo kanca.
    meaning:
      ar_eg: بعد الحراسة، قعدت على الحصيرة مع صحابي.
      ar: بعد الحراسة جلست على الحصير مع أصدقائي.
      en: After the night watch, I hung out on the mats with friends.
    words: [ronda, nongkrong, lesehan]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Ayo nongkrong ing angkringan, Mohamed.
      ar_eg: يلا نقعد في الأنجكرينجان يا محمد.
      ar: هيا نجلس في الأنغكرينغان يا محمد.
      en: Let's hang out at the angkringan, Mohamed.
    - speaker: Mohamed
      text: Ayo. Lho, kok wedange dipanasi ing anglo?
      ar_eg: يلا. إيه ده، المية بتسخن على كانون؟
      ar: هيا. عجبًا، يُسخَّن الماء على موقد فخاري؟
      en: Sure. Oh, they heat the water on a clay stove?
    - speaker: Mas Dimas
      text: Iya, nganggo areng. Kopine dicemplungi areng, jenenge kopi joss.
      ar_eg: أيوه، بالفحم. والقهوة بيرموا فيها فحمة، اسمها كوبي جوس.
      ar: نعم، بالفحم. وتُلقى في القهوة جمرة، واسمها كوبي جوس.
      en: 'Yes, with charcoal. They drop a coal in the coffee: kopi joss.'
    - speaker: Mohamed
      text: Hah? Areng ing kopi? Aku kudu nyoba!
      ar_eg: إيه؟ فحم في القهوة؟ لازم أجرب!
      ar: ماذا؟ فحم في القهوة؟ يجب أن أجرّب!
      en: What? Charcoal in coffee? I have to try it!
    - speaker: Mas Dimas
      text: Sabanjure aku melu ronda ing gardu karo bapak-bapak.
      ar_eg: بعدها هروح أحرس مع الرجالة في الكشك.
      ar: بعدها سأشارك الرجال الحراسة في الكشك.
      en: Afterwards I'm on night watch at the guard post with the men.
    - speaker: Mohamed
      text: Aku melu sedhela, banjur lesehan maneh!
      ar_eg: هاجي معاك شوية، وبعدين نرجع نقعد على الحصيرة!
      ar: سأرافقك قليلًا ثم نعود للجلوس على الحصير!
      en: I'll join you for a bit, then back to the mats!
