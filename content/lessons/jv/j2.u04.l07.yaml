schema: kabar.lesson/v1
id: j2.u04.l07
language: jv
title: Jadwal sepur
can_do:
  ar_eg: تقرا جدول مواعيد قطر وتختار القطر المناسب.
  ar: أن تقرأ جدول مواعيد القطارات وتختار القطار المناسب.
  en: Read a train timetable and pick a train.
slides:
  - title: Neng stasiun Madiun
    grammar: jv.time.expressions
    body:
      ar_eg: |
        في محطة ماديون فيه لوحة مواعيد صغيرة. sepur = قطر (kereta)، وmenyang = رايح لـ (ke).
        افتكر الساعة:
        - setengah + الساعة اللي جاية: setengah wolu = ٧:٣٠.
        - luwih seprapat = وربع، kurang seprapat = إلا ربع.
        - esuk / awan / sore / bengi بعد الساعة: jam siji awan = ١ الضهر.
      ar: |
        في محطة ماديون لوحة مواعيد صغيرة. sepur = قطار (kereta)، وmenyang = إلى (ke).
        تذكّر الساعة:
        - setengah + الساعة التالية: setengah wolu = ٧:٣٠.
        - luwih seprapat = والربع، وkurang seprapat = إلا ربعًا.
        - esuk / awan / sore / bengi بعد الساعة: jam siji awan = الواحدة ظهرًا.
      en: |
        At Madiun station there's a small timetable board. sepur = train (kereta), menyang = to (ke).
        Remember clock time:
        - setengah + the NEXT hour: setengah wolu = 7:30.
        - luwih seprapat = quarter past, kurang seprapat = quarter to.
        - esuk / awan / sore / bengi after the hour: jam siji awan = 1 p.m.
    examples:
      - text: Sepur menyang Solo jam setengah wolu esuk lan jam siji awan.
        ar_eg: قطر سولو الساعة ٧:٣٠ الصبح والساعة ١ الضهر.
        ar: قطار سولو في السابعة والنصف صباحًا والواحدة ظهرًا.
        en: Trains to Solo at 7:30 a.m. and 1 p.m.
      - text: Sepur menyang Suroboyo jam papat luwih seprapat sore.
        ar_eg: قطر سورابايا الساعة أربعة وربع العصر.
        ar: قطار سورابايا في الرابعة والربع عصرًا.
        en: The train to Surabaya is at 4:15 p.m.
      - text: Dina Minggu ora ana sepur jam siji awan.
        ar_eg: يوم الحد مفيش قطر الساعة ١ الضهر.
        ar: يوم الأحد لا يوجد قطار الساعة الواحدة ظهرًا.
        en: On Sundays there's no 1 p.m. train.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: محمد عايز يروح سولو الصبح. ياخد قطر الساعة كام؟
      ar: يريد محمد الذهاب إلى سولو صباحًا. أيّ قطار يأخذ؟
      en: Mohamed wants to go to Solo in the morning. Which train?
    options: ["Jam setengah wolu esuk.", "Jam siji awan.", "Jam papat luwih seprapat sore."]
    answer: 0
    explain:
      ar_eg: قطر سولو الصبح الساعة setengah wolu esuk = ٧:٣٠. قطر الساعة ٤:١٥ رايح سورابايا.
      ar: قطار سولو الصباحي في setengah wolu esuk = ٧:٣٠، أما قطار ٤:١٥ فذاهب إلى سورابايا.
      en: The morning train to Solo is at setengah wolu esuk = 7:30. The 4:15 train goes to Surabaya.
    words: [setengah, esuk]
  - id: e02
    type: multiple_choice
    question: Sepur menyang Suroboyo jam papat luwih seprapat sore.
    question_meaning:
      ar_eg: قطر سورابايا الساعة كام؟
      ar: في أيّ ساعة قطار سورابايا؟
      en: What time is the train to Surabaya?
    options: ["Jam papat sore.", "Jam lima kurang seprapat sore.", "Jam papat luwih seprapat sore."]
    answer: 2
    explain:
      ar_eg: luwih seprapat = وربع. jam lima kurang seprapat = ٤:٤٥، مش ٤:١٥.
      ar: luwih seprapat = والربع، أما jam lima kurang seprapat فهي ٤:٤٥ لا ٤:١٥.
      en: luwih seprapat = quarter past. jam lima kurang seprapat is 4:45, not 4:15.
    words: [luwih, seprapat, sore]
  - id: e03
    type: multiple_choice
    question: Dina Minggu ora ana sepur jam siji awan.
    question_meaning:
      ar_eg: النهارده الحد. Sari تقدر تاخد قطر الساعة ١ لسولو؟
      ar: اليوم الأحد. هل تستطيع Sari أن تأخذ قطار الواحدة إلى سولو؟
      en: Today is Sunday. Can Sari take the 1 p.m. train to Solo?
    options: ["Isa, sepure ana.", "Ora isa, sepure ora ana.", "Isa, jam papat sore."]
    answer: 1
    explain:
      ar_eg: يوم الحد (Minggu) مفيش قطر الساعة ١ الضهر، يعني ora isa.
      ar: يوم الأحد (Minggu) لا يوجد قطار الواحدة ظهرًا، أي ora isa.
      en: On Sunday (Minggu) there's no 1 p.m. train, so ora isa.
    words: [isa, dina]
  - id: e04
    type: listen
    text: Sepur menyang Solo jam setengah wolu esuk.
    options: ["Sepur menyang Solo jam setengah pitu esuk.", "Sepur menyang Solo jam setengah wolu bengi.", "Sepur menyang Solo jam setengah wolu esuk."]
    answer: 2
    meaning:
      ar_eg: قطر سولو الساعة ٧:٣٠ الصبح.
      ar: قطار سولو في السابعة والنصف صباحًا.
      en: The train to Solo is at 7:30 a.m.
    words: [setengah, esuk]
  - id: e05
    type: match_pairs
    pairs:
      - text: jam setengah wolu
        ar_eg: ٧:٣٠
        ar: ٧:٣٠
        en: "7:30"
      - text: jam siji awan
        ar_eg: ١ الضهر
        ar: الواحدة ظهرًا
        en: 1 p.m.
      - text: jam papat luwih seprapat
        ar_eg: ٤:١٥
        ar: ٤:١٥
        en: "4:15"
      - text: jam lima kurang seprapat
        ar_eg: ٤:٤٥
        ar: ٤:٤٥
        en: "4:45"
      - text: jam pitu bengi
        ar_eg: ٧ بالليل
        ar: السابعة مساءً
        en: 7 p.m.
    words: [jam, setengah, luwih, seprapat, bengi]
  - id: e06
    type: fill_blank
    sentence: Dina Minggu ora ana sepur jam siji ___.
    meaning:
      ar_eg: يوم الحد مفيش قطر الساعة ١ الضهر.
      ar: يوم الأحد لا يوجد قطار الساعة الواحدة ظهرًا.
      en: On Sundays there's no 1 p.m. train.
    options: ["esuk", "awan", "bengi"]
    answers: ["awan"]
    explain:
      ar_eg: ١ الضهر = jam siji awan (awan = الضهر، نص النهار).
      ar: الواحدة ظهرًا = jam siji awan (awan = الظهيرة).
      en: 1 p.m. = jam siji awan (awan = midday).
    words: [awan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: قطر سولو الساعة كام؟
      ar: في أيّ ساعة قطار سولو؟
      en: What time is the train to Solo?
    answers:
      - Sepur menyang Solo jam pira?
      - Sepur menyang Solo jam pira
      - Sepur menyang Solo jam piro?
      - Sepur neng Solo jam pira?
      - Sepur nang Solo jam pira?
      - Jam pira sepur menyang Solo?
      - Sepure menyang Solo jam pira?
      - Sepur sing menyang Solo jam pira?
    explain:
      ar_eg: menyang = لـ (ke)، وjam pira? = الساعة كام؟
      ar: menyang = إلى (ke)، وjam pira? = في أيّ ساعة؟
      en: menyang = to (ke), jam pira? = what time?
    words: [menyang, jam, pira]
  - id: e08
    type: build_sentence
    source:
      ar_eg: بكرة الصبح رايح سولو الساعة ٧:٣٠.
      ar: غدًا صباحًا سأذهب إلى سولو في السابعة والنصف.
      en: Tomorrow morning I'm going to Solo at half past seven.
    answer: Sesuk esuk aku menyang Solo jam setengah wolu.
    distractors: [wingi, mau]
    explain:
      ar_eg: sesuk = بكرة. wingi = امبارح، وmau = من شوية؛ الاتنين ماضي.
      ar: sesuk = غدًا، أما wingi = أمس وmau = قبل قليل، وكلاهما للماضي.
      en: sesuk = tomorrow. wingi = yesterday and mau = earlier; both are past.
    words: [sesuk, esuk, menyang, setengah]
  - id: e09
    type: speaking
    text: Sepur menyang Suroboyo jam papat luwih seprapat sore.
    meaning:
      ar_eg: قطر سورابايا الساعة أربعة وربع العصر.
      ar: قطار سورابايا في الرابعة والربع عصرًا.
      en: The train to Surabaya is at 4:15 p.m.
    words: [luwih, seprapat, sore]
dialogue:
  title: Arep menyang Solo
  lines:
    - speaker: Mohamed
      text: Sari, sesuk aku arep menyang Solo. Sepure jam pira?
      ar_eg: يا ساري، بكرة أنا رايح سولو. القطر الساعة كام؟
      ar: يا ساري، غدًا سأذهب إلى سولو. في أيّ ساعة القطار؟
      en: Sari, tomorrow I'm going to Solo. What time is the train?
    - speaker: Sari
      text: Ana jam setengah wolu esuk lan jam siji awan.
      ar_eg: فيه الساعة ٧:٣٠ الصبح والساعة ١ الضهر.
      ar: يوجد في السابعة والنصف صباحًا والواحدة ظهرًا.
      en: There's one at 7:30 a.m. and one at 1 p.m.
    - speaker: Mohamed
      text: Jam siji wae. Esuk aku isih turu!
      ar_eg: الساعة واحدة أحسن. الصبح أنا لسه نايم!
      ar: الواحدة إذن. في الصباح أكون نائمًا بعد!
      en: The one o'clock, then. In the morning I'm still asleep!
    - speaker: Sari
      text: Lho, sesuk Minggu. Dina Minggu ora ana sepur jam siji.
      ar_eg: إيه ده، بكرة الحد. يوم الحد مفيش قطر الساعة واحدة.
      ar: انتبه، غدًا الأحد. يوم الأحد لا يوجد قطار الساعة الواحدة.
      en: Oh, tomorrow's Sunday. On Sundays there's no one o'clock train.
    - speaker: Mohamed
      text: Wah! Ya wis, jam setengah wolu esuk.
      ar_eg: ياه! خلاص، الساعة ٧:٣٠ الصبح.
      ar: آه! حسنًا، السابعة والنصف صباحًا.
      en: Oh no! All right, 7:30 in the morning.
    - speaker: Sari
      text: Sip! Mengko bengi cepet turu, ya!
      ar_eg: تمام! بالليل نام بدري بقى!
      ar: ممتاز! نَم مبكرًا الليلة إذن!
      en: Great! Get to bed early tonight, then!
