schema: kabar.lesson/v1
id: j5.u02.l06
language: jv
title: Warta cekak
can_do:
  ar_eg: تقرا خبر قصير.
  ar: أن تقرأ خبرًا قصيرًا.
  en: Read a short news item.
slides:
  - title: Banjir ing Madiun
    body:
      ar_eg: |
        خبر قصير من جرنال ماديون. اسأل نفسك تلات أسئلة: حصل إيه؟ مين عمل؟ إمتى؟
        luber = فاض / طفح (المية زادت لحد ما طلعت برّه، زي نهر ماديون Kali Madiun في موسم المطر). kebanjiran = غرقت مية (ke-…-an = حاجة حصلتلها). diresiki = اتنضّفت (resik = نضيف).
      ar: |
        خبر قصير من جريدة في ماديون. اسأل نفسك ثلاثة أسئلة: ماذا حدث؟ من فعل؟ متى؟
        luber = فاض (امتلأ حتى خرج الماء، كنهر ماديون Kali Madiun في موسم المطر). وkebanjiran = غمرته المياه (ke-…-an لما أصاب الشيء)، وdiresiki = نُظِّف (resik = نظيف).
      en: |
        A short news item from a Madiun paper. Ask three questions: what happened? who did it? when?
        luber = to overflow (filled until it spills out, like the Kali Madiun river in the rainy season) = Indonesian meluap. kebanjiran = got flooded (ke-…-an = something happened to it). diresiki = was cleaned (resik = clean).
    grammar: jv.passive.written
    examples:
      - text: Dalan ing Manguharjo kebanjiran wingi sore.
        ar_eg: الشارع في مانجوهارجو غرق مية امبارح العصر.
        ar: غمرت المياهُ الشارعَ في مانغوهارجو عصر أمس.
        en: The road in Manguharjo was flooded yesterday afternoon.
      - text: Esuk iki, dalan kasebut wis diresiki dening warga.
        ar_eg: الصبح ده، الأهالي نضّفوا الشارع المذكور خلاص.
        ar: وفي صباح اليوم نظّف الأهالي الشارع المذكور.
        en: This morning, the said road was cleaned up by the residents.
      - text: Kali Madiun kerep luber yen udan gedhe.
        ar_eg: نهر ماديون كتير بيفيض لما المطر يبقى جامد.
        ar: كثيرًا ما يفيض نهر ماديون إذا اشتدّ المطر.
        en: The Madiun river often overflows when it rains hard.
exercises:
  - id: e01
    type: listen
    text: Kali Madiun luber, dalan ing Manguharjo kebanjiran.
    question:
      ar_eg: إيه اللي حصل للشارع؟
      ar: ماذا حدث للشارع؟
      en: What happened to the road?
    options: [didandani dening warga, kebanjiran, ditutup dening polisi]
    answer: 1
    meaning:
      ar_eg: نهر ماديون فاض، والشارع في مانجوهارجو غرق مية.
      ar: فاض نهر ماديون فغمرت المياه الشارع في مانغوهارجو.
      en: The Madiun river overflowed, and the road in Manguharjo flooded.
    words: [kebanjiran, luber]
  - id: e02
    type: multiple_choice
    question: Esuk iki, dalan kasebut wis diresiki dening warga.
    question_meaning:
      ar_eg: مين اللي نضّف الشارع؟
      ar: من نظّف الشارع؟
      en: Who cleaned the road?
    options: [warga, lurah, Pak Harjo]
    answer: 0
    words: [diresiki, dening]
    explain:
      ar_eg: الجملة بتقول diresiki dening warga، يعني السكان هم اللي نضّفوا.
      ar: تقول الجملة diresiki dening warga، أي أن السكان هم من نظّفوا.
      en: "The sentence says diresiki dening warga: the residents cleaned it."
  - id: e03
    type: fill_blank
    sentence: Dalan kasebut wis ___ dening warga.
    meaning:
      ar_eg: الأهالي نضّفوا الشارع المذكور خلاص.
      ar: نظّف الأهالي الشارع المذكور.
      en: The said road has been cleaned up by the residents.
    options: [kebanjiran, kapilih, diresiki]
    answers: [diresiki]
    words: [diresiki, kebanjiran]
    explain:
      ar_eg: diresiki = اتنضّف. kebanjiran = غرق في فيضان وkapilih = اتختار، ومش بيتعملوا dening warga.
      ar: diresiki تعني نُظِّف. أما kebanjiran (غمره الفيضان) وkapilih (انتُخب) فلا تناسبان dening warga.
      en: diresiki means "was cleaned". kebanjiran (flooded) and kapilih (elected) don't fit "by the residents".
  - id: e04
    type: fill_blank
    sentence: Kali Madiun ___ luber yen udan gedhe.
    meaning:
      ar_eg: نهر ماديون كتير بيفيض لما المطر يبقى جامد.
      ar: كثيرًا ما يفيض نهر ماديون إذا اشتدّ المطر.
      en: The Madiun river often overflows when it rains hard.
    options: [lawas, kerep, misuwur]
    answers: [kerep]
    words: [kerep, luber]
    explain:
      ar_eg: kerep = كتير / غالبًا. lawas = قديم وmisuwur = مشهور، ومش بيوصفوا «بيفيض».
      ar: kerep تعني كثيرًا ما. أما lawas (قديم) وmisuwur (مشهور) فلا تصفان الفيضان.
      en: kerep means "often". lawas (old) and misuwur (famous) don't describe overflowing.
  - id: e05
    type: build_sentence
    source:
      ar_eg: نهر ماديون كتير بيفيض.
      ar: كثيرًا ما يفيض نهر ماديون.
      en: The Madiun river often overflows.
    answer: Kali Madiun kerep luber.
    distractors: [kidul, dening]
    words: [kerep, luber]
    explain:
      ar_eg: kerep luber = بيفيض كتير. kidul = جنوب وdening = بواسطة، ومش في المعنى.
      ar: kerep luber تعني كثيرًا ما يفيض. أما kidul (جنوب) وdening (بواسطة) فليستا في المعنى.
      en: kerep luber is "often overflows". kidul (south) and dening ("by") aren't in the meaning.
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأسلوب الخبر) النهر فاض امبارح.
      ar: (بأسلوب الخبر) فاض النهر أمس.
      en: (news style) The river overflowed yesterday.
    answers:
      - Kali iku luber wingi.
      - Wingi kali iku luber.
      - Kali kasebut luber wingi.
      - Wingi kali kasebut luber.
      - Kaline luber wingi.
      - Wingi kaline luber.
      - Kali iki luber wingi.
      - Kali Madiun luber wingi.
      - Wingi Kali Madiun luber.
    words: [luber]
  - id: e07
    type: translate
    direction: from_target
    source_text: Kali Madiun kerep luber yen udan gedhe.
    answers_meaning:
      ar_eg:
        - نهر ماديون كتير بيفيض لما المطر يبقى جامد.
        - نهر ماديون بيفيض كتير لما الدنيا تمطر جامد.
        - نهر ماديون غالبًا بيفيض لو المطر كتير.
        - نهر ماديون كتير بيطفح لما المطر يبقى شديد.
      ar:
        - كثيرًا ما يفيض نهر ماديون إذا اشتدّ المطر.
        - يفيض نهر ماديون كثيرًا عند المطر الغزير.
        - غالبًا ما يفيض نهر ماديون إذا كان المطر شديدًا.
      en:
        - The Madiun river often overflows when it rains hard.
        - The Madiun river often overflows in heavy rain.
        - The Madiun river often floods when it rains heavily.
        - The Madiun River often overflows when there is heavy rain.
        - The river in Madiun often overflows when it rains hard.
    words: [kerep, luber]
  - id: e08
    type: dictation
    text: Esuk iki, dalan kasebut wis diresiki dening warga.
    meaning:
      ar_eg: الصبح ده، الأهالي نضّفوا الشارع المذكور خلاص.
      ar: وفي صباح اليوم نظّف الأهالي الشارع المذكور.
      en: This morning, the said road was cleaned up by the residents.
    words: [diresiki, kasebut]
  - id: e09
    type: speaking
    text: Dalan ing Manguharjo kebanjiran.
    meaning:
      ar_eg: الشارع في مانجوهارجو غرق مية.
      ar: غمرت المياه الشارع في مانغوهارجو.
      en: The road in Manguharjo got flooded.
    words: [kebanjiran]
dialogue:
  title: Warta ing warung
  lines:
    - speaker: Mohamed
      text: Pak, wonten warta menapa ing koran?
      ar_eg: يا عمّو، فيه أخبار إيه في الجرنال؟
      ar: يا سيدي، ما الأخبار في الجريدة؟
      en: Sir, what news is in the paper?
    - speaker: Pak Harjo
      text: Kali Madiun luber, dalan ing Manguharjo kebanjiran wingi sore.
      ar_eg: نهر ماديون فاض، والشارع في مانجوهارجو غرق مية امبارح العصر.
      ar: فاض نهر ماديون، فغمرت المياه الشارع في مانغوهارجو عصر أمس.
      en: The Madiun river overflowed, and the road in Manguharjo flooded yesterday afternoon.
    - speaker: Mohamed
      text: Luber menika menapa, Pak?
      ar_eg: يعني إيه luber يا عمّو؟
      ar: ما معنى luber يا سيدي؟
      en: What does luber mean, sir?
    - speaker: Pak Harjo
      text: Banyu kali munggah nganti metu menyang dalan. Yen udan gedhe kerep, kok.
      ar_eg: مية النهر بتعلى لحد ما تطلع على الشارع. ولما المطر يبقى جامد بتحصل كتير، عادي يعني.
      ar: يرتفع ماء النهر حتى يخرج إلى الشارع، ويكثر ذلك حين يشتدّ المطر.
      en: The river water rises until it spills onto the road. It happens a lot when it rains hard, you know.
    - speaker: Mohamed
      text: Oh, kula ngertos. Matur nuwun, Pak.
      ar_eg: آه، فهمت. متشكر يا عمّو.
      ar: آه، فهمت. شكرًا يا سيدي.
      en: Oh, I see. Thank you, sir.
new_words:
  - word: luber
    pos: verb
    ar_eg: فاض / طفح (المية خرجت من كترها)
    ar: فاض، طفح
    en: to overflow = meluap, luber
  - word: kebanjiran
    pos: verb
    ar_eg: غرق مية (اتعرّض لفيضان)
    ar: غمرته المياه
    en: got flooded = kebanjiran
  - word: diresiki
    pos: verb
    ar_eg: اتنضّف (من resik = نضيف)
    ar: نُظِّف (من resik = نظيف)
    en: was cleaned (from resik, clean) = dibersihkan
  - word: kerep
    pos: adverb
    ar_eg: كتير / غالبًا
    ar: كثيرًا / غالبًا
    en: often = sering
