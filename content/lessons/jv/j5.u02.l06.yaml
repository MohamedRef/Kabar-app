dialogue:
  title: Kalawarti basa Jawa
  lines:
    - speaker: Pak Harjo
      text: Mas, iki Djaka Lodang, kalawarti basa Jawa saka Yogya.
      ar_eg: يا ابني، دي «جاكا لودانج»، مجلة بالجاوي من جوجا.
      ar: يا بني، هذه «جاكا لودانج»، مجلة بالجاوية من يوغيا.
      en: Young man, this is Djaka Lodang, a Javanese magazine from Yogya.
    - speaker: Mohamed
      text: Kalawarti menika sampun lami, Pak?
      ar_eg: المجلة دي قديمة يا عمّو؟
      ar: هل هذه المجلة قديمة يا سيدي؟
      en: Has this magazine been around long, sir?
    - speaker: Pak Harjo
      text: Wis lawas, lho, wiwit taun 1971.
      ar_eg: قديمة آه، من سنة 1971.
      ar: نعم، قديمة، منذ عام 1971.
      en: Oh yes, a long time, since 1971.
    - speaker: Mohamed
      text: Menika layang saking sinten, Pak?
      ar_eg: والجواب ده من مين يا عمّو؟
      ar: وممّن هذه الرسالة يا سيدي؟
      en: Who's this letter from, sir?
    - speaker: Pak Harjo
      text: Saka warga dhusun. Ditulis nganggo krama, kaya layang kanggo wong sepuh.
      ar_eg: من واحد من أهل قرية. مكتوب بالكراما، زي جواب لحد كبير.
      ar: من أحد أهل القرى، مكتوبة بالكراما كرسالة إلى شخص كبير.
      en: From a villager. It's written in krama, like a letter to an elder.
