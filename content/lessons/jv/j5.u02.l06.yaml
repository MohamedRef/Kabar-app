language: jv
title: Djaka Lodang
can_do:
  ar_eg: تقرا جواب قارئ في مجلة جاوية.
  ar: أن تقرأ رسالة قارئ في مجلة جاوية.
  en: Read a reader's letter in a Javanese magazine.
slides:
  - title: Layang saka pamaca
    body:
      ar_eg: |
        Djaka Lodang مجلة أسبوعية بالجاوي من يوجياكارتا، بتطلع من سنة 1971. وفيها صفحات بيبعتلها القرّاء أخبار وجوابات، والجوابات دي غالبًا كراما.
        في الكراما المكتوبة المجهول dipun- بدل di- (عرفتها في J3): dipunbangun = اتبنى. وأول الجواب دايمًا «Redaksi ingkang kinurmatan» = «السادة المحررين المحترمين». kinurmatan فيها -in- جوه الكلمة: k-in-urmatan، من kurmat (احترام).
      ar: |
        Djaka Lodang مجلة أسبوعية بالجاوية من يوغياكارتا تصدر منذ 1971، وفيها صفحات يرسل إليها القراء أخبارًا ورسائل، وأغلبها بالكراما.
        وفي الكراما المكتوبة يأتي المجهول بـ dipun- بدل di- (عرفتها في J3): dipunbangun = بُني. وتبدأ الرسالة عادة بـ «Redaksi ingkang kinurmatan» = «السادة المحررون المحترمون»، وفي kinurmatan -in- داخلية: k-in-urmatan من kurmat (الاحترام).
      en: |
        Djaka Lodang is a Javanese-language weekly from Yogyakarta, published since 1971. Readers send in news and letters, and the letters are usually in krama.
        Written krama makes the passive with dipun- instead of di- (you met it in J3): dipunbangun = was built. A letter opens with "Redaksi ingkang kinurmatan" = "Dear Editors". kinurmatan hides -in-: k-in-urmatan, from kurmat (respect).
    grammar: jv.passive.written
    examples:
      - text: Redaksi ingkang kinurmatan,
        ar_eg: السادة المحررين المحترمين،
        ar: السادة المحررون المحترمون،
        en: Dear Editors,
      - text: Masjid enggal ing dhusun kula dipunbangun dening warga.
        ar_eg: الجامع الجديد في قريتي بناه الأهالي.
        ar: بنى الأهالي المسجد الجديد في قريتي.
        en: The new mosque in my village was built by the residents.
      - text: Kula nyuwun warta menika dipunmuat ing Djaka Lodang.
        ar_eg: برجو إن الخبر ده يتنشر في «جاكا لودانج».
        ar: أرجو أن يُنشر هذا الخبر في «جاكا لودانج».
        en: I kindly ask that this news be printed in Djaka Lodang.
