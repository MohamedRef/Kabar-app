dialogue:
  lines:
    - speaker: Dimas
      text: Mohamed, ayo mancing neng Kali Madiun!
      ar_eg: يا محمد، يلا نصطاد في نهر ماديون!
      ar: يا محمد، هيّا نصطاد في نهر ماديون!
      en: Mohamed, let's go fishing on the Madiun river!
    - speaker: Mohamed
      text: Ayo! Neng ngendi? Neng ngisor kreteg?
      ar_eg: يلا! فين؟ تحت الكوبري؟
      ar: هيّا! أين؟ تحت الجسر؟
      en: Let's go! Where? Under the bridge?
    - speaker: Dimas
      text: Iya. Ati-ati, lemahe lunyu, akeh suket.
      ar_eg: آه. خلي بالك، الأرض بتزحلق، وفيه حشيش كتير.
      ar: نعم. انتبه، الأرض زلقة وفيها عشب كثير.
      en: Yeah. Careful, the ground's slippery, lots of grass.
    - speaker: Mohamed
      text: Wah, iwake ucul! Aku wirang, hehe.
      ar_eg: يا خسارة، السمكة فلتت! أنا مكسوف، هههه.
      ar: يا للأسف، أفلتت السمكة! أنا محرج، هه.
      en: Oh, the fish got away! So embarrassing, hehe.
    - speaker: Dimas
      text: Santai wae. Mengko mulih tuku pelem wae.
      ar_eg: ولا يهمك. وإحنا مروّحين نشتري مانجة وخلاص.
      ar: لا عليك. سنشتري المانجو في طريق العودة.
      en: Relax. We'll just buy mangoes on the way home.
