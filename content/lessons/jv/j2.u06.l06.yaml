schema: kabar.lesson/v1
id: j2.u06.l06
language: jv
title: Status Dimas
can_do:
  ar_eg: تقرا بوست قصير عن ويك إند ممطر وتفهم الأسباب والمشاعر.
  ar: أن تقرأ منشورًا قصيرًا عن عطلة ممطرة وتفهم الأسباب والمشاعر فيه.
  en: Read a short post about a rainy weekend.
slides:
  - title: Statuse Dimas
    grammar: jv.conjunction.basic
    body:
      ar_eg: |
        Dimas كتب ستيتس عن الويك إند بتاعه. الكلمات الصغيرة هي اللي بتربط الحكاية:
        - mula = عشان كده (makanya)، nanging = بس / لكن، nek = لو.
        - banget بعد الصفة = أوي.
        وكلمة bosen = زهقان (bosan) من درس «Apik banget».
      ar: |
        كتب Dimas حالة عن عطلته. الكلمات الصغيرة هي التي تربط القصة:
        - mula = لذلك (makanya)، وnanging = لكن، وnek = إذا.
        - banget بعد الصفة = جدًّا.
        وكلمة bosen = ضَجِر (bosan) من درس «Apik banget».
      en: |
        Dimas wrote a status about his weekend. The small words hold the story together:
        - mula = that's why (makanya), nanging = but, nek = if.
        - banget after an adjective = very.
        And bosen = bored (bosan), from the "Apik banget" lesson.
    examples:
      - text: Wingi udan, mula aku ora dolan.
        ar_eg: امبارح كانت بتمطر، عشان كده ما خرجتش.
        ar: أمطرت أمس، لذلك لم أخرج.
        en: It rained yesterday, so I didn't go out.
      - text: Aku neng omah wae, maca buku. Nanging bosen banget!
        ar_eg: قعدت في البيت وخلاص، بقرا كتاب. بس زهقت أوي!
        ar: بقيت في البيت أقرأ كتابًا، لكنني ضجرت جدًّا!
        en: I just stayed home reading a book. But I was so bored!
      - text: Sesuk nek ora udan, ayo mlaku-mlaku neng taman!
        ar_eg: بكرة لو ما مطرتش، يلا نتمشى في الجنينة!
        ar: غدًا إذا لم تمطر، هيّا نتمشّى في الحديقة!
        en: Tomorrow, if it doesn't rain, let's go for a stroll in the park!
exercises:
  - id: e01
    type: multiple_choice
    question: Wingi udan, mula aku ora dolan.
    question_meaning:
      ar_eg: Dimas ما خرجش امبارح ليه؟
      ar: لماذا لم يخرج Dimas أمس؟
      en: Why didn't Dimas go out yesterday?
    options: ["Merga kesel.", "Merga udan.", "Merga sedhih."]
    answer: 1
    explain:
      ar_eg: udan, mula … = كانت بتمطر، عشان كده …. السبب هو المطر.
      ar: udan, mula … = أمطرت، لذلك …، فالسبب هو المطر.
      en: udan, mula … = it rained, so …. The reason is the rain.
    words: [udan, mula, merga / amarga]
  - id: e02
    type: multiple_choice
    question: Nanging bosen banget!
    question_meaning:
      ar_eg: Dimas كان حاسس بإيه في البيت؟
      ar: بماذا شعر Dimas في البيت؟
      en: How did Dimas feel at home?
    options: ["Seneng banget.", "Wedi.", "Bosen banget."]
    answer: 2
    explain:
      ar_eg: bosen banget = زهقان أوي. nanging = بس، يعني القعدة في البيت ما كانتش حلوة.
      ar: bosen banget = ضَجِر جدًّا، وnanging = لكن، أي أن البقاء في البيت لم يكن ممتعًا.
      en: bosen banget = so bored. nanging = but, so staying home wasn't fun.
    words: [banget, nanging / ning]
  - id: e03
    type: multiple_choice
    question: Sesuk nek ora udan, ayo mlaku-mlaku neng taman!
    question_meaning:
      ar_eg: هيتمشوا إمتى؟
      ar: متى سيتمشّون؟
      en: When will they go for a stroll?
    options: ["Sesuk, nek ora udan.", "Wingi, merga udan.", "Saiki, nek udan."]
    answer: 0
    explain:
      ar_eg: sesuk = بكرة، وnek ora udan = لو ما مطرتش.
      ar: sesuk = غدًا، وnek ora udan = إذا لم تمطر.
      en: sesuk = tomorrow, nek ora udan = if it doesn't rain.
    words: [yen / nek, sesuk, taman]
  - id: e04
    type: listen
    text: Sesuk nek ora udan, ayo mlaku-mlaku neng taman!
    options: ["Sesuk nek udan, ayo mlaku-mlaku neng taman!", "Sesuk nek ora udan, ayo mlaku-mlaku neng taman!", "Wingi ora udan, ayo mlaku-mlaku neng taman!"]
    answer: 1
    meaning:
      ar_eg: بكرة لو ما مطرتش، يلا نتمشى في الجنينة!
      ar: غدًا إذا لم تمطر، هيّا نتمشّى في الحديقة!
      en: Tomorrow, if it doesn't rain, let's go for a stroll in the park!
    words: [yen / nek, udan, mlaku / mlaku-mlaku]
  - id: e05
    type: match_pairs
    pairs:
      - text: mula
        ar_eg: عشان كده
        ar: لذلك
        en: that's why, so
      - text: nanging
        ar_eg: بس / لكن
        ar: لكن
        en: but
      - text: nek
        ar_eg: لو
        ar: إذا
        en: if
      - text: udan
        ar_eg: مطر / بتمطر
        ar: مطر / تمطر
        en: rain
      - text: bosen
        ar_eg: زهقان
        ar: ضَجِر
        en: bored
    words: [mula, nanging / ning, yen / nek, udan]
  - id: e06
    type: fill_blank
    sentence: Wingi udan, ___ aku ora dolan.
    meaning:
      ar_eg: امبارح كانت بتمطر، عشان كده ما خرجتش.
      ar: أمطرت أمس، لذلك لم أخرج.
      en: It rained yesterday, so I didn't go out.
    options: ["nanging", "mula", "nek"]
    answers: ["mula"]
    explain:
      ar_eg: المطر هو السبب، والقعدة في البيت هي النتيجة، فنحط mula (عشان كده).
      ar: المطر هو السبب والبقاء في البيت هو النتيجة، فنضع mula (لذلك).
      en: The rain is the cause and staying in is the result, so mula (that's why).
    words: [mula, dolan / dolan-dolan]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: امبارح قريت كتاب في البيت، عشان كانت بتمطر.
      ar: أمس قرأت كتابًا في البيت، لأنها كانت تمطر.
      en: Yesterday I read a book at home, because it was raining.
    answers:
      - Wingi aku maca buku neng omah, merga udan.
      - Wingi aku maca buku neng omah, merga udan
      - Wingi aku maca buku neng omah merga udan.
      - Wingi aku maca buku neng omah, amarga udan.
      - Wingi aku neng omah maca buku, merga udan.
      - Wingi aku neng omah, maca buku, merga udan.
      - Merga udan, wingi aku maca buku neng omah.
      - Wingi merga udan, aku maca buku neng omah.
      - Aku wingi maca buku neng omah, merga udan.
    explain:
      ar_eg: merga (أو amarga) = عشان / لأن. karena إندونيسي، في الجملة الجاوي قول merga.
      ar: merga (أو amarga) = لأن، أما karena فإندونيسية؛ قل merga في الجملة الجاوية.
      en: merga (or amarga) = because. karena is Indonesian; in Javanese say merga.
    words: [wingi, merga / amarga, udan, maca]
  - id: e08
    type: build_sentence
    source:
      ar_eg: قعدت في البيت، بس زهقت أوي.
      ar: بقيت في البيت، لكنني ضجرت جدًّا.
      en: I stayed home, but I was really bored.
    answer: Aku neng omah, nanging aku bosen banget.
    distractors: [mula, rada]
    words: [nanging / ning, banget]
  - id: e09
    type: speaking
    text: Ayo mlaku-mlaku neng taman!
    meaning:
      ar_eg: يلا نتمشى في الجنينة!
      ar: هيّا نتمشّى في الحديقة!
      en: Let's go for a stroll in the park!
    words: [mlaku / mlaku-mlaku, taman]
dialogue:
  title: Komen neng statuse Dimas
  lines:
    - speaker: Mohamed
      text: Dimas, aku wis maca statusmu. Bosen tenan, ya?
      ar_eg: يا ديماس، قريت الستيتس بتاعك. زهقت بجد، صح؟
      ar: يا ديماس، قرأت حالتك. ضجرت حقًّا، أليس كذلك؟
      en: Dimas, I've read your status. Really bored, huh?
    - speaker: Dimas
      text: Iya! Wingi udan, aku neng omah wae.
      ar_eg: أيوه! امبارح كانت بتمطر، قعدت في البيت وخلاص.
      ar: نعم! أمطرت أمس، فبقيت في البيت.
      en: Yeah! It rained yesterday, I just stayed home.
    - speaker: Mohamed
      text: Sesuk ayo mlaku-mlaku neng taman, nek ora udan.
      ar_eg: بكرة يلا نتمشى في الجنينة، لو ما مطرتش.
      ar: غدًا هيّا نتمشّى في الحديقة، إذا لم تمطر.
      en: Let's go for a stroll in the park tomorrow, if it doesn't rain.
    - speaker: Dimas
      text: Sip! Nek udan, dolan neng omahku wae.
      ar_eg: تمام! لو مطرت، تعالى عندي البيت وخلاص.
      ar: ممتاز! وإن أمطرت، فتعالَ إلى بيتي.
      en: Great! If it rains, just come over to my place.
    - speaker: Mohamed
      text: Ayo! Aku seneng banget.
      ar_eg: ماشي! أنا مبسوط أوي.
      ar: اتفقنا! أنا سعيد جدًّا.
      en: Deal! I'm really happy.
