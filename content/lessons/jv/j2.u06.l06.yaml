schema: kabar.lesson/v1
id: j2.u06.l06
language: jv
title: Mancing neng kali
can_do:
  ar_eg: 'تروح تصطاد في نهر ماديون: الكوبري والغابة والأرض، العصافير والتعابين، والمانجة، وتقول إنك مكسوف.'
  ar: 'أن تذهب للصيد في نهر ماديون: الجسر والغابة والأرض، والطيور والثعابين، والمانجو، وتقول إنك محرج.'
  en: 'Go fishing on the Madiun river: bridge, forest and ground, birds and snakes, mangoes, and saying you''re embarrassed.'
slides:
  - title: Kali Madiun
    body:
      ar_eg: |
        - **mancing** = يصطاد سمك بالسنارة (memancing) · **kreteg** = كوبري (jembatan)
        - **alas** = غابة (hutan) · **lemah** = أرض، تراب (tanah). خلي بالك: في الإندونيسي lemah = ضعيف!
        - **manuk** = عصفور، طير (burung) · **ula** = تعبان (ular)
        - **pelem** = مانجة (mangga) · **wirang** = مكسوف أوي، اتفضح (malu)، أقوى من isin.
      ar: |
        - **mancing** = يصطاد السمك بالصنارة (memancing) · **kreteg** = جسر (jembatan)
        - **alas** = غابة (hutan) · **lemah** = أرض، تراب (tanah). انتبه: lemah بالإندونيسية = ضعيف!
        - **manuk** = طائر (burung) · **ula** = ثعبان (ular)
        - **pelem** = مانجو (mangga) · **wirang** = خجلٌ شديد وفضيحة (malu)، أقوى من isin.
      en: |
        - **mancing** = go fishing (memancing) · **kreteg** = bridge (jembatan)
        - **alas** = forest (hutan) · **lemah** = ground, soil (tanah). Careful: Indonesian lemah = weak!
        - **manuk** = bird (burung) · **ula** = snake (ular)
        - **pelem** = mango (mangga) · **wirang** = deeply embarrassed, ashamed (malu), stronger than isin.
    examples:
      - text: Minggu esuk ayo mancing neng kali!
        ar_eg: يلا نصطاد في النهر الحد الصبح!
        ar: هيّا نصطاد في النهر صباح الأحد!
        en: Let's go fishing at the river on Sunday morning!
      - text: Neng alas akeh manuk.
        ar_eg: في الغابة فيه عصافير كتير.
        ar: في الغابة طيور كثيرة.
        en: There are lots of birds in the forest.
      - text: Wit pelem neng pinggir kreteg.
        ar_eg: شجرة المانجة على حافة الكوبري.
        ar: شجرة المانجو عند طرف الجسر.
        en: The mango tree is by the bridge.
