  - id: e06
    type: fill_blank
    sentence: Semarang misuwur ___ Kutha Lumpia.
    meaning:
      ar_eg: سيمارانج مشهورة بإنها «مدينة اللومبيا».
      ar: تشتهر سيمارانج بوصفها «مدينة اللومبيا».
      en: Semarang is famous as the City of Lumpia.
    options: [minangka, kalebu, yaiku]
    answers: [minangka]
    words: [minangka, misuwur]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (بأسلوب المقالة) منارة كودوس من الأماكن المشهورة في جاوة الوسطى.
      ar: (بأسلوب المقالة) منارة كودوس من الأماكن المشهورة في جاوة الوسطى.
      en: (article style) The Menara Kudus is among the famous places of Central Java.
    answer: Menara Kudus kalebu papan kang misuwur ing Jawa Tengah.
    distractors: [neng, minangka]
    words: [kalebu, papan, kang]
