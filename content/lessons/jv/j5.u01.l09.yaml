dialogue:
  title: Artikel kanggo ing sepur
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, wacanen artikel iki ing sepur. Iki artikel Kudus.
      ar_eg: يا محمد، اقرا المقالة دي في القطر. دي مقالة عن كودوس.
      ar: يا محمد، اقرأ هذه المقالة في القطار. إنها مقالة عن كودوس.
      en: Mohamed, read this article on the train. It's an article about Kudus.
    - speaker: Mohamed
      text: Kudus iku sawijining kutha ing Jawa Tengah. Gampang!
      ar_eg: كودوس مدينة من مدن جاوة الوسطى. سهلة!
      ar: كودوس إحدى مدن جاوة الوسطى. سهل!
      en: Kudus is a city in Central Java. Easy!
    - speaker: Mbak Ayu
      text: Kudus misuwur minangka apa?
      ar_eg: كودوس مشهورة بإيه؟
      ar: بمَ تشتهر كودوس؟
      en: What is Kudus famous as?
    - speaker: Mohamed
      text: Ana menara lawas kang misuwur, yaiku Menara Kudus.
      ar_eg: فيها منارة قديمة مشهورة، هي منارة كودوس.
      ar: فيها منارة قديمة مشهورة، هي منارة كودوس.
      en: It has a famous old minaret, the Menara Kudus.
    - speaker: Mbak Ayu
      text: Pinter! Saiki kowe bisa maca Wikipedia basa Jawa.
      ar_eg: شاطر! دلوقتي تقدر تقرا ويكيبيديا الجاوية.
      ar: أحسنت! صار بإمكانك الآن قراءة ويكيبيديا الجاوية.
      en: Clever! Now you can read Javanese Wikipedia.
souvenir:
  id: j5.u01.souvenir
  title: Kutha Lama Semarang
  note:
    ar_eg: |
      كوتا لاما في سيمارانج حي هولندي قديم بيسموه «هولندا الصغيرة»: شوارع ضيقة، ومخازن قديمة، وكنيسة بلندوك (Gereja Blenduk) بقبّتها من القرن التمنتاشر. ومحطة تاوانج جنبه على طول. وعلى فكرة، ويكيبيديا الجاوية مكتوبة أغلبها بالنغوكو بكلمات ربط رسمية، ومجانية، يعني كنز قراية حقيقي ليك كل يوم.
    ar: |
      كوتا لاما في سيمارانج حيّ هولندي قديم يُسمّى «هولندا الصغيرة»: شوارع ضيقة ومخازن قديمة وكنيسة بلندوك (Gereja Blenduk) بقبّتها من القرن الثامن عشر، ومحطة تاوانغ بجواره. وويكيبيديا الجاوية مكتوبة في معظمها بالنغوكو مع أدوات ربط رسمية، وهي مجانية، فهي كنز قراءة حقيقي لك كل يوم.
    en: |
      Semarang's Kota Lama is an old Dutch quarter nicknamed "Little Netherlands": narrow streets, old warehouses and the domed Blenduk Church from the 18th century, with Tawang Station right next door. And Javanese Wikipedia, written mostly in ngoko with formal connectors, is free: a real reading treasure for you, every day.
