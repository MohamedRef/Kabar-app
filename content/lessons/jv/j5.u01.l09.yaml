schema: kabar.lesson/v1
id: j5.u01.l09
language: jv
title: Ulangan J5.1
can_do:
  ar_eg: تقرا مقالة جديدة.
  ar: أن تقرأ مقالة جديدة.
  en: Read a new article.
slides:
  - title: Artikel anyar, Kudus
    body:
      ar_eg: |
        مقالة جديدة عن مدينة تانية. استخدم الهيكل اللي اتعلمته: iku / yaiku (تعريف وتفصيل)، ana ing / ing (فين)، kang (وصف)، minangka (بصفته)، kalebu (من ضمن)، sawijining (واحد من).
        ولو قريتها بصوت عالي لصاحبك، رجّع ing لـ neng وkang لـ sing.
      ar: |
        مقالة جديدة عن مدينة أخرى. استعمل الهيكل الذي تعلمته: iku / yaiku (التعريف والتفصيل)، وana ing / ing (المكان)، وkang (الوصف)، وminangka (بوصفه)، وkalebu (من ضمن)، وsawijining (أحد).
        وإن حكيتها لصديقك فردّ ing إلى neng وkang إلى sing.
      en: |
        A new article about another city. Use the skeleton you've learned: iku / yaiku (definition and details), ana ing / ing (where), kang (description), minangka (as), kalebu (among), sawijining (one of).
        If you retell it to a friend, turn ing back into neng and kang into sing.
    grammar: jv.reading.written-style
    examples:
      - text: Kudus iku sawijining kutha ing Provinsi Jawa Tengah, ora adoh saka Semarang.
        ar_eg: كودوس مدينة من مدن محافظة جاوة الوسطى، مش بعيدة عن سيمارانج.
        ar: كودوس إحدى مدن إقليم جاوة الوسطى، غير بعيدة عن سيمارانج.
        en: Kudus is a city in Central Java Province, not far from Semarang.
      - text: Ing Kudus ana menara lawas kang misuwur, yaiku Menara Kudus.
        ar_eg: في كودوس منارة قديمة مشهورة، هي منارة كودوس.
        ar: في كودوس منارة قديمة مشهورة، هي منارة كودوس.
        en: In Kudus there is a famous old minaret, the Menara Kudus.
      - text: Menara Kudus kalebu papan kang misuwur ing Jawa Tengah.
        ar_eg: منارة كودوس من الأماكن المشهورة في جاوة الوسطى.
        ar: منارة كودوس من الأماكن المشهورة في جاوة الوسطى.
        en: The Menara Kudus is among the famous places of Central Java.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: iku
        ar_eg: هو / هي (= adalah، في الكتابة)
        ar: هو / هي (= adalah، في الكتابة)
        en: is (= adalah, in writing)
      - text: yaiku
        ar_eg: ألا وهو (= yaitu)
        ar: أي (= yaitu)
        en: namely (= yaitu)
      - text: ana ing
        ar_eg: موجود في (= terletak di)
        ar: يقع في (= terletak di)
        en: is located in (= terletak di)
      - text: kang
        ar_eg: اللي (= yang)
        ar: الذي (= yang)
        en: which, who (= yang)
      - text: minangka
        ar_eg: بصفته (= sebagai)
        ar: بوصفه (= sebagai)
        en: as (= sebagai)
      - text: kalebu
        ar_eg: من ضمن (= termasuk)
        ar: من ضمن (= termasuk)
        en: is among (= termasuk)
    words: [yaiku, ana ing, kang, minangka, kalebu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة بأسلوب المقالة؟
      ar: أي جملة بأسلوب المقالة؟
      en: Which sentence is in article style?
    options: ['Menara Kudus iku papan sing misuwur neng Jawa Tengah.', 'Menara Kudus iku papan sing misuwur nang Jawa Tengah.', 'Menara Kudus iku papan kang misuwur ing Jawa Tengah.']
    answer: 2
    explain:
      ar_eg: kang وing للكتابة، sing وneng وnang للكلام.
      ar: kang وing للكتابة، وsing وneng وnang للكلام.
      en: kang and ing are written; sing, neng and nang are spoken.
    words: [kang, misuwur]
  - id: e03
    type: listen
    text: Kudus iku sawijining kutha ing Provinsi Jawa Tengah, ora adoh saka Semarang.
    question:
      ar_eg: كودوس في أنهي محافظة؟
      ar: في أي إقليم تقع كودوس؟
      en: Which province is Kudus in?
    options: [Jawa Timur, Jawa Tengah, Jawa Barat]
    answer: 1
    meaning:
      ar_eg: كودوس مدينة من مدن محافظة جاوة الوسطى، مش بعيدة عن سيمارانج.
      ar: كودوس إحدى مدن إقليم جاوة الوسطى، غير بعيدة عن سيمارانج.
      en: Kudus is a city in Central Java Province, not far from Semarang.
    words: [sawijining, provinsi]
  - id: e04
    type: multiple_choice
    question: Ing Kudus ana menara lawas kang misuwur, yaiku Menara Kudus.
    question_meaning:
      ar_eg: إيه المشهور في كودوس حسب الجملة دي؟
      ar: ما المشهور في كودوس بحسب هذه الجملة؟
      en: According to this sentence, what is Kudus famous for?
    options: [menara lawas, sepur lawas, pesisir kidul]
    answer: 0
    words: [lawas, yaiku]
  - id: e05
    type: fill_blank
    sentence: Kudus ___ sawijining kutha ing Jawa Tengah.
    meaning:
      ar_eg: كودوس مدينة من مدن جاوة الوسطى.
      ar: كودوس إحدى مدن جاوة الوسطى.
      en: Kudus is a city in Central Java.
    options: [kang, iku, saka]
    answers: [iku]
    explain:
      ar_eg: iku هنا بتعرّف كودوس، زي adalah.
      ar: iku هنا تعرّف كودوس كـ adalah.
      en: iku defines Kudus here, like adalah.
