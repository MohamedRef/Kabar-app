schema: kabar.lesson/v1
id: j5.u01.l09
language: jv
title: Artikel Stasiun Madiun
can_do:
  ar_eg: تقرا مقالة قصيرة عن محطة ماديون وتفهم هي فين وقطراتها رايحة على فين.
  ar: أن تقرأ مقالة قصيرة عن محطة ماديون وتفهم موقعها ووجهات قطاراتها.
  en: Read a short article about Madiun Station and find where it is and where its trains go.
slides:
  - title: Stasiun Madiun
    body:
      ar_eg: |
        إنت دلوقتي واقف في محطة ماديون نفسها (اتفتحت سنة ١٨٨٢)، ودي مقالة قصيرة عنها بأسلوب ويكيبيديا الجاوية. مفيش كلمات جديدة، كله من الوحدة دي.
        دوّر على الهيكل: iku (تعريف)، ana ing (فين)، kang (وصف)، yaiku (تفصيل). وcedhak = قريب (dekat)، وkutha-kutha = مدن (التكرار = جمع).
      ar: |
        أنت الآن في محطة ماديون نفسها (افتُتحت سنة ١٨٨٢)، وهذه مقالة قصيرة عنها بأسلوب ويكيبيديا الجاوية. لا كلمات جديدة، فكلها من هذه الوحدة.
        ابحث عن الهيكل: iku (التعريف)، وana ing (المكان)، وkang (الوصف)، وyaiku (التفصيل). وcedhak = قريب (dekat)، وkutha-kutha = مدن (التكرار للجمع).
      en: |
        You're standing in Madiun Station itself (opened in 1882), and here is a short article about it in Javanese Wikipedia style. No new words: it's all from this unit.
        Find the skeleton: iku (definition), ana ing (where), kang (description), yaiku (details). cedhak = near (dekat), and kutha-kutha = cities (doubling makes a plural).
    grammar: jv.reading.written-style
    examples:
      - text: Stasiun Madiun iku stasiun sepur kang lawas lan misuwur ing Jawa Timur.
        ar_eg: محطة ماديون محطة قطر قديمة ومشهورة في جاوة الشرقية.
        ar: محطة ماديون محطة قطارات قديمة ومشهورة في جاوة الشرقية.
        en: Madiun Station is an old and famous railway station in East Java.
      - text: Stasiun iki ana ing cedhak pabrik sepur INKA, ora adoh saka Alun-alun.
        ar_eg: المحطة دي قريبة من مصنع القطرات INKA، ومش بعيدة عن الألون ألون.
        ar: تقع هذه المحطة قرب مصنع القطارات INKA، غير بعيدة عن الألون ألون.
        en: This station is near the INKA train factory, not far from the Alun-alun.
      - text: Saka Madiun ana sepur menyang kutha-kutha gedhe, yaiku Jakarta lan Yogya.
        ar_eg: من ماديون فيه قطرات رايحة مدن كبيرة، هي جاكرتا ويوجيا.
        ar: من ماديون قطارات إلى مدن كبيرة، هي جاكرتا ويوغيا.
        en: From Madiun there are trains to big cities, namely Jakarta and Yogya.
exercises:
  - id: e01
    type: listen
    text: Saka Madiun ana sepur menyang kutha-kutha gedhe, yaiku Jakarta lan Yogya.
    question:
      ar_eg: القطرات اللي من ماديون رايحة فين؟
      ar: إلى أين تذهب القطارات من ماديون؟
      en: Where do the trains from Madiun go?
    options: [Kudus lan Demak, Jakarta lan Yogya, Pacitan lan Ponorogo]
    answer: 1
    meaning:
      ar_eg: من ماديون فيه قطرات رايحة مدن كبيرة، هي جاكرتا ويوجيا.
      ar: من ماديون قطارات إلى مدن كبيرة، هي جاكرتا ويوغيا.
      en: From Madiun there are trains to big cities, namely Jakarta and Yogya.
    words: [sepur, yaiku]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: حسب المقالة، محطة ماديون قريبة من إيه؟
      ar: بحسب المقالة، قرب أي مكان تقع محطة ماديون؟
      en: According to the article, what is Madiun Station near?
    options: [Benteng Pendem, Kali Madiun, pabrik sepur INKA]
    answer: 2
    explain:
      ar_eg: «ana ing cedhak pabrik sepur INKA» = قريبة من مصنع القطرات INKA.
      ar: «ana ing cedhak pabrik sepur INKA» = تقع قرب مصنع القطارات INKA.
      en: '"ana ing cedhak pabrik sepur INKA" = it is near the INKA train factory.'
    words: [cedhak]
  - id: e03
    type: multiple_choice
    question: Stasiun Madiun iku stasiun sepur kang lawas lan misuwur ing Jawa Timur.
    question_meaning:
      ar_eg: أنهي كلمة هنا بتقدّم التعريف، زي adalah؟
      ar: أي كلمة هنا تقدّم التعريف كما تفعل adalah؟
      en: Which word here introduces the definition, like adalah?
    options: [iku, kang, ing]
    answer: 0
    explain:
      ar_eg: iku بين الاسم وتعريفه = adalah. kang = yang، وing = di.
      ar: iku بين الاسم وتعريفه = adalah، وkang = yang، وing = di.
      en: iku between a noun and its definition = adalah; kang = yang, ing = di.
    words: [iku, kang]
  - id: e04
    type: match_pairs
    pairs:
      - text: cedhak
        ar_eg: قريب
        ar: قريب
        en: near
      - text: adoh
        ar_eg: بعيد
        ar: بعيد
        en: far
      - text: misuwur
        ar_eg: مشهور
        ar: مشهور
        en: famous
      - text: kutha-kutha
        ar_eg: مدن
        ar: مدن
        en: cities
      - text: sepur
        ar_eg: قطر
        ar: قطار
        en: train
    words: [cedhak, adoh, misuwur, sepur]
  - id: e05
    type: fill_blank
    sentence: Stasiun iki ana ing cedhak pabrik sepur INKA, ora ___ saka Alun-alun.
    meaning:
      ar_eg: المحطة دي قريبة من مصنع القطرات INKA، ومش بعيدة عن الألون ألون.
      ar: تقع هذه المحطة قرب مصنع القطارات INKA، غير بعيدة عن الألون ألون.
      en: This station is near the INKA train factory, not far from the Alun-alun.
    options: [cedhak, adoh, lawas]
    answers: [adoh]
    words: [adoh]
  - id: e06
    type: dictation
    text: Stasiun Madiun ana ing cedhak pabrik INKA.
    meaning:
      ar_eg: محطة ماديون قريبة من مصنع INKA.
      ar: تقع محطة ماديون قرب مصنع INKA.
      en: Madiun Station is near the INKA factory.
    words: [cedhak]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (بأسلوب المقالة) ماديون مدينة قطرات مشهورة.
      ar: (بأسلوب المقالة) ماديون مدينة قطارات مشهورة.
      en: (article style) Madiun is a famous railway town.
    answer: Madiun iku kutha sepur kang misuwur.
    distractors: [adoh, lor]
    words: [misuwur, kang]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأسلوب المقالة) من ماديون فيه قطرات رايحة جاكرتا ويوجيا.
      ar: (بأسلوب المقالة) من ماديون قطارات إلى جاكرتا ويوغيا.
      en: (article style) From Madiun there are trains to Jakarta and Yogya.
    answers:
      - Saka Madiun ana sepur menyang Jakarta lan Yogya.
      - Saka Madiun ana sepur menyang Yogya lan Jakarta.
      - Saka Madiun ana sepur menyang Jakarta karo Yogya.
      - Saka Madiun ana sepur menyang Jakarta lan Yogyakarta.
      - Saka Madiun ana sepur menyang Jakarta lan menyang Yogya.
      - Ing Madiun ana sepur menyang Jakarta lan Yogya.
    words: [sepur]
dialogue:
  title: Ing ngarep Stasiun Madiun
  lines:
    - speaker: Mohamed
      text: Mbak, artikel iki ngomong saka Madiun ana sepur menyang Yogya.
      ar_eg: يا آيو، المقالة دي بتقول إن من ماديون فيه قطر رايح يوجيا.
      ar: يا آيو، تقول هذه المقالة إن من ماديون قطارًا إلى يوغيا.
      en: Ayu, this article says there are trains from Madiun to Yogya.
    - speaker: Mbak Ayu
      text: Bener. Saben dina ana sepur menyang Yogya lan Jakarta.
      ar_eg: صح. كل يوم فيه قطرات رايحة يوجيا وجاكرتا.
      ar: صحيح. كل يوم هناك قطارات إلى يوغيا وجاكرتا.
      en: Right. Every day there are trains to Yogya and Jakarta.
    - speaker: Mohamed
      text: Pabrik INKA cedhak saka kene, ta?
      ar_eg: مصنع INKA قريب من هنا، مش كده؟
      ar: مصنع INKA قريب من هنا، أليس كذلك؟
      en: The INKA factory is near here, isn't it?
    - speaker: Mbak Ayu
      text: Cedhak banget. Mlaku wae, ora adoh.
      ar_eg: قريبة جدًا. نمشي عادي، مش بعيدة.
      ar: قريبة جدًا. نمشي إليها، ليست بعيدة.
      en: Very near. We can just walk, it's not far.
    - speaker: Mohamed
      text: Ayo! Aku pengin weruh sepur anyar saka njaba.
      ar_eg: يلا! نفسي أشوف القطرات الجديدة من برّه.
      ar: هيا! أريد أن أرى القطارات الجديدة من الخارج.
      en: Let's go! I want to see the new trains from outside.
