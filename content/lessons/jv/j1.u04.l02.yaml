schema: kabar.lesson/v1
id: j1.u04.l02
language: jv
title: Ta, wae, lho, kok
can_do:
  ar_eg: تستخدم الكلمات الصغيرة بتاعة الشات.
  ar: أن تستعمل أدوات الدردشة الصغيرة.
  en: Use chat particles.
slides:
  - title: Ta? To?
    body:
      ar_eg: |
        الأدوات دي هي «البهارات» — من غيرها الجاوي بيبان ناشف. أغلبها في آخر الجملة.
        - to / ta = «ولا إيه؟ / مش كده؟» (= kan?). في يوجيا هتسمع to أكتر، وta كمان مسموعة في الشارع وفي ماديون.
        Kowe wis mangan to, cah? = كلت، مش كده يا صاحبي؟
        وكمان بتيجي بعد piye: Piye to? = إيه ده بقى؟ / يعني إيه؟
      ar: |
        هذه الأدوات كالتوابل، وبدونها تبدو الجاوية جافة، ويأتي أكثرها آخر الجملة.
        - to / ta = «أليس كذلك؟» (= kan?)، والأشيع في يوجيا to، وتُسمع ta أيضًا في الشارع وفي ماديون.
        Kowe wis mangan to, cah? = أكلتَ، أليس كذلك يا صاح؟
        وتأتي بعد piye: Piye to? = ما هذا إذن؟ / كيف يعني؟
      en: |
        These are the spices — without them Javanese sounds stiff. Most sit at the end.
        - to / ta = "…, right?" (= kan?). In Jogja you'll mostly hear to; ta is heard on the street too, and in Madiun.
        Kowe wis mangan to, cah? = You've eaten, right, mate?
        It also follows piye: Piye to? = So what's this, then?
    grammar: jv.particle.basic
    examples:
      - text: Kowe wis mangan to, cah?
        ar_eg: كلت ولا إيه يا صاحبي؟
        ar: أكلتَ، أليس كذلك يا صاح؟
        en: You've eaten, right, mate?
  - title: Wae
    body:
      ar_eg: |
        - wae = «بس» (= saja). في الكلام السريع بتتقال ae، بس wae هي اللي هتسمعها في يوجيا وماديون.
        Aku teh wae = أنا شاي بس. (في الأنجكرينجان)
        Ngene wae = كده وخلاص.
        نصيحة: to وwae وlho وya هم «الصوت» بتاع جاوي يوجيا وماديون.
      ar: |
        - wae = «فقط» (= saja)، وقد تُختصر في الكلام السريع ae، والمسموع في يوجيا وماديون wae.
        Aku teh wae = شايًا فقط من فضلك.
        Ngene wae = هكذا فحسب.
        وto وwae وlho وya هي نبرة جاوية يوجيا وماديون.
      en: |
        - wae = "just" (= saja). Fast speech may clip it to ae, but wae is what you'll hear in Jogja and Madiun.
        Aku teh wae = Just tea for me.
        Ngene wae = Just like this.
        Tip: to, wae, lho and ya are the sound of Jogja and Madiun Javanese.
    grammar: jv.particle.basic
    examples:
      - text: Aku teh wae.
        ar_eg: أنا شاي بس.
        ar: شايًا فقط من فضلك.
        en: Just tea for me.
  - title: Lho! Kok?!
    body:
      ar_eg: |
        - lho = «على فكرة! / خد بالك!»: Enak lho! = حلو على فكرة! وفي أول الجملة = «إيه ده!»: Lho, kowe neng kene? = إيه ده، إنت هنا؟
        - kok في **الأول** = «ليه كده؟! / إزاي؟» بدهشة: Kok larang? = غالي كده ليه؟! (larang = mahal)
        - kok في **الآخر** = بتطمّن: Ora apa-apa kok = مفيش حاجة والله.
        الاتنين موجودين في الإندونيسي العامي كمان، فإنت عارف الإحساس!
      ar: |
        - lho = للتنبيه «اعلم!»: Enak lho! = إنه لذيذ حقًا! وفي أول الجملة للدهشة: Lho, kowe neng kene? = ماذا! أأنت هنا؟
        - kok في **أول** الجملة للتعجب والاعتراض: Kok larang? = لماذا هو غالٍ هكذا؟! (larang = mahal)
        - kok في **آخرها** للطمأنة: Ora apa-apa kok = لا شيء، صدقني.
        وكلتاهما في الإندونيسية العامية أيضًا.
      en: |
        - lho = "you know! / look!": Enak lho! = It's really good, you know! At the start it's surprise: Lho, kowe neng kene? = Oh! You're here?
        - kok at the **start** = "how come?!": Kok larang? = Why so expensive?! (larang = mahal)
        - kok at the **end** reassures: Ora apa-apa kok = It's fine, really.
        Both exist in casual Indonesian too, so you know the feeling!
    grammar: jv.particle.basic
    examples:
      - text: Kok larang, Mas?
        ar_eg: غالي كده ليه يا معلم؟
        ar: لماذا هو غالٍ هكذا يا أخي؟
        en: How come it's so expensive, brother?
      - text: Ora apa-apa kok.
        ar_eg: مفيش حاجة والله.
        ar: لا بأس، صدقني.
        en: It's fine, really.
  - title: Ya, sik, mbok
    body:
      ar_eg: |
        - ya / yo = بتليّن الكلام: Aku mulih sik, ya = أنا هروّح بقى، ماشي؟ (mulih = pulang). الأمر من غير ya بيبان ناشف.
        - sik (sik، dhisik) بعد الفعل = «الأول»: Mangan sik = كُل الأول. ولوحدها: Sik! = استنى!
        - mbok (سولو / يوجيا) = «ما تـ…» بلطف: Mbok mangan sik = ما تاكل الأول!
        زي المصري: to ≈ «ولا إيه؟»، lho ≈ «على فكرة»، kok ≈ «إيه ده؟! ليه؟»، ya ≈ «ماشي؟»، mbok ≈ «ما تاكل!».
      ar: |
        - ya / yo لتلطيف الكلام: Aku mulih sik, ya = سأعود إلى البيت، حسنًا؟ (mulih = pulang)، والأمر بلا ya يبدو جافًا.
        - sik (sik، dhisik) بعد الفعل = «أولًا»: Mangan sik = كُل أولًا، ووحدها: Sik! = انتظر!
        - mbok (سولو / يوجيا) = حثّ لطيف: Mbok mangan sik = لِمَ لا تأكل أولًا؟
        وتقابلها في العامية: «ولا إيه؟» و«على فكرة» و«ليه كده؟!» و«ماشي؟» و«ما تاكل!».
      en: |
        - ya / yo softens: Aku mulih sik, ya = I'm heading home now, OK? (mulih = pulang). A bare command sounds harsh.
        - sik (sik, dhisik) after a verb = "first": Mangan sik = Eat first. Alone: Sik! = Hold on!
        - mbok (Solo, Yogya) = gentle "why don't you": Mbok mangan sik = Why don't you eat first?
        Egyptian twins: to ≈ «ولا إيه؟», lho ≈ «على فكرة», kok ≈ «إيه ده؟! ليه؟», ya ≈ «ماشي؟», mbok ≈ «ما تاكل!».
    grammar: jv.particle.basic
    examples:
      - text: Aku mulih sik, ya.
        ar_eg: أنا هروّح بقى، ماشي؟
        ar: سأعود إلى البيت الآن، حسنًا؟
        en: I'm heading home now, OK?
      - text: Mbok mangan sik.
        ar_eg: ما تاكل الأول! (وسط جاوة)
        ar: لِمَ لا تأكل أولًا؟ (وسط جاوة)
        en: Why don't you eat first? (Central Java)
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إنت في الأنجكرينجان وعايز تطلب شاي وبس. تقول إيه؟
      ar: أنت في الأنجكرينجان وتريد شايًا فقط. ماذا تقول؟
      en: You're at the angkringan and want just tea. What do you say?
    options: [Mbok mangan sik., Aku teh wae., 'Kok larang?']
    answer: 1
    explain:
      ar_eg: wae = بس (saja). mbok = ما تـ…، وkok = ليه كده؟!
      ar: wae = فقط (saja)، وmbok للحثّ، وkok للتعجب.
      en: wae = just (saja); mbok nudges, kok asks "how come?!".
    words: [wae, mbok, kok, larang]
  - id: e02
    type: listen
    text: Kurmane enak lho!
    options: [Kurmane enak lho!, 'Minyak wangine enak to?', 'Kok kurmane larang?', Mbok tuku kurmane.]
    answer: 0
    words: [lho, kurma, minyak wangi, ta, kok, larang, mbok]
  - id: e03
    type: fill_blank
    sentence: Aku mulih ___, cah.
    meaning:
      ar_eg: أنا هروّح وخلاص يا جماعة.
      ar: سأعود إلى البيت فحسب يا رفاق.
      en: I'll just head home, guys.
    options: [wae, mbok, lho]
    answers: [wae]
    explain:
      ar_eg: wae = saja (بس / وخلاص).
      ar: wae = saja (فحسب).
      en: wae = saja (just).
    words: [mulih, wae, cah]
  - id: e04
    type: build_sentence
    source:
      ar_eg: كلت، مش كده يا صاحبي؟
      ar: أكلتَ، أليس كذلك يا صاح؟
      en: You've eaten, right, mate?
    answer: Kowe wis mangan ta, cah?
    distractors: [kok, lho]
    words: [kowe, wis, mangan, ta, cah]
  - id: e05
    type: match_pairs
    pairs:
      - text: ta
        ar_eg: ولا إيه؟ (= to)
        ar: أليس كذلك؟ (= to)
        en: right? (= to)
      - text: wae
        ar_eg: بس
        ar: فقط
        en: just
      - text: lho
        ar_eg: على فكرة! / إيه ده!
        ar: انتبه! / يا للعجب!
        en: you know! / whoa!
      - text: mbok
        ar_eg: ما تـ… (حثّ لطيف)
        ar: هلّا… (حثّ لطيف)
        en: why don't you… (gentle nudge)
      - text: mulih
        ar_eg: يروّح البيت
        ar: يعود إلى البيت
        en: go home
      - text: minyak wangi
        ar_eg: برفان
        ar: عطر
        en: perfume
    words: [ta, wae, lho, mbok, mulih, minyak wangi]
  - id: e06
    type: speaking
    text: Lho, minyak wangine kok larang, Mas?
    meaning:
      ar_eg: إيه ده، البرفان غالي كده ليه يا معلم؟
      ar: يا للعجب، لماذا العطر غالٍ هكذا يا أخي؟
      en: Whoa, how come the perfume's so expensive, Mas?
    words: [lho, minyak wangi, kok, larang, mas]
  - id: e07
    type: multiple_choice
    question: Mbok mulih sik.
    question_meaning:
      ar_eg: مامة صاحبك قالتلك كده بالليل. تقصد إيه بالإندونيسي؟
      ar: قالت لك والدة صديقك هذا ليلًا. ماذا تقصد بالإندونيسية؟
      en: Your friend's mum says this at night. What does she mean in Indonesian?
    options: ['Pulang dulu, ya.', 'Makan dulu, ya.', 'Tidur dulu, ya.']
    answer: 0
    explain:
      ar_eg: mbok = ما تـ… (حثّ لطيف)، mulih = pulang، sik = dulu.
      ar: mbok للحثّ اللطيف، وmulih = pulang، وsik = dulu.
      en: mbok is a gentle nudge, mulih = pulang, sik = dulu.
    words: [mbok, mulih, sik]
dialogue:
  title: Minyak wangi neng Jakal
  lines:
    - speaker: Mohamed
      text: Pak, minyak wangi regane pira?
      ar_eg: يا حاج، البرفان ده بكام؟
      ar: يا سيدي، بكم العطر؟
      en: Sir, how much is the perfume?
    - speaker: Pak Hasan
      text: Seratus ribu, Mas.
      ar_eg: مية ألف يا ابني. (بالإندونيسي)
      ar: مئة ألف يا بنيّ. (بالإندونيسية)
      en: A hundred thousand. (in Indonesian)
    - speaker: Mohamed
      text: Kok larang, Pak?
      ar_eg: غالي كده ليه يا حاج؟
      ar: لماذا هو غالٍ هكذا يا سيدي؟
      en: How come it's so expensive, sir?
    - speaker: Pak Hasan
      text: Asli lho, Mas!
      ar_eg: ده أصلي على فكرة!
      ar: إنه أصلي، اعلم ذلك!
      en: It's the real thing, you know!
    - speaker: Mas Heru
      text: Kowe wis mangan to, cah? Ayo mangan sik!
      ar_eg: إنت كلت ولا إيه يا صاحبي؟ يلا ناكل الأول!
      ar: أكلتَ، أليس كذلك يا صاح؟ هيا نأكل أولًا!
      en: You've eaten, right, mate? Come on, let's eat first!
    - speaker: Mohamed
      text: Durung. Ayo! Matur nuwun, Pak.
      ar_eg: لسه. يلا! شكرًا يا حاج.
      ar: ليس بعد. هيا! شكرًا يا سيدي.
      en: Not yet. Let's go! Thank you, sir.
new_words:
  - word: ta
    pos: particle
    ar_eg: ولا إيه؟ (= kan؛ وفي يوجيا أكتر to)
    ar: أليس كذلك؟ (= kan؛ والأشيع في يوجيا to)
    en: …, right? (= kan; Jogja mostly says to)
  - word: wae
    pos: particle
    ar_eg: بس (= saja)
    ar: فقط (= saja)
    en: just (= saja)
  - word: lho
    pos: particle
    ar_eg: على فكرة! / إيه ده!
    ar: للتنبيه أو الدهشة
    en: you know! / oh!
  - word: kok
    pos: particle
    ar_eg: ليه كده؟! (في الأول) / والله (في الآخر)
    ar: للتعجب (في الأول) / للطمأنة (في الآخر)
    en: how come?! (first) / really (last)
  - word: mbok
    pos: particle
    ar_eg: ما تـ… (حثّ لطيف، وسط جاوة)
    ar: لِمَ لا… (حثّ لطيف، وسط جاوة)
    en: why don't you… (gentle push, Central Java)
  - word: larang
    pos: adjective
    ar_eg: غالي (= mahal)
    ar: غالٍ (= mahal)
    en: expensive (= mahal)
  - word: mulih
    pos: verb
    ar_eg: يروّح البيت (= pulang)
    ar: يعود إلى البيت (= pulang)
    en: to go home (= pulang)
  - word: minyak wangi
    pos: noun
    ar_eg: برفان، ريحة
    ar: عطر
    en: perfume
