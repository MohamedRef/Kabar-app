schema: kabar.lesson/v1
id: j1.u04.l02
language: jv
title: Ta, ae, lho, kok
can_do:
  ar_eg: تستخدم الكلمات الصغيرة بتاعة الشات.
  ar: أن تستعمل أدوات الدردشة الصغيرة.
  en: Use chat particles.
slides:
  - title: Ta? To?
    body:
      ar_eg: |
        الأدوات دي هي «البهارات» — من غيرها الجاوي بيبان ناشف. أغلبها في آخر الجملة.
        - ta (سورابايا، Arek) / to (سولو ويوجيا) = «ولا إيه؟ / مش كده؟» (= kan?)
        Koen wis mangan ta, rek? = كلت، مش كده يا صاحبي؟
        وبالجاوي العادي: Kowe wis mangan to?
      ar: |
        هذه الأدوات كالتوابل، وبدونها تبدو الجاوية جافة، ويأتي أكثرها آخر الجملة.
        - ta (سورابايا، Arek) / to (سولو ويوجيا) = «أليس كذلك؟» (= kan?)
        Koen wis mangan ta, rek? = أكلتَ، أليس كذلك يا صاح؟
        وبالجاوية القياسية: Kowe wis mangan to?
      en: |
        These are the spices — without them Javanese sounds stiff. Most sit at the end.
        - ta (Surabaya, Arek) / to (Solo, Yogya) = "…, right?" (= kan?)
        Koen wis mangan ta, rek? = You've eaten, right, mate?
        Standard ngoko: Kowe wis mangan to?
    grammar: jv.particle.basic
    examples:
      - text: Koen wis mangan ta, rek?
        ar_eg: كلت ولا إيه يا صاحبي؟ (Arek)
        ar: أكلتَ، أليس كذلك يا صاح؟ (Arek)
        en: You've eaten, right, mate? (Arek)
  - title: Ae / wae
    body:
      ar_eg: |
        - ae (سورابايا) / wae (العادية) = «بس» (= saja).
        Aku teh ae = أنا شاي بس. (في القهوة)
        Ngene wae = كده وخلاص.
        نصيحة: ta وae علامات سورابايا، to وwae علامات وسط جاوة.
      ar: |
        - ae (سورابايا) / wae (القياسية) = «فقط» (= saja).
        Aku teh ae = شايًا فقط من فضلك.
        Ngene wae = هكذا فحسب.
        وta وae من علامات سورابايا، وto وwae من علامات وسط جاوة.
      en: |
        - ae (Surabaya) / wae (standard) = "just" (= saja).
        Aku teh ae = Just tea for me.
        Ngene wae = Just like this.
        Tip: ta and ae signal Surabaya; to and wae signal Central Java.
    grammar: jv.particle.basic
    examples:
      - text: Aku teh ae.
        ar_eg: أنا شاي بس. (Arek)
        ar: شايًا فقط من فضلك. (Arek)
        en: Just tea for me. (Arek)
  - title: Lho! Kok?!
    body:
      ar_eg: |
        - lho = «على فكرة! / خد بالك!»: Enak lho! = حلو على فكرة! وفي أول الجملة = «إيه ده!»: Lho, kowe nang kene? = إيه ده، إنت هنا؟
        - kok في **الأول** = «ليه كده؟! / إزاي؟» بدهشة: Kok larang? = غالي كده ليه؟! (larang = mahal)
        - kok في **الآخر** = بتطمّن: Ora apa-apa kok = مفيش حاجة والله.
        الاتنين موجودين في الإندونيسي العامي كمان، فإنت عارف الإحساس!
      ar: |
        - lho = للتنبيه «اعلم!»: Enak lho! = إنه لذيذ حقًا! وفي أول الجملة للدهشة: Lho, kowe nang kene? = ماذا! أأنت هنا؟
        - kok في **أول** الجملة للتعجب والاعتراض: Kok larang? = لماذا هو غالٍ هكذا؟! (larang = mahal)
        - kok في **آخرها** للطمأنة: Ora apa-apa kok = لا شيء، صدقني.
        وكلتاهما في الإندونيسية العامية أيضًا.
      en: |
        - lho = "you know! / look!": Enak lho! = It's really good, you know! At the start it's surprise: Lho, kowe nang kene? = Oh! You're here?
        - kok at the **start** = "how come?!": Kok larang? = Why so expensive?! (larang = mahal)
        - kok at the **end** reassures: Ora apa-apa kok = It's fine, really.
        Both exist in casual Indonesian too, so you know the feeling!
    grammar: jv.particle.basic
    examples:
      - text: Kok larang, Cak?
        ar_eg: غالي كده ليه يا معلم؟
        ar: لماذا هو غالٍ هكذا يا أخي؟
        en: How come it's so expensive, brother?
      - text: Ora apa-apa kok.
        ar_eg: مفيش حاجة والله.
        ar: لا بأس، صدقني.
        en: It's fine, really.
  - title: Ya, sek, mbok
    body:
      ar_eg: |
        - ya / yo = بتليّن الكلام: Aku mulih sek, ya = أنا هروّح بقى، ماشي؟ (mulih = pulang). الأمر من غير ya بيبان ناشف.
        - sek (sik، dhisik) بعد الفعل = «الأول»: Mangan sek = كُل الأول. ولوحدها: Sek! = استنى!
        - mbok (سولو / يوجيا) = «ما تـ…» بلطف: Mbok mangan sek = ما تاكل الأول!
        زي المصري: ta ≈ «ولا إيه؟»، lho ≈ «على فكرة»، kok ≈ «إيه ده؟! ليه؟»، ya ≈ «ماشي؟»، mbok ≈ «ما تاكل!».
      ar: |
        - ya / yo لتلطيف الكلام: Aku mulih sek, ya = سأعود إلى البيت، حسنًا؟ (mulih = pulang)، والأمر بلا ya يبدو جافًا.
        - sek (sik، dhisik) بعد الفعل = «أولًا»: Mangan sek = كُل أولًا، ووحدها: Sek! = انتظر!
        - mbok (سولو / يوجيا) = حثّ لطيف: Mbok mangan sek = لِمَ لا تأكل أولًا؟
        وتقابلها في العامية: «ولا إيه؟» و«على فكرة» و«ليه كده؟!» و«ماشي؟» و«ما تاكل!».
      en: |
        - ya / yo softens: Aku mulih sek, ya = I'm heading home now, OK? (mulih = pulang). A bare command sounds harsh.
        - sek (sik, dhisik) after a verb = "first": Mangan sek = Eat first. Alone: Sek! = Hold on!
        - mbok (Solo, Yogya) = gentle "why don't you": Mbok mangan sek = Why don't you eat first?
        Egyptian twins: ta ≈ «ولا إيه؟», lho ≈ «على فكرة», kok ≈ «إيه ده؟! ليه؟», ya ≈ «ماشي؟», mbok ≈ «ما تاكل!».
    grammar: jv.particle.basic
    examples:
      - text: Aku mulih sek, ya.
        ar_eg: أنا هروّح بقى، ماشي؟
        ar: سأعود إلى البيت الآن، حسنًا؟
        en: I'm heading home now, OK?
      - text: Mbok mangan sek.
        ar_eg: ما تاكل الأول! (وسط جاوة)
        ar: لِمَ لا تأكل أولًا؟ (وسط جاوة)
        en: Why don't you eat first? (Central Java)
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها نكهة سورابايا (Arek)؟
      ar: أيّ جملة فيها طابع سورابايا (Arek)؟
      en: Which sentence has the Surabaya (Arek) flavour?
    options: [Mbok mangan sek., Aku teh ae., Aku teh wae.]
    answer: 1
    explain:
      ar_eg: ae علامة سورابايا. wae وmbok من وسط جاوة.
      ar: ae من علامات سورابايا، وwae وmbok من وسط جاوة.
      en: ae is Surabaya; wae and mbok are Central Javanese.
    words: [ae]
  - id: e02
    type: listen
    text: Kurmane enak lho!
    options: [Kurmane enak lho!, 'Kurmane enak ta?', 'Kok kurmane larang?']
    answer: 0
    words: [lho, kurma]
  - id: e03
    type: fill_blank
    sentence: Ora apa-apa ___.
    meaning:
      ar_eg: مفيش حاجة والله. (بتطمّن حد)
      ar: لا بأس، صدقني. (للطمأنة)
      en: It's fine, really. (reassuring someone)
    options: [ae, kok, ta]
    answers: [kok]
    explain:
      ar_eg: kok في آخر الجملة بتطمّن.
      ar: kok في آخر الجملة للطمأنة.
      en: kok at the end reassures.
    words: [kok]
  - id: e04
    type: build_sentence
    source:
      ar_eg: كلت، مش كده يا صاحبي؟ (سورابايا)
      ar: أكلتَ، أليس كذلك يا صاح؟ (سورابايا)
      en: You've eaten, right, mate? (Surabaya)
    answer: Koen wis mangan ta, rek?
    distractors: [kok, lho]
    words: [koen, wis, mangan, ta, rek]
  - id: e05
    type: translate
    direction: from_target
    source_text: Aku mulih sek, ya.
    answers_meaning:
      ar_eg: [أنا هروّح بقى، ماشي؟, أنا مروّح، ماشي؟, هروّح الأول، ماشي؟, أنا هروّح، ماشي]
      ar: [سأعود إلى البيت الآن، حسنًا؟, سأذهب إلى البيت، اتفقنا؟, سأعود إلى البيت أولًا، حسنًا؟]
      en: ['I''m heading home now, OK?', 'I''m going home first, OK?', 'I''ll head home now, OK?', 'I''m off home, OK?']
    explain:
      ar_eg: mulih = pulang، sek = الأول، ya = ماشي؟
      ar: mulih = pulang، وsek = أولًا، وya = حسنًا؟
      en: mulih = pulang, sek = first, ya = OK?
    words: [mulih, sek]
  - id: e06
    type: speaking
    text: Kok larang, Cak?
    meaning:
      ar_eg: غالي كده ليه يا معلم؟
      ar: لماذا هو غالٍ هكذا يا أخي؟
      en: How come it's so expensive, brother?
    words: [kok, larang]
dialogue:
  title: Minyak wangi nang Ampel
  lines:
    - speaker: Mohamed
      text: Pak, minyak wangi regane pira?
      ar_eg: يا حاج، البرفان ده بكام؟
      ar: يا سيدي، بكم العطر؟
      en: Sir, how much is the perfume?
    - speaker: Pak Hasan
      text: Seratus ribu, Mas.
      ar_eg: مية ألف يا ابني. (بالإندونيسي)
      ar: مئة ألف يا بنيّ. (بالإندونيسية)
      en: A hundred thousand. (in Indonesian)
    - speaker: Mohamed
      text: Kok larang, Pak?
      ar_eg: غالي كده ليه يا حاج؟
      ar: لماذا هو غالٍ هكذا يا سيدي؟
      en: How come it's so expensive, sir?
    - speaker: Pak Hasan
      text: Asli lho, Mas!
      ar_eg: ده أصلي على فكرة!
      ar: إنه أصلي، اعلم ذلك!
      en: It's the real thing, you know!
    - speaker: Cak Heru
      text: Koen wis mangan ta, rek? Ayo mangan sek!
      ar_eg: إنت كلت ولا إيه يا صاحبي؟ يلا ناكل الأول!
      ar: أكلتَ، أليس كذلك يا صاح؟ هيا نأكل أولًا!
      en: You've eaten, right, mate? Come on, let's eat first!
    - speaker: Mohamed
      text: Durung. Ayo! Matur nuwun, Pak.
      ar_eg: لسه. يلا! شكرًا يا حاج.
      ar: ليس بعد. هيا! شكرًا يا سيدي.
      en: Not yet. Let's go! Thank you, sir.
new_words:
  - word: ta
    pos: particle
    ar_eg: ولا إيه؟ (Arek؛ والعادي to = kan?)
    ar: أليس كذلك؟ (Arek؛ والقياسي to = kan?)
    en: …, right? (Arek; standard to = kan?)
  - word: ae
    pos: particle
    ar_eg: بس (Arek؛ والعادي wae = saja)
    ar: فقط (Arek؛ والقياسي wae = saja)
    en: just (Arek; standard wae = saja)
  - word: lho
    pos: particle
    ar_eg: على فكرة! / إيه ده!
    ar: للتنبيه أو الدهشة
    en: you know! / oh!
  - word: kok
    pos: particle
    ar_eg: ليه كده؟! (في الأول) / والله (في الآخر)
    ar: للتعجب (في الأول) / للطمأنة (في الآخر)
    en: how come?! (first) / really (last)
  - word: mbok
    pos: particle
    ar_eg: ما تـ… (حثّ لطيف، وسط جاوة)
    ar: لِمَ لا… (حثّ لطيف، وسط جاوة)
    en: why don't you… (gentle push, Central Java)
  - word: larang
    pos: adjective
    ar_eg: غالي (= mahal)
    ar: غالٍ (= mahal)
    en: expensive (= mahal)
  - word: mulih
    pos: verb
    ar_eg: يروّح البيت (= pulang)
    ar: يعود إلى البيت (= pulang)
    en: to go home (= pulang)
  - word: minyak wangi
    pos: noun
    ar_eg: برفان، ريحة
    ar: عطر
    en: perfume
