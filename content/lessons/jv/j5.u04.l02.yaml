      ar: كيف تفصل هذه الكلمة؟
      en: How do you split this word?
    options: [di- + share, dis- + hare, dish + are]
    answer: 0
    explain:
      ar_eg: di- بادئة المجهول الجاوي، وshare إنجليزي. dishare = اتشيّر.
      ar: "di- سابقة المجهول الجاوية، وshare إنجليزية: dishare = شوركَ."
      en: di- is the Javanese passive prefix; share is English. dishare = got shared.
