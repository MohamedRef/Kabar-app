schema: kabar.lesson/v1
id: j5.u04.l02
language: jv
title: Dishare, HP-ne
can_do:
  ar_eg: تقرا البادئات والنهايات الجاوي على كلمات أجنبي.
  ar: أن تقرأ السوابق واللواحق الجاوية على كلمات أجنبية.
  en: Read Javanese affixes on foreign words.
slides:
  - title: Ater-ater Jawa, tembung manca
    body:
      ar_eg: |
        الجاوي «بيبلع» الكلمة الأجنبية ويحطلها بادئاته: di- + share = dishare (اتشيّر)، tak + follow = tak follow (أنا هتابعه / تابعته).
        زي ما إحنا بنقول «شيّرته» و«عملتله فولو»: تصريف عربي على كلمة إنجليزي. لما تلاقي dishare متدوّرش عليها في القاموس الجاوي: افصلها الأول، di- + share.
      ar: |
        تبتلع الجاوية الكلمة الأجنبية وتُلبسها سوابقها: di- + share = dishare (شوركت)، وtak + follow = tak follow (أتابعه).
        كما نقول «شيّرته» و«عملتله فولو»: تصريف عربي على جذر إنجليزي. فإذا صادفت dishare فلا تبحث عنها في المعجم الجاوي، بل افصلها أولًا: di- + share.
      en: |
        Javanese swallows foreign words and gives them its own prefixes: di- + share = dishare (got shared), tak + follow = tak follow (I'll follow / I followed).
        Like Egyptian «شيّرته», «عملتله فولو»: Arabic grammar on an English word. When you see dishare, don't look it up in a Javanese dictionary; split it first: di- + share.
    grammar: jv.codemix
    examples:
      - text: Videone wis dishare neng grup.
        ar_eg: الفيديو اتشيّر على الجروب.
        ar: شوركَ الفيديو في المجموعة.
        en: The video has been shared in the group.
      - text: Akunmu wis tak follow.
        ar_eg: تابعت أكونتك خلاص.
        ar: تابعتُ حسابك.
        en: I've followed your account.
  - title: HP-ne, videone
    body:
      ar_eg: |
        والنهاية -ne / -e (بتاعه / الـ…) بتلزق في أي كلمة: HP-ne = الموبايل، videone = الفيديو، laptop-e = اللابتوب.
        وفيه اختصارات إندونيسي كتير: bgt = banget (أوي)، udh = sudah، blm = belum.
        وكلمة قديمة صاحبتنا: kabari = بلّغه / عرّفه (من kabar ← «خبر»). tak kabari = هبلّغك.
      ar: |
        وتلتصق اللاحقة -ne / -e (أداة التعريف أو الإضافة) بأي كلمة: HP-ne = الهاتف، وvideone = الفيديو، وlaptop-e = الحاسوب المحمول.
        وتكثر الاختصارات الإندونيسية: bgt = banget (جدًا)، وudh = sudah، وblm = belum.
        وصديقة قديمة: kabari = أخبِره (من kabar ← «خبر»)، وtak kabari = سأخبرك.
      en: |
        The ending -ne / -e (the, his) sticks to any word: HP-ne = the phone, videone = the video, laptop-e = the laptop.
        Indonesian shorthand is everywhere: bgt = banget (really), udh = sudah, blm = belum.
        And an old friend: kabari = let someone know (from kabar ← «خبر»). tak kabari = I'll let you know.
    grammar: jv.codemix
    examples:
      - text: HP-ne lowbat, mengko tak kabari.
        ar_eg: الموبايل فاصل شحن، هبقى أبلّغك بعدين.
        ar: بطارية الهاتف ضعيفة، سأخبرك لاحقًا.
        en: My phone's battery is low; I'll let you know later.
      - text: Videone apik bgt, ojo lali like.
        ar_eg: الفيديو حلو أوي، ماتنساش اللايك.
        ar: الفيديو رائع جدًا، لا تنسَ الإعجاب.
        en: The video is really good, don't forget to like it.
