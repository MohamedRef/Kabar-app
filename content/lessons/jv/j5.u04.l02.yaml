dialogue:
  title: Videone wis dishare?
  lines:
    - speaker: Mohamed
      text: Mas, videone wis dishare?
      ar_eg: يا يودا، الفيديو اتشيّر؟
      ar: يا يودا، هل شُورك الفيديو؟
      en: Yudha, has the video been shared?
    - speaker: Mas Yudha
      text: Durung. HP-ne lowbat. Mengko tak kabari.
      ar_eg: لسه. الموبايل فاصل شحن. هبلّغك بعدين.
      ar: ليس بعد. بطارية الهاتف ضعيفة. سأخبرك لاحقًا.
      en: Not yet. My phone's battery is low. I'll let you know later.
    - speaker: Mohamed
      text: Oke. Akunmu wis tak follow.
      ar_eg: ماشي. تابعت أكونتك خلاص.
      ar: حسنًا. تابعتُ حسابك.
      en: Okay. I've followed your account.
    - speaker: Mas Yudha
      text: Suwun, bro!
      ar_eg: شكرًا يا صاحبي!
      ar: شكرًا يا صديقي!
      en: Thanks, bro!
