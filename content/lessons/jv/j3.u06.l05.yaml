schema: kabar.lesson/v1
id: j3.u06.l05
language: jv
title: Mangga dipunjajal
can_do:
  ar_eg: 'تجرّب ترسم باتيك في ورشة في لاويان: الموتيفات والقماش التخين، والصبر والطول بال.'
  ar: 'أن تجرّب رسم الباتيك في ورشة في لاوِيان: الزخارف والقماش السميك، والصبر والإتقان.'
  en: 'Try drawing batik in a Laweyan workshop: motifs, thick cloth, patience and care.'
slides:
  - title: Kedah tlaten
    body:
      ar_eg: |
        في ورشة الباتيك:
        - kembang ← sekar = وردة، زهرة (موتيف مشهور). warisan = تراث، ورث.
        - njajal (jajal) = يجرّب: «Mangga dipunjajal!» = اتفضل جرّب! (dipun- = مبني للمجهول بالكراما)
        ngolah = يحضّر، يجهّز الخامة (زي الشمع والصبغة).
        garing = ناشف. kandel = تخين (عكس tipis). jembar = واسع.
        tlaten = صبور وبيعمل الحاجة بدقة. الباتيك بالإيد محتاج حد tlaten!
      ar: |
        في ورشة الباتيك:
        - kembang ← sekar = زهرة (زخرفة مشهورة). warisan = تراث، ورث.
        - njajal (jajal) = يجرّب: «Mangga dipunjajal!» = تفضّل جرّب! (dipun- = المبني للمجهول بالكراما)
        ngolah = يعالج المادة ويجهّزها (كالشمع والصبغة).
        garing = جاف. kandel = سميك (ضد tipis). jembar = واسع.
        tlaten = صبور ومتقن. الباتيك اليدوي يحتاج إلى شخص tlaten!
      en: |
        In the batik workshop:
        - kembang → sekar = flower (a famous motif). warisan = heritage, inheritance.
        - njajal (jajal) = try: "Mangga dipunjajal!" = go ahead, try it! (dipun- = krama passive)
        ngolah = process, prepare (materials like wax and dye).
        garing = dry. kandel = thick (opposite tipis). jembar = wide, spacious.
        tlaten = patient and meticulous. Hand-drawn batik needs someone tlaten!
    examples:
      - text: Mangga dipunjajal, Mas!
        ar_eg: اتفضل جرّب يا أستاذ!
        ar: تفضّل جرّب!
        en: Go ahead, give it a try!
      - text: Motif sekar lan wit endah sanget.
        ar_eg: موتيف الورد والشجر حلو أوي.
        ar: زخرفة الزهور والأشجار جميلة جدًا.
        en: The flower and tree motif is beautiful.
      - text: Damel batik tulis kedah tlaten.
        ar_eg: عمل الباتيك بالإيد محتاج صبر ودقة.
        ar: صنع الباتيك اليدوي يحتاج إلى صبر وإتقان.
        en: Making hand-drawn batik takes patience and care.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: garing
        ar_eg: ناشف
        ar: جاف
        en: dry
      - text: ngolah
        ar_eg: يحضّر، يجهّز
        ar: يعالج، يجهّز
        en: process, prepare
      - text: njajal
        ar_eg: يجرّب
        ar: يجرّب
        en: try
      - text: tlaten
        ar_eg: صبور ودقيق
        ar: صبور ومتقن
        en: patient, meticulous
    words: [garing, ngolah, njajal, tlaten]
  - id: e02
    type: match_pairs
    pairs:
      - text: sekar
        ar_eg: وردة (كراما)
        ar: زهرة (كراما)
        en: flower (krama)
      - text: warisan
        ar_eg: تراث
        ar: تراث
        en: heritage
      - text: jembar
        ar_eg: واسع
        ar: واسع
        en: wide, spacious
      - text: kandel
        ar_eg: تخين
        ar: سميك
        en: thick
    words: [sekar, warisan, jembar, kandel]
  - id: e03
    type: listen
    text: Kainipun sampun garing.
    question:
      ar_eg: القماش عامل إيه؟
      ar: ما حال القماش؟
      en: How is the cloth?
    options: [القماش لسه مبلول, القماش نشف, القماش تخين]
    answer: 1
    meaning:
      ar_eg: القماش نشف خلاص.
      ar: جفّ القماش.
      en: The cloth is dry now.
    words: [garing]
  - id: e04
    type: fill_blank
    sentence: Damel batik tulis kedah ___.
    meaning:
      ar_eg: عمل الباتيك بالإيد محتاج حد ___.
      ar: صنع الباتيك اليدوي يحتاج إلى شخص ___.
      en: Making hand-drawn batik takes someone ___.
    options: [tlaten, kandel, jembar]
    answers: [tlaten]
    words: [tlaten, kandel, jembar]
  - id: e05
    type: multiple_choice
    question: Kembang (ngoko) → ___ (krama)
    options: [warisan, sekar, garing]
    answer: 1
    explain:
      ar_eg: kembang ← sekar = وردة، زهرة.
      ar: kembang ← sekar = زهرة.
      en: kembang → sekar = flower.
    words: [sekar, warisan, garing]
  - id: e06
    type: fill_blank
    sentence: Griya saudagar batik menika ___ sanget, wonten pendhapa ageng.
    meaning:
      ar_eg: بيت تاجر الباتيك ده ___ أوي، فيه بندابا كبيرة.
      ar: بيت تاجر الباتيك هذا ___ جدًا، وفيه جناح كبير.
      en: This batik merchant's house is very ___, with a big pendhapa.
    options: [jembar, garing, warisan]
    answers: [jembar]
    words: [jembar, garing, tlaten, warisan]
  - id: e07
    type: build_sentence
    source:
      ar_eg: اتفضل جرّب بالكانتينج.
      ar: تفضّل جرّب بالتشانتينج.
      en: Go ahead, try it with the canthing.
    answer: Mangga dipunjajal ngangge canthing.
    distractors: [sekar, wit]
    words: [njajal]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kain menika kandel, mboten tipis.
    answers_meaning:
      ar_eg: [القماش ده تخين، مش خفيف, القماشة دي تخينة مش رفيعة]
      ar: [هذا القماش سميك، ليس رقيقًا]
      en: ['This cloth is thick, not thin', This fabric is thick rather than thin]
    words: [kandel]
  - id: e09
    type: speaking
    text: Pak Harjo ngolah malam, lajeng nggambar sekar.
    meaning:
      ar_eg: الأستاذ هارجو بيجهّز الشمع، وبعدين بيرسم ورد.
      ar: يجهّز السيد هارجو الشمع ثم يرسم الزهور.
      en: Pak Harjo prepares the wax, then draws flowers.
    words: [ngolah, sekar]
  - id: e10
    type: multiple_choice
    question: Pak Harjo ___ malam kangge batik.
    options: [ngolah, kandel, njajal]
    answer: 0
    explain:
      ar_eg: ngolah = يحضّر، يجهّز (الشمع هنا).
      ar: ngolah = يعالج، يجهّز (الشمع هنا).
      en: ngolah = process, prepare (the wax here).
    words: [ngolah, kandel, njajal]
dialogue:
  lines:
    - speaker: Pak Harjo
      text: Mohamed, mangga dipunjajal ngangge canthing.
      ar_eg: يا محمد، اتفضل جرّب بالكانتينج.
      ar: يا محمد، تفضّل جرّب بالتشانتينج.
      en: Mohamed, go ahead and try the canthing.
    - speaker: Mohamed
      text: Wah, awrat, Pak! Kula dereng saged.
      ar_eg: ياه، صعبة يا أستاذ! لسه مش عارف.
      ar: إنه صعب يا أستاذ! لا أستطيع بعد.
      en: Ooh, it's hard, sir! I can't do it yet.
    - speaker: Pak Harjo
      text: Alon-alon kemawon. Damel batik kedah tlaten.
      ar_eg: على مهلك بس. الباتيك محتاج صبر.
      ar: على مهلك فقط. صنع الباتيك يحتاج إلى صبر.
      en: Just take it slowly. Batik takes patience.
    - speaker: Mohamed
      text: Motifipun menapa, Pak?
      ar_eg: الموتيف إيه يا أستاذ؟
      ar: ما الزخرفة يا أستاذ؟
      en: What's the motif, sir?
    - speaker: Pak Harjo
      text: Sekar lan ron. Mangke kainipun dipunpepe ngantos garing.
      ar_eg: ورد وورق شجر. وبعدين القماش يتنشر في الشمس لحد ما ينشف.
      ar: زهور وأوراق. ثم يُنشر القماش في الشمس حتى يجفّ.
      en: Flowers and leaves. Then the cloth is hung in the sun until it's dry.
    - speaker: Mohamed
      text: Griya panjenengan jembar sanget, kados museum!
      ar_eg: بيت حضرتك واسع أوي، زي المتحف!
      ar: بيتك واسع جدًا، كأنه متحف!
      en: Your house is so spacious, like a museum!
new_words:
  - word: garing
    pos: adjective
    ar_eg: ناشف
    ar: جاف
    en: dry (= kering)
  - word: ngolah
    pos: verb
    ar_eg: يحضّر، يجهّز الخامة
    ar: يعالج، يجهّز المادة
    en: process, prepare (materials, food) = mengolah
  - word: njajal
    pos: verb
    ar_eg: يجرّب (من jajal)
    ar: يجرّب (من jajal)
    en: try (from jajal) = mencoba
  - word: tlaten
    pos: adjective
    ar_eg: صبور وبيعمل الحاجة بدقة
    ar: صبور ومتقن
    en: patient and meticulous (= telaten)
  - word: sekar
    pos: noun
    ar_eg: وردة (kembang ← sekar)، كراما
    ar: زهرة (kembang ← sekar)، كراما
    en: flower (ngoko kembang, Indonesian bunga), krama
  - word: warisan
    pos: noun
    ar_eg: تراث، ورث
    ar: تراث، إرث
    en: heritage, inheritance (= warisan)
  - word: jembar
    pos: adjective
    ar_eg: واسع
    ar: واسع
    en: wide, spacious (= luas)
  - word: kandel
    pos: adjective
    ar_eg: تخين
    ar: سميك
    en: thick (= tebal)
