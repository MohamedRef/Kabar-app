schema: kabar.lesson/v1
id: j6.u01.l07
language: jv
title: Pesen kalung
can_do:
  ar_eg: 'تطلب سلسلة عليها اسمك بالحروف الجاوية: التمن، والعربون، وإن الكتابة مظبوطة.'
  ar: 'أن تطلب قلادة باسمك بالحروف الجاوية: الكلفة والعربون ومطابقة الكتابة.'
  en: 'Order a name necklace in Javanese script: the cost, the deposit and checking the spelling matches.'
slides:
  - title: Pesenan
    body:
      ar_eg: |
        kalung = سلسلة (قلادة)، gelang = غويشة (أسورة). lunas = خالص (اتدفع كله).
        ragad = التكلفة (كلمة رسمية)، panjer = عربون، separo = نص.
        jumbuh = مطابق ومظبوط على، sampurna = كامل من غير غلطة.
      ar: |
        kalung = قلادة، gelang = سوار. lunas = مسدَّد بالكامل.
        ragad = الكلفة (لفظ رسمي)، panjer = عربون، separo = نصف.
        jumbuh = مطابق، sampurna = كامل بلا عيب.
      en: |
        kalung = necklace, gelang = bracelet. lunas = paid in full.
        ragad = cost (formal), panjer = deposit, separo = half.
        jumbuh = match, fit; sampurna = perfect.
    examples:
      - text: Kalung jeneng nganggo aksara Jawa saiki laris.
        ar_eg: السلاسل اللي عليها أسامي بالجاوي عليها طلب دلوقتي.
        ar: قلادات الأسماء بالحروف الجاوية رائجة الآن.
        en: Name necklaces in Javanese script are selling well now.
      - text: Ragade 200 ewu, panjere separo.
        ar_eg: التكلفة ٢٠٠ ألف، والعربون النص.
        ar: الكلفة ٢٠٠ ألف، والعربون نصفها.
        en: It costs 200,000; the deposit is half.
      - text: Tulisane wis jumbuh karo jenengmu. Sampurna!
        ar_eg: الكتابة مطابقة لاسمك. تمام!
        ar: الكتابة مطابقة لاسمك. كاملة!
        en: The writing matches your name. Perfect!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kalung
        ar_eg: سلسلة
        ar: قلادة
        en: necklace
      - text: gelang
        ar_eg: غويشة
        ar: سوار
        en: bracelet
      - text: jumbuh
        ar_eg: مطابق
        ar: مطابق
        en: match, fit
      - text: lunas
        ar_eg: خالص
        ar: مسدَّد
        en: paid in full
    words: [kalung, gelang, jumbuh, lunas]
  - id: e02
    type: match_pairs
    pairs:
      - text: sampurna
        ar_eg: كامل
        ar: كامل بلا عيب
        en: perfect
      - text: separo
        ar_eg: نص
        ar: نصف
        en: half
      - text: panjer
        ar_eg: عربون
        ar: عربون
        en: deposit
      - text: ragad
        ar_eg: تكلفة
        ar: كلفة
        en: cost
    words: [sampurna, separo, panjer, ragad]
  - id: e03
    type: listen
    text: Panjere separo, sisane mengko yen wis rampung.
    question:
      ar_eg: هيدفع إزاي؟
      ar: كيف سيدفع؟
      en: How will he pay?
    options: [يدفع نص عربون والباقي بعدين, يدفع كله دلوقتي, مش هيدفع حاجة]
    answer: 0
    meaning:
      ar_eg: العربون النص، والباقي لما يخلص.
      ar: العربون النصف، والباقي عند الانتهاء.
      en: Half as a deposit, the rest when it's done.
    words: [panjer, separo]
  - id: e04
    type: fill_blank
    sentence: Gelang iki ___ banget, saben dina akeh sing tuku.
    meaning:
      ar_eg: الغويشة دي ___ أوي، كل يوم ناس كتير بتشتريها.
      ar: هذا السوار ___ جدًا، يشتريه كثيرون كل يوم.
      en: This bracelet is ___; lots of people buy it every day.
    options: [laris, jumbuh, panjer]
    answers: [laris]
    words: [jumbuh, panjer, gelang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي حاجة بتتلبس حوالين الرقبة؟
      ar: ماذا يُلبس حول العنق؟
      en: What do you wear around your neck?
    options: [gelang, kalung, ragad]
    answer: 1
    explain:
      ar_eg: kalung = سلسلة للرقبة. gelang = للإيد.
      ar: kalung = قلادة للعنق، وgelang = سوار لليد.
      en: kalung goes round the neck; gelang goes on the wrist.
    words: [gelang, kalung, ragad]
  - id: e06
    type: fill_blank
    sentence: Ukuran ali-aline wis ___ karo drijiku.
    meaning:
      ar_eg: مقاس الخاتم ___ على صباعي.
      ar: مقاس الخاتم ___ لإصبعي.
      en: The ring size ___ my finger.
    options: [jumbuh, lunas, separo]
    answers: [jumbuh]
    words: [jumbuh, lunas, separo]
  - id: e07
    type: multiple_choice
    question: Ora ana kluputane, tulisane ___.
    options: [lunas, gelang, sampurna]
    answer: 2
    explain:
      ar_eg: مفيش غلطة = sampurna، كاملة.
      ar: لا خطأ = sampurna، كاملة.
      en: 'No mistakes: sampurna, perfect.'
    words: [lunas, gelang, sampurna]
  - id: e08
    type: build_sentence
    source:
      ar_eg: السلسلة دي تكلفتها كام؟
      ar: كم كلفة هذه القلادة؟
      en: How much does this necklace cost?
    answer: Pira ragade kalung iki?
    distractors: [gelang, panjer]
    words: [ragad, kalung]
  - id: e09
    type: translate
    direction: from_target
    source_text: Aku mbayar panjer separo dhisik.
    answers_meaning:
      ar_eg: [أنا هدفع نص المبلغ عربون الأول, هدفع النص عربون الأول]
      ar: [سأدفع نصف المبلغ عربونًا أولًا, أدفع العربون نصف المبلغ أولًا]
      en: ['I''ll pay half as a deposit first', I pay a half deposit first]
    words: [panjer, separo]
  - id: e10
    type: speaking
    text: Gelang lan kalung iki sampurna.
    meaning:
      ar_eg: الغويشة والسلسلة دول تمام التمام.
      ar: هذا السوار وهذه القلادة كاملان.
      en: This bracelet and necklace are perfect.
    words: [gelang, kalung, sampurna]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, kula badhe pesen kalung mawi jeneng kula ing aksara Jawa.
      ar_eg: يا عم، عايز أطلب سلسلة عليها اسمي بالحروف الجاوية.
      ar: يا سيدي، أريد أن أطلب قلادة عليها اسمي بالحروف الجاوية.
      en: Sir, I'd like to order a necklace with my name in Javanese script.
    - speaker: Pak Slamet
      text: Sae, Mas. Kalung jeneng menika saweg laris.
      ar_eg: حلو يا محمد. سلاسل الأسامي دي عليها طلب اليومين دول.
      ar: جميل. قلادات الأسماء رائجة هذه الأيام.
      en: Good choice. Name necklaces are selling well these days.
    - speaker: Mohamed
      text: Pinten ragadipun?
      ar_eg: التكلفة كام؟
      ar: كم الكلفة؟
      en: How much does it cost?
    - speaker: Pak Slamet
      text: Kalih atus ewu. Panjeripun separo rumiyin.
      ar_eg: ميتين ألف. والعربون النص الأول.
      ar: مئتا ألف. والعربون نصفها أولًا.
      en: Two hundred thousand. Half as a deposit first.
    - speaker: Mohamed
      text: Menika, Pak. Tulisanipun kedah jumbuh kaliyan jeneng kula, nggih.
      ar_eg: اتفضل يا عم. والكتابة لازم تطابق اسمي، ماشي؟
      ar: تفضّل. ويجب أن تطابق الكتابة اسمي.
      en: Here you are. The writing must match my name, please.
    - speaker: Pak Slamet
      text: Mesthi. Mangke dados sampurna!
      ar_eg: أكيد. هتطلع تمام التمام!
      ar: بالتأكيد. ستكون كاملة!
      en: Of course. It'll be perfect!
