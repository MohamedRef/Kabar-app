dialogue:
  title: Cerkake Bu Retno
  lines:
    - speaker: Bu Retno
      text: Mas Mohamed, iki cerkakku. Wacanen, ya.
      ar_eg: يا محمد، دي قصتي القصيرة. اقراها.
      ar: يا محمد، هذه قصتي القصيرة. اقرأها.
      en: Mohamed, this is my short story. Have a read.
    - speaker: Mohamed
      text: Matur nuwun, Bu. Ing sawijining dina, menika "pada suatu hari", nggih?
      ar_eg: متشكر يا أبلة. ing sawijining dina يعني «في يوم من الأيام»، صح؟
      ar: شكرًا يا سيدتي. ing sawijining dina تعني «في يوم من الأيام»، أليس كذلك؟
      en: Thank you, ma'am. Ing sawijining dina means "one day", right?
    - speaker: Bu Retno
      text: Bener. Banjur wacanen nganti rampung.
      ar_eg: صح. وبعدين اقراها للآخر.
      ar: صحيح. ثم اقرأها حتى النهاية.
      en: Right. Then read it to the end.
    - speaker: Mohamed
      text: Inggih, Bu. Kula remen cerkak.
      ar_eg: حاضر يا أبلة. أنا بحب القصص القصيرة.
      ar: حسنًا يا سيدتي. أحب القصص القصيرة.
      en: Yes, ma'am. I love short stories.
