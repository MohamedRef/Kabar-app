schema: kabar.lesson/v1
id: j5.u05.l01
language: jv
title: Ing sawijining dina
can_do:
  ar_eg: تعرف بداية الحكاية وكلمة «وبعدين» فيها.
  ar: أن تتعرّف على افتتاح القصة وأداة «ثم» فيها.
  en: Spot a story's opening and its 'then'.
slides:
  - title: Biyen ana …
    body:
      ar_eg: |
        أهلًا بيك في كودوس! cerkak = قصة قصيرة (crita cekak). وأي قصة جاوي بتبدأ بجملة من دول:
        - «Ing sawijining dina, …» = في يوم من الأيام … (فاكر sawijining من ويكيبيديا؟)
        - «Biyen ana …» = كان يا ما كان، كان فيه … (biyen = زمان / dulu)
        نفس هيكل الحدوتة المصري بالظبط.
      ar: |
        مرحبًا بك في كودوس! cerkak = قصة قصيرة (crita cekak)، وتبدأ القصة الجاوية عادة بإحدى هاتين:
        - «Ing sawijining dina, …» = في يوم من الأيام … (أتذكر sawijining من ويكيبيديا؟)
        - «Biyen ana …» = كان يا ما كان … (biyen = قديمًا / dulu)
        وهو هيكل الحكاية العربية نفسه.
      en: |
        Welcome to Kudus! cerkak = short story (crita cekak). A Javanese story usually opens with one of these:
        - "Ing sawijining dina, …" = one day … (remember sawijining from Wikipedia?)
        - "Biyen ana …" = once upon a time there was … (biyen = long ago, dulu)
        The very same skeleton as an Arabic folk tale: «في يوم من الأيام», «كان يا ما كان».
    grammar: jv.narrative.connectors
    examples:
      - text: Ing sawijining dina, Dimas lunga menyang pasar.
        ar_eg: في يوم من الأيام، ديماس راح السوق.
        ar: في يوم من الأيام ذهب ديماس إلى السوق.
        en: One day, Dimas went to the market.
      - text: Biyen ana bocah cilik jenenge Bima.
        ar_eg: كان يا ما كان، كان فيه ولد صغير اسمه بيما.
        ar: كان يا ما كان ولد صغير اسمه بيما.
        en: Once upon a time there was a little boy called Bima.
  - title: Terus, banjur, nuli
    body:
      ar_eg: |
        التلاتة معناهم «وبعدين / ثم»، بس كل واحدة ليها مكانها:
        - terus: في الكلام (عرفتها في J2).
        - banjur: في الحكي والكتابة.
        - nuli: أدبية أكتر، هتلاقيها في القصص والكتب.
        لما تقرا قصة، علّم على الكلمات دي الأول، هتشوف ترتيب الأحداث قدامك.
      ar: |
        الثلاث بمعنى «ثم»، ولكل منها موضعها:
        - terus: في الكلام (عرفتها في J2).
        - banjur: في السرد والكتابة.
        - nuli: أدبية أكثر، تكثر في القصص والكتب.
        وحين تقرأ قصة ظلّل هذه الكلمات أولًا يظهر لك ترتيب الأحداث.
      en: |
        All three mean "then", each in its own place:
        - terus: in speech (you met it in J2).
        - banjur: in storytelling and writing.
        - nuli: more literary, common in stories and books.
        When you read a story, mark these first and the order of events appears.
    grammar: jv.narrative.connectors
    examples:
      - text: Bima tangi esuk, banjur adus.
        ar_eg: بيما صحي بدري، وبعدين استحمّى.
        ar: استيقظ بيما باكرًا ثم استحمّ.
        en: Bima got up early, then had a bath.
      - text: Dheweke sarapan, nuli lunga sekolah.
        ar_eg: فطر، وبعدين راح المدرسة.
        ar: تناول فطوره ثم ذهب إلى المدرسة.
        en: He had breakfast, then went to school.
