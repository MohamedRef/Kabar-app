dialogue:
  title: Sore neng Jakal
  lines:
    - speaker: Mas Heru
      text: Mohamed, kowe wis tuku kurma ta?
      ar_eg: يا محمد، إنت اشتريت البلح، مش كده؟
      ar: يا محمد، اشتريت التمر، أليس كذلك؟
      en: Mohamed, you've bought the dates, right?
    - speaker: Mohamed
      text: Durung. Pak, kurma Ajwa isih ana?
      ar_eg: لسه. يا حاج، بلح العجوة لسه موجود؟
      ar: ليس بعد. يا سيدي، هل ما زال تمر العجوة متوفرًا؟
      en: Not yet. Sir, are there still Ajwa dates?
    - speaker: Pak Hasan
      text: Isih ana lho, Mas.
      ar_eg: لسه موجود على فكرة يا ابني.
      ar: ما زال متوفرًا يا بنيّ.
      en: Still got some, you know.
    - speaker: Mohamed
      text: Apik! Tak tuku, Pak.
      ar_eg: حلو! هاخده يا حاج.
      ar: جميل! سأشتريه يا سيدي.
      en: Great! I'll take them, sir.
    - speaker: Mas Heru
      text: Wis, ayo mulih, cah!
      ar_eg: خلاص، يلا نروّح يا جدعان!
      ar: انتهينا، هيا نعود إلى البيت يا جماعة!
      en: Right, let's go home, guys!
souvenir:
  id: j1.u04.souvenir
  title: Jalan Kaliurang
  note:
    ar_eg: 'Jalan Kaliurang، واسمه عند الطلبة «Jakal»، طالع من جنب جامعة UGM لحد Kaliurang على سفح جبل Merapi. العناوين فيه بالكيلو: «Jakal km 5» يعني الحتة اللي عند الكيلو خمسة. على الجنبين سكن طلبة (kos)، ومطاعم صغيرة، ومغاسل، ومكاتب شحن الطرود. هنا هتسمع «Sik, tak lapor pusat» من موظف الشحن، و«Paketmu wis tekan» في الشات، فكل جاوي الوحدة دي عايش في الشارع ده.'
    ar: 'Jalan Kaliurang، ويسميه الطلبة «Jakal»، يمتد من جوار جامعة UGM حتى Kaliurang على سفح جبل Merapi. وتُكتب العناوين فيه بالكيلومتر: «Jakal km 5» أي عند الكيلومتر الخامس. وعلى جانبيه مساكن الطلبة (kos) ومطاعم صغيرة ومغاسل ومكاتب شحن الطرود. وهنا ستسمع «Sik, tak lapor pusat» من موظف الشحن، و«Paketmu wis tekan» في الدردشة، فجاوية هذه الوحدة كلها تعيش في هذا الشارع.'
    en: 'Jalan Kaliurang, "Jakal" to students, runs from beside UGM university up to Kaliurang on the slopes of Mount Merapi. Addresses go by the kilometre: "Jakal km 5" means the stretch at kilometre five. Both sides are lined with student lodgings (kos), small eateries, laundries and parcel counters. This is where the courier clerk says "Sik, tak lapor pusat" and your chat says "Paketmu wis tekan", so all of this unit''s Javanese lives on this one street.'
