  - id: e03
    type: multiple_choice
    question: Sik tak lapor pusat
    question_meaning:
      ar_eg: رسالة 1 — ترد بإيه؟
      ar: الرسالة ١ — بمَ تردّ؟
      en: Message 1 — how do you reply?
    options: ['Iya, tak tunggu.', 'Kok larang?', Aku teh wae.]
    answer: 0
    explain:
      ar_eg: 'هو هيسأل الإدارة، فإنت تستنى: «Iya, tak tunggu».'
      ar: 'سيسأل الإدارة، فتنتظر: «Iya, tak tunggu».'
      en: 'He''s checking with head office, so you wait: "Iya, tak tunggu".'
    words: [tunggu]
  - id: e04
    type: multiple_choice
    question: Barange rusak? Tak ganti, ya.
    question_meaning:
      ar_eg: البيّاع هيعمل إيه؟
      ar: ماذا سيفعل البائع؟
      en: What will the seller do?
    options: [هيصلّح الحاجة, هيرجّع الفلوس, هيبدّل الحاجة]
    answer: 2
    explain:
      ar_eg: ganti = يبدّل، وrusak = بايظ.
      ar: ganti = يستبدل، وrusak = تالف.
      en: ganti = replace, rusak = broken.
    words: [ganti, rusak, barang]
  - id: e05
