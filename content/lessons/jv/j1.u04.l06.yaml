schema: kabar.lesson/v1
id: j1.u04.l06
language: jv
title: VN saka Mas Heru
can_do:
  ar_eg: تفهم فويس نوت قصيرة فيها tak وlho وkok وترد عليها.
  ar: أن تفهم رسالة صوتية قصيرة فيها tak وlho وkok وتردّ عليها.
  en: Follow a voice note with tak, lho and kok.
slides:
  - title: VN saka Jakal
    grammar: jv.particle.basic
    body:
      ar_eg: |
        Mas Heru بعتلك فويس نوت (VN) من شارع جاكال (Jalan Kaliurang). اسمعها الأول من غير ما تقرا، ودوّر على تلات حاجات:
        - هو فين؟ (neng …)
        - هيعمل إيه؟ (tak + فعل = أنا هـ…)
        - حاسس بإيه؟ (lho = على فكرة، kok = إيه ده؟!)
        كلمة واحدة ممكن تكون جديدة عليك في السياق ده: «Ngomong wae» = قول بس / قولّي وخلاص.
      ar: |
        أرسل لك Mas Heru رسالة صوتية (VN) من شارع جاكال (Jalan Kaliurang). استمع إليها أولًا دون قراءة، وابحث عن ثلاثة أمور:
        - أين هو؟ (neng …)
        - ماذا سيفعل؟ (tak + فعل = سأ…)
        - بماذا يشعر؟ (lho = للتنبيه، وkok = للتعجّب)
        وتعبير قد يبدو جديدًا هنا: «Ngomong wae» = قل فقط.
      en: |
        Mas Heru sends you a voice note (VN) from Jakal (Jalan Kaliurang). Listen first without reading, and catch three things:
        - Where is he? (neng …)
        - What will he do? (tak + verb = I'll …)
        - How does he feel? (lho = you know!, kok = how come?!)
        One phrase may look new in this context: "Ngomong wae" = just say so.
    examples:
      - text: Mohamed, aku isih neng Jakal. Kurmane enak lho!
        ar_eg: يا محمد، أنا لسه في جاكال. البلح حلو أوي على فكرة!
        ar: يا محمد، ما زلت في جاكال. التمر لذيذ جدًا!
        en: Mohamed, I'm still on Jakal. The dates are really good, you know!
      - text: Sik, tak takon regane. Lho, kok larang?
        ar_eg: استنى، هسأل على السعر. إيه ده، غالي كده ليه؟
        ar: انتظر، سأسأل عن السعر. ماذا؟ لماذا هو غالٍ هكذا؟
        en: Hold on, I'll ask the price. Whoa, how come it's so expensive?
      - text: Kowe arep kurma? Ngomong wae, tak tuku. Aku mulih bengi.
        ar_eg: عايز بلح؟ قول بس وأنا أشتريلك. أنا راجع بالليل.
        ar: هل تريد تمرًا؟ قل فقط وسأشتريه. سأعود إلى البيت ليلًا.
        en: Do you want dates? Just say so and I'll buy some. I'll be home tonight.
exercises:
  - id: e01
    type: listen
    text: Mohamed, aku isih neng Jakal. Kurmane enak lho!
    question:
      ar_eg: Mas Heru فين دلوقتي؟
      ar: أين Mas Heru الآن؟
      en: Where is Mas Heru now?
    options: ["Neng omah.", "Neng Jakal.", "Neng Alkid."]
    answer: 1
    meaning:
      ar_eg: يا محمد، أنا لسه في جاكال. البلح حلو أوي على فكرة!
      ar: يا محمد، ما زلت في جاكال. التمر لذيذ جدًا!
      en: Mohamed, I'm still on Jakal. The dates are really good, you know!
    words: [isih, lho]
  - id: e02
    type: listen
    text: Sik, tak takon regane. Lho, kok larang?
    question:
      ar_eg: Mas Heru شايف السعر إزاي؟
      ar: ما رأي Mas Heru في السعر؟
      en: What does Mas Heru think of the price?
    options: ["Regane larang.", "Kurmane ora ana.", "Kurmane ora enak."]
    answer: 0
    meaning:
      ar_eg: استنى، هسأل على السعر. إيه ده، غالي كده ليه؟
      ar: انتظر، سأسأل عن السعر. ماذا؟ لماذا هو غالٍ هكذا؟
      en: Hold on, I'll ask the price. Whoa, how come it's so expensive?
    explain:
      ar_eg: kok larang? = غالي كده ليه؟! kok في الأول = استغراب.
      ar: kok larang? = لماذا هو غالٍ هكذا؟! وkok في أول الجملة للتعجّب.
      en: kok larang? = how come it's so expensive?! kok at the start shows surprise.
    words: [takon, kok, larang]
  - id: e03
    type: multiple_choice
    question: Kowe arep kurma? Ngomong wae, tak tuku.
    question_meaning:
      ar_eg: لو قلتله «آه»، Mas Heru هيعمل إيه؟
      ar: إذا قلت له «نعم»، ماذا سيفعل Mas Heru؟
      en: If you say yes, what will Mas Heru do?
    options: ["Dheweke mulih.", "Dheweke lapor pusat.", "Dheweke tuku kurma."]
    answer: 2
    explain:
      ar_eg: tak tuku = أنا هشتري. يعني هو هيشتريلك البلح.
      ar: tak tuku = سأشتري، أي أنه سيشتري لك التمر.
      en: tak tuku = I'll buy (it). So he'll buy the dates for you.
    words: [tuku]
  - id: e04
    type: multiple_choice
    question: Aku mulih bengi.
    question_meaning:
      ar_eg: Mas Heru راجع البيت إمتى؟
      ar: متى يعود Mas Heru إلى البيت؟
      en: When is Mas Heru going home?
    options: ["Esuk.", "Bengi.", "Awan."]
    answer: 1
    explain:
      ar_eg: mulih = يروّح (pulang)، bengi = بالليل.
      ar: mulih = يعود إلى البيت (pulang)، وbengi = ليلًا.
      en: mulih = go home (pulang), bengi = at night.
    words: [mulih]
  - id: e05
    type: match_pairs
    pairs:
      - text: tak takon
        ar_eg: هسأل
        ar: سأسأل
        en: I'll ask
      - text: kok larang?
        ar_eg: غالي كده ليه؟!
        ar: لماذا هو غالٍ هكذا؟!
        en: how come it's so expensive?!
      - text: enak lho
        ar_eg: حلو أوي على فكرة
        ar: لذيذ حقًّا
        en: it's good, you know
      - text: ngomong wae
        ar_eg: قول بس
        ar: قل فقط
        en: just say so
      - text: mulih
        ar_eg: يروّح البيت
        ar: يعود إلى البيت
        en: go home
    words: [takon, kok, larang, lho, ngomong, wae, mulih]
  - id: e06
    type: fill_blank
    sentence: Lho, ___ larang?
    meaning:
      ar_eg: إيه ده، غالي كده ليه؟
      ar: ماذا؟ لماذا هو غالٍ هكذا؟
      en: Whoa, how come it's so expensive?
    options: ["wae", "kok", "ta"]
    answers: ["kok"]
    explain:
      ar_eg: kok قبل الصفة = «إشمعنى؟ ليه كده؟».
      ar: kok قبل الصفة تعني «لماذا هكذا؟».
      en: kok before the adjective = "how come?!".
    words: [kok, larang]
  - id: e07
    type: dictation
    text: Sik, tak takon regane.
    meaning:
      ar_eg: استنى، هسأل على السعر.
      ar: انتظر، سأسأل عن السعر.
      en: Hold on, I'll ask the price.
    words: [sik, takon, rega]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "رد على الفويس نوت: «ماشي يا Mas، هستناك في البيت.»"
      ar: "ردّ على الرسالة الصوتية: «حسنًا يا Mas، سأنتظرك في البيت.»"
      en: "Reply to the voice note: \"OK, Mas, I'll wait for you at home.\""
    answers:
      - Iya Mas, tak tunggu neng omah.
      - Iya Mas, tak tunggu neng omah
      - Iya, Mas, tak tunggu neng omah.
      - Iya Mas, tak tunggu neng omah, ya.
      - Iya Mas, tak tunggu neng omah ya
      - Iya Mas, tak tunggu neng omah.
      - Oke Mas, tak tunggu neng omah.
      - Iya, tak tunggu neng omah, Mas.
      - Iya, tak tunggu neng omah.
    explain:
      ar_eg: tak tunggu = هستنى (أنا)، neng omah = في البيت.
      ar: tak tunggu = سأنتظر، وnang omah = في البيت.
      en: tak tunggu = I'll wait, neng omah = at home.
    words: [tunggu, neng, omah]
  - id: e09
    type: speaking
    text: Kurmane enak lho, Mas!
    meaning:
      ar_eg: البلح حلو أوي على فكرة يا Mas!
      ar: التمر لذيذ حقًّا يا Mas!
      en: The dates are really good, you know, Mas!
    words: [lho]
dialogue:
  title: Bengi, Mas Heru mulih
  lines:
    - speaker: Mas Heru
      text: Mohamed, kurmane wis tak tuku!
      ar_eg: يا محمد، اشتريت البلح خلاص!
      ar: يا محمد، اشتريت التمر!
      en: Mohamed, I've bought the dates!
    - speaker: Mohamed
      text: Suwun, Mas! Regane pira?
      ar_eg: متشكر يا Mas! بكام؟
      ar: شكرًا يا Mas! كم سعره؟
      en: Thanks, Mas! How much was it?
    - speaker: Mas Heru
      text: Larang, cah! Kurma Ajwa lho.
      ar_eg: غالي يا جدع! ده بلح عجوة على فكرة.
      ar: غالٍ يا صاحبي! إنه تمر عجوة.
      en: Pricey, mate! They're Ajwa dates, you know.
    - speaker: Mohamed
      text: Ora apa-apa, Mas. Ayo mangan kurmane sik!
      ar_eg: مش مشكلة يا Mas. يلا ناكل البلح الأول!
      ar: لا بأس يا Mas. هيّا نأكل التمر أولًا!
      en: No problem, Mas. Let's eat the dates first!
    - speaker: Mas Heru
      text: Ayo! Enak lho, cah.
      ar_eg: يلا! حلو أوي يا جدع.
      ar: هيّا! إنه لذيذ يا صاحبي.
      en: Let's go! They're really good, mate.
