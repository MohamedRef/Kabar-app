schema: kabar.lesson/v1
id: j1.u05.l06
language: jv
title: Nang warung Kenjeran
can_do:
  ar_eg: تقرا يافطة وارونج مكتوبة بلهجة سورابايا وتطلب منها.
  ar: أن تقرأ لافتة مطعم شعبي مكتوبة بلهجة سورابايا وتطلب منها.
  en: Read a warung sign in Arek and order.
slides:
  - title: Tulisan nang warung
    grammar: jv.dialect.arek
    body:
      ar_eg: |
        على شط كنجران، فيه وارونج صغير متعلّق عليه يافطة مكتوبة بلهجة سورابايا (Arek). اقراها وحوّلها في دماغك للنغوكو العادية:
        - gak onok = ora ana = مفيش
        - onok = ana = فيه
        - dudu = مش (قبل الاسم)، زي ما هي في الاتنين.
        - rek = يا جماعة.
        وافتكر: lontong kupang = لونتونج بالبلح البحر الصغير، وlontong balap = لونتونج بالفول النابت والتوفو.
      ar: |
        على شاطئ كنجران مطعم شعبي صغير عُلّقت عليه لافتة بلهجة سورابايا (Arek). اقرأها وحوّلها في ذهنك إلى النغوكو المعيارية:
        - gak onok = ora ana = لا يوجد
        - onok = ana = يوجد
        - dudu = ليس (قبل الاسم)، وهي نفسها في اللهجتين.
        - rek = يا جماعة.
        وتذكّر: lontong kupang = لونتونج بالمحار الصغير، وlontong balap = لونتونج بالفول المنبت والتوفو.
      en: |
        On the beach at Kenjeran, a little warung has a sign written in Surabaya Arek. Read it and turn it into standard ngoko in your head:
        - gak onok = ora ana = there isn't any
        - onok = ana = there is
        - dudu = not (before a noun), the same in both.
        - rek = guys.
        And remember: lontong kupang = rice cake with tiny clams; lontong balap = rice cake with bean sprouts and tofu.
    examples:
      - text: Lontong kupang gak onok, rek!
        ar_eg: لونتونج كوبانج مفيش يا جماعة! (= Lontong kupang ora ana.)
        ar: لا يوجد لونتونج كوبانج يا جماعة! (= Lontong kupang ora ana.)
        en: No lontong kupang, folks! (= Lontong kupang ora ana.)
      - text: Lontong balap onok. Teh onok.
        ar_eg: لونتونج بالاب فيه. شاي فيه. (= ana)
        ar: يوجد لونتونج بالاب، ويوجد شاي. (= ana)
        en: "Lontong balap: yes. Tea: yes. (= ana)"
      - text: Iki dudu warung kopi. Kopi gak onok!
        ar_eg: ده مش قهوة (وارونج قهوة). القهوة مفيش!
        ar: هذا ليس مقهى. لا توجد قهوة!
        en: This isn't a coffee stall. No coffee!
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب اليافطة، أنهي جملة صح؟
      ar: بحسب اللافتة، أيّ جملة صحيحة؟
      en: According to the sign, which sentence is true?
    options: ["Lontong kupang ana.", "Lontong balap ana.", "Kopi ana."]
    answer: 1
    explain:
      ar_eg: اليافطة بتقول «Lontong balap onok»، وonok = ana. الكوبانج والقهوة gak onok.
      ar: تقول اللافتة «Lontong balap onok»، وonok = ana، أما الكوبانج والقهوة فـgak onok.
      en: The sign says "Lontong balap onok", and onok = ana. Kupang and coffee are gak onok.
    words: [onok, ana]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: كان نفسك تشرب قهوة. تطلب إيه بدالها؟
      ar: كنت تريد قهوة. ماذا تطلب بدلًا منها؟
      en: You wanted a coffee. What do you order instead?
    options: ["Kopi ae, Cak.", "Lontong kupang ae, Cak.", "Teh ae, Cak."]
    answer: 2
    explain:
      ar_eg: القهوة والكوبانج مفيش، لكن الشاي فيه. ae = بس (wae).
      ar: لا قهوة ولا كوبانج، لكن الشاي موجود، وae = فقط (wae).
      en: No coffee and no kupang, but there's tea. ae = just (wae).
    words: [ae]
  - id: e03
    type: multiple_choice
    question: Iki dudu warung kopi.
    question_meaning:
      ar_eg: أنهي جملة إندونيسي معناها نفس الحاجة؟
      ar: أيّ جملة إندونيسية تحمل المعنى نفسه؟
      en: Which Indonesian sentence means the same?
    options: ["Ini bukan warung kopi.", "Ini tidak ada warung kopi.", "Ini warung kopi."]
    answer: 0
    explain:
      ar_eg: dudu قبل الاسم = bukan.
      ar: dudu قبل الاسم = bukan.
      en: dudu before a noun = bukan.
    words: [dudu]
  - id: e04
    type: match_pairs
    pairs:
      - text: gak onok
        ar_eg: ora ana (مفيش)
        ar: ora ana (لا يوجد)
        en: ora ana (there isn't any)
      - text: onok
        ar_eg: ana (فيه)
        ar: ana (يوجد)
        en: ana (there is)
      - text: dudu
        ar_eg: مش (= bukan)
        ar: ليس (= bukan)
        en: not (= bukan)
      - text: ae
        ar_eg: wae (بس)
        ar: wae (فقط)
        en: wae (just)
      - text: rek
        ar_eg: يا جماعة
        ar: يا جماعة
        en: guys, folks
    words: [gak, onok, dudu, ae, rek]
  - id: e05
    type: listen
    text: Lontong balap onok, rek.
    options: ["Lontong kupang onok, rek.", "Lontong balap gak onok, rek.", "Lontong balap onok, rek."]
    answer: 2
    meaning:
      ar_eg: لونتونج بالاب فيه يا جماعة.
      ar: يوجد لونتونج بالاب يا جماعة.
      en: There's lontong balap, folks.
    words: [lontong balap, onok]
  - id: e06
    type: fill_blank
    sentence: Lontong kupang ___.
    meaning:
      ar_eg: "لونتونج كوبانج مفيش. (اليافطة بالنغوكو العادية)"
      ar: "لا يوجد لونتونج كوبانج. (اللافتة بالنغوكو المعيارية)"
      en: "There's no lontong kupang. (The sign in standard ngoko)"
    options: ["dudu", "ora ana", "durung"]
    answers: ["ora ana"]
    explain:
      ar_eg: gak onok بلهجة سورابايا = ora ana بالنغوكو العادية.
      ar: gak onok في لهجة سورابايا = ora ana في النغوكو المعيارية.
      en: Arek gak onok = standard ora ana.
    words: [ora ana, lontong kupang]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اطلب على طريقة سورابايا: «لونتونج بالاب وشاي بس يا Cak.»"
      ar: "اطلب على طريقة سورابايا: «لونتونج بالاب وشاي فقط يا Cak.»"
      en: "Order Surabaya style: \"Just lontong balap and tea, Cak.\""
    answers:
      - Lontong balap karo teh ae, Cak.
      - Lontong balap karo teh ae, Cak
      - Lontong balap karo teh ae Cak
      - Lontong balap lan teh ae, Cak.
      - Lontong balap karo teh wae, Cak.
      - Lontong balap lan teh wae, Cak.
      - Cak, lontong balap karo teh ae.
      - Lontong balap ae karo teh, Cak.
    explain:
      ar_eg: karo = و/مع، وae (سورابايا) = wae = بس.
      ar: karo = و/مع، وae في سورابايا = wae = فقط.
      en: karo = and / with, Arek ae = wae = just.
    words: [lontong balap, karo, ae]
  - id: e08
    type: build_sentence
    source:
      ar_eg: "قول اليافطة بالنغوكو العادية: «ده مش وارونج قهوة، مفيش قهوة.»"
      ar: "قل اللافتة بالنغوكو المعيارية: «هذا ليس مقهى، لا توجد قهوة.»"
      en: "Say the sign in standard ngoko: \"This isn't a coffee stall; there's no coffee.\""
    answer: Iki dudu warung kopi, kopi ora ana.
    alternatives: ["Iki dudu warung kopi, ora ana kopi."]
    distractors: [gak, onok]
    words: [dudu, ora ana]
  - id: e09
    type: speaking
    text: Lontong balap ae, Cak.
    meaning:
      ar_eg: لونتونج بالاب بس يا Cak.
      ar: لونتونج بالاب فقط يا Cak.
      en: Just lontong balap, Cak.
    words: [lontong balap, ae]
dialogue:
  title: Warung Cak Man
  lines:
    - speaker: Ning Lia
      text: Mohamed, ayo mangan lontong kupang!
      ar_eg: يا محمد، يلا ناكل لونتونج كوبانج!
      ar: يا محمد، هيّا نأكل لونتونج كوبانج!
      en: Mohamed, let's have lontong kupang!
    - speaker: Mohamed
      text: Lho, Ning, lontong kupang gak onok.
      ar_eg: إيه ده يا Ning، لونتونج كوبانج مفيش.
      ar: انتبهي يا Ning، لا يوجد لونتونج كوبانج.
      en: Oh, Ning, there's no lontong kupang.
    - speaker: Cak Man
      text: Gak onok, Ning. Lontong balap ae, ya?
      ar_eg: مفيش يا Ning. لونتونج بالاب بقى، ماشي؟
      ar: لا يوجد يا Ning. لونتونج بالاب إذن، حسنًا؟
      en: None today, Ning. Lontong balap instead, OK?
    - speaker: Mohamed
      text: Iya, Cak. Lontong balap karo teh ae.
      ar_eg: ماشي يا Cak. لونتونج بالاب وشاي بس.
      ar: حسنًا يا Cak. لونتونج بالاب وشاي فقط.
      en: Sure, Cak. Just lontong balap and tea.
    - speaker: Ning Lia
      text: Aku lontong balap karo kopi, Cak.
      ar_eg: وأنا لونتونج بالاب وقهوة يا Cak.
      ar: وأنا لونتونج بالاب وقهوة يا Cak.
      en: Lontong balap and coffee for me, Cak.
    - speaker: Cak Man
      text: Kopi gak onok, Ning. Iki dudu warung kopi!
      ar_eg: القهوة مفيش يا Ning. ده مش وارونج قهوة!
      ar: لا توجد قهوة يا Ning. هذا ليس مقهى!
      en: No coffee, Ning. This isn't a coffee stall!
