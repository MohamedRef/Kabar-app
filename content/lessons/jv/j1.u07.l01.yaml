schema: kabar.lesson/v1
id: j1.u07.l01
language: jv
title: Siji, loro, telu
can_do:
  ar_eg: تعد من واحد لخمسة وتطلب مشروبات.
  ar: أن تعدّ من واحد إلى خمسة وتطلب المشروبات.
  en: Count from one to five and order drinks.
slides:
  - title: Siji … lima
    body:
      ar_eg: |
        أهلًا بيك في باسار كليتيكان، سوق الحاجات المستعملة في يوجيا! أول حاجة في السوق: الأرقام. وجنب كل رقم الإندونيسي:
        - 1 siji (satu) · 2 loro (dua) · 3 telu (tiga) · 4 papat (empat) · 5 lima (lima)
        lima زي الإندونيسي بالظبط، بس بتتنطق «limo» وفي الشات بتتكتب كده.
      ar: |
        مرحبًا بك في باسار كليتيكان، سوق المستعمل في يوجيا! أول ما يلزم في السوق الأعداد، ومعها الإندونيسية:
        - 1 siji (satu) · 2 loro (dua) · 3 telu (tiga) · 4 papat (empat) · 5 lima (lima)
        وlima كالإندونيسية تمامًا، لكنها تُنطق «limo» وتُكتب كذلك في الدردشة.
      en: |
        Welcome to Pasar Klithikan, Jogja's second-hand market! First thing at a market: numbers. With Indonesian alongside:
        - 1 siji (satu) · 2 loro (dua) · 3 telu (tiga) · 4 papat (empat) · 5 lima (lima)
        lima is the same as Indonesian, but it's said "limo", and chats spell it that way.
    grammar: jv.number.ngoko
    examples:
      - text: Kopi loro, Mas.
        ar_eg: اتنين قهوة يا معلم.
        ar: قهوتان يا أخي.
        en: Two coffees, brother.
      - text: Teh telu.
        ar_eg: تلاتة شاي.
        ar: ثلاثة أكواب شاي.
        en: Three teas.
exercises:
  - id: e01
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اتنين قهوة يا معلم.
      ar: قهوتان يا أخي.
      en: Two coffees, brother.
    answers: ['Kopi loro, Mas.', 'Kopi loro, Mas', Kopi loro Mas., Kopi loro Mas, 'Kopi loro, Mas.', 'Kopi loro, Mas', Kopi loro Mas., Kopi loro Mas, 'Kopi loro ya, Mas.', 'Kopi loro ya, Mas', Kopi loro ya Mas., Kopi loro ya Mas]
    words: [kopi, loro]
  - id: e02
    type: dictation
    text: Kopi loro, Mas.
    meaning:
      ar_eg: اتنين قهوة يا معلم.
      ar: قهوتان يا أخي.
      en: Two coffees, brother.
    words: [loro]
  - id: e03
    type: match_pairs
    pairs:
      - text: siji
        ar_eg: ١ واحد
        ar: ١ واحد
        en: 1 one
      - text: loro
        ar_eg: ٢ اتنين
        ar: ٢ اثنان
        en: 2 two
      - text: telu
        ar_eg: ٣ تلاتة
        ar: ٣ ثلاثة
        en: 3 three
      - text: papat
        ar_eg: ٤ أربعة
        ar: ٤ أربعة
        en: 4 four
      - text: lima
        ar_eg: ٥ خمسة
        ar: ٥ خمسة
        en: 5 five
    words: [siji, loro, telu, papat, lima]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول ٣ بالجاوي؟
      ar: كيف تقول ٣ بالجاوية؟
      en: How do you say 3 in Javanese?
    options: [loro, telu, papat]
    answer: 1
    explain:
      ar_eg: telu = tiga. وloro = dua، وpapat = empat.
      ar: telu = tiga، وloro = dua، وpapat = empat.
      en: Telu = tiga. Loro = dua, papat = empat.
    words: [telu]
  - id: e05
    type: listen
    text: Teh telu.
    options: [Teh loro., Kopi lima., Teh telu.]
    answer: 2
    meaning:
      ar_eg: تلاتة شاي.
      ar: ثلاثة أكواب شاي.
      en: Three teas.
    words: [telu, loro, lima]
  - id: e06
    type: build_sentence
    source:
      ar_eg: اتنين قهوة وواحد شاي.
      ar: قهوتان وشاي واحد.
      en: Two coffees and one tea.
    answer: Kopi loro, teh siji.
    distractors: [telu, papat]
    words: [loro, siji]
    explain:
      ar_eg: loro = اتنين، وsiji = واحد، والرقم بييجي بعد الحاجة. telu = تلاتة، وpapat = أربعة، ومش في المعنى.
      ar: loro = اثنان، وsiji = واحد، ويأتي العدد بعد المعدود؛ أما telu فثلاثة، وpapat أربعة، وليسا في المعنى.
      en: loro = two, siji = one, and the number follows the thing. telu (three) and papat (four) aren't in the meaning.
  - id: e07
    type: speaking
    text: Siji, loro, telu, papat, lima.
    meaning:
      ar_eg: واحد، اتنين، تلاتة، أربعة، خمسة.
      ar: واحد، اثنان، ثلاثة، أربعة، خمسة.
      en: One, two, three, four, five.
    words: [siji, loro, telu, papat, lima]
dialogue:
  lines:
    - speaker: Mas Man
      text: Kopi pira, Mas?
      ar_eg: كام قهوة يا أستاذ؟
      ar: كم كوب قهوة يا سيدي؟
      en: How many coffees, Mas?
    - speaker: Mohamed
      text: Kopi loro, Mas. Lan teh siji.
      ar_eg: اتنين قهوة يا كاك. وواحد شاي.
      ar: قهوتان يا كاك. وشاي واحد.
      en: Two coffees, Mas. And one tea.
    - speaker: Mas Man
      text: Kopi loro, teh siji. Wis?
      ar_eg: اتنين قهوة، وواحد شاي. خلاص؟
      ar: قهوتان وشاي واحد. هذا كل شيء؟
      en: Two coffees, one tea. Is that all?
    - speaker: Mohamed
      text: Eh, teh telu, Mas!
      ar_eg: لأ، تلاتة شاي يا كاك!
      ar: لا، ثلاثة أكواب شاي يا كاك!
      en: Oh, three teas, Mas!
new_words:
  - word: telu
    pos: number
    ar_eg: 'تلاتة (tiga)؛ قبل ewu: telung'
    ar: 'ثلاثة (tiga)؛ قبل ewu: telung'
    en: 'three (tiga); before ewu: telung'
  - word: papat
    pos: number
    ar_eg: 'أربعة (empat)؛ قبل ewu: patang'
    ar: 'أربعة (empat)؛ قبل ewu: patang'
    en: 'four (empat); before ewu: patang'
  - word: lima
    pos: number
    ar_eg: 'خمسة (lima)، بتتنطق limo؛ قبل ewu: limang'
    ar: 'خمسة (lima)، تُنطق limo؛ قبل ewu: limang'
    en: 'five (lima), said limo; before ewu: limang'
review:
  status: draft
  verified: false
