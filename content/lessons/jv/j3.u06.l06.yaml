schema: kabar.lesson/v1
id: j3.u06.l06
language: jv
title: Damel batik
can_do:
  ar_eg: توصف صناعة الباتيك بالكراما.
  ar: أن تصف صناعة الباتيك بالكراما.
  en: Describe batik-making in krama.
slides:
  - title: Batik dipundamel kados pundi?
    body:
      ar_eg: |
        في ورشة الحاج هارجو في Laweyan هتسمع خطوات الباتيك بالمبني للمجهول الكراما (dipun-):
        - **Rumiyin**، motifipun dipungambar wonten kain. = الأول، الرسمة بتترسم على القماش. (rumiyin = dhisik، الأول)
        - **Lajeng**، dipunbatik ngginakaken canthing lan malam. = وبعدين بيترسم بالـ canthing والشمع (malam = شمع الباتيك).
        - Lajeng kainipun dipuncelup. = وبعدين القماش بيتغطس في الصبغة.
        وللوقت: **dangu** = suwe (وقت طويل)، **sewulan** = شهر. Batik tulis saged sewulan. = الباتيك المرسوم ممكن ياخد شهر.
      ar: |
        في ورشة السيد هارجو في Laweyan ستسمع خطوات الباتيك بصيغة المبني للمجهول في الكراما (dipun-):
        - **Rumiyin**، motifipun dipungambar wonten kain. = أولًا تُرسم النقوش على القماش. (rumiyin = dhisik)
        - **Lajeng**، dipunbatik ngginakaken canthing lan malam. = ثم يُرسم بالشمع (malam) بالـ canthing.
        - Lajeng kainipun dipuncelup. = ثم يُغمس القماش في الصبغة.
        وللوقت: **dangu** = suwe (مدة طويلة)، و**sewulan** = شهر: Batik tulis saged sewulan. = قد يستغرق الباتيك المرسوم شهرًا.
      en: |
        In Pak Harjo's workshop in Laweyan you'll hear the batik steps in the krama passive (dipun-):
        - **Rumiyin**, motifipun dipungambar wonten kain. = First, the pattern is drawn on the cloth. (rumiyin = dhisik, first)
        - **Lajeng**, dipunbatik ngginakaken canthing lan malam. = Then it's waxed using a canthing and malam (batik wax).
        - Lajeng kainipun dipuncelup. = Then the cloth is dipped in dye.
        For time: **dangu** = suwe (a long time), **sewulan** = one month. Batik tulis saged sewulan. = Hand-drawn batik can take a month.
    grammar: jv.krama.affixes
    examples:
      - text: Rumiyin, motifipun dipungambar wonten kain.
        ar_eg: الأول، الرسمة بتترسم على القماش.
        ar: أولًا تُرسم النقوش على القماش.
        en: First, the pattern is drawn on the cloth.
      - text: Damelipun dangu.
        ar_eg: عمله بياخد وقت طويل.
        ar: صنعه يستغرق وقتًا طويلًا.
        en: Making it takes a long time.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: إيه أول خطوة في الباتيك المرسوم؟
      ar: ما أول خطوة في الباتيك المرسوم؟
      en: What is the first step of hand-drawn batik?
    options: [Motifipun dipungambar wonten kain., Batikipun dipuntumbas., Kainipun dipuncelup.]
    answer: 0
    explain:
      ar_eg: الأول الرسمة بتترسم على القماش (dipungambar)، وبعدين الشمع، وبعدين الصبغة.
      ar: أولًا تُرسم النقوش (dipungambar)، ثم الشمع، ثم الصبغة.
      en: First the pattern is drawn (dipungambar), then the wax, then the dye.
    words: [rumiyin, gambar, kain, celup]
  - id: e02
    type: listen
    text: Lajeng kainipun dipuncelup.
    options: [Lajeng kainipun dipuncelup., Lajeng malamipun dipuncelup., Rumiyin kainipun dipuncelup.]
    answer: 0
    words: [lajeng, kain, celup, malam]
  - id: e03
    type: fill_blank
    sentence: ___, motifipun dipungambar wonten kain.
    meaning:
      ar_eg: الأول، الرسمة بتترسم على القماش.
      ar: أولًا تُرسم النقوش على القماش.
      en: First, the pattern is drawn on the cloth.
    options: [Dangu, Lajeng, Rumiyin]
    answers: [Rumiyin]
    explain:
      ar_eg: rumiyin = dhisik (الأول). lajeng = وبعدين، dangu = وقت طويل.
      ar: rumiyin = dhisik (أولًا)، وlajeng = ثم، وdangu = مدة طويلة.
      en: rumiyin = dhisik (first); lajeng = then, dangu = long time.
    words: [rumiyin]
  - id: e04
    type: fill_blank
    sentence: Batik tulis damel___ dangu, saged sewulan.
    meaning:
      ar_eg: الباتيك المرسوم عمله بياخد وقت طويل، ممكن شهر.
      ar: الباتيك المرسوم يستغرق صنعه وقتًا طويلًا، قد يبلغ شهرًا.
      en: Hand-drawn batik takes a long time to make, maybe a month.
    options: [nipun, e, ipun]
    answers: [ipun]
    explain:
      ar_eg: 'damel بتخلص بحرف ساكن (l)، يبقى -ipun: damelipun = عمله (gawene).'
      ar: 'تنتهي damel بساكن فتأخذ -ipun: damelipun = صنعه.'
      en: 'damel ends in a consonant, so -ipun: damelipun = the making of it.'
    words: [damel, dangu, sewulan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: (بالكراما) وبعدين القماش بيتغطس في الصبغة.
      ar: (بالكراما) ثم يُغمس القماش في الصبغة.
      en: (in krama) Then the cloth is dipped in dye.
    answer: Lajeng kainipun dipuncelup.
    distractors: [terus, kaine, dicelup]
    words: [lajeng, kain, celup]
  - id: e06
    type: build_sentence
    source:
      ar_eg: (بالكراما) أنا بستخدم الشمع والـ canthing.
      ar: (بالكراما) أستخدم الشمع والـ canthing.
      en: (in krama) I use wax and a canthing.
    answer: Kula ngginakaken malam lan canthing.
    distractors: [nganggo, aku]
    words: [kula, ngginakaken, malam, canthing]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بالكراما) الباتيك المرسوم بيتعمل بالـ canthing.
      ar: (بالكراما) يُصنع الباتيك المرسوم بالـ canthing.
      en: (in krama) Hand-drawn batik is made using a canthing.
    answers: [Batik tulis dipundamel ngginakaken canthing., Batik tulis dipundamel ngginakaken canthing, Batik tulis didamel ngginakaken canthing., Batik tulis didamel ngginakaken canthing, Batik tulis dipundamel ngginakaken canting., Batik tulis dipundamel ngginakaken canting, Batik tulis didamel ngginakaken canting., Batik tulis didamel ngginakaken canting]
    explain:
      ar_eg: dipundamel (أو didamel في الكلام) = اتعمل، ngginakaken = باستخدام.
      ar: dipundamel (أو didamel في الكلام) = يُصنع، وngginakaken = باستعمال.
      en: dipundamel (spoken didamel) = is made, ngginakaken = using.
    words: [damel, ngginakaken, canthing]
  - id: e08
    type: translate
    direction: from_target
    source_text: Batik tulis saged sewulan.
    answers_meaning:
      ar_eg: [الباتيك المرسوم ممكن ياخد شهر., الباتيك المرسوم ممكن ياخد شهر كامل., batik tulis ممكن ياخد شهر.]
      ar: [قد يستغرق الباتيك المرسوم شهرًا., يمكن أن يستغرق الباتيك المرسوم شهرًا.]
      en: [Hand-drawn batik can take a month., Batik tulis can take a month., Hand-drawn batik can take one month.]
    words: [sewulan]
  - id: e09
    type: speaking
    text: Damelipun dangu. Rumiyin, motifipun dipungambar. Lajeng dipunbatik ngginakaken malam, lajeng dipuncelup.
    meaning:
      ar_eg: عمله بياخد وقت. الأول الرسمة بتترسم، وبعدين بيتشمّع بالشمع، وبعدين بيتصبغ.
      ar: صنعه يطول. أولًا تُرسم النقوش، ثم تُغطّى بالشمع، ثم تُصبغ.
      en: It takes a long time. First the pattern is drawn, then it's waxed with malam, then it's dyed.
    words: [damel, dangu, rumiyin, lajeng, malam, celup]
  - id: e10
    type: dictation
    text: Damelipun dangu, saged sewulan.
    meaning:
      ar_eg: عمله بياخد وقت طويل، ممكن شهر.
      ar: صنعه يستغرق وقتًا طويلًا، قد يبلغ شهرًا.
      en: Making it takes a long time, maybe a month.
    words: [damel, dangu, sewulan]
dialogue:
  title: Wonten griya batik Pak Harjo
  lines:
    - speaker: Mohamed
      text: Pak, batik tulis dipundamel kados pundi?
      ar_eg: يا أستاذ، الباتيك المرسوم بالإيد بيتعمل إزاي؟
      ar: يا سيدي، كيف يُصنع الباتيك المرسوم باليد؟
      en: Sir, how is hand-drawn batik made?
    - speaker: Pak Harjo
      text: Rumiyin, motifipun dipungambar wonten kain.
      ar_eg: الأول، الرسمة بتترسم على القماش.
      ar: أولًا تُرسم النقوش على القماش.
      en: First, the pattern is drawn on the cloth.
    - speaker: Pak Harjo
      text: Lajeng dipunbatik ngginakaken canthing lan malam.
      ar_eg: وبعدين بيترسم بالشمع بالـ canthing.
      ar: ثم يُرسم بالشمع بالـ canthing.
      en: Then it's waxed using a canthing and wax.
    - speaker: Pak Harjo
      text: Malam menika lilin kangge batik, Mas. Lajeng kainipun dipuncelup.
      ar_eg: malam ده الشمع بتاع الباتيك يا ابني. وبعدين القماش بيتغطس في الصبغة.
      ar: malam هو شمع الباتيك يا بني. ثم يُغمس القماش في الصبغة.
      en: Malam is wax for batik. Then the cloth is dipped in dye.
    - speaker: Mohamed
      text: Damelipun dangu, nggih, Pak?
      ar_eg: عمله بياخد وقت طويل، صح يا حاج؟
      ar: صنعه يستغرق وقتًا طويلًا، أليس كذلك يا سيدي؟
      en: It takes a long time to make, doesn't it, sir?
    - speaker: Pak Harjo
      text: Inggih, dangu. Batik tulis saged sewulan.
      ar_eg: أيوه، وقت طويل. الباتيك المرسوم ممكن ياخد شهر.
      ar: نعم، وقت طويل. قد يستغرق الباتيك المرسوم شهرًا.
      en: Yes, a long time. Hand-drawn batik can take a month.
