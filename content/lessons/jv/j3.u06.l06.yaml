dialogue:
  lines:
    - speaker: Mohamed
      text: Pak Harjo, ingkang mbatik ing ngriki estri sedaya?
      ar_eg: يا أستاذ هارجو، اللي بيرسموا باتيك هنا كلهم ستات؟
      ar: يا سيد هارجو، هل كل من يرسم الباتيك هنا نساء؟
      en: Pak Harjo, is everyone drawing batik here a woman?
    - speaker: Pak Harjo
      text: Kathah-kathahipun estri. Ingkang jaler nglorod kain ing wingking.
      ar_eg: أغلبهم ستات. الرجالة بيغلوا القماش ورا.
      ar: معظمهم نساء. والرجال يغلون القماش في الخلف.
      en: Mostly women. The men boil the cloth at the back.
    - speaker: Mohamed
      text: Nglorod niku panas, nggih? Kringetipun kathah sanget!
      ar_eg: الغلي ده سخن، صح؟ العرق كتير أوي!
      ar: الغلي حارّ، أليس كذلك؟ العرق كثير جدًا!
      en: Boiling the wax off is hot, right? They're dripping with sweat!
    - speaker: Pak Harjo
      text: Nggih. Padamelan menika awrat, ananging kula remen.
      ar_eg: أيوه. الشغل ده تقيل، بس أنا بحبه.
      ar: نعم. هذا العمل شاق، لكنّي أحبّه.
      en: Yes. It's hard work, but I love it.
    - speaker: Mohamed
      text: Kula ngraos bingah ing ngriki, Pak.
      ar_eg: أنا حاسس إني مبسوط هنا يا أستاذ.
      ar: أشعر بالسعادة هنا يا أستاذ.
      en: I feel happy here, sir.
    - speaker: Pak Harjo
      text: Kadhang kula ugi mbatik ngantos sonten, mboten krasa.
      ar_eg: أحيانًا أنا كمان برسم لحد العصر ومش بحس بالوقت.
      ar: أحيانًا أرسم أنا أيضًا حتى العصر دون أن أشعر بالوقت.
      en: Sometimes I do batik until the afternoon too, without noticing.
