schema: kabar.lesson/v1
id: j3.u06.l06
language: jv
title: Padamelan ing bathikan
can_do:
  ar_eg: 'تسأل في ورشة باتيك في جيريلويو مين بيعمل إيه: الستات والرجالة، الشغل والعرق، أحيانًا، وتقول إنت حاسس بإيه.'
  ar: 'أن تسأل في ورشة باتيك في جيريلويو من يعمل ماذا: النساء والرجال، العمل والعرق، أحيانًا، وتقول بماذا تشعر.'
  en: 'Ask who does what in a Giriloyo batik workshop: women and men, work and sweat, sometimes, and say how you feel.'
slides:
  - title: Sinten ingkang mbatik?
    body:
      ar_eg: |
        mbatik = يرسم باتيك بالشمع (من batik). nglorod = يغلي القماش عشان الشمع يطلع (lorodan).
        gawean ← padamelan = شغل، وظيفة.
        wedok ← estri = ست، أنثى. lanang ← jaler = راجل، ذكر.
        kringet = عرق: نار nglorod سخنة، الكرينجيت بينزل!
        kadhang = أحيانًا (kadhang-kadhang).
        rumangsa ← ngraos = يحس: «Kula ngraos bingah» = حاسس إني مبسوط.
      ar: |
        mbatik = يرسم الباتيك بالشمع (من batik). nglorod = يغلي القماش لإزالة الشمع (lorodan).
        gawean ← padamelan = عمل، وظيفة.
        wedok ← estri = امرأة، أنثى. lanang ← jaler = رجل، ذكر.
        kringet = عرق: نار nglorod حارّة، والعرق يسيل!
        kadhang = أحيانًا (kadhang-kadhang).
        rumangsa ← ngraos = يشعر: «Kula ngraos bingah» = أشعر بالسعادة.
      en: |
        mbatik = draw batik with wax (from batik). nglorod = boil the cloth to take the wax off (lorodan).
        gawean → padamelan = work, job.
        wedok → estri = woman, female. lanang → jaler = man, male.
        kringet = sweat: the nglorod fire is hot, the sweat pours!
        kadhang = sometimes (kadhang-kadhang).
        rumangsa → ngraos = feel: "Kula ngraos bingah" = I feel happy.
    examples:
      - text: Ingkang mbatik kathah-kathahipun estri.
        ar_eg: اللي بيرسموا باتيك أغلبهم ستات.
        ar: معظم من يرسمون الباتيك نساء.
        en: Most of the people drawing batik are women.
      - text: Ingkang jaler nglorod kain ing wingking.
        ar_eg: الرجالة بيغلوا القماش ورا.
        ar: الرجال يغلون القماش في الخلف.
        en: The men boil the cloth at the back.
      - text: Kadhang kula mbatik ngantos sonten.
        ar_eg: أحيانًا برسم باتيك لحد العصر.
        ar: أحيانًا أرسم الباتيك حتى العصر.
        en: Sometimes I do batik until the afternoon.
