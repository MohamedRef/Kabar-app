schema: kabar.lesson/v1
id: j2.u03.l06
language: jv
title: Kulakan lan dodolan
can_do:
  ar_eg: 'تفهم البياعين: البضاعة اتشرت منين، والفصال، والخسارة، والفرق في السعر، وتطلب كيس.'
  ar: 'أن تفهم الباعة: من أين اشتروا البضاعة، والمساومة والخسارة وفرق السعر، وأن تطلب كيسًا.'
  en: 'Follow market sellers: where they buy stock, haggling, making a loss, the price difference, and ask for a bag.'
slides:
  - title: Neng pasar
    body:
      ar_eg: |
        - **kulakan** = يشتري بضاعة جملة عشان يبيعها (kulakan) · **dodolan** = يبيع، عنده فرشة (berjualan).
        - **ngenyang** = يفاصل (menawar): Oleh ngenyang, Bu? · **tuna** = يخسر (rugi): Mengko aku tuna!
        - **kacek** = الفرق (selisih): Keceke mung sewu = الفرق ألف بس.
        - **kresek** = كيس بلاستيك (tas kresek) · **dhewekan** = لوحده (sendirian).
        - **tiwul** = أكل من دقيق الكسافا، من جونونج كيدول وباتشيتان.
      ar: |
        - **kulakan** = يشتري البضاعة جملةً ليبيعها (kulakan) · **dodolan** = يبيع في بسطة (berjualan).
        - **ngenyang** = يساوم (menawar): Oleh ngenyang, Bu? · **tuna** = يخسر (rugi): Mengko aku tuna!
        - **kacek** = الفرق (selisih): Keceke mung sewu = الفرق ألف فقط.
        - **kresek** = كيس بلاستيكي (tas kresek) · **dhewekan** = وحده (sendirian).
        - **tiwul** = طعام من دقيق الكسافا، من غونونغ كيدول وباتشيتان.
      en: |
        - **kulakan** = buy stock wholesale to resell (kulakan) · **dodolan** = sell, run a stall (berjualan).
        - **ngenyang** = haggle (menawar): Oleh ngenyang, Bu? · **tuna** = make a loss (rugi): Mengko aku tuna!
        - **kacek** = the difference (selisih): Keceke mung sewu = The difference is only a thousand.
        - **kresek** = plastic bag (tas kresek) · **dhewekan** = alone (sendirian).
        - **tiwul** = a staple made from cassava flour, from Gunungkidul and Pacitan.
    examples:
      - text: Bu Karti kulakan bawang neng Nganjuk.
        ar_eg: بو كارتي بتشتري البصل جملة من نجانجوك.
        ar: تشتري بو كارتي البصل جملةً من نغانجوك.
        en: Bu Karti buys her onion stock in Nganjuk.
      - text: Aja ngenyang banget, mengko aku tuna.
        ar_eg: ماتفاصلش أوي، كده هخسر.
        ar: لا تساوم كثيرًا، وإلا خسرت.
        en: Don't haggle too hard, or I'll make a loss.
      - text: Njaluk kresek, Bu.
        ar_eg: عايز كيس يا حاجة.
        ar: أريد كيسًا يا سيدتي.
        en: A bag, please, ma'am.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kulakan
        ar_eg: يشتري جملة عشان يبيع
        ar: يشتري جملة ليبيع
        en: buy stock to resell
      - text: dodolan
        ar_eg: يبيع (عنده فرشة)
        ar: يبيع في بسطة
        en: sell, run a stall
      - text: ngenyang
        ar_eg: يفاصل
        ar: يساوم
        en: haggle
      - text: kresek
        ar_eg: كيس بلاستيك
        ar: كيس بلاستيكي
        en: plastic bag
    words: [kulakan, dodolan, ngenyang, kresek]
  - id: e02
    type: match_pairs
    pairs:
      - text: tuna
        ar_eg: يخسر
        ar: يخسر
        en: make a loss
      - text: dhewekan
        ar_eg: لوحده
        ar: وحده
        en: alone
      - text: tiwul
        ar_eg: تيوول (أكل كسافا)
        ar: تيوول (طعام الكسافا)
        en: tiwul (cassava staple)
      - text: kacek
        ar_eg: الفرق
        ar: الفرق
        en: difference
    words: [tuna, dhewekan, tiwul, kacek]
  - id: e03
    type: listen
    text: Bu Karti kulakan bawang neng Nganjuk.
    question:
      ar_eg: بو كارتي بتعمل إيه في نجانجوك؟
      ar: ماذا تفعل بو كارتي في نغانجوك؟
      en: What does Bu Karti do in Nganjuk?
    options: [بتشتري البصل جملة من نجانجوك, بتبيع بصل في ماديون, بتزرع بصل]
    answer: 0
    meaning:
      ar_eg: بو كارتي بتشتري البصل جملة من نجانجوك.
      ar: تشتري بو كارتي البصل جملةً من نغانجوك.
      en: Bu Karti buys her onion stock in Nganjuk.
    words: [kulakan]
  - id: e04
    type: fill_blank
    sentence: Aja ___ banget, Mas, mengko aku tuna.
    meaning:
      ar_eg: ماتـ ___ ش أوي يا ماس، كده هخسر.
      ar: لا ___ كثيرًا يا أخي، وإلا خسرت.
      en: Don't ___ too hard, Mas, or I'll make a loss.
    options: [ngenyang, dodolan, kresek]
    answers: [ngenyang]
    words: [ngenyang, tuna, dodolan, kresek]
    explain:
      ar_eg: ngenyang = يفاصل في السعر، وعشان كده البياعة خايفة تخسر. dodolan = يبيع، وkresek = كيس بلاستيك.
      ar: ngenyang = يساوم، ولذلك تخشى البائعة الخسارة؛ أما dodolan فيبيع، وkresek كيس بلاستيك.
      en: ngenyang = haggle, hence the seller's worry. dodolan = sell, kresek = plastic bag.
  - id: e05
    type: fill_blank
    sentence: Bu Siti ___ dhewekan neng pasar.
    meaning:
      ar_eg: بو سيتي بـ ___ لوحدها في السوق.
      ar: بو سيتي ___ وحدها في السوق.
      en: Bu Siti ___ on her own at the market.
    options: [dodolan, kulakan, tiwul]
    answers: [dodolan]
    words: [dodolan, dhewekan, kulakan, tiwul]
    explain:
      ar_eg: dodolan = بتبيع (بتفرش في السوق). kulakan = تشتري بضاعة جملة، وtiwul = أكلة من الكاسافا.
      ar: dodolan = تبيع في السوق؛ أما kulakan فتشتري البضاعة بالجملة، وtiwul طعام من الكسافا.
      en: dodolan = sell (at a stall). kulakan = buy stock wholesale, tiwul = a cassava dish.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: عايز كيس بلاستيك. بتقول إيه؟
      ar: تريد كيسًا بلاستيكيًا. ماذا تقول؟
      en: You want a plastic bag. What do you say?
    options: ['Njaluk kresek, Bu.', 'Njaluk tiwul, Bu.', 'Njaluk kacek, Bu.']
    answer: 0
    explain:
      ar_eg: kresek = كيس بلاستيك. tiwul = أكل، وkacek = الفرق.
      ar: kresek = كيس بلاستيكي، أما tiwul فطعام وkacek الفرق.
      en: kresek = plastic bag. tiwul = food, kacek = difference.
    words: [kresek, tiwul, kacek]
  - id: e07
    type: multiple_choice
    question: Keceke mung sewu.
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [الفرق ألف بس, السعر ألف, الكيس بألف]
    answer: 0
    explain:
      ar_eg: kacek = الفرق، وmung = بس.
      ar: kacek = الفرق، وmung = فقط.
      en: kacek = difference, mung = only.
    words: [kacek]
  - id: e08
    type: build_sentence
    source:
      ar_eg: لو السعر تلات آلاف، هخسر.
      ar: إن كان السعر ثلاثة آلاف خسرت.
      en: At three thousand, I'd make a loss.
    answer: Aku tuna yen regane telung ewu.
    distractors: [kresek, dhewekan]
    words: [tuna]
    explain:
      ar_eg: tuna = أخسر، وyen regane telung ewu = لو السعر تلات تلاف. kresek = كيس، وdhewekan = لوحدي، ومش في المعنى.
      ar: tuna = أخسر، وyen regane telung ewu = إذا كان السعر ثلاثة آلاف؛ أما kresek فكيس، وdhewekan وحدي، وليسا في المعنى.
      en: tuna = lose out, yen regane telung ewu = if the price is three thousand. kresek and dhewekan aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Bu Siti dodolan tiwul dhewekan.
    answers_meaning:
      ar_eg: [بو سيتي بتبيع تيوول لوحدها, الست سيتي بتبيع التيوول لوحدها]
      ar: [تبيع بو سيتي التيوول وحدها]
      en: [Bu Siti sells tiwul on her own, Bu Siti runs a tiwul stall alone]
    words: [dodolan, tiwul, dhewekan]
  - id: e10
    type: speaking
    text: Oleh ngenyang, keceke sithik wae.
    meaning:
      ar_eg: ينفع تفاصل، بس الفرق يبقى صغير.
      ar: يمكنك المساومة، لكن بفرق صغير.
      en: You can haggle, but only by a little.
    words: [ngenyang, kacek]
dialogue:
  lines:
    - speaker: Mohamed
      text: Bu, bawang abang sekilo telung puluh ewu? Oleh ngenyang?
      ar_eg: يا حاجة، كيلو البصل الأحمر بتلاتين ألف؟ ينفع أفاصل؟
      ar: يا سيدتي، كيلو البصل الأحمر بثلاثين ألفًا؟ هل أساوم؟
      en: Ma'am, thirty thousand for a kilo of shallots? Can I haggle?
    - speaker: Bu Karti
      text: Waduh, Mas, aku kulakan wae wis larang. Mengko tuna.
      ar_eg: يا ساتر يا ماس، أنا شارياه جملة غالي أصلًا. كده أخسر.
      ar: يا إلهي يا أخي، اشتريته جملةً غاليًا أصلًا. سأخسر.
      en: Oh, Mas, even my stock was pricey. I'll make a loss.
    - speaker: Mohamed
      text: Selawe, nggih? Keceke mung limang ewu.
      ar_eg: خمسة وعشرين، ماشي؟ الفرق خمس آلاف بس.
      ar: خمسة وعشرون، حسنًا؟ الفرق خمسة آلاف فقط.
      en: Twenty-five, OK? It's only five thousand difference.
    - speaker: Bu Karti
      text: Ya wis, selawe. Kreseke siji apa loro?
      ar_eg: خلاص، خمسة وعشرين. كيس واحد ولا اتنين؟
      ar: حسنًا، خمسة وعشرون. كيس واحد أم اثنان؟
      en: All right, twenty-five. One bag or two?
    - speaker: Mohamed
      text: Siji wae, Bu. Ibu dodolan dhewekan?
      ar_eg: واحد بس يا حاجة. إنتي بتبيعي لوحدك؟
      ar: واحد فقط يا سيدتي. هل تبيعين وحدك؟
      en: Just one, ma'am. Do you run the stall alone?
    - speaker: Bu Karti
      text: Iya, Bagus lagi sinau.
      ar_eg: آه، باجوس بيذاكر.
      ar: نعم، باغوس يدرس.
      en: Yes, Bagus is studying.
