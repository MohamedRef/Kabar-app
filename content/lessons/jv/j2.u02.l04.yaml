  - id: e03
    type: listen
    text: Sambel kacange pedhes tenan.
    question:
      ar_eg: إيه اللي حرّاق؟
      ar: ما الحارّ؟
      en: What's hot?
    options: [صوص الفول السوداني حرّاق أوي, البصل مقلي, الفرخة مقرمشة]
    answer: 0
    meaning:
      ar_eg: صوص الفول السوداني حرّاق أوي.
      ar: صلصة الفول السوداني حارّة جدًّا.
      en: The peanut sauce is really hot.
    words: [sambel, kacang, brambang, pitik]
  - id: e04
    type: fill_blank
    sentence: Peyeke ___, enak tenan!
    meaning:
      ar_eg: البيبيك ___، حلو أوي!
      ar: البيبيك ___، لذيذ جدًّا!
      en: The peyek is ___, really good!
    options: [gurih, pait, kecut]
    answers: [gurih]
    words: [gurih, peyek]
    explain:
      ar_eg: gurih = طعمه حلو مالح كده (مقرمش ولذيذ)، وعشان كده «حلو أوي». pait = مُر، وkecut = حامض.
      ar: gurih = لذيذ مالح، ولذلك «لذيذ حقًا»؛ أما pait فمُرّ، وkecut حامض.
      en: gurih = savoury, hence "really good". pait = bitter, kecut = sour.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «فرخة مقلية» بالجاوي؟
      ar: كيف تقول «دجاج مقلي» بالجاوية؟
      en: '"Fried chicken" in Javanese?'
    options: [pitik goreng, brambang pitik, godhong pitik]
    answer: 0
    explain:
      ar_eg: pitik = فرخة، goreng = مقلي.
      ar: pitik = دجاجة، goreng = مقلي.
      en: pitik = chicken, goreng = fried.
    words: [pitik, goreng, brambang, godhong]
  - id: e06
    type: fill_blank
    sentence: Sega pecel dibungkus ___ gedhang.
    meaning:
      ar_eg: سيجا البيتشيل بتتلف في ___ موز.
      ar: يُلفّ أرز البيتشيل في ___ الموز.
      en: Pecel rice is wrapped in banana ___.
    options: [godhong, kacang, peyek]
    answers: [godhong]
    words: [godhong, kacang, peyek]
    explain:
      ar_eg: godhong gedhang = ورق موز. kacang = فول سوداني، وpeyek = بسكوت مقرمش، ومش للف الأكل.
      ar: godhong gedhang = ورق الموز؛ أما kacang ففول سوداني، وpeyek رقائق مقرمشة، ولا يُلفّ بهما الطعام.
      en: godhong gedhang = banana leaf. kacang (peanuts) and peyek (cracker) aren't for wrapping.
  - id: e07
    type: multiple_choice
    question: Aku ora seneng sambel, pedhes.
    question_meaning:
      ar_eg: ليه مش بيحب السامبل؟
      ar: لماذا لا يحبّ السامبل؟
      en: Why doesn't he like sambel?
    options: [عشان حرّاق, عشان مسكّر, عشان مالح]
    answer: 0
    explain:
      ar_eg: pedhes = حرّاق، legi = مسكّر، asin = مالح.
      ar: pedhes = حارّ، legi = حلو، asin = مالح.
      en: pedhes = spicy, legi = sweet, asin = salty.
    words: [sambel]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عايز فرخة مقلية ورز.
      ar: أريد دجاجًا مقليًّا مع أرز.
      en: I'd like fried chicken with rice.
    answer: Aku njaluk pitik goreng karo sega.
    distractors: [peyek, brambang]
    words: [pitik, goreng, peyek, brambang]
    explain:
      ar_eg: njaluk = عايز، وpitik goreng karo sega = فراخ مقلية برز. peyek = مقرمشات، وbrambang = بصل أحمر صغير، ومش في المعنى.
      ar: njaluk = أطلب، وpitik goreng karo sega = دجاج مقلي مع أرز؛ أما peyek فرقائق، وbrambang بصل صغير، وليسا في المعنى.
      en: njaluk = I'd like, pitik goreng karo sega = fried chicken with rice. peyek and brambang aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Brambang gorenge gurih.
    answers_meaning:
      ar_eg: [البصل المقلي مقرمش وطعمه حلو, البصل المحمّر طعمه حلو]
      ar: [البصل المقلي مقرمش لذيذ, البصل المقلي شهيّ]
      en: [The fried shallots are savoury, The fried shallots are tasty]
    words: [brambang, goreng, gurih]
  - id: e10
    type: speaking
    text: Sambel kacang karo peyek, enak tenan!
    meaning:
      ar_eg: صوص الفول السوداني مع البيبيك، حلو أوي!
      ar: صلصة الفول السوداني مع البيبيك، لذيذة جدًّا!
      en: Peanut sauce with peyek, so good!
    words: [sambel, kacang, peyek]
dialogue:
  lines:
    - speaker: Bu Darmi
      text: Ayo, Mas. Sega? Pitik goreng utawa endhog?
      ar_eg: اتفضل يا ماس. رز؟ فراخ مقلية ولا بيض؟
      ar: تفضّل يا ماس. أرز؟ دجاج مقلي أم بيض؟
      en: Come in, Mas. Rice? Fried chicken or egg?
    - speaker: Mohamed
      text: Pitik goreng, Bu. Sambel kacange pedhes?
      ar_eg: فرخة مقلية يا طنط. صوص الفول السوداني حرّاق؟
      ar: دجاج مقلي يا سيّدتي. هل صلصة الفول السوداني حارّة؟
      en: Fried chicken, Bu. Is the peanut sauce hot?
    - speaker: Bu Darmi
      text: Rada pedhes. Nganggo peyek? Gurih lho.
      ar_eg: حرّاق شوية. تحب بيبيك؟ مقرمش وطعمه حلو.
      ar: حارّة قليلًا. تريد بيبيكًا؟ إنّه لذيذ مقرمش.
      en: A bit hot. With peyek? It's really savoury.
    - speaker: Mohamed
      text: Iya, Bu. Brambang gorenge sithik wae.
      ar_eg: أيوه يا طنط. والبصل المقلي شوية بس.
      ar: نعم يا سيّدتي. والقليل فقط من البصل المقلي.
      en: Yes, Bu. Just a little fried shallot.
    - speaker: Bu Darmi
      text: Oke, nganggo godhong. Mangan kene apa mulih?
      ar_eg: ماشي، في ورق موز. هتاكل هنا ولا تاخده البيت؟
      ar: حسنًا، في ورقة موز. ستأكل هنا أم في البيت؟
      en: Sure, in a leaf. Eating here or at home?
