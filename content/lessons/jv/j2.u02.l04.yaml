schema: kabar.lesson/v1
id: j2.u02.l04
language: jv
title: Sambel kacang
can_do:
  ar_eg: 'تطلب أكل الوارونج: فرخة مقلية وصوص الفول السوداني والبيبيك، وتفهم مكوّناته.'
  ar: 'أن تطلب طعام المطعم الشعبي: دجاجًا مقليًّا وصلصة الفول السوداني والبيبيك، وتفهم مكوّناته.'
  en: 'Order warung food: fried chicken, peanut sauce and peyek, and know what''s in it.'
slides:
  - title: Pecel Madiun
    body:
      ar_eg: |
        sambel = صوص شطة، kacang = فول سوداني (أو فول عمومًا): sambel kacang = صوص البيتشيل.
        peyek = بسكوت مقرمش بالفول السوداني، gurih = طعمه مالح حلو ومقرمش (أومامي).
        pitik = فرخة (بالإندونيسي ayam)، goreng = مقلي: pitik goreng.
        brambang = بصل أحمر صغير (= bawang abang). godhong = ورقة شجر: سيجا البيتشيل بتتلف في godhong gedhang (ورق موز).
      ar: |
        sambel = صلصة الشطّة، kacang = فول سوداني (أو بقول عمومًا): sambel kacang = صلصة البيتشيل.
        peyek = رقائق مقرمشة بالفول السوداني، gurih = مالح لذيذ مقرمش (أومامي).
        pitik = دجاجة (بالإندونيسية ayam)، goreng = مقلي: pitik goreng.
        brambang = بصل أحمر صغير (= bawang abang). godhong = ورقة شجر: يُلفّ أرز البيتشيل في godhong gedhang (ورق الموز).
      en: |
        sambel = chilli sauce, kacang = peanuts (or beans): sambel kacang = pecel sauce.
        peyek = crunchy peanut cracker, gurih = savoury, umami.
        pitik = chicken (Indonesian ayam), goreng = fried: pitik goreng.
        brambang = shallot (= bawang abang). godhong = leaf: pecel rice comes wrapped in godhong gedhang (banana leaf).
    examples:
      - text: Sambel kacange pedhes tenan.
        ar_eg: صوص الفول السوداني حرّاق أوي.
        ar: صلصة الفول السوداني حارّة جدًّا.
        en: The peanut sauce is really hot.
      - text: Peyeke gurih.
        ar_eg: البيبيك مقرمش وطعمه حلو.
        ar: البيبيك مقرمش لذيذ.
        en: The peyek is savoury.
      - text: Aku njaluk pitik goreng karo sega.
        ar_eg: عايز فرخة مقلية ورز.
        ar: أريد دجاجًا مقليًّا مع أرز.
        en: I'd like fried chicken with rice.
