dialogue:
  title: Mohamed pesen dhéwé
  lines:
    - speaker: Bu Darmi
      text: Mas Mohamed! Pesen apa?
      ar_eg: أستاذ محمد! هتطلب إيه؟
      ar: أخي محمد! ماذا تطلب؟
      en: Mas Mohamed! What are you having?
    - speaker: Mohamed
      text: Sega pecel siji, nganggo endhog. Pedhes, Bu!
      ar_eg: واحد رز بيتشل بالبيض. حرّاق يا طنط!
      ar: طبق أرز بيتشل بالبيض. حارًّا يا سيدتي!
      en: One pecel rice with egg. Spicy, ma'am!
    - speaker: Bu Darmi
      text: Pedhes? Tenan?
      ar_eg: حرّاق؟ بجد؟
      ar: حارًّا؟ حقًا؟
      en: Spicy? Really?
    - speaker: Mohamed
      text: Iya, Bu. Aku seneng sing pedhes.
      ar_eg: أيوه يا طنط. أنا بحب الحرّاق.
      ar: نعم يا سيدتي. أحب الطعام الحارّ.
      en: Yes, ma'am. I like it spicy.
    - speaker: Bu Darmi
      text: Wah, apik! Mangan kéné apa dibungkus?
      ar_eg: الله! هتاكل هنا ولا تيك أواي؟
      ar: رائع! تأكل هنا أم سفري؟
      en: Great! Eating here or take away?
    - speaker: Mohamed
      text: Mangan kéné, Bu. Karo es teh legi.
      ar_eg: هاكل هنا يا طنط. ومعاه شاي بتلج مسكّر.
      ar: سآكل هنا يا سيدتي، ومعه شاي مثلّج حلو.
      en: Eating here, ma'am. With a sweet iced tea.
souvenir:
  id: j2.u02.souvenir
  title: Nasi pecel Madiun
  note:
    ar_eg: "ماديون هي بيت الـ nasi pecel: خضار مسلوقة عليها صوص فول سوداني، وتيمبيه وrempeyek مقرمش، وساعات بتتقدم على ورقة شجر الساج (godhong jati) بدل الطبق. لما تقول للبياعة «Pedhes, Bu!» هتعرف إنك بقيت من أهل البيت. ومعاك دلوقتي طلبك كامل بالجاوي، بالهنا والشفا!"
    ar: "ماديون موطن الـ nasi pecel: خضار مسلوقة بصلصة الفول السوداني، مع التمبيه ورقائق rempeyek المقرمشة، وقد يُقدَّم على ورقة شجر الساج (godhong jati) بدل الطبق. وحين تقول للبائعة «Pedhes, Bu!» تكون قد صرت من أهل المكان. صار طلبك كله بالجاوية، فهنيئًا مريئًا!"
    en: Madiun is the home of nasi pecel — boiled greens under peanut sauce, with tempeh and crunchy rempeyek, sometimes served on a teak leaf (godhong jati) instead of a plate. Say "Pedhes, Bu!" to the seller and you'll feel like a local. You can now order a whole meal in Javanese — enjoy it!
