language: jv
title: Ulangan J2.2
can_do:
  ar_eg: تطلب وجبة كاملة بالجاوي.
  ar: أن تطلب وجبة كاملة بالجاوية.
  en: Order a meal.
slides:
  - title: Ringkesan J2.2
    body:
      ar_eg: |
        - N- = meN- من غير «me»: tulis → nulis، waca → maca، ombé → ngombé، gawé → nggawé، sapu → nyapu، kirim → ngirim، pikir → mikir (فكر)، jupuk → njupuk، bukak → mbukak.
        - من غير N-: tuku، turu، lunga، teka، adus.
        - مع di- / tak- الأصل بيرجع: diwaca، tak tulis.
        - الطعم: enak، pedhes، legi، asin، kecut، pait، anyep + tenan / banget (بعد الصفة)، rada / kurang (قبلها).
        - الطلب: Sega pecel siji, nganggo endhog. · Pedhes apa ora? · Mangan kéné apa dibungkus? · Kabèh pira?
      ar: |
        - N- = meN- بلا «me»: tulis → nulis، waca → maca، ombé → ngombé، gawé → nggawé، sapu → nyapu، kirim → ngirim، pikir → mikir (فكر)، jupuk → njupuk، bukak → mbukak.
        - بلا N-: tuku، turu، lunga، teka، adus.
        - مع di- / tak- يعود الجذر: diwaca، tak tulis.
        - الطعم: enak، pedhes، legi، asin، kecut، pait، anyep، مع tenan / banget بعد الصفة، وrada / kurang قبلها.
        - الطلب: Sega pecel siji, nganggo endhog. · Pedhes apa ora? · Mangan kéné apa dibungkus? · Kabèh pira?
      en: |
        - N- = meN- without "me": tulis → nulis, waca → maca, ombé → ngombé, gawé → nggawé, sapu → nyapu, kirim → ngirim, pikir → mikir (فكر), jupuk → njupuk, bukak → mbukak.
        - No N-: tuku, turu, lunga, teka, adus.
        - With di- / tak- the base returns: diwaca, tak tulis.
        - Taste: enak, pedhes, legi, asin, kecut, pait, anyep + tenan / banget (after), rada / kurang (before).
        - Ordering: Sega pecel siji, nganggo endhog. · Pedhes apa ora? · Mangan kéné apa dibungkus? · Kabèh pira?
    grammar: jv.prefix.nasal
