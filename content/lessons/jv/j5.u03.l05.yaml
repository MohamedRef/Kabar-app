schema: kabar.lesson/v1
id: j5.u03.l05
language: jv
title: Chat saka Mbak Ayu
can_do:
  ar_eg: تقرا رسايل شات مكتوبة على السمع وتفهمها وترجّعها للإملا الصح.
  ar: أن تقرأ رسائل دردشة مكتوبة كما تُنطق وتفهمها وتعيدها إلى الإملاء القياسي.
  en: Read chat messages spelled by ear, understand them and restore the standard spelling.
slides:
  - title: Ayu lara
    body:
      ar_eg: |
        آيو بعتتلك الرسايل دي على واتساب، مكتوبة زي ما بتتنطق. اقراها الأول عشان تفهم، وبعدين رجّع كل كلمة لإملاها الصح (المكتوب بين القوسين).
        خد بالك: loro هنا مش «اتنين»، دي lara (عيانة) مكتوبة على السمع. وmari = خفّ / بقى كويس (sembuh).
      ar: |
        أرسلت لك آيو هذه الرسائل على واتساب، مكتوبة كما تُنطق. اقرأها أولًا لتفهمها، ثم أعِد كل كلمة إلى إملائها القياسي (المكتوب بين القوسين).
        انتبه: loro هنا ليست «اثنين»، بل lara (مريضة) مكتوبة كما تُسمع. وmari = شُفي (sembuh).
      en: |
        Ayu sent you these WhatsApp messages, spelled the way they sound. Read them first for meaning, then restore each word's standard spelling (in brackets).
        Careful: loro here isn't "two"; it's lara (sick) written by ear. And mari = to get well (sembuh).
    grammar: jv.orthography
    examples:
      - text: Waduh, aku lagi loro, ora iso teko.
        ar_eg: يا خبر، أنا عيانة، مش هقدر آجي. (الإملا الصح Aku lagi lara, ora isa teka.)
        ar: يا للأسف، أنا مريضة ولن أستطيع المجيء. (القياسي Aku lagi lara, ora isa teka.)
        en: Oh no, I'm sick, I can't come. (standard Aku lagi lara, ora isa teka.)
      - text: Hawane adem, aku mung arep turu wae.
        ar_eg: الجو برد، أنا عايزة أنام وبس. (الإملا الصح adhem)
        ar: الجو بارد، لا أريد إلا النوم. (القياسي adhem)
        en: The weather's cold, I just want to sleep. (standard adhem)
      - text: Sesuk aku mesti wes mari.
        ar_eg: بكرة أكيد هكون خفّيت. (الإملا الصح Sesuk aku mesthi wis mari.)
        ar: غدًا سأكون قد شُفيت بالتأكيد. (القياسي Sesuk aku mesthi wis mari.)
        en: Tomorrow I'll surely be well. (standard Sesuk aku mesthi wis mari.)
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: ليه آيو مش هتقدر تيجي؟
      ar: لماذا لن تستطيع آيو المجيء؟
      en: Why can't Ayu come?
    options: [amarga udan, amarga lara, amarga adoh]
    answer: 1
    words: [lara]
  - id: e02
    type: multiple_choice
    question: Waduh, aku lagi loro, ora iso teko.
    question_meaning:
      ar_eg: loro هنا تتكتب إزاي في الإملا الصح؟
      ar: كيف تُكتب loro هنا بالإملاء القياسي؟
      en: How is loro here written in standard spelling?
    options: [lora, loro, lara]
    answer: 2
    explain:
      ar_eg: loro (اتنين) فيها o حقيقية. بس «عيانة» = lara، والاتنين بيتنطقوا «لورو».
      ar: loro (اثنان) فيها o حقيقية، أما «مريضة» فهي lara، وكلتاهما تُنطق «لورو».
      en: loro (two) has a real o; "sick" is lara. Both are said "loro".
    words: [lara]
  - id: e03
    type: listen
    text: Sesuk aku mesthi wis mari.
    question:
      ar_eg: آيو بتقول إيه عن بكرة؟
      ar: ماذا تقول آيو عن الغد؟
      en: What does Ayu say about tomorrow?
    options:
      - Dheweke mesthi wis mari.
      - Dheweke arep turu wae.
      - Dheweke arep menyang Simpang Lima.
    answer: 0
    meaning:
      ar_eg: بكرة أكيد هكون خفّيت.
      ar: غدًا سأكون قد شُفيت بالتأكيد.
      en: Tomorrow I'll surely be well.
    words: [mari, mesthi]
  - id: e04
    type: match_pairs
    pairs:
      - text: lara
        ar_eg: عيان
        ar: مريض
        en: sick
      - text: adhem
        ar_eg: برد
        ar: بارد
        en: cold
      - text: mesthi
        ar_eg: أكيد
        ar: بالتأكيد
        en: surely
      - text: mari
        ar_eg: يخفّ / يبقى كويس
        ar: يُشفى
        en: get well
      - text: teka
        ar_eg: ييجي
        ar: يأتي
        en: come
    words: [lara, adhem, mesthi, mari]
  - id: e05
    type: fill_blank
    sentence: Sesuk aku ___ wis mari.
    meaning:
      ar_eg: بكرة أكيد هكون خفّيت.
      ar: غدًا سأكون قد شُفيت بالتأكيد.
      en: Tomorrow I'll surely be well.
    options: [mesti, mesthi]
    answers: [mesthi]
    explain:
      ar_eg: الإملا الصح mesthi بـ th، زي ما اتعلمنا في Minimal Pairs. الشات بيكتبها mesti.
      ar: الإملاء القياسي mesthi بـ th كما في Minimal Pairs، والدردشة تكتبها mesti.
      en: Standard spelling is mesthi, with th, as in Minimal Pairs; chats write mesti.
    words: [mesthi]
  - id: e06
    type: dictation
    text: Aku lagi lara, ora isa teka.
    meaning:
      ar_eg: أنا عيانة، مش هقدر آجي.
      ar: أنا مريضة ولن أستطيع المجيء.
      en: I'm sick, I can't come.
    explain:
      ar_eg: هتسمع «لورو» و«إيسو» و«تيكو»، بس الإملا الصح lara وisa وteka.
      ar: ستسمع «لورو» و«إيسو» و«تيكو»، لكن الإملاء القياسي lara وisa وteka.
      en: You hear "loro", "iso", "teko", but the standard spelling is lara, isa, teka.
    words: [lara]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بالإملا الصح) الجو برد، أنا عايز أنام وبس.
      ar: (بالإملاء القياسي) الجو بارد، لا أريد إلا النوم.
      en: (standard spelling) The weather's cold, I just want to sleep.
    answers:
      - Hawane adhem, aku mung arep turu wae.
      - Hawane adhem, aku mung arep turu.
      - Hawane adhem, aku arep turu wae.
      - Hawane adhem banget, aku mung arep turu wae.
      - Hawane adhem, aku mung kepengin turu.
    words: [adhem, mung]
  - id: e08
    type: build_sentence
    source:
      ar_eg: (بالإملا الصح) بكرة أكيد هكون خفّيت.
      ar: (بالإملاء القياسي) غدًا سأكون قد شُفيت بالتأكيد.
      en: (standard spelling) Tomorrow I'll surely be well.
    answer: Sesuk aku mesthi wis mari.
    distractors: [mesti, wes]
    words: [mesthi, mari]
  - id: e09
    type: fill_blank
    sentence: Aku ___ arep turu wae.
    meaning:
      ar_eg: أنا عايز أنام وبس.
      ar: أريد أن أنام فقط.
      en: I just want to sleep.
    options: [mung, wis, lagi]
    answers: [mung]
    words: [mung]
  - id: e10
    type: multiple_choice
    question: Aku mung ngombe teh.
    question_meaning:
      ar_eg: معنى الجملة دي إيه؟
      ar: ما معنى هذه الجملة؟
      en: What does this sentence mean?
    options: ['أنا بشرب شاي بس.', 'أنا مش بشرب شاي.', 'أنا بشرب شاي كتير.']
    answer: 0
    explain:
      ar_eg: mung = بس / فقط (hanya)، وبتيجي قبل الفعل.
      ar: mung = فقط (hanya)، وتأتي قبل الفعل.
      en: mung = only (hanya); it goes before the verb.
    words: [mung]
dialogue:
  title: Telpon saka Mohamed
  lines:
    - speaker: Mohamed
      text: Mbak, aku maca chatmu. Kowe lara apa?
      ar_eg: يا آيو، قريت رسايلك. إنتي عيانة بإيه؟
      ar: يا آيو، قرأت رسائلك. ما مرضك؟
      en: Ayu, I read your chat. What's wrong with you?
    - speaker: Mbak Ayu
      text: Mung masuk angin. Hawane adhem banget.
      ar_eg: دور برد بسيط. الجو برد أوي.
      ar: مجرد نزلة برد خفيفة. الجو بارد جدًا.
      en: Just a chill. The weather's really cold.
    - speaker: Mohamed
      text: Muga-muga cepet mari, ya.
      ar_eg: ألف سلامة، إن شاء الله تخفّي بسرعة.
      ar: أتمنى لكِ الشفاء العاجل.
      en: I hope you get well soon.
    - speaker: Mbak Ayu
      text: Suwun. Sesuk aku mesthi wis mari.
      ar_eg: ميرسي. بكرة أكيد هكون خفّيت.
      ar: شكرًا. غدًا سأكون قد شُفيت بالتأكيد.
      en: Thanks. Tomorrow I'll surely be well.
    - speaker: Mohamed
      text: Eh, ing chat kowe nulis "loro", nanging tulisan baku "lara"!
      ar_eg: آه بالمناسبة، في الشات كتبتي «loro»، بس الإملا الصح «lara»!
      ar: بالمناسبة، كتبتِ في الدردشة «loro»، لكن الإملاء القياسي «lara»!
      en: Oh, in the chat you wrote "loro", but the standard spelling is "lara"!
new_words:
  - word: mari
    pos: verb
    ar_eg: يخفّ / يبقى كويس
    ar: يُشفى
    en: get well, recover = sembuh
  - word: mung
    pos: adverb
    ar_eg: بس، فقط
    ar: فقط
    en: only, just = hanya, cuma
