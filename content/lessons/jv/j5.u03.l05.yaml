schema: kabar.lesson/v1
id: j5.u03.l05
language: jv
title: Ilat lan cangkem
can_do:
  ar_eg: تتمرن على النطق بلسانك، وتقول إنك صاحي بدري أو مصدّع أو نفسك مكتوم.
  ar: أن تتدرّب على النطق بلسانك، وتقول إنك مستيقظ باكرًا أو مصاب بالصداع أو ضيق النفَس.
  en: Practise pronunciation with your tongue, and say you're up early, have a headache or feel short of breath.
slides:
  - title: Ilat munggah
    body:
      ar_eg: |
        عشان تنطق dh وth صح، ilat (اللسان) بيطلع لفوق ويرجع لورا شوية.
        cangkem = بق، بس كلمة خشنة (للحيوانات أو في الخناق). driji = صباع. melek = صاحي وعينه مفتوحة (melek huruf = بيعرف يقرا).
        ngelu = مصدّع، sesek = مكتوم (نفَس) أو زحمة، kaku = ناشف ومش بيتحرك، cukur = يحلق.
      ar: |
        لنطق dh وth صحيحًا يرتفع ilat (اللسان) ويرجع إلى الخلف قليلًا.
        cangkem = فم، لكنها كلمة خشنة (للحيوان أو في الشجار). driji = إصبع. melek = مستيقظ مفتوح العينين (melek huruf = يعرف القراءة).
        ngelu = صداع، sesek = ضيق (نفَس) أو زحام، kaku = متيبّس، cukur = يحلق.
      en: |
        To say dh and th right, your ilat (tongue) goes up and slightly back.
        cangkem = mouth, but coarse (for animals or in a fight). driji = finger. melek = awake, eyes open (melek huruf = literate).
        ngelu = have a headache, sesek = short of breath, cramped, kaku = stiff, cukur = shave, get a haircut.
    examples:
      - text: Yen nyebut 'dh', ilatmu munggah.
        ar_eg: لما تنطق dh، لسانك بيطلع لفوق.
        ar: عند نطق dh يرتفع لسانك.
        en: When you say 'dh', your tongue goes up.
      - text: Sirahku ngelu banget.
        ar_eg: دماغي مصدعة أوي.
        ar: رأسي يؤلمني جدًا.
        en: I've got a bad headache.
      - text: Drijiku kaku amarga kadhemen.
        ar_eg: صوابعي ناشفة من البرد.
        ar: أصابعي متيبّسة من البرد.
        en: My fingers are stiff from the cold.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ilat
        ar_eg: لسان
        ar: لسان
        en: tongue
      - text: cangkem
        ar_eg: بق (خشنة)
        ar: فم (لفظ خشن)
        en: mouth (coarse)
      - text: driji
        ar_eg: صباع
        ar: إصبع
        en: finger
      - text: melek
        ar_eg: صاحي
        ar: مستيقظ
        en: awake
    words: [ilat, cangkem, driji, melek]
  - id: e02
    type: match_pairs
    pairs:
      - text: ngelu
        ar_eg: مصدّع
        ar: يعاني صداعًا
        en: headache
      - text: sesek
        ar_eg: مكتوم
        ar: ضيق
        en: short of breath
      - text: cukur
        ar_eg: يحلق
        ar: يحلق
        en: shave, haircut
      - text: kaku
        ar_eg: ناشف
        ar: متيبّس
        en: stiff
    words: [ngelu, sesek, cukur, kaku]
  - id: e03
    type: listen
    text: Dhokter, sirahku ngelu lan drijiku kaku.
    question:
      ar_eg: بيشتكي من إيه؟
      ar: مِمَّ يشكو؟
      en: What's the complaint?
    options: [صداع وصوابع ناشفة, وجع في البطن, سنانه بتوجعه]
    answer: 0
    meaning:
      ar_eg: يا دكتور، دماغي مصدعة وصوابعي ناشفة.
      ar: يا دكتور، رأسي يؤلمني وأصابعي متيبّسة.
      en: Doctor, I have a headache and my fingers are stiff.
    words: [ngelu, driji, kaku]
  - id: e04
    type: fill_blank
    sentence: Yen nyebut 'dh', ___ munggah.
    meaning:
      ar_eg: لما تنطق dh، ___ بيطلع لفوق.
      ar: عند نطق dh يرتفع ___.
      en: When you say 'dh', your ___ goes up.
    options: [ilat, cangkem, melek]
    answers: [ilat]
    words: [ilat, cangkem, melek]
    explain:
      ar_eg: مع dh اللسان (ilat) بيطلع لفوق. cangkem = بُق وmelek = صاحي.
      ar: مع dh يرتفع اللسان (ilat). أما cangkem فالفم وmelek مستيقظ.
      en: For dh the tongue (ilat) goes up. cangkem is the mouth and melek is awake.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة هي الكلمة الخشنة لـ«بق»؟
      ar: أي كلمة هي اللفظ الخشن للفم؟
      en: Which is the coarse word for 'mouth'?
    options: [ilat, driji, cangkem]
    answer: 2
    explain:
      ar_eg: cangkem خشنة، ماتقولهاش لحد. ilat = لسان، driji = صباع.
      ar: cangkem لفظ خشن فلا تقله لأحد؛ ilat = لسان، driji = إصبع.
      en: cangkem is coarse; don't use it to people. ilat = tongue, driji = finger.
    words: [ilat, driji, cangkem]
  - id: e06
    type: fill_blank
    sentence: Rambutku wis dawa, aku arep ___.
    meaning:
      ar_eg: شعري طوّل، هروح ___.
      ar: طال شعري، سأ___.
      en: My hair's long; I'm going to get a ___.
    options: [cukur, ngelu, sesek]
    answers: [cukur]
    words: [cukur, ngelu, sesek]
    explain:
      ar_eg: cukur = يحلق. ngelu = صداع وsesek = نَفَسه مكتوم.
      ar: cukur تعني الحلاقة. أما ngelu فصداع وsesek ضيق نَفَس.
      en: cukur is a haircut. ngelu is a headache and sesek is short of breath.
  - id: e07
    type: multiple_choice
    question: Bis iki kebak banget, rasane ___.
    options: [kaku, sesek, cukur]
    answer: 1
    explain:
      ar_eg: 'الأتوبيس زحمة = النفس مكتوم: sesek.'
      ar: 'الحافلة مزدحمة = ضيق: sesek.'
      en: 'A packed bus feels cramped and stuffy: sesek.'
    words: [kaku, sesek, cukur]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا صاحي من الساعة أربعة.
      ar: أنا مستيقظ منذ الساعة الرابعة.
      en: I've been awake since four o'clock.
    answer: Aku wis melek wiwit jam papat.
    distractors: [ilat, cukur]
    words: [melek]
    explain:
      ar_eg: melek = صاحي. ilat = لسان وcukur = حلاقة، ومش في المعنى.
      ar: melek تعني مستيقظ. أما ilat (لسان) وcukur (حلاقة) فليستا في المعنى.
      en: melek means awake. ilat (tongue) and cukur (haircut) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Sawise mlayu, aku sesek lan sikilku kaku.
    answers_meaning:
      ar_eg: [بعد ما جريت، نفسي اتكتم ورجلي نشفت, بعد الجري نفسي مكتوم ورجلي ناشفة]
      ar: [بعد الجري ضاق نفَسي وتيبّست رجلي, بعد أن ركضت ضاق نفسي وتيبست ساقي]
      en: ['After running I''m out of breath and my legs are stiff', 'After the run I''m short of breath and my leg is stiff']
    words: [sesek, kaku]
  - id: e10
    type: speaking
    text: Esuk-esuk aku wis melek, nanging isih ngelu.
    meaning:
      ar_eg: من بدري وأنا صاحي، بس لسه مصدّع.
      ar: استيقظت باكرًا، لكن رأسي ما زال يؤلمني.
      en: I've been awake since early, but I still have a headache.
    words: [melek, ngelu]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: Coba sebut 'dhuwit'.
      ar_eg: جرّب تقول dhuwit.
      ar: جرّب أن تنطق dhuwit.
      en: Try saying 'dhuwit'.
    - speaker: Mohamed
      text: Duwit... dhuwit... aduh, ilatku kaku!
      ar_eg: دوويت... ذوويت... آه، لساني ناشف!
      ar: دويت... ذويت... آه، لساني متيبّس!
      en: Duwit... dhuwit... ugh, my tongue is stiff!
    - speaker: Mbak Ayu
      text: Ilat munggah sithik, banjur mundur.
      ar_eg: اللسان يطلع شوية وبعدين يرجع لورا.
      ar: ارفع اللسان قليلًا ثم أرجعه إلى الخلف.
      en: Tongue up a little, then back.
    - speaker: Mohamed
      text: Dhuwit! Pener, Mbak?
      ar_eg: ذوويت! صح يا ميباك؟
      ar: ذويت! صحيح يا أختي؟
      en: Dhuwit! Right, Mbak?
    - speaker: Mbak Ayu
      text: Pener! Wis, aja nganti ngelu. Ayo ngombe teh wae.
      ar_eg: صح! خلاص، ماتصدّعش نفسك. يلا نشرب شاي.
      ar: صحيح! يكفي، لا تُصِب نفسك بالصداع. هيا نشرب الشاي.
      en: Right! Enough, don't give yourself a headache. Let's have tea.
    - speaker: Mohamed
      text: Iya, sirahku wis ngelu tenan.
      ar_eg: آه، دماغي صدّعت بجد.
      ar: نعم، رأسي يؤلمني حقًا.
      en: Yes, my head really aches.
