schema: kabar.lesson/v1
id: j6.u02.l04
language: jv
title: Ing langgar
can_do:
  ar_eg: 'تتكلم عن درس القرآن في مصلى الحتة: الطبلة، والحفظ والمراجعة، والطاقية.'
  ar: 'أن تتحدث عن درس القرآن في المصلّى: الطبل والحفظ والمراجعة والطاقية.'
  en: 'Talk about Qur''an class at the neighbourhood prayer house: the drum, memorising, revising and the cap.'
slides:
  - title: Sore ing langgar
    body:
      ar_eg: |
        langgar = مصلى صغير في الحتة. قبل الأذان بيضربوا bedhug (طبلة كبيرة)، وkenthongan = طبلة خشب مجوّفة للتنبيه.
        ngaos = ngaji بالكراما (يقرا قرآن أو يدرس). ngapalake = يحفظ، nderes = يراجع ويقرا القرآن بانتظام.
        ustadz = أستاذ الدين، kopyah = طاقية (زي اللي بنلبسها في الصلاة).
      ar: |
        langgar = مصلّى صغير في الحيّ. قبل الأذان يُضرب bedhug (طبل كبير)، وkenthongan = طبل خشبي مجوّف للتنبيه.
        ngaos = ngaji بالكراما (يقرأ القرآن أو يتعلّم). ngapalake = يحفظ، nderes = يراجع القرآن ويواظب على قراءته.
        ustadz = معلّم الدين، kopyah = طاقية الصلاة.
      en: |
        langgar = small neighbourhood prayer house. Before the call to prayer they beat the bedhug (big drum); a kenthongan is a hollow wooden alarm drum.
        ngaos = krama for ngaji (recite or study the Qur'an). ngapalake = memorise, nderes = revise, recite regularly.
        ustadz = religious teacher, kopyah = prayer cap.
    examples:
      - text: Sadurunge adzan, bedhug ditabuh.
        ar_eg: قبل الأدان بيضربوا الطبلة.
        ar: قبل الأذان يُضرب الطبل.
        en: Before the call to prayer, the bedhug is beaten.
      - text: Lare-lare ngaos wonten langgar saben sonten.
        ar_eg: العيال بيقروا قرآن في المصلى كل عصرية.
        ar: يتعلّم الأطفال القرآن في المصلّى كل مساء.
        en: The children study the Qur'an at the langgar every afternoon.
      - text: Aku ngapalake surat Al-Fatihah.
        ar_eg: أنا بحفظ سورة الفاتحة.
        ar: أحفظ سورة الفاتحة.
        en: I'm memorising Al-Fatihah.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: langgar
        ar_eg: مصلى صغير
        ar: مصلّى صغير
        en: prayer house
      - text: bedhug
        ar_eg: طبلة المسجد
        ar: طبل المسجد
        en: mosque drum
      - text: kenthongan
        ar_eg: طبلة خشب
        ar: طبل خشبي
        en: wooden slit drum
      - text: ngaos
        ar_eg: يقرا قرآن (كراما)
        ar: يتعلّم القرآن (كراما)
        en: recite the Qur'an (krama)
    words: [langgar, bedhug, kenthongan, ngaos]
  - id: e02
    type: match_pairs
    pairs:
      - text: nderes
        ar_eg: يراجع القرآن
        ar: يراجع القرآن
        en: revise, recite regularly
      - text: ngapalake
        ar_eg: يحفظ
        ar: يحفظ
        en: memorise
      - text: ustadz
        ar_eg: أستاذ دين
        ar: معلّم الدين
        en: religious teacher
      - text: kopyah
        ar_eg: طاقية
        ar: طاقية
        en: prayer cap
    words: [nderes, ngapalake, ustadz, kopyah]
  - id: e03
    type: listen
    text: Ustadz nabuh bedhug ing langgar.
    question:
      ar_eg: بيعمل إيه؟
      ar: ماذا يفعل؟
      en: What is he doing?
    options: [الأستاذ بيضرب الطبلة في المصلى, الأستاذ بيقرا قرآن, العيال لابسين طواقي]
    answer: 0
    meaning:
      ar_eg: الأستاذ بيضرب الطبلة في المصلى.
      ar: يضرب الأستاذ الطبل في المصلّى.
      en: The ustadz beats the drum at the langgar.
    words: [ustadz, bedhug, langgar]
  - id: e04
    type: fill_blank
    sentence: Sadurunge ngaji, aku nganggo ___.
    meaning:
      ar_eg: قبل ما أقرا قرآن، بلبس ___.
      ar: قبل درس القرآن ألبس ___.
      en: Before Qur'an class, I put on my ___.
    options: [kopyah, kenthongan, langgar]
    answers: [kopyah]
    words: [kopyah, kenthongan, langgar]
    explain:
      ar_eg: kopyah = الطاقية اللي بتتلبس. kenthongan = جرس خشب وlanggar = مصلّى صغير.
      ar: kopyah قلنسوة تُلبس. أما kenthongan فناقوس خشبي وlanggar مصلّى صغير.
      en: kopyah is the cap you wear. kenthongan is a wooden alarm drum and langgar is a small prayer house.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة هي الكراما بتاعة ngaji؟
      ar: أي كلمة هي صيغة الكراما لـ ngaji؟
      en: Which is the krama word for ngaji?
    options: [nderes, ngaos, ngapalake]
    answer: 1
    explain:
      ar_eg: ngaos = ngaji بالكراما.
      ar: ngaos = ngaji بالكراما.
      en: ngaos = ngaji in krama.
    words: [nderes, ngaos, ngapalake]
  - id: e06
    type: fill_blank
    sentence: Saben bengi aku ___ Quran.
    meaning:
      ar_eg: كل ليلة بـ___ القرآن.
      ar: كل ليلة ___ القرآن.
      en: Every night I ___ the Qur'an.
    options: [nderes, kopyah, bedhug]
    answers: [nderes]
    words: [nderes, kopyah, bedhug]
    explain:
      ar_eg: nderes = يقرا قرآن. kopyah = طاقية وbedhug = طبلة الجامع.
      ar: nderes تعني يتلو القرآن. أما kopyah فقلنسوة وbedhug طبل المسجد.
      en: nderes means reciting the Qur'an. kopyah is a cap and bedhug is the mosque drum.
  - id: e07
    type: multiple_choice
    question: Wong-wong nabuh ___ yen ana maling.
    options: [ustadz, ngapalake, kenthongan]
    answer: 2
    explain:
      ar_eg: kenthongan = الطبلة الخشب اللي بينبهوا بيها الحتة.
      ar: kenthongan = الطبل الخشبي لتنبيه الحيّ.
      en: kenthongan = the wooden drum that alerts the neighbourhood.
    words: [ustadz, ngapalake, kenthongan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا بحفظ سورة قصيرة.
      ar: أحفظ سورة قصيرة.
      en: I'm memorising a short surah.
    answer: Aku ngapalake surat cekak.
    distractors: [kopyah, langgar]
    words: [ngapalake]
    explain:
      ar_eg: ngapalake = بيحفظ. kopyah = طاقية وlanggar = مصلّى، ومش في المعنى.
      ar: ngapalake تعني يحفظ. أما kopyah (قلنسوة) وlanggar (مصلّى) فليستا في المعنى.
      en: ngapalake means memorising. kopyah (cap) and langgar (prayer house) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Ustadz ngajari bocah-bocah ing langgar.
    answers_meaning:
      ar_eg: [الأستاذ بيعلّم العيال في المصلى, الأستاذ بيدرّس للأطفال في المصلى]
      ar: [يعلّم الأستاذ الأطفال في المصلّى, الأستاذ يدرّس الأطفال في المصلّى]
      en: [The ustadz teaches the children at the langgar, The religious teacher teaches kids at the prayer house]
    words: [ustadz, langgar]
  - id: e10
    type: speaking
    text: Kula ngaos kaliyan Pak Ustadz.
    meaning:
      ar_eg: أنا بقرا قرآن مع الأستاذ.
      ar: أتعلّم القرآن مع الأستاذ.
      en: I study the Qur'an with the ustadz.
    words: [ngaos, ustadz]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, sore iki melu menyang langgar?
      ar_eg: يا محمد، هتيجي المصلى العصرية دي؟
      ar: يا محمد، أتأتي إلى المصلّى هذا المساء؟
      en: Mohamed, coming to the langgar this afternoon?
    - speaker: Mohamed
      text: Melu. Aku nggawa kopyah.
      ar_eg: جاي. واخد الطاقية معايا.
      ar: سآتي. أحضرت طاقيتي.
      en: Yes. I've brought my cap.
    - speaker: Mas Dimas
      text: Krungu bedhug? Wis wayahe salat.
      ar_eg: سامع الطبلة؟ جه وقت الصلاة.
      ar: أتسمع الطبل؟ حان وقت الصلاة.
      en: Hear the drum? It's prayer time.
    - speaker: Mohamed
      text: Sawise salat, bocah-bocah ngaji karo ustadz, ta?
      ar_eg: بعد الصلاة العيال بيقروا مع الأستاذ، صح؟
      ar: بعد الصلاة يتعلّم الأطفال مع الأستاذ، أليس كذلك؟
      en: After prayers the kids study with the ustadz, right?
    - speaker: Mas Dimas
      text: Iya. Adhiku lagi ngapalake surat cekak.
      ar_eg: أيوه. أخويا الصغير بيحفظ سورة قصيرة.
      ar: نعم. أخي الصغير يحفظ سورة قصيرة.
      en: Yes. My little brother is memorising a short surah.
    - speaker: Mohamed
      text: Aku uga perlu nderes maneh, akeh sing wis lali.
      ar_eg: وأنا كمان لازم أراجع، نسيت حاجات كتير.
      ar: وأنا أيضًا عليّ أن أراجع، فقد نسيت الكثير.
      en: I need to revise again too; I've forgotten a lot.
