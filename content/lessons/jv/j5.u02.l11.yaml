schema: kabar.lesson/v1
id: j5.u02.l11
language: jv
title: Sejarah Benteng Pendem
can_do:
  ar_eg: تقرا فقرة من مجلة عن تاريخ حصن بندم وتفهم اسمه وأصله.
  ar: أن تقرأ فقرة من مجلة عن تاريخ حصن بندم وتفهم سبب اسمه وأصله.
  en: Read a magazine paragraph on Benteng Pendem's history and explain its name.
slides:
  - title: Saka kalawarti
    body:
      ar_eg: |
        فقرة من مجلة جاوية عن الحصن اللي إنت واقف قدّامه: Benteng Pendem في نغاوي، جنب ماديون، اللي الهولنديين بنوه بين 1839 و1845 عند ملتقى نهر ماديون ونهر سولو. هتقابل sinebut (= disebut، بالـ -in- الأدبية) وkasebut (= tersebut).
        كلمات جديدة: lawang = باب (pintu). kantor = مكتب / مقرّ (kantor). واسم الحصن من pendhem = مدفون: حواليه تلال تراب عالية فمش باين من الشارع، كإنه مدفون.
      ar: |
        فقرة من مجلة جاوية عن الحصن الذي تقف أمامه: Benteng Pendem في نغاوي قرب ماديون، بناه الهولنديون بين 1839 و1845 عند ملتقى نهر ماديون بنهر سولو. ستقابل sinebut (= disebut، بالـ -in- الأدبية) وkasebut (= tersebut).
        كلمات جديدة: lawang = باب (pintu)، وkantor = مكتب / مقرّ (kantor). واسم الحصن من pendhem = مدفون: تحيط به روابٍ ترابية عالية فلا يظهر من الطريق، كأنه مدفون.
      en: |
        A paragraph from a Javanese magazine about the fort you're standing in front of: Benteng Pendem in Ngawi, next to Madiun, built by the Dutch in 1839–1845 where the Madiun river meets the Bengawan Solo. You'll meet sinebut (= disebut, with the literary -in-) and kasebut (= tersebut).
        New words: lawang = door, gate (pintu). kantor = office, headquarters (kantor). The fort's name comes from pendhem = buried: high earth banks surround it, so you can't see it from the road, as if it were buried.
    grammar: jv.passive.written
    examples:
      - text: Benteng iki sinebut Benteng Pendem, amarga ora katon saka dalan.
        ar_eg: الحصن ده اسمه «بنتنج بندم» (الحصن المدفون)، عشان مش باين من الشارع.
        ar: يُسمّى هذا الحصن «بنتنغ بندم» (الحصن المدفون)، لأنه لا يظهر من الطريق.
        en: This fort is called Benteng Pendem (the buried fort) because it can't be seen from the road.
      - text: Ing jaman Walanda, ing benteng kasebut ana kantor lan kamar prajurit.
        ar_eg: أيام الهولنديين، كان في الحصن ده مكاتب وأوض للعساكر.
        ar: في العهد الهولندي كان في هذا الحصن مكاتب وغرف للجنود.
        en: In the Dutch era, the fort had offices and soldiers' rooms.
      - text: Saiki Benteng Pendem dadi papan wisata kang misuwur.
        ar_eg: دلوقتي حصن بندم بقى مكان سياحي مشهور.
        ar: صار حصن بندم اليوم معلمًا سياحيًا مشهورًا.
        en: Today Benteng Pendem is a famous tourist spot.
exercises:
  - id: e01
    type: listen
    text: Benteng iki sinebut Benteng Pendem, amarga ora katon saka dalan.
    question:
      ar_eg: ليه اسمه بنتنج بندم؟
      ar: لماذا سُمّي بنتنغ بندم؟
      en: Why is it called Benteng Pendem?
    options:
      - amarga bentenge gedhe banget
      - amarga ora katon saka dalan
      - amarga ana prajurit sewu
    answer: 1
    meaning:
      ar_eg: الحصن ده اسمه «بنتنج بندم»، عشان مش باين من الشارع.
      ar: يُسمّى هذا الحصن «بنتنغ بندم» لأنه لا يظهر من الطريق.
      en: This fort is called Benteng Pendem because it can't be seen from the road.
    words: [sinebut]
  - id: e02
    type: multiple_choice
    question: Ing jaman Walanda, ing benteng kasebut ana kantor lan kamar prajurit.
    question_meaning:
      ar_eg: كان فيه إيه في الحصن أيام الهولنديين؟
      ar: ماذا كان في الحصن في العهد الهولندي؟
      en: What was in the fort in the Dutch era?
    options: [kantor lan kamar prajurit, museum, stasiun sepur]
    answer: 0
    explain:
      ar_eg: «ana kantor lan kamar prajurit» = كان فيه مكاتب وأوض للعساكر.
      ar: «ana kantor lan kamar prajurit» = كان فيه مكاتب وغرف للجنود.
      en: '"ana kantor lan kamar prajurit" = there were offices and soldiers'' rooms.'
    words: [kantor]
  - id: e03
    type: multiple_choice
    question: Saiki Benteng Pendem dadi papan wisata kang misuwur.
    question_meaning:
      ar_eg: حصن بندم دلوقتي إيه؟
      ar: ما حصن بندم اليوم؟
      en: What is Benteng Pendem today?
    options: [kantor prajurit, sekolah, papan wisata kang misuwur]
    answer: 2
    words: [misuwur, sekolah]
  - id: e04
    type: match_pairs
    pairs:
      - text: lawang
        ar_eg: باب / بوابة
        ar: باب / بوابة
        en: door, gate
      - text: sinebut
        ar_eg: اسمه / بيتسمّى
        ar: يُسمّى
        en: is called
      - text: kasebut
        ar_eg: المذكور / ده
        ar: المذكور
        en: the said, that
      - text: kantor
        ar_eg: مكتب / مقرّ
        ar: مكتب / مقرّ
        en: office
      - text: amarga
        ar_eg: عشان
        ar: لأن
        en: because
    words: [lawang, sinebut, kasebut, kantor]
  - id: e05
    type: fill_blank
    sentence: Benteng iki duwe ___ gedhe loro.
    meaning:
      ar_eg: الحصن ده ليه بوابتين كبار.
      ar: لهذا الحصن بوابتان كبيرتان.
