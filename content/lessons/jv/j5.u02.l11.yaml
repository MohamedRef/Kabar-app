dialogue:
  title: Kok sinebut Pendem?
  lines:
    - speaker: Mohamed
      text: Pak, benteng menika kok sinebut Benteng Pendem?
      ar_eg: يا عمّو، هو الحصن ده اسمه «بندم» ليه؟
      ar: يا سيدي، لماذا يُسمّى هذا الحصن «بندم»؟
      en: Sir, why is this fort called Benteng Pendem?
    - speaker: Pak Harjo
      text: Saka dalan ra katon, lho, Mas. Ana lemah dhuwur ing ngarepe.
      ar_eg: من الشارع مش باين خالص يا ابني. فيه تل تراب عالي قدّامه.
      ar: لا يظهر من الطريق يا بني، فأمامه رابية ترابية عالية.
      en: You can't see it from the road, you know. There's a high earth bank in front of it.
    - speaker: Mohamed
      text: Oh, mula sinebut "pendem", nggih?
      ar_eg: آه، عشان كده اسمه «بندم» يعني مدفون، صح؟
      ar: آه، لذلك يُسمّى «بندم» أي المدفون، أليس كذلك؟
      en: Oh, so that's why it's called "pendem", buried?
    - speaker: Pak Harjo
      text: Bener. Biyen dibangun dening Walanda, ing pinggir Bengawan Solo.
      ar_eg: صح. بناه الهولنديين زمان، على ضفة نهر سولو.
      ar: صحيح. بناه الهولنديون قديمًا على ضفة نهر سولو.
      en: Right. The Dutch built it long ago, on the bank of the Bengawan Solo.
    - speaker: Mohamed
      text: Saiki benteng menika dados papan wisata, nggih?
      ar_eg: والحصن ده دلوقتي بقى مكان سياحي، صح؟
      ar: وصار هذا الحصن الآن معلمًا سياحيًا، أليس كذلك؟
      en: And now the fort is a tourist spot, isn't it?
    - speaker: Pak Harjo
      text: Iya, misuwur tenan. Ayo mlebu liwat lawang ngarep!
      ar_eg: آه، ومشهور جدًا. يلا ندخل من البوابة اللي قدّام!
      ar: نعم، ومشهور جدًا. هيا ندخل من البوابة الأمامية!
      en: Yes, really famous. Come on, let's go in through the front gate!
