schema: kabar.lesson/v1
id: j1.u01.l05
language: jv
title: Luwe, ngantuk, lumayan
can_do:
  ar_eg: تقول إنك جعان أو عطشان أو نعسان، وترد على «piye kabare?» بأكتر من «apik».
  ar: أن تقول إنك جائع أو عطشان أو نعسان، وتجيب عن «piye kabare?» بأكثر من «apik».
  en: Say you're hungry, thirsty or sleepy, and answer "piye kabare?" with more than "apik".
slides:
  - title: Aku luwe!
    body:
      ar_eg: |
        luwe = جعان (lapar)، ngelak = عطشان (haus)، ngantuk = نعسان.
        sehat = بصحة كويسة. lumayan = ماشي الحال، مش بطال: أشهر رد على «Piye kabare?».
        kaget = اتخضّيت، bingung = متلخبط، isin = مكسوف (malu).
        ومع banget بتقوّي الكلمة: Aku luwe banget = أنا جعان أوي.
      ar: |
        luwe = جائع (lapar)، ngelak = عطشان (haus)، ngantuk = نعسان.
        sehat = بصحّة جيّدة. lumayan = لا بأس، على ما يرام نسبيًّا: أشهر جواب عن «Piye kabare?».
        kaget = فوجئت، bingung = محتار، isin = خجلان (malu).
        ومع banget تقوى الكلمة: Aku luwe banget = أنا جائع جدًّا.
      en: |
        luwe = hungry (lapar), ngelak = thirsty (haus), ngantuk = sleepy.
        sehat = healthy, well. lumayan = not bad, so-so: the most common answer to "Piye kabare?".
        kaget = startled, bingung = confused, isin = shy, embarrassed (malu).
        Add banget to make it stronger: Aku luwe banget = I'm really hungry.
    examples:
      - text: Aku luwe banget, Mas!
        ar_eg: أنا جعان أوي يا ماس!
        ar: أنا جائع جدًّا يا ماس!
        en: I'm so hungry, Mas!
      - text: Piye kabare? — Lumayan, matur nuwun.
        ar_eg: أخبارك إيه؟ — ماشي الحال، شكرًا.
        ar: كيف حالك؟ — لا بأس، شكرًا.
        en: How are you? — Not bad, thanks.
      - text: Aku isin, Mbak.
        ar_eg: أنا مكسوف يا أبلة.
        ar: أنا خجلان يا أختي.
        en: I'm shy, Mbak.
