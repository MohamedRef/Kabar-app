  - id: e03
    type: listen
    text: Aku luwe banget, Mas.
    question:
      ar_eg: هو حاسس بإيه؟
      ar: بماذا يشعر؟
      en: How does he feel?
    options: [جعان أوي, عطشان أوي, نعسان أوي]
    answer: 0
    meaning:
      ar_eg: أنا جعان أوي يا ماس.
      ar: أنا جائع جدًّا يا ماس.
      en: I'm so hungry, Mas.
    words: [luwe, ngelak, ngantuk]
  - id: e04
    type: fill_blank
    sentence: Piye kabare, Mbak? — ___, matur nuwun.
    meaning:
      ar_eg: أخبارك إيه يا أبلة؟ — ___، شكرًا.
      ar: كيف حالك يا أختي؟ — ___، شكرًا.
      en: How are you, Mbak? — ___, thanks.
    options: [Lumayan, Luwe, Isin]
    answers: [Lumayan]
    words: [lumayan, luwe, isin]
    explain:
      ar_eg: lumayan = يعني كويس / ماشي الحال، وده رد عادي على piye kabare. luwe = جعان، وisin = مكسوف.
      ar: lumayan = لا بأس، وهو ردّ مألوف على piye kabare؛ أما luwe فجائع، وisin خجلان.
      en: lumayan = not bad, a normal reply to piye kabare. luwe = hungry, isin = shy.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: لما تكون عايز تنام تقول إيه؟
      ar: ماذا تقول حين تريد النوم؟
      en: What do you say when you want to sleep?
    options: [Aku ngelak., Aku ngantuk., Aku kaget.]
    answer: 1
    explain:
      ar_eg: ngantuk = نعسان. ngelak = عطشان، kaget = اتخضّيت.
      ar: ngantuk = نعسان. أمّا ngelak فعطشان، وkaget فوجئت.
      en: ngantuk = sleepy. ngelak = thirsty, kaget = startled.
    words: [ngantuk, ngelak, kaget]
  - id: e06
    type: fill_blank
    sentence: Sugeng enjing! Piye kabare? — Apik, aku ___.
    meaning:
      ar_eg: صباح الخير! أخبارك إيه؟ — كويس، أنا ___.
      ar: صباح الخير! كيف حالك؟ — بخير، أنا ___.
      en: Good morning! How are you? — Good, I'm ___.
    options: [sehat, ngantuk, bingung]
    answers: [sehat]
    words: [sehat, ngantuk, bingung]
    explain:
      ar_eg: "«كويس، أنا ___» محتاجة حاجة حلوة: sehat = بصحة كويسة. ngantuk = نعسان، وbingung = متلخبط، ودول مش «كويس»."
      ar: "«بخير، أنا ___» تحتاج صفة إيجابية: sehat = بصحة جيدة؛ أما ngantuk فنعسان، وbingung محتار."
      en: "\"Good, I'm ___\" needs something positive: sehat = healthy. ngantuk (sleepy) and bingung (confused) don't fit \"good\"."
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «أنا متلخبط ومش فاهم» — أنهي كلمة؟
      ar: «أنا محتار ولا أفهم» — أيّ كلمة؟
      en: '"I''m confused" — which word?'
    options: [kaget, isin, bingung]
    answer: 2
    explain:
      ar_eg: bingung = متلخبط. kaget = اتخضّ، isin = مكسوف.
      ar: bingung = محتار. أمّا kaget ففوجئ، وisin فخجلان.
      en: bingung = confused. kaget = startled, isin = shy.
    words: [bingung, kaget, isin]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا جعان وعطشان يا ماس.
      ar: أنا جائع وعطشان يا ماس.
      en: I'm hungry and thirsty, Mas.
    answer: Aku luwe lan ngelak, Mas.
    distractors: [ngantuk, kowe]
    words: [luwe, ngelak]
    explain:
      ar_eg: luwe = جعان وngelak = عطشان، وبينهم lan (و). ngantuk = نعسان، وkowe = إنت، ومش في الجملة.
      ar: luwe = جائع وngelak = عطشان، تربطهما lan. أما ngantuk فنعسان، وkowe أنت، وليسا في الجملة.
      en: luwe = hungry, ngelak = thirsty, joined by lan. ngantuk (sleepy) and kowe (you) aren't in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Aku isin, Mbak.
    answers_meaning:
      ar_eg: [أنا مكسوف يا أبلة, أنا مكسوفة يا أبلة]
      ar: [أنا خجلان يا أختي, أنا خجولة يا أختي]
      en: ['I''m shy, Mbak', 'I''m embarrassed, Mbak']
    words: [isin]
  - id: e10
    type: speaking
    text: Lumayan, aku sehat. Matur nuwun.
    meaning:
      ar_eg: ماشي الحال، أنا بصحة كويسة. شكرًا.
      ar: لا بأس، أنا بصحّة جيّدة. شكرًا.
      en: Not bad, I'm well. Thanks.
    words: [lumayan, sehat]
dialogue:
  lines:
    - speaker: Mas Heru
      text: Mohamed! Piye kabare, cah? Kowe ngantuk?
      ar_eg: يا محمد! أخبارك إيه يا جدع؟ إنت نعسان؟
      ar: محمد! كيف حالك يا صاحبي؟ هل أنت نعسان؟
      en: Mohamed! How are you, mate? Are you sleepy?
    - speaker: Mohamed
      text: Lumayan, Mas. Aku ngantuk lan luwe banget.
      ar_eg: ماشي الحال يا ماس. أنا نعسان وجعان أوي.
      ar: لا بأس يا ماس. أنا نعسان وجائع جدًّا.
      en: Not bad, Mas. I'm sleepy and really hungry.
    - speaker: Mas Heru
      text: Luwe? Aku yo luwe, cah!
      ar_eg: جعان؟ أنا كمان جعان يا جدع!
      ar: جائع؟ أنا أيضًا جائع يا صاحبي!
      en: Hungry? Me too, mate!
    - speaker: Mohamed
      text: Sori, Mas, aku bingung lan isin.
      ar_eg: معلش يا ماس، أنا متلخبط ومكسوف.
      ar: عذرًا يا ماس، أنا محتار وخجلان.
      en: Sorry, Mas, I'm confused and shy.
    - speaker: Mas Heru
      text: Hehe, rapopo, cah! Basa Jawamu apik.
      ar_eg: هههه، ولا يهمك يا جدع! الجاوي بتاعك كويس.
      ar: هه، لا بأس يا صاحبي! جاويّتك جيّدة.
      en: Hehe, no worries, mate! Your Javanese is good.
