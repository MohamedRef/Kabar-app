schema: kabar.lesson/v1
id: j1.u01.l05
language: jv
title: Ulangan J1.1
can_do:
  ar_eg: تسلّم على تلات أشخاص مختلفين.
  ar: أن تحيّي ثلاثة أشخاص مختلفين.
  en: Greet three different people.
slides:
  - title: Sapa karo sapa?
    body:
      ar_eg: |
        مراجعة سريعة: مين بنكلمه إزاي؟
        - صاحبك: Piye kabare? / Kowé piye? — وفي سورابايا Koen piye, rek? (Arek)
        - حد أكبر أو مش عارفه: Sugeng enjing / siang / sonten / dalu + Pak / Bu، وsampeyan بدل kowé، وmatur nuwun.
        - حد من العيلة الكبار: Pakdhe / Budhe (أو Dhe).
        - الشلة: rek في آخر الجملة. Ayo, rek!
      ar: |
        مراجعة سريعة: من نخاطب وكيف؟
        - الصديق: Piye kabare? / Kowé piye? — وفي سورابايا Koen piye, rek? (Arek)
        - الأكبر سنًّا أو الغريب: Sugeng enjing / siang / sonten / dalu مع Pak / Bu، وsampeyan بدل kowé، وmatur nuwun.
        - كبار العائلة: Pakdhe / Budhe (أو Dhe).
        - الجماعة: rek في آخر الجملة: Ayo, rek!
      en: |
        Quick review: who gets what?
        - A friend: Piye kabare? / Kowé piye? — in Surabaya Koen piye, rek? (Arek)
        - Someone older or a stranger: Sugeng enjing / siang / sonten / dalu + Pak / Bu, sampeyan instead of kowé, and matur nuwun.
        - Older relatives: Pakdhe / Budhe (or Dhe).
        - Your mates: rek at the end. Ayo, rek!
    grammar: jv.address.terms
    examples:
      - text: Kowé piye?
        ar_eg: وإنت؟ (لصاحبك، ngoko)
        ar: وأنت؟ (لصديقك، ngoko)
        en: And you? (to a friend, ngoko)
      - text: Sampeyan piye, Bu?
        ar_eg: وحضرتك يا مدام؟
        ar: وأنتِ يا سيدتي؟
        en: And you, ma'am?
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: Sugeng enjing
        ar_eg: صباح الخير
        ar: صباح الخير
        en: Good morning
      - text: Sugeng dalu
        ar_eg: تصبح على خير / مساء الخير
        ar: تصبح على خير / مساء الخير
        en: Good night / good evening
      - text: Matur nuwun
        ar_eg: شكرًا
        ar: شكرًا
        en: Thank you
      - text: Padha-padha
        ar_eg: العفو
        ar: عفوًا
        en: You're welcome
      - text: Ati-ati
        ar_eg: خلي بالك
        ar: انتبه
        en: Take care
    words: [sugeng enjing, sugeng dalu, matur nuwun, padha-padha, ati-ati]
  - id: e02
    type: match_pairs
    pairs:
      - text: aku
        ar_eg: أنا
        ar: أنا
        en: I
      - text: kowé
        ar_eg: إنت
        ar: أنت
        en: you (friend)
      - text: sampeyan
        ar_eg: حضرتك
        ar: حضرتك
        en: you (polite)
      - text: dheweke
        ar_eg: هو / هي
        ar: هو / هي
        en: he / she
    words: [aku, kowé, sampeyan, dheweke]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الساعة ٤ العصر، وقابلت أم صاحبك. تقولها إيه؟
      ar: الساعة الرابعة عصرًا، وقابلت والدة صديقك. ماذا تقول لها؟
      en: It's 4 p.m. and you meet your friend's mother. What do you say?
    options: ['Sugeng sonten, Bu.', 'Ayo, rek!', 'Koen piye?']
    answer: 0
    explain:
      ar_eg: ٤ العصر = sonten، وsugeng مؤدبة. rek وkoen للصحاب بس.
      ar: الرابعة عصرًا وقت sonten، وsugeng مهذبة، أما rek وkoen فللأقران.
      en: 4 p.m. is sonten and sugeng is polite; rek and koen are for mates only.
    words: [sugeng sonten]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة ngoko معناها «بالليل»؟
      ar: أيّ لفظ ngoko يعني «الليل»؟
      en: Which ngoko word means "night"?
    options: [awan, bengi, esuk]
    answer: 1
    explain:
      ar_eg: bengi = بالليل (ngoko)، وبالـ krama dalu. esuk = الصبح، awan = الضهر.
      ar: bengi = الليل (ngoko)، وبالـ krama dalu، وesuk = الصباح، وawan = الظهيرة.
      en: bengi = night (ngoko; krama dalu). esuk = morning, awan = midday.
    words: [bengi]
  - id: e05
    type: listen
    text: Sugeng dalu, Pakdhe.
    options: ['Sugeng dalu, Budhe.', 'Sugeng enjing, Pakdhe.', 'Sugeng dalu, Pakdhe.']
    answer: 2
    words: [sugeng dalu, pakdhe]
  - id: e06
    type: listen
    text: Alhamdulillah, apik.
    options: [Padha-padha., 'Ati-ati, ya.', 'Alhamdulillah, apik.']
    answer: 2
    words: [apik]
  - id: e07
    type: fill_blank
    sentence: Matur nuwun, Mas. — ___.
    meaning:
      ar_eg: شكرًا يا كابتن. — العفو.
      ar: شكرًا يا أخي. — عفوًا.
      en: Thank you, Mas. — You're welcome.
    options: [Ati-ati, Padha-padha, Sugeng enjing]
    answers: [Padha-padha]
    words: [padha-padha]
  - id: e08
    type: fill_blank
    sentence: Dheweke kanca___.
    meaning:
      ar_eg: هو صاحبي.
      ar: هو صديقي.
      en: He's my friend.
    options: [mu, ku]
    answers: [ku]
    words: [kanca]
  - id: e09
    type: build_sentence
    source:
      ar_eg: أنا كويس، شكرًا. وإنت؟
      ar: أنا بخير، شكرًا. وأنت؟
      en: I'm fine, thanks. How about you?
    answer: Aku apik, suwun. Kowé piye?
    distractors: [saya, dalu]
    words: [aku, apik, suwun, kowé, piye]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: إزيك يا آنسة؟
      ar: كيف حالكِ يا آنسة؟
      en: How are you, miss?
    answers: ['Piye kabare, Mbak?', 'Piye kabare, Mbak', 'Piye kabare Mbak?', Piye kabare mbak, 'Mbak, piye kabare?', 'Mbak piye kabare?', Mbak piye kabare, 'Piye kabaré, Mbak?', 'Pie kabare, Mbak?', 'Yok opo kabare, Ning?', 'Yok opo kabare, Mbak?']
    words: [piye, kabare, mbak]
  - id: e11
    type: dictation
    text: Piye kabare, Dhe?
    meaning:
      ar_eg: إزيك يا عمو؟
      ar: كيف حالك يا عمّ؟
      en: How are you, uncle?
    words: [piye, kabare, dhe]
  - id: e12
    type: speaking
    text: Sugeng enjing, Bu! Piye kabare?
    meaning:
      ar_eg: صباح الخير يا مدام! إزيك؟
      ar: صباح الخير يا سيدتي! كيف حالك؟
      en: Good morning, ma'am! How are you?
    words: [sugeng enjing, piye, kabare]
dialogue:
  title: Telung salam
  lines:
    - speaker: Mohamed
      text: Sugeng enjing, Budhe!
      ar_eg: صباح الخير يا طنط!
      ar: صباح الخير يا عمّة!
      en: Good morning, auntie!
    - speaker: Bu Yani
      text: Sugeng enjing, Mas Mohamed. Piye kabare?
      ar_eg: صباح النور يا محمد. إزيك؟
      ar: صباح النور يا محمد. كيف حالك؟
      en: Good morning, Mohamed. How are you?
    - speaker: Mohamed
      text: Apik, matur nuwun.
      ar_eg: كويس، شكرًا.
      ar: بخير، شكرًا.
      en: Fine, thank you.
    - speaker: Mohamed
      text: Cak Heru, Mbak Rara! Yok opo kabare, rek?
      ar_eg: يا هيرو، يا رارا! أخباركم إيه يا جدعان؟
      ar: يا هيرو، يا رارا! كيف حالكم يا جماعة؟
      en: Heru, Rara! How's it going, guys?
    - speaker: Cak Heru
      text: Apik! Koen piye?
      ar_eg: كويسين! وإنت؟
      ar: بخير! وأنت؟
      en: Good! How about you?
    - speaker: Mohamed
      text: Alhamdulillah, apik. Ayo, rek!
      ar_eg: الحمد لله، كويس. يلا يا جدعان!
      ar: الحمد لله، بخير. هيا يا جماعة!
      en: Alhamdulillah, good. Come on, guys!
souvenir:
  id: j1.u01.souvenir
  title: Suroboyo Bus
  note:
    ar_eg: سورابايا اسمها «Kota Pahlawan» — مدينة الأبطال، عشان معركة ١٠ نوفمبر ١٩٤٥. وأهلها بيتكلموا جاوي Arek — مباشر وسريع ومن غير رسميات، وكلمة rek (من arek = ولد) بتقفل نص الجمل. والـ Suroboyo Bus الأحمر بتاع المدينة كان مشهور إن الناس تقدر تدفع التذكرة بإزايز بلاستيك فاضية! اركبه، وقول للسواق «Suwun, Cak!» وإنت نازل.
    ar: تُلقَّب سورابايا بـ«Kota Pahlawan» أي مدينة الأبطال، نسبةً إلى معركة العاشر من نوفمبر ١٩٤٥. ويتكلم أهلها جاوية Arek المباشرة السريعة الخالية من التكلف، وكلمة rek (من arek = الولد) تختم نصف جملهم. واشتهرت حافلة المدينة الحمراء Suroboyo Bus بأن الركاب كان يمكنهم دفع الأجرة بقناني بلاستيكية فارغة. اركبها، وقل للسائق عند نزولك «Suwun, Cak!».
    en: Surabaya is "Kota Pahlawan", the City of Heroes, after the battle of 10 November 1945. It speaks Arek Javanese — direct, egalitarian, quick — and rek (from arek, kid) ends half the sentences. The city's red Suroboyo Bus became famous for letting riders pay with empty plastic bottles. Hop on, and say "Suwun, Cak!" to the driver as you get off.
