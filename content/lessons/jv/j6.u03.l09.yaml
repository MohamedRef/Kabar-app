schema: kabar.lesson/v1
id: j6.u03.l09
language: jv
title: Aturan ing makam
can_do:
  ar_eg: تقرا قواعد زيارة المقابر الملكية مكتوبة بالخط الجاوي.
  ar: أن تقرأ قواعد زيارة المقابر الملكية بالخط الجاوي.
  en: Read the rules for visiting the royal graves in aksara Jawa.
slides:
  - title: Kertu aturan
    body:
      ar_eg: |
        قبل ما تدخلوا Makam Raja Mataram، ديماس كتب لك كارت فيه القواعد بالخط الجاوي.
        هتشوف cecak وlayar وwignyan في نص الكلام، وpangkon بس قبل ꧉ (آخر الجملة).
        كلمة جديدة: busana = لبس / زيّ (نفس الكلمة في الإندونيسي). busana Jawa = اللبس الجاوي التقليدي.
      ar: |
        قبل دخول Makam Raja Mataram كتب لك ديماس بطاقة بالقواعد بالخط الجاوي.
        سترى cecak وlayar وwignyan وسط الكلام، وpangkon فقط قبل ꧉ (آخر الجملة).
        كلمة جديدة: busana = لباس / زيّ (كما في الإندونيسية)، وbusana Jawa = الزيّ الجاوي التقليدي.
      en: |
        Before you go into the Makam Raja Mataram, Dimas has written you a card with the rules in aksara Jawa.
        You'll see cecak, layar and wignyan mid-sentence, and pangkon only before ꧉ (end of a sentence).
        New word: busana = clothes, attire (same in Indonesian). busana Jawa = traditional Javanese dress.
    grammar: jv.aksara.panyigeg
    examples:
      - text: ꦱꦸꦒꦼꦁꦫꦮꦸꦃ꧉ (Sugeng rawuh.)
        ar_eg: أهلًا وسهلًا.
        ar: أهلًا وسهلًا.
        en: Welcome.
      - text: ꦏꦸꦢꦸꦔꦁꦒꦺꦴꦧꦸꦱꦤꦗꦮ꧉ (Kudu nganggo busana Jawa.)
        ar_eg: لازم تلبس اللبس الجاوي.
        ar: يجب ارتداء الزيّ الجاوي.
        en: You must wear Javanese dress.
      - text: ꦲꦗꦫꦩꦺ꧉ (Aja rame.)
        ar_eg: ماتعملش دوشة.
        ar: لا تُحدث ضجيجًا.
        en: Don't be noisy.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب الكارت، لازم تلبس إيه؟
      ar: بحسب البطاقة، ماذا يجب أن تلبس؟
      en: According to the card, what must you wear?
    options: [sarung, busana Jawa, klambi batik]
    answer: 1
    words: [busana]
    explain:
      ar_eg: "الكارت: Kudu nganggo busana Jawa، يعني لازم لبس جاوي."
      ar: في البطاقة Kudu nganggo busana Jawa، أي يجب لبس الزي الجاوي.
      en: "The card says Kudu nganggo busana Jawa: Javanese dress is required."
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي قاعدة مكتوبة في الكارت؟
      ar: أي قاعدة مكتوبة في البطاقة؟
      en: Which rule is on the card?
    options: ["Aja mangan.", "Aja turu.", "Aja rame."]
    answer: 2
    explain:
      ar_eg: ꦲꦗꦫꦩꦺ꧉ = Aja rame. يعني ماتعملش دوشة.
      ar: ꦲꦗꦫꦩꦺ꧉ = Aja rame، أي لا تُحدث ضجيجًا.
      en: ꦲꦗꦫꦩꦺ꧉ = Aja rame. Don't be noisy.
  - id: e03
    type: listen
    text: Sugeng rawuh.
    question:
      ar_eg: سمعت أول سطر في الكارت. بيتكتب إزاي؟
      ar: سمعت السطر الأول من البطاقة. كيف يُكتب؟
      en: You heard the card's first line. How is it written?
    options: ["ꦱꦸꦒꦼꦁꦫꦮꦸ꧉", "ꦱꦸꦒꦼꦫꦮꦸꦃ꧉", "ꦱꦸꦒꦼꦁꦫꦮꦸꦃ꧉"]
    answer: 2
    explain:
      ar_eg: sugeng بتخلص بـ cecak (ng)، وrawuh بتخلص بـ wignyan (h).
      ar: تنتهي sugeng بـ cecak (ng)، وrawuh بـ wignyan (h).
      en: sugeng ends with cecak (ng), rawuh with wignyan (h).
    meaning:
      ar_eg: أهلًا وسهلًا.
      ar: أهلًا وسهلًا.
      en: Welcome.
    words: [cecak, wignyan]
  - id: e04
    type: match_pairs
    pairs:
      - text: busana
        ar_eg: لبس / زيّ
        ar: لباس / زيّ
        en: clothes, attire
      - text: kudu
        ar_eg: لازم
        ar: يجب
        en: must
      - text: rame
        ar_eg: دوشة / زحمة
        ar: صاخب / مزدحم
        en: noisy, busy
      - text: sugeng rawuh
        ar_eg: أهلًا وسهلًا
        ar: أهلًا وسهلًا
        en: welcome
    words: [busana]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "في ꦔꦁꦒꦺꦴ، الـ ng اللي في النص بتتكتب بإيه؟"
      ar: "في ꦔꦁꦒꦺꦴ، بأي علامة تُكتب ng الوسطى؟"
      en: "In ꦔꦁꦒꦺꦴ, which mark writes the ng in the middle?"
    options: [layar, cecak, pangkon]
    answer: 1
    explain:
      ar_eg: "nga-ng-go: الـ ng اللي بتقفل المقطع = cecak، حتى في نص الكلمة."
      ar: "nga-ng-go: ng التي تُغلق المقطع = cecak، ولو وسط الكلمة."
      en: "nga-ng-go: the ng closing the syllable is cecak, even mid-word."
    words: [cecak]
  - id: e06
    type: fill_blank
    sentence: ꦲꦗꦫꦩꦺ꧉ = ___
    meaning:
      ar_eg: اكتب القراية بالحروف اللاتينية.
      ar: اكتب القراءة بالحروف اللاتينية.
      en: Type the reading in Latin letters.
    answers: ["Aja rame.", aja rame]
    explain:
      ar_eg: "ꦲ a + ꦗ ja + ꦫ ra + ꦩꦺ me، و꧉ نقطة: Aja rame."
      ar: "ꦲ a + ꦗ ja + ꦫ ra + ꦩꦺ me، و꧉ نقطة: Aja rame."
      en: "ꦲ a + ꦗ ja + ꦫ ra + ꦩꦺ me, and ꧉ is the full stop: Aja rame."
  - id: e07
    type: fill_blank
    sentence: Ing makam kudu nganggo ___ Jawa.
    meaning:
      ar_eg: في المقابر لازم تلبس اللبس الجاوي.
      ar: في المقابر يجب ارتداء الزيّ الجاوي.
      en: At the graves you must wear Javanese dress.
    options: [busana, buku, sega]
    answers: [busana]
    words: [busana]
    explain:
      ar_eg: busana = لبس. buku = كتاب وsega = رز، ومش بيتلبسوا.
      ar: busana تعني الزي. أما buku فكتاب وsega أرز، ولا يُلبسان.
      en: busana is dress. buku (book) and sega (rice) aren't worn.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦏꦸꦢꦸꦔꦁꦒꦺꦴꦧꦸꦱꦤꦗꦮ꧉"
      ar: "اكتب بالحروف اللاتينية: ꦏꦸꦢꦸꦔꦁꦒꦺꦴꦧꦸꦱꦤꦗꦮ꧉"
      en: "Write in Latin letters: ꦏꦸꦢꦸꦔꦁꦒꦺꦴꦧꦸꦱꦤꦗꦮ꧉"
    answers: ["Kudu nganggo busana Jawa.", kudu nganggo busana jawa]
    words: [busana, cecak]
  - id: e09
    type: build_sentence
    source:
      ar_eg: "اكتب «Sugeng rawuh» مقطع مقطع."
      ar: "اكتب «Sugeng rawuh» مقطعًا مقطعًا."
      en: Build "Sugeng rawuh", syllable by syllable.
    answer: ꦱꦸ ꦒꦼꦁ ꦫ ꦮꦸꦃ
    distractors: ["ꦮꦸ", "ꦒꦼ"]
    words: [cecak, wignyan]
    explain:
      ar_eg: "Sugeng آخرها ng: ꦒꦼꦁ بالـ cecak، وrawuh آخرها h: ꦮꦸꦃ بالـ wignyan. ꦒꦼ وꦮꦸ ناقصهم الحرف الأخير."
      ar: Sugeng تنتهي بـ ng فتُكتب ꦒꦼꦁ، وrawuh بـ h فتُكتب ꦮꦸꦃ. أما ꦒꦼ وꦮꦸ فينقصهما الصوت الأخير.
      en: Sugeng ends in ng (ꦒꦼꦁ) and rawuh in h (ꦮꦸꦃ). ꦒꦼ and ꦮꦸ lack the final sound.
dialogue:
  title: Ing gapura makam
  lines:
    - speaker: Abdi dalem
      text: Sugeng rawuh, Mas. Badhe mlebet?
      ar_eg: أهلًا وسهلًا. حضرتك عايز تدخل؟
      ar: أهلًا وسهلًا. أتريد الدخول؟
      en: Welcome. Would you like to go in?
    - speaker: Mohamed
      text: Inggih, Pak. Kula sampun maos.
      ar_eg: أيوه يا حاج. أنا قريت.
      ar: نعم يا سيدي. قرأتها.
      en: Yes, sir. I've read it.
    - speaker: Abdi dalem
      text: Mangga ngagem busana Jawa rumiyin. Saged nyewa wonten mriki.
      ar_eg: اتفضل البس اللبس الجاوي الأول. ممكن تأجّره من هنا.
      ar: تفضّل البس الزيّ الجاوي أولًا. يمكنك استئجاره هنا.
      en: Please put on Javanese dress first. You can rent it here.
    - speaker: Mohamed
      text: Inggih, Pak. Kula nyewa rumiyin.
      ar_eg: حاضر يا حاج. هأجّر الأول.
      ar: حسنًا يا سيدي. سأستأجره أولًا.
      en: Yes, sir. I'll rent some first.
new_words:
