    pos: noun
    ar_eg: لبس / زيّ؛ busana Jawa = اللبس الجاوي التقليدي
    ar: لباس / زيّ؛ busana Jawa = الزيّ الجاوي التقليدي
    en: clothes, attire; busana Jawa = traditional Javanese dress = busana
    same_as_id: true
