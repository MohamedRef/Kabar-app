    words: [buta, sekti, angkara murka, keris]
  - id: e03
    type: listen
    text: Arjuna iku satriya Pandhawa.
    question:
      ar_eg: أرجونا مين؟
      ar: مَن أرجونا؟
      en: Who is Arjuna?
    options: [أرجونا فارس من البانداوا, أرجونا عملاق وحش, أرجونا من الكوراوا]
    answer: 0
    meaning:
      ar_eg: أرجونا فارس من البانداوا.
      ar: أرجونا فارس من البانداوا.
      en: Arjuna is a Pandhawa knight.
    words: [satriya, Pandhawa]
  - id: e04
    type: fill_blank
    sentence: Pandhawa lan Kurawa perang ing ___.
    meaning:
      ar_eg: البانداوا والكوراوا اتحاربوا في ___.
      ar: تحارب البانداوا والكوراوا في ___.
      en: The Pandhawa and the Kurawa fight in the ___.
    options: [Bratayuda, keris, buta]
    answers: [Bratayuda]
    words: [Bratayuda, keris, buta, Pandhawa, Kurawa]
    explain:
      ar_eg: الحرب الكبيرة بين البانداوا والكوراوا = Bratayuda. keris خنجر، وbuta عملاق.
      ar: الحرب الكبرى بين الباندافا والكورافا = Bratayuda، أما keris فخنجر، وbuta عملاق.
      en: The great war of the Pandhawa and Kurawa is the Bratayuda. keris is a dagger, buta a giant.
  - id: e05
    type: multiple_choice
    question: Ing wayang, ___ iku gedhe lan medeni.
    question_meaning:
      ar_eg: في الوايانج، الـ ___ كبير ويخوّف.
      ar: في الوايانغ، الـ ___ ضخم مخيف.
      en: In wayang, the ___ is huge and frightening.
    options: [satriya, buta, keris]
    answer: 1
    explain:
      ar_eg: buta = عملاق وحش.
      ar: buta = عملاق شرّير.
      en: buta = ogre.
    words: [buta, satriya, keris]
  - id: e06
    type: fill_blank
    sentence: Werkudara satriya ingkang ___ sanget.
    meaning:
      ar_eg: ويركودارا فارس ___ أوي.
      ar: ويركودارا فارس ___ جدًّا.
      en: Werkudara is a very ___ knight.
    options: [sekti, Kurawa, angkara murka]
    answers: [sekti]
    words: [sekti, Kurawa, angkara murka]
    explain:
      ar_eg: فارس قوي جدًا = sekti. Kurawa الأعداء، وangkara murka الطمع والشر.
      ar: فارس شديد القوّة = sekti، أما Kurawa فالأعداء، وangkara murka الجشع والشرّ.
      en: A very powerful knight is sekti. Kurawa are the enemies, angkara murka greed and evil.
  - id: e07
    type: build_sentence
    source:
      ar_eg: الكوراوا كلهم طمع وشر.
      ar: الكوراوا طمع وشرّ.
      en: The Kurawa are greed and evil.
    answer: Kurawa iku angkara murka.
    distractors: [sekti, satriya]
    words: [Kurawa, angkara murka, sekti, satriya]
    explain:
      ar_eg: "الكوراوا رمز الطمع: angkara murka. sekti قوي، وsatriya فارس، ودول صفات الأبطال."
      ar: "الكورافا رمز الجشع: angkara murka، أما sekti فقويّ، وsatriya فارس، وهما من صفات الأبطال."
      en: "The Kurawa stand for greed: angkara murka. sekti \"powerful\" and satriya \"knight\" describe heroes."
  - id: e08
    type: translate
    direction: from_target
    source_text: Keris pusaka menika sekti sanget.
    answers_meaning:
      ar_eg: [الكريس الموروث ده ليه قوة خارقة, الخنجر الموروث ده قوي أوي]
      ar: [لهذا الخنجر الموروث قوّة خارقة, هذا الكريس الموروث قويّ جدًّا]
      en: [This heirloom keris has great power, This sacred keris is very powerful]
    words: [keris, sekti]
  - id: e09
    type: speaking
    text: Arjuna ngasta keris.
    meaning:
      ar_eg: أرجونا شايل الكريس.
      ar: يحمل أرجونا الكريس.
      en: Arjuna carries a keris.
    words: [keris]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيكسب حرب البراتايودا في الآخر؟
      ar: مَن ينتصر في حرب البراتايودا في النهاية؟
      en: Who wins the Bratayuda in the end?
    options: [Kurawa, buta, Pandhawa]
    answer: 2
    explain:
      ar_eg: 'البانداوا بيكسبوا: الخير بيغلب angkara murka.'
      ar: 'ينتصر البانداوا: يغلب الخيرُ angkara murka.'
      en: 'The Pandhawa win: good overcomes angkara murka.'
    words: [Pandhawa, Kurawa, Bratayuda, buta, angkara murka]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, menika sinten?
      ar_eg: يا أستاذ، ده مين؟
      ar: يا سيدي، مَن هذا؟
      en: Sir, who is this?
    - speaker: Pak Harsono
      text: Menika Arjuna, satriya Pandhawa.
      ar_eg: ده أرجونا، فارس البانداوا.
      ar: هذا أرجونا، فارس البانداوا.
      en: That's Arjuna, a Pandhawa knight.
    - speaker: Mohamed
      text: Lajeng ingkang ageng menika?
      ar_eg: وده الكبير ده؟
      ar: وهذا الضخم؟
      en: And this big one?
    - speaker: Pak Harsono
      text: Menika buta, abdinipun Kurawa.
      ar_eg: ده عملاق، من خدم الكوراوا.
      ar: هذا عملاق من خدم الكوراوا.
      en: That's an ogre, a servant of the Kurawa.
    - speaker: Mohamed
      text: Mangke Pandhawa menang, Pak?
      ar_eg: وفي الآخر البانداوا هيكسبوا يا أستاذ؟
      ar: وهل ينتصر البانداوا في النهاية يا سيدي؟
      en: Do the Pandhawa win in the end, sir?
    - speaker: Pak Harsono
      text: Inggih, wonten Bratayuda. Angkara murka mesthi kalah.
      ar_eg: أيوه، في البراتايودا. الطمع والشر لازم يخسروا.
      ar: نعم، في البراتايودا. لا بدّ أن يُهزم الطمع والشرّ.
      en: Yes, in the Bratayuda. Greed and evil always lose.
