schema: kabar.lesson/v1
id: j4.u06.l05
language: jv
title: Pandhawa lan Kurawa
can_do:
  ar_eg: 'تحكي ملخّص المهابهاراتا في الوايانج: الأبطال والأشرار والحرب الكبيرة.'
  ar: 'أن تحكي ملخّص المهابهاراتا في الوايانغ: الأبطال والأشرار والحرب الكبرى.'
  en: 'Retell the Mahabharata in wayang: the heroes, the villains and the great war.'
slides:
  - title: Satriya lan buta
    body:
      ar_eg: |
        - Pandhawa = الخمس أخوات الطيبين (Yudhistira، Werkudara، Arjuna، Nakula، Sadewa). Kurawa = ولاد عمهم المية.
        - Bratayuda = الحرب الكبيرة بينهم في الآخر.
        - satriya = فارس نبيل زي Arjuna. buta = عملاق وحش.
        - sekti = عنده قوة خارقة. angkara murka = الطمع والشر اللي بياكل صاحبه.
        - keris = الخنجر الجاوي المتعرّج، سلاح الساتريا وكمان pusaka.
        والدالانج بيتكلم عن الساتريا والملوك بالـ krama inggil: «Arjuna ngasta keris.»
      ar: |
        - Pandhawa = الإخوة الخمسة الأخيار (Yudhistira وWerkudara وArjuna وNakula وSadewa). Kurawa = أبناء عمّهم المئة.
        - Bratayuda = الحرب الكبرى بينهم في النهاية.
        - satriya = فارس نبيل كأرجونا. buta = عملاق شرّير.
        - sekti = ذو قوّة خارقة. angkara murka = الطمع والشرّ الذي يأكل صاحبه.
        - keris = الخنجر الجاوي المتعرّج، سلاح الفارس وتحفة موروثة pusaka أيضًا.
        ويتكلم الدالانغ عن الفرسان والملوك بالـ krama inggil: «Arjuna ngasta keris.»
      en: |
        - Pandhawa = the five good brothers (Yudhistira, Werkudara, Arjuna, Nakula, Sadewa). Kurawa = their hundred cousins.
        - Bratayuda = the great war between them at the end.
        - satriya = noble knight, like Arjuna. buta = ogre, giant.
        - sekti = with supernatural power. angkara murka = greed and evil that consume their owner.
        - keris = the wavy Javanese dagger, a knight's weapon and often a pusaka.
        The dhalang speaks of knights and kings in krama inggil: "Arjuna ngasta keris."
    examples:
      - text: Arjuna satriya Pandhawa ingkang bagus.
        ar_eg: أرجونا فارس البانداوا الوسيم.
        ar: أرجونا فارس البانداوا الوسيم.
        en: Arjuna is the handsome knight of the Pandhawa.
      - text: Kurawa iku angkara murka.
        ar_eg: الكوراوا كلهم طمع وشر.
        ar: الكوراوا طمع وشرّ.
        en: The Kurawa are greed and evil.
      - text: Keris pusaka menika sekti sanget.
        ar_eg: الكريس الموروث ده ليه قوة خارقة.
        ar: لهذا الخنجر الموروث قوّة خارقة.
        en: This heirloom keris has great power.
