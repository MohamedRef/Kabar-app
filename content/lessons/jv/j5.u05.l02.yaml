  - id: e10
    type: translate
    direction: from_target
    source_text: Sadurunge lunga sekolah, Bima sarapan.
    answers_meaning:
      ar_eg:
        - قبل ما يروح المدرسة، بيما فطر.
        - بيما فطر قبل ما يروح المدرسة.
        - قبل ما بيما يروح المدرسة، فطر.
      ar:
        - قبل أن يذهب إلى المدرسة تناول بيما فطوره.
        - تناول بيما فطوره قبل أن يذهب إلى المدرسة.
        - قبل الذهاب إلى المدرسة تناول بيما الفطور.
      en:
        - Before going to school, Bima had breakfast.
        - Bima had breakfast before going to school.
        - Before he went to school, Bima had breakfast.
        - Before going to school, Bima ate breakfast.
        - Bima ate breakfast before going to school.
    words: [sadurunge]
dialogue:
  title: Nalika isih cilik
  lines:
    - speaker: Bu Nur
      text: Mas, nalika isih cilik, sampeyan manggon ing ngendi?
      ar_eg: يا محمد، لما كنت صغير كنت ساكن فين؟
      ar: يا محمد، أين كنت تسكن حين كنت صغيرًا؟
      en: Mohamed, where did you live when you were little?
    - speaker: Mohamed
      text: Nalika isih alit, kula manggen ing Kairo, Bu.
      ar_eg: لما كنت صغير كنت ساكن في القاهرة يا أبلة.
      ar: حين كنت صغيرًا كنت أسكن القاهرة يا سيدتي.
      en: When I was little, I lived in Cairo, ma'am.
    - speaker: Bu Nur
      text: Sadurunge menyang Jawa, sampeyan sinau basa Indonesia?
      ar_eg: قبل ما تيجي جاوة، اتعلمت إندونيسي؟
      ar: قبل أن تأتي إلى جاوة، هل تعلمت الإندونيسية؟
      en: Before coming to Java, did you study Indonesian?
    - speaker: Mohamed
      text: Inggih. Sasampunipun basa Indonesia, kula sinau basa Jawi.
      ar_eg: أيوه. بعد الإندونيسي، اتعلمت جاوي.
      ar: نعم. بعد الإندونيسية تعلمت الجاوية.
      en: Yes. After Indonesian, I studied Javanese.
