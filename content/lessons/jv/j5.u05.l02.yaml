schema: kabar.lesson/v1
id: j5.u05.l02
language: jv
title: Sawise, sadurunge, nalika
can_do:
  ar_eg: تمشي ورا «قبل» و«بعد» و«لما» في قصة.
  ar: أن تتتبّع «قبل» و«بعد» و«حين» في قصة.
  en: Follow before, after and when in a story.
slides:
  - title: Sawise lan sadurunge
    body:
      ar_eg: |
        sawise = بعد ما (sesudah)، sadurunge = قبل ما (sebelum). وبعدهم جملة كاملة.
        خلي بالك من الترتيب: في «Sawise mangan, dheweke banjur turu» الأكل الأول وبعدين النوم.
        وفي الكراما: sasampunipun وsaderengipun.
      ar: |
        sawise = بعد أن (sesudah)، وsadurunge = قبل أن (sebelum)، وتليهما جملة كاملة.
        وانتبه للترتيب: في «Sawise mangan, dheweke banjur turu» الأكل أولًا ثم النوم.
        وفي الكراما: sasampunipun وsaderengipun.
      en: |
        sawise = after (sesudah), sadurunge = before (sebelum), each followed by a full clause.
        Watch the order: in "Sawise mangan, dheweke banjur turu" the eating comes first, then the sleep.
        In krama: sasampunipun and saderengipun.
    grammar: jv.narrative.connectors
    examples:
      - text: Sawise mangan, dheweke banjur turu.
        ar_eg: بعد ما أكل، نام.
        ar: بعد أن أكل نام.
        en: After eating, he went to sleep.
      - text: Sadurunge turu, Bima maca buku.
        ar_eg: قبل ما ينام، بيما قرا كتاب.
        ar: قبل أن ينام قرأ بيما كتابًا.
        en: Before sleeping, Bima read a book.
  - title: Nalika = ketika
    body:
      ar_eg: |
        nalika = لما / عندما، عن وقت في الماضي: «Nalika isih cilik, …» = لما كان صغير.
        وnalika iku = ساعتها / وقتها.
        خد بالك: nalika مش «لو». «لو» = yen.
      ar: |
        nalika = حين / عندما، لزمن مضى: «Nalika isih cilik, …» = حين كان صغيرًا.
        وnalika iku = آنذاك.
        وانتبه: nalika ليست «إن / لو»، فتلك yen.
      en: |
        nalika = when, for a time in the past: "Nalika isih cilik, …" = when he was little.
        nalika iku = at that time.
        Careful: nalika is not "if". "If" is yen.
    grammar: jv.narrative.connectors
    examples:
      - text: Nalika isih cilik, Rina manggon ing Semarang.
        ar_eg: لما رينا كانت صغيرة، كانت ساكنة في سيمارانج.
        ar: حين كانت رينا صغيرة كانت تسكن سيمارانج.
        en: When she was little, Rina lived in Semarang.
      - text: Nalika iku, Bima isih cilik.
        ar_eg: ساعتها، بيما كان لسه صغير.
        ar: آنذاك كان بيما ما يزال صغيرًا.
        en: At that time, Bima was still little.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sawise
        ar_eg: بعد ما (sesudah)
        ar: بعد أن (sesudah)
        en: after (sesudah)
      - text: sadurunge
        ar_eg: قبل ما (sebelum)
        ar: قبل أن (sebelum)
        en: before (sebelum)
      - text: nalika
        ar_eg: لما / عندما (ketika)
        ar: حين (ketika)
        en: when, in the past (ketika)
      - text: nalika iku
        ar_eg: ساعتها (saat itu)
        ar: آنذاك (saat itu)
        en: at that time (saat itu)
    words: [sawise, sadurunge, nalika]
  - id: e02
    type: multiple_choice
    question: Sawise mangan, dheweke banjur turu.
    question_meaning:
      ar_eg: عمل إيه الأول؟
      ar: ماذا فعل أولًا؟
      en: What did he do first?
    options: [mangan, turu, adus]
    answer: 0
    words: [sawise]
  - id: e03
    type: multiple_choice
    question: Sadurunge turu, Bima maca buku.
    question_meaning:
      ar_eg: بيما عمل إيه قبل ما ينام؟
      ar: ماذا فعل بيما قبل أن ينام؟
      en: What did Bima do before sleeping?
    options: [adus, mangan, maca buku]
    answer: 2
    words: [sadurunge]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «لو»؟
      ar: أي كلمة بمعنى «إن / لو»؟
      en: Which word means "if"?
    options: [nalika, yen, sawise]
    answer: 1
    explain:
      ar_eg: nalika = لما (في الماضي). «لو» = yen.
      ar: nalika = حين (في الماضي)، و«لو» = yen.
      en: nalika = when (in the past); "if" = yen.
    words: [nalika]
  - id: e05
