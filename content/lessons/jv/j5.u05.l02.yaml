      ar_eg: (بأسلوب الحكاية) بعد ما أكل، بيما نام.
      ar: (بأسلوب الحكاية) بعد أن أكل بيما نام.
      en: (story style) After eating, Bima went to sleep.
    answers:
      - Sawise mangan, Bima banjur turu.
      - Sawise mangan, Bima turu.
      - Bima turu sawise mangan.
      - Sawise mangan, Bima nuli turu.
      - Sawise mangan, Bima terus turu.
      - Bima banjur turu sawise mangan.
