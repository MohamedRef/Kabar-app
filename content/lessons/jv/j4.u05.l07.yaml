    answers_meaning:
      ar_eg: [رقصة البيدهايا بتاعة القصر رقيقة أوي, رقصة بيدهايا من القصر ناعمة جدًا]
      ar: [رقصة البيدهايا من القصر رقيقة جدًّا, رقصة القصر بيدهايا ناعمة للغاية]
      en: [The Bedhaya dance from the Kraton is very graceful, 'The palace''s Bedhaya dance is very refined']
