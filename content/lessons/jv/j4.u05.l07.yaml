    answer: 2
    explain:
      ar_eg: karcis = تذكرة.
      ar: karcis = تذكرة.
      en: karcis = ticket.
    words: [karcis, gela, wayang wong, pagelaran]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, kula kepengin nonton sendratari Ramayana.
      ar_eg: يا أستاذ، نفسي أتفرج على باليه رامايانا.
      ar: يا سيدي، أرغب في مشاهدة باليه رامايانا.
      en: Sir, I'd love to see the Ramayana ballet.
    - speaker: Pak Harsono
      text: Sae, Nak. Pagelaranipun dinten Setu ing Prambanan.
      ar_eg: كويس يا ابني. العرض يوم السبت في برامبانان.
      ar: حسن يا بنيّ. العرض يوم السبت في برامبانان.
      en: Good idea, son. The show is on Saturday at Prambanan.
    - speaker: Mas Dimas
      text: Pak, karcise wis ora ana.
      ar_eg: يا بابا، التذاكر خلصت.
      ar: يا أبي، نفدت التذاكر.
      en: Dad, the tickets are sold out.
    - speaker: Mohamed
      text: Waduh, kula gela.
      ar_eg: يا خسارة، أنا محبط.
      ar: يا للأسف، خاب أملي.
      en: Oh no, I'm disappointed.
    - speaker: Pak Harsono
      text: Sampun gela. Wonten wayang wong ing Kraton, benjang Minggu.
      ar_eg: ما تزعلش. في وايانج ووونج في القصر يوم الأحد.
      ar: لا تحزن. هناك وايانغ وونغ في القصر يوم الأحد.
      en: Don't be disappointed. There's wayang wong at the Kraton on Sunday.
    - speaker: Mohamed
      text: Matur nuwun, Pak! Kula purun.
      ar_eg: شكرًا يا أستاذ! أنا موافق.
      ar: شكرًا يا سيدي! يسعدني ذلك.
      en: Thank you, sir! I'd love to.
