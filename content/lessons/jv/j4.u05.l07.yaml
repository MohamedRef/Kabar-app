    question_meaning:
      ar_eg: پاك هارسونو مش ___. هو صبور.
      ar: باك هارسونو ليس ___، فهو صبور.
      en: Pak Harsono isn't ___. He's patient.
    options: [duka, beksan, nggantheng]
    answer: 0
    explain:
      ar_eg: duka = زعلان/غضبان، كلمة krama inggil للكبير.
      ar: duka = غاضب، كلمة krama inggil للكبير.
      en: duka = angry, the krama inggil word for an elder.
    words: [duka, beksan, nggantheng]
  - id: e06
