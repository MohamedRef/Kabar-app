id: j4.u05.l07
language: jv
title: Nonton sendratari
can_do:
  ar_eg: تخطّط تتفرج على باليه رامايانا مع العيلة، تشتري تذاكر، وتتكلم عن الإحباط والزعل بأدب.
  ar: أن تخطّط لمشاهدة باليه رامايانا مع العائلة، وتشتري التذاكر، وتتحدث عن الخيبة والغضب بأدب.
  en: Plan to see the Ramayana ballet with the family, buy tickets, and talk politely about disappointment and anger.
slides:
  - title: Sendratari Ramayana
    body:
      ar_eg: |
        - sendratari = باليه جاوي من غير كلام (seni drama tari): «Sendratari Ramayana ing Prambanan».
        - beksan = رقصة (كلمة القصر والكراما لـ tari). wayang wong = وايانج بممثلين بني آدمين بدل العرايس.
        - pagelaran = عرض فني. karcis = تذكرة.
        - gela = محبط، زعلان إن حاجة ما حصلتش. duka = زعلان، غضبان (krama inggil لـ nesu): «Bapak mboten duka» = الأستاذ مش زعلان.
        - nggantheng = وسيم: «Rama nggantheng, Sinta ayu.»
      ar: |
        - sendratari = باليه جاوي بلا كلام (seni drama tari): «Sendratari Ramayana ing Prambanan».
        - beksan = رقصة (كلمة القصر والكراما لـ tari). wayang wong = وايانغ يؤدّيه ممثّلون من البشر بدل الدمى.
        - pagelaran = عرض فنّي. karcis = تذكرة.
        - gela = خائب الأمل. duka = غاضب، زعلان (krama inggil لـ nesu): «Bapak mboten duka» = الوالد ليس غاضبًا.
        - nggantheng = وسيم: «Rama nggantheng, Sinta ayu.»
      en: |
        - sendratari = Javanese dance drama without words (seni drama tari): "Sendratari Ramayana ing Prambanan".
        - beksan = dance (the palace and krama word for tari). wayang wong = wayang performed by human actors instead of puppets.
        - pagelaran = performance, show. karcis = ticket.
        - gela = disappointed. duka = angry, upset (krama inggil for nesu): "Bapak mboten duka" = Father isn't angry.
        - nggantheng = handsome: "Rama nggantheng, Sinta ayu."
    examples:
      - text: Aku kepengin nonton sendratari Ramayana ing Prambanan.
        ar_eg: نفسي أتفرج على باليه رامايانا في برامبانان.
        ar: أرغب في مشاهدة باليه رامايانا في برامبانان.
        en: I'd love to see the Ramayana ballet at Prambanan.
      - text: Karcise wis ora ana. Aku gela.
        ar_eg: التذاكر خلصت. أنا محبط.
        ar: نفدت التذاكر، وخاب أملي.
        en: The tickets are gone. I'm disappointed.
      - text: Bapak mboten duka, Mas.
        ar_eg: الأستاذ مش زعلان يا ماس.
        ar: الوالد ليس غاضبًا يا ماس.
        en: Father isn't angry, Mas.
