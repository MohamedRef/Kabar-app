schema: kabar.lesson/v1
id: j4.u05.l07
language: jv
title: Papat wong, papat basa
can_do:
  ar_eg: تقرا فقرة عن مستويات الكلام وتختار المستوى المناسب لكل شخص.
  ar: أن تقرأ فقرة عن مستويات الكلام وتختار المستوى المناسب لكل شخص.
  en: Read a paragraph about speech levels and pick the right level for each person.
slides:
  - title: Basaku karo papat wong
    body:
      ar_eg: |
        محمد كتب فقرة لأستاذه Pak Bambang: بيكلّم أربع ناس إزاي؟ اقراها.
        Mas Dimas صاحبه وقدّه: نغوكو لوغو. Mbak Ratri قريبة بس أكبر: نغوكو ألوس. Pak Bambang أستاذه: كراما ألوس. والرابع، بياع البكبيا اللي قدّه ومايعرفهوش: كراما لوغو («Sampeyan sampun nedha?»).
        وخد بالك: الجملة اللي عن Pak Bambang نفسها مكتوبة بالكراما (kula ngangge).
      ar: |
        كتب محمد فقرة لأستاذه Pak Bambang: كيف يخاطب أربعة أشخاص؟ اقرأها.
        Mas Dimas صديقه ونظيره: نغوكو لوغو. Mbak Ratri قريبة لكنها أكبر: نغوكو ألوس. Pak Bambang أستاذه: كراما ألوس. والرابع بائع البكبيا، نظيره الغريب: كراما لوغو («Sampeyan sampun nedha?»).
        ولاحظ أن جملة Pak Bambang نفسها مكتوبة بالكراما (kula ngangge).
      en: |
        Mohamed wrote a paragraph for his teacher, Pak Bambang: how does he talk to four people? Read it.
        Mas Dimas, a friend his age: ngoko lugu. Mbak Ratri, close but older: ngoko alus. Pak Bambang, his teacher: krama alus. And the fourth, the bakpia seller his age whom he doesn't know: krama lugu ("Sampeyan sampun nedha?").
        Notice that the sentence about Pak Bambang is itself in krama (kula ngangge).
    grammar: jv.speechlevel.mixed
    examples:
      - text: Karo Mas Dimas aku nganggo ngoko lugu, «Kowe wis mangan?»
        ar_eg: 'مع Mas Dimas بتكلم نغوكو لوغو: «كلت؟»'
        ar: 'مع Mas Dimas أتكلم النغوكو لوغو: «هل أكلت؟»'
        en: With Mas Dimas I use ngoko lugu, "Kowe wis mangan?"
      - text: Karo Mbak Ratri aku nganggo ngoko alus, «Mbak wis dhahar?»
        ar_eg: 'مع Mbak Ratri بتكلم نغوكو ألوس: «أكلتي يا أبلة؟»'
        ar: 'مع Mbak Ratri أتكلم النغوكو ألوس: «هل أكلتِ يا أختي؟»'
        en: With Mbak Ratri I use ngoko alus, "Mbak wis dhahar?"
      - text: Kaliyan Pak Bambang kula ngangge krama alus, «Panjenengan sampun dhahar?»
        ar_eg: 'مع Pak Bambang بتكلم كراما ألوس: «حضرتك أكلت؟»'
        ar: 'مع Pak Bambang أتكلم الكراما ألوس: «هل تفضّلتَ بالأكل؟»'
        en: With Pak Bambang I use krama alus, "Panjenengan sampun dhahar?"
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: محمد بيكلّم Mbak Ratri بأنهي مستوى؟
      ar: بأي مستوى يخاطب محمد Mbak Ratri؟
      en: Which level does Mohamed use with Mbak Ratri?
    options: [ngoko lugu, ngoko alus, krama alus]
    answer: 1
    explain:
      ar_eg: «Karo Mbak Ratri aku nganggo ngoko alus» - قريبة بس أكبر.
      ar: «Karo Mbak Ratri aku nganggo ngoko alus» - قريبة لكنها أكبر.
      en: '"Karo Mbak Ratri aku nganggo ngoko alus": close, but older.'
    words: [ngoko alus]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين بياخد كراما ألوس؟
      ar: من يُخاطَب بالكراما ألوس؟
      en: Who gets krama alus?
    options: [Mas Dimas, Mbak Ratri, Pak Bambang]
    answer: 2
    explain:
      ar_eg: 'الأستاذ كبير ومش من العيلة: كراما ألوس.'
      ar: 'الأستاذ كبير وليس من الأسرة: كراما ألوس.'
      en: 'The teacher is older and not family: krama alus.'
    words: [krama alus]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: (كراما لوغو) محمد بيسأل بياع البكبيا اللي قدّه لو أكل. يقول إيه؟
      ar: (كراما لوغو) يسأل محمد بائع البكبيا الذي في سنّه هل أكل. ماذا يقول؟
      en: (krama lugu) Mohamed asks the bakpia seller, who's his age, whether he's eaten. What does he say?
    options: ['Sampeyan sampun nedha?', 'Kowe wis mangan?', 'Mbak wis dhahar?']
    answer: 0
    explain:
      ar_eg: 'كراما لوغو = كلام كراما من غير krama inggil: sampeyan، sampun، nedha.'
      ar: 'الكراما لوغو = ألفاظ كراما بلا krama inggil: sampeyan، sampun، nedha.'
      en: 'Krama lugu = krama words with no krama inggil: sampeyan, sampun, nedha.'
    words: [krama lugu]
  - id: e04
    type: listen
    text: Karo Mbak Ratri aku nganggo ngoko alus, «Mbak wis dhahar?»
    question:
      ar_eg: محمد بيتكلم عن مين هنا؟
      ar: عمّن يتحدث محمد هنا؟
      en: Who is Mohamed talking about here?
    options: [Mas Dimas, Mbak Ratri, Pak Bambang]
    answer: 1
    meaning:
      ar_eg: 'مع Mbak Ratri بتكلم نغوكو ألوس: «أكلتي يا أبلة؟»'
      ar: 'مع Mbak Ratri أتكلم النغوكو ألوس: «هل أكلتِ يا أختي؟»'
      en: With Mbak Ratri I use ngoko alus, "Mbak wis dhahar?"
    words: [ngoko alus]
  - id: e05
    type: match_pairs
    pairs:
      - text: Kowe wis mangan?
        ar_eg: نغوكو لوغو (لصاحبك)
        ar: نغوكو لوغو (للصديق)
        en: ngoko lugu (to a friend)
      - text: Mbak wis dhahar?
        ar_eg: نغوكو ألوس (لأخت أكبر)
        ar: نغوكو ألوس (لأخت كبرى)
        en: ngoko alus (to an older sister)
      - text: Sampeyan sampun nedha?
        ar_eg: كراما لوغو (لبياع قدّك)
        ar: كراما لوغو (لبائع في سنّك)
        en: krama lugu (to a seller your age)
      - text: Panjenengan sampun dhahar?
        ar_eg: كراما ألوس (للأستاذ)
        ar: كراما ألوس (للأستاذ)
        en: krama alus (to a teacher)
    words: [ngoko lugu, ngoko alus, krama lugu, krama alus]
  - id: e06
    type: fill_blank
    sentence: Kaliyan Pak Bambang kula ngangge krama alus, «Panjenengan sampun ___?»
    meaning:
      ar_eg: 'مع Pak Bambang بتكلم كراما ألوس: «حضرتك أكلت؟»'
      ar: 'مع Pak Bambang أتكلم الكراما ألوس: «هل تفضّلتَ بالأكل؟»'
      en: With Pak Bambang I use krama alus, "Have you eaten?"
    answers: [dhahar]
    explain:
      ar_eg: كراما ألوس = كراما + krama inggil لأفعال الأستاذ، يبقى dhahar.
      ar: الكراما ألوس = كراما + krama inggil لأفعال الأستاذ، فتقول dhahar.
      en: Krama alus = krama + krama inggil for the teacher's actions, so dhahar.
    words: [krama alus, dhahar]
  - id: e07
    type: dictation
    text: Karo Mbak Ratri aku nganggo ngoko alus.
    meaning:
      ar_eg: مع Mbak Ratri بتكلم نغوكو ألوس.
      ar: مع Mbak Ratri أتكلم النغوكو ألوس.
      en: With Mbak Ratri I use ngoko alus.
    words: [ngoko alus]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (في نفس الفقرة، بالنغوكو) مع Mas Hendra بتكلم نغوكو ألوس.
      ar: (في الفقرة نفسها، بالنغوكو) مع Mas Hendra أتكلم النغوكو ألوس.
      en: (same paragraph, in ngoko) With Mas Hendra I use ngoko alus.
    answers:
      - Karo Mas Hendra aku nganggo ngoko alus.
      - Aku nganggo ngoko alus karo Mas Hendra.
      - Karo Mas Hendra, aku nganggo basa ngoko alus.
    explain:
      ar_eg: Mas Hendra صاحب بس أكبر، زي Mbak Ratri - نغوكو ألوس.
      ar: Mas Hendra صديق لكنه أكبر، مثل Mbak Ratri - نغوكو ألوس.
      en: Mas Hendra is a friend but older, like Mbak Ratri, so ngoko alus.
    words: [ngoko alus]
dialogue:
  title: Kaliyan Pak Bambang
  lines:
    - speaker: Pak Bambang
      text: Mas Mohamed, menika sae sanget.
      ar_eg: يا محمد، ده حلو أوي.
      ar: يا محمد، هذا جيد جدًا.
      en: Mohamed, this is very good.
    - speaker: Mohamed
      text: Matur nuwun, Pak.
      ar_eg: شكرًا يا أستاذ.
      ar: شكرًا يا أستاذ.
      en: Thank you, sir.
    - speaker: Pak Bambang
      text: Kaliyan Mas Hendra, sampeyan ngangge basa menapa?
      ar_eg: ومع Mas Hendra بتتكلم بأنهي مستوى؟
      ar: وبأي مستوى تخاطب Mas Hendra؟
      en: And with Mas Hendra, which level do you use?
    - speaker: Mohamed
      text: Ngoko alus, Pak. Mas Hendra langkung sepuh.
      ar_eg: نغوكو ألوس يا أستاذ. Mas Hendra أكبر مني.
      ar: النغوكو ألوس يا أستاذ، فـ Mas Hendra أكبر سنًّا.
      en: Ngoko alus, sir. Mas Hendra is older.
    - speaker: Pak Bambang
      text: Leres, Mas. Sae sanget.
      ar_eg: صح يا محمد. ممتاز.
      ar: صحيح يا محمد. ممتاز.
      en: That's right. Very good.
review:
