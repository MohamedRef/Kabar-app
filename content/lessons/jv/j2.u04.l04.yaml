schema: kabar.lesson/v1
id: j2.u04.l04
language: jv
title: Seminggu ping telu
can_do:
  ar_eg: 'تقول بتعمل الحاجة كام مرة: عادةً، ساعات، نادرًا، تلات مرات في الأسبوع، والمحل بيفتح إمتى.'
  ar: 'أن تقول كم مرّة تفعل الشيء: عادةً، أحيانًا، نادرًا، ثلاث مرّات في الأسبوع، ومتى يفتح المحلّ.'
  en: 'Say how often you do things: usually, sometimes, rarely, three times a week, and when a place opens.'
slides:
  - title: Ping pira?
    body:
      ar_eg: |
        seminggu = أسبوع (أسبوع واحد)، wulan = شهر: wulan ngarep = الشهر الجاي.
        ping = مرّة: ping telu = تلات مرات. Seminggu ping telu = تلات مرات في الأسبوع.
        biasane = عادةً، kadang = ساعات (أحيانًا)، jarang = نادرًا.
        jadwal = جدول، مواعيد. buka = فاتح، يفتح: Warunge buka jam pitu.
      ar: |
        seminggu = أسبوع (أسبوع واحد)، wulan = شهر: wulan ngarep = الشهر القادم.
        ping = مرّة: ping telu = ثلاث مرّات. Seminggu ping telu = ثلاث مرّات في الأسبوع.
        biasane = عادةً، kadang = أحيانًا، jarang = نادرًا.
        jadwal = جدول، مواعيد. buka = مفتوح، يفتح: Warunge buka jam pitu.
      en: |
        seminggu = one week, wulan = month: wulan ngarep = next month.
        ping = times: ping telu = three times. Seminggu ping telu = three times a week.
        biasane = usually, kadang = sometimes, jarang = rarely.
        jadwal = schedule. buka = open: Warunge buka jam pitu.
    examples:
      - text: Aku neng pasar seminggu ping telu.
        ar_eg: بروح السوق تلات مرات في الأسبوع.
        ar: أذهب إلى السوق ثلاث مرّات في الأسبوع.
        en: I go to the market three times a week.
      - text: Warunge buka jam pitu esuk.
        ar_eg: المحل بيفتح الساعة سبعة الصبح.
        ar: يفتح المحلّ في السابعة صباحًا.
        en: The stall opens at seven in the morning.
      - text: Biasane aku ngopi esuk.
        ar_eg: عادةً بشرب قهوة الصبح.
        ar: عادةً أشرب القهوة صباحًا.
        en: I usually have coffee in the morning.
