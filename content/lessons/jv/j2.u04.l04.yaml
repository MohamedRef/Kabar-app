      en: What does it mean?
    options: [نادرًا ما بروّح القاهرة, ساعات بروّح القاهرة, عادةً بروّح القاهرة]
    answer: 0
    explain:
      ar_eg: jarang = نادرًا، kadang = ساعات، biasane = عادةً.
      ar: jarang = نادرًا، kadang = أحيانًا، biasane = عادةً.
      en: jarang = rarely, kadang = sometimes, biasane = usually.
    words: [jarang, kadang, biasane]
