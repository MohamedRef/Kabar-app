  - id: e10
    type: speaking
    text: Seminggu ping telu aku sinau basa Jawa.
    meaning:
      ar_eg: بذاكر جاوي تلات مرات في الأسبوع.
      ar: أدرس الجاوية ثلاث مرّات في الأسبوع.
      en: I study Javanese three times a week.
    words: [seminggu, ping]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, kowe sinau basa Jawa seminggu ping pira?
      ar_eg: يا محمد، بتذاكر جاوي كام مرة في الأسبوع؟
      ar: يا محمد، كم مرّة في الأسبوع تدرس الجاوية؟
      en: Mohamed, how many times a week do you study Javanese?
    - speaker: Mohamed
      text: Biasane ping telu, Mas. Kadang saben dina.
      ar_eg: عادةً تلات مرات يا ماس. وساعات كل يوم.
      ar: عادةً ثلاث مرّات يا أخي، وأحيانًا كلّ يوم.
      en: Usually three times, Mas. Sometimes every day.
    - speaker: Mas Dimas
      text: Apik! Aku jarang sinau, hehe. Jadwal kuliahku kebak.
      ar_eg: حلو! أنا نادرًا ما بذاكر، هههه. جدول محاضراتي مليان.
      ar: ممتاز! أنا نادرًا ما أدرس، هههه. جدول محاضراتي مزدحم.
      en: Great! I rarely study, hehe. My lecture schedule is full.
    - speaker: Mohamed
      text: Sesuk Jumuah ayo ngopi. Warunge buka jam pira?
      ar_eg: الجمعة بكرة يلا نشرب قهوة. المحل بيفتح الساعة كام؟
      ar: غدًا الجمعة هيّا نشرب القهوة. متى يفتح المقهى؟
      en: Let's grab coffee on Friday. What time does the place open?
    - speaker: Mas Dimas
      text: Jam pitu. Sari uga mulih wulan ngarep, lho!
      ar_eg: الساعة سبعة. وساري كمان راجعة الشهر الجاي!
      ar: في السابعة. وساري أيضًا تعود الشهر القادم!
      en: Seven. And Sari's coming home next month, you know!
