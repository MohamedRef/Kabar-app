id: j4.u02.l07
language: jv
title: Kenang-kenangan saking Malioboro
can_do:
  ar_eg: تشتري تذكارات من ماليوبورو، وتوصّي صاحبك يجيبلك حاجة، وتقول إنك محرج بأدب.
  ar: أن تشتري تذكارات من ماليوبورو، وتوصي صديقك أن يحضر لك شيئًا، وتعبّر عن حرجك بأدب.
  en: Buy keepsakes in Malioboro, ask a friend to bring you something, and say politely that you feel awkward.
slides:
  - title: Gudeg, bakpia, sinjang
    body:
      ar_eg: |
        - gudeg = أكلة يوجيا المشهورة: جاك فروت (كاكايا) مطبوخ بسكر جاوة ولبن جوز الهند. bakpia = فطيرة صغيرة محشية فول أخضر.
        - jarik = قماش الباتيك اللي بيتلف على الوسط (نغوكو)، sinjang = نفس الحاجة بالكراما. selop = شبشب مقفول من قدام، بيتلبس مع اللبس الجاوي.
        - kenang-kenangan = تذكار.
        - titip = توصّي حد يجيبلك أو يوصّل حاجة: «Aku titip bakpia, ya!» = هاتلي باكبيا معاك!
        - pakewuh = محرج إنك تتقل على حد، من باب الأدب: «Kula pakewuh, Bu» = أنا محرج منك يا هانم.
        - في الشارع: neng = menyang / ing (لـ، في).
        - og كلمة صغيرة بتدّي الجملة إحساس (من كلام يوجيا)، ومن غيرها الجملة صح برضه.
      ar: |
        - gudeg = أكلة يوغيا الشهيرة: الكاكايا مطبوخة بسكر جاوة وحليب جوز الهند. bakpia = فطيرة صغيرة محشوّة بالفول الأخضر.
        - jarik = قماش الباتيك الذي يُلفّ على الخصر (نغوكو)، وsinjang = الشيء نفسه بالكراما. selop = خفّ مغلق من الأمام يُلبس مع اللباس الجاوي.
        - kenang-kenangan = تذكار.
        - titip = أن توصي أحدًا بإحضار شيء أو إيصاله: «Aku titip bakpia, ya!» = أحضر لي معك باكبيا!
        - pakewuh = حرج من أن تثقل على أحد، أدبًا: «Kula pakewuh, Bu» = أنا محرج منكِ يا سيدتي.
        - في كلام الشارع: neng = menyang / ing (إلى، في).
        - og أداة صغيرة تلوّن الجملة (من كلام يوجيا)، والجملة صحيحة بدونها.
      en: |
        - gudeg = Yogya's famous dish: young jackfruit cooked with palm sugar and coconut milk. bakpia = small pastry filled with mung beans.
        - jarik = batik cloth wrapped round the waist (ngoko); sinjang = the same in krama. selop = closed-toe slippers worn with Javanese dress.
        - kenang-kenangan = keepsake, souvenir.
        - titip = ask someone to bring or deliver something for you: "Aku titip bakpia, ya!" = bring me some bakpia!
        - pakewuh = feel awkward about imposing on someone, out of courtesy: "Kula pakewuh, Bu" = I feel bad, ma'am.
        - On the street: neng = menyang / ing (to, at).
        - og is a small particle that adds feeling (Jogja speech); the sentence is correct without it.
    examples:
      - text: Aku titip bakpia, ya, Mas!
        ar_eg: هاتلي باكبيا معاك يا ماس!
        ar: أحضر لي باكبيا يا ماس!
        en: Bring me some bakpia, Mas!
      - text: Sinjang menika kenang-kenangan kagem Ibu.
        ar_eg: السنجانج ده تذكار لحضرتك يا هانم.
        ar: هذا الـ sinjang تذكار لكِ يا سيدتي.
        en: This sinjang is a keepsake for you, ma'am.
      - text: Kula pakewuh, Bu. Sampun repot-repot.
        ar_eg: أنا محرج يا هانم. ما كانش له لزوم التعب.
        ar: أنا محرج يا سيدتي، ما كان عليكِ أن تتكلّفي.
        en: I feel bad, ma'am. You shouldn't have.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: gudeg
        ar_eg: جوديج (أكلة يوجيا)
        ar: غوديغ (أكلة يوغيا)
        en: gudeg (Yogya jackfruit dish)
      - text: bakpia
        ar_eg: باكبيا (فطيرة بالفول)
        ar: باكبيا (فطيرة بالفول)
        en: bakpia (mung bean pastry)
      - text: jarik
        ar_eg: جاريك (قماش باتيك للوسط)
        ar: جاريك (قماش باتيك للخصر)
        en: jarik (batik wrap)
      - text: sinjang
        ar_eg: جاريك (كراما)
        ar: جاريك (كراما)
        en: batik wrap (krama)
    words: [gudeg, bakpia, jarik, sinjang]
  - id: e02
    type: match_pairs
    pairs:
      - text: selop
        ar_eg: شبشب مقفول
        ar: خفّ مغلق
        en: closed-toe slippers
      - text: kenang-kenangan
        ar_eg: تذكار
        ar: تذكار
        en: keepsake
      - text: titip
        ar_eg: يوصّي حد يجيب حاجة
        ar: يوصي أحدًا بإحضار شيء
        en: ask someone to bring
      - text: pakewuh
        ar_eg: محرج (من الأدب)
        ar: محرج (أدبًا)
        en: feel awkward (out of courtesy)
    words: [selop, kenang-kenangan, titip, pakewuh]
  - id: e03
    type: listen
    text: Aku titip bakpia, ya, Mas!
    question:
      ar_eg: صاحبه بيطلب إيه؟
      ar: ماذا يطلب صديقه؟
      en: What is his friend asking for?
    options: [عايزه يجيبله باكبيا, عايز ياكل جوديج, عايز يشتري شبشب]
    answer: 0
    meaning:
      ar_eg: هاتلي باكبيا معاك يا ماس!
      ar: أحضر لي باكبيا يا ماس!
      en: Bring me some bakpia, Mas!
    words: [titip, bakpia]
  - id: e04
    type: fill_blank
    sentence: Kula nedha ___ ing Malioboro.
    meaning:
      ar_eg: أنا كلت ___ في ماليوبورو.
      ar: أكلتُ ___ في ماليوبورو.
      en: I ate ___ in Malioboro.
    options: [gudeg, selop, sinjang]
    answers: [gudeg]
    words: [gudeg, selop, sinjang]
    explain:
      ar_eg: gudeg أكلة يوجيا المشهورة. selop شبشب، وsinjang قماشة باتيك، ومش بيتاكلوا.
      ar: gudeg أشهر أكلات يوغيا، أما selop فخفّ، وsinjang قماش باتيك، ولا يؤكلان.
      en: gudeg is Jogja's famous dish. selop are slippers and sinjang a batik cloth, neither is eaten.
  - id: e05
    type: multiple_choice
    question: Bu Harsono ngagem ___ batik.
    question_meaning:
      ar_eg: بو هارسونو لابسة ___ باتيك.
      ar: ترتدي بو هارسونو ___ من الباتيك.
      en: Bu Harsono is wearing a batik ___.
    options: [selop, sinjang, bakpia]
    answer: 1
    explain:
      ar_eg: sinjang = jarik بالكراما، قماش بيتلف على الوسط.
      ar: sinjang = jarik بالكراما، قماش يُلفّ على الخصر.
      en: sinjang = jarik in krama, a cloth wrapped round the waist.
    words: [sinjang, selop, bakpia, jarik]
  - id: e06
    type: fill_blank
    sentence: Aku tuku ___ kanggo kenang-kenangan.
    meaning:
      ar_eg: اشتريت ___ تذكار.
      ar: اشتريتُ ___ تذكارًا.
      en: I bought a ___ as a keepsake.
    options: [jarik, pakewuh, titip]
    answers: [jarik]
    words: [jarik, pakewuh, titip, kenang-kenangan]
    explain:
      ar_eg: jarik قماشة باتيك تنفع تذكار. pakewuh يعني محرج، وtitip يعني يوصّي حد.
      ar: jarik قماش باتيك يصلح تذكارًا، أما pakewuh فمعناه محرَج، وtitip يوصي أحدًا.
      en: jarik is a batik cloth, a good keepsake. pakewuh means "embarrassed", titip "ask someone to bring".
  - id: e07
    type: build_sentence
    source:
      ar_eg: ده تذكار لحضرتك يا هانم.
      ar: هذا تذكار لكِ يا سيدتي.
      en: This is a keepsake for you, ma'am.
    answer: Menika kenang-kenangan kagem Ibu.
    distractors: [titip, selop]
    words: [kenang-kenangan]
    explain:
      ar_eg: kenang-kenangan = تذكار. titip يعني يوصّي، وselop شبشب.
      ar: kenang-kenangan = تذكار، أما titip فمعناه يوصي، وselop خفّ.
      en: kenang-kenangan = keepsake. titip means "ask someone to bring", selop is slippers.
  - id: e08
    type: translate
    direction: from_target
    source_text: Kula pakewuh, Bu. Panjenengan sampun repot-repot.
    answers_meaning:
      ar_eg: [أنا محرج يا هانم. حضرتك تعبتي نفسك, محرج منك يا هانم، ما كانش له لزوم التعب ده]
      ar: [أنا محرج يا سيدتي، لقد تكلّفتِ, أشعر بالحرج يا سيدتي، ما كان عليكِ أن تتعبي نفسك]
      en: ['I feel bad, ma''am. You went to so much trouble', 'I''m embarrassed, ma''am, you really shouldn''t have']
    words: [pakewuh]
  - id: e09
    type: speaking
    text: Selop menika kagem Bapak.
    meaning:
      ar_eg: الشبشب ده للأستاذ.
      ar: هذا الخفّ للوالد.
      en: These slippers are for Father.
    words: [selop]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تقول بالنغوكو «يا ماس، هاتلي جوديج معاك!»
      ar: تريد أن تقول بالنغوكو «يا ماس، أحضر لي غوديغ!»
      en: In ngoko, you want to say 'Mas, bring me some gudeg!'
    options: ['Mas, aku pakewuh gudeg!', 'Mas, aku titip gudeg, ya!', 'Mas, aku kenang-kenangan gudeg!']
    answer: 1
    explain:
      ar_eg: titip = توصّي حد يجيبلك حاجة.
      ar: titip = توصي أحدًا بإحضار شيء لك.
      en: titip = ask someone to bring you something.
    words: [titip, gudeg, pakewuh]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, arep tuku apa neng Malioboro?
      ar_eg: يا محمد، هتشتري إيه من ماليوبورو؟
      ar: يا محمد، ماذا ستشتري من ماليوبورو؟
      en: Mohamed, what are you going to buy in Malioboro?
    - speaker: Mohamed
      text: Jarik kanggo ibuku ing Kairo, Mas. Lan bakpia.
      ar_eg: جاريك لماما في القاهرة يا ماس. وباكبيا.
      ar: جاريك لأمّي في القاهرة يا ماس، وباكبيا.
      en: A jarik for my mum in Cairo, Mas. And bakpia.
    - speaker: Mas Dimas
      text: Aku titip gudeg, ya! Simbah seneng gudeg og.
      ar_eg: هاتلي جوديج معاك! تيتة بتحب الجوديج.
      ar: أحضر لي غوديغ! الجدّة تحبّه.
      en: Bring me some gudeg! Grandma loves it.
    - speaker: Mohamed
      text: Iya. Aku uga tuku selop kanggo Pak Harsono.
      ar_eg: ماشي. وهشتري كمان شبشب لباك هارسونو.
      ar: حسنًا. وسأشتري خفًّا لباك هارسونو أيضًا.
      en: Sure. I'm also buying slippers for Pak Harsono.
    - speaker: Bu Harsono
      text: Lho, Mas, sinjang menika kagem kula? Kula pakewuh!
      ar_eg: إيه ده يا ماس، السنجانج ده ليّا؟ أنا محرجة!
      ar: ماذا؟ يا ماس، هذا الـ sinjang لي؟ أنا محرجة!
      en: Oh, Mas, this sinjang is for me? I feel bad!
    - speaker: Mohamed
      text: Inggih, Bu. Kenang-kenangan saking kula.
      ar_eg: أيوه يا هانم. تذكار مني.
      ar: نعم يا سيدتي، تذكار مني.
      en: Yes, ma'am. A keepsake from me.
