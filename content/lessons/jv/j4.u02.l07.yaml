schema: kabar.lesson/v1
id: j4.u02.l07
language: jv
title: Foto kulawarga
can_do:
  ar_eg: تفهم كبير بيتكلم عن عيلته بالكلام العادي، وتسأله بالتبجيل.
  ar: أن تفهم كبيرًا يتحدث عن أسرته بالألفاظ العادية، وتسأله بألفاظ التبجيل.
  en: Follow an elder talking about his own family in plain words, and ask him back honorifically.
slides:
  - title: Semah kula, garwanipun
    body:
      ar_eg: |
        Pak Slamet بيورّي محمد صورة العيلة على موبايله. هو بيتكلم عن عيلته هو، فبيستعمل الكلام العادي: semah kula، anak kula، sakit.
        محمد لما يسأل عن نفس الناس بيكرّمهم: garwanipun، putranipun، gerah. نفس الست، كلمتين مختلفتين حسب مين بيتكلم.
      ar: |
        يُري Pak Slamet محمدًا صورة عائلته على هاتفه. وهو يتحدث عن أسرته، فيستعمل الألفاظ العادية: semah kula، anak kula، sakit.
        أما محمد فحين يسأل عن الأشخاص أنفسهم يكرّمهم: garwanipun، putranipun، gerah. المرأة نفسها، بكلمتين مختلفتين بحسب المتكلم.
      en: |
        Pak Slamet shows Mohamed a family photo on his phone. He's talking about his own family, so he uses the plain words: semah kula, anak kula, sakit.
        When Mohamed asks about the same people, he raises them: garwanipun, putranipun, gerah. Same woman, two different words, depending on who is speaking.
    grammar: jv.krama-inggil.nouns
    examples:
      - text: Menika semah kula, lan menika anak kula tiga.
        ar_eg: دي مراتي، ودول عيالي التلاتة.
        ar: هذه زوجتي، وهؤلاء أبنائي الثلاثة.
        en: This is my wife, and these are my three children.
      - text: Anak kula setunggal wonten Jakarta, kalih wonten Yogya.
        ar_eg: واحد من عيالي في جاكرتا، واتنين في يوجيا.
        ar: أحد أبنائي في جاكرتا، واثنان في يوغيا.
        en: One of my children is in Jakarta, two are in Yogya.
      - text: Semah kula sampun mboten sakit.
        ar_eg: مراتي خلاص مابقتش عيّانة.
        ar: لم تعد زوجتي مريضة.
        en: My wife isn't ill any more.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: كام واحد من عيال Pak Slamet في جاكرتا؟
      ar: كم من أبناء Pak Slamet في جاكرتا؟
      en: How many of Pak Slamet's children are in Jakarta?
    options: [setunggal, kalih, tiga]
    answer: 0
    explain:
      ar_eg: «Anak kula setunggal wonten Jakarta» = واحد في جاكرتا.
      ar: «Anak kula setunggal wonten Jakarta» = واحد في جاكرتا.
      en: '"Anak kula setunggal wonten Jakarta" = one is in Jakarta.'
    words: [anak]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مرات Pak Slamet عاملة إيه دلوقتي؟
      ar: كيف حال زوجة Pak Slamet الآن؟
      en: How is Pak Slamet's wife now?
    options: [taksih gerah, sampun mboten sakit, saweg sare]
    answer: 1
    explain:
      ar_eg: «Semah kula sampun mboten sakit» = خفّت خلاص.
      ar: «Semah kula sampun mboten sakit» = لقد شُفيت.
      en: '"Semah kula sampun mboten sakit" = she is better now.'
    words: [semah, sakit]
  - id: e03
    type: listen
    text: Anak kula setunggal wonten Jakarta, kalih wonten Yogya.
    question:
      ar_eg: العيال التانيين فين؟
      ar: أين الابنان الآخران؟
      en: Where are the other two children?
    options: [wonten Jakarta, wonten Yogya, wonten Kairo]
    answer: 1
    meaning:
      ar_eg: واحد من عيالي في جاكرتا، واتنين في يوجيا.
      ar: أحد أبنائي في جاكرتا، واثنان في يوغيا.
      en: One of my children is in Jakarta, two are in Yogya.
    words: [anak]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: محمد عايز يسأل Pak Slamet عن نفس الست. يقول إيه؟
      ar: يريد محمد أن يسأل Pak Slamet عن المرأة نفسها. ماذا يقول؟
      en: Mohamed wants to ask Pak Slamet about the same woman. What does he say?
    options: ['Semahipun sampun mboten sakit, Pak?', 'Garwanipun sampun mboten gerah, Pak?', 'Garwa kula sampun mboten gerah, Pak?']
    answer: 1
    explain:
      ar_eg: مرات الكبير garwa، ومرضها gerah. semah وsakit هو بيقولهم عن نفسه بس.
      ar: زوجة الكبير garwa ومرضها gerah، أما semah وsakit فيقولهما هو عن أسرته.
      en: An elder's wife is garwa and her illness is gerah. semah and sakit are what he says about his own family.
    words: [garwa, gerah]
  - id: e05
    type: match_pairs
    pairs:
      - text: semah
        ar_eg: زوج / زوجة (بتاعك إنت)
        ar: زوج / زوجة (لك أنت)
        en: spouse (your own)
      - text: garwa
        ar_eg: زوج / زوجة (بتاع الكبير)
        ar: زوج / زوجة (للكبير)
        en: spouse (an elder's)
      - text: anak
        ar_eg: عيّل / ابن (بتاعك إنت)
        ar: ابن (لك أنت)
        en: child (your own)
      - text: putra
        ar_eg: عيّل / ابن (بتاع الكبير)
        ar: ابن (للكبير)
        en: child (an elder's)
      - text: gerah
        ar_eg: عيّان (للكبير)
        ar: مريض (للكبير)
        en: ill (an elder)
    words: [semah, garwa, anak, putra, gerah]
  - id: e06
    type: fill_blank
    sentence: Kula gadhah ___ tiga, Mas.
    meaning:
      ar_eg: (Pak Slamet) عندي تلات عيال يا ابني.
      ar: (Pak Slamet) لي ثلاثة أبناء يا بني.
      en: (Pak Slamet) I have three children.
    options: [putra, anak]
    answers: [anak]
    explain:
      ar_eg: Pak Slamet بيتكلم عن عياله هو، يبقى anak. putra لعيال حد تاني كبير.
      ar: يتحدث Pak Slamet عن أبنائه فيقول anak، أما putra فلأبناء كبير آخر.
      en: Pak Slamet is talking about his own children, so anak. putra is for another elder's children.
    words: [anak, putra]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Pak Slamet) عيالك فين يا أستاذ؟
      ar: (إلى Pak Slamet) أين أبناؤك يا سيدي؟
      en: (to Pak Slamet) Where are your children, sir?
    answers:
      - Putranipun wonten pundi, Pak?
      - Pak, putranipun wonten pundi?
      - Putranipun Bapak wonten pundi?
    explain:
      ar_eg: عيال الكبير putra + -nipun.
      ar: أبناء الكبير putra + -nipun.
      en: An elder's children are putra + -nipun.
    words: [putra]
  - id: e08
    type: speaking
    text: Garwanipun sampun mboten gerah, Pak?
    meaning:
      ar_eg: المدام خفّت يا أستاذ؟
      ar: هل شُفيت زوجتك يا سيدي؟
      en: Is your wife better now, sir?
    words: [garwa, gerah]
dialogue:
  title: Foto ing HP
  lines:
    - speaker: Mohamed
      text: Pak, menika garwanipun?
      ar_eg: يا أستاذ، دي المدام؟
      ar: يا سيدي، أهذه زوجتك؟
      en: Sir, is this your wife?
    - speaker: Pak Slamet
      text: Inggih, Mas. Menika semah kula.
      ar_eg: أيوه يا ابني. دي مراتي.
      ar: نعم يا بني. هذه زوجتي.
      en: Yes. This is my wife.
    - speaker: Mohamed
      text: Putranipun wonten pundi, Pak?
      ar_eg: وعيالك فين يا أستاذ؟
      ar: وأين أبناؤك يا سيدي؟
      en: Where are your children, sir?
    - speaker: Pak Slamet
      text: Setunggal wonten Jakarta, kalih wonten Yogya.
      ar_eg: واحد في جاكرتا، واتنين في يوجيا.
      ar: واحد في جاكرتا، واثنان في يوغيا.
      en: One is in Jakarta, two are in Yogya.
    - speaker: Mohamed
      text: Wah, sae sanget, Pak.
      ar_eg: الله، حلو أوي يا أستاذ.
      ar: جميل جدًا يا سيدي.
      en: Oh, how nice, sir.
review:
