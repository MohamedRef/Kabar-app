        ar_eg: العصر (كراما)
        ar: العصر (كراما)
        en: afternoon (krama)
      - text: benjing
        ar_eg: بكرة (كراما)
        ar: غدًا (كراما)
        en: tomorrow (krama)
      - text: dinten
        ar_eg: يوم (كراما)
        ar: يوم (كراما)
        en: day (krama)
    words: [kepungkur, sonten, benjing, dinten]
  - id: e02
    type: match_pairs
    pairs:
      - text: weruh
        ar_eg: يشوف، يعرف (ngoko)
        ar: يرى، يعرف (ngoko)
        en: see, know (ngoko)
      - text: sumerep
        ar_eg: يشوف، يعرف (كراما)
        ar: يرى، يعرف (كراما)
        en: see, know (krama)
      - text: nengga
        ar_eg: يستنى (كراما)
        ar: ينتظر (كراما)
        en: wait for (krama)
      - text: mbekta
        ar_eg: يجيب معاه (كراما)
        ar: يُحضر (كراما)
        en: bring (krama)
    words: [weruh, sumerep, nengga, mbekta]
  - id: e03
    type: listen
    text: Benjing enjing kula nengga panjenengan.
    question:
      ar_eg: هيستناه إمتى؟
      ar: متى سينتظره؟
      en: When will he wait for him?
    options: [بكرة الصبح, النهارده بالليل, امبارح العصر]
    answer: 0
    meaning:
      ar_eg: بكرة الصبح هستنى حضرتك.
      ar: سأنتظرك غدًا صباحًا.
      en: I'll wait for you tomorrow morning.
    words: [benjing, nengga]
  - id: e04
    type: fill_blank
    sentence: Kula ___ panjenengan ing peken, Pak.
    meaning:
      ar_eg: أنا ___ حضرتك في السوق.
      ar: أنا ___ك في السوق يا سيدي.
      en: I'll ___ you at the market, sir.
    options: [nengga, sumerep, sonten]
    answers: [nengga]
    words: [nengga, sumerep, sonten]
  - id: e05
    type: multiple_choice
    question: Aku weruh omahe. → Kula ___ griyanipun.
    options: [mbekta, sumerep, dinten]
    answer: 1
    explain:
      ar_eg: weruh ← sumerep = يشوف، يعرف.
      ar: weruh ← sumerep = يرى، يعرف.
      en: weruh → sumerep = see, know.
    words: [weruh, sumerep, mbekta, dinten]
  - id: e06
    type: fill_blank
    sentence: Jam papat sore = jam sekawan ___.
    meaning:
      ar_eg: الساعة أربعة العصر = الساعة أربعة ___.
      ar: الساعة الرابعة عصرًا = الساعة الرابعة ___.
      en: Four in the afternoon = four o'clock ___.
    options: [sonten, kepungkur, dinten]
    answers: [sonten]
    words: [sonten, kepungkur, dinten]
  - id: e07
    type: build_sentence
    source:
      ar_eg: هجيب الكتاب بكرة.
      ar: سأحضر الكتاب غدًا.
      en: I'll bring the book tomorrow.
    answer: Benjing kula mbekta buku.
    distractors: [nengga, weruh]
    words: [benjing, mbekta]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kula mboten sumerep griyanipun Pak Harjo.
    answers_meaning:
      ar_eg: [أنا مش عارف بيت الأستاذ هارجو, مش عارف بيت عم هارجو فين]
      ar: [لا أعرف بيت السيد هارجو, لا أعرف أين بيت الأستاذ هارجو]
      en: ['I don''t know Pak Harjo''s house', 'I don''t know where Pak Harjo''s house is']
    words: [sumerep]
  - id: e09
    type: speaking
    text: Aku weruh Mas Dimas ing pasar.
    meaning:
      ar_eg: شفت ديماس في السوق.
      ar: رأيت ديماس في السوق.
      en: I saw Dimas at the market.
    words: [weruh]
  - id: e10
    type: multiple_choice
    question: Sore (ngoko) → ___ (krama)
    options: [kepungkur, benjing, sonten]
    answer: 2
    explain:
      ar_eg: sore ← sonten = العصر (زي sugeng sonten).
      ar: sore ← sonten = العصر (كما في sugeng sonten).
      en: sore → sonten = afternoon (as in sugeng sonten).
    words: [sonten, kepungkur, benjing]
dialogue:
  lines:
    - speaker: Pak Harjo
      text: "Mohamed, benjing enjing mampir griya kula, nggih?"
      ar_eg: "يا محمد، بكرة الصبح عدّي عليّا في البيت، ماشي؟"
      ar: "يا محمد، مرّ ببيتي غدًا صباحًا، حسنًا؟"
      en: "Mohamed, drop by my house tomorrow morning, OK?"
    - speaker: Mohamed
      text: Inggih, Pak. Nanging kula dereng sumerep griyanipun.
      ar_eg: أيوه يا أستاذ. بس أنا لسه مش عارف البيت.
      ar: نعم يا أستاذ. لكنني لا أعرف البيت بعد.
      en: Yes, sir. But I don't know the house yet.
    - speaker: Pak Harjo
      text: "Kula nengga ten peken, jam pitu enjing."
      ar_eg: "هستناك في السوق الساعة سبعة الصبح."
      ar: "سأنتظرك في السوق الساعة السابعة صباحًا."
      en: "I'll wait at the market, seven in the morning."
    - speaker: Mohamed
      text: Sae, Pak. Kula mbekta menapa?
      ar_eg: تمام يا أستاذ. أجيب معايا إيه؟
      ar: حسنًا يا أستاذ. ماذا أُحضر؟
      en: Great, sir. What should I bring?
    - speaker: Pak Harjo
      text: "Mbekta buku mawon. Sonten sinau malih."
      ar_eg: "هات الكتاب بس. العصر نذاكر تاني."
      ar: "أحضر الكتاب فقط. بعد الظهر ندرس مجددًا."
      en: "Just bring the book. We'll study again in the afternoon."
    - speaker: Mohamed
      text: Inggih. Dinten menika kula sinau ing griya.
      ar_eg: حاضر. النهارده هذاكر في البيت.
      ar: حسنًا. اليوم سأدرس في البيت.
      en: OK. Today I'll study at home.
new_words:
  - word: kepungkur
    pos: adverb
    ar_eg: اللي فات (seminggu kepungkur = من أسبوع)
    ar: مضى (seminggu kepungkur = قبل أسبوع)
    en: ago, past (seminggu kepungkur = a week ago) = yang lalu
  - word: sonten
    pos: noun
    ar_eg: العصر، أول الليل (sore ← sonten)، كراما
    ar: العصر، المساء (sore ← sonten)، كراما
    en: afternoon, early evening (ngoko sore), krama
  - word: benjing
    pos: adverb
    ar_eg: بكرة (sesuk ← benjing)، كراما
    ar: غدًا (sesuk ← benjing)، كراما
    en: tomorrow (ngoko sesuk, Indonesian besok), krama
  - word: dinten
    pos: noun
    ar_eg: يوم (dina ← dinten)، كراما
    ar: يوم (dina ← dinten)، كراما
    en: day (ngoko dina, Indonesian hari), krama
  - word: weruh
    pos: verb
    ar_eg: يشوف، يعرف (ngoko)
    ar: يرى، يعرف (ngoko)
    en: see, know (= melihat, tahu), ngoko
  - word: sumerep
    pos: verb
    ar_eg: يشوف، يعرف (weruh ← sumerep)، كراما
    ar: يرى، يعرف (weruh ← sumerep)، كراما
    en: see, know (ngoko weruh, Indonesian tahu), krama
  - word: nengga
    pos: verb
    ar_eg: يستنى (ngenteni ← nengga)، كراما
    ar: ينتظر (ngenteni ← nengga)، كراما
    en: wait for (ngoko ngenteni, Indonesian menunggu), krama
  - word: mbekta
    pos: verb
    ar_eg: يجيب، يشيل معاه (nggawa ← mbekta)، كراما
    ar: يُحضر، يحمل (nggawa ← mbekta)، كراما
    en: bring, carry (ngoko nggawa, Indonesian membawa), krama
