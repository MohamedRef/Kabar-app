schema: kabar.lesson/v1
id: j3.u03.l05
language: jv
title: Benjing enjing
can_do:
  ar_eg: 'تتفق على ميعاد بالكراما: بكرة الصبح، العصر، النهارده، وتقول هستنى وهجيب ومش عارف.'
  ar: 'أن تتفق على موعد بالكراما: غدًا صباحًا، العصر، اليوم، وتقول سأنتظر وسأحضر ولا أعرف.'
  en: 'Arrange a meeting in krama: tomorrow morning, this afternoon, today, and say wait, bring and know.'
slides:
  - title: Sonten, benjing, kepungkur
    body:
      ar_eg: |
        أوقات اليوم بالكراما (زي التحيات sugeng enjing وsugeng sonten):
        - esuk ← enjing = الصبح، sore ← sonten = العصر / المغرب
        - sesuk ← benjing = بكرة، dina ← dinten = يوم: dinten menika = النهارده
        - kepungkur = اللي فات: seminggu kepungkur = من أسبوع
        أفعال كراما مهمة:
        - weruh ← sumerep = يشوف، يعرف
        - ngenteni ← nengga = يستنى
        - nggawa ← mbekta = يجيب، يشيل معاه
      ar: |
        أوقات اليوم بالكراما (مثل التحيات sugeng enjing وsugeng sonten):
        - esuk ← enjing = الصباح، sore ← sonten = العصر / المساء
        - sesuk ← benjing = غدًا، dina ← dinten = يوم: dinten menika = اليوم
        - kepungkur = مضى: seminggu kepungkur = قبل أسبوع
        أفعال كراما مهمة:
        - weruh ← sumerep = يرى، يعرف
        - ngenteni ← nengga = ينتظر
        - nggawa ← mbekta = يُحضر، يحمل معه
      en: |
        Times of day in krama (as in the greetings sugeng enjing, sugeng sonten):
        - esuk → enjing = morning, sore → sonten = afternoon
        - sesuk → benjing = tomorrow, dina → dinten = day: dinten menika = today
        - kepungkur = ago: seminggu kepungkur = a week ago
        Useful krama verbs:
        - weruh → sumerep = see, know
        - ngenteni → nengga = wait for
        - nggawa → mbekta = bring, carry
    examples:
      - text: Benjing enjing kula nengga panjenengan wonten stasiun.
        ar_eg: بكرة الصبح هستنى حضرتك في المحطة.
        ar: سأنتظرك غدًا صباحًا في المحطة.
        en: Tomorrow morning I'll wait for you at the station.
      - text: Kula mboten sumerep griyanipun.
        ar_eg: أنا مش عارف بيته.
        ar: لا أعرف بيته.
        en: I don't know where his house is.
      - text: Dinten menika kula mbekta oleh-oleh.
        ar_eg: النهارده جايب هدايا.
        ar: اليوم أحضرت هدايا.
        en: Today I've brought souvenirs.
