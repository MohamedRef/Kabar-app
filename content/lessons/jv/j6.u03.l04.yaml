      ar_eg: فيه شاهد قبر قديم تحت السقيفة.
      ar: تحت السقيفة شاهد قبر قديم.
      en: There's an old gravestone under the shelter.
    answer: Ana nisan lawas ing cungkup.
    distractors: [sesaji, menyan]
    words: [nisan, cungkup]
  - id: e09
    type: translate
    direction: from_target
    source_text: Sesaji iki kanggo slametan desa.
    answers_meaning:
      ar_eg: [القرابين دي عشان وليمة القرية, دي قرابين لوليمة دعاء القرية]
      ar: [هذه القرابين لوليمة القرية, هذه القرابين لوليمة الدعاء في القرية]
      en: [These offerings are for the village slametan, These offerings are for the village ritual meal]
    words: [sesaji, slametan]
  - id: e10
    type: speaking
    text: Simbah tirakat ing petilasan.
    meaning:
      ar_eg: الجد بيعمل رياضة روحية في المكان التاريخي.
      ar: يمارس الجدّ رياضة النفس في الموضع التاريخي.
      en: Grandfather keeps a vigil at the historic site.
    words: [tirakat, petilasan]
dialogue:
  lines:
    - speaker: Pak Harjo
      text: Mas, menika cungkup makam raja-raja Mataram.
      ar_eg: دي سقيفة قبور ملوك ماتارام.
      ar: هذه سقيفة قبور ملوك ماتارام.
      en: This is the shelter over the graves of the Mataram kings.
    - speaker: Mohamed
      text: Nisanipun lawas sanget. Ganda menapa menika, Pak?
      ar_eg: الشواهد قديمة أوي. إيه الريحة دي يا عم؟
      ar: الشواهد قديمة جدًا. ما هذه الرائحة يا سيدي؟
      en: The gravestones are very old. What's that smell, sir?
    - speaker: Pak Harjo
      text: Ganda menyan. Wonten tiyang ingkang nyekar.
      ar_eg: ريحة بخور. فيه ناس جايين يزوروا القبور.
      ar: رائحة بخور. هناك من جاء لزيارة القبور.
      en: Incense. Someone has come to visit the graves.
    - speaker: Mohamed
      text: Menapa tiyang ugi tirakat wonten ngriki?
      ar_eg: والناس بتعمل رياضة روحية هنا كمان؟
      ar: وهل يمارس الناس رياضة النفس هنا أيضًا؟
      en: Do people also keep vigils here?
    - speaker: Pak Harjo
      text: Wonten. Kathah ingkang dhateng petilasan kangge ngurmati leluhur.
      ar_eg: أيوه. ناس كتير بتيجي الأماكن التاريخية عشان يكرّموا الأجداد.
      ar: نعم. يأتي كثيرون إلى المواضع التاريخية تكريمًا للأسلاف.
      en: Yes. Many come to historic sites to honour their ancestors.
    - speaker: Mohamed
      text: Kula ngertos. Kangge kula, cekap dedonga mawon.
      ar_eg: فهمت. بالنسبالي، كفاية أدعي.
      ar: فهمت. أما أنا فيكفيني الدعاء.
      en: I understand. For me, a prayer is enough.
