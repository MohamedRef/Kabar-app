      ar_eg: المكان اللي قعد أو اتعبّد فيه شخص مشهور زمان اسمه …
      ar: الموضع الذي أقام فيه شخص مشهور قديمًا يسمّى …
      en: A place where a famous figure once stayed is a …
    options: [sesaji, petilasan, menyan]
    answer: 1
    explain:
      ar_eg: petilasan = مكان ليه أثر لشخص مشهور.
      ar: petilasan = موضع فيه أثر لشخص مشهور.
      en: petilasan = a site linked to a famous figure.
    words: [sesaji, petilasan, menyan]
  - id: e06
