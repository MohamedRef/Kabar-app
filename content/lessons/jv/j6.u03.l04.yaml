      en: What's in front of the grave?
    options: [ريحة بخور قدام شاهد القبر, ورد على القبر, ناس بتاكل]
    answer: 0
    meaning:
      ar_eg: قدام شاهد القبر فيه ريحة بخور.
      ar: أمام شاهد القبر رائحة بخور.
      en: There's a smell of incense in front of the gravestone.
    words: [nisan, menyan]
  - id: e04
