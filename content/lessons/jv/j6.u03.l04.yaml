schema: kabar.lesson/v1
id: j6.u03.l04
language: jv
title: Nyekar ing cungkup
can_do:
  ar_eg: 'تفهم اللي حارس المقابر بيشرحه عن عادات زيارة القبور: الشاهد والبخور والقرابين والوليمة.'
  ar: 'أن تفهم شرح حارس المدافن لعادات زيارة القبور: الشاهد والبخور والقرابين والوليمة.'
  en: 'Follow a tomb keeper explaining grave-visit customs: gravestones, incense, offerings and ritual meals.'
slides:
  - title: Adat lawas
    body:
      ar_eg: |
        cungkup = سقف أو مبنى صغير فوق القبر، nisan = شاهد القبر، petilasan = مكان قعد فيه شخص مشهور زمان.
        عادات جاوية قديمة: menyan = بخور، sesaji = قرابين، slametan = وليمة دعاء بيتجمع فيها الجيران، tirakat = حرمان النفس (صيام أو سهر) عشان هدف.
        luhur = نبيل وعالي: budi luhur = أخلاق عالية.
      ar: |
        cungkup = سقيفة أو بناء صغير فوق القبر، nisan = شاهد القبر، petilasan = موضع أقام فيه شخص مشهور قديمًا.
        عادات جاوية قديمة: menyan = بخور، sesaji = قرابين، slametan = وليمة دعاء يجتمع فيها الجيران، tirakat = رياضة النفس (صوم أو سهر) لغاية.
        luhur = نبيل رفيع: budi luhur = خلق رفيع.
      en: |
        cungkup = roofed shelter over a grave, nisan = gravestone, petilasan = a place where a famous figure once stayed.
        Old Javanese customs: menyan = incense, sesaji = offerings, slametan = communal prayer meal, tirakat = self-denial (fasting, keeping vigil) for a goal.
        luhur = noble, lofty: budi luhur = noble character.
    examples:
      - text: Makam Panembahan Senapati ana ing sangisore cungkup.
        ar_eg: قبر بانمباهان سيناباتي تحت سقيفة.
        ar: يقع قبر بانمباهان سيناباتي تحت سقيفة.
        en: Panembahan Senapati's grave is under a roofed shelter.
      - text: Ing petilasan iki ana watu lawas.
        ar_eg: في المكان التاريخي ده فيه حجر قديم.
        ar: في هذا الموضع التاريخي حجر قديم.
        en: There's an old stone at this historic spot.
      - text: Sadurunge mbangun omah, wong Jawa nganakake slametan.
        ar_eg: قبل ما يبنوا بيت، الجاوايين بيعملوا وليمة دعاء.
        ar: قبل بناء البيت يقيم الجاويون وليمة دعاء.
        en: Before building a house, Javanese people hold a slametan.
