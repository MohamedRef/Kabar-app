schema: kabar.lesson/v1
id: j4.u06.l04
language: jv
title: Ing ngajeng kelir
can_do:
  ar_eg: 'تقعد قدام عرض وايانج كوليت: تعرف الستارة والقنديل والجونونجان، ومين بيعزف إيه.'
  ar: 'أن تجلس أمام عرض وايانغ كوليت: تعرف الستارة والقنديل والغونونغان، ومن يعزف على ماذا.'
  en: 'Sit in front of a wayang kulit show: name the screen, the lamp and the gunungan, and who plays what.'
slides:
  - title: Kelir, blencong, gunungan
    body:
      ar_eg: |
        - الوايانج كوليت بيتعرض قدّام kelir = الستارة البيضا، والنور من blencong = القنديل اللي فوق راس الدالانج.
        - gunungan = عروسة على شكل جبل أو شجرة. الدالانج بيحطها في نص الستارة في أول العرض وآخره وبين المشاهد.
        - nabuh = يعزف بالضرب على آلات الغاميلان. bonang = صف أواني نحاس صغيرة، gender = آلة بمفاتيح نحاس رفيعة.
        - slendro = سلّم موسيقي خماسي من سلّمين الغاميلان.
        - trenyuh = اتأثّر قلبه ورقّ (لما يشوف أو يسمع حاجة حزينة).
      ar: |
        - يُعرض الوايانغ كوليت أمام kelir = الستارة البيضاء، ويأتي الضوء من blencong = القنديل فوق رأس الدالانغ.
        - gunungan = دمية على شكل جبل أو شجرة، يضعها الدالانغ وسط الستارة في بداية العرض ونهايته وبين المشاهد.
        - nabuh = يعزف بالطرق على آلات الغاميلان. bonang = صفّ من الأواني النحاسية الصغيرة، gender = آلة بمفاتيح نحاسية رقيقة.
        - slendro = سلّم موسيقي خماسي، أحد سلّمَي الغاميلان.
        - trenyuh = رقّ قلبه وتأثّر (حين يرى أو يسمع شيئًا حزينًا).
      en: |
        - Wayang kulit is played in front of the kelir = white screen, lit by the blencong = oil lamp above the dhalang's head.
        - gunungan = a mountain- or tree-shaped puppet. The dhalang plants it in the middle of the screen at the start, the end and between scenes.
        - nabuh = play (strike) gamelan instruments. bonang = a row of small bronze kettles, gender = instrument with thin bronze keys.
        - slendro = five-note scale, one of gamelan's two tunings.
        - trenyuh = moved, touched (by something sad).
    examples:
      - text: Gunungan wonten tengah kelir.
        ar_eg: الجونونجان في نص الستارة.
        ar: الغونونغان في وسط الستارة.
        en: The gunungan is in the middle of the screen.
      - text: Mas Dimas nabuh bonang.
        ar_eg: ماس ديماس بيعزف على البونانج.
        ar: يعزف ماس ديماس على البونانغ.
        en: Mas Dimas is playing the bonang.
      - text: Kula trenyuh mireng gendhing menika.
        ar_eg: اتأثّرت وأنا بسمع المقطوعة دي.
        ar: تأثّرتُ وأنا أسمع هذه المقطوعة.
        en: I was moved hearing this piece.
exercises:
