dialogue:
  lines:
    - speaker: Mohamed
      text: Mas, lampu ing kelir iku apa?
      ar_eg: يا ماس، اللمبة اللي على الستارة دي إيه؟
      ar: يا ماس، ما ذلك المصباح على الستارة؟
      en: Mas, what's that lamp by the screen?
    - speaker: Mas Dimas
      text: Iku blencong. Saiki akeh sing nganggo lampu listrik.
      ar_eg: ده البلينشونج. دلوقتي ناس كتير بتستعمل لمبة كهربا.
      ar: ذلك البلينتشونغ، والآن يستعمل كثيرون مصباحًا كهربائيًّا.
      en: That's the blencong. Nowadays many use an electric lamp.
    - speaker: Mohamed
      text: Lan gunungan iku kanggo apa?
      ar_eg: والجونونجان ده بيتعمل بيه إيه؟
      ar: وما فائدة الغونونغان؟
      en: And what's the gunungan for?
    - speaker: Mas Dimas
      text: Gunungan tandha crita diwiwiti utawa rampung.
      ar_eg: الجونونجان علامة إن الحكاية بدأت أو خلصت.
      ar: الغونونغان علامة على بدء الحكاية أو انتهائها.
      en: The gunungan marks where the story starts or ends.
    - speaker: Mohamed
      text: Swarane gamelan apik tenan. Aku trenyuh.
      ar_eg: صوت الغاميلان حلو أوي. أنا اتأثّرت.
      ar: صوت الغاميلان جميل حقًّا، لقد تأثّرت.
      en: The gamelan sounds beautiful. I'm moved.
    - speaker: Mas Dimas
      text: Iku gendhing slendro. Aku sing nabuh gender!
      ar_eg: دي مقطوعة سليندرو. وأنا اللي بعزف الجندير!
      ar: إنها مقطوعة سليندرو، وأنا من يعزف الجندير!
      en: It's a slendro piece. I'm the one playing the gender!
