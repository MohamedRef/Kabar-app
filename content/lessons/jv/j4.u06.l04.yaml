      - text: gunungan
        ar_eg: جونونجان (عروسة الجبل)
        ar: غونونغان (دمية الجبل)
        en: gunungan (mountain puppet)
      - text: nabuh
        ar_eg: يعزف بالضرب
        ar: يعزف بالطرق
        en: play (strike) an instrument
