schema: kabar.lesson/v1
id: j1.u01.l09
language: jv
title: Ngenteni ing dalan
can_do:
  ar_eg: تقول إنك استنيت كتير في الشارع، وإن المكان قريب، وتطلب واحد أو اتنين.
  ar: أن تقول إنك انتظرت طويلًا في الشارع، وإن المكان قريب، وتطلب واحدًا أو اثنين.
  en: Say you waited a long time on the street and the place is close, and order one or two.
slides:
  - title: Malioboro bengi
    body:
      ar_eg: |
        كلمات هتسمعها في الراديو والمسلسل من أول وحدة:
        - **ngenteni** = يستنى (menunggu) · **suwe** = مدة طويلة (lama): Aku ngenteni suwe = استنيت كتير.
        - **ing** = في (di)، أرسمي شوية من neng · **dalan** = شارع / طريق (jalan)
        - **cedhak** = قريب (dekat) · **luwih** = أكتر (lebih): luwih apik = أحسن
        - **siji** = واحد · **loro** = اتنين: kopi siji, teh loro.
      ar: |
        كلمات ستسمعها في الراديو والمسلسل من الوحدة الأولى:
        - **ngenteni** = ينتظر (menunggu) · **suwe** = مدة طويلة (lama): Aku ngenteni suwe = انتظرت طويلًا.
        - **ing** = في (di)، أرسمى قليلًا من neng · **dalan** = شارع / طريق (jalan)
        - **cedhak** = قريب (dekat) · **luwih** = أكثر (lebih): luwih apik = أفضل
        - **siji** = واحد · **loro** = اثنان: kopi siji، teh loro.
      en: |
        Words you'll hear on the radio and in the Sinetron from the first unit:
        - **ngenteni** = wait (menunggu) · **suwe** = a long time (lama): Aku ngenteni suwe = I waited ages.
        - **ing** = in, at (di), a bit more formal than neng · **dalan** = street, road (jalan)
        - **cedhak** = near (dekat) · **luwih** = more (lebih): luwih apik = better
        - **siji** = one · **loro** = two: kopi siji, teh loro.
    examples:
      - text: Aku ngenteni suwe, Mas!
        ar_eg: استنيت كتير يا ماس!
        ar: انتظرت طويلًا يا أخي!
        en: I waited ages, Mas!
      - text: Aku ngenteni kowe ing dalan Malioboro.
        ar_eg: أنا مستنيك في شارع ماليوبورو.
        ar: أنا أنتظرك في شارع ماليوبورو.
        en: I'm waiting for you on Malioboro street.
      - text: Kopi siji lan kopi joss loro, Mas.
        ar_eg: قهوة واحدة واتنين كوبي جوس يا ماس.
        ar: قهوة واحدة واثنتان kopi joss يا أخي.
        en: One coffee and two kopi joss, Mas.
