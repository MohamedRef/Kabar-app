dialogue:
  lines:
    - speaker: Mas Heru
      text: Mohamed! Sori, kowe ngenteni suwe?
      ar_eg: يا محمد! معلش، استنيت كتير؟
      ar: يا محمد! عذرًا، هل انتظرت طويلًا؟
      en: Mohamed! Sorry, have you been waiting long?
    - speaker: Mohamed
      text: Lumayan suwe, Mas. Aku ngenteni ing dalan Malioboro.
      ar_eg: شوية كتير يا ماس. كنت مستني في شارع ماليوبورو.
      ar: مدة لا بأس بها يا أخي. كنت أنتظر في شارع ماليوبورو.
      en: A fair while, Mas. I was waiting on Malioboro street.
    - speaker: Mas Heru
      text: Sori! Angkringane cedhak, ayo!
      ar_eg: معلش! الأنجكرينجان قريبة، يلا!
      ar: عذرًا! الأنجكرينجان قريبة، هيا!
      en: Sorry! The angkringan's close, let's go!
    - speaker: Mohamed
      text: Ayo! Kopi joss loro, nggih?
      ar_eg: يلا! اتنين كوبي جوس، ماشي؟
      ar: هيا! اثنتان kopi joss، حسنًا؟
      en: Let's go! Two kopi joss, OK?
    - speaker: Mas Heru
      text: Nggih, loro. Kopi joss iki luwih apik!
      ar_eg: ماشي، اتنين. الكوبي جوس دي أحسن!
      ar: حسنًا، اثنتان. هذه الـ kopi joss أفضل!
      en: Sure, two. This kopi joss is better!
