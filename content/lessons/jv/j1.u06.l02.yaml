schema: kabar.lesson/v1
id: j1.u06.l02
language: jv
title: Iki, kuwi, kaé
can_do:
  ar_eg: تشاور على حاجة قريبة أو بعيدة.
  ar: أن تشير إلى القريب والبعيد.
  en: Point near and far.
slides:
  - title: Iki, kuwi, kaé
    body:
      ar_eg: |
        الإندونيسي عنده ini وitu بس. الجاوي عنده تلاتة، زي kene / kono / kana بالظبط:
        - **iki** = ini = ده (جنبي): Iki apa? = ده إيه؟
        - **kuwi** = itu = داك (جنبك إنت، أو اللي لسه اتكلمنا عنه).
        - **kaé** = داك اللي هناك (بعيد عننا الاتنين).
        والنحو العربي برضه فيه تلات درجات: «ذا» للقريب، «ذاك» للمتوسط، «ذلك» للبعيد. iki ≈ ذا، kuwi ≈ ذاك، kaé ≈ ذلك.
      ar: |
        للإندونيسية ini وitu فقط، وللجاوية ثلاث درجات تطابق kene / kono / kana:
        - **iki** = ini = هذا (عند المتكلم): Iki apa? = ما هذا؟
        - **kuwi** = itu = ذاك (عند المخاطب، أو المذكور آنفًا).
        - **kaé** = ذلك البعيد عنهما.
        وفي العربية ثلاث مراتب كذلك: ذا وذاك وذلك، فـ iki ≈ ذا، وkuwi ≈ ذاك، وkaé ≈ ذلك.
      en: |
        Indonesian has only ini and itu. Javanese has three, matching kene / kono / kana:
        - **iki** = ini = this (by me): Iki apa? = What's this?
        - **kuwi** = itu = that (by you, or just mentioned).
        - **kaé** = that one over there (far from both of us).
        Classical Arabic also has three ranks: ذا (near), ذاك (middle), ذلك (far) ≈ iki, kuwi, kaé.
    grammar: jv.demonstrative
    examples:
      - text: Iki apa?
        ar_eg: ده إيه؟
        ar: ما هذا؟
        en: What's this?
      - text: Wong kaé sapa?
        ar_eg: مين الراجل اللي هناك ده؟
        ar: من ذلك الشخص هناك؟
        en: Who's that person over there?
  - title: kuwi utawa iku?
    body:
      ar_eg: |
        «itu» ليها شكلين:
        - **kuwi** في سولو ويوجيا (ماتارامان) — وده اللي هنستعمله من J2.
        - **iku** في سورابايا، وكمان في الكتابة.
        نفس المعنى. فلما Cak Heru يقول «Klambi iku apik, rek» يبقى «القميص ده حلو يا صاحبي».
      ar: |
        للفظ «itu» صورتان:
        - **kuwi** في سولو ويوجيا (ماتارامان)، وهي ما نستعمله من J2.
        - **iku** في سورابايا وفي الكتابة.
        والمعنى واحد: «Klambi iku apik, rek» = ذلك القميص جميل يا صاح.
      en: |
        "itu" has two shapes:
        - **kuwi** in Solo and Yogya (Mataraman) — what we'll use from J2.
        - **iku** in Surabaya, and in writing.
        Same meaning. So when Cak Heru says "Klambi iku apik, rek", it's "That shirt is nice, mate."
    grammar: jv.demonstrative
    examples:
      - text: Klambi iku apik, rek.
        ar_eg: القميص ده حلو يا صاحبي. (سورابايا)
        ar: ذلك القميص جميل يا صاح. (سورابايا)
        en: That shirt is nice, mate. (Surabaya)
      - text: Klambi kuwi apik.
        ar_eg: القميص ده حلو. (سولو / يوجيا)
        ar: ذلك القميص جميل. (سولو / يوجيا)
        en: That shirt is nice. (Solo / Yogya)
  - title: omah iki ≠ iki omah
    body:
      ar_eg: |
        زي الإندونيسي rumah ini: اسم الإشارة بييجي **بعد** الاسم.
        - omah iki = البيت ده (rumah ini).
        - Iki omah. = ده بيت. (جملة كاملة: Ini rumah.)
        يعني الترتيب بيغيّر المعنى، فخلي بالك.
      ar: |
        كما في rumah ini، يأتي اسم الإشارة **بعد** الاسم:
        - omah iki = هذا البيت (rumah ini).
        - Iki omah. = هذا بيت (جملة تامة: Ini rumah).
        فالترتيب يغيّر المعنى.
      en: |
        As in Indonesian rumah ini, the pointer comes **after** the noun:
        - omah iki = this house (rumah ini).
        - Iki omah. = This is a house. (A full sentence: Ini rumah.)
        Order changes the meaning.
    grammar: jv.demonstrative
    examples:
      - text: Omah iki gedhe.
        ar_eg: البيت ده كبير.
        ar: هذا البيت كبير.
        en: This house is big.
      - text: Iki omah.
        ar_eg: ده بيت.
        ar: هذا بيت.
        en: This is a house.
  - title: Sing endi? — Sing kaé.
    body:
      ar_eg: |
        **sing** = yang. فـ:
        - sing iki = اللي ده (yang ini)، sing kuwi = اللي عندك، sing kaé = اللي هناك.
        - **Sing endi?** = أنهي؟ (Yang mana?)
        في المحل: «Sing endi, Mas?» — «Sing kaé!» = أنهي يا أستاذ؟ — اللي هناك!
      ar: |
        **sing** = yang، فيقال:
        - sing iki = هذا (yang ini)، وsing kuwi = ذاك الذي عندك، وsing kaé = ذلك البعيد.
        - **Sing endi?** = أيّها؟ (Yang mana?)
        في المتجر: «Sing endi, Mas?» — «Sing kaé!» = أيّها يا أخي؟ — ذلك الذي هناك!
      en: |
        **sing** = yang, so:
        - sing iki = this one (yang ini), sing kuwi = that one (by you), sing kaé = the one over there.
        - **Sing endi?** = Which one? (Yang mana?)
        In a shop: "Sing endi, Mas?" — "Sing kaé!" = Which one? — That one over there!
    grammar: jv.demonstrative
    examples:
      - text: Sing endi? — Sing kuwi.
        ar_eg: أنهي؟ — اللي عندك ده.
        ar: أيّها؟ — ذاك الذي عندك.
        en: Which one? — That one (by you).
      - text: Aku sing iki ae.
        ar_eg: أنا هاخد ده بس. (Arek)
        ar: سآخذ هذا فقط. (Arek)
        en: I'll just take this one. (Arek)
  - title: Ngene, ngono
    body:
      ar_eg: |
        ومن نفس العيلة:
        - **ngene** = begini = كده (زي ده اللي عندي).
        - **ngono** = begitu = كده (زي اللي إنت قلته / عملته).
        Ngene wae = كده وخلاص. Ora ngono! = مش كده!
      ar: |
        ومن العائلة نفسها:
        - **ngene** = begini = هكذا (مثل هذا).
        - **ngono** = begitu = كذلك (مثل ما قلتَ / فعلت).
        Ngene wae = هكذا فقط، Ora ngono! = ليس كذلك!
      en: |
        Same family:
        - **ngene** = begini = like this.
        - **ngono** = begitu = like that (the way you said / did).
        Ngene wae = Just like this. Ora ngono! = Not like that!
    grammar: jv.demonstrative
    examples:
      - text: Ngene wae.
        ar_eg: كده وخلاص.
        ar: هكذا فقط.
        en: Just like this.
      - text: Ora ngono, Mas.
        ar_eg: مش كده يا أستاذ.
        ar: ليس كذلك يا أخي.
        en: Not like that, Mas.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: iki
        ar_eg: ده (قريب مني) = ini
        ar: هذا (قريب) = ini
        en: this (near me) = ini
      - text: kuwi
        ar_eg: داك (قريب منك) = itu
        ar: ذاك (قرب المخاطب) = itu
        en: that (near you) = itu
      - text: kaé
        ar_eg: داك اللي هناك (بعيد)
        ar: ذلك (بعيد)
        en: that over there (far)
      - text: ngene
        ar_eg: كده (= begini)
        ar: هكذا (= begini)
        en: like this (= begini)
      - text: sing endi
        ar_eg: أنهي؟ (= yang mana)
        ar: أيّ؟ (= yang mana)
        en: which one (= yang mana)
    words: [iki, kuwi, kaé, ngene, sing endi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «البيت ده»؟
      ar: كيف تقول «هذا البيت»؟
      en: How do you say "this house"?
    options: ["omah iki", "iki omah", "omah kaé"]
    answer: 0
    explain:
      ar_eg: "اسم الإشارة بعد الاسم: omah iki. أما «Iki omah» فمعناها «ده بيت»."
      ar: "يأتي اسم الإشارة بعد الاسم: omah iki، أما «Iki omah» فمعناها «هذا بيت»."
      en: "The pointer follows the noun: omah iki. \"Iki omah\" means \"This is a house\"."
    words: [iki, omah]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: فيه راجل بعيد في آخر الشارع. تسأل صاحبك «مين ده؟» إزاي؟
      ar: رجل بعيد في آخر الشارع. كيف تسأل صديقك «من ذلك؟»
      en: A man is far away at the end of the street. How do you ask your friend who he is?
    options: ["Wong kaé sapa?", "Wong iki sapa?", "Wong kene sapa?"]
    answer: 0
    explain:
      ar_eg: بعيد عنكم الاتنين ⇐ kaé.
      ar: البعيد عنكما ⇐ kaé.
      en: Far from both of you ⇒ kaé.
    words: [kaé, wong]
  - id: e04
    type: multiple_choice
    question: Klambi iku apik, rek.
    question_meaning:
      ar_eg: iku هنا هي نفس أنهي كلمة في وسط جاوة؟
      ar: iku هنا تقابل أيّ لفظ في وسط جاوة؟
      en: In Central Java, iku here would be…
    options: ["kuwi", "iki", "kaé"]
    answer: 0
    explain:
      ar_eg: iku (سورابايا والكتابة) = kuwi (سولو ويوجيا) = itu.
      ar: iku (سورابايا والكتابة) = kuwi (سولو ويوجيا) = itu.
      en: iku (Surabaya, writing) = kuwi (Solo, Yogya) = itu.
    words: [iku, kuwi]
  - id: e05
    type: listen
    text: Sing endi? Sing kaé?
    options: ["Sing endi? Sing kaé?", "Sing endi? Sing iki?", "Sing endi? Sing kuwi?"]
    answer: 0
    words: [sing endi, kaé]
  - id: e06
    type: fill_blank
    sentence: Wong ___ sapa?
    meaning:
      ar_eg: مين الراجل اللي هناك ده؟ (بعيد)
      ar: من ذلك الشخص هناك؟ (بعيد)
      en: Who's that person over there? (far)
    options: ["iki", "kaé", "kene"]
    answers: ["kaé"]
    explain:
