      ar: kene ظرف مكان لا اسم إشارة، وللبعيد kaé.
      en: kene is a place word (here), not a pointer; for far away use kaé.
    words: [kaé]
  - id: e07
    type: fill_blank
    sentence: ___ wae.
    meaning:
      ar_eg: كده وخلاص.
      ar: هكذا فقط.
      en: Just like this.
    options: ["Ngene", "Iki", "Kene"]
    answers: ["Ngene"]
    words: [ngene, wae]
  - id: e08
    type: build_sentence
