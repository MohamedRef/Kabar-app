    answers_meaning:
      ar_eg: ["البيت ده كبير", "البيت ده كبير.", "البيت دا كبير"]
      ar: ["هذا البيت كبير", "هذا البيت كبير."]
      en: ["This house is big", "This house is big.", "This house is large"]
    words: [omah, iki, gedhe]
  - id: e12
    type: dictation
    text: Klambi iki apik.
    meaning:
      ar_eg: القميص ده حلو.
      ar: هذا القميص جميل.
      en: This shirt is nice.
    words: [klambi, iki, apik]
  - id: e13
    type: speaking
    text: Sing endi? Sing kaé!
    meaning:
      ar_eg: أنهي؟ اللي هناك!
      ar: أيّها؟ ذلك الذي هناك!
      en: Which one? That one over there!
    words: [sing endi, kaé]
dialogue:
  title: Nang kebun binatang
  lines:
    - speaker: Mohamed
      text: Cak, kaé apa?
      ar_eg: يا معلم، إيه اللي هناك ده؟
      ar: يا أخي، ما ذلك هناك؟
      en: Cak, what's that over there?
    - speaker: Cak Heru
      text: Sing endi?
      ar_eg: أنهي؟
      ar: أيّها؟
      en: Which one?
    - speaker: Mohamed
      text: Sing kaé, nang kana.
      ar_eg: اللي هناك، هناك بعيد.
      ar: ذلك، هناك بعيدًا.
      en: That one, way over there.
    - speaker: Cak Heru
      text: Oh, iku komodo, rek!
      ar_eg: آه، ده كومودو يا صاحبي!
      ar: آه، ذلك كومودو يا صاح!
      en: Oh, that's a komodo, mate!
    - speaker: Mohamed
      text: Wah, gedhe banget!
      ar_eg: يا خبر، كبير أوي!
      ar: يا للعجب، إنه ضخم جدًّا!
      en: Wow, it's huge!
