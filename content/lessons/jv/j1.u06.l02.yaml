schema: kabar.lesson/v1
id: j1.u06.l02
language: jv
title: Ngarep, mburi, ngiwa
can_do:
  ar_eg: تقول الحاجة فين وتوصف طريق بسيط.
  ar: أن تقول أين الأشياء وتصف طريقًا بسيطًا.
  en: Say where things are and give simple directions.
slides:
  - title: ngarep, mburi, jejere
    body:
      ar_eg: |
        عشان توصف مكان حاجة، حط nang + الكلمة + المكان:
        - **ngarep** = depan = قدام: nang ngarep stasiun = قدام المحطة.
        - **mburi** = belakang = ورا: nang mburi pasar = ورا السوق.
        - **jejere** = sebelah = جنب: nang jejere masjid = جنب الجامع.
      ar: |
        لوصف موضع شيء: nang + اللفظ + المكان:
        - **ngarep** = depan = أمام: nang ngarep stasiun = أمام المحطة.
        - **mburi** = belakang = خلف: nang mburi pasar = خلف السوق.
        - **jejere** = sebelah = بجانب: nang jejere masjid = بجانب المسجد.
      en: |
        To say where something is: nang + word + place:
        - **ngarep** = depan = in front: nang ngarep stasiun = in front of the station.
        - **mburi** = belakang = behind: nang mburi pasar = behind the market.
        - **jejere** = sebelah = next to: nang jejere masjid = next to the mosque.
    grammar: jv.preposition.place
    examples:
      - text: Warunge nang ngarep stasiun.
        ar_eg: المحل قدام المحطة.
        ar: الكشك أمام المحطة.
        en: The stall is in front of the station.
      - text: Omahku nang mburi masjid.
        ar_eg: بيتي ورا الجامع.
        ar: بيتي خلف المسجد.
        en: My house is behind the mosque.
  - title: ngiwa, nengen, lurus
    body:
      ar_eg: |
        وللاتجاهات:
        - **ngiwa** = belok kiri = خش شمال (من kiwa = شمال).
        - **nengen** = belok kanan = خش يمين (من tengen = يمين).
        - **lurus** = lurus = على طول. Lurus wae = على طول بس.
        - **terus** = lalu = وبعدين: Lurus wae, terus ngiwa = على طول، وبعدين شمال.
      ar: |
        وللاتجاهات:
        - **ngiwa** = belok kiri = انعطف يسارًا (من kiwa = يسار).
        - **nengen** = belok kanan = انعطف يمينًا (من tengen = يمين).
        - **lurus** = lurus = إلى الأمام مباشرة، وLurus wae = امشِ مباشرة.
        - **terus** = lalu = ثم: Lurus wae, terus ngiwa = امشِ مباشرة ثم يسارًا.
      en: |
        Directions:
        - **ngiwa** = belok kiri = turn left (from kiwa = left).
        - **nengen** = belok kanan = turn right (from tengen = right).
        - **lurus** = lurus = straight on. Lurus wae = just go straight.
        - **terus** = lalu = then: Lurus wae, terus ngiwa = Go straight, then left.
    grammar: jv.preposition.place
    examples:
      - text: Lurus wae, terus ngiwa.
        ar_eg: على طول، وبعدين شمال.
        ar: امشِ مباشرة ثم انعطف يسارًا.
        en: Go straight, then turn left.
      - text: Nengen, Mas.
        ar_eg: يمين يا أستاذ.
        ar: انعطف يمينًا يا أخي.
        en: Turn right, Mas.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ngarep
        ar_eg: قدام (= depan)
        ar: أمام (= depan)
        en: in front (= depan)
      - text: mburi
        ar_eg: ورا (= belakang)
        ar: خلف (= belakang)
        en: behind (= belakang)
      - text: jejere
        ar_eg: جنب (= sebelah)
        ar: بجانب (= sebelah)
        en: next to (= sebelah)
      - text: ngiwa
        ar_eg: يخش شمال
        ar: ينعطف يسارًا
        en: turn left
      - text: nengen
        ar_eg: يخش يمين
        ar: ينعطف يمينًا
        en: turn right
      - text: kebun binatang
        ar_eg: جنينة الحيوانات
        ar: حديقة الحيوان
        en: zoo
    words: [ngarep, mburi, jejere, ngiwa, nengen, kebun binatang]
  - id: e02
    type: multiple_choice
    question: ng prabowo?
    question_meaning:
      ar_eg: ng في الشات ده اختصار لإيه؟
      ar: ما أصل ng في هذه الدردشة؟
      en: What does ng stand for in this chat?
    options: [ngendi, nang, ngarep]
    answer: 1
    explain:
      ar_eg: ng = nang / neng (لـ / في). «ng prabowo?» = لبرابوو؟
      ar: ng = nang / neng، فـ«ng prabowo?» = إلى برابوو؟
      en: ng = nang / neng. "ng prabowo?" = To Prabowo?
    words: [nang]
  - id: e03
    type: listen
    text: Warunge nang jejere masjid.
    options: [Warunge nang ngarep masjid., Warunge nang mburi masjid., Warunge nang jejere masjid.]
    answer: 2
    words: [jejere, nang]
  - id: e04
    type: build_sentence
    source:
      ar_eg: على طول، وبعدين شمال.
      ar: امشِ مباشرة ثم انعطف يسارًا.
      en: Go straight, then turn left.
    answer: Lurus wae, terus ngiwa.
    distractors: [nengen, saka]
    words: [lurus, terus, ngiwa]
  - id: e05
    type: listen
    text: Kebun binatange nang mburi masjid.
    options: [Kebun binatange nang mburi masjid., Kebun binatange nang jejere masjid., Kebun binatange nang ngarep masjid.]
    answer: 0
    meaning:
      ar_eg: جنينة الحيوانات ورا الجامع.
      ar: حديقة الحيوان خلف المسجد.
      en: The zoo is behind the mosque.
    words: [kebun binatang, mburi, jejere, ngarep, nang]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: خش يمين، وبعدين على طول.
      ar: انعطف يمينًا ثم امشِ مباشرة.
      en: Turn right, then go straight.
    answers: ['Nengen, terus lurus.', 'Nengen, terus lurus', Nengen terus lurus., Nengen terus lurus, 'Nengen, terus lurus wae.', 'Nengen, terus lurus wae', Nengen terus lurus wae., Nengen terus lurus wae]
    words: [nengen, terus, lurus]
  - id: e07
    type: multiple_choice
    question: Lurus wae, terus ngiwa.
    question_meaning:
      ar_eg: معناها إيه بالإندونيسي؟
      ar: ما معناها بالإندونيسية؟
      en: What does it mean in Indonesian?
    options: ['Lurus, lalu belok kiri.', 'Lurus, lalu belok kanan.', 'Belok kiri, lalu lurus.']
    answer: 0
    explain:
      ar_eg: terus = lalu (وبعدين)، ngiwa = belok kiri (شمال). nengen = يمين.
      ar: terus = lalu، وngiwa = belok kiri، وnengen = يمين.
      en: terus = lalu (then), ngiwa = belok kiri; nengen = right.
    words: [lurus, terus, ngiwa]
  - id: e08
    type: fill_blank
    sentence: Kebun binatang? Saka kene ___, terus lurus.
    meaning:
      ar_eg: جنينة الحيوانات؟ من هنا خش يمين، وبعدين على طول.
      ar: حديقة الحيوان؟ من هنا انعطف يمينًا، ثم سر مستقيمًا.
      en: The zoo? From here turn right, then go straight.
    options: [nengen, mburi, jejere]
    answers: [nengen]
    words: [kebun binatang, nengen, terus, lurus]
dialogue:
  title: Nang stasiun Wonokromo
  lines:
    - speaker: Mohamed
      text: Cak, kowe arep nang ngendi?
      ar_eg: يا معلم، إنت رايح فين؟
      ar: يا أخي، إلى أين أنت ذاهب؟
      en: Cak, where are you going?
    - speaker: Cak Heru
      text: Aku kate nang pasar. Koen?
      ar_eg: أنا رايح السوق. وإنت؟
      ar: أنا ذاهب إلى السوق. وأنت؟
      en: I'm going to the market. You?
    - speaker: Mohamed
      text: Aku arep nang kebun binatang. Nang ngendi?
      ar_eg: أنا رايح جنينة الحيوانات. هي فين؟
      ar: سأذهب إلى حديقة الحيوان. أين هي؟
      en: I'm going to the zoo. Where is it?
    - speaker: Cak Heru
      text: Saka kene lurus wae, terus nengen.
      ar_eg: من هنا على طول، وبعدين يمين.
      ar: من هنا امشِ مباشرة ثم انعطف يمينًا.
      en: From here go straight, then turn right.
    - speaker: Mohamed
      text: Matur nuwun, Cak!
      ar_eg: شكرًا يا معلم!
      ar: شكرًا يا أخي!
      en: Thanks, Cak!
