    words: [klambi, iku, apik]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ده إيه؟
      ar: ما هذا؟
      en: What's this?
    answers: ["Iki apa?", "Iki apa", "Apa iki?", "Apa iki", "Iki opo?", "Iki opo", "Opo iki?", "Opo iki"]
    words: [iki, apa]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا هاخد ده بس. (بالنغوكو العادي)
      ar: سآخذ هذا فقط. (بالنغوكو القياسي)
      en: I'll just take this one. (standard ngoko)
    answers: ["Aku sing iki wae.", "Aku sing iki wae", "Sing iki wae.", "Sing iki wae", "Aku sing iki ae.", "Aku sing iki ae", "Sing iki ae.", "Sing iki ae"]
    explain:
      ar_eg: sing iki = اللي ده، وwae (وفي سورابايا ae) = بس.
      ar: sing iki = هذا، وwae (وفي سورابايا ae) = فقط.
      en: sing iki = this one; wae (Surabaya ae) = just.
