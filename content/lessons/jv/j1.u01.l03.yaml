schema: kabar.lesson/v1
id: j1.u01.l03
language: jv
title: Aku lan kowe
can_do:
  ar_eg: تقول «أنا» و«إنت» بالـ ngoko.
  ar: أن تقول «أنا» و«أنت» في مستوى النغوكو.
  en: Say I and you in ngoko.
slides:
  - title: Aku = aku
    body:
      ar_eg: |
        النغوكو (ngoko) هو الجاوي «العادي»: بتكلم بيه صحابك واللي في سنك أو أصغر.
        - aku = أنا. نفس الكلمة الإندونيسية! بس هنا هي «أنا» الطبيعية.
        - saya إندونيسي، ماتحطهاش في جملة جاوي: «Aku Mohamed» مش «Saya Mohamed».
        وعنوان الدرس: lan = dan (و). Aku lan kowe = أنا وإنت.
      ar: |
        النغوكو (ngoko) هو المستوى العادي من الجاوية، يُستعمل مع الأصدقاء والأقران ومن هو أصغر.
        - aku = أنا، وهي الكلمة الإندونيسية نفسها، لكنها هنا «أنا» الطبيعية.
        - أما saya فإندونيسية لا تدخل الجملة الجاوية: «Aku Mohamed» لا «Saya Mohamed».
        وفي العنوان: lan = dan (و)، فـ Aku lan kowe = أنا وأنت.
      en: |
        Ngoko is plain, everyday Javanese: for friends, people your age and younger people.
        - aku = I. The same word as Indonesian aku — and here it's the normal "I".
        - saya is Indonesian; don't put it in a Javanese sentence: "Aku Mohamed", not "Saya Mohamed".
        And the title: lan = dan (and). Aku lan kowe = you and me.
    grammar: jv.pronoun.ngoko
    examples:
      - text: Aku Mohamed.
        ar_eg: أنا محمد.
        ar: أنا محمد.
        en: I'm Mohamed.
  - title: Kowe = kamu
    body:
      ar_eg: |
        kowe = إنت / إنتِ، بالظبط زي kamu. ومفيش مذكر ومؤنث، زي الإندونيسي.
        القاموس بيحط علامة على الـ e، بس إحنا بنكتبها kowe زي الناس في الشات. ولو كتبتها بالعلامة هتتحسب صح برضه.
        بس kowe للصحاب بس، زي «إنت» من غير «حضرتك». لحد أكبر منك أو مش عارفه: قول sampeyan (المؤدبة اليومية) أو Pak / Bu.
      ar: |
        kowe = أنتَ / أنتِ، تمامًا مثل kamu، بلا تذكير ولا تأنيث كالإندونيسية.
        تضع المعاجم علامة على الـ e، ونكتبها kowe كما يكتبها الناس، وتُقبل بالعلامة أيضًا.
        لكن kowe للأقران فقط، كـ«أنت» بلا «حضرتك»؛ أما الأكبر سنًّا والغريب فيقال له sampeyan (الصيغة المهذبة اليومية) أو Pak / Bu.
      en: |
        kowe = you, exactly like kamu — and no gender, as in Indonesian.
        Dictionaries put an accent on the e; Kabar writes kowe, like everyday chat. Typing it with the accent still counts.
        But kowe is for friends only, like «إنت» without «حضرتك». To someone older or a stranger say sampeyan (the everyday polite "you") or Pak / Bu.
    grammar: jv.pronoun.ngoko
    examples:
      - text: Aku apik. Kowe piye?
        ar_eg: أنا كويس. وإنت؟
        ar: أنا بخير. وأنت؟
        en: I'm fine. How about you?
  - title: Mangan, nedha, dhahar
    body:
      ar_eg: |
        في العربي بنغيّر الضمير بس: «إنت أكلت؟» ← «حضرتك أكلت؟». الجاوي بيغيّر الجملة كلها! بص على «إنت أكلت؟» في تلات مستويات:
        - ngoko (لصاحبك، ≈ إنت): Kowe wis mangan?
        - krama (لحد بتحترمه، ≈ حضرتك): Sampeyan sampun nedha?
        - krama inggil (لحد كبير أوي زي جدك أو مدرسك، ≈ سيادتك): Panjenengan sampun dhahar?
        مش مطلوب تحفظ الـ krama دلوقتي — هنتعلمها في J3. دلوقتي اعرف بس إن kowe مكانها مع الصحاب.
      ar: |
        في العربية نغير الضمير وحده: «أكلتَ؟» ← «هل أكلتْ حضرتك؟». أما الجاوية فتغير الجملة كلها، فانظر إلى «هل أكلت؟» في ثلاثة مستويات:
        - ngoko (للصديق، ≈ أنت): Kowe wis mangan?
        - krama (لمن تحترمه، ≈ حضرتك): Sampeyan sampun nedha?
        - krama inggil (للمُعظَّم كالجد أو المعلم، ≈ سيادتك): Panjenengan sampun dhahar?
        ولا يلزمك حفظ الكراما الآن، فموضعها J3؛ يكفي أن تعرف أن kowe للأصدقاء.
      en: |
        Arabic only swaps the pronoun: «إنت أكلت؟» → «حضرتك أكلت؟». Javanese swaps the whole sentence! Here's "Have you eaten?" at three levels:
        - ngoko (to a friend, ≈ إنت): Kowe wis mangan?
        - krama (to someone you respect, ≈ حضرتك): Sampeyan sampun nedha?
        - krama inggil (to a revered elder or teacher, ≈ سيادتك): Panjenengan sampun dhahar?
        No need to learn krama now — that's J3. For now, just know kowe belongs with friends.
    grammar: jv.pronoun.ngoko
    examples:
      - text: Kowe wis mangan?
        ar_eg: إنت أكلت؟ (ngoko)
        ar: هل أكلت؟ (ngoko)
        en: Have you eaten? (ngoko)
      - text: Sampeyan sampun nedha?
        ar_eg: حضرتك أكلت؟ (krama)
        ar: هل أكلتَ؟ (krama، مهذبة)
        en: Have you eaten? (krama)
      - text: Panjenengan sampun dhahar?
        ar_eg: سيادتك اتغديت؟ (krama inggil)
        ar: هل تناولتم الطعام؟ (krama inggil)
        en: Have you dined? (krama inggil)
  - title: Kowe kabeh, dheweke, awake dhewe · Kancaku, kancamu
    body:
      ar_eg: |
        - «Kowe piye?» = وإنت؟ وفي الكلام السريع بتسمعها «Kowe piye, cah?».
        - dheweke = هو / هي (= dia). في الشات deweke.
        - awake dhewe = إحنا (أقرب لـ kita).
        - kowe kabeh = إنتوا (kalian)، وdheweke kabeh = هم (mereka). kabeh = semua.
        kowe وkowe kabeh للصحاب بس، ومع الكبير sampeyan.
        «بتاعي» و«بتاعك» زي الإندونيسي بالظبط: -ku و-mu في آخر الكلمة.
        kanca = teman (صاحب). kancaku = صاحبي، kancamu = صاحبك.
        ومفيش «يكون»: Dheweke kancaku = هو صاحبي (Dia temanku).
      ar: |
        - «Kowe piye?» = وأنت؟ وفي الكلام السريع «Kowe piye, cah?».
        - dheweke = هو / هي (= dia)، وفي الدردشة deweke.
        - awake dhewe = نحن (أقرب إلى kita).
        - kowe kabeh = أنتم (kalian)، وdheweke kabeh = هم (mereka)، وkabeh = semua.
        وkowe وkowe kabeh للأقران فقط، ومع الكبير sampeyan.
        الملكية كالإندونيسية تمامًا: -ku و-mu في آخر الكلمة.
        kanca = teman (صديق)، فـ kancaku = صديقي، وkancamu = صديقك.
        ولا فعل كون: Dheweke kancaku = هو صديقي (Dia temanku).
      en: |
        - "Kowe piye?" = And you? In fast speech: "Kowe piye, cah?".
        - dheweke = he / she (= dia). Chat: deweke.
        - awake dhewe = we (closest to kita).
        - kowe kabeh = you all (kalian), dheweke kabeh = they (mereka). kabeh = semua.
        kowe and kowe kabeh are for friends only; with elders use sampeyan.
        "my" and "your" work exactly as in Indonesian: -ku and -mu on the end.
        kanca = teman (friend). kancaku = my friend, kancamu = your friend.
        No "to be": Dheweke kancaku = He's my friend (Dia temanku).
    grammar: jv.pronoun.ngoko
    examples:
      - text: Kowe piye, cah?
        ar_eg: وإنت عامل إيه يا صاحبي؟
        ar: وكيف حالك يا صاح؟
        en: And how are you, mate?
      - text: Dheweke apik.
        ar_eg: هو / هي كويس.
        ar: هو بخير / هي بخير.
        en: He's / She's fine.
      - text: Dheweke kancaku.
        ar_eg: هو صاحبي / هي صاحبتي.
        ar: هو صديقي / هي صديقتي.
        en: He's / She's my friend.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: aku
        ar_eg: أنا
        ar: أنا
        en: I
      - text: kowe kabeh
        ar_eg: إنتوا
        ar: أنتم
        en: you all
      - text: sampeyan
        ar_eg: حضرتك
        ar: حضرتك
        en: you (polite)
      - text: dheweke
        ar_eg: هو / هي
        ar: هو / هي
        en: he / she
      - text: awake dhewe
        ar_eg: إحنا
        ar: نحن
        en: we
      - text: kanca
        ar_eg: صاحب
        ar: صديق
        en: friend
    words: [aku, kowe kabeh, sampeyan, dheweke, awake dhewe, kanca]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بتسأل راجل كبير مش عارفه في المحطة. أنهي «إنت» تستخدم؟
      ar: تسأل رجلًا كبيرًا لا تعرفه في المحطة. أيّ «أنت» تستعمل؟
      en: You're asking an older man you don't know at the station. Which "you" do you use?
    options: [kowe, kowe kabeh, sampeyan]
    answer: 2
    explain:
      ar_eg: kowe للصاحب، وkowe kabeh للشلة. مع حد كبير أو غريب قول sampeyan (أو Pak).
      ar: kowe للصديق، وkowe kabeh للجماعة، ومع الكبير أو الغريب تقال sampeyan (أو Pak).
      en: kowe is for a friend, kowe kabeh for a group of friends; with an older stranger use sampeyan (or Pak).
    words: [sampeyan, kowe, kowe kabeh]
  - id: e03
    type: listen
    text: Dheweke kancaku.
    options: [Dheweke kancamu., Dheweke kancaku., Dheweke lan aku kanca.]
    answer: 1
    words: [dheweke, kanca, lan]
  - id: e04
    type: fill_blank
    sentence: Aku apik. ___ piye?
    meaning:
      ar_eg: أنا كويس. وإنت؟ (لصاحبك)
      ar: أنا بخير. وأنت؟ (لصديقك)
      en: I'm fine. How about you? (to a friend)
    options: [Kowe, Aku, Dheweke]
    answers: [Kowe]
    words: [kowe]
    explain:
      ar_eg: بتسأل صاحبك «وإنت؟» يبقى kowe. aku = أنا، وdheweke = هو/هي.
      ar: تسأل صديقك «وأنت؟» فتقول kowe؛ أما aku فأنا، وdheweke هو أو هي.
      en: You're asking your friend "and you?", so kowe. aku = I, dheweke = he/she.
  - id: e05
    type: listen
    text: Awake dhewe kanca.
    options: [Awake dhewe kanca., Dheweke kancaku., Aku lan kowe kanca.]
    answer: 0
    meaning:
      ar_eg: إحنا صحاب.
      ar: نحن أصدقاء.
      en: We're friends.
    words: [awake dhewe, kanca, dheweke, lan]
  - id: e06
    type: speaking
    text: Aku lan kowe kanca.
    meaning:
      ar_eg: أنا وإنت صحاب.
      ar: أنا وأنت صديقان.
      en: You and I are friends.
    words: [aku, lan, kowe, kanca]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «إحنا»؟
      ar: أيّ كلمة تعني «نحن»؟
      en: Which word means "we"?
    options: [sampeyan, awake dhewe, dheweke, kowe kabeh]
    answer: 1
    words: [awake dhewe, sampeyan, dheweke, kowe kabeh]
    explain:
      ar_eg: awake dhewe = إحنا. sampeyan = حضرتك، dheweke = هو/هي، وkowe kabeh = إنتو.
      ar: awake dhewe = نحن؛ أما sampeyan فأنت (بأدب)، وdheweke هو أو هي، وkowe kabeh أنتم.
      en: awake dhewe = we. sampeyan = you (polite), dheweke = he/she, kowe kabeh = you all.
dialogue:
  title: Kanca anyar
  lines:
    - speaker: Mas Heru
      text: Mohamed, piye kabare?
      ar_eg: محمد، إزيك؟
      ar: محمد، كيف حالك؟
      en: Mohamed, how are you?
    - speaker: Mohamed
      text: Aku apik. Kowe piye?
      ar_eg: أنا كويس. وإنت؟
      ar: أنا بخير. وأنت؟
      en: I'm fine. How about you?
    - speaker: Mas Heru
      text: Apik! Mbak Rara kancaku.
      ar_eg: كويس! رارا صاحبتي.
      ar: بخير! رارا صديقتي.
      en: Good! Rara is my friend.
    - speaker: Mbak Rara
      text: Sugeng sonten, Mohamed. Piye kabare?
      ar_eg: مساء الخير يا محمد. إزيك؟
      ar: مساء الخير يا محمد. كيف حالك؟
      en: Good afternoon, Mohamed. How are you?
    - speaker: Mohamed
      text: Alhamdulillah, apik. Matur nuwun, Mbak.
      ar_eg: الحمد لله، كويس. شكرًا يا آنسة.
      ar: الحمد لله، بخير. شكرًا يا آنسة.
      en: Alhamdulillah, fine. Thank you, Mbak.
new_words:
  - word: aku
    pos: pronoun
    ar_eg: أنا (ngoko)
    ar: أنا (ngoko)
    en: I (ngoko)
    same_as_id: true
  - word: kowe
    pos: pronoun
    ar_eg: إنت / إنتِ (ngoko)
    ar: أنتَ / أنتِ (ngoko)
    en: you (ngoko)
  - word: kowe kabeh
    pos: pronoun
    ar_eg: إنتوا (= kalian)
    ar: أنتم (= kalian)
    en: you all (= kalian)
  - word: sampeyan
    pos: pronoun
    ar_eg: حضرتك (مؤدبة يومية)
    ar: حضرتك (صيغة مهذبة يومية)
    en: you (everyday polite)
  - word: dheweke
    pos: pronoun
    ar_eg: هو / هي (= dia)
    ar: هو / هي (= dia)
    en: he / she (= dia)
  - word: awake dhewe
    pos: pronoun
    ar_eg: إحنا (= kita)
    ar: نحن (= kita)
    en: we (= kita)
  - word: kanca
    pos: noun
    ar_eg: صاحب (= teman)
    ar: صديق (= teman)
    en: friend (= teman)
  - word: lan
    pos: conjunction
    ar_eg: و (= dan)
    ar: و (= dan)
    en: and (= dan)
