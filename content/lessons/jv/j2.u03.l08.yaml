schema: kabar.lesson/v1
id: j2.u03.l08
language: jv
title: Ulangan J2.3
can_do:
  ar_eg: تتعامل مع الأسعار والباقي.
  ar: أن تتعامل مع الأسعار والباقي.
  en: Handle prices and change.
slides:
  - title: Ringkesan J2.3
    body:
      ar_eg: |
        - 11–19: sewelas، rolas، telulas، patbelas، limalas، nembelas، pitulas، wolulas، sangalas.
        - 21–29 بـ -likur: selikur … patlikur، و25 = selawe، nemlikur … sangalikur.
        - 50 = seket، 60 = sewidak. والباقي: telung puluh، patang puluh، pitung puluh …
        - قبل atus / ewu / kilo شكل الوصل: rong atus، limang atus، telung ewu، telung kilo. وsatus، sewu، sejuta.
        - yuta / juta = مليون. setengah = نص. susuk = الباقي. Kabeh dadi … = الكل …
        - الفصال: Oleh kurang? · … wae, ya? · Ora oleh, wis pas. · Ya wis, oleh.
      ar: |
        - 11–19: sewelas، rolas، telulas، patbelas، limalas، nembelas، pitulas، wolulas، sangalas.
        - 21–29 بـ -likur: selikur … patlikur، و25 = selawe، ثم nemlikur … sangalikur.
        - 50 = seket، و60 = sewidak، والباقي قياسي: telung puluh، patang puluh، pitung puluh …
        - قبل atus / ewu / kilo صيغة الوصل: rong atus، limang atus، telung ewu، telung kilo، ثم satus، sewu، sejuta.
        - yuta / juta = مليون، setengah = نصف، susuk = الباقي، Kabeh dadi … = المجموع …
        - المساومة: Oleh kurang? · … wae, ya? · Ora oleh, wis pas. · Ya wis, oleh.
      en: |
        - 11–19: sewelas, rolas, telulas, patbelas, limalas, nembelas, pitulas, wolulas, sangalas.
        - 21–29 with -likur: selikur … patlikur, 25 = selawe, nemlikur … sangalikur.
        - 50 = seket, 60 = sewidak. The rest: telung puluh, patang puluh, pitung puluh …
        - Before atus / ewu / kilo use linking forms: rong atus, limang atus, telung ewu, telung kilo. And satus, sewu, sejuta.
        - yuta / juta = million. setengah = half. susuk = change. Kabeh dadi … = That comes to …
        - Haggling: Oleh kurang? · … wae, ya? · Ora oleh, wis pas. · Ya wis, oleh.
    grammar: jv.number.full
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rolas
        ar_eg: ١٢
        ar: ١٢
        en: '12'
      - text: nembelas
        ar_eg: ١٦
        ar: ١٦
        en: '16'
      - text: patlikur
        ar_eg: ٢٤
        ar: ٢٤
        en: '24'
      - text: sewidak
        ar_eg: ٦٠
        ar: ٦٠
        en: '60'
      - text: sangang puluh
        ar_eg: ٩٠
        ar: ٩٠
        en: '90'
      - text: bayar
        ar_eg: يدفع
        ar: يدفع
        en: pay
    words: [rolas, nembelas, patlikur, sewidak, sangang puluh, bayar]
  - id: e02
    type: multiple_choice
    question: 13 = ?
    question_meaning:
      ar_eg: إزاي تقول ١٣؟
      ar: كيف تقول ١٣؟
      en: How do you say 13?
    options: [telulikur, telung puluh, telulas]
    answer: 2
    words: [telulas]
  - id: e03
    type: multiple_choice
    question: 500.000 = ?
    question_meaning:
      ar_eg: إزاي تقول ٥٠٠ ألف؟
      ar: كيف تقول ٥٠٠ ألف؟
      en: How do you say 500,000?
    options: [limalas ewu, limang atus ewu, lima atus ewu]
    answer: 1
    explain:
      ar_eg: قبل atus الشكل limang. وlimalas ewu = 15.000 بس.
      ar: قبل atus تأتي limang، وlimalas ewu = 15.000.
      en: Before atus the form is limang; limalas ewu is only 15,000.
    words: [limang, atus, ewu]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الحساب ٧٥ ألف، وإنت دفعت ١٠٠ ألف. الباقي كام؟
      ar: الحساب ٧٥ ألفًا ودفعتَ ١٠٠ ألف. كم الباقي؟
      en: The bill is 75,000 and you paid 100,000. What's the change?
    options: [selawe ewu, limalas ewu, seket ewu]
    answer: 0
    words: [susuk, selawe]
  - id: e05
    type: listen
    text: Susuke selawe ewu.
    options: [Susuke selawe ewu., Susuke sewidak ewu., Susuke seket ewu.]
    answer: 0
    words: [susuk, selawe]
  - id: e06
    type: fill_blank
    sentence: Bawang putih ___ kilo limalas ewu.
    meaning:
      ar_eg: نص كيلو التوم بخمستاشر ألف.
      ar: نصف كيلو الثوم بخمسة عشر ألفًا.
      en: Half a kilo of garlic is 15,000.
    options: [rada, setengah, akeh]
    answers: [setengah]
    words: [setengah, bawang putih, limalas]
  - id: e07
    type: fill_blank
    sentence: Regane ___ ewu.
    meaning:
      ar_eg: سعره ستين ألف.
      ar: ثمنه ستون ألفًا.
      en: It costs 60,000.
    answers: [sewidak]
    explain:
      ar_eg: '60 ليها كلمة خاصة: sewidak.'
      ar: 'للستين لفظ خاص: sewidak.'
      en: '60 has its own word: sewidak.'
    words: [sewidak]
  - id: e08
    type: build_sentence
    source:
      ar_eg: البصل الأحمر الكيلو بتلاتين ألف.
      ar: الكيلو من البصل الأحمر بثلاثين ألفًا.
      en: Shallots are 30,000 a kilo.
    answer: Bawang abang sekilo telung puluh ewu.
    distractors: [telu, atus]
    words: [bawang abang, sekilo, telung puluh, ewu]
  - id: e09
    type: translate
    direction: from_target
    source_text: Lomboke wis entek.
    answers_meaning:
      ar_eg: [الشطة خلصت, الفلفل الحامي خلص]
      ar: [نفد الفلفل الحارّ, الفلفل الحارّ نفد]
      en: [The chillies are sold out, The chillies have run out]
    words: [lombok, entek]
  - id: e10
    type: translate
    direction: from_target
    source_text: Kaos putih iki regane sewidak ewu.
    answers_meaning:
      ar_eg: [التيشيرت الأبيض ده بستين ألف, التيشيرت الأبيض ده سعره ستين ألف]
      ar: [هذا القميص الأبيض ثمنه ستون ألفًا, سعر هذا القميص الأبيض ستون ألفًا]
      en: [This white T-shirt costs sixty thousand, This white T-shirt is sixty thousand]
    words: [kaos, putih, sewidak, ewu]
  - id: e11
    type: dictation
    text: Ya wis, oleh.
    meaning:
      ar_eg: خلاص، ماشي.
      ar: حسنًا، موافق.
      en: All right, deal.
    words: [ya wis, oleh]
  - id: e12
    type: speaking
    text: Selawe ewu wae, ya, Bu?
    meaning:
      ar_eg: خمسة وعشرين ألف بس، ماشي يا طنط؟
      ar: خمسة وعشرون ألفًا فقط، اتفقنا يا سيدتي؟
      en: Just 25,000, OK, ma'am?
    words: [selawe, ewu, wae]
dialogue:
  title: Mulih saka pasar
  lines:
    - speaker: Sari
      text: Mohamed, bawange sekilo pira?
      ar_eg: محمد، البصل الكيلو بكام؟
      ar: يا محمد، بكم كيلو البصل؟
      en: Mohamed, how much was a kilo of onions?
    - speaker: Mohamed
      text: Selawe ewu. Aku tuku telung kilo.
      ar_eg: خمسة وعشرين ألف. اشتريت تلاتة كيلو.
      ar: خمسة وعشرون ألفًا. اشتريتُ ثلاثة كيلو.
      en: Twenty-five thousand. I bought three kilos.
    - speaker: Sari
      text: Selawe? Lho, murah tenan!
      ar_eg: خمسة وعشرين؟ رخيص بجد!
      ar: خمسة وعشرون؟ رخيص حقًا!
      en: Twenty-five? That's really cheap!
    - speaker: Mohamed
      text: Iya! Kabeh pitung puluh lima ewu, susuke selawe ewu.
      ar_eg: أيوه! الكل خمسة وسبعين ألف، والباقي خمسة وعشرين ألف.
      ar: نعم! المجموع خمسة وسبعون ألفًا، والباقي خمسة وعشرون ألفًا.
      en: Yes! Seventy-five thousand altogether, twenty-five thousand change.
    - speaker: Sari
      text: Apik tenan, Mohamed!
      ar_eg: برافو عليك يا محمد!
      ar: أحسنت يا محمد!
      en: Well done, Mohamed!
souvenir:
  id: j2.u03.souvenir
  title: Bawang merah Nganjuk
  note:
    ar_eg: 'نغانجوك اسمها «مدينة البصل»: حقول البصل الأحمر الصغير (bawang abang) بتمتد على مدّ الشوف، والشوالات بتتكوم في السوق. وفي السوق هتسمع seket وselawe كل شوية، والأرقام الخاصة دي هي سر الفصال الحلو. دلوقتي تقدر تسأل عن السعر وتفاصل وتعدّ الباقي بالجاوي، وده إنجاز بجد!'
    ar: 'تُلقَّب نغانجوك بـ«مدينة البصل»: تمتد حقول البصل الأحمر الصغير (bawang abang) على مد البصر، وتتكدّس أكياسه في السوق. وستسمع هناك seket وselawe باستمرار، فهذه الأعداد الخاصة مفتاح المساومة اللطيفة. صرتَ تسأل عن السعر وتساوم وتعدّ الباقي بالجاوية، وهذا إنجاز حقيقي!'
    en: Nganjuk is known as the onion town — fields of shallots (bawang abang) stretch to the horizon and sacks pile up at the market. You'll hear seket and selawe there all day; those special numbers are the key to friendly haggling. You can now ask prices, bargain and count your change in Javanese — a real achievement!
