        ar: جائع
        en: hungry
      - text: pados
        ar_eg: يدوّر على (كراما)
        ar: يبحث عن (كراما)
        en: look for (krama)
    words: [gedhang, ulam, ngelih, pados]
  - id: e02
    type: match_pairs
    pairs:
      - text: ijol
        ar_eg: يبدّل
        ar: يستبدل
        en: swap, exchange
      - text: siyang
        ar_eg: الضهر (كراما)
        ar: الظهر (كراما)
        en: midday (krama)
      - text: ambet
