schema: kabar.lesson/v1
id: j3.u05.l08
language: jv
title: Gedhang lan ulam
can_do:
  ar_eg: 'تشتري موز وسمك من بو سيتي الضهر: تدوّر على حاجة، تقول إنك جعان، تشم الريحة، تبدّل حاجة، وتقول إن الحساب غلط.'
  ar: 'أن تشتري الموز والسمك من بو سيتي ظهرًا: تبحث عن شيء، تقول إنك جائع، تشمّ الرائحة، تستبدل شيئًا، وتقول إن الحساب خطأ.'
  en: 'Buy bananas and fish from Bu Siti at midday: look for something, say you''re hungry, smell it, swap it, and say the change is wrong.'
slides:
  - title: Ing peken siyang
    body:
      ar_eg: |
        gedhang = موز (نغوكو؛ بالكراما pisang). ulam = سمك أو لحمة (كراما من iwak).
        golek ← pados = يدوّر على: «Pados napa, Mas?» = بتدوّر على إيه؟
        ngelih = جعان (نغوكو جوجا، زي luwe).
        awan ← siyang = الضهر. ambu ← ambet = ريحة: «ambetipun» = ريحته.
        ijol = يبدّل: «Saged ijol?» = ينفع أبدّل؟
        salah ← lepat = غلط: «Susukipun lepat, Bu» = الباقي غلط يا ست.
      ar: |
        gedhang = موز (نغوكو؛ وبالكراما pisang). ulam = سمك أو لحم (كراما من iwak).
        golek ← pados = يبحث عن: «Pados napa, Mas?» = عمّ تبحث؟
        ngelih = جائع (نغوكو جوكجاكرتا، مثل luwe).
        awan ← siyang = الظهر. ambu ← ambet = رائحة: «ambetipun» = رائحته.
        ijol = يستبدل: «Saged ijol?» = هل يمكن الاستبدال؟
        salah ← lepat = خطأ: «Susukipun lepat, Bu» = الباقي خطأ يا سيدتي.
      en: |
        gedhang = banana (ngoko; krama pisang). ulam = fish or meat (krama of iwak).
        golek → pados = look for: "Pados napa, Mas?" = what are you looking for?
        ngelih = hungry (Jogja ngoko, like luwe).
        awan → siyang = midday. ambu → ambet = smell: "ambetipun" = its smell.
        ijol = swap, exchange: "Saged ijol?" = can I swap it?
        salah → lepat = wrong: "Susukipun lepat, Bu" = the change is wrong, ma'am.
    examples:
      - text: Pados napa, Mas? Gedhang?
        ar_eg: بتدوّر على إيه يا أستاذ؟ موز؟
        ar: عمّ تبحث يا أخي؟ موز؟
        en: What are you after, mate? Bananas?
      - text: Sampun siyang, kula ngelih.
        ar_eg: بقينا الضهر، أنا جعان.
        ar: صار الظهر، أنا جائع.
        en: It's midday already, I'm hungry.
      - text: Ngapunten, Bu, susukipun lepat.
        ar_eg: معلش يا ست، الباقي غلط.
        ar: عذرًا يا سيدتي، الباقي خطأ.
        en: Sorry, ma'am, the change is wrong.
