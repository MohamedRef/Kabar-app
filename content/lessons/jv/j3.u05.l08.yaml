dialogue:
  lines:
    - speaker: Bu Siti
      text: Pados napa, Mas? Gedhang niki manis.
      ar_eg: بتدوّر على إيه يا أستاذ؟ الموز ده مسكّر.
      ar: عمّ تبحث يا أخي؟ هذا الموز حلو.
      en: What are you after, mate? These bananas are sweet.
    - speaker: Mohamed
      text: Gedhang setunggal sisir, Bu. Sampun siyang, kula ngelih.
      ar_eg: سباطة موز واحدة يا ست. بقينا الضهر وأنا جعان.
      ar: قرط موز واحد يا سيدتي. صار الظهر وأنا جائع.
      en: One bunch of bananas, ma'am. It's midday and I'm hungry.
    - speaker: Bu Siti
      text: Ulamipun ugi, Mas? Ambetipun seger, enjing wau saking Depok.
      ar_eg: وسمك كمان يا أستاذ؟ ريحته طازة، جاي الصبح من ديبوك.
      ar: وسمكًا أيضًا يا أخي؟ رائحته طازجة، وصل صباح اليوم من ديبوك.
      en: Fish too, mate? It smells fresh, it came from Depok this morning.
    - speaker: Mohamed
      text: Mboten, Bu. Ngapunten, gedhang niki ireng. Saged ijol?
      ar_eg: لأ يا ست. معلش، الموزة دي سودا. ينفع أبدّلها؟
      ar: لا يا سيدتي. عذرًا، هذه الموزة سوداء. هل يمكن استبدالها؟
      en: No thanks, ma'am. Sorry, this banana's black. Can I swap it?
    - speaker: Bu Siti
      text: Saged, Mas. Niki susukipun.
      ar_eg: ينفع يا أستاذ. اتفضل الباقي.
      ar: يمكن يا أخي. هذا هو الباقي.
      en: Sure, mate. Here's your change.
    - speaker: Mohamed
      text: Waduh, Bu, susukipun lepat. Kirang kalih ewu.
      ar_eg: يا ست، الباقي غلط. ناقص ألفين.
      ar: يا سيدتي، الباقي خطأ. ينقص ألفان.
      en: Oh, ma'am, the change is wrong. It's two thousand short.
