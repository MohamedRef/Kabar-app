  - id: e03
    type: listen
    text: Pados napa, Mas?
    question:
      ar_eg: البيّاعة بتسأل عن إيه؟
      ar: عمّ تسأل البائعة؟
      en: What does the seller ask?
    options: [بتدوّر على إيه؟, عايز تدفع كام؟, جعان ولا لأ؟]
    answer: 0
    meaning:
      ar_eg: بتدوّر على إيه يا أستاذ؟
      ar: عمّ تبحث يا أخي؟
      en: What are you looking for?
    words: [pados, ngelih]
  - id: e04
    type: fill_blank
    sentence: Bu, gedhangipun saged ___? Niki sampun ireng.
    meaning:
      ar_eg: يا ست، الموز ينفع ___؟ دي اسودّت.
      ar: يا سيدتي، هل يمكن ___ الموز؟ هذه اسودّت.
      en: Ma'am, can I ___ the bananas? These have gone black.
    options: [ijol, pados, lepat]
    answers: [ijol]
    words: [ijol, gedhang, pados, lepat]
    explain:
      ar_eg: "ijol = يبدّل: الموز اسودّ، فعايز تبدّله. pados = يدوّر على، وlepat = غلط."
      ar: "ijol تعني يستبدل: اسودّ الموز فتريد تبديله. أما pados فيبحث عن، وlepat خطأ."
      en: "ijol is \"swap\": the bananas went black, so you want new ones. pados is \"look for\", and lepat is \"wrong\"."
  - id: e05
    type: multiple_choice
    question: salah (ngoko) → ___ (krama)
    options: [lepat, siyang, ambet]
    answer: 0
    explain:
      ar_eg: 'salah بالنغوكو، lepat بالكراما: غلط. siyang = الضهر، ambet = ريحة.'
      ar: 'salah بالنغوكو وlepat بالكراما: خطأ. siyang = الظهر، ambet = رائحة.'
      en: 'salah is ngoko, lepat is krama: wrong. siyang = midday, ambet = smell.'
    words: [lepat, siyang, ambet]
  - id: e06
    type: fill_blank
    sentence: Ulamipun seger, ___ipun sae.
    meaning:
      ar_eg: السمك طازة، ___ه حلوة.
      ar: السمك طازج، ___ه طيّبة.
      en: The fish is fresh, its ___ is good.
    options: [ambet, siyang, gedhang]
    answers: [ambet]
    words: [ambet, ulam, siyang, gedhang]
    explain:
      ar_eg: ambet = ريحة (كراما)، والسمك الطازة ريحته حلوة. siyang = الضهر، وgedhang = موز.
      ar: ambet تعني الرائحة (كراما)، والسمك الطازج رائحته طيبة. أما siyang فالظهر، وgedhang موز.
      en: "ambet is \"smell\" (krama): fresh fish smells good. siyang is \"midday\", and gedhang is \"banana\"."
