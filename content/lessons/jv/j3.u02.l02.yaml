schema: kabar.lesson/v1
id: j3.u02.l02
language: jv
title: Sampeyan utawa panjenengan?
can_do:
  ar_eg: تختار «إنت» المؤدبة المناسبة.
  ar: أن تختار ضمير المخاطَب المهذب المناسب.
  en: Choose a polite you.
slides:
  - title: Kowe → sampeyan → panjenengan
    body:
      ar_eg: |
        «إنت» في الجاوي ليها تلات درجات، زي المصري بالظبط:
        - kowe = «إنت» (kamu) — للصحاب والأصغر
        - sampeyan = «حضرتك» (Anda) — مؤدبة بس يومية
        - panjenengan = «سيادتك» (Bapak / Ibu) — للكبار والناس اللي بتحترمها
        في الشات: kowe، sampeyan (من غير علامات).
      ar: |
        لضمير «أنت» في الجاوية ثلاث درجات كما في العامية المصرية:
        - kowe = «أنت» (kamu) — للأصدقاء والأصغر
        - sampeyan = «حضرتك» (Anda) — مهذبة يومية
        - panjenengan = «سيادتك» (Bapak / Ibu) — للكبار ومن توقّره
        وفي الدردشة: kowe وsampeyan بلا علامات.
      en: |
        "You" in Javanese has three steps, just like Egyptian Arabic:
        - kowe = «إنت» (kamu) — friends and younger people
        - sampeyan = «حضرتك» (Anda) — polite but everyday
        - panjenengan = «سيادتك» (Bapak / Ibu) — elders and people you honour
        In chats: kowe, sampeyan (no accents).
    grammar: jv.pronoun.krama
    examples:
      - text: Kowe wis mangan?
        ar_eg: كلت؟
        ar: هل أكلت؟
        en: Have you eaten? (to a friend)
      - text: Sampeyan sampun nedha?
        ar_eg: حضرتك كلت؟
        ar: هل أكلتَ؟
        en: Have you eaten? (polite, everyday)
      - text: Panjenengan sampun dhahar?
        ar_eg: سيادتك أكلت؟
        ar: هل تفضلتم بالأكل؟
        en: Have you eaten? (honorific)
  - title: Sampeyan — sopan, saben dina
    body:
      ar_eg: |
        sampeyan مؤدبة بس مش رسمية أوي: للبياع، لحد في سنك مش صاحبك، لحد غريب في الشارع.
        وفي أسواق يوجيا sampeyan هي «حضرتك» اليومية مع البياعين والجيران.
      ar: |
        sampeyan مهذبة غير مفرطة الرسمية: للبائع، ولمن هو في سنك وليس صديقك، وللغريب في الطريق.
        وفي أسواق يوجيا sampeyan هي «حضرتك» اليومية مع الباعة والجيران.
      en: |
        sampeyan is polite but not very formal: a seller, someone your age who isn't a friend, a stranger in the street.
        In Jogja's markets sampeyan is the everyday polite "you" with sellers and neighbours.
    grammar: jv.pronoun.krama
    examples:
      - text: Sampeyan sampun nedha, Mbak?
        ar_eg: حضرتك كلتي يا آنسة؟
        ar: هل أكلتِ يا آنسة؟
        en: Have you eaten, miss?
  - title: Panjenengan — kanggo sing sepuh
    body:
      ar_eg: |
        panjenengan للناس اللي مقامها عالي: جدة صاحبك، المدرس، حد كبير في السن. وبتمشي مع كلمات krama inggil زي dhahar.
        مش متأكد تقول sampeyan ولا panjenengan لحد كبير؟ اختار panjenengan، الأدب الزيادة مابيضرش.
      ar: |
        panjenengan لأصحاب المقام: جدة صديقك والمعلم والمسنّ، وتأتي مع ألفاظ krama inggil مثل dhahar.
        وإن ترددت بين sampeyan وpanjenengan مع الكبير فاختر panjenengan، فزيادة الأدب لا تضر.
      en: |
        panjenengan is for people of standing: a friend's grandmother, a teacher, an elderly person. It goes with krama inggil words like dhahar.
        Unsure between sampeyan and panjenengan with an elder? Pick panjenengan — extra respect never hurts.
    grammar: jv.pronoun.krama
    examples:
      - text: Mbah, panjenengan sampun dhahar?
        ar_eg: يا تيتة، حضرتك أكلتي؟
        ar: يا جدتي، هل تفضلتِ بالأكل؟
        en: Grandma, have you eaten?
      - text: Menika griya panjenengan, Mbah?
        ar_eg: ده بيت حضرتك يا تيتة؟
        ar: أهذا بيتك يا جدتي؟
        en: Is this your house, Grandma?
  - title: Dheweke → piyambakipun
    body:
      ar_eg: |
        و«هو / هي» كمان ليها نسخة مؤدبة:
        - dheweke (dia) — ngoko
        - piyambakipun — krama، لما بتتكلم بأدب عن حد
        - panjenenganipun — krama inggil، لحد محترم جدًا، زي beliau في الإندونيسي
        و«بتاعك» نفس فكرة kula: griya sampeyan (بيتك)، griya panjenengan (بيت سيادتك).
      ar: |
        ولضمير «هو / هي» نسخ مهذبة أيضًا:
        - dheweke (dia) — ngoko
        - piyambakipun — krama، للحديث المهذب عن شخص
        - panjenenganipun — krama inggil، للمعظَّم جدًا، مثل beliau في الإندونيسية
        والملكية للمخاطَب كما مع kula: griya sampeyan (بيتك) وgriya panjenengan (بيت سيادتك).
      en: |
        "He / she" has polite versions too:
        - dheweke (dia) — ngoko
        - piyambakipun — krama, speaking politely about someone
        - panjenenganipun — krama inggil, for someone highly respected, like Indonesian beliau
        "Your" works like kula: griya sampeyan (your house), griya panjenengan (your house, honorific).
    grammar: jv.pronoun.krama
    examples:
      - text: Piyambakipun saking Yogya.
        ar_eg: هو من يوجيا.
        ar: هو من يوغياكرتا.
        en: He's from Yogya.
      - text: Piyambakipun sampun nedha.
        ar_eg: هي كلت خلاص.
        ar: قد أكلَتْ.
        en: She has eaten.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kowe
        ar_eg: إنت (ngoko) = kamu
        ar: أنت (ngoko) = kamu
        en: you (ngoko) = kamu
      - text: sampeyan
        ar_eg: حضرتك (krama) = Anda
        ar: حضرتك (krama) = Anda
        en: you (krama) = Anda
      - text: panjenengan
        ar_eg: سيادتك (krama inggil)
        ar: سيادتك (krama inggil)
        en: you (krama inggil)
      - text: piyambakipun
        ar_eg: هو / هي (krama)
        ar: هو / هي (krama)
        en: he / she (krama)
      - text: panjenenganipun
        ar_eg: هو / هي لحد محترم جدًا = beliau
        ar: هو / هي للمعظَّم = beliau
        en: he / she, highly respected = beliau
      - text: sepuh
        ar_eg: كبير في السن (krama) = tua
        ar: مسنّ (krama) = tua
        en: old (krama) = tua
    words: [kowe, sampeyan, panjenengan, piyambakipun, panjenenganipun, sepuh]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: بنت في سنك بتبيع شاي في Pasar Kranggan. تقولها «إنت» إزاي؟
      ar: فتاة في مثل سنك تبيع الشاي في Pasar Kranggan. كيف تخاطبها بـ«أنت»؟
      en: A young woman your age sells tea at Pasar Kranggan. Which "you"?
    options: [kowe, sampeyan, dheweke]
    answer: 1
    explain:
      ar_eg: 'مش صاحبتك وبياعة: sampeyan (مؤدبة ويومية). dheweke معناها «هي» مش «إنتي».'
      ar: 'ليست صديقتك وهي بائعة: sampeyan. أما dheweke فمعناها «هي» لا «أنتِ».'
      en: She's a seller, not a friend — sampeyan. Dheweke means "she", not "you".
    words: [sampeyan]
  - id: e03
    type: listen
    text: Panjenenganipun sampun sepuh.
    options: ['Panjenenganipun sampun sepuh.', 'Piyambakipun sampun sepuh.', 'Panjenengan sampun dhahar.']
    answer: 0
    words: [panjenenganipun, piyambakipun, sepuh]
  - id: e04
    type: fill_blank
    sentence: Mbah, ___ sampun dhahar?
    meaning:
      ar_eg: يا تيتة، حضرتك أكلتي؟
      ar: يا جدتي، هل تفضلتِ بالأكل؟
      en: Grandma, have you eaten?
    options: [kula, kowe, panjenengan]
    answers: [panjenengan]
    explain:
      ar_eg: 'dhahar krama inggil، وMbah كبيرة: panjenengan.'
      ar: 'dhahar من krama inggil والجدة كبيرة: panjenengan.'
      en: dhahar is krama inggil and Mbah is an elder — panjenengan.
    words: [panjenengan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: هي كلت خلاص يا آنسة. (بالكراما)
      ar: لقد أكلت هي يا آنسة. (بالكراما)
      en: She has already eaten, miss. (krama)
    answer: Piyambakipun sampun nedha, Mbak.
    distractors: [dheweke, mangan]
    words: [piyambakipun, sampun, nedha]
  - id: e06
    type: speaking
    text: Mbah sampun sepuh. Panjenenganipun saking Jogja.
    meaning:
      ar_eg: جدّي كبير في السن. هو (حضرته) من Jogja.
      ar: جدّي مسنّ. هو (حضرته) من Jogja.
      en: Grandpa is old now. He is from Jogja.
    words: [sepuh, panjenenganipun, saking]
dialogue:
  title: Ing Pasar Kranggan
  lines:
    - speaker: Mohamed
      text: Sugeng enjing, Bu Siti. Sampeyan sampun nedha?
      ar_eg: صباح الخير يا Bu Siti. حضرتك كلتي؟
      ar: صباح الخير يا Bu Siti. هل أكلتِ؟
      en: Good morning, Bu Siti. Have you eaten?
    - speaker: Bu Siti
      text: Sampun, Mas Mohamed. Sampeyan?
      ar_eg: آه يا أستاذ محمد. وحضرتك؟
      ar: نعم يا محمد. وأنت؟
      en: Yes, Mohamed. And you?
    - speaker: Mohamed
      text: Sampun, Bu. Matur nuwun.
      ar_eg: آه يا مدام. شكرًا.
      ar: نعم يا سيدتي. شكرًا.
      en: Yes, ma'am. Thank you.
    - speaker: Mas Dimas
      text: Mohamed, iki mbahku.
      ar_eg: يا محمد، دي جدتي.
      ar: يا محمد، هذه جدتي.
      en: Mohamed, this is my grandma.
    - speaker: Mohamed
      text: Sugeng enjing, Mbah. Panjenengan sampun dhahar?
      ar_eg: صباح الخير يا تيتة. حضرتك أكلتي؟
      ar: صباح الخير يا جدتي. هل تفضلتِ بالأكل؟
      en: Good morning, Grandma. Have you eaten?
    - speaker: Mbah Putri
      text: Sampun, Mas. Matur nuwun.
      ar_eg: آه يا ابني. شكرًا.
      ar: نعم يا بني. شكرًا.
      en: Yes, dear. Thank you.
new_words:
  - word: piyambakipun
    pos: pronoun
    ar_eg: هو / هي (krama) = dia
    ar: هو / هي (krama) = dia
    en: he / she (krama) = dia
  - word: panjenenganipun
    pos: pronoun
    ar_eg: هو / هي لحد محترم جدًا (krama inggil) = beliau
    ar: هو / هي للمعظَّم (krama inggil) = beliau
    en: he / she, highly respected (krama inggil) = beliau
  - word: sepuh
    pos: adjective
    ar_eg: كبير في السن (krama لـ tuwa) = tua
    ar: مسنّ (krama لـ tuwa) = tua
    en: old, elderly (krama for tuwa) = tua
