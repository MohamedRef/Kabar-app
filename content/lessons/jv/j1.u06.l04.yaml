schema: kabar.lesson/v1
id: j1.u06.l04
language: jv
title: Mlebu, metu, nyabrang
can_do:
  ar_eg: تقول تدخل وتخرج وتطلع وتنزل وتعدّي الشارع، والحاجة قريبة ولا في أنهي ناحية.
  ar: أن تقول تدخل وتخرج وتصعد وتنزل وتعبر الشارع، وأنّ الشيء قريب أو في أيّ ناحية.
  en: Say go in, out, up, down and across the road, and that something is near or on which side.
slides:
  - title: Mlebu, Mas!
    body:
      ar_eg: |
        mlebu = يدخل، metu = يخرج: Mlebu, Mas! = اتفضّل ادخل يا ماس!
        munggah = يطلع لفوق، mudhun = ينزل (ومن العربية كمان): Mudhun neng kene = هنزل هنا.
        cedhak = قريب: cedhak kene = قريب من هنا.
        sisih = ناحية: sisih kiwa = الناحية الشمال.
        liwat = يعدّي من: Liwat ngarep masjid = عدّي من قدام الجامع.
        nyabrang = يعدّي الشارع: Ati-ati nyabrang! = خلّي بالك وإنت بتعدّي!
      ar: |
        mlebu = يدخل، metu = يخرج: Mlebu, Mas! = تفضّل بالدخول يا أخي!
        munggah = يصعد، mudhun = ينزل (ومن المركبة أيضًا): Mudhun neng kene = أنزل هنا.
        cedhak = قريب: cedhak kene = قريب من هنا.
        sisih = جهة، ناحية: sisih kiwa = الجهة اليسرى.
        liwat = يمرّ من: Liwat ngarep masjid = مُرّ من أمام المسجد.
        nyabrang = يعبر الطريق: Ati-ati nyabrang! = انتبه وأنت تعبر!
      en: |
        mlebu = go in, metu = go out: Mlebu, Mas! = Come in, Mas!
        munggah = go up, mudhun = go down, get off: Mudhun neng kene = I'll get off here.
        cedhak = near: cedhak kene = near here.
        sisih = side: sisih kiwa = the left side.
        liwat = go via, pass: Liwat ngarep masjid = Go past the front of the mosque.
        nyabrang = cross the road: Ati-ati nyabrang! = Careful crossing!
    examples:
      - text: Mudhun neng kene, Pak.
        ar_eg: هنزل هنا يا عم.
        ar: سأنزل هنا يا سيّدي.
        en: I'll get off here, sir.
      - text: Stasiune cedhak kene.
        ar_eg: المحطة قريبة من هنا.
        ar: المحطّة قريبة من هنا.
        en: The station is near here.
      - text: Ati-ati nyabrang dalan, Le!
        ar_eg: خلّي بالك وإنت بتعدّي الشارع يا ابني!
        ar: انتبه وأنت تعبر الطريق يا بنيّ!
        en: Careful crossing the road, son!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mlebu
        ar_eg: يدخل
        ar: يدخل
        en: go in
      - text: metu
        ar_eg: يخرج
        ar: يخرج
        en: go out
      - text: munggah
        ar_eg: يطلع لفوق
        ar: يصعد
        en: go up
      - text: mudhun
        ar_eg: ينزل
        ar: ينزل
        en: go down, get off
    words: [mlebu, metu, munggah, mudhun]
  - id: e02
    type: match_pairs
    pairs:
      - text: cedhak
        ar_eg: قريب
        ar: قريب
        en: near
      - text: nyabrang
        ar_eg: يعدّي الشارع
        ar: يعبر الطريق
        en: cross (the road)
      - text: sisih
        ar_eg: ناحية
        ar: جهة
        en: side
      - text: liwat
        ar_eg: يعدّي من
        ar: يمرّ من
        en: go via, pass
    words: [cedhak, nyabrang, sisih, liwat]
  - id: e03
    type: listen
    text: Mudhun neng kene, Pak.
    options: ['Mudhun neng kene, Pak.', 'Munggah neng kene, Pak.', 'Mlebu neng kene, Pak.']
    answer: 0
    meaning:
      ar_eg: هنزل هنا يا عم.
      ar: سأنزل هنا يا سيّدي.
      en: I'll get off here, sir.
    words: [mudhun, munggah, mlebu]
  - id: e04
    type: fill_blank
    sentence: Stasiune ___ kene, lurus wae.
    meaning:
      ar_eg: المحطة ___ من هنا، على طول.
      ar: المحطّة ___ من هنا، امشِ مباشرة.
      en: The station is ___ here, just go straight.
    options: [cedhak, nyabrang, sisih]
    answers: [cedhak]
    words: [cedhak, nyabrang, sisih]
    explain:
      ar_eg: cedhak kene = قريب من هنا. nyabrang = يعدّي الشارع، وsisih = ناحية.
      ar: cedhak kene = قريب من هنا؛ أما nyabrang فيعبر، وsisih جهة.
      en: cedhak kene = near here. nyabrang = cross, sisih = side.
  - id: e05
    type: multiple_choice
    question: Ati-ati nyabrang, Le!
    question_meaning:
      ar_eg: بيقوله إيه؟
      ar: ماذا يقول له؟
      en: What is he telling him?
    options: [خلّي بالك وإنت بتعدّي الشارع, خلّي بالك وإنت داخل, خلّي بالك وإنت طالع]
    answer: 0
    explain:
      ar_eg: nyabrang = يعدّي الشارع. داخل = mlebu، طالع = munggah.
      ar: nyabrang = يعبر الطريق. أمّا الدخول فـmlebu، والصعود فـmunggah.
      en: nyabrang = cross. Going in is mlebu, going up is munggah.
    words: [nyabrang, mlebu, munggah]
  - id: e06
    type: fill_blank
    sentence: ___ ngarep masjid, terus ngiwa.
    meaning:
      ar_eg: ___ من قدام الجامع، وبعدين شمال.
      ar: ___ من أمام المسجد، ثم يسارًا.
      en: ___ the front of the mosque, then left.
    options: [Liwat, Metu, Cedhak]
    answers: [Liwat]
    words: [liwat, metu, cedhak]
    explain:
      ar_eg: liwat = عدّي من قدّام. metu = اطلع برّه، وcedhak = قريب.
      ar: liwat = مُرّ من أمام؛ أما metu فاخرج، وcedhak قريب.
      en: liwat = go past. metu = go out, cedhak = near.
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «الجامع في الناحية الشمال» بالجاوي؟
      ar: كيف تقول «المسجد في الجهة اليسرى» بالجاوية؟
      en: '"The mosque is on the left side" in Javanese?'
    options: [Masjide neng sisih kiwa., Masjide liwat kiwa., Masjide mlebu kiwa.]
    answer: 0
    explain:
      ar_eg: 'sisih = ناحية: sisih kiwa = الناحية الشمال.'
      ar: 'sisih = جهة: sisih kiwa = الجهة اليسرى.'
      en: 'sisih = side: sisih kiwa = the left side.'
    words: [sisih, liwat, mlebu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: اخرج من هنا وبعدين اطلع.
      ar: اخرج من هنا ثم اصعد.
      en: Go out of here, then go up.
    answer: Metu saka kene, terus munggah.
    distractors: [mudhun, nyabrang]
    words: [metu, munggah, mudhun]
    explain:
      ar_eg: metu = اطلع برّه، وmunggah = اطلع لفوق. mudhun = انزل (العكس)، وnyabrang = عدّي، ومش في المعنى.
      ar: metu = اخرج، وmunggah = اصعد؛ أما mudhun فانزل (العكس)، وnyabrang اعبر، وليسا في المعنى.
      en: metu = go out, munggah = go up. mudhun (go down) is the opposite, nyabrang = cross.
  - id: e09
    type: translate
    direction: from_target
    source_text: Ayo mlebu, Mas, neng kene adem.
    answers_meaning:
      ar_eg: [اتفضّل ادخل يا ماس، هنا ساقع, يلا ادخل يا ماس، الجو هنا لطيف]
      ar: [تفضّل بالدخول يا أخي، فالمكان هنا بارد, هيّا ادخل يا أخي، الجوّ هنا منعش]
      en: ['Come on in, Mas, it''s cool in here', 'Come in, Mas, it''s nice and cool here']
    words: [mlebu]
  - id: e10
    type: speaking
    text: Aku nyabrang dhisik. Terminale cedhak kene?
    meaning:
      ar_eg: هعدّي الشارع الأول. الموقف قريب من هنا؟
      ar: سأعبر الطريق أوّلًا. هل الموقف قريب من هنا؟
      en: I'll cross first. Is the bus terminal near here?
    words: [nyabrang, cedhak]
dialogue:
  lines:
    - speaker: Mohamed
      text: Ngapura, Pak. Aku bingung. Kebun binatang neng ngendi?
      ar_eg: لو سمحت يا عمو. أنا تايه. جنينة الحيوانات فين؟
      ar: عذرًا يا عمّ. أنا تائه. أين حديقة الحيوان؟
      en: Excuse me, sir. I'm confused. Where's the zoo?
    - speaker: Bapak
      text: Cedhak, Mas. Liwat dalan kae, terus ngiwa.
      ar_eg: قريبة يا ماس. عدّي من الطريق ده، وبعدين شمال.
      ar: قريبة يا ماس. مُرّ من ذلك الطريق، ثم يسارًا.
      en: It's close, Mas. Go along that road, then left.
    - speaker: Mohamed
      text: Mlebune neng sisih endi?
      ar_eg: الدخول من أنهي ناحية؟
      ar: من أيّ جهة الدخول؟
      en: Which side is the entrance on?
    - speaker: Bapak
      text: Sisih ngarep. Mlebu saka kono, metu saka mburi.
      ar_eg: من قدّام. ادخل من هناك واطلع من ورا.
      ar: من الأمام. ادخل من هناك واخرج من الخلف.
      en: At the front. In from there, out at the back.
    - speaker: Mohamed
      text: Matur nuwun, Pak!
      ar_eg: شكرًا يا عم!
      ar: شكرًا يا سيّدي!
      en: Thank you, sir!
