  - id: e09
    type: translate
    direction: from_target
    source_text: Ayo mlebu, Mas, ndek kene adem.
    answers_meaning:
      ar_eg: [اتفضّل ادخل يا ماس، هنا ساقع, يلا ادخل يا ماس، الجو هنا لطيف]
      ar: [تفضّل بالدخول يا أخي، فالمكان هنا بارد, هيّا ادخل يا أخي، الجوّ هنا منعش]
      en: ['Come on in, Mas, it''s cool in here', 'Come in, Mas, it''s nice and cool here']
    words: [mlebu]
  - id: e10
    type: speaking
    text: Aku kesasar. Terminale cedhak kene?
    meaning:
      ar_eg: أنا تهت. الموقف قريب من هنا؟
      ar: ضللت الطريق. هل الموقف قريب من هنا؟
      en: I'm lost. Is the bus terminal near here?
    words: [kesasar, cedhak]
dialogue:
  lines:
    - speaker: Mohamed
      text: Sepurane, Pak. Aku kesasar. Kebun Binatang Suroboyo ngendi?
      ar_eg: معلش يا عم. أنا تهت. جنينة حيوانات سورابايا فين؟
      ar: عذرًا يا سيّدي. ضللت الطريق. أين حديقة حيوان سورابايا؟
      en: Excuse me, sir. I'm lost. Where's Surabaya Zoo?
    - speaker: Bapak
      text: Cedhak, Mas. Liwat prapatan kae, terus ngiwa.
      ar_eg: قريبة يا ماس. عدّي من التقاطع اللي هناك، وبعدين شمال.
      ar: قريبة يا أخي. مُرّ من ذلك التقاطع، ثم يسارًا.
      en: It's close, Mas. Go past that crossroads, then left.
    - speaker: Mohamed
      text: Lawange nang sisih endi?
      ar_eg: البوابة في أنهي ناحية؟
      ar: في أيّ جهة البوّابة؟
      en: Which side is the gate on?
    - speaker: Bapak
      text: Sisih tengen. Mlebu saka kono, metu saka mburi.
      ar_eg: الناحية اليمين. ادخل من هناك، واخرج من ورا.
      ar: الجهة اليمنى. ادخل من هناك واخرج من الخلف.
      en: On the right. In from there, out at the back.
    - speaker: Mohamed
      text: Matur nuwun, Pak!
      ar_eg: شكرًا يا عم!
      ar: شكرًا يا سيّدي!
      en: Thank you, sir!
