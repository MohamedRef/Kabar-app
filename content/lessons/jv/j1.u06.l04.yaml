    words: [cedhak, nyabrang, sisih, liwat]
  - id: e03
    type: listen
    text: Mudhun neng kene, Pak.
    options: ['Mudhun neng kene, Pak.', 'Munggah neng kene, Pak.', 'Mlebu neng kene, Pak.']
    answer: 0
    meaning:
      ar_eg: هنزل هنا يا عم.
      ar: سأنزل هنا يا سيّدي.
      en: I'll get off here, sir.
    words: [mudhun, munggah, mlebu]
  - id: e04
    type: fill_blank
    sentence: Stasiune ___ kene, lurus wae.
    meaning:
      ar_eg: المحطة ___ من هنا، على طول.
      ar: المحطّة ___ من هنا، امشِ مباشرة.
      en: The station is ___ here, just go straight.
    options: [cedhak, nyabrang, sisih]
    answers: [cedhak]
    words: [cedhak, nyabrang, sisih]
  - id: e05
    type: multiple_choice
    question: Ati-ati nyabrang, Le!
    question_meaning:
      ar_eg: بيقوله إيه؟
      ar: ماذا يقول له؟
      en: What is he telling him?
    options: [خلّي بالك وإنت بتعدّي الشارع, خلّي بالك وإنت داخل, خلّي بالك وإنت طالع]
    answer: 0
    explain:
      ar_eg: nyabrang = يعدّي الشارع. داخل = mlebu، طالع = munggah.
      ar: nyabrang = يعبر الطريق. أمّا الدخول فـmlebu، والصعود فـmunggah.
      en: nyabrang = cross. Going in is mlebu, going up is munggah.
    words: [nyabrang, mlebu, munggah]
  - id: e06
    type: fill_blank
    sentence: ___ ngarep masjid, terus ngiwa.
    meaning:
      ar_eg: ___ من قدام الجامع، وبعدين شمال.
      ar: ___ من أمام المسجد، ثم يسارًا.
      en: ___ the front of the mosque, then left.
    options: [Liwat, Metu, Cedhak]
    answers: [Liwat]
    words: [liwat, metu, cedhak]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «الجامع في الناحية الشمال» بالجاوي؟
      ar: كيف تقول «المسجد في الجهة اليسرى» بالجاوية؟
      en: '"The mosque is on the left side" in Javanese?'
    options: [Masjide neng sisih kiwa., Masjide liwat kiwa., Masjide mlebu kiwa.]
    answer: 0
    explain:
      ar_eg: 'sisih = ناحية: sisih kiwa = الناحية الشمال.'
      ar: 'sisih = جهة: sisih kiwa = الجهة اليسرى.'
      en: 'sisih = side: sisih kiwa = the left side.'
    words: [sisih, liwat, mlebu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: اخرج من هنا وبعدين اطلع.
      ar: اخرج من هنا ثم اصعد.
      en: Go out of here, then go up.
    answer: Metu saka kene, terus munggah.
    distractors: [mudhun, nyabrang]
    words: [metu, munggah, mudhun]
  - id: e09
    type: translate
    direction: from_target
    source_text: Ayo mlebu, Mas, neng kene adem.
    answers_meaning:
      ar_eg: [اتفضّل ادخل يا ماس، هنا ساقع, يلا ادخل يا ماس، الجو هنا لطيف]
      ar: [تفضّل بالدخول يا أخي، فالمكان هنا بارد, هيّا ادخل يا أخي، الجوّ هنا منعش]
      en: ['Come on in, Mas, it''s cool in here', 'Come in, Mas, it''s nice and cool here']
    words: [mlebu]
  - id: e10
    type: speaking
    text: Aku nyabrang dhisik. Terminale cedhak kene?
    meaning:
      ar_eg: هعدّي الشارع الأول. الموقف قريب من هنا؟
      ar: سأعبر الطريق أوّلًا. هل الموقف قريب من هنا؟
      en: I'll cross first. Is the bus terminal near here?
    words: [nyabrang, cedhak]
dialogue:
  lines:
    - speaker: Mohamed
      text: Ngapura, Pak. Aku bingung. Gembira Loka ngendi?
      ar_eg: معلش يا عم. أنا متلخبط. جنينة حيوانات جمبيرا لوكا فين؟
      ar: عذرًا يا سيّدي. أنا محتار. أين حديقة حيوان جمبيرا لوكا؟
      en: Excuse me, sir. I'm confused. Where's Gembira Loka Zoo?
    - speaker: Bapak
      text: Cedhak, Mas. Liwat prapatan kae, terus ngiwa.
      ar_eg: قريبة يا ماس. عدّي من التقاطع اللي هناك، وبعدين شمال.
      ar: قريبة يا أخي. مُرّ من ذلك التقاطع، ثم يسارًا.
      en: It's close, Mas. Go past that crossroads, then left.
    - speaker: Mohamed
      text: Lawange neng sisih endi?
      ar_eg: البوابة في أنهي ناحية؟
      ar: في أيّ جهة البوّابة؟
      en: Which side is the gate on?
    - speaker: Bapak
      text: Sisih tengen. Mlebu saka kono, metu saka mburi.
      ar_eg: الناحية اليمين. ادخل من هناك، واخرج من ورا.
      ar: الجهة اليمنى. ادخل من هناك واخرج من الخلف.
      en: On the right. In from there, out at the back.
    - speaker: Mohamed
      text: Matur nuwun, Pak!
      ar_eg: شكرًا يا عم!
      ar: شكرًا يا سيّدي!
      en: Thank you, sir!
