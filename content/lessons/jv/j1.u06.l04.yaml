schema: kabar.lesson/v1
id: j1.u06.l04
language: jv
title: Mlebu, metu, nyabrang
can_do:
  ar_eg: تقول تدخل وتخرج وتطلع وتنزل وتعدّي الشارع، والحاجة قريبة ولا في أنهي ناحية.
  ar: أن تقول تدخل وتخرج وتصعد وتنزل وتعبر الشارع، وأنّ الشيء قريب أو في أيّ ناحية.
  en: Say go in, out, up, down and across the road, and that something is near or on which side.
slides:
  - title: Mlebu, Mas!
    body:
      ar_eg: |
        mlebu = يدخل، metu = يخرج: Mlebu, Mas! = اتفضّل ادخل يا ماس!
        munggah = يطلع لفوق، mudhun = ينزل (ومن العربية كمان): Mudhun neng kene = هنزل هنا.
        cedhak = قريب: cedhak kene = قريب من هنا.
        sisih = ناحية: sisih kiwa = الناحية الشمال.
        liwat = يعدّي من: Liwat ngarep masjid = عدّي من قدام الجامع.
        nyabrang = يعدّي الشارع: Ati-ati nyabrang! = خلّي بالك وإنت بتعدّي!
      ar: |
        mlebu = يدخل، metu = يخرج: Mlebu, Mas! = تفضّل بالدخول يا أخي!
        munggah = يصعد، mudhun = ينزل (ومن المركبة أيضًا): Mudhun neng kene = أنزل هنا.
        cedhak = قريب: cedhak kene = قريب من هنا.
        sisih = جهة، ناحية: sisih kiwa = الجهة اليسرى.
        liwat = يمرّ من: Liwat ngarep masjid = مُرّ من أمام المسجد.
        nyabrang = يعبر الطريق: Ati-ati nyabrang! = انتبه وأنت تعبر!
      en: |
        mlebu = go in, metu = go out: Mlebu, Mas! = Come in, Mas!
        munggah = go up, mudhun = go down, get off: Mudhun neng kene = I'll get off here.
        cedhak = near: cedhak kene = near here.
        sisih = side: sisih kiwa = the left side.
        liwat = go via, pass: Liwat ngarep masjid = Go past the front of the mosque.
        nyabrang = cross the road: Ati-ati nyabrang! = Careful crossing!
    examples:
      - text: Mudhun neng kene, Pak.
        ar_eg: هنزل هنا يا عم.
        ar: سأنزل هنا يا سيّدي.
        en: I'll get off here, sir.
      - text: Stasiune cedhak kene.
        ar_eg: المحطة قريبة من هنا.
        ar: المحطّة قريبة من هنا.
        en: The station is near here.
      - text: Ati-ati nyabrang dalan, Le!
        ar_eg: خلّي بالك وإنت بتعدّي الشارع يا ابني!
        ar: انتبه وأنت تعبر الطريق يا بنيّ!
        en: Careful crossing the road, son!
exercises:
