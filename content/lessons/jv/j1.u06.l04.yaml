schema: kabar.lesson/v1
id: j1.u06.l04
language: jv
title: Mlebu, metu, kesasar
can_do:
  ar_eg: تقول تدخل وتخرج وتطلع وتنزل، والحاجة قريبة ولا في أنهي ناحية، ولو تهت.
  ar: أن تقول تدخل وتخرج وتصعد وتنزل، وأنّ الشيء قريب أو في أيّ ناحية، وإن ضللت الطريق.
  en: Say go in, out, up and down, that something is near or on which side, and that you're lost.
slides:
  - title: Mlebu, Mas!
    body:
      ar_eg: |
        mlebu = يدخل، metu = يخرج: Mlebu, Mas! = اتفضّل ادخل يا ماس!
        munggah = يطلع لفوق، mudhun = ينزل (ومن العربية كمان): Mudhun ndek kene = هنزل هنا.
        cedhak = قريب: cedhak kene = قريب من هنا.
        sisih = ناحية: sisih kiwa = الناحية الشمال.
        liwat = يعدّي من: Liwat ngarep masjid = عدّي من قدام الجامع.
        kesasar = تاه في الطريق: Aku kesasar! = أنا تايه!
      ar: |
        mlebu = يدخل، metu = يخرج: Mlebu, Mas! = تفضّل بالدخول يا أخي!
        munggah = يصعد، mudhun = ينزل (ومن المركبة أيضًا): Mudhun ndek kene = أنزل هنا.
        cedhak = قريب: cedhak kene = قريب من هنا.
        sisih = جهة، ناحية: sisih kiwa = الجهة اليسرى.
        liwat = يمرّ من: Liwat ngarep masjid = مُرّ من أمام المسجد.
        kesasar = ضلّ الطريق: Aku kesasar! = ضللت الطريق!
      en: |
        mlebu = go in, metu = go out: Mlebu, Mas! = Come in, Mas!
        munggah = go up, mudhun = go down, get off: Mudhun ndek kene = I'll get off here.
        cedhak = near: cedhak kene = near here.
        sisih = side: sisih kiwa = the left side.
        liwat = go via, pass: Liwat ngarep masjid = Go past the front of the mosque.
        kesasar = get lost: Aku kesasar! = I'm lost!
    examples:
      - text: Mudhun ndek kene, Pak.
        ar_eg: هنزل هنا يا عم.
        ar: سأنزل هنا يا سيّدي.
        en: I'll get off here, sir.
      - text: Stasiune cedhak kene.
        ar_eg: المحطة قريبة من هنا.
        ar: المحطّة قريبة من هنا.
        en: The station is near here.
      - text: Aku kesasar, Cak!
        ar_eg: أنا تهت يا تشاك!
        ar: ضللت الطريق يا تشاك!
        en: I'm lost, Cak!
