schema: kabar.lesson/v1
id: j4.u03.l04
language: jv
title: Ngaturi rawuh
can_do:
  ar_eg: تعزم حد كبير على مناسبة.
  ar: أن تدعو الكبير إلى مناسبة.
  en: Invite an elder to an event.
slides:
  - title: Kula ngaturi, Bapak rawuh
    body:
      ar_eg: |
        خلّصت كورس الجاوي، وعامل syukuran (عزومة شكر) يوم السبت. syukuran جاية من العربي «شكر».
        العزومة الجاوية فيها الاتنين مع بعض: إنت بتنزّل نفسك (matur، ngaturi)، والكبير بيترفع (rawuh، dalem).
        والكبير لما يرد عن نفسه بيقول الكلام العادي: «Kula badhe dhateng» (هاجي)، مش «rawuh».
      ar: |
        أنهيت دورة الجاوية، وتقيم syukuran (وليمة شكر) يوم السبت، وsyukuran من العربية «شكر».
        والدعوة الجاوية تجمع الأمرين: تخفض نفسك (matur، ngaturi) وترفع الكبير (rawuh، dalem).
        والكبير إذا أجاب عن نفسه قال الكلام العادي: «Kula badhe dhateng» لا «rawuh».
      en: |
        You've finished your Javanese course and you're holding a syukuran (a thanksgiving get-together) on Saturday. syukuran comes from Arabic «شكر».
        A Javanese invitation uses both directions at once: you lower yourself (matur, ngaturi) and raise the elder (rawuh, dalem).
        When the elder answers about himself, he uses the plain word: "Kula badhe dhateng" (I'll come), not rawuh.
    grammar: jv.krama-andhap
    examples:
      - text: Kula ngaturi Bapak rawuh wonten syukuran kula.
        ar_eg: يشرّفني إن حضرتك تيجي عزومة الشكر بتاعتي.
        ar: يشرّفني حضوركم وليمة الشكر التي أقيمها.
        en: I'd be honoured if you came to my syukuran, sir.
      - text: Inggih, kula badhe dhateng.
        ar_eg: حاضر، هاجي.
        ar: نعم، سآتي.
        en: Yes, I'll come.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: تعزم Pak Harsono على الـ syukuran بتاعتك. تقول إيه؟
      ar: تدعو Pak Harsono إلى وليمة الشكر. ماذا تقول؟
      en: You invite Pak Harsono to your syukuran. What do you say?
    options: ['Kula ngaturi Bapak rawuh wonten syukuran kula.', 'Mangga Bapak sowan dhateng syukuran kula.', 'Kula ngaturaken Bapak dhateng syukuran.']
    answer: 0
    explain:
      ar_eg: ngaturi (أعزم بتواضع) + rawuh (هو ييجي). sowan مينفعش تطلبها منه، وngaturaken لتقديم حاجة.
      ar: ngaturi (أدعو بتواضع) + rawuh (مجيئه)، ولا تُطلب منه sowan، وngaturaken لتقديم الأشياء.
      en: ngaturi (I invite humbly) + rawuh (he comes). You can't ask him to sowan; ngaturaken is for offering things.
    words: [ngaturi, rawuh, syukuran]
  - id: e02
    type: listen
    text: Setu sonten kula damel syukuran.
    options: ['Setu enjing kula damel syukuran.', 'Setu sonten kula sowan Simbah.', 'Setu sonten kula damel syukuran.']
    answer: 2
    meaning:
      ar_eg: يوم السبت العصر عامل عزومة شكر.
      ar: سأقيم وليمة شكر مساء السبت.
      en: On Saturday afternoon I'm holding a syukuran.
    words: [syukuran]
  - id: e03
    type: fill_blank
    sentence: Kula ___ Bapak rawuh.
    meaning:
      ar_eg: يشرّفني إن حضرتك تيجي.
      ar: يشرّفني حضوركم.
      en: I'd be honoured if you came, sir.
    answers: [ngaturi]
    words: [ngaturi]
  - id: e04
    type: fill_blank
    sentence: Inggih, Mas, kula badhe ___.
    meaning:
      ar_eg: (Pak Sastro بيرد) حاضر يا ابني، هاجي.
      ar: (يجيب Pak Sastro) نعم يا بني، سآتي.
      en: (Pak Sastro answers) Yes, I'll come.
    options: [rawuh, dhateng, sowan]
    answers: [dhateng]
    explain:
      ar_eg: Pak Sastro بيتكلم عن نفسه، فمش هيقول rawuh. وsowan للزيارة بتواضع لحد أكبر منه. يبقى dhateng.
      ar: يتحدث Pak Sastro عن نفسه فلا يقول rawuh، وsowan لزيارة من هو أكبر؛ فتكون dhateng.
      en: "Pak Sastro is talking about himself, so not rawuh; sowan is visiting someone above you. So: dhateng."
    words: [dhateng, rawuh]
  - id: e05
    type: build_sentence
    source:
      ar_eg: يا تيتة، يشرّفني إنك تيجي عزومة الشكر بتاعتي.
      ar: يا جدتي، يشرّفني حضورك وليمة الشكر التي أقيمها.
      en: Grandma, I'd be honoured if you came to my syukuran.
    answer: Mbah, kula ngaturi Simbah rawuh wonten syukuran kula.
    distractors: [sowan, ngaturaken]
    words: [ngaturi, rawuh, syukuran]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Pak Sastro) بعد إذنك يا أستاذ، تقدر تيجي السبت العصر؟
      ar: (إلى Pak Sastro) لو سمحت يا سيدي، هل تستطيع الحضور مساء السبت؟
      en: (to Pak Sastro) May I ask, sir, can you come on Saturday afternoon?
    answers: ['Nyuwun pirsa, Pak, Setu sonten saged rawuh?', 'Nyuwun pirsa, Pak, Bapak saged rawuh Setu sonten?', 'Nyuwun pirsa, Pak, panjenengan saged rawuh Setu sonten?', 'Nyuwun pirsa, Pak, Setu sonten Bapak saged rawuh?', 'Nyuwun pirsa, Pak, Setu sonten panjenengan saged rawuh?', 'Nyuwun pirsa, Bapak saged rawuh Setu sonten?']
    explain:
      ar_eg: nyuwun pirsa (بداية السؤال المتواضعة) + saged (يقدر) + rawuh (ييجي، للكبير).
      ar: nyuwun pirsa (مفتتح السؤال) + saged (يستطيع) + rawuh (للكبير).
      en: nyuwun pirsa (humble opener) + saged (can) + rawuh (come, for the elder).
    words: [nyuwun pirsa, rawuh]
  - id: e07
    type: dictation
    text: Kula nyuwun pamit rumiyin, Pak.
    meaning:
      ar_eg: أستأذن أنا يا أستاذ.
      ar: أستأذنكم في الانصراف يا سيدي.
      en: Please excuse me, I'll be going, sir.
    words: [nyuwun pamit]
  - id: e08
    type: speaking
    text: Matur nuwun sampun rawuh wonten syukuran kula.
    meaning:
      ar_eg: شكرًا إنكم شرّفتوا عزومة الشكر بتاعتي.
      ar: شكرًا لتشريفكم وليمة الشكر.
      en: Thank you for coming to my syukuran.
    words: [rawuh, syukuran]
dialogue:
  title: Ngaturi Pak Sastro
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Pak, kula badhe matur.
      ar_eg: لا مؤاخذة يا أستاذ، عايز أقول لحضرتك حاجة.
      ar: عفوًا يا سيدي، أودّ أن أقول لكم شيئًا.
      en: Excuse me, sir, I'd like to tell you something.
    - speaker: Pak Sastro
      text: Inggih, Mas. Wonten menapa?
      ar_eg: اتفضل يا ابني. فيه إيه؟
      ar: تفضّل يا بني. ما الأمر؟
      en: Yes? What is it?
    - speaker: Mohamed
      text: Setu sonten kula damel syukuran. Kula ngaturi Bapak rawuh.
      ar_eg: السبت العصر عامل عزومة شكر، ويشرّفني إن حضرتك تيجي.
      ar: سأقيم وليمة شكر مساء السبت، ويشرّفني حضوركم.
      en: On Saturday afternoon I'm holding a syukuran. I'd be honoured if you came.
    - speaker: Pak Sastro
      text: Wah, matur nuwun. Jam pinten, Mas?
      ar_eg: الله، متشكر. الساعة كام يا ابني؟
      ar: شكرًا لك. في أي ساعة يا بني؟
      en: Oh, thank you. What time?
    - speaker: Mohamed
      text: Jam pitu, wonten dalemipun Pak Harsono.
      ar_eg: الساعة سبعة، في بيت الأستاذ هارسونو.
      ar: في السابعة، في بيت الأستاذ هارسونو.
      en: At seven, at Pak Harsono's house.
    - speaker: Pak Sastro
      text: Inggih, Mas, kula badhe dhateng.
      ar_eg: حاضر يا ابني، هاجي.
      ar: حسنًا يا بني، سآتي.
      en: All right, I'll come.
new_words:
  - word: syukuran
    pos: noun
    ar_eg: عزومة / تجمّع شكر لله على حاجة حلوة
    ar: وليمة أو اجتماع شكرًا لله على نعمة
    en: thanksgiving get-together (for good news, a new house, a finished course) = syukuran
    arabic: شكر
    bridge: syukur
