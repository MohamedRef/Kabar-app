  - id: e03
    type: listen
    text: Kula sampun nampi seratipun, Pak.
    question:
      ar_eg: عمل إيه بالجواب؟
      ar: ماذا فعل بالرسالة؟
      en: What did he do with the letter?
    options: [استلم الجواب, سلّم الجواب, نسي الجواب]
    answer: 0
    meaning:
      ar_eg: استلمت الجواب يا أستاذ.
      ar: لقد استلمتُ الرسالة يا سيدي.
      en: I've received the letter, sir.
    words: [nampi]
  - id: e04
    type: fill_blank
    sentence: Kula ___ unjukan dhateng Simbah.
    meaning:
      ar_eg: أنا ___ مشروب لتيتة.
      ar: ___ الشراب للجدّة.
      en: I ___ Grandma a drink.
    options: [caos, nampi, salim]
    answers: [caos]
    words: [caos, nampi, salim]
    explain:
      ar_eg: تقدّم للكبير بتواضع = caos. nampi يعني تستلم، وsalim سلام بالإيد.
      ar: التقديم للكبير بتواضع = caos، أما nampi فمعناه تستلم، وsalim التحيّة باليد.
      en: Humbly serving an elder is caos. nampi means "receive", salim is the hand greeting.
  - id: e05
    type: multiple_choice
    question: Aku wis ___ layange.
    question_meaning:
      ar_eg: أنا ___ الجواب خلاص.
      ar: لقد ___ الرسالة.
      en: I've ___ the letter.
    options: [nampi, ngladosi, nampa]
    answer: 2
    explain:
      ar_eg: الجملة نغوكو (aku، wis)، فبنقول nampa. بالكراما nampi.
      ar: الجملة نغوكو (aku وwis) فنقول nampa، وبالكراما nampi.
      en: The sentence is ngoko (aku, wis), so nampa. In krama it's nampi.
    words: [nampa, nampi, ngladosi]
  - id: e06
    type: fill_blank
    sentence: Mohamed ___ dhayoh wonten pendhapa.
    meaning:
      ar_eg: محمد ___ الضيوف في البندوبو.
      ar: محمد ___ الضيوف في البندوبو.
      en: Mohamed is ___ the guests in the pendhapa.
    options: [ngladosi, nyaosaken, sungkem]
    answers: [ngladosi]
    words: [ngladosi, nyaosaken, sungkem]
    explain:
      ar_eg: يخدم الضيوف بالكراما = ngladosi. nyaosaken يسلّم حاجة، وsungkem للكبير في العيد.
      ar: يخدم الضيوف بالكراما = ngladosi، أما nyaosaken فيسلّم شيئًا، وsungkem للكبير في العيد.
      en: Serving guests in krama is ngladosi. nyaosaken is handing something over, sungkem is the Lebaran homage.
  - id: e07
    type: build_sentence
    source:
      ar_eg: هسلّم الجواب للأستاذ.
      ar: سأسلّم الرسالة إلى الأستاذ.
      en: I'll hand the letter to the gentleman.
    answer: Kula nyaosaken serat dhateng Bapak.
    distractors: [nampa, ngladeni]
    words: [nyaosaken, nampa, ngladeni]
    explain:
      ar_eg: تسلّم الكبير حاجة = nyaosaken. nampa يعني تستلم، وngladeni تخدم.
      ar: تسليم الكبير شيئًا = nyaosaken، أما nampa فمعناه تستلم، وngladeni تخدم.
      en: Handing an elder something is nyaosaken. nampa means "receive", ngladeni "serve".
  - id: e08
    type: translate
    direction: from_target
    source_text: Bocah iku salim karo Simbah.
    answers_meaning:
      ar_eg: [الواد ده سلّم على تيتة وباس إيدها, العيل باس إيد تيتة]
      ar: [حيّا الطفل الجدّة وقبّل يدها, قبّل الطفل يد الجدّة]
      en: [The child greeted Grandma by kissing her hand, 'The kid kissed Grandma''s hand']
    words: [salim]
  - id: e09
    type: speaking
    text: Ing riyaya, kula sungkem dhateng Bapak lan Ibu.
    meaning:
      ar_eg: في العيد بعمل سونجكيم لبابا وماما.
      ar: في العيد أجثو أمام أبي وأمّي طالبًا الصفح.
      en: At Lebaran I kneel before my father and mother.
    words: [sungkem]
  - id: e10
    type: multiple_choice
    question: Mas Dimas ___ kanca-kancane ing warung.
    question_meaning:
      ar_eg: ماس ديماس ___ صحابه في القهوة.
      ar: ماس ديماس ___ أصدقاءه في المقهى.
      en: Mas Dimas is ___ his friends at the warung.
    options: [ngladeni, caos, sungkem]
    answer: 0
    explain:
      ar_eg: ngladeni = يخدم (نغوكو، مع الصحاب). caos للكبير.
      ar: ngladeni = يخدم (نغوكو، مع الأصدقاء)، أما caos فللكبير.
      en: ngladeni = serve (ngoko, among friends). caos is for elders.
    words: [ngladeni, caos, sungkem]
dialogue:
  lines:
    - speaker: Bu Harsono
      text: Mas, mangga caos unjukan dhateng Pak Sastro.
      ar_eg: يا ماس، قدّم المشروب لباك ساسترو لو سمحت.
      ar: يا ماس، تفضّل قدّم الشراب لباك ساسترو.
      en: Mas, please serve Pak Sastro his drink.
    - speaker: Mohamed
      text: Mangga, Pak, unjukanipun.
      ar_eg: اتفضل يا أستاذ، المشروب.
      ar: تفضّل يا سيدي، شرابك.
      en: Here you are, sir, your drink.
    - speaker: Pak Sastro
      text: Matur nuwun, Nak.
      ar_eg: شكرًا يا ابني.
      ar: شكرًا يا بنيّ.
      en: Thank you, son.
    - speaker: Mohamed
      text: Menika serat saking Pak Harsono, Pak.
      ar_eg: ده جواب من باك هارسونو يا أستاذ.
      ar: هذه رسالة من باك هارسونو يا سيدي.
      en: Here's a letter from Pak Harsono, sir.
    - speaker: Pak Sastro
      text: Sampun kula tampi. Matur nuwun sanget.
      ar_eg: استلمته. شكرًا جزيلًا.
      ar: لقد استلمتها. شكرًا جزيلًا.
      en: Received. Thank you very much.
    - speaker: Mohamed
      text: Sami-sami, Pak.
      ar_eg: العفو يا أستاذ.
      ar: عفوًا يا سيدي.
      en: You're welcome, sir.
