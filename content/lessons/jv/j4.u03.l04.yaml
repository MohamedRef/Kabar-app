schema: kabar.lesson/v1
id: j4.u03.l04
language: jv
title: Caos unjukan
can_do:
  ar_eg: تقدّم مشروب وتسلّم حاجة لحد كبير بتواضع، وتقول إنك استلمت، وتسلّم على الكبار.
  ar: أن تقدّم شرابًا وتسلّم شيئًا لكبير بتواضع، وتقول إنك استلمت، وتحيّي الكبار.
  en: Humbly serve a drink and hand something to an elder, say you've received something, and greet elders properly.
slides:
  - title: Caos, nampi, salim
    body:
      ar_eg: |
        krama andhap = كلمات بتنزّل بيها نفسك لما تعمل حاجة للكبير:
        - caos = يقدّم للكبير: «Kula caos unjukan dhateng Simbah.» nyaosaken = يسلّم حاجة للكبير بإيده: «Kula nyaosaken serat dhateng Bapak.»
        - يستلم: nampa (نغوكو) ← nampi (كراما): «Sampun kula tampi» = استلمته.
        - يخدم: ngladeni (نغوكو) ← ngladosi (كراما).
        - salim = يسلّم على الكبير ويقرّب إيده من مناخيره أو يبوسها، زي بوسة الإيد عندنا.
        - sungkem = أعمق: يقعد قدام الكبير ويبوس ركبته أو إيده ويطلب السماح، في العيد والفرح.
      ar: |
        krama andhap = كلمات تتواضع بها حين تفعل شيئًا للكبير:
        - caos = يقدّم للكبير: «Kula caos unjukan dhateng Simbah.» وnyaosaken = يسلّم الكبيرَ شيئًا بيده: «Kula nyaosaken serat dhateng Bapak.»
        - يستلم: nampa (نغوكو) ← nampi (كراما): «Sampun kula tampi» = استلمته.
        - يخدم: ngladeni (نغوكو) ← ngladosi (كراما).
        - salim = يحيّي الكبير ويقرّب يده من أنفه أو يقبّلها، كتقبيل اليد عندنا.
        - sungkem = أعمق: يجلس أمام الكبير ويقبّل ركبته أو يده طالبًا الصفح، في العيد والعرس.
      en: |
        krama andhap = words that lower yourself when you do something for an elder:
        - caos = offer to an elder: "Kula caos unjukan dhateng Simbah." nyaosaken = hand something to an elder: "Kula nyaosaken serat dhateng Bapak."
        - receive: nampa (ngoko) → nampi (krama): "Sampun kula tampi" = I've received it.
        - serve: ngladeni (ngoko) → ngladosi (krama).
        - salim = greet an elder by bringing their hand to your nose or lips, like kissing an elder's hand in Egypt.
        - sungkem = deeper: kneel before an elder, kiss their knee or hand and ask forgiveness, at Lebaran and weddings.
    examples:
      - text: Kula caos unjukan dhateng Simbah.
        ar_eg: أنا بقدّم مشروب لتيتة.
        ar: أقدّم الشراب للجدّة.
        en: I'm serving Grandma a drink.
      - text: Putra-putra salim dhateng Simbah.
        ar_eg: العيال بيسلّموا على تيتة ويبوسوا إيدها.
        ar: يحيّي الأولاد الجدّة ويقبّلون يدها.
        en: The children greet Grandma by kissing her hand.
      - text: Ing riyaya, kula sungkem dhateng Bapak lan Ibu.
        ar_eg: في العيد بعمل سونجكيم لبابا وماما.
        ar: في العيد أجثو أمام أبي وأمّي طالبًا الصفح.
        en: At Lebaran I kneel before my father and mother to ask forgiveness.
