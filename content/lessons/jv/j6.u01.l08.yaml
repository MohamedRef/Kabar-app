dialogue:
  lines:
    - speaker: Pak Harjo
      text: Sugeng rawuh ing Kutha Gedhe, Mas.
      ar_eg: أهلًا بيك في كوتاجيدي.
      ar: مرحبًا بك في كوتاغيدي.
      en: Welcome to Kotagede.
    - speaker: Mohamed
      text: Matur nuwun, Pak. Menapa leres Kutha Gedhe menika ibukutha Mataram rumiyin?
      ar_eg: شكرًا يا عم. صحيح كوتاجيدي كانت عاصمة ماتارام زمان؟
      ar: شكرًا يا سيدي. أصحيح أن كوتاغيدي كانت عاصمة ماتارام قديمًا؟
      en: Thank you, sir. Is it true Kotagede was once Mataram's capital?
    - speaker: Pak Harjo
      text: Leres. Panembahan Senapati jumeneng raja ing ngriki.
      ar_eg: صح. بانمباهان سيناباتي بقى ملك هنا.
      ar: صحيح. تولّى بانمباهان سيناباتي الملك هنا.
      en: Yes. Panembahan Senapati became king here.
    - speaker: Mohamed
      text: Tembok menika menapa, Pak?
      ar_eg: والحيطة دي إيه يا عم؟
      ar: وما هذا الجدار يا سيدي؟
      en: What's this wall, sir?
    - speaker: Pak Harjo
      text: Menika benteng cepuri. Rumiyin wonten jagangipun.
      ar_eg: ده سور التشيبوري. وكان زمان حواليه خندق.
      ar: هذا سور التشيبوري. وكان حوله خندق قديمًا.
      en: That's the cepuri wall. There used to be a moat round it.
    - speaker: Mohamed
      text: Wit wringin menika ageng sanget!
      ar_eg: شجرة التين البنغالي دي كبيرة أوي!
      ar: شجرة التين البنغالي هذه ضخمة جدًا!
      en: This banyan tree is enormous!
