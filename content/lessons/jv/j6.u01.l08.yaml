    question:
      ar_eg: فيه إيه قدام المقابر؟
      ar: ماذا يوجد أمام المدافن؟
      en: What's in front of the graves?
    options: [شجرة تين بنغالي كبيرة قدام المقابر, سور قديم, خندق مليان مية]
    answer: 0
    meaning:
      ar_eg: قدام المقابر فيه شجرة تين بنغالي كبيرة.
      ar: أمام المدافن شجرة تين بنغالي كبيرة.
      en: In front of the graves there's a big banyan tree.
