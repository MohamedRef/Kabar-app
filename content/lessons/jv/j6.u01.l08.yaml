    direction: from_target
    source_text: Benteng cepuri iku tembok sing ngubengi kraton.
    answers_meaning:
      ar_eg: [سور التشيبوري هو الحيطة اللي حوالين القصر, التشيبوري سور بيلف حوالين القصر]
