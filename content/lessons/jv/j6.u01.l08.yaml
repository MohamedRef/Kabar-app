id: j6.u01.l08
language: jv
title: Kutha Gedhe biyen
can_do:
  ar_eg: 'تفهم تاريخ كوتاجيدي من حارس المقابر: الملك الأول والسور والخندق ومقابر الملوك.'
  ar: 'أن تفهم تاريخ كوتاغيدي من حارس المقابر: الملك الأول والسور والخندق ومقابر الملوك.'
  en: 'Follow a guide''s account of Kotagede''s past: the first king, the walls, the moat and the royal graves.'
slides:
  - title: Ibukutha Mataram
    body:
      ar_eg: |
        كوتاجيدي كانت أول عاصمة لمملكة ماتارام الإسلامية. panembahan = لقب ملكي، وsenapati = قائد الجيش: Panembahan Senapati أول ملوكها.
        benteng = سور حصن، cepuri = السور الجوّاني حوالين القصر، jagang = خندق.
        pasareyan = مقابر (كلمة مؤدبة، للملوك والكبار)، wringin = شجرة التين البنغالي، kesohor = مشهور.
      ar: |
        كانت كوتاغيدي أول عاصمة لمملكة ماتارام الإسلامية. panembahan = لقب ملكي، وsenapati = قائد الجيش: وكان Panembahan Senapati أول ملوكها.
        benteng = سور حصن، cepuri = السور الداخلي حول القصر، jagang = خندق.
        pasareyan = مدافن (لفظ مهذّب للملوك والأكابر)، wringin = شجرة التين البنغالي، kesohor = مشهور.
      en: |
        Kotagede was the first capital of the Islamic Mataram kingdom. panembahan = a royal title, senapati = army commander: Panembahan Senapati was its first king.
        benteng = fort wall, cepuri = the inner wall round the palace, jagang = moat.
        pasareyan = graves (respectful word, for kings and elders), wringin = banyan tree, kesohor = famous.
    examples:
      - text: Kutha Gedhe iku kutha kesohor, ibukutha Mataram biyen.
        ar_eg: كوتاجيدي مدينة مشهورة، كانت عاصمة ماتارام زمان.
        ar: كوتاغيدي مدينة مشهورة، كانت عاصمة ماتارام قديمًا.
        en: Kotagede is a famous town, once the capital of Mataram.
      - text: Panembahan Senapati disarekake ing pasareyan Kutha Gedhe.
        ar_eg: بانمباهان سيناباتي مدفون في مقابر كوتاجيدي.
        ar: دُفن بانمباهان سيناباتي في مدافن كوتاغيدي.
        en: Panembahan Senapati is buried in the Kotagede royal graves.
      - text: Benteng lan jagang lawas isih katon.
        ar_eg: السور والخندق القديم لسه باينين.
        ar: ما زال السور والخندق القديمان ظاهرين.
        en: The old wall and moat can still be seen.
