schema: kabar.lesson/v1
id: j2.u06.l02
language: jv
title: Apik banget, apik tenan
can_do:
  ar_eg: تقوّي الوصف بكلمات زي «أوي» و«بجد».
  ar: أن تقوّي الوصف بألفاظ مثل «جدًا» و«حقًا».
  en: Intensify.
slides:
  - title: Banget, tenan
    body:
      ar_eg: |
        - banget = sangat (أوي). أصلها جاوي، والإندونيسي العامي أخدها: apik banget = حلو أوي.
        - tenan = sungguh / beneran (بجد): Apik tenan! = حلو بجد! وفي سؤال: Tenan? = بجد؟
        الاتنين بييجوا بعد الصفة، زي «حلو أوي»: apik banget، مش banget apik.
      ar: |
        - banget = sangat (جدًا)، وهي جاوية الأصل دخلت العامية الإندونيسية: apik banget = جميل جدًا.
        - tenan = sungguh (حقًا): Apik tenan! = جميل حقًا! وفي السؤال: Tenan? = حقًا؟
        وكلاهما بعد الصفة: apik banget لا banget apik.
      en: |
        - banget = sangat (very). It's originally Javanese; casual Indonesian borrowed it: apik banget = really nice.
        - tenan = sungguh / beneran (really): Apik tenan! = Really nice! As a question: Tenan? = Really?
        Both follow the adjective: apik banget, not banget apik.
    grammar: jv.intensifier
    examples:
      - text: Klambine apik banget.
        ar_eg: القميص حلو أوي.
        ar: القميص جميل جدًا.
        en: The shirt is really nice.
      - text: Bentenge apik tenan!
        ar_eg: القلعة حلوة بجد!
        ar: القلعة جميلة حقًا!
        en: The fort is really beautiful!
  - title: Enak pol! Uenak!
    body:
      ar_eg: |
        - pol = «للآخر / خالص»، عامية الشباب: Enak pol! = طعمه جامد جدًا.
        - شرق جاوة وسورابايا (Arek) بيمطّوا الصفة بـ u: uenak (حلووو)، puanas (حررر)، guedhe (كبيييير).
        المطّ ده للكلام والشات بس، زي ما بنكتب «حلووو»، مش للكتابة الرسمية.
      ar: |
        - pol = إلى أقصى حد، في عامية الشباب: Enak pol! = لذيذ للغاية.
        - ويمد أهل شرق جاوة وسورابايا (Arek) الصفة بإدخال u: uenak، puanas، guedhe.
        والمدّ للكلام والدردشة فقط، كقولنا «حلووو»، لا للكتابة الرسمية.
      en: |
        - pol = "to the max", young people's slang: Enak pol! = Insanely good.
        - East Java and Surabaya (Arek) stretch adjectives with u: uenak (sooo good), puanas (sooo hot), guedhe (huuuge).
        Stretching is for speech and chat only, like typing «حلووو» — never formal writing.
    grammar: jv.intensifier
    examples:
      - text: Es dawet iki enak pol!
        ar_eg: الدَّوِت ده طعمه جامد جدًا!
        ar: مشروب الداوت هذا لذيذ للغاية!
        en: This es dawet is insanely good!
      - text: Saiki puanas, rek!
        ar_eg: الجو حررر النهارده يا جماعة! (سورابايا)
        ar: الجو حار جدًا الآن يا جماعة! (سورابايا)
        en: It's sooo hot now, guys! (Surabaya)
  - title: Rada, kurang, … dhewe
    body:
      ar_eg: |
        - rada = agak (شوية)، قبل الصفة: rada larang = غالي شوية.
        - kurang = kurang (مش كفاية): kurang asin = ناقص ملح.
        - الأكتر (paling): الصفة + dhewe، أو sing paling + الصفة:
          Omahe Pak Budi gedhe dhewe. = بيت باك بودي هو الأكبر.
          Iki sing paling murah. = ده أرخص واحد.
        الإملا: dhewe في الكتب، dhewe أو dewe في الشات.
      ar: |
        - rada = agak (قليلًا) قبل الصفة: rada larang = غالٍ قليلًا.
        - kurang = غير كافٍ: kurang asin = ينقصه ملح.
        - التفضيل (paling): الصفة + dhewe، أو sing paling + الصفة:
          Omahe Pak Budi gedhe dhewe. = بيت باك بودي هو الأكبر.
          Iki sing paling murah. = هذا هو الأرخص.
        والإملاء: dhewe في الكتب، وdhewe أو dewe في الدردشة.
      en: |
        - rada = agak (a bit), before the adjective: rada larang = a bit pricey.
        - kurang = not enough: kurang asin = needs salt.
        - The most (paling): adjective + dhewe, or sing paling + adjective:
          Omahe Pak Budi gedhe dhewe. = Pak Budi's house is the biggest.
          Iki sing paling murah. = This is the cheapest.
        Spelling: dhewe in books, dhewe or dewe in chats.
    grammar: jv.intensifier
    examples:
      - text: Regane rada larang.
        ar_eg: السعر غالي شوية.
        ar: الثمن غالٍ قليلًا.
        en: It's a bit expensive.
      - text: Sing iki paling murah.
        ar_eg: ده أرخص واحد.
        ar: هذا هو الأرخص.
        en: This one is the cheapest.
  - title: Seneng, sedhih, kesel
    body:
      ar_eg: |
        كلمات المشاعر، وتقدر تقويها بنفس الطريقة:
        - seneng = senang (مبسوط) · sedhih = sedih (زعلان)
        - kesel = capek (تعبان) — مش «kesal» الإندونيسي (متضايق)!
        - wedi = takut (خايف) · bosen = bosan (زهقان)
        Aku seneng banget. = أنا مبسوط أوي. · Aku rada kesel. = أنا تعبان شوية.
      ar: |
        ألفاظ المشاعر، وتُقوّى بالطريقة نفسها:
        - seneng = senang (سعيد) · sedhih = sedih (حزين)
        - kesel = capek (متعب)، لا «kesal» الإندونيسية (منزعج)!
        - wedi = takut (خائف) · bosen = bosan (ضَجِر)
        Aku seneng banget. = أنا سعيد جدًا. · Aku rada kesel. = أنا متعب قليلًا.
      en: |
        Feeling words — intensify them the same way:
        - seneng = senang (happy) · sedhih = sedih (sad)
        - kesel = capek (tired) — not Indonesian kesal (annoyed)!
        - wedi = takut (afraid) · bosen = bosan (bored)
        Aku seneng banget. = I'm so happy. · Aku rada kesel. = I'm a bit tired.
    grammar: jv.intensifier
    examples:
      - text: Aku kesel tenan.
        ar_eg: أنا تعبان بجد.
        ar: أنا متعب حقًا.
        en: I'm really tired.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: banget
        ar_eg: أوي
        ar: جدًا
        en: very
      - text: tenan
        ar_eg: بجد
        ar: حقًا
        en: really
      - text: rada
        ar_eg: شوية
        ar: قليلًا
        en: a bit
      - text: kesel
        ar_eg: تعبان
        ar: متعب
        en: tired
      - text: wedi
        ar_eg: خايف
        ar: خائف
        en: afraid
    words: [banget, tenan, rada, kesel, wedi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «ده أرخص واحد». أنهي صح؟
      ar: «هذا هو الأرخص». أيّها الصحيح؟
      en: '"This is the cheapest." Which is right?'
    options: [Iki sing paling murah., Iki rada murah., Iki murah banget.]
    answer: 0
    explain:
      ar_eg: murah banget = رخيص أوي، بس مش بالضرورة الأرخص. الأكتر = sing paling أو dhewe.
      ar: murah banget = رخيص جدًا لا الأرخص، والتفضيل بـ sing paling أو dhewe.
      en: murah banget = very cheap, not necessarily the cheapest; "the most" is sing paling or dhewe.
    words: [paling, murah]
  - id: e03
    type: listen
    text: Klambine apik banget.
    options: [Klambine rada apik., Klambine apik dhewe., Klambine apik banget.]
    answer: 2
    words: [apik, banget]
  - id: e04
    type: fill_blank
    sentence: Aku kesel ___!
    meaning:
      ar_eg: أنا تعبان بجد!
      ar: أنا متعب حقًا!
      en: I'm really tired!
    options: [rada, kurang, tenan]
    answers: [tenan]
    words: [kesel, tenan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: القلعة حلوة بجد.
      ar: القلعة جميلة حقًا.
      en: The fort is really beautiful.
    answer: Bentenge apik tenan.
    distractors: [rada, paling]
    words: [apik, tenan]
  - id: e06
    type: speaking
    text: Enak pol!
    meaning:
      ar_eg: طعمه جامد جدًا!
      ar: لذيذ للغاية!
      en: Insanely good!
    words: [pol, enak]
dialogue:
  title: Neng Benteng Pendem
  lines:
    - speaker: Dimas
      text: Piye, Mohamed? Bentenge apik ora?
      ar_eg: إيه رأيك يا محمد؟ القلعة حلوة؟
      ar: ما رأيك يا محمد؟ هل القلعة جميلة؟
      en: So, Mohamed? Is the fort nice?
    - speaker: Mohamed
      text: Apik tenan! Gedhe banget.
      ar_eg: حلوة بجد! كبيرة أوي.
      ar: جميلة حقًا! كبيرة جدًا.
      en: Really beautiful! It's huge.
    - speaker: Dimas
      text: Saiki panas banget, ya.
      ar_eg: الجو حر أوي دلوقتي، صح؟
      ar: الجو حارّ جدًا الآن، أليس كذلك؟
      en: It's really hot now, isn't it?
    - speaker: Mohamed
      text: Iya. Aku rada kesel.
      ar_eg: أيوه. أنا تعبان شوية.
      ar: نعم. أنا متعب قليلًا.
      en: Yes. I'm a bit tired.
    - speaker: Dimas
      text: Ayo ngombe es dawet. Enak pol!
      ar_eg: يلا نشرب دَوِت بتلج. طعمه جامد جدًا!
      ar: هيا نشرب الداوت المثلّج. لذيذ للغاية!
      en: Let's have an es dawet. It's insanely good!
    - speaker: Mohamed
      text: Ayo! Aku seneng banget neng Ngawi.
      ar_eg: يلا! أنا مبسوط أوي في نغاوي.
      ar: هيا! أنا سعيد جدًا في نغاوي.
      en: Let's go! I'm so happy in Ngawi.
new_words:
  - word: banget
    pos: adverb
    ar_eg: أوي
    ar: جدًا
    en: very (sangat)
  - word: pol
    pos: adverb
    ar_eg: للآخر / جدًا (عامية)
    ar: للغاية (عامية)
    en: totally, "to the max" (slang)
  - word: puanas / uenak
    pos: adjective
    ar_eg: حررر / حلووو (مطّ شرق جاوة)
    ar: حارّ جدًا / لذيذ جدًا (مدّ شرق جاوة)
    en: sooo hot / sooo good (East Java stretch)
  - word: dhewe
    pos: adverb
    ar_eg: الأكتر (بعد الصفة)
    ar: الأكثر (بعد الصفة)
    en: the most (after an adjective)
  - word: sing paling
    pos: phrase
    ar_eg: الأكتر / أفعل
    ar: الأكثر
    en: the most (yang paling)
  - word: sedhih
    pos: adjective
    ar_eg: زعلان
    ar: حزين
    en: sad (sedih)
  - word: kesel
    pos: adjective
    ar_eg: تعبان
    ar: متعب
    en: tired (capek)
  - word: wedi
    pos: adjective
    ar_eg: خايف
    ar: خائف
    en: afraid (takut)
