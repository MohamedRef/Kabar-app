  - id: e12
    type: translate
    direction: from_target
    source_text: Saiki puanas, rek!
    answers_meaning:
      ar_eg: ["الجو حررر دلوقتي يا جماعة!", "الدنيا حر أوي دلوقتي يا جماعة", "حر نار دلوقتي يا رجالة"]
      ar: ["الجو حارّ جدًا الآن يا جماعة!", "الطقس حار جدًا الآن يا رفاق"]
      en: ["It's sooo hot now, guys!", "It's really hot now, guys", "It's boiling now, mates"]
    explain:
      ar_eg: puanas = panas بالمطّ (شرق جاوة)، وrek نداء سورابايا للأصحاب.
      ar: puanas = panas بالمدّ (شرق جاوة)، وrek نداء أهل سورابايا للأصدقاء.
      en: puanas is stretched panas (East Java); rek is Surabaya's "guys".
