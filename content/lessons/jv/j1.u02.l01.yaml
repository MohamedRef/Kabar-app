schema: kabar.lesson/v1
id: j1.u02.l01
language: jv
title: Apa, sapa, ngendi
can_do:
  ar_eg: تسأل إيه ومين وفين وإمتى.
  ar: أن تسأل ماذا ومن وأين ومتى.
  en: Ask what, who, where and when.
slides:
  - title: Apa, sapa, ngendi
    body:
      ar_eg: |
        أدوات السؤال أول حاجة لازم تعرفها، وكل واحدة ليها توأم إندونيسي:
        - apa = apa (إيه). نفس الكلمة!
        - sapa = siapa (مين).
        - ngendi (أو endi) = mana (فين). saka ngendi = dari mana (منين).
        وkapan = kapan (إمتى) — زي الإندونيسي بالظبط.
      ar: |
        أدوات الاستفهام أول ما ينبغي تعلّمه، ولكل منها نظير إندونيسي:
        - apa = apa (ماذا)، الكلمة نفسها.
        - sapa = siapa (مَن).
        - ngendi (أو endi) = mana (أين)، وsaka ngendi = dari mana (من أين).
        - kapan = kapan (متى)، كالإندونيسية تمامًا.
      en: |
        Question words come first, and each has an Indonesian twin:
        - apa = apa (what). Same word!
        - sapa = siapa (who).
        - ngendi (or endi) = mana (where). saka ngendi = dari mana (where from).
        - kapan = kapan (when) — identical to Indonesian.
    grammar: jv.question.words
    examples:
      - text: Jenengmu sapa?
        ar_eg: اسمك إيه؟ (حرفيًا «اسمك مين؟»، زي Namamu siapa?)
        ar: ما اسمك؟ (حرفيًا «اسمك مَن؟»، كـ Namamu siapa?)
        en: What's your name? (literally "your name who?", like Namamu siapa?)
      - text: Kowé saka ngendi?
        ar_eg: إنت منين؟
        ar: من أين أنت؟
        en: Where are you from?
  - title: Apa → opo
    body:
      ar_eg: |
        ليه الناس بتقول «opo» وإحنا كاتبين apa؟ الجاوي بينطق الـ a في آخر الكلمة (في المقطع المفتوح) قريبة من o.
        فالكتابة الرسمية apa، sapa، pira، والنطق والشات opo، sopo، piro.
        Kabar بيعلّمك الكتابة الرسمية، بس اعرف الاتنين — رسايل الناس هتبقى opo وpiro.
      ar: |
        لماذا يقول الناس «opo» والمكتوب apa؟ لأن الجاوية تنطق a الأخيرة في المقطع المفتوح قريبة من o.
        فالإملاء القياسي apa وsapa وpira، والنطق والدردشة opo وsopo وpiro.
        ويعلّمك Kabar الإملاء القياسي، لكن اعرف الصورتين، فالرسائل تكتب opo وpiro.
      en: |
        Why do people say "opo" when it's written apa? Javanese pronounces a final open-syllable a close to o.
        So the standard spelling is apa, sapa, pira; speech and chats say opo, sopo, piro.
        Kabar teaches the standard spelling, but know both — real messages will say opo and piro.
    grammar: jv.question.words
    examples:
      - text: apa / opo
        ar_eg: إيه (رسمي / شات)
        ar: ماذا (قياسي / دردشة)
        en: what (standard / chat)
      - text: pira / piro
        ar_eg: كام / بكام (رسمي / شات)
        ar: كم / بكم (قياسي / دردشة)
        en: how much (standard / chat)
  - title: Omahmu ngendi?
    body:
      ar_eg: |
        الجاوي بيحب يحط أداة السؤال في **الآخر** — زي المصري بالظبط:
        - Omahmu ngendi? = بيتك فين؟ (omah = rumah)
        - Regane pira? = ده بكام؟
        مش زي الفصحى «أين بيتك؟». فكّر بالمصري، هتطلع الجملة الجاوي صح.
      ar: |
        تميل الجاوية إلى وضع أداة الاستفهام في **آخر** الجملة، كالعامية المصرية:
        - Omahmu ngendi? = بيتك فين؟ (omah = rumah)
        - Regane pira? = ده بكام؟
        لا كالفصحى «أين بيتك؟»، ففكّر بالعامية تخرج الجملة الجاوية صحيحة.
      en: |
        Javanese likes the question word **last** — exactly like Egyptian Arabic:
        - Omahmu ngendi? = «بيتك فين؟» (omah = rumah)
        - Regane pira? = «ده بكام؟»
        Not like Fusha «أين بيتك؟». Think in Egyptian and the Javanese comes out right.
    grammar: jv.question.words
    examples:
      - text: Omahmu ngendi?
        ar_eg: بيتك فين؟
        ar: أين بيتك؟
        en: Where's your house?
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تعرف اسم صاحب جديد. تسأل إزاي؟
      ar: تريد معرفة اسم صديق جديد. كيف تسأل؟
      en: You want to know a new friend's name. How do you ask?
    options: ['Jenengmu ngendi?', 'Jenengmu pira?', 'Jenengmu sapa?']
    answer: 2
    explain:
      ar_eg: الاسم بـ sapa، زي Namamu siapa? pira للأرقام والأسعار.
      ar: الاسم يُسأل عنه بـ sapa كـ Namamu siapa?، وpira للعدد والثمن.
      en: Names take sapa, like Namamu siapa?; pira is for numbers and prices.
    words: [sapa, jeneng]
  - id: e02
    type: listen
    text: Kowé saka ngendi?
    options: ['Kowé ngapa?', 'Kowé saka ngendi?', 'Omahmu ngendi?']
    answer: 1
    words: [saka, ngendi]
  - id: e03
    type: fill_blank
    sentence: Omahmu ___?
    meaning:
      ar_eg: بيتك فين؟
      ar: أين بيتك؟
      en: Where's your house?
    options: [sapa, pira, ngendi]
    answers: [ngendi]
    words: [omah, ngendi]
  - id: e04
    type: build_sentence
    source:
      ar_eg: إنت منين؟
      ar: من أين أنت؟
      en: Where are you from?
    answer: Kowé saka ngendi?
    distractors: [apa, sapa]
    words: [kowé, saka, ngendi]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: اسمك إيه؟ (لصاحب)
      ar: ما اسمك؟ (لصديق)
      en: What's your name? (to a friend)
    answers: ['Jenengmu sapa?', Jenengmu sapa, 'Jenengmu sopo?', Jenengmu sopo, 'Sapa jenengmu?', Sapa jenengmu, 'Sopo jenengmu?']
    explain:
      ar_eg: jeneng = nama، -mu = بتاعك، sapa = مين. وفي الشات sopo.
      ar: jeneng = nama، و-mu للمخاطب، وsapa = مَن، وفي الدردشة sopo.
      en: jeneng = nama, -mu = your, sapa = who (chat sopo).
    words: [jeneng, sapa]
  - id: e06
    type: speaking
    text: Omahmu ngendi?
    meaning:
      ar_eg: بيتك فين؟
      ar: أين بيتك؟
      en: Where's your house?
    words: [omah, ngendi]
dialogue:
  title: Stasiun Gubeng
  lines:
    - speaker: Mas Bayu
      text: Mas, jenengmu sapa?
      ar_eg: يا كابتن، اسمك إيه؟
      ar: يا أخي، ما اسمك؟
      en: Hey, what's your name?
    - speaker: Mohamed
      text: Mohamed. Jenengmu sapa?
      ar_eg: محمد. واسمك إيه؟
      ar: محمد. وما اسمك؟
      en: Mohamed. What's yours?
    - speaker: Mas Bayu
      text: Bayu. Kowé saka ngendi?
      ar_eg: بايو. إنت منين؟
      ar: بايو. من أين أنت؟
      en: Bayu. Where are you from?
    - speaker: Mohamed
      text: Saka Kairo. Omahmu ngendi?
      ar_eg: من القاهرة. وبيتك فين؟
      ar: من القاهرة. وأين بيتك؟
      en: From Cairo. Where's your house?
    - speaker: Mas Bayu
      text: Omahku Gubeng. Ayo, Mas!
      ar_eg: بيتي في جوبينج. يلا يا كابتن!
      ar: بيتي في غوبنغ. هيا يا أخي!
      en: My house is in Gubeng. Come on!
new_words:
  - word: apa
    pos: question word
    ar_eg: إيه (= apa؛ في الشات opo)
    ar: ماذا (= apa؛ وفي الدردشة opo)
    en: what (= apa; chat opo)
  - word: sapa
    pos: question word
    ar_eg: مين (= siapa؛ في الشات sopo)
    ar: مَن (= siapa؛ وفي الدردشة sopo)
    en: who (= siapa; chat sopo)
  - word: ngendi
    pos: question word
    ar_eg: فين (= mana؛ وكمان endi)
    ar: أين (= mana؛ وتقال endi أيضًا)
    en: where (= mana; also endi)
  - word: kapan
    pos: question word
    ar_eg: إمتى (= kapan)
    ar: متى (= kapan)
    en: when (= kapan)
  - word: saka
    pos: preposition
    ar_eg: من (= dari)
    ar: من (= dari)
    en: from (= dari)
  - word: jeneng
    pos: noun
    ar_eg: اسم (= nama)
    ar: اسم (= nama)
    en: name (= nama)
  - word: omah
    pos: noun
    ar_eg: بيت (= rumah)
    ar: بيت (= rumah)
    en: house, home (= rumah)
review:
  status: draft
  verified: false
