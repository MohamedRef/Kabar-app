  - id: e03
    type: listen
    text: Bakda tarawih, aku mangan jaburan ing masjid.
    question:
      ar_eg: بياكل إمتى وفين؟
      ar: متى وأين يأكل؟
      en: When and where does he eat?
    options: [بعد التراويح باكل تسالي في الجامع, قبل الفطار بصلي, بعد العيد بسافر]
    answer: 0
    meaning:
      ar_eg: بعد التراويح باكل تسالي في الجامع.
      ar: بعد التراويح آكل وجبة خفيفة في المسجد.
      en: After tarawih I eat snacks at the mosque.
    words: [bakda, jaburan]
  - id: e04
    type: fill_blank
    sentence: Pas ___, wong-wong mangan kupat.
    meaning:
      ar_eg: في ___، الناس بتاكل كتوبات.
      ar: في ___ يأكل الناس الكتوبات.
      en: At ___, people eat ketupat.
    options: [riyaya, mutih, lawuh]
    answers: [riyaya]
    words: [riyaya, mutih, lawuh]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: صيام بالرز الأبيض والميه بس، من غير ملح ولا لحمة، اسمه …
      ar: الصيام على الأرز الأبيض والماء فقط بلا ملح ولا لحم يسمّى …
      en: Fasting on plain white rice and water, no salt or meat, is called …
    options: [pasa, mutih, jaburan]
    answer: 1
    explain:
      ar_eg: mutih = صيام بالأبيض بس. pasa صيام عادي، وjaburan تسالي.
      ar: mutih = صيام على الأبيض فقط؛ pasa صيام عادي، وjaburan وجبة خفيفة.
      en: mutih = the plain-white fast; pasa is ordinary fasting, jaburan is snacks.
    words: [pasa, mutih, jaburan]
  - id: e06
    type: fill_blank
    sentence: Sadurunge riyaya, aku ___ dhuwit anyar ing bank.
    meaning:
      ar_eg: قبل العيد، أنا ___ فلوس جديدة في البنك.
      ar: قبل العيد ___ نقودًا جديدة في المصرف.
      en: Before Eid I ___ money for new notes at the bank.
    options: [ngijoli, pasa, kupat]
    answers: [ngijoli]
    words: [ngijoli, pasa, kupat]
  - id: e07
    type: multiple_choice
    question: Segane wis ana, ___ apa?
    options: [lawuh, bakda, ngijoli]
    answer: 0
    explain:
      ar_eg: 'الرز موجود، ناقص اللي يتاكل معاه: lawuh.'
      ar: 'الأرز جاهز، ويبقى ما يؤكل معه: lawuh.'
      en: 'The rice is there; what''s missing is the side dish: lawuh.'
    words: [lawuh, bakda, ngijoli]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا صايم النهارده.
      ar: أنا صائم اليوم.
      en: I'm fasting today.
    answer: Aku pasa dina iki.
    distractors: [mutih, kupat]
    words: [pasa]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kupat lan opor iku lawuh riyaya.
    answers_meaning:
      ar_eg: [الكتوبات والأوبور أكل العيد, الكتوبات والأوبور هما أكل العيد]
      ar: [الكتوبات والأوبور طعام العيد, الكتوبات والأوبور من أطباق العيد]
      en: [Ketupat and opor are Eid dishes, Ketupat and opor are the Eid food]
    words: [kupat, lawuh, riyaya]
  - id: e10
    type: speaking
    text: Mbahku mutih sadurunge riyaya.
    meaning:
      ar_eg: جدتي بتصوم بالأبيض قبل العيد.
      ar: تصوم جدتي على الأرز الأبيض قبل العيد.
      en: My grandma does the white-rice fast before Eid.
    words: [mutih, riyaya]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, bakda tarawih mengko ana jaburan, lho. Melu ora?
      ar_eg: يا محمد، بعد التراويح فيه تسالي في الجامع. جاي؟
      ar: يا محمد، بعد التراويح ستكون هناك وجبات خفيفة. ستأتي؟
      en: Mohamed, there are snacks after tarawih tonight. Coming?
    - speaker: Mohamed
      text: Melu! Aku pasa, wetengku luwe tenan.
      ar_eg: جاي! أنا صايم وبطني جعانة أوي.
      ar: سآتي! أنا صائم وجائع جدًا.
      en: Yes! I'm fasting and starving.
    - speaker: Mas Dimas
      text: Biasane ana kolak lan gorengan. Pas riyaya, ibu masak kupat.
      ar_eg: عادةً فيه كولاك وحاجات مقلية. وفي العيد ماما بتعمل كتوبات.
      ar: عادةً يكون هناك كولاك ومقليات. وفي العيد تطبخ أمي الكتوبات.
      en: Usually there's kolak and fried snacks. At Eid, Mum makes ketupat.
    - speaker: Mohamed
      text: Lawuhe apa?
      ar_eg: وبياكلوها مع إيه؟
      ar: وما الطبيخ الذي يؤكل معها؟
      en: What's the side dish?
    - speaker: Mas Dimas
      text: Opor ayam, ya ta! Aja lali ngijoli dhuwit anyar kanggo bocah-bocah.
      ar_eg: أوبور فراخ طبعًا! وماتنساش تغيّر فلوس جديدة للعيال.
      ar: أوبور الدجاج طبعًا! ولا تنسَ تبديل نقود جديدة للأطفال.
      en: Chicken opor, of course! And don't forget to change money for new notes for the kids.
    - speaker: Mohamed
      text: Siap, Mas.
      ar_eg: تمام يا ماس.
      ar: حاضر يا ماس.
      en: Will do, Mas.
