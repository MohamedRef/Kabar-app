id: j6.u02.l08
language: jv
title: Pasa lan riyaya
can_do:
  ar_eg: 'تتكلم عن رمضان والعيد في جوجا: الصيام، تسالي بعد التراويح، الكتوبات، وتغيير الفلوس الجديدة.'
  ar: 'أن تتحدث عن رمضان والعيد في جوجا: الصيام، وطعام ما بعد التراويح، والكتوبات، وتبديل النقود الجديدة.'
  en: 'Talk about Ramadan and Eid in Jogja: fasting, snacks after tarawih, ketupat and changing money for new notes.'
slides:
  - title: Sasi pasa
    body:
      ar_eg: |
        pasa = صيام، صايم. riyaya = العيد. bakda = بعد (bakda Isya = بعد العشا).
        jaburan = التسالي والأكل الخفيف اللي بيتوزّع في الجامع بعد التراويح.
        kupat = كتوبات (رز في سبت خوص). lawuh = اللي بيتاكل مع الرز (الغموس). mutih = صيام بالرز الأبيض والميه بس.
        ngijoli = يبدّل، يغيّر (زي تغيير الفلوس لفلوس جديدة قبل العيد).
      ar: |
        pasa = صيام، صائم. riyaya = العيد. bakda = بعد (bakda Isya = بعد العشاء).
        jaburan = وجبات خفيفة توزَّع في المسجد بعد التراويح.
        kupat = الكتوبات (أرز في سلة من سعف). lawuh = ما يؤكل مع الأرز من طبيخ. mutih = صيام على الأرز الأبيض والماء فقط.
        ngijoli = يبدّل (كتبديل النقود بأوراق جديدة قبل العيد).
      en: |
        pasa = fasting, to fast. riyaya = Eid. bakda = after (bakda Isya = after the night prayer).
        jaburan = snacks served at the mosque after tarawih.
        kupat = ketupat (rice cooked in a woven leaf case). lawuh = side dish eaten with rice. mutih = a fast on plain white rice and water.
        ngijoli = exchange, swap (like changing money for crisp new notes before Eid).
    examples:
      - text: Sasi pasa, sawise tarawih ana jaburan ing masjid.
        ar_eg: في رمضان، بعد التراويح فيه تسالي في الجامع.
        ar: في رمضان تُقدَّم وجبات خفيفة في المسجد بعد التراويح.
        en: During the fasting month there are snacks at the mosque after tarawih.
      - text: Bakda Isya, bocah-bocah padha tadarus.
        ar_eg: بعد العشا، العيال بيقروا قرآن مع بعض.
        ar: بعد العشاء يتدارس الأولاد القرآن.
        en: After the night prayer the children recite the Quran together.
      - text: Riyaya, ibu masak kupat lan opor.
        ar_eg: في العيد، ماما بتعمل كتوبات وأوبور.
        ar: في العيد تطبخ أمي الكتوبات والأوبور.
        en: At Eid, Mum cooks ketupat and opor.
