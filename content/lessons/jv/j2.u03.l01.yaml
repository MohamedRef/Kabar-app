  - id: e10
    type: translate
    direction: from_target
    source_text: Umurmu pira?
    answers_meaning:
      ar_eg: ["عندك كام سنة؟", "عندك كام سنه", "سنك كام؟"]
      ar: ["كم عمرك؟", "كم عمرك"]
      en: ["How old are you?", "How old are you"]
    explain:
      ar_eg: حرفيًا «عمرك كام؟» — umur + -mu، وpira في الآخر زي العربي.
      ar: "حرفيًا «عمرك كم؟»: umur + -mu، وpira في الآخر."
      en: Literally "your age how much?" — umur + -mu, with pira at the end.
    words: [umur, pira]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: باك بودي عنده خمسين سنة.
      ar: عمر باك بودي خمسون عامًا.
      en: Pak Budi is 50 years old.
    answers:
