dialogue:
  title: Karung bawang neng Nganjuk
  lines:
    - speaker: Bu Siti
      text: Le, karungé ana pira?
      ar_eg: يا ابني، فيه كام شوال؟
      ar: يا بني، كم كيسًا هناك؟
      en: Son, how many sacks are there?
    - speaker: Bagus
      text: Sewelas, rolas, telulas … Ana selawé, Bu.
      ar_eg: حداشر، اتناشر، تلاتاشر … فيه خمسة وعشرين يا ماما.
      ar: أحد عشر، اثنا عشر، ثلاثة عشر … هناك خمسة وعشرون يا أمي.
      en: Eleven, twelve, thirteen … There are twenty-five, Mum.
    - speaker: Mohamed
      text: Selawé karung bawang? Akèh tenan!
      ar_eg: خمسة وعشرين شوال بصل؟ كتير بجد!
      ar: خمسة وعشرون كيس بصل؟ هذا كثير حقًا!
      en: Twenty-five sacks of onions? That's a lot!
    - speaker: Bu Siti
      text: Iki durung kabèh, Mas. Kabèh ana seket.
      ar_eg: ولسه مش الكل يا أستاذ. الكل خمسين.
      ar: ولم تكتمل بعد يا أخي، فالمجموع خمسون.
      en: That's not all yet, Mas. Altogether there are fifty.
    - speaker: Mohamed
      text: Seket! Nganjuk pancèn kutha bawang.
      ar_eg: خمسين! نغانجوك فعلًا مدينة البصل.
      ar: خمسون! نغانجوك حقًّا مدينة البصل.
      en: Fifty! Nganjuk really is the onion town.
