schema: kabar.lesson/v1
id: j2.u03.l01
language: jv
title: Sewelas nganti satus
can_do:
  ar_eg: تعدّ لحد ١٠٠ بالأشكال الخاصة.
  ar: أن تعدّ حتى ١٠٠ بالصيغ الخاصة.
  en: Count to 100 with special forms.
slides:
  - title: Sewelas, rolas, telulas
    body:
      ar_eg: |
        في J1 اتعلمت من 1 لـ 10. دلوقتي 11–19: زي belas في الإندونيسي بس مختصرة، زي ما المصري بيقول «حداشر، اتناشر» بدل «أحد عشر، اثنا عشر»:
        - 11 sewelas · 12 rolas · 13 telulas
        - 14 patbelas · 15 limalas · 16 nembelas
        - 17 pitulas · 18 wolulas · 19 sangalas
        خلي بالك: 11 = sewelas، مش «sepuluh siji».
      ar: |
        عرفت في J1 الأعداد من 1 إلى 10، وهذه 11–19، وهي belas الإندونيسية مختصرة، كما تختصر العامية «حداشر، اتناشر»:
        - 11 sewelas · 12 rolas · 13 telulas
        - 14 patbelas · 15 limalas · 16 nembelas
        - 17 pitulas · 18 wolulas · 19 sangalas
        وتنبه: 11 = sewelas لا «sepuluh siji».
      en: |
        J1 gave you 1–10. Now 11–19: Indonesian belas, shortened — just as Egyptian says «حداشر، اتناشر»:
        - 11 sewelas · 12 rolas · 13 telulas
        - 14 patbelas · 15 limalas · 16 nembelas
        - 17 pitulas · 18 wolulas · 19 sangalas
        Careful: 11 is sewelas, not "sepuluh siji".
    grammar: jv.number.full
    examples:
      - text: Bawangé ana rolas.
        ar_eg: فيه اتناشر بصلة.
        ar: هناك اثنتا عشرة بصلة.
        en: There are twelve onions.
  - title: Selikur … selawé
    body:
      ar_eg: |
        20 = rong puluh (زي dua puluh). بس من 21 لـ 29 فيه نظام خاص بـ -likur:
        - 21 selikur · 22 rolikur · 23 telulikur · 24 patlikur
        - 25 selawé ← ليها كلمة لوحدها!
        - 26 nemlikur · 27 pitulikur · 28 wolulikur · 29 sangalikur
        selawé (في الشات selawe) من أهم الأرقام في السوق.
      ar: |
        20 = rong puluh (dua puluh)، ومن 21 إلى 29 نظام خاص بـ -likur:
        - 21 selikur · 22 rolikur · 23 telulikur · 24 patlikur
        - 25 selawé ← لفظ مستقل!
        - 26 nemlikur · 27 pitulikur · 28 wolulikur · 29 sangalikur
        وselawé (selawe في الدردشة) من أكثر الأعداد دورانًا في السوق.
      en: |
        20 = rong puluh (dua puluh). But 21–29 have their own -likur system:
        - 21 selikur · 22 rolikur · 23 telulikur · 24 patlikur
        - 25 selawé ← a word of its own!
        - 26 nemlikur · 27 pitulikur · 28 wolulikur · 29 sangalikur
        selawé (chat: selawe) is one of the most useful market numbers.
    grammar: jv.number.full
    examples:
      - text: Umurku selikur taun.
        ar_eg: عندي واحد وعشرين سنة.
        ar: عمري واحد وعشرون عامًا.
        en: I'm 21 years old.
      - text: Umurku selawé taun.
        ar_eg: عندي خمسة وعشرين سنة.
        ar: عمري خمسة وعشرون عامًا.
        en: I'm 25 years old.
  - title: Seket, sewidak, satus
    body:
      ar_eg: |
        العشرات بأشكال الوصل اللي تعرفها من J1 + puluh، إلا اتنين ليهم كلمات خاصة:
        - 30 telung puluh · 40 patang puluh
        - 50 seket ← خاصة
        - 60 sewidak ← خاصة
        - 70 pitung puluh · 80 wolung puluh · 90 sangang puluh · 100 satus
        وبعدين الآحاد زي الإندونيسي: telung puluh siji = 31، seket lima = 55، sewidak loro = 62.
      ar: |
        العشرات بصيغ الوصل المعروفة من J1 مع puluh، إلا عددين لهما لفظان خاصان:
        - 30 telung puluh · 40 patang puluh
        - 50 seket ← خاص
        - 60 sewidak ← خاص
        - 70 pitung puluh · 80 wolung puluh · 90 sangang puluh · 100 satus
        ثم الآحاد كالإندونيسية: telung puluh siji = 31، seket lima = 55، sewidak loro = 62.
      en: |
        Tens use the J1 linking forms + puluh, except two special words:
        - 30 telung puluh · 40 patang puluh
        - 50 seket ← special
        - 60 sewidak ← special
        - 70 pitung puluh · 80 wolung puluh · 90 sangang puluh · 100 satus
        Then add units as in Indonesian: telung puluh siji = 31, seket lima = 55, sewidak loro = 62.
    grammar: jv.number.full
    examples:
      - text: Karungé ana seket.
        ar_eg: فيه خمسين شوال.
        ar: هناك خمسون كيسًا.
        en: There are fifty sacks.
      - text: Umuré Pak Budi seket lima taun.
        ar_eg: باك بودي عنده خمسة وخمسين سنة.
        ar: عمر باك بودي خمسة وخمسون عامًا.
        en: Pak Budi is 55 years old.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sewelas
        ar_eg: حداشر (11)
        ar: أحد عشر (11)
        en: eleven (11)
      - text: rolas
        ar_eg: اتناشر (12)
        ar: اثنا عشر (12)
        en: twelve (12)
      - text: selikur
        ar_eg: واحد وعشرين (21)
        ar: واحد وعشرون (21)
        en: twenty-one (21)
      - text: selawé
        ar_eg: خمسة وعشرين (25)
        ar: خمسة وعشرون (25)
        en: twenty-five (25)
      - text: seket
        ar_eg: خمسين (50)
        ar: خمسون (50)
        en: fifty (50)
    words: [sewelas, rolas, selikur, selawé, seket]
  - id: e02
    type: multiple_choice
    question: "15 = ?"
    question_meaning:
      ar_eg: إزاي تقول ١٥؟
      ar: كيف تقول ١٥؟
      en: How do you say 15?
    options: ["seket", "limalas", "limang likur"]
    answer: 1
    words: [limalas]
  - id: e03
    type: multiple_choice
    question: "25 = ?"
    question_meaning:
      ar_eg: إزاي تقول ٢٥؟
      ar: كيف تقول ٢٥؟
      en: How do you say 25?
    options: ["rong puluh lima", "selawé", "limang likur"]
    answer: 1
    explain:
      ar_eg: "25 ليها كلمة خاصة: selawé. باقي العشرينات بـ -likur."
      ar: للعدد 25 لفظ خاص هو selawé، وبقية العشرينات بـ -likur.
      en: 25 has its own word, selawé; the other twenties use -likur.
    words: [selawé]
  - id: e04
    type: multiple_choice
    question: "60 = ?"
    question_meaning:
      ar_eg: إزاي تقول ٦٠؟
      ar: كيف تقول ٦٠؟
      en: How do you say 60?
    options: ["nemlikur", "sewidak", "nembelas"]
    answer: 1
    explain:
      ar_eg: "nembelas = 16، nemlikur = 26، و60 ليها كلمة خاصة: sewidak."
      ar: "nembelas = 16، وnemlikur = 26، وللستين لفظ خاص: sewidak."
      en: nembelas = 16, nemlikur = 26; 60 has its own word, sewidak.
    words: [sewidak]
  - id: e05
    type: listen
    text: seket lima
    options: ["selawé", "limalas", "seket lima"]
    answer: 2
    words: [seket]
  - id: e06
    type: fill_blank
    sentence: Umurku ___ taun.
    meaning:
      ar_eg: عندي واحد وعشرين سنة.
      ar: عمري واحد وعشرون عامًا.
      en: I'm 21 years old.
    options: ["selikur", "rolikur", "sewelas"]
    answers: [selikur]
    words: [selikur, umur, taun]
  - id: e07
    type: fill_blank
    sentence: telulikur, patlikur, ___, nemlikur
    meaning:
      ar_eg: ٢٣، ٢٤، …، ٢٦
      ar: ٢٣، ٢٤، …، ٢٦
      en: 23, 24, …, 26
    answers:
      - selawé
      - selawe
    explain:
      ar_eg: 25 مش «limang likur»، دي selawé.
      ar: 25 ليس «limang likur» بل selawé.
      en: 25 isn't "limang likur" — it's selawé.
    words: [selawé]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عندي خمسة وعشرين سنة.
      ar: عمري خمسة وعشرون عامًا.
      en: I'm 25 years old.
    answer: Umurku selawé taun.
    distractors: [limang, likur]
