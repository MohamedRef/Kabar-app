schema: kabar.lesson/v1
id: j2.u03.l01
language: jv
title: Sewelas, rolas, selikur
can_do:
  ar_eg: تعد من ١١ لـ ٢٩ وتقول سنك.
  ar: أن تعدّ من ١١ إلى ٢٩ وتذكر عمرك.
  en: Count from 11 to 29 and say your age.
slides:
  - title: Sewelas, rolas, telulas
    body:
      ar_eg: |
        في J1 اتعلمت من 1 لـ 10. دلوقتي 11–19: زي belas في الإندونيسي بس مختصرة، زي ما المصري بيقول «حداشر، اتناشر» بدل «أحد عشر، اثنا عشر»:
        - 11 sewelas · 12 rolas · 13 telulas
        - 14 patbelas · 15 limalas · 16 nembelas
        - 17 pitulas · 18 wolulas · 19 sangalas
        خلي بالك: 11 = sewelas، مش «sepuluh siji».
      ar: |
        عرفت في J1 الأعداد من 1 إلى 10، وهذه 11–19، وهي belas الإندونيسية مختصرة، كما تختصر العامية «حداشر، اتناشر»:
        - 11 sewelas · 12 rolas · 13 telulas
        - 14 patbelas · 15 limalas · 16 nembelas
        - 17 pitulas · 18 wolulas · 19 sangalas
        وتنبه: 11 = sewelas لا «sepuluh siji».
      en: |
        J1 gave you 1–10. Now 11–19: Indonesian belas, shortened — just as Egyptian says «حداشر، اتناشر»:
        - 11 sewelas · 12 rolas · 13 telulas
        - 14 patbelas · 15 limalas · 16 nembelas
        - 17 pitulas · 18 wolulas · 19 sangalas
        Careful: 11 is sewelas, not "sepuluh siji".
    grammar: jv.number.full
    examples:
      - text: Bawange ana rolas.
        ar_eg: فيه اتناشر بصلة.
        ar: هناك اثنتا عشرة بصلة.
        en: There are twelve onions.
  - title: Selikur … selawe
    body:
      ar_eg: |
        20 = rong puluh (زي dua puluh). بس من 21 لـ 29 فيه نظام خاص بـ -likur:
        - 21 selikur · 22 rolikur · 23 telulikur · 24 patlikur
        - 25 selawe ← ليها كلمة لوحدها!
        - 26 nemlikur · 27 pitulikur · 28 wolulikur · 29 sangalikur
        selawe (في الشات selawe) من أهم الأرقام في السوق.
      ar: |
        20 = rong puluh (dua puluh)، ومن 21 إلى 29 نظام خاص بـ -likur:
        - 21 selikur · 22 rolikur · 23 telulikur · 24 patlikur
        - 25 selawe ← لفظ مستقل!
        - 26 nemlikur · 27 pitulikur · 28 wolulikur · 29 sangalikur
        وselawe (selawe في الدردشة) من أكثر الأعداد دورانًا في السوق.
      en: |
        20 = rong puluh (dua puluh). But 21–29 have their own -likur system:
        - 21 selikur · 22 rolikur · 23 telulikur · 24 patlikur
        - 25 selawe ← a word of its own!
        - 26 nemlikur · 27 pitulikur · 28 wolulikur · 29 sangalikur
        selawe (chat: selawe) is one of the most useful market numbers.
    grammar: jv.number.full
    examples:
      - text: Umurku selikur taun.
        ar_eg: عندي واحد وعشرين سنة.
        ar: عمري واحد وعشرون عامًا.
        en: I'm 21 years old.
      - text: Umurku selawe taun.
        ar_eg: عندي خمسة وعشرين سنة.
        ar: عمري خمسة وعشرون عامًا.
        en: I'm 25 years old.
exercises:
  - id: e01
    type: multiple_choice
    question: 15 = ?
    question_meaning:
      ar_eg: إزاي تقول ١٥؟
      ar: كيف تقول ١٥؟
      en: How do you say 15?
    options: [seket, limalas, limang likur]
    answer: 1
    words: [limalas]
  - id: e02
    type: multiple_choice
    question: 25 = ?
    question_meaning:
      ar_eg: إزاي تقول ٢٥؟
      ar: كيف تقول ٢٥؟
      en: How do you say 25?
    options: [rong puluh lima, selawe, limang likur]
    answer: 1
    explain:
      ar_eg: '25 ليها كلمة خاصة: selawe. باقي العشرينات بـ -likur.'
      ar: للعدد 25 لفظ خاص هو selawe، وبقية العشرينات بـ -likur.
      en: 25 has its own word, selawe; the other twenties use -likur.
    words: [selawe]
  - id: e03
    type: fill_blank
    sentence: Umurku ___ taun.
    meaning:
      ar_eg: عندي واحد وعشرين سنة.
      ar: عمري واحد وعشرون عامًا.
      en: I'm 21 years old.
    options: [selikur, rolikur, sewelas]
    answers: [selikur]
    words: [selikur, umur, taun]
  - id: e04
    type: fill_blank
    sentence: telulikur, patlikur, ___, nemlikur
    meaning:
      ar_eg: ٢٣، ٢٤، …، ٢٦
      ar: ٢٣، ٢٤، …، ٢٦
      en: 23, 24, …, 26
    answers: [selawe]
    explain:
      ar_eg: 25 مش «limang likur»، دي selawe.
      ar: 25 ليس «limang likur» بل selawe.
      en: 25 isn't "limang likur" — it's selawe.
    words: [selawe]
  - id: e05
    type: build_sentence
    source:
      ar_eg: عندي خمسة وعشرين سنة.
      ar: عمري خمسة وعشرون عامًا.
      en: I'm 25 years old.
    answer: Umurku selawe taun.
    distractors: [limang, likur]
    words: [umur, selawe, taun]
  - id: e06
    type: translate
    direction: from_target
    source_text: Umurmu pira?
    answers_meaning:
      ar_eg: [عندك كام سنة؟, عندك كام سنه, سنك كام؟]
      ar: [كم عمرك؟, كم عمرك]
      en: ['How old are you?', How old are you]
    explain:
      ar_eg: حرفيًا «عمرك كام؟» — umur + -mu، وpira في الآخر زي العربي.
      ar: 'حرفيًا «عمرك كم؟»: umur + -mu، وpira في الآخر.'
      en: Literally "your age how much?" — umur + -mu, with pira at the end.
    words: [umur, pira]
  - id: e07
    type: dictation
    text: sewelas, rolas, telulas
    meaning:
      ar_eg: حداشر، اتناشر، تلاتاشر
      ar: أحد عشر، اثنا عشر، ثلاثة عشر
      en: eleven, twelve, thirteen
    words: [sewelas, rolas, telulas]
dialogue:
  lines:
    - speaker: Mohamed
      text: Gus, umurmu pira?
      ar_eg: يا جوس، عندك كام سنة؟
      ar: يا غوس، كم عمرك؟
      en: Gus, how old are you?
    - speaker: Bagus
      text: Rolas taun, Mas. Umurmu pira?
      ar_eg: اتناشر سنة. وإنت عندك كام؟
      ar: اثنتا عشرة سنة. وكم عمرك أنت؟
      en: Twelve, Mas. How old are you?
    - speaker: Mohamed
      text: Umurku selawe taun.
      ar_eg: عندي خمسة وعشرين سنة.
      ar: عمري خمس وعشرون سنة.
      en: I'm twenty-five.
    - speaker: Bagus
      text: Selawe? Mbakyuku uga selawe taun!
      ar_eg: خمسة وعشرين؟ أختي الكبيرة كمان خمسة وعشرين!
      ar: خمس وعشرون؟ أختي الكبرى أيضًا في الخامسة والعشرين!
      en: Twenty-five? My older sister is twenty-five too!
new_words:
  - word: sewelas
    pos: number
    ar_eg: حداشر (11)
    ar: أحد عشر (11)
    en: eleven (sebelas)
  - word: rolas
    pos: number
    ar_eg: اتناشر (12)
    ar: اثنا عشر (12)
    en: twelve (dua belas)
  - word: limalas
    pos: number
    ar_eg: خمستاشر (15)
    ar: خمسة عشر (15)
    en: fifteen (lima belas)
  - word: selikur
    pos: number
    ar_eg: واحد وعشرين (21)
    ar: واحد وعشرون (21)
    en: twenty-one
  - word: selawe
    pos: number
    ar_eg: خمسة وعشرين (25)
    ar: خمسة وعشرون (25)
    en: twenty-five
  - word: umur
    pos: noun
    ar_eg: عمر / سن
    ar: عمر
    en: age (umur)
    arabic: عمر
  - word: taun
    pos: noun
    ar_eg: سنة
    ar: سنة
    en: year (tahun)
review:
  status: draft
  verified: false
