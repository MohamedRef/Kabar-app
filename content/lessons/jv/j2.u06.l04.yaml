      en: "\"Lots of kids.\" Which is right?"
    options: ["akèh bocah", "bocah-bocah telu", "akèh bocah-bocah"]
    answer: 0
    explain:
      ar_eg: akèh بتوضح الجمع، فمش محتاج تكرار.
      ar: akèh تدل على الجمع فلا حاجة للتكرار.
      en: akèh already shows plural, so no doubling.
