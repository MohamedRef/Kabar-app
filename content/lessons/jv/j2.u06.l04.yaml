schema: kabar.lesson/v1
id: j2.u06.l04
language: jv
title: Menang apa kalah?
can_do:
  ar_eg: تعزم حد يخرج معاك، تلعب كورة وتقول مين كسب، وتبات عند حد.
  ar: أن تدعو أحدًا للخروج، وتلعب كرة القدم وتقول من فاز، وتبيت عند أحد.
  en: Invite someone out, play football and say who won, and stay the night somewhere.
slides:
  - title: Bal-balan
    body:
      ar_eg: |
        ngajak = يعزم حد ييجي معاه: Bayu ngajak aku dolan.
        budal = يطلع، ينطلق: Ayo budal! = يلا بينا!
        bal-balan = كورة قدم. menang = يكسب، kalah = يخسر.
        banter = سريع (وكمان صوت عالي). santai = رايق، على مهله.
        nginep = يبات: Aku nginep ing omahe simbah.
      ar: |
        ngajak = يدعو أحدًا لمرافقته: Bayu ngajak aku dolan.
        budal = ينطلق: Ayo budal! = هيّا بنا!
        bal-balan = كرة القدم. menang = يفوز، kalah = يخسر.
        banter = سريع (وأيضًا صوت عالٍ). santai = هادئ البال، على مهل.
        nginep = يبيت: Aku nginep ing omahe simbah.
      en: |
        ngajak = invite someone along: Bayu ngajak aku dolan.
        budal = set out: Ayo budal! = Let's go!
        bal-balan = football. menang = win, kalah = lose.
        banter = fast (also loud). santai = relaxed, easy.
        nginep = stay the night: Aku nginep ing omahe simbah.
    examples:
      - text: Timku kalah, timmu menang.
        ar_eg: فريقي خسر، وفريقك كسب.
        ar: خسر فريقي وفاز فريقك.
        en: My team lost, yours won.
      - text: Bayu ngajak aku dolan nang taman.
        ar_eg: بايو عزمني نخرج للجنينة.
        ar: دعاني بايو للنزهة في الحديقة.
        en: Bayu invited me out to the park.
      - text: Santai wae, aja kesusu.
        ar_eg: روق، ما تستعجلش.
        ar: على مهلك، لا تستعجل.
        en: Take it easy, no rush.
