schema: kabar.lesson/v1
id: j2.u06.l04
language: jv
title: Ulangan J2.6
can_do:
  ar_eg: تحكي عن فسحة آخر الأسبوع.
  ar: أن تروي قصة نزهة نهاية الأسبوع.
  en: Tell a weekend story.
slides:
  - title: Ringkesan J2.6
    body:
      ar_eg: |
        - التكرار: bocah-bocah (جمع، ومن غير تكرار مع رقم أو akèh)، mlaku-mlaku / dolan-dolan (للفسحة)، bola-bali (رايح جاي)، lelungan (سفرية).
        - التقوية: banget / tenan / pol بعد الصفة، rada / kurang قبلها، والأكتر: … dhéwé أو sing paling …، وفي شرق جاوة uenak / puanas.
        - المشاعر: seneng، sedhih، kesel (تعبان!)، wedi، bosen.
        - الربط: lan / karo، utawa / apa، nanging / ning، terus / banjur، merga / amarga، mula، nek / yen.
      ar: |
        - التكرار: bocah-bocah (للجمع، ولا يُكرَّر مع العدد أو akèh)، mlaku-mlaku / dolan-dolan (للنزهة)، bola-bali (ذهابًا وإيابًا)، lelungan (رحلة).
        - التقوية: banget / tenan / pol بعد الصفة، وrada / kurang قبلها، والتفضيل: … dhéwé أو sing paling …، وفي شرق جاوة uenak / puanas.
        - المشاعر: seneng، sedhih، kesel (متعب!)، wedi، bosen.
        - الربط: lan / karo، utawa / apa، nanging / ning، terus / banjur، merga / amarga، mula، nek / yen.
      en: |
        - Doubling: bocah-bocah (plural; no doubling with a number or akèh), mlaku-mlaku / dolan-dolan (for fun), bola-bali (back and forth), lelungan (a trip).
        - Intensifiers: banget / tenan / pol after the adjective, rada / kurang before it; the most: … dhéwé or sing paling …; East Java uenak / puanas.
        - Feelings: seneng, sedhih, kesel (tired!), wedi, bosen.
        - Linking: lan / karo, utawa / apa, nanging / ning, terus / banjur, merga / amarga, mula, nek / yen.
    grammar: jv.conjunction.basic
