    meaning:
      ar_eg: بايو بيعزمنا نلعب كورة. اللي يخسر يشتري آيس!
      ar: يدعونا بايو للعب الكرة. من يخسر يشتري المثلّجات!
      en: Bayu's up for football. Losers buy the ice!
    words: [ngajak, bal-balan, kalah]
dialogue:
  lines:
    - speaker: Bayu
      text: Mas Mohamed, ayo bal-balan nang lapangan! Mas Dimas melu.
      ar_eg: يا ماس محمد، يلا نلعب كورة في الملعب! ماس ديماس جاي معانا.
      ar: يا ماس محمد، هيّا نلعب الكرة في الملعب! ماس ديماس معنا.
      en: Mas Mohamed, let's play football at the pitch! Mas Dimas is coming.
    - speaker: Mohamed
      text: Ayo! Nanging aku ora banter mlayune, hehe.
      ar_eg: يلا! بس أنا مش سريع في الجري، هههه.
      ar: هيّا! لكنّي لست سريعًا في الجري، هههه.
      en: Let's go! But I'm not a fast runner, hehe.
    - speaker: Mas Dimas
      text: Santai wae. Sing kalah tuku es teh.
      ar_eg: روق. اللي يخسر يشتري شاي متلّج.
      ar: على مهلك. الخاسر يشتري الشاي المثلّج.
      en: No worries. Losers buy iced tea.
    - speaker: Bayu
      text: Bengi iki Mas Dimas nginep ing omahku. Mas Mohamed melu?
      ar_eg: الليلة ماس ديماس هيبات عندنا. ماس محمد جاي؟
      ar: الليلة يبيت ماس ديماس في بيتنا. هل تأتي يا ماس محمد؟
      en: Mas Dimas is staying over tonight. You coming, Mas Mohamed?
    - speaker: Mohamed
      text: Yen timku menang, aku melu! Ayo budal.
      ar_eg: لو فريقي كسب، أنا جاي! يلا بينا.
      ar: إن فاز فريقي، سآتي! هيّا بنا.
      en: If my team wins, I'm in! Let's go.
