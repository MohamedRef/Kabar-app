dialogue:
  lines:
    - speaker: Mohamed
      text: Pak Slamet, kula badhe pamit. Benjing enjing kula wangsul.
      ar_eg: يا عم سلامت، جاي أودّعك. بكرة الصبح راجع.
      ar: يا عم سلامت، جئت أستأذن. أعود غدًا صباحًا.
      en: Pak Slamet, I've come to say goodbye. I go home tomorrow morning.
    - speaker: Pak Slamet
      text: Mas, menika ali-ali perak kangge kenang-kenangan.
      ar_eg: يا ابني، ده خاتم فضة تذكار.
      ar: هذا خاتم فضي تذكارًا لك.
      en: Here's a silver ring as a keepsake.
    - speaker: Mohamed
      text: Masya Allah, sumunar sanget! Matur nuwun, Pak.
      ar_eg: ما شاء الله، بيلمع أوي! متشكر يا عم.
      ar: ما شاء الله، يتلألأ! شكرًا يا عم.
      en: Masha'Allah, it really shines! Thank you, sir.
    - speaker: Pak Slamet
      text: 'Pepeling kula: nguri-uri kabudayan menika kewajiban kita sedaya.'
      ar_eg: 'نصيحتي: الحفاظ على الثقافة واجب علينا كلنا.'
      ar: 'وصيّتي: صون الثقافة واجب علينا جميعًا.'
      en: 'My advice: keeping culture alive is a duty for all of us.'
    - speaker: Mohamed
      text: Kula badhe nyariosaken Kutha Gedhe ing Mesir.
      ar_eg: هحكي عن كوتاجيدي في مصر.
      ar: سأحكي عن كوتاغيدي في مصر.
      en: I'll tell people about Kotagede in Egypt.
    - speaker: Pak Slamet
      text: Menika sumbangsih panjenengan. Mugi lestari!
      ar_eg: ودي مساهمتك. ربنا يديمها!
      ar: هذه مساهمتك. عساها تدوم!
      en: That's your contribution. May it endure!
