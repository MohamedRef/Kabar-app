schema: kabar.lesson/v1
id: j6.u06.l05
language: jv
title: Ulangan J6.6
can_do:
  ar_eg: تقرا كلمات وسطر makna gandul بالبيجون.
  ar: أن تقرأ كلمات وسطر makna gandul بالبيجون.
  en: Read Pegon words and a makna gandul line.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ڠ
        ar_eg: nga (عين بتلات نقط)
        ar: nga (عين بثلاث نقاط)
        en: nga
      - text: چ
        ar_eg: ca (تش)
        ar: ca (تش)
        en: ca
      - text: ڤ
        ar_eg: pa (فا بتلات نقط)
        ar: pa (فاء بثلاث نقاط)
        en: pa
      - text: ڎ
        ar_eg: dha (دال بتلات نقط)
        ar: dha (دال بثلاث نقاط)
        en: dha
      - text: ڟ
        ar_eg: tha (طا بتلات نقط)
        ar: tha (طاء بثلاث نقاط)
        en: tha
    words: [ڠ, چ, ڤ, ڎ, ڟ]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: "اقرا: ساڤا"
      ar: "اقرأ: ساڤا"
      en: "Read: ساڤا"
    options: [safa, sapa, saba]
    answer: 1
    words: [ڤ]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: "اقرا: ۑاتا"
      ar: "اقرأ: ۑاتا"
      en: "Read: ۑاتا"
    options: [yata, nata, nyata]
    answer: 2
    words: [ۑ]
  - id: e04
    type: listen
    text: pathi
    question:
      ar_eg: سمعت pathi (نشا). بتتكتب إزاي بالبيجون؟
      ar: سمعت pathi (نشا). كيف تُكتب بالبيجون؟
      en: You heard pathi (starch). How is it written in Pegon?
    options: ["ڤاتي", "ڤاڟي", "ڤاڎي"]
    answer: 1
    meaning:
      ar_eg: نشا
      ar: نشا
      en: starch
    words: [ڟ]
  - id: e05
    type: fill_blank
    sentence: ڮولا = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: سكر)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: سكر)"
      en: Type the reading in Latin letters. (It means "sugar".)
    answers: [gula]
    words: [ڮ]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: iku رمزها إيه في الـ makna gandul؟
      ar: ما رمز iku في الـ makna gandul؟
      en: Which symbol stands for iku in makna gandul?
    options: [م, خ, ف]
    answer: 1
    explain:
      ar_eg: iku بتعلّم الخبر، فرمزها خ. وutawi للمبتدأ، رمزها م.
      ar: iku علامة الخبر فرمزها خ، وutawi علامة المبتدأ فرمزها م.
      en: iku marks the khabar, so خ; utawi marks the mubtada, so م.
    words: [makna gandul]
  - id: e07
    type: fill_blank
    sentence: ___ sakabehe puji iku kagungane Allah.
    meaning:
      ar_eg: أما كل الحمد فهو ملك لله. (علامة المبتدأ ناقصة)
      ar: أما كل الحمد فهو ملك لله. (علامة المبتدأ ناقصة)
      en: As for all praise, it belongs to God. (The mubtada marker is missing.)
    options: [Iku, Utawi, Kitab]
    answers: [Utawi]
    words: [utawi]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: اكو ڠاجي كتاب"
      ar: "اكتب بالحروف اللاتينية: اكو ڠاجي كتاب"
      en: "Write in Latin letters: اكو ڠاجي كتاب"
    answers: ["Aku ngaji kitab.", aku ngaji kitab]
    explain:
      ar_eg: اكو = aku، ڠاجي = ngaji، وكتاب = kitab بإملاها العربي. يعني «أنا بدرس كتاب».
      ar: "اكو = aku، وڠاجي = ngaji، وكتاب = kitab بإملائها العربي: «أدرس كتابًا»."
      en: "اكو = aku, ڠاجي = ngaji, and كتاب = kitab in its Arabic spelling: \"I'm studying a kitab.\""
    words: [kitab, ڠ]
  - id: e09
    type: multiple_choice
    question_meaning:
      ar_eg: "ڎاڎا بالـ aksara Jawa تبقى إيه؟"
      ar: "ما ڎاڎا بالـ aksara Jawa؟"
      en: "What is ڎاڎا in aksara Jawa?"
    options: ["ꦝꦝ", "ꦢꦢ", "ꦛꦛ"]
    answer: 0
    words: [ڎ]
  - id: e10
    type: build_sentence
    source:
      ar_eg: الطالب بيدرس كتاب في الـ pesantren.
      ar: يدرس الطالب كتابًا في الـ pesantren.
      en: The student studies a kitab at the pesantren.
    answer: Santri ngaji kitab ing pesantren.
    distractors: [pegon]
    words: [kitab, pesantren]
  - id: e11
    type: speaking
    text: Aku isa maca Pegon!
    meaning:
      ar_eg: أنا أعرف أقرا بيجون!
      ar: أستطيع قراءة البيجون!
      en: I can read Pegon!
    words: [pegon]
dialogue:
  title: Pamit saking pesantren
  lines:
    - speaker: Gus Hanif
      text: Mas Mohamed, menika kitab kagem panjenengan.
      ar_eg: يا محمد، ده كتاب ليك هدية.
      ar: يا محمد، هذا كتاب لك.
      en: Mohamed, this kitab is for you.
    - speaker: Mohamed
      text: Matur nuwun sanget, Gus! Kula badhe sinau Pegon malih.
      ar_eg: شكرًا جدًا يا شيخ! هكمّل أذاكر بيجون.
      ar: شكرًا جزيلًا يا شيخ! سأواصل تعلّم البيجون.
      en: Thank you so much, Gus! I'll keep studying Pegon.
    - speaker: Gus Hanif
      text: Mangga. Mugi-mugi manfaat, Mas.
      ar_eg: اتفضل. ربنا يجعله نافع.
      ar: تفضّل. نسأل الله أن ينفعك به.
      en: Please. May it be of benefit.
    - speaker: Mohamed
      text: Amin. Aksara Jawa lan Pegon, kula remen sedaya!
      ar_eg: آمين. الـ aksara Jawa والبيجون، أنا بحبهم الاتنين!
      ar: آمين. الـ aksara Jawa والبيجون، أحبهما كليهما!
      en: Amen. Aksara Jawa and Pegon, I love them both!
souvenir:
  id: j6.u06.souvenir
  title: Kitab Pegon
  note:
    ar_eg: |
      من قرون والـ pesantren في جاوة بتكتب الجاوي بالحروف العربية. ولحد النهارده طلبة كتير شايلين كتاب عربي، وتحت كل سطر فيه شرح كلمة بكلمة بالبيجون، مايل كأنه متعلّق: الـ makna gandul. نفس العربي اللي اتربيت عليه، مشروح بالجاوي اللي اتعلمته في الرحلة دي. مبروك، خلّصت J6!
    ar: |
      منذ قرون تكتب الـ pesantren في جاوة الجاوية بالحرف العربي، وما زال كثير من الطلاب يحملون كتبًا عربية تحت كل سطر منها شرح حرفي بالبيجون، مائل كأنه معلَّق: الـ makna gandul. هي العربية التي نشأت عليها، مشروحة بالجاوية التي تعلمتها في هذه الرحلة. مبارك، أتممت J6!
    en: |
      For centuries, pesantren across Java have written Javanese in Arabic letters. Many students still carry an Arabic kitab with a word-by-word Pegon gloss slanting under every line: makna gandul. The Arabic you grew up with, explained in the Javanese you learned on this journey. Congratulations, you've finished J6!
review:
