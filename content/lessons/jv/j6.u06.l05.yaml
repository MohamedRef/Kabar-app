language: jv
title: Pamit saka Kutha Gedhe
can_do:
  ar_eg: تودّع صاحبك الصايغ بلغة كراما راقية، وتشكره على الهدية، وتتكلم عن الحفاظ على التراث.
  ar: أن تودّع صديقك الصائغ بلغة كراما رفيعة، وتشكره على الهدية، وتتحدث عن صون التراث.
  en: Take leave of a silversmith friend in refined krama, thank him for a keepsake, and talk about keeping heritage alive.
slides:
  - title: Pamitan
    body:
      ar_eg: |
        pamit = يستأذن ويودّع قبل ما يمشي. kenang-kenangan = تذكار، pisungsung = هدية (كلمة أدبية راقية).
        nguri-uri = يحافظ على التراث ويحييه، lestari = يفضل موجود ومحفوظ: «Mugi lestari!» = يا رب يدوم!
        pepeling = نصيحة أو تذكرة من الكبار، sumbangsih = مساهمة.
        kamulyan = مجد وعزّ، sumunar = بيلمع ويشعّ.
      ar: |
        pamit = يستأذن ويودّع قبل الرحيل. kenang-kenangan = تذكار، pisungsung = هدية (لفظ أدبي).
        nguri-uri = يصون التراث ويحييه، lestari = باقٍ محفوظ: «Mugi lestari!» = عساه يدوم!
        pepeling = موعظة أو تذكرة من الكبار، sumbangsih = مساهمة.
        kamulyan = مجد وعزّ، sumunar = متلألئ مشعّ.
      en: |
        pamit = to take one's leave politely. kenang-kenangan = keepsake, pisungsung = gift (literary).
        nguri-uri = to keep a tradition alive, lestari = preserved, enduring: "Mugi lestari!" = may it endure!
        pepeling = a reminder or piece of advice from an elder, sumbangsih = contribution.
        kamulyan = glory, honour; sumunar = shining, radiant.
    examples:
      - text: Sadurunge mulih, aku pamit marang Pak Slamet.
        ar_eg: قبل ما أروّح، ودّعت عم سلامت.
        ar: قبل العودة ودّعت العم سلامت.
        en: Before going home, I took my leave of Pak Slamet.
      - text: Ali-ali perak iki kenang-kenangan saka Kutha Gedhe.
        ar_eg: الخاتم الفضة ده تذكار من كوتاجيدي.
        ar: هذا الخاتم الفضي تذكار من كوتاغيدي.
        en: This silver ring is a keepsake from Kotagede.
      - text: Ayo nguri-uri kabudayan Jawa supados lestari.
        ar_eg: يلا نحافظ على الثقافة الجاوية عشان تدوم.
        ar: لنصن الثقافة الجاوية كي تدوم.
        en: Let's keep Javanese culture alive so it endures.
