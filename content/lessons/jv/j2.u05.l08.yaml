schema: kabar.lesson/v1
id: j2.u05.l08
language: jv
title: Dinane Sari
can_do:
  ar_eg: تحكي يوم كامل بالجاوي.
  ar: أن تروي يومًا كاملًا بالجاوية.
  en: Narrate a day.
slides:
  - title: Saben dina
    body:
      ar_eg: |
        عشان تحكي يومك: الساعة + الفعل، وsaben dina = كل يوم (setiap hari).
        - tangi = يصحى · salat Subuh = يصلي الصبح (صلاة، صبح) · adus = يستحمى
        - sarapan = يفطر · mangkat = يطلع / يتحرك (berangkat) · kuliah = يروح الجامعة (من «كلية»)
        - masak = يطبخ · nyapu، ngresiki omah، nyirami kembang = شغل البيت
        - mulih = يروّح · turu = ينام
        مثال: Jam setengah lima aku tangi. Jam pitu aku sarapan. Jam sepuluh bengi aku turu.
        الفعل مابيتغيرش مع الزمن، زي الإندونيسي: الساعة أو wis / lagi / arep بيوضحوا الوقت.
      ar: |
        لتروي يومك: الساعة + الفعل، وsaben dina = كل يوم (setiap hari).
        - tangi = يستيقظ · salat Subuh = يصلي الفجر (صلاة، صبح) · adus = يغتسل
        - sarapan = يفطر · mangkat = ينطلق (berangkat) · kuliah = يدرس في الجامعة (من «كلية»)
        - masak = يطبخ · nyapu وngresiki omah وnyirami kembang = أعمال البيت
        - mulih = يعود إلى البيت · turu = ينام
        مثال: Jam setengah lima aku tangi. Jam pitu aku sarapan. Jam sepuluh bengi aku turu.
        ولا يتغير الفعل مع الزمن كالإندونيسية، بل تحدده الساعة أو wis / lagi / arep.
      en: |
        To tell your day: time + verb; saben dina = every day (setiap hari).
        - tangi = wake up · salat Subuh = pray the dawn prayer (صلاة، صبح) · adus = have a bath
        - sarapan = have breakfast · mangkat = set off (berangkat) · kuliah = go to university (from Arabic «كلية»)
        - masak = cook · nyapu, ngresiki omah, nyirami kembang = chores
        - mulih = go home · turu = sleep
        Example: Jam setengah lima aku tangi. Jam pitu aku sarapan. Jam sepuluh bengi aku turu.
        The verb never changes for time, as in Indonesian: the clock or wis / lagi / arep show when.
    examples:
      - text: Saben dina aku tangi jam setengah lima.
        ar_eg: كل يوم بصحى الساعة أربعة ونص.
        ar: أستيقظ كل يوم في الرابعة والنصف.
        en: Every day I wake up at half past four.
      - text: Neng Kairo, Sari kuliah.
        ar_eg: في القاهرة، ساري بتدرس في الجامعة.
        ar: في القاهرة تدرس ساري في الجامعة.
        en: In Cairo, Sari goes to university.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي فعل معناه «يصحى من النوم»؟
      ar: أي فعل يعني «يستيقظ»؟
      en: Which verb means "wake up"?
    options: [turu, tangi, mulih]
    answer: 1
    explain:
      ar_eg: tangi = يصحى، turu = ينام، mulih = يروّح.
      ar: tangi = يستيقظ، وturu = ينام، وmulih = يعود إلى البيت.
      en: tangi = wake up, turu = sleep, mulih = go home.
    words: [tangi, turu, mulih]
  - id: e02
    type: fill_blank
    sentence: Jam setengah lima aku ___.
    meaning:
      ar_eg: الساعة أربعة ونص بصحى.
      ar: في الرابعة والنصف أستيقظ.
      en: At half past four I wake up.
    options: [turu, mulih, tangi]
    answers: [tangi]
    words: [tangi]
    explain:
      ar_eg: tangi = بصحى، والساعة أربعة ونص الصبح. turu = ينام، وmulih = يروّح البيت.
      ar: tangi = أستيقظ، في الرابعة والنصف فجرًا؛ أما turu فينام، وmulih يعود إلى البيت.
      en: tangi = wake up, at half past four. turu = sleep, mulih = go home.
  - id: e03
    type: fill_blank
    sentence: Saben esuk Sari ___ kembang.
    meaning:
      ar_eg: ساري بتسقي الورد كل يوم الصبح.
      ar: تسقي ساري الزهور كل صباح.
      en: Sari waters the flowers every morning.
    answers: [nyirami]
    words: [nyirami, saben]
    explain:
      ar_eg: nyirami = بتسقي، ومعاها kembang = ورد.
      ar: nyirami = تسقي، ومعها kembang = زهور.
      en: nyirami = water (the plants), with kembang = flowers.
  - id: e04
    type: build_sentence
    source:
      ar_eg: الساعة سبعة بفطر مع ماما.
      ar: في السابعة أفطر مع أمي.
      en: At seven I have breakfast with Mum.
    answer: Jam pitu aku sarapan karo Ibu.
    distractors: [bengi, turu]
    words: [sarapan, karo]
    explain:
      ar_eg: jam pitu = الساعة سبعة، وsarapan karo Ibu = أفطر مع ماما. bengi = بالليل، وturu = ينام، ومش في المعنى.
      ar: jam pitu = الساعة السابعة، وsarapan karo Ibu = أفطر مع أمي؛ أما bengi فليلًا، وturu ينام، وليسا في المعنى.
      en: jam pitu = seven o'clock, sarapan karo Ibu = breakfast with Mum. bengi (night) and turu (sleep) aren't in the meaning.
  - id: e05
    type: match_pairs
    pairs:
      - text: saben dina
        ar_eg: كل يوم
        ar: كل يوم
        en: every day
      - text: sarapan
        ar_eg: يفطر
        ar: يفطر
        en: have breakfast
      - text: masak
        ar_eg: يطبخ
        ar: يطبخ
        en: cook
      - text: salat
        ar_eg: صلاة
        ar: صلاة
        en: prayer
      - text: Subuh
        ar_eg: الفجر
        ar: الفجر
        en: dawn prayer
      - text: sibuk
        ar_eg: مشغول
        ar: مشغول
        en: busy
    words: [saben dina, sarapan, masak, salat, Subuh, sibuk]
  - id: e06
    type: listen
    text: Saben dina aku salat Subuh jam lima.
    options: [Saben dina aku salat Subuh jam lima., Saben dina aku sarapan jam lima., Saben dina aku masak jam lima.]
    answer: 0
    meaning:
      ar_eg: كل يوم بصلي الفجر الساعة خمسة.
      ar: أصلي الفجر كل يوم الساعة الخامسة.
      en: Every day I pray Subuh at five.
    words: [saben dina, salat, Subuh, sarapan, masak]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة معناها «ساري مشغولة كل يوم»؟
      ar: أيّ جملة تعني «ساري مشغولة كل يوم»؟
      en: Which sentence means "Sari is busy every day"?
    options: [Sari sibuk saben dina., Sari masak saben dina., Sari salat saben dina.]
    answer: 0
    words: [sibuk, saben dina, masak, salat]
    explain:
      ar_eg: sibuk = مشغولة. masak = بتطبخ، وsalat = بتصلي، ودول أفعال تانية.
      ar: sibuk = مشغولة؛ أما masak فتطبخ، وsalat تصلّي، وهما فعلان مختلفان.
      en: sibuk = busy. masak = cooks, salat = prays; different verbs.
  - id: e08
    type: listen
    text: Sari tangi jam setengah lima.
    options: [Sari tangi jam setengah lima., Sari tangi jam lima., Sari turu jam setengah lima.]
    answer: 0
    words: [tangi, setengah]
  - id: e09
    type: dictation
    text: Jam pitu aku sarapan.
    meaning:
      ar_eg: الساعة سبعة بفطر.
      ar: في السابعة أفطر.
      en: At seven I have breakfast.
    words: [sarapan]
  - id: e10
    type: speaking
    text: Aku sibuk saben dina, tangi, salat Subuh, sarapan.
    meaning:
      ar_eg: أنا مشغول كل يوم، بصحى وبصلي الفجر وبفطر.
      ar: أنا مشغول كل يوم، أستيقظ وأصلي الفجر وأفطر.
      en: I'm busy every day, I wake up, pray Subuh, have breakfast.
    words: [sibuk, saben dina, tangi, salat, Subuh, sarapan]
dialogue:
  title: Saben dina neng omah
  lines:
    - speaker: Mohamed
      text: Sari, saben dina kowe ngapa wae neng omah?
      ar_eg: ساري، بتعملي إيه كل يوم في البيت؟
      ar: يا ساري، ماذا تفعلين كل يوم في البيت؟
      en: Sari, what do you do every day at home?
    - speaker: Sari
      text: Aku tangi jam setengah lima, salat Subuh.
      ar_eg: بصحى الساعة أربعة ونص، وبصلي الصبح.
      ar: أستيقظ في الرابعة والنصف وأصلي الفجر.
      en: I wake up at half past four and pray the dawn prayer.
    - speaker: Sari
      text: Jam pitu aku sarapan karo Ibu.
      ar_eg: الساعة سبعة بفطر مع ماما.
      ar: في السابعة أفطر مع أمي.
      en: At seven I have breakfast with Mum.
    - speaker: Mohamed
      text: Awan ngapa?
      ar_eg: والضهر بتعملي إيه؟
      ar: وماذا تفعلين ظهرًا؟
      en: And at midday?
    - speaker: Sari
      text: Awan aku masak. Sore aku nyirami kembang.
      ar_eg: الضهر بطبخ. العصر بسقي الورد.
      ar: ظهرًا أطبخ، وعصرًا أسقي الزهور.
      en: At midday I cook. In the afternoon I water the flowers.
    - speaker: Mohamed
      text: Wah, dinamu sibuk tenan!
      ar_eg: ياه، يومك مليان بجد!
      ar: يا لها من أيام مزدحمة!
      en: Wow, your days are really busy!
