schema: kabar.lesson/v1
id: j1.u07.l02
language: jv
title: Enem … sepuluh
can_do:
  ar_eg: تعد من ستة لعشرة.
  ar: أن تعدّ من ستة إلى عشرة.
  en: Count from six to ten.
slides:
  - title: Enem … sepuluh
    body:
      ar_eg: |
        - 6 enem (enam) · 7 pitu (tujuh) · 8 wolu (delapan) · 9 sanga (sembilan) · 10 sepuluh (sepuluh)
        sanga بتتنطق وبتتكتب في الشات «songo». وsepuluh زي الإندونيسي بالظبط.
        وسؤال السوق الأهم: **Regane pira?** = بكام؟ (في الشات: Regane piro?)
      ar: |
        - 6 enem (enam) · 7 pitu (tujuh) · 8 wolu (delapan) · 9 sanga (sembilan) · 10 sepuluh (sepuluh)
        وsanga تُنطق وتُكتب في الدردشة «songo»، وsepuluh كالإندونيسية.
        وأهم سؤال في السوق: **Regane pira?** = بكم؟ (في الدردشة: Regane piro?)
      en: |
        - 6 enem (enam) · 7 pitu (tujuh) · 8 wolu (delapan) · 9 sanga (sembilan) · 10 sepuluh (sepuluh)
        sanga is said and chat-spelled "songo". sepuluh is identical to Indonesian.
        And the key market question: **Regane pira?** = How much? (chat: Regane piro?)
    grammar: jv.number.ngoko
    examples:
      - text: Regane pira?
        ar_eg: بكام؟
        ar: بكم؟
        en: How much is it?
      - text: Pitu, wolu, sanga, sepuluh.
        ar_eg: سبعة، تمانية، تسعة، عشرة.
        ar: سبعة، ثمانية، تسعة، عشرة.
        en: Seven, eight, nine, ten.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: siji
        ar_eg: ١ واحد (satu)
        ar: ١ واحد (satu)
        en: 1 (satu)
      - text: loro
        ar_eg: ٢ اتنين (dua)
        ar: ٢ اثنان (dua)
        en: 2 (dua)
      - text: telu
        ar_eg: ٣ تلاتة (tiga)
        ar: ٣ ثلاثة (tiga)
        en: 3 (tiga)
      - text: papat
        ar_eg: ٤ أربعة (empat)
        ar: ٤ أربعة (empat)
        en: 4 (empat)
      - text: wolu
        ar_eg: ٨ تمانية (delapan)
        ar: ٨ ثمانية (delapan)
        en: 8 (delapan)
    words: [siji, loro, telu, papat, wolu]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول ٨ بالجاوي؟
      ar: كيف تقول ٨ بالجاوية؟
      en: How do you say 8 in Javanese?
    options: [pitu, wolu, sanga]
    answer: 1
    words: [wolu]
  - id: e03
    type: listen
    text: Pitu, wolu, sanga, sepuluh.
    options: ['Enem, pitu, wolu, sanga.', 'Pitu, wolu, sanga, sepuluh.', 'Siji, loro, telu, papat.']
    answer: 1
    meaning:
      ar_eg: سبعة، تمانية، تسعة، عشرة.
      ar: سبعة، ثمانية، تسعة، عشرة.
      en: Seven, eight, nine, ten.
    words: [pitu, wolu, sanga, sepuluh]
  - id: e04
    type: fill_blank
    sentence: enem, pitu, ___, sanga
    meaning:
      ar_eg: ستة، سبعة، تمانية، تسعة
      ar: ستة، سبعة، ثمانية، تسعة
      en: six, seven, eight, nine
    options: [wolu, lima, papat]
    answers: [wolu]
    words: [wolu]
  - id: e05
    type: dictation
    text: sanga
    meaning:
      ar_eg: تسعة (بتتنطق songo)
      ar: تسعة (تُنطق songo)
      en: nine (said songo)
    words: [sanga]
  - id: e06
    type: speaking
    text: Enem, pitu, wolu, sanga, sepuluh.
    meaning:
      ar_eg: ستة، سبعة، تمانية، تسعة، عشرة.
      ar: ستة، سبعة، ثمانية، تسعة، عشرة.
      en: Six, seven, eight, nine, ten.
    words: [enem, pitu, wolu, sanga, sepuluh]
dialogue:
  lines:
    - speaker: Mohamed
      text: Yudha, omahmu nomer pira?
      ar_eg: يودا، بيتك رقم كام؟
      ar: يودا، ما رقم بيتك؟
      en: Yudha, what number is your house?
    - speaker: Mas Yudha
      text: Nomer pitu. Omahmu?
      ar_eg: رقم سبعة. وبيتك؟
      ar: رقم سبعة. وبيتك؟
      en: Number seven. Yours?
    - speaker: Mohamed
      text: Omahku nomer sanga.
      ar_eg: بيتي رقم تسعة.
      ar: بيتي رقم تسعة.
      en: My house is number nine.
    - speaker: Mas Yudha
      text: Wah, cedhak!
      ar_eg: الله، قريبين!
      ar: رائع، قريب!
      en: Oh, that's close!
new_words:
  - word: enem
    pos: number
    ar_eg: 'ستة (enam)؛ قبل ewu: nem'
    ar: 'ستة (enam)؛ قبل ewu: nem'
    en: 'six (enam); before ewu: nem'
  - word: pitu
    pos: number
    ar_eg: 'سبعة (tujuh)؛ قبل ewu: pitung'
    ar: 'سبعة (tujuh)؛ قبل ewu: pitung'
    en: 'seven (tujuh); before ewu: pitung'
  - word: wolu
    pos: number
    ar_eg: 'تمانية (delapan)؛ قبل ewu: wolung'
    ar: 'ثمانية (delapan)؛ قبل ewu: wolung'
    en: 'eight (delapan); before ewu: wolung'
  - word: sanga
    pos: number
    ar_eg: 'تسعة (sembilan)، بتتنطق songo؛ قبل ewu: sangang'
    ar: 'تسعة (sembilan)، تُنطق songo؛ قبل ewu: sangang'
    en: 'nine (sembilan), said songo; before ewu: sangang'
  - word: sepuluh
    pos: number
    ar_eg: عشرة (sepuluh)
    ar: عشرة (sepuluh)
    en: ten (sepuluh)
