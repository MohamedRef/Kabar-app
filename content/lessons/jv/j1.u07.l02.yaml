dialogue:
  title: HP-né Cak Heru
  lines:
    - speaker: Cak Heru
      text: Rek, HP iki arep diculké. Sapa sing arep tuku?
      ar_eg: يا جماعة، الموبايل ده هيتباع. مين عايز يشتري؟
      ar: يا جماعة، هذا الهاتف للبيع. من يريد أن يشتري؟
      en: Guys, this phone is up for sale. Who wants to buy it?
    - speaker: Mohamed
      text: arp dicul piro, Cak?
      ar_eg: ناوي تبيعه بكام يا معلم؟
      ar: بكم ستبيعه يا أخي؟
      en: How much are you letting it go for, Cak?
    - speaker: Cak Heru
      text: Sejuta ae.
      ar_eg: مليون بس.
      ar: مليون فقط.
      en: Just a million.
    - speaker: Mohamed
      text: Murah! Aku tuku, Cak.
      ar_eg: رخيص! أنا هشتريه يا معلم.
      ar: رخيص! سأشتريه يا أخي.
      en: Cheap! I'll buy it, Cak.
    - speaker: Cak Heru
      text: Oke. Sesuk tak terké nang omahmu.
      ar_eg: تمام. بكرة هوصّلهولك البيت.
      ar: حسنًا. غدًا أوصله إلى بيتك.
      en: OK. Tomorrow I'll bring it to your house.
