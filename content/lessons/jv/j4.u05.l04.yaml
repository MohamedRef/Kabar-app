    words: [pengumuman, rapat, salam, gotong royong]
  - id: e03
    type: listen
    text: Mas Rudi durung bales pesenku.
    question:
      ar_eg: ماس رودي عمل إيه؟
      ar: ماذا فعل ماس رودي؟
      en: What has Mas Rudi done?
    options: [ماس رودي لسه ما ردّش, ماس رودي اتصل, ماس رودي جه الجمعية]
    answer: 0
    meaning:
      ar_eg: ماس رودي لسه ما ردّش على رسالتي.
      ar: لم يردّ ماس رودي على رسالتي بعد.
      en: Mas Rudi hasn't replied to my message yet.
    words: [bales]
  - id: e04
    type: fill_blank
    sentence: Sesuk ___ kulawarga ing daleme Simbah.
    meaning:
      ar_eg: بكرة ___ العيلة في بيت تيتة.
      ar: غدًا ___ العائلة في بيت الجدّة.
