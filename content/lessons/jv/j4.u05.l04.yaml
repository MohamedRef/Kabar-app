      en: Please give my regards to Grandma.
    answer: Titip salam kagem Simbah, nggih.
    distractors: [rapat, kumpul]
    words: [salam, rapat, kumpul]
  - id: e08
    type: translate
    direction: from_target
    source_text: Warga kampung gotong royong ndandani dalan.
    answers_meaning:
      ar_eg: [أهل الحتة بيصلّحوا الطريق مع بعض, أهل القرية بيصلحوا الشارع بإيديهم سوا]
      ar: [يتعاون أهل القرية في إصلاح الطريق, يصلح أهل الحيّ الطريق معًا]
      en: [The villagers are fixing the road together, The neighbourhood is repairing the road together]
    words: [gotong royong]
  - id: e09
    type: speaking
    text: Bapak saweg rapat ing kantor.
    meaning:
      ar_eg: الأستاذ في اجتماع في المكتب.
      ar: الوالد في اجتماع في المكتب.
      en: Father is in a meeting at the office.
    words: [rapat]
  - id: e10
    type: multiple_choice
    question: Kulawarga ___ ing daleme Simbah saben Minggu.
    question_meaning:
      ar_eg: العيلة ___ في بيت تيتة كل أحد.
      ar: العائلة ___ في بيت الجدّة كل أحد.
      en: The family ___ at Grandma's every Sunday.
    options: [bales, pengumuman, kumpul]
    answer: 2
    explain:
      ar_eg: kumpul = يتجمّعوا.
      ar: kumpul = يجتمعون.
      en: kumpul = gather.
    words: [kumpul, bales, pengumuman]
dialogue:
  lines:
    - speaker: Mbak Ratri
      text: Mohamed, sesuk arisan kulawarga neng daleme Simbah. Kowe teka, to?
      ar_eg: يا محمد، بكرة الجمعية بتاعة العيلة في بيت تيتة. هتيجي؟
      ar: يا محمد، غدًا جمعية العائلة في بيت الجدّة. ستأتي؟
      en: Mohamed, the family arisan is at Grandma's tomorrow. Are you coming?
    - speaker: Mohamed
      text: Iya, Mbak. Aku teka. Mas Rudi rawuh?
      ar_eg: أيوه يا مباك، جاي. وماس رودي جاي؟
      ar: نعم يا مباك، سآتي. وهل يحضر ماس رودي؟
      en: Yes, Mbak, I'll come. Is Mas Rudi coming?
    - speaker: Mbak Ratri
      text: Mas Rudi durung bales. Mengko aku nelpon.
      ar_eg: ماس رودي لسه ما ردّش. هتصل بيه بعدين.
      ar: لم يردّ ماس رودي بعد. سأتصل به لاحقًا.
      en: Mas Rudi hasn't replied. I'll call him later.
    - speaker: Mohamed
      text: Ana pengumuman apa ing grup?
      ar_eg: في إعلان إيه في الجروب؟
      ar: ما الإعلان في المجموعة؟
      en: What's the announcement in the group?
    - speaker: Mbak Ratri
      text: Ra ana. Kumpul wae, mangan sega.
      ar_eg: مفيش. لمّة وبس، وناكل رز.
      ar: لا شيء. نجتمع فقط ونأكل.
      en: Nothing. Just getting together and eating.
    - speaker: Mohamed
      text: Sip. Titip salam kanggo Simbah, Mbak.
      ar_eg: تمام. سلّميلي على تيتة يا مباك.
      ar: حسنًا. بلّغي سلامي للجدّة يا مباك.
      en: Great. Give my regards to Grandma, Mbak.
