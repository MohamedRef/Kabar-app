    question: Mas Rudi ora bales. Aku ___ wae.
    question_meaning:
      ar_eg: ماس رودي ما ردّش. أنا هـ ___ أحسن.
      ar: لم يردّ ماس رودي، سـ ___ إذن.
      en: Mas Rudi isn't replying. I'll just ___.
