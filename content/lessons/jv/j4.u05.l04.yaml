    answer: 1
    explain:
      ar_eg: nelpon = يتصل بالتليفون.
      ar: nelpon = يتّصل هاتفيًّا.
      en: nelpon = phone (him).
    words: [nelpon, kumpul, rapat, bales]
  - id: e06
    type: fill_blank
    sentence: 'Ana ___ ing grup WA: arisan dina Minggu.'
    meaning:
      ar_eg: 'في ___ في جروب الواتساب: الجمعية يوم الأحد.'
      ar: 'في المجموعة ___: الجمعية يوم الأحد.'
      en: 'There''s an ___ in the WhatsApp group: the arisan is on Sunday.'
    options: [pengumuman, gotong royong, bales]
    answers: [pengumuman]
    words: [pengumuman, gotong royong, bales, arisan]
  - id: e07
