        ar: يجتمعون
        en: gather
      - text: arisan
        ar_eg: جمعية، لمّة عيلة
        ar: جمعية ادّخار، لقاء عائلي
        en: savings club, get-together
      - text: bales
        ar_eg: يرد (على رسالة)
        ar: يردّ (على رسالة)
        en: reply
      - text: nelpon
        ar_eg: يتصل بالتليفون
        ar: يتّصل هاتفيًّا
        en: phone
    words: [kumpul, arisan, bales, nelpon]
  - id: e02
    type: match_pairs
