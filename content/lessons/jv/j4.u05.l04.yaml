schema: kabar.lesson/v1
id: j4.u05.l04
language: jv
title: Arisan kulawarga
can_do:
  ar_eg: 'تتابع جروب العيلة: لمّة وجمعية وإعلان، وترد وتتصل وتبعت سلامك.'
  ar: 'أن تتابع مجموعة العائلة: اجتماع وجمعية وإعلان، وتردّ وتتصل وترسل سلامك.'
  en: 'Follow the family group chat: a get-together, an arisan, an announcement; reply, call and send your regards.'
slides:
  - title: Kumpul, arisan, bales
    body:
      ar_eg: |
        - arisan = جمعية (زي الجمعية عندنا: كل مرة واحد بيقبض)، وكمان لمّة العيلة اللي بتتعمل فيها: «arisan kulawarga».
        - kumpul = يتجمّعوا. rapat = اجتماع (شغل أو حي). pengumuman = إعلان.
        - nelpon = يتصل بالتليفون، bales = يرد على رسالة: «Mas Rudi durung bales.»
        - salam = سلام: «Titip salam kagem Simbah» = سلّملي على تيتة.
        - gotong royong = الناس كلها تشيل مع بعض في شغل للحي من غير فلوس.
        وفي الجروب بنكتب ngoko alus: ngoko، بس الأفعال الخاصة بالكبار krama inggil (Mas Rudi rawuh).
        - في الشارع: ra = ora (لأ / مش)، neng = menyang / ing (لـ، في).
        - to كلمة صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        - arisan = جمعية ادّخار (كالجمعية عندنا: يقبض واحد كل مرّة)، وأيضًا لقاء العائلة الذي تُقام فيه: «arisan kulawarga».
        - kumpul = يجتمعون. rapat = اجتماع (عمل أو حيّ). pengumuman = إعلان.
        - nelpon = يتّصل هاتفيًّا، bales = يردّ على رسالة: «Mas Rudi durung bales.»
        - salam = سلام: «Titip salam kagem Simbah» = بلّغ سلامي للجدّة.
        - gotong royong = أن يتعاون الجميع في عمل للحيّ بلا أجر.
        وفي المجموعة نكتب ngoko alus: نغوكو مع أفعال krama inggil لأفعال الكبار (Mas Rudi rawuh).
        - في كلام الشارع: ra = ora (لا / ليس)، neng = menyang / ing (إلى، في).
        - to أداة صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        - arisan = rotating savings club (like our gam'eya: one member collects each round), and the family get-together where it happens: "arisan kulawarga".
        - kumpul = gather. rapat = meeting (work or neighbourhood). pengumuman = announcement.
        - nelpon = phone, bales = reply to a message: "Mas Rudi durung bales."
        - salam = regards: "Titip salam kagem Simbah" = give my regards to Grandma.
        - gotong royong = everyone pitching in on community work, unpaid.
        In the group chat we write ngoko alus: ngoko, with krama inggil verbs for what elders do (Mas Rudi rawuh).
        - On the street: ra = ora (no, not), neng = menyang / ing (to, at).
        - to is a small particle that adds feeling; the sentence is correct without it.
    examples:
      - text: Sesuk arisan kulawarga ing daleme Simbah.
        ar_eg: بكرة لمّة العيلة والجمعية في بيت تيتة.
        ar: غدًا لقاء العائلة وجمعيّتها في بيت الجدّة.
        en: Tomorrow is the family arisan at Grandma's house.
      - text: Mas Rudi durung bales. Aku nelpon wae.
        ar_eg: ماس رودي لسه ما ردّش. هتصل بيه أحسن.
        ar: لم يردّ ماس رودي بعد، سأتصل به.
        en: Mas Rudi hasn't replied. I'll just call him.
      - text: Titip salam kagem Simbah, nggih.
        ar_eg: سلّملي على تيتة لو سمحت.
        ar: بلّغ سلامي للجدّة من فضلك.
        en: Please give my regards to Grandma.
