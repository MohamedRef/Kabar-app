schema: kabar.lesson/v1
id: j1.u07.l04
language: jv
title: Diculke
can_do:
  ar_eg: تستعمل أفعال -ake / -ke.
  ar: أن تستعمل الأفعال بـ -ake / -ke.
  en: Use -ake / -ke verbs.
slides:
  - title: -ake = -kan
    body:
      ar_eg: |
        إنت عارف -kan من الإندونيسي: belikan، ambilkan. الجاوي عنده **-ake**، وفي الكلام والشات بتتختصر **-ke**.
        أول استعمال: إنك تعمل الحاجة «لحد تاني»:
        - jupuk = ياخد → jupukake / jupukke = يجيب لحد (ambilkan).
        - tuku = يشتري → tukokake / tukokke = يشتري لحد (belikan).
        ومع tak- (أنا هـ): Tak tukokke kopi = هجيبلك قهوة (Kubelikan kopi).
      ar: |
        تعرف -kan من الإندونيسية (belikan، ambilkan)، ونظيرها الجاوي **-ake**، وتُختصر في الكلام والدردشة إلى **-ke**.
        أول استعمالاتها الفعل لأجل غيرك:
        - jupuk = يأخذ → jupukake / jupukke = يُحضر لغيره (ambilkan).
        - tuku = يشتري → tukokake / tukokke = يشتري لغيره (belikan).
        ومع tak-: Tak tukokke kopi = سأشتري لك قهوة (Kubelikan kopi).
      en: |
        You know -kan from Indonesian: belikan, ambilkan. Javanese has **-ake**, shortened to **-ke** in speech and chats.
        First use: doing something for someone:
        - jupuk = take → jupukake / jupukke = fetch for someone (ambilkan).
        - tuku = buy → tukokake / tukokke = buy for someone (belikan).
        With tak- (I'll): Tak tukokke kopi = I'll buy you a coffee (Kubelikan kopi).
    grammar: jv.suffix.ake
    examples:
      - text: Tak tukokke kopi, ya.
        ar_eg: هجيبلك قهوة، ماشي؟
        ar: سأشتري لك قهوة، حسنًا؟
        en: I'll buy you a coffee, OK?
      - text: Sik, tak jupukke.
        ar_eg: استنى، هجيبهولك.
        ar: انتظر، سأحضره لك.
        en: Hold on, I'll get it for you.
  - title: Ucul → diculke · arp dicul piro
    body:
      ar_eg: |
        تاني استعمال: «تخلّي الحاجة تحصل»، زي وزن «فعّل» في العربي (نزل → نزّل).
        - **ucul** = يتفك / يفلت.
        - di- + ucul + -ke = **diuculke**، وفي الكلام **diculke** = يتساب (dilepaskan).
        وفي سوق الحاجات المستعملة diculke معناها «يتباع»، زي «dilepas» في الإندونيسي: HP-ne arep diculke = الموبايل هيتباع.
        ودي رسالة الـ SPEC المشهورة. فكّها كلمة كلمة:
        - arp = arep (هـ / ناوي)
        - dicul = diculke (يتساب = يتباع)
        - piro = pira (بكام)
        يعني: «arep diculke pira?» = ناوي تبيعه بكام؟
        وده بالظبط زي الفرانكو: الناس بتكتب اللي بتسمعه وبتختصر كل حاجة.
      ar: |
        والاستعمال الثاني التعدية والتسبيب، كصيغة «فعّل» في العربية (نزل → نزّل):
        - **ucul** = انفكّ / انفلت.
        - di- + ucul + -ke = **diuculke**، وفي الكلام **diculke** = يُطلق / يُترك (dilepaskan).
        وفي سوق المستعمل تعني diculke «يُباع»، كـ«dilepas» في الإندونيسية: HP-ne arep diculke = الهاتف سيُباع.
        وهذه رسالة الـ SPEC الشهيرة، فلنفكّها لفظًا لفظًا:
        - arp = arep (سوف)
        - dicul = diculke (يُترك = يُباع)
        - piro = pira (بكم)
        أي: «arep diculke pira?» = بكم ستبيعه؟
        وهذا كالكتابة بالفرانكو: يكتب الناس ما يسمعون ويختصرون كل شيء.
      en: |
        Second use: making something happen, like Arabic Form II (نزل → نزّل).
        - **ucul** = come loose.
        - di- + ucul + -ke = **diuculke**, spoken **diculke** = let go, released (dilepaskan).
        In second-hand trading diculke means "sold off", like Indonesian "dilepas": HP-ne arep diculke = The phone is going to be sold.
        The famous SPEC message, word by word:
        - arp = arep (going to)
        - dicul = diculke (let go = sold)
        - piro = pira (how much)
        So: "arep diculke pira?" = How much are you letting it go for?
        It's like Franco-Arabic: people type what they hear and shorten everything.
    grammar: jv.suffix.ake
    examples:
      - text: HP-ne arep diculke pira, Mas?
        ar_eg: ناوي تبيع الموبايل بكام يا أستاذ؟
        ar: بكم ستبيع الهاتف يا أخي؟
        en: How much will you sell the phone for, Mas?
      - text: arp dicul piro
        ar_eg: ناوي تبيعه بكام؟ (شات)
        ar: بكم ستبيعه؟ (دردشة)
        en: How much will you sell it for? (chat)
  - title: -ake, -kake, -ke
    body:
      ar_eg: |
        الشكل:
        - الكلمة آخرها ساكن ⇐ -ake: jupuk → jupukake.
        - آخرها حرف متحرك ⇐ -kake. وtuku بالذات بتبقى tukokake (u بتبقى o).
        - في الكلام: كله -ke: jupukke، tukokke.
        ومع di- وtak- الفعل بيفضل على أصله: diculke، ditukokke، tak jupukke.
        غلطة مشهورة: «tukuke» ⇐ الصح tukokke.
      ar: |
        الصيغة:
        - بعد الساكن ⇐ -ake: jupuk → jupukake.
        - بعد الصائت ⇐ -kake، وtuku خاصةً تصير tukokake (تصير u ‏o).
        - وفي الكلام -ke للجميع: jupukke، tukokke.
        ومع di- وtak- يبقى الفعل على جذره: diculke، ditukokke، tak jupukke.
        وخطأ شائع: «tukuke»، والصواب tukokke.
      en: |
        Shape:
        - Ends in a consonant ⇒ -ake: jupuk → jupukake.
        - Ends in a vowel ⇒ -kake; tuku in particular becomes tukokake (u turns o).
        - In speech it's all -ke: jupukke, tukokke.
        With di- and tak- the verb stays in its base: diculke, ditukokke, tak jupukke.
        Classic slip: "tukuke" ⇒ the right form is tukokke.
    grammar: jv.suffix.ake
    examples:
      - text: Tak jupukake, ya.
        ar_eg: هجيبهولك، ماشي؟
        ar: سأحضره لك، حسنًا؟
        en: I'll fetch it for you, OK?
  - title: Tak terke
    body:
      ar_eg: |
        فعل كمان هتسمعه كتير: ater (يوصّل) → **terke** = يوصّل حد (antarkan).
        - Ayo, tak terke mulih = يلا، هوصّلك البيت. (mulih = يروّح = pulang)
        - Tak terke nang stasiun = هوصّلك المحطة.
        وفي سورابايا هتسمع الأمر بـ -no: «Tukokno!» = اشتريهولي! بس الأمر هنتعلمه في J2.
      ar: |
        وفعل آخر شائع: ater (يُوصل) → **terke** = يوصل أحدًا (antarkan).
        - Ayo, tak terke mulih = هيا، سأوصلك إلى البيت (mulih = يعود إلى البيت = pulang).
        - Tak terke nang stasiun = سأوصلك إلى المحطة.
        وستسمع في سورابايا الأمر بـ -no: «Tukokno!» = اشترِه لي! لكن الأمر يأتي في J2.
      en: |
        One more you'll hear a lot: ater (take someone) → **terke** = take someone somewhere (antarkan).
        - Ayo, tak terke mulih = Come on, I'll take you home. (mulih = go home = pulang)
        - Tak terke nang stasiun = I'll take you to the station.
        In Surabaya you'll hear commands with -no: "Tukokno!" = Buy it for me! Commands come in J2.
    grammar: jv.suffix.ake
    examples:
      - text: Ayo, tak terke mulih.
        ar_eg: يلا، هوصّلك البيت.
        ar: هيا، سأوصلك إلى البيت.
        en: Come on, I'll take you home.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: jupuk
        ar_eg: ياخد (ambil)
        ar: يأخذ (ambil)
        en: take (ambil)
      - text: jupukke
        ar_eg: يجيب لحد (ambilkan)
        ar: يُحضر لأحد (ambilkan)
        en: fetch for someone (ambilkan)
      - text: tukokke
        ar_eg: يشتري لحد (belikan)
        ar: يشتري لأحد (belikan)
        en: buy for someone (belikan)
      - text: ucul
        ar_eg: يتفك / يفلت (lepas)
        ar: يفلت (lepas)
        en: come loose, slip (lepas)
      - text: diculke
        ar_eg: يتساب / يتباع (dilepas)
        ar: يُترك / يُباع (dilepas)
        en: let go, sold (dilepas)
      - text: HP
        ar_eg: موبايل
        ar: هاتف محمول
        en: mobile phone
    words: [jupuk, jupukke, tukokke, ucul, diculke, HP]
  - id: e02
    type: multiple_choice
    question: arp dicul piro
    question_meaning:
      ar_eg: الرسالة دي معناها إيه؟ اختار الشكل الكامل.
      ar: ما معنى هذه الرسالة؟ اختر الصيغة الكاملة.
      en: What does this message say? Pick the full form.
    options: ['arep dituku pira?', 'arep diterke pira?', 'arep diculke pira?']
    answer: 2
    explain:
      ar_eg: 'arp = arep، dicul = diculke، piro = pira: ناوي تبيعه بكام؟'
      ar: 'arp = arep، وdicul = diculke، وpiro = pira: بكم ستبيعه؟'
      en: 'arp = arep, dicul = diculke, piro = pira: How much will you sell it for?'
    words: [arep, diculke, pira]
  - id: e03
    type: listen
    text: Sik, tak jupukke.
    options: ['Sik, tak tukokke.', 'Sik, tak terke.', 'Sik, tak jupukke.']
    answer: 2
    words: [jupukke, sik]
  - id: e04
    type: fill_blank
    sentence: HP-ne arep ___ pira, Mas?
    meaning:
      ar_eg: ناوي تبيع الموبايل بكام يا أستاذ؟
      ar: بكم ستبيع الهاتف يا أخي؟
      en: How much will you sell the phone for, Mas?
    options: [diculke, terke, tukokke]
    answers: [diculke]
    explain:
      ar_eg: diculke = يتساب للمشتري، يعني يتباع.
      ar: diculke = يُترك للمشتري، أي يُباع.
      en: diculke = let go to a buyer, i.e. sold.
    words: [diculke]
  - id: e05
    type: build_sentence
    source:
      ar_eg: هجيبلك قهوة، ماشي؟
      ar: سأشتري لك قهوة، حسنًا؟
      en: I'll buy you a coffee, OK?
    answer: Tak tukokke kopi, ya.
    distractors: [tuku, diculke]
    words: [tak, tukokke, kopi]
  - id: e06
    type: listen
    text: Sik, HP-ne tak jupuk.
    options: ['Sik, HP-ne tak jupuk.', 'Sik, HP-ne tak tukokke.', 'Sik, HP-ne ucul.']
    answer: 0
    meaning:
      ar_eg: استنى، هاخد الموبايل.
      ar: لحظة، سآخذ الهاتف.
      en: Hang on, I'll grab the phone.
    words: [sik, HP, jupuk, tukokke, ucul]
  - id: e07
    type: speaking
    text: Aduh, HP-ku ucul! Tak jupuk sik.
    meaning:
      ar_eg: يا خبر، الموبايل وقع مني! هجيبه الأول.
      ar: يا للمصيبة، أفلتَ الهاتف من يدي! سألتقطه أولًا.
      en: Oh no, my phone slipped! Let me grab it first.
    words: [HP, ucul, jupuk, sik]
dialogue:
  title: HP-ne Cak Heru
  lines:
    - speaker: Cak Heru
      text: Rek, HP iki arep diculke. Sapa sing arep tuku?
      ar_eg: يا جماعة، الموبايل ده هيتباع. مين عايز يشتري؟
      ar: يا جماعة، هذا الهاتف للبيع. من يريد أن يشتري؟
      en: Guys, this phone is up for sale. Who wants to buy it?
    - speaker: Mohamed
      text: arp dicul piro, Cak?
      ar_eg: ناوي تبيعه بكام يا معلم؟
      ar: بكم ستبيعه يا أخي؟
      en: How much are you letting it go for, Cak?
    - speaker: Cak Heru
      text: Sejuta wae.
      ar_eg: مليون بس.
      ar: مليون فقط.
      en: Just a million.
    - speaker: Mohamed
      text: Murah! Aku tuku, Cak.
      ar_eg: رخيص! أنا هشتريه يا معلم.
      ar: رخيص! سأشتريه يا أخي.
      en: Cheap! I'll buy it, Cak.
    - speaker: Cak Heru
      text: Oke. Sesuk tak terke nang omahmu.
      ar_eg: تمام. بكرة هوصّلهولك البيت.
      ar: حسنًا. غدًا أوصله إلى بيتك.
      en: OK. Tomorrow I'll bring it to your house.
new_words:
  - word: jupuk
    pos: verb
    ar_eg: ياخد (ambil)؛ jupukke = يجيب لحد
    ar: يأخذ (ambil)؛ jupukke = يُحضر لغيره
    en: take (ambil); jupukke = fetch for someone
  - word: tukokke
    pos: verb
    ar_eg: يشتري لحد (belikan)، من tuku
    ar: يشتري لغيره (belikan)، من tuku
    en: buy for someone (belikan), from tuku
  - word: ucul
    pos: verb
    ar_eg: يتفك / يفلت (lepas)
    ar: ينفكّ / ينفلت (lepas)
    en: come loose (lepas)
  - word: HP
    pos: noun
    ar_eg: موبايل (زي الإندونيسي، بتتنطق «ها-بي»)
    ar: هاتف محمول (كالإندونيسية، ويُنطق «ها-بي»)
    en: mobile phone (as in Indonesian, said "ha-pe")
