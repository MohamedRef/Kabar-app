schema: kabar.lesson/v1
id: j1.u07.l04
language: jv
title: Diculké
can_do:
  ar_eg: تستعمل أفعال -aké / -ké.
  ar: أن تستعمل الأفعال بـ -aké / -ké.
  en: Use -aké / -ké verbs.
slides:
  - title: -aké = -kan
    body:
      ar_eg: |
        إنت عارف -kan من الإندونيسي: belikan، ambilkan. الجاوي عنده **-aké**، وفي الكلام والشات بتتختصر **-ké**.
        أول استعمال: إنك تعمل الحاجة «لحد تاني»:
        - jupuk = ياخد → jupukaké / jupukké = يجيب لحد (ambilkan).
        - tuku = يشتري → tukokaké / tukokké = يشتري لحد (belikan).
        ومع tak- (أنا هـ): Tak tukokké kopi = هجيبلك قهوة (Kubelikan kopi).
      ar: |
        تعرف -kan من الإندونيسية (belikan، ambilkan)، ونظيرها الجاوي **-aké**، وتُختصر في الكلام والدردشة إلى **-ké**.
        أول استعمالاتها الفعل لأجل غيرك:
        - jupuk = يأخذ → jupukaké / jupukké = يُحضر لغيره (ambilkan).
        - tuku = يشتري → tukokaké / tukokké = يشتري لغيره (belikan).
        ومع tak-: Tak tukokké kopi = سأشتري لك قهوة (Kubelikan kopi).
      en: |
        You know -kan from Indonesian: belikan, ambilkan. Javanese has **-aké**, shortened to **-ké** in speech and chats.
        First use: doing something for someone:
        - jupuk = take → jupukaké / jupukké = fetch for someone (ambilkan).
        - tuku = buy → tukokaké / tukokké = buy for someone (belikan).
        With tak- (I'll): Tak tukokké kopi = I'll buy you a coffee (Kubelikan kopi).
    grammar: jv.suffix.ake
    examples:
      - text: Tak tukokké kopi, ya.
        ar_eg: هجيبلك قهوة، ماشي؟
        ar: سأشتري لك قهوة، حسنًا؟
        en: I'll buy you a coffee, OK?
      - text: Sek, tak jupukké.
        ar_eg: استنى، هجيبهولك.
        ar: انتظر، سأحضره لك.
        en: Hold on, I'll get it for you.
  - title: Ucul → diculké · arp dicul piro
    body:
      ar_eg: |
        تاني استعمال: «تخلّي الحاجة تحصل»، زي وزن «فعّل» في العربي (نزل → نزّل).
        - **ucul** = يتفك / يفلت.
        - di- + ucul + -ké = **diuculké**، وفي الكلام **diculké** = يتساب (dilepaskan).
        وفي سوق الحاجات المستعملة diculké معناها «يتباع»، زي «dilepas» في الإندونيسي: HP-né arep diculké = الموبايل هيتباع.
        ودي رسالة الـ SPEC المشهورة. فكّها كلمة كلمة:
        - arp = arep (هـ / ناوي)
        - dicul = diculké (يتساب = يتباع)
        - piro = pira (بكام)
        يعني: «arep diculké pira?» = ناوي تبيعه بكام؟
        وده بالظبط زي الفرانكو: الناس بتكتب اللي بتسمعه وبتختصر كل حاجة.
      ar: |
        والاستعمال الثاني التعدية والتسبيب، كصيغة «فعّل» في العربية (نزل → نزّل):
        - **ucul** = انفكّ / انفلت.
        - di- + ucul + -ké = **diuculké**، وفي الكلام **diculké** = يُطلق / يُترك (dilepaskan).
        وفي سوق المستعمل تعني diculké «يُباع»، كـ«dilepas» في الإندونيسية: HP-né arep diculké = الهاتف سيُباع.
        وهذه رسالة الـ SPEC الشهيرة، فلنفكّها لفظًا لفظًا:
        - arp = arep (سوف)
        - dicul = diculké (يُترك = يُباع)
        - piro = pira (بكم)
        أي: «arep diculké pira?» = بكم ستبيعه؟
        وهذا كالكتابة بالفرانكو: يكتب الناس ما يسمعون ويختصرون كل شيء.
      en: |
        Second use: making something happen, like Arabic Form II (نزل → نزّل).
        - **ucul** = come loose.
        - di- + ucul + -ké = **diuculké**, spoken **diculké** = let go, released (dilepaskan).
        In second-hand trading diculké means "sold off", like Indonesian "dilepas": HP-né arep diculké = The phone is going to be sold.
        The famous SPEC message, word by word:
        - arp = arep (going to)
        - dicul = diculké (let go = sold)
        - piro = pira (how much)
        So: "arep diculké pira?" = How much are you letting it go for?
        It's like Franco-Arabic: people type what they hear and shorten everything.
    grammar: jv.suffix.ake
    examples:
      - text: HP-né arep diculké pira, Mas?
        ar_eg: ناوي تبيع الموبايل بكام يا أستاذ؟
        ar: بكم ستبيع الهاتف يا أخي؟
        en: How much will you sell the phone for, Mas?
      - text: arp dicul piro
        ar_eg: ناوي تبيعه بكام؟ (شات)
        ar: بكم ستبيعه؟ (دردشة)
        en: How much will you sell it for? (chat)
  - title: -aké, -kaké, -ké
    body:
      ar_eg: |
        الشكل:
        - الكلمة آخرها ساكن ⇐ -aké: jupuk → jupukaké.
        - آخرها حرف متحرك ⇐ -kaké. وtuku بالذات بتبقى tukokaké (u بتبقى o).
        - في الكلام: كله -ké: jupukké، tukokké.
        ومع di- وtak- الفعل بيفضل على أصله: diculké، ditukokké، tak jupukké.
        غلطة مشهورة: «tukuké» ⇐ الصح tukokké.
      ar: |
        الصيغة:
        - بعد الساكن ⇐ -aké: jupuk → jupukaké.
        - بعد الصائت ⇐ -kaké، وtuku خاصةً تصير tukokaké (تصير u ‏o).
        - وفي الكلام -ké للجميع: jupukké، tukokké.
        ومع di- وtak- يبقى الفعل على جذره: diculké، ditukokké، tak jupukké.
        وخطأ شائع: «tukuké»، والصواب tukokké.
      en: |
        Shape:
        - Ends in a consonant ⇒ -aké: jupuk → jupukaké.
        - Ends in a vowel ⇒ -kaké; tuku in particular becomes tukokaké (u turns o).
        - In speech it's all -ké: jupukké, tukokké.
        With di- and tak- the verb stays in its base: diculké, ditukokké, tak jupukké.
        Classic slip: "tukuké" ⇒ the right form is tukokké.
    grammar: jv.suffix.ake
    examples:
      - text: Tak jupukaké, ya.
        ar_eg: هجيبهولك، ماشي؟
        ar: سأحضره لك، حسنًا؟
        en: I'll fetch it for you, OK?
  - title: Tak terké
    body:
      ar_eg: |
        فعل كمان هتسمعه كتير: ater (يوصّل) → **terké** = يوصّل حد (antarkan).
        - Ayo, tak terké mulih = يلا، هوصّلك البيت. (mulih = يروّح = pulang)
        - Tak terké nang stasiun = هوصّلك المحطة.
        وفي سورابايا هتسمع الأمر بـ -no: «Tukokno!» = اشتريهولي! بس الأمر هنتعلمه في J2.
      ar: |
        وفعل آخر شائع: ater (يُوصل) → **terké** = يوصل أحدًا (antarkan).
        - Ayo, tak terké mulih = هيا، سأوصلك إلى البيت (mulih = يعود إلى البيت = pulang).
        - Tak terké nang stasiun = سأوصلك إلى المحطة.
        وستسمع في سورابايا الأمر بـ -no: «Tukokno!» = اشترِه لي! لكن الأمر يأتي في J2.
      en: |
        One more you'll hear a lot: ater (take someone) → **terké** = take someone somewhere (antarkan).
        - Ayo, tak terké mulih = Come on, I'll take you home. (mulih = go home = pulang)
        - Tak terké nang stasiun = I'll take you to the station.
        In Surabaya you'll hear commands with -no: "Tukokno!" = Buy it for me! Commands come in J2.
    grammar: jv.suffix.ake
    examples:
      - text: Ayo, tak terké mulih.
        ar_eg: يلا، هوصّلك البيت.
        ar: هيا، سأوصلك إلى البيت.
        en: Come on, I'll take you home.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tukokké
        ar_eg: يشتري لحد (belikan)
        ar: يشتري لغيره (belikan)
        en: buy for someone (belikan)
      - text: jupukké
        ar_eg: يجيب لحد (ambilkan)
        ar: يُحضر لغيره (ambilkan)
        en: fetch for someone (ambilkan)
      - text: diculké
        ar_eg: يتساب / يتباع (dilepas)
        ar: يُترك / يُباع (dilepas)
        en: let go, sold off (dilepas)
      - text: terké
        ar_eg: يوصّل حد (antarkan)
        ar: يُوصل أحدًا (antarkan)
        en: take someone (antarkan)
      - text: mulih
        ar_eg: يروّح البيت (pulang)
        ar: يعود إلى البيت (pulang)
        en: go home (pulang)
    words: [tukokké, jupukké, diculké, terké, mulih]
  - id: e02
    type: multiple_choice
    question: arp dicul piro
    question_meaning:
      ar_eg: الرسالة دي معناها إيه؟ اختار الشكل الكامل.
      ar: ما معنى هذه الرسالة؟ اختر الصيغة الكاملة.
      en: What does this message say? Pick the full form.
    options: ['arep dituku pira?', 'arep diterké pira?', 'arep diculké pira?']
    answer: 2
    explain:
      ar_eg: 'arp = arep، dicul = diculké، piro = pira: ناوي تبيعه بكام؟'
      ar: 'arp = arep، وdicul = diculké، وpiro = pira: بكم ستبيعه؟'
      en: 'arp = arep, dicul = diculké, piro = pira: How much will you sell it for?'
    words: [arep, diculké, pira]
  - id: e03
    type: listen
    text: Sek, tak jupukké.
    options: ['Sek, tak tukokké.', 'Sek, tak terké.', 'Sek, tak jupukké.']
    answer: 2
    words: [jupukké, sek]
  - id: e04
    type: fill_blank
    sentence: HP-né arep ___ pira, Mas?
    meaning:
      ar_eg: ناوي تبيع الموبايل بكام يا أستاذ؟
      ar: بكم ستبيع الهاتف يا أخي؟
      en: How much will you sell the phone for, Mas?
    options: [diculké, terké, tukokké]
    answers: [diculké]
    explain:
      ar_eg: diculké = يتساب للمشتري، يعني يتباع.
      ar: diculké = يُترك للمشتري، أي يُباع.
      en: diculké = let go to a buyer, i.e. sold.
    words: [diculké]
  - id: e05
    type: build_sentence
    source:
      ar_eg: هجيبلك قهوة، ماشي؟
      ar: سأشتري لك قهوة، حسنًا؟
      en: I'll buy you a coffee, OK?
    answer: Tak tukokké kopi, ya.
    distractors: [tuku, diculké]
    words: [tak, tukokké, kopi]
  - id: e06
    type: dictation
    text: arp dicul piro
    meaning:
      ar_eg: ناوي تبيعه بكام؟ (شات)
      ar: بكم ستبيعه؟ (دردشة)
      en: How much will you sell it for? (chat)
    words: [diculké]
  - id: e07
    type: speaking
    text: Tak tukokké kopi, ya.
    meaning:
      ar_eg: هجيبلك قهوة، ماشي؟
      ar: سأشتري لك قهوة، حسنًا؟
      en: I'll buy you a coffee, OK?
    words: [tukokké]
dialogue:
  title: HP-né Cak Heru
  lines:
    - speaker: Cak Heru
      text: Rek, HP iki arep diculké. Sapa sing arep tuku?
      ar_eg: يا جماعة، الموبايل ده هيتباع. مين عايز يشتري؟
      ar: يا جماعة، هذا الهاتف للبيع. من يريد أن يشتري؟
      en: Guys, this phone is up for sale. Who wants to buy it?
    - speaker: Mohamed
      text: arp dicul piro, Cak?
      ar_eg: ناوي تبيعه بكام يا معلم؟
      ar: بكم ستبيعه يا أخي؟
      en: How much are you letting it go for, Cak?
    - speaker: Cak Heru
      text: Sejuta ae.
      ar_eg: مليون بس.
      ar: مليون فقط.
      en: Just a million.
    - speaker: Mohamed
      text: Murah! Aku tuku, Cak.
      ar_eg: رخيص! أنا هشتريه يا معلم.
      ar: رخيص! سأشتريه يا أخي.
      en: Cheap! I'll buy it, Cak.
    - speaker: Cak Heru
      text: Oke. Sesuk tak terké nang omahmu.
      ar_eg: تمام. بكرة هوصّلهولك البيت.
      ar: حسنًا. غدًا أوصله إلى بيتك.
      en: OK. Tomorrow I'll bring it to your house.
new_words:
  - word: jupuk
    pos: verb
    ar_eg: ياخد (ambil)؛ jupukké = يجيب لحد
    ar: يأخذ (ambil)؛ jupukké = يُحضر لغيره
    en: take (ambil); jupukké = fetch for someone
  - word: tukokké
    pos: verb
    ar_eg: يشتري لحد (belikan)، من tuku
    ar: يشتري لغيره (belikan)، من tuku
    en: buy for someone (belikan), from tuku
  - word: ucul
    pos: verb
    ar_eg: يتفك / يفلت (lepas)
    ar: ينفكّ / ينفلت (lepas)
    en: come loose (lepas)
  - word: terké
    pos: verb
    ar_eg: يوصّل حد (antarkan)، من ater
    ar: يُوصل أحدًا (antarkan)، من ater
    en: take someone somewhere (antarkan), from ater
  - word: HP
    pos: noun
    ar_eg: موبايل (زي الإندونيسي، بتتنطق «ها-بي»)
    ar: هاتف محمول (كالإندونيسية، ويُنطق «ها-بي»)
    en: mobile phone (as in Indonesian, said "ha-pé")
