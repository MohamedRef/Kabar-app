schema: kabar.lesson/v1
id: j1.u01.l06
language: jv
title: Ayo, pamit dhisik
can_do:
  ar_eg: تسلّم على حد، تقول إنك تعرفه، وتستأذن تمشي بأدب.
  ar: أن تحيّي أحدًا، وتقول إنك تعرفه، وتستأذن في الانصراف بلطف.
  en: Greet someone, say you know them, and take your leave politely.
slides:
  - title: Ketemu lan pamit
    body:
      ar_eg: |
        ayo = يلا: Ayo ketemu! = يلا نتقابل!
        ketemu = يقابل، kenal = يعرف (شخص): Kowe kenal Mas Heru?
        salam = سلام، تحية: Salam saka Mesir! = سلام من مصر!
        pamit = يستأذن ويمشي، وdhisik = الأول: Aku pamit dhisik = أستأذن أنا.
        rame = زحمة ودوشة، sepi = هادي وفاضي.
      ar: |
        ayo = هيّا: Ayo ketemu! = هيّا نلتقِ!
        ketemu = يلتقي، kenal = يعرف (شخصًا): Kowe kenal Mas Heru?
        salam = تحية، سلام: Salam saka Mesir! = تحيّة من مصر!
        pamit = يستأذن في الانصراف، وdhisik = أوّلًا: Aku pamit dhisik = أستأذن أنا.
        rame = مزدحم وصاخب، sepi = هادئ وخالٍ.
      en: |
        ayo = come on, let's: Ayo ketemu! = Let's meet!
        ketemu = meet, kenal = know (a person): Kowe kenal Mas Heru?
        salam = greetings, regards: Salam saka Mesir! = Greetings from Egypt!
        pamit = take your leave, and dhisik = first: Aku pamit dhisik = I'll be off first.
        rame = busy, lively, noisy; sepi = quiet, empty.
    examples:
      - text: Aku pamit dhisik, Mas.
        ar_eg: أستأذن أنا يا ماس.
        ar: أستأذن في الانصراف يا أخي.
        en: I'll be off now, Mas.
      - text: Kowe kenal Mas Heru?
        ar_eg: إنت تعرف ماس هيرو؟
        ar: هل تعرف ماس هيرو؟
        en: Do you know Mas Heru?
      - text: Esuk sepi, awan rame.
        ar_eg: الصبح هادي، والضهر زحمة.
        ar: الصباح هادئ، والظهيرة مزدحمة.
        en: Quiet in the morning, busy at midday.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ayo
        ar_eg: يلا
        ar: هيّا
        en: come on, let's
      - text: dhisik
        ar_eg: الأول
        ar: أوّلًا
        en: first
      - text: ketemu
        ar_eg: يقابل
        ar: يلتقي
        en: meet
      - text: kenal
        ar_eg: يعرف (حد)
        ar: يعرف (شخصًا)
        en: know (a person)
    words: [ayo, dhisik, ketemu, kenal]
  - id: e02
    type: match_pairs
    pairs:
      - text: salam
        ar_eg: سلام، تحية
        ar: تحية، سلام
        en: greetings, regards
      - text: pamit
        ar_eg: يستأذن ويمشي
        ar: يستأذن في الانصراف
        en: take your leave
      - text: rame
        ar_eg: زحمة ودوشة
        ar: مزدحم وصاخب
        en: busy, lively
      - text: sepi
        ar_eg: هادي وفاضي
        ar: هادئ وخالٍ
        en: quiet, empty
    words: [salam, pamit, rame, sepi]
  - id: e03
    type: listen
    text: Aku pamit dhisik, Mas.
    question:
      ar_eg: بيقول إيه؟
      ar: ماذا يقول؟
      en: What is he saying?
    options: [أستأذن أنا يا ماس, يلا نتقابل يا ماس, صباح الخير يا ماس]
    answer: 0
    meaning:
      ar_eg: أستأذن أنا يا ماس.
      ar: أستأذن في الانصراف يا أخي.
      en: I'll be off now, Mas.
    words: [pamit, dhisik, ayo]
  - id: e04
    type: fill_blank
    sentence: Esuk sepi, awan ___.
    meaning:
      ar_eg: الصبح هادي، والضهر ___.
      ar: الصباح هادئ، والظهيرة ___.
      en: Quiet in the morning, ___ at midday.
    options: [rame, kenal, pamit]
    answers: [rame]
    words: [rame, sepi, kenal, pamit]
    explain:
      ar_eg: عكس sepi (هادي) هو rame (زحمة). kenal = يعرف حد، وpamit = يستأذن.
      ar: ضدّ sepi (هادئ) هو rame (مزدحم)؛ أما kenal فيعرف شخصًا، وpamit يستأذن.
      en: The opposite of sepi (quiet) is rame (busy). kenal = know someone, pamit = take leave.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «يلا!» بالجاوي؟
      ar: كيف تقول «هيّا!» بالجاوية؟
      en: How do you say "Come on!"?
    options: [Ayo!, Pamit!, Sepi!]
    answer: 0
    explain:
      ar_eg: ayo = يلا. pamit = يستأذن، sepi = هادي.
      ar: ayo = هيّا. أمّا pamit فيستأذن، وsepi فهادئ.
      en: ayo = come on. pamit = take leave, sepi = quiet.
    words: [ayo, pamit, sepi]
  - id: e06
    type: fill_blank
    sentence: ___, Pakdhe! Piye kabare?
    meaning:
      ar_eg: ___ يا عمّو! أخبارك إيه؟
      ar: ___ يا عمّ! كيف حالك؟
      en: ___, Pakdhe! How are you?
    options: [Salam, Pamit, Ketemu]
    answers: [Salam]
    words: [salam, pamit, ketemu]
    explain:
      ar_eg: salam = سلام / تحية، وبتيجي قبل «أخبارك إيه». pamit = بستأذن (وإنت ماشي)، وketemu = نتقابل.
      ar: salam = تحية، وتأتي قبل السؤال عن الحال؛ أما pamit فللاستئذان عند الانصراف، وketemu للقاء.
      en: salam = greetings, which fits before "how are you". pamit is for leaving, ketemu = meet.
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «المكان هادي وفاضي» — أنهي كلمة؟
      ar: «المكان هادئ وخالٍ» — أيّ كلمة؟
      en: '"The place is quiet and empty" — which word?'
    options: [rame, sepi, salam]
    answer: 1
    explain:
      ar_eg: sepi = هادي وفاضي، وعكسها rame.
      ar: sepi = هادئ وخالٍ، وعكسها rame.
      en: sepi = quiet, empty; the opposite is rame.
    words: [sepi, rame, salam]
  - id: e08
    type: build_sentence
    source:
      ar_eg: يلا نتقابل الصبح يا أبلة.
      ar: هيّا نلتقِ صباحًا يا أختي.
      en: Let's meet in the morning, Mbak.
    answer: Ayo ketemu esuk, Mbak.
    distractors: [pamit, sepi]
    words: [ayo, ketemu]
    explain:
      ar_eg: ayo ketemu = يلا نتقابل، وesuk = الصبح. pamit = يستأذن، وsepi = هادي، ودول مش في المعنى.
      ar: ayo ketemu = هيا نلتقِ، وesuk = الصباح؛ أما pamit فيستأذن، وsepi هادئ، وليسا في المعنى.
      en: ayo ketemu = let's meet, esuk = morning. pamit (take leave) and sepi (quiet) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Kowe kenal Mas Heru?
    answers_meaning:
      ar_eg: [إنت تعرف ماس هيرو؟, تعرف ماس هيرو؟]
      ar: [هل تعرف ماس هيرو؟, أتعرف ماس هيرو؟]
      en: ['Do you know Mas Heru?', Do you know Mas Heru]
    words: [kenal]
  - id: e10
    type: speaking
    text: Aku pamit dhisik. Ayo ketemu bengi!
    meaning:
      ar_eg: أستأذن أنا. يلا نتقابل بالليل!
      ar: أستأذن الآن. هيّا نلتقِ مساءً!
      en: I'll be off. Let's meet tonight!
    words: [pamit, dhisik, ayo, ketemu]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed! Sugeng sonten. Kowe kenal Mas Heru?
      ar_eg: يا محمد! مساء الخير. إنت تعرف ماس هيرو؟
      ar: محمد! مساء الخير. هل تعرف ماس هيرو؟
      en: Mohamed! Good afternoon. Do you know Mas Heru?
    - speaker: Mohamed
      text: Kenal, Mas. Aku ketemu Mas Heru esuk.
      ar_eg: أعرفه يا ماس. قابلت ماس هيرو الصبح.
      ar: أعرفه يا أخي. التقيت ماس هيرو صباحًا.
      en: Yes, Mas. I met Mas Heru this morning.
    - speaker: Mas Dimas
      text: Apik! Warunge rame banget, ya?
      ar_eg: حلو! المحل زحمة أوي، صح؟
      ar: جميل! المقهى مزدحم جدًّا، أليس كذلك؟
      en: Great! The stall is really busy, right?
    - speaker: Mohamed
      text: Iya, rame. Omahku sepi.
      ar_eg: أيوه، زحمة. بيتي هادي.
      ar: نعم، مزدحم. أمّا بيتي فهادئ.
      en: Yes, busy. My place is quiet.
    - speaker: Mas Dimas
      text: Aku pamit dhisik, ya. Ayo ketemu esuk!
      ar_eg: أنا هستأذن الأول. نتقابل الصبح!
      ar: سأستأذن أولًا. لنلتقِ صباحًا!
      en: I'll head off first. Let's meet in the morning!
    - speaker: Mohamed
      text: Iya, Mas. Ati-ati!
      ar_eg: ماشي يا ماس. خلّي بالك!
      ar: حسنًا يا أخي. انتبه لنفسك!
      en: Sure, Mas. Take care!
