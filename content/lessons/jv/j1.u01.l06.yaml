dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed! Sugeng sonten. Kowe kenal Cak Heru?
      ar_eg: يا محمد! مساء الخير. إنت تعرف تشاك هيرو؟
      ar: محمد! مساء الخير. هل تعرف تشاك هيرو؟
      en: Mohamed! Good afternoon. Do you know Cak Heru?
    - speaker: Mohamed
      text: Kenal, Mas. Aku ketemu Cak Heru esuk.
      ar_eg: أعرفه يا ماس. قابلت تشاك هيرو الصبح.
      ar: أعرفه يا أخي. التقيت تشاك هيرو صباحًا.
      en: Yes, Mas. I met Cak Heru this morning.
    - speaker: Mas Dimas
      text: Apik! Warunge rame banget, ya?
      ar_eg: حلو! المحل زحمة أوي، صح؟
      ar: جميل! المقهى مزدحم جدًّا، أليس كذلك؟
      en: Great! The stall is really busy, right?
    - speaker: Mohamed
      text: Iya, rame. Omahku sepi.
      ar_eg: أيوه، زحمة. بيتي هادي.
      ar: نعم، مزدحم. أمّا بيتي فهادئ.
      en: Yes, busy. My place is quiet.
    - speaker: Mas Dimas
      text: Aku pamit dhisik, ya. Ayo ketemu maneh!
      ar_eg: أستأذن أنا بقى. يلا نتقابل تاني!
      ar: أستأذن الآن. هيّا نلتقِ مرّة أخرى!
      en: I'll be off now. Let's meet again!
    - speaker: Mohamed
      text: Iya, Mas. Ati-ati!
      ar_eg: ماشي يا ماس. خلّي بالك!
      ar: حسنًا يا أخي. انتبه لنفسك!
      en: Sure, Mas. Take care!
