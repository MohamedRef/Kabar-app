dialogue:
  title: HP bekas neng Pasar Klithikan
  lines:
    - speaker: Mohamed
      text: Mas, HP iki arep diculke pira?
      ar_eg: يا معلم، الموبايل ده هتبيعه بكام؟
      ar: يا أخي، بكم ستبيع هذا الهاتف؟
      en: Mas, how much are you selling this phone for?
    - speaker: Mas Anton
      text: Rong juta, Mas.
      ar_eg: مليونين يا أستاذ.
      ar: مليونان يا أخي.
      en: Two million, Mas.
    - speaker: Mohamed
      text: Rong juta? Larang, Mas! Oleh kurang?
      ar_eg: مليونين؟ غالي يا معلم! ينفع تنزّل؟
      ar: مليونان؟ غالٍ يا أخي! هل تخفض السعر؟
      en: Two million? That's expensive, Mas! Can you go lower?
    - speaker: Mas Anton
      text: Sejuta wolung atus ewu.
      ar_eg: مليون وتمانمية ألف.
      ar: مليون وثمانمئة ألف.
      en: One million eight hundred thousand.
    - speaker: Mohamed
      text: Sejuta limang atus ewu, ya?
      ar_eg: مليون وخمسمية، ماشي؟
      ar: مليون وخمسمئة ألف، اتفقنا؟
      en: One million five hundred thousand, OK?
    - speaker: Mas Anton
      text: Durung oleh, Mas. Sik tak lapor pusat.
      ar_eg: لسه ماينفعش يا أستاذ. استنى، هبلّغ الإدارة.
      ar: لا يجوز بعد يا أخي. انتظر، سأبلّغ المركز.
      en: Not yet, Mas. Hold on, I'll report to HQ.
new_words:
  - word: oleh
    pos: verb
    ar_eg: ينفع / مسموح (= boleh)
    ar: يجوز / مسموح (= boleh)
    en: may, allowed (= boleh)
  - word: durung oleh
    pos: phrase
    ar_eg: لسه ماينفعش (Belum boleh)، رد البيّاع في الفصال
    ar: لا يجوز بعد (Belum boleh)، رد البائع في المساومة
    en: not yet (Belum boleh), the seller's no when haggling
  - word: ya wis
    pos: phrase
    ar_eg: خلاص / ماشي (Ya sudah)؛ في الكلام yo wis، في الشات yowis
    ar: حسنًا / ليكن (Ya sudah)؛ وفي الكلام yo wis، وفي الدردشة yowis
    en: alright then (Ya sudah); spoken yo wis, chat yowis
