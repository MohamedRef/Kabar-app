schema: kabar.lesson/v1
id: j1.u07.l07
language: jv
title: Arp dicul piro?
can_do:
  ar_eg: تفاصل على موبايل مستعمل.
  ar: أن تساوم على هاتف مستعمل.
  en: Haggle over a second-hand phone.
slides:
  - title: Tawar-tawaran
    body:
      ar_eg: |
        النهارده محمد عايز موبايل مستعمل من باسار كليتيكان. عدّة الفصال:
        - السؤال: HP-ne arep diculke pira? (في الشات: arp dicul piro?)
        - الرد على السعر: Larang! · Oleh kurang?
        - البيّاع لما يرفض: **Durung oleh** = لسه ماينفعش (Belum boleh). ودي جملة كلاسيكية في السوق الجاوي.
        - الاتفاق: Ya wis, oleh = خلاص، ماشي.
        والأسعار بشكل الوصل: sejuta wolung atus ewu = مليون وتمانمية ألف.
        ولو البيّاع قالك «Sik, tak lapor pusat» = «استنى، هبلّغ الإدارة»، يعني هيسأل صاحب المحل (أو بيهزر عشان ياخد وقت). sik = استنى، tak lapor = هبلّغ، pusat = الإدارة / المركز.
        وكمّل بالأرقام: 1.500.000 = sejuta limang atus ewu.
      ar: |
        يريد محمد اليوم هاتفًا مستعملًا من باسار كليتيكان. وهذه أدوات المساومة:
        - السؤال: HP-ne arep diculke pira? (في الدردشة: arp dicul piro?)
        - الرد على السعر: Larang! · Oleh kurang?
        - رفض البائع: **Durung oleh** = لا يجوز بعد (Belum boleh)، وهي عبارة كلاسيكية في السوق الجاوي.
        - الاتفاق: Ya wis, oleh = حسنًا، موافق.
        والأسعار بصورة الوصل: sejuta wolung atus ewu = مليون وثمانمئة ألف.
        وإن قال لك البائع «Sik, tak lapor pusat» = «انتظر، سأبلّغ الإدارة» فهو سيسأل صاحب المحل (أو يمزح ليكسب وقتًا): sik = انتظر، tak lapor = سأبلّغ، pusat = المركز.
        والأرقام: 1.500.000 = sejuta limang atus ewu.
      en: |
        Today Mohamed wants a second-hand phone at Pasar Klithikan. Your haggling kit:
        - Ask: HP-ne arep diculke pira? (chat: arp dicul piro?)
        - React: Larang! · Oleh kurang?
        - The seller's no: **Durung oleh** = not yet (Belum boleh) — a classic Javanese market line.
        - Deal: Ya wis, oleh = Alright, OK.
        Prices use the linking forms: sejuta wolung atus ewu = 1,800,000.
        And if the seller says "Sik, tak lapor pusat" = "Hold on, I'll report to HQ", he's checking with the owner (or joking to buy time). sik = hold on, tak lapor = I'll report, pusat = head office.
        Numbers: 1,500,000 = sejuta limang atus ewu.
    grammar: jv.suffix.ake
    examples:
      - text: Sik tak lapor pusat.
        ar_eg: استنى، هبلّغ الإدارة.
        ar: انتظر، سأبلّغ المركز.
        en: Hold on, I'll report to HQ.
