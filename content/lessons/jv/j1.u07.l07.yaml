      ar: ماذا يقول البائع؟ اختر الجملة الإندونيسية المساوية.
      en: What is the seller saying? Pick the Indonesian sentence that matches.
    options: ['Belum boleh, Mas.', 'Sudah boleh, Mas.', 'Tidak ada, Mas.']
    answer: 0
    explain:
      ar_eg: durung oleh = belum boleh = لسه ماينفعش، يعني «زوّد شوية».
      ar: durung oleh = belum boleh = لا يجوز بعد، أي «زد قليلًا».
      en: durung oleh = belum boleh = not yet allowed, i.e. "offer a bit more".
