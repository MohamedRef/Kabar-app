    question_meaning:
      ar_eg: (من الحوار) أول سعر قاله Cak Anton كام؟
      ar: (من الحوار) ما أول سعر قاله Cak Anton؟
      en: (From the dialogue) What was Cak Anton's first price?
    options: [Rong juta, Sejuta, Sejuta wolung atus ewu]
    answer: 0
