schema: kabar.lesson/v1
id: j6.u05.l09
language: jv
title: Pengumuman pengajian
can_do:
  ar_eg: تقرا إعلان درس ديني فيه حروف rekan وتاريخ بالأرقام الجاوية.
  ar: أن تقرأ إعلان درس ديني فيه حروف rekan وتاريخ بالأرقام الجاوية.
  en: Read a notice for a religious talk, with rekan letters and a date in Javanese numerals.
slides:
  - title: Papan ing masjid Imogiri
    body:
      ar_eg: |
        على لوحة الجامع تحت تل Imogiri فيه إعلان بالخط الجاوي.
        هتلاقي dzikir بحرف rekan (ꦢ꦳ = ذ)، والتاريخ بالأرقام الجاوية بين علامتين ꧇.
        كلمة جديدة: pengajian = درس ديني / حلقة علم في الجامع (من ngaji). في الخط الجاوي الـ ia بتتكتب بـ ya: ꦥꦼꦔꦗꦶꦪꦤ꧀.
      ar: |
        على لوح المسجد أسفل تلّ Imogiri إعلان بالخط الجاوي.
        ستجد dzikir بحرف rekan (ꦢ꦳ = ذ)، والتاريخ بالأرقام الجاوية بين علامتي ꧇.
        كلمة جديدة: pengajian = درس ديني / مجلس علم في المسجد (من ngaji). وفي الخط الجاوي تُكتب ia بـ ya: ꦥꦼꦔꦗꦶꦪꦤ꧀.
      en: |
        On the board of the mosque at the foot of Imogiri hill there's a notice in aksara Jawa.
        You'll find dzikir with a rekan letter (ꦢ꦳ = ذ), and the date in Javanese numerals between two ꧇.
        New word: pengajian = a religious talk or study gathering at the mosque (from ngaji). In aksara Jawa the ia is written with ya: ꦥꦼꦔꦗꦶꦪꦤ꧀.
    grammar: jv.aksara.murda-rekan
    examples:
      - text: ꦢ꦳ꦶꦏꦶꦂꦭꦤ꧀ꦥꦼꦔꦗꦶꦪꦤ꧀ (Dzikir lan pengajian)
        ar_eg: ذكر ودرس ديني
        ar: ذكر ودرس ديني
        en: Dhikr and a religious talk
      - text: ꦢꦶꦤꦗꦼꦩꦸꦮꦃ꧈ꦠꦁꦒꦭ꧀꧇꧑꧗꧇꧉ (Dina Jemuwah, tanggal 17.)
        ar_eg: يوم الجمعة، يوم 17.
        ar: يوم الجمعة، السابع عشر.
        en: On Friday, the 17th.
      - text: ꦱꦮꦶꦱꦺꦲꦱꦂ꧈ꦲꦶꦁꦩꦱ꧀ꦗꦶꦢ꧀꧉ (Sawise Asar, ing masjid.)
        ar_eg: بعد العصر، في الجامع.
        ar: بعد العصر، في المسجد.
        en: After Asr prayer, at the mosque.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: الإعلان عن إيه؟
      ar: عمّ الإعلان؟
      en: What is the notice about?
    options: [zakat lan pasar, dzikir lan pengajian, kerja bakti]
    answer: 1
    words: [pengajian, dzikir]
    explain:
      ar_eg: "الإعلان: Dzikir lan pengajian."
      ar: "الإعلان: Dzikir lan pengajian."
      en: The notice says Dzikir lan pengajian.
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي يوم؟
      ar: في أي يوم؟
      en: On which day?
    options: [Jemuwah, Setu, Minggu]
    answer: 0
    explain:
      ar_eg: ꦗꦼꦩꦸꦮꦃ = Jemuwah (الجمعة)، من «جمعة».
      ar: ꦗꦼꦩꦸꦮꦃ = Jemuwah (الجمعة)، من «جمعة».
      en: ꦗꦼꦩꦸꦮꦃ = Jemuwah (Friday), from Arabic جمعة.
  - id: e03
    type: listen
    text: Dina Jemuwah, tanggal pitulas.
    question:
      ar_eg: سمعت أنهي تاريخ؟
      ar: أي تاريخ سمعت؟
      en: Which date did you hear?
    options: ["꧇꧗꧇", "꧇꧑꧗꧇", "꧇꧗꧑꧇"]
    answer: 1
    meaning:
      ar_eg: يوم الجمعة، يوم 17.
      ar: يوم الجمعة، السابع عشر.
      en: On Friday, the 17th.
    words: [angka, pada pangkat]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: الدرس إمتى في اليوم؟
      ar: متى الدرس من اليوم؟
      en: At what time of day is the talk?
    options: [sadurunge Subuh, sawise Asar, bengi]
    answer: 1
    words: [pengajian]
    explain:
      ar_eg: "الإعلان: Sawise Asar = بعد العصر."
      ar: في الإعلان Sawise Asar أي بعد العصر.
      en: "The notice says Sawise Asar: after Asr."
  - id: e05
    type: match_pairs
    pairs:
      - text: ꦢ꦳ꦶꦏꦶꦂ
        ar_eg: dzikir — ذكر
        ar: dzikir — ذكر
        en: dzikir — dhikr
      - text: ꦥꦼꦔꦗꦶꦪꦤ꧀
        ar_eg: pengajian — درس ديني
        ar: pengajian — درس ديني
        en: pengajian — religious talk
      - text: ꦗꦼꦩꦸꦮꦃ
        ar_eg: Jemuwah — الجمعة
        ar: Jemuwah — الجمعة
        en: Jemuwah — Friday
      - text: ꦲꦱꦂ
        ar_eg: Asar — العصر
        ar: Asar — العصر
        en: Asar — Asr prayer
    words: [pengajian, dzikir]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة في الإعلان فيها حرف بتلات نقط (rekan)؟
      ar: أي كلمة في الإعلان فيها حرف بثلاث نقاط (rekan)؟
      en: Which word on the notice has a letter with three dots (rekan)?
    options: [pengajian, dzikir, masjid]
    answer: 1
    explain:
      ar_eg: dzikir بتبدأ بـ ꦢ꦳ (da + تلات نقط = ذ). masjid وAsar اتكتبوا بحروف عادية.
      ar: تبدأ dzikir بـ ꦢ꦳ (da + ثلاث نقاط = ذ)، أما masjid وAsar فبحروف عادية.
      en: dzikir starts with ꦢ꦳ (da + three dots = ذ). masjid and Asar use plain letters.
    words: [dzikir, aksara rekan]
  - id: e07
    type: fill_blank
    sentence: Sawise Asar ana ___ ing masjid.
    meaning:
      ar_eg: بعد العصر فيه درس ديني في الجامع.
      ar: بعد العصر درس ديني في المسجد.
      en: After Asr there's a religious talk at the mosque.
    options: [pengajian, zakat, angka]
    answers: [pengajian]
    words: [pengajian]
    explain:
      ar_eg: pengajian = درس ديني. zakat = زكاة وangka = رقم.
      ar: pengajian درس ديني. أما zakat فزكاة وangka رقم.
      en: pengajian is a religious talk. zakat is alms and angka is a digit.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية والأرقام: ꦢꦶꦤꦗꦼꦩꦸꦮꦃ꧈ꦠꦁꦒꦭ꧀꧇꧑꧗꧇꧉"
      ar: "اكتب بالحروف اللاتينية والأرقام: ꦢꦶꦤꦗꦼꦩꦸꦮꦃ꧈ꦠꦁꦒꦭ꧀꧇꧑꧗꧇꧉"
      en: "Write in Latin letters and digits: ꦢꦶꦤꦗꦼꦩꦸꦮꦃ꧈ꦠꦁꦒꦭ꧀꧇꧑꧗꧇꧉"
    answers: ["Dina Jemuwah, tanggal 17.", dina jemuwah tanggal 17, dina jemuwah tanggal pitulas]
    words: [angka]
  - id: e09
    type: speaking
    text: Dina Jemuwah sawise Asar aku melu pengajian.
    meaning:
      ar_eg: يوم الجمعة بعد العصر هحضر الدرس.
      ar: يوم الجمعة بعد العصر سأحضر الدرس.
      en: On Friday after Asr I'm going to the religious talk.
    words: [pengajian]
dialogue:
  title: Ngajak Pak Harjo
  lines:
    - speaker: Mohamed
      text: Pak Harjo, wonten pengajian dinten Jemuwah.
      ar_eg: يا حاج Harjo، فيه درس يوم الجمعة.
      ar: يا سيد Harjo، هناك درس يوم الجمعة.
      en: Pak Harjo, there's a religious talk on Friday.
    - speaker: Pak Harjo
      text: Inggih, Mas. Panjenengan saged maos papanipun?
      ar_eg: أيوه يا ابني. إنت عرفت تقرا اللوحة؟
      ar: نعم يا بنيّ. هل استطعت قراءة اللوح؟
      en: Yes. You could read the board?
    - speaker: Mohamed
      text: Saged, Pak. Dzikir ngangge aksara rekan, tanggalipun pitulas.
      ar_eg: أيوه يا حاج. dzikir بحرف rekan، والتاريخ 17.
      ar: نعم يا سيدي. dzikir بحرف rekan، والتاريخ السابع عشر.
      en: Yes, sir. Dzikir with a rekan letter, and the date is the 17th.
    - speaker: Pak Harjo
      text: Leres. Mangga sareng-sareng, Mas.
      ar_eg: مظبوط. تعالى نروح سوا.
      ar: صحيح. تعالَ نذهب معًا.
      en: Right. Let's go together.
new_words:
  - word: pengajian
    pos: noun
    ar_eg: درس ديني / حلقة علم في الجامع (من ngaji)
    ar: درس ديني / مجلس علم في المسجد (من ngaji)
    en: religious talk, Islamic study gathering (from ngaji) = pengajian
review:
  status: draft
  verified: false
