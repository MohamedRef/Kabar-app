schema: kabar.lesson/v1
id: j6.u05.l11
language: jv
title: Absen murid
can_do:
  ar_eg: تسمع أسامي عربية وتلاقيها مكتوبة بحروف rekan.
  ar: أن تسمع أسماء عربية فتجدها مكتوبة بحروف rekan.
  en: Hear Arabic names and find them written with rekan letters.
slides:
  - title: Jeneng Arab
    body:
      ar_eg: |
        في مدرسة قرآن صغيرة جنب Imogiri، المدرّسة بتنده أسامي العيال من كشف مكتوب بالخط الجاوي. اسمع الأول.
        أسامي كتير جاية من العربي، فبتتكتب بحروف rekan: ꦥ꦳ = ف، ꦗ꦳ = ز، ꦏ꦳ = خ.
        أسامي الناس العاديين مابتاخدش murda؛ الـ murda للتكريم بس.
      ar: |
        في مدرسة قرآن صغيرة قرب Imogiri تنادي المعلّمة أسماء الأطفال من كشف بالخط الجاوي. استمع أولًا.
        أسماء كثيرة أصلها عربي، فتُكتب بحروف rekan: ꦥ꦳ = ف، ꦗ꦳ = ز، ꦏ꦳ = خ.
        ولا تأخذ أسماء عامة الناس murda، فالـ murda للتكريم فقط.
      en: |
        At a small Qur'an school near Imogiri, the teacher calls the roll from a list in aksara Jawa. Listen first.
        Many names come from Arabic, so they're written with rekan letters: ꦥ꦳ = f, ꦗ꦳ = z, ꦏ꦳ = kh.
        Ordinary people's names don't take murda; murda is only for honour.
    grammar: jv.aksara.murda-rekan
    examples:
      - text: ꦥ꦳ꦗꦂ · ꦗ꦳ꦏꦶ (Fajar · Zaki)
        ar_eg: فجر · زكي
        ar: فجر · زكي
        en: Fajar · Zaki
      - text: ꦗ꦳ꦃꦫ · ꦥ꦳ꦠꦶꦩꦃ (Zahra · Fatimah)
        ar_eg: زهرة · فاطمة
        ar: زهرة · فاطمة
        en: Zahra · Fatimah
      - text: ꦏ꦳ꦢꦶꦗꦃ (Khadijah)
        ar_eg: خديجة
        ar: خديجة
        en: Khadijah
exercises:
  - id: e01
    type: listen
    text: Fajar
    question:
      ar_eg: المدرّسة ندهت اسم. أنهي واحد في الكشف؟
      ar: نادت المعلّمة اسمًا. أيّه في الكشف؟
      en: The teacher called a name. Which one on the list?
    options: ["ꦥꦗꦂ", "ꦥ꦳ꦗꦂ", "ꦗ꦳ꦃꦫ"]
    answer: 1
    meaning:
      ar_eg: فجر
      ar: فجر
      en: Fajar
    words: [aksara rekan]
  - id: e02
    type: listen
    text: Khadijah
    question:
      ar_eg: المدرّسة ندهت اسم. أنهي واحد في الكشف؟
      ar: نادت المعلّمة اسمًا. أيّه في الكشف؟
      en: The teacher called a name. Which one on the list?
    options: ["ꦏꦢꦶꦗꦃ", "ꦥ꦳ꦠꦶꦩꦃ", "ꦏ꦳ꦢꦶꦗꦃ"]
    answer: 2
    explain:
      ar_eg: خ = ꦏ + تلات نقط. من غير النقط تبقى kadijah.
      ar: خ = ꦏ + ثلاث نقاط، وبدون النقاط تصير kadijah.
      en: kh = ꦏ + three dots. Without the dots it reads kadijah.
    meaning:
      ar_eg: خديجة
      ar: خديجة
      en: Khadijah
    words: [aksara rekan]
  - id: e03
    type: listen
    text: Zaki
    question:
      ar_eg: المدرّسة ندهت اسم. أنهي واحد في الكشف؟
      ar: نادت المعلّمة اسمًا. أيّه في الكشف؟
      en: The teacher called a name. Which one on the list?
    options: ["ꦗ꦳ꦏꦶ", "ꦗꦏꦶ", "ꦱꦏꦶ"]
    answer: 0
    meaning:
      ar_eg: زكي
      ar: زكي
      en: Zaki
    words: [aksara rekan]
  - id: e04
    type: match_pairs
    pairs:
      - text: ꦥ꦳ꦗꦂ
        ar_eg: فجر
        ar: فجر
        en: Fajar (فجر)
      - text: ꦗ꦳ꦃꦫ
        ar_eg: زهرة
        ar: زهرة
        en: Zahra (زهرة)
      - text: ꦏ꦳ꦢꦶꦗꦃ
        ar_eg: خديجة
        ar: خديجة
        en: Khadijah (خديجة)
      - text: ꦥ꦳ꦠꦶꦩꦃ
        ar_eg: فاطمة
        ar: فاطمة
        en: Fatimah (فاطمة)
    words: [aksara rekan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "في ꦗ꦳ꦃꦫ، الـ h مكتوبة بإيه؟"
      ar: "في ꦗ꦳ꦃꦫ، بماذا كُتبت الـ h؟"
      en: "In ꦗ꦳ꦃꦫ, how is the h written?"
    options: [wignyan, pasangan ha, layar]
    answer: 0
    explain:
      ar_eg: "h بتقفل المقطع zah، فبتتكتب wignyan، ومفيش pasangan بعدها: ra بتتكتب عادي."
      ar: الـ h تُغلق المقطع zah فتُكتب wignyan، ولا pasangan بعدها، فتُكتب ra عادية.
      en: "The h closes the syllable zah, so it's wignyan, and no pasangan follows: ra is written normally."
    words: [aksara rekan]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: ليه الأسامي دي من غير murda؟
      ar: لماذا لا murda في هذه الأسماء؟
      en: Why do these names have no murda letters?
    options: ["Iku jeneng bocah, dudu sesebutan kanggo ngurmati.", "Iku basa Arab.", "Iku angka."]
    answer: 0
    explain:
      ar_eg: الـ murda للألقاب والأسامي اللي بنكرّمها (Gusti، Sultan). أسامي العيال بتتكتب بحروف عادية (مع rekan للأصوات العربية).
      ar: الـ murda للألقاب والأسماء المكرَّمة (Gusti، Sultan)، أما أسماء الأطفال فبحروف عادية (مع rekan للأصوات العربية).
      en: Murda is for honoured titles and names (Gusti, Sultan). Children's names use ordinary letters (with rekan for Arabic sounds).
    words: [aksara murda]
  - id: e07
    type: fill_blank
    sentence: ꦥ꦳ꦠꦶꦩꦃ = ___
    meaning:
      ar_eg: اكتب الاسم بالحروف اللاتينية.
      ar: اكتب الاسم بالحروف اللاتينية.
      en: Type the name in Latin letters.
    answers: [Fatimah]
    words: [aksara rekan]
  - id: e08
    type: dictation
    text: Fajar karo Zaki teka.
    meaning:
      ar_eg: فجر وزكي جم.
      ar: جاء فجر وزكي.
      en: Fajar and Zaki are here.
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦥ꦳ꦗꦂꦏꦫꦺꦴꦗ꦳ꦏꦶ"
      ar: "اكتب بالحروف اللاتينية: ꦥ꦳ꦗꦂꦏꦫꦺꦴꦗ꦳ꦏꦶ"
      en: "Write in Latin letters: ꦥ꦳ꦗꦂꦏꦫꦺꦴꦗ꦳ꦏꦶ"
    answers: [Fajar karo Zaki, fajarkarozaki]
    explain:
      ar_eg: Fajar بتخلص بـ layar، فـ ka بتتكتب عادي. karo = مع / و.
      ar: تنتهي Fajar بـ layar فتُكتب ka عادية. karo = مع / و.
      en: Fajar ends with layar, so ka is written normally. karo = with, and.
    words: [aksara rekan]
dialogue:
  title: Absen
  lines:
    - speaker: Bu Guru
      text: Fajar? Zahra? Khadijah?
      ar_eg: فجر؟ زهرة؟ خديجة؟
      ar: فجر؟ زهرة؟ خديجة؟
      en: Fajar? Zahra? Khadijah?
    - speaker: Bocah-bocah
      text: Wonten, Bu!
      ar_eg: موجودين يا أبلة!
      ar: حاضرون يا معلّمة!
      en: Here, miss!
    - speaker: Mohamed
      text: Lho, Bu, jenenge kaya ing Mesir!
      ar_eg: يا أبلة، الأسامي زي اللي عندنا في مصر!
      ar: يا معلّمة، الأسماء مثل أسمائنا في مصر!
      en: Miss, the names are just like in Egypt!
    - speaker: Bu Guru
      text: Inggih, Mas. Mula ngangge aksara rekan.
      ar_eg: أيوه. عشان كده بنستخدم حروف rekan.
      ar: نعم. لذلك نستعمل حروف rekan.
      en: Yes. That's why we use aksara rekan.
review:
