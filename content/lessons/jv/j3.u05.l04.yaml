schema: kabar.lesson/v1
id: j3.u05.l04
language: jv
title: Tumbas uwos
can_do:
  ar_eg: تشتري رز وملح من البياعة اللي متعوّد عليها، وتدفع، وتتمنّالها رزق.
  ar: أن تشتري الأرز والملح من بائعتك المعتادة، وتدفع، وتتمنّى لها الرزق.
  en: Buy rice and salt from your regular seller, pay, and wish her good trade.
slides:
  - title: Uwos, sarem, laris
    body:
      ar_eg: |
        في الدكان:
        - beras ← uwos = رز ني (والرز المطبوخ sega، بالكراما sekul)
        - uyah ← sarem = ملح
        - kerep ← asring = كتير، على طول
        plastik = كيس بلاستيك. timbangan = ميزان. mbayar = يدفع.
        langganan = زبون دايم (أو دكان بتشتري منه على طول).
        laris = بيتباع كويس. «Laris, Bu!» = دعوة حلوة للبياعة: ربنا يكتّر زباينك.
      ar: |
        في الدكان:
        - beras ← uwos = أرز غير مطبوخ (والمطبوخ sega، وبالكراما sekul)
        - uyah ← sarem = ملح
        - kerep ← asring = كثيرًا، غالبًا
        plastik = كيس بلاستيك. timbangan = ميزان. mbayar = يدفع.
        langganan = زبون دائم (أو دكان تشتري منه دائمًا).
        laris = رائج البيع. «Laris, Bu!» = دعاء جميل للبائعة: كثّر الله زبائنك.
      en: |
        At the shop:
        - beras → uwos = raw rice (cooked rice is sega, krama sekul)
        - uyah → sarem = salt
        - kerep → asring = often
        plastik = plastic bag. timbangan = scales. mbayar = pay.
        langganan = a regular (customer, or the shop you always use).
        laris = selling well. "Laris, Bu!" = a kind wish to a seller: may business boom.
    examples:
      - text: Bu, uwos sekilo pinten?
        ar_eg: يا طنط، كيلو الرز بكام؟
        ar: كم سعر كيلو الأرز يا سيدتي؟
        en: How much is a kilo of rice, ma'am?
      - text: Kula asring tumbas wonten mriki, kula langganan.
        ar_eg: أنا بشتري من هنا كتير، أنا زبونة دايمًا.
        ar: أشتري من هنا كثيرًا، أنا زبون دائم.
        en: I often buy here; I'm a regular.
      - text: Laris, Bu! Matur nuwun.
        ar_eg: ربنا يكتّر زباينك يا طنط! متشكر.
        ar: كثّر الله زبائنك يا سيدتي! شكرًا.
        en: Good trade to you, ma'am! Thank you.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: beras
        ar_eg: رز ني (ngoko)
        ar: أرز غير مطبوخ (ngoko)
        en: raw rice (ngoko)
      - text: uwos
        ar_eg: رز ني (كراما)
        ar: أرز غير مطبوخ (كراما)
        en: raw rice (krama)
      - text: sarem
        ar_eg: ملح (كراما)
        ar: ملح (كراما)
        en: salt (krama)
      - text: plastik
        ar_eg: كيس بلاستيك
        ar: كيس بلاستيك
        en: plastic bag
    words: [beras, uwos, sarem, plastik]
  - id: e02
    type: match_pairs
    pairs:
      - text: mbayar
        ar_eg: يدفع
        ar: يدفع
        en: pay
      - text: langganan
        ar_eg: زبون دايم
        ar: زبون دائم
        en: regular customer
      - text: timbangan
        ar_eg: ميزان
        ar: ميزان
        en: scales
      - text: asring
        ar_eg: كتير، على طول (كراما)
        ar: كثيرًا (كراما)
        en: often (krama)
    words: [mbayar, langganan, timbangan, asring]
  - id: e03
    type: listen
    text: Bu, uwos sekilo pinten?
    question:
      ar_eg: بيسأل عن إيه؟
      ar: عمّ يسأل؟
      en: What is he asking about?
    options: [كيلو الملح بكام؟, كيلو الرز بكام؟, فين الأكياس؟]
    answer: 1
    meaning:
      ar_eg: يا طنط، كيلو الرز بكام؟
      ar: كم سعر كيلو الأرز يا سيدتي؟
      en: How much is a kilo of rice, ma'am?
    words: [uwos]
  - id: e04
    type: fill_blank
    sentence: Kula ___ tumbas wonten mriki, Bu.
    meaning:
      ar_eg: أنا ___ بشتري من هنا يا طنط.
      ar: أنا أشتري من هنا ___ يا سيدتي.
      en: I ___ buy here, ma'am.
    options: [asring, timbangan, plastik]
    answers: [asring]
    words: [asring, timbangan, plastik]
  - id: e05
    type: multiple_choice
    question: Beras (ngoko) → ___ (krama)
    options: [sarem, uwos, plastik]
    answer: 1
    explain:
      ar_eg: beras ← uwos = رز ني. والرز المطبوخ sega ← sekul.
      ar: beras ← uwos = أرز غير مطبوخ. والمطبوخ sega ← sekul.
      en: 'beras → uwos = raw rice. Cooked rice: sega → sekul.'
    words: [beras, uwos, sarem, plastik]
  - id: e06
    type: fill_blank
    sentence: Sate Bu Siti ___ sanget, tiyangipun kathah.
    meaning:
      ar_eg: ساتيه طنط سيتي ___ أوي، الناس كتير.
      ar: ساتيه السيدة سيتي ___ جدًا، والناس كثيرون.
      en: 'Bu Siti''s satay is ___: there are lots of people.'
    options: [laris, timbangan, mbayar]
    answers: [laris]
    words: [laris, timbangan, mbayar]
  - id: e07
    type: build_sentence
    source:
      ar_eg: أدفع هنا يا طنط؟
      ar: هل أدفع هنا يا سيدتي؟
      en: Do I pay here, ma'am?
    answer: Kula mbayar wonten mriki, Bu?
    distractors: [laris, sarem]
    words: [mbayar]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kula langganan, Bu. Kula asring tumbas uwos ing mriki.
    answers_meaning:
      ar_eg: [أنا زبون دايم يا طنط. بشتري رز من هنا على طول, أنا زبونك يا طنط، دايمًا بشتري الرز من هنا]
      ar: [أنا زبون دائم يا سيدتي. أشتري الأرز من هنا كثيرًا]
      en: ['I''m a regular, ma''am. I often buy rice here', 'I''m a regular customer; I often buy my rice here']
    words: [langganan, asring, uwos]
  - id: e09
    type: speaking
    text: Laris, Bu! Matur nuwun.
    meaning:
      ar_eg: ربنا يكتّر زباينك يا طنط! متشكر.
      ar: كثّر الله زبائنك يا سيدتي! شكرًا.
      en: Good trade to you, ma'am! Thank you.
    words: [laris]
  - id: e10
    type: multiple_choice
    question: Uyah (ngoko) → ___ (krama)
    options: [langganan, beras, sarem]
    answer: 2
    explain:
      ar_eg: uyah ← sarem = ملح.
      ar: uyah ← sarem = ملح.
      en: uyah → sarem = salt.
    words: [sarem, langganan, beras]
dialogue:
  lines:
    - speaker: Bu Siti
      text: Mas Mohamed! Tumbas menapa dinten menika?
      ar_eg: أستاذ محمد! هتشتري إيه النهارده؟
      ar: محمد! ماذا تشتري اليوم؟
      en: Mohamed! What are you buying today?
    - speaker: Mohamed
      text: Uwos kalih kilo lan sarem, Bu.
      ar_eg: كيلوين رز وملح يا طنط.
      ar: كيلوين من الأرز والملح يا سيدتي.
      en: Two kilos of rice and some salt, ma'am.
    - speaker: Bu Siti
      text: Mangga. Plastikipun setunggal kemawon?
      ar_eg: اتفضل. كيس واحد بس؟
      ar: تفضّل. كيس واحد فقط؟
      en: Here you are. Just one bag?
    - speaker: Mohamed
      text: Inggih. Kula mbayar pinten, Bu?
      ar_eg: أيوه. أدفع كام يا طنط؟
      ar: نعم. كم أدفع يا سيدتي؟
      en: Yes. How much do I pay, ma'am?
    - speaker: Bu Siti
      text: Sedasa ewu. Panjenengan langganan, dados kirang sekedhik.
      ar_eg: عشرة آلاف. إنت زبون دايم، فنزّلتلك شوية.
      ar: عشرة آلاف. أنت زبون دائم، فخفّضت لك قليلًا.
      en: Ten thousand. You're a regular, so it's a bit less.
    - speaker: Mohamed
      text: Matur nuwun, Bu. Laris!
      ar_eg: متشكر يا طنط. ربنا يكتّر زباينك!
      ar: شكرًا يا سيدتي. كثّر الله زبائنك!
      en: Thank you, ma'am. Good trade to you!
