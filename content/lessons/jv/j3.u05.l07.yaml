schema: kabar.lesson/v1
id: j3.u05.l07
language: jv
title: Rasukan batik
can_do:
  ar_eg: 'تشتري قميص باتيك: المقاس واللون والقماش، وتقول إنه حلو ومتظبّط.'
  ar: 'أن تشتري قميص باتيك: المقاس واللون والقماش، وتقول إنه جميل وأنيق.'
  en: 'Buy a batik shirt: size, colour and fabric, and say it''s beautiful and neat.'
slides:
  - title: Rasukan lan nyamping
    body:
      ar_eg: |
        في سوق بيرينغهارجو، أكبر سوق باتيك في يوجيا:
        - klambi ← rasukan = قميص، هدوم
        - jarik ← nyamping = قماشة باتيك طويلة بتتلف زي الجيبة
        sepatu = جزمة. kaca = مراية. ukuran = مقاس: «Ukuranipun pinten?» = مقاسك كام؟
        tipis = خفيف، رفيع (القماش). endah = حلو، جميل. rapi = متظبّط، مترتّب.
      ar: |
        في سوق بيرينغهارجو، أكبر سوق باتيك في يوجيا:
        - klambi ← rasukan = قميص، ملابس
        - jarik ← nyamping = قماش باتيك طويل يُلفّ كالتنورة
        sepatu = حذاء. kaca = مرآة. ukuran = مقاس: «Ukuranipun pinten?» = ما مقاسك؟
        tipis = رقيق (القماش). endah = جميل. rapi = أنيق، مرتّب.
      en: |
        At Pasar Beringharjo, Jogja's biggest batik market:
        - klambi → rasukan = shirt, clothes
        - jarik → nyamping = a long batik cloth wrapped like a skirt
        sepatu = shoes. kaca = mirror. ukuran = size: "Ukuranipun pinten?" = what size?
        tipis = thin (fabric). endah = beautiful. rapi = neat, tidy.
    examples:
      - text: Rasukan batik menika endah sanget.
        ar_eg: قميص الباتيك ده حلو أوي.
        ar: قميص الباتيك هذا جميل جدًا.
        en: This batik shirt is beautiful.
      - text: Ukuranipun pinten, Mas?
        ar_eg: مقاسك كام يا أستاذ؟
        ar: ما مقاسك؟
        en: What size, sir?
      - text: Wernanipun sae, kainipun tipis.
        ar_eg: لونه حلو، وقماشه خفيف.
        ar: لونه جميل وقماشه رقيق.
        en: Nice colour, and the fabric is thin.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: rasukan
        ar_eg: قميص، هدوم (كراما)
        ar: قميص، ملابس (كراما)
        en: shirt, clothes (krama)
      - text: nyamping
        ar_eg: قماشة باتيك (كراما)
        ar: قماش باتيك (كراما)
        en: batik wrap (krama)
      - text: sepatu
        ar_eg: جزمة
        ar: حذاء
        en: shoes
      - text: kaca
        ar_eg: مراية
        ar: مرآة
        en: mirror
    words: [rasukan, nyamping, sepatu, kaca]
  - id: e02
    type: match_pairs
    pairs:
      - text: ukuran
        ar_eg: مقاس
        ar: مقاس
        en: size
      - text: tipis
        ar_eg: خفيف، رفيع
        ar: رقيق
        en: thin
      - text: endah
        ar_eg: حلو، جميل
        ar: جميل
        en: beautiful
      - text: rapi
        ar_eg: متظبّط
        ar: أنيق، مرتّب
        en: neat
    words: [ukuran, tipis, endah, rapi]
  - id: e03
    type: listen
    text: Ukuranipun pinten, Mas?
    question:
      ar_eg: البياعة بتسأل عن إيه؟
      ar: عمّ تسأل البائعة؟
      en: What is the seller asking?
    options: [لونه إيه؟, مقاسك كام؟, بكام؟]
    answer: 1
    meaning:
      ar_eg: مقاسك كام يا أستاذ؟
      ar: ما مقاسك؟
      en: What size, sir?
    words: [ukuran]
  - id: e04
    type: fill_blank
    sentence: Rasukan batik menika ___ sanget.
    meaning:
      ar_eg: قميص الباتيك ده ___ أوي.
      ar: قميص الباتيك هذا ___ جدًا.
      en: This batik shirt is very ___.
    options: [endah, ukuran, sepatu]
    answers: [endah]
    words: [endah, ukuran, sepatu, rasukan]
  - id: e05
    type: multiple_choice
    question: Klambi (ngoko) → ___ (krama)
    options: [nyamping, rasukan, kaca]
    answer: 1
    explain:
      ar_eg: klambi ← rasukan = قميص، هدوم. وjarik ← nyamping.
      ar: klambi ← rasukan = قميص، ملابس. وjarik ← nyamping.
      en: klambi → rasukan = shirt, clothes. And jarik → nyamping.
    words: [rasukan, nyamping, kaca]
  - id: e06
    type: fill_blank
    sentence: Hawane panas, aku seneng klambi sing ___.
    meaning:
      ar_eg: الجو حر، بحب الهدوم الـ___.
      ar: الجو حارّ، أحبّ الملابس الـ___.
      en: It's hot; I like ___ clothes.
    options: [tipis, rapi, kaca]
    answers: [tipis]
    words: [tipis, rapi, kaca]
  - id: e07
    type: build_sentence
    source:
      ar_eg: هدومك متظبّطة أوي.
      ar: ملابسك أنيقة جدًا.
      en: Your clothes look very neat.
    answer: Rasukan panjenengan rapi sanget.
    distractors: [sepatu, tipis]
    words: [rasukan, rapi]
  - id: e08
    type: translate
    direction: from_target
    source_text: Wernanipun sae, kainipun tipis.
    answers_meaning:
      ar_eg: [لونه حلو، وقماشه خفيف, اللون حلو والقماش رفيع]
      ar: [لونه جميل وقماشه رقيق]
      en: [The colour is nice and the fabric is thin, 'Nice colour, thin fabric']
    words: [tipis]
  - id: e09
    type: speaking
    text: Mbak, nyamping menika endah sanget.
    meaning:
      ar_eg: يا آنسة، قماشة الباتيك دي حلوة أوي.
      ar: يا آنسة، قماش الباتيك هذا جميل جدًا.
      en: Miss, this batik wrap is beautiful.
    words: [nyamping, endah]
  - id: e10
    type: multiple_choice
    question: Sepatu menika ___ pinten?
    options: [endah, ukuran, nyamping]
    answer: 1
    explain:
      ar_eg: ukuran = مقاس.
      ar: ukuran = مقاس.
      en: ukuran = size.
    words: [ukuran, sepatu, nyamping, endah]
dialogue:
  lines:
    - speaker: Penjual
      text: Mangga, Mas, rasukan batik. Endah-endah!
      ar_eg: اتفضل يا أستاذ، قمصان باتيك. حلوة كلها!
      ar: تفضّل، قمصان باتيك. كلها جميلة!
      en: Come and see, batik shirts. All lovely!
    - speaker: Mohamed
      text: Kula badhe tumbas rasukan batik ingkang rapi.
      ar_eg: عايز أشتري قميص باتيك شيك.
      ar: أريد شراء قميص باتيك أنيق.
      en: I'd like to buy a smart batik shirt.
    - speaker: Penjual
      text: Ukuranipun pinten, Mas?
      ar_eg: مقاسك كام يا أستاذ؟
      ar: ما مقاسك؟
      en: What size?
    - speaker: Mohamed
      text: L. Wonten werna biru?
      ar_eg: لارج. فيه لون أزرق؟
      ar: لارج. هل يوجد لون أزرق؟
      en: Large. Do you have blue?
    - speaker: Penjual
      text: Wonten. Kainipun tipis, kepenak. Nyamping ugi wonten kangge ibu.
      ar_eg: فيه. قماشه خفيف ومريح. وفيه كمان قماشات باتيك للستات.
      ar: نعم. قماشه رقيق ومريح. ولدينا أيضًا قماش باتيك للسيدات.
      en: Yes. The fabric's thin and comfy. We have batik wraps for ladies too.
    - speaker: Mohamed
      text: Sae! Nyamping setunggal kangge Ibu kula.
      ar_eg: حلو! قماشة واحدة لماما.
      ar: رائع! قماش واحد لأمي.
      en: Great! One wrap for my mum.
