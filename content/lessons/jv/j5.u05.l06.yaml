dialogue:
  title: Crita kancil
  lines:
    - speaker: Bu Nur
      text: Mas, sampeyan wis tau krungu crita kancil?
      ar_eg: يا محمد، سمعت قبل كده حدوتة الكانشيل؟
      ar: يا محمد، هل سمعت من قبل حكاية الكانشيل؟
      en: Mohamed, have you ever heard the kancil story?
    - speaker: Mohamed
      text: Dereng, Bu. Kancil menika menapa?
      ar_eg: لسه يا مدام. الكانشيل ده إيه؟
      ar: ليس بعد يا سيدتي. ما الكانشيل؟
      en: Not yet, ma'am. What's a kancil?
    - speaker: Bu Nur
      text: Kancil iku kaya kidang cilik, pinter banget. Saben bocah Jawa ngerti critane.
      ar_eg: الكانشيل زي غزال صغير، شاطر أوي. كل عيل جاوي عارف حدوتته.
      ar: الكانشيل كغزال صغير، ذكي جدًا. كل طفل جاوي يعرف حكايته.
      en: A kancil is like a little deer, very clever. Every Javanese child knows its stories.
    - speaker: Mohamed
      text: Ing Mesir ugi wonten crita ingkang pinter, Bu. Juha!
      ar_eg: في مصر برضه فيه حواديت الشاطر يا مدام. جحا!
      ar: 'وفي مصر أيضًا حكايات عن الذكي يا سيدتي: جحا!'
      en: In Egypt there are stories about a clever one too, ma'am. Goha!
    - speaker: Bu Nur
      text: Wah, mengko critakna, ya!
      ar_eg: الله، ابقى احكيهالي بعدين!
      ar: رائع، احكها لي لاحقًا!
      en: Oh, tell me later!
