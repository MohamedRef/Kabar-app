dialogue:
  title: Ing ngarep Menara Kudus
  lines:
    - speaker: Bu Retno
      text: Mas, iki Menara Kudus, kaya ing cerkakku.
      ar_eg: يا محمد، دي منارة كودوس، زي اللي في قصتي.
      ar: يا محمد، هذه منارة كودوس، كما في قصتي.
      en: Mohamed, this is the Menara Kudus, like in my story.
    - speaker: Mohamed
      text: Menara! Ing basa Arab "manara". Sami, nggih, Bu?
      ar_eg: menara! بالعربي «منارة». نفس الكلمة، صح يا أبلة؟
      ar: menara! وبالعربية «منارة». الكلمة نفسها، أليس كذلك يا سيدتي؟
      en: Menara! In Arabic it's «منارة». The same word, isn't it, ma'am?
    - speaker: Bu Retno
      text: Iya. Lan jeneng Kudus uga saka basa Arab lho, Al-Quds.
      ar_eg: آه. واسم كودوس كمان من العربي، «القدس».
      ar: نعم. واسم كودوس أيضًا من العربية، «القدس».
      en: Yes. And the name Kudus comes from Arabic too, al-Quds.
    - speaker: Mohamed
      text: Leres, Bu. Al-Quds menika Yerusalem.
      ar_eg: مظبوط يا أبلة. القدس هي أورشليم.
      ar: صحيح يا سيدتي. القدس هي أورشليم.
      en: That's right, ma'am. Al-Quds is Jerusalem.
    - speaker: Bu Retno
      text: Ayo, saiki mangan jenang kaya Bima!
      ar_eg: يلا، دلوقتي ناكل jenang زي بيما!
      ar: هيا، لنأكل الآن jenang مثل بيما!
      en: Come on, now let's eat jenang like Bima!
