language: jv
title: Cerkak
can_do:
  ar_eg: تقرا قصة قصيرة.
  ar: أن تقرأ قصة قصيرة.
  en: Read a short story.
slides:
  - title: Bima ing Menara Kudus
    body:
      ar_eg: |
        قصة بو ريتنو القصيرة. قبل ما تقرا بالتفصيل، علّم على أدوات الحكي: ing sawijining dina (البداية)، sawise وdumadakan (المفاجأة)، pungkasane (النهاية).
        كلمات جديدة: menara = منارة / مئذنة (من العربي)، nemokake = لقى (menemukan)، jenang = حلاوة كودوس المشهورة من دقيق الرز وجوز الهند والسكر.
      ar: |
        قصة السيدة ريتنو القصيرة. قبل القراءة المفصّلة ظلّل أدوات السرد: ing sawijining dina (البداية)، وsawise وdumadakan (المفاجأة)، وpungkasane (الخاتمة).
        كلمات جديدة: menara = منارة / مئذنة (من العربية)، وnemokake = وجد (menemukan)، وjenang = حلوى كودوس الشهيرة من دقيق الأرز وجوز الهند والسكر.
      en: |
        Bu Retno's short story. Before reading closely, mark the story connectors: ing sawijining dina (opening), sawise and dumadakan (the twist), pungkasane (ending).
        New words: menara = minaret, tower (from Arabic «منارة»), nemokake = found (menemukan), jenang = Kudus's famous sweet of rice flour, coconut milk and palm sugar.
    grammar: jv.narrative.connectors
    examples:
      - text: Ing sawijining dina, Bima lan simbahe lunga menyang Menara Kudus.
        ar_eg: في يوم من الأيام، بيما وجدّه راحوا منارة كودوس.
        ar: في يوم من الأيام ذهب بيما وجدّه إلى منارة كودوس.
        en: One day, Bima and his grandfather went to the Menara Kudus.
      - text: Sawise salat, dumadakan Bima ora ana.
        ar_eg: بعد الصلاة، فجأة بيما مكانش موجود.
        ar: بعد الصلاة لم يكن بيما موجودًا فجأة.
        en: After the prayer, suddenly Bima was gone.
      - text: Pungkasane, simbah nemokake Bima ing ngarep menara, lagi mangan jenang.
        ar_eg: وفي الآخر، الجدّ لقى بيما قدّام المنارة بياكل jenang.
        ar: وفي النهاية وجد الجدّ بيما أمام المنارة يأكل jenang.
        en: In the end, grandpa found Bima in front of the minaret, eating jenang.
