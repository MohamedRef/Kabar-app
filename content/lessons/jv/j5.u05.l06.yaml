id: j5.u05.l06
language: jv
title: Kancil lan timun
can_do:
  ar_eg: تقرا بداية حدوتة الكانشيل وتتابع البداية والـ «وبعدين» والمفاجأة.
  ar: أن تقرأ بداية حكاية الكانشيل وتتابع الافتتاح و«ثم» والمفاجأة.
  en: Read the opening of the kancil fable and follow its opening, its "then" and its twist.
slides:
  - title: Dongeng kancil
    body:
      ar_eg: |
        كل طفل في جاوة عارف حدوتة الكانشيل، الغزال القزم الشاطر، زي جحا عندنا. ده أول الحدوتة اللي بيسرق فيها الخيار.
        دوّر على أدوات الحكي اللي اتعلمتها: Biyen ana … (كان يا ما كان)، Ing sawijining dina (في يوم من الأيام)، banjur (وبعدين)، dumadakan (فجأة).
        كلمات جديدة: kancil = الغزال القزم (kancil)، timun = خيار (timun)، mlayu = يجري (lari). وPak Tani = الفلاح.
      ar: |
        كل طفل في جاوة يعرف حكاية الكانشيل، الغزال القزم الذكي، كجحا عندنا. هذه بداية الحكاية التي يسرق فيها الخيار.
        ابحث عن أدوات السرد التي تعلمتها: Biyen ana … (كان يا ما كان)، وIng sawijining dina (في يوم من الأيام)، وbanjur (ثم)، وdumadakan (فجأة).
        كلمات جديدة: kancil = الغزال القزم (kancil)، وtimun = خيار (timun)، وmlayu = يجري (lari). وPak Tani = الفلاح.
      en: |
        Every child in Java knows the kancil, the clever mouse-deer, a bit like our Goha. Here's the start of the story where he steals cucumbers.
        Look for the story connectors you know: Biyen ana … (once upon a time), Ing sawijining dina (one day), banjur (then), dumadakan (suddenly).
        New words: kancil = mouse-deer (kancil), timun = cucumber (timun), mlayu = run (lari). Pak Tani = the farmer.
    grammar: jv.narrative.connectors
    examples:
      - text: Biyen ana kancil kang pinter banget.
        ar_eg: كان يا ما كان، كان فيه كانشيل شاطر أوي.
        ar: كان يا ما كان، كان هناك كانشيل ذكي جدًا.
        en: Once upon a time there was a very clever mouse-deer.
      - text: Ing sawijining dina, kancil menyang kebon timune Pak Tani, banjur mangan timun akeh banget.
        ar_eg: في يوم من الأيام، الكانشيل راح غيط الخيار بتاع الفلاح، وبعدين كل خيار كتير أوي.
        ar: في يوم من الأيام ذهب الكانشيل إلى حقل خيار الفلاح، ثم أكل خيارًا كثيرًا جدًا.
        en: One day the mouse-deer went to the farmer's cucumber field, then ate a great many cucumbers.
      - text: Dumadakan Pak Tani teka, nanging kancil wis mlayu adoh.
        ar_eg: فجأة الفلاح جه، بس الكانشيل كان جري بعيد خلاص.
        ar: فجأة جاء الفلاح، لكن الكانشيل كان قد جرى بعيدًا.
        en: Suddenly the farmer came, but the mouse-deer had already run far away.
exercises:
  - id: e01
    type: listen
    text: Biyen ana kancil kang pinter banget.
    question:
      ar_eg: الكانشيل كان عامل إزاي؟
      ar: كيف كان الكانشيل؟
      en: What was the mouse-deer like?
    options: [lara, pinter banget, cilik banget]
    answer: 1
    meaning:
      ar_eg: كان يا ما كان، كان فيه كانشيل شاطر أوي.
      ar: كان يا ما كان، كان هناك كانشيل ذكي جدًا.
      en: Once upon a time there was a very clever mouse-deer.
    words: [kancil, biyen]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: الكانشيل كل إيه؟
      ar: ماذا أكل الكانشيل؟
      en: What did the mouse-deer eat?
    options: [timun, jenang, sega]
    answer: 0
    words: [timun]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: لما الفلاح جه، الكانشيل كان فين؟
      ar: حين جاء الفلاح، أين كان الكانشيل؟
      en: When the farmer came, where was the mouse-deer?
    options: [isih ing kebon, turu ing omah, wis mlayu adoh]
    answer: 2
    explain:
      ar_eg: «kancil wis mlayu adoh» = كان جري بعيد خلاص قبل ما الفلاح يوصل.
      ar: «kancil wis mlayu adoh» = كان قد جرى بعيدًا قبل وصول الفلاح.
      en: '"kancil wis mlayu adoh" = he had already run far away before the farmer arrived.'
    words: [mlayu, dumadakan]
  - id: e04
    type: match_pairs
    pairs:
      - text: kancil
        ar_eg: غزال قزم
        ar: غزال قزم
        en: mouse-deer
      - text: timun
        ar_eg: خيار
        ar: خيار
        en: cucumber
      - text: mlayu
        ar_eg: يجري
        ar: يجري
        en: run
      - text: kebon
        ar_eg: غيط / جنينة
        ar: حقل / بستان
        en: field, garden
      - text: dumadakan
        ar_eg: فجأة
        ar: فجأة
        en: suddenly
    words: [kancil, timun, mlayu, dumadakan]
  - id: e05
    type: fill_blank
    sentence: Kancil menyang kebon timune Pak Tani, ___ mangan timun akeh banget.
    meaning:
      ar_eg: الكانشيل راح غيط الخيار بتاع الفلاح، وبعدين كل خيار كتير أوي.
      ar: ذهب الكانشيل إلى حقل خيار الفلاح، ثم أكل خيارًا كثيرًا جدًا.
      en: The mouse-deer went to the farmer's cucumber field, then ate a great many cucumbers.
