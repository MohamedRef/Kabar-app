schema: kabar.lesson/v1
id: j2.u03.l05
language: jv
title: Notane Bu Siti
can_do:
  ar_eg: تفهم فاتورة في السوق وتتأكد من الباقي.
  ar: أن تفهم فاتورة في السوق وتتحقّق من الباقي.
  en: Read a market bill and check the change.
slides:
  - title: Nota saka pasar Nganjuk
    grammar: jv.number.full
    body:
      ar_eg: |
        Bu Siti بتكتب فاتورتك (nota) وهي بتقراها بصوت عالي. تابع الأرقام:
        - 28 = wolulikur، و26 = nemlikur (الـ ‎-likur من 21 لـ 29).
        - 84 = wolung puluh papat: العشرات + الآحاد، زي الإندونيسي.
        - 110.000 = satus sepuluh ewu، و150.000 = satus seket ewu.
        duwite = الفلوس (اللي دفعتها)، susuke = الباقي.
      ar: |
        تكتب Bu Siti فاتورتك (nota) وتقرؤها بصوت عالٍ. تابع الأرقام:
        - 28 = wolulikur، و26 = nemlikur (نظام ‎-likur من 21 إلى 29).
        - 84 = wolung puluh papat: العشرات ثم الآحاد، كما في الإندونيسية.
        - 110.000 = satus sepuluh ewu، و150.000 = satus seket ewu.
        duwite = المال (الذي دفعته)، وsusuke = الباقي.
      en: |
        Bu Siti writes your bill (nota) and reads it out as she goes. Follow the numbers:
        - 28 = wolulikur, 26 = nemlikur (the -likur set for 21–29).
        - 84 = wolung puluh papat: tens + units, as in Indonesian.
        - 110,000 = satus sepuluh ewu, 150,000 = satus seket ewu.
        duwite = the money (you paid), susuke = the change.
    examples:
      - text: Bawang abang telung kilo, wolung puluh papat ewu.
        ar_eg: بصل أحمر تلاتة كيلو، أربعة وتمانين ألف. (٨٤٬٠٠٠)
        ar: بصل أحمر ثلاثة كيلوغرامات، أربعة وثمانون ألفًا. (٨٤٬٠٠٠)
        en: Shallots, three kilos, eighty-four thousand. (84,000)
      - text: Endhog sekilo nemlikur ewu. Kabeh dadi satus sepuluh ewu.
        ar_eg: بيض كيلو بستة وعشرين ألف. الكل يبقى مية وعشرة آلاف. (١١٠٬٠٠٠)
        ar: بيض كيلوغرام بستة وعشرين ألفًا. المجموع مئة وعشرة آلاف. (١١٠٬٠٠٠)
        en: Eggs, one kilo, twenty-six thousand. That comes to a hundred and ten thousand. (110,000)
      - text: Duwite satus seket ewu. Susuke patang puluh ewu.
        ar_eg: الفلوس مية وخمسين ألف. الباقي أربعين ألف.
        ar: المبلغ المدفوع مئة وخمسون ألفًا، والباقي أربعون ألفًا.
        en: The money is a hundred and fifty thousand. The change is forty thousand.
exercises:
  - id: e01
    type: multiple_choice
    question: Bawang abang telung kilo, wolung puluh papat ewu.
    question_meaning:
      ar_eg: محمد اشترى كام كيلو بصل أحمر؟
      ar: كم كيلوغرامًا من البصل الأحمر اشترى محمد؟
      en: How many kilos of shallots did Mohamed buy?
    options: ["Rong kilo.", "Telung kilo.", "Setengah kilo."]
    answer: 1
    explain:
      ar_eg: telung kilo = تلاتة كيلو (telu بتبقى telung قبل kilo).
      ar: telung kilo = ثلاثة كيلوغرامات (telu تصير telung قبل kilo).
      en: telung kilo = three kilos (telu becomes telung before kilo).
    words: [bawang abang]
  - id: e02
    type: multiple_choice
    question: Kabeh dadi satus sepuluh ewu.
    question_meaning:
      ar_eg: الفاتورة كلها بكام؟
      ar: كم مجموع الفاتورة؟
      en: How much is the whole bill?
    options: ["Satus seket ewu.", "Satus ewu.", "Satus sepuluh ewu."]
    answer: 2
    explain:
      ar_eg: Kabeh dadi … = الكل يبقى …، وsatus sepuluh ewu = 110.000. (satus seket ewu ده اللي محمد دفعه.)
      ar: Kabeh dadi … = المجموع …، وsatus sepuluh ewu = 110.000، أما satus seket ewu فهو ما دفعه محمد.
      en: Kabeh dadi … = that comes to …, and satus sepuluh ewu = 110,000. (satus seket ewu is what Mohamed paid.)
    words: [dadi, ewu]
  - id: e03
    type: listen
    text: Duwite satus seket ewu. Susuke patang puluh ewu.
    question:
      ar_eg: محمد هياخد باقي كام؟
      ar: كم الباقي الذي يأخذه محمد؟
      en: How much change does Mohamed get?
    options: ["Patang puluh ewu.", "Seket ewu.", "Selawe ewu."]
    answer: 0
    meaning:
      ar_eg: الفلوس مية وخمسين ألف. الباقي أربعين ألف.
      ar: المبلغ المدفوع مئة وخمسون ألفًا، والباقي أربعون ألفًا.
      en: The money is a hundred and fifty thousand. The change is forty thousand.
    explain:
      ar_eg: susuke = الباقي. 150.000 − 110.000 = 40.000 = patang puluh ewu.
      ar: susuke = الباقي، و150.000 − 110.000 = 40.000 = patang puluh ewu.
      en: susuke = the change. 150,000 − 110,000 = 40,000 = patang puluh ewu.
    words: [susuk, seket]
  - id: e04
    type: multiple_choice
    question: "28.000"
    question_meaning:
      ar_eg: كيلو البصل الأحمر بـ 28.000. بتتقال إزاي؟
      ar: ثمن كيلو البصل الأحمر 28.000. كيف يُنطق؟
      en: A kilo of shallots is 28,000. How do you say it?
    options: ["wolulas ewu", "wolulikur ewu", "wolung puluh ewu"]
    answer: 1
    explain:
      ar_eg: 28 = wolulikur. wolulas = 18، وwolung puluh = 80.
      ar: 28 = wolulikur، أما wolulas فهي 18، وwolung puluh هي 80.
      en: 28 = wolulikur. wolulas = 18, wolung puluh = 80.
    words: [ewu]
  - id: e05
    type: match_pairs
    pairs:
      - text: nemlikur
        ar_eg: ٢٦
        ar: ٢٦
        en: twenty-six (26)
      - text: wolung puluh papat
        ar_eg: ٨٤
        ar: ٨٤
        en: eighty-four (84)
      - text: satus sepuluh
        ar_eg: ١١٠
        ar: ١١٠
        en: a hundred and ten (110)
      - text: satus seket
        ar_eg: ١٥٠
        ar: ١٥٠
        en: a hundred and fifty (150)
      - text: patang puluh
        ar_eg: ٤٠
        ar: ٤٠
        en: forty (40)
    words: [seket]
  - id: e06
    type: fill_blank
    sentence: Endhog sekilo ___ ewu.
    meaning:
      ar_eg: البيض الكيلو بستة وعشرين ألف (26.000).
      ar: البيض بستة وعشرين ألفًا للكيلوغرام (26.000).
      en: Eggs are twenty-six thousand (26,000) a kilo.
    answers: ["nemlikur", "Nemlikur"]
    explain:
      ar_eg: ستة وعشرين = nemlikur (nem + likur).
      ar: ستة وعشرون = nemlikur (nem + likur).
      en: 26 = nemlikur (nem + likur).
    words: [sekilo, endhog]
  - id: e07
    type: dictation
    text: Kabeh dadi satus sepuluh ewu.
    meaning:
      ar_eg: الكل يبقى مية وعشرة آلاف.
      ar: المجموع مئة وعشرة آلاف.
      en: That comes to a hundred and ten thousand.
    words: [dadi, ewu]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: يا طنط، كيلو البيض بكام؟
      ar: يا سيدتي، كم سعر كيلو البيض؟
      en: Ma'am, how much is a kilo of eggs?
    answers:
      - Bu, endhog sekilo pira?
      - Bu, endhog sekilo pira
      - Bu, endhog sekilo piro?
      - Endhog sekilo pira, Bu?
      - Endhog sekilo pira, Bu
      - Bu, sekilo endhog pira?
      - Bu, endhoge sekilo pira?
      - Endhoge sekilo pira, Bu?
    explain:
      ar_eg: "زي «Bawang abang sekilo pira?»: الحاجة + sekilo + pira."
      ar: "مثل «Bawang abang sekilo pira?»: الشيء ثم sekilo ثم pira."
      en: "Like \"Bawang abang sekilo pira?\": the item + sekilo + pira."
    words: [endhog, sekilo, pira]
  - id: e09
    type: speaking
    text: Susuke patang puluh ewu, Bu? Matur nuwun.
    meaning:
      ar_eg: الباقي أربعين ألف يا طنط؟ متشكر.
      ar: الباقي أربعون ألفًا يا سيدتي؟ شكرًا.
      en: The change is forty thousand, ma'am? Thank you.
    words: [susuk]
dialogue:
  title: Mbayar neng Bu Siti
  lines:
    - speaker: Bu Siti
      text: Bawang abang telung kilo, endhog sekilo. Kabeh dadi satus sepuluh ewu, Mas.
      ar_eg: بصل أحمر تلاتة كيلو، وبيض كيلو. الكل مية وعشرة آلاف يا أستاذ.
      ar: بصل أحمر ثلاثة كيلوغرامات، وبيض كيلوغرام. المجموع مئة وعشرة آلاف يا أخي.
      en: Three kilos of shallots, a kilo of eggs. That comes to a hundred and ten thousand, Mas.
    - speaker: Mohamed
      text: Endhoge sekilo pira, Bu?
      ar_eg: البيض الكيلو بكام يا طنط؟
      ar: كم سعر كيلو البيض يا سيدتي؟
      en: How much are the eggs a kilo, ma'am?
    - speaker: Bu Siti
      text: Nemlikur ewu, Mas.
      ar_eg: ستة وعشرين ألف يا أستاذ.
      ar: ستة وعشرون ألفًا يا أخي.
      en: Twenty-six thousand, Mas.
    - speaker: Mohamed
      text: Iki satus seket ewu, Bu.
      ar_eg: اتفضلي مية وخمسين ألف يا طنط.
      ar: تفضّلي مئة وخمسين ألفًا يا سيدتي.
      en: Here's a hundred and fifty thousand, ma'am.
    - speaker: Bu Siti
      text: Iki susuke, patang puluh ewu. Matur nuwun, Mas!
      ar_eg: ده الباقي، أربعين ألف. متشكرة يا أستاذ!
      ar: هذا الباقي، أربعون ألفًا. شكرًا يا أخي!
      en: Here's your change, forty thousand. Thank you, Mas!
    - speaker: Mohamed
      text: Iya, matur nuwun, Bu!
      ar_eg: ماشي، متشكر يا طنط!
      ar: حسنًا، شكرًا يا سيدتي!
      en: OK, thank you, ma'am!
review:
