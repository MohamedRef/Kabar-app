schema: kabar.lesson/v1
id: j2.u03.l05
language: jv
title: Ireng, putih, kuning
can_do:
  ar_eg: تسأل عن لون التيشيرت، تجرّب قبل ما تشتري، وتعدّ فلوسك.
  ar: أن تسأل عن لون القميص، وتجرّب قبل الشراء، وتعدّ نقودك.
  en: Ask about a T-shirt's colour, try before you buy, and count your money.
slides:
  - title: Wernane apa?
    body:
      ar_eg: |
        werna = لون (وبيتقال كمان werno): Wernane apa? = لونه إيه؟
        ireng = أسود، putih = أبيض، kuning = أصفر (وabang = أحمر، عارفها).
        kaos = تيشيرت. lombok = فلفل حامي (شطة): lombok abang، lombok ijo.
        jajal = جرّب: Jajal dhisik! = جرّب الأول!
        ngetung (etung) = يعدّ، يحسب: Aku ngetung dhuwite.
      ar: |
        werna = لون (ويقال أيضًا werno): Wernane apa? = ما لونه؟
        ireng = أسود، putih = أبيض، kuning = أصفر (وabang = أحمر، تعرفها).
        kaos = قميص قطني (تيشيرت). lombok = فلفل حارّ: lombok abang، lombok ijo.
        jajal = جرّب: Jajal dhisik! = جرّب أوّلًا!
        ngetung (etung) = يعدّ، يحسب: Aku ngetung dhuwite.
      en: |
        werna = colour (also werno): Wernane apa? = What colour is it?
        ireng = black, putih = white, kuning = yellow (and abang = red, you know it).
        kaos = T-shirt. lombok = chilli pepper: lombok abang, lombok ijo.
        jajal = try: Jajal dhisik! = Try it first!
        ngetung (etung) = count: Aku ngetung dhuwite.
    examples:
      - text: Kaos putih iki pira, Bu?
        ar_eg: التيشيرت الأبيض ده بكام يا حاجة؟
        ar: بكم هذا القميص الأبيض يا خالة؟
        en: How much is this white T-shirt, Bu?
      - text: Jajal dhisik, Mas!
        ar_eg: جرّب الأول يا ماس!
        ar: جرّبه أوّلًا يا أخي!
        en: Try it on first, Mas!
      - text: Lomboke pedhes tenan!
        ar_eg: الفلفل الحامي حرّاق أوي!
        ar: الفلفل حارّ جدًّا!
        en: The chillies are really hot!
