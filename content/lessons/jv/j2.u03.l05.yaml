    question:
      ar_eg: بيسأل عن أنهي تيشيرت؟
      ar: عن أيّ قميص يسأل؟
      en: Which T-shirt is he asking about?
    options: [التيشيرت الأبيض بكام؟, التيشيرت الأسود بكام؟, التيشيرت الأصفر بكام؟]
    answer: 0
    meaning:
      ar_eg: التيشيرت الأبيض ده بكام يا حاجة؟
      ar: بكم هذا القميص الأبيض يا خالة؟
      en: How much is this white T-shirt, Bu?
    words: [kaos, putih, ireng, kuning]
  - id: e04
    type: fill_blank
    sentence: Kaose werna apa? — ___, ora putih.
    meaning:
      ar_eg: التيشيرت لونه إيه؟ — ___، مش أبيض.
      ar: ما لون القميص؟ — ___، ليس أبيض.
      en: What colour is the T-shirt? — ___, not white.
    options: [Ireng, Lombok, Jajal]
    answers: [Ireng]
    words: [ireng, putih, lombok, jajal, werna]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «جرّب الأول يا ماس!» بالجاوي؟
      ar: كيف تقول «جرّبه أوّلًا يا أخي!» بالجاوية؟
      en: '"Try it first, Mas!" in Javanese?'
    options: ['Jajal dhisik, Mas!', 'Ngetung dhisik, Mas!', 'Kaos dhisik, Mas!']
    answer: 0
    explain:
      ar_eg: jajal = جرّب، ngetung = يعدّ.
      ar: jajal = جرّب، ngetung = يعدّ.
      en: jajal = try, ngetung = count.
    words: [jajal, ngetung, kaos]
  - id: e06
    type: fill_blank
    sentence: 'Bu Siti ___ dhuwite: sewu, rong ewu, telung ewu.'
    meaning:
      ar_eg: 'بو سيتي ___ الفلوس: ألف، ألفين، تلات آلاف.'
      ar: 'بو سيتي ___ النقود: ألف، ألفان، ثلاثة آلاف.'
      en: 'Bu Siti ___ the money: one, two, three thousand.'
    options: [ngetung, jajal, adol]
    answers: [ngetung]
    words: [ngetung, jajal, adol]
  - id: e07
    type: multiple_choice
    question: Lomboke pedhes tenan!
    question_meaning:
      ar_eg: إيه اللي حرّاق؟
      ar: ما الحارّ؟
      en: What's hot?
    options: [الفلفل الحامي, البصل, الموز]
    answer: 0
    explain:
      ar_eg: lombok = فلفل حامي. البصل = brambang، الموز = gedhang.
      ar: lombok = فلفل حارّ. أمّا البصل فـbrambang، والموز فـgedhang.
      en: lombok = chilli. Shallot is brambang, banana is gedhang.
    words: [lombok]
  - id: e08
    type: build_sentence
    source:
      ar_eg: التيشيرت ده لونه أصفر.
      ar: هذا القميص لونه أصفر.
      en: This T-shirt is yellow.
    answer: Kaos iki wernane kuning.
    distractors: [ireng, putih]
    words: [kaos, werna, kuning, ireng, putih]
  - id: e09
    type: translate
    direction: from_target
    source_text: Wernane apa? Ireng apa putih?
    answers_meaning:
      ar_eg: [لونه إيه؟ أسود ولا أبيض؟, إيه اللون؟ أسود ولا أبيض؟]
      ar: [ما لونه؟ أسود أم أبيض؟, ما اللون؟ أسود أم أبيض؟]
      en: ['What colour? Black or white?', 'What colour is it? Black or white?']
    words: [werna, ireng, putih]
  - id: e10
    type: speaking
    text: Lombok kuning, lombok abang, kabeh pedhes.
    meaning:
      ar_eg: فلفل أصفر، فلفل أحمر، كله حرّاق.
      ar: فلفل أصفر وفلفل أحمر، كلّه حارّ.
      en: Yellow chillies, red chillies, all hot.
    words: [lombok, kuning]
dialogue:
  lines:
    - speaker: Penjual
      text: Mangga, Mas, kaos Reog! Ana ireng, putih, kuning.
      ar_eg: اتفضّل يا ماس، تيشيرتات ريوج! فيه أسود وأبيض وأصفر.
      ar: تفضّل يا أخي، قمصان ريوغ! عندنا أسود وأبيض وأصفر.
      en: Come on, Mas, Reog T-shirts! Black, white, yellow.
    - speaker: Mohamed
      text: Sing ireng pira, Pak?
      ar_eg: الأسود بكام يا عم؟
      ar: بكم الأسود يا عم؟
      en: How much is the black one, Pak?
    - speaker: Penjual
      text: Seket ewu. Jajal sik, Mas!
      ar_eg: خمسين ألف. جرّبه الأول يا ماس!
      ar: خمسون ألفًا. جرّبه أوّلًا يا أخي!
      en: Fifty thousand. Try it first, Mas!
    - speaker: Mohamed
      text: 'Pas. Tak jupuk loro: ireng karo putih.'
      ar_eg: 'مظبوط. هاخد اتنين: أسود وأبيض.'
      ar: 'مقاسه مناسب. سآخذ اثنين: أسود وأبيض.'
      en: 'It fits. I''ll take two: black and white.'
    - speaker: Penjual
      text: Satus ewu. Sedhela, tak etung susuke.
      ar_eg: مية ألف. لحظة، أعدّ الباقي.
      ar: مئة ألف. لحظة، سأعدّ الباقي.
      en: A hundred thousand. One moment, I'll count your change.
