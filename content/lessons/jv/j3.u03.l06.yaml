schema: kabar.lesson/v1
id: j3.u03.l06
language: jv
title: Sampeyan sampun nedha?
can_do:
  ar_eg: تسأل وترد بأدب.
  ar: أن تسأل وتجيب بأدب.
  en: Ask and answer politely.
slides:
  - title: Ganti tembunge
    body:
      ar_eg: |
        النهارده الضهر في كاومان، جنب الجامع الكبير. هتسأل وترد بالكراما. السر: بدّل كل كلمة صغيرة:
        - aku ← kula، kowe ← sampeyan
        - wis ← sampun، durung ← dereng، arep ← badhe، isih ← taksih
        - ora ← mboten، ana ← wonten، iya ← inggih
        - neng ← dhateng، saka ← saking، karo ← kaliyan
        Kowe wis mangan? ← Sampeyan sampun nedha?
      ar: |
        اليوم ظهرًا في كاومان قرب المسجد الكبير، ستسأل وتجيب بالكراما. والسر أن تبدّل كل لفظ صغير:
        - aku ← kula، وkowe ← sampeyan
        - wis ← sampun، وdurung ← dereng، وarep ← badhe، وisih ← taksih
        - ora ← mboten، وana ← wonten، وiya ← inggih
        - neng ← dhateng، وsaka ← saking، وkaro ← kaliyan
        Kowe wis mangan? ← Sampeyan sampun nedha?
      en: |
        Today at noon in Kauman, by the Grand Mosque, you'll ask and answer in krama. The secret: swap every small word:
        - aku → kula, kowe → sampeyan
        - wis → sampun, durung → dereng, arep → badhe, isih → taksih
        - ora → mboten, ana → wonten, iya → inggih
        - neng → dhateng, saka → saking, karo → kaliyan
        Kowe wis mangan? → Sampeyan sampun nedha?
    grammar: jv.krama.function-words
exercises:
  - id: e01
    type: multiple_choice
    question: Kowe wis mangan?
    question_meaning:
      ar_eg: حوّلها لكراما (لـ Pak Harjo البياع).
      ar: حوّلها إلى الكراما (للبائع Pak Harjo).
      en: Turn it into krama (for Pak Harjo, the seller).
    options: ['Sampeyan wis nedha?', 'Sampeyan sampun nedha?', 'Kowe sampun mangan?']
    answer: 1
    explain:
      ar_eg: 'لازم كل الكلمات تتبدل: kowe ← sampeyan، wis ← sampun، mangan ← nedha.'
      ar: 'تُبدّل الألفاظ كلها: kowe ← sampeyan، وwis ← sampun، وmangan ← nedha.'
      en: Every word swaps — kowe → sampeyan, wis → sampun, mangan → nedha.
    words: [sampeyan, sampun, nedha]
  - id: e02
    type: listen
    text: Kula badhe dhateng masjid.
    options: [Kula badhe dhateng masjid., Kula badhe dhateng peken., Aku arep neng masjid.]
    answer: 0
    words: [badhe, dhateng, masjid]
  - id: e03
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: حضرتك كلت يا عم؟ (لـ Pak Harjo)
      ar: هل أكلتَ يا سيدي؟ (لـ Pak Harjo)
      en: Have you eaten, sir? (to Pak Harjo)
    answers: ["Sampeyan sampun nedha, Pak?", "Sampeyan sampun nedha, Pak", "Pak, sampeyan sampun nedha?", "Pak, sampeyan sampun nedha", "Sampeyan sampun nedha?", Sampeyan sampun nedha, "Panjenengan sampun dhahar, Pak?", "Panjenengan sampun dhahar, Pak", "Pak, panjenengan sampun dhahar?", "Pak, panjenengan sampun dhahar"]
    explain:
      ar_eg: 'للبياع: Sampeyan sampun nedha. ولو قلت panjenengan + dhahar لراجل كبير، ده أدب زيادة ومقبول.'
      ar: للبائع Sampeyan sampun nedha، وpanjenengan مع dhahar للرجل المسنّ أدب زائد مقبول.
      en: For a seller, Sampeyan sampun nedha; panjenengan + dhahar for an older man is extra polite and fine.
    words: [sampeyan, sampun, nedha]
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: لسه يا عم. (ماكلتش لسه)
      ar: ليس بعد يا سيدي. (لم آكل بعد)
      en: Not yet, sir. (you haven't eaten)
    answers: ["Dereng, Pak.", "Dereng, Pak", "Dereng, Pak. Kula dereng nedha.", "Dereng, Pak. Kulo dereng nedha.", "Dereng, Pak. Kula dereng nedha", "Dereng, Pak. Kulo dereng nedha", "Kula dereng nedha, Pak.", "Kulo dereng nedha, Pak.", "Kula dereng nedha, Pak", "Kulo dereng nedha, Pak"]
    words: [dereng]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا رايح الجامع مع دِيماس.
      ar: سأذهب إلى المسجد مع ديماس.
      en: I'm going to the mosque with Dimas.
    answer: Kula badhe dhateng masjid kaliyan Mas Dimas.
    distractors: [arep, karo]
    words: [badhe, dhateng, kaliyan, masjid]
  - id: e06
    type: fill_blank
    sentence: Inggih, kula ___ sinau krama.
    meaning:
      ar_eg: أيوه، أنا لسه بتعلم كراما.
      ar: نعم، ما زلتُ أتعلم الكراما.
      en: Yes, I'm still learning krama.
    answers: [taksih]
    explain:
      ar_eg: «لسه بـ» = isih ← taksih.
      ar: «ما زال» = isih ← taksih.
      en: '"Still" = isih → taksih.'
    words: [taksih]
  - id: e07
    type: fill_blank
    sentence: Nyuwun sewu, Pak, teh ___ wonten.
    meaning:
      ar_eg: لا مؤاخذة يا عم، مفيش شاي.
      ar: عفوًا يا سيدي، لا يوجد شاي.
      en: Sorry, sir, there's no tea.
    answers: [mboten]
    words: [mboten, teh]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: فيه شاي يا عم؟ (بالكراما — «شاي» = teh)
      ar: هل يوجد شاي يا سيدي؟ (بالكراما — «شاي» = teh)
      en: Is there tea, sir? (krama — "tea" = teh)
    answers: ["Wonten teh, Pak?", "Wonten teh, Pak", "Pak, wonten teh?", "Pak, wonten teh", "Nyuwun sewu, wonten teh, Pak?", "Nyuwun sewu, wonten teh, Pak", "Nyuwun sewu, Pak, wonten teh?", "Nyuwun sewu, Pak, wonten teh"]
    words: [wonten, teh]
  - id: e09
    type: dictation
    text: Wonten teh, Pak?
    meaning:
      ar_eg: فيه شاي يا عم؟
      ar: هل يوجد شاي يا سيدي؟
      en: Is there any tea, sir?
    words: [wonten, teh]
  - id: e10
    type: speaking
    text: Dereng, Pak. Kula badhe dhateng masjid kaliyan Mas Dimas.
    meaning:
      ar_eg: لسه يا عم. أنا رايح الجامع مع دِيماس.
      ar: ليس بعد يا سيدي. سأذهب إلى المسجد مع ديماس.
      en: Not yet, sir. I'm going to the mosque with Dimas.
    words: [dereng, badhe, dhateng, masjid, kaliyan]
dialogue:
  title: Awan ing Kauman
  lines:
    - speaker: Pak Harjo
      text: "Mas Mohamed! Sampun nedha?"
      ar_eg: "يا أستاذ محمد! كلت؟"
      ar: "يا محمد! هل أكلتَ؟"
      en: "Mohamed! Eaten yet?"
    - speaker: Mohamed
      text: Dereng, Pak. Sampeyan?
      ar_eg: لسه يا عم. وحضرتك؟
      ar: ليس بعد يا سيدي. وأنت؟
      en: Not yet, sir. And you?
    - speaker: Pak Harjo
      text: "Sampun, Mas. Badhe nedha?"
      ar_eg: "كلت يا أستاذ. ناوي تاكل؟"
      ar: "أكلتُ. هل ستأكل؟"
      en: "I have. Going to eat?"
    - speaker: Mohamed
      text: Inggih, Pak. Kula badhe nedha kaliyan Mas Dimas.
      ar_eg: أيوه يا عم. أنا هاكل مع دِيماس.
      ar: نعم يا سيدي. سآكل مع ديماس.
      en: Yes, sir. I'm going to eat with Dimas.
    - speaker: Pak Harjo
      text: "Oh, nggih. Mangga, Mas."
      ar_eg: "آه، طيب. اتفضل يا أستاذ."
      ar: "آه، حسنًا. تفضّل."
      en: "Oh, right. Off you go, then."
    - speaker: Mohamed
      text: Matur nuwun, Pak.
      ar_eg: شكرًا يا عم.
      ar: شكرًا يا سيدي.
      en: Thank you, sir.
new_words:
  - word: masjid
    pos: noun
    ar_eg: جامع
    ar: مسجد
    en: mosque
    arabic: مسجد
  - word: teh
    pos: noun
    ar_eg: شاي
    ar: شاي
    en: tea
