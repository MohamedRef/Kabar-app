dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, ayo neng pendhapa. Niyaga lagi gladhen.
      ar_eg: يا محمد، يلا على البندوبو. العازفين بيعملوا بروفة.
      ar: يا محمد، هيّا إلى البندوبو. العازفون يتمرّنون.
      en: Mohamed, let's go to the pendhapa. The gamelan players are rehearsing.
    - speaker: Mohamed
      text: Ayo! Mas Dimas nabuh apa bengi iki?
      ar_eg: يلا! هتضرب إيه الليلة يا ماس ديماس؟
      ar: هيّا! ماذا ستعزف الليلة يا ماس ديماس؟
      en: Let's! What are you playing tonight, Mas Dimas?
    - speaker: Mas Dimas
      text: Aku nabuh kenong. Pak Marto nabuh kempul.
      ar_eg: أنا على الكينونج، وپاك مارتو على الكيمبول.
      ar: أعزف الكينونغ، وباك مارتو يعزف الكيمبول.
      en: I'm on the kenong. Pak Marto's on the kempul.
    - speaker: Pak Harsono
      text: Mas Mohamed, mirengaken. Dhalang badhe suluk.
      ar_eg: يا ماس محمد، اسمع. الدالانج هيغنّي السولوك.
      ar: يا ماس محمد، استمع. سيغنّي الدالانغ السولوك.
      en: Mas Mohamed, listen. The dhalang is about to sing a suluk.
    - speaker: Mohamed
      text: Wah, swantenipun alus sanget, Pak.
      ar_eg: يا سلام، صوته ناعم أوي يا أستاذ.
      ar: ما أرقّ صوته يا سيدي.
      en: Wow, his voice is so soft, sir.
    - speaker: Pak Harsono
      text: Inggih. Lajeng sabetanipun cepet. Wayangipun kados gesang.
      ar_eg: أيوه. وبعدين حركات العرايس بتبقى سريعة، كأنها عايشة.
      ar: نعم. ثم تصير حركات الدمى سريعة كأنها حيّة.
      en: Yes. Then the puppet moves get fast. The puppets seem alive.
