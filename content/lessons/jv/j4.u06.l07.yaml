language: jv
title: Niyaga lagi gladhen
can_do:
  ar_eg: تتفرّج على بروفة الجاميلان، وتسمّي آلتين كمان، وتفهم الدالانج بيغني إمتى وبيحرّك العرايس إزاي.
  ar: أن تشاهد بروفة الغاميلان، وتسمّي آلتين أخريين، وتفهم متى يغنّي الدالانغ وكيف يحرّك الدمى.
  en: Watch a gamelan rehearsal, name two more instruments, and follow when the dhalang sings and how he moves the puppets.
slides:
  - title: Niyaga, gladhen, suluk
    body:
      ar_eg: |
        - niyaga = عازف الجاميلان (وبيتقال كمان pengrawit).
        - gladhen = بروفة، تمرين قبل العرض.
        - kenong = جونجات كبيرة نايمة على حبال في صندوق، صوتها عالي ورايق.
        - kempul = جونج صغير متعلّق، صوته واطي.
        - suluk = الغُنا اللي الدالانج بيغنّيه عشان يحدّد مزاج المشهد.
        - sabetan = حركات العرايس بإيد الدالانج: الخناقات والمشي والرقص.
      ar: |
        - niyaga = عازف الغاميلان (ويُقال أيضًا pengrawit).
        - gladhen = بروفة، تمرين قبل العرض.
        - kenong = صنوج كبيرة مستلقية على حبال في صندوق، صوتها عالٍ صافٍ.
        - kempul = صنج صغير معلّق، صوته منخفض.
        - suluk = الغناء الذي يؤدّيه الدالانغ ليحدّد جوّ المشهد.
        - sabetan = حركات الدمى بيد الدالانغ: القتال والمشي والرقص.
      en: |
        - niyaga = gamelan player (also pengrawit).
        - gladhen = rehearsal, practice before a show.
        - kenong = large kettle gongs lying on cords in a frame, with a high, clear sound.
        - kempul = a small hanging gong with a low sound.
        - suluk = the dhalang's chanted song that sets a scene's mood.
        - sabetan = the dhalang's puppet movements: fights, walking, dancing.
    examples:
      - text: Niyaga lagi gladhen neng pendhapa.
        ar_eg: العازفين بيعملوا بروفة في البندوبو.
        ar: يتمرّن العازفون في البندوبو.
        en: The gamelan players are rehearsing in the pendhapa.
      - text: Aku nabuh kempul, Mas Dimas nabuh kenong.
        ar_eg: أنا بضرب الكيمبول، وماس ديماس بيضرب الكينونج.
        ar: أعزف الكيمبول، وماس ديماس يعزف الكينونغ.
        en: I play the kempul; Mas Dimas plays the kenong.
      - text: Suluk dhisik, banjur sabetan wayang.
        ar_eg: السولوك الأول، وبعدين حركات العرايس.
        ar: السولوك أوّلًا، ثم حركات الدمى.
        en: First the suluk, then the puppet moves.
