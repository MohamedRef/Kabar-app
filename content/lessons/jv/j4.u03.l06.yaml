schema: kabar.lesson/v1
id: j4.u03.l06
language: jv
title: Abdi dalem ingkang setya
can_do:
  ar_eg: تتكلم عن خدم القصر وألقابهم وإخلاصهم، وتسأل عن تحفة القصر الموروثة.
  ar: أن تتحدث عن خدم القصر وألقابهم ووفائهم، وتسأل عن تحفة القصر الموروثة.
  en: Talk about palace retainers, their titles and loyalty, and ask about a palace heirloom.
slides:
  - title: Ngarsa Dalem lan gelar
    body:
      ar_eg: |
        - Ngarsa Dalem = لقب سلطان يوجيا (حرفيًا «قدّام الحضرة»). الناس بتقول Ngarsa Dalem بدل اسمه.
        - Kanjeng = لقب تشريف عالي (Kanjeng Gusti، Kanjeng Ratu)، pangeran = أمير، وndara = «يا سيدي»: كلمة الخدم القديمة لأهل البيت النبيل.
        - gelar = لقب، رتبة. abdi dalem بياخدوا gelar من القصر.
        - ngabdi = يخدم بإخلاص، setya = وفي ومخلص.
        - pusaka = تحفة موروثة ليها قدسية (keris، رمح، أو جاميلان قديم).
      ar: |
        - Ngarsa Dalem = لقب سلطان يوغيا (حرفيًّا «في حضرة المقام»)، ويقوله الناس بدل اسمه.
        - Kanjeng = لقب تشريف رفيع (Kanjeng Gusti وKanjeng Ratu)، pangeran = أمير، وndara = «يا سيّدي»: كلمة الخدم القديمة لأهل البيت النبيل.
        - gelar = لقب، رتبة. ويتلقّى abdi dalem ألقابًا من القصر.
        - ngabdi = يخدم بإخلاص، setya = وفيّ مخلص.
        - pusaka = تحفة موروثة ذات قداسة (خنجر keris أو رمح أو غاميلان قديم).
      en: |
        - Ngarsa Dalem = the title of Yogya's Sultan (literally "before the presence"). People say Ngarsa Dalem instead of his name.
        - Kanjeng = a high honorific (Kanjeng Gusti, Kanjeng Ratu), pangeran = prince, and ndara = "my lord": the old servants' word for the noble household.
        - gelar = title, rank. Abdi dalem receive titles from the palace.
        - ngabdi = serve devotedly, setya = loyal, faithful.
        - pusaka = sacred heirloom (a keris, a spear, an old gamelan).
    examples:
      - text: Pak Sastro ngabdi dhateng Ngarsa Dalem.
        ar_eg: پاك ساسترو بيخدم السلطان بإخلاص.
        ar: يخدم باك ساسترو السلطان بإخلاص.
        en: Pak Sastro devotedly serves the Sultan.
      - text: Abdi dalem menika setya sanget.
        ar_eg: خدم القصر دول مخلصين أوي.
        ar: خدم القصر هؤلاء أوفياء جدًّا.
        en: These retainers are very loyal.
      - text: Pusaka menika kagunganipun Kanjeng Pangeran.
        ar_eg: التحفة دي ملك سمو الأمير.
        ar: هذه التحفة ملك سموّ الأمير.
        en: This heirloom belongs to His Highness the Prince.
