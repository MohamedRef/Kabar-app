  - id: e10
    type: multiple_choice
    question: 'Abdi dalem ingkang sepuh matur: «Inggih, ___.»'
    question_meaning:
      ar_eg: 'الخادم العجوز قال: «حاضر يا ___».'
      ar: 'قال الخادم المسنّ: «نعم يا ___».'
      en: 'The old retainer said: ''Yes, ___.'''
    options: [pusaka, Ngarsa Dalem, ndara]
    answer: 2
    explain:
      ar_eg: ndara = يا سيدي، كلمة الخدم القديمة. Ngarsa Dalem لقب السلطان نفسه.
      ar: ndara = يا سيّدي، كلمة الخدم القديمة، أما Ngarsa Dalem فلقب السلطان نفسه.
      en: ndara = my lord, the old servants' word. Ngarsa Dalem is the Sultan's own title.
    words: [ndara, Ngarsa Dalem, pusaka]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak Sastro, sampun dangu ngabdi dhateng Kraton?
      ar_eg: يا پاك ساسترو، حضرتك بقالك كتير بتخدم القصر؟
      ar: يا باك ساسترو، هل تخدم القصر منذ زمن؟
      en: Pak Sastro, have you served the Kraton for long?
    - speaker: Pak Sastro
      text: Sampun tigang dasa taun, Nak.
      ar_eg: تلاتين سنة يا ابني.
      ar: منذ ثلاثين سنة يا بنيّ.
      en: Thirty years now, son.
    - speaker: Mohamed
      text: Panjenengan angsal gelar saking Ngarsa Dalem?
      ar_eg: حضرتك أخدت لقب من السلطان؟
      ar: هل نلتَ لقبًا من السلطان؟
      en: Did you receive a title from the Sultan?
    - speaker: Pak Sastro
      text: Inggih, Nak. Kula remen sanget.
      ar_eg: أيوه يا ابني. وأنا مبسوط بيه أوي.
      ar: نعم يا بنيّ، وأنا سعيد به جدًّا.
      en: Yes, son. I'm very happy with it.
    - speaker: Mohamed
      text: Menika pusaka Kraton, Pak?
      ar_eg: دي تحفة القصر الموروثة يا أستاذ؟
      ar: أهذه تحفة القصر الموروثة يا سيدي؟
      en: Is that a palace heirloom, sir?
    - speaker: Pak Sastro
      text: Inggih. Pusaka menika kagunganipun Kanjeng Pangeran.
      ar_eg: أيوه. التحفة دي ملك سمو الأمير.
      ar: نعم. هذه التحفة ملك سموّ الأمير.
      en: Yes. This heirloom belongs to His Highness the Prince.
