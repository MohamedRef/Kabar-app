schema: kabar.lesson/v1
id: j4.u03.l06
language: jv
title: Pak Sastro, abdi dalem
can_do:
  ar_eg: تفهم خادم في القصر بيتكلم عن شغله بأفعال التواضع.
  ar: أن تفهم خادمًا في القصر يتحدث عن عمله بأفعال التواضع.
  en: Follow a palace servant talking about his work with humble verbs.
slides:
  - title: Sultan dhawuh, kula matur
    body:
      ar_eg: |
        Pak Sastro بيحكي لشوية زوّار عن شغله في الـ Kraton. اسمع الأول.
        عن السلطان: krama inggil (dhawuh، kersa، tindak). عن نفسه: krama andhap (sowan، matur، ndherek). saben = كل (بالإندونيسي setiap)، وtaun = سنة.
      ar: |
        يحدّث Pak Sastro بعض الزوّار عن عمله في الـ Kraton. استمع أولًا.
        عن السلطان: krama inggil (dhawuh، kersa، tindak)، وعن نفسه: krama andhap (sowan، matur، ndherek). saben = كل (بالإندونيسية setiap)، وtaun = سنة.
      en: |
        Pak Sastro tells some visitors about his work at the Kraton. Listen first.
        About the Sultan: krama inggil (dhawuh, kersa, tindak). About himself: krama andhap (sowan, matur, ndherek). saben = every (Indonesian setiap), taun = year.
    grammar: jv.krama-andhap
    examples:
      - text: Kula abdi dalem Kraton sampun kalih dasa taun.
        ar_eg: أنا خادم في القصر بقالي عشرين سنة.
        ar: أنا من خَدَم القصر منذ عشرين عامًا.
        en: I've been an abdi dalem at the Kraton for twenty years.
      - text: Saben enjing kula sowan dhateng Kraton.
        ar_eg: كل يوم الصبح بروح القصر (بتواضع).
        ar: كل صباح أمثُل في القصر.
        en: Every morning I present myself at the Kraton.
      - text: Sultan kersa tindak, abdi dalem ndherek.
        ar_eg: لما السلطان يحب يخرج، الخدّام بيروحوا معاه.
        ar: إذا شاء السلطان الخروج رافقه الخَدَم.
        en: When the Sultan wishes to go out, the abdi dalem go with him.
exercises:
  - id: e01
    type: listen
    text: Kula abdi dalem Kraton sampun kalih dasa taun.
    question:
      ar_eg: Pak Sastro بقاله قد إيه خادم في القصر؟
      ar: منذ متى يعمل Pak Sastro خادمًا في القصر؟
      en: How long has Pak Sastro been an abdi dalem?
    options: [sedasa taun, kalih dasa taun, tiga dasa taun]
    answer: 1
    meaning:
      ar_eg: أنا خادم في القصر بقالي عشرين سنة.
      ar: أنا من خَدَم القصر منذ عشرين عامًا.
      en: I've been an abdi dalem at the Kraton for twenty years.
    words: [abdi dalem]
  - id: e02
    type: listen
    text: Saben enjing kula sowan dhateng Kraton.
    question:
      ar_eg: Pak Sastro بيعمل إيه كل يوم الصبح؟
      ar: ماذا يفعل Pak Sastro كل صباح؟
      en: What does Pak Sastro do every morning?
    options: [sowan dhateng Kraton, kesah dhateng peken, nyuwun pamit]
    answer: 0
    meaning:
      ar_eg: كل يوم الصبح بروح القصر (بتواضع).
      ar: كل صباح أمثُل في القصر.
      en: Every morning I present myself at the Kraton.
    words: [sowan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: في الجملة «Sultan kersa tindak, abdi dalem ndherek»، مين اللي بيروح مع التاني؟
      ar: في جملة «Sultan kersa tindak, abdi dalem ndherek»، من الذي يرافق الآخر؟
      en: In "Sultan kersa tindak, abdi dalem ndherek", who goes along with whom?
    options: [Sultan, abdi dalem, Pak Harsono]
    answer: 1
    explain:
      ar_eg: ndherek فعل تواضع، يعني الخدّام هم اللي بيروحوا مع السلطان.
      ar: ndherek فعل تواضع، فالخَدَم هم من يرافقون السلطان.
      en: ndherek is a humble verb, so it's the abdi dalem who go with the Sultan.
    words: [ndherek]
  - id: e04
    type: match_pairs
    pairs:
      - text: sowan
        ar_eg: يزور / يروح لحد كبير (تواضع)
        ar: يزور كبيرًا (تواضع)
        en: call on, present yourself (humble)
      - text: matur
        ar_eg: يكلّم حد كبير (تواضع)
        ar: يخاطب كبيرًا (تواضع)
        en: speak to an elder (humble)
      - text: dhawuh
        ar_eg: يقول / يأمر (للكبير)
        ar: يقول / يأمر (للكبير)
        en: say, instruct (of an elder)
      - text: ndherek
        ar_eg: يروح مع حد كبير
        ar: يرافق كبيرًا
        en: go along with an elder
      - text: saben
        ar_eg: كل (كل يوم، كل صبح)
        ar: كل (كل يوم، كل صباح)
        en: every
    words: [sowan, matur, dhawuh, ndherek]
  - id: e05
    type: dictation
    text: Saben enjing kula sowan dhateng Kraton.
    meaning:
      ar_eg: كل يوم الصبح بروح القصر (بتواضع).
      ar: كل صباح أمثُل في القصر.
      en: Every morning I present myself at the Kraton.
    words: [sowan]
  - id: e06
    type: fill_blank
    sentence: Sultan kersa tindak, abdi dalem ___.
    meaning:
      ar_eg: لما السلطان يحب يخرج، الخدّام بيروحوا معاه.
      ar: إذا شاء السلطان الخروج رافقه الخَدَم.
      en: When the Sultan wishes to go out, the abdi dalem go with him.
    options: [ndherek, rawuh, tindak]
    answers: [ndherek]
    explain:
      ar_eg: الخدّام بيروحوا مع الكبير، يبقى ndherek. tindak وrawuh للسلطان.
      ar: الخَدَم يرافقون الكبير فتقول ndherek، وtindak وrawuh للسلطان.
      en: The servants go along with the elder, so ndherek. tindak and rawuh are for the Sultan.
    words: [ndherek]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: كل يوم الصبح بزور تيتة.
      ar: أزور الجدة كل صباح.
      en: Every morning I call on Grandma.
    answers:
      - Saben enjing kula sowan Simbah.
      - Saben enjing kula sowan dhateng Simbah.
      - Saben enjing kula sowan dhateng dalemipun Simbah.
      - Kula sowan Simbah saben enjing.
    explain:
      ar_eg: إنت اللي بتزور الكبيرة، يبقى sowan.
      ar: أنت من يزور الكبيرة فتقول sowan.
      en: You're visiting an elder, so sowan.
    words: [sowan]
  - id: e08
    type: speaking
    text: Kula abdi dalem Kraton sampun kalih dasa taun.
    meaning:
      ar_eg: أنا خادم في القصر بقالي عشرين سنة.
      ar: أنا من خَدَم القصر منذ عشرين عامًا.
      en: I've been an abdi dalem at the Kraton for twenty years.
    words: [abdi dalem]
dialogue:
  title: Kaliyan Pak Sastro
  lines:
    - speaker: Mohamed
      text: Nyuwun pirsa, Pak, saben enjing panjenengan sowan dhateng Kraton?
      ar_eg: بعد إذنك يا أستاذ، حضرتك بتروح القصر كل يوم الصبح؟
      ar: عذرًا يا سيدي، هل تمثُل في القصر كل صباح؟
      en: May I ask, sir, do you go to the Kraton every morning?
    - speaker: Pak Sastro
      text: Inggih, Mas. Sampun kalih dasa taun.
      ar_eg: أيوه يا ابني. بقالي عشرين سنة.
      ar: نعم يا بني، منذ عشرين عامًا.
      en: Yes. For twenty years now.
    - speaker: Mohamed
      text: Wah, dangu sanget, Pak!
      ar_eg: ياه، مدة طويلة أوي يا أستاذ!
      ar: يا لها من مدة طويلة يا سيدي!
      en: Wow, that's a long time, sir!
    - speaker: Pak Sastro
      text: Inggih, Mas. Kula remen wonten Kraton.
      ar_eg: أيوه يا ابني. أنا بحب القعدة في القصر.
      ar: نعم يا بني. أحبّ العمل في القصر.
      en: Yes. I love being at the Kraton.
    - speaker: Mohamed
      text: Matur nuwun, Pak. Kula nyuwun pamit rumiyin.
      ar_eg: شكرًا يا أستاذ. أستأذن أنا بقى.
      ar: شكرًا يا سيدي. أستأذن في الانصراف.
      en: Thank you, sir. Please excuse me, I'll be going.
    - speaker: Pak Sastro
      text: Inggih, Mas. Sugeng tindak.
      ar_eg: ماشي يا ابني. مع السلامة.
      ar: حسنًا يا بني. في أمان الله.
      en: All right. Safe journey.
