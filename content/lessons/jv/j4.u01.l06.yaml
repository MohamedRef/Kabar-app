schema: kabar.lesson/v1
id: j4.u01.l06
language: jv
title: Pesen saking Bu Harsono
can_do:
  ar_eg: تقرا رسالة واتساب بالكراما وتفهم مين بيعمل إيه.
  ar: أن تقرأ رسالة واتساب بالكراما وتفهم من يفعل ماذا.
  en: Read a krama WhatsApp message and follow who is doing what.
slides:
  - title: Pesen WA
    body:
      ar_eg: |
        صحيت متأخر في بيت Pak Harsono، ولقيت رسالة من Bu Harsono على الواتساب (pesen = رسالة).
        اقراها وخد بالك: الأستاذ وتيتة بياخدوا krama inggil (tindak، sare، kondur)، لكن Bu Harsono وهي بتتكلم عن نفسها بتقول wangsul، مش kondur.
      ar: |
        استيقظتَ متأخرًا في بيت Pak Harsono، فوجدتَ رسالة واتساب من Bu Harsono (pesen = رسالة).
        اقرأها ولاحظ: الأستاذ والجدة يُذكَران بالـ krama inggil (tindak، sare، kondur)، أما Bu Harsono فتقول عن نفسها wangsul لا kondur.
      en: |
        You woke up late at Pak Harsono's house and found a WhatsApp message from Bu Harsono (pesen = message).
        Read it and notice: Father and Grandma get krama inggil (tindak, sare, kondur), but when Bu Harsono talks about herself she says wangsul, not kondur.
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Mas Mohamed, Bapak sampun tindak dhateng peken.
        ar_eg: يا محمد، الأستاذ راح السوق.
        ar: يا محمد، ذهب الأستاذ إلى السوق.
        en: Mohamed, Father has gone to the market.
      - text: Simbah saweg sare. Bapak kondur jam gangsal.
        ar_eg: تيتة نايمة. والأستاذ راجع الساعة خمسة.
        ar: الجدة نائمة. ويعود الأستاذ في الساعة الخامسة.
        en: Grandma is asleep. Father will be home at five.
      - text: Kula wangsul sonten. Mangga dhahar rumiyin, Mas.
        ar_eg: أنا راجعة العصر. اتفضل كُل الأول يا محمد.
        ar: سأعود في المساء. تفضّل بالأكل أولًا يا محمد.
        en: I'll be back this afternoon. Please eat first, Mohamed.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب الرسالة، Pak Harsono فين دلوقتي؟
      ar: بحسب الرسالة، أين Pak Harsono الآن؟
      en: According to the message, where is Pak Harsono now?
    options: [Tugu, peken, Malioboro]
    answer: 1
    explain:
      ar_eg: «Bapak sampun tindak dhateng peken» = الأستاذ راح السوق (peken).
      ar: «Bapak sampun tindak dhateng peken» = ذهب الأستاذ إلى السوق (peken).
      en: '"Bapak sampun tindak dhateng peken" = Father has gone to the market (peken).'
    words: [tindak]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي نايم؟
      ar: من النائم؟
      en: Who is asleep?
    options: [Simbah, Bapak, Bu Harsono]
    answer: 0
    explain:
      ar_eg: «Simbah saweg sare» = تيتة نايمة. sare هي krama inggil للنوم.
      ar: «Simbah saweg sare» = الجدة نائمة، وsare هي krama inggil للنوم.
      en: '"Simbah saweg sare" = Grandma is asleep. sare is krama inggil for sleep.'
    words: [sare]
  - id: e03
    type: listen
    text: Simbah saweg sare. Bapak kondur jam gangsal.
    question:
      ar_eg: الأستاذ راجع البيت إمتى؟
      ar: متى يعود الأستاذ إلى البيت؟
      en: When will Father be home?
    options: [jam kalih, jam tiga, jam gangsal]
    answer: 2
    meaning:
      ar_eg: تيتة نايمة. والأستاذ راجع الساعة خمسة.
      ar: الجدة نائمة. ويعود الأستاذ في الساعة الخامسة.
      en: Grandma is asleep. Father will be home at five.
    words: [kondur, sare]
  - id: e04
    type: match_pairs
    pairs:
      - text: tindak
        ar_eg: يروح (krama inggil، للكبير)
        ar: يذهب (krama inggil، للكبير)
        en: go (krama inggil, for the elder)
      - text: sare
        ar_eg: ينام (krama inggil، للكبير)
        ar: ينام (krama inggil، للكبير)
        en: sleep (krama inggil, for the elder)
      - text: kondur
        ar_eg: يرجع البيت (krama inggil، للكبير)
        ar: يعود إلى البيت (krama inggil، للكبير)
        en: go home (krama inggil, for the elder)
      - text: wangsul
        ar_eg: يرجع البيت (كراما، عن نفسك)
        ar: يعود إلى البيت (كراما، عن النفس)
        en: go home (krama, about yourself)
    words: [tindak, sare, kondur, wangsul]
  - id: e05
    type: fill_blank
    sentence: Kula ___ sonten. Mangga dhahar rumiyin, Mas.
    meaning:
      ar_eg: أنا راجعة العصر. اتفضل كُل الأول يا محمد.
      ar: سأعود في المساء. تفضّل بالأكل أولًا يا محمد.
      en: I'll be back this afternoon. Please eat first, Mohamed.
    options: [kondur, wangsul, tindak]
    answers: [wangsul]
    explain:
      ar_eg: Bu Harsono بتتكلم عن نفسها، يبقى wangsul (كراما عادية). kondur تكريم للتاني بس، حتى من الكبير نفسه.
      ar: تتحدث Bu Harsono عن نفسها فتقول wangsul، أما kondur فتكريم للآخر فقط، حتى على لسان الكبير.
      en: Bu Harsono is talking about herself, so wangsul (plain krama). kondur only honours others, even when an elder speaks.
    words: [wangsul, kondur]
  - id: e06
    type: dictation
    text: Mangga dhahar rumiyin, Mas.
    meaning:
      ar_eg: اتفضل كُل الأول يا محمد.
      ar: تفضّل بالأكل أولًا يا محمد.
      en: Please eat first, Mohamed.
    words: [dhahar]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (ردك على Bu Harsono) شكرًا يا هانم. هاكل الأول.
      ar: (ردّك على Bu Harsono) شكرًا يا سيدتي. سآكل أولًا.
      en: (your reply to Bu Harsono) Thank you, ma'am. I'll eat first.
    answer: Matur nuwun, Bu. Kula badhe nedha rumiyin.
    distractors: [dhahar, kondur]
    explain:
      ar_eg: إنت اللي هتاكل، يبقى nedha مش dhahar.
      ar: أنت الآكل، فتقول nedha لا dhahar.
      en: You're the one eating, so nedha, not dhahar.
    words: [nedha]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (ردك على Bu Harsono) حاضر يا هانم. تيتة لسه نايمة.
      ar: (ردّك على Bu Harsono) حسنًا يا سيدتي. ما زالت الجدة نائمة.
      en: (your reply to Bu Harsono) Yes, ma'am. Grandma is still asleep.
    answers:
      - Inggih, Bu. Simbah taksih sare.
      - Inggih, Bu. Simbah saweg sare.
      - Inggih, Bu. Mbah Putri taksih sare.
      - Inggih, Bu. Mbah Putri saweg sare.
    explain:
      ar_eg: taksih = لسه، وsare لأن النوم نوم تيتة.
      ar: taksih = ما زال، وsare لأن النائم هي الجدة.
      en: taksih = still, and sare because it's Grandma who's sleeping.
    words: [sare]
dialogue:
  title: Simbah lan Mohamed
  lines:
    - speaker: Mohamed
      text: Sugeng siang, Mbah.
      ar_eg: نهارك سعيد يا تيتة.
      ar: طاب نهارك يا جدتي.
      en: Good afternoon, Grandma.
    - speaker: Mbah Putri
      text: Sugeng siang, Mas. Mas Mohamed sampun nedha?
      ar_eg: نهارك سعيد يا ابني. أكلت يا محمد؟
      ar: طاب نهارك يا بني. هل أكلتَ يا محمد؟
      en: Good afternoon. Have you eaten, Mohamed?
    - speaker: Mohamed
      text: Dereng, Mbah. Panjenengan sampun dhahar?
      ar_eg: لسه يا تيتة. وحضرتك أكلتي؟
      ar: ليس بعد يا جدتي. وهل تفضّلتِ بالأكل؟
      en: Not yet, Grandma. Have you eaten?
    - speaker: Mbah Putri
      text: Dereng, Mas.
      ar_eg: لسه يا ابني.
      ar: ليس بعد يا بني.
      en: Not yet.
    - speaker: Mohamed
      text: Mangga dhahar rumiyin, Mbah. Pak Harsono kondur jam gangsal.
      ar_eg: اتفضلي كُلي الأول يا تيتة. Pak Harsono راجع الساعة خمسة.
      ar: تفضّلي بالأكل أولًا يا جدتي. سيعود Pak Harsono في الخامسة.
      en: Please eat first, Grandma. Pak Harsono will be home at five.
