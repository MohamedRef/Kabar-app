    question:
      ar_eg: پاك هارسونو جاي بإيه؟
      ar: بمَ يأتي باك هارسونو؟
      en: How is Pak Harsono travelling?
    options: [راكب حنطور, راكب دوكار, واقف قدام البيت]
    answer: 0
    meaning:
      ar_eg: پاك هارسونو راكب حنطور.
      ar: باك هارسونو يركب عربة خيل.
      en: Pak Harsono is riding a horse carriage.
    words: [nitih, andhong]
  - id: e04
    type: fill_blank
    sentence: Simbah rawuh. Ayo ___, Mas!
    meaning:
      ar_eg: تيتة وصلت. يلا ___ يا ماس!
      ar: وصلت الجدّة. هيّا ___ يا ماس!
      en: Grandma's here. Let's ___, Mas!
    options: [ngadeg, jumeneng, nitih]
    answers: [ngadeg]
    words: [ngadeg, jumeneng, nitih]
  - id: e05
    type: multiple_choice
    question: Pak Harsono ___ lajeng tindak.
    question_meaning:
      ar_eg: پاك هارسونو ___ وبعدين مشي.
      ar: باك هارسونو ___ ثم مضى.
      en: Pak Harsono ___ and then left.
    options: [ngadeg, jumeneng, kepengin]
    answer: 1
    explain:
      ar_eg: 'للكبير: jumeneng. ngadeg لنفسك وللناس العادية.'
      ar: 'للكبير: jumeneng، وngadeg لك ولسائر الناس.'
      en: 'For the elder: jumeneng. ngadeg is for you and everyone else.'
    words: [jumeneng, ngadeg, kepengin]
  - id: e06
