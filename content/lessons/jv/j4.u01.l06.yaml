dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, ayo ngadeg! Pak Harsono rawuh.
      ar_eg: يا محمد، قوم اقف! پاك هارسونو وصل.
      ar: يا محمد، قف! وصل باك هارسونو.
      en: Mohamed, stand up! Pak Harsono's here.
    - speaker: Mohamed
      text: Pak Harsono nitih apa, Mas?
      ar_eg: پاك هارسونو جاي راكب إيه يا ماس؟
      ar: بمَ جاء باك هارسونو يا ماس؟
      en: What's Pak Harsono riding, Mas?
    - speaker: Mas Dimas
      text: Nitih andhong saka Malioboro.
      ar_eg: راكب حنطور من ماليوبورو.
      ar: يركب عربة خيل من ماليوبورو.
      en: A horse carriage from Malioboro.
    - speaker: Pak Harsono
      text: Lenggah kemawon, Nak.
      ar_eg: اقعد يا ابني، اقعد.
      ar: اجلس يا بنيّ.
      en: Please sit, son.
    - speaker: Mohamed
      text: Matur nuwun, Pak. Kula kepengin numpak andhong ugi.
      ar_eg: شكرًا يا أستاذ. وأنا كمان نفسي أركب حنطور.
      ar: شكرًا يا سيدي. وأنا أيضًا أرغب في ركوب عربة الخيل.
      en: Thank you, sir. I'd love to ride an andhong too.
    - speaker: Pak Harsono
      text: Mangga, benjang numpak kaliyan Dimas.
      ar_eg: اتفضل، بكرة اركب مع ديماس.
      ar: تفضّل، اركبها غدًا مع ديماس.
      en: Go ahead, ride one with Dimas tomorrow.
