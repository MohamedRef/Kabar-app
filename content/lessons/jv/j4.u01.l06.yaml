schema: kabar.lesson/v1
id: j4.u01.l06
language: jv
title: Jumeneng, Mas!
can_do:
  ar_eg: تقف لما الكبير يوصل، وتقول بيركب إيه، وتفهم لما يطلب منك حاجة.
  ar: أن تقف حين يصل الكبير، وتقول ماذا يركب، وتفهم حين يطلب منك شيئًا.
  en: Stand when an elder arrives, say how they're travelling, and follow what they ask you to do.
slides:
  - title: Ngadeg → jumeneng, numpak → nitih
    body:
      ar_eg: |
        - ngadeg = يقف (نغوكو وكراما) ← jumeneng (krama inggil). لما حد كبير يدخل، الكل بيقف: «Simbah jumeneng, kula inggih ngadeg.»
        - يركب: numpak ← nitih (krama inggil). titihan = عربيته/مركبته (krama inggil).
        - andhong = حنطور يوجيا، dhokar = عربية حصان صغيرة بعجلتين.
        - kepengin = نفسي في، عايز (نغوكو)؛ للكبير ngersakaken.
        - ndhawuhi = يطلب من حد يعمل حاجة، يأمر (krama inggil لـ kon): «Bapak ndhawuhi kula ngadeg.»
      ar: |
        - ngadeg = يقف (نغوكو وكراما) ← jumeneng (krama inggil). وحين يدخل الكبير يقف الجميع: «Simbah jumeneng, kula inggih ngadeg.»
        - يركب: numpak ← nitih (krama inggil). titihan = مركبته (krama inggil).
        - andhong = عربة الخيل في يوغيا، dhokar = عربة حصان صغيرة بعجلتين.
        - kepengin = يشتهي، يريد (نغوكو)؛ وللكبير ngersakaken.
        - ndhawuhi = يأمر، يطلب من أحد أن يفعل (krama inggil لـ kon): «Bapak ndhawuhi kula ngadeg.»
      en: |
        - ngadeg = stand (ngoko and krama) → jumeneng (krama inggil). When an elder comes in, everyone stands: "Simbah jumeneng, kula inggih ngadeg."
        - ride: numpak → nitih (krama inggil). titihan = their vehicle, ride (krama inggil).
        - andhong = Yogya's horse carriage, dhokar = small two-wheeled horse cart.
        - kepengin = feel like, want (ngoko); for the elder, ngersakaken.
        - ndhawuhi = tell someone to do something (krama inggil for kon): "Bapak ndhawuhi kula ngadeg."
    examples:
      - text: Bapak nitih andhong dhateng Malioboro.
        ar_eg: الأستاذ راكب حنطور لماليوبورو.
        ar: يركب الوالد عربة الخيل إلى ماليوبورو.
        en: Father is riding a horse carriage to Malioboro.
      - text: Aku kepengin numpak dhokar.
        ar_eg: نفسي أركب دوكار.
        ar: أرغب في ركوب الدوكار.
        en: I'd love to ride a dhokar.
      - text: Simbah jumeneng, kula inggih ngadeg.
        ar_eg: تيتة وقفت، فأنا كمان وقفت.
        ar: وقفت الجدّة فوقفتُ أنا أيضًا.
        en: Grandma stood up, so I stood up too.
