schema: kabar.lesson/v1
id: j3.u02.l06
language: jv
title: Ngobrol karo simbah
can_do:
  ar_eg: تدردش مع جدة صاحبك.
  ar: أن تتحدث مع جدة صديقك.
  en: Talk to a friend's grandmother.
slides:
  - title: Sowan Mbah Putri
    body:
      ar_eg: |
        Mas Dimas واخدك تزور جدته في بيتها جنب Pasar Kranggan. افتكر:
        - إنت عن نفسك: kula، nami kula، kula sampun nedha.
        - هي: panjenengan، panjenengan sampun dhahar?
        - لو نادتك: «Dalem, Mbah?»
        - وأحلى كلمة: «Inggih» (أيوه) و«Matur nuwun».
        وهي ممكن تكلمك بالكراما (إنت ضيف) وتكلم حفيدها Dimas بالـ ngoko. عادي جدًا!
      ar: |
        يصطحبك Mas Dimas لزيارة جدته في بيتها قرب Pasar Kranggan. تذكّر:
        - عن نفسك: kula، nami kula، kula sampun nedha.
        - عنها: panjenengan، panjenengan sampun dhahar?
        - إذا نادتك: «Dalem, Mbah?»
        - وأجمل الكلمات: «Inggih» (نعم) و«Matur nuwun».
        وقد تكلمك بالكراما لأنك ضيف، وتكلم حفيدها Dimas بالـ ngoko، وهذا طبيعي.
      en: |
        Mas Dimas takes you to visit his grandmother at her house near Pasar Kranggan. Remember:
        - About yourself: kula, nami kula, kula sampun nedha.
        - About her: panjenengan, panjenengan sampun dhahar?
        - If she calls you: "Dalem, Mbah?"
        - Best words of all: "Inggih" (yes) and "Matur nuwun".
        She may speak krama to you (you're a guest) and ngoko to her grandson Dimas. That's perfectly normal!
    grammar: jv.pronoun.krama
exercises:
  - id: e01
    type: listen
    text: Sugeng rawuh, Mas.
    options: ['Sugeng rawuh, Mas.', 'Matur nuwun, Mas.', 'Sugeng enjing, Mas.']
    answer: 0
    words: [sugeng rawuh]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: Mbah Putri بتناديك من المطبخ «Mas Mohamed!». ترد تقول إيه؟
      ar: نادتك Mbah Putri من المطبخ «Mas Mohamed!». بمَ تجيب؟
      en: Mbah Putri calls from the kitchen, "Mas Mohamed!". What do you answer?
    options: ['Dalem, Mbah?', 'Kowe, Mbah?', 'Apa, Mbah?']
    answer: 0
    explain:
      ar_eg: «Dalem?» = «أفندم؟». ده الرد المؤدب لما حد كبير يناديك.
      ar: «Dalem?» = «أفندم؟»، وهو الجواب المهذب لنداء الكبير.
      en: '"Dalem?" = «أفندم؟» — the polite reply when an elder calls you.'
    words: [dalem]
  - id: e03
    type: build_sentence
    source:
      ar_eg: اسمي محمد يا تيتة.
      ar: اسمي محمد يا جدتي.
      en: My name is Mohamed, Grandma.
    answer: Nami kula Mohamed, Mbah.
    alternatives: ['Mbah, nami kula Mohamed.']
    distractors: [asma, aku]
    words: [nami, kula]
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا من مصر يا تيتة.
      ar: أنا من مصر يا جدتي.
      en: I'm from Egypt, Grandma.
    answers: ['Kula saking Mesir, Mbah.', 'Kulo saking Mesir, Mbah.', 'Kula saking Mesir, Mbah', 'Kulo saking Mesir, Mbah', 'Mbah, kula saking Mesir.', 'Mbah, kulo saking Mesir.', 'Mbah, kula saking Mesir', 'Mbah, kulo saking Mesir']
    words: [kula, saking]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: حضرتك أكلتي يا تيتة؟
      ar: هل تفضلتِ بالأكل يا جدتي؟
      en: Have you eaten, Grandma?
    answers: ['Panjenengan sampun dhahar, Mbah?', 'Panjenengan sampun dhahar, Mbah', 'Mbah, panjenengan sampun dhahar?', 'Mbah, panjenengan sampun dhahar', 'Sampun dhahar, Mbah?', 'Sampun dhahar, Mbah']
    explain:
      ar_eg: 'للجدة: panjenengan + dhahar. ولو شلت panjenengan ونديتها Mbah برضه مؤدب.'
      ar: للجدة panjenengan مع dhahar، ويصح حذف panjenengan مع النداء بـ Mbah.
      en: For Grandma, panjenengan + dhahar; dropping panjenengan and just saying Mbah is polite too.
    words: [panjenengan, sampun, dhahar]
  - id: e06
    type: fill_blank
    sentence: Matur nuwun, Mbah. Panjenengan sampun ___?
    meaning:
      ar_eg: شكرًا يا تيتة. حضرتك أكلتي؟
      ar: شكرًا يا جدتي. هل تفضلتِ بالأكل؟
      en: Thank you, Grandma. Have you eaten?
    answers: [dhahar]
    explain:
      ar_eg: 'عن الجدة: dhahar (krama inggil).'
      ar: 'عن الجدة: dhahar (krama inggil).'
      en: About Grandma — dhahar (krama inggil).
    words: [dhahar]
  - id: e07
    type: fill_blank
    sentence: ___ sinau krama, Mbah.
    meaning:
      ar_eg: أنا بتعلم كراما يا تيتة.
      ar: أنا أتعلم الكراما يا جدتي.
      en: I'm learning krama, Grandma.
    options: [Panjenengan, Kula, Aku]
    answers: [Kula]
    explain:
      ar_eg: قدام الجدة «أنا» = kula. aku ngoko.
      ar: أمام الجدة تكون «أنا» kula، وaku من الـ ngoko.
      en: In front of Grandma "I" is kula; aku is ngoko.
    words: [kula, sinau]
  - id: e08
    type: dictation
    text: Matur nuwun, Mbah.
    meaning:
      ar_eg: شكرًا يا تيتة.
      ar: شكرًا يا جدتي.
      en: Thank you, Grandma.
    words: [matur nuwun]
  - id: e09
    type: speaking
    text: Inggih, Mbah. Kula sampun nedha.
    meaning:
      ar_eg: أيوه يا تيتة. أنا كلت.
      ar: نعم يا جدتي. قد أكلتُ.
      en: Yes, Grandma. I've eaten.
    words: [inggih, kula, nedha]
  - id: e10
    type: speaking
    text: Nami kula Mohamed, saking Kairo.
    meaning:
      ar_eg: اسمي محمد، من القاهرة.
      ar: اسمي محمد، من القاهرة.
      en: My name is Mohamed, from Cairo.
    words: [nami, kula, saking]
dialogue:
  title: Sowan Mbah Putri
  lines:
    - speaker: Mas Dimas
      text: Mbah, menika Mohamed, saking Mesir.
      ar_eg: يا تيتة، ده محمد، من مصر.
      ar: يا جدتي، هذا محمد، من مصر.
      en: Grandma, this is Mohamed, from Egypt.
    - speaker: Mbah Putri
      text: Oh, Mas Mohamed. Sugeng rawuh.
      ar_eg: أهلًا يا ابني محمد. نوّرت.
      ar: أهلًا يا محمد. مرحبًا بك.
      en: Oh, Mohamed. Welcome.
    - speaker: Mohamed
      text: Matur nuwun, Mbah. Nami kula Mohamed.
      ar_eg: شكرًا يا تيتة. اسمي محمد.
      ar: شكرًا يا جدتي. اسمي محمد.
      en: Thank you, Grandma. My name is Mohamed.
    - speaker: Mbah Putri
      text: Mas Mohamed sampun nedha?
      ar_eg: كلت يا محمد؟
      ar: هل أكلت يا محمد؟
      en: Have you eaten, Mohamed?
    - speaker: Mohamed
      text: Dereng, Mbah.
      ar_eg: لسه يا تيتة.
      ar: ليس بعد يا جدتي.
      en: Not yet, Grandma.
    - speaker: Mbah Putri
      text: "Mangga, Mas, mangga."
      ar_eg: "اتفضل يا ابني، اتفضل."
      ar: "تفضّل يا بنيّ، تفضّل."
      en: "Come on, help yourself."
