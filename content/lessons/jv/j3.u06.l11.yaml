schema: kabar.lesson/v1
id: j3.u06.l11
language: jv
title: Ulangan J3.6
can_do:
  ar_eg: تحوّل فقرة نغوكو لكراما.
  ar: أن تحوّل فقرة من النغوكو إلى الكراما.
  en: Convert a ngoko paragraph to krama.
slides:
  - title: Saking ngoko dhateng krama
    body:
      ar_eg: |
        عشان تحوّل فقرة نغوكو لكراما، امشي على ٣ خطوات:
        ١. الكلمات: aku → kula، saka → saking، arep → badhe، tuku → tumbas، omah → griya، rega → regi، larang → awis، gawe → damel، suwe → dangu، merga → amargi.
        ٢. اللواحق: -e / -ne → -ipun / -nipun، di- → dipun-، -ake → -aken، tak- → kula + الفعل.
        ٣. راجع: مافيش ولا كلمة نغوكو فاضلة؟
        Aku arep tuku batik. → Kula badhe tumbas batik.
        Batike digawe neng Giriloyo. → Batikipun dipundamel wonten Giriloyo.
      ar: |
        لتحويل فقرة من النغوكو إلى الكراما اتبع ثلاث خطوات:
        ١. المفردات: aku → kula، saka → saking، arep → badhe، tuku → tumbas، omah → griya، rega → regi، larang → awis، gawe → damel، suwe → dangu، merga → amargi.
        ٢. اللواحق: -e / -ne → -ipun / -nipun، وdi- → dipun-، و-ake → -aken، وtak- → kula + الفعل.
        ٣. المراجعة: ألم تبقَ كلمة من النغوكو؟
        Aku arep tuku batik. → Kula badhe tumbas batik.
        Batike digawe neng Giriloyo. → Batikipun dipundamel wonten Giriloyo.
      en: |
        To turn a ngoko paragraph into krama, go in three steps:
        1. Words: aku → kula, saka → saking, arep → badhe, tuku → tumbas, omah → griya, rega → regi, larang → awis, gawe → damel, suwe → dangu, merga → amargi.
        2. Affixes: -e / -ne → -ipun / -nipun, di- → dipun-, -ake → -aken, tak- → kula + verb.
        3. Check: is any ngoko word left?
        Aku arep tuku batik. → Kula badhe tumbas batik.
        Batike digawe neng Giriloyo. → Batikipun dipundamel wonten Giriloyo.
    grammar: jv.krama.affixes
exercises:
