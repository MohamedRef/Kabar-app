    type: match_pairs
    pairs:
      - text: dipundamel
        ar_eg: اتعمل (digawe)
        ar: صُنع (digawe)
        en: was made (digawe)
      - text: dipunwaos
        ar_eg: اتقرا (diwaca)
        ar: قُرئ (diwaca)
        en: was read (diwaca)
      - text: tumbasaken
        ar_eg: يشتري لحد (tukokake)
        ar: يشتري لغيره (tukokake)
        en: buy for someone (tukokake)
      - text: reginipun
        ar_eg: السعر (regane)
        ar: السعر (regane)
        en: the price (regane)
    words: [damel, waos, tumbasaken, regi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: kabar + -e بالكراما = ؟
      ar: kabar + -e بالكراما = ؟
      en: kabar + krama "-e" = ?
    options: [kabarnipun, kabare, kabaripun]
    answer: 2
    explain:
      ar_eg: 'kabar بتخلص بساكن (r)، يبقى -ipun: kabaripun — زي Pripun kabaripun؟ وkabar أصلها العربي «خبر».'
      ar: 'تنتهي kabar بساكن فتأخذ -ipun: kabaripun، كما في Pripun kabaripun؟ وkabar من العربية «خبر».'
      en: 'kabar ends in a consonant, so -ipun: kabaripun — as in Pripun kabaripun? (kabar is Arabic «خبر».)'
    words: [kabar]
  - id: e03
    type: match_pairs
    pairs:
      - text: padamelan
        ar_eg: شغل (كراما)
        ar: عمل (كراما)
        en: work, job (krama)
      - text: mbatik
        ar_eg: يرسم باتيك
        ar: يرسم الباتيك
        en: do batik
      - text: nglorod
        ar_eg: يغلي القماش ويشيل الشمع
        ar: يغلي القماش لإزالة الشمع
        en: boil off the wax
      - text: estri
        ar_eg: ست (كراما)
        ar: امرأة (كراما)
        en: woman (krama)
      - text: jaler
        ar_eg: راجل (كراما)
        ar: رجل (كراما)
        en: man (krama)
      - text: ngraos
        ar_eg: يحس (كراما)
        ar: يشعر (كراما)
        en: feel (krama)
    words: [padamelan, mbatik, nglorod, estri, jaler, ngraos]
  - id: e04
    type: listen
    text: Reginipun awis, amargi damelipun dangu.
    options: ['Reginipun awis, amargi damelipun dangu.', 'Reginipun mirah, amargi damelipun dangu.', 'Reginipun awis, amargi damelipun alon.']
    answer: 0
    words: [regi, awis, amargi, dangu]
  - id: e05
    type: fill_blank
    sentence: Batikipun ___ wonten Giriloyo.
    meaning:
      ar_eg: الباتيك اتعمل في جيريلويو.
      ar: صُنع الباتيك في جيريلويو.
      en: The batik was made in Giriloyo.
    options: [digawe, dipungawe, dipundamel]
    answers: [dipundamel]
    explain:
      ar_eg: 'gawe → damel، وdi- → dipun-: dipundamel. «dipungawe» خلطة كراما على نغوكو.'
      ar: 'gawe → damel، وdi- → dipun-: dipundamel، و«dipungawe» خليط.'
      en: 'gawe → damel and di- → dipun-: dipundamel. "dipungawe" mixes levels.'
    words: [damel]
  - id: e06
    type: fill_blank
    sentence: Kula ___ batik kangge ibu kula.
    meaning:
      ar_eg: بشتري باتيك لماما.
      ar: أشتري باتيكًا لأمي.
      en: I'm buying batik for my mother.
    options: [tumbasaken, tumbasake, tukokake]
    answers: [tumbasaken]
    words: [tumbasaken]
  - id: e07
    type: build_sentence
    source:
      ar_eg: (حوّل للكراما) Aku arep tuku batik.
      ar: (حوّل إلى الكراما) Aku arep tuku batik.
      en: (turn into krama) Aku arep tuku batik.
    answer: Kula badhe tumbas batik.
    distractors: [aku, arep, tuku]
    words: [kula, badhe, tumbas]
