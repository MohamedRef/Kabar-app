      ar: (حوّل إلى الكراما) Omahe Pak Harjo gedhe banget.
      en: (turn into krama) Omahe Pak Harjo gedhe banget.
    answer: Griyanipun Pak Harjo ageng sanget.
    distractors: [omahe, gedhe, banget]
    words: [griya, ageng, sanget]
  - id: e09
    type: fill_blank
    sentence: Kainipun dipunpepe ___ garing.
    meaning:
      ar_eg: القماش بيتنشر في الشمس ___ ينشف.
      ar: يُنشر القماش في الشمس ___ يجفّ.
      en: The cloth is hung in the sun ___ it's dry.
    options: [ngantos, sida, kandel]
    answers: [ngantos]
    words: [ngantos, garing, sida, kandel]
  - id: e10
    type: multiple_choice
    question: Swara (ngoko) → ___ (krama)
    options: [swanten, rejeki, modal]
    answer: 0
    explain:
      ar_eg: swara ← swanten = صوت. rejeki = رزق، modal = رأس مال.
      ar: swara ← swanten = صوت. rejeki = رزق، modal = رأس مال.
      en: swara → swanten = voice. rejeki = livelihood, modal = capital.
    words: [swanten, rejeki, modal]
