  - id: e12
    type: speaking
    text: Kula saking Kairo. Kula badhe tumbas batik wonten Giriloyo. Reginipun awis, amargi damelipun dangu.
    meaning:
      ar_eg: أنا من القاهرة. عايز أشتري باتيك في جيريلويو. سعره غالي، عشان عمله بياخد وقت طويل.
      ar: أنا من القاهرة. أريد أن أشتري باتيكًا في جيريلويو. ثمنه غالٍ لأن صنعه يستغرق وقتًا طويلًا.
      en: I'm from Cairo. I want to buy batik in Giriloyo. It's expensive, because it takes a long time to make.
    words: [saking, tumbas, regi, awis, amargi, dangu]
dialogue:
  title: Pamit saking Giriloyo
  lines:
    - speaker: Mohamed
      text: Pak Harjo, batikipun sampun kula tumbas.
      ar_eg: يا حاج هارجو، اشتريت الباتيك خلاص.
      ar: يا سيد هارجو، اشتريتُ الباتيك.
      en: Pak Harjo, I've bought the batik.
    - speaker: Pak Harjo
      text: "Sae, Mas. Batik niki kangge sinten?"
      ar_eg: "حلو يا أستاذ. الباتيك ده لمين؟"
      ar: "جيد. لمن هذا الباتيك؟"
      en: "Lovely. Who's this batik for?"
    - speaker: Mohamed
      text: Kangge ibu kula wonten Kairo.
      ar_eg: لماما في القاهرة.
      ar: لأمي في القاهرة.
      en: For my mother in Cairo.
    - speaker: Pak Harjo
      text: Sae sanget. Batikipun dipundamel wonten Giriloyo, kangge ibu saking Mesir!
      ar_eg: حلو أوي. باتيك معمول في جيريلويو، لأم من مصر!
      ar: جميل جدًا. باتيك صُنع في جيريلويو لأمٍّ من مصر!
      en: Lovely. Batik made in Giriloyo, for a mother from Egypt!
    - speaker: Mohamed
      text: Inggih, Pak. Matur nuwun sanget.
      ar_eg: أيوه يا حاج. شكرًا جزيلًا.
      ar: نعم يا سيدي. شكرًا جزيلًا.
      en: Yes, sir. Thank you very much.
    - speaker: Pak Harjo
      text: "Sami-sami, Mas Mohamed."
      ar_eg: "العفو يا أستاذ محمد."
      ar: "عفوًا يا محمد."
      en: "You're welcome, Mohamed."
souvenir:
  id: j3.u06.souvenir
  title: Batik tulis Giriloyo
  note:
    ar_eg: |
      Giriloyo قرية في Imogiri جنوب يوجيا، تحت التل اللي عليه مقابر ملوك ماتارام. ستات القرية بيرسموا الـ batik tulis بالإيد من أجيال، وبعد زلزال ٢٠٠٦ القرية رجّعت ورشها وبقت بتعلّم الزوار الشغل بالـ canthing. والمقابر الملكية هناك اسمها makam، من العربي «مقام» — يعني حتى تحت تل الباتيك، العربي مستخبي في الأسامي.
    ar: |
      Giriloyo قرية في Imogiri جنوب يوجيا، عند سفح التل الذي تقوم عليه مقابر ملوك ماتارام. ونساء القرية يرسمن الـ batik tulis باليد منذ أجيال، وبعد زلزال ٢٠٠٦ أعادت القرية بناء ورشها، وصارت تعلّم الزوار العمل بالـ canthing. وتسمّى المقابر الملكية هناك makam، من العربية «مقام»، فالعربية حاضرة حتى تحت تلّ الباتيك.
    en: |
      Giriloyo is a village in Imogiri, south of Jogja, below the hill of the Mataram royal graves. Its women have drawn batik tulis by hand for generations; after the 2006 earthquake the village rebuilt its workshops and now teaches visitors the canthing. The royal graves are called makam, from Arabic «مقام» — Arabic hiding even under batik hill.
