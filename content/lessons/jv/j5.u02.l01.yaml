schema: kabar.lesson/v1
id: j5.u02.l01
language: jv
title: Di-… dening…
can_do:
  ar_eg: تقرا المبني للمجهول المكتوب بـ dening.
  ar: أن تقرأ المبني للمجهول المكتوب مع dening.
  en: Read written passives with dening.
slides:
  - title: Di- … dening = di- … oleh
    body:
      ar_eg: |
        الأخبار بتحب المجهول. انت عارف di- من J1 (dituku = اتشترى). في الكتابة بييجي بعده dening = «بواسطة / على إيد» = oleh بالإندونيسي بالظبط.
        ولو الفعل فيه -i أو -ake بتفضل زي ما هي: didandani = اتصلّح (diperbaiki).
        وزي جرايدنا: «تم إصلاح الطريق من قِبَل الأهالي».
      ar: |
        تحب الأخبار المبني للمجهول. عرفت di- منذ J1 (dituku = اشتُري)، وفي الكتابة تليه dening = «من قِبَل / على يد» = oleh الإندونيسية تمامًا.
        وتبقى اللاحقتان -i و-ake: didandani = أُصلح (diperbaiki).
        كما تكتب صحفنا: «تم إصلاح الطريق من قِبَل الأهالي».
      en: |
        News loves the passive. You've known di- since J1 (dituku = was bought). In writing it's followed by dening = "by" = Indonesian oleh, exactly.
        Suffixes -i and -ake stay: didandani = was repaired (diperbaiki).
        Just like Arabic newspapers: «تم إصلاح الطريق من قِبَل الأهالي».
    grammar: jv.passive.written
    examples:
      - text: Dalan iku didandani dening warga.
        ar_eg: الطريق اتصلّح على إيد الأهالي.
        ar: أصلح الأهالي الطريق.
        en: The road was repaired by the residents.
      - text: Stasiun Madiun dibangun dening perusahaan sepur Walanda.
        ar_eg: محطة ماديون اتبنت على إيد شركة سكة حديد هولندية.
        ar: بنت شركةُ سكك حديد هولندية محطة ماديون.
        en: Madiun Station was built by a Dutch railway company.
  - title: Dening aku? Ora!
    body:
      ar_eg: |
        لو الفاعل واضح، الجرنال بيشيل dening خالص: «Stasiun Madiun dibangun ing jaman Walanda».
        ولو الفاعل «أنا»، الجاوي مايقولش «dening aku». بيقول tak- زي ما اتعلمت، وفي الكتابة الرسمية بتتكتب dak-: dakwaca = أنا قريته.
      ar: |
        إذا كان الفاعل معروفًا حُذفت dening: «Stasiun Madiun dibangun ing jaman Walanda».
        وإذا كان الفاعل «أنا» فلا يقال «dening aku»، بل tak- كما تعلمت، وتُكتب في الرسمي dak-: dakwaca = قرأتُه.
      en: |
        When the doer is obvious, news drops dening altogether: "Stasiun Madiun dibangun ing jaman Walanda".
        And when the doer is "I", Javanese never says "dening aku". It uses tak-, as you learned, written dak- in formal texts: dakwaca = I read it.
    grammar: jv.passive.written
    examples:
      - text: Stasiun Madiun dibangun ing jaman Walanda.
        ar_eg: محطة ماديون اتبنت أيام الهولنديين.
        ar: بُني محطة ماديون في عهد الهولنديين.
        en: Madiun Station was built in the Dutch era.
      - text: Buku iki dakwaca wingi.
        ar_eg: الكتاب ده قريته امبارح.
        ar: قرأتُ هذا الكتاب أمس.
        en: I read this book yesterday.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: dening
        ar_eg: بواسطة / على إيد (= oleh)
        ar: من قِبَل (= oleh)
        en: by (= oleh)
      - text: warga
        ar_eg: الأهالي / السكان
        ar: الأهالي / السكان
        en: residents
      - text: didandani
        ar_eg: اتصلّح
        ar: أُصلِح
        en: was repaired (= diperbaiki)
      - text: dibangun
        ar_eg: اتبنى
        ar: بُني
        en: was built
      - text: warta
        ar_eg: خبر / أخبار
        ar: خبر / أخبار
        en: news (= berita)
    words: [dening, warga, didandani, dibangun, warta]
  - id: e02
    type: multiple_choice
    question: Dalan iku didandani dening warga.
    question_meaning:
      ar_eg: مين اللي صلّح الطريق؟
      ar: من أصلح الطريق؟
      en: Who repaired the road?
    options: [Pak Harjo, warga, wong Walanda]
    answer: 1
    explain:
      ar_eg: الفاعل دايمًا بعد dening، وهنا dening warga = على إيد الأهالي.
      ar: الفاعل يأتي بعد dening، وهنا dening warga = على يد الأهالي.
      en: The doer always follows dening; here dening warga = by the residents.
    words: [dening, warga, didandani]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تكتب «أنا قريت الكتاب ده امبارح»؟
      ar: كيف تكتب «قرأتُ هذا الكتاب أمس»؟
      en: How do you write "I read this book yesterday"?
    options: ['Buku iki dakwaca wingi.', 'Buku iki diwaca dening aku wingi.']
    answer: 0
    explain:
      ar_eg: مع «أنا» الجاوي بيستخدم dak- / tak-، مش dening aku.
      ar: مع المتكلم تُستعمل dak- / tak- لا dening aku.
      en: With "I" as the doer, Javanese uses dak- / tak-, not dening aku.
    words: [dening]
