dialogue:
  title: Ing stasiun lawas
  lines:
    - speaker: Pak Harjo
      text: Mas, gedhong stasiun iki dibangun dening perusahaan sepur Walanda, lho.
      ar_eg: يا ابني، مبنى المحطة ده بنته شركة سكة حديد هولندية، تعرف؟
      ar: يا بني، بنت مبنى المحطة هذا شركةُ سكك حديد هولندية.
      en: Young man, this station building was built by a Dutch railway company, you know.
    - speaker: Mohamed
      text: Ing jaman Walanda, Pak?
      ar_eg: أيام الهولنديين يا عمّو؟
      ar: في عهد الهولنديين يا سيدي؟
      en: In the Dutch era, sir?
    - speaker: Pak Harjo
      text: Iya. Saiki wis didandani. Wacanen warta iki.
      ar_eg: آه. ودلوقتي اتصلّح خلاص. اقرا الخبر ده.
      ar: نعم. وقد أُصلح الآن. اقرأ هذا الخبر.
      en: Yes. It's been restored now. Read this news item.
    - speaker: Mohamed
      text: Gedhong iki didandani dening perusahaan sepur.
      ar_eg: (بيقرا) المبنى ده اتصلّح على إيد شركة السكة الحديد.
      ar: (يقرأ) أصلحت شركةُ السكك الحديدية هذا المبنى.
      en: (reading) This building was restored by the railway company.
    - speaker: Mohamed
      text: Matur nuwun, Pak. Kula remen maos warta.
      ar_eg: متشكر يا عمّو. أنا بحب أقرا الأخبار.
      ar: شكرًا يا سيدي. أحب قراءة الأخبار.
      en: Thank you, sir. I love reading the news.
