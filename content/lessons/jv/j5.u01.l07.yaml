schema: kabar.lesson/v1
id: j5.u01.l07
language: jv
title: Artikel Madiun
can_do:
  ar_eg: تقرا مقالة عن ماديون.
  ar: أن تقرأ مقالة عن ماديون.
  en: Read an article about Madiun.
slides:
  - title: Artikel cekak
    body:
      ar_eg: |
        دي بداية مقالة قصيرة عن ماديون، زي اللي في ويكيبيديا الجاوية. اقراها ودوّر على الهيكل: iku (تعريف)، ana ing (فين)، kang (وصف)، yaiku (تفصيل).
        كلمتين جداد: pulo = جزيرة (pulau)، وsegara = بحر (laut)، وبتتنطق «سِغورو».
      ar: |
        هذه بداية مقالة قصيرة عن ماديون كما في ويكيبيديا الجاوية. اقرأها وابحث عن هيكلها: iku (التعريف)، وana ing (المكان)، وkang (الوصف)، وyaiku (التفصيل).
        وكلمتان جديدتان: pulo = جزيرة (pulau)، وsegara = بحر (laut) وتُنطق «سِغورو».
      en: |
        Here's the start of a short article about Madiun, the way Javanese Wikipedia writes it. Read it and find the skeleton: iku (definition), ana ing (where), kang (description), yaiku (details).
        Two new words: pulo = island (pulau), and segara = sea (laut), said "segoro".
    grammar: jv.reading.written-style
    examples:
      - text: Madiun iku kutha ing Provinsi Jawa Timur.
        ar_eg: ماديون مدينة في محافظة جاوة الشرقية.
        ar: ماديون مدينة في إقليم جاوة الشرقية.
        en: Madiun is a city in East Java Province.
      - text: Kutha iki ana ing tengah pulo Jawa, adoh saka segara.
        ar_eg: المدينة دي في نص جزيرة جاوة، بعيد عن البحر.
        ar: تقع هذه المدينة في وسط جزيرة جاوة، بعيدًا عن البحر.
        en: The city lies in the middle of the island of Java, far from the sea.
      - text: Ing Madiun ana papan-papan kang misuwur, yaiku Jalan Pahlawan, Alun-alun lan Stasiun Madiun.
        ar_eg: في ماديون أماكن مشهورة، هي شارع باهلاوان والألون ألون ومحطة ماديون.
        ar: في ماديون أماكن مشهورة، هي شارع باهلاوان والألون ألون ومحطة ماديون.
        en: Madiun has famous places, namely Jalan Pahlawan, the Alun-alun and Madiun Station.
exercises:
  - id: e01
    type: listen
    text: Kutha iki ana ing tengah pulo Jawa, adoh saka segara.
    question:
      ar_eg: ماديون فين؟
      ar: أين تقع ماديون؟
      en: Where is Madiun?
    options: [ing pesisir kidul, ing pesisir lor, ing tengah pulo Jawa]
    answer: 2
    meaning:
      ar_eg: المدينة دي في نص جزيرة جاوة، بعيد عن البحر.
      ar: تقع هذه المدينة في وسط جزيرة جاوة، بعيدًا عن البحر.
      en: The city lies in the middle of the island of Java, far from the sea.
    words: [pulo, segara]
  - id: e02
    type: multiple_choice
    question: Ing Madiun ana papan-papan kang misuwur, yaiku Jalan Pahlawan, Alun-alun lan Stasiun Madiun.
    question_meaning:
      ar_eg: الجملة دي بتعدّ كام مكان مشهور؟
      ar: كم مكانًا مشهورًا تعدّ هذه الجملة؟
      en: How many famous places does this sentence list?
    options: [loro, papat, telu]
    answer: 2
    explain:
      ar_eg: بعد yaiku فيه تلاتة، Jalan Pahlawan وAlun-alun وStasiun Madiun.
      ar: بعد yaiku ثلاثة، Jalan Pahlawan وAlun-alun وStasiun Madiun.
      en: After yaiku come three, Jalan Pahlawan, the Alun-alun and Stasiun Madiun.
    words: [papan, misuwur, yaiku]
  - id: e03
    type: fill_blank
    sentence: Madiun adoh saka ___.
    meaning:
      ar_eg: ماديون بعيدة عن البحر.
      ar: ماديون بعيدة عن البحر.
      en: Madiun is far from the sea.
    options: [pulo, segara, kutha]
    answers: [segara]
    words: [segara]
    explain:
      ar_eg: segara = بحر. pulo = جزيرة وkutha = مدينة.
      ar: segara تعني البحر. أما pulo فجزيرة وkutha مدينة.
      en: segara is the sea. pulo is an island and kutha is a city.
  - id: e04
    type: build_sentence
    source:
      ar_eg: (بأسلوب المقالة) باتشيتان على الساحل الجنوبي لجزيرة جاوة.
      ar: (بأسلوب المقالة) تقع باتشيتان على الساحل الجنوبي لجزيرة جاوة.
      en: (article style) Pacitan lies on the south coast of the island of Java.
    answer: Pacitan ana ing pesisir kidul pulo Jawa.
    distractors: [lor, neng]
    words: [pulo, pesisir, kidul]
    explain:
      ar_eg: «الساحل الجنوبي» = pesisir kidul. lor = شمال، عكس المعنى، وneng عامية مش أسلوب مقالة.
      ar: «الساحل الجنوبي» = pesisir kidul. أما lor فالشمال، عكس المعنى، وneng عامية لا تناسب المقالة.
      en: "\"South coast\" is pesisir kidul. lor is north, the opposite, and neng is too casual for an article."
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأسلوب المقالة) جاوة جزيرة من جزر إندونيسيا.
      ar: (بأسلوب المقالة) جاوة إحدى جزر إندونيسيا.
      en: (article style) Java is one of the islands of Indonesia.
    answers:
      - Jawa iku sawijining pulo ing Indonesia.
      - Pulo Jawa iku sawijining pulo ing Indonesia.
      - Jawa kalebu pulo ing Indonesia.
      - Jawa iku pulo ing Indonesia.
      - Jawa iku sawijining pulo ana ing Indonesia.
    words: [pulo, sawijining]
  - id: e06
    type: translate
    direction: from_target
    source_text: Ing Madiun ana papan-papan kang misuwur, yaiku Jalan Pahlawan, Alun-alun lan Stasiun Madiun.
    answers_meaning:
      ar_eg:
        - في ماديون أماكن مشهورة، هي شارع باهلاوان والألون ألون ومحطة ماديون.
        - في ماديون أماكن مشهورة، شارع باهلاوان والألون ألون ومحطة ماديون.
        - في ماديون فيه أماكن مشهورة، يعني شارع باهلاوان والميدان ومحطة ماديون.
        - في ماديون أماكن مشهورة، هي Jalan Pahlawan وAlun-alun وStasiun Madiun.
      ar:
        - في ماديون أماكن مشهورة، هي شارع باهلاوان والألون ألون ومحطة ماديون.
        - في ماديون أماكن مشهورة، أي شارع باهلاوان والميدان ومحطة ماديون.
        - في ماديون أماكن مشهورة، هي Jalan Pahlawan وAlun-alun وStasiun Madiun.
      en:
        - Madiun has famous places, namely Jalan Pahlawan, the Alun-alun and Madiun Station.
        - In Madiun there are famous places, namely Jalan Pahlawan, the Alun-alun and Madiun Station.
        - Madiun has famous places, namely Jalan Pahlawan, the town square and Madiun Station.
        - Madiun has famous places, Jalan Pahlawan, the Alun-alun and Madiun Station.
        - Madiun has some famous places, namely Jalan Pahlawan, the Alun-alun and Stasiun Madiun.
    words: [papan, misuwur, yaiku]
  - id: e07
    type: dictation
    text: Madiun misuwur minangka Kutha Pendekar.
    meaning:
      ar_eg: ماديون مشهورة بإنها «مدينة المقاتلين» (أبطال السيلات).
      ar: تشتهر ماديون بوصفها «مدينة المقاتلين» (أبطال السيلات).
      en: Madiun is famous as the Kutha Pendekar, the city of silat fighters.
    words: [minangka, misuwur]
  - id: e08
    type: speaking
    text: Madiun iku kutha ing Jawa Timur, adoh saka segara.
    meaning:
      ar_eg: ماديون مدينة في جاوة الشرقية، بعيدة عن البحر.
      ar: ماديون مدينة في جاوة الشرقية، بعيدة عن البحر.
      en: Madiun is a city in East Java, far from the sea.
    words: [segara]
dialogue:
  title: Sawise maca artikel
  lines:
    - speaker: Mohamed
      text: Mbak, artikel iki ngomong ana papan misuwur telu ing Madiun.
      ar_eg: يا آيو، المقالة دي بتقول فيه تلات أماكن مشهورة في ماديون.
      ar: يا آيو، تقول هذه المقالة إن في ماديون ثلاثة أماكن مشهورة.
      en: Ayu, this article says there are three famous places in Madiun.
    - speaker: Mbak Ayu
      text: Iya, Jalan Pahlawan, Alun-alun lan Stasiun Madiun.
      ar_eg: آه، شارع باهلاوان والألون ألون ومحطة ماديون.
      ar: نعم، شارع باهلاوان والألون ألون ومحطة ماديون.
      en: Yes, Jalan Pahlawan, the Alun-alun and Madiun Station.
    - speaker: Mohamed
      text: Segara adoh saka kene?
      ar_eg: البحر بعيد عن هنا؟
      ar: هل البحر بعيد من هنا؟
      en: Is the sea far from here?
    - speaker: Mbak Ayu
      text: Adoh, lho. Madiun ora duwe pesisir. Sing cedhak segara iku Pacitan.
      ar_eg: بعيد أوي. ماديون مالهاش ساحل. اللي قريبة من البحر هي باتشيتان.
      ar: بعيد جدًا. ليس لماديون ساحل، والقريبة من البحر هي باتشيتان.
      en: It's far! Madiun has no coast. The town near the sea is Pacitan.
    - speaker: Mohamed
      text: Yo wis, ayo menyang Alun-alun, banjur mangan pecel!
      ar_eg: خلاص، يلا نروح الألون ألون، وبعدين ناكل بيتشيل!
      ar: حسنًا، هيا إلى الألون ألون، ثم نأكل البيتشيل!
      en: OK then, let's go to the Alun-alun, then eat pecel!
new_words:
  - word: pulo
    pos: noun
    ar_eg: جزيرة
    ar: جزيرة
    en: island = pulau
