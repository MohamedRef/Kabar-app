schema: kabar.lesson/v1
id: j5.u01.l05
language: jv
title: Ringkesan
can_do:
  ar_eg: تلخّص مقالة بالإندونيسي أو بالعربي.
  ar: أن تلخّص مقالة بالإندونيسية أو بالعربية.
  en: Summarise an article in Indonesian or Arabic.
slides:
  - title: Artikel Kutha Lama
    body:
      ar_eg: |
        ringkesan = ملخّص (ringkasan). اقرا التلات جمل دول، وبعدين قول الفكرة في جملة واحدة.
        الطريقة: لاقي iku (الموضوع إيه)، وبعدين saka (منين جه)، وdadi (بقى إيه).
        وكلمة من العربي: jaman = زمن، من «زمان». jaman Walanda = أيام الهولنديين.
      ar: |
        ringkesan = ملخّص (ringkasan). اقرأ هذه الجمل الثلاث ثم قل فكرتها في جملة واحدة.
        والطريقة: ابحث عن iku (ما الموضوع)، ثم saka (من أين أتى)، ثم dadi (ماذا صار).
        وكلمة عربية الأصل: jaman = زمن، من «زمان»، وjaman Walanda = عهد الهولنديين.
      en: |
        ringkesan = summary (ringkasan). Read these three sentences, then give the idea in one.
        The method: find iku (what it's about), then saka (where it comes from), then dadi (what it became).
        A word from Arabic: jaman = era, from «زمان». jaman Walanda = the Dutch era.
    grammar: jv.reading.written-style
    examples:
      - text: Kutha Lama iku papan kang lawas ing Semarang.
        ar_eg: كوتا لاما مكان قديم في سيمارانج.
        ar: كوتا لاما مكان قديم في سيمارانج.
        en: Kota Lama is an old place in Semarang.
      - text: Ing kono ana gedhong-gedhong lawas saka jaman Walanda.
        ar_eg: هناك فيه مباني قديمة من أيام الهولنديين.
        ar: هناك مبانٍ قديمة من عهد الهولنديين.
        en: There are old buildings there from the Dutch era.
      - text: Saiki Kutha Lama dadi papan wisata kang misuwur.
        ar_eg: دلوقتي كوتا لاما بقت مكان سياحي مشهور.
        ar: صارت كوتا لاما اليوم مكانًا سياحيًا مشهورًا.
        en: Today Kota Lama has become a famous tourist spot.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: المقالة دي عن إيه أساسًا؟
      ar: عمَّ تتحدث المقالة أساسًا؟
      en: What is the article mainly about?
    options: [Lumpia Semarang, Kutha Lama Semarang, Pesisir kidul]
    answer: 1
    words: [lawas]
  - id: e02
    type: listen
    text: Ing kono ana gedhong-gedhong lawas saka jaman Walanda.
    options:
      - Ing kono ana gedhong-gedhong lawas saka jaman Walanda.
      - Ing kono ana gedhong-gedhong anyar saka jaman saiki.
      - Ing kene ana sepur lawas saka jaman Walanda.
    answer: 0
    meaning:
      ar_eg: هناك فيه مباني قديمة من أيام الهولنديين.
      ar: هناك مبانٍ قديمة من عهد الهولنديين.
      en: There are old buildings there from the Dutch era.
    words: [jaman, Walanda, anyar]
  - id: e03
    type: fill_blank
    sentence: Gedhong-gedhong iki saka ___ Walanda.
    meaning:
      ar_eg: المباني دي من أيام الهولنديين.
      ar: هذه المباني من عهد الهولنديين.
      en: These buildings are from the Dutch era.
    options: [papan, jaman, donya]
    answers: [jaman]
    words: [jaman, Walanda]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة أحسن ringkesan (ملخّص) للمقالة؟
      ar: أي جملة هي أفضل ringkesan (ملخّص) للمقالة؟
      en: Which sentence is the best ringkesan (summary) of the article?
    options:
      - Semarang misuwur minangka Kutha Lumpia.
      - Kutha Lama iku papan lawas saka jaman Walanda, saiki dadi papan wisata.
      - Stasiun Tawang ana ing pesisir kidul.
    answer: 1
    explain:
      ar_eg: الملخّص فيه الموضوع (Kutha Lama)، وأصله (jaman Walanda)، وحاله دلوقتي (papan wisata).
      ar: الملخّص فيه الموضوع (Kutha Lama) وأصله (jaman Walanda) وحاله اليوم (papan wisata).
      en: The summary has the topic (Kutha Lama), its origin (jaman Walanda) and what it is now (papan wisata).
    words: [ringkesan, jaman]
  - id: e05
    type: build_sentence
    source:
      ar_eg: كوتا لاما مكان قديم من أيام الهولنديين.
      ar: كوتا لاما مكان قديم من عهد الهولنديين.
      en: Kota Lama is an old place from the Dutch era.
    answer: Kutha Lama iku papan lawas saka jaman Walanda.
    distractors: [kang, segara]
    words: [jaman, Walanda, papan]
  - id: e06
    type: translate
    direction: from_target
    source_text: Saiki Kutha Lama dadi papan wisata kang misuwur.
    answers_meaning:
      ar_eg:
        - دلوقتي كوتا لاما بقت مكان سياحي مشهور.
        - كوتا لاما دلوقتي بقت مكان سياحي مشهور.
        - دلوقتي كوتا لاما بقت مكان سياحة مشهور.
        - دلوقتي المدينة القديمة بقت مكان سياحي مشهور.
      ar:
        - صارت كوتا لاما اليوم مكانًا سياحيًا مشهورًا.
        - أصبحت كوتا لاما الآن مكانًا سياحيًا مشهورًا.
        - صارت كوتا لاما الآن مكانًا سياحيًا مشهورًا.
        - أصبحت المدينة القديمة الآن مكانًا سياحيًا مشهورًا.
      en:
        - Today Kota Lama has become a famous tourist spot.
        - Kota Lama has now become a famous tourist spot.
        - Now Kota Lama has become a famous tourist spot.
        - Now Kota Lama is a famous tourist spot.
        - Kota Lama is now a famous tourist spot.
        - Now Kota Lama has become a famous tourist attraction.
        - Kota Lama has now become a famous tourist attraction.
        - Kota Lama is now a famous tourist attraction.
    words: [papan, misuwur]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأسلوب المقالة) المباني القديمة دي من أيام الهولنديين.
      ar: (بأسلوب المقالة) هذه المباني القديمة من عهد الهولنديين.
      en: (article style) The old buildings are from the Dutch era.
    answers:
      - Gedhong-gedhong lawas iku saka jaman Walanda.
      - Gedhong-gedhong kang lawas iku saka jaman Walanda.
      - Gedhong-gedhong lawas saka jaman Walanda.
      - Gedhong lawas iku saka jaman Walanda.
      - Gedhong-gedhong lawas iki saka jaman Walanda.
      - Gedhong-gedhong kang lawas saka jaman Walanda.
    words: [jaman, Walanda]
  - id: e08
    type: fill_blank
    sentence: Iki ___ artikel anyar.
    meaning:
      ar_eg: ده ملخّص المقالة الجديدة.
      ar: هذا ملخّص المقالة الجديدة.
      en: This is the summary of the new article.
    options: [jamane, ringkesane, papane]
    answers: [ringkesane]
    explain:
      ar_eg: ringkesan + -e = ringkesane، يعني «ملخّص الـ…».
      ar: ringkesan + -e = ringkesane، أي «ملخّص …».
      en: ringkesan + -e = ringkesane, "the summary of …".
    words: [ringkesan, anyar]
  - id: e09
    type: speaking
    text: Ringkesane, Kutha Lama iku papan lawas saka jaman Walanda.
    meaning:
      ar_eg: الملخّص إن كوتا لاما مكان قديم من أيام الهولنديين.
      ar: الملخّص أن كوتا لاما مكان قديم من عهد الهولنديين.
      en: In short, Kota Lama is an old place from the Dutch era.
    words: [ringkesan, Walanda]
  - id: e10
    type: multiple_choice
    question: Gedhong iki anyar, dudu lawas.
    question_meaning:
      ar_eg: معنى الجملة دي إيه؟
      ar: ما معنى هذه الجملة؟
      en: What does this sentence mean?
    options: ['المبنى ده جديد، مش قديم.', 'المبنى ده قديم، مش جديد.', 'المبنى ده كبير، مش صغير.']
    answer: 0
    explain:
      ar_eg: anyar = جديد (baru)، وعكسها lawas = قديم (lama).
      ar: anyar = جديد (baru)، وضدّها lawas = قديم.
      en: anyar = new (baru); its opposite is lawas = old.
    words: [anyar, lawas]
dialogue:
  title: Ringkesane apa?
  lines:
    - speaker: Mbak Ayu
      text: Wis maca artikel Kutha Lama? Ringkesane apa?
      ar_eg: قريت مقالة كوتا لاما؟ ملخّصها إيه؟
      ar: هل قرأت مقالة كوتا لاما؟ ما ملخّصها؟
      en: Have you read the Kota Lama article? What's the summary?
    - speaker: Mohamed
      text: Kutha Lama iku papan lawas saka jaman Walanda.
      ar_eg: كوتا لاما مكان قديم من أيام الهولنديين.
      ar: كوتا لاما مكان قديم من عهد الهولنديين.
      en: Kota Lama is an old place from the Dutch era.
    - speaker: Mbak Ayu
      text: Bener. Lan saiki piye?
      ar_eg: صح. وحالها إيه دلوقتي؟
      ar: صحيح. وما حالها الآن؟
      en: Right. And what about now?
    - speaker: Mohamed
      text: Saiki dadi papan wisata kang misuwur. Eh, papan wisata sing misuwur!
      ar_eg: دلوقتي بقت مكان سياحي مشهور. قصدي بالكلام، papan wisata sing misuwur!
      ar: صارت الآن مكانًا سياحيًا مشهورًا. أقصد بلغة الكلام، papan wisata sing misuwur!
      en: Now it's a famous tourist spot. Oops, I mean, papan wisata sing misuwur!
    - speaker: Mbak Ayu
      text: Apik! Ringkesanmu cekak lan bener.
      ar_eg: حلو! ملخّصك قصير وصح.
      ar: أحسنت! ملخّصك قصير وصحيح.
      en: Nice! Your summary is short and correct.
