schema: kabar.lesson/v1
id: j5.u01.l05
language: jv
title: Abad lan riwayat
can_do:
  ar_eg: 'تقرا جزء التاريخ في مقالة: القرن، والأثر القديم، والنصب، والأرقام الكبيرة.'
  ar: 'أن تقرأ قسم التاريخ في مقالة: القرن والأثر القديم والنصب والأعداد الكبيرة.'
  en: 'Read the history part of an article: centuries, ancient sites, monuments and big numbers.'
slides:
  - title: Bagean riwayat
    body:
      ar_eg: |
        riwayat = تاريخ أو سيرة (عنوان قسم «التاريخ» في المقالة). abad = قرن: abad kaping 20 = القرن العشرين.
        kuno = قديم أوي (أثري)، tugu = نصب، lambang = رمز أو شعار.
        puluhan = عشرات، atusan = مئات. awujud = على شكل.
      ar: |
        riwayat = تاريخ أو سيرة (عنوان قسم التاريخ في المقالة). abad = قرن: abad kaping 20 = القرن العشرون.
        kuno = قديم أثري، tugu = نُصُب، lambang = رمز أو شعار.
        puluhan = عشرات، atusan = مئات. awujud = على هيئة.
      en: |
        riwayat = history, life story (the "History" heading of an article). abad = century: abad kaping 20 = the 20th century.
        kuno = ancient, tugu = monument, lambang = symbol, emblem.
        puluhan = tens, dozens; atusan = hundreds. awujud = in the form of.
    examples:
      - text: Benteng Pendem dibangun ing abad kaping sangalas.
        ar_eg: حصن بندم (حصن فان دن بوش في نغاوي) اتبنى في القرن التسعتاشر.
        ar: بُني حصن بندم (حصن فان دن بوش في نغاوي) في القرن التاسع عشر.
        en: Benteng Pendem (Fort Van den Bosch in Ngawi) was built in the 19th century.
      - text: Atusan prajurit Walanda manggon ing Benteng Pendem.
        ar_eg: حصن بندم كان ساكن فيه مئات العساكر الهولنديين.
        ar: سكن حصنَ بندم مئاتُ الجنود الهولنديين.
        en: Hundreds of Dutch soldiers lived in Benteng Pendem.
      - text: Candhi Cetho iku candhi kuno.
        ar_eg: معبد تشيتو (على جبل لاوو) معبد قديم أثري.
        ar: معبد تشيتو (على جبل لاوو) معبد أثري قديم.
        en: Candi Cetho (on Mount Lawu) is an ancient temple.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: abad
        ar_eg: قرن
        ar: قرن
        en: century
      - text: riwayat
        ar_eg: تاريخ، سيرة
        ar: تاريخ، سيرة
        en: history, life story
      - text: kuno
        ar_eg: قديم أثري
        ar: أثري قديم
        en: ancient
      - text: tugu
        ar_eg: نصب
        ar: نُصُب
        en: monument
    words: [abad, riwayat, kuno, tugu]
  - id: e02
    type: match_pairs
    pairs:
      - text: lambang
        ar_eg: رمز، شعار
        ar: رمز، شعار
        en: symbol
      - text: atusan
        ar_eg: مئات
        ar: مئات
        en: hundreds
      - text: puluhan
        ar_eg: عشرات
        ar: عشرات
        en: tens, dozens
      - text: awujud
        ar_eg: على شكل
        ar: على هيئة
        en: in the form of
    words: [lambang, atusan, puluhan, awujud]
  - id: e03
    type: listen
    text: Atusan prajurit Walanda manggon ing Benteng Pendem.
    question:
      ar_eg: قد إيه عسكري كانوا ساكنين في الحصن؟
      ar: كم جنديًا سكن الحصن؟
      en: How many soldiers lived in the fort?
    options: [مئات العساكر, عشرات العساكر, ألف عسكري بالظبط]
    answer: 0
    meaning:
      ar_eg: حصن بندم كان ساكن فيه مئات العساكر الهولنديين.
      ar: سكن حصنَ بندم مئاتُ الجنود الهولنديين.
      en: Hundreds of Dutch soldiers lived in Benteng Pendem.
    words: [atusan]
  - id: e04
    type: fill_blank
    sentence: Candhi Cetho iku candhi ___.
    meaning:
      ar_eg: معبد تشيتو معبد ___.
      ar: معبد تشيتو معبد ___.
      en: Candi Cetho is an ___ temple.
    options: [kuno, puluhan, awujud]
    answers: [kuno]
    words: [kuno, puluhan, awujud]
    explain:
      ar_eg: kuno = قديم أوي. puluhan = عشرات وawujud = على شكل، ومش صفة للمعبد.
      ar: kuno تعني عتيق. أما puluhan فعشرات وawujud على هيئة، وليستا صفة للمعبد.
      en: kuno means ancient. puluhan is "dozens" and awujud is "in the form of"; neither describes the temple.
  - id: e05
    type: multiple_choice
    question: Satus taun iku siji ___.
    options: [tugu, abad, riwayat]
    answer: 1
    explain:
      ar_eg: مية سنة = قرن = abad.
      ar: مئة سنة = قرن = abad.
      en: A hundred years = one century = abad.
    words: [tugu, abad, riwayat]
  - id: e06
    type: fill_blank
    sentence: Tugu Jogja iku ___ kutha Yogyakarta.
    meaning:
      ar_eg: توجو جوجا ___ مدينة يوجياكارتا.
      ar: توغو جوغجا ___ مدينة يوغياكارتا.
      en: The Tugu Jogja is a ___ of Yogyakarta.
    options: [lambang, abad, atusan]
    answers: [lambang]
    words: [lambang, abad, atusan, tugu]
    explain:
      ar_eg: lambang = رمز. abad = قرن وatusan = مئات.
      ar: lambang تعني رمز. أما abad فقرن وatusan مئات.
      en: lambang means symbol. abad is a century and atusan is "hundreds".
  - id: e07
    type: multiple_choice
    question: Ana telung puluh turis ing museum. Ana ___ turis.
    options: [puluhan, atusan, lambang]
    answer: 0
    explain:
      ar_eg: تلاتين = عشرات (puluhan)، مش مئات.
      ar: ثلاثون = عشرات (puluhan) لا مئات.
      en: Thirty is tens (puluhan), not hundreds.
    words: [puluhan, atusan, lambang]
  - id: e08
    type: build_sentence
    source:
      ar_eg: تاريخ النصب ده طويل أوي.
      ar: تاريخ هذا النصب طويل جدًا.
      en: The history of this monument is very long.
    answer: Riwayat tugu iki dawa banget.
    distractors: [abad, kuno]
    words: [riwayat, tugu]
    explain:
      ar_eg: riwayat = تاريخ، وdawa = طويل. abad = قرن وkuno = قديم، ومش في الجملة.
      ar: riwayat تعني التاريخ وdawa طويل. أما abad (قرن) وkuno (عتيق) فليستا في الجملة.
      en: riwayat is history and dawa is long. abad (century) and kuno (ancient) aren't in the sentence.
  - id: e09
    type: translate
    direction: from_target
    source_text: Buku riwayat iki awujud komik.
    answers_meaning:
      ar_eg: [كتاب التاريخ ده على شكل كوميكس, كتاب السيرة ده على شكل قصة مصورة]
      ar: [كتاب التاريخ هذا على هيئة قصص مصوّرة, كتاب السيرة هذا على شكل قصة مصورة]
      en: [This history book is in the form of a comic, This history book is a comic]
    words: [riwayat, awujud]
  - id: e10
    type: speaking
    text: Puluhan turis teka menyang candhi kuno iku.
    meaning:
      ar_eg: عشرات السياح جم المعبد الأثري ده.
      ar: جاء عشرات السياح إلى ذلك المعبد الأثري.
      en: Dozens of tourists came to that ancient temple.
    words: [puluhan, kuno]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, wis maca riwayat Benteng Pendem ing Wikipedia?
      ar_eg: يا محمد، قريت تاريخ حصن بندم في ويكيبيديا؟
      ar: يا محمد، هل قرأت تاريخ حصن بندم في ويكيبيديا؟
      en: Mohamed, have you read the history of Benteng Pendem on Wikipedia?
    - speaker: Mohamed
      text: Wis. Benteng iku saka abad sangalas, ta?
      ar_eg: أيوه. الحصن ده من القرن التسعتاشر، صح؟
      ar: نعم. هذا الحصن من القرن التاسع عشر، أليس كذلك؟
      en: Yes. The fort dates from the 19th century, right?
    - speaker: Mbak Ayu
      text: Iya. Ana atusan prajurit Walanda ing kono.
      ar_eg: أيوه. كان فيه مئات العساكر الهولنديين هناك.
      ar: نعم. كان فيه مئات الجنود الهولنديين.
      en: Yes. There were hundreds of Dutch soldiers there.
    - speaker: Mohamed
      text: Lha, Tugu Jogja riwayate piye?
      ar_eg: طب ونصب توجو في جوجا، تاريخه إيه؟
      ar: وما تاريخ نصب توغو في جوغجا؟
      en: And what's the story of the Tugu in Jogja?
    - speaker: Mbak Ayu
      text: Wis ana wiwit abad wolulas. Saiki dadi lambang kutha Yogyakarta.
      ar_eg: موجود من القرن التمنتاشر. ودلوقتي بقى رمز مدينة يوجياكارتا.
      ar: قائم منذ القرن الثامن عشر، وصار اليوم رمز مدينة يوغياكارتا.
      en: It has stood since the 18th century. Now it's the symbol of Yogyakarta.
    - speaker: Mohamed
      text: Ayo mrana!
      ar_eg: يلا نروح هناك!
      ar: هيا نذهب إلى هناك!
      en: Let's go there!
