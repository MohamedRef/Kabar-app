schema: kabar.lesson/v1
id: j5.u01.l05
language: jv
title: Abad lan riwayat
can_do:
  ar_eg: 'تقرا جزء التاريخ في مقالة: القرن، والأثر القديم، والنصب، والأرقام الكبيرة.'
  ar: 'أن تقرأ قسم التاريخ في مقالة: القرن والأثر القديم والنصب والأعداد الكبيرة.'
  en: 'Read the history part of an article: centuries, ancient sites, monuments and big numbers.'
slides:
  - title: Bagean riwayat
    body:
      ar_eg: |
        riwayat = تاريخ أو سيرة (عنوان قسم «التاريخ» في المقالة). abad = قرن: abad kaping 20 = القرن العشرين.
        kuno = قديم أوي (أثري)، tugu = نصب، lambang = رمز أو شعار.
        puluhan = عشرات، atusan = مئات. awujud = على شكل.
      ar: |
        riwayat = تاريخ أو سيرة (عنوان قسم التاريخ في المقالة). abad = قرن: abad kaping 20 = القرن العشرون.
        kuno = قديم أثري، tugu = نُصُب، lambang = رمز أو شعار.
        puluhan = عشرات، atusan = مئات. awujud = على هيئة.
      en: |
        riwayat = history, life story (the "History" heading of an article). abad = century: abad kaping 20 = the 20th century.
        kuno = ancient, tugu = monument, lambang = symbol, emblem.
        puluhan = tens, dozens; atusan = hundreds. awujud = in the form of.
    examples:
      - text: Lawang Sewu dibangun ing abad kaping rong puluh.
        ar_eg: لاوانج سيوو اتبنى في القرن العشرين.
        ar: بُني لاوانغ سيوو في القرن العشرين.
        en: Lawang Sewu was built in the 20th century.
      - text: Lawang Sewu duwe atusan lawang.
        ar_eg: لاوانج سيوو فيه مئات الأبواب.
        ar: في لاوانغ سيوو مئات الأبواب.
        en: Lawang Sewu has hundreds of doors.
      - text: Candhi Gedong Songo iku candhi kuno.
        ar_eg: جيدونج سونجو معبد قديم أثري.
        ar: غيدونغ سونغو معبد أثري قديم.
        en: Gedong Songo is an ancient temple.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: abad
        ar_eg: قرن
        ar: قرن
        en: century
      - text: riwayat
        ar_eg: تاريخ، سيرة
        ar: تاريخ، سيرة
        en: history, life story
      - text: kuno
        ar_eg: قديم أثري
        ar: أثري قديم
        en: ancient
      - text: tugu
        ar_eg: نصب
        ar: نُصُب
        en: monument
    words: [abad, riwayat, kuno, tugu]
  - id: e02
    type: match_pairs
    pairs:
      - text: lambang
        ar_eg: رمز، شعار
        ar: رمز، شعار
        en: symbol
      - text: atusan
        ar_eg: مئات
        ar: مئات
        en: hundreds
      - text: puluhan
        ar_eg: عشرات
        ar: عشرات
        en: tens, dozens
      - text: awujud
        ar_eg: على شكل
        ar: على هيئة
        en: in the form of
    words: [lambang, atusan, puluhan, awujud]
  - id: e03
    type: listen
    text: Lawang Sewu duwe atusan lawang lan cendhela.
    question:
      ar_eg: المبنى فيه قد إيه باب؟
      ar: كم بابًا في المبنى؟
      en: How many doors does the building have?
    options: [مئات الأبواب, عشرات الأبواب, ألف باب بالظبط]
    answer: 0
    meaning:
      ar_eg: لاوانج سيوو فيه مئات الأبواب والشبابيك.
      ar: في لاوانغ سيوو مئات الأبواب والنوافذ.
      en: Lawang Sewu has hundreds of doors and windows.
    words: [atusan]
  - id: e04
    type: fill_blank
    sentence: Candhi Gedong Songo iku candhi ___.
    meaning:
      ar_eg: جيدونج سونجو معبد ___.
      ar: غيدونغ سونغو معبد ___.
      en: Gedong Songo is an ___ temple.
    options: [kuno, puluhan, awujud]
    answers: [kuno]
    words: [kuno, puluhan, awujud]
  - id: e05
    type: multiple_choice
    question: Satus taun iku siji ___.
    options: [tugu, abad, riwayat]
    answer: 1
    explain:
      ar_eg: مية سنة = قرن = abad.
      ar: مئة سنة = قرن = abad.
      en: A hundred years = one century = abad.
    words: [tugu, abad, riwayat]
  - id: e06
    type: fill_blank
    sentence: Tugu Muda iku ___ kutha Semarang.
    meaning:
      ar_eg: توجو مودا ___ مدينة سيمارانج.
      ar: توغو مودا ___ مدينة سيمارانغ.
      en: Tugu Muda is a ___ of Semarang.
    options: [lambang, abad, atusan]
    answers: [lambang]
    words: [lambang, abad, atusan, tugu]
  - id: e07
    type: multiple_choice
    question: Ana telung puluh turis ing museum. Ana ___ turis.
    options: [puluhan, atusan, lambang]
    answer: 0
    explain:
      ar_eg: تلاتين = عشرات (puluhan)، مش مئات.
      ar: ثلاثون = عشرات (puluhan) لا مئات.
      en: Thirty is tens (puluhan), not hundreds.
    words: [puluhan, atusan, lambang]
  - id: e08
    type: build_sentence
    source:
      ar_eg: تاريخ النصب ده طويل أوي.
      ar: تاريخ هذا النصب طويل جدًا.
      en: The history of this monument is very long.
    answer: Riwayat tugu iki dawa banget.
    distractors: [abad, kuno]
    words: [riwayat, tugu]
  - id: e09
    type: translate
    direction: from_target
    source_text: Buku riwayat iki awujud komik.
    answers_meaning:
      ar_eg: [كتاب التاريخ ده على شكل كوميكس, كتاب السيرة ده على شكل قصة مصورة]
      ar: [كتاب التاريخ هذا على هيئة قصص مصوّرة, كتاب السيرة هذا على شكل قصة مصورة]
      en: [This history book is in the form of a comic, This history book is a comic]
    words: [riwayat, awujud]
  - id: e10
    type: speaking
    text: Puluhan turis teka menyang candhi kuno iku.
    meaning:
      ar_eg: عشرات السياح جم المعبد الأثري ده.
      ar: جاء عشرات السياح إلى ذلك المعبد الأثري.
      en: Dozens of tourists came to that ancient temple.
    words: [puluhan, kuno]
dialogue:
  lines:
    - speaker: Mbak Ayu
      text: Mohamed, wis maca riwayat Lawang Sewu ing Wikipedia?
      ar_eg: يا محمد، قريت تاريخ لاوانج سيوو في ويكيبيديا؟
      ar: يا محمد، هل قرأت تاريخ لاوانغ سيوو في ويكيبيديا؟
      en: Mohamed, have you read the history of Lawang Sewu on Wikipedia?
    - speaker: Mohamed
      text: Wis. Gedhung iku dibangun ing abad kaping rong puluh, ta?
      ar_eg: أيوه. المبنى ده اتبنى في القرن العشرين، صح؟
      ar: نعم. بُني ذلك المبنى في القرن العشرين، أليس كذلك؟
      en: Yes. It was built in the 20th century, right?
    - speaker: Mbak Ayu
      text: Iya. Lawange ora sewu, nanging atusan.
      ar_eg: أيوه. أبوابه مش ألف، بس مئات.
      ar: نعم. أبوابه ليست ألفًا، بل مئات.
      en: Yes. It doesn't have a thousand doors, but hundreds.
    - speaker: Mohamed
      text: Lha, tugu sing ana ing ngarepe iku apa?
      ar_eg: طب والنصب اللي قدامه ده إيه؟
      ar: وما ذلك النصب الذي أمامه؟
      en: And what's the monument in front of it?
    - speaker: Mbak Ayu
      text: Tugu Muda, lambang perang limang dina ing Semarang.
      ar_eg: توجو مودا، رمز معركة الخمس أيام في سيمارانج.
      ar: توغو مودا، رمز معركة الأيام الخمسة في سيمارانغ.
      en: Tugu Muda, the symbol of the Five-Day Battle in Semarang.
    - speaker: Mohamed
      text: Ayo mrana sesuk!
      ar_eg: يلا نروح بكرة!
      ar: هيا نذهب غدًا!
      en: Let's go tomorrow!
