schema: kabar.lesson/v1
id: j4.u05.l02
language: jv
title: Krama alus
can_do:
  ar_eg: تفرّق بين ngoko alus وkrama lugu وkrama alus.
  ar: أن تميّز ngoko alus من krama lugu وkrama alus.
  en: Contrast ngoko alus with krama lugu and krama alus.
slides:
  - title: Krama lugu, krama alus
    body:
      ar_eg: |
        والكراما كمان ليها درجتين:
        - krama lugu (كراما سادة): كل الكلمات كراما، من غير تبجيل. مؤدبة بس عادية: للبياع، لحد في سنّك مش عارفه. «Sampeyan badhe kesah dhateng pundi?»
        - krama alus (كراما كاملة): كراما + krama inggil. للكبار والمدرسين والمناسبات. «Panjenengan badhe tindak dhateng pundi?»
        يعني «رايح فين؟» ليها أربع نسخ: ngoko lugu · ngoko alus · krama lugu · krama alus. ولو مش متأكد مع حد كبير: krama alus عمرها ما هتغلط.
      ar: |
        وللكراما درجتان أيضًا:
        - krama lugu: كل الألفاظ كراما بلا تبجيل؛ مهذبة عادية للبائع والنظير الغريب: «Sampeyan badhe kesah dhateng pundi?»
        - krama alus: كراما مع krama inggil للكبار والمعلمين والمناسبات: «Panjenengan badhe tindak dhateng pundi?»
        فلـ«إلى أين تذهب؟» أربع صور: ngoko lugu · ngoko alus · krama lugu · krama alus. وعند الشك مع الكبير فـ krama alus لا تخطئ.
      en: |
        Krama has two steps too:
        - krama lugu (plain krama): all krama words, no honorifics. Polite but everyday: a seller, a stranger your age. "Sampeyan badhe kesah dhateng pundi?"
        - krama alus (refined krama): krama plus krama inggil. Elders, teachers, formal occasions. "Panjenengan badhe tindak dhateng pundi?"
        So "Where are you going?" has four versions: ngoko lugu · ngoko alus · krama lugu · krama alus. Unsure with an elder? Krama alus is never wrong.
    grammar: jv.speechlevel.mixed
    examples:
      - text: Sampeyan badhe kesah dhateng pundi?
        ar_eg: حضرتك رايح على فين؟ (krama lugu)
        ar: إلى أين تذهب؟ (krama lugu)
        en: Where are you going? (krama lugu)
      - text: Panjenengan badhe tindak dhateng pundi?
        ar_eg: سيادتك رايح فين؟ (krama alus)
        ar: إلى أين تتوجّهون؟ (krama alus)
        en: Where are you going, sir? (krama alus)
  - title: Nembe
    body:
      ar_eg: |
        كلمة كراما مفيدة: nembe = لسه حالًا / لتوّي (بالإندونيسي baru). «Kula nembe wangsul saking Malioboro» = لسه راجع من ماليوبورو.
        وخلي بالك في krama alus: حتى لو الجملة كلها راقية، فعلك إنت يفضل كراما عادية (wangsul، kesah، nedha).
      ar: |
        كلمة كراما نافعة: nembe = لتوّي (وبالإندونيسية baru): «Kula nembe wangsul saking Malioboro» = عدتُ لتوّي من ماليوبورو.
        وفي krama alus يبقى فعلك أنت كراما عادية (wangsul، kesah، nedha) مهما ارتقت الجملة.
      en: |
        A handy krama word: nembe = just (now) (Indonesian baru). "Kula nembe wangsul saking Malioboro" = I've just got back from Malioboro.
        In krama alus, however refined the sentence, your own actions stay plain krama (wangsul, kesah, nedha).
    grammar: jv.speechlevel.mixed
    examples:
      - text: Kula nembe wangsul saking Malioboro.
        ar_eg: أنا لسه راجع من ماليوبورو.
        ar: عدتُ لتوّي من ماليوبورو.
        en: I've just got back from Malioboro.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ngoko lugu
        ar_eg: كله نغوكو (صحاب)
        ar: نغوكو خالصة (أصدقاء)
        en: all ngoko (friends)
      - text: ngoko alus
        ar_eg: نغوكو + krama inggil (قريب وأكبر)
        ar: نغوكو + krama inggil (قريب وأكبر)
        en: ngoko + krama inggil (close and senior)
      - text: krama lugu
        ar_eg: كراما من غير تبجيل (بياع، غريب)
        ar: كراما بلا تبجيل (بائع، غريب)
        en: krama without honorifics (seller, stranger)
      - text: krama alus
        ar_eg: كراما + krama inggil (الكبار)
        ar: كراما + krama inggil (الكبار)
        en: krama + krama inggil (elders)
    words: [krama lugu, krama alus, ngoko alus]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة krama lugu؟
      ar: أي جملة من krama lugu؟
      en: Which sentence is krama lugu?
    options: ['Panjenengan arep tindak menyang ngendi?', 'Sampeyan badhe kesah dhateng pundi?', 'Panjenengan badhe tindak dhateng pundi?']
    answer: 1
    explain:
      ar_eg: كل الكلمات كراما ومفيش krama inggil (sampeyan، kesah). الأولى ngoko alus، والتالتة krama alus.
      ar: كلها كراما بلا krama inggil (sampeyan، kesah)، والأولى ngoko alus، والثالثة krama alus.
      en: All krama, no krama inggil (sampeyan, kesah). The first is ngoko alus; the third is krama alus.
    words: [krama lugu]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: بتكلّم Pak Bambang، دكتور دِيماس في الجامعة وعنده ستين سنة. أنهي مستوى؟
      ar: تكلّم Pak Bambang، أستاذ ديماس في الجامعة وعمره ستون عامًا. أي مستوى؟
      en: You're talking to Pak Bambang, Dimas's 60-year-old lecturer. Which level?
    options: [ngoko alus, krama lugu, krama alus]
    answer: 2
    explain:
      ar_eg: "كبير ومش قريب منك: krama alus. ngoko alus للقريبين بس."
      ar: كبير غير قريب فله krama alus، وngoko alus للمقرّبين.
      en: "Senior and not close to you: krama alus. ngoko alus is for people you're close to."
    words: [krama alus]
  - id: e04
    type: listen
    text: Kula nembe wangsul saking Malioboro.
    options: ['Kula nembe wangsul saking Malioboro.', 'Kula badhe wangsul saking Malioboro.', 'Kula dereng wangsul saking Malioboro.']
    answer: 0
    meaning:
      ar_eg: أنا لسه راجع من ماليوبورو.
      ar: عدتُ لتوّي من ماليوبورو.
      en: I've just got back from Malioboro.
    words: [nembe]
  - id: e05
    type: fill_blank
    sentence: Panjenengan badhe ___ dhateng pundi, Pak?
    meaning:
      ar_eg: (krama alus) سيادتك رايح فين يا أستاذ؟
      ar: (krama alus) إلى أين تتوجّه يا سيدي؟
      en: (krama alus) Where are you going, sir?
    options: [kesah, tindak, lunga]
    answers: [tindak]
    explain:
      ar_eg: krama alus = كراما + krama inggil لأفعاله، يبقى tindak. kesah تبقى krama lugu، وlunga نغوكو.
      ar: krama alus = كراما + krama inggil لأفعاله فتكون tindak، وkesah لـ krama lugu، وlunga نغوكو.
      en: krama alus = krama + krama inggil for his actions, so tindak. kesah would be krama lugu; lunga is ngoko.
    words: [krama alus, tindak]
  - id: e06
    type: fill_blank
    sentence: Kula ___ wangsul, Bu.
    meaning:
      ar_eg: أنا لسه راجع حالًا يا هانم.
      ar: عدتُ لتوّي يا سيدتي.
      en: I've only just got back, ma'am.
    options: [nembe, dereng, badhe]
    answers: [nembe]
    words: [nembe]
    explain:
      ar_eg: nembe = لسه حالًا. dereng يعني لسه ما حصلش، وbadhe يعني هيحصل.
      ar: nembe = للتوّ، أما dereng فمعناه لم يحدث بعد، وbadhe سيحدث.
      en: nembe = just now. dereng means "not yet", badhe "going to".
  - id: e07
    type: build_sentence
    source:
      ar_eg: (krama lugu، لبياع في سنّك) حضرتك رايح على فين؟
      ar: (krama lugu، لبائع في سنّك) إلى أين تذهب؟
      en: (krama lugu, to a seller your age) Where are you going?
    answer: Sampeyan badhe kesah dhateng pundi?
    distractors: [tindak, panjenengan]
    words: [krama lugu]
    explain:
      ar_eg: "كراما لوجو: مع بيّاعة من سنّك، كراما عادي من غير krama inggil: sampeyan وkesah. tindak وpanjenengan تكريم زيادة."
      ar: "الكراما لوغو: مع بائعة في سنّك كراما عادية بلا krama inggil: sampeyan وkesah، أما tindak وpanjenengan فتكريم زائد."
      en: "Krama lugu: to a seller your age, plain krama without krama inggil, sampeyan and kesah. tindak and panjenengan honour too much."
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (krama alus، لـ Pak Bambang) حضرتك أكلت يا أستاذ؟
      ar: (krama alus، إلى Pak Bambang) هل تفضّلت بالأكل يا سيدي؟
      en: (krama alus, to Pak Bambang) Have you eaten, sir?
    answers: ['Panjenengan sampun dhahar, Pak?', 'Pak, panjenengan sampun dhahar?', 'Bapak sampun dhahar?', 'Sampun dhahar, Pak?', 'Panjenengan sampun dhahar?']
    words: [krama alus, dhahar]
  - id: e09
    type: speaking
    text: Nyuwun sewu, Pak, kula nembe wangsul saking Malioboro.
    meaning:
      ar_eg: لا مؤاخذة يا أستاذ، أنا لسه راجع من ماليوبورو.
      ar: عفوًا يا سيدي، عدتُ لتوّي من ماليوبورو.
      en: Excuse me, sir, I've just got back from Malioboro.
    words: [nembe]
dialogue:
  title: Pak Bambang ing Kotabaru
  lines:
    - speaker: Pak Bambang
      text: Mas Mohamed, saking pundi?
      ar_eg: يا محمد، جاي منين؟
      ar: يا محمد، من أين أتيت؟
      en: Mohamed, where have you been?
    - speaker: Mohamed
      text: Kula nembe wangsul saking Malioboro, Pak. Panjenengan badhe tindak dhateng pundi?
      ar_eg: لسه راجع من ماليوبورو يا أستاذ. وحضرتك رايح فين؟
      ar: عدتُ لتوّي من ماليوبورو يا سيدي. وإلى أين تتوجّه؟
      en: I've just got back from Malioboro, sir. Where are you going?
    - speaker: Pak Bambang
      text: Kula badhe kesah dhateng kampus.
      ar_eg: أنا رايح الجامعة.
      ar: أنا ذاهب إلى الجامعة.
      en: I'm going to the campus.
    - speaker: Mohamed
      text: Mas Dimas sampun dhateng kampus, Pak.
      ar_eg: دِيماس راح الجامعة خلاص يا أستاذ.
      ar: ذهب ديماس إلى الجامعة يا سيدي.
      en: Dimas has already gone to campus, sir.
    - speaker: Pak Bambang
      text: Inggih, matur nuwun, Mas.
      ar_eg: ماشي، شكرًا يا ابني.
      ar: حسنًا، شكرًا يا بني.
      en: All right, thank you.
new_words:
  - word: krama lugu
    pos: noun
    ar_eg: كراما سادة (من غير krama inggil)
    ar: كراما خالصة (بلا krama inggil)
    en: plain krama (without krama inggil)
  - word: krama alus
    pos: noun
    ar_eg: كراما كاملة (كراما + krama inggil، للكبار)
    ar: كراما رفيعة (كراما + krama inggil، للكبار)
    en: refined krama (krama + krama inggil, for elders)
  - word: nembe
    pos: adverb
    ar_eg: لسه حالًا / لتوّي (كراما)
    ar: لتوّه (كراما)
    en: just (now) (krama) = baru
