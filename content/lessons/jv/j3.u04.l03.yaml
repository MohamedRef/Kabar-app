schema: kabar.lesson/v1
id: j3.u04.l03
language: jv
title: Margi dhateng kitha
can_do:
  ar_eg: تسأل عن الطريق للمدينة بالكراما، وتفهم هنا وهناك وجنب الطريق والمسافة.
  ar: أن تسأل عن الطريق إلى المدينة بالكراما، وتفهم هناك وجانب الطريق والمسافة.
  en: Ask the way to town in krama, and understand there, over there, roadside and distance.
slides:
  - title: Margi lan kitha
    body:
      ar_eg: |
        وانت بتسأل عن الطريق:
        - dalan ← margi = طريق، kutha ← kitha = مدينة
        - kono ← ngriku = هناك (جنب اللي بتكلمه)، kana ← ngrika = هناك (بعيد عنكم انتو الاتنين)
        - dhuwur ← inggil = عالي
        pinggir = جنب، طرف: ing pinggir margi = على جنب الطريق. jarak = مسافة. dawa = طويل. arah = اتجاه.
      ar: |
        حين تسأل عن الطريق:
        - dalan ← margi = طريق، kutha ← kitha = مدينة
        - kono ← ngriku = هناك (قرب من تخاطبه)، kana ← ngrika = هناك (بعيدًا عنكما)
        - dhuwur ← inggil = عالٍ
        pinggir = جانب، طرف: ing pinggir margi = على جانب الطريق. jarak = مسافة. dawa = طويل. arah = اتجاه.
      en: |
        Asking the way:
        - dalan → margi = road, kutha → kitha = town, city
        - kono → ngriku = there (near the person you're talking to), kana → ngrika = over there (far from you both)
        - dhuwur → inggil = high, tall
        pinggir = edge, side: ing pinggir margi = by the roadside. jarak = distance. dawa = long. arah = direction.
    examples:
      - text: Nyuwun sewu, margi dhateng kitha pundi?
        ar_eg: لا مؤاخذة، الطريق للمدينة منين؟
        ar: عفوًا، أين الطريق إلى المدينة؟
        en: Excuse me, which way to town?
      - text: Masjidipun ing pinggir margi, ing ngrika.
        ar_eg: الجامع على جنب الطريق، هناك.
        ar: المسجد على جانب الطريق، هناك.
        en: The mosque is by the roadside, over there.
      - text: Margi menika dawa sanget.
        ar_eg: الطريق ده طويل أوي.
        ar: هذا الطريق طويل جدًا.
        en: This road is very long.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: margi
        ar_eg: طريق (كراما)
        ar: طريق (كراما)
        en: road (krama)
      - text: kitha
        ar_eg: مدينة (كراما)
        ar: مدينة (كراما)
        en: town (krama)
      - text: arah
        ar_eg: اتجاه
        ar: اتجاه
        en: direction
      - text: jarak
        ar_eg: مسافة
        ar: مسافة
        en: distance
    words: [margi, kitha, arah, jarak]
  - id: e02
    type: match_pairs
    pairs:
      - text: ngriku
        ar_eg: هناك جنبك (كراما)
        ar: هناك قربك (كراما)
        en: there, near you (krama)
      - text: ngrika
        ar_eg: هناك بعيد (كراما)
        ar: هناك بعيدًا (كراما)
        en: over there (krama)
      - text: inggil
        ar_eg: عالي (كراما)
        ar: عالٍ (كراما)
        en: high, tall (krama)
      - text: dawa
        ar_eg: طويل
        ar: طويل
        en: long
    words: [ngriku, ngrika, inggil, dawa]
  - id: e03
    type: listen
    text: Masjidipun ing pinggir margi.
    question:
      ar_eg: الجامع فين؟
      ar: أين المسجد؟
      en: Where is the mosque?
    options: [في نص البلد, على جنب الطريق, فوق الجبل]
    answer: 1
    meaning:
      ar_eg: الجامع على جنب الطريق.
      ar: المسجد على جانب الطريق.
      en: The mosque is by the roadside.
    words: [pinggir, margi]
  - id: e04
    type: fill_blank
    sentence: Nyuwun sewu, ___ dhateng kitha pundi?
    meaning:
      ar_eg: لا مؤاخذة، ___ للمدينة منين؟
      ar: عفوًا، أين ___ إلى المدينة؟
      en: Excuse me, which ___ to town?
    options: [margi, jarak, inggil]
    answers: [margi]
    words: [margi, jarak, inggil, kitha]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «هناك» (بعيد عنكم انتو الاتنين) بالكراما؟
      ar: «هناك» (بعيدًا عنكما) بالكراما؟
      en: '"Over there" (far from you both) in krama?'
    options: [ngriku, arah, ngrika]
    answer: 2
    explain:
      ar_eg: kana ← ngrika (بعيد عن الاتنين)، kono ← ngriku (جنب اللي بتكلمه).
      ar: kana ← ngrika (بعيد عن الطرفين)، kono ← ngriku (قرب المخاطَب).
      en: kana → ngrika (far from both), kono → ngriku (near the listener).
    words: [ngriku, arah, ngrika]
  - id: e06
    type: fill_blank
    sentence: Menara masjid menika ___ sanget.
    meaning:
      ar_eg: مدنة الجامع ده ___ أوي.
      ar: مئذنة هذا المسجد ___ جدًا.
      en: This mosque's minaret is very ___.
    options: [inggil, dawa, arah]
    answers: [inggil]
    words: [inggil, dawa, arah]
  - id: e07
    type: build_sentence
    source:
      ar_eg: المحطة هناك يا عم.
      ar: المحطة هناك يا سيدي.
      en: The station's there, sir.
    answer: Stasiunipun ing ngriku, Pak.
    distractors: [jarak, margi]
    words: [ngriku]
  - id: e08
    type: translate
    direction: from_target
    source_text: Jarakipun saking mriki dhateng kitha pinten?
    answers_meaning:
      ar_eg: [المسافة من هنا للمدينة قد إيه؟, المدينة بعيدة عن هنا قد إيه؟]
      ar: [كم المسافة من هنا إلى المدينة؟]
      en: ['How far is it from here to town?', 'What''s the distance from here to the city?']
    words: [jarak, kitha]
  - id: e09
    type: speaking
    text: Margi menika dawa sanget.
    meaning:
      ar_eg: الطريق ده طويل أوي.
      ar: هذا الطريق طويل جدًا.
      en: This road is very long.
    words: [margi, dawa]
  - id: e10
    type: multiple_choice
    question: Kono (ngoko) → ___ (krama)
    options: [ngriku, ngrika, dawa]
    answer: 0
    explain:
      ar_eg: kono ← ngriku = هناك (جنب اللي قدامك). kana ← ngrika.
      ar: kono ← ngriku = هناك (قرب المخاطَب). kana ← ngrika.
      en: kono → ngriku = there (near the listener). kana → ngrika.
    words: [ngriku, ngrika, dawa]
dialogue:
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Pak. Margi dhateng kitha pundi?
      ar_eg: لا مؤاخذة يا عم. الطريق للمدينة منين؟
      ar: عفوًا يا سيدي. أين الطريق إلى المدينة؟
      en: Excuse me, sir. Which way to town?
    - speaker: Bapak
      text: "Lurus mawon, mangke ngiwa."
      ar_eg: "على طول، وبعدين شمال."
      ar: "امشِ مستقيمًا، ثم يسارًا."
      en: "Straight on, then left."
    - speaker: Mohamed
      text: Jarakipun tebih, Pak?
      ar_eg: المسافة بعيدة يا عم؟
      ar: هل المسافة بعيدة يا سيدي؟
      en: Is it far, sir?
    - speaker: Bapak
      text: "Mboten. Kitha ten ngrika, wonten menara masjid sing inggil."
      ar_eg: "لأ. المدينة هناك، فيه مدنة جامع عالية."
      ar: "لا. المدينة هناك، حيث مئذنة مسجد عالية."
      en: "No. Town's over there, where there's a tall minaret."
    - speaker: Mohamed
      text: Masjid ing pinggir margi menika?
      ar_eg: الجامع اللي على جنب الطريق ده؟
      ar: المسجد الذي على جانب هذا الطريق؟
      en: The mosque by this road?
    - speaker: Bapak
      text: "Nggih, leres. Ati-ati, Mas."
      ar_eg: "أيوه، مظبوط. خلي بالك يا ابني."
      ar: "نعم، صحيح. انتبه لنفسك."
      en: "Yes, that's it. Take care."
