schema: kabar.lesson/v1
id: j1.u05.l01
language: jv
title: Ora, gak, dudu
can_do:
  ar_eg: تنفي الفعل والاسم بالجاوي.
  ar: أن تنفي الفعل والاسم بالجاوية.
  en: Negate verbs and nouns.
slides:
  - title: ora = tidak
    body:
      ar_eg: |
        أهلًا بيك على شط كنجران في سورابايا! النهارده هنتعلم نقول «لأ» و«مش».
        إنت عارف من الإندونيسي إن tidak بتنفي الفعل والصفة. في الجاوي اللي بتعمل كده هي **ora**:
        - Saya tidak mengerti → Aku ora ngerti (أنا مش فاهم). ngerti = mengerti.
        - Harganya tidak mahal → Regané ora larang (السعر مش غالي).
        في الشات بتتكتب ra: «Aku ra ngerti».
      ar: |
        مرحبًا بك على شاطئ كنجران في سورابايا! نتعلم اليوم النفي.
        تعرف من الإندونيسية أن tidak تنفي الفعل والصفة، ونظيرها الجاوي **ora**:
        - Saya tidak mengerti → Aku ora ngerti (لا أفهم)، وngerti = mengerti.
        - Harganya tidak mahal → Regané ora larang (السعر ليس غاليًا).
        وتُكتب في الدردشة ra: «Aku ra ngerti».
      en: |
        Welcome to Kenjeran beach in Surabaya! Today: saying "not".
        You know Indonesian tidak negates verbs and adjectives. In Javanese that job belongs to **ora**:
        - Saya tidak mengerti → Aku ora ngerti (I don't understand). ngerti = mengerti.
        - Harganya tidak mahal → Regané ora larang (The price isn't expensive).
        Chats write ra: "Aku ra ngerti".
    grammar: jv.negation.ora-dudu
    examples:
      - text: Aku ora ngerti.
        ar_eg: أنا مش فاهم.
        ar: لا أفهم.
        en: I don't understand.
      - text: Regané ora larang.
        ar_eg: السعر مش غالي.
        ar: السعر ليس غاليًا.
        en: The price isn't expensive.
  - title: gak (Arek, Suroboyo)
    body:
      ar_eg: |
        هنا في سورابايا هتسمع **gak** بدل ora. دي كلمة لهجة Arek (جاوي سورابايا)، ومعناها نفس ora بالظبط:
        - Aku gak ngerti, rek = أنا مش فاهم يا جماعة.
        - في الشات: gk أو ga.
        وإنت ممكن تكون سمعت gak في الإندونيسي العامي كمان («gak apa-apa»)، فهي كلمة سهلة. بس خلي بالك: في سولو ويوجيا (من J2) هنقول ora.
      ar: |
        ستسمع في سورابايا **gak** بدل ora، وهي من لهجة Arek (جاوية سورابايا) وبمعناها تمامًا:
        - Aku gak ngerti, rek = لا أفهم يا جماعة.
        - وفي الدردشة gk أو ga.
        وربما سمعت gak في العامية الإندونيسية أيضًا، أما في سولو ويوجيا (من J2) فنقول ora.
      en: |
        Here in Surabaya you'll hear **gak** instead of ora. It's Arek (Surabaya Javanese) and means exactly the same:
        - Aku gak ngerti, rek = I don't get it, guys.
        - Chats: gk or ga.
        You may know gak from casual Indonesian too, so it's an easy one. In Solo and Yogya (from J2) we'll say ora.
    grammar: jv.negation.ora-dudu
    examples:
      - text: Aku gak ngerti, rek.
        ar_eg: أنا مش فاهم يا جماعة. (Arek)
        ar: لا أفهم يا جماعة. (Arek)
        en: I don't get it, guys. (Arek)
      - text: Kopiné gak larang.
        ar_eg: القهوة مش غالية. (Arek)
        ar: القهوة ليست غالية. (Arek)
        en: The coffee isn't expensive. (Arek)
  - title: dudu = bukan
    body:
      ar_eg: |
        وزي ما الإندونيسي عنده bukan للاسم، الجاوي عنده **dudu**:
        - Ini bukan kopi saya → Iki dudu kopiku (دي مش قهوتي).
        - Bukan saya! → Dudu aku! (مش أنا!)
        المصري بيقول «مش» لكل حاجة («مش فاهم»، «مش أنا»)، وعشان كده بنلخبط. افتكر: ora ≈ «لا» قبل الفعل والصفة، dudu ≈ «ليس» قبل الاسم.
        وdudu هي هي في سورابايا كمان.
      ar: |
        وكما تنفي bukan الاسمَ في الإندونيسية، تنفيه **dudu** في الجاوية:
        - Ini bukan kopi saya → Iki dudu kopiku (هذه ليست قهوتي).
        - Bukan saya! → Dudu aku! (لستُ أنا!)
        تنفي «مش» المصرية كل شيء، ولذلك نخلط بينهما. تذكّر: ora ≈ «لا» قبل الفعل والصفة، وdudu ≈ «ليس» قبل الاسم. وdudu هي نفسها في سورابايا.
      en: |
        Just as Indonesian has bukan for nouns, Javanese has **dudu**:
        - Ini bukan kopi saya → Iki dudu kopiku (This isn't my coffee).
        - Bukan saya! → Dudu aku! (Not me!)
        Egyptian «مش» negates everything, which is why Arabic speakers mix these up. Remember: ora ≈ «لا» before verbs and adjectives, dudu ≈ «ليس» before nouns.
        Surabaya uses dudu too.
    grammar: jv.negation.ora-dudu
    examples:
      - text: Iki dudu kopiku.
        ar_eg: دي مش قهوتي.
        ar: هذه ليست قهوتي.
        en: This isn't my coffee.
      - text: Aku dudu wong Jawa, aku wong Mesir.
        ar_eg: أنا مش جاوي، أنا مصري.
        ar: لستُ جاويًّا، أنا مصري.
        en: I'm not Javanese, I'm Egyptian.
  - title: Ora ana, rapopo, durung
    body:
      ar_eg: |
        تلات حاجات صغيرة بتتقال كل يوم:
        - **ora ana** = tidak ada = مفيش. وفي سورابايا: gak onok (هنشوفها الدرس الجاي).
        - **ora apa-apa** = tidak apa-apa = ولا يهمك / مفيش مشكلة. في الكلام والشات: rapopo.
        - وفاكر **durung** (لسه)؟ لما حد يسألك «Wis mangan?» (كلت؟) الرد المؤدب «Durung» (لسه)، مش «Ora».
      ar: |
        ثلاث عبارات يومية:
        - **ora ana** = tidak ada = لا يوجد، وفي سورابايا gak onok (في الدرس القادم).
        - **ora apa-apa** = tidak apa-apa = لا بأس، وفي الكلام والدردشة rapopo.
        - وتذكّر **durung** (لم ... بعد): جواب «Wis mangan?» (هل أكلت؟) المهذب هو «Durung» لا «Ora».
      en: |
        Three everyday bits:
        - **ora ana** = tidak ada = there isn't any. Surabaya: gak onok (next lesson).
        - **ora apa-apa** = tidak apa-apa = no problem. Spoken and chat: rapopo.
        - Remember **durung** (not yet)? When someone asks "Wis mangan?" (Have you eaten?), the natural answer is "Durung" (not yet), not "Ora".
    grammar: jv.negation.ora-dudu
    examples:
      - text: Rapopo, Mas.
        ar_eg: ولا يهمك يا أستاذ.
        ar: لا بأس يا أخي.
        en: It's fine, no problem.
      - text: Wis mangan? — Durung.
        ar_eg: كلت؟ — لسه.
        ar: هل أكلت؟ — ليس بعد.
        en: Have you eaten? — Not yet.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ora
        ar_eg: مش (قبل الفعل والصفة) = tidak
        ar: لا (قبل الفعل والصفة) = tidak
        en: not (verbs, adjectives) = tidak
      - text: dudu
        ar_eg: مش (قبل الاسم) = bukan
        ar: ليس (قبل الاسم) = bukan
        en: not (nouns) = bukan
      - text: ora ana
        ar_eg: مفيش = tidak ada
        ar: لا يوجد = tidak ada
        en: there isn't = tidak ada
      - text: durung
        ar_eg: لسه = belum
        ar: ليس بعد = belum
        en: not yet = belum
      - text: ngerti
        ar_eg: يفهم = mengerti
        ar: يفهم = mengerti
        en: understand = mengerti
    words: [ora, dudu, ora ana, durung, ngerti]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة بتنفي الاسم (زي bukan)؟
      ar: أيّ كلمة تنفي الاسم (مثل bukan)؟
      en: Which word negates a noun (like bukan)?
    options: ["dudu", "ora", "durung"]
    answer: 0
    explain:
      ar_eg: dudu = bukan، للاسم. ora = tidak، للفعل والصفة.
      ar: dudu = bukan للاسم، وora = tidak للفعل والصفة.
      en: dudu = bukan, for nouns. ora = tidak, for verbs and adjectives.
    words: [dudu]
  - id: e03
    type: multiple_choice
    question: Aku gak ngerti, rek.
    question_meaning:
      ar_eg: gak هنا (Arek) بتساوي إيه في النغوكو العادي؟
      ar: بماذا تقابل gak (Arek) هنا في النغوكو القياسي؟
      en: In standard ngoko, gak here equals…
    options: ["ora", "dudu", "durung"]
    answer: 0
    explain:
      ar_eg: gak هي ora بتاعة سورابايا، قبل الفعل ngerti.
      ar: gak هي ora في لهجة سورابايا، وجاءت قبل الفعل ngerti.
      en: gak is Surabaya's ora, here before the verb ngerti.
    words: [gak, ora]
  - id: e04
    type: listen
    text: Aku ora ngerti.
    options: ["Aku durung ngerti.", "Aku ora ngerti.", "Aku wis ngerti."]
    answer: 1
    words: [ora, ngerti]
  - id: e05
    type: fill_blank
    sentence: Iki ___ kopiku.
    meaning:
      ar_eg: دي مش قهوتي.
      ar: هذه ليست قهوتي.
      en: This isn't my coffee.
    options: ["dudu", "gak", "ora"]
    answers: ["dudu"]
    explain:
      ar_eg: kopiku اسم (قهوتي)، والاسم بيتنفي بـ dudu زي bukan. ora وgak للفعل والصفة.
      ar: kopiku اسم فيُنفى بـ dudu كما في bukan، أما ora وgak فللفعل والصفة.
      en: kopiku is a noun, so it takes dudu (like bukan). ora and gak are for verbs and adjectives.
    words: [dudu, kopi]
  - id: e06
    type: fill_blank
    sentence: Regané ___ larang, Mas.
    meaning:
      ar_eg: السعر مش غالي يا أستاذ.
      ar: السعر ليس غاليًا يا أخي.
      en: The price isn't expensive, Mas.
    options: ["durung", "ora", "dudu"]
    answers: ["ora"]
    explain:
      ar_eg: larang (غالي) صفة، فبتاخد ora (= tidak).
      ar: larang (غالٍ) صفة فتُنفى بـ ora (= tidak).
      en: larang (expensive) is an adjective, so it takes ora (= tidak).
    words: [ora, larang]
  - id: e07
    type: fill_blank
    sentence: Kowé wis mangan? — ___.
    meaning:
      ar_eg: إنت كلت؟ — لسه.
      ar: هل أكلت؟ — ليس بعد.
      en: Have you eaten? — Not yet.
    options: ["Durung", "Dudu", "Ora ana"]
    answers: ["Durung"]
    explain:
      ar_eg: على سؤال فيه wis (خلاص)، الرد الطبيعي durung (لسه)، زي belum في الإندونيسي.
      ar: جواب السؤال بـ wis هو durung (ليس بعد)، كما تجيب بـ belum في الإندونيسية.
      en: A wis question (already?) is answered with durung (not yet), like Indonesian belum.
    words: [durung, wis]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا مش جاوي، أنا مصري.
      ar: لستُ جاويًّا، أنا مصري.
      en: I'm not Javanese, I'm Egyptian.
    answer: Aku dudu wong Jawa, aku wong Mesir.
    distractors: ["ora", "gak"]
    explain:
      ar_eg: wong Jawa اسم (واحد جاوي)، فالنفي dudu مش ora.
      ar: wong Jawa اسم فيُنفى بـ dudu لا ora.
      en: wong Jawa is a noun phrase, so it takes dudu, not ora.
    words: [dudu, wong]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: أنا مش فاهم.
      ar: لا أفهم.
      en: I don't understand.
    answers: ["Aku ora ngerti.", "Aku ora ngerti", "Aku gak ngerti.", "Aku gak ngerti", "Aku ra ngerti.", "Aku ra ngerti", "Ora ngerti.", "Ora ngerti", "Gak ngerti.", "Gak ngerti"]
    explain:
      ar_eg: ora (أو gak في سورابايا) قبل الفعل ngerti.
      ar: ora (أو gak في سورابايا) قبل الفعل ngerti.
      en: ora (or Surabaya gak) before the verb ngerti.
    words: [ora, ngerti]
  - id: e10
    type: translate
    direction: from_target
    source_text: Iki dudu kopiku.
    answers_meaning:
      ar_eg: ["دي مش قهوتي", "دي مش قهوتي.", "دي مش القهوة بتاعتي", "ده مش قهوتي"]
      ar: ["هذه ليست قهوتي", "هذه ليست قهوتي.", "هذا ليس قهوتي"]
      en: ["This isn't my coffee", "This isn't my coffee.", "This is not my coffee", "This is not my coffee."]
    words: [dudu, kopi]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ولا يهمك يا أستاذ، مفيش مشكلة.
      ar: لا بأس يا أخي.
      en: It's fine, Mas, no problem.
    answers: ["Rapopo, Mas.", "Rapopo, Mas", "Rapopo Mas.", "Rapopo Mas", "Ora apa-apa, Mas.", "Ora apa-apa, Mas", "Ora apa-apa Mas.", "Ora apa-apa Mas", "Mas, rapopo.", "Mas, rapopo", "Mas rapopo.", "Mas rapopo"]
    explain:
      ar_eg: ora apa-apa = tidak apa-apa، وفي الكلام بتتختصر rapopo.
      ar: ora apa-apa = tidak apa-apa، وتُختصر في الكلام إلى rapopo.
      en: ora apa-apa = tidak apa-apa; in speech it shrinks to rapopo.
    words: [rapopo, ora apa-apa]
  - id: e12
    type: dictation
    text: Aku ora ngerti.
    meaning:
      ar_eg: أنا مش فاهم.
      ar: لا أفهم.
      en: I don't understand.
    words: [ora, ngerti]
  - id: e13
    type: speaking
    text: Aku dudu wong Jawa, aku wong Mesir.
    meaning:
      ar_eg: أنا مش جاوي، أنا مصري.
      ar: لستُ جاويًّا، أنا مصري.
      en: I'm not Javanese, I'm Egyptian.
    words: [dudu]
dialogue:
  title: Kopi sapa?
  lines:
    - speaker: Cak Heru
      text: Mohamed, iki kopimu?
      ar_eg: يا محمد، دي قهوتك؟
      ar: يا محمد، أهذه قهوتك؟
      en: Mohamed, is this your coffee?
    - speaker: Mohamed
      text: Dudu, Cak. Aku teh ae.
      ar_eg: لأ يا معلم. أنا شاي بس.
      ar: لا يا أخي، أنا أشرب الشاي فقط.
      en: No, Cak. Just tea for me.
    - speaker: Cak Heru
      text: Lho, kopiné sapa?
      ar_eg: أمال القهوة بتاعة مين؟
      ar: إذن لمن القهوة؟
      en: Huh, then whose coffee is it?
    - speaker: Mohamed
      text: Aku ora ngerti, Cak. Dudu kopiku.
      ar_eg: مش عارف يا معلم. مش قهوتي.
      ar: لا أدري يا أخي، ليست قهوتي.
      en: I don't know, Cak. It's not my coffee.
    - speaker: Cak Heru
      text: Rapopo. Tak ombé ae!
      ar_eg: ولا يهمك. هشربها أنا وخلاص!
      ar: لا بأس، سأشربها أنا!
      en: No problem. I'll just drink it myself!
new_words:
  - word: ngerti
    pos: verb
    ar_eg: يفهم / يعرف (= mengerti)
    ar: يفهم (= mengerti)
    en: understand, know (= mengerti)
  - word: gak
    pos: particle
    ar_eg: مش / لأ (Arek، = ora)
    ar: لا / ليس (Arek، = ora)
    en: not, no (Arek, = ora)
  - word: dudu
    pos: particle
    ar_eg: مش، قبل الاسم (= bukan)
    ar: ليس، قبل الاسم (= bukan)
    en: not, before nouns (= bukan)
  - word: ora ana
    pos: phrase
    ar_eg: مفيش (= tidak ada)
    ar: لا يوجد (= tidak ada)
    en: there isn't any (= tidak ada)
  - word: ora apa-apa
    pos: phrase
    ar_eg: ولا يهمك / مفيش مشكلة (= tidak apa-apa)؛ في الكلام rapopo
    ar: لا بأس (= tidak apa-apa)؛ وفي الكلام rapopo
    en: no problem (= tidak apa-apa); spoken rapopo
  - word: wong Jawa
    pos: phrase
    ar_eg: واحد جاوي (= orang Jawa)
    ar: جاويّ (= orang Jawa)
    en: a Javanese person (= orang Jawa)
