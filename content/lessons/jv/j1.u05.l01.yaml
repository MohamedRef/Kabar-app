schema: kabar.lesson/v1
id: j1.u05.l01
language: jv
title: Ora, ra, dudu
can_do:
  ar_eg: تنفي الفعل والاسم بالجاوي.
  ar: أن تنفي الفعل والاسم بالجاوية.
  en: Negate verbs and nouns.
slides:
  - title: ora = tidak
    body:
      ar_eg: |
        أهلًا بيك على شط باراندجتريتيس، جنوب يوجيا! النهارده هنتعلم نقول «لأ» و«مش».
        إنت عارف من الإندونيسي إن tidak بتنفي الفعل والصفة. في الجاوي اللي بتعمل كده هي **ora**:
        - Saya tidak mengerti → Aku ora ngerti (أنا مش فاهم). ngerti = mengerti.
        - Harganya tidak mahal → Regane ora larang (السعر مش غالي).
        في الشات بتتكتب ra: «Aku ra ngerti».
      ar: |
        مرحبًا بك على شاطئ باراندجتريتيس جنوب يوجيا! نتعلم اليوم النفي.
        تعرف من الإندونيسية أن tidak تنفي الفعل والصفة، ونظيرها الجاوي **ora**:
        - Saya tidak mengerti → Aku ora ngerti (لا أفهم)، وngerti = mengerti.
        - Harganya tidak mahal → Regane ora larang (السعر ليس غاليًا).
        وتُكتب في الدردشة ra: «Aku ra ngerti».
      en: |
        Welcome to Parangtritis beach, south of Jogja! Today: saying "not".
        You know Indonesian tidak negates verbs and adjectives. In Javanese that job belongs to **ora**:
        - Saya tidak mengerti → Aku ora ngerti (I don't understand). ngerti = mengerti.
        - Harganya tidak mahal → Regane ora larang (The price isn't expensive).
        Chats write ra: "Aku ra ngerti".
    grammar: jv.negation.ora-dudu
    examples:
      - text: Aku ora ngerti.
        ar_eg: أنا مش فاهم.
        ar: لا أفهم.
        en: I don't understand.
      - text: Regane ora larang.
        ar_eg: السعر مش غالي.
        ar: السعر ليس غاليًا.
        en: The price isn't expensive.
  - title: ra (Jogja)
    body:
      ar_eg: |
        في شارع يوجيا وماديون ora بتتقصّر لـ **ra**، زي ما المصري بيقول «مش» بدل «ليس»:
        - Aku ra ngerti, cah = أنا مش فاهم يا جماعة.
        - Rapopo = ora apa-apa = ولا يهمك.
        - في الشات: gk أو ra. ممكن تسمع gak من ناس جايين من شرق جاوة أو في الإندونيسي العامي، بس إنت قول ora / ra.
      ar: |
        في كلام شارع يوجيا وماديون تُختصر ora إلى **ra**:
        - Aku ra ngerti, cah = لا أفهم يا جماعة.
        - Rapopo = ora apa-apa = لا بأس.
        - وفي الدردشة gk أو ra. وقد تسمع gak من أهل شرق جاوة أو في العامية الإندونيسية، أما أنت فقل ora / ra.
      en: |
        On the streets of Jogja and Madiun, ora shrinks to **ra**:
        - Aku ra ngerti, cah = I don't get it, guys.
        - Rapopo = ora apa-apa = no worries.
        - Chats: gk or ra. You may hear gak from East Javanese visitors or in casual Indonesian, but you say ora / ra.
    grammar: jv.dialect.arek
    examples:
      - text: Aku ra ngerti, cah.
        ar_eg: أنا مش فاهم يا جماعة.
        ar: لا أفهم يا جماعة.
        en: I don't get it, guys.
      - text: Kopine ra larang.
        ar_eg: القهوة مش غالية.
        ar: القهوة ليست غالية.
        en: The coffee isn't expensive.
  - title: dudu = bukan
    body:
      ar_eg: |
        وزي ما الإندونيسي عنده bukan للاسم، الجاوي عنده **dudu**:
        - Ini bukan kopi saya → Iki dudu kopiku (دي مش قهوتي).
        - Bukan saya! → Dudu aku! (مش أنا!)
        المصري بيقول «مش» لكل حاجة («مش فاهم»، «مش أنا»)، وعشان كده بنلخبط. افتكر: ora ≈ «لا» قبل الفعل والصفة، dudu ≈ «ليس» قبل الاسم.
      ar: |
        وكما تنفي bukan الاسمَ في الإندونيسية، تنفيه **dudu** في الجاوية:
        - Ini bukan kopi saya → Iki dudu kopiku (هذه ليست قهوتي).
        - Bukan saya! → Dudu aku! (لستُ أنا!)
        تنفي «مش» المصرية كل شيء، ولذلك نخلط بينهما. تذكّر: ora ≈ «لا» قبل الفعل والصفة، وdudu ≈ «ليس» قبل الاسم.
      en: |
        Just as Indonesian has bukan for nouns, Javanese has **dudu**:
        - Ini bukan kopi saya → Iki dudu kopiku (This isn't my coffee).
        - Bukan saya! → Dudu aku! (Not me!)
        Egyptian «مش» negates everything, which is why Arabic speakers mix these up. Remember: ora ≈ «لا» before verbs and adjectives, dudu ≈ «ليس» before nouns.
    grammar: jv.negation.ora-dudu
    examples:
      - text: Iki dudu kopiku.
        ar_eg: دي مش قهوتي.
        ar: هذه ليست قهوتي.
        en: This isn't my coffee.
      - text: Aku dudu wong Jawa, aku wong Mesir.
        ar_eg: أنا مش جاوي، أنا مصري.
        ar: لستُ جاويًّا، أنا مصري.
        en: I'm not Javanese, I'm Egyptian.
  - title: Ora ana, rapopo, durung
    body:
      ar_eg: |
        تلات حاجات صغيرة بتتقال كل يوم:
        - **ora ana** = tidak ada = مفيش.
        - **ora apa-apa** = tidak apa-apa = ولا يهمك / مفيش مشكلة. في الكلام والشات: rapopo.
        - وفاكر **durung** (لسه)؟ لما حد يسألك «Wis mangan?» (كلت؟) الرد المؤدب «Durung» (لسه)، مش «Ora».
      ar: |
        ثلاث عبارات يومية:
        - **ora ana** = tidak ada = لا يوجد.
        - **ora apa-apa** = tidak apa-apa = لا بأس، وفي الكلام والدردشة rapopo.
        - وتذكّر **durung** (لم ... بعد): جواب «Wis mangan?» (هل أكلت؟) المهذب هو «Durung» لا «Ora».
      en: |
        Three everyday bits:
        - **ora ana** = tidak ada = there isn't any.
        - **ora apa-apa** = tidak apa-apa = no problem. Spoken and chat: rapopo.
        - Remember **durung** (not yet)? When someone asks "Wis mangan?" (Have you eaten?), the natural answer is "Durung" (not yet), not "Ora".
    grammar: jv.negation.ora-dudu
    examples:
      - text: Rapopo, Mas.
        ar_eg: ولا يهمك يا أستاذ.
        ar: لا بأس يا أخي.
        en: It's fine, no problem.
      - text: Wis mangan? — Durung.
        ar_eg: كلت؟ — لسه.
        ar: هل أكلت؟ — ليس بعد.
        en: Have you eaten? — Not yet.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ora
        ar_eg: مش (قبل الفعل والصفة) = tidak
        ar: لا (قبل الفعل والصفة) = tidak
        en: not (verbs, adjectives) = tidak
      - text: dudu
        ar_eg: مش (قبل الاسم) = bukan
        ar: ليس (قبل الاسم) = bukan
        en: not (nouns) = bukan
      - text: ora ana
        ar_eg: مفيش = tidak ada
        ar: لا يوجد = tidak ada
        en: there isn't = tidak ada
      - text: durung
        ar_eg: لسه = belum
        ar: ليس بعد = belum
        en: not yet = belum
      - text: ngerti
        ar_eg: يفهم = mengerti
        ar: يفهم = mengerti
        en: understand = mengerti
      - text: wong Jawa
        ar_eg: واحد جاوي = orang Jawa
        ar: جاويّ = orang Jawa
        en: a Javanese person = orang Jawa
    words: [ora, dudu, ora ana, durung, ngerti, wong Jawa]
  - id: e02
    type: multiple_choice
    question: Iki ___ omahku.
    question_meaning:
      ar_eg: «ده مش بيتي». أنهي كلمة بتنفي الاسم (زي bukan)؟
      ar: «هذا ليس بيتي». أيّ كلمة تنفي الاسم (مثل bukan)؟
      en: 'This isn''t my house. Which word negates a noun (like bukan)?'
    options: [dudu, ora, durung]
    answer: 0
    explain:
      ar_eg: dudu = bukan، للاسم. ora = tidak، للفعل والصفة.
      ar: dudu = bukan للاسم، وora = tidak للفعل والصفة.
      en: dudu = bukan, for nouns. ora = tidak, for verbs and adjectives.
    words: [dudu, iki]
  - id: e03
    type: listen
    text: Aku ora ngerti.
    options: [Aku durung ngerti., Aku ora ngerti., Aku wis ngerti.]
    answer: 1
    words: [ora, ngerti]
  - id: e04
    type: fill_blank
    sentence: Iki ___ kopiku.
    meaning:
      ar_eg: دي مش قهوتي.
      ar: هذه ليست قهوتي.
      en: This isn't my coffee.
    options: [dudu, ora, durung]
    answers: [dudu]
    explain:
      ar_eg: kopiku اسم (قهوتي)، والاسم بيتنفي بـ dudu زي bukan. ora (وra) للفعل والصفة.
      ar: kopiku اسم فيُنفى بـ dudu كما في bukan، أما ora (وra) فللفعل والصفة.
      en: kopiku is a noun, so it takes dudu (like bukan). ora (ra) is for verbs and adjectives.
    words: [dudu, kopi, iki]
  - id: e05
    type: build_sentence
    source:
      ar_eg: أنا مش جاوي، أنا مصري.
      ar: لستُ جاويًّا، أنا مصري.
      en: I'm not Javanese, I'm Egyptian.
    answer: Aku dudu wong Jawa, aku wong Mesir.
    distractors: [ora, ora]
    explain:
      ar_eg: wong Jawa اسم (واحد جاوي)، فالنفي dudu مش ora.
      ar: wong Jawa اسم فيُنفى بـ dudu لا ora.
      en: wong Jawa is a noun phrase, so it takes dudu, not ora.
    words: [dudu, wong]
  - id: e06
    type: speaking
    text: Aku dudu wong Jawa, aku wong Mesir. Iki omahku, ora ana kopi.
    meaning:
      ar_eg: أنا مش جاوي، أنا مصري. ده بيتي، مفيش قهوة.
      ar: لستُ جاويًّا، أنا مصري. هذا بيتي، ولا توجد قهوة.
      en: I'm not Javanese, I'm Egyptian. This is my house; there's no coffee.
    words: [dudu, wong Jawa, ora ana, kopi, iki]
  - id: e07
    type: multiple_choice
    question: Kopine ora ana.
    question_meaning:
      ar_eg: البيّاع قال كده. يقصد إيه بالإندونيسي؟
      ar: قال البائع هذا. ماذا يقصد بالإندونيسية؟
      en: The seller says this. What does he mean in Indonesian?
    options: ['Kopinya tidak ada.', 'Ini bukan kopi.', 'Kopinya belum ada.']
    answer: 0
    explain:
      ar_eg: ora ana = tidak ada = مفيش. dudu = bukan، وdurung = belum.
      ar: ora ana = tidak ada = لا يوجد، وdudu = bukan، وdurung = belum.
      en: ora ana = tidak ada; dudu = bukan, durung = belum.
    words: [ora ana, kopi]
dialogue:
  title: Kopi sapa?
  lines:
    - speaker: Mas Heru
      text: Mohamed, iki kopimu?
      ar_eg: يا محمد، دي قهوتك؟
      ar: يا محمد، أهذه قهوتك؟
      en: Mohamed, is this your coffee?
    - speaker: Mohamed
      text: Dudu, Mas. Aku teh wae.
      ar_eg: لأ يا معلم. أنا شاي بس.
      ar: لا يا أخي، أنا أشرب الشاي فقط.
      en: No, Mas. Just tea for me.
    - speaker: Mas Heru
      text: Lho, kopine sapa?
      ar_eg: أمال القهوة بتاعة مين؟
      ar: إذن لمن القهوة؟
      en: Huh, then whose coffee is it?
    - speaker: Mohamed
      text: Aku ra ngerti, Mas. Dudu kopiku.
      ar_eg: مش عارف يا معلم. مش قهوتي.
      ar: لا أدري يا أخي، ليست قهوتي.
      en: I don't know, Mas. It's not my coffee.
    - speaker: Mas Heru
      text: Rapopo. Tak ombe wae!
      ar_eg: ولا يهمك. هشربها أنا وخلاص!
      ar: لا بأس، سأشربها أنا!
      en: No problem. I'll just drink it myself!
new_words:
  - word: dudu
    pos: particle
    ar_eg: مش، قبل الاسم (= bukan)
    ar: ليس، قبل الاسم (= bukan)
    en: not, before nouns (= bukan)
  - word: ora ana
    pos: phrase
    ar_eg: مفيش (= tidak ada)
    ar: لا يوجد (= tidak ada)
    en: there isn't any (= tidak ada)
  - word: wong Jawa
    pos: phrase
    ar_eg: واحد جاوي (= orang Jawa)
    ar: جاويّ (= orang Jawa)
    en: a Javanese person (= orang Jawa)
  - word: iki
    pos: pronoun
    ar_eg: ده / دي (= ini)
    ar: هذا / هذه (= ini)
    en: this (= ini)
review:
  status: draft
  verified: false
