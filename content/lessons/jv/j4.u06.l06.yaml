  - id: e03
    type: listen
    text: Dhalang nuthuk cempala.
    question:
      ar_eg: الدالانج بيعمل إيه؟
      ar: ماذا يفعل الدالانغ؟
      en: What is the dhalang doing?
    options: [الدالانج بيخبط بالمطرقة, الدالانج بيعزف ربابة, الدالانج بيغني]
    answer: 0
    meaning:
      ar_eg: الدالانج بيخبط بالمطرقة.
      ar: يطرق الدالانغ بالمطرقة.
      en: The dhalang strikes the cempala.
    words: [cempala]
  - id: e04
    type: fill_blank
    sentence: ___ Arjuna alus, mboten ageng.
    meaning:
      ar_eg: ___ أرجونا رفيعة، مش كبيرة.
      ar: ___ أرجونا دقيق لا كبير.
      en: Arjuna's ___ is fine, not big.
    options: [Granipun, Rebabipun, Pelogipun]
    answers: [Granipun]
    words: [grana, rebab, pelog]
    explain:
      ar_eg: مناخير العروسة الوايانج = granipun، وأرجونا مناخيره رفيعة. rebab آلة، وpelog سلّم.
      ar: أنف الدمية = granipun، وأنف أرجونا دقيق، أما rebab فآلة، وpelog سلّم.
      en: A puppet's nose is granipun, and Arjuna's is fine. rebab is an instrument, pelog a scale.
  - id: e05
    type: multiple_choice
    question: ___ Arjuna ndhingkluk, alus sanget.
    question_meaning:
      ar_eg: ___ أرجونا موطّية، رقيقة أوي.
      ar: ___ أرجونا مطرقتان، رقيقتان جدًّا.
      en: Arjuna's ___ are downcast, very gentle.
    options: [Cempala, Paningalipun, Janggane]
    answer: 1
    explain:
      ar_eg: paningal = عنين (krama inggil). jangga = رقبة، وcempala مطرقة.
      ar: paningal = عينان (krama inggil)، أما jangga فعنق وcempala مطرقة.
      en: paningal = eyes (krama inggil). jangga = neck, cempala = knocker.
    words: [paningal, cempala, jangga]
  - id: e06
    type: fill_blank
    sentence: Gendhing menika nganggo laras ___.
    meaning:
      ar_eg: المقطوعة دي على سلّم ___.
      ar: هذه المقطوعة على سلّم ___.
      en: This piece is in the ___ scale.
    options: [pelog, paningal, nelangsa]
    answers: [pelog]
    words: [pelog, paningal, nelangsa]
    explain:
      ar_eg: laras = سلّم، والسلّمين slendro وpelog. paningal عين الكبير، وnelangsa حزين.
      ar: laras = سلّم، والسلّمان slendro وpelog، أما paningal فعين الكبير، وnelangsa حزين.
      en: laras = scale, and the scales are slendro and pelog. paningal is an elder's eye, nelangsa "forlorn".
  - id: e07
    type: build_sentence
    source:
      ar_eg: الربابة والناي صوتهم حزين.
      ar: صوت الربابة والناي حزين.
      en: The rebab and the flute sound forlorn.
    answer: Rebab lan suling muni nelangsa.
    distractors: [cempala, grana]
    words: [rebab, suling, nelangsa, cempala, grana]
    explain:
      ar_eg: الربابة (rebab) والناي (suling) آلات بتطلع صوت. cempala مضرب الدالانج، وgrana مناخير.
      ar: الربابة (rebab) والناي (suling) آلتان تصدران صوتًا، أما cempala فمضرب الدالانغ، وgrana أنف.
      en: The rebab and suling are the instruments making sound. cempala is the dhalang's knocker, grana a nose.
  - id: e08
    type: translate
    direction: from_target
    source_text: Janggane wayang Arjuna dawa lan alus.
    answers_meaning:
      ar_eg: [رقبة عروسة أرجونا طويلة ورفيعة, رقبة أرجونا في الوايانج طويلة وناعمة]
      ar: [عنق دمية أرجونا طويل رقيق, عنق أرجونا في الوايانغ طويل ناعم]
      en: ['Arjuna''s puppet has a long, graceful neck', 'The Arjuna puppet''s neck is long and fine']
    words: [jangga]
  - id: e09
    type: speaking
    text: Kula nelangsa mireng rebab menika.
    meaning:
      ar_eg: قلبي اتقبض وأنا بسمع الربابة دي.
      ar: أشعر بالحزن وأنا أسمع هذه الربابة.
      en: This rebab makes me feel forlorn.
    words: [nelangsa, rebab]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: الآلة الجاوية اللي شبه الربابة المصري اسمها إيه؟
      ar: ما اسم الآلة الجاوية الشبيهة بالربابة المصرية؟
      en: Which Javanese instrument is like the Egyptian rababa?
    options: [suling, pelog, rebab]
    answer: 2
    explain:
      ar_eg: rebab = ربابة. suling ناي، وpelog سلّم موسيقي.
      ar: rebab = ربابة، أما suling فناي وpelog سلّم موسيقي.
      en: rebab = bowed fiddle. suling is a flute, pelog a scale.
    words: [rebab, suling, pelog]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak, kenging menapa wayang Arjuna alit lan alus?
      ar_eg: يا أستاذ، ليه عروسة أرجونا صغيرة ورقيقة؟
      ar: يا سيدي، لماذا دمية أرجونا صغيرة رقيقة؟
      en: Sir, why is the Arjuna puppet small and delicate?
    - speaker: Pak Harsono
      text: Arjuna satriya, Nak. Granipun alus, paningalipun ndhingkluk.
      ar_eg: أرجونا فارس يا ابني. مناخيره رفيعة وعنيه موطّية.
      ar: أرجونا فارس يا بنيّ؛ أنفه دقيق وعيناه مطرقتان.
      en: Arjuna is a knight, son. His nose is fine and his eyes downcast.
    - speaker: Mohamed
      text: Lajeng swanten menika menapa? Kados rebab ing Mesir.
      ar_eg: والصوت ده إيه؟ شبه الربابة في مصر.
      ar: وما هذا الصوت؟ يشبه الربابة في مصر.
      en: And what's that sound? It's like the rababa in Egypt.
    - speaker: Pak Harsono
      text: Leres, menika rebab. Wonten suling ugi.
      ar_eg: صح، دي ربابة. وفي ناي كمان.
      ar: صحيح، هذه ربابة، وهناك ناي أيضًا.
      en: Right, that's the rebab. There's a flute too.
    - speaker: Mohamed
      text: Gendhingipun nelangsa sanget, Pak.
      ar_eg: المقطوعة حزينة أوي يا أستاذ.
      ar: المقطوعة حزينة جدًّا يا سيدي.
      en: The music is so forlorn, sir.
    - speaker: Pak Harsono
      text: Inggih, menika laras pelog. Mirengaken, dhalang badhe nuthuk cempala.
      ar_eg: أيوه، ده سلّم بيلوج. اسمع، الدالانج هيخبط بالمطرقة.
      ar: نعم، هذا سلّم بيلوغ. اسمع، سيطرق الدالانغ بالمطرقة.
      en: Yes, it's in pelog. Listen, the dhalang is about to strike the cempala.
