schema: kabar.lesson/v1
id: j4.u06.l06
language: jv
title: Grana lan paningal wayang
can_do:
  ar_eg: تقرا شخصية عروسة الوايانج من وشّها بالـ krama inggil، وتعرف آلات المزيكا الحزينة.
  ar: أن تقرأ شخصية دمية الوايانغ من وجهها بالـ krama inggil، وتعرف آلات الموسيقى الحزينة.
  en: Read a wayang puppet's character from its face in krama inggil, and name the instruments of sad music.
slides:
  - title: Granipun alus, paningalipun ndhingkluk
    body:
      ar_eg: |
        بتعرف شخصية الوايانج من وشّها:
        - الساتريا ليه grana (مناخير، krama inggil) رفيعة، وpaningal (عنين، krama inggil) موطّية لتحت، يعني هادي ومتواضع. jangga = رقبة (krama inggil لـ gulu).
          الدالانج بيتكلم عن الساتريا بالـ krama inggil، والعملاق عنيه مدوّرة كبيرة.
        - cempala = المطرقة الخشب اللي الدالانج بيخبط بيها على صندوق الوايانج يدّي إشارة للغاميلان.
        - rebab = ربابة، زي الربابة عندنا! suling = ناي بامبو. pelog = السلّم التاني في الغاميلان (سبع نغمات).
        - nelangsa = حزين أوي ووحيد.
      ar: |
        تُعرف شخصية الوايانغ من وجهها:
        - للفارس grana (أنف، krama inggil) دقيق وpaningal (عينان، krama inggil) مطرقتان، أي هادئ متواضع. jangga = عنق (krama inggil لـ gulu).
          ويتكلم الدالانغ عن الفرسان بالـ krama inggil، أما العملاق فعيناه مستديرتان واسعتان.
        - cempala = المطرقة الخشبية التي يطرق بها الدالانغ صندوق الوايانغ إشارةً للغاميلان.
        - rebab = ربابة، كالربابة عندنا! suling = ناي من البامبو. pelog = السلّم الثاني في الغاميلان (سبع نغمات).
        - nelangsa = حزين جدًّا وحيد.
      en: |
        You can read a wayang puppet's character from its face:
        - A satriya has a fine grana (nose, krama inggil) and downcast paningal (eyes, krama inggil): calm and humble. jangga = neck (krama inggil for gulu).
          The dhalang speaks of knights in krama inggil; an ogre has big round eyes.
        - cempala = the wooden knocker the dhalang strikes on the puppet chest to cue the gamelan.
        - rebab = bowed fiddle, like our Egyptian rababa! suling = bamboo flute. pelog = gamelan's other scale (seven notes).
        - nelangsa = deeply sad and forlorn.
    examples:
      - text: Granipun Arjuna alus, paningalipun ndhingkluk.
        ar_eg: مناخير أرجونا رفيعة، وعنيه موطّية.
        ar: أنف أرجونا دقيق، وعيناه مطرقتان.
        en: Arjuna's nose is fine and his eyes are downcast.
      - text: Rebab lan suling muni nelangsa.
        ar_eg: الربابة والناي صوتهم حزين أوي.
        ar: صوت الربابة والناي حزين جدًّا.
        en: The rebab and the flute sound forlorn.
      - text: Dhalang nuthuk cempala.
        ar_eg: الدالانج بيخبط بالمطرقة.
        ar: يطرق الدالانغ بالمطرقة.
        en: The dhalang strikes the cempala.
