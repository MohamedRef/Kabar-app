schema: kabar.lesson/v1
id: j3.u03.l04
language: jv
title: Ulangan J3.3
can_do:
  ar_eg: تترجم جمل ngoko لكراما.
  ar: أن تحوّل جمل الـ ngoko إلى الكراما.
  en: Translate ngoko lines into krama.
slides:
  - title: Ngoko → krama
    body:
      ar_eg: |
        المراجعة دي كلها تحويل: تاخد جملة ngoko وتلبّسها بدلة الكراما. اعمل كده بالترتيب:
        ١. الضماير: aku ← kula، kowé ← sampéyan / panjenengan، dheweke ← piyambakipun.
        ٢. الكلمات الصغيرة: wis ← sampun، durung ← dèrèng، arep ← badhé، isih ← taksih، ora ← mboten، ana ← wonten، iya ← inggih، iki ← menika.
        ٣. حروف الجر: saka ← saking، nang ← dhateng، karo ← kaliyan، uga ← ugi.
        ٤. الكلمات اللي اتعلمتها: mangan ← nedha، ngerti ← ngertos، pasar ← peken، jeneng ← nami، omah ← griya.
      ar: |
        هذه المراجعة كلها تحويل: تأخذ جملة ngoko وتلبسها ثوب الكراما بالترتيب:
        ١. الضمائر: aku ← kula، kowé ← sampéyan / panjenengan، dheweke ← piyambakipun.
        ٢. الألفاظ الصغيرة: wis ← sampun، durung ← dèrèng، arep ← badhé، isih ← taksih، ora ← mboten، ana ← wonten، iya ← inggih، iki ← menika.
        ٣. حروف الجر: saka ← saking، nang ← dhateng، karo ← kaliyan، uga ← ugi.
        ٤. ما تعلمته من الأسماء والأفعال: mangan ← nedha، ngerti ← ngertos، pasar ← peken، jeneng ← nami، omah ← griya.
      en: |
        This review is all conversion: take a ngoko line and dress it in krama. Go in order:
        1. Pronouns: aku → kula, kowé → sampéyan / panjenengan, dheweke → piyambakipun.
        2. Small words: wis → sampun, durung → dèrèng, arep → badhé, isih → taksih, ora → mboten, ana → wonten, iya → inggih, iki → menika.
        3. Prepositions: saka → saking, nang → dhateng, karo → kaliyan, uga → ugi.
        4. Words you've learned: mangan → nedha, ngerti → ngertos, pasar → peken, jeneng → nami, omah → griya.
    grammar: jv.krama.function-words
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wis
        ar_eg: بالكراما sampun
        ar: بالكراما sampun
        en: in krama → sampun
      - text: durung
        ar_eg: بالكراما dèrèng
        ar: بالكراما dèrèng
        en: in krama → dèrèng
      - text: arep
        ar_eg: بالكراما badhé
        ar: بالكراما badhé
        en: in krama → badhé
      - text: isih
        ar_eg: بالكراما taksih
        ar: بالكراما taksih
        en: in krama → taksih
    words: [sampun, dèrèng, badhé, taksih]
  - id: e02
    type: match_pairs
    pairs:
      - text: ora
        ar_eg: بالكراما mboten
        ar: بالكراما mboten
        en: in krama → mboten
      - text: ana
        ar_eg: بالكراما wonten
        ar: بالكراما wonten
        en: in krama → wonten
      - text: saka
        ar_eg: بالكراما saking
        ar: بالكراما saking
        en: in krama → saking
      - text: nang
        ar_eg: بالكراما dhateng
        ar: بالكراما dhateng
        en: in krama → dhateng
      - text: karo
        ar_eg: بالكراما kaliyan
        ar: بالكراما kaliyan
        en: in krama → kaliyan
    words: [mboten, wonten, saking, dhateng, kaliyan]
  - id: e03
    type: multiple_choice
    question: Aku ora ngerti.
    question_meaning:
      ar_eg: أنهي نسخة كراما صح؟
      ar: أيّ نسخة كراما صحيحة؟
      en: Which krama version is right?
    options: ["Aku mboten ngerti.", "Kula ora ngertos.", "Kula mboten ngertos."]
    answer: 2
    explain:
      ar_eg: "لازم التلات كلمات يتبدلوا: aku ← kula، ora ← mboten، ngerti ← ngertos."
      ar: "تُبدّل الألفاظ الثلاثة: aku ← kula، وora ← mboten، وngerti ← ngertos."
      en: All three swap — aku → kula, ora → mboten, ngerti → ngertos.
    words: [kula, mboten, ngertos]
  - id: e04
    type: multiple_choice
    question: Dheweke durung mangan.
    question_meaning:
      ar_eg: أنهي نسخة كراما صح؟ (بتتكلم بأدب عن Bu Siti)
      ar: أيّ نسخة كراما صحيحة؟ (تتحدث بأدب عن Bu Siti)
      en: Which krama version is right? (speaking politely about Bu Siti)
    options: ["Piyambakipun sampun nedha.", "Dheweke dèrèng nedha.", "Piyambakipun dèrèng nedha."]
    answer: 2
    explain:
      ar_eg: dheweke ← piyambakipun، durung ← dèrèng (مش sampun، دي «خلاص»)، mangan ← nedha.
      ar: dheweke ← piyambakipun، وdurung ← dèrèng (لا sampun فمعناها «قد»)، وmangan ← nedha.
      en: dheweke → piyambakipun, durung → dèrèng (not sampun, which means "already"), mangan → nedha.
    words: [piyambakipun, dèrèng, nedha]
  - id: e05
    type: listen
    text: Kula taksih sinau krama.
    options: ["Aku isih sinau krama.", "Kula dèrèng sinau krama.", "Kula taksih sinau krama."]
    answer: 2
    words: [taksih]
  - id: e06
    type: fill_blank
    sentence: Bu Siti ___? — Mboten wonten.
    meaning:
      ar_eg: Bu Siti موجودة؟ — لأ، مش موجودة.
      ar: هل Bu Siti موجودة؟ — لا، ليست موجودة.
      en: Is Bu Siti in? — No, she isn't.
    options: ["sampun", "wonten", "ana"]
    answers: [wonten]
    words: [wonten]
  - id: e07
    type: build_sentence
    source:
      ar_eg: "Aku arep nang pasar karo Mas Dimas. ← بالكراما"
      ar: "Aku arep nang pasar karo Mas Dimas. ← بالكراما"
      en: "Aku arep nang pasar karo Mas Dimas. → in krama"
    answer: Kula badhé dhateng peken kaliyan Mas Dimas.
    distractors: [arep, karo, nang]
    words: [kula, badhé, dhateng, peken, kaliyan]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "حوّلها لكراما: Kowé wis mangan?"
      ar: "حوّلها إلى الكراما: Kowé wis mangan?"
      en: "Make it krama: Kowé wis mangan?"
    answers: ["Sampéyan sampun nedha?", "Sampeyan sampun nedha?", "Sampéyan sampun nedha", "Sampeyan sampun nedha", "Panjenengan sampun dhahar?", "Panjenengan sampun dhahar"]
    explain:
      ar_eg: "krama عادية: Sampéyan sampun nedha. ولو لحد كبير: Panjenengan sampun dhahar."
      ar: بالكراما العادية Sampéyan sampun nedha، وللكبير Panjenengan sampun dhahar.
      en: Plain krama is Sampéyan sampun nedha; for an elder, Panjenengan sampun dhahar.
    words: [sampéyan, sampun, nedha]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "حوّلها لكراما: Aku saka Mesir."
      ar: "حوّلها إلى الكراما: Aku saka Mesir."
      en: "Make it krama: Aku saka Mesir."
    answers: ["Kula saking Mesir.", "Kulo saking Mesir.", "Kula saking Mesir", "Kulo saking Mesir"]
    words: [kula, saking]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "حوّلها لكراما: Iya, aku isih sinau."
      ar: "حوّلها إلى الكراما: Iya, aku isih sinau."
      en: "Make it krama: Iya, aku isih sinau."
    answers: ["Inggih, kula taksih sinau.", "Inggih, kulo taksih sinau.", "Inggih, kula taksih sinau", "Inggih, kulo taksih sinau"]
    words: [inggih, kula, taksih]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "حوّلها لكراما: Iki omahku."
      ar: "حوّلها إلى الكراما: Iki omahku."
      en: "Make it krama: Iki omahku."
    answers: ["Menika griya kula.", "Menika griya kulo.", "Menika griya kula", "Menika griya kulo", "Niki griya kula.", "Niki griya kulo.", "Niki griya kula", "Niki griya kulo"]
    words: [menika, griya, kula]
  - id: e12
    type: translate
    direction: from_target
    source_text: Kula ugi dèrèng nedha.
    answers_meaning:
      ar_eg: ["أنا كمان لسه ماكلتش.", "وأنا كمان لسه ماكلتش", "أنا كمان لسه"]
      ar: ["وأنا أيضًا لم آكل بعد.", "أنا أيضًا لم آكل بعد"]
      en: ["I haven't eaten yet either.", "I haven't eaten yet, either", "Me neither, I haven't eaten yet"]
    words: [ugi, dèrèng, nedha]
  - id: e13
    type: dictation
    text: Kula mboten ngertos.
    meaning:
      ar_eg: أنا مش فاهم.
      ar: لا أفهم.
      en: I don't understand.
    words: [mboten, ngertos]
  - id: e14
    type: speaking
    text: Inggih, kula sampun nedha. Matur nuwun.
    meaning:
      ar_eg: أيوه، أنا كلت. شكرًا.
      ar: نعم، قد أكلتُ. شكرًا.
      en: Yes, I've eaten. Thank you.
    words: [inggih, sampun, nedha]
dialogue:
  title: Pamit saka Kauman
  lines:
    - speaker: Mas Dimas
      text: Mohamed, kowé wis mangan?
      ar_eg: يا محمد، كلت؟
      ar: يا محمد، هل أكلت؟
      en: Mohamed, have you eaten?
    - speaker: Mohamed
      text: Durung, Mas. Ayo mangan!
      ar_eg: لسه يا دِيماس. يلا ناكل!
      ar: ليس بعد يا ديماس. هيا نأكل!
      en: Not yet, Dimas. Let's eat!
    - speaker: Pak Harjo
      text: Mas Mohamed, sampéyan badhé nedha?
      ar_eg: يا أستاذ محمد، حضرتك رايح تاكل؟
      ar: يا محمد، هل ستذهب لتأكل؟
      en: Mohamed, are you going to eat?
    - speaker: Mohamed
      text: Inggih, Pak. Kula badhé nedha kaliyan Mas Dimas.
      ar_eg: أيوه يا عم. أنا رايح آكل مع دِيماس.
      ar: نعم يا سيدي. سأذهب لآكل مع ديماس.
      en: Yes, sir. I'm going to eat with Dimas.
    - speaker: Pak Harjo
      text: Inggih, mangga, Mas.
      ar_eg: ماشي، اتفضلوا يا أستاذ.
      ar: حسنًا، تفضلا يا أخي.
      en: All right, off you go.
    - speaker: Mohamed
      text: Matur nuwun, Pak.
      ar_eg: شكرًا يا عم.
      ar: شكرًا يا سيدي.
      en: Thank you, sir.
souvenir:
  id: j3.u03.souvenir
  title: Kampung Batik Kauman
  note:
    ar_eg: كاومان جنب الجامع الكبير في سولو (masjid، من الكلمة العربية «مسجد»). زمان كانت حي الناس اللي بيخدموا في الجامع، والنهارده مشهورة بالباتيك اللي بيتعمل في البيوت القديمة. ادخل أي محل وقول «Nyuwun sewu, wonten batik?» وهتلاقي ابتسامة مستنياك.
    ar: تقع كاومان بجوار المسجد الكبير في سولو (masjid، من العربية «مسجد»). وكانت قديمًا حيّ القائمين على شؤون المسجد، وهي اليوم مشهورة بالباتيك المصنوع في بيوتها العتيقة. ادخل أي متجر وقل «Nyuwun sewu, wonten batik?» تجد ابتسامة في انتظارك.
    en: Kauman sits next to Solo's Grand Mosque (masjid, from Arabic «مسجد»). It was once the quarter of the mosque's religious officials and is now famous for batik made in its old houses. Step into any shop, say "Nyuwun sewu, wonten batik?", and a smile will be waiting.
