schema: kabar.lesson/v1
id: j3.u03.l04
language: jv
title: Langkung sae
can_do:
  ar_eg: 'تقارن بالكراما: أكبر وأصغر، كتير وقليل، سهل وصعب، وتقول «زي».'
  ar: 'أن تقارن بالكراما: أكثر، صغير، كثير وقليل، سهل وصعب، وتقول «مثل».'
  en: 'Compare things in krama: more, small, many and few, easy and hard, and say "like".'
slides:
  - title: Langkung, kados
    body:
      ar_eg: |
        الصفات الشائعة ليها كراما:
        - cilik ← alit = صغير، akeh ← kathah = كتير، sithik ← sekedhik = شوية
        - ala / elek ← awon = وحش، gampang ← gampil = سهل، abot ← awrat = تقيل، صعب
        - luwih ← langkung = أكتر: langkung sae = أحسن
        - kaya ← kados = زي: kados tiyang Jogja = زي أهل يوجيا
      ar: |
        للصفات الشائعة كراما:
        - cilik ← alit = صغير، akeh ← kathah = كثير، sithik ← sekedhik = قليل
        - ala / elek ← awon = سيّئ، gampang ← gampil = سهل، abot ← awrat = ثقيل، صعب
        - luwih ← langkung = أكثر: langkung sae = أفضل
        - kaya ← kados = مثل: kados tiyang Jogja = مثل أهل يوجيا
      en: |
        Common adjectives have krama forms:
        - cilik → alit = small, akeh → kathah = many, sithik → sekedhik = a little
        - ala / elek → awon = bad, gampang → gampil = easy, abot → awrat = heavy, hard
        - luwih → langkung = more: langkung sae = better
        - kaya → kados = like: kados tiyang Jogja = like a Jogja local
    examples:
      - text: Krama langkung awrat tinimbang ngoko.
        ar_eg: الكراما أصعب من الـ ngoko.
        ar: الكراما أصعب من الـ ngoko.
        en: Krama is harder than ngoko.
      - text: Griya Mbah alit, nanging kepenak.
        ar_eg: بيت تيتة صغير، بس مريح.
        ar: بيت الجدة صغير لكنه مريح.
        en: Grandma's house is small but comfortable.
      - text: Tiyangipun kathah sanget.
        ar_eg: الناس كتير أوي.
        ar: الناس كثيرون جدًا.
        en: There are so many people.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: langkung
        ar_eg: أكتر (كراما)
        ar: أكثر (كراما)
        en: more (krama)
      - text: kados
        ar_eg: زي (كراما)
        ar: مثل (كراما)
        en: like (krama)
      - text: alit
        ar_eg: صغير (كراما)
        ar: صغير (كراما)
        en: small (krama)
      - text: kathah
        ar_eg: كتير (كراما)
        ar: كثير (كراما)
        en: many (krama)
    words: [langkung, kados, alit, kathah]
  - id: e02
    type: match_pairs
    pairs:
      - text: sekedhik
        ar_eg: شوية (كراما)
        ar: قليل (كراما)
        en: a little (krama)
      - text: awon
        ar_eg: وحش (كراما)
        ar: سيّئ (كراما)
        en: bad (krama)
      - text: gampil
        ar_eg: سهل (كراما)
        ar: سهل (كراما)
        en: easy (krama)
      - text: awrat
        ar_eg: تقيل، صعب (كراما)
        ar: ثقيل، صعب (كراما)
        en: heavy, hard (krama)
    words: [sekedhik, awon, gampil, awrat]
  - id: e03
    type: listen
    text: Tiyangipun kathah sanget wonten peken.
    question:
      ar_eg: السوق عامل إزاي؟
      ar: كيف حال السوق؟
      en: What's the market like?
    options: [السوق فاضي, الناس كتير أوي في السوق, السوق مقفول]
    answer: 1
    meaning:
      ar_eg: الناس كتير أوي في السوق.
      ar: الناس كثيرون جدًا في السوق.
      en: There are so many people at the market.
    words: [kathah]
  - id: e04
    type: fill_blank
    sentence: Basa ngoko ___, krama langkung awrat.
    meaning:
      ar_eg: الـ ngoko ___، والكراما أصعب.
      ar: الـ ngoko ___، والكراما أصعب.
      en: Ngoko is ___; krama is harder.
    options: [gampil, awon, kathah]
    answers: [gampil]
    words: [gampil, awon, kathah, langkung, awrat]
  - id: e05
    type: multiple_choice
    question: Teh menika legi ___ gendhis.
    options: [kados, langkung, sekedhik]
    answer: 0
    explain:
      ar_eg: kados = زي (kaya بالكراما).
      ar: kados = مثل (kaya بالكراما).
      en: kados = like (krama for kaya).
    words: [kados, langkung, sekedhik]
  - id: e06
    type: fill_blank
    sentence: Kula namung ngertos krama ___.
    meaning:
      ar_eg: أنا فاهم كراما ___ بس.
      ar: لا أفهم من الكراما إلا ___.
      en: I only understand ___ krama.
    options: [sekedhik, alit, awrat]
    answers: [sekedhik]
    words: [sekedhik, alit, awrat]
  - id: e07
    type: build_sentence
    source:
      ar_eg: بيت تيتة صغير، بس مريح.
      ar: بيت الجدة صغير لكنه مريح.
      en: Grandma's house is small but comfortable.
    answer: Griya Mbah alit, nanging kepenak.
    distractors: [kathah, awon]
