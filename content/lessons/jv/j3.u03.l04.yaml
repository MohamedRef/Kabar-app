  - id: e08
    type: translate
    direction: from_target
    source_text: Tas menika awrat sanget.
    answers_meaning:
      ar_eg: [الشنطة دي تقيلة أوي, الشنطة دي تقيلة جدًا]
      ar: [هذه الحقيبة ثقيلة جدًا]
      en: [This bag is very heavy, This bag is really heavy]
    words: [awrat]
  - id: e09
    type: speaking
    text: Krama langkung awrat tinimbang ngoko.
    meaning:
      ar_eg: الكراما أصعب من الـ ngoko.
      ar: الكراما أصعب من الـ ngoko.
      en: Krama is harder than ngoko.
    words: [langkung, awrat]
  - id: e10
    type: multiple_choice
    question: Batik menika mirah, nanging ___.
    options: [awon, gampil, kados]
    answer: 0
    explain:
      ar_eg: awon = وحش، مش كويس (ala أو elek بالكراما).
      ar: awon = سيّئ (ala أو elek بالكراما).
      en: awon = bad, poor quality (krama for ala, elek).
    words: [awon, gampil, kados]
dialogue:
  lines:
    - speaker: Bu Siti
      text: "Mas Mohamed, badhe tumbas napa?"
      ar_eg: "يا أستاذ محمد، عايز تشتري إيه؟"
      ar: "يا محمد، ماذا تريد أن تشتري؟"
      en: "What would you like, Mohamed?"
    - speaker: Mohamed
      text: "Batik alit, Bu."
      ar_eg: "باتيك صغير يا ست."
      ar: "باتيك صغير يا سيدتي."
      en: "A small batik, ma'am."
    - speaker: Bu Siti
      text: "Niki langkung sae, Mas."
      ar_eg: "دي أحسن يا أستاذ."
      ar: "هذه أفضل يا أخي."
      en: "This one's better, mate."
    - speaker: Mohamed
      text: Wah, kathah sanget batikipun! Arta kula namung sekedhik.
      ar_eg: ياه، الباتيك كتير أوي! وفلوسي قليلة.
      ar: يا لكثرة الباتيك! ومالي قليل.
      en: Wow, so much batik! I've only got a little money.
    - speaker: Bu Siti
      text: "Mboten napa-napa. Krama sampeyan sampun sae, kados tiyang Jogja, lho!"
      ar_eg: "ولا يهمك. الكراما بتاعتك بقت حلوة، زي أهل يوجيا!"
      ar: "لا بأس. صارت الكراما عندك جيدة، مثل أهل يوجيا!"
      en: "No problem. Your krama's good already, like a Jogja local!"
    - speaker: Mohamed
      text: Matur nuwun, Bu. Krama taksih awrat kangge kula.
      ar_eg: متشكر يا طنط. الكراما لسه صعبة عليّ.
      ar: شكرًا يا سيدتي. ما زالت الكراما صعبة عليّ.
      en: Thank you, ma'am. Krama is still hard for me.
new_words:
  - word: langkung
    pos: adverb
    ar_eg: أكتر (luwih ← langkung)، كراما
    ar: أكثر (luwih ← langkung)، كراما
    en: more (ngoko luwih, Indonesian lebih), krama
  - word: kados
    pos: preposition
    ar_eg: زي (kaya ← kados)، كراما
    ar: مثل (kaya ← kados)، كراما
    en: like, as (ngoko kaya, Indonesian seperti), krama
  - word: alit
    pos: adjective
    ar_eg: صغير (cilik ← alit)، كراما
    ar: صغير (cilik ← alit)، كراما
    en: small (ngoko cilik, Indonesian kecil), krama
  - word: kathah
    pos: adjective
    ar_eg: كتير (akeh ← kathah)، كراما
    ar: كثير (akeh ← kathah)، كراما
    en: many, a lot (ngoko akeh, Indonesian banyak), krama
  - word: sekedhik
    pos: adverb
    ar_eg: شوية (sithik ← sekedhik)، كراما
    ar: قليل (sithik ← sekedhik)، كراما
    en: a little (ngoko sithik, Indonesian sedikit), krama
  - word: awon
    pos: adjective
    ar_eg: وحش (ala / elek ← awon)، كراما
    ar: سيّئ (ala / elek ← awon)، كراما
    en: bad (ngoko ala, elek; Indonesian jelek), krama
  - word: gampil
    pos: adjective
    ar_eg: سهل (gampang ← gampil)، كراما
    ar: سهل (gampang ← gampil)، كراما
    en: easy (ngoko gampang, Indonesian mudah), krama
  - word: awrat
    pos: adjective
    ar_eg: تقيل، صعب (abot ← awrat)، كراما
    ar: ثقيل، صعب (abot ← awrat)، كراما
    en: heavy, hard (ngoko abot, Indonesian berat), krama
