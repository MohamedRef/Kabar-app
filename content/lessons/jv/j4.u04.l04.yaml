schema: kabar.lesson/v1
id: j4.u04.l04
language: jv
title: Sopan utawa lancang?
can_do:
  ar_eg: توصف حد مؤدّب أو قليل الأدب، وتقول إنك بتحترم الكبار وإنك اتضايقت.
  ar: أن تصف شخصًا مؤدّبًا أو وقحًا، وتقول إنك تحترم الكبار وإنك انزعجت.
  en: Describe someone as polite or rude, say you respect elders, and say you're annoyed.
slides:
  - title: Sopan, alus, kasar
    body:
      ar_eg: |
        - sopan = مؤدّب، alus = رقيق وناعم في الكلام والتصرّف (basa alus)، kasar = خشن، قليل الذوق.
        - lancang = بيتجرّأ ويعمل أو يقول حاجة مش من حقه (زي إنك تقول kowe لتيتة). kurang ajar = قليل الربايّة، ودي كلمة تقيلة، شتيمة تقريبًا!
        - ngurmati = يحترم، ngajeni = يقدّر ويدّي حد قيمته: «Kula ngajeni tiyang sepuh.»
        - mangkel = متضايق ومغتاظ من جوّه، من غير ما يزعّق.
      ar: |
        - sopan = مؤدّب، alus = رقيق ليّن في القول والفعل (basa alus)، kasar = فظّ، قليل الذوق.
        - lancang = متجرّئ يقول أو يفعل ما ليس من حقّه (كأن تقول kowe للجدّة). kurang ajar = قليل التربية، وهي كلمة ثقيلة تكاد تكون شتيمة!
        - ngurmati = يحترم، ngajeni = يقدّر ويعطي المرء قدره: «Kula ngajeni tiyang sepuh.»
        - mangkel = منزعج مغتاظ في داخله دون أن يصرخ.
      en: |
        - sopan = polite, alus = gentle, refined in speech and manner (basa alus), kasar = rough, rude.
        - lancang = presumptuous, saying or doing what isn't your place (like calling Grandma kowe). kurang ajar = ill-mannered, insolent: a heavy word, almost an insult!
        - ngurmati = respect, ngajeni = value, show regard for: "Kula ngajeni tiyang sepuh."
        - mangkel = annoyed, quietly fuming.
    examples:
      - text: Mas Dimas alus banget yen ngomong karo Simbah.
        ar_eg: ماس ديماس بيتكلم برقّة أوي مع تيتة.
        ar: ماس ديماس رقيق جدًّا حين يكلّم الجدّة.
        en: Mas Dimas is so gentle when he talks to Grandma.
      - text: Turis iku lancang, Simbah mangkel.
        ar_eg: السايح ده اتجرّأ، وتيتة اتضايقت.
        ar: تجرّأ ذلك السائح فانزعجت الجدّة.
        en: That tourist was presumptuous, and Grandma was annoyed.
      - text: Kula ngajeni tiyang sepuh.
        ar_eg: أنا بقدّر وأحترم الكبار.
        ar: أقدّر كبار السنّ.
        en: I respect older people.
