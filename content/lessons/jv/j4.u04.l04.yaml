    words: [alus, kasar, mangkel]
  - id: e05
    type: multiple_choice
    question: Bocah iku nyeluk Simbah «kowe». Iku ___.
    question_meaning:
      ar_eg: الواد ده قال لتيتة «kowe». ده ___.
      ar: نادى ذلك الطفل الجدّة بـ«kowe». هذا ___.
      en: That kid called Grandma 'kowe'. That's ___.
    options: [sopan, lancang, alus]
    answer: 1
    explain:
      ar_eg: 'إنك تقول kowe للكبير lancang: مش من حقك.'
      ar: أن تقول kowe للكبير lancang، أي تجرّؤ.
      en: 'Calling an elder kowe is lancang: it isn''t your place.'
    words: [lancang, sopan, alus]
  - id: e06
    type: fill_blank
    sentence: Aku ___ amarga wong iku kasar.
    meaning:
      ar_eg: أنا ___ عشان الراجل ده خشن.
      ar: أنا ___ لأن ذلك الرجل فظّ.
      en: I'm ___ because that man was rude.
    options: [mangkel, ngajeni, sopan]
    answers: [mangkel]
    words: [mangkel, ngajeni, sopan, kasar]
  - id: e07
