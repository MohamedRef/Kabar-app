      ar: أحترم كبار السنّ.
      en: I respect older people.
    answer: Kula ngurmati tiyang sepuh.
    distractors: [kasar, lancang]
    words: [ngurmati, kasar, lancang]
  - id: e08
    type: translate
    direction: from_target
    source_text: Aja kurang ajar karo wong tuwa!
    answers_meaning:
      ar_eg: [ما تبقاش قليل الأدب مع الكبار!, ما تقلّش أدبك على الكبير!]
      ar: [لا تكن قليل التربية مع الكبار!, لا تسئ الأدب مع كبار السنّ!]
      en: ['Don''t be insolent to your elders!', 'Don''t be rude to older people!']
    words: [kurang ajar]
  - id: e09
    type: speaking
    text: Kula ngajeni Pak Harsono.
    meaning:
      ar_eg: أنا بحترم وبقدّر پاك هارسونو.
      ar: أقدّر باك هارسونو وأوقّره.
      en: I hold Pak Harsono in high regard.
    words: [ngajeni]
  - id: e10
    type: multiple_choice
    question: 'Mohamed ___ Simbah: matur nganggo krama.'
    question_meaning:
      ar_eg: 'محمد ___ تيتة: بيكلّمها بالكراما.'
      ar: 'محمد ___ الجدّة: يكلّمها بالكراما.'
      en: 'Mohamed ___ Grandma: he speaks to her in krama.'
    options: [ngurmati, kurang ajar, mangkel]
    answer: 0
    explain:
      ar_eg: ngurmati = يحترم، والكلام بالكراما احترام.
      ar: ngurmati = يحترم، والكلام بالكراما احترام.
      en: ngurmati = respects; speaking krama is respect.
    words: [ngurmati, kurang ajar, mangkel]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, wingi ana turis ing Taman Sari. Dheweke kasar banget.
      ar_eg: يا محمد، امبارح كان في سايح في تامان ساري. كان خشن أوي.
      ar: يا محمد، كان أمس سائح في تامان ساري، وكان فظًّا جدًّا.
      en: Mohamed, there was a tourist at Taman Sari yesterday. He was really rude.
    - speaker: Mohamed
      text: Kasar piye, Mas?
      ar_eg: خشن إزاي يا ماس؟
      ar: فظّ كيف يا ماس؟
      en: Rude how, Mas?
    - speaker: Mas Dimas
      text: Dheweke bengok-bengok karo abdi dalem. Lancang tenan.
      ar_eg: كان بيزعّق في خدم القصر. اتجرّأ بجد.
      ar: كان يصرخ في وجه خدم القصر. تجرّؤ حقًّا.
      en: He shouted at the palace retainers. Really presumptuous.
    - speaker: Mohamed
      text: Wah, abdi dalem mangkel, ta?
      ar_eg: يا خبر، والخدم اتضايقوا أكيد؟
      ar: يا للهول، لا بدّ أن الخدم انزعجوا؟
      en: Oh no, the retainers must have been annoyed?
    - speaker: Mas Dimas
      text: Ora. Abdi dalem isih alus lan sopan.
      ar_eg: لأ. الخدم فضلوا رقيقين ومؤدّبين.
      ar: لا. بقي الخدم رقيقين مؤدّبين.
      en: No. They stayed gentle and polite.
    - speaker: Mohamed
      text: Apik tenan. Aku uga arep ngajeni wong kaya ngono.
      ar_eg: حلو أوي. وأنا كمان عايز أحترم الناس كده.
      ar: رائع. وأنا أيضًا أريد أن أقدّر الناس هكذا.
      en: That's wonderful. I want to show people that kind of regard too.
