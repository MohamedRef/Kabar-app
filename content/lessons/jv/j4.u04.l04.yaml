      ar: كيف هو السائح؟
      en: What is the tourist like?
    options: [السايح ده خشن ومش مؤدّب, السايح ده مؤدّب أوي, السايح ده بيحترم الكبار]
    answer: 0
    meaning:
      ar_eg: السايح ده خشن ومش مؤدّب.
      ar: ذلك السائح فظّ غير مؤدّب.
      en: That tourist is rude, not polite.
