schema: kabar.lesson/v1
id: j4.u01.l02
language: jv
title: Tindak lan sare
can_do:
  ar_eg: تقول الشخص الكبير رايح فين، أو إنه نايم، بأدب.
  ar: أن تقول بأدب إلى أين يذهب الكبير أو أنه نائم.
  en: Say where an elder is going, or that they are asleep.
slides:
  - title: Lunga → kesah → tindak
    body:
      ar_eg: |
        فعلين كمان بالتلات درجات:
        - يروح: lunga (نغوكو) → kesah (كراما) → tindak (krama inggil). بالإندونيسي: pergi.
        - ينام: turu → tilem → sare. بالإندونيسي: tidur.
        عن الكبير: «Bapak tindak dhateng peken» (بابا راح السوق). عن نفسك: «Kula badhe kesah» (أنا ماشي). و«kula tindak» غلطة الأجانب المشهورة، زي «kula dhahar».
        tindak كمان معناها «يمشي» و«يسافر»، فهتسمعها كتير.
      ar: |
        فعلان آخران بالدرجات الثلاث:
        - يذهب: lunga (نغوكو) → kesah (كراما) → tindak (krama inggil)، وبالإندونيسية pergi.
        - ينام: turu → tilem → sare، وبالإندونيسية tidur.
        عن الكبير: «Bapak tindak dhateng peken»، وعن نفسك: «Kula badhe kesah». و«kula tindak» خطأ شائع كـ«kula dhahar».
        وtindak تعني أيضًا يمشي ويسافر.
      en: |
        Two more verbs with three levels:
        - go: lunga (ngoko) → kesah (krama) → tindak (krama inggil). Indonesian: pergi.
        - sleep: turu → tilem → sare. Indonesian: tidur.
        About the elder: "Bapak tindak dhateng peken" (Father went to the market). About yourself: "Kula badhe kesah" (I'm off). "Kula tindak" is the classic slip, like "kula dhahar".
        tindak also covers walk and travel, so you'll hear it a lot.
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Bapak sampun tindak dhateng peken.
        ar_eg: بابا راح السوق خلاص.
        ar: ذهب الوالد إلى السوق.
        en: Father has gone to the market.
      - text: Kula badhe kesah dhateng Tugu.
        ar_eg: أنا رايح التوغو.
        ar: سأذهب إلى التوغو.
        en: I'm going to the Tugu.
  - title: Saweg sare, saweg siram
    body:
      ar_eg: |
        saweg = lagi (بالإندونيسي sedang)، يعني «دلوقتي بيعمل». وده كراما.
        - «Simbah saweg sare» = تيتة نايمة دلوقتي.
        - يستحمى: adus → siram (krama inggil). ومفيش كراما عادية: عن نفسك قول adus حتى وانت مؤدب.
        وخلي بالك: بتكرّم الكبير حتى وهو مش قدامك. لو بتقول لحد إن جدة صاحبك نايمة، برضه sare.
      ar: |
        saweg = lagi (وبالإندونيسية sedang)، أي «يفعل الآن»، وهي كراما.
        - «Simbah saweg sare» = الجدة نائمة الآن.
        - يستحم: adus → siram (krama inggil)، ولا كراما عادية له، فتقول عن نفسك adus.
        وتُكرّم الكبير ولو كان غائبًا، فإذا أخبرت أحدًا أن الجدة نائمة قلت sare.
      en: |
        saweg = lagi (Indonesian sedang), "is doing right now". It's krama.
        - "Simbah saweg sare" = Grandma is asleep right now.
        - bathe: adus → siram (krama inggil). There's no separate krama: about yourself say adus, even when being polite.
        You honour the elder even when they're not there: telling someone that your friend's grandmother is asleep is still sare.
    grammar: jv.krama-inggil.verbs
    examples:
      - text: Mbah Putri saweg sare.
        ar_eg: تيتة نايمة دلوقتي.
        ar: الجدة نائمة الآن.
        en: Grandma is asleep.
      - text: Bapak saweg siram.
        ar_eg: بابا بيستحمى.
        ar: الوالد يستحم.
        en: Father is having a bath.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: kesah
        ar_eg: يروح (كراما، عن نفسك)
        ar: يذهب (كراما، عن النفس)
        en: go (krama, about yourself)
      - text: tindak
        ar_eg: يروح (krama inggil، للكبير)
        ar: يذهب (krama inggil، للكبير)
        en: go (krama inggil, for the elder)
      - text: tilem
        ar_eg: ينام (كراما، عن نفسك)
        ar: ينام (كراما، عن النفس)
        en: sleep (krama, about yourself)
      - text: sare
        ar_eg: ينام (krama inggil، للكبير)
        ar: ينام (krama inggil، للكبير)
        en: sleep (krama inggil, for the elder)
      - text: siram
        ar_eg: يستحمى (krama inggil، للكبير)
        ar: يستحم (krama inggil، للكبير)
        en: bathe (krama inggil, for the elder)
    words: [kesah, tindak, tilem, sare, siram]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: Mas Dimas سألك تيتة فين. هي نايمة. تقول إيه بأدب؟
      ar: سألك Mas Dimas عن الجدة، وهي نائمة. ماذا تقول بأدب؟
      en: Mas Dimas asks where his grandmother is. She's asleep. What do you say politely?
    options: ['Mbah Putri saweg tilem.', 'Mbah Putri saweg sare.', 'Mbah Putri lagi turu.']
    answer: 1
    explain:
      ar_eg: النوم نومها هي، يبقى sare حتى لو هي مش قدامك. tilem عن نفسك، وturu نغوكو.
      ar: النوم نومها فيكون sare ولو كانت غائبة، وtilem للنفس، وturu نغوكو.
      en: It's her sleep, so sare, even though she isn't there. tilem is for yourself; turu is ngoko.
    words: [saweg, sare, tilem]
  - id: e03
    type: listen
    text: Bapak saweg siram.
    options: ['Bapak saweg sare.', 'Bapak sampun tindak.', 'Bapak saweg siram.']
    answer: 2
    meaning:
      ar_eg: بابا بيستحمى.
      ar: الوالد يستحم.
      en: Father is having a bath.
    words: [saweg, siram]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: Bu Harsono سألتك رايح فين. إنت رايح التوغو. ترد إزاي؟
      ar: سألتك Bu Harsono إلى أين تذهب، وأنت ذاهب إلى التوغو. بمَ تجيب؟
      en: Bu Harsono asks where you're going. You're going to the Tugu. What do you answer?
    options: ['Kula badhe kesah dhateng Tugu.', 'Kula badhe tindak dhateng Tugu.', 'Aku arep lunga neng Tugu.']
    answer: 0
    explain:
      ar_eg: عن نفسك kesah. tindak تكريم للتاني، وaku arep lunga نغوكو مع واحدة كبيرة.
      ar: عن نفسك kesah، وtindak للآخر، وaku arep lunga نغوكو لا تليق بالكبيرة.
      en: About yourself, kesah. tindak honours others; aku arep lunga is ngoko, too casual for an elder.
    words: [kesah, tindak]
  - id: e05
    type: fill_blank
    sentence: Nyuwun sewu, Mas, Bapak sampun ___ dhateng peken.
    meaning:
      ar_eg: لا مؤاخذة يا أستاذ، بابا راح السوق خلاص.
      ar: عفوًا، لقد ذهب الوالد إلى السوق.
      en: Sorry, Father has already gone to the market.
    options: [kesah, tindak, lunga]
    answers: [tindak]
    explain:
      ar_eg: الأب بيستاهل tindak حتى وإنت بتتكلم عنه لحد تاني.
      ar: الأب يستحق tindak ولو تحدثت عنه مع غيره.
      en: Father gets tindak, even when you're talking about him to someone else.
    words: [tindak]
  - id: e06
    type: fill_blank
    sentence: Kula badhe ___ rumiyin. Sugeng dalu, Bu.
    meaning:
      ar_eg: أنا هنام بقى. تصبحي على خير يا هانم.
      ar: سأنام الآن. تصبحين على خير يا سيدتي.
      en: I'm going to sleep now. Good night, ma'am.
    options: [sare, tilem, turu]
    answers: [tilem]
    explain:
      ar_eg: نومك إنت tilem. sare للكبير، وturu نغوكو وسط جملة كراما.
      ar: نومك أنت tilem، وsare للكبير، وturu نغوكو في جملة كراما.
      en: Your own sleep is tilem. sare is for the elder; turu is ngoko in a krama sentence.
    words: [tilem]
  - id: e07
    type: build_sentence
    source:
      ar_eg: أنا رايح ماليوبورو الأول.
      ar: سأذهب إلى ماليوبورو أولًا.
      en: I'm going to Malioboro first.
    answer: Kula badhe kesah dhateng Malioboro rumiyin.
    distractors: [tindak, arep]
    words: [kesah]
    explain:
      ar_eg: عن نفسك بتقول kesah (كراما عادي). tindak للكبير بس، وarep نغوكو مش مكانها في جملة كراما.
      ar: عن نفسك تقول kesah (كراما عادية)، أما tindak فللكبير وحده، وarep نغوكو لا تناسب جملة كراما.
      en: About yourself you say kesah (plain krama). tindak is only for elders, and arep is ngoko, out of place in krama.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بأدب) تيتة نايمة دلوقتي.
      ar: (بأدب) الجدة نائمة الآن.
      en: (politely) Grandma is asleep right now.
    answers: ['Mbah Putri saweg sare.', 'Simbah saweg sare.', 'Mbah saweg sare.', 'Eyang saweg sare.']
    explain:
      ar_eg: saweg (= lagi) + sare (krama inggil لـ turu).
      ar: saweg (= lagi) + sare (krama inggil لـ turu).
      en: saweg (= lagi) + sare (krama inggil for turu).
    words: [saweg, sare]
  - id: e09
    type: speaking
    text: Nyuwun sewu, Bapak saweg siram.
    meaning:
      ar_eg: لا مؤاخذة، بابا بيستحمى.
      ar: عفوًا، الوالد يستحم.
      en: Sorry, Father is having a bath.
    words: [saweg, siram]
dialogue:
  title: Esuk-esuk ing Tugu
  lines:
    - speaker: Mohamed
      text: Sugeng enjing, Bu. Bapak wonten?
      ar_eg: صباح الخير يا هانم. الأستاذ موجود؟
      ar: صباح الخير يا سيدتي. هل الأستاذ موجود؟
      en: Good morning, ma'am. Is Pak Harsono in?
    - speaker: Bu Harsono
      text: Bapak sampun tindak dhateng peken, Mas.
      ar_eg: الأستاذ راح السوق يا ابني.
      ar: ذهب الأستاذ إلى السوق يا بني.
      en: He's gone to the market.
    - speaker: Mohamed
      text: Mbah Putri wonten pundi, Bu?
      ar_eg: وتيتة فين يا هانم؟
      ar: وأين الجدة يا سيدتي؟
      en: And where is Grandma, ma'am?
    - speaker: Bu Harsono
      text: Simbah saweg sare.
      ar_eg: تيتة نايمة.
      ar: الجدة نائمة.
      en: Grandma is asleep.
    - speaker: Mohamed
      text: Inggih. Kula badhe kesah dhateng Tugu rumiyin, Bu.
      ar_eg: ماشي. أنا هروح التوغو الأول يا هانم.
      ar: حسنًا. سأذهب إلى التوغو أولًا يا سيدتي.
      en: All right. I'll go to the Tugu first, ma'am.
