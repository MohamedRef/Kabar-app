  - word: tindak
    pos: verb
    ar_eg: يروح / يمشي / يسافر (krama inggil، للكبير)
    ar: يذهب / يمشي / يسافر (krama inggil، للكبير)
    en: go, walk, travel (krama inggil, for the elder) = pergi
  - word: tilem
    pos: verb
    ar_eg: ينام (كراما، عن نفسك؛ ngoko turu)
    ar: ينام (كراما، عن النفس؛ ngoko turu)
    en: sleep (krama, about yourself; ngoko turu) = tidur
  - word: sare
    pos: verb
    ar_eg: ينام (krama inggil، للكبير)
    ar: ينام (krama inggil، للكبير)
    en: sleep (krama inggil, for the elder) = tidur
  - word: siram
    pos: verb
    ar_eg: يستحمى (krama inggil؛ عن نفسك adus)
    ar: يستحم (krama inggil؛ وعن النفس adus)
    en: bathe (krama inggil; about yourself adus) = mandi
  - word: saweg
    pos: adverb
    ar_eg: بيعمل دلوقتي (كراما لـ lagi)
    ar: يفعل الآن (كراما لـ lagi)
    en: in the middle of, -ing (krama for lagi) = sedang
