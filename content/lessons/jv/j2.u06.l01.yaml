schema: kabar.lesson/v1
id: j2.u06.l01
language: jv
title: Mlaku-mlaku
can_do:
  ar_eg: تستخدم تكرار الكلمة (mlaku-mlaku، dolan-dolan).
  ar: أن تستخدم تكرار الكلمة (mlaku-mlaku، dolan-dolan).
  en: Use reduplication.
slides:
  - title: Bocah-bocah = anak-anak
    body:
      ar_eg: |
        زي الإندونيسي بالظبط: تكرار الاسم بيدي جمع أو تنوّع.
        - bocah (عيل) → bocah-bocah = anak-anak (عيال)
        - omah → omah-omah = بيوت
        ولو فيه رقم أو akeh (كتير)، مش محتاج تكرار، زي tiga anak في الإندونيسي:
        - bocah telu = تلات عيال (مش bocah-bocah telu)
        - akeh bocah = عيال كتير
      ar: |
        كالإندونيسية تمامًا: تكرار الاسم يفيد الجمع أو التنوع.
        - bocah (طفل) → bocah-bocah = anak-anak (أطفال)
        - omah → omah-omah = بيوت
        ولا حاجة للتكرار مع العدد أو akeh (كثير)، كما في tiga anak:
        - bocah telu = ثلاثة أطفال (لا bocah-bocah telu)
        - akeh bocah = أطفال كثيرون
      en: |
        Exactly as in Indonesian: doubling a noun makes a plural or shows variety.
        - bocah (kid) → bocah-bocah = anak-anak (kids)
        - omah → omah-omah = houses
        With a number or akeh (many), skip the doubling, like Indonesian tiga anak:
        - bocah telu = three kids (not bocah-bocah telu)
        - akeh bocah = lots of kids
    grammar: jv.reduplication
    examples:
      - text: Bocah-bocah dolanan neng taman.
        ar_eg: العيال بيلعبوا في الجنينة.
        ar: الأطفال يلعبون في الحديقة.
        en: The children are playing in the park.
      - text: Bocah telu lagi mangan.
        ar_eg: تلات عيال بياكلوا.
        ar: ثلاثة أطفال يأكلون.
        en: Three kids are eating.
  - title: Mlaku-mlaku, dolan-dolan
    body:
      ar_eg: |
        تكرار الفعل بيدي معنى «على رواقة / للفسحة»:
        - mlaku = يمشي · mlaku-mlaku = يتمشى (jalan-jalan)
        - dolan-dolan = يخرج يتفسح
        - mangan-mangan = عزومة أكل (makan-makan)
        وdolan لوحدها كلمة مهمة جدًا: «يخرج / يزور / يلعب». Dolan neng omahku! = تعالى زورني!
        وdolanan = يلعب (العيال بيلعبوا): Bocah-bocah dolanan.
      ar: |
        تكرار الفعل يفيد التسلية والتمهل:
        - mlaku = يمشي · mlaku-mlaku = يتنزّه (jalan-jalan)
        - dolan-dolan = يخرج للنزهة
        - mangan-mangan = وليمة أكل (makan-makan)
        وdolan وحدها كثيرة الاستعمال: يخرج / يزور / يلعب. Dolan neng omahku! = زُرني!
        وdolanan = يلعب: Bocah-bocah dolanan.
      en: |
        Doubling a verb gives "relaxed, for fun":
        - mlaku = walk · mlaku-mlaku = take a stroll (jalan-jalan)
        - dolan-dolan = hang out
        - mangan-mangan = a casual feast (makan-makan)
        dolan alone is a key verb: go out / visit / play. Dolan neng omahku! = Come visit me!
        dolanan = play (kids playing): Bocah-bocah dolanan.
    grammar: jv.reduplication
    examples:
      - text: Ayo mlaku-mlaku neng Benteng Pendem.
        ar_eg: يلا نتمشى عند قلعة بنتنج بندم.
        ar: هيا نتنزّه إلى قلعة بنتنغ بندم.
        en: Let's take a stroll to Benteng Pendem.
      - text: Dolan neng omahku, ya!
        ar_eg: تعالى زورني في البيت!
        ar: زُرني في بيتي!
        en: Come visit me at home!
  - title: Bola-bali, lelungan
    body:
      ar_eg: |
        الجاوي عنده كمان تكرار بتغيير الحرف المتحرك = «رايح جاي / كل شوية»:
        - bola-bali = رايح جاي، تاني وتالت (bolak-balik)
        - clingak-clinguk = يبص يمين وشمال زي التايه
        وتكرار أول مقطع في أسماء: lunga (يروح) → lelungan = سفرية / رحلة.
        زي المصري لما بيقول «رايح جاي» أو «شوية شوية».
      ar: |
        وللجاوية تكرار مع تغيير الصائت للدلالة على التردد:
        - bola-bali = ذهابًا وإيابًا، مرارًا (bolak-balik)
        - clingak-clinguk = يتلفت يمينًا وشمالًا كالحائر
        وتكرار المقطع الأول في الأسماء: lunga (يذهب) → lelungan = رحلة.
        كقولنا «رايح جاي» و«شوية شوية».
      en: |
        Javanese also doubles with a vowel change = "back and forth, again and again":
        - bola-bali = to and fro, repeatedly (bolak-balik)
        - clingak-clinguk = look left and right, like someone lost
        And first-syllable doubling in nouns: lunga (go) → lelungan = a trip.
        Like Egyptian «رايح جاي» or «شوية شوية».
    grammar: jv.reduplication
    examples:
      - text: Aku bola-bali neng stasiun.
        ar_eg: فضلت رايح جاي على المحطة.
        ar: ظللت أذهب إلى المحطة وأعود مرارًا.
        en: I kept going back and forth to the station.
      - text: Mohamed clingak-clinguk neng stasiun.
        ar_eg: محمد كان بيبص يمين وشمال في المحطة.
        ar: كان محمد يتلفت يمينًا وشمالًا في المحطة.
        en: Mohamed was looking around at the station.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: bocah-bocah
        ar_eg: عيال
        ar: أطفال
        en: kids
      - text: mlaku-mlaku
        ar_eg: يتمشى
        ar: يتنزّه
        en: take a stroll
      - text: dolan-dolan
        ar_eg: يخرج يتفسح
        ar: يخرج للنزهة
        en: hang out
      - text: bola-bali
        ar_eg: رايح جاي
        ar: ذهابًا وإيابًا
        en: back and forth
      - text: lelungan
        ar_eg: سفرية
        ar: رحلة
        en: a trip
      - text: clingak-clinguk
        ar_eg: يبص يمين وشمال
        ar: يتلفّت حوله
        en: look around, lost
    words: [bocah, mlaku / mlaku-mlaku, dolan / dolan-dolan, bola-bali, lelungan, clingak-clinguk]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: «تلات عيال». أنهي صح؟
      ar: «ثلاثة أطفال». أيّها الصحيح؟
      en: '"Three kids." Which is right?'
    options: [telu bocah-bocah, bocah-bocah telu, bocah telu]
    answer: 2
    explain:
      ar_eg: الرقم بيوضح الجمع، فمش محتاج تكرار.
      ar: العدد يدل على الجمع فلا تكرار.
      en: The number already shows plural, so no doubling.
    words: [bocah]
  - id: e03
    type: listen
    text: Bocah-bocah dolanan neng taman.
    options: [Bocah-bocah clingak-clinguk neng taman., Bocah telu dolanan neng taman., Bocah-bocah dolanan neng taman.]
    answer: 2
    words: [bocah, dolanan, taman, clingak-clinguk]
  - id: e04
    type: fill_blank
    sentence: Lelungan iki apik. Ayo ___ neng Benteng Pendem!
    meaning:
      ar_eg: السفرية دي حلوة. يلا نتمشى عند قلعة بنتنج بندم!
      ar: هذه الرحلة جميلة. هيا نتنزّه إلى قلعة بنتنغ بندم!
      en: This trip is great. Let's take a stroll to Benteng Pendem!
    options: [bola-bali, mlaku-mlaku, bocah-bocah]
    answers: [mlaku-mlaku]
    words: [lelungan, mlaku / mlaku-mlaku]
    explain:
      ar_eg: mlaku-mlaku = يتمشى / يتفسّح. bola-bali = رايح جاي / كذا مرة، وbocah-bocah = عيال (اسم مش فعل).
      ar: mlaku-mlaku = يتنزّه؛ أما bola-bali فذهابًا وإيابًا مرارًا، وbocah-bocah أطفال (اسم لا فعل).
      en: mlaku-mlaku = take a stroll. bola-bali = back and forth, bocah-bocah = children (a noun).
  - id: e05
    type: build_sentence
    source:
      ar_eg: العيال بيلعبوا في الجنينة.
      ar: الأطفال يلعبون في الحديقة.
      en: The children are playing in the park.
    answer: Bocah-bocah dolanan neng taman.
    distractors: [telu, omah]
    words: [bocah, dolanan, taman]
    explain:
      ar_eg: bocah-bocah = العيال، وdolanan neng taman = بيلعبوا في الجنينة. telu = تلاتة، وomah = بيت، ومش في المعنى.
      ar: bocah-bocah = الأطفال، وdolanan neng taman = يلعبون في الحديقة؛ أما telu فثلاثة، وomah بيت، وليسا في المعنى.
      en: bocah-bocah = the children, dolanan neng taman = play in the park. telu (three) and omah (house) aren't in the meaning.
  - id: e06
    type: listen
    text: Mohamed clingak-clinguk neng taman.
    options: [Mohamed clingak-clinguk neng taman., Mohamed bola-bali neng taman., Mohamed mlaku-mlaku neng taman., Mohamed dolan neng taman.]
    answer: 0
    meaning:
      ar_eg: محمد بيبص يمين وشمال في الجنينة.
      ar: محمد يتلفّت حوله في الحديقة.
      en: Mohamed is looking around, lost, in the park.
    words: [clingak-clinguk, taman, bola-bali, mlaku / mlaku-mlaku, dolan / dolan-dolan]
  - id: e07
    type: speaking
    text: Dolan neng omahku, ya! Ana dolanan akeh.
    meaning:
      ar_eg: تعالى زورني في البيت! فيه لعب كتير.
      ar: تعال زرني في البيت! عندنا ألعاب كثيرة.
      en: Come over to my house! There are lots of toys.
    words: [dolan / dolan-dolan, dolanan, akeh]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «سفرية / رحلة»؟
      ar: أيّ كلمة تعني «رحلة»؟
      en: Which word means "a trip"?
    options: [lelungan, dolanan, bola-bali]
    answer: 0
    explain:
      ar_eg: lelungan = سفرية، dolanan = يلعب / لعبة، bola-bali = رايح جاي.
      ar: lelungan = رحلة، وdolanan = يلعب / لعبة، وbola-bali = ذهابًا وإيابًا.
      en: lelungan = a trip, dolanan = play / toy, bola-bali = back and forth.
    words: [lelungan, dolanan, bola-bali]
dialogue:
  title: Dolan-dolan neng Ngawi
  lines:
    - speaker: Dimas
      text: Mohamed, Minggu ayo dolan-dolan neng Ngawi!
      ar_eg: محمد، يوم الحد يلا نخرج نتفسح في نغاوي!
      ar: يا محمد، هيا نخرج للنزهة في نغاوي يوم الأحد!
      en: Mohamed, let's hang out in Ngawi on Sunday!
    - speaker: Mohamed
      text: Ayo! Neng ngendi?
      ar_eg: يلا! فين؟
      ar: هيا! إلى أين؟
      en: Sure! Where?
    - speaker: Dimas
      text: Mlaku-mlaku neng Benteng Pendem.
      ar_eg: نتمشى عند قلعة بنتنج بندم.
      ar: نتنزّه عند قلعة بنتنغ بندم.
      en: A stroll around Benteng Pendem.
    - speaker: Mohamed
      text: Apa kuwi?
      ar_eg: إيه ده؟
      ar: ما هذا؟
      en: What's that?
    - speaker: Dimas
      text: Lawas banget, saka Landa. Akeh bocah dolanan neng kana.
      ar_eg: قديم أوي، من أيام الهولنديين. عيال كتير بتلعب هناك.
      ar: قديم جدًا، من عهد الهولنديين. يلعب هناك أطفال كثيرون.
      en: Really old, from the Dutch. Lots of kids play there.
    - speaker: Mohamed
      text: Sip! Minggu esuk, ya.
      ar_eg: تمام! الحد الصبح.
      ar: ممتاز! صباح الأحد إذن.
      en: Great! Sunday morning, then.
new_words:
  - word: mlaku / mlaku-mlaku
    pos: verb
    ar_eg: يمشي / يتمشى
    ar: يمشي / يتنزّه
    en: walk / take a stroll (jalan / jalan-jalan)
  - word: dolan / dolan-dolan
    pos: verb
    ar_eg: يخرج / يزور / يتفسح
    ar: يخرج / يزور / يتنزّه
    en: go out, visit / hang out
  - word: dolanan
    pos: verb
    ar_eg: يلعب
    ar: يلعب
    en: to play (bermain)
  - word: bola-bali
    pos: adverb
    ar_eg: رايح جاي
    ar: ذهابًا وإيابًا
    en: back and forth, repeatedly (bolak-balik)
  - word: clingak-clinguk
    pos: verb
    ar_eg: يبص يمين وشمال (زي التايه)
    ar: يتلفّت حائرًا
    en: look around confused
  - word: lelungan
    pos: noun
    ar_eg: سفرية / رحلة
    ar: رحلة
    en: a trip (from lunga)
  - word: taman
    pos: noun
    ar_eg: جنينة
    ar: حديقة
    en: park, garden
