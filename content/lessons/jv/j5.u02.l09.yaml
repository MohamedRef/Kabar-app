dialogue:
  title: Nyritakake warta
  lines:
    - speaker: Mbak Ayu
      text: Ana warta apa, Mohamed?
      ar_eg: فيه أخبار إيه يا محمد؟
      ar: ما الأخبار يا محمد؟
      en: What's the news, Mohamed?
    - speaker: Mohamed
      text: Wingi dalan ing Kutha Lama kebanjiran rob.
      ar_eg: امبارح الشارع في كوتا لاما غرق من مية البحر.
      ar: غمر المدُّ أمس الشارعَ في كوتا لاما.
      en: Yesterday the road in Kota Lama got flooded by the tide.
    - speaker: Mbak Ayu
      text: Waduh! Saiki piye?
      ar_eg: يا خبر! وإيه الأخبار دلوقتي؟
      ar: يا للهول! وكيف الحال الآن؟
      en: Oh no! How is it now?
    - speaker: Mohamed
      text: Wis diresiki dening warga. Aman, Mbak.
      ar_eg: الأهالي نضّفوه خلاص. كله تمام يا آيو.
      ar: نظّفه الأهالي. كل شيء بخير يا آيو.
      en: The residents have cleaned it up. All fine, Ayu.
souvenir:
  id: j5.u02.souvenir
  title: Lawang Sewu
  note:
    ar_eg: |
      Lawang Sewu يعني «الألف باب»: مبنى ضخم في وسط سيمارانج، اتبنى أوائل القرن العشرين مقرّ لشركة سكة حديد هولندية، وأبوابه وشبابيكه كتير لدرجة إن الناس قالوا عليه ألف. ودلوقتي متحف بيحكي حكاية القطر في جاوة. ومن عشرات السنين فيه تلفزيونات محلية ومجلات زي Panjebar Semangat وJaya Baya بتنشر بالجاوي، فالأخبار اللي بتقراها دلوقتي ليها تاريخ طويل.
    ar: |
      Lawang Sewu تعني «ألف باب»: مبنى ضخم في وسط سيمارانج، بُني مطلع القرن العشرين مقرًّا لشركة سكك حديد هولندية، وكثرت أبوابه ونوافذه حتى قال الناس إنها ألف. وهو اليوم متحف يروي قصة القطار في جاوة. ومنذ عقود تنشر قنوات محلية ومجلات مثل Panjebar Semangat وJaya Baya بالجاوية، فالأخبار التي تقرؤها الآن لها تاريخ طويل.
    en: |
      Lawang Sewu means "a thousand doors": a huge building in central Semarang, built in the early 20th century as the head office of a Dutch railway company, with so many doors and windows that people called them a thousand. Today it's a museum telling the story of Java's railways. And for decades, regional TV and magazines like Panjebar Semangat and Jaya Baya have published in Javanese, so the news you're reading now has a long history.
