schema: kabar.lesson/v1
id: j5.u02.l09
language: jv
title: Ulangan J5.2
can_do:
  ar_eg: تحكي خبر بكلامك.
  ar: أن تعيد رواية خبر بكلماتك.
  en: Retell a news item.
slides:
  - title: Kabeh pasif
    body:
      ar_eg: |
        كل أشكال المجهول اللي في الأخبار:
        - di- + فعل + dening = اتعمل على إيد … (oleh)
        - ka- (رسمي): kapilih، kasebut
        - -in- (أدبي): tinulis، sinebut، kinurmatan
        - dipun- (كراما مكتوبة): dipunbangun
        - ولو «أنا»: dak- / tak-، مش dening aku.
        ولما تحكي الخبر لصاحبك، ارجع للكلام العادي: di- وsing وneng.
      ar: |
        صيغ المجهول كلها في الأخبار:
        - di- + الفعل + dening = فُعل على يد … (oleh)
        - ka- (رسمية): kapilih، kasebut
        - -in- (أدبية): tinulis، sinebut، kinurmatan
        - dipun- (كراما مكتوبة): dipunbangun
        - ومع المتكلم dak- / tak- لا dening aku.
        وحين تحكي الخبر لصديقك عُد إلى لغة الكلام: di- وsing وneng.
      en: |
        Every passive the news uses:
        - di- + verb + dening = done by … (oleh)
        - ka- (formal): kapilih, kasebut
        - -in- (literary): tinulis, sinebut, kinurmatan
        - dipun- (written krama): dipunbangun
        - with "I": dak- / tak-, never dening aku.
        When you retell the news to a friend, go back to speech: di-, sing, neng.
    grammar: jv.passive.written
    examples:
      - text: Lawang Sewu dibangun dening perusahaan sepur Walanda.
        ar_eg: لاوانج سيوو اتبنى على إيد شركة سكة حديد هولندية.
        ar: بنت شركةُ سكك حديد هولندية لاوانغ سيوو.
        en: Lawang Sewu was built by a Dutch railway company.
      - text: Pak Slamet kapilih dadi lurah.
        ar_eg: الأستاذ سلامت اتنتخب عمدة.
        ar: انتُخب السيد سلامت عمدةً.
        en: Pak Slamet was elected village head.
      - text: Masjid enggal dipunbangun dening warga.
        ar_eg: الجامع الجديد بناه الأهالي. (كراما)
        ar: بنى الأهالي المسجد الجديد. (كراما)
        en: The new mosque was built by the residents. (krama)
exercises:
