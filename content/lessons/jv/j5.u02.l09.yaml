dialogue:
  title: Minggu esuk
  lines:
    - speaker: Pak Harjo
      text: Mas, wis maca pengumuman? Minggu esuk ana kerja bakti.
      ar_eg: يا محمد، قريت الإعلان؟ يوم الحد الصبح فيه يوم شغل تطوعي.
      ar: يا محمد، هل قرأت الإعلان؟ صباح الأحد يوم عمل تطوعي.
      en: Mohamed, have you read the notice? There's a community work day on Sunday morning.
    - speaker: Mohamed
      text: Sampun, Pak. Kula badhe dhateng.
      ar_eg: قريته يا عمّو. أنا هاجي.
      ar: قرأته يا سيدي. سآتي.
      en: I have, sir. I'll come.
    - speaker: Pak Harjo
      text: Apik! Kali lan dalan ing kampung iki bakal diresiki bareng-bareng, lho.
      ar_eg: حلو! النهر والشوارع في الحي ده هيتنضّفوا مع بعض.
      ar: جميل! سيُنظَّف النهر والطرق في هذا الحي معًا.
      en: Great! The river and the roads in this neighbourhood will be cleaned together.
    - speaker: Mohamed
      text: Jam pinten, Pak?
      ar_eg: الساعة كام يا عمّو؟
      ar: في أي ساعة يا سيدي؟
      en: What time, sir?
    - speaker: Pak Harjo
      text: Jam pitu. Sarapan disiapake dening ibu-ibu.
      ar_eg: الساعة سبعة. والفطار الستات هيجهّزوه.
      ar: في السابعة. والفطور تُعِدّه السيدات.
      en: At seven. Breakfast is prepared by the women.
new_words:
