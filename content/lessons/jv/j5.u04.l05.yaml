schema: kabar.lesson/v1
id: j5.u04.l05
language: jv
title: Umuk ing medsos
can_do:
  ar_eg: 'تتكلم عن الناس على السوشيال ميديا: اللي بيتفشخر، واللي بيتريق، واللي بيكذب، واللي بيشتكي.'
  ar: 'أن تتحدث عن الناس على وسائل التواصل: المتباهي والساخر والكاذب والشاكي.'
  en: 'Talk about people on social media: show-offs, mockers, liars and people who complain.'
slides:
  - title: Komentar elek
    body:
      ar_eg: |
        umuk = يتفشخر، يتباهى بكلامه. ngece = يتريق على حد. nyacat = يعيب، ينتقد بوحاشة.
        ngapusi = يكذب، يضحك على حد. drengki = حسود، مش طايق نجاح غيره.
        ngglembuk = يدهن بالكلام الحلو عشان ياخد اللي عايزه. sengit = بيكره جامد. wadul = يشتكي لحد (يفتن).
      ar: |
        umuk = يتباهى بالكلام. ngece = يسخر من أحد. nyacat = يعيب، ينتقد بقسوة.
        ngapusi = يكذب، يخدع. drengki = حسود لا يحتمل نجاح غيره.
        ngglembuk = يتملّق بالكلام المعسول لينال ما يريد. sengit = يكره بشدة. wadul = يشكو إلى أحد (يوشي).
      en: |
        umuk = brag, show off. ngece = mock someone. nyacat = criticise harshly, find fault.
        ngapusi = lie, deceive. drengki = envious, begrudging others' success.
        ngglembuk = sweet-talk someone into something. sengit = hate, loathe. wadul = complain to someone, tell on.
    examples:
      - text: Akun iki umuk terus, pamer HP anyar.
        ar_eg: الأكونت ده بيتفشخر على طول، بيستعرض الموبايل الجديد.
        ar: هذا الحساب يتباهى دائمًا ويستعرض هاتفه الجديد.
        en: This account brags all the time, showing off a new phone.
      - text: Aja ngece komentare wong liya.
        ar_eg: ماتتريقش على كومنتات الناس.
        ar: لا تسخر من تعليقات الآخرين.
        en: Don't mock other people's comments.
      - text: 'Iklan iki ngapusi: regane beda karo sing ditulis.'
        ar_eg: 'الإعلان ده كداب: السعر غير المكتوب.'
        ar: 'هذا الإعلان كاذب: السعر يختلف عن المكتوب.'
        en: 'This ad is lying: the price is different from what''s written.'
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: umuk
        ar_eg: يتفشخر
        ar: يتباهى
        en: brag
      - text: ngece
        ar_eg: يتريق
        ar: يسخر
        en: mock
      - text: nyacat
        ar_eg: يعيب
        ar: ينتقد بقسوة
        en: find fault
      - text: ngapusi
        ar_eg: يكذب
        ar: يكذب، يخدع
        en: lie, deceive
    words: [umuk, ngece, nyacat, ngapusi]
  - id: e02
    type: match_pairs
    pairs:
      - text: drengki
        ar_eg: حسود
        ar: حسود
        en: envious
      - text: ngglembuk
        ar_eg: يدهن بالكلام
        ar: يتملّق
        en: sweet-talk
      - text: sengit
        ar_eg: بيكره
        ar: يكره بشدة
        en: loathe
      - text: wadul
        ar_eg: يشتكي لحد
        ar: يشكو، يوشي
        en: tell on
    words: [drengki, ngglembuk, sengit, wadul]
  - id: e03
    type: listen
    text: Adhiku wadul marang ibu, jare aku ngece dheweke.
    question:
      ar_eg: مين اشتكى لمين؟
      ar: من شكا لمن؟
      en: Who complained to whom?
    options: [أخويا الصغير اشتكى لماما إني اتريقت عليه, أخويا الصغير اتريق على ماما, ماما اشتكت مني لأخويا]
    answer: 0
    meaning:
      ar_eg: أخويا الصغير اشتكى لماما وقال إني اتريقت عليه.
      ar: شكاني أخي الصغير لأمي قائلًا إنني سخرت منه.
      en: My little brother told on me to Mum, saying I mocked him.
    words: [wadul, ngece]
  - id: e04
    type: fill_blank
    sentence: Wong sing ___ ora seneng ndeleng kancane sukses.
    meaning:
      ar_eg: الإنسان ___ مش بيحب يشوف صاحبه ناجح.
      ar: الشخص ___ لا يحب أن يرى صديقه ناجحًا.
      en: An ___ person doesn't like seeing a friend succeed.
    options: [drengki, umuk, wadul]
    answers: [drengki]
    words: [drengki, umuk, wadul]
    explain:
      ar_eg: drengki = حقود / حسود يكره نجاح غيره. umuk = بيتفشخر وwadul = يشتكي لحد.
      ar: drengki تعني الحقود الذي يكره نجاح غيره. أما umuk فيتباهى وwadul يشكو إلى أحد.
      en: drengki is spiteful, hating others' success. umuk is "brag" and wadul is "report/complain to someone".
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بيقول حاجات مش حقيقية عشان يضحك على الناس بيعمل إيه؟
      ar: من يقول أشياء غير صحيحة ليخدع الناس، ماذا يفعل؟
      en: Someone who says untrue things to fool people is doing what?
    options: [ngglembuk, ngapusi, nyacat]
    answer: 1
    explain:
      ar_eg: ngapusi = يكذب. ngglembuk = يدهن بالكلام الحلو، وnyacat = يعيب.
      ar: ngapusi = يكذب؛ ngglembuk = يتملّق، وnyacat = يعيب.
      en: ngapusi = lie; ngglembuk = sweet-talk, nyacat = find fault.
    words: [ngglembuk, ngapusi, nyacat]
  - id: e06
    type: fill_blank
    sentence: Dheweke ___ aku nganti aku gelem tuku dagangane.
    meaning:
      ar_eg: هو ___ عليّا عشان أشتري بضاعته.
      ar: ___ ني كي أشتري بضاعته.
      en: He ___ me into buying his goods.
    options: [ngglembuk, sengit, wadul]
    answers: [ngglembuk]
    words: [ngglembuk, sengit, wadul]
    explain:
      ar_eg: ngglembuk = ضحك عليه بالكلام الحلو لحد ما اشترى. sengit = بيكره وwadul = يشتكي.
      ar: ngglembuk تعني استماله بالكلام المعسول. أما sengit فيكره وwadul يشكو.
      en: ngglembuk is to sweet-talk someone into it. sengit is "hate" and wadul is "complain to someone".
  - id: e07
    type: multiple_choice
    question: Aja ___ video kancamu, mbok menawa dheweke lagi sinau.
    options: [nyacat, umuk, drengki]
    answer: 0
    explain:
      ar_eg: 'الجملة بتقول ماتعيبش على فيديو حد بيتعلم: nyacat = يعيب.'
      ar: 'الجملة تنهى عن انتقاد فيديو شخص يتعلّم: nyacat = يعيب.'
      en: 'The sentence says don''t run down a learner''s video: nyacat = find fault.'
    words: [nyacat, umuk, drengki]
  - id: e08
    type: build_sentence
    source:
      ar_eg: هو بيكره الكومنتات الوحشة.
      ar: يكره التعليقات السيئة.
      en: He hates nasty comments.
    answer: Dheweke sengit karo komentar elek.
    distractors: [umuk, wadul]
    words: [sengit]
    explain:
      ar_eg: sengit karo = بيكره. umuk = بيتفشخر وwadul = يشتكي، ومش في المعنى.
      ar: sengit karo تعني يكره. أما umuk (يتباهى) وwadul (يشكو) فليستا في المعنى.
      en: sengit karo is "hates". umuk (brag) and wadul (complain) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Akune umuk terus, mesthi ngapusi.
    answers_meaning:
      ar_eg: [الأكونت بيتفشخر على طول، أكيد بيكذب, صاحب الأكونت بيتباهى كتير، أكيد كداب]
      ar: [الحساب يتباهى دائمًا، لا بد أنه يكذب, يتباهى الحساب باستمرار، فهو يكذب حتمًا]
      en: ['The account keeps bragging, it must be lying', 'That account always shows off; it''s surely lying']
    words: [umuk, ngapusi]
  - id: e10
    type: speaking
    text: Aja ngece, aja nyacat, aja sengit.
    meaning:
      ar_eg: ماتتريقش، ماتعيبش، ماتكرهش.
      ar: لا تسخر، لا تعب، لا تكره.
      en: Don't mock, don't run people down, don't hate.
    words: [ngece, nyacat, sengit]
dialogue:
  lines:
    - speaker: Mohamed
      text: 'Mbak, iki lho: akun iki umuk terus.'
      ar_eg: 'يا مبك، بصي: الأكونت ده بيتفشخر على طول.'
      ar: 'انظري يا أختي: هذا الحساب يتباهى دائمًا.'
      en: 'Mbak, look: this account keeps bragging.'
    - speaker: Mbak Ayu
      text: Halah, paling ngapusi. Fotone njupuk saka internet, lho.
      ar_eg: يا عم، أكيد بيكذب. الصور واخدها من النت.
      ar: دعك منه، غالبًا يكذب. صوره مأخوذة من الإنترنت.
      en: Oh please, he's probably lying. The photos are from the internet.
    - speaker: Mohamed
      text: Lha kok komentare akeh sing ngece?
      ar_eg: أمال ليه كومنتات كتير بتتريق عليه؟
      ar: فلماذا يسخر منه كثير من المعلّقين؟
      en: So why are so many comments mocking him?
    - speaker: Mbak Ayu
      text: Ana sing drengki, ana sing sengit. Medsos ya ngono kuwi.
      ar_eg: فيه اللي حسود وفيه اللي بيكره. السوشيال ميديا كده.
      ar: بعضهم حسود وبعضهم يكره. هكذا هي وسائل التواصل.
      en: Some are envious, some just hate. That's social media.
    - speaker: Mohamed
      text: Aku arep wadul menyang admine wae.
      ar_eg: أنا هشتكي للأدمن وخلاص.
      ar: سأشكوه إلى المشرف.
      en: I'll just report it to the admin.
    - speaker: Mbak Ayu
      text: Ora usah. Sabar wae.
      ar_eg: مالوش لازمة. اصبر وخلاص.
      ar: لا داعي. اصبر فقط.
      en: No need. Just be patient.
