schema: kabar.lesson/v1
id: j5.u04.l05
language: jv
title: Caption Instagram
can_do:
  ar_eg: تقرا كابشن بوست مخلوط جاوي وإندونيسي وإنجليزي وتفهم هو بيقول إيه.
  ar: أن تقرأ تعليق منشور يمزج الجاوية والإندونيسية والإنجليزية وتفهم مضمونه.
  en: Read a post caption that mixes Javanese, Indonesian and English.
slides:
  - title: Postingane Mas Bayu
    body:
      ar_eg: |
        بايو نزّل صورة من متحف أمباراوا، والكابشن ده تحتها. اعمل التلات خطوات: لاقي الهيكل الجاوي، علّم الباقي، ورجّع الإملا.
        كلمات جديدة: akhire = أخيرًا (akhirnya: جذر إندونيسي من «آخِر» العربي + ـe الجاوية)، keren = جامد / روعة (سلانج إندونيسي)، wajib = لازم، من «واجب». وsepur uap = قطر بخاري (uap زي الإندونيسي).
      ar: |
        نشر بايو صورة من متحف أمباراوا، وهذا التعليق تحتها. طبّق الخطوات الثلاث: جد الهيكل الجاوي، وصنّف البقية، وردّ الإملاء.
        كلمات جديدة: akhire = أخيرًا (akhirnya: جذر إندونيسي من «آخِر» العربية + ـe الجاوية)، وkeren = رائع (عامية إندونيسية)، وwajib = يجب، من «واجب». وsepur uap = قطار بخاري (uap كالإندونيسية).
      en: |
        Bayu posted a photo from the Ambarawa museum with this caption. Do the three steps: find the Javanese frame, tag the rest, restore the spelling.
        New words: akhire = finally (akhirnya: an Indonesian root from Arabic «آخِر» + Javanese -e), keren = cool (Indonesian slang), wajib = a must, from «واجب». sepur uap = steam train (uap as in Indonesian).
    grammar: jv.codemix
    examples:
      - text: Akhire sempet dolan neng Ambarawa, guys!
        ar_eg: أخيرًا لحقت أروح أمباراوا يا جماعة!
        ar: أخيرًا سنحت لي فرصة زيارة أمباراوا يا جماعة!
        en: Finally got the chance to visit Ambarawa, guys!
      - text: Sepur uap lawas iki isih mlaku, keren bgt.
        ar_eg: القطر البخاري القديم ده لسه شغّال، جامد أوي.
        ar: هذا القطار البخاري القديم ما زال يعمل، رائع جدًا.
        en: This old steam train still runs, so cool.
      - text: Sing durung tau neng kene, wajib mampir!
        ar_eg: اللي لسه ما جاش هنا، لازم يعدّي!
        ar: من لم يأتِ إلى هنا بعد، فعليه أن يزوره!
        en: If you've never been here, you have to drop by!
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: البوست بيقول إيه عن القطر البخاري القديم؟
      ar: ماذا يقول المنشور عن القطار البخاري القديم؟
      en: What does the post say about the old steam train?
    options: [wis rusak, isih mlaku, ana ing Semarang]
    answer: 1
    words: [keren]
  - id: e02
    type: multiple_choice
    question: Akhire sempet dolan neng Ambarawa, guys!
    question_meaning:
      ar_eg: akhire معناها إيه بالإندونيسي؟
      ar: ما معنى akhire بالإندونيسية؟
      en: What is akhire in Indonesian?
    options: [akhirnya, akhir pekan, terakhir]
    answer: 0
    explain:
      ar_eg: akhir (من «آخِر») + ـe الجاوية = akhirnya. جذر إندونيسي بلاحقة جاوية، ده الـ codemix بعينه.
      ar: 'akhir (من «آخِر») + ـe الجاوية = akhirnya: جذر إندونيسي بلاحقة جاوية، وهذا جوهر المزج.'
      en: akhir (from «آخِر») + Javanese -e = akhirnya. An Indonesian root with a Javanese ending, code-mixing in one word.
    words: [akhire]
  - id: e03
    type: listen
    text: Sing durung tau neng kene, wajib mampir!
    question:
      ar_eg: بايو بيقول إيه للي لسه ما راحش؟
      ar: ماذا يقول بايو لمن لم يزر المكان بعد؟
      en: What does Bayu tell people who haven't been?
    options: [aja teka, mulih wae, wajib mampir]
    answer: 2
    meaning:
      ar_eg: اللي لسه ما جاش هنا، لازم يعدّي!
      ar: من لم يأتِ إلى هنا بعد، فعليه أن يزوره!
      en: If you've never been here, you have to drop by!
    words: [wajib, mampir]
  - id: e04
    type: match_pairs
    pairs:
      - text: akhire
        ar_eg: أخيرًا
        ar: أخيرًا
        en: finally
      - text: wajib
        ar_eg: لازم
        ar: يجب
        en: a must
      - text: keren
        ar_eg: جامد / روعة
        ar: رائع
        en: cool
      - text: sempet
        ar_eg: يلحق / تيجي له فرصة
        ar: تسنح له الفرصة
        en: get the chance
      - text: mampir
        ar_eg: يعدّي على
        ar: يمرّ بـ
        en: drop by
    words: [akhire, wajib, keren, sempet, mampir]
  - id: e05
    type: fill_blank
    sentence: Sepur uap lawas iki isih mlaku, ___ bgt.
    meaning:
      ar_eg: القطر البخاري القديم ده لسه شغّال، جامد أوي.
      ar: هذا القطار البخاري القديم ما زال يعمل، رائع جدًا.
      en: This old steam train still runs, so cool.
    options: [wajib, keren, akhire]
    answers: [keren]
    words: [keren]
  - id: e06
    type: dictation
    text: Akhire sempet dolan neng Ambarawa, guys!
    meaning:
      ar_eg: أخيرًا لحقت أروح أمباراوا يا جماعة!
      ar: أخيرًا سنحت لي فرصة زيارة أمباراوا يا جماعة!
      en: Finally got the chance to visit Ambarawa, guys!
    words: [akhire, sempet]
  - id: e07
    type: translate
    direction: from_target
    source_text: Sing durung tau neng kene, wajib mampir!
    answers_meaning:
      ar_eg:
        - اللي لسه ما جاش هنا، لازم يعدّي!
        - اللي عمره ما جه هنا، لازم ييجي!
        - اللي لسه ما زارش المكان ده، لازم يعدّي عليه!
        - اللي ما جاش هنا قبل كده، لازم ييجي!
      ar:
        - من لم يأتِ إلى هنا بعد، فعليه أن يزوره!
        - من لم يزر هذا المكان من قبل، فلا بد أن يمرّ به!
        - من لم يأتِ إلى هنا قط، يجب أن يزوره!
      en:
        - If you've never been here, you have to drop by!
        - Anyone who hasn't been here yet must drop by!
        - If you haven't been here yet, you must drop by!
        - Those who have never been here must visit!
        - If you've never been here, you must stop by!
    words: [wajib, mampir]
  - id: e08
    type: build_sentence
    source:
      ar_eg: (كابشن) لازم تعدّي على المتحف ده، جامد أوي!
      ar: (تعليق منشور) يجب أن تمرّ بهذا المتحف، رائع جدًا!
      en: (caption) You must drop by this museum, it's so cool!
    answer: Wajib mampir neng museum iki, keren bgt!
    distractors: [akhire, ora]
    words: [wajib, keren]
dialogue:
  title: Telung basa
  lines:
    - speaker: Mas Bayu
      text: Mohamed, wis maca captionku?
      ar_eg: يا محمد، قريت الكابشن بتاعي؟
      ar: يا محمد، هل قرأت تعليقي؟
      en: Mohamed, have you read my caption?
    - speaker: Mohamed
      text: Wis. "Wajib" iku saka basa Arab, Mas. Wajib, kudu.
      ar_eg: قريته. «wajib» دي من العربي يا بايو. واجب، يعني لازم.
      ar: 'قرأته. «wajib» من العربية يا بايو: واجب، أي يجب.'
      en: Yes. "Wajib" is from Arabic, Bayu. Obligatory, a must.
    - speaker: Mas Bayu
      text: Tenan? Lan "akhire"?
      ar_eg: بجد؟ و«akhire»؟
      ar: حقًا؟ و«akhire»؟
      en: Really? And "akhire"?
    - speaker: Mohamed
      text: Akhir uga saka basa Arab. Lan "-e" iku Jawa!
      ar_eg: akhir برضه من العربي. والـ «-e» دي جاوي!
      ar: akhir أيضًا من العربية، و«-e» جاوية!
      en: Akhir is from Arabic too. And the "-e" is Javanese!
    - speaker: Mas Bayu
      text: Keren bgt! Telung basa ing siji caption.
      ar_eg: جامد أوي! تلات لغات في كابشن واحد.
      ar: رائع جدًا! ثلاث لغات في تعليق واحد.
      en: So cool! Three languages in one caption.
new_words:
  - word: akhire
    pos: adverb
    ar_eg: أخيرًا (akhir + ـe)
    ar: أخيرًا (akhir + ـe)
    en: finally (akhir + -e) = akhirnya
    arabic: آخِر
  - word: wajib
    pos: adjective
    ar_eg: لازم / واجب
    ar: واجب / لا بد منه
    en: a must, obligatory = wajib
    arabic: واجب
  - word: keren
    pos: adjective
    ar_eg: جامد / روعة (سلانج)
    ar: رائع (عامية)
    en: cool (slang) = keren
review:
  status: draft
