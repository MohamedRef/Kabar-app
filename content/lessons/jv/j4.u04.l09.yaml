schema: kabar.lesson/v1
id: j4.u04.l09
language: jv
title: Tata krama saka Mas Dimas
can_do:
  ar_eg: تقرا نصايح صاحبك بالنغوكو عن آداب الزيارة وتعرف العبارات الثابتة اللي جواها.
  ar: أن تقرأ نصائح صديقك بالنغوكو عن آداب الزيارة وتتعرّف على العبارات الثابتة فيها.
  en: Read a friend's ngoko tips on visiting etiquette and pick out the set phrases inside.
slides:
  - title: Pesene Mas Dimas
    body:
      ar_eg: |
        قبل أول زيارة لـ Bu Ningsih، Mas Dimas بعت لمحمد نصايح على الواتساب. صاحبك، يبقى بيكتب نغوكو.
        بس العبارات اللي هتقولها لـ Bu Ningsih جوّه الرسالة بالكراما: «Kula nuwun!» و«Sampun repot-repot, Bu». yen = لو (بالإندونيسي kalau).
        - to كلمة صغيرة بتدّي الجملة إحساس، ومن غيرها الجملة صح برضه.
      ar: |
        قبل زيارته الأولى لـ Bu Ningsih، أرسل Mas Dimas إلى محمد نصائح على الواتساب، وهو صديقه فيكتب بالنغوكو.
        لكن العبارات التي ستقولها لـ Bu Ningsih تأتي داخل الرسالة بالكراما: «Kula nuwun!» و«Sampun repot-repot, Bu». yen = إذا (بالإندونيسية kalau).
        - to أداة صغيرة تلوّن الجملة، والجملة صحيحة بدونها.
      en: |
        Before Mohamed's first visit to Bu Ningsih, Mas Dimas sent him tips on WhatsApp. He's a friend, so he writes in ngoko.
        But the phrases you'll say to Bu Ningsih appear inside the message in krama: "Kula nuwun!" and "Sampun repot-repot, Bu". yen = if (Indonesian kalau).
        - to is a small particle that adds feeling; the sentence is correct without it.
    grammar: jv.etiquette.phrases
    examples:
      - text: Yen wis teka, ngomong «Kula nuwun!»
        ar_eg: لما توصل، قول «Kula nuwun!»
        ar: إذا وصلت فقل «Kula nuwun!»
        en: When you get there, say "Kula nuwun!"
      - text: Salaman nganggo tangan tengen, aja tangan kiwa.
        ar_eg: سلّم بإيدك اليمين، مش الشمال.
        ar: صافح باليد اليمنى لا اليسرى.
        en: Shake hands with your right hand, not your left.
      - text: Yen Bu Ningsih nggawe teh, ngomong «Sampun repot-repot, Bu.»
        ar_eg: لو Bu Ningsih عملت شاي، قول «ماتتعبيش نفسك يا هانم.»
        ar: إذا أعدّت Bu Ningsih الشاي فقل «لا تُتعبي نفسك يا سيدتي.»
        en: If Bu Ningsih makes tea, say "Please don't go to any trouble, ma'am."
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: Dimas قال لمحمد يقول إيه على الباب؟
      ar: ماذا قال Dimas لمحمد أن يقول عند الباب؟
      en: What does Dimas tell Mohamed to say at the door?
    options: ['Mangga!', 'Kula nuwun!', 'Ngatos-atos.']
    answer: 1
    explain:
      ar_eg: «Yen wis teka, ngomong Kula nuwun!» - الضيف بيقول Kula nuwun، وصاحب البيت يرد Mangga.
      ar: «Yen wis teka, ngomong Kula nuwun!» - الضيف يقول Kula nuwun، ويردّ صاحب البيت Mangga.
      en: '"Yen wis teka, ngomong Kula nuwun!" The guest says Kula nuwun; the host answers Mangga.'
    words: [kula nuwun]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إمتى محمد يقول «Sampun repot-repot»؟
      ar: متى يقول محمد «Sampun repot-repot»؟
      en: When should Mohamed say "Sampun repot-repot"?
    options: [Yen wis teka, Yen salaman, Yen Bu Ningsih nggawe teh]
    answer: 2
    explain:
      ar_eg: لما صاحبة البيت تتعب نفسها عشانك، زي ما تعمل شاي.
      ar: حين تتكلّف صاحبة البيت من أجلك، كأن تعدّ الشاي.
      en: When the host goes to trouble for you, like making tea.
    words: [sampun repot-repot]
  - id: e03
    type: listen
    text: Salaman nganggo tangan tengen, aja tangan kiwa.
    question:
      ar_eg: يسلّم بأنهي إيد؟
      ar: بأي يد يصافح؟
      en: Which hand should he shake hands with?
    options: [tangan tengen, tangan kiwa]
    answer: 0
    meaning:
      ar_eg: سلّم بإيدك اليمين، مش الشمال.
      ar: صافح باليد اليمنى لا اليسرى.
      en: Shake hands with your right hand, not your left.
    words: [salaman, tengen, kiwa]
  - id: e04
    type: match_pairs
    pairs:
      - text: kula nuwun
        ar_eg: يا أهل الدار! (على الباب)
        ar: يا أهل الدار! (عند الباب)
        en: hello, anyone home? (at the door)
      - text: salaman
        ar_eg: يسلّم بالإيد
        ar: يصافح
        en: shake hands
      - text: tengen
        ar_eg: يمين
        ar: يمين
        en: right
      - text: kiwa
        ar_eg: شمال
        ar: يسار
        en: left
      - text: sampun repot-repot
        ar_eg: ماتتعبش نفسك
        ar: لا تُتعب نفسك
        en: please don't go to any trouble
    words: [kula nuwun, salaman, tengen, kiwa, sampun repot-repot]
  - id: e05
    type: fill_blank
    sentence: Yen Bu Ningsih nggawe teh, ngomong «Sampun ___, Bu.»
    meaning:
      ar_eg: لو Bu Ningsih عملت شاي، قول «ماتتعبيش نفسك يا هانم.»
      ar: إذا أعدّت Bu Ningsih الشاي فقل «لا تُتعبي نفسك يا سيدتي.»
      en: If Bu Ningsih makes tea, say "Please don't go to any trouble, ma'am."
    answers: [repot-repot, repot repot]
    words: [sampun repot-repot]
  - id: e06
    type: dictation
    text: Salaman nganggo tangan tengen, aja tangan kiwa.
    meaning:
      ar_eg: سلّم بإيدك اليمين، مش الشمال.
      ar: صافح باليد اليمنى لا اليسرى.
      en: Shake hands with your right hand, not your left.
    words: [salaman, tengen, kiwa]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (على باب Bu Ningsih) يا أهل الدار! أنا محمد يا هانم.
      ar: (عند باب Bu Ningsih) يا أهل الدار! أنا محمد يا سيدتي.
      en: (at Bu Ningsih's door) Hello, anyone home? I'm Mohamed, ma'am.
    answers:
      - Kula nuwun! Kula Mohamed, Bu.
      - Kula nuwun, Bu! Kula Mohamed.
      - Kula nuwun! Nami kula Mohamed, Bu.
      - Kula nuwun, Bu! Nami kula Mohamed.
      - Kula nuwun! Menika Mohamed, Bu.
    explain:
      ar_eg: بتبدأ بـ Kula nuwun، وبعدين تعرّف نفسك بالكراما (kula، nami kula).
      ar: تبدأ بـ Kula nuwun، ثم تعرّف بنفسك بالكراما (kula، nami kula).
      en: Start with Kula nuwun, then introduce yourself in krama (kula, nami kula).
    words: [kula nuwun]
dialogue:
  title: Chat karo Mas Dimas
  lines:
    - speaker: Mohamed
      text: Mas, suwun pesene!
      ar_eg: شكرًا على الرسالة يا Dimas!
      ar: شكرًا على رسالتك يا Dimas!
      en: Thanks for the message, Dimas!
    - speaker: Mas Dimas
      text: Padha-padha. Wis ngerti, to?
      ar_eg: العفو. فهمت؟
      ar: عفوًا. هل فهمت؟
      en: You're welcome. Got it?
    - speaker: Mohamed
      text: Wis. «Kula nuwun», salaman nganggo tangan tengen, lan «Sampun repot-repot».
      ar_eg: أيوه. «Kula nuwun»، أسلّم باليمين، و«Sampun repot-repot».
      ar: نعم. «Kula nuwun»، والمصافحة باليمنى، و«Sampun repot-repot».
      en: Yes. "Kula nuwun", shake hands with the right hand, and "Sampun repot-repot".
    - speaker: Mas Dimas
      text: Apik! Yen mulih, ngomong «Kula nyuwun pamit rumiyin».
      ar_eg: حلو! ولما تمشي، قول «Kula nyuwun pamit rumiyin».
      ar: أحسنت! وإذا انصرفت فقل «Kula nyuwun pamit rumiyin».
      en: Good! When you leave, say "Kula nyuwun pamit rumiyin".
    - speaker: Mohamed
      text: Iya, Mas. Suwun!
      ar_eg: حاضر. شكرًا!
      ar: حسنًا. شكرًا!
      en: OK. Thanks!
