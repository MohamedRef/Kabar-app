schema: kabar.lesson/v1
id: j4.u04.l09
language: jv
title: Pak Wahyu ing Taman Sari
can_do:
  ar_eg: تفهم مرشد سياحي بيتكلم كراما مع الزوّار وترد بأدب.
  ar: أن تفهم مرشدًا سياحيًا يخاطب الزوّار بالكراما وتردّ بأدب.
  en: Follow a guide speaking krama to visitors and answer politely.
slides:
  - title: Sugeng rawuh wonten Taman Sari
    body:
      ar_eg: |
        في Taman Sari، المرشد Pak Wahyu بيكلّم مجموعة زوّار بالكراما. اسمع الأول.
        هتسمع عبارات الترحيب والأدب اللي اتعلمتها: sugeng rawuh، mangga، ngatos-atos. وmlampah = يمشي (كراما).
      ar: |
        في Taman Sari يخاطب المرشد Pak Wahyu مجموعة من الزوّار بالكراما. استمع أولًا.
        ستسمع عبارات الترحيب والأدب التي تعلّمتها: sugeng rawuh، mangga، ngatos-atos. وmlampah = يمشي (كراما).
      en: |
        At Taman Sari, the guide Pak Wahyu talks to a group of visitors in krama. Listen first.
        You'll hear the welcome and courtesy phrases you know: sugeng rawuh, mangga, ngatos-atos. mlampah = walk (krama).
    grammar: jv.etiquette.phrases
    examples:
      - text: Sugeng rawuh wonten Taman Sari, Bapak lan Ibu.
        ar_eg: أهلًا بحضراتكم في Taman Sari.
        ar: مرحبًا بكم في Taman Sari أيها السادة والسيدات.
        en: Welcome to Taman Sari, ladies and gentlemen.
      - text: Taman Sari menika rumiyin kagem Sultan lan garwanipun.
        ar_eg: Taman Sari زمان كانت للسلطان ومراته.
        ar: كان Taman Sari قديمًا للسلطان وزوجته.
        en: Long ago, Taman Sari was for the Sultan and his wife.
      - text: Mangga mlampah nengen. Ngatos-atos.
        ar_eg: اتفضلوا امشوا يمين. خلّوا بالكم.
        ar: تفضّلوا بالسير يمينًا، وانتبهوا.
        en: Please walk to the right. Take care.
exercises:
  - id: e01
    type: listen
    text: Taman Sari menika rumiyin kagem Sultan lan garwanipun.
    question:
      ar_eg: Taman Sari زمان كانت لمين؟
      ar: لمن كان Taman Sari قديمًا؟
      en: Who was Taman Sari for, long ago?
    options: [kagem abdi dalem, kagem Sultan lan garwanipun, kagem bakul batik]
    answer: 1
    meaning:
      ar_eg: Taman Sari زمان كانت للسلطان ومراته.
      ar: كان Taman Sari قديمًا للسلطان وزوجته.
      en: Long ago, Taman Sari was for the Sultan and his wife.
    words: [kagem, garwa]
  - id: e02
    type: listen
    text: Mangga mlampah nengen. Ngatos-atos.
    question:
      ar_eg: المجموعة تمشي ناحية إيه؟
      ar: في أي اتجاه تسير المجموعة؟
      en: Which way does the group walk?
    options: [ngiwa, nengen, lurus]
    answer: 1
    meaning:
      ar_eg: اتفضلوا امشوا يمين. خلّوا بالكم.
      ar: تفضّلوا بالسير يمينًا، وانتبهوا.
      en: Please walk to the right. Take care.
    words: [ngatos-atos]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: الجولة خلصت والمرشد بيسلّم عليكم. ترد بإيه؟
      ar: انتهت الجولة والمرشد يودّعكم. بمَ تردّ؟
      en: The tour is over and the guide says goodbye. What do you answer?
    options: ['Matur nuwun sanget, Pak.', 'Sami-sami, Pak.', 'Kula nuwun, Pak.']
    answer: 0
    explain:
      ar_eg: بتشكره. sami-sami = العفو (رد على الشكر)، وkula nuwun بتتقال على الباب.
      ar: تشكره، أما sami-sami فردّ على الشكر، وkula nuwun تُقال عند الباب.
      en: You thank him. sami-sami answers a thank-you; kula nuwun is for the door.
    words: [matur nuwun]
  - id: e04
    type: match_pairs
    pairs:
      - text: sugeng rawuh
        ar_eg: أهلًا وسهلًا
        ar: أهلًا وسهلًا
        en: welcome
      - text: mlampah
        ar_eg: يمشي (كراما)
        ar: يمشي (كراما)
        en: walk (krama)
      - text: ngatos-atos
        ar_eg: خلّي بالك
        ar: انتبه
        en: take care
      - text: ndherek langkung
        ar_eg: بعد إذنك، هعدّي
        ar: عن إذنك، سأمرّ
        en: excuse me, may I pass
    words: [ngatos-atos, ndherek langkung]
  - id: e05
    type: dictation
    text: Sugeng rawuh wonten Taman Sari, Bapak lan Ibu.
    meaning:
      ar_eg: أهلًا بحضراتكم في Taman Sari.
      ar: مرحبًا بكم في Taman Sari أيها السادة والسيدات.
      en: Welcome to Taman Sari, ladies and gentlemen.
  - id: e06
    type: fill_blank
    sentence: Mangga mlampah nengen. ___.
    meaning:
      ar_eg: اتفضلوا امشوا يمين. خلّوا بالكم.
      ar: تفضّلوا بالسير يمينًا، وانتبهوا.
      en: Please walk to the right. Take care.
    answers: [Ngatos-atos, Ngatos atos]
    explain:
      ar_eg: ngatos-atos = خلّي بالك، كراما ati-ati.
      ar: ngatos-atos = انتبه، وهي كراما ati-ati.
      en: ngatos-atos = take care, the krama of ati-ati.
    words: [ngatos-atos]
  - id: e07
    type: build_sentence
    source:
      ar_eg: Taman Sari زمان كانت للسلطان.
      ar: كان Taman Sari قديمًا للسلطان.
      en: Long ago, Taman Sari was for the Sultan.
    answer: Taman Sari menika rumiyin kagem Sultan.
    distractors: [kangge, sowan]
    explain:
      ar_eg: للسلطان، يبقى kagem مش kangge.
      ar: للسلطان، فتقول kagem لا kangge.
      en: It's for the Sultan, so kagem, not kangge.
    words: [kagem]
  - id: e08
    type: speaking
    text: Nuwun sewu, Bu, ndherek langkung.
    meaning:
      ar_eg: لا مؤاخذة يا هانم، هعدّي.
      ar: عذرًا يا سيدتي، اسمحي لي بالمرور.
      en: Excuse me, ma'am, may I pass?
    words: [ndherek langkung]
dialogue:
  title: Ing Taman Sari
  lines:
    - speaker: Pak Wahyu
      text: Sugeng rawuh, Mas. Saking pundi?
      ar_eg: أهلًا وسهلًا يا ابني. منين؟
      ar: أهلًا وسهلًا يا بني. من أين أنت؟
      en: Welcome. Where are you from?
    - speaker: Mohamed
      text: Saking Mesir, Pak.
      ar_eg: من مصر يا أستاذ.
      ar: من مصر يا سيدي.
      en: From Egypt, sir.
    - speaker: Pak Wahyu
      text: Wah, tebih sanget! Mangga, mlampah nengen.
      ar_eg: ياه، بعيدة أوي! اتفضل امشي يمين.
      ar: ما أبعدها! تفضّل بالسير يمينًا.
      en: Wow, that's far! Please, walk to the right.
    - speaker: Mohamed
      text: Nuwun sewu, Bu, ndherek langkung.
      ar_eg: لا مؤاخذة يا هانم، هعدّي.
      ar: عذرًا يا سيدتي، اسمحي لي بالمرور.
      en: Excuse me, ma'am, may I pass?
    - speaker: Bu Warsih
      text: Mangga, Mas, mangga.
      ar_eg: اتفضل يا ابني، اتفضل.
      ar: تفضّل يا بني، تفضّل.
      en: Go ahead, go ahead.
    - speaker: Pak Wahyu
      text: Sae, Mas! Ngatos-atos.
      ar_eg: برافو يا ابني! خلّي بالك بقى.
      ar: أحسنت يا بني! وانتبه.
      en: Well done! Take care, now.
