schema: kabar.lesson/v1
id: j3.u04.l02
language: jv
title: Pinten, kados pundi
can_do:
  ar_eg: تسأل «كام؟» و«إزاي؟» (وكمان «ليه؟» و«إمتى؟») بأدب بالكراما.
  ar: أن تسأل «كم؟» و«كيف؟» (و«لماذا؟» و«متى؟») بأدب بالكراما.
  en: Ask how much and how.
slides:
  - title: pira → pinten
    body:
      ar_eg: |
        pira (= berapa) في الكراما **pinten**. بتنفع للسعر، والساعة، والعدد:
        - Reginipun pinten? = سعره كام؟ (Harganya berapa?) — reginipun = regane بالكراما، هنفهم -nipun في J3.6.
        - Jam pinten? = الساعة كام؟ (Jam berapa?)
        خبر حلو: الأرقام من ٦ لـ ٩ (enem، pitu، wolu، sanga) هي هي في النغوكو والكراما. فـ «Jam sanga» = الساعة تسعة بتنفع مع أي حد.
      ar: |
        pira (= berapa) في الكراما **pinten**، وتصلح للسعر والساعة والعدد:
        - Reginipun pinten? = بكم ثمنه؟ (Harganya berapa?)، وreginipun = regane بالكراما، وسنشرح -nipun في J3.6.
        - Jam pinten? = كم الساعة؟ (Jam berapa?)
        ومن حسن الحظ أن الأعداد من ٦ إلى ٩ (enem، pitu، wolu، sanga) واحدة في النغوكو والكراما، فـ «Jam sanga» = الساعة التاسعة تصلح مع الجميع.
      en: |
        pira (= berapa) is **pinten** in krama. It works for prices, the time and amounts:
        - Reginipun pinten? = How much is it? (Harganya berapa?) — reginipun is krama for regane; -nipun comes in J3.6.
        - Jam pinten? = What time is it? (Jam berapa?)
        Good news: 6–9 (enem, pitu, wolu, sanga) are the same in ngoko and krama, so "Jam sanga" = nine o'clock works with anyone.
    grammar: jv.krama.questions
    examples:
      - text: Nyuwun sewu, Pak, jam pinten? — Jam sanga.
        ar_eg: لا مؤاخذة يا حاج، الساعة كام؟ — تسعة.
        ar: عفوًا يا سيدي، كم الساعة؟ — التاسعة.
        en: Excuse me, sir, what time is it? — Nine o'clock.
      - text: Reginipun pinten, Bu?
        ar_eg: بكام يا حاجة؟
        ar: بكم ثمنه يا سيدتي؟
        en: How much is it, ma'am?
  - title: piye → kados pundi / pripun
    body:
      ar_eg: |
        piye (= bagaimana) في الكراما **kados pundi**، وفي الكلام اليومي الأقصر **pripun**. الاتنين صح؛ pripun هتسمعها أكتر في السوق والشارع.
        - Pripun kabaripun? = أخبار حضرتك إيه؟ (Bagaimana kabarnya?) — وkabar جاية من العربي «خبر»!
        - الرد: Saé, matur nuwun. = كويس، شكرًا. (saé = apik / baik)
        - Batik menika pripun? — Saé sanget! = الباتيك ده إيه رأيك فيه؟ — حلو جدًا! (sanget = banget)
      ar: |
        piye (= bagaimana) في الكراما **kados pundi**، وفي الكلام اليومي الأقصر **pripun**، وكلاهما صحيح، وpripun أكثر سماعًا في السوق والشارع.
        - Pripun kabaripun? = كيف حالكم؟ (Bagaimana kabarnya?)، وkabar من العربية «خبر».
        - والجواب: Saé, matur nuwun. = بخير، شكرًا. (saé = apik / baik)
        - Batik menika pripun? — Saé sanget! = ما رأيك في هذا الباتيك؟ — جميل جدًا! (sanget = banget)
      en: |
        piye (= bagaimana) is **kados pundi** in krama; in everyday speech the shorter **pripun**. Both are right; you'll hear pripun more at the market and in the street.
        - Pripun kabaripun? = How are you? (Bagaimana kabarnya?) — and kabar is Arabic «خبر»!
        - Answer: Saé, matur nuwun. = Fine, thank you. (saé = apik / baik)
        - Batik menika pripun? — Saé sanget! = How's this batik? — Very nice! (sanget = banget)
    grammar: jv.krama.questions
    examples:
      - text: Pripun kabaripun? — Saé, matur nuwun.
        ar_eg: أخبار حضرتك إيه؟ — كويس، شكرًا.
        ar: كيف حالكم؟ — بخير، شكرًا.
        en: How are you? — Fine, thank you.
      - text: Kados pundi, Pak?
        ar_eg: إزاي يا حاج؟ / إيه رأي حضرتك؟
        ar: كيف يا سيدي؟ / ما رأيكم؟
        en: How is it, sir? / What do you think?
  - title: ngapa → kenging menapa · kapan = kapan
    body:
      ar_eg: |
        - ngapa (= kenapa) في الكراما **kenging menapa** = ليه.
        - **kapan** (= kapan) مابتتغيرش! نفس الكلمة في النغوكو والكراما والإندونيسي.
        - Kenging menapa panjenengan sinau basa Jawi? = حضرتك بتتعلم جاوي ليه؟
        - Kula remen basa Jawi. = أنا بحب الجاوي. (remen = seneng / suka، وJawi = Jawa بالكراما)
      ar: |
        - ngapa (= kenapa) في الكراما **kenging menapa** = لماذا.
        - **kapan** (= kapan) لا تتغير، فهي واحدة في النغوكو والكراما والإندونيسية.
        - Kenging menapa panjenengan sinau basa Jawi? = لماذا تتعلم الجاوية؟
        - Kula remen basa Jawi. = أحب الجاوية. (remen = seneng / suka، وJawi = Jawa في الكراما)
      en: |
        - ngapa (= kenapa) is **kenging menapa** in krama = why.
        - **kapan** (= kapan) doesn't change: same word in ngoko, krama and Indonesian.
        - Kenging menapa panjenengan sinau basa Jawi? = Why are you learning Javanese?
        - Kula remen basa Jawi. = I like Javanese. (remen = seneng / suka; Jawi = krama for Jawa)
    grammar: jv.krama.questions
    examples:
      - text: Kenging menapa panjenengan sinau basa Jawi?
        ar_eg: حضرتك بتتعلم جاوي ليه؟
        ar: لماذا تتعلم الجاوية؟
        en: Why are you learning Javanese?
      - text: Kula remen basa Jawi.
        ar_eg: أنا بحب الجاوي.
        ar: أحب الجاوية.
        en: I like Javanese.
  - title: Tabel pitakon krama
    body:
      ar_eg: |
        كل أدوات السؤال (نغوكو → كراما = إندونيسي):
        - apa → menapa (napa) = apa
        - sapa → sinten = siapa
        - ngendi → pundi = mana
        - pira → pinten = berapa
        - piye → kados pundi / pripun = bagaimana
        - ngapa → kenging menapa = kenapa
        - kapan → kapan = kapan
        الشات: pripun وpinten بيتكتبوا زي ما هم، وmenapa بتبقى napa.
      ar: |
        أدوات الاستفهام كلها (نغوكو → كراما = إندونيسي):
        - apa → menapa (napa) = apa
        - sapa → sinten = siapa
        - ngendi → pundi = mana
        - pira → pinten = berapa
        - piye → kados pundi / pripun = bagaimana
        - ngapa → kenging menapa = kenapa
        - kapan → kapan = kapan
        وفي الدردشة تُكتب pripun وpinten كما هما، وتصير menapa غالبًا napa.
      en: |
        All the question words (ngoko → krama = Indonesian):
        - apa → menapa (napa) = apa
        - sapa → sinten = siapa
        - ngendi → pundi = mana
        - pira → pinten = berapa
        - piye → kados pundi / pripun = bagaimana
        - ngapa → kenging menapa = kenapa
        - kapan → kapan = kapan
        In chats pripun and pinten stay as they are; menapa is usually typed napa.
    grammar: jv.krama.questions
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: pinten
        ar_eg: كام (berapa)
        ar: كم (berapa)
        en: how much / how many (berapa)
      - text: pripun
        ar_eg: إزاي (bagaimana)
        ar: كيف (bagaimana)
        en: how (bagaimana)
      - text: kenging menapa
        ar_eg: ليه (kenapa)
        ar: لماذا (kenapa)
        en: why (kenapa)
      - text: kapan
        ar_eg: إمتى (kapan)
        ar: متى (kapan)
        en: when (kapan)
    words: [pinten, pripun, kenging menapa, kapan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه نسخة الكراما من piye؟
      ar: ما صورة الكراما من piye؟
      en: What is the krama form of piye?
    options: ["kenging menapa", "kados pundi", "pinten"]
    answer: 1
    explain:
      ar_eg: piye → kados pundi (وفي الكلام pripun). pinten = كام، kenging menapa = ليه.
      ar: piye → kados pundi (وفي الكلام pripun)، وpinten = كم، وkenging menapa = لماذا.
      en: piye → kados pundi (spoken pripun). pinten = how much, kenging menapa = why.
    words: [kados pundi]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة مابتتغيرش بين النغوكو والكراما؟
      ar: أي كلمة لا تتغير بين النغوكو والكراما؟
      en: Which question word is the same in ngoko and krama?
    options: ["sinten", "kapan", "pinten"]
    answer: 1
    explain:
      ar_eg: kapan هي هي في الاتنين (وفي الإندونيسي كمان). pira → pinten وsapa → sinten.
      ar: kapan واحدة في المستويين وفي الإندونيسية، أما pira فتصير pinten وsapa تصير sinten.
      en: kapan stays kapan (also in Indonesian). pira → pinten, sapa → sinten.
    words: [kapan]
  - id: e04
    type: listen
    text: Pripun kabaripun?
    options: ["Reginipun pinten?", "Pripun kabaripun?", "Asmanipun sinten?"]
    answer: 1
    words: [pripun, kabar]
  - id: e05
    type: multiple_choice
    question: Pripun kabaripun?
    question_meaning:
      ar_eg: أنهي رد مناسب؟
      ar: أي جواب يناسب؟
      en: Which answer fits?
    options: ["Kula saking Kairo.", "Jam wolu.", "Saé, matur nuwun."]
    answer: 2
    explain:
      ar_eg: Pripun kabaripun = أخبارك إيه، فالرد Saé = كويس.
      ar: Pripun kabaripun = كيف حالكم، فالجواب Saé = بخير.
      en: Pripun kabaripun = how are you, so the answer is Saé = fine.
    words: [saé]
  - id: e06
    type: fill_blank
    sentence: Nyuwun sewu, Pak, jam ___? — Jam sanga.
    meaning:
      ar_eg: لا مؤاخذة يا حاج، الساعة كام؟ — تسعة.
      ar: عفوًا يا سيدي، كم الساعة؟ — التاسعة.
      en: Excuse me, sir, what time is it? — Nine o'clock.
    options: ["pinten", "pira", "pundi"]
    answers: [pinten]
    explain:
      ar_eg: pira نغوكو، ومع Nyuwun sewu وPak بنقول pinten. والرد sanga (٩) هو هو في المستويين.
      ar: pira من النغوكو، ومع Nyuwun sewu نقول pinten، والعدد sanga (٩) واحد في المستويين.
      en: pira is ngoko; with Nyuwun sewu and Pak use pinten. sanga (9) is the same in both levels.
    words: [pinten, jam]
  - id: e07
    type: fill_blank
    sentence: ___ panjenengan sinau basa Jawi? — Kula remen basa Jawi.
    meaning:
      ar_eg: حضرتك بتتعلم جاوي ليه؟ — عشان بحب الجاوي.
      ar: لماذا تتعلم الجاوية؟ — لأني أحب الجاوية.
      en: Why are you learning Javanese? — Because I like Javanese.
    options: ["Kados pundi", "Kenging menapa", "Pinten"]
    answers: [Kenging menapa]
    explain:
      ar_eg: الرد سبب (بحب الجاوي)، يبقى السؤال «ليه» = kenging menapa.
      ar: الجواب سبب، فالسؤال «لماذا» = kenging menapa.
      en: The answer gives a reason, so the question is "why" = kenging menapa.
    words: [kenging menapa, remen]
  - id: e08
    type: multiple_choice
    question_meaning:
      ar_eg: محمد عايز يسأل بو سيتي عن سعر الباتيك بأدب. يقول إيه؟
      ar: يريد محمد أن يسأل بو سيتي بأدب عن ثمن الباتيك. ماذا يقول؟
      en: Mohamed wants to ask Bu Siti the price of the batik politely. What does he say?
    options: ["Regane pira, Bu?", "Reginipun pinten, Bu?", "Reginipun pira, Bu?"]
    answer: 1
    explain:
      ar_eg: "Regane pira نغوكو كلها. وReginipun pira خلطة: بدأت كراما وخلصت نغوكو. الصح كراما للآخر: Reginipun pinten."
      ar: "Regane pira كلها نغوكو، وReginipun pira خليط، والصواب كراما خالصة: Reginipun pinten."
      en: "Regane pira is all ngoko; Reginipun pira mixes levels. Keep it krama all the way: Reginipun pinten."
    words: [pinten, regi]
  - id: e09
    type: build_sentence
    source:
      ar_eg: أخبار حضرتك إيه يا حاجة؟
      ar: كيف حالكِ يا سيدتي؟
      en: How are you, ma'am?
    answer: Pripun kabaripun, Bu?
    distractors: [piye, kabaré]
    explain:
      ar_eg: pripun (piye بالكراما) + kabaripun (kabaré بالكراما).
      ar: pripun (كراما piye) + kabaripun (كراما kabaré).
      en: pripun (krama piye) + kabaripun (krama kabaré).
    words: [pripun, kabar]
  - id: e10
    type: build_sentence
    source:
      ar_eg: حضرتك بتتعلم جاوي ليه؟
      ar: لماذا تتعلم الجاوية؟
      en: Why are you learning Javanese?
    answer: Kenging menapa panjenengan sinau basa Jawi?
    distractors: [ngapa, Jawa]
    explain:
      ar_eg: ngapa → kenging menapa، وJawa → Jawi في الكراما.
      ar: ngapa → kenging menapa، وJawa → Jawi في الكراما.
      en: ngapa → kenging menapa, and Jawa → Jawi in krama.
    words: [kenging menapa, sinau, basa Jawi]
  - id: e11
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: الباتيك ده حلو جدًا!
      ar: هذا الباتيك جميل جدًا!
      en: This batik is very nice!
    answers: ["Batik menika saé sanget!", "Batik menika saé sanget", "Batik menika sae sanget!", "Batik menika sae sanget", "Batik niki saé sanget!", "Batik niki saé sanget", "Batik niki sae sanget!", "Batik niki sae sanget"]
    explain:
      ar_eg: menika = iki (ده)، saé = apik، sanget = banget. وفي الكلام niki بدل menika.
      ar: menika = iki (هذا)، وsaé = apik، وsanget = banget، وفي الكلام niki.
      en: "menika = iki (this), saé = apik, sanget = banget. Spoken: niki."
    words: [menika, saé, sanget]
  - id: e12
    type: translate
    direction: from_target
    source_text: Kenging menapa panjenengan sinau basa Jawi?
    answers_meaning:
      ar_eg: ["حضرتك بتتعلم جاوي ليه؟", "ليه حضرتك بتتعلم الجاوي؟", "بتتعلم جاوي ليه؟", "إنت بتتعلم جاوي ليه؟"]
      ar: ["لماذا تتعلم الجاوية؟", "لماذا تتعلمون اللغة الجاوية؟", "لماذا تدرس الجاوية؟"]
      en: ["Why are you learning Javanese?", "Why do you study Javanese?", "Why are you studying Javanese?", "Why do you learn Javanese?"]
    words: [kenging menapa, sinau]
  - id: e13
    type: dictation
    text: Pripun kabaripun?
    meaning:
      ar_eg: أخبار حضرتك إيه؟
      ar: كيف حالكم؟
      en: How are you?
    words: [pripun, kabar]
  - id: e14
    type: speaking
    text: Nyuwun sewu, Bu, reginipun pinten?
    meaning:
      ar_eg: لا مؤاخذة يا حاجة، بكام؟
      ar: عفوًا يا سيدتي، بكم ثمنه؟
      en: Excuse me, ma'am, how much is it?
    words: [nyuwun sewu, regi, pinten]
dialogue:
  title: Enjing wonten Mangkunegaran
  lines:
    - speaker: Pak Wiryo
      text: Sugeng enjing, Mas Mohamed. Pripun kabaripun?
      ar_eg: صباح الخير يا محمد. أخبارك إيه؟
      ar: صباح الخير يا محمد. كيف حالك؟
      en: Good morning, Mohamed. How are you?
    - speaker: Mohamed
      text: Saé, Pak, matur nuwun. Nyuwun sewu, jam pinten?
      ar_eg: كويس يا حاج، شكرًا. لا مؤاخذة، الساعة كام؟
      ar: بخير يا سيدي، شكرًا. عفوًا، كم الساعة؟
      en: Fine, thank you, sir. Excuse me, what time is it?
    - speaker: Pak Wiryo
      text: Jam sanga, Mas. Sampéyan badhé dhateng pundi?
      ar_eg: الساعة تسعة يا ابني. إنت رايح فين؟
      ar: التاسعة يا بني. إلى أين أنت ذاهب؟
      en: Nine o'clock. Where are you going?
    - speaker: Mohamed
      text: Kula badhé dhateng Pasar Klewer, Pak.
      ar_eg: رايح سوق كليوير يا حاج.
      ar: إلى سوق كليوير يا سيدي.
      en: To Pasar Klewer, sir.
    - speaker: Pak Wiryo
      text: Batik Klewer saé sanget, Mas!
      ar_eg: باتيك كليوير حلو جدًا يا ابني!
      ar: باتيك كليوير جميل جدًا يا بني!
      en: Klewer batik is very nice!
    - speaker: Mohamed
      text: Inggih, Pak. Matur nuwun!
      ar_eg: أيوه يا حاج. شكرًا!
      ar: نعم يا سيدي. شكرًا!
      en: Yes, sir. Thank you!
