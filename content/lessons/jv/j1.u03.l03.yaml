schema: kabar.lesson/v1
id: j1.u03.l03
language: jv
title: Jawa apa Indonesia?
can_do:
  ar_eg: تعرف كل كلمة جاوي ولا إندونيسي.
  ar: 'أن تحدد لغة كل كلمة: جاوية أم إندونيسية.'
  en: Tag each word's language.
slides:
  - title: Basa campur
    body:
      ar_eg: |
        الرسايل في جاوة غالبًا خليط إندونيسي وجاوي في نفس الجملة. عشان تعرف إنت قدام أنهي لغة، دوّر على «الكلمات العلامة».
        بس الأول: فيه كلمات **مشتركة** بين اللغتين، فمابتقولكش حاجة: aku، apa، lagi، kapan، kok، banget.
        «Aku lagi …» ممكن تكمل جاوي أو إندونيسي!
        وفي عنوان الدرس، apa معناها «ولا» (= atau): Jawa apa Indonesia? = جاوي ولا إندونيسي؟
      ar: |
        كثيرًا ما تمزج الرسائل في جاوة بين الإندونيسية والجاوية في الجملة الواحدة، ولتمييزهما ابحث عن «الكلمات الدالة».
        لكن ثمة كلمات **مشتركة** لا تدل على شيء: aku وapa وlagi وkapan وkok وbanget، فـ«Aku lagi …» قد تكمل جاويةً أو إندونيسيةً.
        وفي عنوان الدرس تأتي apa بمعنى «أم» (= atau): Jawa apa Indonesia? = جاوية أم إندونيسية؟
      en: |
        Messages in Java often mix Indonesian and Javanese in one sentence. To tell which is which, hunt for marker words.
        First, some words are **shared** and tell you nothing: aku, apa, lagi, kapan, kok, banget. "Aku lagi …" could go either way!
        In this lesson's title, apa means "or" (= atau): Jawa apa Indonesia? = Javanese or Indonesian?
    grammar: jv.marker.vs-indonesian
    examples:
      - text: Kopi apa teh?
        ar_eg: قهوة ولا شاي؟
        ar: قهوة أم شاي؟
        en: Coffee or tea?
  - title: Ora, wis, durung, arep
    body:
      ar_eg: |
        الكلمات دي بتقولك فورًا «ده جاوي»:
        - ora ↔ tidak · wis ↔ sudah · durung ↔ belum · arep ↔ mau / akan
        - piye ↔ bagaimana · kowe ↔ kamu · mangan ↔ makan
        وgak؟ هي Arek، بس كمان إندونيسي عامي (Jakarta)، فلوحدها دليل ضعيف.
      ar: |
        هذه الكلمات تدل فورًا على الجاوية:
        - ora ↔ tidak · wis ↔ sudah · durung ↔ belum · arep ↔ mau / akan
        - piye ↔ bagaimana · kowe ↔ kamu · mangan ↔ makan
        أما gak فمن Arek، لكنها في العامية الإندونيسية أيضًا، فدلالتها وحدها ضعيفة.
      en: |
        These words shout "Javanese":
        - ora ↔ tidak · wis ↔ sudah · durung ↔ belum · arep ↔ mau / akan
        - piye ↔ bagaimana · kowe ↔ kamu · mangan ↔ makan
        And gak? It's Arek — but also casual Indonesian (Jakarta), so on its own it's a weak clue.
    grammar: jv.marker.vs-indonesian
    examples:
      - text: Aku ora ngerti.
        ar_eg: أنا مش فاهم. (جاوي — ora)
        ar: لا أفهم. (جاوية — ora)
        en: I don't understand. (Javanese — ora)
  - title: Karo, sing, ana, nang
    body:
      ar_eg: |
        كمان علامات:
        - karo ↔ dengan / sama (مع)
        - sing ↔ yang (اللي)
        - ana ↔ ada (فيه / موجود)
        - nang / neng ↔ ke / di، saka ↔ dari
        - اللاحقة -e / -ne ↔ -nya: omahe = rumahnya، regane = harganya.
      ar: |
        ومن العلامات أيضًا:
        - karo ↔ dengan / sama (مع)
        - sing ↔ yang (الذي)
        - ana ↔ ada (يوجد)
        - nang / neng ↔ ke / di، وsaka ↔ dari
        - اللاحقة -e / -ne ↔ -nya: omahe = rumahnya، وregane = harganya.
      en: |
        More markers:
        - karo ↔ dengan / sama (with)
        - sing ↔ yang (that, which)
        - ana ↔ ada (there is)
        - nang / neng ↔ ke / di, saka ↔ dari
        - suffix -e / -ne ↔ -nya: omahe = rumahnya, regane = harganya.
    grammar: jv.marker.vs-indonesian
    examples:
      - text: Sing abang regane pira?
        ar_eg: الأحمر بكام؟ (abang = merah)
        ar: بكم الأحمر؟ (abang = merah)
        en: How much is the red one? (abang = merah)
      - text: Ana kopi?
        ar_eg: فيه قهوة؟
        ar: هل توجد قهوة؟
        en: Is there any coffee?
  - title: Jawa, Indonesia
    body:
      ar_eg: |
        قارن الجملتين — نفس المعنى «أنا في السوق مع ماما»:
        - Aku lagi nang pasar karo ibuku. → nang وkaro جاوي، يبقى **جاوي**.
        - Aku lagi di pasar sama ibuku. → di وsama إندونيسي، يبقى **إندونيسي عامي**.
        aku وlagi وpasar وibu مشتركين، فبص على الكلمات الصغيرة اللي حواليهم.
        زي ما بتعرف الجملة مصري ولا فصحى من «مش» و«إيه» بدل «ليس» و«ماذا».
      ar: |
        قارن الجملتين، والمعنى واحد «أنا في السوق مع أمي»:
        - Aku lagi nang pasar karo ibuku → nang وkaro جاويتان، فالجملة **جاوية**.
        - Aku lagi di pasar sama ibuku → di وsama إندونيسيتان، فالجملة **إندونيسية عامية**.
        وaku وlagi وpasar وibu مشتركة، فانظر إلى الكلمات الصغيرة حولها، كما تميّز العامية من الفصحى بـ«مش» و«إيه».
      en: |
        Compare — same meaning, "I'm at the market with my mum":
        - Aku lagi nang pasar karo ibuku. → nang and karo are Javanese, so it's **Javanese**.
        - Aku lagi di pasar sama ibuku. → di and sama are Indonesian, so it's **casual Indonesian**.
        aku, lagi, pasar and ibu are shared; look at the small words around them.
        Just as «مش» and «إيه» tell you Egyptian from Fusha «ليس» and «ماذا».
    grammar: jv.marker.vs-indonesian
    examples:
      - text: Aku lagi nang pasar karo ibuku.
        ar_eg: أنا في السوق مع ماما. (جاوي)
        ar: أنا في السوق مع أمي. (جاوية)
        en: I'm at the market with my mum. (Javanese)
      - text: Aku lagi di pasar sama ibuku.
        ar_eg: نفس المعنى بالإندونيسي العامي.
        ar: المعنى نفسه بالإندونيسية العامية.
        en: Same meaning, casual Indonesian.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ora
        ar_eg: tidak (لأ / مش)
        ar: tidak (لا)
        en: tidak (not)
      - text: karo
        ar_eg: sama / dengan (مع)
        ar: dengan (مع)
        en: dengan (with)
      - text: sing
        ar_eg: yang (اللي)
        ar: yang (الذي)
        en: yang (which)
      - text: ana
        ar_eg: ada (فيه)
        ar: ada (يوجد)
        en: ada (there is)
      - text: mangan
        ar_eg: makan (ياكل)
        ar: makan (يأكل)
        en: makan (eat)
      - text: abang
        ar_eg: merah (أحمر)
        ar: merah (أحمر)
        en: merah (red)
    words: [ora, karo, sing, ana, mangan, abang]
  - id: e02
    type: multiple_choice
    question: Aku lagi makan, kok.
    question_meaning:
      ar_eg: الجملة دي جاوي ولا إندونيسي؟
      ar: هذه الجملة جاوية أم إندونيسية؟
      en: Is this sentence Javanese or Indonesian?
    options: [Basa Indonesia, Basa Jawa]
    answer: 0
    explain:
      ar_eg: aku وlagi وkok مشتركين. الدليل makan — بالجاوي mangan.
      ar: aku وlagi وkok مشتركة، والدليل makan، وبالجاوية mangan.
      en: aku, lagi and kok are shared; the clue is makan (Javanese says mangan).
    words: [mangan]
  - id: e03
    type: listen
    text: Aku ora ngerti.
    options: [Aku wis ngerti., Aku ora ngerti., 'Ana sing ngerti?']
    answer: 1
    words: [ora, ngerti, ana, sing]
  - id: e04
    type: fill_blank
    sentence: Aku nang pasar ___ ibuku.
    meaning:
      ar_eg: أنا في السوق مع ماما. (جاوي من غير خلط)
      ar: أنا في السوق مع أمي. (جاوية خالصة)
      en: I'm at the market with my mum. (clean Javanese)
    options: [karo, dengan, sama]
    answers: [karo]
    explain:
      ar_eg: sama وdengan إندونيسي. الشات بيخلط كتير، بس الجاوي النضيف karo.
      ar: sama وdengan إندونيسيتان، والجاوية الخالصة karo وإن كثر الخلط في الدردشة.
      en: sama and dengan are Indonesian; chats mix freely, but clean ngoko uses karo.
    words: [karo]
  - id: e05
    type: dictation
    text: Sing abang regane pira?
    meaning:
      ar_eg: الأحمر بكام؟
      ar: بكم الأحمر؟
      en: How much is the red one?
    words: [sing, abang, rega, pira]
  - id: e06
    type: speaking
    text: Aku lagi nang pasar karo ibuku.
    meaning:
      ar_eg: أنا في السوق مع ماما.
      ar: أنا في السوق مع أمي.
      en: I'm at the market with my mum.
    words: [nang, karo]
  - id: e07
    type: multiple_choice
    question: Ana sing abang?
    question_meaning:
      ar_eg: معناها إيه بالإندونيسي؟
      ar: ما معناها بالإندونيسية؟
      en: What does it mean in Indonesian?
    options: ['Ada yang merah?', 'Ini yang merah?', 'Ada yang besar?']
    answer: 0
    explain:
      ar_eg: ana = ada، sing = yang، abang = merah. يعني «فيه واحد أحمر؟».
      ar: ana = ada، وsing = yang، وabang = merah، أي «هل يوجد واحد أحمر؟».
      en: ana = ada, sing = yang, abang = merah, so "Is there a red one?"
    words: [ana, sing, abang]
dialogue:
  title: Jawa apa Indonesia, Cak?
  lines:
    - speaker: Mohamed
      text: Cak, "aku lagi nang pasar" basa Jawa apa Indonesia?
      ar_eg: يا هيرو، «aku lagi nang pasar» جاوي ولا إندونيسي؟
      ar: يا هيرو، «aku lagi nang pasar» جاوية أم إندونيسية؟
      en: Heru, is "aku lagi nang pasar" Javanese or Indonesian?
    - speaker: Cak Heru
      text: Basa Jawa! Nang = di.
      ar_eg: جاوي! nang = di.
      ar: جاوية! nang = di.
      en: Javanese! nang = di.
    - speaker: Mohamed
      text: Lha, "aku lagi makan"?
      ar_eg: طب و«aku lagi makan»؟
      ar: وماذا عن «aku lagi makan»؟
      en: And "aku lagi makan"?
    - speaker: Cak Heru
      text: Basa Indonesia. Basa Jawa "aku lagi mangan".
      ar_eg: إندونيسي. بالجاوي «aku lagi mangan».
      ar: إندونيسية، وبالجاوية «aku lagi mangan».
      en: Indonesian. In Javanese it's "aku lagi mangan".
    - speaker: Mohamed
      text: Wis ngerti. Suwun, Cak!
      ar_eg: خلاص فهمت. ميرسي يا هيرو!
      ar: فهمت الآن. شكرًا يا هيرو!
      en: Got it. Thanks, Heru!
    - speaker: Cak Heru
      text: Padha-padha, rek!
      ar_eg: العفو يا صاحبي!
      ar: عفوًا يا صاح!
      en: You're welcome, mate!
new_words:
  - word: karo
    pos: preposition
    ar_eg: مع (= dengan / sama)
    ar: مع (= dengan / sama)
    en: with (= dengan / sama)
  - word: sing
    pos: particle
    ar_eg: اللي (= yang)
    ar: الذي (= yang)
    en: that, which, the one (= yang)
  - word: ana
    pos: verb
    ar_eg: فيه / موجود (= ada؛ Arek onok)
    ar: يوجد (= ada؛ وفي Arek onok)
    en: there is, to exist (= ada; Arek onok)
  - word: abang
    pos: adjective
    ar_eg: أحمر (= merah)
    ar: أحمر (= merah)
    en: red (= merah)
review:
  status: draft
  verified: false
