        ar_eg: مع
        ar: مع
        en: with
      - text: sampek
        ar_eg: لحد
        ar: حتى
        en: until
      - text: mek
        ar_eg: بس
        ar: فقط
        en: only
      - text: ndek
        ar_eg: في، عند
        ar: في، عند
        en: at, in
    words: [ambek, sampek, mek, ndek]
  - id: e02
    type: match_pairs
    pairs:
      - text: engkok
        ar_eg: بعدين
        ar: لاحقًا
        en: later
      - text: maeng
        ar_eg: من شوية
        ar: قبل قليل
        en: earlier
      - text: cangkruk
        ar_eg: يقعد يدردش على القهوة
        ar: يسمر في المقهى
        en: hang out at a stall
      - text: lek
        ar_eg: لو
        ar: إذا
