    words: [engkok, maeng, cangkruk, lek]
  - id: e03
    type: listen
    text: Maeng aku ndek pasar.
    question:
      ar_eg: كان فين؟
      ar: أين كان؟
      en: Where was he?
    options: [من شوية كنت في السوق, بعدين هروح السوق, أنا مش في السوق]
    answer: 0
    meaning:
      ar_eg: من شوية كنت في السوق.
      ar: كنت في السوق قبل قليل.
      en: I was at the market earlier.
    words: [maeng, ndek, engkok]
  - id: e04
    type: fill_blank
    sentence: Aku cangkruk ___ Cak Heru.
    meaning:
      ar_eg: أنا قاعد ___ تشاك هيرو.
      ar: أجلس ___ تشاك هيرو.
      en: I'm hanging out ___ Cak Heru.
    options: [ambek, sampek, lek]
    answers: [ambek]
    words: [ambek, sampek, lek, cangkruk]
  - id: e05
    type: multiple_choice
    question: Engkok bengi aku teko.
    question_meaning:
      ar_eg: هييجي إمتى؟
      ar: متى يأتي؟
      en: When is he coming?
    options: [بالليل، بعدين, الصبح بدري, من شوية]
    answer: 0
    explain:
      ar_eg: engkok = بعدين، وbengi = بالليل. «من شوية» = maeng.
      ar: engkok = لاحقًا، وbengi = ليلًا. أمّا «قبل قليل» فـmaeng.
      en: engkok = later, bengi = at night. "Earlier" is maeng.
    words: [engkok, maeng]
  - id: e06
    type: fill_blank
    sentence: Aku ndek kantor ___ bengi.
    meaning:
      ar_eg: أنا في المكتب ___ بالليل.
      ar: أنا في المكتب ___ الليل.
      en: I'm at the office ___ night.
    options: [sampek, ambek, mek]
    answers: [sampek]
    words: [sampek, ambek, mek, ndek]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «لحظة بس يا جدع!» بكلام سورابايا؟
      ar: كيف تقول «لحظة فقط يا صاحبي!» بلهجة سورابايا؟
      en: '"Just a moment, mate!" Surabaya-style?'
    options: ['Mek sedhela, rek!', 'Lek sedhela, rek!', 'Maeng sedhela, rek!']
    answer: 0
    explain:
      ar_eg: mek = بس (= mung). lek = لو، maeng = من شوية.
      ar: mek = فقط (= mung). أمّا lek فإذا، وmaeng فقبل قليل.
      en: mek = only (= mung). lek = if, maeng = earlier.
    words: [mek, lek, maeng]
  - id: e08
    type: build_sentence
    source:
      ar_eg: لو فيه وقت، يلا نقعد على القهوة!
      ar: إن كان هناك وقت، هيّا نسمر في المقهى!
      en: If there's time, let's hang out!
    answer: Lek onok wektu, ayo cangkruk!
    distractors: [maeng, mek]
    words: [lek, cangkruk, maeng, mek]
  - id: e09
    type: translate
    direction: from_target
    source_text: Aku cangkruk ambek kanca ndek warung kopi.
    answers_meaning:
      ar_eg: [أنا قاعد مع صاحبي على القهوة, بقعد مع صحابي في القهوة]
      ar: [أجلس مع صديقي في المقهى, أسمر مع أصدقائي في المقهى]
      en: ['I''m hanging out with a friend at the coffee stall', I hang out with friends at the coffee stall]
    words: [cangkruk, ambek, ndek]
  - id: e10
    type: speaking
    text: Engkok bengi aku teko, rek.
    meaning:
      ar_eg: بعدين بالليل هاجي يا جدع.
      ar: سآتي لاحقًا في الليل يا صاحبي.
      en: I'll come later tonight, mate.
    words: [engkok]
dialogue:
  lines:
    - speaker: Cak Heru
      text: Rek, maeng koen ndek endi? Tak goleki.
      ar_eg: يا جدع، كنت فين من شوية؟ دوّرت عليك.
      ar: يا صاحبي، أين كنت قبل قليل؟ بحثت عنك.
      en: Mate, where were you earlier? I was looking for you.
    - speaker: Mohamed
      text: Maeng aku ndek pasar ambek Mas Yudha.
      ar_eg: من شوية كنت في السوق مع ماس يودا.
      ar: كنت في السوق قبل قليل مع ماس يودا.
      en: I was at the market with Mas Yudha earlier.
    - speaker: Cak Heru
      text: Engkok bengi cangkruk yok! Lek onok wektu.
      ar_eg: بالليل بعدين يلا نقعد على القهوة! لو فيه وقت.
      ar: هيّا نسمر في المقهى الليلة! إن كان لديك وقت.
      en: Let's hang out tonight! If you've got time.
    - speaker: Mohamed
      text: Onok, Cak. Tapi mek sedhela, sampek jam sanga ae.
      ar_eg: فيه يا تشاك. بس شوية بس، لحد الساعة تسعة.
      ar: لديّ يا تشاك. لكن لوقت قصير فقط، حتى التاسعة.
      en: I have, Cak. But just a little while, until nine.
    - speaker: Cak Heru
      text: Sip! Ndek warunge Cak Man, ya.
      ar_eg: تمام! في قهوة تشاك مان.
      ar: ممتاز! في مقهى تشاك مان.
      en: Great! At Cak Man's stall, then.
