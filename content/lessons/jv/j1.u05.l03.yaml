schema: kabar.lesson/v1
id: j1.u05.l03
language: jv
title: Rek!
can_do:
  ar_eg: تتابع حوار سريع بلهجة سورابايا (Arek).
  ar: أن تتابع حوارًا سريعًا بلهجة سورابايا (Arek).
  en: Follow a fast Arek dialogue.
slides:
  - title: Arek ↔ ngoko
    body:
      ar_eg: |
        قبل ما نروح كنجران مع Cak Heru وNing Lia، راجع الجدول ده بسرعة (Arek ⇐ النغوكو العادي):
        - koen ⇐ kowé · gak ⇐ ora · onok ⇐ ana
        - kate ⇐ arep · wes ⇐ wis · yok opo ⇐ piye · lapo ⇐ ngapa
        - ae ⇐ wae · ta ⇐ to · rek = يا جماعة
        وdudu (مش، قبل الاسم) هي هي في الاتنين.
        Arek بيبان «ناشف» لسامع من سولو، بس بين الصحاب ده الدفا نفسه.
      ar: |
        قبل الذهاب إلى كنجران مع Cak Heru وNing Lia، راجع هذا الجدول (Arek ⇐ النغوكو القياسي):
        - koen ⇐ kowé · gak ⇐ ora · onok ⇐ ana
        - kate ⇐ arep · wes ⇐ wis · yok opo ⇐ piye · lapo ⇐ ngapa
        - ae ⇐ wae · ta ⇐ to · rek = يا جماعة
        وdudu (ليس، قبل الاسم) واحدة فيهما.
        يبدو كلام Arek جافًّا لأهل سولو، لكنه بين الأصدقاء ودٌّ خالص.
      en: |
        Before we head to Kenjeran with Cak Heru and Ning Lia, a quick table (Arek ⇒ standard ngoko):
        - koen ⇒ kowé · gak ⇒ ora · onok ⇒ ana
        - kate ⇒ arep · wes ⇒ wis · yok opo ⇒ piye · lapo ⇒ ngapa
        - ae ⇒ wae · ta ⇒ to · rek = guys
        dudu (not, before nouns) is the same in both.
        Arek sounds blunt to Solo ears; between friends it's pure warmth.
    grammar: jv.dialect.arek
    examples:
      - text: Kate lapo, Cak?
        ar_eg: 'ناوي تعمل إيه يا معلم؟ (Arek) — العادي: Arep ngapa, Mas?'
        ar: 'ماذا ستفعل يا أخي؟ (Arek) — القياسي: Arep ngapa, Mas?'
        en: 'What are you going to do, brother? (Arek) — standard: Arep ngapa, Mas?'
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: (من الحوار) Cak Heru عايز يروح كنجران ليه؟
      ar: (من الحوار) لماذا يريد Cak Heru الذهاب إلى كنجران؟
      en: (From the dialogue) Why does Cak Heru want to go to Kenjeran?
    options: [Tuku kopi, Sinau basa Jawa, Mangan lontong kupang]
    answer: 2
    explain:
      ar_eg: قال «Mangan lontong kupang» = ناكل لونتونج كوبانج.
      ar: قال «Mangan lontong kupang» أي نأكل لونتونغ كوبانغ.
      en: He said "Mangan lontong kupang" = to eat lontong kupang.
    words: [mangan]
  - id: e02
    type: multiple_choice
    question: Kupangé gak onok, rek.
    question_meaning:
      ar_eg: البيّاع قال كده. أنهي جملة بالنغوكو العادي نفس المعنى؟
      ar: هكذا قال البائع. أيّ جملة بالنغوكو القياسي تؤدي المعنى نفسه؟
      en: The seller said this. Which standard ngoko sentence means the same?
    options: [Kupangé ora ana., Kupangé wis ana., Kupangé dudu kupang.]
    answer: 0
    explain:
      ar_eg: gak onok = ora ana = مفيش.
      ar: gak onok = ora ana = لا يوجد.
      en: gak onok = ora ana = there isn't any.
    words: [gak, onok, ora ana]
  - id: e03
    type: listen
    text: Kate lapo nang Kenjeran?
    options: ['Kate nang endi, Cak?', 'Lapo koen nang Kenjeran?', 'Kate lapo nang Kenjeran?']
    answer: 2
    words: [kate, lapo, nang]
  - id: e04
    type: fill_blank
    sentence: Koen wis mangan ___, Mohamed?
    meaning:
      ar_eg: إنت كلت، مش كده يا محمد؟ (Arek)
      ar: لقد أكلت، أليس كذلك يا محمد؟ (Arek)
      en: You've eaten, right, Mohamed? (Arek)
    answers: [ta, to]
    explain:
      ar_eg: ta = kan? بتاعة سورابايا. في وسط جاوة to، وماشية برضه.
      ar: ta = kan? في سورابايا، وفي وسط جاوة to، وكلتاهما مقبولة.
      en: ta is Surabaya's "right?" (kan?); Central Java says to, also accepted.
    words: [ta]
  - id: e05
    type: fill_blank
    sentence: Lontong balap ___, Cak.
    meaning:
      ar_eg: لونتونج بالاب بس يا معلم.
      ar: لونتونغ بالاب فقط يا أخي.
      en: Just lontong balap, Cak.
    options: [ta, lho, ae]
    answers: [ae]
    explain:
      ar_eg: ae = wae = saja (بس).
      ar: ae = wae = saja (فقط).
      en: ae = wae = saja (just).
    words: [ae]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: ناوي تعمل إيه في كنجران؟ (على طريقة سورابايا)
      ar: ماذا ستفعل في كنجران؟ (بأسلوب سورابايا)
      en: What are you going to do at Kenjeran? (Surabaya style)
    answers: ['Kate lapo nang Kenjeran?', Kate lapo nang Kenjeran, 'Koen kate lapo nang Kenjeran?', Koen kate lapo nang Kenjeran, 'Kon kate lapo nang Kenjeran?', Kon kate lapo nang Kenjeran, 'Nang Kenjeran kate lapo?', Nang Kenjeran kate lapo]
    words: [kate, lapo, nang]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: قول «Koen wis mangan ta?» بالنغوكو العادي (بتاع سولو ويوجيا).
      ar: قل «Koen wis mangan ta?» بالنغوكو القياسي (سولو ويوجيا).
      en: Say "Koen wis mangan ta?" in standard ngoko (Solo / Yogya).
    answers: ['Kowé wis mangan to?', Kowé wis mangan to, 'Kowe wis mangan to?', Kowe wis mangan to, 'Kowé wis mangan, to?', 'Kowé wis mangan, to', 'Kowe wis mangan, to?', 'Kowe wis mangan, to', 'Kowé wis mangan?', Kowé wis mangan, 'Kowe wis mangan?', Kowe wis mangan]
    explain:
      ar_eg: koen ⇐ kowé، وta ⇐ to.
      ar: koen ⇐ kowé، وta ⇐ to.
      en: koen ⇒ kowé, ta ⇒ to.
    words: [kowé, koen, to, ta]
  - id: e08
    type: build_sentence
    source:
      ar_eg: مفيش كوبانج يا جماعة. (Arek)
      ar: لا يوجد كوبانغ يا جماعة. (Arek)
      en: There's no kupang, guys. (Arek)
    answer: Kupangé gak onok, rek.
    distractors: [kate, dudu]
    words: [gak, onok, rek]
  - id: e09
    type: dictation
    text: Koen wis mangan ta, rek?
    meaning:
      ar_eg: كلت ولا إيه يا صاحبي؟
      ar: هل أكلتَ يا صاح؟
      en: You've eaten, right, mate?
    words: [koen, ta, rek]
  - id: e10
    type: speaking
    text: Rek, ayo nang Kenjeran!
    meaning:
      ar_eg: يلا يا جماعة على كنجران!
      ar: هيا يا جماعة إلى كنجران!
      en: Guys, let's go to Kenjeran!
    words: [rek, ayo, nang]
dialogue:
  title: Ayo nang Kenjeran!
  lines:
    - speaker: Cak Heru
      text: Rek, ayo nang Kenjeran!
      ar_eg: يلا يا جماعة على كنجران!
      ar: هيا يا جماعة إلى كنجران!
      en: Guys, let's go to Kenjeran!
    - speaker: Ning Lia
      text: Kate lapo nang Kenjeran, Cak?
      ar_eg: هنعمل إيه في كنجران يا معلم؟
      ar: ماذا سنفعل في كنجران يا أخي؟
      en: What are we going to do at Kenjeran, Cak?
    - speaker: Cak Heru
      text: Mangan lontong kupang. Koen wis mangan ta, Mohamed?
      ar_eg: ناكل لونتونج كوبانج. إنت كلت ولا إيه يا محمد؟
      ar: نأكل لونتونغ كوبانغ. هل أكلتَ يا محمد؟
      en: Eat lontong kupang. You've eaten, right, Mohamed?
    - speaker: Mohamed
      text: Durung, Cak. Aku durung mangan.
      ar_eg: لسه يا معلم. أنا لسه ماكلتش.
      ar: ليس بعد يا أخي. لم آكل بعد.
      en: Not yet, Cak. I haven't eaten yet.
    - speaker: Ning Lia
      text: Lho, durung mangan? Ayo, rek!
      ar_eg: إيه ده، لسه ماكلتش؟ يلا يا جماعة!
      ar: حقًّا؟ لم تأكل بعد؟ هيا يا جماعة!
      en: What, you haven't eaten? Come on, guys!
new_words:
  - word: lontong kupang
    pos: noun
    ar_eg: رز مضغوط (lontong) مع بلح البحر الصغير (kupang) في صوص، أكلة ساحل سورابايا
    ar: أرز مضغوط مع محار صغير في مرق، طبق ساحل سورابايا
    en: rice cake with tiny shellfish in broth, a Surabaya coast dish
  - word: lontong balap
    pos: noun
    ar_eg: lontong بالفول النابت والتوفو، أكلة سورابايا المشهورة
    ar: أرز مضغوط مع براعم الفول والتوفو، طبق سورابايا الشهير
    en: rice cake with bean sprouts and tofu, Surabaya's signature dish
review:
