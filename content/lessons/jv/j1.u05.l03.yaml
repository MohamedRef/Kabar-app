schema: kabar.lesson/v1
id: j1.u05.l03
language: jv
title: Ambek, sampek, maeng
can_do:
  ar_eg: 'تفهم كلمات سورابايا اللي بتربط الكلام: مع، لحد، بس، من شوية، بعدين.'
  ar: 'أن تفهم كلمات سورابايا التي تربط الكلام: مع، حتى، فقط، قبل قليل، لاحقًا.'
  en: 'Understand the Surabaya linking words: with, until, only, earlier, later.'
slides:
  - title: Arek ngomong ngene
    body:
      ar_eg: |
        أهل سورابايا عندهم كلمات صغيرة خاصة بيهم:
        ambek = مع (= karo)، sampek = لحد (= nganti)، mek = بس (= mung).
        ndek = في، عند (= nang/ing): ndek warung = في القهوة.
        maeng = من شوية (= mau)، engkok = بعدين (= mengko).
        lek = لو (= yen). cangkruk = يقعد يدردش مع صحابه على القهوة، عادة سورابايا!
      ar: |
        لأهل سورابايا كلمات صغيرة خاصّة بهم:
        ambek = مع (= karo)، sampek = حتى (= nganti)، mek = فقط (= mung).
        ndek = في، عند (= nang/ing): ndek warung = في المقهى.
        maeng = قبل قليل (= mau)، engkok = لاحقًا (= mengko).
        lek = إذا (= yen). cangkruk = يجلس مع أصحابه في المقهى للسمر، وهي عادة سورابايا!
      en: |
        Surabaya people have their own little words:
        ambek = with (= karo), sampek = until (= nganti), mek = only (= mung).
        ndek = at, in (= nang/ing): ndek warung = at the stall.
        maeng = earlier (= mau), engkok = later (= mengko).
        lek = if (= yen). cangkruk = hang out chatting at a coffee stall, a Surabaya habit!
    examples:
      - text: Aku cangkruk ambek Cak Heru ndek warung.
        ar_eg: أنا قاعد مع تشاك هيرو على القهوة.
        ar: أجلس مع تشاك هيرو في المقهى.
        en: I'm hanging out with Cak Heru at the stall.
      - text: Maeng aku ndek pasar.
        ar_eg: من شوية كنت في السوق.
        ar: كنت في السوق قبل قليل.
        en: I was at the market earlier.
      - text: Lek onok wektu, ayo cangkruk!
        ar_eg: لو فيه وقت، يلا نقعد على القهوة!
        ar: إن كان هناك وقت، هيّا نجلس في المقهى!
        en: If there's time, let's hang out!
exercises:
  - id: e01
    type: match_pairs
    pairs:
