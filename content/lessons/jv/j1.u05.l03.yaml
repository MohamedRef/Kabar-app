schema: kabar.lesson/v1
id: j1.u05.l03
language: jv
title: Mung, banget, kakehan
can_do:
  ar_eg: تشتري أكل على الشط، وتقول «بس» و«أوي» و«زيادة عن اللزوم»، وتعتذر.
  ar: أن تشتري طعامًا على الشاطئ، وتقول «فقط» و«جدًا» و«أكثر من اللازم»، وتعتذر.
  en: Buy snacks on the beach, say "only", "very" and "too much", and apologise.
slides:
  - title: Enak banget!
    body:
      ar_eg: |
        - mung = بس (= cuma): Aku mung tuku degan = أنا هشتري جوز هند بس.
        - banget = أوي (بعد الكلمة): Enak banget! = حلو أوي!
        - kakehan = كتير زيادة عن اللزوم: Kakehan gula = السكر زيادة.
        - ngapura = سماح: «Ngapura, Mas» = معلش / آسف. ومع الأكبر منك: «Nyuwun sewu».
        وعلى شط باراندجتريتيس: jagung bakar = درة مشوية، degan = جوز هند أخضر بتشربه، pasir = رملة، layangan = طيارة ورق.
      ar: |
        - mung = فقط (= cuma): Aku mung tuku degan = لن أشتري إلا جوز الهند.
        - banget = جدًا (بعد الكلمة): Enak banget! = لذيذ جدًا!
        - kakehan = أكثر من اللازم: Kakehan gula = السكر كثير.
        - ngapura = عفو: «Ngapura, Mas» = آسف، ومع الأكبر: «Nyuwun sewu».
        وعلى شاطئ باراندجتريتيس: jagung bakar = ذرة مشوية، degan = جوز هند أخضر يُشرب، pasir = رمل، layangan = طائرة ورقية.
      en: |
        - mung = only (= cuma): Aku mung tuku degan = I'm only buying a coconut.
        - banget = very (after the word): Enak banget! = So good!
        - kakehan = too much: Kakehan gula = too much sugar.
        - ngapura = forgiveness: "Ngapura, Mas" = sorry. To someone older: "Nyuwun sewu".
        On Parangtritis beach: jagung bakar = grilled corn, degan = young coconut to drink, pasir = sand, layangan = kite.
    grammar: jv.intensifier
    examples:
      - text: Jagung bakare enak banget!
        ar_eg: الدرة المشوية حلوة أوي!
        ar: الذرة المشوية لذيذة جدًا!
        en: The grilled corn is so good!
      - text: Aku mung tuku degan, Mbak.
        ar_eg: هشتري جوز هند بس يا آنسة.
        ar: لن أشتري إلا جوز هند يا آنسة.
        en: I'm only buying a coconut.
      - text: Ngapura, Mas, aku kakehan gula.
        ar_eg: معلش يا كابتن، أنا حطيت سكر كتير.
        ar: آسف يا أخي، وضعت سكرًا كثيرًا.
        en: Sorry, I put in too much sugar.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mung
        ar_eg: بس
        ar: فقط
        en: only
      - text: banget
        ar_eg: أوي
        ar: جدًا
        en: very
      - text: kakehan
        ar_eg: زيادة عن اللزوم
        ar: أكثر من اللازم
        en: too much
      - text: ngapura
        ar_eg: سماح / معلش
        ar: عفو
        en: forgiveness, sorry
    words: [mung, banget, kakehan, ngapura]
  - id: e02
    type: match_pairs
    pairs:
      - text: jagung bakar
        ar_eg: درة مشوية
        ar: ذرة مشوية
        en: grilled corn
      - text: degan
        ar_eg: جوز هند أخضر
        ar: جوز هند أخضر
        en: young coconut
      - text: pasir
        ar_eg: رملة
        ar: رمل
        en: sand
      - text: layangan
        ar_eg: طيارة ورق
        ar: طائرة ورقية
        en: kite
    words: [jagung bakar, degan, pasir, layangan]
  - id: e03
    type: listen
    text: Aku mung tuku degan, Mbak.
    question:
      ar_eg: طالب إيه؟
      ar: ماذا يطلب؟
      en: What is he ordering?
    options: [جوز هند بس, درة مشوية وجوز هند, طيارة ورق كبيرة]
    answer: 0
    meaning:
      ar_eg: هشتري جوز هند بس يا آنسة.
      ar: لن أشتري إلا جوز هند يا آنسة.
      en: I'm only buying a coconut.
    words: [degan, mung]
  - id: e04
    type: fill_blank
    sentence: Jagung bakare enak ___!
    meaning:
      ar_eg: الدرة المشوية حلوة أوي!
      ar: الذرة المشوية لذيذة جدًا!
      en: The grilled corn is so good!
    options: [banget, mung, kakehan]
    answers: [banget]
    words: [banget, jagung bakar, mung, kakehan]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: خبطت في واحد على الشط من غير قصد. تقول إيه؟
      ar: اصطدمت بأحدهم على الشاطئ دون قصد. ماذا تقول؟
      en: You bump into someone on the beach. What do you say?
    options: ['Ngapura, Mas.', 'Enak banget, Mas.', 'Mung degan, Mas.']
    answer: 0
    explain:
      ar_eg: ngapura = سماح، «Ngapura, Mas» = معلش يا كابتن.
      ar: ngapura = عفو، و«Ngapura, Mas» = آسف يا أخي.
      en: 'ngapura = forgiveness: "Ngapura, Mas" = sorry.'
    words: [ngapura, banget, mung]
  - id: e06
    type: fill_blank
    sentence: Wedange ___ gula, ora enak.
    meaning:
      ar_eg: الشاي سكره زيادة، مش حلو.
      ar: في الشاي سكر أكثر من اللازم، ليس لذيذًا.
      en: The tea has too much sugar, it's not nice.
    options: [kakehan, banget, mung]
    answers: [kakehan]
    words: [kakehan, banget, mung]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الرملة سخنة أوي.
      ar: الرمل حارّ جدًا.
      en: The sand is really hot.
    answer: Pasire panas banget.
    distractors: [mung, layangan]
    words: [pasir, banget]
  - id: e08
    type: translate
    direction: from_target
    source_text: Ngapura, layanganku tiba neng pasirmu.
    answers_meaning:
      ar_eg: [معلش، الطيارة الورق بتاعتي وقعت على الرملة عندك, آسف، طيارتي الورق وقعت عندك على الرملة]
      ar: [عذرًا، سقطت طائرتي الورقية على رملك, آسف، وقعت طائرتي الورقية على الرمل عندك]
      en: ['Sorry, my kite fell on your patch of sand', 'Sorry, my kite landed on your sand']
    words: [ngapura, layangan, pasir]
  - id: e09
    type: speaking
    text: Aku mung tuku jagung bakar karo degan.
    meaning:
      ar_eg: أنا هشتري درة مشوية وجوز هند بس.
      ar: لن أشتري إلا ذرة مشوية وجوز هند.
      en: I'm only getting grilled corn and a coconut.
    words: [jagung bakar, degan, mung]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: الولاد بيطيّروا إيه على الشط؟
      ar: ماذا يطيّر الأطفال على الشاطئ؟
      en: What are the kids flying on the beach?
    options: [layangan, degan, pasir]
    answer: 0
    explain:
      ar_eg: layangan = طيارة ورق، وشط باراندجتريتيس هوا شديد وبيتملي طيارات.
      ar: layangan = طائرة ورقية، وريح باراندجتريتيس قوية فتمتلئ سماؤه بها.
      en: layangan = kite; Parangtritis is windy, so the sky fills with them.
    words: [layangan, degan, pasir]
dialogue:
  lines:
    - speaker: Bakul
      text: Jagung bakar, Mas? Degan?
      ar_eg: درة مشوية يا كابتن؟ جوز هند؟
      ar: ذرة مشوية يا أخي؟ جوز هند؟
      en: Grilled corn? Coconut?
    - speaker: Mohamed
      text: Jagung bakar karo degan wae, Mbak.
      ar_eg: درة وجوز هند بس يا آنسة.
      ar: ذرة وجوز هند فقط يا آنسة.
      en: Just corn and a coconut, please.
    - speaker: Bakul
      text: Degane siji apa loro?
      ar_eg: جوز هند واحد ولا اتنين؟
      ar: جوزة هند واحدة أم اثنتان؟
      en: One coconut or two?
    - speaker: Mohamed
      text: Siji wae, Mbak. Aja kakehan, hehe.
      ar_eg: واحد بس يا مبا. مش عايزين كتير، هههه.
      ar: واحدة فقط يا آنسة. لا نريد الكثير، هه.
      en: Just one, Mbak. Let's not overdo it, hehe.
    - speaker: Mas Heru
      text: Wah, jagung bakare enak banget!
      ar_eg: واو، الدرة المشوية حلوة أوي!
      ar: رائع، الذرة المشوية لذيذة جدًا!
      en: Wow, the grilled corn is so good!
    - speaker: Mohamed
      text: Ngapura, Mas, layanganmu tiba!
      ar_eg: معلش يا كابتن، طيارتك الورق وقعت!
      ar: عذرًا يا أخي، طائرتك الورقية سقطت!
      en: Sorry, your kite's come down!
new_words:
