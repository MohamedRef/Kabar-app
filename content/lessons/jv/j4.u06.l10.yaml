schema: kabar.lesson/v1
id: j4.u06.l10
language: jv
title: Bengi ing Prambanan
can_do:
  ar_eg: تقرا بوست قصير بالنغوكو عن عرض رامايانا وتحكي عنه لحد كبير بالكراما.
  ar: أن تقرأ منشورًا قصيرًا بالنغوكو عن عرض رامايانا وتحدّث عنه كبيرًا بالكراما.
  en: Read a short ngoko post about the Ramayana show and tell an elder about it in krama.
slides:
  - title: Postingane Mohamed
    body:
      ar_eg: |
        محمد اتفرج على باليه رامايانا في Prambanan، وكتب بوست لصحابه بالنغوكو. اقراه.
        خد بالك: حتى في البوست النغوكو، محمد بيحكي إن Hanoman «matur» لـ Rama - لأن Hanoman خدّام. وsing paling apik = الأحلى خالص.
        - في الشارع: neng = menyang / ing (لـ، في).
      ar: |
        شاهد محمد باليه رامايانا في Prambanan، وكتب منشورًا لأصدقائه بالنغوكو. اقرأه.
        لاحظ: حتى في منشور بالنغوكو يروي محمد أن Hanoman «matur» لـ Rama، لأنه خادم. وsing paling apik = الأفضل على الإطلاق.
        - في كلام الشارع: neng = menyang / ing (إلى، في).
      en: |
        Mohamed watched the Ramayana ballet at Prambanan and wrote a post for his friends in ngoko. Read it.
        Notice: even in a ngoko post, Mohamed says Hanoman "matur" to Rama, because Hanoman is a servant. sing paling apik = the very best.
        - On the street: neng = menyang / ing (to, at).
    grammar: jv.speechlevel.overview
    examples:
      - text: Bengi iki aku nonton Ramayana ing Prambanan.
        ar_eg: الليلة دي اتفرجت على رامايانا في Prambanan.
        ar: الليلة شاهدتُ رامايانا في Prambanan.
        en: Tonight I watched the Ramayana at Prambanan.
      - text: Gamelane apik banget, sindhene uga.
        ar_eg: الجاميلان كانت حلوة أوي، والمغنّية كمان.
        ar: كان الغاميلان رائعًا، والمغنّية أيضًا.
        en: The gamelan was wonderful, and so was the singer.
      - text: Hanoman sing paling apik! Dheweke matur Rama nganggo krama.
        ar_eg: Hanoman كان الأحلى! بيكلّم Rama بالكراما.
        ar: كان Hanoman الأفضل! يخاطب Rama بالكراما.
        en: Hanoman was the best! He speaks to Rama in krama.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: محمد اتفرج على إيه؟
      ar: ماذا شاهد محمد؟
      en: What did Mohamed watch?
    options: [wayang kulit, Ramayana, Mahabharata]
    answer: 1
    explain:
      ar_eg: «aku nonton Ramayana ing Prambanan» = اتفرجت على رامايانا.
      ar: «aku nonton Ramayana ing Prambanan» = شاهدتُ رامايانا.
      en: '"aku nonton Ramayana ing Prambanan" = I watched the Ramayana.'
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي شخصية عجبت محمد أكتر حاجة؟
      ar: أي شخصية أعجبت محمدًا أكثر؟
      en: Which character did Mohamed like best?
    options: [Rahwana, Rama, Hanoman]
    answer: 2
    explain:
      ar_eg: «Hanoman sing paling apik!» = Hanoman كان الأحلى.
      ar: «Hanoman sing paling apik!» = كان Hanoman الأفضل.
      en: '"Hanoman sing paling apik!" = Hanoman was the best.'
  - id: e03
    type: listen
    text: Gamelane apik banget, sindhene uga.
    question:
      ar_eg: إيه كمان اللي عجب محمد؟
      ar: ماذا أعجب محمدًا أيضًا؟
      en: What else did Mohamed like?
    options: [gamelan lan sindhen, gong wae, dhalange]
    answer: 0
    meaning:
      ar_eg: الجاميلان كانت حلوة أوي، والمغنّية كمان.
      ar: كان الغاميلان رائعًا، والمغنّية أيضًا.
      en: The gamelan was wonderful, and so was the singer.
    words: [gamelan, sindhen]
  - id: e04
    type: match_pairs
    pairs:
      - text: sindhen
        ar_eg: مغنّية الجاميلان
        ar: مغنّية الغاميلان
        en: female gamelan singer
      - text: gendhing
        ar_eg: مقطوعة جاميلان
        ar: مقطوعة غاميلان
        en: a gamelan piece
      - text: kendhang
        ar_eg: الطبلة (بتقود الإيقاع)
        ar: الطبل (يقود الإيقاع)
        en: drum (leads the tempo)
      - text: crita
        ar_eg: حكاية
        ar: قصة
        en: story
      - text: abdi
        ar_eg: خدّام
        ar: خادم
        en: servant
    words: [sindhen, gendhing, kendhang, crita, abdi]
  - id: e05
    type: fill_blank
    sentence: Hanoman matur Rama nganggo ___.
    meaning:
      ar_eg: Hanoman بيكلّم Rama بالكراما.
      ar: يخاطب Hanoman Rama بالكراما.
      en: Hanoman speaks to Rama in krama.
    options: [ngoko, krama]
    answers: [krama]
    explain:
      ar_eg: Hanoman خدّام، والخدّام بيكلّم سيده بالكراما.
      ar: Hanoman خادم، والخادم يخاطب سيّده بالكراما.
      en: Hanoman is a servant, and a servant speaks krama to his lord.
    words: [abdi]
  - id: e06
    type: build_sentence
    source:
      ar_eg: الجاميلان كانت حلوة أوي، والمغنّية كمان.
      ar: كان الغاميلان رائعًا، والمغنّية أيضًا.
      en: The gamelan was wonderful, and so was the singer.
    answer: Gamelane apik banget, sindhene uga.
    distractors: [sindhenipun, sae]
    words: [gamelan, sindhen]
  - id: e07
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Pak Harsono، كراما) يا أستاذ، الجاميلان كانت حلوة أوي.
      ar: (إلى Pak Harsono، بالكراما) يا سيدي، كان الغاميلان رائعًا جدًا.
      en: (to Pak Harsono, krama) Sir, the gamelan was wonderful.
    answers:
      - Pak, gamelanipun sae sanget.
      - Gamelanipun sae sanget, Pak.
      - Pak, gamelanipun sae sanget!
    explain:
      ar_eg: للكبير كراما - -ipun بدل -e، وsae sanget بدل apik banget.
      ar: للكبير بالكراما - -ipun مكان -e، وsae sanget مكان apik banget.
      en: To an elder, krama - -ipun for -e, sae sanget for apik banget.
    words: [gamelan]
  - id: e08
    type: speaking
    text: Bengi iki aku nonton Ramayana ing Prambanan.
    meaning:
      ar_eg: الليلة دي اتفرجت على رامايانا في Prambanan.
      ar: الليلة شاهدتُ رامايانا في Prambanan.
      en: Tonight I watched the Ramayana at Prambanan.
dialogue:
  title: Komentar Mas Dimas
  lines:
    - speaker: Mas Dimas
      text: Lho, kowe nonton Ramayana neng Prambanan?
      ar_eg: الله، اتفرجت على رامايانا في Prambanan؟
      ar: رائع، هل شاهدت رامايانا في Prambanan؟
      en: Wow, you watched the Ramayana at Prambanan?
    - speaker: Mohamed
      text: Iya, Mas! Apik banget.
      ar_eg: أيوه يا Dimas! حلوة أوي.
      ar: نعم يا Dimas! رائعة جدًا.
      en: Yes! It was wonderful.
    - speaker: Mas Dimas
      text: Sapa sing paling apik?
      ar_eg: مين كان الأحلى؟
      ar: من كان الأفضل؟
      en: Who was the best?
    - speaker: Mohamed
      text: Hanoman! Lan sindhene uga apik.
      ar_eg: Hanoman! والمغنّية كمان حلوة.
      ar: Hanoman! والمغنّية جميلة أيضًا.
      en: Hanoman! And the singer was great too.
    - speaker: Mas Dimas
      text: Sesuk aku melu, ya!
      ar_eg: بكرة أنا جاي معاك!
      ar: غدًا سآتي معك!
      en: Tomorrow I'm coming with you!
