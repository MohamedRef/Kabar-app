      ar_eg: sinebut = بيتسمّى. didandani = اتصلّح وkebanjiran = غرق في فيضان.
      ar: sinebut تعني يُسمّى. أما didandani فأُصلح وkebanjiran غمره الفيضان.
      en: sinebut means "is called". didandani is "repaired" and kebanjiran is "flooded".
