dialogue:
  title: Nyritakake warta
  lines:
    - speaker: Mbak Ayu
      text: Ana warta apa, Mohamed?
      ar_eg: فيه أخبار إيه يا محمد؟
      ar: ما الأخبار يا محمد؟
      en: What's the news, Mohamed?
    - speaker: Mohamed
      text: Wingi dalan ing Manguharjo kebanjiran.
      ar_eg: امبارح الشارع في مانجوهارجو غرق مية.
      ar: غمرت المياه أمس الشارعَ في مانغوهارجو.
      en: Yesterday the road in Manguharjo got flooded.
    - speaker: Mbak Ayu
      text: Waduh! Saiki piye?
      ar_eg: يا خبر! وإيه الأخبار دلوقتي؟
      ar: يا للهول! وكيف الحال الآن؟
      en: Oh no! How is it now?
    - speaker: Mohamed
      text: Wis diresiki dening warga. Aman, Mbak.
      ar_eg: الأهالي نضّفوه خلاص. كله تمام يا آيو.
      ar: نظّفه الأهالي. كل شيء بخير يا آيو.
      en: The residents have cleaned it up. All fine, Ayu.
souvenir:
  id: j5.u02.souvenir
  title: Gerbong INKA
  note:
    ar_eg: |
      ماديون اسمها كمان «مدينة القطر»: فيها مصنع INKA (Industri Kereta Api)، الشركة الإندونيسية اللي بتصنع عربيات القطر، في شارع Yos Sudarso مكان ورشة السكة الحديد القديمة. ومحطة ماديون نفسها من 1882. ومن عشرات السنين فيه مجلات زي Djaka Lodang في جوجا بتنشر بالجاوي، فالأخبار اللي بتقراها دلوقتي، عن القطرات أو غيرها، ليها تاريخ طويل.
    ar: |
      تُلقَّب ماديون أيضًا «مدينة القطار»: ففيها مصنع INKA (Industri Kereta Api)، الشركة الإندونيسية التي تصنع عربات القطارات، في شارع Yos Sudarso مكان ورشة السكك الحديدية القديمة. ومحطة ماديون نفسها قائمة منذ 1882. ومنذ عقود تنشر مجلات مثل Djaka Lodang في جوغجا بالجاوية، فالأخبار التي تقرؤها الآن لها تاريخ طويل.
    en: |
      Madiun is also the "railway city": it is home to INKA (Industri Kereta Api), Indonesia's rail-car maker, on Jalan Yos Sudarso where the old railway workshop stood, and Madiun Station itself dates from 1882. And for decades, magazines like Jogja's Djaka Lodang have published in Javanese, so the news you're reading now, about trains or anything else, has a long history.
