        ar: من قِبَل (= oleh)
        en: by (= oleh)
      - text: kapilih
        ar_eg: اتنتخب (= dipilih)
        ar: انتُخب (= dipilih)
        en: was elected (= dipilih)
      - text: sinebut
        ar_eg: بيتسمّى (= disebut)
        ar: يُسمّى (= disebut)
        en: is called (= disebut)
      - text: tinulis
        ar_eg: مكتوب (= ditulis)
        ar: مكتوب (= ditulis)
        en: written (= ditulis)
      - text: dipunbangun
        ar_eg: اتبنى (كراما)
        ar: بُني (كراما)
        en: was built (krama)
      - text: dakwaca
        ar_eg: أنا قريته
        ar: قرأتُه
        en: I read it
    words: [dening, kapilih, sinebut, tinulis]
  - id: e02
    type: multiple_choice
    question: Lurah kasebut kapilih dening warga.
    question_meaning:
      ar_eg: يعني إيه بالإندونيسي؟
      ar: ما معناها بالإندونيسية؟
      en: What does it mean in Indonesian?
    options: ['Warga memilih lurah itu.', 'Lurah itu memilih warga.', 'Lurah itu menulis warta.']
    answer: 0
    explain:
      ar_eg: الفاعل بعد dening (warga). يعني الأهالي هما اللي انتخبوا.
      ar: الفاعل بعد dening (warga)، فالأهالي هم المنتخِبون.
      en: "The doer follows dening (warga): the residents did the electing."
    words: [lurah, kapilih, kasebut]
