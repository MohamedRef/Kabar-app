    words: [dibangun, jaman, Walanda]
    explain:
      ar_eg: dibangun ing jaman Walanda = اتبنت أيام الهولنديين. dening محتاجة فاعل بعدها، وkang = اللي.
      ar: dibangun ing jaman Walanda = بُنيت في عهد الهولنديين. أما dening فتحتاج فاعلًا بعدها، وkang الذي.
      en: dibangun ing jaman Walanda is "built in the Dutch era". dening needs a doer after it, and kang is "which".
