    ar_eg: كفاية (cukup)
    ar: يكفي (cukup)
    en: enough (cukup)
  - word: sewu
    pos: number
    ar_eg: ألف (seribu)
    ar: ألف (seribu)
    en: a thousand (seribu)
  - word: sejuta
    pos: number
    ar_eg: مليون (sejuta)
    ar: مليون (sejuta)
    en: a million (sejuta)
