dialogue:
  lines:
    - speaker: Bu Siti
      text: "Mriki, Mas Mohamed! Badhe tumbas napa?"
      ar_eg: "تعالى هنا يا أستاذ محمد! عايز تشتري إيه؟"
      ar: "تعال إلى هنا يا محمد! ماذا تريد أن تشتري؟"
      en: "Over here, Mohamed! What would you like?"
    - speaker: Mohamed
      text: "Nyuwun pirsa, Bu. Gadhah tempe?"
      ar_eg: "لو سمحتي يا ست. عندك تمبيه؟"
      ar: "اسمحي لي يا سيدتي. هل لديك تمبيه؟"
      en: "May I ask, ma'am? Have you got tempe?"
    - speaker: Bu Siti
      text: "Gadhah, Mas. Ingkang niki sae sanget."
      ar_eg: "عندي يا أستاذ. اللي هنا ده حلو أوي."
      ar: "لديّ يا أخي. هذا هنا جيد جدًا."
      en: "I have, mate. This one here is very good."
    - speaker: Mohamed
      text: "Kalih kemawon, Bu."
      ar_eg: "اتنين بس يا ست."
      ar: "اثنان فقط يا سيدتي."
      en: "Just two, ma'am."
    - speaker: Bu Siti
      text: "Nggih. Mas ngangge tas?"
      ar_eg: "ماشي. هتستعمل كيس؟"
      ar: "حسنًا. هل ستستعمل كيسًا؟"
      en: "Sure. Do you want a bag?"
    - speaker: Mohamed
      text: "Mboten, Bu. Kula ngangge tas kula."
      ar_eg: "لأ يا ست. هستعمل شنطتي."
      ar: "لا يا سيدتي. سأستعمل حقيبتي."
      en: "No thanks, ma'am. I'll use my own bag."
new_words:
  - word: nyuwun
    pos: verb
    ar_eg: يطلب (كراما من njaluk)
    ar: يطلب (كراما من njaluk)
    en: ask for, request, krama (ngoko njaluk, Indonesian minta)
  - word: pirsa
    pos: verb
    ar_eg: يعرف، يشوف (كراما إنجيل)؛ nyuwun pirsa = لو سمحت أسأل
    ar: يعرف، يرى (كراما إنغيل)؛ nyuwun pirsa = اسمح لي أن أسأل
    en: know, see, krama inggil; nyuwun pirsa = may I ask
  - word: gadhah
    pos: verb
    ar_eg: عنده (كراما من duwe)
    ar: يملك، لديه (كراما من duwe)
    en: have, own, krama (ngoko duwe, Indonesian punya)
  - word: ingkang
    pos: pronoun
    ar_eg: اللي (كراما من sing)
    ar: الذي (كراما من sing)
    en: the one that, which, who, krama (ngoko sing, Indonesian yang)
  - word: mriki
    pos: adverb
    ar_eg: لهنا (كراما من mrene)
    ar: إلى هنا (كراما من mrene)
    en: (to) here, krama (ngoko mrene, Indonesian ke sini)
  - word: kemawon
    pos: adverb
    ar_eg: بس (كراما من wae؛ في الشارع mawon)
    ar: فقط (كراما من wae؛ وفي الشارع mawon)
    en: just, only, krama (ngoko wae, street mawon, Indonesian saja)
  - word: ngangge
    pos: verb
    ar_eg: يلبس، يستعمل (كراما من nganggo)
    ar: يلبس، يستعمل (كراما من nganggo)
    en: wear, use, krama (ngoko nganggo, Indonesian pakai)
