schema: kabar.lesson/v1
id: j3.u02.l03
language: jv
title: Nyuwun pirsa, Bu
can_do:
  ar_eg: 'تسأل في سوق كرانجان بأدب: لو سمحت أسأل، عندك، اللي، تعالى هنا، بس، وتلبس.'
  ar: 'أن تسأل في سوق كرانغان بأدب: اسمح لي أن أسأل، هل لديك، الذي، تعال إلى هنا، فقط، ويلبس.'
  en: 'Ask politely in Pasar Kranggan: may I ask, do you have, the one that, come here, just, and wear.'
slides:
  - title: Nyuwun pirsa...
    body:
      ar_eg: |
        njaluk ← nyuwun = يطلب: «Nyuwun toya» = ممكن ميّه؟
        pirsa = يعرف، يشوف (كراما إنجيل). «Nyuwun pirsa...» = لو سمحت أسأل...: أأدب بداية لأي سؤال.
        duwe ← gadhah = عنده: «Gadhah salak, Bu?» = عندك سلاك يا ست؟
        sing ← ingkang = اللي: «ingkang abrit» = اللي لونه أحمر.
        mrene ← mriki = لهنا: «Mriki, Mas!» = تعالى هنا! (ngriki = هنا، ثابت).
        wae ← kemawon = بس (في الشارع mawon). nganggo ← ngangge = يلبس، يستعمل.
      ar: |
        njaluk ← nyuwun = يطلب: «Nyuwun toya» = هل لي بماء؟
        pirsa = يعرف، يرى (كراما إنغيل). «Nyuwun pirsa...» = اسمح لي أن أسأل...: أكثر بدايات السؤال أدبًا.
        duwe ← gadhah = يملك، لديه: «Gadhah salak, Bu?» = هل لديك سلاك يا سيدتي؟
        sing ← ingkang = الذي: «ingkang abrit» = الأحمر.
        mrene ← mriki = إلى هنا: «Mriki, Mas!» = تعال إلى هنا! (ngriki = هنا، للمكان الثابت).
        wae ← kemawon = فقط (وفي الشارع mawon). nganggo ← ngangge = يلبس، يستعمل.
      en: |
        njaluk → nyuwun = ask for: "Nyuwun toya" = could I have some water?
        pirsa = know, see (krama inggil). "Nyuwun pirsa..." = may I ask...: the politest way to open a question.
        duwe → gadhah = have: "Gadhah salak, Bu?" = do you have salak, ma'am?
        sing → ingkang = the one that, which: "ingkang abrit" = the red one.
        mrene → mriki = (to) here: "Mriki, Mas!" = come here! (ngriki = here, staying put).
        wae → kemawon = just (on the street mawon). nganggo → ngangge = wear, use.
    examples:
      - text: Nyuwun pirsa, Bu, griyanipun Pak Harjo wonten pundi?
        ar_eg: لو سمحتي يا ست، بيت أستاذ هارجو فين؟
        ar: اسمحي لي يا سيدتي، أين بيت السيد هارجو؟
        en: Excuse me, ma'am, where's Pak Harjo's house?
      - text: Gadhah salak ingkang manis, Bu?
        ar_eg: عندك سلاك مسكّر يا ست؟
        ar: هل لديك سلاك حلو يا سيدتي؟
        en: Have you got any sweet salak, ma'am?
      - text: Mriki, Mas! Setunggal kemawon?
        ar_eg: تعالى هنا يا أستاذ! واحدة بس؟
        ar: تعال إلى هنا يا أخي! واحدة فقط؟
        en: Over here, mate! Just one?
