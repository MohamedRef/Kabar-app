schema: kabar.lesson/v1
id: j1.u01.l04
language: jv
title: Mas, mbak, cak, rek
can_do:
  ar_eg: تنادي الناس بشكل ودّي من غير رسميات.
  ar: أن تخاطب الناس مخاطبة ودّية غير رسمية.
  en: Address people casually.
slides:
  - title: Mas lan mbak · Mas apik?
    body:
      ar_eg: |
        في جاوة نادرًا ما بتنادي حد باسمه بس، بتحط قبله لقب عيلة حتى لو مش قريبك — زي «يا أسطى» و«يا أبلة» عندنا.
        - mas = لشاب (حرفيًا «أخويا الكبير»)، زي «يا كابتن».
        - mbak = لبنت أو ست شابة (حرفيًا «أختي الكبيرة»).
        إنت عارفهم من الإندونيسي (Mas Ardi)، وأصلهم أصلًا جاوي!
        Pak وBu للكبار، بالظبط زي الإندونيسي.
        زي الإندونيسي («Bapak mau kopi?»)، اللقب نفسه بيشتغل كـ«إنت» — وده أدب أكتر من kowé:
        - «Mas piye kabare?» = إزيك؟ (حرفيًا: الأستاذ عامل إيه؟)
        - «Budhe piye?» = وحضرتك يا طنط؟
        وخلي بالك: mas للراجل وmbak للبنت. «Mas Rara» غلط، الصح «Mbak Rara».
      ar: |
        قلّما يُنادى أحد في جاوة باسمه مجردًا، بل يُسبق بلقب قرابة وإن لم يكن قريبًا، كما نقول «يا أخي» و«يا حاج».
        - mas للشاب (أصلها «الأخ الأكبر»).
        - mbak للفتاة أو المرأة الشابة (أصلها «الأخت الكبرى»).
        وهما معروفتان من الإندونيسية (Mas Ardi)، وأصلهما جاوي.
        وPak وBu للكبار كما في الإندونيسية.
        كما في الإندونيسية («Bapak mau kopi?») يقوم اللقب مقام «أنت»، وهو أكثر تأدبًا من kowé:
        - «Mas piye kabare?» = كيف حالك؟ (حرفيًا: كيف حال الأخ؟)
        - «Budhe piye?» = وأنتِ يا عمّة؟
        وانتبه: mas للذكر وmbak للأنثى، فـ«Mas Rara» خطأ والصواب «Mbak Rara».
      en: |
        In Java you rarely call someone by their bare name. You add a family title, even to strangers — like Egyptian «يا أسطى» or «يا أبلة».
        - mas = for a young man (literally "big brother").
        - mbak = for a young woman (literally "big sister").
        You know both from Indonesian (Mas Ardi) — they're Javanese in origin!
        Pak and Bu for older people, exactly as in Indonesian.
        As in Indonesian ("Bapak mau kopi?"), the title itself works as "you" — and it's more polite than kowé:
        - "Mas piye kabare?" = How are you? (literally "How is Mas?")
        - "Budhe piye?" = And you, auntie?
        Careful: mas is for men, mbak for women. "Mas Rara" is wrong; it's "Mbak Rara".
    grammar: jv.address.terms
    examples:
      - text: Piye kabare, Mas?
        ar_eg: إزيك يا كابتن؟
        ar: كيف حالك يا أخي؟
        en: How are you? (to a young man)
      - text: Matur nuwun, Mbak.
        ar_eg: شكرًا يا آنسة.
        ar: شكرًا يا آنسة.
        en: Thank you, miss.
      - text: Mbak piye kabare?
        ar_eg: إزيك يا آنسة؟
        ar: كيف حالكِ يا آنسة؟
        en: How are you, miss?
  - title: Cak lan ning (Arek)
    body:
      ar_eg: |
        في سورابايا (لهجة **Arek**) فيه ألقاب خاصة بالمدينة:
        - cak = mas (للراجل الشاب). Cak Heru = «الكابتن هيرو».
        - ning = mbak (للبنت).
        وكل سنة سورابايا بتختار «Cak lan Ning Suroboyo» سفراء للمدينة.
        cak منتشرة جدًا: مع البيّاع، السوّاق، صاحبك. «Cak, piye kabare?»
      ar: |
        في سورابايا (لهجة **Arek**) ألقاب خاصة بالمدينة:
        - cak = mas (للشاب).
        - ning = mbak (للفتاة).
        وتختار سورابايا كل عام «Cak lan Ning Suroboyo» سفيرين للمدينة.
        وcak شائعة جدًا مع البائع والسائق والصديق.
      en: |
        Surabaya (**Arek**) has titles of its own:
        - cak = mas (for a young man). Cak Heru = "brother Heru".
        - ning = mbak (for a young woman).
        Every year Surabaya picks "Cak & Ning Suroboyo" as city ambassadors.
        cak is everywhere: sellers, drivers, your friends. "Cak, piye kabare?"
    grammar: jv.address.terms
    examples:
      - text: Suwun, Cak!
        ar_eg: ميرسي يا معلم! (Arek)
        ar: شكرًا يا أخي! (Arek)
        en: Thanks, brother! (Arek)
  - title: Ayo, rek!
    body:
      ar_eg: |
        rek (من arek = عيل، ولد) هي علامة سورابايا المشهورة: «يا جدعان / يا صاحبي».
        بتيجي في **آخر** الجملة، لصاحب واحد أو للشلة كلها:
        - Ayo, rek! = يلا يا جدعان! (ayo زي الإندونيسي)
        - Suwun, rek! = ميرسي يا جماعة!
        بس rek للصحاب اللي في سنك بس — مش لراجل كبير. للكبير قول Pak.
      ar: |
        rek (من arek = الولد) علامة سورابايا الشهيرة، بمعنى «يا جماعة / يا صاح».
        وتأتي في **آخر** الجملة، لصديق واحد أو للجماعة:
        - Ayo, rek! = هيا يا جماعة! (ayo كالإندونيسية)
        - Suwun, rek! = شكرًا يا جماعة!
        لكنها للأقران فقط لا للرجل الكبير، فهو يُنادى Pak.
      en: |
        rek (from arek, kid) is Surabaya's signature word: "guys / mate".
        It goes at the **end** of the sentence, to one friend or the whole group:
        - Ayo, rek! = Come on, guys! (ayo as in Indonesian)
        - Suwun, rek! = Thanks, guys!
        rek is only for friends your age — never an older man. Call him Pak.
    grammar: jv.address.terms
    examples:
      - text: Ayo, rek!
        ar_eg: يلا يا جدعان! (Arek)
        ar: هيا يا جماعة! (Arek)
        en: Come on, guys! (Arek)
  - title: Dhe, le, nduk
    body:
      ar_eg: |
        - dhe = اختصار pakdhe (عمو / خالو، الكبير) أو budhe (طنط). «Piye kabare, Dhe?» = إزيك يا عمو؟
          وفي الشات هتلاقي «piye dhe» = «إيه رأيك يا عمو؟».
        - le (من thole) = لولد صغير، وnduk = لبنت صغيرة. الكبار بيقولوها زي «يا حبيبي / يا بنتي». إنت مش هتقولها لحد، بس هتسمعها.
      ar: |
        - dhe اختصار pakdhe (العم) أو budhe (العمة): «Piye kabare, Dhe?» = كيف حالك يا عم؟
          وفي الدردشة: «piye dhe» = «ما رأيك يا عم؟».
        - le (من thole) للصبي، وnduk للبنت، يقولها الكبار كقولنا «يا بنيّ / يا بنتي»؛ ستسمعها ولن تقولها غالبًا.
      en: |
        - dhe = short for pakdhe (uncle) or budhe (auntie). "Piye kabare, Dhe?" = How are you, uncle?
          In chats you'll see "piye dhe" = "So, what do you think, uncle?".
        - le (from thole) = to a little boy, nduk = to a little girl. Older people say them like «يا حبيبي / يا بنتي». You'll hear them more than say them.
    grammar: jv.address.terms
    examples:
      - text: Sugeng enjing, Budhe!
        ar_eg: صباح الخير يا طنط!
        ar: صباح الخير يا عمّة!
        en: Good morning, auntie!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mas
        ar_eg: يا كابتن (لشاب)
        ar: يا أخي (للشاب)
        en: young man, brother
      - text: mbak
        ar_eg: يا آنسة (لبنت)
        ar: يا آنسة (للفتاة)
        en: young woman, sister
      - text: cak
        ar_eg: يا معلم (لشاب، سورابايا)
        ar: يا أخي (للشاب، سورابايا)
        en: brother (Surabaya)
      - text: rek
        ar_eg: يا جدعان
        ar: يا جماعة
        en: guys, mate
      - text: dhe
        ar_eg: يا عمو / يا طنط
        ar: يا عمّ / يا عمّة
        en: uncle / auntie
    words: [mas, mbak, cak, rek, dhe]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: في سوق Pasar Turi، عايز تنادي بيّاع شاب على طريقة سورابايا. تقول إيه؟
      ar: في سوق Pasar Turi تريد مناداة بائع شاب على طريقة أهل سورابايا. ماذا تقول؟
      en: At Pasar Turi you want to call a young seller the Surabaya way. What do you say?
    options: [Cak!, Nduk!, Budhe!]
    answer: 0
    explain:
      ar_eg: cak = mas بتاعة سورابايا. nduk لبنت صغيرة، وbudhe لست كبيرة.
      ar: cak هي mas في سورابايا، أما nduk فللبنت الصغيرة، وbudhe للمرأة الكبيرة.
      en: cak is Surabaya's mas; nduk is for a little girl, budhe for an older woman.
    words: [cak]
  - id: e03
    type: listen
    text: Suwun, Cak!
    options: ['Suwun, rek!', 'Suwun, Dhe!', 'Suwun, Cak!']
    answer: 2
    words: [suwun, cak]
  - id: e04
    type: fill_blank
    sentence: Piye kabare, ___?
    meaning:
      ar_eg: إزيك يا طنط؟ (لست كبيرة، أخت مامة صاحبك)
      ar: كيف حالكِ يا عمّة؟ (لامرأة كبيرة، خالة صديقك)
      en: How are you, auntie? (to an older woman, your friend's aunt)
    options: [Budhe, le, Mas, rek]
    answers: [Budhe]
    explain:
      ar_eg: budhe = طنط (الكبيرة). rek للصحاب، le لولد صغير، mas لشاب.
      ar: budhe = العمة الكبرى، أما rek فللأقران، وle للصبي، وmas للشاب.
      en: budhe = auntie. rek is for mates, le for a little boy, mas for a young man.
    words: [budhe]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: صباح الخير يا عمو! (بأدب)
      ar: صباح الخير يا عمّ! (بأدب)
      en: Good morning, uncle! (politely)
    answers: ['Sugeng enjing, Pakdhe!', 'Sugeng enjing, Pakdhe', Sugeng enjing Pakdhe, 'Sugeng enjing, Dhe!', 'Sugeng enjing, Dhe', Sugeng enjing Dhe, 'Sugeng enjing, Pakde!', 'Sugeng enjing, Pakde']
    explain:
      ar_eg: sugeng enjing = صباح الخير (مؤدبة)، وpakdhe (أو dhe اختصارًا) = عمو.
      ar: sugeng enjing = صباح الخير بأدب، وpakdhe (أو dhe اختصارًا) = العم.
      en: sugeng enjing = good morning (polite); pakdhe (short dhe) = uncle.
    words: [sugeng enjing, pakdhe]
  - id: e06
    type: speaking
    text: Suwun, Cak!
    meaning:
      ar_eg: ميرسي يا معلم!
      ar: شكرًا يا أخي!
      en: Thanks, brother!
    words: [suwun, cak]
dialogue:
  title: Pakdhe Darmo
  lines:
    - speaker: Cak Heru
      text: Mohamed, Pakdhe Darmo.
      ar_eg: يا محمد، ده عمو دارمو.
      ar: يا محمد، هذا العم دارمو.
      en: Mohamed, meet Uncle Darmo.
    - speaker: Mohamed
      text: Sugeng sonten, Pakdhe.
      ar_eg: مساء الخير يا عمو.
      ar: مساء الخير يا عمّ.
      en: Good afternoon, uncle.
    - speaker: Pakdhe Darmo
      text: Sugeng sonten, Mas. Piye kabare?
      ar_eg: مساء النور يا ابني. إزيك؟
      ar: مساء النور يا بنيّ. كيف حالك؟
      en: Good afternoon, young man. How are you?
    - speaker: Mohamed
      text: Apik, matur nuwun. Pakdhe piye?
      ar_eg: كويس، شكرًا. وحضرتك يا عمو؟
      ar: بخير، شكرًا. وأنت يا عمّ؟
      en: Fine, thank you. And you, uncle?
    - speaker: Pakdhe Darmo
      text: Alhamdulillah, apik.
      ar_eg: الحمد لله، كويس.
      ar: الحمد لله، بخير.
      en: Alhamdulillah, fine.
    - speaker: Mbak Rara
      text: Mohamed, Cak Heru, ayo!
      ar_eg: يا محمد، يا هيرو، يلا!
      ar: يا محمد، يا هيرو، هيا!
      en: Mohamed, Heru, come on!
new_words:
  - word: mas
    pos: noun
    ar_eg: لقب لشاب (يا كابتن)
    ar: لقب للشاب (يا أخي)
    en: title for a young man
  - word: mbak
    pos: noun
    ar_eg: لقب لبنت أو ست شابة
    ar: لقب للفتاة أو المرأة الشابة
    en: title for a young woman
  - word: cak
    pos: noun
    ar_eg: لقب لشاب في سورابايا (= mas، Arek)
    ar: لقب للشاب في سورابايا (= mas، Arek)
    en: title for a young man in Surabaya (= mas, Arek)
  - word: rek
    pos: interjection
    ar_eg: يا جدعان / يا صاحبي (Arek، من arek)
    ar: يا جماعة / يا صاح (Arek، من arek)
    en: guys, mate (Arek, from arek = kid)
  - word: pakdhe
    pos: noun
    ar_eg: عمو / خالو (الكبير)؛ اختصارها dhe
    ar: العمّ / الخال الأكبر؛ واختصارها dhe
    en: uncle (older than your parent); short dhe
  - word: budhe
    pos: noun
    ar_eg: طنط (الكبيرة)؛ اختصارها dhe
    ar: العمّة / الخالة الكبرى؛ واختصارها dhe
    en: auntie (older than your parent); short dhe
  - word: le
    pos: noun
    ar_eg: يا حبيبي (لولد صغير، من thole)
    ar: يا بنيّ (للصبي، من thole)
    en: what elders call a little boy (from thole)
  - word: nduk
    pos: noun
    ar_eg: يا بنتي (لبنت صغيرة)
    ar: يا بنيّتي (للبنت الصغيرة)
    en: what elders call a little girl
