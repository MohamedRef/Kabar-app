schema: kabar.lesson/v1
id: j1.u01.l04
language: jv
title: Mas, mbak, dhik, cah
can_do:
  ar_eg: تنادي الناس بشكل ودّي من غير رسميات.
  ar: أن تخاطب الناس مخاطبة ودّية غير رسمية.
  en: Address people casually.
slides:
  - title: Mas lan mbak · Mas apik?
    body:
      ar_eg: |
        في جاوة نادرًا ما بتنادي حد باسمه بس، بتحط قبله لقب عيلة حتى لو مش قريبك — زي «يا أسطى» و«يا أبلة» عندنا.
        - mas = لشاب (حرفيًا «أخويا الكبير»)، زي «يا كابتن».
        - mbak = لبنت أو ست شابة (حرفيًا «أختي الكبيرة»).
        إنت عارفهم من الإندونيسي (Mas Rizal)، وأصلهم أصلًا جاوي!
        Pak وBu للكبار، بالظبط زي الإندونيسي.
        زي الإندونيسي («Bapak mau kopi?»)، اللقب نفسه بيشتغل كـ«إنت» — وده أدب أكتر من kowe:
        - «Mas piye kabare?» = إزيك؟ (حرفيًا: الأستاذ عامل إيه؟)
        - «Budhe piye?» = وحضرتك يا طنط؟
        وخلي بالك: mas للراجل وmbak للبنت. «Mas Rara» غلط، الصح «Mbak Rara».
      ar: |
        قلّما يُنادى أحد في جاوة باسمه مجردًا، بل يُسبق بلقب قرابة وإن لم يكن قريبًا، كما نقول «يا أخي» و«يا حاج».
        - mas للشاب (أصلها «الأخ الأكبر»).
        - mbak للفتاة أو المرأة الشابة (أصلها «الأخت الكبرى»).
        وهما معروفتان من الإندونيسية (Mas Rizal)، وأصلهما جاوي.
        وPak وBu للكبار كما في الإندونيسية.
        كما في الإندونيسية («Bapak mau kopi?») يقوم اللقب مقام «أنت»، وهو أكثر تأدبًا من kowe:
        - «Mas piye kabare?» = كيف حالك؟ (حرفيًا: كيف حال الأخ؟)
        - «Budhe piye?» = وأنتِ يا عمّة؟
        وانتبه: mas للذكر وmbak للأنثى، فـ«Mas Rara» خطأ والصواب «Mbak Rara».
      en: |
        In Java you rarely call someone by their bare name. You add a family title, even to strangers — like Egyptian «يا أسطى» or «يا أبلة».
        - mas = for a young man (literally "big brother").
        - mbak = for a young woman (literally "big sister").
        You know both from Indonesian (Mas Rizal) — they're Javanese in origin!
        Pak and Bu for older people, exactly as in Indonesian.
        As in Indonesian ("Bapak mau kopi?"), the title itself works as "you" — and it's more polite than kowe:
        - "Mas piye kabare?" = How are you? (literally "How is Mas?")
        - "Budhe piye?" = And you, auntie?
        Careful: mas is for men, mbak for women. "Mas Rara" is wrong; it's "Mbak Rara".
    grammar: jv.address.terms
    examples:
      - text: Piye kabare, Mas?
        ar_eg: إزيك يا كابتن؟
        ar: كيف حالك يا أخي؟
        en: How are you? (to a young man)
      - text: Matur nuwun, Mbak.
        ar_eg: شكرًا يا آنسة.
        ar: شكرًا يا آنسة.
        en: Thank you, miss.
      - text: Mbak piye kabare?
        ar_eg: إزيك يا آنسة؟
        ar: كيف حالكِ يا آنسة؟
        en: How are you, miss?
  - title: Dhik (adhik)
    body:
      ar_eg: |
        dhik (من adhik = أخ أو أخت أصغر) لحد **أصغر منك**: الجرسون الشاب، البيّاعة الصغيرة في الأنكرينجان، طالب أصغر.
        - «Dhik, teh anget siji!» = يا ابني، واحد شاي سخن!
        mas وmbak لحد في سنك أو أكبر شوية، وdhik لحد أصغر. لو مش متأكد، قول mas أو mbak، أأمن.
      ar: |
        dhik (من adhik = الأخ أو الأخت الأصغر) لمن هو **أصغر منك**: النادل الشاب، والبائعة الصغيرة في الأنكرينجان، والطالب الأصغر.
        - «Dhik, teh anget siji!» = يا بنيّ، كوب شاي ساخن!
        فـ mas وmbak للمماثل أو الأكبر قليلًا، وdhik للأصغر، وعند الشك فـ mas أو mbak أسلم.
      en: |
        dhik (from adhik, younger brother or sister) is for someone **younger than you**: a young waiter, the girl at the angkringan, a younger student.
        - "Dhik, teh anget siji!" = One hot tea, please! (to a young waiter)
        mas and mbak are for people your age or a bit older; dhik for younger. When unsure, mas or mbak is safer.
    grammar: jv.address.terms
    examples:
      - text: Suwun, Dhik!
        ar_eg: ميرسي يا ابني! (لحد أصغر)
        ar: شكرًا يا بنيّ! (لمن هو أصغر)
        en: Thanks! (to someone younger)
  - title: Ayo, cah!
    body:
      ar_eg: |
        cah (من bocah = عيل) هي «يا جدعان / يا شباب» بتاعة يوجيا. بتتقال للشلة أو لصاحب واحد في سنك:
        - Ayo, cah! = يلا يا جدعان! (ayo زي الإندونيسي)
        - Piye, cah? = إيه الأخبار يا شباب؟
        - Suwun, cah! = ميرسي يا جماعة!
        بس cah للصحاب اللي في سنك أو أصغر، مش لراجل كبير. للكبير قول Pak.
      ar: |
        cah (من bocah = الولد) هي «يا جماعة / يا شباب» في يوجيا، تقال للجماعة أو لصديق من أقرانك:
        - Ayo, cah! = هيا يا جماعة! (ayo كالإندونيسية)
        - Piye, cah? = ما الأخبار يا شباب؟
        - Suwun, cah! = شكرًا يا جماعة!
        لكنها للأقران أو الأصغر فقط لا للرجل الكبير، فهو يُنادى Pak.
      en: |
        cah (from bocah, kid) is Jogja's "guys / mate", to the whole group or one friend your age:
        - Ayo, cah! = Come on, guys! (ayo as in Indonesian)
        - Piye, cah? = What's up, guys?
        - Suwun, cah! = Thanks, guys!
        cah is only for friends your age or younger, never an older man. Call him Pak.
    grammar: jv.address.terms
    examples:
      - text: Ayo, cah!
        ar_eg: يلا يا جدعان!
        ar: هيا يا جماعة!
        en: Come on, guys!
  - title: Dhe, le, nduk
    body:
      ar_eg: |
        - dhe = اختصار pakdhe (عمو / خالو، الكبير) أو budhe (طنط). «Piye kabare, Dhe?» = إزيك يا عمو؟
          وفي الشات هتلاقي «piye dhe» = «إيه رأيك يا عمو؟».
        - le (من thole) = لولد صغير، وnduk = لبنت صغيرة. الكبار بيقولوها زي «يا حبيبي / يا بنتي». إنت مش هتقولها لحد، بس هتسمعها.
      ar: |
        - dhe اختصار pakdhe (العم) أو budhe (العمة): «Piye kabare, Dhe?» = كيف حالك يا عم؟
          وفي الدردشة: «piye dhe» = «ما رأيك يا عم؟».
        - le (من thole) للصبي، وnduk للبنت، يقولها الكبار كقولنا «يا بنيّ / يا بنتي»؛ ستسمعها ولن تقولها غالبًا.
      en: |
        - dhe = short for pakdhe (uncle) or budhe (auntie). "Piye kabare, Dhe?" = How are you, uncle?
          In chats you'll see "piye dhe" = "So, what do you think, uncle?".
        - le (from thole) = to a little boy, nduk = to a little girl. Older people say them like «يا حبيبي / يا بنتي». You'll hear them more than say them.
    grammar: jv.address.terms
    examples:
      - text: Sugeng enjing, Budhe!
        ar_eg: صباح الخير يا طنط!
        ar: صباح الخير يا عمّة!
        en: Good morning, auntie!
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: mas
        ar_eg: يا كابتن (لشاب)
        ar: يا أخي (لشاب)
        en: Mas (young man)
      - text: mbak
        ar_eg: يا آنسة
        ar: يا آنسة
        en: Mbak (young woman)
      - text: cah
        ar_eg: يا جدعان
        ar: يا رفاق
        en: guys, mate
      - text: pakdhe
        ar_eg: عمو (الكبير)
        ar: العم الأكبر
        en: uncle (elder)
      - text: budhe
        ar_eg: طنط (الكبيرة)
        ar: العمة الكبرى
        en: aunt (elder)
      - text: le
        ar_eg: يا حبيبي (لولد صغير)
        ar: يا بُنيّ
        en: son (to a boy)
    words: [mas, mbak, cah, pakdhe, budhe, le]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: في أنكرينجان جنب Malioboro، عايز تنادي الجرسون، وهو أصغر منك. تقول إيه؟
      ar: في أنكرينجان قرب Malioboro تريد مناداة النادل، وهو أصغر منك. ماذا تقول؟
      en: At an angkringan near Malioboro you want to call the waiter, who is younger than you. What do you say?
    options: [Dhik!, Nduk!, Budhe!, Pakdhe!]
    answer: 0
    explain:
      ar_eg: dhik لحد أصغر منك. nduk لبنت صغيرة، وbudhe لست كبيرة.
      ar: dhik لمن هو أصغر منك، أما nduk فللبنت الصغيرة، وbudhe للمرأة الكبيرة.
      en: dhik is for someone younger than you; nduk is for a little girl, budhe for an older woman.
    words: [dhik, nduk, budhe, pakdhe]
  - id: e03
    type: listen
    text: Suwun, Dhik!
    options: ['Suwun, cah!', 'Suwun, Le!', 'Suwun, Dhik!']
    answer: 2
    words: [suwun, dhik, cah, le]
  - id: e04
    type: fill_blank
    sentence: Piye kabare, ___?
    meaning:
      ar_eg: إزيك يا طنط؟ (لست كبيرة، أخت مامة صاحبك)
      ar: كيف حالكِ يا عمّة؟ (لامرأة كبيرة، خالة صديقك)
      en: How are you, auntie? (to an older woman, your friend's aunt)
    options: [Budhe, le, Mas, cah]
    answers: [Budhe]
    explain:
      ar_eg: budhe = طنط (الكبيرة). cah للصحاب، le لولد صغير، mas لشاب.
      ar: budhe = العمة الكبرى، أما cah فللأقران، وle للصبي، وmas للشاب.
      en: budhe = auntie. cah is for mates, le for a little boy, mas for a young man.
    words: [budhe]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: بتنادي على ولد صغير بحنية. تقول إيه؟
      ar: تنادي صبيًّا صغيرًا بلطف. ماذا تقول؟
      en: You call a little boy kindly. What do you say?
    options: [Le!, Nduk!, Mbak!, Dhik!]
    answer: 0
    explain:
      ar_eg: le للولد الصغير بحنية، وnduk للبنت الصغيرة، وmbak لبنت أو ست شابة، وdhik لحد أصغر منك بس مش طفل.
      ar: le للصبي بلطف، وnduk للبنت الصغيرة، وmbak للشابة، وdhik للأصغر منك من غير الأطفال.
      en: le is for a little boy, nduk for a little girl, mbak for a young woman, dhik for someone younger who isn't a child.
    words: [le, nduk, mbak, dhik]
  - id: e06
    type: speaking
    text: Sugeng enjing, Pakdhe! Sugeng enjing, Mas!
    meaning:
      ar_eg: صباح الخير يا عمو! صباح الخير يا كابتن!
      ar: صباح الخير يا عمّي! صباح الخير يا أخي!
      en: Good morning, uncle! Good morning, Mas!
    words: [sugeng enjing, pakdhe, mas]
  - id: e07
    type: listen
    text: Piye kabare, Nduk?
    options: ['Piye kabare, Nduk?', 'Piye kabare, cah?', 'Piye kabare, Mas?', 'Piye kabare, Mbak?']
    answer: 0
    meaning:
      ar_eg: إزيك يا بنتي؟
      ar: كيف حالك يا ابنتي؟
      en: How are you, dear? (to a little girl)
    words: [nduk, cah, mas, mbak]
dialogue:
  title: Pakdhe Darmo
  lines:
    - speaker: Mas Heru
      text: Pakdhe, Mohamed. Mohamed, Pakdhe Darmo.
      ar_eg: يا عمو، ده محمد. يا محمد، ده عمو دارمو.
      ar: يا عمّ، هذا محمد. يا محمد، هذا العمّ دارمو.
      en: Pakdhe, this is Mohamed. Mohamed, this is Pakdhe Darmo.
    - speaker: Mohamed
      text: Sugeng sonten, Pakdhe.
      ar_eg: مساء الخير يا عمو.
      ar: مساء الخير يا عمّ.
      en: Good afternoon, uncle.
    - speaker: Pakdhe Darmo
      text: Sugeng sonten, Mas. Piye kabare?
      ar_eg: مساء النور يا ابني. إزيك؟
      ar: مساء النور يا بنيّ. كيف حالك؟
      en: Good afternoon, young man. How are you?
    - speaker: Mohamed
      text: Apik, matur nuwun. Pakdhe piye?
      ar_eg: كويس، شكرًا. وحضرتك يا عمو؟
      ar: بخير، شكرًا. وأنت يا عمّ؟
      en: Fine, thank you. And you, uncle?
    - speaker: Pakdhe Darmo
      text: Alhamdulillah, apik.
      ar_eg: الحمد لله، كويس.
      ar: الحمد لله، بخير.
      en: Alhamdulillah, fine.
    - speaker: Mbak Rara
      text: Mohamed, Mas Heru, ayo, cah!
      ar_eg: يا محمد، يا هيرو، يلا يا جدعان!
      ar: يا محمد، يا هيرو، هيا يا جماعة!
      en: Mohamed, Heru, come on, guys!
new_words:
  - word: mas
    pos: noun
    ar_eg: لقب لشاب (يا كابتن)
    ar: لقب للشاب (يا أخي)
    en: title for a young man
  - word: mbak
    pos: noun
    ar_eg: لقب لبنت أو ست شابة
    ar: لقب للفتاة أو المرأة الشابة
    en: title for a young woman
  - word: dhik
    pos: noun
    ar_eg: لقب لحد أصغر منك (من adhik)
    ar: لقب لمن هو أصغر منك (من adhik)
    en: title for someone younger than you (from adhik)
  - word: cah
    pos: interjection
    ar_eg: يا جدعان / يا شباب (من bocah)
    ar: يا جماعة / يا شباب (من bocah)
    en: guys, mate (from bocah = kid)
  - word: pakdhe
    pos: noun
    ar_eg: عمو / خالو (الكبير)؛ اختصارها dhe
    ar: العمّ / الخال الأكبر؛ واختصارها dhe
    en: uncle (older than your parent); short dhe
  - word: budhe
    pos: noun
    ar_eg: طنط (الكبيرة)؛ اختصارها dhe
    ar: العمّة / الخالة الكبرى؛ واختصارها dhe
    en: auntie (older than your parent); short dhe
  - word: le
    pos: noun
    ar_eg: يا حبيبي (لولد صغير، من thole)
    ar: يا بنيّ (للصبي، من thole)
    en: what elders call a little boy (from thole)
  - word: nduk
    pos: noun
    ar_eg: يا بنتي (لبنت صغيرة)
    ar: يا بنيّتي (للبنت الصغيرة)
    en: what elders call a little girl
