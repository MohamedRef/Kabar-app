schema: kabar.lesson/v1
id: j1.u03.l05
language: jv
title: Ndelok, golek, mbales
can_do:
  ar_eg: 'تتكلم عن الشات: تشوف، تدوّر، ترد، تطلب، وتبلّغ حد بالخبر.'
  ar: 'أن تتحدّث عن الدردشة: ترى وتبحث وتردّ وتطلب وتبلّغ أحدًا بالخبر.'
  en: 'Talk about chatting: see, look for, reply, ask for and let someone know.'
slides:
  - title: Neng WA
    body:
      ar_eg: |
        ndelok = يبص، يشوف (وبالجاوي الفصيح ndeleng): Wis ndelok status WA-ku?
        golek = يدوّر على. njaluk = يطلب. entuk = ياخد، يجيله (وكمان «مسموح»).
        mbales (bales) = يرد على رسالة. nyeluk = ينادي حد. ngabari = يبلّغ بالخبر.
        kesusu = مستعجل: Sik, aku kesusu!
      ar: |
        ndelok = ينظر، يرى (وبالفصحى الجاوية ndeleng): Wis ndelok status WA-ku?
        golek = يبحث عن. njaluk = يطلب. entuk = يحصل على (وأيضًا «مسموح»).
        mbales (bales) = يردّ على رسالة. nyeluk = ينادي أحدًا. ngabari = يبلّغ بالخبر.
        kesusu = مستعجل: Sik, aku kesusu!
      en: |
        ndelok = look, see (standard ndeleng): Wis ndelok status WA-ku?
        golek = look for. njaluk = ask for. entuk = get (also "be allowed").
        mbales (bales) = reply. nyeluk = call someone over. ngabari = let someone know.
        kesusu = in a hurry: Sik, aku kesusu!
    examples:
      - text: Kowe wis ndelok status WA-ku?
        ar_eg: شفت الستوري بتاعتي على الواتس؟
        ar: هل رأيت حالتي على واتساب؟
        en: Have you seen my WhatsApp status?
      - text: Aku durung entuk wangsulan.
        ar_eg: لسه ما جاليش رد.
        ar: لم يصلني جواب بعد.
        en: I haven't had an answer yet.
      - text: Sik, aku lagi kesusu.
        ar_eg: استنى، أنا مستعجل دلوقتي.
        ar: لحظة، أنا مستعجل الآن.
        en: Hold on, I'm in a hurry.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ndelok
        ar_eg: يبص، يشوف
        ar: يرى
        en: look, see
      - text: golek
        ar_eg: يدوّر على
        ar: يبحث عن
        en: look for
      - text: entuk
        ar_eg: ياخد، يجيله
        ar: يحصل على
        en: get
      - text: njaluk
        ar_eg: يطلب
        ar: يطلب
        en: ask for
    words: [ndelok, golek, entuk, njaluk]
  - id: e02
    type: match_pairs
    pairs:
      - text: mbales
        ar_eg: يرد
        ar: يردّ
        en: reply
      - text: kesusu
        ar_eg: مستعجل
        ar: مستعجل
        en: in a hurry
      - text: nyeluk
        ar_eg: ينادي
        ar: ينادي
        en: call (someone)
      - text: ngabari
        ar_eg: يبلّغ بالخبر
        ar: يبلّغ
        en: let know
    words: [mbales, kesusu, nyeluk, ngabari]
  - id: e03
    type: listen
    text: Sik, aku lagi kesusu.
    question:
      ar_eg: ماله؟
      ar: ما به؟
      en: What's up with him?
    options: [أنا مستعجل دلوقتي, أنا بدوّر على البيت, أنا بطلب قهوة]
    answer: 0
    meaning:
      ar_eg: استنى، أنا مستعجل دلوقتي.
      ar: لحظة، أنا مستعجل الآن.
      en: Hold on, I'm in a hurry.
    words: [kesusu, golek, njaluk]
  - id: e04
    type: fill_blank
    sentence: Aku isih ___ omahe Mas Heru.
    meaning:
      ar_eg: أنا لسه ___ بيت ماس هيرو.
      ar: ما زلت ___ بيت ماس هيرو.
      en: I'm still ___ Mas Heru's house.
    options: [golek, mbales, nyeluk]
    answers: [golek]
    words: [golek, mbales, nyeluk]
  - id: e05
    type: multiple_choice
    question: Aku durung entuk wangsulan.
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [لسه ما جاليش رد., لسه ما رديتش., لسه ما سألتش.]
    answer: 0
    explain:
      ar_eg: entuk = جالي، أخدت. «ما رديتش» = durung mbales.
      ar: entuk = حصلت على. أمّا «لم أردّ» فـdurung mbales.
      en: entuk = get. "I haven't replied" is durung mbales.
    words: [entuk]
  - id: e06
    type: fill_blank
    sentence: Kowe wis ___ status WA-ku?
    meaning:
      ar_eg: إنت ___ الستوري بتاعتي على الواتس؟
      ar: هل ___ حالتي على واتساب؟
      en: Have you ___ my WhatsApp status?
    options: [ndelok, njaluk, kesusu]
    answers: [ndelok]
    words: [ndelok, njaluk, kesusu]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: صاحبك بعتلك رسالة. هتعمل إيه؟
      ar: أرسل إليك صديقك رسالة. ماذا تفعل؟
      en: A friend sent you a message. What do you do?
    options: [Aku mbales., Aku nyeluk., Aku golek.]
    answer: 0
    explain:
      ar_eg: mbales = يرد. nyeluk = ينادي، golek = يدوّر.
      ar: mbales = يردّ. أمّا nyeluk فينادي، وgolek فيبحث.
      en: mbales = reply. nyeluk = call over, golek = look for.
    words: [mbales, nyeluk, golek]
  - id: e08
    type: build_sentence
    source:
      ar_eg: عايز قهوة لو سمحتي يا أبلة.
      ar: أطلب قهوة من فضلك يا أختي.
      en: I'd like a coffee, Mbak.
    answer: Aku njaluk kopi, Mbak.
    distractors: [entuk, ndelok]
    words: [njaluk, entuk, ndelok]
  - id: e09
    type: translate
    direction: from_target
    source_text: Aku wis ngabari Mas Dimas.
    answers_meaning:
      ar_eg: [أنا بلّغت ماس ديماس خلاص, قلت لماس ديماس الخبر]
      ar: [لقد أبلغت ماس ديماس, أخبرت ماس ديماس بالخبر]
      en: ['I''ve let Mas Dimas know', 'I''ve told Mas Dimas']
    words: [ngabari]
  - id: e10
    type: speaking
    text: Sik, aku kesusu. Ngabari aku, ya!
    meaning:
      ar_eg: استنى، أنا مستعجل. بلّغني بالخبر!
      ar: لحظة، أنا مستعجل. أبلغني بالخبر!
      en: Hold on, I'm in a hurry. Let me know!
    words: [kesusu, ngabari]
dialogue:
  lines:
    - speaker: Mas Heru
      text: Cah, kowe wis ndelok chatku? Ngapa durung mbales?
      ar_eg: يا جدع، شفت رسالتي؟ ليه لسه ما رديتش؟
      ar: يا صاحبي، هل رأيت رسالتي؟ لماذا لم تردّ بعد؟
      en: Mate, have you seen my message? Why haven't you replied?
    - speaker: Mohamed
      text: Ngapura, Mas, aku kesusu. Aku golek kantor pos.
      ar_eg: معلش يا ماس، كنت مستعجل. كنت بدوّر على البوستة.
      ar: عذرًا يا ماس، كنت مستعجلًا. كنت أبحث عن مكتب البريد.
      en: Sorry, Mas, I was rushing. I was looking for the post office.
    - speaker: Mas Heru
      text: Wis entuk? Jare cedhak stasiun.
      ar_eg: لقيته؟ بيقولوا قريب من المحطة.
      ar: هل وجدته؟ يقولون إنه قرب المحطة.
      en: Found it? They say it's near the station.
    - speaker: Mohamed
      text: Durung. Aku njaluk tulung, ya?
      ar_eg: لسه. ممكن أطلب مساعدتك؟
      ar: ليس بعد. هل أطلب مساعدتك؟
      en: Not yet. Can I ask for your help?
    - speaker: Mas Heru
      text: Iya. Sik, tak nyeluk Mas Yudha. Engko tak kabari.
      ar_eg: ماشي. استنى، هنادي ماس يودا. وهبلّغك بعدين.
      ar: حسنًا. لحظة، سأنادي ماس يودا، وأبلغك لاحقًا.
      en: Sure. Hold on, I'll call Mas Yudha. I'll let you know.
