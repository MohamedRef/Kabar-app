      ar: اخترت هذه الحقيبة. بمئة ألف، أليس كذلك؟
      en: I'll pick this bag. A hundred thousand, right?
    words: [pilih, tas, satus, jajan]
dialogue:
  lines:
    - speaker: Bu Siti
      text: Monggo, Mas! Jajane anyar, laris tenan.
      ar_eg: اتفضّل يا ماس! الحلويات طازة، وعليها طلب جامد.
      ar: تفضّل يا أخي! الحلوى طازجة ورائجة جدًّا.
      en: Come on in, Mas! Fresh snacks, they're selling fast.
    - speaker: Mohamed
      text: Sing iki pira, Bu?
      ar_eg: دي بكام يا حاجة؟
      ar: بكم هذه يا خالة؟
      en: How much is this one, Bu?
    - speaker: Bu Siti
      text: Sewu siji. Pilih wae, Mas.
      ar_eg: بألف الواحدة. اختار براحتك يا ماس.
      ar: بألف للقطعة. اختر ما شئت يا أخي.
      en: A thousand each. Take your pick, Mas.
    - speaker: Mohamed
      text: Sepuluh, Bu. Lan tempene rong kilo.
      ar_eg: عشرة يا حاجة. واتنين كيلو تمبيه.
      ar: عشرًا يا خالة، وكيلوغرامين من التمبيه.
      en: Ten, Bu. And two kilos of tempe.
    - speaker: Bu Siti
      text: Kabeh seket ewu. Tasmu kene, tak lebokke.
      ar_eg: الكل بخمسين ألف. هات شنطتك، أحطّهم فيها.
      ar: المجموع خمسون ألفًا. هات حقيبتك لأضعها فيها.
      en: Fifty thousand altogether. Give me your bag, I'll pop them in.
