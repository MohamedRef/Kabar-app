schema: kabar.lesson/v1
id: j1.u07.l05
language: jv
title: Satus, sewu, laris
can_do:
  ar_eg: تقول مية وألف، تختار حاجة، وتسأل عن الشنطة والحلويات اللي عليها طلب.
  ar: أن تقول مئة وألفًا، وتختار شيئًا، وتسأل عن الحقيبة والوجبات الخفيفة الرائجة.
  en: Say a hundred and a thousand, pick something, and ask about bags and snacks that sell well.
slides:
  - title: Neng pasar
    body:
      ar_eg: |
        satus = مية، sewu = ألف (من غير «siji»): satus ewu = مية ألف.
        kilo = كيلو: rong kilo = اتنين كيلو.
        adol = يبيع، وعكسها tuku. laris = عليه طلب وبيتباع بسرعة.
        pilih = يختار: Pilih sing endi? = تختار أنهي؟
        jajan = حاجة حلوة أو سناكس تتاكل بين الوجبات (وكمان «يشتري سناكس»). tas = شنطة.
      ar: |
        satus = مئة، sewu = ألف (بلا «siji»): satus ewu = مئة ألف.
        kilo = كيلوغرام: rong kilo = كيلوغرامان.
        adol = يبيع، وعكسها tuku. laris = رائج يُباع بسرعة.
        pilih = يختار: Pilih sing endi? = أيّها تختار؟
        jajan = وجبة خفيفة أو حلوى بين الوجبات (وأيضًا «يشتري وجبة خفيفة»). tas = حقيبة.
      en: |
        satus = 100, sewu = 1,000 (no "siji"): satus ewu = 100,000.
        kilo = kilo: rong kilo = two kilos.
        adol = sell, the opposite of tuku. laris = selling well.
        pilih = choose: Pilih sing endi? = Which one do you choose?
        jajan = snack, a treat between meals (also "buy a snack"). tas = bag.
    examples:
      - text: Tase satus ewu, Mas.
        ar_eg: الشنطة بمية ألف يا ماس.
        ar: الحقيبة بمئة ألف يا أخي.
        en: The bag is a hundred thousand, Mas.
      - text: Bu Siti adol tempe. Tempene laris.
        ar_eg: بو سيتي بتبيع تمبيه، والتمبيه بتاعها عليه طلب.
        ar: بو سيتي تبيع التمبيه، وتمبيهها رائج.
        en: Bu Siti sells tempe. Her tempe sells well.
      - text: Pilih jajan sing endi, Le?
        ar_eg: تختار أنهي سناكس يا ابني؟
        ar: أيّ حلوى تختار يا بنيّ؟
        en: Which snack do you pick, son?
