schema: kabar.lesson/v1
id: j5.u06.l09
language: jv
title: Lir-ilir, sambungane
can_do:
  ar_eg: تسمع بقية «Lir-ilir» وتفهم الراعي المطلوب منه إيه.
  ar: أن تستمع إلى بقية «Lir-ilir» وتفهم ما يُطلب من الراعي.
  en: Follow the next lines of "Lir-ilir" by ear and say what the shepherd boy is asked to do.
exercises:
  - id: e01
    type: listen
    text: Lunyu-lunyu ya penekna, kanggo mbasuh dodotira.
    question:
      ar_eg: بعد «يا راعي، اطلع شجرة البلمبينج»، بيقوله اطلعها ليه؟
      ar: بعد «أيها الراعي، اصعد شجرة البلمبينغ»، لماذا يصعدها؟
      en: After "shepherd boy, climb that starfruit tree", why should he climb it?
    options: [kanggo mangan blimbing, kanggo mbasuh dodotira, kanggo dolanan]
    answer: 1
    meaning:
      ar_eg: حتى لو زلقة، اطلعها، عشان تغسل هدومك (الدودوت).
      ar: ولو كانت زلقة فاصعدها، لتغسل ثوبك (الدودوت).
      en: Slippery as it is, climb it, to wash your dodot.
    explain:
      ar_eg: lunyu = زلق، mbasuh = يغسل، dodot = توب جاوي قديم. والـ ‑ira في dodotira قديمة، وأغلب الشروح بتفهمها «بتاعك».
      ar: lunyu = زلق، وmbasuh = يغسل، وdodot = ثوب جاوي قديم. و‑ira في dodotira قديمة، وأكثر الشروح تفهمها «ثوبك».
      en: lunyu = slippery, mbasuh = wash, dodot = an old Javanese garment. The -ira in dodotira is archaic; most readings take it as "your".
    words: [lunyu, mbasuh, dodot]
  - id: e02
    type: listen
    text: Dodotira, dodotira, kumitir bedhah ing pinggir.
    question:
      ar_eg: التوب ماله؟
      ar: ما بال الثوب؟
      en: What's wrong with the garment?
    options: [wis resik, ilang, bedhah ing pinggir]
    answer: 2
    meaning:
      ar_eg: هدومك، هدومك، بترفرف ومقطوعة من الطرف.
      ar: ثوبك، ثوبك، يرفرف ممزقًا عند الحافة.
      en: Your dodot, your dodot, flaps about, torn at the edge.
    explain:
      ar_eg: bedhah = مقطوع / متقطّع. kumitir = بيرفرف.
      ar: bedhah = ممزق، وkumitir = يرفرف.
      en: bedhah = torn; kumitir = flapping.
    words: [dodot, bedhah]
  - id: e03
    type: listen
    text: Dondomana, jlumatana, kanggo seba mengko sore.
    question:
      ar_eg: الـ «seba» (المقابلة الرسمية) إمتى؟
      ar: متى «seba» (المثول الرسمي)؟
      en: When is the "seba" (the formal audience)?
    options: [mengko sore, esuk iki, sesuk]
    answer: 0
    meaning:
      ar_eg: خيّطه ورقّعه، عشان تقابل بيه (الملك) النهارده بالليل.
      ar: خِطه ورقّعه، لتمثل به (بين يدي الملك) هذا المساء.
      en: Sew it, mend it, to present yourself (before the king) this evening.
    words: [dondomana]
  - id: e04
    type: match_pairs
    pairs:
      - text: lunyu
        ar_eg: زلق
        ar: زلق
        en: slippery
      - text: mbasuh
        ar_eg: يغسل
        ar: يغسل
        en: wash
      - text: dodot
        ar_eg: توب جاوي قديم
        ar: ثوب جاوي قديم
        en: old Javanese garment
      - text: bedhah
        ar_eg: مقطوع
        ar: ممزق
        en: torn
      - text: dondomana
        ar_eg: خيّطه
        ar: خِطه
        en: sew it
    words: [lunyu, mbasuh, dodot, bedhah, dondomana]
  - id: e05
    type: multiple_choice
    question: Dondomana, jlumatana, kanggo seba mengko sore.
    question_meaning:
      ar_eg: الأغنية بتقول للراعي يعمل إيه في التوب المقطوع؟
      ar: ماذا تطلب الأغنية من الراعي أن يفعل بالثوب الممزق؟
      en: What does the song tell the boy to do with the torn garment?
    options: ["Buanglah.", "Jahit dan tamballah.", "Juallah di pasar."]
    answer: 1
    explain:
      ar_eg: dondomana = خيّطه، وjlumatana = رقّعه. الاتنين أمر.
      ar: dondomana = خِطه، وjlumatana = رقّعه، وكلاهما أمر.
      en: dondomana = sew it, jlumatana = mend it; both are commands.
    words: [dondomana]
  - id: e06
    type: fill_blank
    sentence: Dodotira kumitir ___ ing pinggir.
    meaning:
      ar_eg: هدومك بترفرف ومقطوعة من الطرف.
      ar: ثوبك يرفرف ممزقًا عند الحافة.
      en: Your dodot flaps about, torn at the edge.
    options: [lunyu, resik, bedhah]
    answers: [bedhah]
    words: [bedhah, dodot]
  - id: e07
    type: dictation
    text: Lunyu-lunyu ya penekna, kanggo mbasuh dodotira.
    meaning:
      ar_eg: حتى لو زلقة، اطلعها، عشان تغسل هدومك.
      ar: ولو كانت زلقة فاصعدها، لتغسل ثوبك.
      en: Slippery as it is, climb it, to wash your dodot.
    words: [lunyu, mbasuh, dodot]
  - id: e08
    type: translate
    direction: from_target
    source_text: Dondomana, jlumatana, kanggo seba mengko sore.
    answers_meaning:
      ar_eg:
        - خيّطه ورقّعه، عشان تقابل بيه النهارده بالليل.
        - خيّطه ورقّعه، عشان المقابلة بالليل.
        - خيّطه وصلّحه، عشان تروح تقابل الملك بالليل.
        - خيّطه ورقّعه عشان تمثل بيه قدّام الملك الليلة.
      ar:
        - خِطه ورقّعه، لتمثل به هذا المساء.
        - خِطه ورقّعه للمثول بين يدي الملك هذا المساء.
        - خِطه وأصلحه، لتحضر به المقابلة هذا المساء.
      en:
        - Sew it, mend it, to present yourself this evening.
        - Sew it and mend it, for your audience this evening.
        - Sew it and patch it, to appear before the king this evening.
        - Stitch it and mend it, to go before the king this evening.
        - Sew it, mend it, for the audience later this evening.
    words: [dondomana]
dialogue:
  title: Tegese dodot
  lines:
    - speaker: Mohamed
      text: Pak, dodot menika menapa?
      ar_eg: يا حاج، الدودوت ده إيه؟
      ar: يا سيدي، ما الدودوت؟
      en: Sir, what is a dodot?
    - speaker: Pak Ahmad
      text: Dodot iku klambi Jawa jaman biyen lho, Mas.
      ar_eg: الدودوت ده لبس جاوي من زمان يا محمد.
      ar: الدودوت ثوب جاوي من الزمن القديم يا محمد.
      en: A dodot is old-time Javanese clothing, Mohamed.
    - speaker: Mohamed
      text: Lajeng, tegesipun lirik menika menapa?
      ar_eg: طب والكلام ده معناه إيه؟
      ar: وما معنى هذه الكلمات إذن؟
      en: Then what do these lines mean?
    - speaker: Pak Ahmad
      text: Miturut tafsiran, dodot iku iman. Yen bedhah, kudu didondomi.
      ar_eg: حسب التفسير، التوب ده هو الإيمان. لو اتقطع، لازم يتخيّط.
      ar: بحسب التفسير، الثوب هو الإيمان؛ إن تمزّق وجبت خياطته.
      en: In the usual reading, the dodot is faith. If it's torn, it must be sewn.
    - speaker: Mohamed
      text: Piwulangipun sae sanget, Pak.
      ar_eg: الدرس ده حلو أوي يا حاج.
      ar: إنه درس جميل جدًا يا سيدي.
      en: That's a beautiful lesson, sir.
new_words:
  - word: lunyu
    pos: adjective
    ar_eg: زلق
    ar: زلق
    en: slippery = licin
  - word: mbasuh
    pos: verb
    ar_eg: يغسل
    ar: يغسل
    en: wash = mencuci, membasuh
  - word: dodot
    pos: noun
    ar_eg: توب جاوي قديم (dodotira = توبك)
    ar: ثوب جاوي قديم (dodotira = ثوبك)
    en: old Javanese ceremonial cloth (dodotira = your dodot)
  - word: bedhah
    pos: adjective
    ar_eg: مقطوع / متقطّع
    ar: ممزق
    en: torn = sobek
  - word: dondomana
    pos: verb
    ar_eg: خيّطه (أمر من dondom)
    ar: خِطه (أمر من dondom)
    en: sew it (command, from dondom) = jahitlah
