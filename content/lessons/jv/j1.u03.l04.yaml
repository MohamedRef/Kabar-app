schema: kabar.lesson/v1
id: j1.u03.l04
language: jv
title: Soale, jare, jebul
can_do:
  ar_eg: 'تفهم الكلمات الصغيرة اللي بتربط كلام الشات: عشان، بيقولوا، طلع، في الحقيقة.'
  ar: 'أن تفهم الكلمات الصغيرة التي تربط كلام الدردشة: لأنّ، يقولون، تبيّن، في الحقيقة.'
  en: 'Understand the little words that glue chat together: because, they say, turns out, actually.'
slides:
  - title: Tembung cilik ing chat
    body:
      ar_eg: |
        soale = عشان (لأن): Aku luwe, soale durung mangan.
        jare = بيقولوا، على حسب كلام: Jare Mas Heru… = ماس هيرو بيقول…
        jebul = طلع، اتضح إن (مفاجأة): Jebul dheweke dokter!
        pancen = فعلًا، أصلًا. malah = بالعكس، بل. sakjane = في الحقيقة.
        tok = بس (فقط)، sisan = وبالمرّة.
      ar: |
        soale = لأنّ: Aku luwe, soale durung mangan.
        jare = يقولون، حسب كلام فلان: Jare Mas Heru… = يقول ماس هيرو…
        jebul = تبيّن أنّ (مفاجأة): Jebul dheweke dokter!
        pancen = فعلًا، حقًّا. malah = بل، على العكس. sakjane = في الحقيقة.
        tok = فقط، sisan = وفي الوقت نفسه، بالمرّة.
      en: |
        soale = because: Aku luwe, soale durung mangan.
        jare = they say, according to: Jare Mas Heru… = Mas Heru says…
        jebul = it turns out (surprise): Jebul dheweke dokter!
        pancen = really, indeed. malah = instead, on the contrary. sakjane = actually.
        tok = only, just; sisan = while you're at it, as well.
    examples:
      - text: Aku luwe, soale durung mangan.
        ar_eg: أنا جعان عشان لسه ما كلتش.
        ar: أنا جائع لأنّي لم آكل بعد.
        en: I'm hungry because I haven't eaten yet.
      - text: Jebul dheweke dokter!
        ar_eg: طلع دكتور!
        ar: تبيّن أنّه طبيب!
        en: Turns out he's a doctor!
      - text: Aku ora luwe, malah ngelak.
        ar_eg: أنا مش جعان، بالعكس عطشان.
        ar: لست جائعًا، بل عطشان.
        en: I'm not hungry; thirsty, if anything.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: soale
        ar_eg: عشان
        ar: لأنّ
        en: because
      - text: pancen
        ar_eg: فعلًا
        ar: حقًّا
        en: really, indeed
      - text: malah
        ar_eg: بالعكس
        ar: بل
        en: instead, rather
      - text: jare
        ar_eg: بيقولوا
        ar: يقولون
        en: they say
    words: [soale, pancen, malah, jare]
  - id: e02
    type: match_pairs
    pairs:
      - text: tok
        ar_eg: بس
        ar: فقط
        en: only, just
      - text: jebul
        ar_eg: طلع (اتضح إن)
        ar: تبيّن أنّ
        en: it turns out
      - text: sisan
        ar_eg: وبالمرّة
        ar: بالمرّة
        en: as well, while at it
      - text: sakjane
        ar_eg: في الحقيقة
        ar: في الحقيقة
        en: actually
    words: [tok, jebul, sisan, sakjane]
  - id: e03
    type: listen
    text: Aku luwe, soale durung mangan.
    question:
      ar_eg: ليه هو جعان؟
      ar: لماذا هو جائع؟
      en: Why is he hungry?
    options: [عشان لسه ما كلش, عشان نام بدري, عشان عطشان]
    answer: 0
    meaning:
      ar_eg: أنا جعان عشان لسه ما كلتش.
      ar: أنا جائع لأنّي لم آكل بعد.
      en: I'm hungry because I haven't eaten yet.
    words: [soale]
  - id: e04
    type: fill_blank
    sentence: Aku ora luwe, ___ ngelak.
    meaning:
      ar_eg: أنا مش جعان، ___ عطشان.
      ar: لست جائعًا، ___ عطشان.
      en: I'm not hungry, ___ thirsty.
    options: [malah, jare, tok]
    answers: [malah]
    words: [malah, jare, tok]
  - id: e05
    type: multiple_choice
    question: Jebul dheweke dokter!
    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [طلع دكتور!, يمكن دكتور., بيقولوا إنه دكتور.]
    answer: 0
    explain:
      ar_eg: 'jebul = طلع، اتضح إن: فيها مفاجأة. «بيقولوا» = jare.'
      ar: jebul = تبيّن أنّ، وفيها مفاجأة. أمّا «يقولون» فـjare.
      en: jebul = it turns out, a surprise. "They say" is jare.
    words: [jebul, jare]
  - id: e06
    type: fill_blank
    sentence: ___ Mas Heru, warunge rame.
    meaning:
      ar_eg: ___ ماس هيرو، المحل زحمة.
      ar: ___ ماس هيرو، المقهى مزدحم.
      en: ___ Mas Heru, the stall is busy.
    options: [Jare, Soale, Sisan]
    answers: [Jare]
    words: [jare, soale, sisan]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «في الحقيقة أنا مكسوف» بالجاوي؟
      ar: كيف تقول «في الحقيقة أنا خجلان» بالجاوية؟
      en: '"Actually, I''m shy" in Javanese?'
    options: [Sakjane aku isin., Jebul aku isin., Malah aku isin.]
    answer: 0
    explain:
      ar_eg: sakjane = في الحقيقة. jebul = طلع، malah = بالعكس.
      ar: sakjane = في الحقيقة. أمّا jebul فتبيّن، وmalah فبل.
      en: sakjane = actually. jebul = turns out, malah = instead.
    words: [sakjane, jebul, malah]
  - id: e08
    type: build_sentence
    source:
      ar_eg: وأنا في المحل، آكل بالمرّة.
      ar: ما دمت في المقهى، آكل بالمرّة.
      en: While I'm at the stall, I'll eat as well.
    answer: Neng warung, mangan sisan.
    distractors: [tok, pancen]
    words: [sisan, tok, pancen]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kopine pancen enak, cah.
    answers_meaning:
      ar_eg: [القهوة فعلًا حلوة يا جدع, القهوة حلوة فعلًا]
      ar: [القهوة لذيذة فعلًا يا صاحبي, القهوة لذيذة حقًّا]
      en: ['The coffee really is good, mate', The coffee is really good]
    words: [pancen]
  - id: e10
    type: speaking
    text: Sakjane aku ngerti, soale aku sinau.
    meaning:
      ar_eg: في الحقيقة أنا فاهم، عشان بذاكر.
      ar: في الحقيقة أنا أفهم، لأنّي أدرس.
      en: Actually I understand, because I study.
    words: [sakjane, soale]
dialogue:
  lines:
    - speaker: Mas Heru
      text: Cah, jare Mas Yudha kowe durung mangan?
      ar_eg: يا جدع، ماس يودا بيقول إنك لسه ما كلتش؟
      ar: يا صاحبي، يقول ماس يودا إنك لم تأكل بعد؟
      en: Mate, Mas Yudha says you haven't eaten yet?
    - speaker: Mohamed
      text: Iya, Mas. Sakjane aku luwe banget.
      ar_eg: أيوه يا ماس. في الحقيقة أنا جعان أوي.
      ar: نعم يا ماس. في الحقيقة أنا جائع جدًّا.
      en: Yes, Mas. Actually I'm really hungry.
    - speaker: Mas Heru
      text: Ayo neng warung, aku ngopi sisan.
      ar_eg: يلا على المحل، وأشرب قهوة بالمرّة.
      ar: هيّا إلى المقهى، وأشرب القهوة بالمرّة.
      en: Let's go to the stall, I'll grab a coffee too.
    - speaker: Mohamed
      text: Warunge rame? Soale aku kesusu.
      ar_eg: المحل زحمة؟ عشان أنا مستعجل.
      ar: هل المقهى مزدحم؟ لأنّي مستعجل.
      en: Is the stall busy? I'm in a hurry, you see.
    - speaker: Mas Heru
      text: Ora, jebul sepi saiki. Pancen enak, cah!
      ar_eg: لأ، طلع فاضي دلوقتي. وهو فعلًا حلو يا جدع!
      ar: لا، تبيّن أنّه هادئ الآن. وهو لذيذ حقًّا يا صاحبي!
      en: No, turns out it's quiet now. It really is good, mate!
