schema: kabar.lesson/v1
id: j1.u02.l05
language: jv
title: Guru, dokter, penerjemah
can_do:
  ar_eg: 'تقول شغلتك وتوصف الناس: كبير ولا صغير، شاطر، وأصله منين.'
  ar: 'أن تذكر مهنتك وتصف الناس: كبير أم صغير، ماهر، ومن أين أصله.'
  en: 'Say what you do and describe people: old or young, clever, and where they''re really from.'
slides:
  - title: Aku penerjemah
    body:
      ar_eg: |
        guru = مدرّس، dokter = دكتور، penerjemah = مترجم: Aku penerjemah.
        pinter = شاطر. tuwa = كبير في السن، enom = صغير، شاب.
        bocah = عيل، واد (ومنها cah!): bocah Jogja = واد من يوجيا.
        asli = أصلي: Aku wong Mesir asli = أنا مصري أصلي.
      ar: |
        guru = مدرّس، dokter = طبيب، penerjemah = مترجم: Aku penerjemah.
        pinter = ماهر، ذكي. tuwa = مسنّ، enom = شابّ.
        bocah = ولد، فتى (ومنها cah!): bocah Jogja = فتى من يوجيا.
        asli = أصيل، أصلي: Aku wong Mesir asli = أنا مصري أصيل.
      en: |
        guru = teacher, dokter = doctor, penerjemah = translator: Aku penerjemah.
        pinter = clever. tuwa = old, enom = young.
        bocah = kid, lad (that's where cah! comes from): bocah Jogja = a Jogja lad.
        asli = original, born and bred: Aku wong Mesir asli = I'm Egyptian born and bred.
    examples:
      - text: Aku penerjemah saka Mesir.
        ar_eg: أنا مترجم من مصر.
        ar: أنا مترجم من مصر.
        en: I'm a translator from Egypt.
      - text: Dheweke guru basa Jawa.
        ar_eg: هو مدرّس لغة جاوية.
        ar: هو مدرّس للغة الجاوية.
        en: He's a Javanese teacher.
      - text: Mas Heru bocah Jogja asli.
        ar_eg: ماس هيرو ابن يوجيا أصلي.
        ar: ماس هيرو ابن يوجيا الأصيل.
        en: Mas Heru is a true Jogja lad.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: guru
        ar_eg: مدرّس
        ar: مدرّس
        en: teacher
      - text: dokter
        ar_eg: دكتور
        ar: طبيب
        en: doctor
      - text: penerjemah
        ar_eg: مترجم
        ar: مترجم
        en: translator
      - text: pinter
        ar_eg: شاطر
        ar: ماهر
        en: clever
    words: [guru, dokter, penerjemah, pinter]
  - id: e02
    type: match_pairs
    pairs:
      - text: tuwa
        ar_eg: كبير في السن
        ar: مسنّ
        en: old
      - text: enom
        ar_eg: شاب، صغير
        ar: شابّ
        en: young
      - text: asli
        ar_eg: أصلي
        ar: أصيل
        en: original, true
      - text: bocah
        ar_eg: واد، ابن البلد
        ar: فتى، ابن البلد
        en: kid, lad
    words: [tuwa, enom, asli, bocah]
  - id: e03
    type: listen
    text: Aku penerjemah saka Mesir.
    options: [Aku penerjemah saka Mesir., Aku guru saka Mesir., Aku dokter saka Mesir.]
    answer: 0
    meaning:
      ar_eg: أنا مترجم من مصر.
      ar: أنا مترجم من مصر.
      en: I'm a translator from Egypt.
    words: [penerjemah, guru, dokter]
  - id: e04
    type: fill_blank
    sentence: Mas Heru bocah Jogja ___.
    meaning:
      ar_eg: ماس هيرو ابن يوجيا ___.
      ar: ماس هيرو ابن يوجيا ___.
      en: Mas Heru is a ___ Jogja lad.
    options: [asli, tuwa, pinter]
    answers: [asli]
    words: [asli, tuwa, pinter, bocah]
    explain:
      ar_eg: "asli = أصلي / من البلد نفسها: bocah Jogja asli = ابن يوجيا أصلي. tuwa = كبير في السن، وpinter = شاطر."
      ar: "asli = أصيل: bocah Jogja asli = ابن يوجياكرتا الأصيل؛ أما tuwa فمسنّ، وpinter ذكي."
      en: "asli = native: bocah Jogja asli = a born-and-bred Jogja lad. tuwa = old, pinter = clever."
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: اللي بيعالج العيانين اسمه إيه؟
      ar: ما اسم من يعالج المرضى؟
      en: Who treats sick people?
    options: [guru, dokter, bakul]
    answer: 1
    explain:
      ar_eg: dokter = دكتور. guru = مدرّس، bakul = بيّاع.
      ar: dokter = طبيب. أمّا guru فمدرّس، وbakul فبائع.
      en: dokter = doctor. guru = teacher, bakul = seller.
    words: [dokter, guru]
  - id: e06
    type: fill_blank
    sentence: Wong ___ lan bocah enom.
    meaning:
      ar_eg: ناس ___ وولاد صغيرين.
      ar: كبار ___ وفتيان شبّان.
      en: ___ people and young lads.
    options: [tuwa, asli, guru]
    answers: [tuwa]
    words: [tuwa, enom, bocah, asli]
    explain:
      ar_eg: wong tuwa = ناس كبار، عكس bocah enom (شباب صغيرين). asli = أصلي، وguru = مدرس.
      ar: wong tuwa = كبار السن، في مقابل bocah enom (الشباب)؛ أما asli فأصيل، وguru معلّم.
      en: wong tuwa = old people, the opposite of bocah enom (young lads). asli = native, guru = teacher.
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «إنت شاطر يا جدع!» بالجاوي؟
      ar: كيف تقول «أنت ماهر يا صاحبي!» بالجاوية؟
      en: '"You''re clever, mate!" in Javanese?'
    options: ['Kowe pinter, cah!', 'Kowe tuwa, cah!', 'Kowe asli, cah!']
    answer: 0
    explain:
      ar_eg: pinter = شاطر. tuwa = كبير في السن، asli = أصلي.
      ar: pinter = ماهر. أمّا tuwa فمسنّ، وasli فأصيل.
      en: pinter = clever. tuwa = old, asli = original.
    words: [pinter, tuwa, asli]
  - id: e08
    type: build_sentence
    source:
      ar_eg: هو مدرّس لغة جاوية.
      ar: هو مدرّس للغة الجاوية.
      en: He's a Javanese teacher.
    answer: Dheweke guru basa Jawa.
    distractors: [dokter, enom]
    words: [guru]
    explain:
      ar_eg: guru basa Jawa = مدرس جاوي. dokter = دكتور، وenom = صغير في السن، ومش في المعنى.
      ar: guru basa Jawa = معلّم الجاوية؛ أما dokter فطبيب، وenom شاب، وليسا في المعنى.
      en: guru basa Jawa = Javanese teacher. dokter (doctor) and enom (young) aren't in the meaning.
  - id: e09
    type: translate
    direction: from_target
    source_text: Mas Yudha bocah enom saka Jogja.
    answers_meaning:
      ar_eg: [ماس يودا واد صغير من يوجيا, ماس يودا شاب من يوجيا]
      ar: [ماس يودا شابّ من يوجيا, ماس يودا فتى شابّ من يوجيا]
      en: [Mas Yudha is a young lad from Jogja, Mas Yudha is a young guy from Jogja]
    words: [bocah, enom]
  - id: e10
    type: speaking
    text: Aku penerjemah, aku sinau basa Jawa.
    meaning:
      ar_eg: أنا مترجم، وبتعلّم جاوي.
      ar: أنا مترجم، وأتعلّم الجاوية.
      en: I'm a translator, I'm learning Javanese.
    words: [penerjemah]
dialogue:
  lines:
    - speaker: Mas Yudha
      text: Mas, kowe saka ngendi? Kowe guru?
      ar_eg: يا ماس، إنت منين؟ إنت مدرّس؟
      ar: من أين أنت يا أخي؟ هل أنت مدرّس؟
      en: Where are you from, Mas? Are you a teacher?
    - speaker: Mohamed
      text: Dudu, aku penerjemah saka Mesir.
      ar_eg: لأ، أنا مترجم من مصر.
      ar: لا، أنا مترجم من مصر.
      en: No, I'm a translator from Egypt.
    - speaker: Mas Yudha
      text: Wah, pinter! Aku mahasiswa, bocah Jogja asli.
      ar_eg: واو، شاطر! أنا طالب جامعة، ابن يوجيا أصلي.
      ar: رائع، أنت ماهر! أنا طالب جامعي، ابن يوجيا الأصيل.
      en: Wow, clever! I'm a student, a true Jogja lad.
    - speaker: Mohamed
      text: Bapakmu dokter, ya?
      ar_eg: أبوك دكتور، صح؟
      ar: أبوك طبيب، أليس كذلك؟
      en: Your dad's a doctor, right?
    - speaker: Mas Yudha
      text: Iya. Bapakku tuwa, nanging isih nyambut gawe.
      ar_eg: أيوه. أبويا كبر في السن، بس لسه بيشتغل.
      ar: نعم. أبي مسنّ، لكنّه ما زال يعمل.
      en: Yes. My dad's old now, but he still works.
