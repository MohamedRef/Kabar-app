schema: kabar.lesson/v1
id: j1.u02.l05
language: jv
title: Tembung lan pitakon
can_do:
  ar_eg: 'تستعمل كلام الفصل بالجاوي: كلمة، جملة، سؤال، إجابة، مثال.'
  ar: 'أن تستخدم لغة الصفّ بالجاوية: كلمة، جملة، سؤال، جواب، مثال.'
  en: 'Use classroom Javanese: word, sentence, question, answer, example.'
slides:
  - title: Tembung, ukara, pitakon
    body:
      ar_eg: |
        tembung = كلمة، ukara = جملة، pitakon = سؤال، wangsulan = إجابة.
        conto = مثال: Conto ukara: «Aku luwe.»
        nyoba = يجرّب، krungu = يسمع، eling = فاكر (ويتقال كمان iling).
        الكلمات دي هتسمعها كتير من مذيعين راديو كبار.
      ar: |
        tembung = كلمة، ukara = جملة، pitakon = سؤال، wangsulan = جواب.
        conto = مثال: Conto ukara: «Aku luwe.»
        nyoba = يجرّب، krungu = يسمع، eling = يتذكّر (وتُنطق أيضًا iling).
        ستسمع هذه الكلمات كثيرًا من مذيعي راديو كبار.
      en: |
        tembung = word, ukara = sentence, pitakon = question, wangsulan = answer.
        conto = example: Conto ukara: "Aku luwe."
        nyoba = try, krungu = hear, eling = remember (also said iling).
        You'll hear these a lot from the Kabar Radio hosts.
    examples:
      - text: Pitakone apa, Mas?
        ar_eg: السؤال إيه يا ماس؟
        ar: ما السؤال يا أخي؟
        en: What's the question, Mas?
      - text: Aku krungu ukara Jawa.
        ar_eg: سمعت جملة جاوي.
        ar: سمعت جملة جاوية.
        en: I heard a Javanese sentence.
      - text: Aku eling jenengmu, Mbak.
        ar_eg: أنا فاكر اسمك يا أبلة.
        ar: أتذكّر اسمك يا أختي.
        en: I remember your name, Mbak.
exercises:
