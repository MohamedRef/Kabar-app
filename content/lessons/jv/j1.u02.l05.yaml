        ar_eg: جملة
        ar: جملة
        en: sentence
      - text: pitakon
        ar_eg: سؤال
        ar: سؤال
        en: question
      - text: wangsulan
        ar_eg: إجابة
        ar: جواب
        en: answer
    words: [tembung, ukara, pitakon, wangsulan]
  - id: e02
    type: match_pairs
    pairs:
      - text: conto
        ar_eg: مثال
        ar: مثال
        en: example
      - text: nyoba
        ar_eg: يجرّب
        ar: يجرّب
        en: try
      - text: krungu
        ar_eg: يسمع
        ar: يسمع
        en: hear
      - text: eling
        ar_eg: فاكر
        ar: يتذكّر
        en: remember
    words: [conto, nyoba, krungu, eling]
  - id: e03
    type: listen
    text: Pitakone apa, Mas?
    options: ['Pitakone apa, Mas?', 'Wangsulane apa, Mas?', 'Tembunge apa, Mas?']
    answer: 0
    meaning:
      ar_eg: السؤال إيه يا ماس؟
      ar: ما السؤال يا أخي؟
      en: What's the question, Mas?
    words: [pitakon, wangsulan, tembung]
  - id: e04
    type: fill_blank
    sentence: 'Pitakon: «Piye kabare?» ___: «Apik.»'
    meaning:
      ar_eg: 'السؤال: «أخبارك إيه؟» ___: «كويس.»'
      ar: 'السؤال: «كيف حالك؟» ___: «بخير.»'
      en: 'Question: "How are you?" ___: "Good."'
    options: [Wangsulan, Tembung, Conto]
    answers: [Wangsulan]
    words: [wangsulan, tembung, conto, pitakon]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: «أنا فاكر اسمك» بالجاوي؟
      ar: كيف تقول «أتذكّر اسمك» بالجاوية؟
      en: '"I remember your name" in Javanese?'
    options: [Aku eling jenengmu., Aku krungu jenengmu., Aku nyoba jenengmu.]
    answer: 0
    explain:
      ar_eg: eling = فاكر. krungu = سمع، nyoba = جرّب.
      ar: eling = يتذكّر. أمّا krungu فيسمع، وnyoba فيجرّب.
      en: eling = remember. krungu = hear, nyoba = try.
    words: [eling, krungu, nyoba]
  - id: e06
    type: fill_blank
    sentence: Aku ___ basa Jawa, Cak. Apik?
    meaning:
      ar_eg: أنا ___ الجاوي يا تشاك. كويس؟
      ar: أنا ___ الجاوية يا تشاك. هل هي جيّدة؟
      en: I'm ___ Javanese, Cak. Is it good?
    options: [nyoba, krungu, eling]
    answers: [nyoba]
    words: [nyoba, krungu, eling]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «جملة» بالجاوي؟
      ar: ما معنى «جملة» بالجاوية؟
      en: '"Sentence" in Javanese?'
    options: [tembung, ukara, pitakon]
    answer: 1
    explain:
      ar_eg: ukara = جملة. tembung = كلمة، pitakon = سؤال.
      ar: ukara = جملة. أمّا tembung فكلمة، وpitakon فسؤال.
      en: ukara = sentence. tembung = word, pitakon = question.
    words: [ukara, tembung, pitakon]
  - id: e08
    type: build_sentence
    source:
      ar_eg: سمعت جملة جاوي يا ماس.
      ar: سمعت جملة جاوية يا أخي.
      en: I heard a Javanese sentence, Mas.
    answer: Aku krungu ukara Jawa, Mas.
    distractors: [eling, tembung]
    words: [krungu, ukara]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kowe eling tembung «luwe»?
    answers_meaning:
      ar_eg: [إنت فاكر كلمة «luwe»؟, فاكر كلمة luwe؟]
      ar: [هل تتذكّر كلمة «luwe»؟, أتتذكّر كلمة luwe؟]
      en: ['Do you remember the word "luwe"?', 'Do you remember the word luwe?']
    words: [eling, tembung]
  - id: e10
    type: speaking
    text: 'Conto ukara: Aku luwe banget.'
    meaning:
      ar_eg: 'مثال جملة: أنا جعان أوي.'
      ar: 'مثال على جملة: أنا جائع جدًّا.'
      en: 'Example sentence: I''m really hungry.'
    words: [conto, ukara]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, aku duwe pitakon. Tembung «isin» apa?
      ar_eg: يا محمد، عندي سؤال. كلمة «isin» يعني إيه؟
      ar: محمد، لديّ سؤال. ما معنى كلمة «isin»؟
      en: Mohamed, I've got a question. What does "isin" mean?
    - speaker: Mohamed
      text: Sedhela... aku eling! Isin iku malu.
      ar_eg: لحظة... افتكرت! isin يعني malu.
      ar: لحظة... تذكّرت! isin تعني malu.
      en: Wait... I remember! Isin means malu.
    - speaker: Mas Dimas
      text: Wangsulanmu bener. Saiki conto ukara?
      ar_eg: إجابتك صح. طب مثال جملة؟
      ar: جوابك صحيح. والآن مثال جملة؟
      en: Your answer's right. Now an example sentence?
    - speaker: Mohamed
      text: 'Aku nyoba: «Aku isin ngomong Jawa.»'
      ar_eg: 'هجرّب: «أنا مكسوف أتكلم جاوي.»'
      ar: 'سأجرّب: «أخجل من التكلّم بالجاوية.»'
      en: 'Let me try: "I''m shy to speak Javanese."'
    - speaker: Mas Dimas
      text: Apik! Aku krungu ukaramu jelas.
      ar_eg: حلو! سامع جملتك واضحة.
      ar: ممتاز! أسمع جملتك بوضوح.
      en: Great! I heard your sentence clearly.
