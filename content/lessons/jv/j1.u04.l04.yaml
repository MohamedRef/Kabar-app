      en: What's the problem?
    options: [الحاجة بايظة يا ماس, العنوان غلط يا ماس, الطرد وصل يا ماس]
    answer: 0
    meaning:
      ar_eg: الحاجة بايظة يا ماس.
      ar: البضاعة تالفة يا أخي.
      en: The goods are broken, Mas.
    words: [barang, rusak, alamat, paket]
  - id: e04
    type: fill_blank
    sentence: Paketku kok durung tekan? ___!
    meaning:
      ar_eg: الطرد بتاعي ليه لسه ما وصلش؟ ___!
      ar: لماذا لم يصل طردي بعد؟ ___!
      en: Why hasn't my parcel arrived? ___!
    options: [Kesuwen, Rusak, Ganti]
    answers: [Kesuwen]
    words: [kesuwen, paket, rusak, ganti]
  - id: e05
    type: multiple_choice
    question: Alamate ngendi, Mas?
    question_meaning:
      ar_eg: بيسأل عن إيه؟
      ar: عمّ يسأل؟
      en: What is he asking for?
    options: [العنوان, الوقت, السعر]
    answer: 0
    explain:
      ar_eg: alamat = عنوان. الوقت = wektu، السعر = rega.
      ar: alamat = عنوان. أمّا الوقت فـwektu، والسعر فـrega.
      en: alamat = address. Time is wektu, price is rega.
    words: [alamat]
  - id: e06
    type: fill_blank
    sentence: Barange rusak? Tak ___, ya.
    meaning:
      ar_eg: الحاجة بايظة؟ ___ لك.
      ar: البضاعة تالفة؟ سأ___ ها لك.
      en: The goods are broken? I'll ___ them.
    options: [ganti, bali, wektu]
    answers: [ganti]
    words: [ganti, bali, wektu, barang]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: «مفيش وقت» بالجاوي؟
      ar: كيف تقول «لا يوجد وقت» بالجاوية؟
      en: '"There''s no time" in Javanese?'
    options: [Ora ana barang., Ora ana wektu., Ora ana alamat.]
    answer: 1
    explain:
      ar_eg: wektu = وقت. barang = حاجة، alamat = عنوان.
      ar: wektu = وقت. أمّا barang فبضاعة، وalamat فعنوان.
      en: wektu = time. barang = goods, alamat = address.
    words: [wektu, barang, alamat]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا راجع البيت.
      ar: أنا عائد إلى البيت.
      en: I'm going back home.
    answer: Aku bali neng omah.
    distractors: [ganti, paket]
    words: [bali]
  - id: e09
    type: translate
    direction: from_target
    source_text: Paket kurma saka Mesir wis tekan.
    answers_meaning:
      ar_eg: [طرد البلح من مصر وصل, وصل طرد البلح اللي من مصر]
      ar: [وصل طرد التمر من مصر, طرد التمر من مصر قد وصل]
      en: [The parcel of dates from Egypt has arrived, The date parcel from Egypt arrived]
    words: [paket]
  - id: e10
    type: speaking
    text: Kok kesuwen? Aku bali wae.
    meaning:
      ar_eg: إيه التأخير ده؟ أنا راجع وخلاص.
      ar: لماذا كلّ هذا التأخير؟ سأعود إذن.
      en: Why so long? I'll just go back.
    words: [kesuwen, bali]
dialogue:
  lines:
    - speaker: Petugas
      text: Sugeng siang, Mas. Paket saka ngendi?
      ar_eg: مساء الخير يا ماس. الطرد جاي منين؟
      ar: طاب يومك يا أخي. من أين الطرد؟
      en: Good afternoon, Mas. Where's the parcel from?
    - speaker: Mohamed
      text: Saka Mesir, isine kurma. Kok kesuwen, Mas?
      ar_eg: من مصر، وفيه بلح. ليه اتأخر كده يا ماس؟
      ar: من مصر، وفيه تمر. لماذا تأخّر هكذا يا أخي؟
      en: From Egypt, it's dates. Why has it taken so long, Mas?
    - speaker: Petugas
      text: Ngapura. Alamate kliru, saiki wis tekan.
      ar_eg: معلش. العنوان كان غلط، ودلوقتي وصل.
      ar: عذرًا. كان العنوان خاطئًا، والآن وصل.
      en: Sorry. The address was wrong, but it's here now.
    - speaker: Mohamed
      text: Lho, kotake rusak! Barange isih apik?
      ar_eg: إيه ده، الكرتونة بايظة! الحاجة لسه سليمة؟
      ar: ما هذا، الصندوق تالف! هل البضاعة سليمة؟
      en: Hey, the box is broken! Are the goods still OK?
    - speaker: Petugas
      text: Isih apik, Mas. Kotake tak ganti.
      ar_eg: لسه سليمة يا ماس. هبدّلك الكرتونة.
      ar: ما زالت سليمة يا أخي. سأستبدل الصندوق.
      en: Still fine, Mas. I'll replace the box.
    - speaker: Mohamed
      text: Matur nuwun. Aku bali neng omah saiki.
      ar_eg: شكرًا. أنا راجع البيت دلوقتي.
      ar: شكرًا. أعود إلى البيت الآن.
      en: Thanks. I'm heading home now.
