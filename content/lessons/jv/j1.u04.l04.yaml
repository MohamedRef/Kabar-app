schema: kabar.lesson/v1
id: j1.u04.l04
language: jv
title: Paket kurma
can_do:
  ar_eg: 'تتابع طرد: العنوان، الحاجة اللي وصلت بايظة، وإنها اتأخرت أوي.'
  ar: 'أن تتابع طردًا: العنوان، والبضاعة التي وصلت تالفة، والتأخّر الطويل.'
  en: 'Follow up a parcel: the address, goods that arrived broken, and a delivery that''s taking too long.'
slides:
  - title: Paketku endi?
    body:
      ar_eg: |
        paket = طرد، barang = حاجة، بضاعة، alamat = عنوان.
        rusak = بايظ: Barange rusak = الحاجة بايظة.
        ganti = يغيّر، يبدّل: Tak ganti = هبدّلهولك.
        bali = يرجع: Aku bali neng omah = راجع البيت.
        wektu = وقت. kesuwen = أخد وقت كتير أوي: Kok kesuwen? = إيه التأخير ده؟
      ar: |
        paket = طرد، barang = شيء، بضاعة، alamat = عنوان.
        rusak = تالف: Barange rusak = البضاعة تالفة.
        ganti = يغيّر، يستبدل: Tak ganti = سأستبدله لك.
        bali = يرجع: Aku bali neng omah = أعود إلى البيت.
        wektu = وقت. kesuwen = استغرق وقتًا طويلًا جدًّا: Kok kesuwen? = لماذا كلّ هذا التأخير؟
      en: |
        paket = parcel, barang = thing, goods, alamat = address.
        rusak = broken: Barange rusak = The goods are broken.
        ganti = change, replace: Tak ganti = I'll replace it.
        bali = go back: Aku bali neng omah = I'm going back home.
        wektu = time. kesuwen = taking too long: Kok kesuwen? = Why so long?
    examples:
      - text: Barange rusak, Mas.
        ar_eg: الحاجة بايظة يا ماس.
        ar: البضاعة تالفة يا أخي.
        en: The goods are broken, Mas.
      - text: Alamate ngendi, Mas?
        ar_eg: العنوان فين يا ماس؟
        ar: أين العنوان يا ماس؟
        en: What's the address, Mas?
      - text: Paketku kok durung tekan? Kesuwen!
        ar_eg: الطرد بتاعي ليه لسه ما وصلش؟ اتأخر أوي!
        ar: لماذا لم يصل طردي بعد؟ تأخّر كثيرًا!
        en: Why hasn't my parcel arrived? It's taking forever!
