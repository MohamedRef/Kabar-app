    en: ten (sepuluh), krama
  - word: dasa
    pos: number
    ar_eg: "عشرات (puluh)، كراما: kalih dasa = ٢٠"
    ar: "عشرات (puluh)، كراما: kalih dasa = ٢٠"
    en: tens (puluh), krama — kalih dasa = 20
  - word: selangkung
    pos: number
    ar_eg: خمسة وعشرين (selawé)، كراما
    ar: خمسة وعشرون (selawé)، كراما
    en: twenty-five (ngoko selawé), krama
  - word: tumbas
    pos: verb
    ar_eg: يشتري (tuku ← beli)، كراما
    ar: يشتري (tuku ← beli)، كراما
    en: to buy (ngoko tuku, Indonesian beli), krama
  - word: kangge
    pos: preposition
    ar_eg: عشان / لـ (kanggo ← untuk)، كراما
    ar: لِـ (kanggo ← untuk)، كراما
    en: for (ngoko kanggo, Indonesian untuk), krama
  - word: mangga
    pos: interjection
    ar_eg: اتفضل (silakan)، كراما؛ في الشات monggo
    ar: تفضّل (silakan)، كراما؛ وفي الدردشة monggo
    en: please, go ahead (silakan), krama; chat spelling monggo
