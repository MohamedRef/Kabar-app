    options: ["sekawan dasa", "tigang dasa", "kalih dasa"]
    answer: 1
    explain:
      ar_eg: tigang dasa = ٣٠. kalih dasa = ٢٠، sekawan dasa = ٤٠.
      ar: tigang dasa = ٣٠، وkalih dasa = ٢٠، وsekawan dasa = ٤٠.
      en: tigang dasa = 30; kalih dasa = 20, sekawan dasa = 40.
