schema: kabar.lesson/v1
id: j3.u05.l01
language: jv
title: Setunggal, kalih, tiga
can_do:
  ar_eg: تعد من واحد لتسعة بالكراما وتشتري بأدب.
  ar: أن تعدّ من واحد إلى تسعة بالكراما وتشتري بأدب.
  en: Count from one to nine in krama and buy politely.
slides:
  - title: Setunggal, kalih, tiga
    body:
      ar_eg: |
        أهلًا بيك في Pasar Beringharjo، السوق الكبير في يوجيا والمشهور بالباتيك! البياعين الكبار هنا بيفرحوا جدًا بأي كلمة كراما — حتى الأرقام.
        بعض الأرقام ليها نسخة كراما (نغوكو → كراما = إندونيسي):
        - siji → **setunggal** = satu
        - loro → **kalih** = dua
        - telu → **tiga** = tiga (زي الإندونيسي بالظبط!)
        - papat → **sekawan** = empat
        - lima → **gangsal** = lima
        - sepuluh → **sedasa** = sepuluh
      ar: |
        مرحبًا بك في Pasar Beringharjo، السوق الكبير في يوجيا والمشهور بالباتيك! والبائعون الكبار هنا يسعدون بأي كلمة كراما، حتى الأعداد.
        لبعض الأعداد صور كراما (نغوكو → كراما = إندونيسي):
        - siji → **setunggal** = satu
        - loro → **kalih** = dua
        - telu → **tiga** = tiga (كالإندونيسية تمامًا!)
        - papat → **sekawan** = empat
        - lima → **gangsal** = lima
        - sepuluh → **sedasa** = sepuluh
      en: |
        Welcome to Pasar Beringharjo, Jogja's great market, famous for its batik! Older sellers here love any krama word — numbers included.
        Some numbers have krama forms (ngoko → krama = Indonesian):
        - siji → **setunggal** = satu
        - loro → **kalih** = dua
        - telu → **tiga** = tiga (exactly like Indonesian!)
        - papat → **sekawan** = empat
        - lima → **gangsal** = lima
        - sepuluh → **sedasa** = sepuluh
    grammar: jv.krama.numbers
    examples:
      - text: Setunggal kemawon, Bu.
        ar_eg: واحدة بس يا حاجة.
        ar: واحدة فقط يا سيدتي.
        en: Just one, ma'am.
      - text: Kula tumbas kalih, nggih.
        ar_eg: هاخد اتنين بقى.
        ar: سأشتري اثنين إذن.
        en: I'll buy two, then.
  - title: Enem, pitu, wolu, sanga
    body:
      ar_eg: |
        الأرقام من ٦ لـ ٩ **هي هي** في النغوكو والكراما: enem، pitu، wolu، sanga. (في النغوكو enem ساعات بتتقال nem.)
        يعني من ١ لـ ١٠ محتاج تحفظ ٦ كلمات جديدة بس: setunggal، kalih، tiga، sekawan، gangsal، sedasa.
        وtiga أسهل واحدة عليك لأنها نفس الإندونيسي.
      ar: |
        الأعداد من ٦ إلى ٩ **واحدة** في النغوكو والكراما: enem، pitu، wolu، sanga (وقد تُقال enem في النغوكو nem).
        فلا تحتاج من ١ إلى ١٠ إلا ست كلمات جديدة: setunggal، kalih، tiga، sekawan، gangsal، sedasa، وأيسرها tiga لأنها كالإندونيسية.
      en: |
        6 to 9 are **the same** in ngoko and krama: enem, pitu, wolu, sanga (ngoko sometimes shortens enem to nem).
        So from 1 to 10 you only need six new words: setunggal, kalih, tiga, sekawan, gangsal, sedasa.
        And tiga is free — it's the Indonesian word.
    grammar: jv.krama.numbers
    examples:
      - text: setunggal, kalih, tiga, sekawan, gangsal, enem, pitu, wolu, sanga, sedasa
        ar_eg: ١، ٢، ٣، ٤، ٥، ٦، ٧، ٨، ٩، ١٠ (بالكراما)
        ar: ١، ٢، ٣، ٤، ٥، ٦، ٧، ٨، ٩، ١٠ (بالكراما)
        en: 1–10 in krama
  - title: Krama sak ukara
    body:
      ar_eg: |
        لو بتتكلم كراما، الرقم كمان يبقى كراما. ماتقولش «Kula tumbas loro» — قول **Kula tumbas kalih**.
        tumbas = tuku (يشتري، beli) بالكراما، وkemawon = wae (بس).
        والبياعة هتسألك: Badhe tumbas pinten, Mas? = عايز تشتري كام؟
        في السوق: «Pados napa, Mas?» = بتدوّر على إيه؟ «Pinten, Bu?» = بكام؟ والأسعار من غير ewu: seket = خمسين ألف. «Kirang nggih?» = نزّلي شوية؟ susuk = الباقي. «Nggih pun» (pun = sampun) = خلاص، ماشي. والبياعة بتكلمك كراما بسيطة، مش krama inggil.
      ar: |
        إذا تكلمت بالكراما فليكن العدد كراما أيضًا، فلا تقل «Kula tumbas loro» بل **Kula tumbas kalih**.
        tumbas = tuku (يشتري، beli) بالكراما، وkemawon = wae (فقط).
        وستسألك البائعة: Badhe tumbas pinten, Mas? = كم تريد أن تشتري؟
        في السوق: «Pados napa, Mas?» = عمّ تبحث؟ «Pinten, Bu?» = بكم؟ وتُذكر الأسعار بلا ewu: seket = خمسون ألفًا. «Kirang nggih?» = تخفّضين قليلًا؟ susuk = الباقي. «Nggih pun» (pun = sampun) = حسنًا إذن. وتكلّمك البائعة بكراما بسيطة لا بالـ krama inggil.
      en: |
        In a krama sentence the number goes krama too. Not "Kula tumbas loro" — say **Kula tumbas kalih**.
        tumbas = tuku (buy, beli) in krama; kemawon = wae (just).
        The seller will ask: Badhe tumbas pinten, Mas? = How many would you like?
        At the market: «Pados napa, Mas?» = what are you looking for? «Pinten, Bu?» = how much? Prices drop the ewu: seket = fifty thousand. «Kirang nggih?» = a bit less? susuk = change. «Nggih pun» (pun = sampun) = alright then. Sellers use simple krama with you, not krama inggil.
    grammar: jv.krama.numbers
    examples:
      - text: Badhe tumbas pinten, Mas? — Sekawan, Bu.
        ar_eg: عايز كام يا أستاذ؟ — أربعة يا حاجة.
        ar: كم تريد أن تشتري؟ — أربعة يا سيدتي.
        en: How many would you like? — Four, ma'am.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي رقم هو هو في النغوكو والكراما؟
      ar: أي عدد واحد في النغوكو والكراما؟
      en: Which number is the same in ngoko and krama?
    options: [setunggal, wolu, gangsal, sekawan]
    answer: 1
    explain:
      ar_eg: من ٦ لـ ٩ (enem، pitu، wolu، sanga) زي ما هم. setunggal وgangsal كراما بس.
      ar: الأعداد من ٦ إلى ٩ واحدة في المستويين، أما setunggal وgangsal فكراما فقط.
      en: 6–9 (enem, pitu, wolu, sanga) don't change. setunggal and gangsal are krama only.
    words: [wolu, setunggal, gangsal, sekawan]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: إيه الكراما من papat (٤)؟
      ar: ما صورة الكراما من papat (٤)؟
      en: What is krama for papat (4)?
    options: [sekawan, kalih, gangsal, tiga]
    answer: 0
    words: [sekawan, kalih, gangsal, tiga]
  - id: e03
    type: listen
    text: gangsal
    options: [gangsal, tiga, setunggal]
    answer: 0
    words: [gangsal, tiga, setunggal]
  - id: e04
    type: fill_blank
    sentence: Kula tumbas ___, Bu. (٢)
    meaning:
      ar_eg: هاخد اتنين يا حاجة.
      ar: سأشتري اثنين يا سيدتي.
      en: I'll buy two, ma'am.
    options: [rong, kalih, loro]
    answers: [kalih]
    explain:
      ar_eg: 'الجملة كراما (Kula tumbas)، فالرقم كمان كراما: kalih مش loro.'
      ar: 'الجملة كراما، فالعدد كراما أيضًا: kalih لا loro.'
      en: 'The sentence is krama (Kula tumbas), so the number is too: kalih, not loro.'
    words: [kalih, tumbas]
  - id: e05
    type: build_sentence
    source:
      ar_eg: هاخد تلاتة لدِيماس.
      ar: سأشتري ثلاثة لديماس.
      en: I'll buy three for Mas Dimas.
    answer: Kula tumbas tiga kangge Mas Dimas.
    distractors: [telu, kanggo]
    words: [tumbas, tiga, kangge]
  - id: e06
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (بالكراما) واحدة بس، عشان أبويا.
      ar: (بالكراما) واحدة فقط، لأبي.
      en: (in krama) Just one, for my father.
    answers: ['Setunggal kemawon, kangge bapak kula.', 'Setunggal kemawon, kangge bapak kula', Setunggal kemawon kangge bapak kula., Setunggal kemawon kangge bapak kula, 'Setunggal mawon, kangge bapak kula.', 'Setunggal mawon, kangge bapak kula', Setunggal mawon kangge bapak kula., Setunggal mawon kangge bapak kula]
    words: [setunggal, kemawon, kangge]
  - id: e07
    type: translate
    direction: from_target
    source_text: Kula tumbas kalih, nggih.
    answers_meaning:
      ar_eg: [هاخد اتنين بقى., هشتري اتنين., هاخد اتنين., هشتري اتنين بقى.]
      ar: [سأشتري اثنين إذن., سأشتري اثنين., أشتري اثنين.]
      en: ['I''ll buy two, then.', I'll buy two., I'll take two., 'I''ll take two, then.']
    words: [tumbas, kalih]
  - id: e08
    type: dictation
    text: Sekawan kemawon, kangge kula.
    meaning:
      ar_eg: أربعة بس، عشاني.
      ar: أربعة فقط، لي.
      en: Just four, for me.
    words: [sekawan, kemawon, kangge]
dialogue:
  title: Wonten Pasar Beringharjo
  lines:
    - speaker: Bu Siti
      text: "Mangga, Mas. Pados napa?"
      ar_eg: "اتفضل يا أستاذ. بتدوّر على إيه؟"
      ar: "تفضّل. عمّ تبحث؟"
      en: "Come on in. What are you looking for?"
    - speaker: Mohamed
      text: Kula badhe tumbas batik, Bu.
      ar_eg: عايز أشتري باتيك يا حاجة.
      ar: أريد أن أشتري باتيكًا يا سيدتي.
      en: I'd like to buy some batik, ma'am.
    - speaker: Bu Siti
      text: "Pinten, Mas?"
      ar_eg: "كام واحدة يا أستاذ؟"
      ar: "كم واحدة؟"
      en: "How many?"
    - speaker: Mohamed
      text: Kalih, Bu. Setunggal kangge kula, setunggal kangge bapak kula.
      ar_eg: اتنين يا حاجة. واحد ليا وواحد لبابا.
      ar: اثنين يا سيدتي. واحد لي وواحد لأبي.
      en: Two, ma'am. One for me, one for my father.
    - speaker: Bu Siti
      text: "Nggih, Mas. Kalih nggih."
      ar_eg: "ماشي يا أستاذ. اتنين بقى."
      ar: "حسنًا. اثنتان إذن."
      en: "Right. Two, then."
new_words:
  - word: setunggal
    pos: number
    ar_eg: واحد (siji ← satu)، كراما
    ar: واحد (siji ← satu)، كراما
    en: one (ngoko siji, Indonesian satu), krama
  - word: tiga
    pos: number
    ar_eg: تلاتة (telu)، كراما، زي الإندونيسي؛ قبل dasa / atus / ewu بتبقى tigang
    ar: ثلاثة (telu)، كراما كالإندونيسية؛ وقبل dasa / atus / ewu تصير tigang
    en: three (ngoko telu), krama — same as Indonesian; tigang before dasa / atus / ewu
  - word: sekawan
    pos: number
    ar_eg: أربعة (papat ← empat)، كراما
    ar: أربعة (papat ← empat)، كراما
    en: four (ngoko papat, Indonesian empat), krama
