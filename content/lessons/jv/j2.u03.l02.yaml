schema: kabar.lesson/v1
id: j2.u03.l02
language: jv
title: Seket, sewidak, satus
can_do:
  ar_eg: تعد لحد ١٠٠ وتتكلم عن الكميات.
  ar: أن تعدّ حتى ١٠٠ وتتحدث عن الكميات.
  en: Count up to 100 and talk about amounts.
slides:
  - title: Seket, sewidak, satus
    body:
      ar_eg: |
        العشرات بأشكال الوصل اللي تعرفها من J1 + puluh، إلا اتنين ليهم كلمات خاصة:
        - 30 telung puluh · 40 patang puluh
        - 50 seket ← خاصة
        - 60 sewidak ← خاصة
        - 70 pitung puluh · 80 wolung puluh · 90 sangang puluh · 100 satus
        وبعدين الآحاد زي الإندونيسي: telung puluh siji = 31، seket lima = 55، sewidak loro = 62.
      ar: |
        العشرات بصيغ الوصل المعروفة من J1 مع puluh، إلا عددين لهما لفظان خاصان:
        - 30 telung puluh · 40 patang puluh
        - 50 seket ← خاص
        - 60 sewidak ← خاص
        - 70 pitung puluh · 80 wolung puluh · 90 sangang puluh · 100 satus
        ثم الآحاد كالإندونيسية: telung puluh siji = 31، seket lima = 55، sewidak loro = 62.
      en: |
        Tens use the J1 linking forms + puluh, except two special words:
        - 30 telung puluh · 40 patang puluh
        - 50 seket ← special
        - 60 sewidak ← special
        - 70 pitung puluh · 80 wolung puluh · 90 sangang puluh · 100 satus
        Then add units as in Indonesian: telung puluh siji = 31, seket lima = 55, sewidak loro = 62.
    grammar: jv.number.full
    examples:
      - text: Karunge ana seket.
        ar_eg: فيه خمسين شوال.
        ar: هناك خمسون كيسًا.
        en: There are fifty sacks.
      - text: Umure Pak Budi seket lima taun.
        ar_eg: باك بودي عنده خمسة وخمسين سنة.
        ar: عمر باك بودي خمسة وخمسون عامًا.
        en: Pak Budi is 55 years old.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: sewelas
        ar_eg: حداشر (11)
        ar: أحد عشر (11)
        en: eleven (11)
      - text: rolas
        ar_eg: اتناشر (12)
        ar: اثنا عشر (12)
        en: twelve (12)
      - text: selikur
        ar_eg: واحد وعشرين (21)
        ar: واحد وعشرون (21)
        en: twenty-one (21)
      - text: selawe
        ar_eg: خمسة وعشرين (25)
        ar: خمسة وعشرون (25)
        en: twenty-five (25)
      - text: seket
        ar_eg: خمسين (50)
        ar: خمسون (50)
        en: fifty (50)
    words: [sewelas, rolas, selikur, selawe, seket]
  - id: e02
    type: multiple_choice
    question: 60 = ?
    question_meaning:
      ar_eg: إزاي تقول ٦٠؟
      ar: كيف تقول ٦٠؟
      en: How do you say 60?
    options: [nemlikur, sewidak, nembelas]
    answer: 1
    explain:
      ar_eg: 'nembelas = 16، nemlikur = 26، و60 ليها كلمة خاصة: sewidak.'
      ar: 'nembelas = 16، وnemlikur = 26، وللستين لفظ خاص: sewidak.'
      en: nembelas = 16, nemlikur = 26; 60 has its own word, sewidak.
    words: [sewidak]
  - id: e03
    type: listen
    text: seket lima
    options: [selawe, limalas, seket lima]
    answer: 2
    words: [seket]
  - id: e04
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: واحد وتلاتين (٣١)
      ar: واحد وثلاثون (٣١)
      en: thirty-one (31)
    answers: [telung puluh siji, Telung puluh siji]
    words: [telung puluh, siji]
  - id: e05
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: باك بودي عنده خمسين سنة.
      ar: عمر باك بودي خمسون عامًا.
      en: Pak Budi is 50 years old.
    answers: ["Umure Pak Budi seket taun.", Umure Pak Budi seket taun, "Pak Budi umure seket taun.", Pak Budi umure seket taun]
    words: [umur, seket, taun]
  - id: e06
    type: speaking
    text: Seket, sewidak, pitung puluh.
    meaning:
      ar_eg: خمسين، ستين، سبعين.
      ar: خمسون، ستون، سبعون.
      en: Fifty, sixty, seventy.
    words: [seket, sewidak, pitung puluh]
dialogue:
  title: Karung bawang neng Nganjuk
  lines:
    - speaker: Bu Siti
      text: Le, karunge ana pira?
      ar_eg: يا ابني، فيه كام شوال؟
      ar: يا بني، كم كيسًا هناك؟
      en: Son, how many sacks are there?
    - speaker: Bagus
      text: Sewelas, rolas, telulas … Ana selawe, Bu.
      ar_eg: حداشر، اتناشر، تلاتاشر … فيه خمسة وعشرين يا ماما.
      ar: أحد عشر، اثنا عشر، ثلاثة عشر … هناك خمسة وعشرون يا أمي.
      en: Eleven, twelve, thirteen … There are twenty-five, Mum.
    - speaker: Mohamed
      text: Selawe karung bawang? Akeh tenan!
      ar_eg: خمسة وعشرين شوال بصل؟ كتير بجد!
      ar: خمسة وعشرون كيس بصل؟ هذا كثير حقًا!
      en: Twenty-five sacks of onions? That's a lot!
    - speaker: Bu Siti
      text: Iki durung kabeh, Mas. Kabeh ana seket.
      ar_eg: ولسه مش الكل يا أستاذ. الكل خمسين.
      ar: ولم تكتمل بعد يا أخي، فالمجموع خمسون.
      en: That's not all yet, Mas. Altogether there are fifty.
    - speaker: Mohamed
      text: Seket! Nganjuk pancen kutha bawang.
      ar_eg: خمسين! نغانجوك فعلًا مدينة البصل.
      ar: خمسون! نغانجوك حقًّا مدينة البصل.
      en: Fifty! Nganjuk really is the onion town.
