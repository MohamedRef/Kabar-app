    ar: ستون (60)
    en: sixty
  - word: akeh
    pos: adjective
    ar_eg: كتير
    ar: كثير
    en: many, a lot (banyak)
  - word: karung
    pos: noun
    ar_eg: شوال
    ar: كيس كبير
    en: sack (karung)
  - word: kutha
    pos: noun
    ar_eg: مدينة
    ar: مدينة
    en: town, city (kota)
