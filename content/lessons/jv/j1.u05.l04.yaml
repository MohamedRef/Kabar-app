    text: Iwak bakar karo banyu putih.
    question:
      ar_eg: طالب إيه؟
      ar: ماذا يطلب؟
      en: What is he ordering?
    options: [سمك مشوي وميه, درة وجوز هند, شاي وسكر]
    answer: 0
    meaning:
      ar_eg: سمك مشوي وميه سادة.
      ar: سمك مشوي وماء عادي.
      en: Grilled fish and plain water.
    words: [iwak, banyu]
  - id: e04
    type: fill_blank
    sentence: Panase marakake ___ banget!
    meaning:
      ar_eg: الحر بيخلّي الجو كتمة أوي!
      ar: الحرّ يجعل الجو خانقًا جدًا!
      en: The heat makes it so muggy!
    options: [sumuk, adem, banyu]
    answers: [sumuk]
    words: [sumuk, marakake, adem, banyu]
  - id: e05
    type: multiple_choice
    question: Panas je!
    question_meaning:
      ar_eg: صاحبك من يوجيا قال كده. يقصد إيه؟
      ar: قالها صديقك من يوجيا. ماذا يقصد؟
      en: Your Jogja friend says this. What does he mean?
    options: [حر أوي والله!, فين الميه؟, يلا نروّح!]
    answer: 0
    explain:
      ar_eg: je في آخر الجملة بتأكّد الكلام زي «والله» — كلام شارع يوجيا.
      ar: je آخر الجملة للتوكيد كـ«حقًا»، من كلام شارع يوجيا.
      en: 'je at the end stresses the point, like "honestly": Jogja street speech.'
    words: [je, panas]
  - id: e06
    type: fill_blank
    sentence: Panase ___ ngelak.
    meaning:
      ar_eg: الحر بيعطّش.
      ar: الحر يُعطش.
      en: The heat makes you thirsty.
    options: [marakake, adem, og]
    answers: [marakake]
    words: [marakake, panas, og]
  - id: e07
    type: build_sentence
    source:
      ar_eg: الميه ساقعة أوي.
      ar: الماء بارد جدًا.
      en: The water is really cool.
    answer: Banyune adem banget.
    distractors: [iwak, panas]
    words: [banyu, adem]
  - id: e08
    type: translate
    direction: from_target
    source_text: Aku ora ngerti og, iwake panas banget.
    answers_meaning:
      ar_eg: [ماكنتش أعرف أصلًا، السمك سخن أوي, معرفتش والله، السمكة سخنة جدًا]
      ar: [لم أكن أعرف حقًا، السمك ساخن جدًا, ما كنت أعلم، فالسمكة حارّة جدًا]
      en: ['I really didn''t know, the fish is very hot', 'Honestly, I had no idea the fish was so hot']
    words: [og, iwak, panas]
  - id: e09
    type: speaking
    text: Sumuk banget, Mas! Banyu putih wae.
    meaning:
      ar_eg: حر وكتمة أوي يا كابتن! ميه سادة بس.
      ar: حرّ خانق يا أخي! ماء عادي فقط.
      en: So muggy! Just plain water, please.
    words: [sumuk, banyu]
  - id: e10
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها je أو og بتاعة يوجيا؟
      ar: أيّ جملة فيها je أو og اليوجياوية؟
      en: Which sentence uses Jogja's je or og?
    options: [Ora ngerti og., Iwak bakar wae., Banyune adem.]
    answer: 0
    explain:
      ar_eg: og في آخر الجملة = «أصلًا»، وje = «والله». الاتنين ⚠️ غير متحقق منهم.
      ar: og آخر الجملة للتعليل وje للتوكيد، وكلاهما ⚠️ غير متحقق منه.
      en: og at the end = "really", je = "honestly"; both are ⚠️ unverified.
    words: [og, je, iwak, banyu, adem]
dialogue:
  lines:
    - speaker: Mohamed
      text: Wah, panas je! Sumuk banget.
      ar_eg: ياه، حر والله! كتمة أوي.
      ar: يا للحرّ! خانق جدًا.
      en: Phew, it's hot! So muggy.
    - speaker: Mas Heru
      text: Ayo lungguh neng warung, adem.
      ar_eg: يلا نقعد في الوارونج، طراوة.
      ar: هيا نجلس في المطعم، الجو بارد.
      en: Let's sit in the warung, it's cool.
    - speaker: Bakul
      text: Arep pesen apa, Mas?
      ar_eg: تطلبوا إيه يا جماعة؟
      ar: ماذا تطلبون؟
      en: What would you like?
    - speaker: Mohamed
      text: Iwak bakar karo banyu putih, Mbak.
      ar_eg: سمك مشوي وميه سادة يا آنسة.
      ar: سمك مشوي وماء عادي يا آنسة.
      en: Grilled fish and plain water, please.
    - speaker: Mas Heru
      text: Panase marakake ngelak og!
      ar_eg: الحر بيعطّش أصلًا!
      ar: الحرّ يُعطش حقًا!
      en: This heat really makes you thirsty!
