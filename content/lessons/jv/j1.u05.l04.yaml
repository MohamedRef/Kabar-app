dialogue:
  lines:
    - speaker: Cak Heru
      text: Sumuk nemen, rek! Ayo golek panggon sing adem.
      ar_eg: حر أوي يا جدع! يلا ندوّر على مكان ساقع.
      ar: الجوّ حارّ جدًّا يا صاحبي! هيّا نبحث عن مكان بارد.
      en: So hot, mate! Let's find somewhere cool.
    - speaker: Mohamed
      text: Sepurane, Cak, aku ora eroh panggon nang kene.
      ar_eg: معلش يا تشاك، أنا ما اعرفش أماكن هنا.
      ar: عذرًا يا تشاك، لا أعرف الأماكن هنا.
      en: Sorry, Cak, I don't know places round here.
    - speaker: Cak Heru
      text: Aku eroh warung iwak bakar ndek Kenjeran. Adem, onok angine.
      ar_eg: أنا عارف مطعم سمك مشوي في كنجيران. ساقع وفيه هوا.
      ar: أعرف مطعم سمك مشويّ في كنجيران. بارد وفيه نسيم.
      en: I know a grilled-fish place in Kenjeran. Cool, with a breeze.
    - speaker: Mohamed
      text: Sip. Tapi ojo kakean sambel, ya. Sambel garai aku ngelak.
      ar_eg: تمام. بس من غير شطة كتير. الشطة بتعطّشني.
      ar: حسنًا. لكن بلا شطّة كثيرة، فالشطّة تعطّشني.
      en: OK. But not too much chilli. Chilli makes me thirsty.
    - speaker: Cak Heru
      text: Hahaha, iyo, rek!
      ar_eg: هاهاها، ماشي يا جدع!
      ar: هاهاها، حسنًا يا صاحبي!
      en: Hahaha, sure, mate!
