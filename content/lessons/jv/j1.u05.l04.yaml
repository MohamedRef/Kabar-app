        ar_eg: حر وكتمة
        ar: حرّ رطب
        en: muggy
      - text: adem
        ar_eg: طراوة، ساقع
        ar: بارد منعش
        en: cool
      - text: banyu
        ar_eg: ميه
        ar: ماء
        en: water
    words: [panas, sumuk, adem, banyu]
  - id: e02
    type: match_pairs
    pairs:
      - text: iwak
        ar_eg: سمك
        ar: سمك
        en: fish
      - text: marakake
        ar_eg: بيخلّي، بيسبب
        ar: يجعل، يسبب
