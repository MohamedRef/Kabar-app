schema: kabar.lesson/v1
id: j1.u05.l04
language: jv
title: Sumuk banget, Mas!
can_do:
  ar_eg: تشتكي من الحر على الشط، تطلب سمك مشوي وميه، وتفهم je وog بتوع يوجيا.
  ar: أن تشكو من الحر على الشاطئ، وتطلب سمكًا مشويًا وماءً، وتفهم je وog في كلام يوجيا.
  en: Complain about the heat on the beach, order grilled fish and water, and understand Jogja's je and og.
slides:
  - title: Panas je!
    body:
      ar_eg: |
        - panas = حر / سخن، sumuk = حر وكتمة وعرق، adem = طراوة / ساقع.
        - marakake = بيخلّي / بيسبب: Panase marakake ngelak = الحر بيعطّش (ngelak = عطشان).
        - banyu = ميه: Banyu putih wae = ميه سادة بس.
        - iwak = سمك (وكمان «لحمة» في الأكل عمومًا): iwak bakar = سمك مشوي.
        وبهارات يوجيا: je وog في آخر الجملة = «أصل… / والله»: Panas je! = حر أوي والله! · Ora ngerti og = ماعرفش أصلًا.
        je وog لسه ⚠️ غير متحقق منهم — كلام شارع، مش للغريب الكبير.
      ar: |
        - panas = حارّ، sumuk = حرّ رطب خانق، adem = بارد منعش.
        - marakake = يجعل / يسبب: Panase marakake ngelak = الحر يُعطش (ngelak = عطشان).
        - banyu = ماء: Banyu putih wae = ماء عادي فقط.
        - iwak = سمك (وقد تعني اللحم في الطعام عمومًا): iwak bakar = سمك مشوي.
        ومن توابل يوجيا: je وog آخر الجملة للتوكيد والتعليل: Panas je! = إنه حارّ حقًا! · Ora ngerti og = لا أعرف أصلًا.
        je وog ⚠️ غير متحقق منهما بعد، وهما من كلام الشارع لا لمخاطبة الكبار الغرباء.
      en: |
        - panas = hot, sumuk = muggy and sweaty, adem = cool.
        - marakake = makes, causes: Panase marakake ngelak = The heat makes you thirsty (ngelak = thirsty).
        - banyu = water: Banyu putih wae = just plain water.
        - iwak = fish (and "meat, protein" in food generally): iwak bakar = grilled fish.
        Jogja spice: je and og at the end = "you know / honestly": Panas je! = It's so hot, honestly! · Ora ngerti og = I've no idea, really.
        je and og are ⚠️ unverified for now: street speech, not for older strangers.
    grammar: jv.particle.basic
    examples:
      - text: Wah, sumuk banget, Mas!
        ar_eg: ياه، حر وكتمة أوي يا كابتن!
        ar: يا للحرّ الخانق يا أخي!
        en: Phew, it's so muggy!
      - text: Panas je! Ayo neng ngisor wit sing adem.
        ar_eg: حر أوي والله! يلا تحت الشجرة في الطراوة.
        ar: إنه حارّ! هيا إلى ظل الشجرة البارد.
        en: It's so hot! Let's go under the tree where it's cool.
      - text: Iwak bakar karo banyu putih.
        ar_eg: سمك مشوي وميه سادة.
        ar: سمك مشوي وماء عادي.
        en: Grilled fish and plain water.
