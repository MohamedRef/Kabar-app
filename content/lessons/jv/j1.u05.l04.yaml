schema: kabar.lesson/v1
id: j1.u05.l04
language: jv
title: Ulangan J1.5
can_do:
  ar_eg: تحوّل كلام سورابايا (Arek) للنغوكو العادي.
  ar: أن تحوّل كلام سورابايا (Arek) إلى النغوكو القياسي.
  en: Translate Arek to standard ngoko.
slides:
  - title: Ora, gak, dudu
    body:
      ar_eg: |
        مراجعة سريعة للنفي:
        - ora (وفي سورابايا gak) قبل الفعل والصفة = tidak: Aku ora ngerti / Aku gak ngerti.
        - dudu قبل الاسم = bukan: Iki dudu kopiku.
        - ora ana = gak onok = مفيش. rapopo = ولا يهمك. durung = لسه.
      ar: |
        مراجعة سريعة للنفي:
        - ora (وفي سورابايا gak) قبل الفعل والصفة = tidak: Aku ora ngerti / Aku gak ngerti.
        - dudu قبل الاسم = bukan: Iki dudu kopiku.
        - ora ana = gak onok = لا يوجد، rapopo = لا بأس، durung = ليس بعد.
      en: |
        Quick negation recap:
        - ora (Surabaya gak) before verbs and adjectives = tidak: Aku ora ngerti / Aku gak ngerti.
        - dudu before nouns = bukan: Iki dudu kopiku.
        - ora ana = gak onok = there isn't. rapopo = no problem. durung = not yet.
    grammar: jv.negation.ora-dudu
  - title: Arek → ngoko
    body:
      ar_eg: |
        والجدول اللي بيحوّل سورابايا لسولو:
        koen / awakmu ⇐ kowé · gak ⇐ ora · onok ⇐ ana · kate ⇐ arep · wes ⇐ wis · teko ⇐ saka · yok opo ⇐ piye · lapo ⇐ ngapa · ae ⇐ wae · ta ⇐ to.
        ومع الكبار: sampéyan، مش koen.
      ar: |
        وجدول التحويل من سورابايا إلى سولو:
        koen / awakmu ⇐ kowé · gak ⇐ ora · onok ⇐ ana · kate ⇐ arep · wes ⇐ wis · teko ⇐ saka · yok opo ⇐ piye · lapo ⇐ ngapa · ae ⇐ wae · ta ⇐ to.
        ومع الكبار: sampéyan لا koen.
      en: |
        The Surabaya → Solo table:
        koen / awakmu ⇒ kowé · gak ⇒ ora · onok ⇒ ana · kate ⇒ arep · wes ⇒ wis · teko ⇒ saka · yok opo ⇒ piye · lapo ⇒ ngapa · ae ⇒ wae · ta ⇒ to.
        With elders: sampéyan, not koen.
    grammar: jv.dialect.arek
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: koen
        ar_eg: kowé (إنت)
        ar: kowé (أنت)
        en: kowé (you)
      - text: onok
        ar_eg: ana (فيه)
        ar: ana (يوجد)
        en: ana (there is)
      - text: kate
        ar_eg: arep (هـ)
        ar: arep (سوف)
        en: arep (going to)
      - text: lapo
        ar_eg: ngapa (ليه)
        ar: ngapa (لماذا)
        en: ngapa (why)
      - text: teko
        ar_eg: saka (من)
        ar: saka (من)
        en: saka (from)
    words: [koen, onok, kate, lapo, teko]
  - id: e02
    type: multiple_choice
    question: Aku ___ wong Suroboyo.
    question_meaning:
      ar_eg: أنا مش من سورابايا. أنهي كلمة تكمّل؟
      ar: لستُ من سورابايا. أيّ كلمة تُكمل الجملة؟
      en: I'm not from Surabaya. Which word fills the gap?
    options: ["gak", "ora", "dudu"]
    answer: 2
    explain:
      ar_eg: wong Suroboyo اسم، فبيتنفي بـ dudu.
      ar: wong Suroboyo اسم فيُنفى بـ dudu.
      en: wong Suroboyo is a noun, so dudu.
    words: [dudu]
  - id: e03
    type: multiple_choice
    question: Kowé saka ngendi?
    question_meaning:
      ar_eg: أنهي جملة Arek معناها نفس الجملة دي؟
      ar: أيّ جملة Arek تؤدي معنى هذه الجملة؟
      en: Which Arek sentence means the same?
    options: ["Koen kate nang endi?", "Koen teko endi?", "Lapo koen?"]
    answer: 1
    explain:
      ar_eg: saka ⇐ teko (من)، وkowé ⇐ koen. Kate nang endi = رايح فين.
      ar: saka ⇐ teko (من)، وkowé ⇐ koen، أما Kate nang endi فمعناها إلى أين.
      en: saka ⇒ teko (from), kowé ⇒ koen. Kate nang endi = where are you going.
    words: [teko, saka, koen]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: بتسأل بيّاعة كبيرة في السن «حضرتك كلتي؟». تقول إيه؟
      ar: تسأل بائعة مسنّة «هل أكلتِ؟». ماذا تقول؟
      en: You ask an older woman selling at the market whether she has eaten. What do you say?
    options: ["Sampéyan wis mangan, Bu?", "Awakmu wis mangan?", "Koen wis mangan ta, rek?"]
    answer: 0
    explain:
      ar_eg: koen وawakmu وrek للصحاب. مع الكبير sampéyan وBu.
      ar: koen وawakmu وrek للأقران، ومع الكبير sampéyan وBu.
      en: koen, awakmu and rek are for friends; an older person gets sampéyan and Bu.
    words: [sampéyan]
  - id: e05
    type: listen
    text: Gak onok, rek.
    options: ["Dudu aku, rek.", "Gak onok, rek.", "Gak ngerti, rek."]
    answer: 1
    words: [gak, onok]
  - id: e06
    type: fill_blank
    sentence: Regané ___ larang.
    meaning:
      ar_eg: السعر مش غالي.
      ar: السعر ليس غاليًا.
      en: The price isn't expensive.
    options: ["ora", "durung", "dudu"]
    answers: ["ora"]
    explain:
      ar_eg: larang صفة، فبتاخد ora.
      ar: larang صفة فتُنفى بـ ora.
      en: larang is an adjective, so ora.
    words: [ora, larang]
  - id: e07
    type: fill_blank
    sentence: ___ kabaré, Cak?
    meaning:
      ar_eg: أخبارك إيه يا معلم؟ (Arek)
      ar: كيف حالك يا أخي؟ (Arek)
      en: How are you, Cak? (Arek)
    answers: ["Yok opo", "Yaopo", "yok opo", "yaopo"]
    explain:
      ar_eg: yok opo (yaopo) = piye بتاعة سورابايا.
      ar: yok opo (yaopo) = piye في سورابايا.
      en: yok opo (yaopo) is Surabaya's piye.
    words: [yok opo]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "حوّلها للنغوكو العادي: «Gak onok, rek.»"
      ar: "حوّلها إلى النغوكو القياسي: «Gak onok, rek.»"
      en: "Turn it into standard ngoko: \"Gak onok, rek.\""
    answers: ["Ora ana.", "Ora ana", "Ora ana, Mas.", "Ora ana, Mas", "Ora ana Mas.", "Ora ana Mas", "Ora ana, rek.", "Ora ana, rek", "Ora ana rek.", "Ora ana rek"]
    explain:
      ar_eg: gak ⇐ ora، onok ⇐ ana. وrek علامة سورابايا، فممكن تشيلها أو تقول Mas.
      ar: gak ⇐ ora، وonok ⇐ ana، وrek علامة سورابايا فيمكن حذفها.
      en: gak ⇒ ora, onok ⇒ ana; rek is a Surabaya marker, so you can drop it.
    words: [ora ana, gak onok]
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "حوّلها للنغوكو العادي: «Lapo koen gak mangan?» (مابتاكلش ليه؟)"
      ar: "حوّلها إلى النغوكو القياسي: «Lapo koen gak mangan?» (لماذا لا تأكل؟)"
      en: "Turn it into standard ngoko: \"Lapo koen gak mangan?\" (Why aren't you eating?)"
    answers: ["Ngapa kowé ora mangan?", "Ngapa kowé ora mangan", "Ngapa kowe ora mangan?", "Ngapa kowe ora mangan", "Kowé ngapa ora mangan?", "Kowé ngapa ora mangan", "Kowe ngapa ora mangan?", "Kowe ngapa ora mangan", "Ngapa kowé ra mangan?", "Ngapa kowé ra mangan", "Ngapa kowe ra mangan?", "Ngapa kowe ra mangan"]
    explain:
      ar_eg: lapo ⇐ ngapa، koen ⇐ kowé، gak ⇐ ora.
      ar: lapo ⇐ ngapa، وkoen ⇐ kowé، وgak ⇐ ora.
      en: lapo ⇒ ngapa, koen ⇒ kowé, gak ⇒ ora.
    words: [ngapa, kowé, ora, lapo, koen, gak]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "حوّلها للنغوكو العادي: «Aku teko Mesir.» (أنا من مصر)"
      ar: "حوّلها إلى النغوكو القياسي: «Aku teko Mesir.» (أنا من مصر)"
      en: "Turn it into standard ngoko: \"Aku teko Mesir.\" (I'm from Egypt)"
    answers: ["Aku saka Mesir.", "Aku saka Mesir"]
    words: [saka, teko]
  - id: e11
    type: build_sentence
    source:
      ar_eg: دي مش قهوتي، دي قهوة Cak Heru.
      ar: هذه ليست قهوتي، هذه قهوة Cak Heru.
      en: This isn't my coffee, it's Cak Heru's coffee.
    answer: Iki dudu kopiku, iki kopiné Cak Heru.
    distractors: ["ora", "onok"]
    explain:
      ar_eg: kopiku اسم، فالنفي dudu. وkopiné Cak Heru = kopinya Cak Heru.
      ar: kopiku اسم فيُنفى بـ dudu، وkopiné Cak Heru = kopinya Cak Heru.
      en: kopiku is a noun, so dudu; kopiné Cak Heru = kopinya Cak Heru.
    words: [dudu, kopi]
  - id: e12
    type: translate
    direction: from_target
    source_text: Koen kate nang endi, rek?
    answers_meaning:
      ar_eg: ["إنت رايح فين يا صاحبي؟", "رايح فين يا صاحبي؟", "رايح فين يا جدع؟", "إنت رايح فين؟"]
      ar: ["إلى أين أنت ذاهب يا صاح؟", "إلى أين يا صاح؟", "إلى أين أنت ذاهب؟"]
      en: ["Where are you going, mate?", "Where are you off to, mate?", "Where are you going?", "Where are you off to?"]
    words: [koen, kate, nang, endi]
  - id: e13
    type: dictation
    text: Iki dudu kopiku.
    meaning:
      ar_eg: دي مش قهوتي.
      ar: هذه ليست قهوتي.
      en: This isn't my coffee.
    words: [dudu]
  - id: e14
    type: speaking
    text: Rapopo, Cak. Aku durung mangan.
    meaning:
      ar_eg: ولا يهمك يا معلم. أنا لسه ماكلتش.
      ar: لا بأس يا أخي. لم آكل بعد.
      en: No problem, Cak. I haven't eaten yet.
    words: [rapopo, durung]
dialogue:
  title: Sore nang Kenjeran
  lines:
    - speaker: Ning Lia
      text: Mohamed, koen teko endi?
      ar_eg: محمد، إنت منين؟
      ar: يا محمد، من أين أنت؟
      en: Mohamed, where are you from?
    - speaker: Mohamed
      text: Aku saka Kairo, Ning. Aku dudu wong Jawa.
      ar_eg: أنا من القاهرة يا آنسة. أنا مش جاوي.
      ar: أنا من القاهرة يا آنسة، لستُ جاويًّا.
      en: I'm from Cairo, Ning. I'm not Javanese.
    - speaker: Ning Lia
      text: Lho, koen ngerti basa Suroboyo ta?
      ar_eg: إيه ده، إنت فاهم كلام سورابايا ولا إيه؟
      ar: حقًّا؟ أتفهم لهجة سورابايا إذن؟
      en: Oh! So you understand Surabaya talk?
    - speaker: Mohamed
      text: Iya, Ning. Koen, gak, onok, kate… rek!
      ar_eg: أيوه يا آنسة. koen، gak، onok، kate… rek!
      ar: "نعم يا آنسة: koen وgak وonok وkate… rek!"
      en: Yes, Ning. Koen, gak, onok, kate… rek!
    - speaker: Cak Heru
      text: Wah, apik, rek! Koen arek Suroboyo!
      ar_eg: الله، حلو يا صاحبي! إنت ابن سورابايا!
      ar: رائع يا صاح! أنت من أبناء سورابايا!
      en: Wow, nice one, mate! You're a Surabaya local!
souvenir:
  id: j1.u05.souvenir
  title: Pantai Kenjeran
  note:
    ar_eg: |
      كنجران هو شط سورابايا: صيادين، ريحة سمك متشوّي، وعيلات بتتمشى العصر جنب البحر. هنا كلام Arek بيبان على حقيقته: بيبان ناشف لسامع من وسط جاوة، بس بين الصحاب ده دفا وهزار مش قلة أدب.
      دلوقتي إنت فاهم koen وgak وonok وrek. افتكر بس القاعدة الحلوة: مع الصحاب Arek براحتك، ومع الناس اللي متعرفهمش ابدأ بالنغوكو العادي أو sampéyan.
    ar: |
      كنجران شاطئ سورابايا: صيادون ورائحة سمك مشوي وعائلات تتنزه عصرًا قرب البحر. وهنا يظهر كلام Arek على حقيقته: يبدو جافًّا لأهل وسط جاوة، لكنه بين الأصدقاء ودٌّ ومزاح لا قلة أدب.
      أنت الآن تفهم koen وgak وonok وrek. وتذكّر القاعدة: مع الأصدقاء تكلّم Arek كما تشاء، ومع الغرباء ابدأ بالنغوكو القياسي أو sampéyan.
    en: |
      Kenjeran is Surabaya's beach: fishing boats, the smell of grilled fish, families strolling by the sea in the late afternoon. It's where Arek speech shows its true colours: blunt to Central Javanese ears, but between friends it's warmth and banter, not rudeness.
      You now understand koen, gak, onok and rek. Keep the one golden rule: Arek freely with friends, standard ngoko or sampéyan with people you don't know.
