id: j1.u05.l04
language: jv
title: Sumuk nemen, rek!
can_do:
  ar_eg: تشتكي من حر سورابايا، تعتذر بطريقة أهلها، وتطلب سمك مشوي.
  ar: أن تشكو من حرّ سورابايا، وتعتذر بطريقة أهلها، وتطلب سمكًا مشويًّا.
  en: Complain about the Surabaya heat, apologise the local way and order grilled fish.
slides:
  - title: Suroboyo panas
    body:
      ar_eg: |
        sumuk = حر ورطوبة وعرق، adem = ساقع لطيف، منعش.
        nemen = أوي (بتيجي بعد الكلمة): Sumuk nemen! = حر أوي!
        sepurane = معلش، آسف (= ngapunten بأدب)، eroh = يعرف حاجة (= weruh).
        garai = يخلّي، يسبّب: Sumuk garai ngantuk = الحر بيخلّي الواحد نعسان.
        kakean = كتير زيادة عن اللزوم. iwak = سمك: iwak bakar = سمك مشوي.
      ar: |
        sumuk = حرّ رطب يُعرّق، adem = بارد لطيف، منعش.
        nemen = جدًّا (تأتي بعد الكلمة): Sumuk nemen! = حرّ شديد!
        sepurane = عذرًا، آسف (= ngapunten بأدب)، eroh = يعرف شيئًا (= weruh).
        garai = يجعل، يسبّب: Sumuk garai ngantuk = الحرّ يجعل المرء نعسانًا.
        kakean = أكثر من اللازم. iwak = سمك: iwak bakar = سمك مشوي.
      en: |
        sumuk = hot and sticky, adem = pleasantly cool.
        nemen = very (comes after the word): Sumuk nemen! = So hot!
        sepurane = sorry (polite: ngapunten), eroh = know (= weruh).
        garai = make, cause: Sumuk garai ngantuk = The heat makes you sleepy.
        kakean = too much. iwak = fish: iwak bakar = grilled fish.
    examples:
      - text: Sumuk nemen, rek!
        ar_eg: حر أوي يا جدع!
        ar: الجوّ حارّ جدًّا يا صاحبي!
        en: It's so hot, mate!
      - text: Sepurane, Cak, aku ora eroh.
        ar_eg: معلش يا تشاك، أنا مش عارف.
        ar: عذرًا يا تشاك، لا أعرف.
        en: Sorry, Cak, I don't know.
      - text: Iwak bakar enak nemen.
        ar_eg: السمك المشوي حلو أوي.
        ar: السمك المشوي لذيذ جدًّا.
        en: The grilled fish is really good.
