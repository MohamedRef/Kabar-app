schema: kabar.lesson/v1
id: j2.u04.l03
language: jv
title: Legi, Pahing, Pon
can_do:
  ar_eg: تستعمل أيام الباساران وتسأل عن الويتون.
  ar: أن تستعمل أيام الباساران وتسأل عن الويتون.
  en: Use pasaran days and ask about someone's weton.
slides:
  - title: Legi, Pahing, Pon, Wage, Kliwon
    body:
      ar_eg: |
        الجاويين عندهم كمان «أسبوع سوق» من خمس أيام اسمه pasaran:
        Legi → Pahing → Pon → Wage → Kliwon → وبعدين Legi تاني.
        الأسبوعين بيمشوا مع بعض، فكل يوم ليه اسمين: Senen Legi، Selasa Pahing، Rebo Pon …
        وكل 35 يوم (7 × 5) نفس الاسمين بيرجعوا، والدورة دي اسمها selapan.
        الإملا: Wage في الكتب، Wage في الشات.
      ar: |
        وللجاويين أيضًا «أسبوع سوق» من خمسة أيام يسمى pasaran:
        Legi → Pahing → Pon → Wage → Kliwon → ثم Legi من جديد.
        ويسير الأسبوعان معًا، فلكل يوم اسمان: Senen Legi، Selasa Pahing، Rebo Pon …
        وكل 35 يومًا (7 × 5) يعود الاسمان معًا، وتسمى هذه الدورة selapan.
        والإملاء: Wage في الكتب، وWage في الدردشة.
      en: |
        Javanese also keep a five-day "market week" called pasaran:
        Legi → Pahing → Pon → Wage → Kliwon → then Legi again.
        The two weeks run together, so every day has two names: Senen Legi, Selasa Pahing, Rebo Pon …
        Every 35 days (7 × 5) the same pair comes back; that cycle is called selapan.
        Spelling: Wage in books, Wage in chats.
    examples:
      - text: Dina iki Jemuwah Kliwon.
        ar_eg: النهارده جمعة كليوون.
        ar: اليوم جمعة كليوون.
        en: Today is Friday Kliwon.
  - title: Wetonmu apa?
    body:
      ar_eg: |
        weton = يوم ميلادك بالاسمين (اليوم + الـ pasaran)، زي «Senen Pahing». الجاويين لسه بيسألوا عليه في المناسبات زي الأفراح.
        وJemuwah Kliwon (جمعة كليوون) ليلة مشهورة جدًا في الحكايات الجاوية.
        وأسواق قديمة كتير اسمها على يوم الـ pasaran اللي كانت بتفتح فيه، زي Pasar Legi في سولو وكوتاجيدي.
      ar: |
        weton = يوم ميلادك باسميه (اليوم + الـ pasaran)، مثل «Senen Pahing»، وما زال الجاويون يسألون عنه في المناسبات كالأعراس.
        وليلة Jemuwah Kliwon (جمعة كليوون) شهيرة جدًا في الحكايات الجاوية.
        وتحمل أسواق قديمة كثيرة اسم يوم الـ pasaran الذي كانت تُفتح فيه، مثل Pasar Legi في سولو وكوتاغيدي.
      en: |
        weton = your birth day with both names (weekday + pasaran), e.g. "Senen Pahing". Javanese still ask about it for occasions like weddings.
        Jemuwah Kliwon (Friday Kliwon) is a famous night in Javanese stories.
        Many old markets are named after the pasaran day they opened on, like Pasar Legi in Solo and Kotagede.
    examples:
      - text: Wetonmu apa? — Wetonku Senen Pahing.
        ar_eg: الـ weton بتاعك إيه؟ — الـ weton بتاعي اتنين باهينج.
        ar: ما يوم مولدك الجاوي؟ — يوم مولدي اثنين باهينغ.
        en: What's your weton? — Mine is Monday Pahing.
exercises:
  - id: e01
    type: multiple_choice
    question: Pon → ?
    question_meaning:
      ar_eg: إيه يوم الـ pasaran اللي بعد Pon؟
      ar: ما يوم الـ pasaran الذي يلي Pon؟
      en: Which pasaran day comes after Pon?
    options: [Wage, Kliwon, Legi]
    answer: 0
    explain:
      ar_eg: الترتيب Legi → Pahing → Pon → Wage → Kliwon.
      ar: الترتيب Legi → Pahing → Pon → Wage → Kliwon.
      en: Legi → Pahing → Pon → Wage → Kliwon.
    words: [Pon, Wage]
  - id: e02
    type: multiple_choice
    question: Kliwon → ?
    question_meaning:
      ar_eg: إيه اللي بعد Kliwon؟
      ar: ما الذي يلي Kliwon؟
      en: What comes after Kliwon?
    options: [Pon, Legi, Pahing]
    answer: 1
    explain:
      ar_eg: الدورة خمس أيام بس، فبعد Kliwon بترجع Legi.
      ar: الدورة خمسة أيام، فبعد Kliwon تعود Legi.
      en: The cycle has five days, so after Kliwon it's Legi again.
    words: [Kliwon, Legi]
  - id: e03
    type: listen
    text: Dina iki Jemuwah Kliwon.
    options: [Dina iki Jemuwah Legi., Dina iki Jemuwah Kliwon., Dina iki Kemis Kliwon.]
    answer: 1
    words: [dina, Jemuwah, Kliwon]
  - id: e04
    type: fill_blank
    sentence: Legi, Pahing, ___, Wage, Kliwon
    meaning:
      ar_eg: أيام الـ pasaran الخمسة بالترتيب
      ar: أيام الـ pasaran الخمسة بالترتيب
      en: the five pasaran days in order
    options: [Setu, Pon, Rebo]
    answers: [Pon]
    words: [Pon]
  - id: e05
    type: translate
    direction: from_target
    source_text: Wetonku Senen Pahing.
    answers_meaning:
      ar_eg: [أنا مولود يوم اتنين باهينج., الـ weton بتاعي اتنين باهينج, يوم ميلادي الجاوي الاتنين باهينج]
      ar: [وُلدتُ يوم الاثنين باهينغ., يوم مولدي الجاوي الاثنين باهينغ]
      en: [My weton is Monday Pahing., I was born on Monday Pahing, My Javanese birth day is Monday Pahing]
    words: [weton, Senen, Pahing]
  - id: e06
    type: dictation
    text: Senen Legi, Selasa Pahing
    meaning:
      ar_eg: اتنين ليجي، تلات باهينج
      ar: الاثنين ليغي، الثلاثاء باهينغ
      en: Monday Legi, Tuesday Pahing
    words: [Senen, Legi, Selasa, Pahing]
  - id: e07
    type: speaking
    text: Dina iki Jemuwah Kliwon.
    meaning:
      ar_eg: النهارده جمعة كليوون.
      ar: اليوم جمعة كليوون.
      en: Today is Friday Kliwon.
    words: [dina iki, Jemuwah, Kliwon]
dialogue:
  title: Jemuwah Kliwon neng Ponorogo
  lines:
    - speaker: Mohamed
      text: Sari, dina iki dina apa?
      ar_eg: ساري، النهارده إيه؟
      ar: يا ساري، أيّ يوم اليوم؟
      en: Sari, what day is it today?
    - speaker: Sari
      text: Jemuwah. Jemuwah Kliwon!
      ar_eg: الجمعة. جمعة كليوون!
      ar: الجمعة. جمعة كليوون!
      en: Friday. Friday Kliwon!
    - speaker: Mohamed
      text: Kliwon? Apa kuwi?
      ar_eg: كليوون؟ يعني إيه؟
      ar: كليوون؟ ما هذا؟
      en: Kliwon? What's that?
    - speaker: Sari
      text: Dina pasaran. Legi, Pahing, Pon, Wage, Kliwon.
      ar_eg: يوم من أيام السوق الجاوية. ليجي، باهينج، بون، واجيه، كليوون.
      ar: 'يوم من أيام السوق الجاوية: ليغي، باهينغ، بون، واغيه، كليوون.'
      en: A pasaran day. Legi, Pahing, Pon, Wage, Kliwon.
    - speaker: Mohamed
      text: Dadi sesuk Setu Legi?
      ar_eg: يعني بكرة سبت ليجي؟
      ar: إذن غدًا سبت ليغي؟
      en: So tomorrow is Saturday Legi?
    - speaker: Sari
      text: Bener! Kowe cepet sinau.
      ar_eg: صح! إنت بتتعلم بسرعة.
      ar: صحيح! أنت تتعلم بسرعة.
      en: Right! You learn fast.
new_words:
  - word: pasaran
    pos: noun
    ar_eg: أيام السوق الجاوية الخمسة
    ar: أيام السوق الجاوية الخمسة
    en: the five-day Javanese market week
  - word: Legi, Pahing, Pon, Wage, Kliwon
    pos: noun
    ar_eg: أسماء أيام الـ pasaran
    ar: أسماء أيام الـ pasaran
    en: the five pasaran days
  - word: weton
    pos: noun
    ar_eg: يوم الميلاد الجاوي (اليوم + الـ pasaran)
    ar: يوم المولد الجاوي (اليوم + الـ pasaran)
    en: Javanese birth day (weekday + pasaran)
  - word: bener
    pos: adjective
    ar_eg: صح
    ar: صحيح
    en: right, correct (benar)
  - word: cepet
    pos: adjective
    ar_eg: بسرعة / سريع
    ar: سريع
    en: fast (cepat)
