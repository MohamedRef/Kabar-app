schema: kabar.lesson/v1
id: j2.u01.l07
language: jv
title: Sing penting sehat
can_do:
  ar_eg: تقول «المهم الصحة»، وتقبل أكل زيادة، وتقول «أنا جاي معاكم» و«برضه» و«أكيد» و«امبارح».
  ar: أن تقول «المهم الصحة»، وتقبل طعامًا إضافيًا، وتقول «سآتي معكم» و«أيضًا» و«بالتأكيد» و«أمس».
  en: Say "health is what matters", accept a second helping, and say "I'm coming too", "also", "surely" and "yesterday".
slides:
  - title: Neng omahe Pak Budi
    body:
      ar_eg: |
        كلمات بتسمعها كل يوم في بيت عيلة في ماديون:
        - **tambah** = زيادة / كمان (tambah): Tambah sega? = تزود رز؟
        - **wingi** = امبارح (kemarin) · **penting** = مهم (penting): **sing penting…** = المهم…
        - **uga** = كمان / برضه (juga) · **mesthi** = أكيد (pasti)
        - **melu** = ييجي معاك / يشارك (ikut): Aku melu! = أنا جاي معاكم!
      ar: |
        كلمات تسمعها كل يوم في بيت عائلة في ماديون:
        - **tambah** = إضافة / المزيد (tambah): Tambah sega? = أتريد مزيدًا من الأرز؟
        - **wingi** = أمس (kemarin) · **penting** = مهم (penting): **sing penting…** = المهم…
        - **uga** = أيضًا (juga) · **mesthi** = بالتأكيد (pasti)
        - **melu** = يرافق / يشارك (ikut): Aku melu! = سآتي معكم!
      en: |
        Words you hear every day in a family home in Madiun:
        - **tambah** = more, add (tambah): Tambah sega? = More rice?
        - **wingi** = yesterday (kemarin) · **penting** = important (penting): **sing penting…** = what matters is…
        - **uga** = also, too (juga) · **mesthi** = surely, definitely (pasti)
        - **melu** = come along, join in (ikut): Aku melu! = I'm coming too!
    examples:
      - text: Wingi aku ngantuk banget, saiki wis apik.
        ar_eg: امبارح كنت نعسان جدًا، ودلوقتي بقيت كويس.
        ar: كنت نعسان جدًا أمس، والآن صرت بخير.
        en: I was really sleepy yesterday; now I'm fine.
      - text: Sing penting sehat, ya!
        ar_eg: المهم الصحة!
        ar: المهم الصحة!
        en: Health is what matters!
      - text: Aku melu, Mas! Sari uga melu.
        ar_eg: أنا جاي معاكم يا ماس! وساري جاية برضه.
        ar: سآتي معكم يا أخي! وساري أيضًا.
        en: I'm coming, Mas! Sari's coming too.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: tambah
        ar_eg: زيادة / كمان
        ar: المزيد
        en: more, add
      - text: wingi
        ar_eg: امبارح
        ar: أمس
        en: yesterday
      - text: uga
        ar_eg: برضه / كمان
        ar: أيضًا
        en: also, too
    words: [tambah, wingi, uga]
  - id: e02
    type: match_pairs
    pairs:
      - text: mesthi
        ar_eg: أكيد
        ar: بالتأكيد
        en: surely
      - text: penting
        ar_eg: مهم
        ar: مهم
        en: important
      - text: melu
        ar_eg: ييجي معاك
        ar: يرافق
        en: come along
    words: [mesthi, penting, melu]
  - id: e03
    type: listen
    text: Wingi aku neng omahe simbah.
    question:
      ar_eg: كان فين امبارح؟
      ar: أين كان أمس؟
      en: Where was he yesterday?
    options: [امبارح كنت في بيت جدو, بكرة هروح بيت جدو, جدو في بيتي]
    answer: 0
    meaning:
      ar_eg: امبارح كنت في بيت جدو.
      ar: كنت أمس في بيت الجد.
      en: Yesterday I was at Grandpa's.
    words: [wingi]
  - id: e04
    type: fill_blank
    sentence: Aku ___ neng omahe Pakdhe!
    meaning:
      ar_eg: أنا ___ لبيت عمو!
      ar: أنا ___ إلى بيت العم!
      en: I'm ___ to Uncle's house!
    options: [melu, wingi, tambah]
    answers: [melu]
    words: [melu, wingi, tambah]
    explain:
      ar_eg: melu = جاي معاكم / رايح معاكم. wingi = امبارح، وtambah = زيادة، ومش أفعال.
      ar: melu = أرافقكم؛ أما wingi فأمس، وtambah المزيد، وليسا فعلين.
      en: melu = come along. wingi (yesterday) and tambah (more) aren't verbs.
  - id: e05
    type: fill_blank
    sentence: Sing ___ sehat.
    meaning:
      ar_eg: الـ ___ الصحة.
      ar: الـ ___ الصحة.
      en: What's ___ is health.
    options: [penting, tambah, uga]
    answers: [penting]
    words: [penting, tambah, uga]
    explain:
      ar_eg: sing penting = المهم. tambah = زيادة، وuga = كمان.
      ar: sing penting = المهم؛ أما tambah فالمزيد، وuga أيضًا.
      en: sing penting = what matters. tambah = more, uga = also.
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: بو راهايو بتعرض عليك رز تاني. بتقول إيه؟
      ar: تعرض عليك بو راهايو مزيدًا من الأرز. ماذا تقول؟
      en: Bu Rahayu offers you more rice. What does she say?
    options: ['Tambah sega?', 'Uga sega?', 'Wingi sega?']
    answer: 0
    explain:
      ar_eg: tambah = زيادة. uga = برضه، وwingi = امبارح.
      ar: tambah = المزيد، أما uga فأيضًا وwingi أمس.
      en: tambah = more. uga = also, wingi = yesterday.
    words: [tambah, uga, wingi]
  - id: e07
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «أكيد»؟
      ar: أيّ كلمة تعني «بالتأكيد»؟
      en: Which word means "surely"?
    options: [mesthi, uga, melu]
    answer: 0
    explain:
      ar_eg: mesthi = أكيد. uga = برضه، وmelu = ييجي معاك.
      ar: mesthi = بالتأكيد، أما uga فأيضًا وmelu يرافق.
      en: mesthi = surely. uga = also, melu = come along.
    words: [mesthi, uga, melu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: جدو كمان مدرس.
      ar: الجد معلّم أيضًا.
      en: Grandpa is a teacher too.
    answer: Simbah uga guru.
    distractors: [mesthi, tambah]
    words: [uga]
    explain:
      ar_eg: "uga = كمان: simbah uga guru = جدو مدرس كمان. mesthi = أكيد، وtambah = زيادة، ومش في المعنى."
      ar: "uga = أيضًا: simbah uga guru = الجد معلّم أيضًا؛ أما mesthi فبالتأكيد، وtambah المزيد، وليسا في المعنى."
      en: "uga = too: simbah uga guru. mesthi (surely) and tambah (more) aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: Bapak mesthi seneng.
    answers_meaning:
      ar_eg: [أكيد بابا هيبقى مبسوط, بابا أكيد هيفرح]
      ar: [سيكون الأب سعيدًا بالتأكيد, سيفرح الأب حتمًا]
      en: [Dad will definitely be happy, Dad will surely be pleased]
    words: [mesthi]
  - id: e10
    type: speaking
    text: Sing penting kabeh sehat.
    meaning:
      ar_eg: المهم إن الكل بخير.
      ar: المهم أن الجميع بخير.
      en: What matters is that everyone's well.
    words: [penting]
dialogue:
  lines:
    - speaker: Bu Rahayu
      text: Mas Mohamed, tambah sega?
      ar_eg: يا ماس محمد، تزود رز؟
      ar: يا محمد، أتريد مزيدًا من الأرز؟
      en: Mohamed, more rice?
    - speaker: Mohamed
      text: Nggih, Bu, matur nuwun.
      ar_eg: أيوه يا حاجة، شكرًا.
      ar: نعم يا سيدتي، شكرًا.
      en: Yes please, Bu, thank you.
    - speaker: Bu Rahayu
      text: Wingi kowe ngantuk banget, ta? Saiki piye?
      ar_eg: امبارح كنت نعسان جدًا، مش كده؟ عامل إيه دلوقتي؟
      ar: كنت نعسان جدًا أمس، أليس كذلك؟ كيف حالك الآن؟
      en: You were really sleepy yesterday, weren't you? How are you now?
    - speaker: Mohamed
      text: Saiki apik, Bu. Sing penting sehat.
      ar_eg: دلوقتي كويس يا حاجة. المهم الصحة.
      ar: الآن بخير يا سيدتي. المهم الصحة.
      en: I'm fine now, Bu. Health is what matters.
    - speaker: Sari
      text: Sesuk aku neng omahe Simbah. Mas melu?
      ar_eg: بكرة أنا رايحة بيت جدو. جاي معايا؟
      ar: غدًا سأذهب إلى بيت الجد. أتأتي معي؟
      en: Tomorrow I'm going to Grandpa's. Coming along?
    - speaker: Mohamed
      text: Melu! Bayu uga melu, ta? Mesthi rame.
      ar_eg: جاي! وبايو جاي برضه، صح؟ أكيد هتبقى حلوة وزحمة.
      ar: سآتي! وبايو سيأتي أيضًا، صحيح؟ ستكون حتمًا مفعمة بالحياة.
      en: I'm in! Bayu's coming too, right? It'll surely be lively.
