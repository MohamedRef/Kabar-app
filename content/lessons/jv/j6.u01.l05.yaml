id: j6.u01.l05
language: jv
title: Crita Aji Saka
can_do:
  ar_eg: 'تحكي أسطورة آجي ساكا اللي ورا الحروف العشرين: الرسولين والوصية والمبارزة.'
  ar: 'أن تحكي أسطورة آجي ساكا وراء الحروف العشرين: الرسولان والوصية والمبارزة.'
  en: 'Tell the Aji Saka legend behind the 20 letters: two messengers, an order and a duel.'
slides:
  - title: Ha na ca ra ka
    body:
      ar_eg: |
        الحروف العشرين بتحكي حكاية: آجي ساكا كان عنده utusan (رسول أو خدام) اتنين، دورا وسيمبادا.
        سيمبادا كان ماسك weling (وصية أو أمر): «ماتديش الكريس لحد». ودورا جه ياخده، فعملوا tandhing (مبارزة) وماتوا الاتنين.
        baris kapindho = السطر التاني، katelu = التالت، sabanjure = بعد كده. والحكايات القديمة دي مكتوبة في babad (حوليات).
      ar: |
        الحروف العشرون تحكي قصة: كان لآجي ساكا utusan (رسولان أو خادمان) هما دورا وسيمبادا.
        وكان سيمبادا يحفظ weling (وصية): «لا تعطِ الخنجر أحدًا». فجاء دورا ليأخذه، فتبارزا (tandhing) ومات الاثنان.
        baris kapindho = السطر الثاني، katelu = الثالث، sabanjure = بعد ذلك. وتُروى هذه القصص في babad (الحوليات).
      en: |
        The 20 letters tell a story: Aji Saka had two utusan (messengers), Dora and Sembada.
        Sembada kept a weling (instruction): "give the keris to no one". Dora came for it, they fought a tandhing (duel), and both died.
        baris kapindho = the second line, katelu = third, sabanjure = next, then. Old stories like this are written in a babad (chronicle).
    examples:
      - text: Aji Saka duwe utusan loro, yaiku Dora lan Sembada.
        ar_eg: آجي ساكا كان عنده رسولين، دورا وسيمبادا.
        ar: كان لآجي ساكا رسولان، هما دورا وسيمبادا.
        en: Aji Saka had two messengers, Dora and Sembada.
      - text: Baris kapindho yaiku 'da ta sa wa la'.
        ar_eg: السطر التاني هو da ta sa wa la.
        ar: السطر الثاني هو da ta sa wa la.
        en: The second line is 'da ta sa wa la'.
      - text: Sabanjure, Dora lan Sembada tandhing.
        ar_eg: بعد كده، دورا وسيمبادا اتبارزوا.
        ar: بعد ذلك تبارز دورا وسيمبادا.
        en: Then Dora and Sembada fought a duel.
exercises:
