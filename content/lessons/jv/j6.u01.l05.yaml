  - id: e03
    type: listen
    text: Aji Saka menehi weling marang utusane.
    question:
      ar_eg: آجي ساكا عمل إيه؟
      ar: ماذا فعل آجي ساكا؟
      en: What did Aji Saka do?
    options: [إدّى وصية لرسوله, اشترى كريس جديد, كتب جواب لصاحبه]
    answer: 0
    meaning:
      ar_eg: آجي ساكا إدّى وصية لرسوله.
      ar: أعطى آجي ساكا رسوله وصية.
      en: Aji Saka gave an instruction to his messenger.
    words: [weling, utusan]
  - id: e04
    type: fill_blank
    sentence: Sembada nglakoni ___ Aji Saka.
    meaning:
      ar_eg: سيمبادا نفّذ ___ آجي ساكا.
      ar: نفّذ سيمبادا ___ آجي ساكا.
      en: Sembada carried out Aji Saka's ___.
    options: [weling, aksara, tandhing]
    answers: [weling]
    words: [weling, aksara, tandhing]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «كتاب تاريخ قديم لمملكة»؟
      ar: أي كلمة تعني «تاريخ مكتوب قديم لمملكة»؟
      en: Which word means 'old written history of a kingdom'?
    options: [tandhing, babad, aksara]
    answer: 1
    explain:
      ar_eg: babad = حوليات، زي Babad Tanah Jawi.
      ar: babad = حوليات، مثل Babad Tanah Jawi.
      en: babad = chronicle, like the Babad Tanah Jawi.
    words: [tandhing, babad, aksara]
  - id: e06
    type: fill_blank
    sentence: Baris ___ yaiku 'da ta sa wa la'.
    meaning:
      ar_eg: السطر ___ هو da ta sa wa la.
      ar: السطر ___ هو da ta sa wa la.
      en: The ___ line is 'da ta sa wa la'.
    options: [kapindho, katelu, utusan]
    answers: [kapindho]
    words: [kapindho, katelu, utusan]
  - id: e07
    type: multiple_choice
    question: 'Baris ___: ''pa dha ja ya nya''.'
    options: [kapindho, sabanjure, katelu]
    answer: 2
    explain:
      ar_eg: 'pa dha ja ya nya هو السطر التالت: katelu.'
      ar: 'pa dha ja ya nya هو السطر الثالث: katelu.'
      en: 'pa dha ja ya nya is the third line: katelu.'
    words: [kapindho, sabanjure, katelu]
  - id: e08
    type: build_sentence
    source:
      ar_eg: الرسولين اتبارزوا.
      ar: تبارز الرسولان.
      en: The two messengers fought a duel.
    answer: Utusan loro iku padha tandhing.
    distractors: [aksara, babad]
    words: [utusan, tandhing]
  - id: e09
    type: translate
    direction: from_target
    source_text: Ing babad ana crita raja-raja Jawa.
    answers_meaning:
      ar_eg: [في الحوليات فيه حكايات ملوك جاوة, الحوليات فيها قصص ملوك جاوة]
      ar: [في الحوليات قصص ملوك جاوة, تحوي الحوليات قصص ملوك جاوة]
      en: [The chronicle has stories of Javanese kings, In the babad there are stories of the kings of Java]
    words: [babad]
  - id: e10
    type: speaking
    text: Sabanjure, Aji Saka nulis aksara.
    meaning:
      ar_eg: بعد كده، آجي ساكا كتب الحروف.
      ar: بعد ذلك كتب آجي ساكا الحروف.
      en: Then Aji Saka wrote the letters.
    words: [sabanjure, aksara]
dialogue:
  lines:
    - speaker: Mas Dimas
      text: Mohamed, kowe ngerti crita Aji Saka?
      ar_eg: يا محمد، تعرف حكاية آجي ساكا؟
      ar: يا محمد، أتعرف قصة آجي ساكا؟
      en: Mohamed, do you know the Aji Saka story?
    - speaker: Mohamed
      text: Sithik. Aji Saka duwe utusan loro, ta?
      ar_eg: شوية. آجي ساكا كان عنده رسولين، صح؟
      ar: قليلًا. كان لآجي ساكا رسولان، أليس كذلك؟
      en: A bit. Aji Saka had two messengers, right?
    - speaker: Mas Dimas
      text: 'Iya. Sembada nglakoni weling: keris aja diwenehake sapa wae.'
      ar_eg: 'أيوه. سيمبادا نفذ الوصية: الكريس مايتديش لحد.'
      ar: 'نعم. نفّذ سيمبادا الوصية: لا يُعطى الخنجر لأحد.'
      en: 'Yes. Sembada kept the order: give the keris to no one.'
    - speaker: Mohamed
      text: Sabanjure Dora arep njupuk keris...
      ar_eg: وبعدين دورا عايز ياخد الكريس...
      ar: ثم أراد دورا أخذ الكريس...
      en: Then Dora wanted to take the keris...
    - speaker: Mas Dimas
      text: Wong loro tandhing, lan padha mati. Mula ana 'ma ga ba tha nga'.
      ar_eg: الاتنين اتبارزوا وماتوا سوا. عشان كده فيه ma ga ba tha nga.
      ar: تبارز الاثنان وماتا معًا. لذلك توجد ma ga ba tha nga.
      en: The two fought and both died. That's why there's 'ma ga ba tha nga'.
    - speaker: Mohamed
      text: Oh, 'padha bathange'! Saiki aku ngerti.
      ar_eg: آه، «الاتنين بقوا جثث»! دلوقتي فهمت.
      ar: آه، «صارا جثتين»! الآن فهمت.
      en: Oh, 'both became corpses'! Now I get it.
