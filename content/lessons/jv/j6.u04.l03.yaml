schema: kabar.lesson/v1
id: j6.u04.l03
language: jv
title: Mlaku lan krama
can_do:
  ar_eg: تقرا الحروف المتجمّعة جوه المقطع الواحد (cakra، keret، pengkal).
  ar: أن تقرأ الحروف المتجمعة داخل المقطع (cakra، keret، pengkal).
  en: Read clusters inside a syllable (cakra, keret, pengkal).
slides:
  - title: Mlaku
    body:
      ar_eg: |
        ساعات الحرفين الساكنين بيبقوا في نفس المقطع: mlaku (يمشي) = mla + ku.
        نفس الحل: ꦩ وتحتها pasangan la: ꦩ꧀ꦭꦏꦸ.
      ar: |
        قد يجتمع ساكنان في مقطع واحد: mlaku (يمشي) = mla + ku.
        والحل نفسه: ꦩ وتحتها pasangan la: ꦩ꧀ꦭꦏꦸ.
      en: |
        Sometimes two consonants share one syllable: mlaku (walk) = mla + ku.
        Same solution: ꦩ with pasangan la below: ꦩ꧀ꦭꦏꦸ.
    grammar: jv.aksara.pasangan
    examples:
      - text: ꦩ꧀ꦭꦏꦸ (mlaku)
        ar_eg: يمشي
        ar: يمشي
        en: walk
  - title: Cakra, keret, pengkal
    body:
      ar_eg: |
        أشهر التجمّعات ليها علامات مخصوصة:
        - cakra: r جوه المقطع، علامة تحت الحرف: ꦏ ka ← ꦏꦿ kra. يعني ꦏꦿꦩ = krama.
        - keret: re بالـ pepet جوه المقطع.
        - pengkal: y جوه المقطع.
        cakra هي اللي هتشوفها كتير: ꦏꦿꦠꦺꦴꦤ꧀ Kraton، ꦥꦿꦩ꧀ꦧꦤꦤ꧀ Prambanan.
      ar: |
        ولأشهر التجمعات علامات خاصة:
        - cakra: r داخل المقطع، علامة تحت الحرف: ꦏ ka ← ꦏꦿ kra، فـ ꦏꦿꦩ = krama.
        - keret: re بالـ pepet داخل المقطع.
        - pengkal: y داخل المقطع.
        وأكثرها ورودًا cakra: ꦏꦿꦠꦺꦴꦤ꧀ Kraton، ꦥꦿꦩ꧀ꦧꦤꦤ꧀ Prambanan.
      en: |
        The commonest clusters have their own marks:
        - cakra: an r inside the syllable, a mark under the letter: ꦏ ka → ꦏꦿ kra. So ꦏꦿꦩ = krama.
        - keret: re with pepet inside the syllable.
        - pengkal: a y inside the syllable.
        Cakra is the one you'll see most: ꦏꦿꦠꦺꦴꦤ꧀ Kraton, ꦥꦿꦩ꧀ꦧꦤꦤ꧀ Prambanan.
    grammar: jv.aksara.pasangan
    examples:
      - text: ꦏꦿꦩ (krama)
        ar_eg: الكراما (مستوى الكلام المؤدب)
        ar: الكراما (مستوى الكلام المهذّب)
        en: krama (the polite speech level)
      - text: ꦥꦿꦩ꧀ꦧꦤꦤ꧀ (Prambanan)
        ar_eg: برامبانان — cakra، وبعدين pasangan ba
        ar: برامبانان — cakra، ثم pasangan ba
        en: Prambanan — cakra, then pasangan ba
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: cakra
        ar_eg: r جوه المقطع (kra)
        ar: r داخل المقطع (kra)
        en: an r inside the syllable (kra)
      - text: keret
        ar_eg: re بالـ pepet جوه المقطع
        ar: re بالـ pepet داخل المقطع
        en: re with pepet inside the syllable
      - text: pengkal
        ar_eg: y جوه المقطع
        ar: y داخل المقطع
        en: a y inside the syllable
      - text: ꦩ꧀ꦭꦏꦸ
        ar_eg: mlaku (يمشي)
        ar: mlaku (يمشي)
        en: mlaku (walk)
    words: [cakra, keret, pengkal]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: "اقرا: ꦏꦿꦩ"
      ar: "اقرأ: ꦏꦿꦩ"
      en: "Read: ꦏꦿꦩ"
    options: [karama, krama, kama]
    answer: 1
    explain:
      ar_eg: "العلامة اللي تحت ꦏ هي cakra = r جوه المقطع: kra-ma."
      ar: "العلامة تحت ꦏ هي cakra = r داخل المقطع: kra-ma."
      en: "The mark under ꦏ is cakra = r inside the syllable: kra-ma."
    words: [cakra]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي علامة بتكتب y جوه المقطع؟
      ar: أي علامة تكتب y داخل المقطع؟
      en: Which mark writes a y inside a syllable?
    options: [cakra, keret, pengkal]
    answer: 2
    words: [pengkal]
    explain:
      ar_eg: pengkal ꦾ بتكتب y جوّه المقطع. cakra ꦿ لـ r، وkeret ꦽ لـ re.
      ar: pengkal ꦾ تكتب y داخل المقطع. أما cakra ꦿ فلـ r، وkeret ꦽ لـ re.
      en: pengkal ꦾ writes y inside a syllable. cakra ꦿ is r and keret ꦽ is re.
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي علامة بتكتب re بالـ pepet جوه المقطع؟
      ar: أي علامة تكتب re بالـ pepet داخل المقطع؟
      en: Which mark writes re with pepet inside a syllable?
    options: [keret, cakra, layar]
    answer: 0
    words: [keret]
    explain:
      ar_eg: keret ꦽ = re بالـ pepet جوّه المقطع. cakra = r من غير pepet، وlayar = r في الآخر.
      ar: keret ꦽ تعني re بالـ pepet داخل المقطع. أما cakra فـ r بلا pepet، وlayar فـ r الأخيرة.
      en: keret ꦽ is re with pepet inside a syllable. cakra is r without pepet and layar is final r.
  - id: e05
    type: listen
    text: Prambanan
    question:
      ar_eg: سمعت اسم مكان. بيتكتب إزاي؟
      ar: سمعت اسم مكان. كيف يُكتب؟
      en: You heard a place name. How is it written?
    options: ["ꦥꦫꦩ꧀ꦧꦤꦤ꧀", "ꦥꦿꦩ꧀ꦧꦤꦤ꧀", "ꦥꦿꦧꦤꦤ꧀"]
    answer: 1
    meaning:
      ar_eg: برامبانان
      ar: برامبانان
      en: Prambanan
    words: [cakra]
  - id: e06
    type: fill_blank
    sentence: ꦥꦸꦠꦿ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: ابن، krama inggil)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: ابن، krama inggil)"
      en: Type the reading in Latin letters. (It means "son / child", krama inggil.)
    answers: [putra]
    words: [cakra]
    explain:
      ar_eg: بالترتيب ꦥꦸ pu + ꦠꦿ tra (ta + cakra) = putra.
      ar: ꦥꦸ pu + ꦠꦿ tra (ta مع cakra) = putra.
      en: ꦥꦸ pu + ꦠꦿ tra (ta plus cakra) = putra.
  - id: e07
    type: fill_blank
    sentence: Re ing tengah wanda ditulis nganggo ___.
    meaning:
      ar_eg: re بالـ pepet جوه المقطع (wanda = مقطع) بتتكتب بـ keret.
      ar: تُكتب re بالـ pepet داخل المقطع (wanda = مقطع) بـ keret.
      en: Re (with pepet) inside a syllable (wanda) is written with keret.
    options: [pengkal, keret, cakra]
    answers: [keret]
    words: [keret, pengkal]
    explain:
      ar_eg: re (بالـ pepet) جوّه المقطع = keret. pengkal لـ y، وcakra لـ r من غير pepet.
      ar: re بالـ pepet داخل المقطع = keret. أما pengkal فلـ y، وcakra لـ r بلا pepet.
      en: re with pepet inside a syllable is keret. pengkal is for y and cakra for r without pepet.
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦲꦏꦸꦩ꧀ꦭꦏꦸꦩꦼꦚꦁꦏꦿꦠꦺꦴꦤ꧀"
      ar: "اكتب بالحروف اللاتينية: ꦲꦏꦸꦩ꧀ꦭꦏꦸꦩꦼꦚꦁꦏꦿꦠꦺꦴꦤ꧀"
      en: "Write in Latin letters: ꦲꦏꦸꦩ꧀ꦭꦏꦸꦩꦼꦚꦁꦏꦿꦠꦺꦴꦤ꧀"
    answers: [aku mlaku menyang Kraton, akumlakumenyangkraton]
    explain:
      ar_eg: a-ku m(pasangan la)-ku me-nyang kra(cakra)-ton = أنا ماشي للقصر.
      ar: a-ku m(pasangan la)-ku me-nyang kra(cakra)-ton = أمشي إلى القصر.
      en: a-ku m(pasangan la)-ku me-nyang kra(cakra)-ton = I'm walking to the Kraton.
    words: [cakra]
  - id: e09
    type: build_sentence
    source:
      ar_eg: ابني «mlaku menyang Kraton» مقطع مقطع.
      ar: ركّب «mlaku menyang Kraton» مقطعًا مقطعًا.
      en: Build "mlaku menyang Kraton", syllable by syllable.
    answer: ꦩ꧀ꦭ ꦏꦸ ꦩꦼ ꦚꦁ ꦏꦿ ꦠꦺꦴꦤ꧀
    distractors: ["ꦏ"]
    words: [cakra]
    explain:
      ar_eg: "Kraton فيها r جوّه المقطع: ꦏꦿ (ka + cakra). ꦏ لوحدها = ka من غير r."
      ar: "Kraton فيها r داخل المقطع: ꦏꦿ (ka مع cakra). أما ꦏ وحدها فـ ka بلا r."
      en: "Kraton has r inside the syllable: ꦏꦿ (ka plus cakra). ꦏ alone is ka with no r."
dialogue:
  title: Mlaku-mlaku
  lines:
    - speaker: Mohamed
      text: Mas, krama ditulis nganggo cakra, ya?
      ar_eg: يا ديماس، krama بتتكتب بـ cakra، صح؟
      ar: يا ديماس، krama تُكتب بـ cakra، أليس كذلك؟
      en: Mas, krama is written with cakra, right?
    - speaker: Dimas
      text: Iya. Kaya Kraton lan Prambanan.
      ar_eg: أيوه. زي Kraton وPrambanan.
      ar: نعم. مثل Kraton وPrambanan.
      en: Yes. Like Kraton and Prambanan.
    - speaker: Mohamed
      text: Lan mlaku?
      ar_eg: وmlaku؟
      ar: وmlaku؟
      en: And mlaku?
    - speaker: Dimas
      text: Mlaku nganggo pasangan la. Ayo mlaku-mlaku wae!
      ar_eg: mlaku بـ pasangan la. يلا نتمشّى!
      ar: mlaku بـ pasangan la. هيا نتمشّى!
      en: Mlaku uses pasangan la. Let's go for a walk!
new_words:
  - word: cakra
    pos: noun
    ar_eg: "علامة r جوه المقطع (تحت الحرف): kra، pra"
    ar: "علامة r داخل المقطع (تحت الحرف): kra، pra"
    en: "the mark for an r inside a syllable (under the letter): kra, pra"
  - word: keret
    pos: noun
    ar_eg: علامة re بالـ pepet جوه المقطع
    ar: علامة re بالـ pepet داخل المقطع
    en: the mark for re with pepet inside a syllable
  - word: pengkal
    pos: noun
    ar_eg: علامة y جوه المقطع
    ar: علامة y داخل المقطع
    en: the mark for a y inside a syllable
review:
  status: draft
  verified: false
