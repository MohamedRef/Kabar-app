schema: kabar.lesson/v1
id: j3.u03.l02
language: jv
title: Mboten lan wonten
can_do:
  ar_eg: تنفي وتقول «فيه» بالكراما.
  ar: أن تنفي وتقول «يوجد» بالكراما.
  en: Negate and say there is, in krama.
slides:
  - title: Ora → mboten
    body:
      ar_eg: |
        النفي في الـ ngoko ora (أو ra في الشات). في الكراما: mboten = tidak.
        وmboten لوحدها كمان معناها «لأ» بأدب.
        - Aku ora ngerti ← Kula mboten ngertos. (ngerti ← ngertos = mengerti)
        جملة ذهبية لأي حد بيتعلم: «Nyuwun sewu, kula mboten ngertos.» = «لا مؤاخذة، أنا مش فاهم».
      ar: |
        النفي في الـ ngoko بـ ora (وفي الدردشة ra)، وفي الكراما mboten = tidak، وmboten وحدها تعني «لا» بأدب.
        - Aku ora ngerti ← Kula mboten ngertos. (ngerti ← ngertos = mengerti)
        وجملة ذهبية لكل متعلم: «Nyuwun sewu, kula mboten ngertos.» = «عفوًا، لا أفهم».
      en: |
        Ngoko negates with ora (ra in chats). Krama uses mboten = tidak, and mboten alone is a polite "no".
        - Aku ora ngerti → Kula mboten ngertos. (ngerti → ngertos = mengerti)
        A golden line for every learner: "Nyuwun sewu, kula mboten ngertos." = "Excuse me, I don't understand."
    grammar: jv.krama.function-words
    examples:
      - text: Nyuwun sewu, kula mboten ngertos.
        ar_eg: لا مؤاخذة، أنا مش فاهم.
        ar: عفوًا، لا أفهم.
        en: Excuse me, I don't understand.
  - title: Ana → wonten
    body:
      ar_eg: |
        ana = ada = «فيه / موجود». بالكراما: wonten.
        - Wonten batik? = فيه باتيك؟
        - Bapak wonten? = بابا (الأستاذ) موجود؟
        - Mboten wonten. = مش موجود / مفيش.
        mboten + wonten = tidak ada، زي ora ana في الـ ngoko.
      ar: |
        ana = ada = «يوجد / موجود»، وبالكراما wonten:
        - Wonten batik? = هل يوجد باتيك؟
        - Bapak wonten? = هل الوالد موجود؟
        - Mboten wonten. = غير موجود / لا يوجد.
        mboten + wonten = tidak ada، مثل ora ana في الـ ngoko.
      en: |
        ana = ada = there is / be in. In krama: wonten.
        - Wonten batik? = Is there batik?
        - Bapak wonten? = Is your father (or the gentleman) in?
        - Mboten wonten. = He isn't / there isn't.
        mboten + wonten = tidak ada, like ngoko ora ana.
    grammar: jv.krama.function-words
    examples:
      - text: Bapak wonten? — Mboten wonten.
        ar_eg: بابا موجود؟ — لأ، مش موجود.
        ar: هل الوالد موجود؟ — لا، ليس موجودًا.
        en: Is your father in? — No, he isn't.
      - text: Wonten batik, Pak?
        ar_eg: فيه باتيك يا عم؟
        ar: هل يوجد باتيك يا سيدي؟
        en: Do you have batik, sir?
  - title: Saking, dhateng, kaliyan
    body:
      ar_eg: |
        حروف الجر كمان بتلبس كراما:
        - saka ← saking (dari) = من
        - neng ← dhateng (ke) = لـ
        - karo ← kaliyan (dengan) = مع
        - uga ← ugi (juga) = كمان
      ar: |
        وحروف الجر أيضًا لها كراما:
        - saka ← saking (dari) = من
        - neng ← dhateng (ke) = إلى
        - karo ← kaliyan (dengan) = مع
        - uga ← ugi (juga) = أيضًا
      en: |
        Prepositions put on krama too:
        - saka → saking (dari) = from
        - neng → dhateng (ke) = to
        - karo → kaliyan (dengan) = with
        - uga → ugi (juga) = also
    grammar: jv.krama.function-words
    examples:
      - text: Kula dhateng Kauman kaliyan Mas Dimas.
        ar_eg: أنا رايح كاومان مع دِيماس.
        ar: أذهب إلى كاومان مع ديماس.
        en: I'm going to Kauman with Dimas.
      - text: Kula ugi saking Kairo.
        ar_eg: أنا كمان من القاهرة.
        ar: أنا أيضًا من القاهرة.
        en: I'm from Cairo too.
  - title: Iya → inggih, iki → menika
    body:
      ar_eg: |
        وآخر اتنين:
        - iya ← inggih (ya) = أيوه. لما حد كبير بيكلمك ومش فاهم كل حاجة، «Inggih» بأدب بتنقذك.
        - iki ← menika (ini)، وفي الكلام niki. Menika batik Kauman = ده باتيك من كاومان.
      ar: |
        وآخر لفظين:
        - iya ← inggih (ya) = نعم. وإذا كلمك كبير ولم تفهم كل شيء فـ«Inggih» المهذبة تنقذك.
        - iki ← menika (ini)، وفي الكلام niki: Menika batik Kauman = هذا باتيك من كاومان.
      en: |
        Last two:
        - iya → inggih (ya) = yes. When an elder talks to you and you don't catch everything, a polite "Inggih" carries you through.
        - iki → menika (ini), spoken niki. Menika batik Kauman = This is Kauman batik.
    grammar: jv.krama.function-words
    examples:
      - text: Inggih, menika batik Kauman.
        ar_eg: أيوه، ده باتيك كاومان.
        ar: نعم، هذا باتيك من كاومان.
        en: Yes, this is Kauman batik.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ora
        ar_eg: بالكراما mboten
        ar: بالكراما mboten
        en: in krama → mboten
      - text: ana
        ar_eg: بالكراما wonten
        ar: بالكراما wonten
        en: in krama → wonten
      - text: karo
        ar_eg: بالكراما kaliyan
        ar: بالكراما kaliyan
        en: in krama → kaliyan
      - text: uga
        ar_eg: بالكراما ugi
        ar: بالكراما ugi
        en: in krama → ugi
      - text: iki
        ar_eg: بالكراما menika
        ar: بالكراما menika
        en: in krama → menika
    words: [mboten, wonten, kaliyan, ugi, menika, uga]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: البياع الكبير بيتكلم بسرعة وإنت مش فاهم. تقول إيه؟
      ar: البائع المسنّ يتكلم بسرعة ولا تفهم. ماذا تقول؟
      en: The older seller speaks fast and you don't understand. What do you say?
    options: [Aku ora ngerti., 'Nyuwun sewu, kula mboten ngertos.', Kula ora ngertos.]
    answer: 1
    explain:
      ar_eg: 'كراما كاملة: kula + mboten + ngertos. التالتة فيها ora (ngoko) في وسط جملة كراما.'
      ar: 'كراما كاملة: kula + mboten + ngertos، والثالثة فيها ora من الـ ngoko وسط جملة كراما.'
      en: Full krama — kula + mboten + ngertos. The third mixes in ngoko ora.
    words: [mboten, ngertos, nyuwun sewu]
  - id: e03
    type: listen
    text: Kula ugi mboten ngertos.
    options: [Kula ugi mboten ngertos., Aku uga ora ngerti., Kula mboten wonten.]
    answer: 0
    words: [ugi, mboten, ngertos, uga]
  - id: e04
    type: fill_blank
    sentence: Kula dhateng peken ___ Mas Dimas.
    meaning:
      ar_eg: أنا رايح السوق مع دِيماس.
      ar: أذهب إلى السوق مع ديماس.
      en: I'm going to the market with Mas Dimas.
    options: [karo, ugi, kaliyan]
    answers: [kaliyan]
    explain:
      ar_eg: «مع» بالكراما kaliyan. karo هي الـ ngoko، وugi = كمان.
      ar: «مع» بالكراما kaliyan، وkaro من الـ ngoko، وugi = أيضًا.
      en: Krama "with" is kaliyan; karo is ngoko, and ugi = also.
    words: [kaliyan]
  - id: e05
    type: build_sentence
    source:
      ar_eg: لا مؤاخذة، فيه باتيك؟
      ar: عفوًا، هل يوجد باتيك؟
      en: Excuse me, is there batik?
    answer: Nyuwun sewu, wonten batik?
    distractors: [ana, mboten]
    words: [nyuwun sewu, wonten]
    explain:
      ar_eg: wonten = فيه (كراما). ana نفس المعنى نغوكو، وmboten = لأ.
      ar: wonten تعني يوجد (كراما). أما ana فبالمعنى نفسه نغوكو، وmboten لا.
      en: wonten is "is there" (krama). ana means the same in ngoko, and mboten is "no".
  - id: e06
    type: speaking
    text: Nyuwun sewu, kula mboten ngertos.
    meaning:
      ar_eg: لا مؤاخذة، أنا مش فاهم.
      ar: عفوًا، لا أفهم.
      en: Excuse me, I don't understand.
    words: [nyuwun sewu, mboten, ngertos]
  - id: e07
    type: multiple_choice
    question: uga
    question_meaning:
      ar_eg: إيه الكراما بتاعة uga؟
      ar: ما نظير uga في الكراما؟
      en: What's the krama for uga?
    options: [ugi, kaliyan, wonten]
    answer: 0
    explain:
      ar_eg: karo ← kaliyan (مع). uga ← ugi (كمان). ana ← wonten (فيه).
      ar: karo ← kaliyan (مع)، uga ← ugi (أيضًا)، ana ← wonten (يوجد).
      en: karo → kaliyan (with); uga → ugi (also); ana → wonten (there is).
    words: [kaliyan, ugi, uga]
dialogue:
  title: Toko batik ing Kauman
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Pak. Wonten batik Kauman?
      ar_eg: لا مؤاخذة يا عم. فيه باتيك كاومان؟
      ar: عفوًا يا سيدي. هل يوجد باتيك كاومان؟
      en: Excuse me, sir. Do you have Kauman batik?
    - speaker: Pak Harjo
      text: "Wonten, Mas. Niki."
      ar_eg: "فيه يا أستاذ. أهو."
      ar: "نعم. ها هو."
      en: "Sure. Here."
    - speaker: Pak Harjo
      text: "Mase saking Jakarta?"
      ar_eg: "حضرتك من جاكرتا؟"
      ar: "هل أنت من جاكرتا؟"
      en: "You from Jakarta?"
    - speaker: Mohamed
      text: Mboten, Pak. Kula saking Mesir.
      ar_eg: لأ يا عم. أنا من مصر.
      ar: لا يا سيدي. أنا من مصر.
      en: No, sir. I'm from Egypt.
    - speaker: Pak Harjo
      text: Wah, saking Mesir! Sugeng rawuh ing Kauman, Mas.
      ar_eg: الله، من مصر! أهلًا بيك في كاومان.
      ar: ما شاء الله، من مصر! أهلًا بك في كاومان.
      en: Oh, from Egypt! Welcome to Kauman.
    - speaker: Mohamed
      text: Matur nuwun, Pak.
      ar_eg: شكرًا يا عم.
      ar: شكرًا يا سيدي.
      en: Thank you, sir.
new_words:
  - word: ngertos
    pos: verb
    ar_eg: يفهم (krama لـ ngerti) = mengerti
    ar: يفهم (krama لـ ngerti) = mengerti
    en: understand (krama for ngerti) = mengerti
  - word: kaliyan
    pos: preposition
    ar_eg: مع (krama لـ karo) = dengan
    ar: مع (krama لـ karo) = dengan
    en: with, and (krama for karo) = dengan
  - word: ugi
    pos: adverb
    ar_eg: كمان (krama لـ uga) = juga
    ar: أيضًا (krama لـ uga) = juga
    en: also (krama for uga) = juga
  - word: nyuwun sewu
    pos: phrase
    ar_eg: لا مؤاخذة / بعد إذنك (krama) = permisi
    ar: عفوًا / بعد إذنك (krama) = permisi
    en: excuse me (krama) = permisi
