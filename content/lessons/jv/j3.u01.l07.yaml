    meaning:
      ar_eg: أختي الصغيرة لسه مكسوفة.
      ar: أختي الصغرى ما زالت خجلانة.
      en: My little sister is still shy.
    words: [adhik, lingsem]
  - id: e10
    type: multiple_choice
    question: isin (ngoko) → ___ (krama)
    options: [bingah, lingsem, cariyos]
    answer: 1
    explain:
      ar_eg: 'isin بالنغوكو، lingsem بالكراما: مكسوف. bingah = مبسوط، cariyos = حكاية.'
      ar: 'isin بالنغوكو وlingsem بالكراما: خجلان. bingah = سعيد، cariyos = قصة.'
      en: 'isin is ngoko, lingsem is krama: shy. bingah = glad, cariyos = story.'
    words: [lingsem, bingah, cariyos, gumun]
dialogue:
  lines:
    - speaker: Mbah Putri
      text: Nak Mohamed, Dimas sampun cariyos bab sampeyan.
      ar_eg: يا ابني محمد، ديماس حكى لي عنك.
      ar: يا بنيّ محمد، حدّثني ديماس عنك.
      en: Mohamed, dear, Dimas has told me about you.
    - speaker: Mohamed
      text: Nggih, Eyang. Kula bingah sanget saged pinanggih.
      ar_eg: أيوه يا جدّتي. أنا مبسوط أوي إني قابلتك.
      ar: نعم يا جدّتي. أنا سعيد جدًا بلقائك.
      en: Yes, Grandma. I'm so glad to meet you.
    - speaker: Mbah Putri
      text: Niki rayinipun Dimas. Kok namung mesem, Nduk?
      ar_eg: ودي أخت ديماس الصغيرة. بتبتسمي وبس ليه يا بنتي؟
      ar: وهذه أخت ديماس الصغرى. لماذا تكتفين بالابتسام يا ابنتي؟
      en: This is Dimas's little sister. Why are you only smiling, love?
    - speaker: Mas Dimas
      text: Adhikku isih lingsem, Med. Ora apa-apa.
      ar_eg: أختي لسه مكسوفة يا مِد. عادي.
      ar: أختي ما زالت خجلانة يا مِد. لا بأس.
      en: My little sister's still shy, Med. It's fine.
    - speaker: Mohamed
      text: Kula gumun, Eyang taksih mangertos basa Arab sekedhik!
      ar_eg: أنا مستغرب إن حضرتك لسه فاهمة شوية عربي يا جدّتي!
      ar: أنا مندهش أنك ما زلت تفهمين قليلًا من العربية يا جدّتي!
      en: I'm amazed, Grandma, you still understand a little Arabic!
