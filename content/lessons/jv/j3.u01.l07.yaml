    words: [eyang, cariyos]
  - id: e08
    type: translate
    direction: from_target
    source_text: Kula gumun, Eyang mangertos basa Arab.
    answers_meaning:
      ar_eg: [أنا مستغرب إن جدّتي فاهمة عربي, أنا منبهر، جدّتي بتفهم عربي]
      ar: [أنا مندهش، جدّتي تفهم العربية, أدهشني أن جدّتي تفهم العربية]
      en: ['I''m amazed, Grandma understands Arabic', 'I''m amazed that Grandma understands Arabic']
    words: [gumun, mangertos, eyang]
  - id: e09
