    question:
      ar_eg: محمد حاسس بإيه؟
      ar: بماذا يشعر محمد؟
      en: How does Mohamed feel?
    options: [أنا مبسوط أوي يا جدّتي, أنا تعبان أوي يا جدّتي, أنا مكسوف أوي يا جدّتي]
    answer: 0
    meaning:
      ar_eg: أنا مبسوط أوي يا جدّتي.
      ar: أنا سعيد جدًا يا جدّتي.
      en: I'm so glad, Grandma.
    words: [bingah, eyang, lingsem]
  - id: e04
    type: fill_blank
    sentence: Rayinipun Mas Dimas taksih ___, mlebet kamar terus.
    meaning:
      ar_eg: أخت ديماس الصغيرة لسه ___، دخلت الأوضة على طول.
      ar: أخت ديماس الصغرى ما زالت ___، دخلت الغرفة فورًا.
      en: Mas Dimas's little sister is still ___, she went straight into her room.
    options: [lingsem, bingah, gumun]
    answers: [lingsem]
    words: [lingsem, rayi, bingah, gumun]
  - id: e05
    type: multiple_choice
    question: adhik (ngoko) → ___ (krama)
    options: [rayi, eyang, cariyos]
    answer: 0
    explain:
      ar_eg: 'adhik بالنغوكو، rayi بالكراما: الاتنين يعني أخ أو أخت أصغر.'
      ar: adhik بالنغوكو وrayi بالكراما، وكلاهما يعني الأخ أو الأخت الأصغر.
      en: 'adhik is ngoko and rayi is krama: both mean younger sibling.'
    words: [rayi, adhik, eyang, cariyos]
  - id: e06
