schema: kabar.lesson/v1
id: j3.u01.l07
language: jv
title: Eyang lan rayi
can_do:
  ar_eg: 'تقابل جدّة صاحبك وأخته الصغيرة: تقول إنك مبسوط وفهمت، وتحكي إنك مستغرب، وتعرف تقول مكسوف.'
  ar: 'أن تقابل جدّة صديقك وأخته الصغرى: تقول إنك سعيد وفهمت، وتعبّر عن دهشتك، وتعرف كلمة الخجل.'
  en: 'Meet a friend''s grandmother and little sister: say you''re glad and you understand, show surprise, and say shy.'
slides:
  - title: Ngoko → krama ing kulawarga
    body:
      ar_eg: |
        eyang = جدّ أو جدّة، أشيك واحترم من mbah. في جوجا كتير بيقولوا «Eyang» للكبار في العيلة.
        adhik = أخ أو أخت أصغر (نغوكو). ← بالكراما: rayi. «rayi kula» = أخويا/أختي الصغيرة.
        crita ← cariyos = حكاية، يحكي. seneng ← bingah = مبسوط، فرحان.
        isin ← lingsem = مكسوف. ngerti ← mangertos = فاهم، يفهم.
        gumun = مستغرب ومنبهر: «Aku gumun!» = أنا مش مصدّق!
      ar: |
        eyang = جدّ أو جدّة، وهي أرقى وأكثر احترامًا من mbah. في جوكجاكرتا يقولون «Eyang» لكبار العائلة كثيرًا.
        adhik = أخ أو أخت أصغر (نغوكو). ← بالكراما: rayi. «rayi kula» = أخي أو أختي الصغرى.
        crita ← cariyos = قصة، يحكي. seneng ← bingah = سعيد، فرِح.
        isin ← lingsem = خجلان. ngerti ← mangertos = يفهم.
        gumun = مندهش ومعجب: «Aku gumun!» = لا أصدّق!
      en: |
        eyang = grandparent, more respectful than mbah. In Jogja people often say "Eyang" for the elders of the family.
        adhik = younger brother or sister (ngoko) → in krama: rayi. "rayi kula" = my younger sibling.
        crita → cariyos = story, tell. seneng → bingah = glad, happy.
        isin → lingsem = shy, embarrassed. ngerti → mangertos = understand.
        gumun = amazed, can't believe it: "Aku gumun!" = wow, I can't believe it!
    examples:
      - text: Eyang, menika rayi kula.
        ar_eg: يا جدّتي، دي أختي الصغيرة.
        ar: يا جدّتي، هذه أختي الصغرى.
        en: Grandma, this is my little sister.
      - text: Kula bingah sanget, Eyang.
        ar_eg: أنا مبسوط أوي يا جدّتي.
        ar: أنا سعيد جدًا يا جدّتي.
        en: I'm so glad, Grandma.
      - text: Aku gumun, Mas!
        ar_eg: مش مصدّق يا عم!
        ar: أنا مندهش يا أخي!
        en: Wow, I can't believe it!
