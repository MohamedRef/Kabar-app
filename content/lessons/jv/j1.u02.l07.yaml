  - id: e09
    type: translate
    direction: from_target
    source_text: Kowe nyambut gawe neng ngendi?
    answers_meaning:
      ar_eg: [بتشتغل فين؟, إنت شغال فين؟]
      ar: [أين تعمل؟, أين تشتغل؟]
      en: ['Where do you work?', 'Where are you working?']
    words: [nyambut gawe]
  - id: e10
    type: speaking
    text: Ayo ngopi neng kene, Mas!
    meaning:
      ar_eg: يلا نشرب قهوة هنا يا ماس!
      ar: هيا نشرب القهوة هنا يا أخي!
      en: Let's have coffee here, Mas!
    words: [ngopi, kene]
dialogue:
  lines:
    - speaker: Mas Yudha
      text: Mohamed, ayo ngopi neng kene!
      ar_eg: يا محمد، يلا نشرب قهوة هنا!
      ar: يا محمد، هيا نشرب القهوة هنا!
      en: Mohamed, let's have coffee here!
    - speaker: Mohamed
      text: Ayo, Mas. Aku ngombe kopi joss.
      ar_eg: يلا يا ماس. أنا هشرب كوبي جوس.
      ar: هيا يا أخي. سأشرب kopi joss.
      en: Sure, Mas. I'll have a kopi joss.
    - speaker: Mas Yudha
      text: Kowe teka saka ngendi? Numpak apa?
      ar_eg: إنت جاي منين؟ ركبت إيه؟
      ar: من أين أتيت؟ بماذا ركبت؟
      en: Where have you come from? How did you get here?
    - speaker: Mohamed
      text: Saka Tugu, Mas. Numpak becak.
      ar_eg: من توجو يا ماس. ركبت بيتشاك.
      ar: من توجو يا أخي. ركبت البيتشاك.
      en: From Tugu, Mas. I took a becak.
    - speaker: Mas Yudha
      text: Wah, padha karo aku!
      ar_eg: واو، زيي بالظبط!
      ar: رائع، مثلي تمامًا!
      en: Wow, same as me!
    - speaker: Mohamed
      text: Mas Yudha nyambut gawe neng kene, ta?
      ar_eg: ماس يودها بيشتغل هنا، صح؟
      ar: ماس يودها يعمل هنا، أليس كذلك؟
      en: You work here, don't you, Mas Yudha?
