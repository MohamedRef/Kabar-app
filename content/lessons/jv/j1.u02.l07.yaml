  - id: e08
    type: build_sentence
    source:
      ar_eg: صاحبي بيشتغل في يوجيا.
      ar: صديقي يعمل في يوجياكرتا.
      en: My friend works in Jogja.
    answer: Kancaku nyambut gawe neng Jogja.
    distractors: [ngombe, kene]
