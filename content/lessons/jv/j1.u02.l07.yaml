schema: kabar.lesson/v1
id: j1.u02.l07
language: jv
title: Ngopi neng kene
can_do:
  ar_eg: تعزم حد على قهوة، وتسأل جاي منين وركب إيه، وتقول بيشتغل فين.
  ar: أن تدعو أحدًا إلى القهوة، وتسأله من أين جاء وبماذا ركب، وأين يعمل.
  en: Invite someone for coffee, ask where they came from and how, and where they work.
slides:
  - title: Warung kopi cedhak Tugu
    body:
      ar_eg: |
        - **ngopi** = يشرب قهوة ويقعد يدردش (ngopi) · **ngombe** = يشرب (minum)
        - **kene** = هنا: neng kene = هنا (di sini)
        - **teka** = ييجي / يوصل (datang): teka saka ngendi? = جاي منين؟
        - **numpak** = يركب (naik): numpak becak = يركب بيتشاك
        - **nyambut gawe** = يشتغل (bekerja) · **padha** = زي بعض (sama): padha karo aku = زيي
      ar: |
        - **ngopi** = يشرب القهوة ويتسامر (ngopi) · **ngombe** = يشرب (minum)
        - **kene** = هنا: neng kene = هنا (di sini)
        - **teka** = يأتي / يصل (datang): teka saka ngendi? = من أين أتيت؟
        - **numpak** = يركب (naik): numpak becak = يركب البيتشاك
        - **nyambut gawe** = يعمل (bekerja) · **padha** = متشابه (sama): padha karo aku = مثلي
      en: |
        - **ngopi** = have coffee and hang out (ngopi) · **ngombe** = drink (minum)
        - **kene** = here: neng kene = here (di sini)
        - **teka** = come, arrive (datang): teka saka ngendi? = where have you come from?
        - **numpak** = ride, take (naik): numpak becak = take a becak
        - **nyambut gawe** = work (bekerja) · **padha** = the same (sama): padha karo aku = same as me
    examples:
      - text: Ayo ngopi neng kene!
        ar_eg: يلا نشرب قهوة هنا!
        ar: هيا نشرب القهوة هنا!
        en: Let's have coffee here!
      - text: Aku numpak becak saka Tugu.
        ar_eg: ركبت بيتشاك من توجو.
        ar: ركبت البيتشاك من توجو.
        en: I took a becak from Tugu.
      - text: Kancaku nyambut gawe neng Jogja.
        ar_eg: صاحبي بيشتغل في يوجيا.
        ar: صديقي يعمل في يوجياكرتا.
        en: My friend works in Jogja.
