    question_meaning:
      ar_eg: معناها إيه؟
      ar: ما معناها؟
      en: What does it mean?
    options: [اسمي واسمك زي بعض, اسمي أطول من اسمك, اسمك حلو]
    answer: 0
    explain:
      ar_eg: padha = زي بعض.
      ar: padha = متشابه.
      en: padha = the same.
