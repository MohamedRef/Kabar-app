    words: [teka, padha, numpak]
  - id: e06
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة معناها «هنا»؟
      ar: أيّ كلمة تعني «هنا»؟
      en: Which word means "here"?
    options: [kene, padha, ngopi]
    answer: 0
    explain:
      ar_eg: kene = هنا. padha = زي بعض، وngopi = يشرب قهوة.
      ar: kene = هنا، أما padha فمتشابه وngopi يشرب القهوة.
      en: kene = here. padha = the same, ngopi = have coffee.
    words: [kene, padha, ngopi]
