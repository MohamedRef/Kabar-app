schema: kabar.lesson/v1
id: j6.u03.l12
language: jv
title: Paribasan
can_do:
  ar_eg: تقرا مثلين جاويين مشهورين بالخط الجاوي وتفهمهم.
  ar: أن تقرأ مثلين جاويين مشهورين بالخط الجاوي وتفهمهما.
  en: Read and understand two well-known Javanese sayings in aksara Jawa.
slides:
  - title: Paribasan Jawa
    body:
      ar_eg: |
        على حيطة في كوتاغيدي فيه أمثال جاوية (paribasan) مكتوبة بالخط الجاوي.
        الأول: «قيمة الإنسان من لسانه، وقيمة جسمه من لبسه». aji = قيمة، وajining = قيمة الـ…؛ lathi = الشفايف، يعني الكلام اللي بيطلع منها؛ raga = الجسم.
        التاني: «Ana rega ana rupa» = على قد فلوسك تاخد جودة (زي «الغالي تمنه فيه»).
      ar: |
        على جدار في كوتاغيدي أمثال جاوية (paribasan) بالخط الجاوي.
        الأول: «قيمة المرء في لسانه، وقيمة جسده في لباسه». aji = قيمة، وajining = قيمةُ…؛ lathi = الشفتان، أي الكلام؛ raga = الجسد.
        الثاني: «Ana rega ana rupa» = الجودة على قدر الثمن.
      en: |
        On a wall in Kotagede, Javanese sayings (paribasan) are written in aksara Jawa.
        The first: "your worth lies in your words; your body's worth in your clothes". aji = worth, ajining = the worth of; lathi = lips, i.e. what you say; raga = body.
        The second: "Ana rega ana rupa" = you get what you pay for.
    grammar: jv.aksara.panyigeg
    examples:
      - text: ꦲꦗꦶꦤꦶꦁꦝꦶꦫꦶꦱꦏꦭꦛꦶ꧈ (Ajining dhiri saka lathi,)
        ar_eg: قيمة الإنسان من كلامه،
        ar: قيمة المرء من كلامه،
        en: one's worth comes from one's words,
      - text: ꦲꦗꦶꦤꦶꦁꦫꦒꦱꦏꦧꦸꦱꦤ꧉ (ajining raga saka busana.)
        ar_eg: وقيمة الجسم من اللبس.
        ar: وقيمة الجسد من اللباس.
        en: the body's worth from its clothes.
      - text: ꦲꦤꦉꦒꦲꦤꦫꦸꦥ꧉ (Ana rega ana rupa.)
        ar_eg: على قد السعر تكون الجودة.
        ar: الجودة على قدر الثمن.
        en: You get what you pay for.
exercises:
  - id: e01
    type: multiple_choice
    question_meaning:
      ar_eg: حسب المثل الأول، قيمة الإنسان بتيجي من إيه؟
      ar: بحسب المثل الأول، من أين تأتي قيمة المرء؟
      en: According to the first saying, where does a person's worth come from?
    options: [saka busana, saka lathi, saka rega]
    answer: 1
    explain:
      ar_eg: ajining dhiri saka lathi = قيمة الإنسان من كلامه.
      ar: ajining dhiri saka lathi = قيمة المرء من كلامه.
      en: ajining dhiri saka lathi = your worth comes from your words.
    words: [aji, lathi]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: وقيمة الجسم بتيجي من إيه؟
      ar: ومن أين تأتي قيمة الجسد؟
      en: And the body's worth comes from what?
    options: [saka busana, saka lathi, saka sega]
    answer: 0
    words: [raga, busana]
  - id: e03
    type: listen
    text: Ana rega ana rupa.
    question:
      ar_eg: سمعت أنهي مثل؟
      ar: أي مثل سمعت؟
      en: Which saying did you hear?
    options: ["ꦲꦗꦶꦤꦶꦁꦫꦒꦱꦏꦧꦸꦱꦤ꧉", "ꦲꦤꦉꦒꦲꦤꦫꦸꦥ꧉", "ꦲꦗꦶꦤꦶꦁꦝꦶꦫꦶꦱꦏꦭꦛꦶ꧉"]
    answer: 1
    meaning:
      ar_eg: على قد السعر تكون الجودة.
      ar: الجودة على قدر الثمن.
      en: You get what you pay for.
  - id: e04
    type: match_pairs
    pairs:
      - text: aji
        ar_eg: قيمة (ajining = قيمة الـ…)
        ar: قيمة (ajining = قيمةُ…)
        en: worth, value (ajining = the worth of)
      - text: lathi
        ar_eg: الشفايف؛ الكلام اللي بتقوله
        ar: الشفتان؛ الكلام
        en: lips; what you say
      - text: raga
        ar_eg: الجسم
        ar: الجسد
        en: body
      - text: rupa
        ar_eg: شكل / جودة
        ar: هيئة / جودة
        en: look, quality
    words: [aji, lathi, raga]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: "في ꦲꦗꦶꦤꦶꦁ، الـ ng في الآخر بتتكتب بإيه؟"
      ar: "في ꦲꦗꦶꦤꦶꦁ، بأي علامة تُكتب ng الأخيرة؟"
      en: "In ꦲꦗꦶꦤꦶꦁ, how is the final ng written?"
    options: [cecak, layar, pangkon]
    answer: 0
    words: [aji, cecak]
  - id: e06
    type: fill_blank
    sentence: Ajining raga saka ___.
    meaning:
      ar_eg: قيمة الجسم من اللبس.
      ar: قيمة الجسد من اللباس.
      en: The body's worth comes from its clothes.
    options: [lathi, busana, rega]
    answers: [busana]
    words: [raga, busana]
  - id: e07
    type: fill_blank
    sentence: ꦭꦛꦶ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: الشفايف / الكلام)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: الشفتان / الكلام)"
      en: Type the reading in Latin letters. (It means "lips, speech".)
    answers: [lathi]
    explain:
      ar_eg: ꦛ = tha التقيلة، وعليها wulu = thi.
      ar: ꦛ = tha الثقيلة، وعليها wulu = thi.
      en: ꦛ is the heavy tha; with wulu it's thi.
    words: [lathi]
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦲꦗꦶꦤꦶꦁꦝꦶꦫꦶꦱꦏꦭꦛꦶ꧉"
      ar: "اكتب بالحروف اللاتينية: ꦲꦗꦶꦤꦶꦁꦝꦶꦫꦶꦱꦏꦭꦛꦶ꧉"
      en: "Write in Latin letters: ꦲꦗꦶꦤꦶꦁꦝꦶꦫꦶꦱꦏꦭꦛꦶ꧉"
    answers: ["Ajining dhiri saka lathi.", ajining dhiri saka lathi, ajining diri saka lathi]
    words: [aji, lathi]
  - id: e09
    type: build_sentence
    source:
      ar_eg: "رتّب المثل: قيمة الجسم من اللبس."
      ar: "رتّب المثل: قيمة الجسد من اللباس."
      en: "Put the saying in order: the body's worth comes from its clothes."
    answer: Ajining raga saka busana.
    distractors: [lathi]
    words: [aji, raga, busana]
dialogue:
  title: Paribasan ing tembok
  lines:
    - speaker: Mohamed
      text: Mas, aku isa maca tulisan ing tembok iki.
      ar_eg: يا ديماس، أنا قادر أقرا الكتابة اللي على الحيطة دي.
      ar: يا ديماس، أستطيع قراءة الكتابة على هذا الجدار.
      en: Mas, I can read the writing on this wall.
    - speaker: Dimas
      text: Iku paribasan. Ajining dhiri saka lathi.
      ar_eg: ده مثل. قيمة الإنسان من كلامه.
      ar: "هذا مثل: قيمة المرء من كلامه."
      en: That's a saying. Your worth lies in your words.
    - speaker: Mohamed
      text: Ing Mesir uga ana, «لسانك حصانك»!
      ar_eg: "عندنا في مصر كمان: «لسانك حصانك»!"
      ar: "وعندنا في مصر أيضًا: «لسانك حصانك»!"
      en: We have one in Egypt too — "your tongue is your horse"!
    - speaker: Dimas
      text: Wah, padha! Mula basa krama iku penting.
      ar_eg: يا سلام، نفس الفكرة! عشان كده الكراما مهمة.
      ar: رائع، الفكرة نفسها! ولهذا الكراما مهمة.
      en: Wow, the same idea! That's why krama matters.
new_words:
