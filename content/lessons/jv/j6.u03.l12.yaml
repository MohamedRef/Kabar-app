    pos: noun
    ar_eg: قيمة؛ ajining = قيمة الـ…
    ar: قيمة؛ ajining = قيمةُ…
    en: worth, value; ajining = the worth of = nilai, harga
  - word: lathi
    pos: noun
    ar_eg: الشفايف؛ كلام الواحد
    ar: الشفتان؛ كلام المرء
    en: lips; one's words = bibir, ucapan
  - word: raga
    pos: noun
    ar_eg: الجسم
    ar: الجسد
    en: body = raga, badan
