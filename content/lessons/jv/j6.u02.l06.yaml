schema: kabar.lesson/v1
id: j6.u02.l06
language: jv
title: Layang krama
can_do:
  ar_eg: 'تقرا وترد على جواب بالكراما: قريت، هكتب الرد، لوحدي، نتقابل لما يبقى فيه وقت.'
  ar: 'أن تقرأ رسالة بالكراما وتردّ عليها: قرأتُ، سأكتب الرد، بنفسي، نلتقي حين يتسع الوقت.'
  en: 'Read and answer a krama letter: I''ve read it, I''ll write back, by myself, let''s meet when there''s time.'
slides:
  - title: Tembung krama ing layang
    body:
      ar_eg: |
        في الجوابات المؤدبة بنستعمل كراما: maos = يقرا، nyerat = يكتب، kintun = يبعت.
        seratan = جواب أو كتابة (tulisan)، piyambak = بنفسه أو لوحده (dhewe)، mugi = يا رب / إن شاء الله (muga).
        pangapunten = سماح: Nyuwun pangapunten = لا مؤاخذة. وmekaten = «كده»: Mekaten rumiyin = ده كل اللي عندي دلوقتي. وهتقابل كمان wekdal وpinanggih من J3.
      ar: |
        في الرسائل المهذّبة نستعمل الكراما: maos = يقرأ، nyerat = يكتب، kintun = يرسل.
        seratan = رسالة أو كتابة (tulisan)، وpiyambak = بنفسه أو وحده (dhewe)، وmugi = عسى / أرجو (muga).
        وpangapunten = عفو: Nyuwun pangapunten = المعذرة. وmekaten = «هكذا»: Mekaten rumiyin = هذا ما لديّ الآن. وستلقى أيضًا wekdal وpinanggih من J3.
      en: |
        Polite letters use krama: maos = read, nyerat = write, kintun = send.
        seratan = letter, writing (tulisan), piyambak = oneself, alone (dhewe), mugi = may, hopefully (muga).
        pangapunten = forgiveness: Nyuwun pangapunten = I'm sorry, excuse me. mekaten = thus, like this: Mekaten rumiyin = that's all for now. You'll also meet wekdal and pinanggih again from J3.
    examples:
      - text: Kula sampun maos pesen panjenengan.
        ar_eg: قريت رسالتك.
        ar: قرأتُ رسالتك.
        en: I've read your message.
      - text: Kula badhe nyerat wangsulan.
        ar_eg: هكتب الرد.
        ar: سأكتب الرد.
        en: I'll write a reply.
      - text: Menawi wonten wekdal, kula badhe pinanggih panjenengan.
        ar_eg: لو فيه وقت، هقابل حضرتك.
        ar: إن اتسع الوقت سألتقي بك.
        en: If there's time, I'll come and meet you.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: maos
        ar_eg: يقرا (كراما)
        ar: يقرأ (كراما)
        en: read (krama)
      - text: nyerat
        ar_eg: يكتب (كراما)
        ar: يكتب (كراما)
        en: write (krama)
      - text: kintun
        ar_eg: يبعت (كراما)
        ar: يرسل (كراما)
        en: send (krama)
      - text: mekaten
        ar_eg: كده
        ar: هكذا
        en: thus, like this
    words: [maos, nyerat, kintun, mekaten]
  - id: e02
    type: match_pairs
    pairs:
      - text: piyambak
        ar_eg: لوحده، بنفسه
        ar: بنفسه، وحده
        en: oneself, alone
      - text: mugi
        ar_eg: يا رب / إن شاء الله
        ar: عسى، أرجو
        en: may, hopefully
      - text: seratan
        ar_eg: جواب، كتابة
        ar: رسالة، كتابة
        en: letter, writing
      - text: pangapunten
        ar_eg: سماح
        ar: عفو
        en: forgiveness, pardon
    words: [piyambak, mugi, seratan, pangapunten]
  - id: e03
    type: listen
    text: Kula sampun maos pesen panjenengan.
    question:
      ar_eg: قال إيه؟
      ar: ماذا قال؟
      en: What did he say?
    options: [قريت رسالتك, كتبت رسالة, سمعت صوتك]
    answer: 0
    meaning:
      ar_eg: قريت رسالة حضرتك.
      ar: قرأتُ رسالتك.
      en: I've read your message.
    words: [maos]
  - id: e04
    type: fill_blank
    sentence: Kula badhe ___ wangsulan dhateng Pak Harjo.
    meaning:
      ar_eg: هـ___ رد لعم هارجو.
      ar: سأ___ ردًا إلى السيد هارجو.
      en: I'll ___ a reply to Pak Harjo.
    options: [nyerat, mugi, seratan]
    answers: [nyerat]
    words: [nyerat, mugi, seratan]
    explain:
      ar_eg: nyerat = يكتب (كراما). mugi = يا ريت وseratan = جواب (اسم مش فعل).
      ar: nyerat تعني يكتب بالكراما. أما mugi فعسى وseratan رسالة، اسم لا فعل.
      en: nyerat is krama for "write". mugi is "may" and seratan is a letter, a noun.
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: إزاي تقول «لا مؤاخذة» بأدب في جواب كراما؟ Nyuwun ___.
      ar: كيف تقول «المعذرة» بأدب في رسالة بالكراما؟ Nyuwun ___.
      en: How do you say "I'm sorry" politely in a krama letter? Nyuwun ___.
    options: [mekaten, pangapunten, kintun]
    answer: 1
    explain:
      ar_eg: Nyuwun pangapunten = بطلب السماح، يعني لا مؤاخذة.
      ar: Nyuwun pangapunten = أطلب العفو، أي المعذرة.
      en: Nyuwun pangapunten = I ask forgiveness, i.e. I'm sorry.
    words: [mekaten, pangapunten, kintun]
  - id: e06
    type: fill_blank
    sentence: Panjenengan rawuh ___ menapa kaliyan rencang?
    meaning:
      ar_eg: حضرتك جاي ___ ولا مع صحابك؟
      ar: هل أتيتَ ___ أم مع أصدقائك؟
      en: Did you come ___ or with friends?
    options: [piyambak, mugi, maos]
    answers: [piyambak]
    words: [piyambak, mugi, maos]
    explain:
      ar_eg: piyambak = لوحدك (كراما). mugi = يا ريت وmaos = يقرا.
      ar: piyambak تعني وحدك بالكراما. أما mugi فعسى وmaos يقرأ.
      en: piyambak is krama for "alone". mugi is "may" and maos is "read".
  - id: e07
    type: multiple_choice
    question: Kula remen sanget saged ___ kaliyan panjenengan.
    options: [nyerat, seratan, pinanggih]
    answer: 2
    explain:
      ar_eg: 'pinanggih (من J3) = نتقابل: مبسوط إني قابلتك. seratan = جواب، مش فعل.'
      ar: 'pinanggih (من J3) = نلتقي: سعيد بلقائك. وseratan = رسالة، لا فعل.'
      en: 'pinanggih (from J3) = meet: glad to meet you. seratan is a letter, not a verb.'
    words: [nyerat, seratan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: لا مؤاخذة، ده كل اللي عندي دلوقتي.
      ar: المعذرة، هذا ما لديّ الآن.
      en: Sorry, that's all from me for now.
    answer: Nyuwun pangapunten, mekaten rumiyin saking kula.
    distractors: [maos, mugi]
    words: [mekaten, pangapunten]
    explain:
      ar_eg: mekaten rumiyin = كده بس دلوقتي، ختام الجواب. maos = يقرا وmugi = يا ريت، ومش في المعنى.
      ar: "mekaten rumiyin ختام الرسالة: هذا كل شيء الآن. أما maos (يقرأ) وmugi (عسى) فليستا في المعنى."
      en: "mekaten rumiyin closes a letter: \"that's all for now\". maos (read) and mugi (may) aren't in the meaning."
  - id: e09
    type: translate
    direction: from_target
    source_text: Kula badhe kintun seratan menika piyambak.
    answers_meaning:
      ar_eg: [هبعت الجواب ده بنفسي, أنا هبعت الجواب ده بنفسي]
      ar: [سأرسل هذه الرسالة بنفسي, سأبعث هذه الرسالة بنفسي]
      en: ['I''ll send this letter myself', I will send this letter on my own]
    words: [kintun, piyambak, seratan]
  - id: e10
    type: speaking
    text: Mugi kita saged pinanggih malih.
    meaning:
      ar_eg: يا رب نتقابل تاني.
      ar: عسى أن نلتقي مرة أخرى.
      en: I hope we can meet again.
    words: [mugi]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak Slamet, kula sampun maos layang saking Pak Harjo.
      ar_eg: يا عم سلامت، قريت جواب عم هارجو.
      ar: يا سيد سلامت، قرأتُ رسالة السيد هارجو.
      en: Pak Slamet, I've read Pak Harjo's letter.
    - speaker: Pak Slamet
      text: Sae. Panjenengan badhe nyerat wangsulan?
      ar_eg: كويس. هتكتب الرد؟
      ar: حسن. أستكتب الرد؟
      en: Good. Will you write a reply?
    - speaker: Mohamed
      text: Inggih, nanging kula dereng lancar nyerat krama.
      ar_eg: أيوه، بس لسه مش بكتب كراما كويس.
      ar: نعم، لكنني لا أكتب الكراما بطلاقة بعد.
      en: Yes, but I can't write krama fluently yet.
    - speaker: Pak Slamet
      text: Mboten menapa. Nyerat piyambak rumiyin, mangke kula maos.
      ar_eg: مافيش مشكلة. اكتب لوحدك الأول، وبعدين أقراه أنا.
      ar: لا بأس. اكتب بنفسك أولًا، ثم أقرؤه أنا.
      en: No problem. Write it yourself first, then I'll read it.
    - speaker: Mohamed
      text: Matur nuwun. Kula kepengin pinanggih Pak Harjo malih.
      ar_eg: شكرًا. نفسي أقابل عم هارجو تاني.
      ar: شكرًا. أودّ أن ألتقي بالسيد هارجو مرة أخرى.
      en: Thank you. I'd love to meet Pak Harjo again.
    - speaker: Pak Slamet
      text: Menawi wonten wekdal, sowan mawon.
      ar_eg: لو فيه وقت، روح زوره.
      ar: إن اتسع الوقت فزُره.
      en: If there's time, just go and visit him.
new_words:
  - word: kintun
    pos: verb
    ar_eg: يبعت (كراما)
    ar: يرسل (كراما)
    en: send (krama)
  - word: mekaten
    pos: adverb
    ar_eg: كده (كراما)
    ar: هكذا (كراما)
    en: thus, like this (krama)
  - word: piyambak
    pos: pronoun
    ar_eg: بنفسه، لوحده (كراما)
    ar: بنفسه، وحده (كراما)
    en: oneself, alone (krama)
  - word: seratan
    pos: noun
    ar_eg: جواب، كتابة (كراما)
    ar: رسالة، كتابة (كراما)
    en: letter, writing (krama of tulisan) = tulisan
  - word: pangapunten
    pos: noun
    ar_eg: سماح (Nyuwun pangapunten = لا مؤاخذة)
    ar: عفو (Nyuwun pangapunten = المعذرة)
    en: forgiveness (Nyuwun pangapunten = I'm sorry) = maaf
