schema: kabar.lesson/v1
id: j6.u02.l06
language: jv
title: Layang krama
can_do:
  ar_eg: 'تقرا وترد على جواب بالكراما: قريت، هكتب الرد، لوحدي، نتقابل لما يبقى فيه وقت.'
  ar: 'أن تقرأ رسالة بالكراما وتردّ عليها: قرأتُ، سأكتب الرد، بنفسي، نلتقي حين يتسع الوقت.'
  en: 'Read and answer a krama letter: I''ve read it, I''ll write back, by myself, let''s meet when there''s time.'
slides:
  - title: Tembung krama ing layang
    body:
      ar_eg: |
        في الجوابات المؤدبة بنستعمل كراما: maos = يقرا، nyerat = يكتب، kintun = يبعت.
        wekdal = وقت (wektu)، swanten = صوت (swara)، piyambak = بنفسه أو لوحده (dhewe).
        pinanggih = يتقابل، وmekaten = «كده» أو «بس كده»: Mekaten rumiyin = ده كل اللي عندي دلوقتي.
      ar: |
        في الرسائل المهذّبة نستعمل الكراما: maos = يقرأ، nyerat = يكتب، kintun = يرسل.
        wekdal = وقت (wektu)، swanten = صوت (swara)، piyambak = بنفسه أو وحده (dhewe).
        pinanggih = يلتقي، وmekaten = «هكذا»: Mekaten rumiyin = هذا ما لديّ الآن.
      en: |
        Polite letters use krama: maos = read, nyerat = write, kintun = send.
        wekdal = time (wektu), swanten = voice (swara), piyambak = oneself, alone (dhewe).
        pinanggih = meet; mekaten = thus, like this: Mekaten rumiyin = that's all for now.
    examples:
      - text: Kula sampun maos pesen panjenengan.
        ar_eg: قريت رسالتك.
        ar: قرأتُ رسالتك.
        en: I've read your message.
      - text: Kula badhe nyerat wangsulan.
        ar_eg: هكتب الرد.
        ar: سأكتب الرد.
        en: I'll write a reply.
      - text: Menawi wonten wekdal, kula badhe pinanggih panjenengan.
        ar_eg: لو فيه وقت، هقابل حضرتك.
        ar: إن اتسع الوقت سألتقي بك.
        en: If there's time, I'll come and meet you.
