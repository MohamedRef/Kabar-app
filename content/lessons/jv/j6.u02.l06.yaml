  - id: e03
    type: listen
    text: Kula sampun maos pesen panjenengan.
    question:
      ar_eg: قال إيه؟
      ar: ماذا قال؟
      en: What did he say?
    options: [قريت رسالتك, كتبت رسالة, سمعت صوتك]
    answer: 0
    meaning:
      ar_eg: قريت رسالة حضرتك.
      ar: قرأتُ رسالتك.
      en: I've read your message.
    words: [maos]
  - id: e04
    type: fill_blank
    sentence: Kula badhe ___ wangsulan dhateng Pak Harjo.
    meaning:
      ar_eg: هـ___ رد لعم هارجو.
      ar: سأ___ ردًا إلى السيد هارجو.
      en: I'll ___ a reply to Pak Harjo.
    options: [nyerat, wekdal, swanten]
    answers: [nyerat]
    words: [nyerat, wekdal, swanten]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي كلمة هي الكراما بتاعة wektu (وقت)؟
      ar: أي كلمة هي صيغة الكراما لـ wektu (وقت)؟
      en: Which is the krama word for wektu (time)?
    options: [mekaten, wekdal, kintun]
    answer: 1
    explain:
      ar_eg: wekdal = وقت بالكراما.
      ar: wekdal = وقت بالكراما.
      en: wekdal = time in krama.
    words: [mekaten, wekdal, kintun]
  - id: e06
    type: fill_blank
    sentence: Panjenengan rawuh ___ menapa kaliyan rencang?
    meaning:
      ar_eg: حضرتك جاي ___ ولا مع صحابك؟
      ar: هل أتيتَ ___ أم مع أصدقائك؟
      en: Did you come ___ or with friends?
    options: [piyambak, pinanggih, maos]
    answers: [piyambak]
    words: [piyambak, pinanggih, maos]
  - id: e07
    type: multiple_choice
    question: Kula remen sanget saged ___ kaliyan panjenengan.
    options: [nyerat, swanten, pinanggih]
    answer: 2
    explain:
      ar_eg: 'pinanggih = نتقابل: مبسوط إني قابلتك.'
      ar: 'pinanggih = نلتقي: سعيد بلقائك.'
      en: 'pinanggih = meet: glad to meet you.'
    words: [nyerat, swanten, pinanggih]
  - id: e08
    type: build_sentence
    source:
      ar_eg: ده كل اللي عندي دلوقتي.
      ar: هذا ما لديّ الآن.
      en: That's all from me for now.
    answer: Mekaten rumiyin saking kula.
    distractors: [maos, wekdal]
    words: [mekaten]
  - id: e09
    type: translate
    direction: from_target
    source_text: Kula badhe kintun layang menika piyambak.
    answers_meaning:
      ar_eg: [هبعت الجواب ده بنفسي, أنا هبعت الجواب ده بنفسي]
      ar: [سأرسل هذه الرسالة بنفسي, سأبعث هذه الرسالة بنفسي]
      en: ['I''ll send this letter myself', I will send this letter on my own]
    words: [kintun, piyambak]
  - id: e10
    type: speaking
    text: Menawi wonten wekdal, kula badhe pinanggih panjenengan.
    meaning:
      ar_eg: لو فيه وقت، هقابل حضرتك.
      ar: إن اتسع الوقت سألتقي بك.
      en: If there's time, I'll come and meet you.
    words: [wekdal, pinanggih]
dialogue:
  lines:
    - speaker: Mohamed
      text: Pak Slamet, kula sampun maos layang saking Pak Harjo.
      ar_eg: يا عم سلامت، قريت جواب عم هارجو.
      ar: يا سيد سلامت، قرأتُ رسالة السيد هارجو.
      en: Pak Slamet, I've read Pak Harjo's letter.
    - speaker: Pak Slamet
      text: Sae. Panjenengan badhe nyerat wangsulan?
      ar_eg: كويس. هتكتب الرد؟
      ar: حسن. أستكتب الرد؟
      en: Good. Will you write a reply?
    - speaker: Mohamed
      text: Inggih, nanging kula dereng lancar nyerat krama.
      ar_eg: أيوه، بس لسه مش بكتب كراما كويس.
      ar: نعم، لكنني لا أكتب الكراما بطلاقة بعد.
      en: Yes, but I can't write krama fluently yet.
    - speaker: Pak Slamet
      text: Mboten menapa. Nyerat piyambak rumiyin, mangke kula maos.
      ar_eg: مافيش مشكلة. اكتب لوحدك الأول، وبعدين أقراه أنا.
      ar: لا بأس. اكتب بنفسك أولًا، ثم أقرؤه أنا.
      en: No problem. Write it yourself first, then I'll read it.
    - speaker: Mohamed
      text: Matur nuwun. Kula kepengin pinanggih Pak Harjo malih.
      ar_eg: شكرًا. نفسي أقابل عم هارجو تاني.
      ar: شكرًا. أودّ أن ألتقي بالسيد هارجو مرة أخرى.
      en: Thank you. I'd love to meet Pak Harjo again.
    - speaker: Pak Slamet
      text: Menawi wonten wekdal, sowan mawon.
      ar_eg: لو فيه وقت، روح زوره.
      ar: إن اتسع الوقت فزُره.
      en: If there's time, just go and visit him.
