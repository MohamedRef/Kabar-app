  - id: e08
    type: build_sentence
    source:
      ar_eg: رحت أشوف صاحبي القديم في سيمارانج.
      ar: ذهبت لزيارة صديقي القديم في سيمارانغ.
      en: I went to see my old friend in Semarang.
    answer: Aku nemoni kanca lawas ing Semarang.
    distractors: [mabur, medun]
    words: [nemoni]
  - id: e09
    type: translate
    direction: from_target
    source_text: Dumadakan ana sing nyeluk, aku noleh.
    answers_meaning:
      ar_eg: [فجأة حد نادى، فلفّيت, فجأة حد نده عليا، فبصيت ورايا]
      ar: [فجأة ناداني أحدهم فالتفتّ, فجأة نادى أحدهم فالتفتّ]
      en: ['Suddenly someone called, and I turned round', Suddenly someone called out and I looked back]
    words: [noleh]
  - id: e10
    type: speaking
    text: Wingi aku kesasar, nanging ndilalah nemoni kanca.
    meaning:
      ar_eg: امبارح تهت، بس بالصدفة قابلت صاحبي.
      ar: أمس ضللت الطريق، لكنني صادفت صديقًا.
      en: Yesterday I got lost, but as luck would have it I met a friend.
    words: [kesasar, ndilalah, nemoni]
dialogue:
  lines:
    - speaker: Mohamed
      text: Mbak, wingi aku kesasar ing Kutha Lawas.
      ar_eg: ميباك، امبارح تهت في المدينة القديمة.
      ar: أختي، أمس ضللت الطريق في المدينة القديمة.
      en: Mbak, yesterday I got lost in the Old Town.
    - speaker: Mbak Ayu
      text: Lho, kok bisa?
      ar_eg: يا خبر، إزاي؟
      ar: كيف حدث ذلك؟
      en: Oh, how come?
    - speaker: Mohamed
      text: Aku medun saka bis ing panggonan sing salah.
      ar_eg: نزلت من الأتوبيس في مكان غلط.
      ar: نزلت من الحافلة في المكان الخطأ.
      en: I got off the bus at the wrong place.
    - speaker: Mbak Ayu
      text: Banjur?
      ar_eg: وبعدين؟
      ar: ثم؟
      en: And then?
    - speaker: Mohamed
      text: Dumadakan ana sing nyeluk. Aku noleh... ndilalah kanca saka kampus!
      ar_eg: فجأة حد نادى. لفّيت... طلع بالصدفة صاحبي من الجامعة!
      ar: فجأة ناداني أحدهم. التفتّ... فإذا هو صديق من الجامعة!
      en: Suddenly someone called. I turned round... and it happened to be a friend from uni!
    - speaker: Mbak Ayu
      text: Wah, kaya cerkak wae!
      ar_eg: الله، زي القصص بالظبط!
      ar: رائع، كأنها قصة قصيرة!
      en: Wow, just like a short story!
