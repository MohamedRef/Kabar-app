schema: kabar.lesson/v1
id: j5.u05.l05
language: jv
title: Dumadakan noleh
can_do:
  ar_eg: 'تحكي قصة قصيرة عن إنك تهت: نزلت فين، وبصيت لمين، ومين قابلت بالصدفة.'
  ar: 'أن تحكي قصة قصيرة عن ضياعك: أين نزلت، وإلى من نظرت، ومن قابلت صدفة.'
  en: 'Tell a short story about getting lost: where you got off, who you looked at and who you happened to meet.'
slides:
  - title: Kesasar
    body:
      ar_eg: |
        kesasar = تاه، medun = ينزل (من أتوبيس أو سلم)، mabur = يطير.
        noleh = يلف راسه ويبص، nyawang = يبص لبعيد ويتأمل، gemeter = يترعش.
        ndilalah = وبالصدفة (زي «وكان من حسن الحظ»)، nemoni = يقابل أو يروح يشوف حد.
      ar: |
        kesasar = ضلّ الطريق، medun = ينزل (من حافلة أو درج)، mabur = يطير.
        noleh = يلتفت، nyawang = ينظر بعيدًا متأمّلًا، gemeter = يرتجف.
        ndilalah = وصادف أن (كأنها «ومن حسن الحظ»)، nemoni = يلقى أو يزور أحدًا.
      en: |
        kesasar = get lost, medun = get off, go down, mabur = fly.
        noleh = turn one's head, look back; nyawang = gaze; gemeter = tremble.
        ndilalah = as luck would have it, nemoni = meet, go and see someone.
    examples:
      - text: Aku kesasar ing Kutha Lawas Semarang.
        ar_eg: تهت في المدينة القديمة في سيمارانج.
        ar: ضللت الطريق في المدينة القديمة في سيمارانغ.
        en: I got lost in Semarang's Old Town.
      - text: Dumadakan ana sing nyeluk, aku noleh.
        ar_eg: فجأة حد نادى، فلفّيت.
        ar: فجأة ناداني أحدهم فالتفتّ.
        en: Suddenly someone called, and I turned round.
      - text: Ndilalah aku nemoni kanca lawas.
        ar_eg: وبالصدفة قابلت صاحب قديم.
        ar: وصادف أن لقيت صديقًا قديمًا.
        en: As luck would have it, I met an old friend.
