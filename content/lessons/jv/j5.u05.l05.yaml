      ar: ماذا يفعل؟
      en: What is he doing?
    options: [بيبص للسما والعصفور طاير, بينزل من الأتوبيس, تاه في المدينة]
    answer: 0
    meaning:
      ar_eg: العصفور طار، وأنا ببص للسما.
      ar: طار الطائر وأنا أتأمّل السماء.
      en: A bird flies off; I gaze at the sky.
    words: [mabur, nyawang]
  - id: e04
    type: fill_blank
