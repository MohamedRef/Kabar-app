schema: kabar.lesson/v1
id: j6.u04.l05
language: jv
title: Lurung ing Kutha Gedhe
can_do:
  ar_eg: 'تمشي في حواري كوتاجيدي: تسأل عن الطريق بالكراما، وتلف عند التقاطع، وتوسع للموتوسيكلات.'
  ar: 'أن تمشي في أزقّة كوتاغيدي: تسأل عن الطريق بالكراما وتنعطف عند التقاطع وتفسح للدراجات.'
  en: 'Walk Kotagede''s alleys: ask the way in krama, turn at the crossroads and make way for motorbikes.'
slides:
  - title: Mlaku ing lurung
    body:
      ar_eg: |
        lurung = حارة ضيقة، prapatan = تقاطع أربع طرق، pertelon = تقاطع تلات طرق، pojok = ركن أو ناصية.
        minggir = يوسّع ويطلع على جنب، mlipir = يمشي لازق في الحيطة أو على الحرف.
        nglangkungi = يعدّي (كراما): Nyuwun sewu, kula badhe nglangkungi = لو سمحت هعدّي.
        sendhang = عين مية طبيعية في حوض، tilas = أثر أو بقايا.
      ar: |
        lurung = زقاق ضيق، prapatan = تقاطع أربع طرق، pertelon = تفرّع ثلاثي، pojok = ركن أو زاوية.
        minggir = يتنحّى جانبًا، mlipir = يمشي محاذيًا للجدار أو للحافة.
        nglangkungi = يمرّ (كراما): Nyuwun sewu, kula badhe nglangkungi = عفوًا، أريد المرور.
        sendhang = عين ماء في حوض، tilas = أثر، بقايا.
      en: |
        lurung = narrow alley, prapatan = crossroads, pertelon = T-junction, pojok = corner.
        minggir = move aside, mlipir = walk along the edge or wall.
        nglangkungi = pass (krama): Nyuwun sewu, kula badhe nglangkungi = excuse me, may I pass.
        sendhang = spring-fed pool, tilas = trace, remains.
    examples:
      - text: Lurung ing Kutha Gedhe ciut-ciut.
        ar_eg: حواري كوتاجيدي ضيقة.
        ar: أزقّة كوتاغيدي ضيقة.
        en: The alleys in Kotagede are narrow.
      - text: Menggok tengen ing prapatan, sendhange ana ing pojok.
        ar_eg: لف يمين عند التقاطع، والعين على الناصية.
        ar: انعطف يمينًا عند التقاطع، والعين عند الزاوية.
        en: Turn right at the crossroads; the spring is on the corner.
      - text: Yen ana motor, minggir lan mlipir tembok.
        ar_eg: لو جه موتوسيكل، وسّع وامشي لازق في الحيطة.
        ar: إن جاءت دراجة فتنحَّ وامشِ بمحاذاة الجدار.
        en: If a motorbike comes, move aside and keep to the wall.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: lurung
        ar_eg: حارة
        ar: زقاق
        en: alley
      - text: pertelon
        ar_eg: تقاطع تلات طرق
        ar: تفرّع ثلاثي
        en: T-junction
      - text: pojok
        ar_eg: ناصية، ركن
        ar: زاوية
        en: corner
      - text: minggir
        ar_eg: يوسّع
        ar: يتنحّى
        en: move aside
    words: [lurung, pertelon, pojok, minggir]
  - id: e02
    type: match_pairs
    pairs:
      - text: mlipir
        ar_eg: يمشي على الحرف
        ar: يمشي بمحاذاة الحافة
        en: walk along the edge
      - text: nglangkungi
        ar_eg: يعدّي (كراما)
        ar: يمرّ (كراما)
        en: pass (krama)
      - text: sendhang
        ar_eg: عين مية
        ar: عين ماء
        en: spring pool
      - text: tilas
        ar_eg: أثر
        ar: أثر، بقايا
        en: trace, remains
    words: [mlipir, nglangkungi, sendhang, tilas]
  - id: e03
    type: listen
    text: Menggok kiwa ing pertelon, banjur mlaku ing lurung ciut.
    question:
      ar_eg: يمشي إزاي؟
      ar: كيف يمشي؟
      en: Which way does he go?
    options: [يلف شمال عند التقاطع ويمشي في حارة ضيقة, يمشي على طول في الشارع الكبير, يركب أتوبيس]
    answer: 0
    meaning:
      ar_eg: لف شمال عند التقاطع، وبعدين امشي في الحارة الضيقة.
      ar: انعطف يسارًا عند التقاطع ثم امشِ في الزقاق الضيق.
      en: Turn left at the T-junction, then walk down the narrow alley.
    words: [pertelon, lurung]
  - id: e04
    type: fill_blank
    sentence: Ana motor teka, ___ sithik!
    meaning:
      ar_eg: فيه موتوسيكل جاي، ___ شوية!
      ar: دراجة قادمة، ___ قليلًا!
      en: A motorbike's coming, ___ a bit!
    options: [minggir, tilas, sendhang]
    answers: [minggir]
    words: [minggir, tilas, sendhang]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حوض مية طالعة من عين طبيعية اسمه …
      ar: حوض ماء من عين طبيعية يسمّى …
      en: A pool fed by a natural spring is a …
    options: [pojok, sendhang, lurung]
    answer: 1
    explain:
      ar_eg: sendhang = عين مية.
      ar: sendhang = عين ماء.
      en: sendhang = spring pool.
    words: [pojok, sendhang, lurung]
  - id: e06
    type: fill_blank
    sentence: Warung soto ana ing ___ pertelon.
    meaning:
      ar_eg: محل السوتو على ___ التقاطع.
      ar: مطعم السوتو عند ___ التقاطع.
      en: The soto stall is on the ___ of the T-junction.
    options: [pojok, mlipir, nglangkungi]
    answers: [pojok]
    words: [pojok, mlipir, nglangkungi, pertelon]
  - id: e07
    type: multiple_choice
    question: Iki ___ tembok kraton lawas.
    options: [minggir, pertelon, tilas]
    answer: 2
    explain:
      ar_eg: tilas = بقايا وأثر.
      ar: tilas = بقايا، أثر.
      en: tilas = remains, traces.
    words: [minggir, pertelon, tilas]
  - id: e08
    type: build_sentence
    source:
      ar_eg: إحنا ماشيين لازقين في الحيطة.
      ar: نمشي بمحاذاة الجدار.
      en: We walk along the wall.
    answer: Awake dhewe mlipir tembok.
    distractors: [pojok, sendhang]
    words: [mlipir]
  - id: e09
    type: translate
    direction: from_target
    source_text: Nyuwun sewu, kula badhe nglangkungi.
    answers_meaning:
      ar_eg: [لو سمحت، هعدّي, بعد إذنك، عايز أعدّي]
      ar: [عفوًا، أريد المرور, معذرة، اسمح لي بالمرور]
      en: ['Excuse me, may I pass', 'Excuse me, I''d like to get by']
    words: [nglangkungi]
  - id: e10
    type: speaking
    text: Aku mlipir lurung tekan sendhang.
    meaning:
      ar_eg: مشيت على حرف الحارة لحد العين.
      ar: مشيت بمحاذاة الزقاق حتى العين.
      en: I walked along the alley to the spring.
    words: [mlipir, lurung, sendhang]
dialogue:
  lines:
    - speaker: Mohamed
      text: Nyuwun sewu, Pak. Sendhang Seliran wonten pundi?
      ar_eg: لو سمحت يا عم. عين سيليران فين؟
      ar: عفوًا يا سيدي. أين عين سيليران؟
      en: Excuse me, sir. Where is the Seliran spring?
    - speaker: Pak Harjo
      text: Mlampah lurung menika, lajeng menggok tengen wonten prapatan.
      ar_eg: امشي في الحارة دي، وبعدين لف يمين عند التقاطع.
      ar: امشِ في هذا الزقاق ثم انعطف يمينًا عند التقاطع.
      en: Walk down this alley, then turn right at the crossroads.
    - speaker: Mohamed
      text: Lurungipun ciut sanget, nggih.
      ar_eg: الحارة ضيقة أوي.
      ar: الزقاق ضيق جدًا.
      en: The alley is very narrow.
    - speaker: Pak Harjo
      text: Inggih. Menawi wonten motor, minggir sekedhik.
      ar_eg: أيوه. لو جه موتوسيكل، وسّع شوية.
      ar: نعم. إن جاءت دراجة فتنحَّ قليلًا.
      en: Yes. If a motorbike comes, step aside a little.
    - speaker: Mohamed
      text: Tembok ing pojok menika menapa?
      ar_eg: والحيطة اللي على الناصية دي إيه؟
      ar: وما هذا الجدار عند الزاوية؟
      en: What's this wall on the corner?
    - speaker: Pak Harjo
      text: Menika tilas benteng kraton lawas.
      ar_eg: دي بقايا سور القصر القديم.
      ar: هذه بقايا سور القصر القديم.
      en: Those are the remains of the old palace wall.
