schema: kabar.lesson/v1
id: j6.u04.l05
language: jv
title: Ulangan J6.4
can_do:
  ar_eg: تقرا سطر كامل بالخط الجاوي.
  ar: أن تقرأ سطرًا كاملًا بالخط الجاوي.
  en: Read a full line in aksara Jawa.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: ꦏꦚ꧀ꦕ
        ar_eg: kanca (صاحب)
        ar: kanca (صديق)
        en: kanca (friend)
      - text: ꦠꦤ꧀ꦥ
        ar_eg: tanpa (من غير)
        ar: tanpa (بدون)
        en: tanpa (without)
      - text: ꦩ꧀ꦭꦏꦸ
        ar_eg: mlaku (يمشي)
        ar: mlaku (يمشي)
        en: mlaku (walk)
      - text: ꦏꦿꦩ
        ar_eg: krama (الكراما)
        ar: krama (الكراما)
        en: krama
    words: [pasangan, cakra, tanpa]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: ꦏꦚ꧀ꦕ بتتقسم مقاطع إزاي؟
      ar: كيف تُقسَّم ꦏꦚ꧀ꦕ إلى مقاطع؟
      en: How does ꦏꦚ꧀ꦕ split into syllables?
    options: [ka-na-ca, kan-ca, ka-ca]
    answer: 1
    explain:
      ar_eg: "الحرف اللي شايل pasangan ساكن: ꦏꦚ꧀ꦕ = kan-ca."
      ar: "الحرف الحامل لـ pasangan ساكن: ꦏꦚ꧀ꦕ = kan-ca."
      en: "A letter carrying a pasangan is vowel-less: ꦏꦚ꧀ꦕ = kan-ca."
    words: [pasangan]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: "اقرا: ꦲꦤꦏ꧀ꦮꦢꦺꦴꦤ꧀"
      ar: "اقرأ: ꦲꦤꦏ꧀ꦮꦢꦺꦴꦤ꧀"
      en: "Read: ꦲꦤꦏ꧀ꦮꦢꦺꦴꦤ꧀"
    options: [anak lanang, anak wadon, anaka wadon]
    answer: 1
    words: [wadon]
  - id: e04
    type: listen
    text: Sampeyan sampun nedha?
    question:
      ar_eg: سمعت أنهي جملة؟
      ar: أي جملة سمعت؟
      en: Which sentence did you hear?
    options: ["ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦱꦩ꧀ꦥꦸꦤ꧀ꦤꦼꦝ", "ꦏꦺꦴꦮꦺꦮꦶꦱ꧀ꦩꦔꦤ꧀", "ꦱꦩ꧀ꦥꦺꦪꦤ꧀ꦢꦺꦫꦺꦁꦤꦼꦝ"]
    answer: 0
    meaning:
      ar_eg: حضرتك أكلت؟ (كراما)
      ar: هل أكلت؟ (كراما)
      en: Have you eaten? (krama)
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: أنهي جملة فيها cakra؟
      ar: أي جملة فيها cakra؟
      en: Which phrase has a cakra in it?
    options: [mangan sega, mlaku menyang Kraton, pasar gedhe]
    answer: 1
    explain:
      ar_eg: Kraton = kra + ton، والـ r جوه المقطع بتتكتب cakra.
      ar: Kraton = kra + ton، وr داخل المقطع تُكتب cakra.
      en: Kraton = kra + ton, and an r inside the syllable is a cakra.
    words: [cakra]
  - id: e06
    type: listen
    text: tindak
    question:
      ar_eg: سمعت tindak (يروح، krama inggil). بتتكتب إزاي؟
      ar: سمعت tindak (يذهب، krama inggil). كيف تُكتب؟
      en: You heard tindak (go, krama inggil). How is it written?
    options: ["ꦠꦶꦤꦢꦏ꧀", "ꦠꦶꦢꦏ꧀", "ꦠꦶꦤ꧀ꦢꦏ꧀"]
    answer: 2
    meaning:
      ar_eg: يروح (krama inggil)
      ar: يذهب (krama inggil)
      en: go (krama inggil)
    words: [pasangan]
  - id: e07
    type: fill_blank
    sentence: ꦫꦸꦏꦸꦤ꧀ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: عايشين في وئام)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: متآلف)"
      en: Type the reading in Latin letters. (It means "in harmony".)
    answers: [rukun]
    words: [rukun]
  - id: e08
    type: fill_blank
    sentence: ꦥꦸꦠꦿ = ___
    meaning:
      ar_eg: "اكتب القراية بالحروف اللاتينية. (معناها: ابن، krama inggil)"
      ar: "اكتب القراءة بالحروف اللاتينية. (معناها: ابن، krama inggil)"
      en: Type the reading in Latin letters. (It means "son / child", krama inggil.)
    answers: [putra]
    words: [cakra]
  - id: e09
    type: build_sentence
    source:
      ar_eg: ابني «anak lanang» (ابن). كل قطعة مقطع.
      ar: ركّب «anak lanang» (ابن). كل قطعة مقطع.
      en: Build "anak lanang" (son). Each tile is a syllable.
    answer: ꦲ ꦤꦏ꧀ꦭ ꦤꦁ
    distractors: ["ꦤ"]
    words: [lanang, pasangan]
  - id: e10
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: "اكتب بالحروف اللاتينية: ꦏꦚ꧀ꦕꦏꦸꦩ꧀ꦭꦏꦸꦩꦼꦚꦁꦥꦱꦂ꧉"
      ar: "اكتب بالحروف اللاتينية: ꦏꦚ꧀ꦕꦏꦸꦩ꧀ꦭꦏꦸꦩꦼꦚꦁꦥꦱꦂ꧉"
      en: "Write in Latin letters: ꦏꦚ꧀ꦕꦏꦸꦩ꧀ꦭꦏꦸꦩꦼꦚꦁꦥꦱꦂ꧉"
    answers: ["Kancaku mlaku menyang pasar.", kancakumlakumenyangpasar]
    explain:
      ar_eg: kan-ca-ku (pasangan ca) m(pasangan la)-ku me-nyang pa-sar = صاحبي ماشي للسوق.
      ar: kan-ca-ku (pasangan ca) m(pasangan la)-ku me-nyang pa-sar = صديقي يمشي إلى السوق.
      en: kan-ca-ku (pasangan ca) m(pasangan la)-ku me-nyang pa-sar = My friend is walking to the market.
    words: [pasangan]
  - id: e11
    type: speaking
    text: Kowe wis mangan? Sampeyan sampun nedha?
    meaning:
      ar_eg: أكلت؟ — بالنغوكو وبالكراما.
      ar: هل أكلت؟ — بالنغوكو والكراما.
      en: Have you eaten? — in ngoko and in krama.
dialogue:
  title: Layang saka Pak Slamet
  lines:
    - speaker: Dimas
      text: Med, ana layang kanggo kowe saka Pak Slamet!
      ar_eg: يا محمد، فيه جواب ليك من عمّو سلامت!
      ar: يا محمد، وصلتك رسالة من السيد سلامت!
      en: Med, there's a letter for you from Pak Slamet!
    - speaker: Mohamed
      text: Tulisane aksara Jawa kabeh.
      ar_eg: كله مكتوب بالخط الجاوي.
      ar: كلها مكتوبة بالخط الجاوي.
      en: It's all in aksara Jawa.
    - speaker: Dimas
      text: Isa maca?
      ar_eg: تعرف تقراه؟
      ar: هل تستطيع قراءتها؟
      en: Can you read it?
    - speaker: Mohamed
      text: Isa! Sampeyan sampun nedha, Mas Mohamed?
      ar_eg: أيوه! «أكلت يا محمد؟» (بالكراما)
      ar: نعم! «هل أكلتَ يا محمد؟» (بالكراما)
      en: I can! "Have you eaten, Mohamed?"
    - speaker: Dimas
      text: Ha ha, Pak Slamet pancen seneng takon kuwi.
      ar_eg: هاها، عمّو سلامت دايمًا بيحب يسأل السؤال ده.
      ar: هاها، يحب السيد سلامت أن يسأل هذا دائمًا.
      en: Ha ha, Pak Slamet really loves asking that.
souvenir:
  id: j6.u04.souvenir
  title: Jalan Rukunan
  note:
    ar_eg: |
      في Jagalan جنب كوتاغيدي فيه حواري ضيقة زي Rukunan، والبيوت القديمة لازقة في بعض وسقفها في سقف بعض. والـ pasangan شبهها: لكل حرف شكل تاني بيتلزق تحت الحرف اللي قبله أو جنبه. أصعب حتة في الخط الجاوي — وإنت عدّيتها.
    ar: |
      في Jagalan قرب كوتاغيدي أزقة ضيقة كـ Rukunan، تتلاصق فيها البيوت القديمة وتتجاور سقوفها. والـ pasangan تشبهها: لكل حرف صورة ثانية تلتصق تحت سابقه أو بجانبه. هذا أصعب ما في الخط الجاوي، وقد اجتزته.
    en: |
      In Jagalan, next to Kotagede, narrow lanes like Rukunan run between old houses packed wall to wall, roof by roof. Pasangan are a bit like that: every letter has a second form tucked under or beside the one before it. It's the hardest part of aksara Jawa — and you've made it through.
review:
