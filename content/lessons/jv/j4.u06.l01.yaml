schema: kabar.lesson/v1
id: j4.u06.l01
language: jv
title: Punakawan
can_do:
  ar_eg: تسمع المستويات في حوار وايانغ.
  ar: أن تميّز المستويات في حوار من الوايانغ.
  en: Hear levels in a wayang dialogue.
slides:
  - title: Wayang kulit
    body:
      ar_eg: |
        wayang kulit = مسرح عرايس الظل الجلدية، زي «خيال الظل» عندنا في مصر زمان. الدالانغ (dhalang) قاعد ورا الستارة طول الليل لحد الصبح، بيحرّك كل العرايس وبيعمل صوت كل شخصية لوحده، ومعاه فرقة موسيقى.
        القصص من المهابهاراتا والرامايانا: ملوك وفرسان وشياطين.
        - og كلمة صغيرة بتدّي الجملة إحساس (من كلام يوجيا)، ومن غيرها الجملة صح برضه.
      ar: |
        wayang kulit مسرح دمى الظل الجلدية، ويشبه «خيال الظل» القديم في مصر. يجلس الدالانغ (dhalang) خلف الستار الليل كله حتى الصباح، يحرّك الدمى جميعًا ويؤدي صوت كل شخصية، وتصاحبه فرقة موسيقية.
        وقصصه من المهابهاراتا والرامايانا: ملوك وفرسان وشياطين.
        - og أداة صغيرة تلوّن الجملة (من كلام يوجيا)، والجملة صحيحة بدونها.
      en: |
        wayang kulit = leather shadow puppets, a cousin of the shadow play Egypt once had (خيال الظل). The dhalang sits behind the screen all night, until morning, moving every puppet and voicing every character, with an orchestra beside him.
        The stories come from the Mahabharata and the Ramayana: kings, knights and demons.
        - og is a small particle that adds feeling (Jogja speech); the sentence is correct without it.
    examples:
      - text: Aku arep nonton wayang kulit bengi iki.
        ar_eg: هتفرّج على الوايانغ كولِت بالليل.
        ar: سأشاهد الوايانغ كوليت الليلة.
        en: I'm going to watch wayang kulit tonight.
      - text: Dhalange saka Bantul.
        ar_eg: الدالانغ من بانتول.
        ar: الدالانغ من بانتول.
        en: The dhalang is from Bantul.
  - title: Semar, Gareng, Petruk, Bagong
    body:
      ar_eg: |
        الـ punakawan أربع مهرّجين خدّامين للفرسان: Semar (الأب الحكيم) وولاده Gareng وPetruk وBagong. بيطلعوا في نص العرض ويهزّروا (guyon) والناس تموت من الضحك.
        وهنا المستويات بتبقى جزء من الدراما:
        - الـ punakawan مع بعض: ngoko وهزار.
        - للفارس بتاعهم (Raden = لقب نبيل، زي Raden Arjuna): كراما وkrama inggil.
        - والفارس بيرد عليهم ngoko.
        يعني من غير ما تفهم كل كلمة، المستوى بيقولك مين بيكلّم مين.
      ar: |
        الـ punakawan أربعة مهرّجين يخدمون الفرسان: Semar الأب الحكيم وأبناؤه Gareng وPetruk وBagong. يظهرون في منتصف العرض ويمزحون (guyon) فيضحك الجمهور.
        والمستويات هنا جزء من الدراما:
        - فيما بينهم: ngoko ومزاح.
        - لسيدهم الفارس (Raden لقب نبيل، كـ Raden Arjuna): كراما مع krama inggil.
        - والفارس يجيبهم بالـ ngoko.
        فالمستوى وحده يخبرك من يكلّم من، ولو لم تفهم كل كلمة.
      en: |
        The punakawan are four clown-servants of the knights: Semar (the wise father) and his sons Gareng, Petruk and Bagong. They come on mid-show and joke (guyon), and the audience roars.
        Here the levels are part of the drama:
        - punakawan among themselves: ngoko and jokes.
        - to their knight (Raden = a noble title, as in Raden Arjuna): krama with krama inggil.
        - the knight answers them in ngoko.
        So even before you catch every word, the level tells you who is talking to whom.
    grammar: jv.speechlevel.overview
    examples:
      - text: Reng, kowe wis mangan durung?
        ar_eg: "يا غارينغ، أكلت ولا لسه؟ (Petruk لأخوه: ngoko)"
        ar: "يا غارينغ، هل أكلت؟ (Petruk لأخيه: ngoko)"
        en: "Reng, have you eaten yet? (Petruk to his brother: ngoko)"
      - text: Raden, panjenengan badhe tindak dhateng pundi?
        ar_eg: "يا سيدي، حضرتك رايح فين؟ (Petruk لـ Arjuna: krama alus)"
        ar: "يا سيدي، إلى أين تتوجّه؟ (Petruk لـ Arjuna: krama alus)"
        en: "My lord, where are you going? (Petruk to Arjuna: krama alus)"
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: wayang kulit
        ar_eg: مسرح عرايس الظل الجلدية
        ar: مسرح دمى الظل الجلدية
        en: leather shadow-puppet theatre
      - text: dhalang
        ar_eg: الفنان اللي بيحرّك العرايس ويحكي
        ar: محرّك الدمى وراوي العرض
        en: the puppet master and storyteller
      - text: punakawan
        ar_eg: المهرّجين الخدّامين (Semar وولاده)
        ar: المهرّجون الخدم (Semar وأبناؤه)
        en: the clown-servants (Semar and sons)
      - text: guyon
        ar_eg: يهزّر / هزار
        ar: يمزح / مزاح
        en: joke, joking
    words: [wayang kulit, dhalang, punakawan, guyon]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: مين اللي بيعمل صوت كل الشخصيات في الوايانغ؟
      ar: من يؤدي أصوات كل الشخصيات في الوايانغ؟
      en: Who voices all the characters in wayang?
    options: [punakawan, dhalang, Semar]
    answer: 1
    explain:
      ar_eg: الدالانغ لوحده بيحرّك كل العرايس وبيتكلم بصوت كل واحدة.
      ar: الدالانغ وحده يحرّك الدمى ويتكلم بصوت كلٍّ منها.
      en: The dhalang alone moves every puppet and speaks for each one.
    words: [dhalang]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: Petruk بيكلّم أخوه Gareng. أنهي مستوى؟
      ar: Petruk يكلّم أخاه Gareng. أي مستوى؟
      en: Petruk is talking to his brother Gareng. Which level?
    options: [ngoko, krama, krama inggil]
    answer: 0
    explain:
      ar_eg: "الـ punakawan مع بعض: ngoko وهزار."
      ar: "الـ punakawan فيما بينهم: ngoko ومزاح."
      en: "Punakawan among themselves: ngoko and jokes."
    words: [punakawan]
  - id: e04
    type: multiple_choice
    question_meaning:
      ar_eg: Petruk بيسأل سيده Arjuna رايح فين. أنهي جملة؟
      ar: Petruk يسأل سيده Arjuna إلى أين يذهب. أي جملة؟
      en: Petruk asks his master Arjuna where he's going. Which sentence?
    options: ['Raden, kowe arep lunga menyang ngendi?', 'Raden, sampeyan arep lunga menyang ngendi?', 'Raden, panjenengan badhe tindak dhateng pundi?']
    answer: 2
    explain:
      ar_eg: "الخدّام لسيده النبيل: krama alus (panjenengan، badhe، tindak)."
      ar: "الخادم لسيده النبيل: krama alus (panjenengan، badhe، tindak)."
      en: "Servant to his noble master: krama alus (panjenengan, badhe, tindak)."
    words: [punakawan]
  - id: e05
    type: listen
    text: Aku arep nonton wayang kulit bengi iki.
    options: ['Aku arep nonton wayang kulit bengi iki.', 'Aku wis nonton wayang kulit wingi.', 'Aku arep nonton wayang kulit sesuk.']
    answer: 0
    meaning:
      ar_eg: هتفرّج على الوايانغ كولِت بالليل.
      ar: سأشاهد الوايانغ كوليت الليلة.
      en: I'm going to watch wayang kulit tonight.
    words: [wayang kulit]
  - id: e06
    type: fill_blank
    sentence: Semar, Gareng, Petruk lan Bagong iku ___.
    meaning:
      ar_eg: سمار وغارينغ وبيتروك وباغونغ دول الـ punakawan.
      ar: سمار وغارينغ وبيتروك وباغونغ هم الـ punakawan.
      en: Semar, Gareng, Petruk and Bagong are the punakawan.
    options: [dhalang, punakawan, wayang kulit]
    answers: [punakawan]
    words: [punakawan]
    explain:
      ar_eg: سيمار وجاريج وبيتروك وباجونج هم الـ punakawan (الخدّام المضحكين). dhalang اللي بيحرّك العرايس، وwayang kulit العرض نفسه.
      ar: سمار وغارنغ وبتروك وباغونغ هم الـ punakawan (الخدم المضحكون)، أما dhalang فمحرّك الدمى، وwayang kulit العرض نفسه.
      en: Semar, Gareng, Petruk and Bagong are the punakawan, the comic servants. The dhalang works the puppets, wayang kulit is the show.
  - id: e07
    type: fill_blank
    sentence: Punakawan seneng ___.
    meaning:
      ar_eg: الـ punakawan بيحبوا الهزار.
      ar: الـ punakawan يحبون المزاح.
      en: The punakawan love joking.
    options: [turu, guyon, mangan]
    answers: [guyon]
    words: [guyon, punakawan]
    explain:
      ar_eg: "الـ punakawan بيحبّوا الهزار: guyon. turu نوم، وmangan أكل."
      ar: "يحبّ الـ punakawan المزاح: guyon، أما turu فنوم، وmangan أكل."
      en: "The punakawan love joking: guyon. turu is sleeping, mangan eating."
  - id: e08
    type: build_sentence
    source:
      ar_eg: الدالانغ بيحب الهزار.
      ar: الدالانغ يحب المزاح.
      en: The dhalang likes joking.
    answer: Dhalange seneng guyon.
    distractors: [punakawan, krama]
    words: [dhalang, guyon]
    explain:
      ar_eg: "الجملة عن الدالانج: Dhalange seneng guyon. punakawan الشخصيات، وkrama مستوى الكلام."
      ar: "الجملة عن الدالانغ: Dhalange seneng guyon، أما punakawan فالشخصيات، وkrama مستوى الكلام."
      en: "The sentence is about the dhalang: Dhalange seneng guyon. punakawan are characters, krama a speech level."
  - id: e09
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لصاحبك) هتفرّج على الوايانغ كولِت بالليل.
      ar: (لصديقك) سأشاهد الوايانغ كوليت الليلة.
      en: (to a friend) I'm going to watch wayang kulit tonight.
    answers: ['Aku arep nonton wayang kulit bengi iki.', 'Bengi iki aku arep nonton wayang kulit.', 'Aku arep nonton wayang kulit mengko bengi.', 'Mengko bengi aku arep nonton wayang kulit.', 'Aku nonton wayang kulit bengi iki.']
    words: [wayang kulit]
  - id: e10
    type: speaking
    text: Semar, Gareng, Petruk lan Bagong iku punakawan.
    meaning:
      ar_eg: سمار وغارينغ وبيتروك وباغونغ دول الـ punakawan.
      ar: سمار وغارينغ وبيتروك وباغونغ هم الـ punakawan.
      en: Semar, Gareng, Petruk and Bagong are the punakawan.
    words: [punakawan]
dialogue:
  title: Wayang ing pendhapa
  lines:
    - speaker: Mas Dimas
      text: Mohamed, bengi iki ana wayang kulit. Kowe arep nonton?
      ar_eg: يا محمد، فيه وايانغ كولِت بالليل. هتيجي تتفرّج؟
      ar: يا محمد، هناك وايانغ كوليت الليلة. أتأتي لتشاهد؟
      en: Mohamed, there's wayang kulit tonight. Want to watch?
    - speaker: Mohamed
      text: Arep! Dhalange saka ngendi?
      ar_eg: أيوه! الدالانغ منين؟
      ar: نعم! من أين الدالانغ؟
      en: Yes! Where's the dhalang from?
    - speaker: Mas Dimas
      text: Saka Bantul. Apik banget og, nganti esuk.
      ar_eg: من بانتول. حلو قوي، ولحد الصبح.
      ar: من بانتول. رائع جدًا، ويستمر حتى الصباح.
      en: From Bantul. Really good, and it goes on till morning.
    - speaker: Mohamed
      text: Ana punakawane?
      ar_eg: فيه punakawan؟
      ar: هل فيه punakawan؟
      en: Are the punakawan in it?
    - speaker: Mas Dimas
      text: Ana. Punakawan guyon nganggo ngoko, nanging karo Raden Arjuna nganggo krama.
      ar_eg: آه. الـ punakawan بيهزّروا بالنغوكو، بس مع Raden Arjuna بيتكلموا كراما.
      ar: نعم. يمزح الـ punakawan بالنغوكو، لكنهم يكلّمون Raden Arjuna بالكراما.
      en: Yes. The punakawan joke in ngoko, but with Raden Arjuna they use krama.
