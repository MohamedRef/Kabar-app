schema: kabar.lesson/v1
id: j6.u05.l07
language: jv
title: Desa ing Imogiri
can_do:
  ar_eg: تتكلم مع فلاح في إيموجيري عن أرضه وبهايمه، وعن الغنى والفقر، بجمل فيها «مع إن».
  ar: أن تتحدث مع فلاح في إيموغيري عن أرضه وماشيته، وعن الغنى والفقر، بجمل فيها «رغم أن».
  en: Chat with an Imogiri farmer about his land and animals, wealth and poverty, using 'even though'.
slides:
  - title: Sawah lan dalan
    body:
      ar_eg: |
        kebo = جاموسة، wedhus = معزة (أو خروف). amba = واسع، ciyut = ضيق.
        sugih = غني، mlarat = فقير. sawetara = شوية، كام واحد (sawetara menit = كام دقيقة).
        senajan = مع إن، رغم إن (senajan mlarat, ... = مع إنه فقير ...).
      ar: |
        kebo = جاموس، wedhus = ماعز (أو خروف). amba = واسع، ciyut = ضيّق.
        sugih = غني، mlarat = فقير. sawetara = بعض، قليل من (sawetara menit = بضع دقائق).
        senajan = رغم أنّ (senajan mlarat, ... = رغم فقره ...).
      en: |
        kebo = water buffalo, wedhus = goat (or sheep). amba = wide, ciyut = narrow.
        sugih = rich, mlarat = poor. sawetara = some, a few (sawetara menit = a few minutes).
        senajan = even though (senajan mlarat, ... = even though he's poor, ...).
    examples:
      - text: Jaman kuna, wong sugih duwe kebo lan sawah amba.
        ar_eg: زمان، الغني كان عنده جاموس وأرض واسعة.
        ar: قديمًا كان الغني يملك جواميس وحقولًا واسعة.
        en: In the old days, rich people owned buffalo and wide rice fields.
      - text: Senajan mlarat, warga desa iki rukun.
        ar_eg: مع إنهم فقرا، أهل القرية دي عايشين في وفاق.
        ar: رغم فقرهم، يعيش أهل هذه القرية في وئام.
        en: Even though they're poor, the people of this village live in harmony.
      - text: Dalane ciyut, mung cukup kanggo wedhus sawetara.
        ar_eg: الطريق ضيق، يادوب يكفي كام معزة.
        ar: الطريق ضيّق، يكفي بالكاد لبضع عنزات.
        en: The path is narrow, just wide enough for a few goats.
