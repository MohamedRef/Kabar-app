  - id: e03
    type: listen
    text: Senajan mlarat, Pak Tani seneng nulung.
    question:
      ar_eg: الفلاح عامل إزاي؟
      ar: كيف هو الفلاح؟
      en: What is the farmer like?
    options: [مع إنه فقير، الفلاح بيحب يساعد, الفلاح غني أوي, الفلاح مش بيساعد حد]
    answer: 0
    meaning:
      ar_eg: مع إن الفلاح فقير، بيحب يساعد الناس.
      ar: رغم فقره يحب الفلاح مساعدة الناس.
      en: Even though he's poor, the farmer likes to help.
    words: [senajan, mlarat]
  - id: e04
    type: fill_blank
    sentence: Sawahe ___ banget, ana kebo lima.
    meaning:
      ar_eg: الغيط ___ أوي، فيه خمس جواميس.
      ar: الحقل ___ جدًا، وفيه خمسة جواميس.
      en: The field is very ___; there are five buffalo.
    options: [amba, ciyut, sugih]
    answers: [amba]
    words: [amba, ciyut, sugih]
  - id: e05
    type: multiple_choice
    question_meaning:
      ar_eg: حيوان كبير بيحرت الأرض في الغيط …
      ar: حيوان كبير يحرث الحقل …
      en: A big animal that ploughs the rice field …
    options: [wedhus, kebo, sawetara]
    answer: 1
    explain:
      ar_eg: kebo = الجاموسة اللي بتحرت. wedhus = معزة، وsawetara = كام.
      ar: kebo = الجاموس الذي يحرث؛ wedhus = ماعز، وsawetara = بعض.
      en: kebo = buffalo, the ploughing animal; wedhus = goat, sawetara = some.
    words: [wedhus, kebo, sawetara]
  - id: e06
    type: fill_blank
    sentence: Dalan menyang pasarean iku ___, montor ora bisa liwat.
    meaning:
      ar_eg: الطريق للمدافن ___، والعربيات مش بتعدّي.
      ar: الطريق إلى المقبرة ___، فلا تمر السيارات.
      en: The road to the cemetery is ___; cars can't get through.
    options: [ciyut, amba, mlarat]
    answers: [ciyut]
    words: [ciyut, amba, mlarat]
  - id: e07
    type: multiple_choice
    question: Dheweke ora duwe dhuwit, dheweke ___.
    options: [sugih, mlarat, senajan]
    answer: 1
    explain:
      ar_eg: 'اللي مامعهوش فلوس فقير: mlarat. sugih عكسها.'
      ar: 'من لا مال له فقير: mlarat، وsugih عكسها.'
      en: 'No money means poor: mlarat. sugih is the opposite.'
    words: [sugih, mlarat, senajan]
  - id: e08
    type: build_sentence
    source:
      ar_eg: أنا هستنى كام دقيقة.
      ar: سأنتظر بضع دقائق.
      en: I'll wait a few minutes.
    answer: Aku ngenteni sawetara menit.
    distractors: [kebo, amba]
    words: [sawetara]
  - id: e09
    type: translate
    direction: from_target
    source_text: Wong sugih iku duwe wedhus lan kebo.
    answers_meaning:
      ar_eg: [الراجل الغني ده عنده معيز وجاموس, الغني ده عنده معزة وجاموسة]
      ar: [ذلك الغني يملك ماعزًا وجواميس, يملك ذلك الرجل الغني ماعزًا وجاموسًا]
      en: [That rich man has goats and buffalo, The rich man owns a goat and a buffalo]
    words: [sugih, wedhus, kebo]
  - id: e10
    type: speaking
    text: Senajan ciyut, omahku ayem.
    meaning:
      ar_eg: مع إن بيتي ضيق، بس مريح.
      ar: رغم ضيق بيتي، فهو مريح.
      en: Even though it's small, my house is peaceful.
    words: [senajan, ciyut]
dialogue:
  lines:
    - speaker: Petani
      text: Mas, sawahku iki amba, nanging dalane ciyut.
      ar_eg: يا ابني، أرضي واسعة، بس الطريق ليها ضيق.
      ar: يا بني، حقلي واسع، لكن طريقه ضيّق.
      en: Young man, my field is wide, but the path to it is narrow.
    - speaker: Mohamed
      text: Kebo panjenengan pinten, Pak?
      ar_eg: عندك كام جاموسة يا عم؟
      ar: كم جاموسًا عندك يا عم؟
      en: How many buffalo do you have, sir?
    - speaker: Petani
      text: Kebo loro, wedhus sawetara. Aku dudu wong sugih, lho.
      ar_eg: جاموستين وكام معزة. أنا مش غني يا ابني.
      ar: جاموسان وبعض الماعز. لست غنيًا يا بني.
      en: Two buffalo and a few goats. I'm no rich man.
    - speaker: Mohamed
      text: Nanging panjenengan katingal ayem, Pak.
      ar_eg: بس باين عليك مرتاح البال يا عم.
      ar: لكنك تبدو مطمئنًا يا عم.
      en: But you look at peace, sir.
    - speaker: Petani
      text: Iya. Senajan mlarat, sing penting ayem lan rukun.
      ar_eg: أيوه. مع إننا فقرا، المهم راحة البال والوفاق.
      ar: نعم. رغم الفقر، المهم الطمأنينة والوئام.
      en: Yes. Even though we're poor, what matters is peace and getting along.
    - speaker: Mohamed
      text: Leres, Pak.
      ar_eg: عندك حق يا عم.
      ar: صدقت يا عم.
      en: That's true, sir.
