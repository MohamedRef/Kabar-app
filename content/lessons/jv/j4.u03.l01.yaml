schema: kabar.lesson/v1
id: j4.u03.l01
language: jv
title: Matur lan sowan
can_do:
  ar_eg: تكلّم وتزور حد كبير بتواضع.
  ar: أن تكلّم الكبير وتزوره بتواضع.
  en: Speak and visit humbly.
slides:
  - title: Ngendika ↔ matur
    body:
      ar_eg: |
        krama inggil بترفع الكبير. krama andhap هي النص التاني: بتنزّل إنت نفسك وإنت بتعمل حاجة «ناحيته».
        - الكبير بيتكلم: ngendika، أو dhawuh لما يأمر / يوجّه.
        - إنت بتكلّمه: matur. «Kula badhe matur, Pak» = عايز أعرض على حضرتك حاجة.
        زي «أعرض على سيادتك» عندنا. ولما تتكلم مع صاحبك مش محتاجها خالص.
        وخدّام قصر السلطان اسمهم abdi dalem، وabdi جاية من العربي «عبد».
      ar: |
        krama inggil ترفع الكبير، وkrama andhap هي الشق الآخر: تخفض نفسك وأنت تفعل شيئًا متجهًا إليه.
        - الكبير يتكلم: ngendika، أو dhawuh إذا أمر ووجّه.
        - وأنت تكلّمه: matur: «Kula badhe matur, Pak» = أودّ أن أعرض عليكم أمرًا.
        كقولنا «أعرض على سيادتك»، ولا حاجة إليها مع الصديق.
        ويسمى خدم قصر السلطان abdi dalem، وabdi من العربية «عبد».
      en: |
        Krama inggil raises the elder. Krama andhap is the other half: you lower yourself when your action is directed at them.
        - The elder speaks: ngendika, or dhawuh when instructing.
        - You speak to them: matur. "Kula badhe matur, Pak" = I'd like to tell you something, sir.
        Like «أعرض على سيادتك». With friends you don't need it at all.
        The Sultan's palace servants are the abdi dalem; abdi comes from Arabic «عبد».
    grammar: jv.krama-andhap
    examples:
      - text: Kula badhe matur, Pak.
        ar_eg: عايز أقول لحضرتك حاجة يا أستاذ.
        ar: أودّ أن أقول لكم شيئًا يا سيدي.
        en: I'd like to tell you something, sir.
      - text: Abdi dalem matur dhateng Sultan.
        ar_eg: خدّام القصر بيكلّموا السلطان بتواضع.
        ar: يخاطب خدمُ القصر السلطانَ بتواضع.
        en: The palace servants speak humbly to the Sultan.
  - title: Rawuh ↔ sowan
    body:
      ar_eg: |
        - الكبير ييجي عندك: rawuh (عرفتها).
        - إنت تروح تزوره: sowan. «Kula badhe sowan Simbah» = هزور تيتة (بتواضع)، زي «أتشرّف بزيارتك».
        وممكن الجملة يبقى فيها الاتنين: sowan بتنزّلك، وdalem بترفع بيته: «Kula badhe sowan dhateng dalemipun Bapak».
        وخلي بالك: مينفعش تطلب من الكبير إنه sowan. تقوله «Mangga rawuh» (اتفضل شرّفنا).
      ar: |
        - الكبير يأتيك: rawuh.
        - وأنت تزوره: sowan: «Kula badhe sowan Simbah» = سأزور الجدة، كقولنا «أتشرّف بزيارتك».
        وقد يجتمع الأمران: sowan تخفضك وdalem ترفع بيته: «Kula badhe sowan dhateng dalemipun Bapak».
        ولا تطلب من الكبير أن sowan، بل قل «Mangga rawuh».
      en: |
        - The elder comes to you: rawuh (you know it).
        - You go to visit them: sowan. "Kula badhe sowan Simbah" = I'll call on Grandma, like «أتشرّف بزيارتك».
        One sentence can hold both: sowan lowers you, dalem raises their home: "Kula badhe sowan dhateng dalemipun Bapak".
        You can't ask an elder to sowan; you say "Mangga rawuh" (please honour us with a visit).
    grammar: jv.krama-andhap
    examples:
      - text: Kula badhe sowan dhateng dalemipun Bapak.
        ar_eg: حابب أزور حضرتك في بيتك.
        ar: أودّ أن أزوركم في بيتكم.
        en: I'd like to call on you at your home, sir.
exercises:
  - id: e01
    type: match_pairs
    pairs:
      - text: matur
        ar_eg: أقول لحد كبير (بتواضع)
        ar: أقول للكبير (بتواضع)
        en: say to an elder (humbly)
      - text: sowan
        ar_eg: أزور حد كبير (بتواضع)
        ar: أزور الكبير (بتواضع)
        en: visit an elder (humbly)
      - text: dhawuh
        ar_eg: الكبير يقول / يأمر
        ar: يقول الكبير / يأمر
        en: the elder says, instructs
      - text: abdi dalem
        ar_eg: خدّام قصر السلطان
        ar: خدم قصر السلطان
        en: palace servants, courtiers
    words: [matur, sowan, dhawuh, abdi dalem]
  - id: e02
    type: multiple_choice
    question_meaning:
      ar_eg: عايز تقول لـ Pak Sastro «عايز أقول لحضرتك حاجة». تقول إيه؟
      ar: تريد أن تقول لـ Pak Sastro «أودّ أن أقول لكم شيئًا». ماذا تقول؟
      en: You want to tell Pak Sastro "I'd like to tell you something". What do you say?
    options: ['Kula badhe ngendika, Pak.', 'Kula badhe matur, Pak.', 'Aku arep ngomong, Pak.']
    answer: 1
    explain:
      ar_eg: ngendika لكلام الكبير. إنت لما تكلّمه matur.
      ar: ngendika لكلام الكبير، وكلامك إليه matur.
      en: ngendika is the elder speaking; you speaking to them is matur.
    words: [matur]
  - id: e03
    type: multiple_choice
    question_meaning:
      ar_eg: هتزور تيتة بكرة. تقول لـ Bu Harsono إزاي؟
      ar: ستزور الجدة غدًا. كيف تقول ذلك لـ Bu Harsono؟
      en: You'll visit Grandma tomorrow. How do you tell Bu Harsono?
    options: ['Kula badhe sowan Simbah, Bu.', 'Kula badhe rawuh Simbah, Bu.', 'Simbah badhe sowan, Bu.']
    answer: 0
    explain:
      ar_eg: "إنت اللي بتزور بتواضع: sowan. rawuh للكبير لما ييجي."
      ar: "الزائر المتواضع أنت: sowan، وrawuh لمجيء الكبير."
      en: "You're the humble visitor: sowan. rawuh is the elder coming."
    words: [sowan]
  - id: e04
    type: listen
    text: Abdi dalem matur dhateng Sultan.
    options: ['Sultan ngendika dhateng abdi dalem.', 'Abdi dalem sowan dhateng Kraton.', 'Abdi dalem matur dhateng Sultan.']
    answer: 2
    meaning:
      ar_eg: خدّام القصر بيكلّموا السلطان بتواضع.
      ar: يخاطب خدمُ القصر السلطانَ بتواضع.
      en: The palace servants speak humbly to the Sultan.
    words: [abdi dalem, matur]
  - id: e05
    type: fill_blank
    sentence: Mangga ___ dhateng griya kula, Pak.
    meaning:
      ar_eg: اتفضل شرّفنا في بيتي يا أستاذ.
      ar: تفضّل بزيارتي في بيتي يا سيدي.
      en: Please come and visit my home, sir.
    options: [sowan, rawuh, matur]
    answers: [rawuh]
    explain:
      ar_eg: sowan يعني «أزور بتواضع» — مينفعش تطلبها من الكبير. هو rawuh.
      ar: sowan زيارة المتواضع فلا تُطلب من الكبير، والكبير rawuh.
      en: sowan is humble visiting; you can't ask the elder to do it. The elder rawuh.
    words: [rawuh, sowan]
  - id: e06
    type: fill_blank
    sentence: Pak Sastro ___, «Mangga lenggah.»
    meaning:
      ar_eg: "Pak Sastro قال: «اتفضل اقعد»."
      ar: "قال Pak Sastro: «تفضّل بالجلوس»."
      en: Pak Sastro said, "Please sit down."
    options: [matur, dhawuh, sowan]
    answers: [dhawuh]
    explain:
      ar_eg: "الكبير بيقول ويوجّه: dhawuh (أو ngendika). matur لكلامك إنت ليه."
      ar: "الكبير يقول ويوجّه: dhawuh (أو ngendika)، وmatur لكلامك إليه."
      en: "The elder says or instructs: dhawuh (or ngendika). matur is you speaking to him."
    words: [dhawuh]
  - id: e07
    type: build_sentence
    source:
      ar_eg: حابب أزور حضرتك في بيتك يا أستاذ.
      ar: أودّ أن أزوركم في بيتكم يا سيدي.
      en: I'd like to call on you at your home, sir.
    answer: Kula badhe sowan dhateng dalemipun Bapak.
    distractors: [rawuh, griyanipun]
    words: [sowan, dalem]
    explain:
      ar_eg: "إنت اللي بتزور الكبير: sowan، وبيته dalem. rawuh لوصول الكبير، وgriyanipun مش تكريم."
      ar: "أنت من يزور الكبير: sowan، وبيته dalem، أما rawuh فلقدوم الكبير، وgriyanipun لا تكريم فيها."
      en: "You call on an elder: sowan, and his house is dalem. rawuh is an elder arriving, griyanipun carries no honour."
  - id: e08
    type: translate
    direction: to_target
    source_meaning:
      ar_eg: (لـ Pak Sastro) لا مؤاخذة يا أستاذ، عايز أقول لحضرتك حاجة.
      ar: (إلى Pak Sastro) عفوًا يا سيدي، أودّ أن أقول لكم شيئًا.
      en: (to Pak Sastro) Excuse me, sir, I'd like to tell you something.
    answers: ['Nyuwun sewu, Pak, kula badhe matur.', 'Nyuwun sewu, kula badhe matur, Pak.', 'Pak, nyuwun sewu, kula badhe matur.', 'Kula badhe matur, Pak.', 'Nyuwun sewu, Pak. Kula badhe matur.']
    words: [matur]
  - id: e09
    type: speaking
    text: Sultan dhawuh, abdi dalem matur.
    meaning:
      ar_eg: السلطان بيأمر، وخدّام القصر بيعرضوا بتواضع.
      ar: السلطان يأمر، وخدم القصر يعرضون بتواضع.
      en: The Sultan instructs; the courtiers speak humbly.
    words: [dhawuh, abdi dalem, matur]
dialogue:
  title: Wonten Kraton
  lines:
    - speaker: Pak Sastro
      text: Sugeng rawuh wonten Kraton, Mas.
      ar_eg: أهلًا وسهلًا في الكراتون يا ابني.
      ar: أهلًا وسهلًا في الكراتون يا بني.
      en: Welcome to the Kraton.
    - speaker: Mohamed
      text: Matur nuwun, Pak. Panjenengan abdi dalem?
      ar_eg: شكرًا يا أستاذ. حضرتك من خدّام القصر؟
      ar: شكرًا يا سيدي. هل أنت من خدم القصر؟
      en: Thank you, sir. Are you a palace servant?
    - speaker: Pak Sastro
      text: Inggih, Mas. Kula abdi dalem Kraton.
      ar_eg: أيوه يا ابني. أنا من خدّام الكراتون.
      ar: نعم يا بني. أنا من خدم الكراتون.
      en: Yes. I'm a servant of the Kraton.
    - speaker: Mohamed
      text: Abdi dalem matur dhateng Sultan kados pundi?
      ar_eg: وخدّام القصر بيكلّموا السلطان إزاي؟
      ar: وكيف يخاطب خدمُ القصر السلطانَ؟
      en: How do the servants speak to the Sultan?
    - speaker: Pak Sastro
      text: Krama inggil, Mas. Sultan dhawuh, abdi dalem matur.
      ar_eg: بالـ krama inggil يا ابني. السلطان بيأمر، والخدّام بيعرضوا بتواضع.
      ar: بالـ krama inggil يا بني. السلطان يأمر، والخدم يعرضون بتواضع.
      en: In krama inggil. The Sultan instructs; the servants speak humbly.
new_words:
  - word: matur
    pos: verb
    ar_eg: يقول / يعرض على حد كبير (krama andhap)
    ar: يقول / يعرض على الكبير (krama andhap)
    en: say, tell, report to an elder (krama andhap) = berkata kepada (yang dihormati)
  - word: sowan
    pos: verb
    ar_eg: يزور حد كبير بتواضع (krama andhap)
    ar: يزور الكبير بتواضع (krama andhap)
    en: call on, visit an elder (krama andhap) = berkunjung, menghadap
  - word: dhawuh
    pos: verb
    ar_eg: الكبير يقول / يأمر (krama inggil)
    ar: يقول الكبير / يأمر (krama inggil)
    en: say, instruct (of an elder; krama inggil) = berkata, memerintah
  - word: abdi dalem
    pos: noun
    ar_eg: خدّام قصر السلطان
    ar: خدم قصر السلطان
    en: palace servants, courtiers of the Kraton = abdi dalem
    arabic: عبد
