# One line per change the learner can see (docs/RELEASE.md §5).
- kind: improved
  ar_eg: كارت الكلمة اللي بيفتح لما تدوس على كلمة بقى له لون مميز، بيبان بوضوح فوق الصفحة في كل الثيمات
  en: The card a tapped word opens now has its own colour and stands out from the page in every theme
- kind: new
  ar_eg: كارت الكلمة بقى لوحة من تحت تكبّرها وتصغّرها بالسحب من الشرطة اللي فوقها، وتقفلها لو سحبتها لتحت، وبيفتكر الحجم اللي سبته عليه
  en: The word card is now a bottom sheet you resize by dragging its handle, drag down to close, and it remembers the size you left it at
- kind: improved
  ar_eg: لما كارت الكلمة يفتح، الصفحة بتطلع لوحدها عشان الكلمة اللي دوست عليها تفضل باينة فوقه
  en: When the word card opens, the page scrolls so the word you tapped stays in view above it
