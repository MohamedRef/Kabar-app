# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: علّم كبار مبقاش يقول إن النت فاصل وهو شغال؛ بيقولك الحقيقة (محتاج تسجّل دخول أو النسخة لسه مش متوصلة) وفيه زرار يوديك تسجّل دخول
  en: Teach Kabar no longer says you're offline when you aren't; it says what's really missing (sign in, or this build isn't connected yet) with a button to sign in
- kind: new
  ar_eg: النسخة التجريبية بقت متوصلة بـ Kabar Cloud، فتقدر تسجّل دخول وتستخدم علّم كبار والترجمة والشرح بالذكاء الاصطناعي
  en: The preview build now connects to Kabar Cloud, so you can sign in and use Teach Kabar, AI translation and explanations
