- kind: fixed
  scope: lesson
  ar_eg: "لما تخلّص درس على جهاز، الأجهزة التانية ما بقتش تعرض تكمّله من نصه تاني، وجرّب تاني بتستنى تقييمك الأول وما بتغيّرش نتيجة المحاولة الأولى."
  en: "Finishing a lesson on one device clears older Lanjut positions across devices, and practice retries wait for self-checks without overwriting the first grade."
- kind: fixed
  scope: lesson
  ar_eg: "نتيجة اختبار المستوى وتحديد المستوى بقت تتحفظ مرة واحدة، ولو الحفظ اتعذّر يظهر زرار «احفظ تاني»."
  en: "Level and placement test results save atomically, with a Save again button if the database is busy."
- kind: fixed
  scope: review
  ar_eg: "لو التراجع اتعذّر لحظياً في حائط الكروت، الكارت المعروض بيفضل في مكانه من غير تكرار."
  en: "A failed undo on the Card Wall leaves the table and review queue intact."
