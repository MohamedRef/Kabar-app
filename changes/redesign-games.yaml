- kind: improved
  ar_eg: شكل الألعاب الجديد، كل لعبة في صف بأيقونة، وعدّاد الجولة بشريط تقدّم، والإجابة الصح والغلط باينين بعلامة ولون
  en: Games have the new look, with a row and icon per game, a round counter with a progress bar, and right and wrong answers marked by sign and colour
- kind: new
  ar_eg: في آخر كل جولة تقدر تلعب تاني، أو تختار لعبة تانية، أو تجرّب الكلام في دردشة
  en: At the end of a round you can play again, pick another game or try the words in a chat
- kind: improved
  ar_eg: خريطة الكلمات بقت جنب الخريطة على الشاشات العريضة، واتشال زرار التاب اللي كان بيفتح نفس الصفحة
  en: The word map's tools sit beside the map on wide screens, and the tab that only reopened the same page is gone
