- kind: fixed
  ar_eg: "الكلمات المختصرة بالرقم 2 في الشات (زي hati2 وanak2 وsama2) بقى ليها شرح وبتشارك نفس الكلمة الأساسية."
  ar: "صارت الكلمات المختصرة بالرقم 2 في المحادثات (مثل hati2 وanak2 وsama2) تأخذ شرح الكلمة الأساسية وحالتها."
  en: "Chat words ending in 2 (hati2, anak2, sama2) now show their gloss and share status and cards with the base word."
  scope: reader
- kind: fixed
  ar_eg: "حفظ كلمة للمراجعة من القارئ بيعمل كارت واحد لكل أصل كلمة في خطوة واحدة، وكارت الكلمة والترجمة بيتظبطوا بعد ترتيب اللقطة."
  ar: "حفظ كلمة للمراجعة من القارئ ينشئ بطاقة واحدة لكل جذر في خطوة ذرية، وتبقى بطاقة الكلمة وتتحدث الترجمة بعد ترتيب اللقطة."
  en: "Saving a Reader word makes one card per lemma atomically, and screenshot restructuring keeps the word card and updates translations."
  scope: reader
