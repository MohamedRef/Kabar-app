# Lesson feedback keeps the learner's explanation within reach.
- kind: improved
  ar_eg: بعد إجابة الدرس، تقدر تفتح «ليه؟» حتى لو إجابتك صح. ولو الإجابة محتاجة تصحيح، التفسير بيظهر تلقائيًا
  en: Open “Why?” after a correct lesson answer too; when an answer needs correction, its explanation opens automatically
- kind: improved
  ar_eg: نتيجة إجابتك في الدرس بقت أوضح بخط جانبي بسيط، مع الحفاظ على الكلام اللي بيشرح النتيجة
  en: Lesson results have a subtle side accent while keeping the written feedback clear
