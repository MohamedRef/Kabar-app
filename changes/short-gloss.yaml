# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: "المعنى الصغير تحت كل كلمة مبقاش بيتقص في النص: selamat بقت «صباح/مساء الخير…» بدل «في التحيات) صباح»، وsepupu بقت «ابن/بنت عم أو خال» بدل «ابن»"
  en: "Short meanings under words are no longer cut mid-phrase: ayahnya reads 'his/her father', not 'his', and no bracket is left open"
