# While the Reader or Teach Kabar waits, recall one of your saved words.
- kind: new
  ar_eg: وإنت مستني القارئ أو "علّم Kabar"، بيطلعلك كلمة من كلماتك المحفوظة تفتكرها، ولما تدوس عليها تشوف معناها والجملة اللي قابلتها فيها
  en: While the Reader or Teach Kabar is working, one of your saved words comes up to recall; tap it for its meaning and the sentence you met it in
