- kind: fixed
  ar_eg: نسخة الويب بالإنجليزي بقت الأسهم فيها بتشاور لقدّام صح، والصفحة بتتقري كإنجليزي مش عربي
  en: In the English web app, forward arrows point the right way again and the page reads as English, not Arabic
- kind: fixed
  ar_eg: القارئ على الويب مبقاش يعرض "افتح سكرين شوت" لحد ما قراية الصور توصل للويب، ولو سحبت صورة بيقولك بصراحة إنها لسه مش متاحة
  en: The web Reader no longer offers "Open a screenshot" before the web can read images, and a dropped image gets an honest "not available yet"
- kind: fixed
  ar_eg: على الموبايل القارئ مبقاش يقولك "اسحب صورة" لإن مفيش حاجة تتسحب
  en: On the phone the Reader no longer asks you to drag something in
- kind: improved
  ar_eg: الإعدادات على الويب بقى اسمها "المتصفح" بدل "الماك"، ومن غير اختصارات ⌘ اللي بتتلخبط مع تابات المتصفح ولا الكارت الفاضي
  en: On the web, Settings calls the device section "This browser" instead of "Mac", without the ⌘ shortcuts that clash with browser tabs or the empty card
- kind: fixed
  ar_eg: على الويب، كارت «مكان بياناتك على الجهاز» بقى بيقولك إنها في تخزين المتصفح، بدل سطر فاضي
  en: On the web, "Where your data lives" now says it is in this browser's storage instead of showing nothing
