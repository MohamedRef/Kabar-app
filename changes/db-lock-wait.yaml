# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: لو المزامنة بتكتب في نفس اللحظة اللي بتدوس فيها، الشاشة ما بقتش تقف لحد ٥ ثواني. بتستنى لحظة صغيرة، ولو ما نفعش بتقولك وتخليك تحاول تاني
  en: If sync is writing the moment you tap, the screen no longer freezes for up to 5 seconds. It waits a moment, and if that's not enough it says so and lets you retry
