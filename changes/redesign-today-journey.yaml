- kind: improved
  ar_eg: 'النهارده بقت أوضح: كارت واحد فيه خطوتك الجاية وزرار "ابدأ خطتك"، وباقي الخطة صفوف تحته، وعلامة "خلصت" دايرة صغيرة لوحدها'
  en: 'Today is clearer: one card with your next step and a "Start your plan" button, the rest of the plan as rows below, and "done" as its own small tick'
- kind: new
  ar_eg: صفحة Kak Nur بتبدأ بخطوتك الجاية وزرار يفتحها، ومنها تعدّل الخطة والتذكير
  en: Kak Nur's page opens with your next step and a button for it, plus quick links to change the plan and reminders
- kind: new
  ar_eg: 'الرحلة فيها كارت "محطتك دلوقتي": المدينة، الوحدة، هدف الدرس الجاي، وهدية المحطة؛ وكل درس مكتوب جنبه خلصته أو كمّل هنا أو جاي'
  en: 'Journey has a "Where you are" card (city, unit, the next lesson''s goal, the stop''s souvenir), and every lesson says Done, Continue or Upcoming'
- kind: improved
  ar_eg: الرحلة بتفتح على اللغة اللي بتركّز عليها (الجاوي لو اخترته لوحده)
  en: Journey opens on the language you focus on (Javanese if that's your only one)
- kind: new
  ar_eg: 'في أول مرة: "ابدأ دلوقتي، والباقي بعدين" بعد ما تختار اللغة ونقطة البداية، والتذكير بيفضل مقفول لحد ما تشغّله'
  en: 'First run: "Start now, the rest later" once you''ve picked the language and starting point; reminders stay off until you turn them on'
