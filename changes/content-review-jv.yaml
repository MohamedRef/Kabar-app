- kind: fixed
  ar_eg: "سؤالين في J3 (mboten kepareng وmboten saged) الإجابة الصح فيهم بقت بتتحسب صح، بعد ما كانت بتتحسب غلط."
  en: "Two J3 krama questions (mboten kepareng, mboten saged) now accept the right answer; it used to be marked wrong."
  scope: j3
- kind: fixed
  ar_eg: "تمارين في J1 كان ليها أكتر من إجابة صح بقى ليها إجابة واحدة واضحة، و«رتّب الجملة» بقى بيقبل ترتيب الكلام التاني الصح."
  en: "J1 items that two words could complete now have one clear answer, and sentence building accepts the other correct word orders."
  scope: j1
- kind: fixed
  ar_eg: "أسئلة استماع في J2 بقت بتسأل عن الجملة كلها، فاختيار واحد بس هو الصح."
  en: "J2 listening questions now ask about the whole sentence, so only one choice fits."
  scope: j2
