# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: الدخول على جهاز مش بتاعك بقى مابيسيبش بياناتك عليه، والخروج منه بيمسحها
  en: Signing in on someone else's device no longer leaves your data on it, and signing out wipes it
  scope: sync
- kind: fixed
  ar_eg: ساعة الجهاز لو متأخرة مابقتش بتخرّجك من الحساب لما تفتح الأجهزة أو الاستهلاك
  en: A device clock running slow no longer signs you out when you open Devices or usage
  scope: sync
- kind: improved
  ar_eg: تسجيل الدخول بجوجل بقى ليه زرار إلغاء لو رجعت من المتصفح من غير ما تكمّل
  en: Google sign-in now has a Cancel button if you came back from the browser without finishing
  scope: sync
- kind: fixed
  ar_eg: الخروج من تاب ويب قديم بقى بيخرّج الجهاز فعلاً، والحساب اللي اتشال من المسموحين بيتقال له كده
  en: Signing out in an older web tab now really signs the device out, and an account taken off the allowlist is told so
  scope: sync
