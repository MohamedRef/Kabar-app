# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: لو Kabar Cloud رفضت تغيير من الجهاز، ما بيضيعش في السكوت. بيتحفظ، وفي «الحساب» كارت بيقولك عددهم مع «ابعتها تاني» أو «سيبها»
