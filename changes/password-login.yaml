- kind: new
  ar_eg: تقدر تدخل باسم مستخدم وباسورد من أي جهاز من غير جيميل، وتلاقي كل حاجة وكل درس واقف عند نفس النقطة
  en: Sign in with a username and password on any device without Gmail, and find everything, every lesson included, right where you left it
- kind: new
  ar_eg: علّم على «الجهاز ده مش بتاعي» وانت بتدخل من جهاز حد تاني، وهتخرج لوحدك أول ما تقفل التاب أو التطبيق
  en: Tick "This isn't my device" on someone else's computer and you are signed out as soon as the tab or app closes
- kind: new
  ar_eg: الدخول بالويب بقى متاح باسم المستخدم والباسورد
  en: The web app can now sign in to Kabar Cloud with your username and password
- kind: new
  ar_eg: أول ما تفتح Kabar على جهاز جديد تقدر تدخل على حسابك على طول من غير ما تعيد التعارف من الأول
  en: On a new device, the first screen lets you sign in to your account instead of starting over
