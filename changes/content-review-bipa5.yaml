- kind: fixed
  ar_eg: "BIPA 5: الأسئلة اللي كان فيها اختيار تاني صح بقى ليها إجابة واحدة، وترتيب الكلمات بقى بيقبل ترتيبات صح أكتر"
  ar: "BIPA 5: صار للأسئلة التي كان فيها خيار ثانٍ صحيح إجابة واحدة، وصار ترتيب الكلمات يقبل ترتيبات صحيحة أكثر"
  en: "BIPA 5: questions where a second option also fit now have one right answer, and sentence building accepts more correct word orders"
  scope: bipa5
- kind: fixed
  ar_eg: "BIPA 5: الشرح مبقاش يقول «الاختيار الأول» لأن الترتيب بيتغير لما تعيد، واتصلحت شروح وترجمات كانت غلط"
  ar: "BIPA 5: لم يعد الشرح يشير إلى الخيار بترتيبه لأن الترتيب يتغيّر عند الإعادة، وصُحّحت شروح وترجمات خاطئة"
  en: "BIPA 5: explanations no longer name an option by its position, which changes on a retry, and wrong explanations and translations are corrected"
  scope: bipa5
- kind: fixed
  ar_eg: "BIPA 5: جمل إندونيسي اتصلحت عشان تبقى طبيعية أكتر، زي Tionghoa بدل Cina ومن غير فاصلة قبل sehingga"
  ar: "BIPA 5: صُحّحت جمل إندونيسية لتصبح أكثر طبيعية، مثل Tionghoa بدل Cina وحذف الفاصلة قبل sehingga"
  en: "BIPA 5: some Indonesian sentences are more natural now, such as Tionghoa instead of Cina and no comma before sehingga"
  scope: bipa5
