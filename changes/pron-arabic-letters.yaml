# One line per change the learner can see (docs/RELEASE.md §5).
- kind: improved
  ar_eg: النطق بالعربي بقى بحروف عربي أصلية بس وتشكيل كامل بالنطق المصري (p = ب، j = دْج، ng = نْج، e = ـَيْ زي «بَيْت»، o = ـَوْ زي «يَوْم») بدل الحروف الفارسي
  en: The Arabic-script pronunciation now uses only original Arabic letters with full Egyptian vowel marks, no Persian letters
- kind: new
  ar_eg: أيقونة سماعة جنب الكلام الإندونيسي والجاوي، دوس عليها تسمعه بنطقه الأصلي
  en: A speaker beside Indonesian and Javanese words and sentences plays them in their own voice
- kind: improved
  ar_eg: أسامي زي «باك» و«بابوا» و«باليكبابان» في الترجمات بقت مكتوبة بحروف عربي أصلية بدل پ وچ وڤ
  en: Names such as Pak, Papua and Balikpapan in the Arabic translations are now spelled with original Arabic letters instead of پ, چ and ڤ
