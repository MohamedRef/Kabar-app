- kind: fixed
  ar_eg: "كل رسمة أو خط بإيدك بيتقري لوحده: Gambar! والمدرّس وقراية الخط مبقوش بيكرروا رد أول رسمة."
  en: "Each drawing or handwritten line is read on its own: Gambar!, the teacher and handwriting no longer repeat the first one's answer."
- kind: fixed
  ar_eg: "لما Kabar يقرا سطر في الكشكول، الكلام اللي قراه بيظهر في خانته على طول."
  en: "When Kabar reads a notebook line, what it read now shows in that line's box right away."
