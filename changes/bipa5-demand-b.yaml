  ar_eg: "دروس BIPA 5 من الوحدة 6 لـ 10 بقت أصعب: أسئلة الفهم اختياراتها بالإندونيسي وشرحها بالعربي، والاستماع بقى جملتين أو تلاتة مترابطين، وكل درس فيه جملة طويلة مركّبة تترجمها أو تكتبها."
  en: "BIPA 5 units 6–10 ask more: comprehension choices are in Indonesian with the why in Arabic, listening is two or three linked sentences, and every lesson has one longer compound sentence to translate or write."
