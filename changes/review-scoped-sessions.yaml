# Review groups now launch exactly what their counts describe.
- kind: fixed
  ar_eg: لما تدوس على «المستحق» في المراجعة، هتراجع الكروت المستحقة بس، و«الجديد» هيفتح الكروت الجديدة بس. طرق المراجعة التانية زي ما هي
  en: Tapping Due starts a due-only session, and tapping New starts a new-only session. Other review modes stay unchanged
