- kind: fixed
  ar_eg: في دروس الخط الجاوي، الحرفين ꦥ pa وꦧ ba بقى ليهم شرح مختلف (بَ بس p مش b، وبَ الـ b العادية) بدل ما الاتنين يتكتبوا «بَ»
  en: In the aksara Jawa lessons, ꦥ pa and ꦧ ba now have different hints (p, not b; and plain b) instead of both reading «بَ»
- kind: fixed
  ar_eg: تلميحات النطق المكتوبة باليد بقت تكتب g بالجيم المصري زي باقي التطبيق (sega «سِجو»، segara «سِجورو»، mangga «مونْجو»)، مش بالغين
  en: Hand-written pronunciation hints now write g as ج like the rest of the app (sega «سِجو», segara «سِجورو», mangga «مونْجو»), not غ
- kind: improved
  ar_eg: أسماء زي جوجا ويوجياكارتا وبيتشل وباليمبانج وبتروك ونجوكو والوايانج بقى ليها كتابة واحدة بالعربي المصري في كل الدروس
  en: Names such as Jogja, Yogyakarta, pecel, Palembang, Petruk, ngoko and wayang now have one Egyptian Arabic spelling across all lessons
