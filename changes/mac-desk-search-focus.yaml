# One line per change the learner can see (docs/RELEASE.md §5).
- kind: new
  ar_eg: بحث سريع بـ ⌘K (أو زرار البحث) يوصّلك لأي درس أو شاشة أو لعبة أو قسم في الإعدادات، من غير نت
  en: Quick search with ⌘K (or the search button) jumps to any lesson, screen, game or Settings section, offline
- kind: new
  ar_eg: على الماك تقدر تعرّض أو تضيّق القايمة الجانبية وكارت الكلمة في القارئ بالسحب، وكبار يفتكر العرض على الجهاز ده
  en: On the Mac, drag the sidebar or the Reader's word panel wider or narrower; Kabar remembers it on this device
- kind: new
  ar_eg: وضع التركيز في المراجعة على التابلت والماك بيخبّي القايمة الجانبية لحد ما تطلّعها تاني
  en: Focus mode in Review on tablet and Mac hides the sidebar until you bring it back
