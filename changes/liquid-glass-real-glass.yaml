  ar_eg: "Liquid Glass بقى زجاج بجد: الكروت والأزرار والشريط اللي تحت بقوا شفافين فوق خلفية ملونة، بحواف لامعة وتغبيش ورا الشريط، في كل الشاشات والدروس والإعدادات."
  en: "Liquid Glass now really looks like glass: translucent cards, controls and a blurred floating bar over a soft colour field, on every screen and in lessons."
