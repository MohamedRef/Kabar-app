# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: زرار «نزّلها» في التحديثات بقى يشتغل على طول، حتى لو الدروس الجديدة لسه بتنزل
  en: The download button in Updates starts right away, even while new lessons are still downloading
- kind: fixed
  ar_eg: لو التحميل أو التثبيت فشل، شاشة «إيه الجديد؟» بقت بتقول إيه اللي حصل وتديك طريقة تكمّل
  en: When a download or install fails, the What's new sheet says what happened and how to go on
- kind: improved
  ar_eg: شاشة التحديث بقى ليها شكل لكل خطوة، دايرة بالنسبة وهي بتنزل، وعلامة وهي بتتثبّت، وصح لما تخلص
  en: The update sheet shows each step on its own, a ring with the percent while downloading, then installing and done
- kind: improved
  ar_eg: زرار «نزّلها» بقى مكتوب جنبه حجم التحديث
  en: The download button shows the update's size
- kind: new
  ar_eg: لو إنت على نت الموبايل، Kabar بيسألك قبل ما ينزّل التحديث، ولو قلت استنى هينزل لوحده على الواي فاي
  en: On mobile data Kabar asks before downloading an update; choose to wait and it downloads on Wi-Fi by itself
