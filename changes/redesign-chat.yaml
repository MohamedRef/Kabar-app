- kind: improved
  ar_eg: شكل الدردشة الجديد، كارت للشخصية والمشهد فوق، فقاعات أهدى، وزرار إرسال صغير جنب مربع الكتابة
  en: Chats have the new look, with a card for the partner and scene, calmer bubbles and a compact send button
- kind: new
  ar_eg: في مشاهد الدردشة فيه زرار "فكرة للرد" بيوريك جملة من المشهد ومعناها، وتقدر تكتبها في المربع وتعدّلها قبل ما تبعت
  en: Chat scenes offer a reply idea, a line from the scene with its meaning that you can put in the box and edit before sending
- kind: improved
  ar_eg: دردشاتك القديمة بقت فوق قائمة الشخصيات، ولو الدردشة محتاجة Kabar Cloud فيه زرار يفتحلك الأجهزة على طول
  en: Your past chats come before the list of partners, and when a chat needs Kabar Cloud a button opens Devices
- kind: improved
  ar_eg: شكل اسمع الجديد، كارت للحلقة فيه رقم الجملة اللي إنت فيها، وشريط تقدر تسحبه لأي جملة، وأزرار الجملة اللي فاتت واللي جاية والسرعة
  en: Watch and listen has the new look, with an episode card showing which line you're on, a bar you can drag to any line, and buttons for the previous line, the next line and speed
