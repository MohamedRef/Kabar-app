# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: لو التطبيق ما عرفش يحفظ نتيجة الدرس، بيقولك في آخر الدرس وفيه زرار «احفظ تاني»، بدل ما الدرس يبان خلص ونصه ما اتحفظش
  en: If a lesson's result can't be saved, the summary says so with a Save again button, instead of the lesson looking done but half-saved
- kind: fixed
  ar_eg: لو ما عرفش يقرأ بياناتك من الجهاز، بيقولك فوق الشاشة وفيه «اقرأ تاني»، بدل ما يبان إنك ما ذاكرتش حاجة
  en: If your data can't be read, a note above the screen says so with Read again, instead of looking as if you'd studied nothing
