# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: لما ترجّع نسخة احتياطية أو تنقل Kabar لموبايل جديد، الجهاز الجديد بياخد هوية خاصة بيه في المزامنة بدل ما يتلخبط مع القديم، واللي ما اتزامنش لسه بيطلع من الجديد
  en: Restoring a backup or moving Kabar to a new phone gives the new phone its own sync identity; what the old one never synced goes up from the new one
