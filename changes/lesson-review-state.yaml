# One line per change the learner can see (docs/RELEASE.md §5).
- kind: improved
  ar_eg: لو قفلت الدرس في نص سؤال، ترجع تلاقي إجابتك زي ما هي، والسؤال اللي صحّحته بيرجع بتصحيحه من غير ما يتحسب تاني
  en: Close a lesson mid-question and your answer is still there; a checked answer reopens on its feedback and is never graded twice
- kind: improved
  ar_eg: فوق الدرس بقى فيه عدّاد زي «٣ / ١٢»، وتحت زرار «اتأكد» جملة بتقولك هو مستني منك إيه
  en: The lesson shows a "3 / 12" counter, and a line under a disabled Check says what it's waiting for
- kind: new
  ar_eg: إنك تخلّص الدرس حاجة، وإن المحتوى سليم حاجة تانية. دوسة «المحتوى سليم» في آخر الدرس هي اللي بتشيل «لسه متراجعتش»، وتقدر ترجع فيها
  en: Finishing a lesson and checking its content are now separate. "The content is right" at the end clears the "not reviewed" flag, and you can undo it
- kind: improved
  ar_eg: الدروس اللي عدّيتها بـ ٨٠٪ قبل كده فاضلة متراجعة، ومكتوب جنبها إنها اتحسبت بالقاعدة القديمة
  en: Lessons you passed with 80% before still count as checked, labelled as counted under the old rule
- kind: improved
  ar_eg: في المراجعة، زراير «افتكرتها قد إيه؟» ثابتة في مكانها وعليها المواعيد الحقيقية، والدوسة التانية بسرعة مش بتقيّم الكارت اللي بعده
  en: In Review, the "How well did you remember it?" buttons stay put with their real intervals, and a quick second tap never rates the next card
- kind: improved
  ar_eg: «رجّع آخر إجابة» بترجّع الكارت وميعاده زي ما كانوا بالظبط
  en: Undo in Review puts the card and its schedule back exactly as they were
- kind: new
  ar_eg: كروت الجاوي في المراجعة فيها سطر «صحة المحتوى» لوحده، بعيد عن تقييم الحفظ
  en: Javanese review cards have their own "Content" line, apart from the memory rating
