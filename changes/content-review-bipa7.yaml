# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: "BIPA 7: إجابات صح كانت بتتحسب غلط بقت بتتقبل؛ ترتيب تاني للجملة في تركيب الجمل، واختيارات غلط كانت بتنفع هي كمان اتغيّرت."
  en: "BIPA 7: right answers that were marked wrong now count: another word order in sentence building, and wrong options that also fit were replaced."
  ar: "BIPA 7: صارت إجابات صحيحة كانت تُعدّ خطأً مقبولة: ترتيب آخر في بناء الجمل، واستُبدلت خيارات خاطئة كانت تصلح هي أيضًا."
  scope: bipa7
- kind: fixed
  ar_eg: "BIPA 7: الشرح بقى بيسمّي الاختيار بكلامه مش بترتيبه، فيفضل صح لما الاختيارات تتلخبط في الإعادة، واتصلّح شرح وأسئلة قديمة."
  en: "BIPA 7: explanations name an option by its words, not its place, so they stay right when a retry shuffles the options; stale ones were fixed."
  ar: "BIPA 7: صار الشرح يسمّي الخيار بنصّه لا بترتيبه، فيبقى صحيحًا حين تُخلط الخيارات عند الإعادة، وصُحّحت شروح وأسئلة قديمة."
  scope: bipa7
- kind: fixed
  ar_eg: "BIPA 7: تفاصيل الحواديت والتاريخ بقت متّفقة مع الدروس (بيض راجا أمبات السبعة، ولاد إخوات ماما إستر، الصحافة بعد 1998)."
  en: "BIPA 7: story and history details now match the lessons (Raja Ampat's seven eggs, Mama Ester's nieces and nephews, the press after 1998)."
  ar: "BIPA 7: صارت تفاصيل الحكايات والتاريخ متّفقة مع الدروس (بيض راجا أمبات السبع، وأبناء إخوة ماما إستر، والصحافة بعد 1998)."
  scope: bipa7
