  ar_eg: "دروس BIPA 6 من الوحدة 6 للوحدة 10 بقت أصعب: أسئلة الفهم اختياراتها بالإندونيسي والشرح بالعربي، ونصوص الاستماع بقت 3–4 جمل، وكل درس فيه جملة مركّبة تكتبها أو تترجمها."
  en: "BIPA 6 units 6–10 ask more: comprehension options are in Indonesian with the Arabic in the explanation, listening texts run 3–4 sentences, and every lesson has one compound sentence to write or translate."
