  ar_eg: "BIPA 1 بقى أوضح: جمل الترتيب اللي فيها «ده» بقت تقول قريب ولا بعيد (ini ولا itu)، وحقايق العيلة والحوارات اتصلّحت"
  en: "BIPA 1 is clearer: build prompts with «ده» now say near or far (ini or itu), and family facts and dialogues were fixed"
