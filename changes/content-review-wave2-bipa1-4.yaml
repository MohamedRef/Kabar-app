  en: "BIPA 3: options that built a second correct sentence were replaced, explains quote options, not their position, translations fixed"
  scope: bipa3
- kind: fixed
  ar_eg: "BIPA 4: فراغات كان ليها إجابتين وترتيبات جمل صح اتظبطت، ومعلومات زي قلعة سومبا أوبو والطريق لشط تانجونج كارانج اتصلّحت"
  en: "BIPA 4: blanks with two answers and other correct word orders fixed, and facts such as Somba Opu fort and the Palu coast road corrected"
