- kind: new
  ar_eg: كل تحديث كبير بقى فوقه سطر واحد بيلخّصه؛ كام تغيير في كام مستوى، وأكتر مستوى اتغيّر
  en: Each big update opens with one summary line; how many changes, in how many levels, and the busiest one
  ar: صار فوق كل تحديث كبير سطر واحد يلخّصه؛ عدد التغييرات والمستويات، وأكثر مستوى تغيّر
  scope: updates
- kind: new
  ar_eg: الدروس اللي خلصتها واتغيّرت في التحديث بتظهر في مربع لوحدها، وكل درس بيفتح بلمسة
  en: Lessons you had finished that the update changed show in their own box, each one a tap away
  ar: تظهر الدروس التي أنهيتها وتغيّرت في التحديث في مربع وحدها، وكل درس يُفتح بلمسة
  scope: updates
- kind: new
  ar_eg: سجل التغييرات فيه بحث، وتقدر تختار مستوى أو نوع (جديد، اتحسّن، اتصلّح) في كل النسخ
  en: The changelog has search, and you can narrow it to a level or a kind across every build
  ar: صار في سجل التغييرات بحث، ويمكنك اختيار مستوى أو نوع في كل الإصدارات
  scope: updates
