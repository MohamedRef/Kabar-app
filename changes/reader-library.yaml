# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: «ضيفها للمراجعة» في القارئ بقت فعلًا بتعمل كارت مراجعة بالكلمة ومعناها والجملة اللي قابلتها فيها
  en: 'The Reader''s "Add to review" now really makes a review card with the word, its meaning and the sentence you met it in'
- kind: new
  ar_eg: بداية القارئ بقت مكتبتك، فيها كل نصوصك ببحث، والكلمات اللي حفظتها (تفتح كل كلمة في النص بتاعها)، والكلمات اللي علّمتها لـ Kabar، والتنزيلات
  en: The Reader's start page is now your library, with your texts and a search, saved words (each opens in its text), words you taught Kabar, and downloads
- kind: new
  ar_eg: الجسر العربي بقى ليه مدخل واضح من القارئ، وبقى قائمة كلمات بالذهبي فيها بحث، تفتح الكلمة تشوف جذرها ومعناها
  en: The Arabic Bridge has a clear way in from the Reader and is now a gold word list with a search; open a word for its root and meaning
- kind: improved
  ar_eg: الباكات بتتنزّل واحدة ورا التانية، وكل باكة بتقولك هي مستنية ولا بتنزل ولا جاهزة، ولو التنزيل وقع فيه «جرّب تاني»
  en: Packs download one after another, each row says whether it's queued, downloading or ready, and a failed one has "Try again"
- kind: improved
  ar_eg: لما تقفل كارت الكلمة، الصفحة بترجع مكانها اللي كانت فيه
  en: Closing the word card puts the page back where it was
