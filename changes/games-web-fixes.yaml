  en: Proper nouns like Allah in Kamu sudah tahu are now capitalised, and closed rows no longer keep focusable buttons
  scope: play
  open: play
- kind: fixed
  ar_eg: شرائح قواعد «مخبر الأصوات» بقت تعزل الاتجاه وترسم السهم في اتجاه القراءة، وتبويب وقائمة «المزيد» بقى ليهم اسم لقارئ الشاشة
  en: Sound-Shift Detective rule chips now bidi-isolate both sides with a directional arrow, and More controls carry accessible names
