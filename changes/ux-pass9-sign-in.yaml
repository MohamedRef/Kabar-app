- kind: fixed
  ar_eg: الحساب على الويب بيقولك تدخل باسم المستخدم والباسورد، مش بجوجل اللي مش موجود هناك
  en: Account & sync on the web asks you to sign in with your username and password, not with Google, which isn't offered there
- kind: fixed
  ar_eg: لو الدخول بالباسورد فشل، الرسالة بتظهر جوّه كارت الدخول تحت الزرار وبتقولك تجرّب تاني، والباسورد بيفضل مكتوب
  en: When a password sign-in fails, the message shows inside the sign-in card under the button and asks you to try again, and your password stays typed
