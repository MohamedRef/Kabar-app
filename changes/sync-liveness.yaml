  ar_eg: "بعد ما الجهاز ينام أو الواي فاي يتغيّر، المزامنة بتلاحظ إن الاتصال مات وبتوصل تاني وتبعت اللي اتأجّل."
  en: "After the device sleeps or Wi-Fi changes, sync notices the dead connection, reconnects and sends what was waiting."
