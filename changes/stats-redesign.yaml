- kind: improved
  ar_eg: صفحة الإحصائيات بقت بتبدأ بالمهم، وفيها زرار تختار بيه آخر ٧ أيام أو آخر ٤ أسابيع والأرقام كلها بتتغير على حسبه
  en: Stats opens with what matters, and a switch between the last 7 days and the last 4 weeks changes every number on top
- kind: new
  ar_eg: دايرة "تثبيت الكلمات" بتقولك افتكرت كام كلمة من اللي راجعتها، وجنبها رسم لدقايق مذاكرتك يوم بيوم أو أسبوع بأسبوع
  en: A "words sticking" ring shows how many reviewed words you remembered, next to bars of your study minutes by day or by week
- kind: new
  ar_eg: كارت "محتاجة شوية اهتمام" بيوريك المهارة اللي بتقع منك وزرار يوديك تتمرن عليها على طول
  en: A "worth some attention" card shows the skill that's slipping, with a button that takes you straight to practise it
