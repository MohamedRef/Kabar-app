# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: "لما سؤال يرجع تاني، الإجابة الصح دايمًا بتغيّر مكانها، فمتقدرش تحفظ المكان بدل الكلمة"
  en: "When a missed item comes back, its right option always moves, so a remembered position isn't the answer"
  scope: lesson
- kind: fixed
  ar_eg: "«anak anak» و«anak2» بدل «anak-anak» بقوا «تقريبًا» مش غلط، والحروف بالتشكيل والفواصل العليا (Jumʼat) بتتقري صح"
  en: "«anak anak» or «anak2» for «anak-anak» counts as close, not wrong; accents and apostrophes of every kind (Jumʼat) compare right"
  scope: lesson
