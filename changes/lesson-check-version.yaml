# One line per change the learner can see (docs/RELEASE.md §5).
- kind: fixed
  ar_eg: لو درس راجعته وقلت إن محتواه سليم اتغيّر بعد كده في تحديث، بيطلب منك تبص عليه تاني بدل ما يفضل متعلّم إنه متراجع
  en: If a lesson you marked as right changes in an update, it asks you to check it again instead of keeping the old mark
