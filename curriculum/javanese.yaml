      pass_mark: 0.75
      covers: ["choosing the level", "krama pronouns and function words", "polite questions", "krama numbers"]

  # ───────────────────────────── J4 · Yogyakarta ─────────────────────────────
  - id: j4
    code: J4
    title: { target: "Ngayogyakarta", en: "Krama inggil, krama andhap and etiquette", ar: "الكراما إنغيل والكراما أندهاب وآداب الكلام" }
    requires: [j3]
    journey: { place: Yogyakarta, kind: train_line }
    capability:
      en: Honour others with krama inggil, humble yourself with krama andhap, and follow unggah-ungguh etiquette in visits and ceremonies.
    units:
      - id: j4.u01
        title: { target: "Krama inggil (kriya)", en: "Honorific verbs", ar: "أفعال التبجيل" }
        stop: Tugu
        can_do:
          - Use honorific verbs for others (dhahar, tindak, sare, rawuh, kondur, ngendika)
          - Say "Panjenengan sampun dhahar?"
        grammar: [jv.krama-inggil.verbs]
        vocabulary: ["krama inggil verbs"]
        arabic_bridge:
          - "Like تفضّل حضرتك vs. اتفضل: the verb itself changes to honour the doer"
        culture: { souvenir: Tugu Yogyakarta, note: "Never use krama inggil for yourself: 'kula dhahar' is a classic foreigner's mistake." }
        lessons:
          - { id: j4.u01.l01, kind: learn, title: "Dhahar lan ngunjuk", can_do: "Offer an elder food and drink with honorific verbs.", grammar: [jv.krama-inggil.verbs], minutes: 7 }
          - { id: j4.u01.l02, kind: learn, title: "Tindak lan sare", can_do: "Say where an elder is going, or that they are asleep.", grammar: [jv.krama-inggil.verbs], minutes: 7 }
          - { id: j4.u01.l03, kind: learn, title: "Rawuh lan kondur", can_do: "Welcome, seat and see off a respected guest.", grammar: [jv.krama-inggil.verbs], minutes: 7 }
          - { id: j4.u01.l04, kind: learn, title: "Ngendika lan pirsa", can_do: "Say what an elder said, asked or saw.", grammar: [jv.krama-inggil.verbs], minutes: 7 }
          - { id: j4.u01.l05, kind: practice, title: "Panjenengan sampun dhahar?", can_do: "Host an elder.", minutes: 6 }
          - { id: j4.u01.l06, kind: practice, title: "Pesen saking Bu Harsono", can_do: "Read a krama WhatsApp message and follow who is doing what.", minutes: 6 }
          - { id: j4.u01.l07, kind: practice, title: "Enjing, siang, sonten", can_do: "Follow and retell an elder's day with honorific verbs.", minutes: 6 }
          - { id: j4.u01.l08, kind: review, title: "Ulangan J4.1", can_do: "Honour without self-honouring.", minutes: 7 }

      - id: j4.u02
        title: { target: "Krama inggil (aran)", en: "Honorific nouns", ar: "أسماء التبجيل" }
        stop: Malioboro
        can_do:
          - Use honorific nouns (asma, dalem, yuswa, asta, rembag)
        grammar: [jv.krama-inggil.nouns]
        vocabulary: ["body parts and belongings in krama inggil"]
        culture: { souvenir: Malioboro street, note: "Asking an elder's name is 'Asmanipun sinten?' — the word for name itself is honorific." }
        lessons:
          - { id: j4.u02.l01, kind: learn, title: "Asma lan yuswa", can_do: "Ask an elder's name, age and children honorifically.", grammar: [jv.krama-inggil.nouns], minutes: 7 }
          - { id: j4.u02.l02, kind: learn, title: "Dalem", can_do: "Talk about an elder's home, spouse and food.", grammar: [jv.krama-inggil.nouns], minutes: 7 }
          - { id: j4.u02.l03, kind: learn, title: "Asta lan mustaka", can_do: "Talk about an elder's body and health, and about your own.", grammar: [jv.krama-inggil.nouns], minutes: 7 }
          - { id: j4.u02.l04, kind: practice, title: "Sowan simbah", can_do: "Ask after an elder politely.", minutes: 6 }
          - { id: j4.u02.l05, kind: practice, title: "Pak Slamet ing Malioboro", can_do: "Read a short profile of an elder written with honorific nouns.", minutes: 6 }
          - { id: j4.u02.l06, kind: practice, title: "Tumbas ageman batik", can_do: "Follow and say what you bought for whom, with kagem and kangge.", minutes: 6 }
          - { id: j4.u02.l07, kind: practice, title: "Foto kulawarga", can_do: "Follow an elder talking about his own family, and ask him back honorifically.", minutes: 5 }
          - { id: j4.u02.l08, kind: review, title: "Ulangan J4.2", can_do: "Use honorific nouns correctly.", minutes: 7 }

      - id: j4.u03
        title: { target: "Krama andhap", en: "Humble forms", ar: "صيغ التواضع" }
        stop: Kraton
        can_do:
          - Lower yourself with matur, sowan, nyuwun, ngaturi, caos
        grammar: [jv.krama-andhap]
        vocabulary: ["humble verbs"]
        culture: { souvenir: Kraton Yogyakarta, note: "The Sultan's palace keeps the most refined speech; courtiers 'matur' (speak up to) the Sultan." }
        lessons:
          - { id: j4.u03.l01, kind: learn, title: "Matur lan sowan", can_do: "Speak and visit humbly.", grammar: [jv.krama-andhap], minutes: 7 }
          - { id: j4.u03.l02, kind: learn, title: "Nyuwun pirsa", can_do: "Ask for things and ask questions humbly.", grammar: [jv.krama-andhap], minutes: 6 }
          - { id: j4.u03.l03, kind: learn, title: "Ngaturi lan ngaturaken", can_do: "Invite, offer a gift and go along humbly.", grammar: [jv.krama-andhap], minutes: 7 }
          - { id: j4.u03.l04, kind: practice, title: "Ngaturi rawuh", can_do: "Invite an elder to an event.", minutes: 6 }
          - { id: j4.u03.l05, kind: practice, title: "Ndherek dhateng Kraton", can_do: "Read a short diary entry that mixes humble and honorific verbs.", minutes: 6 }
          - { id: j4.u03.l06, kind: practice, title: "Pak Sastro, abdi dalem", can_do: "Follow a palace servant talking about his work with humble verbs.", minutes: 6 }
          - { id: j4.u03.l07, kind: practice, title: "Pesen kagem Pak Sastro", can_do: "Read and write a thank-you message to an elder.", minutes: 6 }
          - { id: j4.u03.l08, kind: review, title: "Ulangan J4.3", can_do: "Pair andhap with inggil.", minutes: 7 }

      - id: j4.u04
        title: { target: "Tata krama", en: "Etiquette", ar: "آداب السلوك" }
        stop: Taman Sari
        can_do:
          - Use set phrases (nuwun sewu, ndherek langkung, monggo, matur nuwun sanget)
          - Combine words with gestures (bowing, thumb-pointing, right hand)
        grammar: [jv.etiquette.phrases]
        vocabulary: ["courtesy phrases", "gestures"]
        arabic_bridge:
          - "nuwun sewu ≈ لا مؤاخذة / بعد إذنك; monggo ≈ اتفضل"
        culture: { souvenir: Taman Sari water palace, note: "Point with the thumb, pass things with the right hand, and stoop slightly when walking past seated elders ('ndherek langkung')." }
        lessons:
          - { id: j4.u04.l01, kind: learn, title: "Kula nuwun, mangga", can_do: "Arrive at a door, come in and greet your hosts.", grammar: [jv.etiquette.phrases], minutes: 7 }
          - { id: j4.u04.l02, kind: learn, title: "Ngapunten, sampun repot-repot", can_do: "Apologise, and accept or decline food politely.", grammar: [jv.etiquette.phrases], minutes: 7 }
          - { id: j4.u04.l03, kind: learn, title: "Basa awak", can_do: "Match gestures to speech.", grammar: [jv.etiquette.phrases], minutes: 7 }
          - { id: j4.u04.l04, kind: practice, title: "Unggah-Ungguh Simulator", can_do: "Pass five situations on the Respect Meter.", minutes: 6 }
          - { id: j4.u04.l05, kind: practice, title: "Tata krama saka Mas Dimas", can_do: "Read a friend's ngoko tips on visiting etiquette and pick out the set phrases.", minutes: 5 }
          - { id: j4.u04.l06, kind: practice, title: "Pak Wahyu ing Taman Sari", can_do: "Follow a guide speaking krama to visitors and answer politely.", minutes: 6 }
          - { id: j4.u04.l07, kind: practice, title: "Sowan Bu Ningsih", can_do: "Read the story of a whole visit in krama and retell it in ngoko.", minutes: 6 }
          - { id: j4.u04.l08, kind: review, title: "Ulangan J4.4", can_do: "Handle a visit politely.", minutes: 7 }

      - id: j4.u05
        title: { target: "Ngoko alus", en: "Polite ngoko", ar: "النغوكو المهذّبة" }
        stop: Kotabaru
        can_do:
          - Mix ngoko with krama inggil for close-but-respected people (ngoko alus)
        grammar: [jv.speechlevel.mixed]
        vocabulary: ["ngoko alus patterns"]
        culture: { souvenir: Kotabaru colonial quarter, note: "Spouses, older siblings and close senior colleagues often get ngoko alus: familiar frame, honorific words for their actions." }
        lessons:
          - { id: j4.u05.l01, kind: learn, title: "Ngoko alus", can_do: "Build polite ngoko.", grammar: [jv.speechlevel.mixed], minutes: 7 }
          - { id: j4.u05.l02, kind: learn, title: "Krama alus", can_do: "Contrast ngoko alus with krama lugu and krama alus.", grammar: [jv.speechlevel.mixed], minutes: 7 }
          - { id: j4.u05.l03, kind: learn, title: "Wis wungu, Mbak?", can_do: "Use more honorific verbs inside ngoko alus.", grammar: [jv.speechlevel.mixed], minutes: 7 }
          - { id: j4.u05.l04, kind: practice, title: "Mas, sampeyan wis dhahar?", can_do: "Talk to an older friend.", minutes: 6 }
          - { id: j4.u05.l05, kind: practice, title: "Grup WA kulawarga", can_do: "Read a family chat and tell ngoko alus from ngoko lugu.", minutes: 5 }
          - { id: j4.u05.l06, kind: practice, title: "Mas Rudi telpon", can_do: "Follow a ngoko phone call and answer an older friend in ngoko alus.", minutes: 6 }
          - { id: j4.u05.l07, kind: practice, title: "Papat wong, papat basa", can_do: "Read a paragraph about speech levels and pick the right level for each person.", minutes: 6 }
          - { id: j4.u05.l08, kind: review, title: "Ulangan J4.5", can_do: "Pick ngoko alus vs krama alus.", minutes: 7 }

      - id: j4.u06
        title: { target: "Wayang lan gamelan", en: "Wayang and gamelan", ar: "الوايانغ والغاميلان" }
        stop: Prambanan
        can_do:
          - Follow a simple wayang scene summary
          - Recognise levels used between characters (king, servant, clown)
        grammar: [jv.speechlevel.overview, jv.krama-andhap]
        vocabulary: ["wayang characters", "gamelan instruments"]
        culture: { souvenir: Ramayana ballet at Prambanan, note: "In wayang the punakawan clowns (Semar, Gareng, Petruk, Bagong) speak ngoko and joke; nobles speak krama — the levels are part of the drama." }
        lessons:
          - { id: j4.u06.l01, kind: learn, title: "Punakawan", can_do: "Hear levels in a wayang dialogue.", grammar: [jv.speechlevel.overview], minutes: 7 }
          - { id: j4.u06.l02, kind: learn, title: "Ratu lan abdi", can_do: "Notice andhap from servants.", grammar: [jv.krama-andhap], minutes: 7 }
          - { id: j4.u06.l03, kind: learn, title: "Gamelan", can_do: "Name the main gamelan instruments and follow a performance.", minutes: 7 }
          - { id: j4.u06.l04, kind: practice, title: "Crita wayang", can_do: "Summarise a scene.", minutes: 6 }
          - { id: j4.u06.l05, kind: practice, title: "Wayang kulit ing pendhapa", can_do: "Read a notice about a wayang show and invite an elder to it.", minutes: 6 }
          - { id: j4.u06.l06, kind: practice, title: "Petruk lan Gareng", can_do: "Listen to a punakawan scene and tell who is talking to whom.", minutes: 6 }
          - { id: j4.u06.l07, kind: practice, title: "Bengi ing Prambanan", can_do: "Read a short ngoko post about the Ramayana show and retell it in krama.", minutes: 6 }
          - { id: j4.u06.l08, kind: review, title: "Ulangan J4.6", can_do: "Tag each line's level.", minutes: 7 }
    level_test:
      id: j4.test
      minutes: 35
      pass_mark: 0.75
      covers: ["krama inggil vs andhap", "honorific nouns", "etiquette phrases", "ngoko alus", "five Respect Meter situations"]

  # ───────────────────────────── J5 · Semarang (branch line) ─────────────────────────────
  - id: j5
    code: J5
    title: { target: "Semarang", en: "Reading real Javanese texts", ar: "قراءة نصوص جاوية حقيقية" }
    requires: [j4]
    journey: { place: Semarang, kind: branch_line, note: "A branch line north to the coast: Semarang, Kudus, Demak." }
    capability:
      en: Read real Javanese — Wikipedia articles, news, social posts and short stories — with help from the Reader, and understand their register.
    units:
      - id: j5.u01
        title: { target: "Wikipedia basa Jawa", en: "Javanese Wikipedia", ar: "ويكيبيديا الجاوية" }
        stop: Semarang Tawang
        can_do:
          - Read an encyclopedic article in standard written ngoko
          - Recognise written connectors (ing, saka, dening, iku, kang)
        grammar: [jv.reading.written-style]
        vocabulary: ["encyclopedic vocabulary"]
        culture: { souvenir: Kota Lama Semarang, note: "Javanese Wikipedia is written mostly in ngoko with formal connectors; it is a free, real corpus for practice." }
        lessons:
          - { id: j5.u01.l01, kind: learn, title: "Iku lan yaiku", can_do: "Read the definition that opens an encyclopedia article.", grammar: [jv.reading.written-style], minutes: 7 }
          - { id: j5.u01.l02, kind: learn, title: "Ing lan kang", can_do: "Read where things are and which ones, in written style.", grammar: [jv.reading.written-style], minutes: 7 }
          - { id: j5.u01.l03, kind: learn, title: "Minangka lan kalebu", can_do: "Read 'as', 'among' and 'one of' in an article.", grammar: [jv.reading.written-style], minutes: 7 }
          - { id: j5.u01.l04, kind: practice, title: "Artikel Semarang", can_do: "Read an article about Semarang.", minutes: 6 }
          - { id: j5.u01.l05, kind: practice, title: "Ringkesan", can_do: "Summarise an article in Indonesian or Arabic.", minutes: 6 }
          - { id: j5.u01.l06, kind: practice, title: "Artikel Stasiun Tawang", can_do: "Read a short article about Tawang Station.", minutes: 6 }
          - { id: j5.u01.l07, kind: practice, title: "Kairo ing Wikipedia", can_do: "Follow a Wikipedia article about Cairo by ear.", minutes: 5 }
          - { id: j5.u01.l08, kind: practice, title: "Lumpia Semarang", can_do: "Read a short article about a famous food.", minutes: 6 }
          - { id: j5.u01.l09, kind: review, title: "Ulangan J5.1", can_do: "Read a new article.", minutes: 7 }

      - id: j5.u02
        title: { target: "Warta", en: "News", ar: "الأخبار" }
        stop: Lawang Sewu
        can_do:
          - Read short news items in Javanese
          - Understand written passives with dening
        grammar: [jv.passive.written]
        vocabulary: ["news vocabulary"]
        culture: { souvenir: Lawang Sewu, note: "Regional TV and magazines (Panjebar Semangat, Jaya Baya) have published in Javanese for decades." }
        lessons:
          - { id: j5.u02.l01, kind: learn, title: "Di-… dening…", can_do: "Read written passives with dening.", grammar: [jv.passive.written], minutes: 7 }
          - { id: j5.u02.l02, kind: learn, title: "Kapilih lan tinulis", can_do: "Recognise the formal ka- and -in- passives.", grammar: [jv.passive.written], minutes: 7 }
          - { id: j5.u02.l03, kind: practice, title: "Warta cekak", can_do: "Read a short news item.", minutes: 7 }
          - { id: j5.u02.l04, kind: practice, title: "Panjebar Semangat", can_do: "Read a reader's letter in a Javanese magazine.", minutes: 7 }
          - { id: j5.u02.l05, kind: practice, title: "Pameran ing Lawang Sewu", can_do: "Read a news item about an exhibition.", minutes: 6 }
          - { id: j5.u02.l06, kind: practice, title: "Warta radio", can_do: "Follow a short radio news bulletin by ear.", minutes: 5 }
          - { id: j5.u02.l07, kind: practice, title: "Pengumuman kerja bakti", can_do: "Read a neighbourhood notice.", minutes: 6 }
          - { id: j5.u02.l08, kind: practice, title: "Sejarah Lawang Sewu", can_do: "Read a magazine paragraph on a building's history.", minutes: 6 }
          - { id: j5.u02.l09, kind: review, title: "Ulangan J5.2", can_do: "Retell a news item.", minutes: 7 }

      - id: j5.u03
        title: { target: "Ejaan", en: "Spelling", ar: "الإملاء" }
        stop: Simpang Lima
        can_do:
          - Read standard spelling vs spoken / chat spelling (pira / piro, apa / opo)
          - Hear and write dh / d and th / t
        grammar: [jv.orthography]
        vocabulary: ["minimal pairs (dhadha / dada)", "a vs å"]
        culture: { souvenir: Simpang Lima square, note: "Standard spelling writes 'a' where speakers say 'o' at word end (pira, sega); chats spell by ear. Minimal Pairs game trains dh / d and th / t." }
        lessons:
          - { id: j5.u03.l01, kind: learn, title: "Pira utawa piro?", can_do: "Map the spoken o back to the standard a.", grammar: [jv.orthography], minutes: 7 }
          - { id: j5.u03.l02, kind: learn, title: "Loro utawa lara?", can_do: "Tell a real o from a written a, and normalise chat spellings.", grammar: [jv.orthography], minutes: 7 }
          - { id: j5.u03.l03, kind: learn, title: "Dh / d, th / t", can_do: "Tell retroflex from dental.", grammar: [jv.orthography], minutes: 7 }
          - { id: j5.u03.l04, kind: practice, title: "Minimal Pairs", can_do: "Pass a listening round.", minutes: 6 }
          - { id: j5.u03.l05, kind: practice, title: "Chat saka Mbak Ayu", can_do: "Read ear-spelled chat messages and restore them.", minutes: 6 }
          - { id: j5.u03.l06, kind: practice, title: "Rungokna Mbak Ayu", can_do: "Write a voice message in standard spelling.", minutes: 5 }
          - { id: j5.u03.l07, kind: practice, title: "Menu warung", can_do: "Read a street-stall menu spelled by ear.", minutes: 6 }
          - { id: j5.u03.l08, kind: practice, title: "Tulisane Mohamed", can_do: "Correct an ear-spelled diary, keeping real o's.", minutes: 6 }
          - { id: j5.u03.l09, kind: review, title: "Ulangan J5.3", can_do: "Normalise a chat into standard spelling.", minutes: 7 }

      - id: j5.u04
        title: { target: "Medsos", en: "Social media", ar: "وسائل التواصل" }
        stop: Ambarawa
        can_do:
          - Read posts that mix Javanese, Indonesian and English
          - Tag each word's language and register
        grammar: [jv.codemix]
        vocabulary: ["slang", "memes", "comments"]
        culture: { souvenir: Ambarawa railway museum, note: "Most real Javanese online is code-mixed; Kabar's Reader tags each token's language." }
        lessons:
          - { id: j5.u04.l01, kind: learn, title: "Campur kode", can_do: "Find the Javanese frame in a mixed post.", grammar: [jv.codemix], minutes: 7 }
          - { id: j5.u04.l02, kind: learn, title: "Dishare, HP-ne", can_do: "Read Javanese affixes on foreign words.", grammar: [jv.codemix], minutes: 7 }
          - { id: j5.u04.l03, kind: practice, title: "Komentar TikTok", can_do: "Decode a comment thread.", minutes: 7 }
          - { id: j5.u04.l04, kind: practice, title: "Screenshot Decoder", can_do: "Read a group-chat screenshot with the Reader.", minutes: 6 }
          - { id: j5.u04.l05, kind: practice, title: "Caption Instagram", can_do: "Read a code-mixed post caption.", minutes: 6 }
          - { id: j5.u04.l06, kind: practice, title: "Voice note Mas Yudha", can_do: "Follow a code-mixed voice note by ear.", minutes: 5 }
          - { id: j5.u04.l07, kind: practice, title: "Review museum", can_do: "Read a code-mixed online review.", minutes: 6 }
          - { id: j5.u04.l08, kind: practice, title: "Grup kulawarga", can_do: "See who gets code-mixing and who gets krama in a family chat.", minutes: 6 }
          - { id: j5.u04.l09, kind: review, title: "Ulangan J5.4", can_do: "Explain a mixed post.", minutes: 7 }

      - id: j5.u05
        title: { target: "Cerkak", en: "Short stories", ar: "القصص القصيرة" }
        stop: Kudus
        can_do:
          - Read a short Javanese story (cerkak)
          - Follow narrative connectors (banjur, nuli, sawise, nalika)
        grammar: [jv.narrative.connectors]
        vocabulary: ["narrative vocabulary"]
        arabic_bridge:
          - "Kudus ← القدس: the town was named by Sunan Kudus after Jerusalem"
        culture: { souvenir: Menara Kudus, note: "Kudus's minaret blends a Hindu-Javanese temple form with a mosque — a picture of how Islam came to Java." }
        lessons:
          - { id: j5.u05.l01, kind: learn, title: "Ing sawijining dina", can_do: "Spot a story's opening and its 'then'.", grammar: [jv.narrative.connectors], minutes: 7 }
          - { id: j5.u05.l02, kind: learn, title: "Sawise, sadurunge, nalika", can_do: "Follow before, after and when in a story.", grammar: [jv.narrative.connectors], minutes: 7 }
          - { id: j5.u05.l03, kind: learn, title: "Dumadakan, pungkasane", can_do: "Find a story's twist and its ending.", grammar: [jv.narrative.connectors], minutes: 7 }
          - { id: j5.u05.l04, kind: practice, title: "Cerkak", can_do: "Read a short story.", minutes: 6 }
          - { id: j5.u05.l05, kind: practice, title: "Critakna maneh", can_do: "Retell it in simple Javanese.", minutes: 6 }
          - { id: j5.u05.l06, kind: practice, title: "Kancil lan timun", can_do: "Read the opening of a folk tale.", minutes: 6 }
          - { id: j5.u05.l07, kind: practice, title: "Critane Bu Retno", can_do: "Follow a short childhood story by ear.", minutes: 5 }
          - { id: j5.u05.l08, kind: practice, title: "Sepur telat", can_do: "Read a very short story with a twist.", minutes: 6 }
          - { id: j5.u05.l09, kind: review, title: "Ulangan J5.5", can_do: "Read a new cerkak.", minutes: 7 }

      - id: j5.u06
        title: { target: "Tembang lan campursari", en: "Songs", ar: "الأغاني" }
        stop: Demak
        can_do:
          - Understand popular song lyrics (campursari, dangdut koplo)
          - Recognise a macapat stanza
        grammar: [jv.narrative.connectors, jv.reading.written-style]
        vocabulary: ["love-song vocabulary", "poetic words"]
        culture: { souvenir: Demak Great Mosque, note: "The Wali Sanga used tembang (sung verse) to teach Islam; 'Lir-ilir' by Sunan Kalijaga is still sung today." }
        lessons:
          - { id: j5.u06.l01, kind: learn, title: "Lir-ilir", can_do: "Read the opening of a classic song.", grammar: [jv.reading.written-style], minutes: 7 }
          - { id: j5.u06.l02, kind: learn, title: "Campursari", can_do: "Follow the story in a modern love song.", grammar: [jv.narrative.connectors], minutes: 7 }
          - { id: j5.u06.l03, kind: learn, title: "Macapat", can_do: "Recognise a macapat verse and its rules.", grammar: [jv.reading.written-style], minutes: 7 }
          - { id: j5.u06.l04, kind: practice, title: "Tegese tembang", can_do: "Explain what a song means to a friend.", minutes: 6 }
          - { id: j5.u06.l05, kind: practice, title: "Gundul-gundul pacul", can_do: "Read a children's song and its popular meaning.", minutes: 6 }
          - { id: j5.u06.l06, kind: practice, title: "Lir-ilir, sambungane", can_do: "Follow the next lines of Lir-ilir by ear.", minutes: 5 }
          - { id: j5.u06.l07, kind: practice, title: "Udan ing Demak", can_do: "Follow the story in campursari lyrics.", minutes: 6 }
          - { id: j5.u06.l08, kind: practice, title: "Sluku-sluku bathok", can_do: "Follow an old children's song by ear.", minutes: 5 }
          - { id: j5.u06.l09, kind: review, title: "Ulangan J5.6", can_do: "Explain a song's meaning.", minutes: 7 }
    level_test:
      id: j5.test
      minutes: 40
      pass_mark: 0.7
      covers: ["Wikipedia reading", "news passives", "spelling normalisation", "code-mixed posts", "a cerkak"]

  # ───────────────────────────── J6 · Kotagede ─────────────────────────────
  - id: j6
    code: J6
    title: { target: "Kutha Gedhe", en: "Aksara Jawa (Javanese script)", ar: "الأبجدية الجاوية (هانا تشارا كا)" }
    requires: [j5]
    journey: { place: "Kotagede, old Mataram capital", kind: city, note: "End of the line." }
    capability:
      en: Read and write aksara Jawa (with pen calligraphy on the tablet), and recognise Pegon, Javanese in Arabic script.
    units:
      - id: j6.u01
        title: { target: "Hanacaraka", en: "The 20 base letters", ar: "الحروف العشرون" }
        stop: Pasar Kotagedhe
        can_do:
          - Read and write the 20 aksara nglegena (ha na ca ra ka …)
          - Tell the story behind the letter order (Aji Saka)
        grammar: [jv.aksara.nglegena]
        vocabulary: ["letters", "simple syllables"]
        culture: { souvenir: Kotagede silver, note: "The alphabet's order is a poem about Aji Saka's two loyal servants who fought to the death: 'ha na ca ra ka — there were two messengers…'." }
        lessons:
          - { id: j6.u01.l01, kind: learn, title: "Ha na ca ra ka", can_do: "Read and write the first five letters.", grammar: [jv.aksara.nglegena], minutes: 6 }
          - { id: j6.u01.l02, kind: learn, title: "Da ta sa wa la", can_do: "Read and write the next five letters.", grammar: [jv.aksara.nglegena], minutes: 7 }
          - { id: j6.u01.l03, kind: learn, title: "Pa dha ja ya nya", can_do: "Read and write letters 11 to 15.", grammar: [jv.aksara.nglegena], minutes: 7 }
          - { id: j6.u01.l04, kind: learn, title: "Ma ga ba tha nga", can_do: "Complete the 20 letters.", grammar: [jv.aksara.nglegena], minutes: 7 }
          - { id: j6.u01.l05, kind: practice, title: "Jeneng ing papan", can_do: "Read names written in aksara Jawa on a board.", minutes: 6 }
          - { id: j6.u01.l06, kind: practice, title: "Ana apa?", can_do: "Read short questions in aksara Jawa and know what they ask.", minutes: 6 }
          - { id: j6.u01.l07, kind: practice, title: "Ditulis a, diwaca o", can_do: "Hear a word said with o and find it written with a in aksara Jawa.", minutes: 6 }
          - { id: j6.u01.l08, kind: practice, title: "Ana kacamata", can_do: "Read a found-item note at a market stall.", minutes: 6 }
          - { id: j6.u01.l09, kind: practice, title: "Buku bocah", can_do: "Read the first page of a children's book in aksara Jawa.", minutes: 6 }
          - { id: j6.u01.l10, kind: review, title: "Ulangan J6.1", can_do: "Read all 20 letters and tell their story.", minutes: 6 }

      - id: j6.u02
        title: { target: "Sandhangan swara", en: "Vowel marks", ar: "علامات الحركات" }
        stop: Masjid Gedhe Mataram
        can_do:
          - Add vowels with wulu, suku, taling, pepet, taling tarung
        grammar: [jv.aksara.sandhangan-swara]
        vocabulary: ["syllables with all vowels"]
        arabic_bridge:
          - "Like Arabic harakat: the base letter carries an inherent vowel, marks change it"
        culture: { souvenir: Kotagede Grand Mosque, note: "The mosque (1587–1589) is Mataram's oldest; its gate is in Hindu-Javanese style." }
        lessons:
          - { id: j6.u02.l01, kind: learn, title: "Wulu lan suku", can_do: "Write i and u.", grammar: [jv.aksara.sandhangan-swara], minutes: 6 }
          - { id: j6.u02.l02, kind: learn, title: "Taling lan pepet", can_do: "Write é / è and ê.", grammar: [jv.aksara.sandhangan-swara], minutes: 6 }
          - { id: j6.u02.l03, kind: learn, title: "Taling tarung", can_do: "Write o, and the letters for rê and lê.", grammar: [jv.aksara.sandhangan-swara], minutes: 6 }
          - { id: j6.u02.l04, kind: practice, title: "Maca tembung", can_do: "Read short words with every vowel.", minutes: 6 }
          - { id: j6.u02.l05, kind: practice, title: "Jadwal ngaji", can_do: "Read the Qur'an class timetable on the mosque board.", minutes: 6 }
          - { id: j6.u02.l06, kind: practice, title: "Warung soto", can_do: "Read a menu in aksara Jawa and order from it.", minutes: 6 }
          - { id: j6.u02.l07, kind: practice, title: "Siji nganti sanga", can_do: "Hear a Javanese number and find it written in aksara Jawa.", minutes: 6 }
          - { id: j6.u02.l08, kind: practice, title: "Layang cekak", can_do: "Read a short note in aksara Jawa and know what you're asked to do.", minutes: 6 }
          - { id: j6.u02.l09, kind: practice, title: "Wati lunga ngaji", can_do: "Follow a short story by ear and in aksara Jawa.", minutes: 6 }
          - { id: j6.u02.l10, kind: review, title: "Ulangan J6.2", can_do: "Read and spell words with all the vowel marks.", minutes: 5 }

      - id: j6.u03
        title: { target: "Sandhangan panyigeg", en: "Final consonants", ar: "الحروف الساكنة الأخيرة" }
        stop: Makam Raja Mataram
        can_do:
          - Close syllables with cecak, layar, wignyan and pangkon
        grammar: [jv.aksara.panyigeg]
        vocabulary: ["words ending in -ng", "-r", "-h", "other consonants"]
        arabic_bridge:
          - "pangkon kills a vowel like Arabic sukun"
        culture: { souvenir: Royal graves of Mataram, note: "Visitors to the royal graves must wear Javanese dress — a living rule of etiquette." }
        lessons:
          - { id: j6.u03.l01, kind: learn, title: "Cecak lan layar", can_do: "Write final ng and r.", grammar: [jv.aksara.panyigeg], minutes: 6 }
          - { id: j6.u03.l02, kind: learn, title: "Wignyan", can_do: "Write final h, also inside a word.", grammar: [jv.aksara.panyigeg], minutes: 6 }
          - { id: j6.u03.l03, kind: learn, title: "Pangkon", can_do: "Kill a vowel at the end of a phrase.", grammar: [jv.aksara.panyigeg], minutes: 6 }
          - { id: j6.u03.l04, kind: practice, title: "Papan jeneng", can_do: "Read street and place signs in Kotagede.", minutes: 6 }
          - { id: j6.u03.l05, kind: practice, title: "Aturan ing makam", can_do: "Read the rules for visiting the royal graves in aksara Jawa.", minutes: 6 }
          - { id: j6.u03.l06, kind: practice, title: "Rega ing pasar", can_do: "Read a price board in aksara Jawa at the market.", minutes: 6 }
          - { id: j6.u03.l07, kind: practice, title: "Cathetanku", can_do: "Follow a short diary entry by ear and in aksara Jawa.", minutes: 6 }
          - { id: j6.u03.l08, kind: practice, title: "Layang saka Dimas", can_do: "Read a short invitation in aksara Jawa and reply.", minutes: 6 }
          - { id: j6.u03.l09, kind: practice, title: "Paribasan", can_do: "Read and understand two well-known Javanese sayings in aksara Jawa.", minutes: 6 }
          - { id: j6.u03.l10, kind: review, title: "Ulangan J6.3", can_do: "Read and build a short sentence.", minutes: 5 }

      - id: j6.u04
        title: { target: "Pasangan", en: "Consonant clusters", ar: "الحروف المتصلة" }
        stop: Jagalan
        can_do:
          - Write consonant clusters with pasangan forms
        grammar: [jv.aksara.pasangan]
        vocabulary: ["words with clusters across syllables"]
        culture: { souvenir: Jalan Rukunan lanes, note: "Pasangan are the hardest part of the script: a second form for each letter, tucked below or beside the first." }
        lessons:
          - { id: j6.u04.l01, kind: learn, title: "Pasangan", can_do: "Join two consonants with a pasangan.", grammar: [jv.aksara.pasangan], minutes: 6 }
          - { id: j6.u04.l02, kind: learn, title: "Pasangan ha, sa, pa", can_do: "Read the pasangan that sit beside the letter.", grammar: [jv.aksara.pasangan], minutes: 6 }
          - { id: j6.u04.l03, kind: learn, title: "Mlaku lan krama", can_do: "Read clusters inside a syllable (cakra, keret, pengkal).", grammar: [jv.aksara.pasangan], minutes: 6 }
          - { id: j6.u04.l04, kind: practice, title: "Ukara", can_do: "Read and build full sentences.", minutes: 6 }
          - { id: j6.u04.l05, kind: practice, title: "Pengumuman kerja bakti", can_do: "Read a neighbourhood notice about a community clean-up in aksara Jawa.", minutes: 6 }
          - { id: j6.u04.l06, kind: practice, title: "Layang kanggo Pak Slamet", can_do: "Read a short krama letter in aksara Jawa.", minutes: 6 }
          - { id: j6.u04.l07, kind: practice, title: "Ing angkringan", can_do: "Catch prices at a street food cart and read its menu in aksara Jawa.", minutes: 6 }
          - { id: j6.u04.l08, kind: practice, title: "Kenalan karo Bimo", can_do: "Read a short self-introduction in aksara Jawa and write a line about yourself.", minutes: 6 }
          - { id: j6.u04.l09, kind: practice, title: "Papan arah", can_do: "Read direction signs in aksara Jawa and find your way.", minutes: 6 }
          - { id: j6.u04.l10, kind: review, title: "Ulangan J6.4", can_do: "Read a full line in aksara Jawa.", minutes: 5 }

      - id: j6.u05
        title: { target: "Murda, rekan lan angka", en: "Capitals, Arabic-sound letters and numerals", ar: "الحروف الكبيرة وحروف الأصوات العربية والأرقام" }
        stop: Imogiri
        can_do:
          - Read aksara murda (honorific capitals) and aksara rekan (kha, dza, fa, za, gha for Arabic sounds)
          - Read Javanese numerals
        grammar: [jv.aksara.murda-rekan]
        vocabulary: ["names", "Arabic loanwords in script"]
        arabic_bridge:
          - "Aksara rekan add dots to write Arabic sounds — خ ذ ف ز غ — in Javanese script"
        culture: { souvenir: Imogiri royal cemetery, note: "Imogiri's 409 steps lead to the tombs of Sultan Agung and later kings." }
        lessons:
          - { id: j6.u05.l01, kind: learn, title: "Aksara murda", can_do: "Recognise the honorific capitals.", grammar: [jv.aksara.murda-rekan], minutes: 6 }
          - { id: j6.u05.l02, kind: learn, title: "Aksara rekan", can_do: "Write Arabic sounds.", grammar: [jv.aksara.murda-rekan], minutes: 6 }
          - { id: j6.u05.l03, kind: learn, title: "Angka Jawa", can_do: "Read numerals and years.", grammar: [jv.aksara.murda-rekan], minutes: 6 }
          - { id: j6.u05.l04, kind: practice, title: "Ing Imogiri", can_do: "Read names, loanwords and numbers on a visit.", minutes: 6 }
          - { id: j6.u05.l05, kind: practice, title: "Pengumuman pengajian", can_do: "Read a notice for a religious talk, with rekan letters and a date in Javanese numerals.", minutes: 5 }
          - { id: j6.u05.l06, kind: practice, title: "Umure masjid", can_do: "Read a year in Javanese numerals on a plaque and work with it.", minutes: 6 }
          - { id: j6.u05.l07, kind: practice, title: "Absen murid", can_do: "Hear Arabic names and find them written with rekan letters.", minutes: 6 }
          - { id: j6.u05.l08, kind: practice, title: "Layang saka Pak Harjo", can_do: "Read a krama thank-you letter with a date and a murda letter.", minutes: 6 }
          - { id: j6.u05.l09, kind: practice, title: "Kertu pos saka Imogiri", can_do: "Read a postcard with murda, rekan and Javanese numerals.", minutes: 6 }
          - { id: j6.u05.l10, kind: review, title: "Ulangan J6.5", can_do: "Read a date, a name and an Arabic loanword.", minutes: 5 }

      - id: j6.u06
