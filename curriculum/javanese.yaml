      minutes: 30
      pass_mark: 0.75
      covers: ["choosing the level", "krama pronouns and function words", "polite questions", "krama numbers"]

  # ───────────────────────────── J4 · Yogyakarta ─────────────────────────────
  - id: j4
    code: J4
    title: { target: "Ngayogyakarta", en: "Krama inggil, krama andhap and etiquette", ar: "الكراما إنغيل والكراما أندهاب وآداب الكلام" }
    requires: [j3]
    journey: { place: Yogyakarta, kind: train_line }
    capability:
      en: Honour others with krama inggil, humble yourself with krama andhap, and follow unggah-ungguh etiquette in visits and ceremonies.
    units:
      - id: j4.u01
        title: { target: "Krama inggil (kriya)", en: "Honorific verbs", ar: "أفعال التبجيل" }
        stop: Tugu
        can_do:
          - Use honorific verbs for others (dhahar, tindak, saré, rawuh, kondur, ngendika)
          - Say "Panjenengan sampun dhahar?"
        grammar: [jv.krama-inggil.verbs]
        vocabulary: ["krama inggil verbs"]
        arabic_bridge:
          - "Like تفضّل حضرتك vs. اتفضل: the verb itself changes to honour the doer"
        culture: { souvenir: Tugu Yogyakarta, note: "Never use krama inggil for yourself: 'kula dhahar' is a classic foreigner's mistake." }
        lessons:
          - { id: j4.u01.l01, kind: learn, title: "Dhahar, tindak, saré", can_do: "Use honorific verbs for others.", grammar: [jv.krama-inggil.verbs], minutes: 14 }
          - { id: j4.u01.l02, kind: learn, title: "Rawuh lan kondur", can_do: "Welcome and see off guests.", grammar: [jv.krama-inggil.verbs], minutes: 12 }
          - { id: j4.u01.l03, kind: practice, title: "Panjenengan sampun dhahar?", can_do: "Host an elder.", minutes: 10 }
          - { id: j4.u01.l04, kind: review, title: "Ulangan J4.1", can_do: "Honour without self-honouring.", minutes: 8 }

      - id: j4.u02
        title: { target: "Krama inggil (aran)", en: "Honorific nouns", ar: "أسماء التبجيل" }
        stop: Malioboro
        can_do:
          - Use honorific nouns (asma, dalem, yuswa, asta, rémbag)
        grammar: [jv.krama-inggil.nouns]
        vocabulary: ["body parts and belongings in krama inggil"]
        culture: { souvenir: Malioboro street, note: "Asking an elder's name is 'Asmanipun sinten?' — the word for name itself is honorific." }
        lessons:
          - { id: j4.u02.l01, kind: learn, title: "Asma lan yuswa", can_do: "Ask name and age honorifically.", grammar: [jv.krama-inggil.nouns], minutes: 12 }
          - { id: j4.u02.l02, kind: learn, title: "Dalem", can_do: "Talk about an elder's home.", grammar: [jv.krama-inggil.nouns], minutes: 10 }
          - { id: j4.u02.l03, kind: practice, title: "Sowan simbah", can_do: "Ask after an elder politely.", minutes: 10 }
          - { id: j4.u02.l04, kind: review, title: "Ulangan J4.2", can_do: "Use honorific nouns correctly.", minutes: 8 }

      - id: j4.u03
        title: { target: "Krama andhap", en: "Humble forms", ar: "صيغ التواضع" }
        stop: Kraton
        can_do:
          - Lower yourself with matur, sowan, nyuwun, ngaturi, caos
        grammar: [jv.krama-andhap]
        vocabulary: ["humble verbs"]
        culture: { souvenir: Kraton Yogyakarta, note: "The Sultan's palace keeps the most refined speech; courtiers 'matur' (speak up to) the Sultan." }
        lessons:
          - { id: j4.u03.l01, kind: learn, title: "Matur lan sowan", can_do: "Speak and visit humbly.", grammar: [jv.krama-andhap], minutes: 12 }
          - { id: j4.u03.l02, kind: learn, title: "Nyuwun lan ngaturi", can_do: "Ask and offer humbly.", grammar: [jv.krama-andhap], minutes: 12 }
          - { id: j4.u03.l03, kind: practice, title: "Ngaturi rawuh", can_do: "Invite an elder to an event.", minutes: 10 }
          - { id: j4.u03.l04, kind: review, title: "Ulangan J4.3", can_do: "Pair andhap with inggil.", minutes: 8 }

      - id: j4.u04
        title: { target: "Tata krama", en: "Etiquette", ar: "آداب السلوك" }
        stop: Taman Sari
        can_do:
          - Use set phrases (nuwun sèwu, ndhèrèk langkung, monggo, matur nuwun sanget)
          - Combine words with gestures (bowing, thumb-pointing, right hand)
        grammar: [jv.etiquette.phrases]
        vocabulary: ["courtesy phrases", "gestures"]
        arabic_bridge:
          - "nuwun sèwu ≈ لا مؤاخذة / بعد إذنك; monggo ≈ اتفضل"
        culture: { souvenir: Taman Sari water palace, note: "Point with the thumb, pass things with the right hand, and stoop slightly when walking past seated elders ('ndhèrèk langkung')." }
        lessons:
          - { id: j4.u04.l01, kind: learn, title: "Nuwun sèwu, monggo", can_do: "Use courtesy phrases.", grammar: [jv.etiquette.phrases], minutes: 10 }
          - { id: j4.u04.l02, kind: learn, title: "Basa awak", can_do: "Match gestures to speech.", minutes: 10 }
          - { id: j4.u04.l03, kind: practice, title: "Unggah-Ungguh Simulator", can_do: "Pass five situations on the Respect Meter.", minutes: 12 }
          - { id: j4.u04.l04, kind: review, title: "Ulangan J4.4", can_do: "Handle a visit politely.", minutes: 8 }

      - id: j4.u05
        title: { target: "Ngoko alus", en: "Polite ngoko", ar: "النغوكو المهذّبة" }
        stop: Kotabaru
        can_do:
          - Mix ngoko with krama inggil for close-but-respected people (ngoko alus)
        grammar: [jv.speechlevel.mixed]
        vocabulary: ["ngoko alus patterns"]
        culture: { souvenir: Kotabaru colonial quarter, note: "Spouses, older siblings and close senior colleagues often get ngoko alus: familiar frame, honorific words for their actions." }
        lessons:
          - { id: j4.u05.l01, kind: learn, title: "Ngoko alus", can_do: "Build polite ngoko.", grammar: [jv.speechlevel.mixed], minutes: 14 }
          - { id: j4.u05.l02, kind: learn, title: "Krama alus", can_do: "Contrast with full krama.", grammar: [jv.speechlevel.mixed], minutes: 12 }
          - { id: j4.u05.l03, kind: practice, title: "Mas, sampéyan wis dhahar?", can_do: "Talk to an older friend.", minutes: 10 }
          - { id: j4.u05.l04, kind: review, title: "Ulangan J4.5", can_do: "Pick ngoko alus vs krama alus.", minutes: 8 }

      - id: j4.u06
        title: { target: "Wayang lan gamelan", en: "Wayang and gamelan", ar: "الوايانغ والغاميلان" }
        stop: Prambanan
        can_do:
          - Follow a simple wayang scene summary
          - Recognise levels used between characters (king, servant, clown)
        grammar: [jv.speechlevel.overview, jv.krama-andhap]
        vocabulary: ["wayang characters", "gamelan instruments"]
        culture: { souvenir: Ramayana ballet at Prambanan, note: "In wayang the punakawan clowns (Semar, Gareng, Petruk, Bagong) speak ngoko and joke; nobles speak krama — the levels are part of the drama." }
        lessons:
          - { id: j4.u06.l01, kind: learn, title: "Punakawan", can_do: "Hear levels in a wayang dialogue.", grammar: [jv.speechlevel.overview], minutes: 12 }
          - { id: j4.u06.l02, kind: learn, title: "Ratu lan abdi", can_do: "Notice andhap from servants.", grammar: [jv.krama-andhap], minutes: 12 }
          - { id: j4.u06.l03, kind: practice, title: "Crita wayang", can_do: "Summarise a scene.", minutes: 10 }
          - { id: j4.u06.l04, kind: review, title: "Ulangan J4.6", can_do: "Tag each line's level.", minutes: 8 }
    level_test:
      id: j4.test
      minutes: 35
      pass_mark: 0.75
      covers: ["krama inggil vs andhap", "honorific nouns", "etiquette phrases", "ngoko alus", "five Respect Meter situations"]

  # ───────────────────────────── J5 · Semarang (branch line) ─────────────────────────────
  - id: j5
    code: J5
    title: { target: "Semarang", en: "Reading real Javanese texts", ar: "قراءة نصوص جاوية حقيقية" }
    requires: [j4]
    journey: { place: Semarang, kind: branch_line, note: "A branch line north to the coast: Semarang, Kudus, Demak." }
    capability:
      en: Read real Javanese — Wikipedia articles, news, social posts and short stories — with help from the Reader, and understand their register.
    units:
      - id: j5.u01
        title: { target: "Wikipédia basa Jawa", en: "Javanese Wikipedia", ar: "ويكيبيديا الجاوية" }
        stop: Semarang Tawang
        can_do:
          - Read an encyclopedic article in standard written ngoko
          - Recognise written connectors (ing, saka, déning, iku, kang)
        grammar: [jv.reading.written-style]
        vocabulary: ["encyclopedic vocabulary"]
        culture: { souvenir: Kota Lama Semarang, note: "Javanese Wikipedia is written mostly in ngoko with formal connectors; it is a free, real corpus for practice." }
        lessons:
          - { id: j5.u01.l01, kind: learn, title: "Ing, kang, déning", can_do: "Read written connectors.", grammar: [jv.reading.written-style], minutes: 14 }
          - { id: j5.u01.l02, kind: practice, title: "Artikel Semarang", can_do: "Read an article about Semarang.", minutes: 15 }
          - { id: j5.u01.l03, kind: practice, title: "Ringkesan", can_do: "Summarise in Indonesian or Arabic.", minutes: 12 }
          - { id: j5.u01.l04, kind: review, title: "Ulangan J5.1", can_do: "Read a new article.", minutes: 10 }

      - id: j5.u02
        title: { target: "Warta", en: "News", ar: "الأخبار" }
        stop: Lawang Sewu
        can_do:
          - Read short news items in Javanese
          - Understand written passives with déning
        grammar: [jv.passive.written]
        vocabulary: ["news vocabulary"]
        culture: { souvenir: Lawang Sewu, note: "Regional TV and magazines (Panjebar Semangat, Jaya Baya) have published in Javanese for decades." }
        lessons:
          - { id: j5.u02.l01, kind: learn, title: "Di-… déning…", can_do: "Read written passives.", grammar: [jv.passive.written], minutes: 14 }
          - { id: j5.u02.l02, kind: practice, title: "Warta cekak", can_do: "Read a short news item.", minutes: 15 }
          - { id: j5.u02.l03, kind: practice, title: "Panjebar Semangat", can_do: "Read a magazine column.", minutes: 12 }
          - { id: j5.u02.l04, kind: review, title: "Ulangan J5.2", can_do: "Retell a news item.", minutes: 10 }

      - id: j5.u03
        title: { target: "Ejaan", en: "Spelling", ar: "الإملاء" }
        stop: Simpang Lima
        can_do:
          - Read standard spelling vs spoken / chat spelling (pira / piro, apa / opo)
          - Hear and write dh / d and th / t
        grammar: [jv.orthography]
        vocabulary: ["minimal pairs (dhadha / dada)", "a vs å"]
        culture: { souvenir: Simpang Lima square, note: "Standard spelling writes 'a' where speakers say 'o' at word end (pira, sega); chats spell by ear. Minimal Pairs game trains dh / d and th / t." }
        lessons:
          - { id: j5.u03.l01, kind: learn, title: "Pira utawa piro?", can_do: "Map spoken to standard spelling.", grammar: [jv.orthography], minutes: 12 }
          - { id: j5.u03.l02, kind: learn, title: "Dh / d, th / t", can_do: "Tell retroflex from dental.", grammar: [jv.orthography], minutes: 12 }
          - { id: j5.u03.l03, kind: practice, title: "Minimal Pairs", can_do: "Pass a listening round.", minutes: 10 }
          - { id: j5.u03.l04, kind: review, title: "Ulangan J5.3", can_do: "Normalise a chat into standard spelling.", minutes: 8 }

      - id: j5.u04
        title: { target: "Medsos", en: "Social media", ar: "وسائل التواصل" }
        stop: Ambarawa
        can_do:
          - Read posts that mix Javanese, Indonesian and English
          - Tag each word's language and register
        grammar: [jv.codemix]
        vocabulary: ["slang", "memes", "comments"]
        culture: { souvenir: Ambarawa railway museum, note: "Most real Javanese online is code-mixed; Kabar's Reader tags each token's language." }
        lessons:
          - { id: j5.u04.l01, kind: learn, title: "Campur kode", can_do: "Read code-mixed posts.", grammar: [jv.codemix], minutes: 12 }
          - { id: j5.u04.l02, kind: practice, title: "Komentar TikTok", can_do: "Decode a comment thread.", minutes: 12 }
          - { id: j5.u04.l03, kind: practice, title: "Screenshot Decoder", can_do: "Read a real screenshot with the Reader.", minutes: 12 }
          - { id: j5.u04.l04, kind: review, title: "Ulangan J5.4", can_do: "Explain a mixed post.", minutes: 8 }

      - id: j5.u05
        title: { target: "Cerkak", en: "Short stories", ar: "القصص القصيرة" }
        stop: Kudus
        can_do:
          - Read a short Javanese story (cerkak)
          - Follow narrative connectors (banjur, nuli, sawisé, nalika)
        grammar: [jv.narrative.connectors]
        vocabulary: ["narrative vocabulary"]
        arabic_bridge:
          - "Kudus ← القدس: the town was named by Sunan Kudus after Jerusalem"
        culture: { souvenir: Menara Kudus, note: "Kudus's minaret blends a Hindu-Javanese temple form with a mosque — a picture of how Islam came to Java." }
        lessons:
          - { id: j5.u05.l01, kind: learn, title: "Banjur, nuli, nalika", can_do: "Follow a story's sequence.", grammar: [jv.narrative.connectors], minutes: 12 }
          - { id: j5.u05.l02, kind: practice, title: "Cerkak", can_do: "Read a short story.", minutes: 15 }
          - { id: j5.u05.l03, kind: practice, title: "Critakna manèh", can_do: "Retell it in simple Javanese.", minutes: 12 }
          - { id: j5.u05.l04, kind: review, title: "Ulangan J5.5", can_do: "Read a new cerkak.", minutes: 10 }

      - id: j5.u06
        title: { target: "Tembang lan campursari", en: "Songs", ar: "الأغاني" }
        stop: Demak
        can_do:
          - Understand popular song lyrics (campursari, dangdut koplo)
          - Recognise a macapat stanza
        grammar: [jv.narrative.connectors, jv.reading.written-style]
        vocabulary: ["love-song vocabulary", "poetic words"]
        culture: { souvenir: Demak Great Mosque, note: "The Wali Sanga used tembang (sung verse) to teach Islam; 'Lir-ilir' by Sunan Kalijaga is still sung today." }
        lessons:
          - { id: j5.u06.l01, kind: learn, title: "Lir-ilir", can_do: "Read a classic song.", grammar: [jv.reading.written-style], minutes: 12 }
          - { id: j5.u06.l02, kind: practice, title: "Campursari", can_do: "Follow a modern song.", grammar: [jv.narrative.connectors], minutes: 12 }
          - { id: j5.u06.l03, kind: practice, title: "Macapat", can_do: "Recognise verse forms.", minutes: 12 }
          - { id: j5.u06.l04, kind: review, title: "Ulangan J5.6", can_do: "Explain a song's meaning.", minutes: 8 }
    level_test:
      id: j5.test
      minutes: 40
      pass_mark: 0.7
      covers: ["Wikipedia reading", "news passives", "spelling normalisation", "code-mixed posts", "a cerkak"]

  # ───────────────────────────── J6 · Kotagede ─────────────────────────────
  - id: j6
    code: J6
    title: { target: "Kutha Gedhé", en: "Aksara Jawa (Javanese script)", ar: "الأبجدية الجاوية (هانا تشارا كا)" }
    requires: [j5]
    journey: { place: "Kotagede, old Mataram capital", kind: city, note: "End of the line." }
    capability:
      en: Read and write aksara Jawa (with pen calligraphy on the tablet), and recognise Pegon, Javanese in Arabic script.
    units:
      - id: j6.u01
        title: { target: "Hanacaraka", en: "The 20 base letters", ar: "الحروف العشرون" }
        stop: Pasar Kotagedhé
        can_do:
          - Read and write the 20 aksara nglegena (ha na ca ra ka …)
          - Tell the story behind the letter order (Aji Saka)
        grammar: [jv.aksara.nglegena]
        vocabulary: ["letters", "simple syllables"]
        culture: { souvenir: Kotagede silver, note: "The alphabet's order is a poem about Aji Saka's two loyal servants who fought to the death: 'ha na ca ra ka — there were two messengers…'." }
        lessons:
          - { id: j6.u01.l01, kind: learn, title: "Ha na ca ra ka", can_do: "Write the first five letters.", grammar: [jv.aksara.nglegena], minutes: 14 }
          - { id: j6.u01.l02, kind: learn, title: "Da ta sa wa la", can_do: "Write the next five.", grammar: [jv.aksara.nglegena], minutes: 14 }
          - { id: j6.u01.l03, kind: learn, title: "Pa dha ja ya nya, ma ga ba tha nga", can_do: "Complete the 20.", grammar: [jv.aksara.nglegena], minutes: 16 }
          - { id: j6.u01.l04, kind: review, title: "Ulangan J6.1", can_do: "Write all 20 from memory.", minutes: 10 }

      - id: j6.u02
        title: { target: "Sandhangan swara", en: "Vowel marks", ar: "علامات الحركات" }
        stop: Masjid Gedhé Mataram
        can_do:
          - Add vowels with wulu, suku, taling, pepet, taling tarung
        grammar: [jv.aksara.sandhangan-swara]
        vocabulary: ["syllables with all vowels"]
        arabic_bridge:
          - "Like Arabic harakat: the base letter carries an inherent vowel, marks change it"
        culture: { souvenir: Kotagede Grand Mosque, note: "The mosque (1587) is Mataram's oldest; its gate is in Hindu-Javanese style." }
        lessons:
          - { id: j6.u02.l01, kind: learn, title: "Wulu lan suku", can_do: "Write i and u.", grammar: [jv.aksara.sandhangan-swara], minutes: 12 }
          - { id: j6.u02.l02, kind: learn, title: "Taling lan pepet", can_do: "Write é / è and ê.", grammar: [jv.aksara.sandhangan-swara], minutes: 12 }
          - { id: j6.u02.l03, kind: practice, title: "Maca tembung", can_do: "Read short words.", minutes: 12 }
