      covers: ["family and food talk", "numbers to millions", "time and pasaran", "ngoko commands"]

  # ───────────────────────────── J3 · Solo ─────────────────────────────
  - id: j3
    code: J3
    title: { target: "Sala", en: "Krama basics: when and with whom", ar: "أساسيات الكراما: متى ومع من" }
    requires: [j2]
    journey: { place: "Solo (Surakarta)", kind: train_line }
    capability:
      en: Know when to switch from ngoko to krama, and hold a short polite exchange in krama with an elder, a seller or a stranger.
    units:
      - id: j3.u01
        title: { target: "Unggah-ungguh", en: "Speech levels", ar: "مستويات الكلام" }
        stop: Solo Balapan
        can_do:
          - Explain ngoko, krama, krama inggil and krama andhap with Egyptian analogies
          - Choose a level from the situation (friend, seller, a friend's grandmother, teacher, elder)
        grammar: [jv.speechlevel.overview]
        vocabulary: ["one sentence in three levels (\"Have you eaten?\")"]
        arabic_bridge:
          - "ngoko ≈ إنت, krama ≈ حضرتك, krama inggil ≈ سيادتك — but Javanese changes whole words, not just pronouns"
        register: all levels
        culture: { souvenir: Solo Balapan station, note: "Solo is the heartland of refined Javanese (alus); using krama here earns instant respect." }
        lessons:
          - { id: j3.u01.l01, kind: learn, title: "Ngoko lan krama", can_do: "Tell ngoko from krama and use each with the right person.", grammar: [jv.speechlevel.overview], minutes: 6 }
          - { id: j3.u01.l02, kind: learn, title: "Krama inggil", can_do: "Honour elders with krama inggil and stay humble about yourself.", grammar: [jv.speechlevel.overview], minutes: 5 }
          - { id: j3.u01.l03, kind: learn, title: "Kowe wis mangan?", can_do: "Compare one sentence across levels.", grammar: [jv.speechlevel.overview], minutes: 7 }
          - { id: j3.u01.l04, kind: practice, title: "Respect Meter", can_do: "Pick a level for five situations (Unggah-Ungguh Simulator, lite).", minutes: 6 }
          - { id: j3.u01.l05, kind: practice, title: "Pesen ing HP", can_do: "Read three short messages and tell which level each uses.", minutes: 5 }
          - { id: j3.u01.l06, kind: practice, title: "Ing Solo Balapan", can_do: "Hear who is talking to whom from the level.", minutes: 5 }
          - { id: j3.u01.l07, kind: review, title: "Ulangan J3.1", can_do: "Justify a level choice.", minutes: 7 }

      - id: j3.u02
        title: { target: "Kula lan panjenengan", en: "Polite pronouns", ar: "الضمائر المهذبة" }
        stop: Pasar Gede
        can_do:
          - Use kula, sampeyan, panjenengan, piyambakipun
        grammar: [jv.pronoun.krama]
        vocabulary: ["pronouns across levels"]
        culture: { souvenir: Pasar Gede, note: "'Sampeyan' is polite but everyday; 'panjenengan' is for elders and people you honour." }
        lessons:
          - { id: j3.u02.l01, kind: learn, title: "Kula", can_do: "Say I in krama.", grammar: [jv.pronoun.krama], minutes: 7 }
          - { id: j3.u02.l02, kind: learn, title: "Sampeyan utawa panjenengan?", can_do: "Choose a polite you.", grammar: [jv.pronoun.krama], minutes: 7 }
          - { id: j3.u02.l03, kind: practice, title: "Ngobrol karo simbah", can_do: "Talk to a friend's grandmother.", minutes: 6 }
          - { id: j3.u02.l04, kind: practice, title: "Sugeng rawuh, Mas Mohamed", can_do: "Read a host's krama welcome note and answer it.", minutes: 6 }
          - { id: j3.u02.l05, kind: practice, title: "Kenalan ing Pasar Gede", can_do: "Follow a krama introduction by ear.", minutes: 5 }
          - { id: j3.u02.l06, kind: practice, title: "Layang saka Mohamed", can_do: "Write a krama thank-you note to an elder.", minutes: 5 }
          - { id: j3.u02.l07, kind: review, title: "Ulangan J3.2", can_do: "Swap pronouns by situation.", minutes: 7 }

      - id: j3.u03
        title: { target: "Tembung krama", en: "Core krama words", ar: "كلمات الكراما الأساسية" }
        stop: Kauman
        can_do:
          - Use the krama function words (sampun, dereng, badhe, mboten, wonten, saking, dhateng)
