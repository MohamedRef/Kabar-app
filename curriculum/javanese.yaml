# Kabar — Javanese curriculum (J1 → J6), a train line across Java (SPEC §10, §21).
# Shape: schemas/curriculum.schema.json. Checked by `cargo test -p kabar-content`.
#
# There is no official Javanese-for-foreigners standard comparable to BIPA, so this
# sequence is Kabar's own design, built on the level themes fixed in SPEC §21.
# Everything Javanese is UNVERIFIED until the user (or a native speaker) approves it:
# word lists, speech-level pairs and the grammar library entries this file points to.
# Grammar ids (jv.*) are planned; their library entries arrive with M11 / M13.
schema: kabar.curriculum/v1
language: jv
title: { target: "Basa Jawa", en: "Javanese (J1–J6)", ar: "الجاوية (J١–J٦)" }

framework:
  name: Kabar Javanese track (J1–J6)
  summary: >-
    Six levels from survival chat Javanese to aksara Jawa. Javanese unlocks when BIPA 1
    is done, then runs in parallel with Indonesian. Every point is explained by
    contrast with Indonesian (which the learner already studies) and through Arabic /
    Egyptian analogies (ngoko ≈ إنت, krama ≈ حضرتك, krama inggil ≈ سيادتك — while making
    clear Javanese swaps whole vocabularies, not just pronouns).
  cefr_note: >-
    No published CEFR mapping exists for Javanese as a foreign language. Levels are
    sized by content, not by CEFR; J1–J2 aim at roughly A1–A2 in ngoko.
  unlock: J1 requires BIPA 1; each later J level requires the previous one. Skipping ahead is allowed via the level test.
  lesson_pattern: Same lesson shape and caps as Indonesian (slides → exercises → mini dialogue → new words → souvenir, at most 7 minutes; docs/PEDAGOGY.md); every unit ends with a review.
  notes:
    - "Spelling: Kabar teaches standard orthography (pira, apa, kowe) and shows the chat / spoken spelling next to it (piro, opo, kowe), because real messages use the latter."
    - "Dialect: J1 adds a taste of Surabaya Arek (gak, koen, rek); J2 onwards is Mataraman (Solo–Yogya–Madiun) Javanese, the standard taught in schools."
    - Speech-level data comes from the content pipeline's speech-level table and stays flagged unverified until reviewed.
    - Avoid teaching vulgar Arek words actively; the Reader explains them if they appear in real chats.

sources:
  - id: kabar-spec
    title: Kabar SPEC v4 §10, §13, §21, §24
    used_for: Level themes, journey map, unggah-ungguh analogies, test sentences.
  - id: wiktionary-jv
    title: Wiktionary — Javanese entries (via kaikki.org)
    url: https://kaikki.org/dictionary/Javanese/
    used_for: Planned cross-check of vocabulary and speech-level pairs (M3 / M11).

levels:
  # ───────────────────────────── J1 · Surabaya ─────────────────────────────
  - id: j1
    code: J1
    title: { target: "Suroboyo", en: "Survival ngoko and chat Javanese", ar: "النغوكو للنجاة وجاوية الدردشة" }
    requires: [bipa1]
    journey: { place: Surabaya, kind: train_line, note: "Start of the line: Surabaya Pasar Turi / Gubeng." }
    capability:
      en: Greet, ask simple questions and read short WhatsApp-style Javanese messages among friends, in ngoko, with a taste of Surabaya Arek.
    skills:
      listening:
        - Recognise everyday ngoko greetings and questions
        - Tell Javanese from Indonesian in a mixed sentence
      speaking:
        - Greet friends and ask how they are in ngoko
        - Ask simple questions (what, who, where, how much)
      reading:
        - Decode chat abbreviations (arp, ng, sek, wis, gk)
        - Read the SPEC test chats ("Sek tak lapor pusat", "arp dicul piro")
      writing:
        - Write short chat replies in ngoko
    units:
      - id: j1.u01
        title: { target: "Piye kabare, rek?", en: "How are you?", ar: "كيف حالك؟" }
        stop: Pasar Turi
        can_do:
          - Greet friends and answer "Piye kabare?"
          - Use aku / kowe and address terms (mas, mbak, rek, cak, dhe)
        grammar: [jv.pronoun.ngoko, jv.address.terms]
        vocabulary:
          - greetings (sugeng enjing, piye kabare, apik, matur nuwun / suwun)
          - address terms and kinship shortcuts
        arabic_bridge:
          - "kabar ← خبر works in Javanese too: piye kabare? = إزيك؟ / كيف حالك؟"
        register: ngoko (with Arek flavour)
        culture: { souvenir: Suroboyo Bus, note: "Surabaya, the City of Heroes, speaks Arek Javanese — direct, egalitarian, quick. 'Rek' (from arek, kid) ends half the sentences." }
        lessons:
          - { id: j1.u01.l01, kind: learn, title: "Sugeng enjing", can_do: "Greet politely at any time of day.", minutes: 7 }
          - { id: j1.u01.l02, kind: learn, title: "Piye kabare?", can_do: "Ask how someone is, thank them and say take care.", minutes: 7 }
          - { id: j1.u01.l03, kind: learn, title: "Aku lan kowe", can_do: "Say I and you in ngoko.", grammar: [jv.pronoun.ngoko], minutes: 7 }
          - { id: j1.u01.l04, kind: learn, title: "Mas, mbak, cak, rek", can_do: "Address people casually.", grammar: [jv.address.terms], minutes: 7 }
          - { id: j1.u01.l05, kind: review, title: "Ulangan J1.1", can_do: "Greet three different people.", minutes: 7 }

      - id: j1.u02
        title: { target: "Sapa kowe?", en: "Who are you?", ar: "مين إنت؟" }
        stop: Gubeng
        can_do:
          - Introduce yourself in ngoko
          - Ask apa / sapa / ngendi / kapan / piye / pira
        grammar: [jv.question.words, jv.sentence.basic]
        vocabulary:
          - question words with Indonesian equivalents (apa = apa, sapa = siapa, ngendi = di mana, piye = bagaimana, pira = berapa)
          - countries, jobs
        culture: { souvenir: Gubeng station, note: "Javanese question words are the first thing to learn: piye (how) and pira (how much) are everywhere in chats." }
        lessons:
          - { id: j1.u02.l01, kind: learn, title: "Apa, sapa, ngendi", can_do: "Ask what, who, where and when.", grammar: [jv.question.words], minutes: 7 }
          - { id: j1.u02.l02, kind: learn, title: "Pira? Ngapa?", can_do: "Ask how much, why and what someone is doing, also the Surabaya way.", grammar: [jv.question.words], minutes: 7 }
          - { id: j1.u02.l03, kind: learn, title: "Jenengku…", can_do: "Introduce yourself in ngoko.", grammar: [jv.sentence.basic], minutes: 7 }
          - { id: j1.u02.l04, kind: practice, title: "Kenalan nang warung kopi", can_do: "Chat with a stranger at a coffee stall.", minutes: 6 }
          - { id: j1.u02.l05, kind: review, title: "Ulangan J1.2", can_do: "Introduce yourself and ask back.", minutes: 7 }

      - id: j1.u03
        title: { target: "Chat Jawa", en: "Chat Javanese", ar: "جاوية الدردشة" }
        stop: Tunjungan
        can_do:
          - Decode chat spelling (arp → arep, ng → nang, sek, wis, gk)
          - Say done / not yet / now / going to (wis, durung, lagi, arep)
          - Spot Javanese marker words versus Indonesian (ora vs tidak, wis vs sudah)
        grammar: [jv.chat.normalize, jv.aspect.wis-durung-lagi-arep, jv.marker.vs-indonesian]
        vocabulary:
          - chat abbreviations
          - marker words (ora, opo, piye, arep, wis, durung, karo, kowe, sing)
        culture: { souvenir: Jalan Tunjungan at night, note: "Young Javanese write in a mix of Indonesian and Javanese with heavy abbreviation; Kabar's Reader normalises it, this unit teaches you to do it yourself." }
        lessons:
          - { id: j1.u03.l01, kind: learn, title: "Wis, durung, lagi, arep", can_do: "Show when things happen.", grammar: [jv.aspect.wis-durung-lagi-arep], minutes: 7 }
          - { id: j1.u03.l02, kind: learn, title: "arp, ng, sek, gk", can_do: "Normalise chat spelling.", grammar: [jv.chat.normalize], minutes: 7 }
          - { id: j1.u03.l03, kind: learn, title: "Jawa apa Indonesia?", can_do: "Tag each word's language.", grammar: [jv.marker.vs-indonesian], minutes: 7 }
          - { id: j1.u03.l04, kind: practice, title: "Status WA", can_do: "Read friends' chat statuses and reply.", minutes: 6 }
          - { id: j1.u03.l05, kind: review, title: "Ulangan J1.3", can_do: "Read a group chat.", minutes: 7 }

      - id: j1.u04
        title: { target: "Sek, tak lapor", en: "Hold on, I'll report", ar: "استنى، هبلّغ" }
        stop: Ampel
        can_do:
          - Use tak- (I'll), kok- and di- with verbs (mbok as a softening particle)
          - Soften and colour sentences with particles (ta, ae, lho, kok, ya)
          - Understand "Sek tak lapor pusat"
        grammar: [jv.proclitic.tak-kok-di, jv.particle.basic]
        vocabulary:
          - everyday verbs (lapor, tuku, ngomong, takon, tunggu)
          - particles
        arabic_bridge:
          - "Ampel's mosque was founded by Sunan Ampel, one of the Wali Sanga who brought Islam to Java"
        culture: { souvenir: Sunan Ampel mosque, note: "The Ampel quarter is Surabaya's Arab town: dates, perfume, and Arabic-Javanese families since the 15th century." }
        lessons:
          - { id: j1.u04.l01, kind: learn, title: "Tak tuku, dituku", can_do: "Use tak- and di- on verbs.", grammar: [jv.proclitic.tak-kok-di], minutes: 7 }
          - { id: j1.u04.l02, kind: learn, title: "Ta, ae, lho, kok", can_do: "Use chat particles.", grammar: [jv.particle.basic], minutes: 7 }
          - { id: j1.u04.l03, kind: practice, title: "Sek tak lapor pusat", can_do: "Decode and answer the SPEC test chat.", minutes: 7 }
          - { id: j1.u04.l04, kind: practice, title: "VN saka Cak Heru", can_do: "Follow a voice note with tak, lho and kok.", minutes: 6 }
          - { id: j1.u04.l05, kind: review, title: "Ulangan J1.4", can_do: "Reply to four chat messages.", minutes: 7 }

      - id: j1.u05
        title: { target: "Arek Suroboyo", en: "Surabaya Arek speech", ar: "كلام أهل سورابايا" }
        stop: Kenjeran
        can_do:
          - Recognise Arek forms (koen, awakmu, gak, rek, cak, ning)
          - Negate with ora / gak / dudu
          - Understand "Koen wis mangan ta, rek?"
        grammar: [jv.dialect.arek, jv.negation.ora-dudu]
        vocabulary:
          - Arek pronouns and negators
          - Mataraman equivalents
        culture: { souvenir: Kenjeran beach, note: "Arek speech sounds blunt to Central Javanese ears; between friends it is warm, not rude. Know it, but default to standard ngoko with strangers." }
        lessons:
          - { id: j1.u05.l01, kind: learn, title: "Ora, gak, dudu", can_do: "Negate verbs and nouns.", grammar: [jv.negation.ora-dudu], minutes: 7 }
          - { id: j1.u05.l02, kind: learn, title: "Koen lan awakmu", can_do: "Recognise Arek forms.", grammar: [jv.dialect.arek], minutes: 7 }
          - { id: j1.u05.l03, kind: practice, title: "Rek!", can_do: "Follow a fast Arek dialogue.", minutes: 6 }
          - { id: j1.u05.l04, kind: practice, title: "Nang warung Kenjeran", can_do: "Read a warung sign in Arek and order.", minutes: 6 }
          - { id: j1.u05.l05, kind: review, title: "Ulangan J1.5", can_do: "Translate Arek to standard ngoko.", minutes: 7 }

      - id: j1.u06
        title: { target: "Nang endi?", en: "Where to?", ar: "على فين؟" }
        stop: Wonokromo
        can_do:
          - Say where (nang / neng / ing, saka) and here / there (kene, kono, kana)
          - Point with iki / iku (kuwi) / kae
          - Understand "ng prabowo?"
        grammar: [jv.preposition.place, jv.demonstrative]
        vocabulary:
          - places in town
          - directions (ngiwa, nengen, lurus)
        culture: { souvenir: Surabaya zoo, note: "In chats 'ng' can be nang/neng (to, at); context decides." }
        lessons:
          - { id: j1.u06.l01, kind: learn, title: "Nang, neng, saka", can_do: "Say to, at and from; say here and there.", grammar: [jv.preposition.place], minutes: 7 }
          - { id: j1.u06.l02, kind: learn, title: "Ngarep, mburi, ngiwa", can_do: "Say where things are and give simple directions.", grammar: [jv.preposition.place], minutes: 7 }
          - { id: j1.u06.l03, kind: learn, title: "Iki, kuwi, kae", can_do: "Point near and far.", grammar: [jv.demonstrative], minutes: 7 }
          - { id: j1.u06.l04, kind: practice, title: "Takon dalan", can_do: "Ask and follow directions.", minutes: 6 }
          - { id: j1.u06.l05, kind: review, title: "Ulangan J1.6", can_do: "Give directions in ngoko.", minutes: 7 }

      - id: j1.u07
        title: { target: "Pira?", en: "How much?", ar: "بكام؟" }
        stop: Pasar Atom
        can_do:
          - Count and say prices in ngoko (siji … sepuluh, sewu, sejuta)
          - Use -ake / -ke verbs (diculke)
          - Understand "arp dicul piro" and haggle (larang, murah)
        grammar: [jv.number.ngoko, jv.suffix.ake]
        vocabulary:
          - numbers and money
          - market words (piro, larang, murah, tuku, adol)
        culture: { souvenir: Pasar Atom, note: "Market Javanese is the most useful Javanese of all; a few words get you a smile and a better price (Pasar! mini-game, Javanese round)." }
        lessons:
          - { id: j1.u07.l01, kind: learn, title: "Siji, loro, telu", can_do: "Count from one to five and order drinks.", grammar: [jv.number.ngoko], minutes: 6 }
          - { id: j1.u07.l02, kind: learn, title: "Enem … sepuluh", can_do: "Count from six to ten.", grammar: [jv.number.ngoko], minutes: 5 }
          - { id: j1.u07.l03, kind: learn, title: "Rong ewu, satus", can_do: "Say prices in thousands and haggle politely.", grammar: [jv.number.ngoko], minutes: 7 }
          - { id: j1.u07.l04, kind: learn, title: "Diculke", can_do: "Use -ake / -ke verbs.", grammar: [jv.suffix.ake], minutes: 7 }
          - { id: j1.u07.l05, kind: practice, title: "Arp dicul piro?", can_do: "Haggle over a second-hand phone.", minutes: 6 }
          - { id: j1.u07.l06, kind: review, title: "Ulangan J1.7", can_do: "Buy something in Javanese.", minutes: 7 }
    level_test:
      id: j1.test
      minutes: 25
      pass_mark: 0.75
      covers: ["SPEC §24 Javanese chat lines", "ngoko greetings and questions", "numbers and prices", "Arek vs standard forms"]

  # ───────────────────────────── J2 · Madiun ─────────────────────────────
  - id: j2
    code: J2
    title: { target: "Madiun", en: "Everyday ngoko (Mataraman)", ar: "النغوكو اليومية (ماتارامان)" }
    requires: [j1]
    journey: { place: Madiun, kind: train_line, note: "West along the line into Mataraman country: Madiun, Ponorogo, Ngawi." }
    capability:
      en: Talk about family, food, the market, time and numbers in everyday Mataraman ngoko.
    units:
      - id: j2.u01
        title: { target: "Kulawarga", en: "Family", ar: "العائلة" }
        stop: Madiun
        can_do:
          - Name family members (bapak, simbok / ibu, mas, mbakyu, adhi, pakdhe, budhe)
          - Show possession with -e / -ne
        grammar: [jv.possessive.e-ne, jv.kinship.terms]
        vocabulary: ["family", "Pak Budi's warung family (Sinetron cast)"]
        culture: { souvenir: Pak Budi's warung, note: "Kabar's Sinetron starts here: Pak Budi runs a warung in Madiun; his daughter Sari studies in Cairo." }
        lessons:
          - { id: j2.u01.l01, kind: learn, title: "Bapak, ibu, mbakyu", can_do: "Name your parents and siblings.", grammar: [jv.kinship.terms], minutes: 7 }
          - { id: j2.u01.l02, kind: learn, title: "Pakdhe, bulik, simbah", can_do: "Name uncles, aunts, grandparents and your spouse.", grammar: [jv.kinship.terms], minutes: 7 }
          - { id: j2.u01.l03, kind: learn, title: "Omahe, bukune", can_do: "Use -e / -ne.", grammar: [jv.possessive.e-ne], minutes: 7 }
          - { id: j2.u01.l04, kind: practice, title: "Kulawargane Pak Budi", can_do: "Describe a family.", minutes: 6 }
          - { id: j2.u01.l05, kind: practice, title: "Kulawargaku", can_do: "Read a short post about a family.", minutes: 6 }
          - { id: j2.u01.l06, kind: review, title: "Ulangan J2.1", can_do: "Describe your family in ngoko.", minutes: 7 }

      - id: j2.u02
        title: { target: "Mangan apa?", en: "What shall we eat?", ar: "ناكل إيه؟" }
        stop: Caruban
        can_do:
          - Order food and talk about taste
          - Form active verbs with the nasal prefix N- (nulis, maca, nggawe, ngombe)
        grammar: [jv.prefix.nasal]
        vocabulary: ["pecel Madiun", "drinks", "tastes (enak, pedhes, legi, asin)"]
        culture: { souvenir: Nasi pecel Madiun, note: "Madiun is the home of nasi pecel — vegetables in peanut sauce on a teak leaf." }
        lessons:
          - { id: j2.u02.l01, kind: learn, title: "Nulis, maca, ngombe", can_do: "Use N- verbs.", grammar: [jv.prefix.nasal], minutes: 7 }
          - { id: j2.u02.l02, kind: learn, title: "Pedhes, legi, asin", can_do: "Say how food tastes.", minutes: 7 }
          - { id: j2.u02.l03, kind: learn, title: "Sega lan teh anget", can_do: "Order rice, eggs and drinks at a warung.", minutes: 6 }
          - { id: j2.u02.l04, kind: practice, title: "Tuku pecel", can_do: "Order at a pecel stall.", minutes: 7 }
          - { id: j2.u02.l05, kind: practice, title: "Menu warung pecel", can_do: "Read a warung menu and order from it.", minutes: 6 }
          - { id: j2.u02.l06, kind: review, title: "Ulangan J2.2", can_do: "Order a meal.", minutes: 7 }

      - id: j2.u03
        title: { target: "Nang Pasar", en: "At the market", ar: "في السوق" }
        stop: Nganjuk
        can_do:
          - Say any number and price (sewelas, rolas, selikur, seket, sewidak, satus)
          - Bargain politely
        grammar: [jv.number.full]
        vocabulary: ["big numbers", "quantities", "bargaining"]
        culture: { souvenir: Nganjuk onions, note: "Javanese numbers have special forms (selikur 21, selawe 25, seket 50, sewidak 60) worth learning for prices." }
        lessons:
          - { id: j2.u03.l01, kind: learn, title: "Sewelas, rolas, selikur", can_do: "Count from 11 to 29 and say your age.", grammar: [jv.number.full], minutes: 7 }
          - { id: j2.u03.l02, kind: learn, title: "Seket, sewidak, satus", can_do: "Count up to 100 and talk about amounts.", grammar: [jv.number.full], minutes: 6 }
          - { id: j2.u03.l03, kind: learn, title: "Ewu lan yuta", can_do: "Say Rupiah prices in Javanese.", grammar: [jv.number.full], minutes: 7 }
          - { id: j2.u03.l04, kind: practice, title: "Pasar! Jawa", can_do: "Haggle in Javanese.", minutes: 6 }
          - { id: j2.u03.l05, kind: practice, title: "Notane Bu Karti", can_do: "Read a market bill and check the change.", minutes: 6 }
          - { id: j2.u03.l06, kind: review, title: "Ulangan J2.3", can_do: "Handle prices and change.", minutes: 7 }

      - id: j2.u04
        title: { target: "Wayah lan Dina", en: "Time and days", ar: "الوقت والأيام" }
        stop: Ponorogo
        can_do:
          - Tell the time and the days of the week
          - Name the five pasaran days (Legi, Pahing, Pon, Wage, Kliwon)
        grammar: [jv.time.expressions]
        vocabulary: ["clock times", "days", "pasaran", "wingi / sesuk / saiki"]
        culture: { souvenir: Reog Ponorogo, note: "Javanese weeks combine the 7-day week with a 5-day market week; 'Jumat Kliwon' is a famous combination. Reog's giant peacock mask is Ponorogo's pride." }
        lessons:
          - { id: j2.u04.l01, kind: learn, title: "Jam pira?", can_do: "Tell the time.", grammar: [jv.time.expressions], minutes: 7 }
          - { id: j2.u04.l02, kind: learn, title: "Senen, Selasa, Rebo", can_do: "Name the days of the week.", minutes: 7 }
          - { id: j2.u04.l03, kind: learn, title: "Legi, Pahing, Pon", can_do: "Use pasaran days and ask about someone's weton.", minutes: 7 }
          - { id: j2.u04.l04, kind: practice, title: "Janjian", can_do: "Make an appointment.", minutes: 6 }
          - { id: j2.u04.l05, kind: practice, title: "Jadwal sepur", can_do: "Read a train timetable and pick a train.", minutes: 6 }
          - { id: j2.u04.l06, kind: review, title: "Ulangan J2.4", can_do: "Plan a week.", minutes: 7 }

      - id: j2.u05
        title: { target: "Saben Dina", en: "Every day", ar: "كل يوم" }
        stop: Magetan
        can_do:
          - Describe your routine
          - Give ngoko commands (-en, -na, -a) and use -i verbs
        grammar: [jv.imperative.ngoko, jv.suffix.i]
        vocabulary: ["routine verbs", "chores"]
        culture: { souvenir: Lake Sarangan, note: "Javanese commands are softened with 'ya' or 'to'; a bare command sounds harsh." }
        lessons:
          - { id: j2.u05.l01, kind: learn, title: "Mangana! Panganen!", can_do: "Tell a friend to eat, read or wake up, and say don't.", grammar: [jv.imperative.ngoko], minutes: 6 }
          - { id: j2.u05.l02, kind: learn, title: "Tukokna! Enteni!", can_do: "Ask someone to buy, fetch, wait or help.", grammar: [jv.imperative.ngoko], minutes: 7 }
          - { id: j2.u05.l03, kind: learn, title: "Nyirami, nekani", can_do: "Use -i verbs.", grammar: [jv.suffix.i], minutes: 7 }
          - { id: j2.u05.l04, kind: practice, title: "Dinane Sari", can_do: "Narrate a day.", minutes: 7 }
          - { id: j2.u05.l05, kind: practice, title: "Layang saka Ibu", can_do: "Read a note full of requests and act on it.", minutes: 6 }
          - { id: j2.u05.l06, kind: review, title: "Ulangan J2.5", can_do: "Describe your routine.", minutes: 7 }

      - id: j2.u06
        title: { target: "Dolan-dolan", en: "Going out", ar: "الخروج والفسحة" }
        stop: Ngawi
        can_do:
          - Use reduplication (mlaku-mlaku, dolan-dolan)
          - Intensify (banget, tenan, pol)
          - Link ideas (lan, karo, nanging, terus, merga)
        grammar: [jv.reduplication, jv.intensifier, jv.conjunction.basic]
        vocabulary: ["leisure", "feelings"]
        culture: { souvenir: Benteng Pendem Ngawi, note: "Ngawi's Dutch fort and the Solo river are weekend spots; 'dolan' (go out, visit) is a key verb." }
        lessons:
          - { id: j2.u06.l01, kind: learn, title: "Mlaku-mlaku", can_do: "Use reduplication.", grammar: [jv.reduplication], minutes: 7 }
          - { id: j2.u06.l02, kind: learn, title: "Apik banget, apik tenan", can_do: "Intensify.", grammar: [jv.intensifier], minutes: 7 }
          - { id: j2.u06.l03, kind: learn, title: "Lan, nanging, terus", can_do: "Link sentences.", grammar: [jv.conjunction.basic], minutes: 7 }
          - { id: j2.u06.l04, kind: practice, title: "Status Dimas", can_do: "Read a short post about a rainy weekend.", minutes: 6 }
          - { id: j2.u06.l05, kind: practice, title: "VN saka Sari", can_do: "Follow a voice note inviting you out.", minutes: 6 }
          - { id: j2.u06.l06, kind: review, title: "Ulangan J2.6", can_do: "Tell a weekend story.", minutes: 7 }
    level_test:
