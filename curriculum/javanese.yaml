        grammar: [jv.krama.function-words]
        vocabulary: ["ngoko ↔ krama pairs (wis ↔ sampun, durung ↔ dereng, arep ↔ badhe, ora ↔ mboten, ana ↔ wonten)"]
        culture: { souvenir: Kauman batik village, note: "Kauman, next to the Grand Mosque, was the quarter of the mosque's religious officials and is now famous for batik." }
        lessons:
          - { id: j3.u03.l01, kind: learn, title: "Sampun, dereng, badhe", can_do: "Use krama aspect words.", grammar: [jv.krama.function-words], minutes: 7 }
          - { id: j3.u03.l02, kind: learn, title: "Mboten lan wonten", can_do: "Negate and say there is.", grammar: [jv.krama.function-words], minutes: 7 }
          - { id: j3.u03.l03, kind: practice, title: "Sampeyan sampun nedha?", can_do: "Ask and answer politely.", minutes: 7 }
          - { id: j3.u03.l04, kind: practice, title: "Tulisan ing toko", can_do: "Read a krama shop-door note and ask if the owner is in.", minutes: 5 }
          - { id: j3.u03.l05, kind: practice, title: "Telpon saka Pak Harjo", can_do: "Understand a krama voice message and answer it.", minutes: 5 }
          - { id: j3.u03.l06, kind: practice, title: "Ngoko dadi krama", can_do: "Pass on a friend's ngoko message in krama.", minutes: 5 }
          - { id: j3.u03.l07, kind: review, title: "Ulangan J3.3", can_do: "Translate ngoko lines into krama.", minutes: 7 }

      - id: j3.u04
        title: { target: "Pitakon krama", en: "Asking politely", ar: "السؤال بأدب" }
        stop: Mangkunegaran
        can_do:
          - Ask menapa / sinten / pundi / pinten / kados pundi
        grammar: [jv.krama.questions]
        vocabulary: ["question words across levels"]
        culture: { souvenir: Pura Mangkunegaran, note: "Asking an elder a question in krama, with a slight bow and the thumb pointing, is part of the grammar." }
        lessons:
          - { id: j3.u04.l01, kind: learn, title: "Sinten lan pundi", can_do: "Ask who and where.", grammar: [jv.krama.questions], minutes: 7 }
          - { id: j3.u04.l02, kind: learn, title: "Pinten, kados pundi", can_do: "Ask how much and how.", grammar: [jv.krama.questions], minutes: 7 }
          - { id: j3.u04.l03, kind: practice, title: "Takon dalan kanthi alus", can_do: "Ask an elder for directions.", minutes: 7 }
          - { id: j3.u04.l04, kind: practice, title: "Papan ing Pura", can_do: "Read a krama palace sign and ask the way.", minutes: 5 }
          - { id: j3.u04.l05, kind: practice, title: "Kenalan karo Pak Wiryo", can_do: "Follow a guide's krama self-introduction.", minutes: 5 }
          - { id: j3.u04.l06, kind: practice, title: "Chat karo Pak Wiryo", can_do: "Read a krama chat for the time and the way.", minutes: 5 }
          - { id: j3.u04.l07, kind: review, title: "Ulangan J3.4", can_do: "Run a polite Q&A.", minutes: 7 }

      - id: j3.u05
        title: { target: "Pasar Klewer", en: "Shopping in krama", ar: "التسوّق بالكراما" }
        stop: Pasar Klewer
        can_do:
          - Count in krama (setunggal, kalih, tiga, sekawan, gangsal, …)
          - Bargain politely with an older seller
        grammar: [jv.krama.numbers]
        vocabulary: ["krama numbers", "cloth and batik words"]
        culture: { souvenir: Batik from Klewer, note: "Pasar Klewer is Java's great batik market; older sellers appreciate krama, even a little." }
        lessons:
          - { id: j3.u05.l01, kind: learn, title: "Setunggal, kalih, tiga", can_do: "Count from one to nine in krama and buy politely.", grammar: [jv.krama.numbers], minutes: 7 }
          - { id: j3.u05.l02, kind: learn, title: "Sedasa, kalih dasa", can_do: "Say tens and twenty-five in krama.", grammar: [jv.krama.numbers], minutes: 5 }
          - { id: j3.u05.l03, kind: learn, title: "Regi pinten?", can_do: "Ask prices politely.", grammar: [jv.krama.numbers], minutes: 7 }
          - { id: j3.u05.l04, kind: practice, title: "Tumbas batik", can_do: "Buy batik in krama.", minutes: 7 }
          - { id: j3.u05.l05, kind: practice, title: "Daftar regi", can_do: "Read a krama price sign and buy politely.", minutes: 5 }
          - { id: j3.u05.l06, kind: practice, title: "Tumbasan Mohamed", can_do: "Follow a krama bill: total and change.", minutes: 5 }
          - { id: j3.u05.l07, kind: review, title: "Ulangan J3.5", can_do: "Complete a krama purchase.", minutes: 7 }

      - id: j3.u06
        title: { target: "Laweyan", en: "Krama affixes", ar: "لواحق الكراما" }
        stop: Laweyan
        can_do:
          - Recognise krama affixes (dipun-, -ipun, -aken)
        grammar: [jv.krama.affixes]
        vocabulary: ["batik-making verbs"]
        culture: { souvenir: Laweyan merchants' houses, note: "Laweyan's batik merchants founded Sarekat Dagang Islam (1905; some historians say 1911), an early Muslim traders' movement." }
        lessons:
          - { id: j3.u06.l01, kind: learn, title: "Dipun-, -ipun", can_do: "Read krama passives and possessives.", grammar: [jv.krama.affixes], minutes: 7 }
          - { id: j3.u06.l02, kind: learn, title: "-aken", can_do: "Use krama -aken.", grammar: [jv.krama.affixes], minutes: 7 }
          - { id: j3.u06.l03, kind: practice, title: "Damel batik", can_do: "Describe batik-making in krama.", minutes: 7 }
          - { id: j3.u06.l04, kind: practice, title: "Papan ing griya saudagar", can_do: "Read a museum sign with dipun- and -ipun.", minutes: 5 }
          - { id: j3.u06.l05, kind: practice, title: "Sinau damel batik", can_do: "Read a batik-class poster and sign up.", minutes: 5 }
          - { id: j3.u06.l06, kind: practice, title: "Pesen swara saka Laweyan", can_do: "Understand a krama voice message with krama affixes.", minutes: 5 }
          - { id: j3.u06.l07, kind: review, title: "Ulangan J3.6", can_do: "Convert a ngoko paragraph to krama.", minutes: 7 }
