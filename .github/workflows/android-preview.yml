name: Android preview APK

# Builds an installable arm64 APK for testing on a phone without the Mac.
# Signed with a throwaway *preview* key generated in CI (never committed, never
# the release key in ~/.kabar). The key is kept in the Actions cache so
# updates install over each other; if the cache expires (7 days unused) a new
# key is made and the next preview needs an uninstall first.
#
# Pull-request runs never touch that key: they sign with a one-off key (enough
# to prove the APK signs) and get a read-only token. Only pushes to main and
# manual runs restore the key, and only the separate `publish` job can write.
#
# Self-updates (docs/RELEASE.md §5): the APK is built for the `preview`
# update channel with the public half of a second CI key (Ed25519, also kept
# in the Actions cache), and the release carries a signed update.json, so an
# installed preview updates itself after every merge to main.

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - .github/workflows/android-preview.yml
      - android/**
      - crates/app/AndroidManifest.xml
      - crates/app/Dioxus.toml
      - scripts/android-check-apk.sh
      - scripts/android-release-apk.sh
  workflow_dispatch:

# A pull request's newer push cancels its older run. On main, runs queue
# instead: cancelling one mid-publish used to leave the preview release (and
# the app's update feed) missing until the next merge (#222). Only one run
# waits at a time, so a burst of merges still builds just the newest.
concurrency:
  group: android-preview-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  apk:
    name: Build preview APK
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    env:
      # A PR's own copy of this workflow runs here, so it must not reach the key.
      KEEP_KEY: ${{ github.event_name != 'pull_request' }}
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
      - uses: Swatinem/rust-cache@v2
        with:
          key: android-preview
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"
      - uses: cargo-bins/cargo-binstall@8a2045612414e945291083f820cd50b4d8fc2218 # v1.26.0
      - name: Install dx 0.7.10
        run: cargo binstall -y --force dioxus-cli@0.7.10

      # The update key comes first: its public half is built into the app.
      - name: Restore preview update key
        if: env.KEEP_KEY == 'true'
        id: update-key
        uses: actions/cache/restore@v4
        with:
          path: ~/.kabar-preview-update
          key: android-preview-update-key-v1
      - name: Create preview update key
        if: steps.update-key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.kabar-preview-update
          cargo run -q -p kabar-tools -- update keygen --public-out ~/.kabar-preview-update/key.pub \
            > ~/.kabar-preview-update/secret
          chmod 600 ~/.kabar-preview-update/secret
      - name: Save preview update key
        if: env.KEEP_KEY == 'true' && steps.update-key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.kabar-preview-update
          key: android-preview-update-key-v1
      - name: Preview build identity
        run: |
          {
            echo "KABAR_UPDATE_CHANNEL=preview"
            echo "KABAR_UPDATE_KEY=$(grep -v '^#' ~/.kabar-preview-update/key.pub | head -1)"
            echo "KABAR_BUILD=${{ github.run_number }}"
            echo "KABAR_COMMIT=${GITHUB_SHA::7}"
          } >> "$GITHUB_ENV"

      - name: Android environment
        run: |
          echo "ANDROID_HOME=$ANDROID_SDK_ROOT" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV"
          BT="$(ls -d "$ANDROID_SDK_ROOT"/build-tools/* | sort -V | tail -1)"
          echo "$BT" >> "$GITHUB_PATH"

      - name: Build APK
        working-directory: crates/app
        run: |
          dx bundle --platform android --release --package-types apk \
            --target aarch64-linux-android --no-default-features --features mobile \
            --out-dir ../../dist/android/raw

      - name: Rebuild as a release APK (not debuggable, R8, versionCode)
        run: |
          APK="$(scripts/android-release-apk.sh)"
          mkdir -p dist/android/release && cp "$APK" dist/android/release/kabar-unsigned.apk

      - name: Check the APK (Kotlin glue, launcher icon, manifest, not debuggable)
        run: scripts/android-check-apk.sh dist/android/release/kabar-unsigned.apk

      - name: Restore preview signing key
        if: env.KEEP_KEY == 'true'
        id: key
        uses: actions/cache/restore@v4
        with:
          path: ~/.kabar-preview
          key: android-preview-key-v1
      - name: Create preview signing key
        if: steps.key.outputs.cache-hit != 'true'
        run: |
          mkdir -p ~/.kabar-preview
          openssl rand -hex 24 > ~/.kabar-preview/pass
          keytool -genkeypair -keystore ~/.kabar-preview/preview.jks -alias preview \
            -keyalg RSA -keysize 4096 -validity 3650 -dname "CN=Kabar preview" \
            -storepass "$(cat ~/.kabar-preview/pass)" -keypass "$(cat ~/.kabar-preview/pass)"
      - name: Save preview signing key
        if: env.KEEP_KEY == 'true' && steps.key.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: ~/.kabar-preview
          key: android-preview-key-v1

      - name: Sign
        run: |
          IN=dist/android/release/kabar-unsigned.apk
          PASS="$(cat ~/.kabar-preview/pass)"
          zipalign -f -p 4 "$IN" /tmp/aligned.apk
          apksigner sign --ks ~/.kabar-preview/preview.jks --ks-key-alias preview \
            --ks-pass "pass:$PASS" --key-pass "pass:$PASS" --out dist/android/kabar-preview.apk /tmp/aligned.apk
          apksigner verify --print-certs dist/android/kabar-preview.apk
          # The S24 Ultra and Tab S11 are arm64; dx defaults to the emulator ABI.
          unzip -l dist/android/kabar-preview.apk | grep -q 'lib/arm64-v8a/' \
            || { echo "APK has no arm64-v8a library"; unzip -l dist/android/kabar-preview.apk; exit 1; }
          ls -lh dist/android/kabar-preview.apk

      - name: Signed update feed (update.json + signature)
        env:
          COMMIT_SUBJECT: ${{ github.event.head_commit.message || github.event.pull_request.title || 'Preview build' }}
        run: |
          VERSION="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          # What's new = the commit's subject; for a merge commit, the pull
          # request's title (its first line after the subject). It shows in
          # the app's banner and its "new version" notification.
          NOTES="$(printf '%s\n' "$COMMIT_SUBJECT" | head -1)"
          case "$NOTES" in
            "Merge pull request"*|"Merge branch"*)
              TITLE="$(printf '%s\n' "$COMMIT_SUBJECT" | sed -n '2,$p' | grep -m1 -v '^[[:space:]]*$' || true)"
              [ -n "$TITLE" ] && NOTES="$TITLE" ;;
          esac
          NOTES="$(printf '%s' "$NOTES" | cut -c1-200)"
          cargo run -q -p kabar-tools -- update manifest --channel preview --version "$VERSION" \
            --build "$KABAR_BUILD" --commit "$KABAR_COMMIT" --notes-en "$NOTES" \
            --asset android-arm64=dist/android/kabar-preview.apk --out dist/update
          KABAR_UPDATE_SECRET="$(cat ~/.kabar-preview-update/secret)" \
            cargo run -q -p kabar-tools -- update sign dist/update --public-key ~/.kabar-preview-update/key.pub
          cargo run -q -p kabar-tools -- update verify dist/update --public-key ~/.kabar-preview-update/key.pub
          ls -l dist/update

      - uses: actions/upload-artifact@v4
        with:
          name: kabar-preview-apk
          path: |
            dist/android/kabar-preview.apk
            dist/update/
          retention-days: 14

  publish:
    name: Publish the preview release
    needs: apk
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: kabar-preview-apk
          path: dist
      - name: Publish as the "preview" release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          # Publish whenever this commit is newer than the one the release
          # carries, so a run that finishes after a newer one never rolls the
          # release back, and a busy stretch of merges still publishes.
          published="$(gh api "repos/$GH_REPO/git/refs/tags/preview" --jq .object.sha 2>/dev/null || true)"
          if [ -n "$published" ]; then
            status="$(gh api "repos/$GH_REPO/compare/$published...$GITHUB_SHA" --jq .status)"
            if [ "$status" != "ahead" ]; then
              echo "The release already carries ${published::7} ($status); nothing to publish."
              exit 0
            fi
          fi
          NOTES="Preview build of ${GITHUB_SHA::7}, signed with a CI preview key (not the release key). Install: download kabar-preview.apk on the phone and allow installs from your browser."
          # The release stays in place and only its tag and files change, so
          # the download link and the update feed never 404 (#222).
          if gh release view preview >/dev/null 2>&1; then
            gh api -X PATCH "repos/$GH_REPO/git/refs/tags/preview" -f sha="$GITHUB_SHA" -F force=true >/dev/null
            gh release edit preview --notes "$NOTES"
          else
            gh release create preview --prerelease --target "$GITHUB_SHA" \
              --title "Kabar preview (Android)" --notes "$NOTES"
          fi
          # The APK under its usual name for people, plus the signed update
          # feed (update.json, its signature, the same APK) for the app. The
          # builds go up before update.json and its signature, so the feed
          # never names a file that isn't there yet.
          builds=()
          for f in dist/update/*; do
            case "$(basename "$f")" in update.json|update.json.sig) ;; *) builds+=("$f") ;; esac
          done
          gh release upload preview dist/android/kabar-preview.apk "${builds[@]}" --clobber
          gh release upload preview dist/update/update.json.sig dist/update/update.json --clobber
          # Feed builds are named by build number (#295), so nothing a live
          # update.json names is ever overwritten. Keep this build and the one
          # before it (a device may have just read the previous feed) and
          # drop older ones so the release doesn't grow without end. Feed
          # files from before #295 (no build number) count as build 0.
          gh api "repos/$GH_REPO/releases/tags/preview" \
            --jq '.assets[] | select(.name | test("^kabar-[0-9]")) | "\((.name | capture("-b(?<b>[0-9]+)-").b) // "0") \(.id)"' \
            | sort -rn | tail -n +3 | while read -r _ id; do
                gh api -X DELETE "repos/$GH_REPO/releases/assets/$id"
              done
