name: Android WebView renderer regression

# Mohamed, 2026-11-04: only when the Kotlin side changes (it tests android/
# alone), plus by hand. It used to run on every PR and every merge.
on:
  push:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android-webview-regression.yml
  pull_request:
    branches: [main]
    paths:
      - android/**
      - .github/workflows/android-webview-regression.yml
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: webview-renderer-${{ github.ref }}
  cancel-in-progress: true

jobs:
  webview-renderer:
    name: Renderer-loss Kotlin/JVM tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.10.2'
      - name: Run production-guard regression tests (no emulator)
        run: gradle --no-daemon -p android/renderer-tests test
