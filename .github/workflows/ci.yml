name: CI

on:
  push:
    branches: [main]
  pull_request:

# A new push to a PR cancels that PR's older run. On main every commit runs
# to the end, so each merged PR gets its own verdict instead of a
# "cancelled" when the next merge lands a minute later.
concurrency:
  group: ci-${{ github.ref }}-${{ github.event_name == 'pull_request' && 'pr' || github.sha }}
  cancel-in-progress: true

# Every job here only reads the repo, on pull requests and on main alike.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    name: fmt, clippy, tests
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
        with:
          # PR merge commit and its first parent; the base may move meanwhile.
          fetch-depth: 2
      - name: No build output or huge files in git
        run: scripts/check-tracked-files.sh
      - name: System libraries for the desktop WebView
        run: sudo apt-get update && sudo apt-get install -y libwebkit2gtk-4.1-dev libgtk-3-dev libxdo-dev libsoup-3.0-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Android Back navigation controller regression tests
        run: node --test crates/app/tests/system-back.test.cjs
      - name: Production Android Back and Settings keyboard regression tests
        run: node --test crates/app/tests/ui-runtime.test.mjs
      - name: Content checks (lessons, tests, glosses, offline pack manifests)
        run: cargo run -p kabar-tools -- validate
      # Advisory only: parallel PRs would race each other on these numbers.
      # The daily README routine commits the refreshed block.
      - name: README numbers (advisory, refreshed daily)
        run: |
          if ! cargo run -q -p kabar-tools -- readme --check; then
            echo "::warning file=README.md::README numbers are stale; the daily refresh or just readme updates them"
          fi
      # Advisory (#138): share of words in each Sinetron episode, Radio script
      # and lesson dialogue that the curriculum hasn't taught by that point.
      # Dialogues ratchet against content/freq/dialogue-over.tsv (#371).
      - name: Reading coverage (advisory)
        run: |
          { echo '```'; cargo run -q -p kabar-tools -- coverage --warn; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # Advisory (#140): closed exercises that don't say why the answer is right.
      - name: Answer explanations (advisory)
        run: |
          { echo '```'; cargo run -q -p kabar-tools -- explains --warn; echo '```'; } | tee -a "$GITHUB_STEP_SUMMARY"
      # Advisory until the Jogja/Madiun relocation lands: Javanese is Jogja + Madiun only.
      - name: Javanese dialect (advisory)
        run: cargo run -q -p kabar-tools -- dialect --warn
      # Every pull request says what the learner will notice in
      # changes/<topic>.yaml (docs/RELEASE.md §5, "What's new"): new lines in
      # a new or existing file, or a new file holding [] when there is
      # nothing to tell. Without one the update showed the PR's English
      # title under the wrong kind. The files must parse. A PR that only
      # touches README.md (the daily refresh) has nothing to tell and skips
      # the file check.
      - name: What's new file
        if: github.event_name == 'pull_request'
        run: |
          if [ "$(git diff --name-only HEAD^1 HEAD)" = "README.md" ]; then
            echo "README.md only: no changes/<topic>.yaml needed."
            exit 0
          fi
          files="$(git diff --name-only --diff-filter=AM HEAD^1 HEAD -- 'changes/*.yaml')"
          if ! grep -qE '^changes/[^/]+\.yaml$' <<<"$files"; then
            echo "::error::No changes/<topic>.yaml in this pull request. Add one line per change the learner can see (kind new/improved/fixed, ar_eg in Egyptian Arabic, en), or a file holding [] when there is nothing to tell. See docs/RELEASE.md §5."
            exit 1
          fi
          cargo run -q -p kabar-tools -- update changes >/dev/null

  android:
    name: Android arm64 compiles
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-linux-android
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - name: Clippy for aarch64-linux-android with the runner's NDK
        run: |
          BIN="$ANDROID_NDK_LATEST_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin"
          export CC_aarch64_linux_android="$BIN/aarch64-linux-android28-clang"
          export AR_aarch64_linux_android="$BIN/llvm-ar"
          export CARGO_TARGET_AARCH64_LINUX_ANDROID_LINKER="$BIN/aarch64-linux-android28-clang"
          cargo clippy -p kabar-app --target aarch64-linux-android --no-default-features --features mobile -- -D warnings

  wasm:
    name: core and protocol build for wasm32
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo clippy -p kabar-core -p kabar-protocol --target wasm32-unknown-unknown -- -D warnings

  cloud:
    name: Kabar Cloud (wasm build + local end-to-end)
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
          components: clippy
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - name: Clippy for the Worker (wasm32)
        run: cargo clippy -p kabar-server --target wasm32-unknown-unknown -- -D warnings
      - name: Tools
        run: |
          cargo install worker-build --version ^0.8 --locked
          npm install -g wrangler@4
      - name: End-to-end on local workerd (fake Google, two devices)
        run: node crates/server/tests/e2e.mjs
