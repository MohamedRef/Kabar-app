[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol", "crates/app", "crates/server", "crates/content", "crates/tools"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Private"
publish = false

[workspace.dependencies]
kabar-core = { path = "crates/core" }
kabar-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
schemars = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# RSA key generation in kabar-server tests is slow without optimizations.
[profile.dev.package.num-bigint-dig]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# dx uses these for Android / desktop bundles.
[profile.android-dev]
inherits = "dev"

[profile.server-dev]
inherits = "dev"

[profile.wasm-dev]
inherits = "dev"
opt-level = 1
