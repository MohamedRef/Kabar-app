[workspace]
resolver = "3"
members = ["crates/core", "crates/protocol", "crates/app", "crates/server", "crates/content", "crates/tools"]

[workspace.package]
version = "2026.11.0"
edition = "2024"
rust-version = "1.90"
license = "LicenseRef-Private"
publish = false

[workspace.dependencies]
study-lesson-scheduler = { git = "https://github.com/MohamedRef/study-libs", rev = "e242f4ebcd64c1a8fe1806118c463c696de61e45" }
study-review = { git = "https://github.com/MohamedRef/study-libs", rev = "678871d7e7da3ba0042c05909d2eee9f0cad4109" }
study-ui = { git = "https://github.com/MohamedRef/study-libs", rev = "4c5d47562c2da64ecc01fddaaaf0fd66214eba00" }
study-update-ui = { git = "https://github.com/MohamedRef/study-libs", rev = "678871d7e7da3ba0042c05909d2eee9f0cad4109" }
study-platform = { git = "https://github.com/MohamedRef/study-libs", rev = "678871d7e7da3ba0042c05909d2eee9f0cad4109" }
study-shell = { git = "https://github.com/MohamedRef/study-libs", rev = "4c5d47562c2da64ecc01fddaaaf0fd66214eba00" }
study-sql = { git = "https://github.com/MohamedRef/study-libs", rev = "678871d7e7da3ba0042c05909d2eee9f0cad4109" }
study-storage = { git = "https://github.com/MohamedRef/study-libs", rev = "678871d7e7da3ba0042c05909d2eee9f0cad4109" }
study-testkit = { git = "https://github.com/MohamedRef/study-libs", rev = "216396bd777a280d591f7d0e45407758091fe8e6" }
study-sync = { git = "https://github.com/MohamedRef/study-libs", rev = "678871d7e7da3ba0042c05909d2eee9f0cad4109" }
study-update-verify = { git = "https://github.com/MohamedRef/study-libs", rev = "678871d7e7da3ba0042c05909d2eee9f0cad4109" }
kabar-core = { path = "crates/core" }
kabar-protocol = { path = "crates/protocol" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_ignored = "0.1"
thiserror = "2"
schemars = "1"

[workspace.lints.rust]
unsafe_code = "deny"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }

# RSA key generation in kabar-server tests is slow without optimizations.
# Argon2id (password sign-in) is unusably slow unoptimised: a debug build
# would take seconds per sign-in.
[profile.dev.package.argon2]
opt-level = 3

[profile.dev.package.blake2]
opt-level = 3

[profile.dev.package.num-bigint-dig]
opt-level = 3

# build.rs packs ~25 MB of content; unoptimized DEFLATE would take minutes.
[profile.dev.package.miniz_oxide]
opt-level = 3

[profile.release]
lto = "thin"
codegen-units = 1
strip = true

# dx uses these for Android / desktop bundles.
[profile.android-dev]
inherits = "dev"

[profile.server-dev]
inherits = "dev"

# The web app (scripts/web/build.sh): smallest code, so the wasm stays under
# the static host's 25 MiB per-file limit (docs/WEB.md). `strip` stays off
# for wasm-bindgen's custom sections.
[profile.web-release]
inherits = "release"
opt-level = "z"
lto = "fat"
strip = false

[profile.wasm-dev]
inherits = "dev"
opt-level = 1

# Dioxus's Android screen-update socket, patched so the screen keeps updating
# after Android destroys it (phone locked, app frozen). See vendor/README.md.
[patch.crates-io]
dioxus-desktop = { git = "https://github.com/MohamedRef/study-libs", rev = "2190779e1c0ce2e10e54178b1dceb57c02bedc38" }
dioxus-interpreter-js = { git = "https://github.com/MohamedRef/study-libs", rev = "2190779e1c0ce2e10e54178b1dceb57c02bedc38" }
